<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Profile — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icon-192.png"  />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-achievements.js?v=4"></script>
  <script src="/shared-header.js?v=2026060904"></script>
  <style>
    /* Light theme — coherent with community / hub (override style.css's dark default). */
    :root {
      --bg: #faf7f3; --surface: #ffffff; --surface-2: #f1f1f4; --border: #e3e1e6;
      --text: #1a1410; --text-muted: #8a7868; --accent: #f5c518; --radius: 10px;
    }
    body { background: var(--bg); }

    /* ══════════════════════════════════════════════════
       SHARED
    ══════════════════════════════════════════════════ */
    #view-main, #edit-main { max-width: 600px; margin: 0 auto; padding: 0 16px 110px; }

    /* ══════════════════════════════════════════════════
       PUBLIC VIEW MODE
    ══════════════════════════════════════════════════ */

    /* ── Hero card ── */
    .pv-hero {
      background: var(--surface, #111); border: 1px solid var(--border, #222);
      border-radius: 16px; padding: 28px 24px 22px;
      display: flex; gap: 20px; align-items: flex-start;
      margin-bottom: 16px;
    }
    .pv-avatar {
      width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 800; overflow: hidden;
    }
    .pv-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pv-info { flex: 1; min-width: 0; }
    .pv-name { font-size: 1.3rem; font-weight: 800; color: var(--text, #e5e5e5); margin-bottom: 4px; }
    .pv-headline { font-size: 0.88rem; color: var(--text-muted, #777); margin-bottom: 10px; line-height: 1.4; }
    .pv-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .pv-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 99px; padding: 4px 10px;
      font-size: 0.75rem; color: var(--text-muted);
    }
    .pv-badge {
      display: inline-flex; align-items: center;
      background: rgba(245,197,24,.13); border: 1px solid rgba(245,197,24,.25);
      color: var(--accent, #f5c518);
      padding: 2px 10px; border-radius: 99px;
      font-size: 0.72rem; font-weight: 700; white-space: nowrap;
    }
    .pv-edit-btn {
      background: none; border: 1.5px solid var(--border, #333); border-radius: 20px;
      color: var(--text-muted, #888); font-size: 0.8rem; font-weight: 600;
      padding: 7px 18px; cursor: pointer; font-family: inherit;
      transition: border-color .15s, color .15s; white-space: nowrap; text-decoration: none;
      display: inline-flex; align-items: center;
    }
    .pv-edit-btn:hover { border-color: var(--accent, #f5c518); color: var(--accent, #f5c518); }

    /* ── Bio card ── */
    .pv-card {
      background: var(--surface, #111); border: 1px solid var(--border, #222);
      border-radius: 14px; padding: 20px; margin-bottom: 14px;
    }
    .pv-card-title {
      font-size: 0.7rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text-muted, #666); margin-bottom: 12px;
    }
    .pv-bio { font-size: 0.88rem; color: #bbb; line-height: 1.65; white-space: pre-wrap; }

    /* ── Social links ── */
    .pv-links { display: flex; flex-direction: column; gap: 8px; }
    .pv-link {
      display: flex; align-items: center; gap: 10px;
      color: #aaa; text-decoration: none; font-size: 0.85rem;
      padding: 6px 4px; border-radius: 8px; transition: color .15s;
    }
    .pv-link:hover { color: var(--accent, #f5c518); }
    .pv-link-icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: #1a1a1a; display: flex; align-items: center;
      justify-content: center; font-size: 0.9rem; flex-shrink: 0;
    }

    /* ── Activity / posts ── */
    .pv-post {
      background: var(--surface, #111); border: 1px solid var(--border, #222);
      border-radius: 12px; padding: 16px; margin-bottom: 10px;
      cursor: pointer; transition: border-color .15s;
    }
    .pv-post:hover { border-color: #444; }
    .pv-post-type {
      display: inline-flex; align-items: center;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted, #666);
      background: #1a1a1a; border-radius: 6px; padding: 2px 8px; margin-bottom: 8px;
    }
    .pv-post-title { font-size: 0.92rem; font-weight: 700; color: #e5e5e5; margin-bottom: 4px; }
    .pv-post-body  { font-size: 0.82rem; color: #666; line-height: 1.5;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .pv-post-meta  { font-size: 0.72rem; color: #444; margin-top: 8px; }

    .pv-empty { text-align: center; padding: 40px 20px; color: #444; font-size: 0.85rem; }

    /* ══════════════════════════════════════════════════
       CROP MODAL
    ══════════════════════════════════════════════════ */
    #crop-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9000;
      display: none; align-items: center; justify-content: center; padding: 16px;
      -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    }
    #crop-modal.open { display: flex; }
    .crop-sheet {
      background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
      padding: 24px 22px; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      box-shadow: 0 24px 60px -16px rgba(0,0,0,.4);
      animation: cropIn .22s cubic-bezier(.22,.61,.36,1);
    }
    @keyframes cropIn { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .crop-sheet { animation: none; } }
    .crop-sheet h3 { font-size: 1.05rem; font-weight: 800; color: var(--text); margin: 0; letter-spacing: -.01em; }
    .crop-hint { font-size: 0.76rem; color: var(--text-muted); margin-top: -10px; text-align: center; }
    #crop-canvas {
      border-radius: 14px; cursor: grab; touch-action: none;
      display: block; width: 300px; height: 300px; max-width: 100%;
      background: var(--surface-2);
    }
    #crop-canvas:active { cursor: grabbing; }
    .crop-zoom-row { width: 100%; display: flex; align-items: center; gap: 11px; }
    .crop-zoom-row svg { color: var(--text-muted); flex-shrink: 0; }
    #crop-zoom-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 5px; background: var(--border); border-radius: 3px; outline: none; cursor: pointer;
    }
    #crop-zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(60,40,20,.3);
    }
    #crop-zoom-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid #fff;
      box-shadow: 0 1px 4px rgba(60,40,20,.3);
    }
    .crop-actions { display: flex; gap: 10px; width: 100%; }
    .crop-cancel-btn {
      flex: 1; padding: 11px; background: var(--surface-2);
      border: 1px solid var(--border); border-radius: 12px;
      color: var(--text-muted); font-size: 0.9rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: border-color .15s, color .15s;
    }
    .crop-cancel-btn:hover { border-color: var(--text-muted); color: var(--text); }
    .crop-apply-btn {
      flex: 2; padding: 11px;
      background: linear-gradient(180deg, #f7d24a, #f5c518); color: #1a1410;
      border: none; border-radius: 12px;
      font-size: 0.9rem; font-weight: 800;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 7px 16px -7px rgba(245,197,24,.7);
      transition: filter .15s, box-shadow .15s, opacity .15s;
    }
    .crop-apply-btn:hover { filter: brightness(1.04); box-shadow: 0 9px 20px -7px rgba(245,197,24,.8); }
    .crop-apply-btn:disabled { opacity: .5; cursor: default; box-shadow: none; filter: none; }

    /* ══════════════════════════════════════════════════
       EDIT MODE  (mirrors old profile.html)
    ══════════════════════════════════════════════════ */
    /* Header */
    .profile-edit-head { display: flex; align-items: center; gap: 12px; padding: 26px 0 18px; }
    .profile-edit-title { font-size: 1.35rem; font-weight: 800; color: var(--text); letter-spacing: -.01em; }
    /* Match the community / content-page back buttons (.cf-detail-back). */
    .profile-back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text); font-size: 0.86rem; font-weight: 600;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 8px 15px 8px 11px; cursor: pointer;
      box-shadow: 0 1px 2px rgba(60,40,20,.05);
      transition: border-color .15s, color .15s, box-shadow .15s, transform .12s ease;
      font-family: inherit;
    }
    .profile-back-btn svg { transition: transform .15s ease; }
    .profile-back-btn:hover { border-color: rgba(245,197,24,.55); box-shadow: 0 4px 14px rgba(60,40,20,.09); }
    .profile-back-btn:hover svg { transform: translateX(-2px); }
    .profile-back-btn:active { transform: scale(.96); }

    /* Soft entrance for the cards (coherent with the modal / billing animations) */
    @keyframes profileCardIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: no-preference) {
      .profile-photo-card { animation: profileCardIn .32s cubic-bezier(.22,.61,.36,1) .03s backwards; }
      .profile-section   { animation: profileCardIn .32s cubic-bezier(.22,.61,.36,1) .1s backwards; }
    }

    /* Photo card — centered hero avatar with a camera badge (app-native) */
    .profile-photo-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 24px 20px 18px; margin-bottom: 14px;
      display: flex; flex-direction: column; align-items: center; gap: 11px;
      box-shadow: 0 1px 2px rgba(60,40,20,.04);
    }
    .profile-avatar-wrap { position: relative; width: 96px; height: 96px; }
    .profile-avatar-lg {
      width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; overflow: hidden;
      box-shadow: 0 0 0 4px var(--surface), 0 8px 20px -8px rgba(60,40,20,.35);
    }
    .profile-avatar-lg img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .profile-cam-badge {
      position: absolute; right: -3px; bottom: -3px;
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(180deg, #f7d24a, #f5c518); color: #1a1410;
      border: 3px solid var(--surface); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 8px -3px rgba(245,197,24,.75);
      transition: filter .15s, transform .12s ease;
    }
    .profile-cam-badge:hover { filter: brightness(1.05); }
    .profile-cam-badge:active { transform: scale(.92); }
    .profile-cam-badge svg { width: 15px; height: 15px; }
    .profile-photo-actions { display: flex; align-items: center; gap: 9px; }
    .profile-photo-link {
      background: none; border: none; color: var(--text-muted);
      font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: inherit;
      padding: 2px; transition: color .15s;
    }
    .profile-photo-link:hover { color: var(--text); }
    .profile-photo-link.remove:hover { color: #ef4444; }
    .profile-photo-sep { color: var(--border); font-size: 0.8rem; }
    .profile-upload-status { font-size: 0.75rem; color: var(--text-muted); min-height: 0; }

    /* Form sections */
    .profile-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 20px; margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(60,40,20,.04);
    }
    .profile-section-title {
      font-size: 0.66rem; font-weight: 800; letter-spacing: .08em;
      text-transform: uppercase; color: #b0a294; margin-bottom: 16px;
    }
    .profile-field { margin-bottom: 15px; }
    .profile-field:last-child { margin-bottom: 0; }
    .profile-label { font-size: 0.8rem; font-weight: 600; color: var(--text); margin-bottom: 6px; display: block; }
    .profile-label span { color: #ef4444; margin-left: 2px; }
    .profile-input {
      width: 100%; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 10px;
      color: var(--text); font-size: 0.92rem; padding: 11px 13px;
      font-family: inherit; box-sizing: border-box;
      transition: border-color .15s, box-shadow .15s;
    }
    .profile-input::placeholder { color: var(--text-muted); }
    .profile-input:hover:not(:focus) { border-color: #d6d1c8; }
    .profile-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,197,24,.16); }
    /* No drag-stretch handle — the bio grows with its content instead. */
    textarea.profile-input { resize: none; overflow: hidden; min-height: 82px; line-height: 1.55; }
    .profile-input-prefix {
      display: flex; align-items: center;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; overflow: hidden;
      transition: border-color .15s, box-shadow .15s;
    }
    .profile-input-prefix:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,197,24,.16); }
    .profile-input-prefix span { padding: 11px 6px 11px 13px; font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .profile-input-prefix input { flex: 1; background: none; border: none; outline: none; color: var(--text); font-size: 0.92rem; padding: 11px 13px 11px 0; font-family: inherit; min-width: 0; }

    /* ── Location autocomplete dropdown ── */
    .location-dropdown {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 500;
      background: var(--surface); border: 1px solid var(--border); border-top: none;
      border-radius: 0 0 10px 10px; overflow: hidden;
      box-shadow: 0 10px 28px -10px rgba(60,40,20,.3);
    }
    .location-option {
      padding: 10px 13px; font-size: 0.85rem; color: var(--text); cursor: pointer;
      border-bottom: 1px solid var(--border); transition: background .12s;
    }
    .location-option:last-child { border-bottom: none; }
    .location-option:hover, .location-option.focused { background: var(--surface-2); }

    .profile-save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px max(12px, env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: center;
      gap: 12px; z-index: 100;
      box-shadow: 0 -6px 18px -10px rgba(60,40,20,.16);
    }
    @media (max-width: 768px) {
      .profile-save-bar { bottom: calc(56px + env(safe-area-inset-bottom, 0px)); padding-bottom: 12px; }
      .profile-save-btn { max-width: none; flex: 1 1 auto; }
    }
    .profile-save-btn {
      flex: 0 1 260px; padding: 12px 24px;
      background: linear-gradient(180deg, #f7d24a, #f5c518); color: #1a1410;
      border: none; border-radius: 12px;
      font-size: 0.92rem; font-weight: 800;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 7px 16px -7px rgba(245,197,24,.7);
      transition: filter .15s, box-shadow .15s, opacity .15s;
    }
    .profile-save-btn:hover { filter: brightness(1.04); box-shadow: 0 9px 20px -7px rgba(245,197,24,.8); }
    .profile-save-btn:disabled { opacity: .55; cursor: default; box-shadow: none; filter: none; }
    .profile-save-status { font-size: 0.82rem; color: #16a34a; font-weight: 600; }
  </style>
</head>
<body>

<header id="app-header" style="display:none"></header>
<input type="file" id="avatar-file-input" accept="image/*" style="display:none" onchange="openCropModal(this.files[0]); this.value=''">

<!-- ══════════ PUBLIC VIEW MODE ══════════ -->
<main id="view-main" style="display:none">

  <div class="pv-hero" id="pv-hero">
    <div class="pv-avatar" id="pv-avatar"></div>
    <div class="pv-info">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
        <div class="pv-name" id="pv-name"></div>
        <span class="pv-badge" id="pv-badge" style="display:none"></span>
      </div>
      <div class="pv-headline" id="pv-headline" style="display:none"></div>
      <div class="pv-chips"   id="pv-chips"></div>
    </div>
    <a class="pv-edit-btn" href="/profile.html" id="pv-edit-btn" style="display:none">Edit Profile</a>
  </div>

  <!-- Admin: badge editor -->
  <div id="pv-badge-admin" style="display:none">
    <div class="pv-card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:0.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Badge</span>
      <input id="pv-badge-input" type="text" placeholder="e.g. ⭐ Founding Member"
        style="flex:1;min-width:160px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:8px;
               color:var(--text);padding:7px 11px;font-size:0.85rem;font-family:inherit;outline:none"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border)'" />
      <button onclick="saveBadge()" class="btn btn-sm">Save</button>
      <button onclick="clearBadge()" class="btn btn-ghost btn-sm">Clear</button>
    </div>
  </div>

  <div class="pv-card" id="pv-bio-card" style="display:none">
    <div class="pv-card-title">About</div>
    <div class="pv-bio" id="pv-bio"></div>
  </div>

  <div class="pv-card" id="pv-links-card" style="display:none">
    <div class="pv-card-title">Links</div>
    <div class="pv-links" id="pv-links"></div>
  </div>

  <div id="pv-posts-section">
    <div class="pv-card-title" style="padding:0 4px;margin-bottom:10px">Recent Posts</div>
    <div id="pv-posts"></div>
  </div>

</main>

<!-- ══════════ EDIT MODE ══════════ -->
<main id="edit-main" style="display:none">
  <div class="profile-edit-head">
    <button class="profile-back-btn" onclick="history.length>1?history.back():window.location='/practice-log.html'">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      Back
    </button>
    <div class="profile-edit-title">Edit Profile</div>
  </div>

  <!-- Photo -->
  <div class="profile-photo-card">
    <div class="profile-avatar-wrap">
      <div class="profile-avatar-lg" id="profile-avatar-lg"></div>
      <button class="profile-cam-badge" onclick="document.getElementById('avatar-file-input').click()" title="Change photo" aria-label="Change photo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
      </button>
    </div>
    <div class="profile-photo-actions" id="profile-photo-actions" style="display:none">
      <button class="profile-photo-link" onclick="repositionAvatar()">Reposition</button>
      <span class="profile-photo-sep">·</span>
      <button class="profile-photo-link remove" onclick="removeAvatar()">Remove photo</button>
    </div>
    <div class="profile-upload-status" id="avatar-upload-status"></div>
  </div>

  <!-- Basic info -->
  <div class="profile-section">
    <div class="profile-section-title">Basic Info</div>
    <div class="profile-field">
      <label class="profile-label" for="profile-name-input">Full name <span>*</span></label>
      <input id="profile-name-input" class="profile-input" type="text" placeholder="Your name" />
    </div>
    <div class="profile-field">
      <label class="profile-label" for="profile-headline-input">Headline</label>
      <input id="profile-headline-input" class="profile-input" type="text" placeholder="e.g. Beginner pianist · Music enthusiast · Working towards Grade 4" />
    </div>
    <div class="profile-field">
      <label class="profile-label" for="profile-instrument-input">Instruments</label>
      <input id="profile-instrument-input" class="profile-input" type="text" placeholder="e.g. Piano, Guitar, Violin" />
    </div>
    <div class="profile-field">
      <label class="profile-label" for="profile-bio-input">Bio</label>
      <textarea id="profile-bio-input" class="profile-input" placeholder="Tell the community a little about yourself…" rows="3" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
    </div>
    <div class="profile-field" style="position:relative">
      <label class="profile-label" for="profile-location-input">Location</label>
      <input id="profile-location-input" class="profile-input" type="text"
             placeholder="Start typing your city…"
             autocomplete="off"
             oninput="onLocationInput(this.value)"
             onblur="setTimeout(closeLocationDropdown, 150)" />
      <div id="location-dropdown" class="location-dropdown" style="display:none"></div>
    </div>
  </div>

  <!-- Links -->
  <div class="profile-section">
    <div class="profile-section-title">Links</div>
    <div class="profile-field">
      <label class="profile-label" for="profile-website-input">Website</label>
      <input id="profile-website-input" class="profile-input" type="url" placeholder="https://yourwebsite.com" />
    </div>
    <div class="profile-field">
      <label class="profile-label">Instagram</label>
      <div class="profile-input-prefix">

function avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)", fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)", fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)", fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}
function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}
function escHtml(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function relativeTime(ts) {
  const m = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (m < 1)   return "just now";
  if (m < 60)  return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24)  return h + "h ago";
  const d = Math.floor(h / 24);
  if (d < 7)   return d + "d ago";
  return new Date(ts).toLocaleDateString("en-GB", { day:"numeric", month:"short" });
}

async function onLocationInput(value) {

  _locationTimer = setTimeout(async () => {

      const results = await res.json();
      if (!results.length) { dd.style.display = "none"; return; }

      dd.innerHTML = results.map((r, i) => {
        // Build a clean "City, Country" label
        const a   = r.address || {};
        const city = a.city || a.town || a.village || a.county || a.state_district || r.display_name.split(",")[0];
        const country = a.country || "";
        const label = city + (country ? ", " + country : "");
        return `<div class="location-option" data-index="${i}" onmousedown="pickLocation('${escHtml(label)}')">${escHtml(label)}</div>`;
      }).join("");
      dd.style.display = "block";
    } catch { dd.style.display = "none"; }
  }, 350); // debounce 350ms
}

// ══════════════════════════════════════════════════════════════════════
// CROP MODAL
// ══════════════════════════════════════════════════════════════════════
let _cropImg    = null;
let _cropScale  = 1;
let _cropMinScale = 1;
let _cropOffX   = 0;
let _cropOffY   = 0;
let _cropDragging = false;
let _cropLastX  = 0;
let _cropLastY  = 0;
let _cropPinchDist = null;

const CROP_R = 130; // circle radius in CSS px

let _cropFromOriginal = false; // true when repositioning a stored original (don't re-save it)

function _openCropWithImage(img) {
  _cropImg = img;
  // Scale so the shorter side exactly fills the circle
  _cropMinScale = (CROP_R * 2) / Math.min(img.width, img.height);
  _cropScale    = _cropMinScale;
  _cropOffX = 0;
  _cropOffY = 0;
  const sl = document.getElementById("crop-zoom-slider");
  if (sl) sl.value = 0;
  document.getElementById("crop-modal").classList.add("open");
  _drawCrop();
}

function openCropModal(file) {
  if (!file) return;
  _cropFromOriginal = false;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => _openCropWithImage(img);
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

// Inline, non-blocking note shown in the photo card (replaces jarring alerts).
let _photoNoteT;
function _photoNote(msg, kind) {
  const el = document.getElementById("avatar-upload-status");
  if (!el) return;
  el.textContent = msg;
  el.style.color = kind === "warn" ? "#b45309" : kind === "error" ? "#ef4444" : "var(--text-muted)";
  clearTimeout(_photoNoteT);
  _photoNoteT = setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 6000);
}

// Re-open the cropper on the stored original so the user can re-frame their
// current photo. Photos uploaded before originals were kept have none — show a
// quiet inline hint pointing them at the camera button instead of an alert.
function repositionAvatar() {
  const key = myEmail.replace(/[@.]/g, "_");
  const { data } = db.storage.from("avatars").getPublicUrl(`${key}_orig.jpg`);
  const url = data?.publicUrl;
  if (!url) { _photoNote("Tap the camera to upload a new photo to re-frame it.", "warn"); return; }
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload  = () => { _cropFromOriginal = true; _openCropWithImage(img); };
  img.onerror = () => _photoNote("No saved original to re-frame. Tap the camera to upload a new photo.", "warn");
  img.src = url + "?t=" + new Date().getTime(); // cache-bust so a freshly saved original loads
}

function closeCropModal() {
  document.getElementById("crop-modal").classList.remove("open");
  _cropImg = null;
}

function _drawCrop() {
  const canvas = document.getElementById("crop-canvas");
  const ctx    = canvas.getContext("2d");
  const W = canvas.width;   // internal pixels (= CSS px × dpr)
  const H = canvas.height;
  const dpr = window.devicePixelRatio || 1;
  const r   = CROP_R * dpr;
  const cx  = W / 2;
  const cy  = H / 2;

  ctx.clearRect(0, 0, W, H);

  // 1. Draw image clipped to circle so we can see it through the overlay
  const iw = _cropImg.width  * _cropScale * dpr;
  const ih = _cropImg.height * _cropScale * dpr;
  const ix = cx + _cropOffX * dpr - iw / 2;
  const iy = cy + _cropOffY * dpr - ih / 2;

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.drawImage(_cropImg, ix, iy, iw, ih);
  ctx.restore();

  // 2. Draw image outside circle (dimmed)
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.drawImage(_cropImg, ix, iy, iw, ih);
  ctx.restore();

  // 3. Circle border
  ctx.strokeStyle = "rgba(255,255,255,.7)";
  ctx.lineWidth   = 2 * dpr;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

function _constrainCrop() {
  if (!_cropImg) return;
  const iw = _cropImg.width  * _cropScale;
  const ih = _cropImg.height * _cropScale;
  const maxX = Math.max(0, iw / 2 - CROP_R);
  const maxY = Math.max(0, ih / 2 - CROP_R);
  _cropOffX = Math.max(-maxX, Math.min(maxX, _cropOffX));
  _cropOffY = Math.max(-maxY, Math.min(maxY, _cropOffY));
}

function onCropZoom(sliderValue) {
  const t = sliderValue / 100; // 0 → 1
  _cropScale = _cropMinScale * (1 + t * 3); // 1× → 4× min scale
  _constrainCrop();
  _drawCrop();
}

async function applyCrop() {
  const btn = document.getElementById("crop-apply-btn");
  btn.disabled = true; btn.textContent = "Applying…";

  const srcImg = _cropImg;                  // keep a handle before closeCropModal() clears it
  const wasFreshUpload = !_cropFromOriginal; // only newly-uploaded photos need their original kept

  const outputSize = 400;
  const off = document.createElement("canvas");
  off.width  = outputSize;
  off.height = outputSize;
  const ctx  = off.getContext("2d");

  // Clip to circle
  ctx.beginPath();
  ctx.arc(outputSize / 2, outputSize / 2, outputSize / 2, 0, Math.PI * 2);
  ctx.clip();

  // Map circle region back to source image coordinates
  const sourceRadius  = CROP_R / _cropScale;
  const sourceCenterX = _cropImg.width  / 2 - _cropOffX / _cropScale;
  const sourceCenterY = _cropImg.height / 2 - _cropOffY / _cropScale;

  ctx.drawImage(
    _cropImg,
    sourceCenterX - sourceRadius, sourceCenterY - sourceRadius,
    sourceRadius * 2,             sourceRadius * 2,
    0, 0, outputSize, outputSize
  );

  off.toBlob(async blob => {
    const file = new File([blob], "avatar.jpg", { type: "image/jpeg" });
    closeCropModal();
    btn.disabled = false; btn.textContent = "Apply";
    await uploadAvatar(file);
    // Keep a capped copy of the original so the photo can be re-framed later.
    if (wasFreshUpload && srcImg) {
      try {
        const key = myEmail.replace(/[@.]/g, "_");
        const s = Math.min(1, 1280 / Math.max(srcImg.width, srcImg.height));
        const oc = document.createElement("canvas");
        oc.width  = Math.round(srcImg.width  * s);
        oc.height = Math.round(srcImg.height * s);
        oc.getContext("2d").drawImage(srcImg, 0, 0, oc.width, oc.height);
        await new Promise(res => oc.toBlob(b => {
          (b ? db.storage.from("avatars").upload(`${key}_orig.jpg`, b, { upsert: true, contentType: "image/jpeg" }) : Promise.resolve()).then(res, res);
        }, "image/jpeg", 0.9));
      } catch (e) { console.warn("Couldn't save original for re-positioning:", e); }
    }
  }, "image/jpeg", 0.92);
}

// ── Wire up events once DOM is ready ─────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  const canvas = document.getElementById("crop-canvas");
  if (!canvas) return;

  // Hi-DPI setup
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = 300 * dpr;
  canvas.height = 300 * dpr;
  canvas.style.width  = "300px";
  canvas.style.height = "300px";

  // Mouse events
  canvas.addEventListener("mousedown", e => {
    _cropDragging = true;
    _cropLastX = e.clientX;
    _cropLastY = e.clientY;
  });
  window.addEventListener("mousemove", e => {
    if (!_cropDragging) return;
    _cropOffX += e.clientX - _cropLastX;
    _cropOffY += e.clientY - _cropLastY;
    _cropLastX = e.clientX;
    _cropLastY = e.clientY;
    _constrainCrop();
    _drawCrop();
  });
  window.addEventListener("mouseup", () => { _cropDragging = false; });

  // Scroll to zoom
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.93;
    _cropScale = Math.max(_cropMinScale, Math.min(_cropMinScale * 4, _cropScale * factor));
    _constrainCrop();
    _drawCrop();
    // Sync slider
    const sl = document.getElementById("crop-zoom-slider");
    if (sl) sl.value = Math.round((_cropScale / _cropMinScale - 1) / 3 * 100);
  }, { passive: false });

  // Touch: drag + pinch
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    if (e.touches.length === 1) {
      _cropDragging  = true;
      _cropLastX = e.touches[0].clientX;
      _cropLastY = e.touches[0].clientY;
      _cropPinchDist = null;
    } else if (e.touches.length === 2) {
      _cropDragging  = false;
      _cropPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (e.touches.length === 1 && _cropDragging) {
      _cropOffX += e.touches[0].clientX - _cropLastX;
      _cropOffY += e.touches[0].clientY - _cropLastY;
      _cropLastX = e.touches[0].clientX;
      _cropLastY = e.touches[0].clientY;
      _constrainCrop();
      _drawCrop();
    } else if (e.touches.length === 2 && _cropPinchDist !== null) {
      const newDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      _cropScale = Math.max(_cropMinScale, Math.min(_cropMinScale * 4, _cropScale * (newDist / _cropPinchDist)));
      _cropPinchDist = newDist;
      _constrainCrop();
      _drawCrop();
      const sl = document.getElementById("crop-zoom-slider");
      if (sl) sl.value = Math.round((_cropScale / _cropMinScale - 1) / 3 * 100);
    }
  }, { passive: false });

  canvas.addEventListener("touchend", () => {
    _cropDragging  = false;
    _cropPinchDist = null;
  });
});
</script>

<!-- ── Crop modal ── -->
<div id="crop-modal">
  <div class="crop-sheet">
    <h3>Position your photo</h3>
    <p class="crop-hint">Drag to reposition · Scroll or pinch to zoom</p>
    <canvas id="crop-canvas"></canvas>
    <div class="crop-zoom-row">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line></svg>
      <input id="crop-zoom-slider" type="range" min="0" max="100" value="0"
             oninput="onCropZoom(this.value)" />
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line><line x1="8" y1="11" x2="14" y2="11"></line><line x1="11" y1="8" x2="11" y2="14"></line></svg>
    </div>
    <div class="crop-actions">
      <button class="crop-cancel-btn" onclick="closeCropModal()">Cancel</button>
      <button class="crop-apply-btn" id="crop-apply-btn" onclick="applyCrop()">Apply</button>
    </div>
  </div>
</div>

</body>
</html>
