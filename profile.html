<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js"></script>
  <style>
    #profile-main {
      max-width: 560px;
      margin: 0 auto;
      padding: 24px 16px 80px;
      display: none;
    }
    .profile-avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 32px 0 28px;
    }
    .profile-avatar-lg {
      width: 80px; height: 80px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 800;
    }
    .profile-email-label {
      font-size: 0.85rem; color: var(--text-muted);
    }
    .profile-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .profile-section-title {
      font-size: 0.72rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 14px;
    }
    .profile-field { margin-bottom: 14px; }
    .profile-field:last-child { margin-bottom: 0; }
    .profile-label {
      font-size: 0.78rem; color: var(--text-muted);
      margin-bottom: 6px; display: block;
    }
    .profile-input {
      width: 100%; background: var(--bg);
      border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.92rem; padding: 10px 12px;
      font-family: inherit; box-sizing: border-box;
      transition: border-color .15s;
    }
    .profile-input:focus { outline: none; border-color: var(--accent); }
    .profile-save-btn {
      width: 100%; padding: 12px;
      background: var(--accent); color: #1a1410;
      border: none; border-radius: 10px;
      font-size: 0.92rem; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: opacity .15s;
    }
    .profile-save-btn:hover { opacity: .88; }
    .profile-save-btn:disabled { opacity: .5; cursor: default; }
    .profile-status {
      text-align: center; font-size: 0.82rem;
      color: #10b981; margin-top: 10px; min-height: 20px;
    }
  </style>
</head>
<body>
  <header class="app-header" id="app-header"></header>

  <main id="profile-main">
    <div class="profile-avatar-section">
      <div class="profile-avatar-lg" id="profile-avatar-lg"></div>
      <div class="profile-email-label" id="profile-email-label"></div>
    </div>

    <div class="profile-section">
      <div class="profile-section-title">Your Info</div>
      <div class="profile-field">
        <label class="profile-label" for="profile-name-input">Display name</label>
        <input id="profile-name-input" class="profile-input" type="text" placeholder="Your name" />
      </div>
      <div class="profile-field">
        <label class="profile-label" for="profile-instrument-input">Instrument</label>
        <input id="profile-instrument-input" class="profile-input" type="text" placeholder="e.g. Piano" />
      </div>
      <div class="profile-field">
        <label class="profile-label" for="profile-bio-input">Bio</label>
        <textarea id="profile-bio-input" class="profile-input" rows="3"
          placeholder="Tell the community a little about yourself…"
          style="resize:vertical"></textarea>
      </div>
      <button class="profile-save-btn" id="profile-save-btn" onclick="saveProfile()">Save changes</button>
      <div class="profile-status" id="profile-status"></div>
    </div>
  </main>

<script>
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db = supabase.createClient(SUPA_URL, SUPA_ANON);

function avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)", fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)", fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)", fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}

function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}

let myEmail = null;

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails")
    .select("name,instrument,bio").eq("email", myEmail).maybeSingle();

  const myName = ae?.name || myEmail.split("@")[0];
  const isAdmin = false;

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "profile" });

  // Big avatar
  const colour = avatarColour(myEmail);
  const av = document.getElementById("profile-avatar-lg");
  av.textContent = initials(myName);
  av.style.background = colour.bg;
  av.style.color = colour.fg;

  document.getElementById("profile-email-label").textContent = myEmail;

  // Pre-fill fields
  document.getElementById("profile-name-input").value       = ae?.name        || "";
  document.getElementById("profile-instrument-input").value = ae?.instrument  || "";
  document.getElementById("profile-bio-input").value        = ae?.bio         || "";

  document.getElementById("profile-main").style.display = "";
})();

async function saveProfile() {
  const btn = document.getElementById("profile-save-btn");
  const status = document.getElementById("profile-status");
  const name       = document.getElementById("profile-name-input").value.trim();
  const instrument = document.getElementById("profile-instrument-input").value.trim();
  const bio        = document.getElementById("profile-bio-input").value.trim();

  if (!name) { status.textContent = "Display name is required."; status.style.color = "#ef4444"; return; }

  btn.disabled = true; btn.textContent = "Saving…"; status.textContent = "";

  const { error } = await db.from("allowed_emails")
    .update({ name, instrument, bio })
    .eq("email", myEmail);

  btn.disabled = false; btn.textContent = "Save changes";
  if (error) {
    status.textContent = "Couldn't save: " + error.message;
    status.style.color = "#ef4444";
  } else {
    status.style.color = "#10b981";
    status.textContent = "✓ Saved!";
    setTimeout(() => status.textContent = "", 3000);
    // Update avatar initials live
    const colour = avatarColour(myEmail);
    const av = document.getElementById("profile-avatar-lg");
    av.textContent = initials(name);
    av.style.background = colour.bg;
    av.style.color = colour.fg;
  }
}
</script>
</body>
</html>
