<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Profile — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icon-192.png"  />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js"></script>
  <style>

    /* ══════════════════════════════════════════════════
       SHARED
    ══════════════════════════════════════════════════ */
    #view-main, #edit-main { max-width: 680px; margin: 0 auto; padding: 0 16px 100px; }

    /* ══════════════════════════════════════════════════
       PUBLIC VIEW MODE
    ══════════════════════════════════════════════════ */

    /* ── Hero card ── */
    .pv-hero {
      background: var(--surface, #111); border: 1px solid var(--border, #222);
      border-radius: 16px; padding: 28px 24px 22px;
      display: flex; gap: 20px; align-items: flex-start;
      margin-bottom: 16px;
    }
    .pv-avatar {
      width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 800; overflow: hidden;
    }
    .pv-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pv-info { flex: 1; min-width: 0; }
    .pv-name { font-size: 1.3rem; font-weight: 800; color: var(--text, #e5e5e5); margin-bottom: 4px; }
    .pv-headline { font-size: 0.88rem; color: var(--text-muted, #777); margin-bottom: 10px; line-height: 1.4; }
    .pv-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .pv-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: #1a1a1a; border: 1px solid #2a2a2a;
      border-radius: 99px; padding: 4px 10px;
      font-size: 0.75rem; color: var(--text-muted, #888);
    }
    .pv-badge {
      display: inline-flex; align-items: center;
      background: rgba(245,197,24,.13); border: 1px solid rgba(245,197,24,.25);
      color: var(--accent, #f5c518);
      padding: 2px 10px; border-radius: 99px;
      font-size: 0.72rem; font-weight: 700; white-space: nowrap;
    }
    .pv-edit-btn {
      background: none; border: 1.5px solid var(--border, #333); border-radius: 20px;
      color: var(--text-muted, #888); font-size: 0.8rem; font-weight: 600;
      padding: 7px 18px; cursor: pointer; font-family: inherit;
      transition: border-color .15s, color .15s; white-space: nowrap; text-decoration: none;
      display: inline-flex; align-items: center;
    }
    .pv-edit-btn:hover { border-color: var(--accent, #f5c518); color: var(--accent, #f5c518); }

    /* ── Bio card ── */
    .pv-card {
      background: var(--surface, #111); border: 1px solid var(--border, #222);
      border-radius: 14px; padding: 20px; margin-bottom: 14px;
    }
    .pv-card-title {
      font-size: 0.7rem; font-weight: 700; letter-spacing: .07em;
      text-transform: uppercase; color: var(--text-muted, #666); margin-bottom: 12px;
    }
    .pv-bio { font-size: 0.88rem; color: #bbb; line-height: 1.65; white-space: pre-wrap; }

    /* ── Social links ── */
    .pv-links { display: flex; flex-direction: column; gap: 8px; }
    .pv-link {
      display: flex; align-items: center; gap: 10px;
      color: #aaa; text-decoration: none; font-size: 0.85rem;
      padding: 6px 4px; border-radius: 8px; transition: color .15s;
    }
    .pv-link:hover { color: var(--accent, #f5c518); }
    .pv-link-icon {
      width: 28px; height: 28px; border-radius: 8px;
      background: #1a1a1a; display: flex; align-items: center;
      justify-content: center; font-size: 0.9rem; flex-shrink: 0;
    }

    /* ── Activity / posts ── */
    .pv-post {
      background: var(--surface, #111); border: 1px solid var(--border, #222);
      border-radius: 12px; padding: 16px; margin-bottom: 10px;
      cursor: pointer; transition: border-color .15s;
    }
    .pv-post:hover { border-color: #444; }
    .pv-post-type {
      display: inline-flex; align-items: center;
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--text-muted, #666);
      background: #1a1a1a; border-radius: 6px; padding: 2px 8px; margin-bottom: 8px;
    }
    .pv-post-title { font-size: 0.92rem; font-weight: 700; color: #e5e5e5; margin-bottom: 4px; }
    .pv-post-body  { font-size: 0.82rem; color: #666; line-height: 1.5;
      overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .pv-post-meta  { font-size: 0.72rem; color: #444; margin-top: 8px; }

    .pv-empty { text-align: center; padding: 40px 20px; color: #444; font-size: 0.85rem; }

    /* ══════════════════════════════════════════════════
       CROP MODAL
    ══════════════════════════════════════════════════ */
    #crop-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,.82); z-index: 9000;
      display: none; align-items: center; justify-content: center; padding: 16px;
    }
    #crop-modal.open { display: flex; }
    .crop-sheet {
      background: #141414; border: 1px solid #2a2a2a; border-radius: 18px;
      padding: 22px; width: 100%; max-width: 360px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .crop-sheet h3 { font-size: 0.95rem; font-weight: 700; color: #e5e5e5; margin: 0; }
    .crop-hint { font-size: 0.75rem; color: #555; margin-top: -10px; text-align: center; }
    #crop-canvas {
      border-radius: 12px; cursor: grab; touch-action: none;
      display: block; width: 300px; height: 300px;
    }
    #crop-canvas:active { cursor: grabbing; }
    .crop-zoom-row {
      width: 100%; display: flex; align-items: center; gap: 10px;
    }
    .crop-zoom-row span { font-size: 0.8rem; color: #555; }
    #crop-zoom-slider {
      flex: 1; -webkit-appearance: none; appearance: none;
      height: 4px; background: #2a2a2a; border-radius: 2px; outline: none; cursor: pointer;
    }
    #crop-zoom-slider::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent, #f5c518); cursor: pointer; border: none;
    }
    #crop-zoom-slider::-moz-range-thumb {
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent, #f5c518); cursor: pointer; border: none;
    }
    .crop-actions { display: flex; gap: 10px; width: 100%; }
    .crop-cancel-btn {
      flex: 1; padding: 11px; background: none;
      border: 1.5px solid #2a2a2a; border-radius: 10px;
      color: #888; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: border-color .15s;
    }
    .crop-cancel-btn:hover { border-color: #444; color: #e5e5e5; }
    .crop-apply-btn {
      flex: 2; padding: 11px;
      background: var(--accent, #f5c518); color: #1a1410;
      border: none; border-radius: 10px;
      font-size: 0.9rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: opacity .15s;
    }
    .crop-apply-btn:hover { opacity: .88; }
    .crop-apply-btn:disabled { opacity: .5; cursor: default; }

    /* ══════════════════════════════════════════════════
       EDIT MODE  (mirrors old profile.html)
    ══════════════════════════════════════════════════ */
    .profile-page-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 24px; margin-top: 28px; }

    .profile-photo-row {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; margin-bottom: 16px;
    }
    .profile-photo-left { display: flex; flex-direction: column; gap: 6px; }
    .profile-photo-label { font-size: 0.92rem; font-weight: 700; color: var(--text); }
    .profile-photo-hint  { font-size: 0.75rem; color: var(--text-muted); }
    .profile-photo-btns  { display: flex; gap: 8px; margin-top: 10px; }
    .profile-photo-btn {
      background: none; border: 1.5px solid var(--border); border-radius: 20px;
      color: var(--text); font-size: 0.8rem; font-weight: 600;
      padding: 6px 16px; cursor: pointer; font-family: inherit; transition: border-color .15s;
    }
    .profile-photo-btn:hover { border-color: var(--accent); color: var(--accent); }
    .profile-photo-btn.remove:hover { border-color: #ef4444; color: #ef4444; }
    .profile-avatar-lg {
      width: 80px; height: 80px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; font-weight: 800; overflow: hidden;
    }
    .profile-avatar-lg img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .profile-upload-status { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }

    .profile-section {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; margin-bottom: 16px;
    }
    .profile-section-title {
      font-size: 0.72rem; font-weight: 700; letter-spacing: .06em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 16px;
    }
    .profile-field { margin-bottom: 16px; }
    .profile-field:last-child { margin-bottom: 0; }
    .profile-label { font-size: 0.82rem; font-weight: 600; color: var(--text); margin-bottom: 6px; display: block; }
    .profile-label span { color: #ef4444; margin-left: 2px; }
    .profile-input {
      width: 100%; background: var(--bg);
      border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.92rem; padding: 10px 12px;
      font-family: inherit; box-sizing: border-box; transition: border-color .15s;
    }
    .profile-input:focus { outline: none; border-color: var(--accent); }
    textarea.profile-input { resize: vertical; min-height: 90px; }
    .profile-input-prefix {
      display: flex; align-items: center;
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 8px; overflow: hidden; transition: border-color .15s;
    }
    .profile-input-prefix:focus-within { border-color: var(--accent); }
    .profile-input-prefix span {
      padding: 10px 10px 10px 12px; font-size: 0.85rem;
      color: var(--text-muted); white-space: nowrap; flex-shrink: 0;
    }
    .profile-input-prefix input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--text); font-size: 0.92rem; padding: 10px 12px 10px 0;
      font-family: inherit; min-width: 0;
    }

    /* ── Location autocomplete dropdown ── */
    .location-dropdown {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 500;
      background: #1a1a1a; border: 1px solid #333; border-top: none;
      border-radius: 0 0 10px 10px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
    }
    .location-option {
      padding: 10px 13px; font-size: 0.85rem; color: #ccc; cursor: pointer;
      border-bottom: 1px solid #222; transition: background .12s;
    }
    .location-option:last-child { border-bottom: none; }
    .location-option:hover, .location-option.focused { background: #252525; color: #fff; }

    .profile-save-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface); border-top: 1px solid var(--border);
      padding: 12px 16px max(12px, env(safe-area-inset-bottom));
      display: flex; align-items: center; justify-content: center;
      gap: 12px; z-index: 100;
    }
    /* On mobile the shared header's bottom nav (56px + safe-area inset) sits
       on top of the save bar — push the save bar above it; also let the
       button go full width for easier tapping. */
    @media (max-width: 768px) {
      .profile-save-bar {
        bottom: calc(56px + env(safe-area-inset-bottom, 0px));
        padding-bottom: 12px;
      }
      .profile-save-btn { max-width: none; flex: 1 1 auto; }
    }
    .profile-save-btn {
      flex: 0 1 240px; padding: 12px;
      background: var(--accent); color: #1a1410;
      border: none; border-radius: 10px;
      font-size: 0.92rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: opacity .15s;
    }
    .profile-save-btn:hover { opacity: .88; }
    .profile-save-btn:disabled { opacity: .5; cursor: default; }
    .profile-save-status { font-size: 0.82rem; color: #10b981; }
  </style>
</head>
<body>

<header id="app-header" style="display:none"></header>
<input type="file" id="avatar-file-input" accept="image/*" style="display:none" onchange="openCropModal(this.files[0]); this.value=''">

<!-- ══════════ PUBLIC VIEW MODE ══════════ -->
<main id="view-main" style="display:none">

  <div class="pv-hero" id="pv-hero">
    <div class="pv-avatar" id="pv-avatar"></div>
    <div class="pv-info">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
        <div class="pv-name" id="pv-name"></div>
        <span class="pv-badge" id="pv-badge" style="display:none"></span>
      </div>
      <div class="pv-headline" id="pv-headline" style="display:none"></div>
      <div class="pv-chips"   id="pv-chips"></div>
    </div>
    <a class="pv-edit-btn" href="/profile.html" id="pv-edit-btn" style="display:none">Edit Profile</a>
  </div>

  <!-- Admin: badge editor -->
  <div id="pv-badge-admin" style="display:none">
    <div class="pv-card" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:0.75rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap">Badge</span>
      <input id="pv-badge-input" type="text" placeholder="e.g. ⭐ Founding Member"
        style="flex:1;min-width:160px;background:#1a1a1a;border:1.5px solid #2a2a2a;border-radius:8px;
               color:#e5e5e5;padding:7px 11px;font-size:0.85rem;font-family:inherit;outline:none"
        onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='#2a2a2a'" />
      <button onclick="saveBadge()" class="btn btn-sm">Save</button>
      <button onclick="clearBadge()" class="btn btn-ghost btn-sm">Clear</button>
    </div>
  </div>

  <div class="pv-card" id="pv-bio-card" style="display:none">
    <div class="pv-card-title">About</div>
    <div class="pv-bio" id="pv-bio"></div>
  </div>

  <div class="pv-card" id="pv-links-card" style="display:none">
    <div class="pv-card-title">Links</div>
    <div class="pv-links" id="pv-links"></div>
  </div>

  <div id="pv-posts-section">
    <div class="pv-card-title" style="padding:0 4px;margin-bottom:10px">Recent Posts</div>
    <div id="pv-posts"></div>
  </div>

</main>

<!-- ══════════ EDIT MODE ══════════ -->
<main id="edit-main" style="display:none">
  <div style="display:flex;align-items:center;gap:12px;margin-top:24px;margin-bottom:20px">
    <button onclick="history.length>1?history.back():window.location='/practice-log.html'"
      style="background:none;border:none;color:var(--text-muted,#777);font-size:0.88rem;cursor:pointer;
             display:flex;align-items:center;gap:5px;padding:0;font-family:inherit;transition:color .15s"
      onmouseover="this.style.color='var(--text,#e5e5e5)'" onmouseout="this.style.color='var(--text-muted,#777)'">
      ← Back
    </button>
    <div style="font-size:1.3rem;font-weight:800">Edit Profile</div>
  </div>

  <!-- Photo -->
  <div class="profile-photo-row">
    <div class="profile-photo-left">
      <div class="profile-photo-label">Profile photo</div>
      <div class="profile-photo-hint">Recommended size: 300 × 300</div>
      <div class="profile-upload-status" id="avatar-upload-status"></div>
      <div class="profile-photo-btns">
        <button class="profile-photo-btn" onclick="document.getElementById('avatar-file-input').click()">Change</button>
        <button class="profile-photo-btn remove" id="remove-photo-btn" onclick="removeAvatar()" style="display:none">Remove</button>
      </div>
    </div>
    <div class="profile-avatar-lg" id="profile-avatar-lg"></div>
  </div>

  <!-- Basic info -->
  <div class="profile-section">
    <div class="profile-section-title">Basic Info</div>
    <div class="profile-field">
      <label class="profile-label" for="profile-name-input">Full name <span>*</span></label>
      <input id="profile-name-input" class="profile-input" type="text" placeholder="Your name" />
    </div>
    <div class="profile-field">
      <label class="profile-label" for="profile-headline-input">Headline</label>
      <input id="profile-headline-input" class="profile-input" type="text" placeholder="e.g. Beginner pianist · Music enthusiast · Working towards Grade 4" />
    </div>
    <div class="profile-field">
      <label class="profile-label" for="profile-instrument-input">Instruments</label>
      <input id="profile-instrument-input" class="profile-input" type="text" placeholder="e.g. Piano, Guitar, Violin" />
    </div>
    <div class="profile-field">
      <label class="profile-label" for="profile-bio-input">Bio</label>
      <textarea id="profile-bio-input" class="profile-input" placeholder="Tell the community a little about yourself…"></textarea>
    </div>
    <div class="profile-field" style="position:relative">
      <label class="profile-label" for="profile-location-input">Location</label>
      <input id="profile-location-input" class="profile-input" type="text"
             placeholder="Start typing your city…"
             autocomplete="off"
             oninput="onLocationInput(this.value)"
             onblur="setTimeout(closeLocationDropdown, 150)" />
      <div id="location-dropdown" class="location-dropdown" style="display:none"></div>
    </div>
  </div>

  <!-- Links -->
  <div class="profile-section">
    <div class="profile-section-title">Links</div>
    <div class="profile-field">
      <label class="profile-label" for="profile-website-input">Website</label>
      <input id="profile-website-input" class="profile-input" type="url" placeholder="https://yourwebsite.com" />
    </div>
    <div class="profile-field">
      <label class="profile-label">Instagram</label>
      <div class="profile-input-prefix">
        <span>instagram.com/</span>
        <input id="profile-instagram-input" type="text" placeholder="username" />
      </div>
    </div>
    <div class="profile-field">
      <label class="profile-label">YouTube</label>
      <div class="profile-input-prefix">
        <span>youtube.com/</span>
        <input id="profile-youtube-input" type="text" placeholder="@channel" />
      </div>
    </div>
    <div class="profile-field" style="margin-bottom:0">
      <label class="profile-label">X / Twitter</label>
      <div class="profile-input-prefix">
        <span>x.com/</span>
        <input id="profile-twitter-input" type="text" placeholder="username" />
      </div>
    </div>
  </div>
</main>

<!-- Sticky save bar (edit mode only) -->
<div class="profile-save-bar" id="profile-save-bar" style="display:none">
  <button class="profile-save-btn" id="profile-save-btn" onclick="saveProfile()">Save changes</button>
  <span class="profile-save-status" id="profile-save-status"></span>
</div>

<script>
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNER_EMAIL = "matthew@matthewcawood.com";
const db = supabase.createClient(SUPA_URL, SUPA_ANON);

// ── Colour helpers (must match community.html exactly) ────────────────
function avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)", fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)", fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)", fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}
function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}
function escHtml(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function relativeTime(ts) {
  const m = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (m < 1)   return "just now";
  if (m < 60)  return m + "m ago";
  const h = Math.floor(m / 60);
  if (h < 24)  return h + "h ago";
  const d = Math.floor(h / 24);
  if (d < 7)   return d + "d ago";
  return new Date(ts).toLocaleDateString("en-GB", { day:"numeric", month:"short" });
}

// ── Routing ───────────────────────────────────────────────────────────
const _urlParams  = new URLSearchParams(window.location.search);
const _viewEmail  = _urlParams.get("u"); // present → public view mode
let myEmail = null;
let myName  = null;

(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session?.user?.email) { window.location.replace("/practice-log.html"); return; }

  myEmail = session.user.email;

  const { data: myData } = await db.from("allowed_emails")
    .select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = myData?.name || myEmail.split("@")[0];

  const isAdmin = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();
  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "community", avatarUrl: myData?.avatar_url || null });

  if (_viewEmail) {
    await _loadViewMode(_viewEmail);
  } else {
    await _loadEditMode();
  }
})();

// ══════════════════════════════════════════════════════════════════════
// PUBLIC VIEW MODE
// ══════════════════════════════════════════════════════════════════════
let _viewingEmail = null; // used by badge save/clear

async function _loadViewMode(email) {
  _viewingEmail = email;
  // Load profile data
  const { data: ae } = await db.from("allowed_emails")
    .select("name,headline,instrument,location,bio,website,instagram,youtube,twitter,avatar_url,badge")
    .eq("email", email).maybeSingle();

  const name = ae?.name || email.split("@")[0];
  document.title = name + " — The Practice Room";

  // ── Avatar ──
  const avEl = document.getElementById("pv-avatar");
  if (ae?.avatar_url) {
    avEl.innerHTML = `<img src="${escHtml(ae.avatar_url)}" alt="" />`;
  } else {
    const c = avatarColour(email);
    avEl.style.background = c.bg;
    avEl.style.color = c.fg;
    avEl.textContent = initials(name);
  }

  // ── Name + headline ──
  document.getElementById("pv-name").textContent = name;
  if (ae?.headline) {
    const hl = document.getElementById("pv-headline");
    hl.textContent = ae.headline;
    hl.style.display = "";
  }

  // ── Chips ──
  const chips = [];
  if (ae?.instrument) chips.push(`<span class="pv-chip">🎹 ${escHtml(ae.instrument)}</span>`);
  if (ae?.location)   chips.push(`<span class="pv-chip">📍 ${escHtml(ae.location)}</span>`);
  if (chips.length) document.getElementById("pv-chips").innerHTML = chips.join("");

  // ── Badge ──
  if (ae?.badge) {
    const badgeEl = document.getElementById("pv-badge");
    badgeEl.textContent = ae.badge;
    badgeEl.style.display = "";
  }

  // ── Edit button (own profile) ──
  if (email.toLowerCase() === myEmail.toLowerCase()) {
    document.getElementById("pv-edit-btn").style.display = "";
  }

  // ── Admin badge editor ──
  if (myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase()) {
    const adminEl = document.getElementById("pv-badge-admin");
    adminEl.style.display = "";
    document.getElementById("pv-badge-input").value = ae?.badge || "";
  }

  // ── Bio ──
  if (ae?.bio) {
    document.getElementById("pv-bio").textContent = ae.bio;
    document.getElementById("pv-bio-card").style.display = "";
  }

  // ── Social links ──
  const links = [];
  if (ae?.website) {
    const label = ae.website.replace(/^https?:\/\//, "").replace(/\/$/, "");
    links.push({ icon: "🔗", label, href: ae.website });
  }
  if (ae?.instagram) links.push({ icon: "📸", label: "instagram.com/" + ae.instagram, href: "https://instagram.com/" + ae.instagram });
  if (ae?.youtube)   links.push({ icon: "▶️", label: "youtube.com/" + ae.youtube,   href: "https://youtube.com/" + ae.youtube });
  if (ae?.twitter)   links.push({ icon: "𝕏",  label: "x.com/" + ae.twitter,         href: "https://x.com/" + ae.twitter });

  if (links.length) {
    document.getElementById("pv-links").innerHTML = links.map(l => `
      <a class="pv-link" href="${escHtml(l.href)}" target="_blank" rel="noopener">
        <span class="pv-link-icon">${l.icon}</span>
        <span>${escHtml(l.label)}</span>
      </a>`).join("");
    document.getElementById("pv-links-card").style.display = "";
  }

  // ── Recent posts ──
  const { data: posts } = await db.from("community_posts")
    .select("id,type,title,content,created_at")
    .eq("email", email)
    .order("created_at", { ascending: false })
    .limit(10);

  const postsEl = document.getElementById("pv-posts");
  if (!posts?.length) {
    postsEl.innerHTML = `<div class="pv-empty">No posts yet.</div>`;
  } else {
    const TYPE_LABELS = { progress:"Share Your Progress", feedback:"Ask for Feedback", question:"Question", post:"Post" };
    postsEl.innerHTML = posts.map(p => `
      <div class="pv-post" onclick="window.location.href='/community.html'">
        <div class="pv-post-type">${escHtml(TYPE_LABELS[p.type] || p.type || "Post")}</div>
        <div class="pv-post-title">${escHtml(p.title || "")}</div>
        ${p.content ? `<div class="pv-post-body">${(window.renderUserContent?renderUserContent(p.content):escHtml(p.content))}</div>` : ""}
        <div class="pv-post-meta">${relativeTime(p.created_at)}</div>
      </div>`).join("");
  }

  document.getElementById("view-main").style.display = "";
}

// ══════════════════════════════════════════════════════════════════════
// EDIT MODE
// ══════════════════════════════════════════════════════════════════════
async function _loadEditMode() {
  const { data: ae } = await db.from("allowed_emails")
    .select("name,instrument,bio,headline,location,website,instagram,youtube,twitter,avatar_url")
    .eq("email", myEmail).maybeSingle();

  _renderEditAvatar(ae?.avatar_url, ae?.name || myEmail.split("@")[0]);

  document.getElementById("profile-name-input").value       = ae?.name        || "";
  document.getElementById("profile-headline-input").value   = ae?.headline    || "";
  document.getElementById("profile-instrument-input").value = ae?.instrument  || "";
  document.getElementById("profile-bio-input").value        = ae?.bio         || "";
  document.getElementById("profile-location-input").value   = ae?.location    || "";
  document.getElementById("profile-website-input").value    = ae?.website     || "";
  document.getElementById("profile-instagram-input").value  = ae?.instagram   || "";
  document.getElementById("profile-youtube-input").value    = ae?.youtube     || "";
  document.getElementById("profile-twitter-input").value    = ae?.twitter     || "";

  document.getElementById("edit-main").style.display     = "";
  document.getElementById("profile-save-bar").style.display = "";
}

function _renderEditAvatar(url, name) {
  const av        = document.getElementById("profile-avatar-lg");
  const removeBtn = document.getElementById("remove-photo-btn");
  if (url) {
    av.innerHTML = `<img src="${escHtml(url)}" alt="Profile photo" />`;
    av.style.background = "none"; av.style.color = "inherit";
    removeBtn.style.display = "";
  } else {
    const colour = avatarColour(myEmail);
    av.innerHTML = "";
    av.textContent = initials(name || myEmail?.split("@")[0] || "?");
    av.style.background = colour.bg;
    av.style.color = colour.fg;
    removeBtn.style.display = "none";
  }
}

async function uploadAvatar(file) {
  if (!file) return;
  const statusEl = document.getElementById("avatar-upload-status");
  statusEl.textContent = "Uploading…"; statusEl.style.color = "var(--text-muted)";
  const ext  = file.name.split(".").pop().toLowerCase();
  const path = `${myEmail.replace(/[@.]/g, "_")}.${ext}`;
  const { data, error } = await db.storage.from("avatars").upload(path, file, { upsert: true });
  if (error) { statusEl.textContent = "Upload failed: " + error.message; statusEl.style.color = "#ef4444"; return; }
  const { data: urlData } = db.storage.from("avatars").getPublicUrl(data.path);
  const url = urlData.publicUrl + "?t=" + Date.now();
  await db.from("allowed_emails").update({ avatar_url: url }).eq("email", myEmail);
  _renderEditAvatar(url, document.getElementById("profile-name-input").value);
  statusEl.textContent = "✓ Photo updated"; statusEl.style.color = "#10b981";
  setTimeout(() => statusEl.textContent = "", 3000);
}

async function removeAvatar() {
  if (!confirm("Remove your profile photo?")) return;
  await db.from("allowed_emails").update({ avatar_url: null }).eq("email", myEmail);
  _renderEditAvatar(null, document.getElementById("profile-name-input").value);
}

async function saveProfile() {
  const btn    = document.getElementById("profile-save-btn");
  const status = document.getElementById("profile-save-status");
  const name   = document.getElementById("profile-name-input").value.trim();
  if (!name) { status.textContent = "Full name is required."; status.style.color = "#ef4444"; return; }

  btn.disabled = true; btn.textContent = "Saving…"; status.textContent = "";

  const { error } = await db.from("allowed_emails").update({
    name,
    headline:   document.getElementById("profile-headline-input").value.trim()   || null,
    instrument: document.getElementById("profile-instrument-input").value.trim() || null,
    bio:        document.getElementById("profile-bio-input").value.trim()        || null,
    location:   document.getElementById("profile-location-input").value.trim()   || null,
    website:    document.getElementById("profile-website-input").value.trim()    || null,
    instagram:  document.getElementById("profile-instagram-input").value.trim()  || null,
    youtube:    document.getElementById("profile-youtube-input").value.trim()    || null,
    twitter:    document.getElementById("profile-twitter-input").value.trim()    || null,
  }).eq("email", myEmail);

  btn.disabled = false; btn.textContent = "Save changes";
  if (error) {
    status.style.color = "#ef4444";
    status.textContent = "Couldn't save: " + error.message;
  } else {
    status.style.color = "#10b981";
    status.textContent = "✓ Saved!";
    // Update avatar preview if name changed
    _renderEditAvatar(
      document.getElementById("profile-avatar-lg").querySelector("img")?.src || null,
      name
    );
    setTimeout(() => status.textContent = "", 3000);
  }
}

// ══════════════════════════════════════════════════════════════════════
// BADGE MANAGEMENT  (admin only)
// ══════════════════════════════════════════════════════════════════════
async function saveBadge() {
  const badge = document.getElementById("pv-badge-input")?.value.trim() || null;
  const { error } = await db.from("allowed_emails")
    .update({ badge }).eq("email", _viewingEmail);
  if (error) { alert("Error: " + error.message); return; }
  const badgeEl = document.getElementById("pv-badge");
  if (badge) {
    badgeEl.textContent = badge;
    badgeEl.style.display = "";
  } else {
    badgeEl.style.display = "none";
  }
}

async function clearBadge() {
  document.getElementById("pv-badge-input").value = "";
  await saveBadge();
}

// ══════════════════════════════════════════════════════════════════════
// LOCATION AUTOCOMPLETE  (OpenStreetMap Nominatim — no API key needed)
// ══════════════════════════════════════════════════════════════════════
let _locationTimer = null;

async function onLocationInput(value) {
  clearTimeout(_locationTimer);
  const dd = document.getElementById("location-dropdown");
  if (!value || value.trim().length < 2) { dd.style.display = "none"; return; }
  _locationTimer = setTimeout(async () => {
    try {
      const res = await fetch(
        `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(value)}&format=json&addressdetails=1&limit=6`,
        { headers: { "Accept-Language": "en" } }
      );
      const results = await res.json();
      if (!results.length) { dd.style.display = "none"; return; }

      dd.innerHTML = results.map((r, i) => {
        // Build a clean "City, Country" label
        const a   = r.address || {};
        const city = a.city || a.town || a.village || a.county || a.state_district || r.display_name.split(",")[0];
        const country = a.country || "";
        const label = city + (country ? ", " + country : "");
        return `<div class="location-option" data-index="${i}" onmousedown="pickLocation('${escHtml(label)}')">${escHtml(label)}</div>`;
      }).join("");
      dd.style.display = "block";
    } catch { dd.style.display = "none"; }
  }, 350); // debounce 350ms
}

function pickLocation(label) {
  document.getElementById("profile-location-input").value = label;
  closeLocationDropdown();
}

function closeLocationDropdown() {
  const dd = document.getElementById("location-dropdown");
  if (dd) dd.style.display = "none";
}

// ══════════════════════════════════════════════════════════════════════
// CROP MODAL
// ══════════════════════════════════════════════════════════════════════
let _cropImg    = null;
let _cropScale  = 1;
let _cropMinScale = 1;
let _cropOffX   = 0;
let _cropOffY   = 0;
let _cropDragging = false;
let _cropLastX  = 0;
let _cropLastY  = 0;
let _cropPinchDist = null;

const CROP_R = 130; // circle radius in CSS px

function openCropModal(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      _cropImg = img;
      // Scale so the shorter side exactly fills the circle
      _cropMinScale = (CROP_R * 2) / Math.min(img.width, img.height);
      _cropScale    = _cropMinScale;
      _cropOffX = 0;
      _cropOffY = 0;
      // Sync slider to 0
      const sl = document.getElementById("crop-zoom-slider");
      if (sl) sl.value = 0;
      document.getElementById("crop-modal").classList.add("open");
      _drawCrop();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function closeCropModal() {
  document.getElementById("crop-modal").classList.remove("open");
  _cropImg = null;
}

function _drawCrop() {
  const canvas = document.getElementById("crop-canvas");
  const ctx    = canvas.getContext("2d");
  const W = canvas.width;   // internal pixels (= CSS px × dpr)
  const H = canvas.height;
  const dpr = window.devicePixelRatio || 1;
  const r   = CROP_R * dpr;
  const cx  = W / 2;
  const cy  = H / 2;

  ctx.clearRect(0, 0, W, H);

  // 1. Draw image clipped to circle so we can see it through the overlay
  const iw = _cropImg.width  * _cropScale * dpr;
  const ih = _cropImg.height * _cropScale * dpr;
  const ix = cx + _cropOffX * dpr - iw / 2;
  const iy = cy + _cropOffY * dpr - ih / 2;

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.clip();
  ctx.drawImage(_cropImg, ix, iy, iw, ih);
  ctx.restore();

  // 2. Draw image outside circle (dimmed)
  ctx.save();
  ctx.globalAlpha = 0.28;
  ctx.drawImage(_cropImg, ix, iy, iw, ih);
  ctx.restore();

  // 3. Circle border
  ctx.strokeStyle = "rgba(255,255,255,.7)";
  ctx.lineWidth   = 2 * dpr;
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.stroke();
}

function _constrainCrop() {
  if (!_cropImg) return;
  const iw = _cropImg.width  * _cropScale;
  const ih = _cropImg.height * _cropScale;
  const maxX = Math.max(0, iw / 2 - CROP_R);
  const maxY = Math.max(0, ih / 2 - CROP_R);
  _cropOffX = Math.max(-maxX, Math.min(maxX, _cropOffX));
  _cropOffY = Math.max(-maxY, Math.min(maxY, _cropOffY));
}

function onCropZoom(sliderValue) {
  const t = sliderValue / 100; // 0 → 1
  _cropScale = _cropMinScale * (1 + t * 3); // 1× → 4× min scale
  _constrainCrop();
  _drawCrop();
}

async function applyCrop() {
  const btn = document.getElementById("crop-apply-btn");
  btn.disabled = true; btn.textContent = "Applying…";

  const outputSize = 400;
  const off = document.createElement("canvas");
  off.width  = outputSize;
  off.height = outputSize;
  const ctx  = off.getContext("2d");

  // Clip to circle
  ctx.beginPath();
  ctx.arc(outputSize / 2, outputSize / 2, outputSize / 2, 0, Math.PI * 2);
  ctx.clip();

  // Map circle region back to source image coordinates
  const sourceRadius  = CROP_R / _cropScale;
  const sourceCenterX = _cropImg.width  / 2 - _cropOffX / _cropScale;
  const sourceCenterY = _cropImg.height / 2 - _cropOffY / _cropScale;

  ctx.drawImage(
    _cropImg,
    sourceCenterX - sourceRadius, sourceCenterY - sourceRadius,
    sourceRadius * 2,             sourceRadius * 2,
    0, 0, outputSize, outputSize
  );

  off.toBlob(async blob => {
    const file = new File([blob], "avatar.jpg", { type: "image/jpeg" });
    closeCropModal();
    btn.disabled = false; btn.textContent = "Apply";
    await uploadAvatar(file);
  }, "image/jpeg", 0.92);
}

// ── Wire up events once DOM is ready ─────────────────────────────────
document.addEventListener("DOMContentLoaded", () => {
  const canvas = document.getElementById("crop-canvas");
  if (!canvas) return;

  // Hi-DPI setup
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = 300 * dpr;
  canvas.height = 300 * dpr;
  canvas.style.width  = "300px";
  canvas.style.height = "300px";

  // Mouse events
  canvas.addEventListener("mousedown", e => {
    _cropDragging = true;
    _cropLastX = e.clientX;
    _cropLastY = e.clientY;
  });
  window.addEventListener("mousemove", e => {
    if (!_cropDragging) return;
    _cropOffX += e.clientX - _cropLastX;
    _cropOffY += e.clientY - _cropLastY;
    _cropLastX = e.clientX;
    _cropLastY = e.clientY;
    _constrainCrop();
    _drawCrop();
  });
  window.addEventListener("mouseup", () => { _cropDragging = false; });

  // Scroll to zoom
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.08 : 0.93;
    _cropScale = Math.max(_cropMinScale, Math.min(_cropMinScale * 4, _cropScale * factor));
    _constrainCrop();
    _drawCrop();
    // Sync slider
    const sl = document.getElementById("crop-zoom-slider");
    if (sl) sl.value = Math.round((_cropScale / _cropMinScale - 1) / 3 * 100);
  }, { passive: false });

  // Touch: drag + pinch
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    if (e.touches.length === 1) {
      _cropDragging  = true;
      _cropLastX = e.touches[0].clientX;
      _cropLastY = e.touches[0].clientY;
      _cropPinchDist = null;
    } else if (e.touches.length === 2) {
      _cropDragging  = false;
      _cropPinchDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    if (e.touches.length === 1 && _cropDragging) {
      _cropOffX += e.touches[0].clientX - _cropLastX;
      _cropOffY += e.touches[0].clientY - _cropLastY;
      _cropLastX = e.touches[0].clientX;
      _cropLastY = e.touches[0].clientY;
      _constrainCrop();
      _drawCrop();
    } else if (e.touches.length === 2 && _cropPinchDist !== null) {
      const newDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      _cropScale = Math.max(_cropMinScale, Math.min(_cropMinScale * 4, _cropScale * (newDist / _cropPinchDist)));
      _cropPinchDist = newDist;
      _constrainCrop();
      _drawCrop();
      const sl = document.getElementById("crop-zoom-slider");
      if (sl) sl.value = Math.round((_cropScale / _cropMinScale - 1) / 3 * 100);
    }
  }, { passive: false });

  canvas.addEventListener("touchend", () => {
    _cropDragging  = false;
    _cropPinchDist = null;
  });
});
</script>

<!-- ── Crop modal ── -->
<div id="crop-modal">
  <div class="crop-sheet">
    <h3>Position your photo</h3>
    <p class="crop-hint">Drag to reposition · Scroll or pinch to zoom</p>
    <canvas id="crop-canvas"></canvas>
    <div class="crop-zoom-row">
      <span>🔍</span>
      <input id="crop-zoom-slider" type="range" min="0" max="100" value="0"
             oninput="onCropZoom(this.value)" />
      <span>🔎</span>
    </div>
    <div class="crop-actions">
      <button class="crop-cancel-btn" onclick="closeCropModal()">Cancel</button>
      <button class="crop-apply-btn" id="crop-apply-btn" onclick="applyCrop()">Apply</button>
    </div>
  </div>
</div>
