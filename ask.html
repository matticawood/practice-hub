// Keep the editor's caret so a toolbar insert (timestamp / clip / cite) lands
// where the owner was typing, even after clicking a button outside the editor.
function fbInitEditor(){
  const ed=document.getElementById('fb-ed'); if(!ed) return;
  const save=function(){ const s=window.getSelection(); if(s && s.rangeCount && ed.contains(s.anchorNode)) _fbRange=s.getRangeAt(0).cloneRange(); };
  ed.addEventListener('keyup',save); ed.addEventListener('mouseup',save); ed.addEventListener('input',save);
  _fbRange=null;
}
function fbCitePicker(btn){
  Array.prototype.forEach.call(document.querySelectorAll('.fb-cite-pop'), function(p){ p.remove(); });
  const refs=(window.Comments&&Comments.readMedia)? Comments.readMedia('fbref') : [];
  if(!refs.length){ showToast('Attach a reference below first, then cite it.', 3200); return; }
  const pop=document.createElement('div'); pop.className='fb-cite-pop';
  pop.innerHTML = refs.map(function(m,i){ const label=escHtml(m.name || (m.type==='mux'?'Video':m.type==='image'?'Image':(m.type||'Reference'))); return '<button class="fb-cite-opt" onmousedown="event.preventDefault()" onclick="fbInsertCite('+(i+1)+')">['+(i+1)+'] '+label+'</button>'; }).join('');
  document.body.appendChild(pop);
  const r=btn.getBoundingClientRect(); pop.style.left=Math.max(10,Math.min(r.left, window.innerWidth-250))+'px'; pop.style.top=(r.bottom+6)+'px';
  setTimeout(function(){ const h=function(e){ if(!pop.contains(e.target)){ pop.remove(); document.removeEventListener('mousedown',h); } }; document.addEventListener('mousedown',h); }, 0);
}
function fbInsertCite(n){
  Array.prototype.forEach.call(document.querySelectorAll('.fb-cite-pop'), function(p){ p.remove(); });
  fbInsertNode('<span class="fb-chip fb-cite" contenteditable="false" data-ref="'+n+'">['+n+']</span> ');
}
window.fbGotoRef=function(n){ const el=document.getElementById('fb-ref-'+n); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.classList.add('fb-ref-flash'); setTimeout(function(){ el.classList.remove('fb-ref-flash'); },1300); } };

function fbAttachScore(input){
  const f=input.files&&input.files[0]; if(!f) return;
  _fbScore = { type:(f.type==='application/pdf'?'file':'image'), _localUrl:URL.createObjectURL(f), name:f.name };
  const ln=document.querySelector('.fb-scorenote'); if(ln) ln.textContent='Score attached. Use "Clip the score" to drop a region into your writing.';
  fbOpenClipper();
}

function fbInsertTimestamp(){
  if(!_fbVideoId){ showToast('There is no video to timestamp.', 2600); return; }
  const v=document.getElementById('fb-vid'); const sec = v? Math.floor(v.currentTime||0) : 0;
  fbInsertNode('<span class="fb-chip fb-ts" contenteditable="false" data-sec="'+sec+'">'+FB_PLAY+' '+_fmtTime(sec)+'</span> ');
}
function fbInsertNode(html){
  const ed=document.getElementById('fb-ed'); if(!ed) return; ed.focus();
  const sel=window.getSelection();
  if(_fbRange){ try{ sel.removeAllRanges(); sel.addRange(_fbRange); }catch(_){} }
  try{ document.execCommand('insertHTML', false, html); }
  catch(_){ ed.insertAdjacentHTML('beforeend', html); }
  try{ const s=window.getSelection(); if(s && s.rangeCount && ed.contains(s.anchorNode)) _fbRange=s.getRangeAt(0).cloneRange(); }catch(_){}
}
function fbSerializeDoc(){
  const ed=document.getElementById('fb-ed'); if(!ed) return [];
  const blocks=[]; let cur=[];
  const pushT=function(s){ if(s) cur.push({x:'t',s:s}); };
  const flush=function(){ if(cur.length) blocks.push({runs:cur}); cur=[]; };
  const walk=function(node){
    Array.prototype.forEach.call(node.childNodes, function(n){
      if(n.nodeType===3){ pushT(n.nodeValue); return; }
      if(n.nodeType!==1) return;
      const el=n, cl=el.classList;
      if(cl&&cl.contains('fb-ts')) cur.push({x:'ts',sec:+(el.dataset.sec||0)});
      else if(cl&&cl.contains('fb-cite')) cur.push({x:'cite',i:+(el.dataset.ref||0)});
      else if(cl&&cl.contains('fb-clip')) cur.push({x:'clip',url:el.dataset.url||el.getAttribute('src')||''});
      else if(el.tagName==='BR'){ flush(); }
      else if(el.tagName==='DIV'||el.tagName==='P'){ flush(); walk(el); flush(); }
      else walk(el);
    });
  };
  walk(ed); flush();
  return blocks;
}
function fbPlain(doc){ return (doc||[]).map(function(b){ return (b.runs||[]).map(function(r){ return r.x==='t'?r.s:(r.x==='ts'?('['+_fmtTime(r.sec)+']'):''); }).join(''); }).join('\n').trim(); }
function fbRenderDoc(doc){
  return (doc||[]).map(function(b){
    const inner=(b.runs||[]).map(function(r){
      if(r.x==='t') return escHtml(r.s);
      if(r.x==='ts') return '<button class="fb-ts-chip" onclick="fbSeek('+(+r.sec||0)+')">'+FB_PLAY+' '+_fmtTime(r.sec)+'</button>';
      if(r.x==='cite') return '<sup class="fb-cite-ref" onclick="fbGotoRef('+(+r.i||0)+')">['+(+r.i||0)+']</sup>';
      if(r.x==='clip') return (/^https?:\/\//.test(r.url||'')? '<img class="fb-clip" src="'+escHtml(r.url)+'" alt="score excerpt">':'');
      return '';
    }).join('');
    return '<p class="fb-p">'+(inner||'')+'</p>';
  }).join('');
}
window.fbSeek=function(sec){ const v=document.getElementById('fb-dvid'); if(v){ try{ v.currentTime=sec; if(v.play) v.play(); }catch(_){}; v.scrollIntoView({block:'nearest',behavior:'smooth'}); } };

async function fbDeliver(id){
  const doc=fbSerializeDoc();
  const hasClip=(doc||[]).some(function(b){ return (b.runs||[]).some(function(rn){ return rn.x==='clip'; }); });
  if(!fbPlain(doc) && !hasClip){ showToast('Write some feedback first.', 3000); return; }
  const ok=await askDialog({ title:'Deliver this feedback?', body:'It will be sent to them and the '+fmt(CAT.feedback.cost)+' credits they are holding will be charged. You can still exchange follow-up messages afterwards.', yes:'Deliver', no:'Keep editing', coin:false });
  if(!ok) return;
  const btn=document.getElementById('fb-deliver'); if(btn){ if(btn.disabled) return; btn.disabled=true; }
  let refs=[]; try{ if(window.Comments) refs=await Comments.uploadMedia('fbref'); }
  catch(e){ showToast(e&&e.message?e.message:'An attachment is still uploading.', 3800); if(btn) btn.disabled=false; return; }
  const resp={ doc:doc, refs:refs||[], videoId:_fbVideoId||null, text:fbPlain(doc).slice(0,400) };
  const { error } = await db.rpc('deliver_credit_request', { p_id:id, p_response:resp });
  if(error){ showToast('Could not deliver. '+(error.message||''), 4200); if(btn) btn.disabled=false; return; }
  showToast('Feedback delivered. They have been notified.');
  go({ flow:'feedback', req:id });
}

async function renderFeedbackDeliverable(view, r, owner, own){
  await ensureMattIdentity();
  const resp = r.response||{}; const fm=_fbMedia(r);
  const vidId = resp.videoId || (fm.video? (fm.video.playbackId||fm.video.playback_id):null);
  let mName=myName, mAv=myAvatar;
  if(owner && !own){ try{ const { data }=await db.rpc('get_profile_row',{p_email:r.email}); const row=Array.isArray(data)?data[0]:data; if(row){ mName=row.name||(r.email||'').split('@')[0]; mAv=row.avatar_url||null; } else { mName=(r.email||'').split('@')[0]; mAv=null; } }catch(_){ mName=(r.email||'').split('@')[0]; mAv=null; } }
  const mFirst = escHtml((String(mName||'').trim().split(/\s+/)[0])||mName);
  const cancelled = r.status==='cancelled';
  // Follow-up turn/window: the delivery is the first owner reply.
  const replies = (cancelled? [] : [{from:'owner', at:r.delivered_at||r.created_at}]).concat(Array.isArray(r.messages)?r.messages:[]);
  const lastMsg = replies.length? replies[replies.length-1] : null;
  const lastIsOwner = !!(lastMsg && lastMsg.from==='owner');
  const windowOpen = lastIsOwner && lastMsg.at && (Date.now()-Date.parse(lastMsg.at)) <= 2*864e5;
  const canSend = !cancelled && (owner || windowOpen);
  // Follow-up messages after the delivery (r.messages) render as bubbles.
  let follow='';
  (Array.isArray(r.messages)?r.messages:[]).forEach(function(m){
    const isO=m.from==='owner'; const mine=isO===owner;
    const who=isO?(owner?'You':'Matt'):(owner?mFirst:'You');
    follow += '<div class="aq-msg'+(mine?' me':'')+'">'+aqAvatar(mine?'me':'', isO?mattAvatar:mAv, isO?'M':(mName||'?').trim()[0]||'?')
      + '<div class="aq-msg-b"><div class="aq-who">'+who+'</div><div class="aq-bubble'+(mine?' me':'')+'">'+msgBody(m.text)+aqMedia(m.media)+'</div></div></div>';
  });
  const refsHtml = (resp.refs&&resp.refs.length)? '<div class="fb-refs"><div class="fb-refs-title">Reference material</div>'+resp.refs.map(function(m,i){ return '<div class="fb-ref" id="fb-ref-'+(i+1)+'"><span class="fb-ref-n">'+(i+1)+'</span><div class="fb-ref-m">'+aqMedia([m])+'</div></div>'; }).join('')+'</div>' : '';
  // Every moment Matt timestamped, as a clickable jump row under the video.
  const stampSet = {}; (resp.doc||[]).forEach(function(b){ (b.runs||[]).forEach(function(rn){ if(rn.x==='ts') stampSet[+rn.sec||0]=1; }); });
  const stamps = Object.keys(stampSet).map(Number).sort(function(a,b){return a-b;});
  const marks = (stamps.length && vidId)? '<div class="fb-marks">'+stamps.map(function(s){ return '<button class="fb-mark" onclick="fbSeek('+s+')">'+FB_PLAY+' '+_fmtTime(s)+'</button>'; }).join('')+'</div>' : '';
  const k='askreply';
  const windowClosed = !owner && lastIsOwner && !windowOpen && !cancelled;   // answered, past the follow-up window
  let dock='';
  if(!cancelled){
    // Composer is always present (greyed when the member can't send), mirroring the
    // question thread, with the placeholder carrying the reason: awaiting Matt, or
    // the window has closed. The owner can always send.
    const ph = owner ? ('Reply to '+mFirst+'…')
             : canSend ? 'Send a follow-up…'
             : windowClosed ? 'This conversation has closed. You can send Matt a new recording any time.'
             : 'Matt will reply here, and you\'ll get a notification when he does.';
    const dis = canSend ? '' : ' disabled';
    const lock = canSend ? '' : ' is-locked';
    const memberTools='<div class="aq-ctoolbar"><button class="aq-tbtn" title="Add a photo" onclick="document.getElementById(\'tc-fi-img-'+k+'\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></button><button class="aq-tbtn" title="Attach a file" onclick="document.getElementById(\'tc-fi-file-'+k+'\').click()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg></button><input type="file" id="tc-fi-img-'+k+'" accept="image/*" multiple style="display:none" onchange="tcHandleImage(this,\''+k+'\')"><input type="file" id="tc-fi-file-'+k+'" accept=".pdf,.doc,.docx,.txt,.mp3,.wav,.m4a,.mid,.midi,.xml,.musicxml,.mxl" style="display:none" onchange="tcHandleFile(this,\''+k+'\')"></div>';
    const ownerTools=(window.Comments&&Comments.toolbarHtml)?Comments.toolbarHtml(k):memberTools;
    const toolsHtml = canSend ? (owner?ownerTools:memberTools) : '';
    const prev = (canSend && !owner) ? '<div id="inline-media-preview-'+k+'"></div>' : '';
    dock='<div class="aq-dock">'+prev+'<div class="aq-composer'+lock+'">'+toolsHtml+'<div class="aq-input-row"><textarea class="aq-ctext" id="aq-reply" oninput="_taGrow(this)" placeholder="'+escHtml(ph)+'"'+dis+'></textarea><button class="aq-csend" id="aq-reply-send" aria-label="Send" onclick="aqThreadSend(\''+r.id+'\')"'+dis+'>'+AQ_SEND+'</button></div></div></div>';
  }
  try{ if(window.Comments) Comments.clearState('askreply'); }catch(_){}
  const body = cancelled
    ? '<div class="aq-wait" style="margin-left:0;margin-top:30px">This feedback was withdrawn and the '+fmt(r.cost)+' credits refunded.</div>'
    : (
        (vidId? '<div class="fb-dvid-wrap"><mux-player id="fb-dvid" playback-id="'+escHtml(vidId)+'" style="width:100%;aspect-ratio:16/9;display:block;border-radius:12px;overflow:hidden" stream-type="on-demand"></mux-player>'+marks+'</div>':'')
      + '<article class="fb-article">'+(resp.doc? fbRenderDoc(resp.doc) : (resp.text? '<p class="fb-p">'+escHtml(resp.text)+'</p>':'<p class="fb-p">Your feedback is ready.</p>'))+'</article>'
      + refsHtml
      + (follow? '<div class="fb-follow">'+follow+'</div>':'')
      );
  view.innerHTML = '<div class="aq-flow">'
    + '<button class="aq-back" aria-label="Back to recordings" onclick="go({flow:\'feedback\'})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'
    + '<button class="aq-x" aria-label="Close" onclick="go({})">'+AQ_X+'</button>'
    + '<div class="fb-wrap"><div class="fb-in">'
    +   '<div class="aq-eyb">Feedback'+(cancelled?'':(owner?(' for '+mFirst):' from Matt'))+'</div>'
    +   '<div class="aq-meta"><span class="aq-meta-i">'+AQ_LOCK+(owner?('For '+escHtml(mName)):'Private to you and Matt')+'</span><span class="aq-meta-sep"></span>'+(cancelled?'<span>Withdrawn and refunded</span>':'<span style="color:var(--green);font-weight:600">Delivered</span>')+'</div>'
    +   (r.body&&r.body.piece? '<div class="fb-piece">'+escHtml(r.body.piece)+'</div>':'')
    +   body
    + '</div>'+dock+'</div></div>';
}

// ── Score clipper: render the score (PDF via PDF.js, or an image), drag a box,
// crop to an image, upload it, and drop it inline into the feedback. ─────────────
async function fbOpenClipper(){
  if(!_fbScore){ const inp=document.getElementById('fb-attach-score'); if(inp) inp.click(); return; }  // attach first
  const ov=document.getElementById('fb-clipper'); if(!ov) return;
  _fbClipSel=null; ov.classList.add('open');
  ov.innerHTML = '<div class="fb-clip-sheet"><div class="fb-clip-head"><span>Drag a box over the passage, then clip it</span><button class="fb-clip-x" onclick="fbCloseClipper()" aria-label="Close">'+AQ_X+'</button></div><div class="fb-clip-body" id="fb-clip-body"><div class="fb-clip-loading">Loading the score…</div></div><div class="fb-clip-foot"><button class="fb-clip-btn" id="fb-clip-go" onclick="fbClipGo()" disabled>Clip selection</button></div></div>';
  const bodyEl=document.getElementById('fb-clip-body');
  const src=_fbScore.url || _fbScore._localUrl;
  const name=_fbScore.name||src||'';
  const isImg=_fbScore.type==='image' || /\.(png|jpe?g|gif|webp|bmp)($|\?)/i.test(name);
  const isPdf=!isImg && (/\.pdf($|\?)/i.test(name) || _fbScore.mime==='application/pdf' || /\.pdf($|\?)/i.test(src||''));
  if(!isImg && !isPdf){
    // A .docx/.musicxml etc. can't be clipped; let the owner attach a PDF or photo.
    fbCloseClipper(); showToast('That score file can\'t be clipped. Attach a PDF or a photo to clip from.', 4200);
    const inp=document.getElementById('fb-attach-score'); if(inp){ _fbScore=null; inp.click(); } return;
  }
  try{
    bodyEl.innerHTML='';
    if(isPdf){
      const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.mjs';
      const pdf=await pdfjs.getDocument(src).promise;
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);
        const base=page.getViewport({scale:1});
        const scale=Math.min(2.5,(bodyEl.clientWidth-24)/base.width);
        const vp=page.getViewport({scale:scale});
        const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.className='fb-clip-canvas';
        bodyEl.appendChild(c);
        await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
        fbClipAttach(c);
      }
    } else {
      const img=new Image(); img.crossOrigin='anonymous';
      await new Promise(function(res,rej){ img.onload=res; img.onerror=rej; img.src=src; });
      const scale=Math.min(2.5,(bodyEl.clientWidth-24)/img.naturalWidth);
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*scale); c.height=Math.round(img.naturalHeight*scale); c.className='fb-clip-canvas';
      bodyEl.appendChild(c); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      fbClipAttach(c);
    }
  }catch(e){ bodyEl.innerHTML='<div class="fb-clip-loading">Could not open the score for clipping. '+escHtml(e&&e.message||'')+'</div>'; }
}
function fbClipAttach(canvas){
  const wrap=document.createElement('div'); wrap.className='fb-clip-cwrap';
  canvas.parentNode.insertBefore(wrap, canvas); wrap.appendChild(canvas);
  const box=document.createElement('div'); box.className='fb-clip-box'; box.style.display='none'; wrap.appendChild(box);
  let sx=0, sy=0, drag=false;
  const pt=function(e){ const r=canvas.getBoundingClientRect(); const cx=(e.touches?e.touches[0].clientX:e.clientX)-r.left; const cy=(e.touches?e.touches[0].clientY:e.clientY)-r.top; return { x:Math.max(0,Math.min(canvas.clientWidth,cx)), y:Math.max(0,Math.min(canvas.clientHeight,cy)) }; };
  const start=function(e){ const p=pt(e); sx=p.x; sy=p.y; drag=true; box.style.display='block'; box.style.left=sx+'px'; box.style.top=sy+'px'; box.style.width='0px'; box.style.height='0px'; if(e.type==='mousedown'){ window.addEventListener('mousemove',move); window.addEventListener('mouseup',end); } if(e.cancelable)e.preventDefault(); };
  const move=function(e){ if(!drag)return; const p=pt(e); const x=Math.min(sx,p.x), y=Math.min(sy,p.y), w=Math.abs(p.x-sx), h=Math.abs(p.y-sy); box.style.left=x+'px'; box.style.top=y+'px'; box.style.width=w+'px'; box.style.height=h+'px'; if(e.cancelable)e.preventDefault(); };
  const end=function(){ if(!drag)return; drag=false; window.removeEventListener('mousemove',move); window.removeEventListener('mouseup',end); const rx=parseFloat(box.style.left)||0, ry=parseFloat(box.style.top)||0, rw=parseFloat(box.style.width)||0, rh=parseFloat(box.style.height)||0; const go=document.getElementById('fb-clip-go'); if(rw<8||rh<8){ box.style.display='none'; _fbClipSel=null; if(go) go.disabled=true; return; } const sxr=canvas.width/canvas.clientWidth, syr=canvas.height/canvas.clientHeight; _fbClipSel={ canvas:canvas, x:rx*sxr, y:ry*syr, w:rw*sxr, h:rh*syr }; Array.prototype.forEach.call(document.querySelectorAll('.fb-clip-box'), function(b){ if(b!==box) b.style.display='none'; }); if(go) go.disabled=false; };
  canvas.addEventListener('mousedown',start);
  canvas.addEventListener('touchstart',start,{passive:false}); canvas.addEventListener('touchmove',move,{passive:false}); canvas.addEventListener('touchend',end);
}
async function fbClipGo(){
  if(!_fbClipSel) return; const s=_fbClipSel;
  const out=document.createElement('canvas'); out.width=Math.max(1,Math.round(s.w)); out.height=Math.max(1,Math.round(s.h));
  out.getContext('2d').drawImage(s.canvas, s.x, s.y, s.w, s.h, 0, 0, out.width, out.height);
  const btn=document.getElementById('fb-clip-go'); if(btn){ btn.disabled=true; btn.textContent='Clipping…'; }
  out.toBlob(async function(blob){
    try{
      if(!blob) throw new Error('empty');
      const path='feedback-clips/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.png';
      const up=await db.storage.from('community-uploads').upload(path, blob, { contentType:'image/png' });
      if(up.error) throw up.error;
      const url=db.storage.from('community-uploads').getPublicUrl(path).data.publicUrl;
      fbInsertNode('<img class="fb-clip" contenteditable="false" data-url="'+escHtml(url)+'" src="'+escHtml(url)+'" alt="score excerpt"> ');
      fbCloseClipper();
    }catch(e){ showToast('Could not save the clip. '+(e&&e.message||''), 3800); const b=document.getElementById('fb-clip-go'); if(b){ b.disabled=false; b.textContent='Clip selection'; } }
  }, 'image/png');
}
function fbCloseClipper(){ const ov=document.getElementById('fb-clipper'); if(ov){ ov.classList.remove('open'); ov.innerHTML=''; } _fbClipSel=null; }

      + '<div class="kgrid"><div class="kitem"><span class="kic" style="color:var(--gold)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 7v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V7z"/></svg></span><div><div class="kk">Member</div><div class="kv">'+escHtml(myName)+'</div></div></div>'
      + '<div class="kitem"><span class="kic" style="color:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-6M6 20v-10M18 20V4"/></svg></span><div><div class="kk">Practice</div><div class="kv">From your log</div></div></div></div></div></div>'

      + '<div class="rc-step"><span class="rc-num">·</span><span class="rc-tx"><b>A week-by-week plan</b> toward your goal.</span></div>'
      + '<div class="rc-step"><span class="rc-num">·</span><span class="rc-tx"><b>What to practise</b> each session.</span></div>'
      + '<div class="rc-step"><span class="rc-num">·</span><span class="rc-tx"><b>The pieces and exercises</b> that get you there.</span></div></div></aside></div>';

async function submitPlan(){
  const working = ((document.getElementById('p-working')||{}).value||'').trim();
  const aim = ((document.getElementById('p-aim')||{}).value||'').trim();
  const extra = ((document.getElementById('p-extra')||{}).value||'').trim();
  if(aim.length<5 && working.length<5){ showToast('Tell Matt a little about what you want.', 3000); return; }
  if(!await confirmSpend('plan')) return;
  const btn = document.getElementById('p-send'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  const body = { working_on:working, aim:aim, extra:extra, text:(aim || working) };
  const { data, error } = await spend('plan', body);
  if(error){ showToast(/insufficient/i.test(error.message||'')?'You do not have enough credits.':'Could not send. Please try again.', 3800); if(btn){ btn.disabled=false; btn.innerHTML='<span class="coin">'+IC.coin+'</span>Request plan · '+fmt(CAT.plan.cost); } return; }
  const id = data && (Array.isArray(data)?(data[0]&&data[0].request_id):data.request_id);
  showToast('Requested. Matt will build your plan and it\'ll land here.');
  if(id) go({ flow:'plan', req:id }); else go({});
}
async function renderPlanDeliverable(view, reqId){
  const r = await getRequest(reqId);
  if(!r){ view.innerHTML = convTop('Not found','',null)+'<div class="empty-note">That plan could not be loaded.</div>'; return; }
  const owner = ownerActive();
  if(r.status==='delivered' && r.response && r.response.text){
    view.innerHTML = convTop('Your direction plan','From Matt · delivered',null)
      + '<div style="max-width:720px"><div class="rendered">'+escHtml(r.response.text)+'</div></div>';
    return;
  }
  // not delivered yet
  const input = escHtml([r.body&&r.body.working_on, r.body&&r.body.aim, r.body&&r.body.extra].filter(Boolean).join('\n\n'));
  if(owner){
    view.innerHTML = convTop('Build a plan for '+escHtml((r.email||'').split('@')[0]),'From '+escHtml(r.email),null)
      + '<div style="max-width:720px"><div class="empty-note" style="margin-bottom:16px"><b>What they told you</b><br><span style="white-space:pre-wrap">'+input+'</span></div>'
      + '<div class="composer-wrap"><textarea id="reply-'+r.id+'" style="min-height:220px" placeholder="Write the plan…"></textarea><div class="composer-row"><button class="send" onclick="deliverThread(\''+r.id+'\')">Send plan & charge '+r.cost+'</button></div></div></div>';
  } else {
    view.innerHTML = convTop('Your direction plan','Matt is building it',null)
      + '<div style="max-width:680px"><div class="empty-note" style="margin-bottom:14px"><b>What you told Matt</b><br><span style="white-space:pre-wrap">'+input+'</span></div>'
      + '<div class="msg-hint">Matt is building your plan. You\'ll get a notification when it\'s ready.</div></div>';
  }
}

(async function(){
  const { data: { session } } = await db.auth.getSession();
  if(!session){ window.location.href = "/"; return; }
  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];
  myAvatar = (ae && ae.avatar_url) || null;
  try{ const { data: pr } = await db.rpc("get_profile_row"); myMemberKey = (Array.isArray(pr)?pr[0]:pr)?.member_key || null; }catch(_){ }
  // Initialise the shared composer plumbing (image/file upload) used by the question flow.
  try{ if(window.initCommentsSystem) initCommentsSystem({ db, auth:{ email:myEmail, name:myName, avatarUrl:(ae && ae.avatar_url)||null, isAdmin:isOwner() } }); }catch(e){ console.error("initCommentsSystem error:", e); }
  try{ initSharedHeader({ db, myEmail, myName, isAdmin: isOwner(), activePage:"hub", avatarUrl:(ae && ae.avatar_url)||null }); }catch(e){ console.error("initSharedHeader error:", e); }
  document.getElementById("app-main").style.display = "block";

})();
