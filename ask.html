<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ask · The Practice Room</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- shared composer plumbing (image/file upload) reused by the question flow -->
  <script src="/shared-comments.js?v=20260910a"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3.5.0/dist/mux-player.mjs"></script>
  <style>
  /* ===== Ask page: its own dark immersive ground over the shared header ===== */
  html{ background:#0b0b0e; }
  body.hub-mode{ background:#0b0b0e; }
  /* One continuous ground + the top-right indigo wash, exactly like the dashboard:
     the glow lives on the BODY (fixed, behind everything); the header and main are
     transparent and sit above it, so the same ground shows through the whole page. */
  body.hub-mode::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(150% 100% at 100% 0%, rgba(99,102,241,.15), transparent 82%); }
  body.hub-mode #app-header{ background:transparent !important; border-bottom:none !important; box-shadow:none !important; position:relative; z-index:1; }
  /* Full-bleed like the dashboard: style.css caps <main> at 1400px centered; drop
     that so the Ask page runs edge to edge with the rail pinned to the side. */
  body.hub-mode #app-main{ background:transparent !important; position:relative; z-index:1; max-width:none !important; margin:0 !important; padding:0 !important; }
  #ask{
    position:relative; min-height:70vh; color:#e9e8ee;
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    --card:#1a1a20; --raised:#24242b; --hair:rgba(255,255,255,.07); --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.18);
    --head:#f4f1ec; --muted:#9594a0; --faint:#6a6972; --gold:#f5c518; --golds:#eac64f;
    --body:#e9e8ee; --green:#34d399; --blue:#60a5fa; --pink:#f472b6; --purple:#a78bfa; --voice:'Fraunces',Georgia,serif;
  }
  #ask *{ box-sizing:border-box; }
  #ask a{ color:inherit; text-decoration:none; }
  .ask-wrap{ position:relative; z-index:1; max-width:none; margin:0; padding:24px clamp(18px,3.6vw,44px) 90px; }

  .eyb{ font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:700; }
  .ask-h1{ font-family:var(--voice); font-size:2.1rem; font-weight:500; color:var(--head); line-height:1.04; margin:8px 0 0; text-wrap:balance; }

  /* layout: main + rail */
  .lay{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:34px; align-items:start; }
  /* The hub's main column is a size container so its grids (Popular answers,
     the store) break on the COLUMN's width, not the viewport. Keyed to the
     viewport they stayed 2-up and squashed while the rail sat beside them, then
     the rail dropped and the column went wide but kept breaking at the wrong
     point. As a container they go 1-up when the column is actually narrow
     (squashed beside the rail, or mobile) and back to 2-up when it is wide
     (rail dropped below, or full desktop). */
  .askmain{ container-type:inline-size; container-name:askmain; }
  /* focused flows read better capped; the page stays full-bleed, content sits left */
  .lay-narrow{ grid-template-columns:minmax(0,1fr) 320px; max-width:1120px; }
  /* Match the dashboard community rail: the header is static and scrolls away, so
     the rail sticks near the top (22px) and rises to fill the header's space. */
  .rail{ position:sticky; top:22px; align-self:start; display:flex; flex-direction:column; gap:18px; }
  @media(max-width:1100px){
    .lay,.lay-narrow{ grid-template-columns:1fr; }
    .rail{ position:static; }
    .ask-h1{ font-size:1.6rem; }
    /* the store balance pill is redundant on mobile (the wallet is up top) */
    .store-bal{ display:none; }
    /* wallet + how it works up top on mobile; Your requests stays lower in the rail */
    .m-wallet{ display:block; margin:18px 0 0; }
    .m-how{ display:block; margin:16px 0 0; }
    .rail .wallet, .rail .how-panel{ display:none; }
  }

  /* FIND: search + browse the room */
  .find{ margin:22px 0 0; background:linear-gradient(180deg,#191920,#141418); border:1px solid var(--line2); border-radius:20px; padding:18px; box-shadow:0 24px 60px -36px rgba(0,0,0,.9); }
  .find-s{ display:flex; align-items:center; gap:13px; background:#0e0e12; border:1px solid var(--line2); border-radius:13px; padding:15px 16px; }
  .find-s > svg{ width:21px; height:21px; color:var(--muted); flex:0 0 auto; }
  .find-s input{ flex:1; min-width:0; background:none; border:0; outline:0; color:var(--head); font-family:'Inter',sans-serif; font-size:1.02rem; }
  .find-s input::placeholder{ color:var(--faint); }
  .find-go{ flex:0 0 auto; width:40px; height:40px; border-radius:10px; border:0; background:var(--gold); color:#17130a; display:grid; place-items:center; cursor:pointer; }
  .find-go svg{ width:19px; height:19px; }
  .browse{ margin:15px 0 0; }
  .browse-t{ font-size:.76rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
  .browse-all{ font-size:.8rem; font-weight:600; color:var(--gold); }
  .comm{ display:flex; align-items:center; gap:12px; margin:14px 0 0; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:13px; }
  .comm .cic{ width:34px; height:34px; flex:0 0 auto; border-radius:10px; background:var(--raised); color:var(--blue); display:grid; place-items:center; }
  .comm .cic svg{ width:17px; height:17px; }
  .comm b{ color:var(--head); font-weight:600; }
  .comm .free{ margin-left:8px; font-size:.62rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--green); }
  .comm-sub{ font-size:.78rem; color:var(--muted); margin-top:2px; }
  .comm .go{ margin-left:auto; color:var(--muted); }
  .comm .go svg{ width:18px; height:18px; }

  /* SEARCH RESULTS */
  .results-h{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:2px 2px 12px; }
  .results-t{ font-size:.82rem; color:var(--muted); min-width:0; }
  .results-t b{ color:var(--head); font-weight:600; }
  .results-clear{ font-size:.8rem; font-weight:600; color:var(--gold); cursor:pointer; background:none; border:0; padding:0; flex:0 0 auto; }
  .rlist{ display:flex; flex-direction:column; gap:10px; }
  .rcard{ display:flex; gap:14px; align-items:stretch; padding:11px; border:1px solid var(--line); border-radius:14px; background:var(--card); text-decoration:none; transition:border-color .16s, transform .16s, background .16s; }
  .rcard:hover{ border-color:var(--line2); background:#1f1f26; transform:translateY(-1px); }
  .rcard-th{ position:relative; flex:0 0 132px; aspect-ratio:16/10; border-radius:9px; overflow:hidden; background:radial-gradient(120% 120% at 25% 15%,#2b2b38,#16161d); display:grid; place-items:center; }
  .rcard-th img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .rcard-th .pl{ position:relative; z-index:1; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.28); display:grid; place-items:center; }
  .rcard-th .pl svg{ width:13px; height:13px; color:#fff; margin-left:2px; }
  .rcard-ts{ position:absolute; z-index:2; bottom:6px; right:6px; font-size:.6rem; font-weight:700; background:rgba(0,0,0,.78); color:#fff; padding:2px 6px; border-radius:5px; font-variant-numeric:tabular-nums; }
  .rcard-b{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .rcard-src{ font-size:.62rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .rcard-t{ font-size:.92rem; font-weight:600; color:var(--head); line-height:1.3; margin:5px 0 4px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; overflow:hidden; }
  .rcard-snip{ font-size:.82rem; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .rcard-snip mark{ background:none; color:var(--golds); font-weight:600; }
  .rtl{ position:relative; height:6px; border-radius:999px; background:rgba(255,255,255,.1); margin:10px 0 5px; }
  .rtl-seg{ position:absolute; top:0; bottom:0; min-width:5px; background:linear-gradient(90deg,var(--gold),var(--golds)); border-radius:999px; box-shadow:0 0 10px -1px var(--gold); }
  .rtl-lab{ display:flex; justify-content:space-between; font-size:.64rem; color:var(--faint); font-variant-numeric:tabular-nums; }
  .rtl-lab .at{ color:var(--golds); font-weight:600; }
  .rcard-sk{ height:84px; border-radius:14px; border:1px solid var(--line); background:linear-gradient(100deg,#17171c 30%,#1e1e25 50%,#17171c 70%); background-size:200% 100%; animation:rsk 1.1s ease-in-out infinite; }
  @keyframes rsk{ 0%{background-position:160% 0} 100%{background-position:-60% 0} }
  .rmore{ width:100%; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:7px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; padding:11px; color:var(--body); font-family:'Inter',sans-serif; font-size:.82rem; font-weight:600; cursor:pointer; transition:border-color .16s, background .16s; }
  .rmore:hover{ border-color:var(--line2); background:rgba(255,255,255,.07); }
  .rmore svg{ width:15px; height:15px; }
  .results-empty{ padding:24px 18px; text-align:center; color:var(--muted); font-size:.88rem; line-height:1.55; border:1px dashed var(--line); border-radius:14px; }
  .results-empty b{ color:var(--head); }
  @media(max-width:980px){ .rcard-th{ flex-basis:104px; } }

  /* POPULAR Q&A (four worked examples) */
  .qa-h{ display:flex; align-items:baseline; justify-content:space-between; margin:0 0 12px; }
  .qa-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .qa{ display:block; padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--card); text-decoration:none; transition:border-color .16s, transform .16s, background .16s; }
  .qa:hover{ border-color:var(--line2); background:#1f1f26; transform:translateY(-1px); }
  .qa-q{ display:flex; gap:9px; align-items:flex-start; color:var(--head); font-size:.95rem; font-weight:600; line-height:1.32; }
  .qa-qi{ width:16px; height:16px; color:var(--gold); flex:0 0 auto; margin-top:2px; }
  .qa-ans{ display:flex; gap:11px; margin-top:12px; }
  .qa-th{ position:relative; flex:0 0 104px; aspect-ratio:16/10; border-radius:8px; overflow:hidden; background:radial-gradient(120% 120% at 25% 15%,#2b2b38,#16161d); display:grid; place-items:center; }
  .qa-th img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .qa-play{ position:relative; z-index:1; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.28); display:grid; place-items:center; }
  .qa-play svg{ width:12px; height:12px; color:#fff; margin-left:2px; }
  .qa-b{ flex:1; min-width:0; }
  .qa-src{ font-size:.6rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:4px; }
  .qa-snip{ font-size:.8rem; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
  .qa-snip mark{ background:none; color:var(--golds); font-weight:600; }
  /* STORE */
  .store-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:44px 0 18px; }
  .store-eyb{ font-size:.7rem; letter-spacing:.17em; text-transform:uppercase; color:var(--golds); font-weight:700; }
  .store-title{ font-family:var(--voice); font-size:1.6rem; font-weight:600; color:var(--head); line-height:1.1; margin:9px 0 0; }
  .store-bal{ display:inline-flex; align-items:center; gap:8px; flex:0 0 auto; background:var(--card); border:1px solid var(--line2); border-radius:999px; padding:9px 15px; font-size:.92rem; color:var(--head); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .store-bal .coin{ width:18px; height:18px; }
  .store-bal small{ color:var(--muted); font-weight:400; font-size:.82rem; }
  .store{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
  /* 720px is the main column's own width, not the viewport: below it the column
     is too narrow for two cards (squashed beside the rail, or mobile) so both
     grids go one-per-row and the store header stacks.
     This block MUST stay below .qa-grid, .store and .store-head: @container adds
     no specificity, so sitting above them it lost to them at every width and the
     store never collapsed while Popular answers did. */
  @container askmain (max-width:720px){
    .qa-grid{ grid-template-columns:1fr; }
    .store{ grid-template-columns:1fr; }
    .store-head{ flex-direction:column; align-items:flex-start; gap:12px; }
  }
  /* owner view-as-member: a floating corner control, so it never pushes the page
     or changes the layout the member actually sees. */
  .owner-bar{ position:fixed; right:18px; bottom:18px; z-index:400; display:inline-flex; align-items:center; gap:11px; background:rgba(22,22,27,.94); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid var(--line2); border-radius:999px; padding:8px 10px 8px 15px; font-size:.82rem; color:var(--golds); box-shadow:0 16px 44px -18px rgba(0,0,0,.9); max-width:calc(100vw - 36px); }
  .owner-bar svg{ width:16px; height:16px; flex:0 0 auto; }
  .owner-bar b{ color:var(--head); font-weight:600; }
  .owner-bar button{ flex:0 0 auto; background:transparent; border:1px solid var(--line2); color:#e9e8ee; border-radius:999px; padding:6px 12px; font:inherit; font-size:.8rem; font-weight:600; cursor:pointer; }
  .owner-bar.preview{ color:#9ecbff; border-color:rgba(96,165,250,.4); }
  .sitem{ position:relative; overflow:hidden; background:linear-gradient(180deg,#1b1b22,#151519); border-radius:18px; padding:18px; box-shadow:inset 0 0 0 1px var(--hair), 0 18px 44px -30px rgba(0,0,0,.95); display:flex; flex-direction:column; min-height:176px; min-width:0; cursor:pointer; text-align:left; border:0; font:inherit; color:inherit; transition:transform .16s, box-shadow .16s; }
  .sitem:hover{ transform:translateY(-3px); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--oc) 34%, var(--hair)), 0 26px 54px -26px rgba(0,0,0,1); }
  .sitem::before{ content:""; position:absolute; top:-44px; right:-30px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb,var(--oc) 18%, transparent), transparent 70%); pointer-events:none; }
  .sitem-top{ display:flex; align-items:center; gap:12px; position:relative; }
  .sitem-ic{ width:46px; height:46px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb,var(--oc) 16%, var(--card)); color:var(--oc); box-shadow:0 0 0 1px color-mix(in srgb,var(--oc) 32%, transparent); }
  .sitem-ic svg{ width:23px; height:23px; }
  .sitem-arrow{ margin-left:auto; color:var(--faint); opacity:0; transform:translateX(-4px); transition:opacity .16s, transform .16s; }
  .sitem:hover .sitem-arrow{ opacity:1; transform:none; }
  .sitem-arrow svg{ width:19px; height:19px; }
  .sitem-n{ font-family:var(--voice); font-size:1.14rem; font-weight:500; color:var(--head); line-height:1.2; margin:13px 0 0; }
  .sitem-v{ font-size:.85rem; color:var(--muted); line-height:1.45; margin:5px 0 0; }
  .sitem-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:auto; padding-top:15px; }
  .price{ display:inline-flex; align-items:center; gap:7px; font-family:var(--voice); font-size:1.12rem; color:var(--golds); font-variant-numeric:tabular-nums; }
  .coin{ display:inline-grid; place-items:center; width:19px; height:19px; border-radius:50%; flex:0 0 auto; background:radial-gradient(circle at 34% 30%,#ffe7a0,#f5c518 55%,#c7960f); box-shadow:inset 0 -1px 2px rgba(120,80,0,.45),inset 0 1px 2px rgba(255,255,255,.4); }
  .coin svg{ width:11px; height:11px; color:#6a4e06; }
  .sitem-need{ font-size:.72rem; color:var(--faint); margin-left:8px; }
  .buy{ border:0; border-radius:11px; padding:10px 17px; font:inherit; font-size:.86rem; font-weight:600; cursor:pointer; background:var(--gold); color:#17130a; white-space:nowrap; }
  .buy.ghost{ background:transparent; color:#e9e8ee; box-shadow:inset 0 0 0 1px var(--line2); }
  .sitem.cant{ opacity:.74; cursor:default; }
  .sitem.cant:hover{ transform:none; border-color:var(--line); }
  /* store card demo: one inline SVG per feature, drawn on a 4:3 viewBox so
     the whole graphic scales with the card instead of its parts squashing. */
  .sitem-demo{ margin-top:14px; box-sizing:border-box; width:100%; aspect-ratio:4 / 3; border-radius:14px; background:linear-gradient(180deg,#131318,#0d0d11); box-shadow:inset 0 0 0 1px var(--hair); overflow:hidden; }
  .sitem-demo svg{ display:block; width:100%; height:100%; }

  /* wallet rail */
  .wallet{ background:linear-gradient(180deg,#201d16,#17161b); border-radius:18px; padding:18px; box-shadow:inset 0 0 0 1px rgba(245,197,24,.18); }
  .w-k{ font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:700; }
  .w-bal{ display:flex; align-items:center; gap:11px; margin:11px 0 0; }
  .w-coin{ width:36px; height:36px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 34% 30%,#ffe7a0,#f5c518 55%,#c7960f); box-shadow:inset 0 -2px 4px rgba(120,80,0,.4),inset 0 2px 4px rgba(255,255,255,.4); }
  .w-coin svg{ width:19px; height:19px; color:#6a4e06; }
  .w-n{ font-family:var(--voice); font-size:2.1rem; font-weight:500; color:var(--head); line-height:1; font-variant-numeric:tabular-nums; }
  .w-u{ font-size:.9rem; color:var(--muted); }
  .w-nudge{ font-size:.82rem; color:var(--body); line-height:1.5; margin:13px 0 0; }
  .w-nudge b{ color:var(--golds); font-weight:600; }
  .w-info{ font-size:.78rem; font-weight:600; color:var(--gold); margin:13px 0 0; display:inline-block; cursor:pointer; }
  .panel{ background:var(--card); border-radius:16px; padding:17px; box-shadow:inset 0 0 0 1px var(--hair); }
  .panel-h{ font-family:var(--voice); font-size:1.05rem; font-weight:600; color:var(--head); margin:0 0 13px; }
  .how-step{ display:flex; gap:12px; align-items:flex-start; margin-bottom:13px; }
  .how-step:last-child{ margin-bottom:0; }
  .how-num{ width:23px; height:23px; flex:0 0 auto; border-radius:50%; background:var(--raised); color:var(--golds); font-size:.74rem; font-weight:700; display:grid; place-items:center; }
  .how-tx{ font-size:.85rem; color:var(--muted); line-height:1.45; }
  .how-tx b{ color:var(--head); font-weight:600; }
  .req{ padding:12px 2px; border-top:1px solid var(--hair); display:block; cursor:pointer; }
  .req:first-of-type{ border-top:0; padding-top:0; }
  .req-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .req-n{ font-size:.86rem; font-weight:600; color:var(--head); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .req-st{ font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }
  .req-st.wait{ color:var(--faint); }
  .req-st.done{ color:var(--golds); }
  .req-s{ font-size:.76rem; color:var(--faint); margin-top:3px; }
  .reqs-empty{ font-size:.84rem; color:var(--faint); line-height:1.5; padding:12px 2px 0; }
  .m-wallet,.m-how{ display:none; }

  /* owner queue */
  .queue{ margin:26px 0 34px; }
  .queue-h{ font-family:var(--voice); font-size:1.3rem; font-weight:600; color:var(--head); margin:0 0 4px; }
  .queue-sub{ font-size:.85rem; color:var(--muted); margin:0 0 15px; }
  .qreq{ background:var(--card); border-radius:14px; padding:15px; box-shadow:inset 0 0 0 1px var(--hair); margin-bottom:12px; }
  .qreq-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .qreq-who{ font-size:.86rem; font-weight:600; color:var(--head); }
  .qreq-k{ font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
  .qreq-q{ font-size:.92rem; color:#d7d6de; line-height:1.55; white-space:pre-wrap; margin-bottom:10px; }
  .qreq textarea{ width:100%; background:var(--raised); border:1px solid var(--line2); border-radius:10px; color:var(--head); font:inherit; font-size:.9rem; padding:10px; resize:vertical; min-height:70px; }

  /* conversation / flow pages */
  /* Sticky bar: the app header scrolls away, so this becomes the thing that
     stays. Negative side margins match .ask-wrap's padding so the hairline
     reaches both edges instead of stopping short of them. */
  .conv-top{ position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:13px;
             margin:0 calc(-1 * clamp(18px,3.6vw,44px)) 18px; padding:14px clamp(18px,3.6vw,44px) 13px;
             background:rgba(11,11,14,.86); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
             border-bottom:1px solid var(--hair); }
  .back{ width:34px; height:34px; flex:0 0 auto; border-radius:10px; display:grid; place-items:center; color:var(--muted); background:var(--card); border:1px solid var(--line); cursor:pointer; }
  .back svg{ width:18px; height:18px; }

  .msg{ display:flex; gap:13px; align-items:flex-start; margin-bottom:18px; }
  .msg-av{ width:38px; height:38px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; font-weight:600; font-size:.86rem; background:linear-gradient(135deg,#f5c518,#b8791a); color:#2a1800; font-family:var(--voice); }
  .msg-av.me{ background:linear-gradient(135deg,#3a3a46,#24242b); color:#e9e8ee; }

  .msg-who span{ color:var(--faint); font-weight:400; margin-left:7px; }
  .bubble{ background:var(--card); border:1px solid var(--hair); border-radius:4px 16px 16px 16px; padding:14px 16px; font-size:.95rem; line-height:1.55; color:#e9e8ee; max-width:560px; white-space:pre-wrap; }
  .msg-hint{ font-size:.8rem; color:var(--faint); margin:2px 0 12px; }

  .composer-wrap{ background:var(--raised); border:1px solid var(--line2); border-radius:18px; padding:14px 15px; box-shadow:0 20px 50px -24px rgba(0,0,0,.9); }
  /* field-sizing is the native autogrow; _taGrow() covers browsers without it. */
  .composer-wrap textarea{ width:100%; min-height:92px; max-height:40vh; background:none; border:0; outline:0; resize:none; field-sizing:content; overflow-y:auto; color:var(--head); font-family:'Inter',sans-serif; font-size:1rem; line-height:1.55; }
  .composer-wrap textarea::placeholder{ color:var(--faint); }
  .composer-row{ display:flex; align-items:center; gap:9px; margin-top:10px; flex-wrap:wrap; }
  .attach{ display:inline-flex; align-items:center; gap:7px; font-size:.8rem; font-weight:500; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 12px; cursor:pointer; }
  .attach.soon{ opacity:.6; cursor:default; }
  .attach svg{ width:15px; height:15px; }
  .send{ margin-left:auto; display:inline-flex; align-items:center; gap:9px; border:0; border-radius:12px; padding:11px 18px; font:inherit; font-size:.92rem; font-weight:700; cursor:pointer; background:var(--gold); color:#17130a; }
  .send:disabled{ opacity:.6; cursor:default; }
  .composer-note{ font-size:.78rem; color:var(--faint); text-align:center; margin:10px 0 0; }

  /* Conversation shell. Chat gets its full-bleed by going position:fixed and
     hiding the header, sidebar and tab bar; that is right for a room you sit in,
     wrong for sending one question, so the member keeps their navigation here.
     The header is static in hub-mode and scrolls away, so the page scrolls
     normally and the composer is sticky inside it. --ask-hdr and --conv-top are
     measured at boot because both are real elements, not guesses. */
  .conv{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:0 34px;
         grid-template-areas:"thread rail" "composer rail"; grid-template-rows:1fr auto;
         max-width:1120px;
         min-height:calc(100dvh - var(--ask-hdr,64px) - var(--conv-top,78px) - 54px); }
  .conv-thread{ grid-area:thread; padding-top:4px; min-width:0; }
  .conv > .rail{ grid-area:rail; }
  /* --ask-nav is the mobile tab bar, measured: at bottom:0 the composer sat on
     top of it. --ask-safe is zeroed when that bar exists, because the bar
     already clears the home indicator and adding the inset twice leaves a gap. */
  .conv-composer{ grid-area:composer; position:sticky; bottom:var(--ask-nav,0px); z-index:4;
                  padding:14px 0 calc(16px + var(--ask-safe, env(safe-area-inset-bottom,0px)));
                  background:linear-gradient(180deg, rgba(11,11,14,0), #0b0b0e 30%); }
  .conv-composer .composer-note{ text-align:left; }
  /* On a phone the rail must sit ABOVE the composer: dropped below the send
     button, the privacy line and the context are never read. */
  @media(max-width:1100px){
    /* Stacked, the rail goes FIRST. Between the thread and the composer it was
       permanently under the sticky composer and never read; above the thread it
       is the first thing seen, which is where reassurance belongs on something
       private you are paying for. Forcing the thread to fill the viewport also
       pushed it down, so the stacked shell sizes to its content. */
    .conv{ grid-template-columns:1fr; grid-template-areas:"rail" "thread" "composer";
           grid-template-rows:auto 1fr auto; gap:0; min-height:0; }
    .conv > .rail{ margin:0 0 16px; }
    .conv-composer{ padding-top:10px; }
    /* A 92px box plus its row and note took over a third of a phone screen and
       pushed the conversation under it. It still grows as they write. */
    .conv-composer .composer-wrap textarea{ min-height:64px; }
  }

  /* ══ Question flow: full-bleed immersive conversation (aq- namespace) ══════════

  body.ask-flow #app-header,
  body.ask-flow #sh-mob-bottom-bar,
  body.ask-flow #sh-mob-subnav,
  body.ask-flow #sh-sidebar{ display:none !important; }

  body.ask-flow .ask-wrap{ padding:0 !important; }

  /* The sheet is a mobile-only affordance: once the window is wide enough for the

  @media(min-width:901px){ .aq-sheet-ov{ display:none !important; } }

<script>
// ── Configuration ─────────────────────────────────────────────────────────────
const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNER_EMAIL   = "matthew@matthewcawood.com";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
});

let myEmail = "";
let myName  = "";
let myMemberKey = null;   // resolved at boot; member_key-scoped RPCs (member_card_*) need it
let myAvatar = null;   // the signed-in member's own avatar (from allowed_emails)
let mattAvatar = null, _mattLoaded = false;   // Matt's real avatar, read from the member directory
async function ensureMattIdentity(){
  if(_mattLoaded) return;
  _mattLoaded = true;
  try{ const { data } = await db.rpc('member_directory');
    const o = (data||[]).find(function(x){ return x && x.is_owner; });
    if(o && o.avatar_url) mattAvatar = o.avatar_url;
  }catch(_){ }
}
let _balance = null;

// ── Utilities ─────────────────────────────────────────────────────────────────
function escHtml(str){ return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function showToast(msg, duration){ if(duration===undefined) duration=3500; const el=document.getElementById("toast"); el.textContent=msg; el.classList.add("visible"); setTimeout(function(){ el.classList.remove("visible"); }, duration); }
function redirectToRoot(){ window.location.href = "/"; }
function isOwner(){ return myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase(); }
function fmt(n){ return (typeof n==="number") ? n.toLocaleString() : "—"; }

async function ensureFreshToken(){
  try{
    const { data: { session } } = await db.auth.getSession();
    if(!session) return false;
    const expiresAt = session.expires_at * 1000;
    if(Date.now() > expiresAt - 5*60*1000){ const { error } = await db.auth.refreshSession(); if(error) return false; }
    return true;
  } catch(e){ return false; }
}
async function requireAuth(){ const ok = await ensureFreshToken(); if(!ok){ await db.auth.signOut().catch(function(){}); redirectToRoot(); } return ok; }
document.addEventListener("visibilitychange", async function(){ if(document.visibilityState!=="visible") return; const ok=await ensureFreshToken(); if(!ok){ await db.auth.signOut().catch(function(){}); redirectToRoot(); } });

// ── Icons ─────────────────────────────────────────────────────────────────────
const IC = {
  coin: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  lock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  piece: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
  photo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>',
  video: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>'
};

// ── Catalogue ─────────────────────────────────────────────────────────────────
const CAT = {
  question: { cost:500,   oc:'#60a5fa', live:true,  cta:'Ask', name:'A private question',
    val:'Ask Matt anything about your playing. A considered written reply, just for you.',
    ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>' },
  feedback: { cost:1000,  oc:'#34d399', live:true,  cta:'Send', name:'Feedback on a recording',
    val:'Send a video and your score. Matt marks up exactly what to change.',
    ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/></svg>' },
  plan: { cost:3000,      oc:'#f5c518', live:true,  cta:'Get a plan', name:'A direction plan',
    val:'Matt maps your next few weeks toward your goal, from what you\'ve been practising.',
    ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>' },
  lesson: { cost:18000,   oc:'#f472b6', live:false, cta:'Book', name:'A 1:1 lesson with Matt',
    val:'A private 30-minute lesson, live and one to one.',
    ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2"/></svg>' }
};
const KIND_LABEL = { question:'Private question', feedback:'Feedback', plan:'Direction plan', lesson:'1:1 lesson' };

// ── Credits data ──────────────────────────────────────────────────────────────
async function loadBalance(){
  try{ const { data } = await db.rpc('get_my_credits'); const b = Array.isArray(data) ? (data[0] && data[0].balance) : (data && data.balance); if(typeof b==='number') _balance = b; }catch(e){}
}
async function myRequests(){
  try{ const { data } = await db.from('credit_requests').select('*').order('created_at',{ascending:false}); return data || []; }catch(e){ return []; }
}
async function openRequests(){
  try{ const { data } = await db.from('credit_requests').select('*').eq('status','open').order('created_at',{ascending:true}); return data || []; }catch(e){ return []; }
}
async function getRequest(id){
  try{ const { data } = await db.from('credit_requests').select('*').eq('id', id).maybeSingle(); return data || null; }catch(e){ return null; }
}
// ── Spending guards ───────────────────────────────────────────────────────────
// Credits are HELD on send and only charged when Matt replies, so the two
// moments that matter are the door (can they afford it at all?) and the send
// (do they mean it?). _balance is null until the first load: treat unknown as
// allowed, or a slow connection shows a dead store.
function canAfford(cost){ return _balance == null || _balance >= cost; }

let _dlgCb = null;
function _dlgDone(v){
  const m = document.getElementById('ask-dialog'); if(m) m.classList.remove('on');
  const cb = _dlgCb; _dlgCb = null; if(cb) cb(v);
}
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && _dlgCb) _dlgDone(false); });

/* One dialog for both guards. Returns a promise so a caller can simply await it. */
function askDialog(o){
  return new Promise(function(resolve){
    document.getElementById('dlg-h').textContent = o.title;
    document.getElementById('dlg-b').innerHTML = o.body;
    document.getElementById('dlg-fig').innerHTML = o.figures || '';
    document.getElementById('dlg-no').textContent = o.no || 'Not yet';
    document.getElementById('dlg-yes').innerHTML = (o.coin === false ? '' : '<span class="coin">'+IC.coin+'</span>') + (o.yes || 'Confirm');
    _dlgCb = resolve;
    document.getElementById('ask-dialog').classList.add('on');
  });
}

/* Shown instead of opening a flow the member cannot pay for. */
async function needCredits(key){
  const it = CAT[key]; const short = Math.max(0, it.cost - (_balance||0));
  const ok = await askDialog({
    title: 'You need a few more credits',
    body: it.name + ' costs ' + fmt(it.cost) + ' credits. Your practice earns them automatically, so this one is not far off.',
    figures: '<div class="am-fig"><span>You have</span><b>' + fmt(_balance||0) + '</b></div>'
           + '<div class="am-fig"><span>Still needed</span><b>' + fmt(short) + '</b></div>',
    yes: 'How credits work', no: 'Close', coin: false
  });
  if(ok) document.getElementById('earn-modal').classList.add('on');
}

/* Shown on send, once they know what they are asking for. */
function confirmSpend(key){
  const it = CAT[key];
  return askDialog({
    title: 'Send this to Matt?',
    body: 'This holds ' + fmt(it.cost) + ' credits until Matt replies. If he cannot take it, they come straight back to you.',
    figures: '<div class="am-fig"><span>Held now</span><b>' + fmt(it.cost) + '</b></div>'
           + (_balance != null ? '<div class="am-fig"><span>Left after</span><b>' + fmt(Math.max(0, _balance - it.cost)) + '</b></div>' : ''),
    yes: 'Hold ' + fmt(it.cost) + ' and send', no: 'Not yet'
  });
}

async function spend(item, body){
  if(!await requireAuth()) return { error:{ message:'auth' } };
  const { data, error } = await db.rpc('spend_credits', { p_item:item, p_body:body });
  if(!error){ const b = data && (Array.isArray(data) ? (data[0] && data[0].balance) : data.balance); if(typeof b==='number') _balance = b; }
  return { data, error };
}

// ── Owner "view as member" preview ─────────────────────────────────────────────
// Preview-as-member is sticky for the session, not just a URL param: the
// immersive question thread hides the owner bar and is often reached by a fresh
// load (a notification link carries no ?as=member), so a URL-only flag silently
// drops the owner back to owner view mid-test and mis-attributes a follow-up.
function previewingMember(){
  try{ if(sessionStorage.getItem('ask_as') === 'member') return true; }catch(_){}
  return new URLSearchParams(window.location.search).get('as') === 'member';
}
function setPreviewMember(on){
  try{ if(on) sessionStorage.setItem('ask_as','member'); else sessionStorage.removeItem('ask_as'); }catch(_){}
}
function ownerActive(){ return isOwner() && !previewingMember(); }  // owner UI only when NOT previewing
function toggleAs(){
  const on = !previewingMember();
  setPreviewMember(on);                       // sticky for the session
  const sp = new URLSearchParams(window.location.search);
  if(on) sp.set('as','member'); else sp.delete('as');
  const u = new URL(window.location.href); u.search = sp.toString();
  history.pushState({}, "", u); render();
}
function renderOwnerBar(){
  const el = document.getElementById('owner-bar'); if(!el) return;
  if(!isOwner()){ el.innerHTML = ''; return; }
  if(previewingMember()){
    el.innerHTML = '<div class="owner-bar preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>You\'re previewing the page as a member sees it.<button onclick="toggleAs()">Back to owner view</button></div>';
  } else {
    el.innerHTML = '<div class="owner-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 7v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V7z"/></svg>Viewing as <b>Matt</b> (owner).<button onclick="toggleAs()">Preview as a member</button></div>';
  }
}

// ── Router ────────────────────────────────────────────────────────────────────
function go(params){
  const cur = new URLSearchParams(window.location.search);
  const u = new URL(window.location.href);
  u.search = "";
  Object.keys(params||{}).forEach(function(k){ if(params[k]!=null) u.searchParams.set(k, params[k]); });
  const as = cur.get('as'); if(as && !u.searchParams.get('as')) u.searchParams.set('as', as);  // keep the preview mode across navigation
  history.pushState({}, "", u);
  render();
}
window.addEventListener('popstate', render);
// The "What Matt sees" sheet is mobile-only: widening past the rail breakpoint
// closes it so it does not reappear if the window is later narrowed again.
window.addEventListener('resize', function(){ if(window.innerWidth >= 901 && typeof aqCloseSheet === 'function') aqCloseSheet(); });

async function render(){
  const sp = new URLSearchParams(window.location.search);
  const flow = sp.get('flow') || '';
  const req  = sp.get('req') || '';
  await loadBalance();
  renderOwnerBar();
  // The question flow is a full-bleed immersive conversation (chrome hidden); the
  // hub and the other flows keep the app chrome. Toggle before rendering so the
  // layout measures against the right shell.
  document.body.classList.toggle('ask-flow', flow === 'question');
  const view = document.getElementById('ask-view');
  if(flow === 'question')      await renderQuestion(view, req);
  else if(flow === 'feedback') await renderFeedback(view, req);
  else if(flow === 'plan')     await renderPlan(view, req);
  else                         await renderHub(view);
  _measureShell();
}

// ── Hub ───────────────────────────────────────────────────────────────────────
// One system of music, suggested rather than drawn. Two things make a page read
// as music instead of prose: every row runs the FULL width, because a system
// always does, and the row is divided into blocks, which are the bars. A ragged
// right edge is what makes a page look like a document. Real staves and a
// hand-built clef were tried and read as a smudge and a mistake at this size.
// `hl` picks out individual blocks, so a comment marks a few bars, not a line.
function _musicRow(x,y,w,segs,hl,col,op){
  var gap=3,total=0,i;
  for(i=0;i<segs.length;i++) total+=segs[i];

// lines align down the system, exactly as they do on a piano score.
function _system(x,y,w,segs,hl){

       + _musicRow(x,y+12,w,segs,hl,'#4a5059',.42);

// the written comment on the left.
function _pin(cx,cy,n){

       + '<text x="'+cx+'" y="'+(cy+2.3)+'" text-anchor="middle" font-family="Inter,sans-serif"'
       + ' font-size="6.6" font-weight="700" fill="#0b2b20">'+n+'</text>';

// mark can be placed against a known bar rather than by eye.
function _seg(x,w,segs,i){

  for(k=0;k<segs.length;k++) total+=segs[k];

function _timelineHtml(r){
  var dur=Number(r.duration_s)||0;
  if(r.start_seconds==null || !dur) return '';          // dormant until timing exists
  var s=Math.max(0, Number(r.start_seconds)||0);
  var e=(r.end_seconds!=null)?Number(r.end_seconds):Math.min(dur, s+20);
  var left=Math.max(0, Math.min(100, s/dur*100));
  var w=Math.max(1.5, Math.min(100-left, (e-s)/dur*100));
  return '<div class="rtl"><span class="rtl-seg" style="left:'+left.toFixed(2)+'%;width:'+w.toFixed(2)+'%"></span></div>'
    + '<div class="rtl-lab"><span class="at">'+_fmtTs(s)+'</span><span>'+_fmtTs(dur)+'</span></div>';

var _askDebounce=null;
function onSearchLive(q){
  q=(q||'').trim();

  if(q.length < 2){ window._askLastQuery=null; _askDebounce=setTimeout(loadPopular, 120); return; }
  _askDebounce=setTimeout(function(){ onSearch(q, { silent:true }); }, 240);
}
async function onSearch(q, opts){
  q=(q||'').trim(); if(!q) return;
  opts=opts||{};
  if(_askDebounce){ clearTimeout(_askDebounce); _askDebounce=null; }
  var el=document.getElementById('browse'); if(!el) return;
  var input=document.querySelector('.find .find-s input'); if(input && input.value!==q) input.value=q;
  window._askLastQuery=q;
  // On live typing keep the current results in place (just dim) rather than
  // flashing skeletons on every keystroke; show skeletons only on a cold search.
  var hasResults = !!el.querySelector('.rlist');
  if(opts.silent && hasResults){ el.style.opacity='0.55'; }
  else {
    el.innerHTML = _resultsHead('Searching for <b>'+escHtml(q)+'</b>…')
      + '<div class="rlist"><div class="rcard-sk"></div><div class="rcard-sk"></div><div class="rcard-sk"></div></div>';
  }
  try{
    var res = await db.rpc('ask_search', { p_q:q, p_limit:12 });
    if(window._askLastQuery!==q) return; // a newer search superseded this one
    el.style.opacity='';
    if(res.error) throw res.error;
    renderResults(el, q, res.data||[]);
  }catch(e){
    if(window._askLastQuery!==q) return;
    el.style.opacity='';
    el.innerHTML = _resultsHead('Search for <b>'+escHtml(q)+'</b>')
      + '<div class="results-empty">Search is not available right now. <button class="results-clear" style="display:inline" onclick="onSearch(window._askLastQuery)">Try again</button></div>';
  }
}

/* cancel_credit_request has existed since the credits migration and had no
   caller, so the page promised a refund it could not perform. Either side may
   call it while the request is still open: the hold becomes a refund and the
   balance comes back. */
async function cancelRequest(id, mine){
  const ok = await askDialog({
    title: mine ? 'Withdraw this question?' : 'Decline this request?',
    body: mine
      ? 'It will be withdrawn before Matt answers, and the credits it is holding come straight back to you.'
      : 'The member gets the credits back and the request leaves your queue.',
    yes: mine ? 'Withdraw and refund' : 'Decline and refund',
    no: 'Keep it', coin: false
  });
  if(!ok) return;
  if(!await requireAuth()) return;
  const { error } = await db.rpc('cancel_credit_request', { p_id:id });
  if(error){ showToast('Could not do that. ' + (error.message||''), 4000); return; }
  showToast(mine ? 'Withdrawn. Your credits are back.' : 'Declined, and the member has been refunded.');
  await loadBalance();
  render();
}

async function deliver(id){
  const ta = document.getElementById('reply-'+id); const text = ((ta&&ta.value)||'').trim();
  if(text.length<2){ showToast('Write your reply first.', 3000); return; }
  if(!await requireAuth()) return;
  const { error } = await db.rpc('deliver_credit_request', { p_id:id, p_response:{ text:text } });
  if(error){ showToast('Could not deliver. '+(error.message||''), 4000); return; }
  showToast('Delivered. The member has been notified.');
  renderOwnerQueue();
}

function _dayLabel(dateStr){

// The member's own practice, read with their own RLS scope. Degrades gracefully:
// a missing RPC or an empty log simply shows less, never an error.
async function _aqContext(targetEmail){
  const out = { weekMins:0, streak:null, total:0, learning:[], recent:[], libCount:0, libTitles:[] };
  const email = targetEmail || myEmail; const isSelf = !targetEmail;
  try{
    const sevenAgo=new Date(Date.now()-6*864e5); sevenAgo.setHours(0,0,0,0);
    const sevenStr=sevenAgo.toISOString().slice(0,10);
    const [sessRes, collRes, streakRes] = await Promise.all([
      db.rpc('get_my_sessions', { p_email: email }).then(r=>r, ()=>({data:null})),
      isSelf ? db.from('user_collections').select('status, pieces(title,composer), user_pieces(title)').eq('email', email).then(r=>r, ()=>({data:null}))
             : db.rpc('get_user_collection', { p_email: email }).then(r=>r, ()=>({data:null})),
      (isSelf && myMemberKey) ? db.rpc('member_card_streak', { p_member_key: myMemberKey }).then(r=>r, ()=>({data:null})) : Promise.resolve({data:null})
    ]);
    const sessions = Array.isArray(sessRes && sessRes.data) ? sessRes.data : [];
    out.total = sessions.length;
    const pieceMins = {};
    sessions.forEach(function(s){
      if(String(s.session_date||'') >= sevenStr) out.weekMins += (s.duration_minutes||0);
      (s.practice_items||[]).forEach(function(it){
        if(it.item_type==='piece' || it.item_type==='book'){
          const n=String(it.piece_label||it.label||'').trim(); if(!n) return;
          pieceMins[n.toLowerCase()] = (pieceMins[n.toLowerCase()]||0) + (it.duration_minutes||0);
        }
      });
    });
    const recent = sessions.slice().sort(function(a,b){ return String(b.session_date||'').localeCompare(String(a.session_date||'')); }).slice(0,3);
    out.recent = recent.map(function(s){
      const seen={}, names=[];
      (s.practice_items||[]).forEach(function(it){ const n=String(it.piece_label||it.label||'').trim(); const k=n.toLowerCase(); if(n && !seen[k]){ seen[k]=1; names.push(n); } });
      return { date:s.session_date, mins:s.duration_minutes||0, what:names.slice(0,3).join(', '), note:String(s.notes||'').trim() };
    });
    const sk = streakRes && streakRes.data; const skRow = Array.isArray(sk)?sk[0]:sk;
    out.streak = skRow ? (skRow.current_streak!=null?skRow.current_streak:(skRow.streak!=null?skRow.streak:null)) : null;
    const coll = (Array.isArray(collRes && collRes.data) ? collRes.data : []).map(function(r){
      const t=String(r.title||(r.pieces&&r.pieces.title)||(r.user_pieces&&r.user_pieces.title)||'').trim();
      return { title:t, composer:String((r.pieces&&r.pieces.composer)||r.composer||'').trim(), status:r.status };
    }).filter(function(r){ return r.title; });
    out.libCount = coll.length;
    out.libTitles = coll.map(function(r){ return r.title; });
    out.learning = coll.filter(function(r){ return r.status==='learning'; }).map(function(r){
      return { title:r.title, composer:r.composer, mins:pieceMins[r.title.toLowerCase()]||0 };
    }).slice(0,4);
  }catch(e){ }
  return out;
}

  return h;

   context already in front of him. Rows beyond the name are real, so they are
   fetched and filled in after the view paints rather than guessed at render

function contextRail(who){
  return '<div class="rc"><div class="rc-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>What Matt sees</div>'

function _hm(mins){
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return h ? (h + 'h' + (m ? ' ' + m + 'm' : '')) : (m + 'm');
}

/* Their last week and what they have actually been playing. `email` is passed
   only in the owner's view of a thread, where the admin policy lets Matt read
   the member's rows; a member's own call is scoped to them by RLS. */
async function memberContext(email){
  try{
    const since = new Date(Date.now() - 6*864e5).toISOString().slice(0,10);
    let weekQ = db.from('practice_sessions').select('id,duration_minutes').gte('session_date', since);
    let recentQ = db.from('practice_sessions').select('id,session_date').order('session_date',{ascending:false}).limit(25);
    if(email){ weekQ = weekQ.eq('email', email); recentQ = recentQ.eq('email', email); }
    const [wk, rc] = await Promise.all([weekQ, recentQ]);
    const week = wk.data || [];
    const ids = (rc.data || []).map(function(r){ return r.id; });
    const pieces = [];
    if(ids.length){
      const it = await db.from('practice_items').select('session_id,item_type,piece_label,label')
                   .in('session_id', ids).eq('item_type','piece');
      const ord = {}; ids.forEach(function(id,i){ ord[id] = i; });
      const seen = {};
      (it.data || []).slice().sort(function(a,b){ return (ord[a.session_id]||0) - (ord[b.session_id]||0); })
        .forEach(function(r){
          const n = String(r.piece_label || r.label || '').trim();
          const k = n.toLowerCase();
          if(n && !seen[k]){ seen[k] = 1; pieces.push(n); }
        });
    }
    return { sessions: week.length,
             minutes: week.reduce(function(a,s){ return a + (s.duration_minutes || 0); }, 0),
             pieces: pieces.slice(0,3) };
  }catch(e){ return null; }
}

async function renderAqThread(view, reqId){

  if(r.kind!=='question'){ return renderThread(view, reqId, r.kind); }
  const owner = ownerActive();
  const own = String(r.email||'').toLowerCase() === String(myEmail||'').toLowerCase();

  let mName = myName, mAv = myAvatar;
  if(owner && !own){
    try{ const { data } = await db.rpc('get_profile_row', { p_email: r.email }); const row=Array.isArray(data)?data[0]:data; if(row){ mName=row.name||(r.email||'').split('@')[0]; mAv=row.avatar_url||null; } else { mName=(r.email||'').split('@')[0]; mAv=null; } }
    catch(_){ mName=(r.email||'').split('@')[0]; mAv=null; }

  const mFirst = escHtml((String(mName||'').trim().split(/\s+/)[0]) || mName);

  else metaR='<span class="aq-gold">'+fmt(r.cost)+' credits held, awaiting a reply</span>';
  // The full conversation: the question, then the ongoing messages. A legacy
  // request delivered before threads existed kept its reply in `response`, so
  // include that only if it is not already represented in messages.
  const msgs = [{ from:'member', text:String((r.body&&r.body.text)||''), media:(r.body&&r.body.media)||[] }];
  const list = Array.isArray(r.messages) ? r.messages : [];
  if(list.length){ list.forEach(function(m){ msgs.push({ from:m.from, text:String(m.text||''), media:m.media||[] }); }); }
  else if(r.response && r.response.text){ msgs.push({ from:'owner', text:String(r.response.text||''), media:(r.response.media)||[] }); }
  let thread='';
  msgs.forEach(function(m, i){
    const isO = m.from==='owner';

  });
  // The member may send only when it is their turn: after Matt's last message,
  // never twice in a row. The owner can always send.
  const memberTurn = list.length>0 && list[list.length-1].from==='owner';
  if(!owner && !memberTurn && r.status!=='cancelled') thread += '<div class="aq-wait">Matt will reply here, and you\'ll get a notification when he does.</div>';
  if(r.status==='cancelled') thread += '<div class="aq-wait">This question was withdrawn and the '+fmt(r.cost)+' credits refunded.</div>';

  }

    + '<aside class="aq-ctx-col">'+railExtra+'<div class="aq-ctx" id="aq-ctx-host">'+aqContextLoading()+'</div></aside>'
    + '</div>'
    + '<div class="aq-sheet-ov" id="aq-sheet" onclick="if(event.target===this)aqCloseSheet()"><div class="aq-sheet"><div class="aq-grab"></div><div class="aq-sheet-body">'+sheetExtra+'<div id="aq-sheet-ctx">'+aqContextLoading()+'</div></div></div></div>'
    + '</div>';

async function aqThreadSend(id){
  const ta = document.getElementById('aq-reply'); const text = ((ta&&ta.value)||'').trim();
  if(!text){ if(ta) ta.focus(); return; }
  if(!await requireAuth()) return;
  const btn = document.getElementById('aq-reply-send'); if(btn) btn.disabled=true;
  const { error } = await db.rpc('credit_thread_send', { p_id:id, p_text:text, p_as_owner: ownerActive() });
  if(error){ showToast(/wait for a reply/i.test(error.message||'')?'Wait for Matt to reply before sending again.':('Could not send. '+(error.message||'')), 3800); if(btn) btn.disabled=false; return; }
  await loadBalance();
  render();
}

    + '<div class="rc"><div class="rc-foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Private unless you choose to share it.</div></div>';
}
async function submitFeedback(){
  const note = ((document.getElementById('f-note')||{}).value||'').trim();
  const piece = ((document.getElementById('f-piece')||{}).value||'').trim();
  if(note.length<5 && piece.length<2){ showToast('Tell Matt what to look at first.', 3000); return; }
  if(!await confirmSpend('feedback')) return;
  const btn = document.getElementById('f-send'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  const { data, error } = await spend('feedback', { note:note, piece:piece });
  if(error){ showToast(/insufficient/i.test(error.message||'')?'You do not have enough credits.':'Could not send. Please try again.', 3800); if(btn){ btn.disabled=false; btn.innerHTML='<span class="coin">'+IC.coin+'</span>Send to Matt · '+fmt(CAT.feedback.cost); } return; }
  const id = data && (Array.isArray(data)?(data[0]&&data[0].request_id):data.request_id);
  showToast('Sent to Matt. You\'ll get a notification when your feedback is ready.');
  if(id) go({ flow:'feedback', req:id }); else go({});
}

// ── Plan flow ──────────────────────────────────────────────────────────────────
async function renderPlan(view, reqId){
  if(!reqId && !canAfford(CAT.plan.cost)) return renderShortfall(view, 'plan');
  if(reqId){ return renderPlanDeliverable(view, reqId); }
  const cost = CAT.plan.cost;
  view.innerHTML = convTop('Request a direction plan','Matt maps your next few weeks',cost)
    + '<div class="lay-narrow lay"><div>'
    + '<p class="lead">Tell me where you\'re trying to get to, in your own words. The more you tell me the better, and your practice is pulled in below, so there\'s nothing to look up.</p>'
    + '<div class="fsec"><div class="fl">What have you been working on lately?</div><textarea class="ta big" id="p-working" placeholder="e.g. Mostly Clair de Lune, plus scales a couple of times a week. The left hand in the middle keeps tripping me up."></textarea></div>'
    + '<div class="fsec"><div class="fl">What are you hoping to get to?</div><textarea class="ta big" id="p-aim" placeholder="e.g. I\'d love to play Clair de Lune confidently from memory, and generally feel more fluent."></textarea></div>'
    + '<div class="fsec"><div class="fl">Anything else that would help? <span style="color:var(--faint);font-weight:400;text-transform:none;letter-spacing:0">Optional</span></div><textarea class="ta" id="p-extra" placeholder="Your time each week, a deadline, or anything you\'ve been finding frustrating."></textarea></div>'
    + '<div class="fsec"><div class="fl">Pulled in from your practice</div><div class="known"><div class="known-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>Included for Matt automatically</div><p class="known-s">So you don\'t have to look any of it up. He builds the plan on top of it.</p>'
      + '<div class="kgrid"><div class="kitem"><span class="kic" style="color:var(--gold)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 7v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V7z"/></svg></span><div><div class="kk">Member</div><div class="kv">'+escHtml(myName)+'</div></div></div>'
      + '<div class="kitem"><span class="kic" style="color:var(--green)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-6M6 20v-10M18 20V4"/></svg></span><div><div class="kk">Practice</div><div class="kv">From your log</div></div></div></div></div></div>'
    + '<div style="display:flex;align-items:center;gap:14px;margin-top:4px"><div class="composer-note" style="text-align:left;margin:0">Holds '+fmt(cost)+' credits until your plan arrives.<br>'+balanceAfter(cost)+'</div>'
      + '<button class="send" id="p-send" onclick="submitPlan()"><span class="coin">'+IC.coin+'</span>Request plan · '+fmt(cost)+'</button></div>'
    + '</div><aside class="rail"><div class="rc"><div class="rc-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9 16.5 14 18.5 21 12 17 5.5 21 7.5 14 2 9 9 9"/></svg>What you\'ll get</div>'
      + '<div class="rc-step"><span class="rc-num">·</span><span class="rc-tx"><b>A week-by-week plan</b> toward your goal.</span></div>'
      + '<div class="rc-step"><span class="rc-num">·</span><span class="rc-tx"><b>What to practise</b> each session.</span></div>'
      + '<div class="rc-step"><span class="rc-num">·</span><span class="rc-tx"><b>The pieces and exercises</b> that get you there.</span></div></div></aside></div>';
}
async function submitPlan(){
  const working = ((document.getElementById('p-working')||{}).value||'').trim();
  const aim = ((document.getElementById('p-aim')||{}).value||'').trim();
  const extra = ((document.getElementById('p-extra')||{}).value||'').trim();
  if(aim.length<5 && working.length<5){ showToast('Tell Matt a little about what you want.', 3000); return; }
  if(!await confirmSpend('plan')) return;
  const btn = document.getElementById('p-send'); if(btn){ btn.disabled=true; btn.textContent='Sending…'; }
  const body = { working_on:working, aim:aim, extra:extra, text:(aim || working) };
  const { data, error } = await spend('plan', body);
  if(error){ showToast(/insufficient/i.test(error.message||'')?'You do not have enough credits.':'Could not send. Please try again.', 3800); if(btn){ btn.disabled=false; btn.innerHTML='<span class="coin">'+IC.coin+'</span>Request plan · '+fmt(CAT.plan.cost); } return; }
  const id = data && (Array.isArray(data)?(data[0]&&data[0].request_id):data.request_id);
  showToast('Requested. Matt will build your plan and it\'ll land here.');
  if(id) go({ flow:'plan', req:id }); else go({});
}
async function renderPlanDeliverable(view, reqId){
  const r = await getRequest(reqId);
  if(!r){ view.innerHTML = convTop('Not found','',null)+'<div class="empty-note">That plan could not be loaded.</div>'; return; }
  const owner = ownerActive();
  if(r.status==='delivered' && r.response && r.response.text){
    view.innerHTML = convTop('Your direction plan','From Matt · delivered',null)
      + '<div style="max-width:720px"><div class="rendered">'+escHtml(r.response.text)+'</div></div>';
    return;
  }
  // not delivered yet
  const input = escHtml([r.body&&r.body.working_on, r.body&&r.body.aim, r.body&&r.body.extra].filter(Boolean).join('\n\n'));
  if(owner){
    view.innerHTML = convTop('Build a plan for '+escHtml((r.email||'').split('@')[0]),'From '+escHtml(r.email),null)
      + '<div style="max-width:720px"><div class="empty-note" style="margin-bottom:16px"><b>What they told you</b><br><span style="white-space:pre-wrap">'+input+'</span></div>'
      + '<div class="composer-wrap"><textarea id="reply-'+r.id+'" style="min-height:220px" placeholder="Write the plan…"></textarea><div class="composer-row"><button class="send" onclick="deliverThread(\''+r.id+'\')">Send plan & charge '+r.cost+'</button></div></div></div>';
  } else {
    view.innerHTML = convTop('Your direction plan','Matt is building it',null)
      + '<div style="max-width:680px"><div class="empty-note" style="margin-bottom:14px"><b>What you told Matt</b><br><span style="white-space:pre-wrap">'+input+'</span></div>'
      + '<div class="msg-hint">Matt is building your plan. You\'ll get a notification when it\'s ready.</div></div>';
  }
}

// ── Auth & boot ────────────────────────────────────────────────────────────────
(async function(){
  const { data: { session } } = await db.auth.getSession();
  if(!session){ window.location.href = "/"; return; }
  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];
  myAvatar = (ae && ae.avatar_url) || null;
  try{ const { data: pr } = await db.rpc("get_profile_row"); myMemberKey = (Array.isArray(pr)?pr[0]:pr)?.member_key || null; }catch(_){ }
  // Initialise the shared composer plumbing (image/file upload) used by the question flow.
  try{ if(window.initCommentsSystem) initCommentsSystem({ db, auth:{ email:myEmail, name:myName, avatarUrl:(ae && ae.avatar_url)||null, isAdmin:isOwner() } }); }catch(e){ console.error("initCommentsSystem error:", e); }
  try{ initSharedHeader({ db, myEmail, myName, isAdmin: isOwner(), activePage:"hub", avatarUrl:(ae && ae.avatar_url)||null }); }catch(e){ console.error("initSharedHeader error:", e); }
  document.getElementById("app-main").style.display = "block";
  document.getElementById("app-header").style.display = "";
  try{ await render(); }catch(e){ console.error(e); }
  const el = document.getElementById("loading-screen"); if(el) el.style.display = "none";
})();
