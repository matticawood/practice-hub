// ── Score clipper: render the score (PDF via PDF.js, or an image), drag a box,
// crop to an image, upload it, and drop it inline into the feedback. ─────────────
async function fbOpenClipper(){
  if(!_fbScore){ const inp=document.getElementById('fb-attach-score'); if(inp) inp.click(); return; }  // attach first
  const ov=document.getElementById('fb-clipper'); if(!ov) return;
  _fbClipSel=null; _fbClipShown=false; ov.classList.add('open');
  ov.innerHTML = '<div class="fb-clip-sheet"><div class="fb-clip-head"><span>Drag the frame over the passage, scale it from the corner, then clip</span><button class="fb-clip-x" onclick="fbCloseClipper()" aria-label="Close">'+AQ_X+'</button></div><div class="fb-clip-body" id="fb-clip-body"><div class="fb-clip-loading">Loading the score…</div></div><div class="fb-clip-foot"><button class="fb-clip-btn" id="fb-clip-go" onclick="fbClipGo()" disabled>Clip this frame</button></div></div>';
  const bodyEl=document.getElementById('fb-clip-body');
  const src=_fbScore.url || _fbScore._localUrl;
  const name=_fbScore.name||src||'';
  const isImg=_fbScore.type==='image' || /\.(png|jpe?g|gif|webp|bmp)($|\?)/i.test(name);
  const isPdf=!isImg && (/\.pdf($|\?)/i.test(name) || _fbScore.mime==='application/pdf' || /\.pdf($|\?)/i.test(src||''));
  if(!isImg && !isPdf){
    // A .docx/.musicxml etc. can't be clipped; let the owner attach a PDF or photo.
    fbCloseClipper(); showToast('That score file can\'t be clipped. Attach a PDF or a photo to clip from.', 4200);
    const inp=document.getElementById('fb-attach-score'); if(inp){ _fbScore=null; inp.click(); } return;
  }
  try{
    bodyEl.innerHTML='';
    if(isPdf){
      const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs');
      pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';
      const pdf=await pdfjs.getDocument(src).promise;
      for(let i=1;i<=pdf.numPages;i++){
        const page=await pdf.getPage(i);
        const base=page.getViewport({scale:1});
        const scale=Math.min(2.5,(bodyEl.clientWidth-24)/base.width);
        const vp=page.getViewport({scale:scale});
        const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height; c.className='fb-clip-canvas';
        bodyEl.appendChild(c);
        await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
        fbClipAttach(c);
      }
    } else {
      const img=new Image(); img.crossOrigin='anonymous';
      await new Promise(function(res,rej){ img.onload=res; img.onerror=rej; img.src=src; });
      const scale=Math.min(2.5,(bodyEl.clientWidth-24)/img.naturalWidth);
      const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*scale); c.height=Math.round(img.naturalHeight*scale); c.className='fb-clip-canvas';
      bodyEl.appendChild(c); c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      fbClipAttach(c);
    }
  }catch(e){ bodyEl.innerHTML='<div class="fb-clip-loading">Could not open the score for clipping. '+escHtml(e&&e.message||'')+'</div>'; }
}
// An aspect-locked frame the owner positions over the score and scales from its corner.
// The shape never changes, so every clip lands in an identical box, and the dimmed area
// outside the frame shows exactly what will be captured.
function fbClipAttach(canvas){
  const wrap=document.createElement('div'); wrap.className='fb-clip-cwrap';
  canvas.parentNode.insertBefore(wrap, canvas); wrap.appendChild(canvas);
  const frame=document.createElement('div'); frame.className='fb-clip-frame'; frame.style.display='none';
  frame.innerHTML='<div class="fb-clip-h"></div>'; wrap.appendChild(frame);
  const handle=frame.querySelector('.fb-clip-h');
  const cw=function(){ return canvas.clientWidth; }, chh=function(){ return canvas.clientHeight; };
  const clamp=function(x,y,w){
    w=Math.min(Math.max(60,w), cw()); let h=w/FB_CLIP_AR;
    if(h>chh()){ h=chh(); w=h*FB_CLIP_AR; }
    x=Math.max(0,Math.min(x, cw()-w)); y=Math.max(0,Math.min(y, chh()-h));
    return { x:x, y:y, w:w, h:h };
  };
  const apply=function(r){
    frame.style.left=r.x+'px'; frame.style.top=r.y+'px'; frame.style.width=r.w+'px'; frame.style.height=r.h+'px';
    const sxr=canvas.width/cw(), syr=canvas.height/chh();
    _fbClipSel={ canvas:canvas, x:r.x*sxr, y:r.y*syr, w:r.w*sxr, h:r.h*syr };
    const go=document.getElementById('fb-clip-go'); if(go) go.disabled=false;
  };
  const show=function(cx,cy){
    Array.prototype.forEach.call(document.querySelectorAll('.fb-clip-frame'), function(f){ if(f!==frame) f.style.display='none'; });
    let w=Math.min(cw()*0.74, cw()); let h=w/FB_CLIP_AR; if(h>chh()){ h=chh()*0.74; w=h*FB_CLIP_AR; }
    const x=(cx==null? (cw()-w)/2 : cx-w/2), y=(cy==null? (chh()-h)/2 : cy-h/2);
    frame.style.display='block'; apply(clamp(x,y,w));
  };
  const ptxy=function(e){ const rc=canvas.getBoundingClientRect(); return { x:(e.touches?e.touches[0].clientX:e.clientX)-rc.left, y:(e.touches?e.touches[0].clientY:e.clientY)-rc.top }; };
  const startMove=function(e){
    e.stopPropagation(); const p=ptxy(e); const ox=parseFloat(frame.style.left)||0, oy=parseFloat(frame.style.top)||0, w=parseFloat(frame.style.width)||0;
    const mv=function(ev){ const q=ptxy(ev); apply(clamp(ox+(q.x-p.x), oy+(q.y-p.y), w)); if(ev.cancelable)ev.preventDefault(); };
    const up=function(){ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up); window.removeEventListener('touchmove',mv); window.removeEventListener('touchend',up); };
    window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up); window.addEventListener('touchmove',mv,{passive:false}); window.addEventListener('touchend',up); if(e.cancelable)e.preventDefault();
  };
  const startScale=function(e){
    e.stopPropagation(); const p=ptxy(e); const ox=parseFloat(frame.style.left)||0, oy=parseFloat(frame.style.top)||0, ow=parseFloat(frame.style.width)||0;
    const mv=function(ev){ const q=ptxy(ev); apply(clamp(ox,oy, ow+(q.x-p.x))); if(ev.cancelable)ev.preventDefault(); };
    const up=function(){ window.removeEventListener('mousemove',mv); window.removeEventListener('mouseup',up); window.removeEventListener('touchmove',mv); window.removeEventListener('touchend',up); };
    window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up); window.addEventListener('touchmove',mv,{passive:false}); window.addEventListener('touchend',up); if(e.cancelable)e.preventDefault();
  };
  canvas.addEventListener('mousedown', function(e){ const p=ptxy(e); show(p.x,p.y); startMove(e); });
  canvas.addEventListener('touchstart', function(e){ const p=ptxy(e); show(p.x,p.y); startMove(e); }, {passive:false});
  frame.addEventListener('mousedown', startMove); frame.addEventListener('touchstart', startMove, {passive:false});
  handle.addEventListener('mousedown', startScale); handle.addEventListener('touchstart', startScale, {passive:false});
  if(!_fbClipShown){ _fbClipShown=true; show(); }   // show a ready frame on the first page
}
async function fbClipGo(){
  if(!_fbClipSel) return; const s=_fbClipSel;
  const out=document.createElement('canvas'); out.width=Math.max(1,Math.round(s.w)); out.height=Math.max(1,Math.round(s.h));
  out.getContext('2d').drawImage(s.canvas, s.x, s.y, s.w, s.h, 0, 0, out.width, out.height);
  const btn=document.getElementById('fb-clip-go'); if(btn){ btn.disabled=true; btn.textContent='Clipping…'; }
  out.toBlob(async function(blob){
    try{
      if(!blob) throw new Error('empty');
      const path='feedback-clips/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.png';
      const up=await db.storage.from('community-uploads').upload(path, blob, { contentType:'image/png' });
      if(up.error) throw up.error;
      const url=db.storage.from('community-uploads').getPublicUrl(path).data.publicUrl;
      fbPtAttachClip(url);
      fbCloseClipper();
    }catch(e){ showToast('Could not save the clip. '+(e&&e.message||''), 3800); const b=document.getElementById('fb-clip-go'); if(b){ b.disabled=false; b.textContent='Clip this frame'; } }
  }, 'image/png');
}
function fbCloseClipper(){ const ov=document.getElementById('fb-clipper'); if(ov){ ov.classList.remove('open'); ov.innerHTML=''; } _fbClipSel=null; }

      + '<div style="max-width:680px"><div class="empty-note" style="margin-bottom:14px"><b>What you told Matt</b><br><span style="white-space:pre-wrap">'+input+'</span></div>'
      + '<div class="msg-hint">Matt is building your plan. You\'ll get a notification when it\'s ready.</div></div>';
  }
}

// ── Auth & boot ────────────────────────────────────────────────────────────────
(async function(){
  const { data: { session } } = await db.auth.getSession();
  if(!session){ window.location.href = "/"; return; }
  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];
  myAvatar = (ae && ae.avatar_url) || null;
  try{ const { data: pr } = await db.rpc("get_profile_row"); myMemberKey = (Array.isArray(pr)?pr[0]:pr)?.member_key || null; }catch(_){ }
  // Initialise the shared composer plumbing (image/file upload) used by the question flow.
  try{ if(window.initCommentsSystem) initCommentsSystem({ db, auth:{ email:myEmail, name:myName, avatarUrl:(ae && ae.avatar_url)||null, isAdmin:isOwner() } }); }catch(e){ console.error("initCommentsSystem error:", e); }
  try{ initSharedHeader({ db, myEmail, myName, isAdmin: isOwner(), activePage:"hub", avatarUrl:(ae && ae.avatar_url)||null }); }catch(e){ console.error("initSharedHeader error:", e); }
  document.getElementById("app-main").style.display = "block";
  document.getElementById("app-header").style.display = "";
  try{ await render(); }catch(e){ console.error(e); }
  const el = document.getElementById("loading-screen"); if(el) el.style.display = "none";
})();
</script>
