<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Ask · The Practice Room</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- shared composer plumbing (image/file upload) reused by the question flow -->
  <script src="/shared-comments.js?v=20260910a"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3.5.0/dist/mux-player.mjs"></script>
  <style>
  /* ===== Ask page: its own dark immersive ground over the shared header ===== */
  html{ background:#0b0b0e; }
  body.hub-mode{ background:#0b0b0e; }
  /* One continuous ground + the top-right indigo wash, exactly like the dashboard:
     the glow lives on the BODY (fixed, behind everything); the header and main are
     transparent and sit above it, so the same ground shows through the whole page. */
  body.hub-mode::before{ content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(150% 100% at 100% 0%, rgba(99,102,241,.15), transparent 82%); }
  body.hub-mode #app-header{ background:transparent !important; border-bottom:none !important; box-shadow:none !important; position:relative; z-index:1; }
  /* Full-bleed like the dashboard: style.css caps <main> at 1400px centered; drop
     that so the Ask page runs edge to edge with the rail pinned to the side. */
  body.hub-mode #app-main{ background:transparent !important; position:relative; z-index:1; max-width:none !important; margin:0 !important; padding:0 !important; }
  #ask{
    position:relative; min-height:70vh; color:#e9e8ee;
    font-family:'Inter',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    --card:#1a1a20; --raised:#24242b; --hair:rgba(255,255,255,.07); --line:rgba(255,255,255,.12); --line2:rgba(255,255,255,.18);
    --head:#f4f1ec; --muted:#9594a0; --faint:#6a6972; --gold:#f5c518; --golds:#eac64f;
    --body:#e9e8ee; --green:#34d399; --blue:#60a5fa; --pink:#f472b6; --purple:#a78bfa; --voice:'Fraunces',Georgia,serif;
  }
  #ask *{ box-sizing:border-box; }
  #ask a{ color:inherit; text-decoration:none; }
  .ask-wrap{ position:relative; z-index:1; max-width:none; margin:0; padding:24px clamp(18px,3.6vw,44px) 90px; }

  .eyb{ font-size:.7rem; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); font-weight:700; }
  .ask-h1{ font-family:var(--voice); font-size:2.1rem; font-weight:500; color:var(--head); line-height:1.04; margin:8px 0 0; text-wrap:balance; }

  /* layout: main + rail */
  .lay{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:34px; align-items:start; }
  /* The hub's main column is a size container so its grids (Popular answers,
     the store) break on the COLUMN's width, not the viewport. Keyed to the
     viewport they stayed 2-up and squashed while the rail sat beside them, then
     the rail dropped and the column went wide but kept breaking at the wrong
     point. As a container they go 1-up when the column is actually narrow
     (squashed beside the rail, or mobile) and back to 2-up when it is wide
     (rail dropped below, or full desktop). */
  .askmain{ container-type:inline-size; container-name:askmain; }
  /* focused flows read better capped; the page stays full-bleed, content sits left */
  .lay-narrow{ grid-template-columns:minmax(0,1fr) 320px; max-width:1120px; }
  /* Match the dashboard community rail: the header is static and scrolls away, so
     the rail sticks near the top (22px) and rises to fill the header's space. */
  .rail{ position:sticky; top:22px; align-self:start; display:flex; flex-direction:column; gap:18px; }
  @media(max-width:1100px){
    .lay,.lay-narrow{ grid-template-columns:1fr; }
    .rail{ position:static; }
    .ask-h1{ font-size:1.6rem; }
    /* the store balance pill is redundant on mobile (the wallet is up top) */
    .store-bal{ display:none; }
    /* wallet + how it works up top on mobile; Your requests stays lower in the rail */
    .m-wallet{ display:block; margin:18px 0 0; }
    .m-how{ display:block; margin:16px 0 0; }
    .rail .wallet, .rail .how-panel{ display:none; }
  }

  /* FIND: search + browse the room */
  .find{ margin:22px 0 0; background:linear-gradient(180deg,#191920,#141418); border:1px solid var(--line2); border-radius:20px; padding:18px; box-shadow:0 24px 60px -36px rgba(0,0,0,.9); }
  .find-s{ display:flex; align-items:center; gap:13px; background:#0e0e12; border:1px solid var(--line2); border-radius:13px; padding:15px 16px; }
  .find-s > svg{ width:21px; height:21px; color:var(--muted); flex:0 0 auto; }
  .find-s input{ flex:1; min-width:0; background:none; border:0; outline:0; color:var(--head); font-family:'Inter',sans-serif; font-size:1.02rem; }
  .find-s input::placeholder{ color:var(--faint); }
  .find-go{ flex:0 0 auto; width:40px; height:40px; border-radius:10px; border:0; background:var(--gold); color:#17130a; display:grid; place-items:center; cursor:pointer; }
  .find-go svg{ width:19px; height:19px; }
  .browse{ margin:15px 0 0; }
  .browse-t{ font-size:.76rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
  .browse-all{ font-size:.8rem; font-weight:600; color:var(--gold); }
  .comm{ display:flex; align-items:center; gap:12px; margin:14px 0 0; padding:14px 16px; background:var(--card); border:1px solid var(--line); border-radius:13px; }
  .comm .cic{ width:34px; height:34px; flex:0 0 auto; border-radius:10px; background:var(--raised); color:var(--blue); display:grid; place-items:center; }
  .comm .cic svg{ width:17px; height:17px; }
  .comm b{ color:var(--head); font-weight:600; }
  .comm .free{ margin-left:8px; font-size:.62rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--green); }
  .comm-sub{ font-size:.78rem; color:var(--muted); margin-top:2px; }
  .comm .go{ margin-left:auto; color:var(--muted); }
  .comm .go svg{ width:18px; height:18px; }

  /* SEARCH RESULTS */
  .results-h{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:2px 2px 12px; }
  .results-t{ font-size:.82rem; color:var(--muted); min-width:0; }
  .results-t b{ color:var(--head); font-weight:600; }
  .results-clear{ font-size:.8rem; font-weight:600; color:var(--gold); cursor:pointer; background:none; border:0; padding:0; flex:0 0 auto; }
  .rlist{ display:flex; flex-direction:column; gap:10px; }
  .rcard{ display:flex; gap:14px; align-items:stretch; padding:11px; border:1px solid var(--line); border-radius:14px; background:var(--card); text-decoration:none; transition:border-color .16s, transform .16s, background .16s; }
  .rcard:hover{ border-color:var(--line2); background:#1f1f26; transform:translateY(-1px); }
  .rcard-th{ position:relative; flex:0 0 132px; aspect-ratio:16/10; border-radius:9px; overflow:hidden; background:radial-gradient(120% 120% at 25% 15%,#2b2b38,#16161d); display:grid; place-items:center; }
  .rcard-th img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .rcard-th .pl{ position:relative; z-index:1; width:32px; height:32px; border-radius:50%; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.28); display:grid; place-items:center; }
  .rcard-th .pl svg{ width:13px; height:13px; color:#fff; margin-left:2px; }
  .rcard-ts{ position:absolute; z-index:2; bottom:6px; right:6px; font-size:.6rem; font-weight:700; background:rgba(0,0,0,.78); color:#fff; padding:2px 6px; border-radius:5px; font-variant-numeric:tabular-nums; }
  .rcard-b{ flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  .rcard-src{ font-size:.62rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); }
  .rcard-t{ font-size:.92rem; font-weight:600; color:var(--head); line-height:1.3; margin:5px 0 4px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:1; overflow:hidden; }
  .rcard-snip{ font-size:.82rem; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .rcard-snip mark{ background:none; color:var(--golds); font-weight:600; }
  .rtl{ position:relative; height:6px; border-radius:999px; background:rgba(255,255,255,.1); margin:10px 0 5px; }
  .rtl-seg{ position:absolute; top:0; bottom:0; min-width:5px; background:linear-gradient(90deg,var(--gold),var(--golds)); border-radius:999px; box-shadow:0 0 10px -1px var(--gold); }
  .rtl-lab{ display:flex; justify-content:space-between; font-size:.64rem; color:var(--faint); font-variant-numeric:tabular-nums; }
  .rtl-lab .at{ color:var(--golds); font-weight:600; }
  .rcard-sk{ height:84px; border-radius:14px; border:1px solid var(--line); background:linear-gradient(100deg,#17171c 30%,#1e1e25 50%,#17171c 70%); background-size:200% 100%; animation:rsk 1.1s ease-in-out infinite; }
  @keyframes rsk{ 0%{background-position:160% 0} 100%{background-position:-60% 0} }
  .rmore{ width:100%; margin-top:10px; display:flex; align-items:center; justify-content:center; gap:7px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; padding:11px; color:var(--body); font-family:'Inter',sans-serif; font-size:.82rem; font-weight:600; cursor:pointer; transition:border-color .16s, background .16s; }
  .rmore:hover{ border-color:var(--line2); background:rgba(255,255,255,.07); }
  .rmore svg{ width:15px; height:15px; }
  .results-empty{ padding:24px 18px; text-align:center; color:var(--muted); font-size:.88rem; line-height:1.55; border:1px dashed var(--line); border-radius:14px; }
  .results-empty b{ color:var(--head); }
  @media(max-width:980px){ .rcard-th{ flex-basis:104px; } }

  /* POPULAR Q&A (four worked examples) */
  .qa-h{ display:flex; align-items:baseline; justify-content:space-between; margin:0 0 12px; }
  .qa-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  .qa{ display:block; padding:14px; border:1px solid var(--line); border-radius:14px; background:var(--card); text-decoration:none; transition:border-color .16s, transform .16s, background .16s; }
  .qa:hover{ border-color:var(--line2); background:#1f1f26; transform:translateY(-1px); }
  .qa-q{ display:flex; gap:9px; align-items:flex-start; color:var(--head); font-size:.95rem; font-weight:600; line-height:1.32; }
  .qa-qi{ width:16px; height:16px; color:var(--gold); flex:0 0 auto; margin-top:2px; }
  .qa-ans{ display:flex; gap:11px; margin-top:12px; }
  .qa-th{ position:relative; flex:0 0 104px; aspect-ratio:16/10; border-radius:8px; overflow:hidden; background:radial-gradient(120% 120% at 25% 15%,#2b2b38,#16161d); display:grid; place-items:center; }
  .qa-th img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
  .qa-play{ position:relative; z-index:1; width:28px; height:28px; border-radius:50%; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.28); display:grid; place-items:center; }
  .qa-play svg{ width:12px; height:12px; color:#fff; margin-left:2px; }
  .qa-b{ flex:1; min-width:0; }
  .qa-src{ font-size:.6rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:4px; }
  .qa-snip{ font-size:.8rem; color:var(--muted); line-height:1.5; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
  .qa-snip mark{ background:none; color:var(--golds); font-weight:600; }
  /* STORE */
  .store-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin:44px 0 18px; }
  .store-eyb{ font-size:.7rem; letter-spacing:.17em; text-transform:uppercase; color:var(--golds); font-weight:700; }
  .store-title{ font-family:var(--voice); font-size:1.6rem; font-weight:600; color:var(--head); line-height:1.1; margin:9px 0 0; }
  .store-bal{ display:inline-flex; align-items:center; gap:8px; flex:0 0 auto; background:var(--card); border:1px solid var(--line2); border-radius:999px; padding:9px 15px; font-size:.92rem; color:var(--head); font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .store-bal .coin{ width:18px; height:18px; }
  .store-bal small{ color:var(--muted); font-weight:400; font-size:.82rem; }
  .store{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:15px; }
  /* 720px is the main column's own width, not the viewport: below it the column
     is too narrow for two cards (squashed beside the rail, or mobile) so both
     grids go one-per-row and the store header stacks.
     This block MUST stay below .qa-grid, .store and .store-head: @container adds
     no specificity, so sitting above them it lost to them at every width and the
     store never collapsed while Popular answers did. */
  @container askmain (max-width:720px){
    .qa-grid{ grid-template-columns:1fr; }
    .store{ grid-template-columns:1fr; }
    .store-head{ flex-direction:column; align-items:flex-start; gap:12px; }
  }
  /* owner view-as-member: a floating corner control, so it never pushes the page
     or changes the layout the member actually sees. */
  .owner-bar{ position:fixed; right:18px; bottom:18px; z-index:400; display:inline-flex; align-items:center; gap:11px; background:rgba(22,22,27,.94); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); border:1px solid var(--line2); border-radius:999px; padding:8px 10px 8px 15px; font-size:.82rem; color:var(--golds); box-shadow:0 16px 44px -18px rgba(0,0,0,.9); max-width:calc(100vw - 36px); }
  .owner-bar svg{ width:16px; height:16px; flex:0 0 auto; }
  .owner-bar b{ color:var(--head); font-weight:600; }
  .owner-bar button{ flex:0 0 auto; background:transparent; border:1px solid var(--line2); color:#e9e8ee; border-radius:999px; padding:6px 12px; font:inherit; font-size:.8rem; font-weight:600; cursor:pointer; }
  .owner-bar.preview{ color:#9ecbff; border-color:rgba(96,165,250,.4); }
  /* On mobile the fixed bottom tab bar (z-index 500, ~60px) sits over the owner
     bar's default bottom:18px, so lift it clear and above the bar. */
  @media (max-width: 768px), (orientation: portrait) and (max-width: 1024px) {
    .owner-bar{ bottom: calc(60px + env(safe-area-inset-bottom, 0px) + 14px); z-index: 600; }
  }
  .sitem{ position:relative; overflow:hidden; background:linear-gradient(180deg,#1b1b22,#151519); border-radius:18px; padding:18px; box-shadow:inset 0 0 0 1px var(--hair), 0 18px 44px -30px rgba(0,0,0,.95); display:flex; flex-direction:column; min-height:176px; min-width:0; cursor:pointer; text-align:left; border:0; font:inherit; color:inherit; transition:transform .16s, box-shadow .16s; }
  .sitem:hover{ transform:translateY(-3px); box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--oc) 34%, var(--hair)), 0 26px 54px -26px rgba(0,0,0,1); }
  .sitem::before{ content:""; position:absolute; top:-44px; right:-30px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, color-mix(in srgb,var(--oc) 18%, transparent), transparent 70%); pointer-events:none; }
  .sitem-top{ display:flex; align-items:center; gap:12px; position:relative; }
  .sitem-ic{ width:46px; height:46px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; background:color-mix(in srgb,var(--oc) 16%, var(--card)); color:var(--oc); box-shadow:0 0 0 1px color-mix(in srgb,var(--oc) 32%, transparent); }
  .sitem-ic svg{ width:23px; height:23px; }
  .sitem-arrow{ margin-left:auto; color:var(--faint); opacity:0; transform:translateX(-4px); transition:opacity .16s, transform .16s; }
  .sitem:hover .sitem-arrow{ opacity:1; transform:none; }
  .sitem-arrow svg{ width:19px; height:19px; }
  .sitem-n{ font-family:var(--voice); font-size:1.14rem; font-weight:500; color:var(--head); line-height:1.2; margin:13px 0 0; }
  .sitem-v{ font-size:.85rem; color:var(--muted); line-height:1.45; margin:5px 0 0; }
  .sitem-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:auto; padding-top:15px; }
  .price{ display:inline-flex; align-items:center; gap:7px; font-family:var(--voice); font-size:1.12rem; color:var(--golds); font-variant-numeric:tabular-nums; }
  .coin{ display:inline-grid; place-items:center; width:19px; height:19px; border-radius:50%; flex:0 0 auto; background:radial-gradient(circle at 34% 30%,#ffe7a0,#f5c518 55%,#c7960f); box-shadow:inset 0 -1px 2px rgba(120,80,0,.45),inset 0 1px 2px rgba(255,255,255,.4); }
  .coin svg{ width:11px; height:11px; color:#6a4e06; }
  .sitem-need{ font-size:.72rem; color:var(--faint); margin-left:8px; }
  .buy{ border:0; border-radius:11px; padding:10px 17px; font:inherit; font-size:.86rem; font-weight:600; cursor:pointer; background:var(--gold); color:#17130a; white-space:nowrap; }
  .buy.ghost{ background:transparent; color:#e9e8ee; box-shadow:inset 0 0 0 1px var(--line2); }
  .sitem.cant{ opacity:.74; cursor:default; }
  .sitem.cant:hover{ transform:none; border-color:var(--line); }
  /* store card demo: one inline SVG per feature, drawn on a 4:3 viewBox so
     the whole graphic scales with the card instead of its parts squashing. */
  .sitem-demo{ margin-top:14px; box-sizing:border-box; width:100%; aspect-ratio:4 / 3; border-radius:14px; background:linear-gradient(180deg,#131318,#0d0d11); box-shadow:inset 0 0 0 1px var(--hair); overflow:hidden; }
  .sitem-demo svg{ display:block; width:100%; height:100%; }

  /* wallet rail */
  .wallet{ background:linear-gradient(180deg,#201d16,#17161b); border-radius:18px; padding:18px; box-shadow:inset 0 0 0 1px rgba(245,197,24,.18); }
  .w-k{ font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); font-weight:700; }
  .w-bal{ display:flex; align-items:center; gap:11px; margin:11px 0 0; }
  .w-coin{ width:36px; height:36px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; background:radial-gradient(circle at 34% 30%,#ffe7a0,#f5c518 55%,#c7960f); box-shadow:inset 0 -2px 4px rgba(120,80,0,.4),inset 0 2px 4px rgba(255,255,255,.4); }
  .w-coin svg{ width:19px; height:19px; color:#6a4e06; }
  .w-n{ font-family:var(--voice); font-size:2.1rem; font-weight:500; color:var(--head); line-height:1; font-variant-numeric:tabular-nums; }
  .w-u{ font-size:.9rem; color:var(--muted); }
  .w-nudge{ font-size:.82rem; color:var(--body); line-height:1.5; margin:13px 0 0; }
  .w-nudge b{ color:var(--golds); font-weight:600; }
  .w-info{ font-size:.78rem; font-weight:600; color:var(--gold); margin:13px 0 0; display:inline-block; cursor:pointer; }
  .panel{ background:var(--card); border-radius:16px; padding:17px; box-shadow:inset 0 0 0 1px var(--hair); }
  .panel-h{ font-family:var(--voice); font-size:1.05rem; font-weight:600; color:var(--head); margin:0 0 13px; }
  .how-step{ display:flex; gap:12px; align-items:flex-start; margin-bottom:13px; }
  .how-step:last-child{ margin-bottom:0; }
  .how-num{ width:23px; height:23px; flex:0 0 auto; border-radius:50%; background:var(--raised); color:var(--golds); font-size:.74rem; font-weight:700; display:grid; place-items:center; }
  .how-tx{ font-size:.85rem; color:var(--muted); line-height:1.45; }
  .how-tx b{ color:var(--head); font-weight:600; }
  .req{ padding:12px 2px; border-top:1px solid var(--hair); display:block; cursor:pointer; }
  .req:first-of-type{ border-top:0; padding-top:0; }
  .req-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .req-n{ font-size:.86rem; font-weight:600; color:var(--head); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .req-st{ font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; white-space:nowrap; }
  .req-st.wait{ color:var(--faint); }
  .req-st.done{ color:var(--golds); }
  .req-s{ font-size:.76rem; color:var(--faint); margin-top:3px; }
  .reqs-empty{ font-size:.84rem; color:var(--faint); line-height:1.5; padding:12px 2px 0; }
  .m-wallet,.m-how{ display:none; }

  /* owner queue */
  .queue{ margin:26px 0 34px; }
  .queue-h{ font-family:var(--voice); font-size:1.3rem; font-weight:600; color:var(--head); margin:0 0 4px; }
  .queue-sub{ font-size:.85rem; color:var(--muted); margin:0 0 15px; }
  .qreq{ background:var(--card); border-radius:14px; padding:15px; box-shadow:inset 0 0 0 1px var(--hair); margin-bottom:12px; }
  .qreq-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .qreq-who{ font-size:.86rem; font-weight:600; color:var(--head); }
  .qreq-k{ font-size:.68rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--faint); }
  .qreq-q{ font-size:.92rem; color:#d7d6de; line-height:1.55; white-space:pre-wrap; margin-bottom:10px; }
  .qreq textarea{ width:100%; background:var(--raised); border:1px solid var(--line2); border-radius:10px; color:var(--head); font:inherit; font-size:.9rem; padding:10px; resize:vertical; min-height:70px; }
  .qreq .buy{ margin-top:9px; }

  /* conversation / flow pages */
  /* Sticky bar: the app header scrolls away, so this becomes the thing that
     stays. Negative side margins match .ask-wrap's padding so the hairline
     reaches both edges instead of stopping short of them. */
  .conv-top{ position:sticky; top:0; z-index:6; display:flex; align-items:center; gap:13px;
             margin:0 calc(-1 * clamp(18px,3.6vw,44px)) 18px; padding:14px clamp(18px,3.6vw,44px) 13px;
             background:rgba(11,11,14,.86); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
             border-bottom:1px solid var(--hair); }
  .back{ width:34px; height:34px; flex:0 0 auto; border-radius:10px; display:grid; place-items:center; color:var(--muted); background:var(--card); border:1px solid var(--line); cursor:pointer; }
  .back svg{ width:18px; height:18px; }
  .conv-t{ font-family:var(--voice); font-size:1.3rem; font-weight:600; color:var(--head); line-height:1.15; }
  .conv-s{ font-size:.78rem; color:var(--faint); display:flex; align-items:center; gap:6px; margin-top:2px; }
  .conv-s svg{ width:12px; height:12px; }
  .conv-cost{ margin-left:auto; flex:0 0 auto; display:inline-flex; align-items:center; gap:7px; font-size:.86rem; font-weight:600; color:var(--golds); background:rgba(245,197,24,.1); border:1px solid rgba(245,197,24,.28); border-radius:999px; padding:7px 13px; font-variant-numeric:tabular-nums; }

  .msg{ display:flex; gap:13px; align-items:flex-start; margin-bottom:18px; }
  .msg-av{ width:38px; height:38px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; font-weight:600; font-size:.86rem; background:linear-gradient(135deg,#f5c518,#b8791a); color:#2a1800; font-family:var(--voice); }
  .msg-av.me{ background:linear-gradient(135deg,#3a3a46,#24242b); color:#e9e8ee; }
  .msg-who{ font-size:.8rem; font-weight:600; color:var(--head); margin-bottom:5px; }
  .msg-who span{ color:var(--faint); font-weight:400; margin-left:7px; }
  .bubble{ background:var(--card); border:1px solid var(--hair); border-radius:4px 16px 16px 16px; padding:14px 16px; font-size:.95rem; line-height:1.55; color:#e9e8ee; max-width:560px; white-space:pre-wrap; }
  .msg-hint{ font-size:.8rem; color:var(--faint); margin:2px 0 12px; }

  .composer-wrap{ background:var(--raised); border:1px solid var(--line2); border-radius:18px; padding:14px 15px; box-shadow:0 20px 50px -24px rgba(0,0,0,.9); }
  /* field-sizing is the native autogrow; _taGrow() covers browsers without it. */
  .composer-wrap textarea{ width:100%; min-height:92px; max-height:40vh; background:none; border:0; outline:0; resize:none; field-sizing:content; overflow-y:auto; color:var(--head); font-family:'Inter',sans-serif; font-size:1rem; line-height:1.55; }
  .composer-wrap textarea::placeholder{ color:var(--faint); }
  .composer-row{ display:flex; align-items:center; gap:9px; margin-top:10px; flex-wrap:wrap; }
  .attach{ display:inline-flex; align-items:center; gap:7px; font-size:.8rem; font-weight:500; color:var(--muted); background:var(--card); border:1px solid var(--line); border-radius:999px; padding:7px 12px; cursor:pointer; }
  .attach.soon{ opacity:.6; cursor:default; }
  .attach svg{ width:15px; height:15px; }
  .send{ margin-left:auto; display:inline-flex; align-items:center; gap:9px; border:0; border-radius:12px; padding:11px 18px; font:inherit; font-size:.92rem; font-weight:700; cursor:pointer; background:var(--gold); color:#17130a; }
  .send:disabled{ opacity:.6; cursor:default; }
  .composer-note{ font-size:.78rem; color:var(--faint); text-align:center; margin:10px 0 0; }

  /* Conversation shell. Chat gets its full-bleed by going position:fixed and
     hiding the header, sidebar and tab bar; that is right for a room you sit in,
     wrong for sending one question, so the member keeps their navigation here.
     The header is static in hub-mode and scrolls away, so the page scrolls
     normally and the composer is sticky inside it. --ask-hdr and --conv-top are
     measured at boot because both are real elements, not guesses. */
  .conv{ display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:0 34px;
         grid-template-areas:"thread rail" "composer rail"; grid-template-rows:1fr auto;
         max-width:1120px;
         min-height:calc(100dvh - var(--ask-hdr,64px) - var(--conv-top,78px) - 54px); }
  .conv-thread{ grid-area:thread; padding-top:4px; min-width:0; }
  .conv > .rail{ grid-area:rail; }
  /* --ask-nav is the mobile tab bar, measured: at bottom:0 the composer sat on
     top of it. --ask-safe is zeroed when that bar exists, because the bar
     already clears the home indicator and adding the inset twice leaves a gap. */
  .conv-composer{ grid-area:composer; position:sticky; bottom:var(--ask-nav,0px); z-index:4;
                  padding:14px 0 calc(16px + var(--ask-safe, env(safe-area-inset-bottom,0px)));
                  background:linear-gradient(180deg, rgba(11,11,14,0), #0b0b0e 30%); }
  .conv-composer .composer-note{ text-align:left; }
  /* On a phone the rail must sit ABOVE the composer: dropped below the send
     button, the privacy line and the context are never read. */
  @media(max-width:1100px){
    /* Stacked, the rail goes FIRST. Between the thread and the composer it was
       permanently under the sticky composer and never read; above the thread it
       is the first thing seen, which is where reassurance belongs on something
       private you are paying for. Forcing the thread to fill the viewport also
       pushed it down, so the stacked shell sizes to its content. */
    .conv{ grid-template-columns:1fr; grid-template-areas:"rail" "thread" "composer";
           grid-template-rows:auto 1fr auto; gap:0; min-height:0; }
    .conv > .rail{ margin:0 0 16px; }
    .conv-composer{ padding-top:10px; }
    /* A 92px box plus its row and note took over a third of a phone screen and
       pushed the conversation under it. It still grows as they write. */
    .conv-composer .composer-wrap textarea{ min-height:64px; }
  }

  .fl{ font-size:.74rem; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--faint); margin:0 0 10px; }

  .rc-h{ display:flex; align-items:center; gap:8px; font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:700; margin-bottom:12px; }
  .rc-h svg{ width:14px; height:14px; }
  .rc-row{ display:flex; align-items:center; gap:11px; padding:11px 0; border-top:1px solid var(--hair); }
  .rc-row:first-of-type{ border-top:0; }
  .rc-ic{ width:30px; height:30px; flex:0 0 auto; border-radius:9px; background:var(--raised); display:grid; place-items:center; color:var(--blue); }
  .rc-ic svg{ width:16px; height:16px; }

  .rc-tx{ font-size:.84rem; color:var(--muted); line-height:1.45; }

  @media(max-width:620px){ .ups{ grid-template-columns:1fr; } }
  .updrop{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:9px; min-height:150px; border:1.5px dashed var(--line2); border-radius:15px; background:rgba(255,255,255,.02); color:var(--muted); text-align:center; padding:22px; }
  .updrop .d-ic{ width:40px; height:40px; border-radius:50%; background:var(--raised); display:grid; place-items:center; color:var(--golds); }
  .updrop .d-ic svg{ width:19px; height:19px; }

  .updrop .d-s{ font-size:.76rem; color:var(--faint); }
  .updrop .soon-b{ font-size:.6rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); background:rgba(255,255,255,.05); border-radius:5px; padding:3px 7px; margin-top:4px; }

  .rendered{ font-size:.98rem; line-height:1.7; color:#e9e8ee; white-space:pre-wrap; }
  .empty-note{ font-size:.92rem; color:var(--muted); line-height:1.6; background:var(--card); border-radius:14px; padding:16px; box-shadow:inset 0 0 0 1px var(--hair); }

  /* earn modal */
  .ask-modal{ position:fixed; inset:0; z-index:9000; background:rgba(5,5,8,.68); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; padding:18px; }
  .ask-modal.on{ display:flex; }
  .ask-modal-card{ width:100%; max-width:420px; background:#15151a; border:1px solid rgba(255,255,255,.1); border-radius:18px; padding:20px; color:#e9e8ee; }
  .ask-modal-h{ font-family:var(--voice); font-size:1.2rem; font-weight:600; color:#f4f1ec; margin-bottom:8px; }
  .ask-modal-b{ font-size:.92rem; color:#cfcdd6; line-height:1.6; }
  .ask-modal-x{ float:right; background:none; border:0; color:#9594a0; font-size:1.5rem; line-height:1; cursor:pointer; }
  /* Dialog buttons. The modal is a body child, outside #ask, so it cannot use
     the #ask custom properties: colours here are literal, as the rules above are. */
  .am-fig{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:15px; padding:12px 14px; background:#101014; border:1px solid rgba(255,255,255,.07); border-radius:12px; font-size:.86rem; color:#9594a0; }
  .am-fig b{ color:#f4f1ec; font-weight:600; font-variant-numeric:tabular-nums; }
  .am-row{ display:flex; gap:10px; margin-top:18px; }
  .am-row button{ flex:1; border-radius:12px; padding:11px 14px; font:inherit; font-size:.9rem; font-weight:700; cursor:pointer; white-space:nowrap; transition:filter .15s, border-color .15s, color .15s; }
  .am-row .am-yes{ flex:1.6; }
  /* Secondary actions: withdrawing and declining are deliberately quiet, they
     are not what the page is for. */
  .ghostbtn{ display:inline-flex; align-items:center; gap:7px; background:transparent; border:1px solid var(--line2);
             color:var(--muted); border-radius:11px; padding:10px 15px; font:inherit; font-size:.86rem; font-weight:600;
             cursor:pointer; transition:border-color .15s, color .15s; }
  .ghostbtn:hover{ border-color:var(--border-2,rgba(255,255,255,.34)); color:var(--head); }
  .linkbtn{ background:none; border:0; padding:0; margin:2px 0 0; font:inherit; font-size:.8rem; color:var(--faint);
            text-decoration:underline; text-underline-offset:3px; cursor:pointer; }
  .linkbtn:hover{ color:var(--muted); }
  .qreq-acts{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .am-no{ background:transparent; border:1px solid rgba(255,255,255,.18); color:#cfcdd6; }
  .am-no:hover{ border-color:rgba(255,255,255,.34); color:#f4f1ec; }
  .am-yes{ display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; background:#f5c518; color:#17130a; }
  .am-yes:hover{ filter:brightness(.96); }
  .am-yes .coin{ width:16px; height:16px; }
  /* ══ Question flow: full-bleed immersive conversation (aq- namespace) ══════════
     Mirrors chat.html's "chrome away" idiom. Toggled by body.ask-flow (only while
     the question flow is active); the hub keeps its chrome. */
  body.ask-flow #app-header,
  body.ask-flow #sh-mob-bottom-bar,
  body.ask-flow #sh-mob-subnav,
  body.ask-flow #sh-sidebar{ display:none !important; }
  body.ask-flow{ padding:0 !important; overflow:hidden; }
  body.ask-flow #owner-bar{ display:none !important; }
  body.ask-flow .ask-wrap{ padding:0 !important; }

  .aq-flow{ position:fixed; inset:0; z-index:40; background:#0b0b0e;
    --purple:#a78bfa; color:var(--body);
    --text:var(--head); --text-muted:var(--muted); --border:var(--line); --surface:var(--raised); }
  .aq-flow::before{ content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(130% 90% at 100% 0%, rgba(99,102,241,.16), transparent 70%),
               radial-gradient(90% 80% at 0% 100%, rgba(167,139,250,.10), transparent 68%); }
  .aq-x{ position:fixed; z-index:60; top:max(16px,env(safe-area-inset-top)); right:16px; width:38px; height:38px; border-radius:11px;
    display:grid; place-items:center; cursor:pointer; border:1px solid var(--line); background:rgba(20,20,26,.6); color:var(--muted); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .aq-x:hover{ color:#fff; border-color:var(--line2); }
  .aq-x svg{ width:17px; height:17px; }
  /* Back (to the inbox) sits just left of the close button; close still exits
     the whole window. Keeping both top-right leaves the left clear for the
     "Ask Matt" eyebrow (which squashed against a left-hand back button on mobile). */
  .aq-back{ position:fixed; z-index:60; top:max(16px,env(safe-area-inset-top)); right:62px; width:38px; height:38px; border-radius:11px;
    display:grid; place-items:center; cursor:pointer; border:1px solid var(--line); background:rgba(20,20,26,.6); color:var(--muted); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
  .aq-back:hover{ color:#fff; border-color:var(--line2); }
  .aq-back svg{ width:18px; height:18px; }
  .aq-lay{ position:relative; z-index:1; height:100%; display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:clamp(20px,2.4vw,40px);
    padding:clamp(22px,3vw,44px) clamp(20px,3vw,44px); }
  .aq-conv{ min-height:0; display:flex; flex-direction:column; }
  .aq-scroll{ flex:1; min-height:0; overflow-y:auto; padding-right:6px; }
  .aq-scroll::-webkit-scrollbar{ width:8px; } .aq-scroll::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.08); border-radius:8px; }
  .aq-eyb{ font-size:.7rem; letter-spacing:.2em; text-transform:uppercase; color:var(--purple); font-weight:700; }
  .aq-meta{ display:flex; align-items:center; flex-wrap:wrap; gap:7px 11px; margin-top:13px; font-size:.86rem; color:var(--muted); line-height:1.4; }
  .aq-meta-i{ display:inline-flex; align-items:center; gap:7px; }
  .aq-meta-i svg{ width:14px; height:14px; color:var(--faint); }
  .aq-meta .aq-gold{ color:var(--golds); font-weight:600; }
  .aq-meta-sep{ width:3px; height:3px; border-radius:50%; background:var(--faint); opacity:.5; flex:0 0 auto; }
  .aq-intro{ display:flex; gap:14px; align-items:flex-start; margin:30px 0 10px; max-width:600px; }
  .aq-av{ width:42px; height:42px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center; font-family:var(--voice);
    font-weight:600; font-size:.9rem; background:linear-gradient(135deg,#f5c518,#b8791a); color:#2a1800; }
  .aq-av.me{ background:linear-gradient(135deg,#3a3a46,#24242b); color:#e9e8ee; }
  .aq-av.has-img{ background:none; overflow:hidden; }
  .aq-av img{ width:100%; height:100%; border-radius:50%; object-fit:cover; display:block; }
  .aq-who{ font-size:.82rem; font-weight:600; color:var(--head); margin-bottom:7px; }
  .aq-who span{ color:var(--faint); font-weight:400; margin-left:8px; }
  .aq-bubble{ background:var(--card); border:1px solid var(--hair); border-radius:5px 18px 18px 18px; padding:15px 17px;
    font-size:.96rem; line-height:1.6; color:#e9e8ee; box-shadow:0 20px 50px -34px rgba(0,0,0,.9); white-space:pre-wrap; overflow-wrap:anywhere; word-break:break-word; }
  .aq-bubble.me{ border-radius:18px 5px 18px 18px;
    background:linear-gradient(135deg, color-mix(in srgb,var(--purple) 26%, #191622), color-mix(in srgb,var(--purple) 16%, #16141c));
    border-color:color-mix(in srgb,var(--purple) 30%, transparent); }

  .aq-withdraw:hover{ color:var(--muted); }

  .aq-decline-row{ text-align:center; margin-top:8px; }

  .aq-decline:hover{ color:var(--muted); }
  /* Inbox (conversation list) */
  .aq-inbox{ position:relative; z-index:1; height:100%; overflow-y:auto; padding:clamp(22px,3vw,44px) 20px calc(40px + env(safe-area-inset-bottom)); }

  .aq-inbox-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin:6px 0 20px; flex-wrap:wrap; }
  .aq-inbox-title{ margin:0; font-size:1.5rem; font-weight:700; color:var(--head); letter-spacing:-.01em; }
  .aq-newq{ display:inline-flex; align-items:center; gap:7px; background:linear-gradient(135deg,#c4b5fd,#a78bfa); color:#1a1430; border:0; border-radius:999px; padding:10px 16px; font:inherit; font-size:.88rem; font-weight:700; cursor:pointer; box-shadow:0 8px 20px -8px rgba(167,139,250,.8); transition:transform .12s, box-shadow .15s; }
  .aq-newq svg{ width:16px; height:16px; }

  .aq-ib-sec{ font-size:.72rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin:14px 2px 2px; display:flex; align-items:center; gap:7px; }
  .aq-ib-sec:first-child{ margin-top:0; }
  .aq-ib-sec span{ color:var(--muted); font-weight:600; letter-spacing:0; }
  .aq-ib-empty{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:56px 24px; }
  .aq-ib-empty-ic{ width:56px; height:56px; border-radius:50%; display:grid; place-items:center; color:var(--muted); background:linear-gradient(180deg,rgba(27,27,34,.8),rgba(19,19,24,.8)); border:1px solid var(--hair); margin-bottom:6px; }
  .aq-ib-empty-ic svg{ width:26px; height:26px; }
  .aq-ib-empty-t{ font-size:1.02rem; font-weight:700; color:var(--head); }

  /* Feedback submission (member) */
  .fb-wrap{ position:relative; z-index:1; height:100%; overflow-y:auto; padding:clamp(22px,3vw,44px) clamp(16px,3vw,44px) calc(44px + env(safe-area-inset-bottom)); }
  .fb-in{ max-width:620px; margin:0 auto; padding-top:max(20px,env(safe-area-inset-top)); }
  .fb-lead{ font-size:.95rem; line-height:1.6; color:var(--muted); margin:16px 0 22px; }
  .fb-up{ border:1px dashed var(--line2); border-radius:16px; padding:14px; margin-bottom:24px; background:rgba(255,255,255,.02); }

  .fb-attach{ display:flex; gap:8px; flex-wrap:wrap; }

  .fb-attachbtn:hover{ background:rgba(255,255,255,.07); border-color:var(--line2); }

  .fb-send{ display:inline-flex; align-items:center; gap:8px; margin-top:22px; background:linear-gradient(135deg,#6ee7b7,#34d399); color:#06281d; border:0; border-radius:999px; padding:12px 20px; font:inherit; font-size:.92rem; font-weight:700; cursor:pointer; box-shadow:0 8px 20px -8px rgba(52,211,153,.75); transition:transform .12s, box-shadow .15s, opacity .15s; }

  /* Premium upload entry points (recording / score) */
  .fb-drops{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:20px 0 4px; }
  .fb-drop{ display:flex; flex-direction:column; align-items:flex-start; gap:7px; padding:18px; border-radius:16px; border:1px solid var(--line2); background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012)); cursor:pointer; text-align:left; font:inherit; color:inherit; transition:border-color .15s, transform .12s, background .15s; min-height:132px; }
  .fb-drop:hover{ border-color:color-mix(in srgb, var(--purple,#a78bfa) 60%, var(--line2)); transform:translateY(-2px); background:rgba(167,139,250,.06); }
  .fb-drop-ic{ width:44px; height:44px; border-radius:12px; display:grid; place-items:center; background:rgba(167,139,250,.14); color:#c4b5fd; margin-bottom:4px; }
  .fb-drop-ic svg{ width:22px; height:22px; }
  .fb-drop-t{ font-size:.98rem; font-weight:700; color:var(--head); }
  .fb-drop-s{ font-size:.82rem; color:var(--muted); line-height:1.45; }
  .fb-staged:not(:empty){ margin-top:12px; }
  .fb-field{ margin-top:18px; }
  .fb-field label{ display:block; font-size:.84rem; font-weight:600; color:var(--muted); margin-bottom:8px; }
  .fb-opt{ color:var(--faint); font-weight:400; }
  .fb-field input, .fb-field textarea{ width:100%; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:12px; padding:12px 14px; color:var(--head); font-family:inherit; font-size:.95rem; outline:none; transition:border-color .15s, box-shadow .15s; }
  .fb-field textarea{ min-height:92px; resize:none; field-sizing:content; max-height:34vh; line-height:1.55; }
  .fb-field input:focus, .fb-field textarea:focus{ border-color:rgba(52,211,153,.5); box-shadow:0 0 0 3px rgba(52,211,153,.12); }
  .fb-field input::placeholder, .fb-field textarea::placeholder{ color:var(--faint); }
  @media(max-width:560px){ .fb-drops{ grid-template-columns:1fr; } }
  /* Feedback composer: a title line above the attach toolbar, like a subject. */
  .fb-composer .fb-title{ width:100%; background:transparent; border:0; border-bottom:1px solid var(--hair); color:var(--head); font-family:inherit; font-size:.98rem; font-weight:600; padding:2px 2px 9px; margin-bottom:9px; outline:none; }
  .fb-composer .fb-title::placeholder{ color:var(--faint); font-weight:500; }
  .fb-composer .fb-title:focus{ border-bottom-color:rgba(52,211,153,.55); }
  /* Explicit attach buttons: say what they add, the file type, and whether it's required. */
  .fb-attachrow{ display:flex; flex-wrap:wrap; gap:9px; margin-bottom:11px; }
  .fb-attach{ display:inline-flex; align-items:center; gap:10px; padding:10px 14px 10px 12px; border-radius:12px; border:1px solid var(--line2); background:rgba(255,255,255,.03); color:var(--head); font:inherit; cursor:pointer; text-align:left; transition:border-color .15s, background .15s; }
  .fb-attach:hover{ border-color:color-mix(in srgb,var(--green) 55%, var(--line2)); background:rgba(52,211,153,.06); }
  .fb-attach > svg{ width:19px; height:19px; color:var(--green); flex:0 0 auto; }
  .fb-attach-tx{ display:flex; flex-direction:column; min-width:0; line-height:1.25; }
  .fb-attach-l{ font-size:.9rem; font-weight:600; color:var(--head); }
  .fb-attach-m{ font-size:.72rem; color:var(--faint); margin-top:2px; }
  .fb-attach.req{ border-color:color-mix(in srgb,var(--green) 42%, var(--line2)); background:rgba(52,211,153,.07); }
  .fb-attach.req .fb-attach-m{ color:#8fecc0; font-weight:600; }
  .fb-attach.done{ border-color:color-mix(in srgb,var(--green) 55%, var(--line2)); background:rgba(52,211,153,.1); }
  @media(max-width:560px){ .fb-attachrow{ gap:8px; } .fb-attach{ flex:1 1 100%; } }
  /* Feedback: shared bits */
  .fb-piece{ font-size:1.05rem; font-weight:700; color:var(--head); margin:10px 0 14px; }
  .fb-media{ margin:4px 0 16px; }
  .fb-yournote{ background:rgba(255,255,255,.03); border:1px solid var(--hair); border-radius:12px; padding:12px 14px; margin:12px 0; font-size:.92rem; line-height:1.55; color:var(--muted); }
  .fb-lbl, .fb-refs-title{ font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:6px; }
  .fb-refs-h{ font-size:.72rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin:22px 0 8px; display:flex; gap:8px; align-items:center; }
  .fb-refs-h span{ text-transform:none; letter-spacing:0; font-weight:500; color:var(--muted); }
  /* Owner editor */
  .fb-ed-lay{ position:relative; z-index:1; height:100%; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.1fr); }
  .fb-ed-left{ border-right:1px solid var(--hair); overflow-y:auto; }
  .fb-ed-leftin{ padding:clamp(44px,7vh,68px) clamp(18px,2.4vw,36px) 40px; }
  .fb-ed-right{ overflow-y:auto; }
  .fb-ed-rightin{ padding:clamp(44px,7vh,68px) clamp(18px,2.4vw,36px) 40px; display:flex; flex-direction:column; min-height:100%; }
  .fb-vidwrap{ margin:4px 0 14px; }
  .fb-novid{ padding:30px; text-align:center; color:var(--faint); background:rgba(255,255,255,.03); border-radius:12px; }
  .fb-scorenote{ font-size:.86rem; color:var(--muted); margin-bottom:10px; }
  .fb-scoreview{ margin:4px 0 12px; border:1px solid var(--hair); border-radius:12px; overflow:hidden; background:#fff; }
  .fb-scoreview iframe{ width:100%; height:440px; border:0; display:block; background:#fff; }
  .fb-scoreview img{ width:100%; display:block; }
  .fb-ed-toolbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .fb-tool{ display:inline-flex; align-items:center; gap:7px; padding:9px 13px; border-radius:10px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--head); font:inherit; font-size:.84rem; font-weight:600; cursor:pointer; transition:background .15s, border-color .15s; }
  .fb-tool:hover{ background:rgba(255,255,255,.07); border-color:var(--line2); }
  .fb-tool svg{ width:16px; height:16px; color:var(--muted); flex:0 0 auto; }
  .fb-ed{ flex:1 1 auto; min-height:220px; border:1px solid var(--line); border-radius:14px; padding:16px 18px; font-size:1rem; line-height:1.7; color:var(--head); outline:none; overflow-y:auto; background:rgba(255,255,255,.02); }
  .fb-ed:empty:before{ content:attr(data-ph); color:var(--faint); }
  .fb-ed:focus{ border-color:rgba(52,211,153,.5); box-shadow:0 0 0 3px rgba(52,211,153,.12); }
  .fb-ed-actions{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:18px; }
  .fb-decline{ background:none; border:0; color:var(--faint); font:inherit; font-size:.82rem; text-decoration:underline; cursor:pointer; }
  .fb-decline:hover{ color:var(--muted); }
  .fb-deliver{ display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#6ee7b7,#34d399); color:#06281d; border:0; border-radius:999px; padding:11px 20px; font:inherit; font-size:.9rem; font-weight:700; cursor:pointer; box-shadow:0 8px 20px -8px rgba(52,211,153,.75); }
  .fb-deliver:disabled{ opacity:.6; cursor:default; }
  /* Chips & clips */
  .fb-chip{ display:inline-flex; align-items:center; gap:4px; font-size:.78rem; font-weight:700; padding:2px 8px; border-radius:999px; vertical-align:middle; }
  .fb-ts{ background:color-mix(in srgb, var(--purple,#a78bfa) 24%, transparent); color:#c4b5fd; }
  /* A clipped score segment floats into the side margin beside the text it
     relates to, like a margin figure, so it never breaks the prose or lengthens
     the document. Clips stack down the margin; the text flows past them. */
  .fb-clip{ float:right; clear:right; width:min(250px,44%); margin:3px 0 12px 20px; border-radius:8px; border:1px solid var(--hair); cursor:zoom-in; display:block; }
  .fb-ed::after, .fb-article::after{ content:""; display:block; clear:both; }
  .fb-zoom{ position:fixed; inset:0; z-index:4000; background:rgba(0,0,0,.86); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out; }
  .fb-zoom.open{ display:flex; }
  .fb-zoom img{ max-width:96vw; max-height:92vh; border-radius:8px; box-shadow:0 30px 80px -30px rgba(0,0,0,.9); }
  /* Feedback studio: recording + score are fixed panels; the canvas is the writing */
  .fb-st{ position:relative; z-index:1; height:100%; display:flex; flex-direction:column; }
  .fb-st-top{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:max(14px,env(safe-area-inset-top)) 64px 12px clamp(16px,3vw,24px); border-bottom:1px solid var(--hair); flex:0 0 auto; }
  .fb-st-title{ font-size:1rem; font-weight:700; color:var(--head); }
  .fb-st-title span{ color:var(--muted); font-weight:500; }
  .fb-st-tools{ display:flex; gap:8px; flex-wrap:wrap; }
  .fb-st-actions{ margin-left:auto; display:flex; align-items:center; gap:14px; }
  .fb-st-note{ padding:9px clamp(16px,3vw,24px); font-size:.84rem; color:var(--muted); border-bottom:1px solid var(--hair); background:rgba(255,255,255,.02); flex:0 0 auto; }
  .fb-st-note b{ color:var(--head); font-weight:600; }
  .fb-st-main{ flex:1 1 auto; min-height:0; display:flex; gap:0; }
  .fb-st-left{ flex:1 1 60%; min-width:0; display:flex; flex-direction:column; }
  .fb-st-right{ flex:0 0 38%; min-width:300px; display:flex; flex-direction:column; border-left:1px solid var(--hair); background:#0c0c10; }
  .fb-st-rec{ flex:0 0 auto; margin:14px clamp(14px,2.4vw,22px) 0; aspect-ratio:16/9; max-height:40vh; background:#000; border:1px solid var(--line2); border-radius:12px; overflow:hidden; }
  .fb-st-rec mux-player{ border-radius:12px; overflow:hidden; }
  .fb-st-col-h{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px clamp(14px,2vw,18px) 9px; font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--hair); }
  .fb-st-score{ flex:1 1 auto; min-height:0; overflow:auto; padding:12px clamp(12px,1.8vw,16px); }
  .fb-st-score .fb-scoreview{ margin:0; }
  .fb-st-score .fb-scoreview iframe{ height:min(1200px,78vh); }
  .fb-st-empty{ color:var(--faint); font-size:.9rem; text-align:center; padding:28px 18px; line-height:1.6; }
  .fb-linkbtn{ background:none; border:0; color:var(--purple); font:inherit; font-size:.8rem; font-weight:600; cursor:pointer; text-transform:none; letter-spacing:0; }
  .fb-linkbtn:hover{ text-decoration:underline; }
  .fb-st-refs{ flex:0 0 auto; border-top:1px solid var(--hair); padding:11px clamp(14px,2vw,18px) calc(14px + env(safe-area-inset-bottom)); background:rgba(0,0,0,.22); max-height:30vh; overflow-y:auto; }

  /* The writing page (free canvas), used by both the editor and the delivered view */
  .fb-st-page, .fb-dv-page{ flex:1 1 auto; min-height:0; overflow:auto; padding:16px clamp(14px,2.4vw,22px) 26px; background:#0e0e12; }
  .fbc-stage{ position:relative; margin:0 auto; }
  .fbc{ position:relative; width:680px; min-height:340px; background:linear-gradient(180deg,#17171d,#131318); border:1px solid var(--line2); border-radius:14px; background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size:24px 24px; }
  .fbc.ro{ border-color:var(--hair); background:#131318; background-image:none; }
  .fbc-hint{ position:absolute; left:28px; right:28px; top:30px; color:var(--faint); font-size:.9rem; line-height:1.7; text-align:center; pointer-events:none; }
  .fbc-hint b{ color:var(--muted); font-weight:600; }
  body.fbc-dragging{ cursor:grabbing; }
  body.fbc-dragging *{ user-select:none !important; }
  .fbc-el{ position:absolute; }
  .fbc:not(.ro) .fbc-el.sel{ outline:1.5px solid var(--green); outline-offset:4px; border-radius:7px; }
  .fbc-el.fbc-moving{ opacity:.92; }
  .fbc-grip{ position:absolute; top:-15px; left:0; right:0; height:16px; display:flex; align-items:center; justify-content:space-between; opacity:0; transition:opacity .12s; touch-action:none; }
  .fbc:not(.ro) .fbc-el:hover .fbc-grip, .fbc:not(.ro) .fbc-el.sel .fbc-grip{ opacity:1; }
  .fbc-grip:before{ content:""; position:absolute; left:0; right:26px; top:6px; height:4px; border-radius:3px; background:repeating-linear-gradient(90deg,var(--line2) 0 3px,transparent 3px 7px); }
  .fbc-grip{ cursor:grab; }
  .fbc-grip:active{ cursor:grabbing; }
  .fbc-rm{ position:relative; z-index:2; background:rgba(20,20,26,.95); border:1px solid var(--line2); color:var(--muted); width:19px; height:19px; border-radius:50%; cursor:pointer; padding:0; display:grid; place-items:center; flex:0 0 auto; }
  .fbc-rm svg{ width:10px; height:10px; }
  .fbc-rm:hover{ color:#fff; border-color:#ef4444; background:#ef4444; }
  .fbc-clip img{ width:100%; display:block; border-radius:7px; border:1px solid var(--line2); background:#fff; }
  .fbc:not(.ro) .fbc-clip img{ cursor:grab; touch-action:none; }
  .fbc.ro .fbc-clip img{ cursor:zoom-in; }
  .fbc-text{ font-size:.96rem; line-height:1.6; color:var(--head); outline:none; white-space:pre-wrap; overflow-wrap:anywhere; border-radius:8px; padding:4px 7px; min-height:1.4em; }
  .fbc:not(.ro) .fbc-text{ background:rgba(255,255,255,.02); }
  .fbc:not(.ro) .fbc-el.sel .fbc-text{ background:rgba(255,255,255,.05); }
  .fbc.ro .fbc-text{ background:none; padding:2px 0; }
  .fbc-text[contenteditable]:empty:before{ content:attr(data-ph); color:var(--faint); }
  .fbc-ts{ touch-action:none; }
  .fbc-tschip{ display:inline-flex; align-items:center; gap:5px; font:inherit; font-size:.82rem; font-weight:700; padding:5px 12px; border-radius:999px; border:0; cursor:inherit; background:color-mix(in srgb, var(--green) 24%, transparent); color:#8fecc0; white-space:nowrap; }
  .fbc.ro .fbc-ts .fbc-tschip{ cursor:pointer; }
  .fbc.ro .fbc-ts .fbc-tschip:hover{ background:color-mix(in srgb, var(--green) 38%, transparent); }
  .fbc-rm-ts{ position:absolute; top:-9px; right:-9px; opacity:0; transition:opacity .12s; }
  .fbc:not(.ro) .fbc-ts:hover .fbc-rm-ts, .fbc:not(.ro) .fbc-ts.sel .fbc-rm-ts{ opacity:1; }
  .fbc-rz{ position:absolute; right:-8px; bottom:-8px; width:17px; height:17px; border-radius:50%; background:var(--green); border:2px solid #0e0e12; cursor:nwse-resize; opacity:0; transition:opacity .12s; touch-action:none; }
  .fbc:not(.ro) .fbc-el:hover .fbc-rz, .fbc:not(.ro) .fbc-el.sel .fbc-rz{ opacity:1; }
  /* Reading-flow mode: the board becomes a single full-width column, real text size, no zoom. */
  .fbc.flow{ width:100% !important; min-height:0; transform:none !important; display:flex; flex-direction:column; gap:20px; background-image:none; padding:20px 16px; }
  .fbc.flow.ro{ padding:2px 0; gap:18px; background:none; border:none; }
  .fbc.flow .fbc-el{ position:relative; left:auto !important; top:auto !important; width:auto !important; max-width:100%; }
  .fbc.flow .fbc-text{ font-size:1rem; line-height:1.65; }
  .fbc.flow.ro .fbc-text{ padding:0; }
  .fbc.flow .fbc-clip{ width:100%; }
  .fbc.flow .fbc-ts{ align-self:flex-start; }
  .fbc.flow .fbc-grip, .fbc.flow .fbc-rz{ display:none !important; }
  .fbc.flow .fbc-rm-flow{ position:absolute; top:-8px; right:-8px; z-index:3; opacity:0; transition:opacity .12s; }
  .fbc.flow:not(.ro) .fbc-el:hover .fbc-rm-flow, .fbc.flow:not(.ro) .fbc-el.sel .fbc-rm-flow{ opacity:1; }

  /* Delivered view: same split, flowing inside the member's scroll page */
  .fb-in.fb-in-cv{ max-width:1060px; }
  /* Desktop: recording top-left, writing below it, score as a tall page on the right */
  .fb-dv{ display:grid; grid-template-columns:1fr minmax(300px,.72fr); gap:18px; margin:16px 0 6px; align-items:start;
    grid-template-areas:"rec score" "page score"; }
  .fb-dv.no-score{ grid-template-columns:1fr; grid-template-areas:"rec" "page"; }
  .fb-dv-rec{ grid-area:rec; aspect-ratio:16/9; background:#000; border:1px solid var(--line2); border-radius:12px; overflow:hidden; }
  .fb-dv-rec mux-player{ border-radius:12px; overflow:hidden; }
  .fb-dv-rec-empty{ display:grid; place-items:center; color:var(--faint); font-size:.86rem; background:linear-gradient(180deg,#141418,#0e0e12); }
  .fb-dv-page{ grid-area:page; background:#0e0e12; border:1px solid var(--hair); border-radius:14px; overflow:visible; padding:14px; min-height:260px; }
  .fb-dv-right{ grid-area:score; min-width:0; position:sticky; top:8px; background:#0c0c10; border:1px solid var(--hair); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; max-height:84vh; }
  .fb-sc-toggle{ flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; padding:13px clamp(14px,2vw,18px); background:none; border:0; border-bottom:1px solid var(--hair); font:inherit; font-size:.72rem; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--faint); cursor:default; text-align:left; }
  .fb-sc-chev{ width:16px; height:16px; display:none; flex:0 0 auto; transition:transform .2s; }
  .fb-dv-score{ overflow:auto; padding:12px; }
  .fb-dv-score .fb-scoreview{ margin:0; }
  .fb-dv-score .fb-scoreview iframe{ height:min(1100px,74vh); }
  .fb-scoreview-wrap{ margin:4px 0 18px; }
  /* Waiting-page placeholder (feedback not written yet) */
  .fb-dv-ph{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:11px; padding:min(10vw,60px) 20px; color:var(--muted); }
  .fb-dv-ph-ic{ width:50px; height:50px; border-radius:14px; display:grid; place-items:center; color:var(--purple); background:color-mix(in srgb,var(--purple) 14%, transparent); }
  .fb-dv-ph-ic svg{ width:24px; height:24px; }
  .fb-dv-ph-h{ font-size:1.05rem; font-weight:700; color:var(--head); }
  .fb-dv-ph-s{ font-size:.9rem; line-height:1.6; max-width:420px; color:var(--muted); }
  .fb-dv-ph-note{ margin-top:10px; max-width:460px; width:100%; text-align:left; background:rgba(255,255,255,.03); border:1px solid var(--hair); border-radius:12px; padding:12px 14px; font-size:.92rem; line-height:1.55; color:var(--body); }
  .fb-dv-ph-note span{ display:block; font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:6px; }
  @media(max-width:860px){
    .fb-st-main{ flex-direction:column; }
    .fb-st-right{ flex:0 0 auto; border-left:0; border-top:1px solid var(--hair); max-height:46vh; }
    .fb-st-rec{ max-height:32vh; }
    /* Mobile: video on top, score as a tappable link, then the feedback text */
    .fb-dv, .fb-dv.no-score{ grid-template-columns:1fr; grid-template-areas:"rec" "score" "page"; gap:12px; }
    .fb-dv-right{ position:static; max-height:none; }
    .fb-sc-toggle{ cursor:pointer; }
    .fb-sc-chev{ display:inline-flex; }
    .fb-dv-right.open .fb-sc-chev{ transform:rotate(180deg); }
    .fb-dv-right .fb-dv-score{ display:none; }
    .fb-dv-right.open .fb-dv-score{ display:block; }

  /* ── Feedback room: one lit environment (delivered + waiting), in the feedback palette ── */

// ── Spending guards ───────────────────────────────────────────────────────────
// Credits are HELD on send and only charged when Matt replies, so the two
// moments that matter are the door (can they afford it at all?) and the send
// (do they mean it?). _balance is null until the first load: treat unknown as
// allowed, or a slow connection shows a dead store.
function canAfford(cost){ return _balance == null || _balance >= cost; }

let _dlgCb = null;
function _dlgDone(v){
  const m = document.getElementById('ask-dialog'); if(m) m.classList.remove('on');
  const cb = _dlgCb; _dlgCb = null; if(cb) cb(v);
}
document.addEventListener('keydown', function(e){
  if(e.key !== 'Escape') return;
  if(_dlgCb){ _dlgDone(false); return; }
  const em = document.getElementById('earn-modal'); if(em && em.classList.contains('on')){ em.classList.remove('on'); }
});

/* One dialog for both guards. Returns a promise so a caller can simply await it. */
function askDialog(o){
  return new Promise(function(resolve){
    document.getElementById('dlg-h').textContent = o.title;
    document.getElementById('dlg-b').innerHTML = o.body;
    document.getElementById('dlg-fig').innerHTML = o.figures || '';
    document.getElementById('dlg-no').textContent = o.no || 'Not yet';
    document.getElementById('dlg-yes').innerHTML = (o.coin === false ? '' : '<span class="coin">'+IC.coin+'</span>') + (o.yes || 'Confirm');
    _dlgCb = resolve;
    document.getElementById('ask-dialog').classList.add('on');
  });
}

/* Shown instead of opening a flow the member cannot pay for. */
async function needCredits(key){
  const it = CAT[key]; const short = Math.max(0, it.cost - (_balance||0));
  const ok = await askDialog({
    title: 'You need a few more credits',
    body: it.name + ' costs ' + fmt(it.cost) + ' credits. You earn credits as you log your practice.',
    figures: '<div class="am-fig"><span>You have</span><b>' + fmt(_balance||0) + '</b></div>'
           + '<div class="am-fig"><span>Still needed</span><b>' + fmt(short) + '</b></div>',
    yes: 'How credits work', no: 'Close', coin: false
  });
  if(ok) document.getElementById('earn-modal').classList.add('on');
}

/* Shown on send, once they know what they are asking for. */
function confirmSpend(key){
  const it = CAT[key];
  return askDialog({
    title: 'Send this to Matt?',
    body: 'This holds ' + fmt(it.cost) + ' credits until Matt replies. If he cannot take it, they come straight back to you.',
    figures: '<div class="am-fig"><span>Held now</span><b>' + fmt(it.cost) + '</b></div>'
           + (_balance != null ? '<div class="am-fig"><span>Left after</span><b>' + fmt(Math.max(0, _balance - it.cost)) + '</b></div>' : ''),

  });

async function spend(item, body){
  if(!await requireAuth()) return { error:{ message:'auth' } };
  const { data, error } = await db.rpc('spend_credits', { p_item:item, p_body:body });
  if(!error){ const b = data && (Array.isArray(data) ? (data[0] && data[0].balance) : data.balance); if(typeof b==='number') _balance = b; }
  return { data, error };
}

// ── Owner "view as member" preview ─────────────────────────────────────────────
// Preview-as-member is sticky for the session, not just a URL param: the
// immersive question thread hides the owner bar and is often reached by a fresh
// load (a notification link carries no ?as=member), so a URL-only flag silently
// drops the owner back to owner view mid-test and mis-attributes a follow-up.
function previewingMember(){
  try{ if(sessionStorage.getItem('ask_as') === 'member') return true; }catch(_){}
  return new URLSearchParams(window.location.search).get('as') === 'member';
}
function setPreviewMember(on){
  try{ if(on) sessionStorage.setItem('ask_as','member'); else sessionStorage.removeItem('ask_as'); }catch(_){}
}
function ownerActive(){ return isOwner() && !previewingMember(); }  // owner UI only when NOT previewing
function toggleAs(){
  const on = !previewingMember();
  setPreviewMember(on);                       // sticky for the session
  const sp = new URLSearchParams(window.location.search);
  if(on) sp.set('as','member'); else sp.delete('as');
  const u = new URL(window.location.href); u.search = sp.toString();
  history.pushState({}, "", u); render();
}
function renderOwnerBar(){
  const el = document.getElementById('owner-bar'); if(!el) return;
  if(!isOwner()){ el.innerHTML = ''; return; }
  if(previewingMember()){
    el.innerHTML = '<div class="owner-bar preview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>You\'re previewing the page as a member sees it.<button onclick="toggleAs()">Back to owner view</button></div>';
  } else {
    el.innerHTML = '<div class="owner-bar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 7v6c0 5 3.5 7.5 8 9 4.5-1.5 8-4 8-9V7z"/></svg>Viewing as <b>Matt</b> (owner).<button onclick="toggleAs()">Preview as a member</button></div>';

}

// ── Router ────────────────────────────────────────────────────────────────────
function go(params){
  const cur = new URLSearchParams(window.location.search);
  const u = new URL(window.location.href);
  u.search = "";
  Object.keys(params||{}).forEach(function(k){ if(params[k]!=null) u.searchParams.set(k, params[k]); });
  const as = cur.get('as'); if(as && !u.searchParams.get('as')) u.searchParams.set('as', as);  // keep the preview mode across navigation
  history.pushState({}, "", u);
  render();
}
window.addEventListener('popstate', render);
// The "What Matt sees" sheet is mobile-only: widening past the rail breakpoint
// closes it so it does not reappear if the window is later narrowed again.
window.addEventListener('resize', function(){ if(window.innerWidth >= 901 && typeof aqCloseSheet === 'function') aqCloseSheet(); if(typeof fbcGrow==='function' && document.getElementById('fbc')) fbcGrow(); });

async function render(){
  const sp = new URLSearchParams(window.location.search);
  const flow = sp.get('flow') || '';
  const req  = sp.get('req') || '';
  await loadBalance();
  renderOwnerBar();
  // The question flow is a full-bleed immersive conversation (chrome hidden); the
  // hub and the other flows keep the app chrome. Toggle before rendering so the
  // layout measures against the right shell.
  document.body.classList.toggle('ask-flow', flow === 'question');
  const view = document.getElementById('ask-view');
  if(flow === 'question')      await renderQuestion(view, req, sp.get('edit')==='1');
  else if(flow === 'feedback') await renderFeedback(view, req);
  else if(flow === 'plan')     await renderPlan(view, req);
  else                         await renderHub(view);
  _measureShell();
}

// ── Hub ───────────────────────────────────────────────────────────────────────
// One system of music, suggested rather than drawn. Two things make a page read
// as music instead of prose: every row runs the FULL width, because a system
// always does, and the row is divided into blocks, which are the bars. A ragged
// right edge is what makes a page look like a document. Real staves and a
// hand-built clef were tried and read as a smudge and a mistake at this size.
// `hl` picks out individual blocks, so a comment marks a few bars, not a line.
function _musicRow(x,y,w,segs,hl,col,op){
  var gap=3,total=0,i;
  for(i=0;i<segs.length;i++) total+=segs[i];
  var avail=w-gap*(segs.length-1), cx=x, out='';
  for(i=0;i<segs.length;i++){
    var sw=avail*segs[i]/total, on=hl&&hl.indexOf(i)>=0;
    out+='<rect x="'+cx.toFixed(1)+'" y="'+y+'" width="'+sw.toFixed(1)+'" height="6" rx="1" fill="'
       +(on?'var(--oc)':col)+'" opacity="'+(on?0.95:op)+'"/>';
    cx+=sw+gap;
  }
  return out;
}
// A grand staff: two rows a short gap apart, sharing one bar layout so the bar
// lines align down the system, exactly as they do on a piano score.
function _system(x,y,w,segs,hl){
  return _musicRow(x,y,   w,segs,hl,'#4a5059',.42)
       + _musicRow(x,y+12,w,segs,hl,'#4a5059',.42);
}
// A numbered note pinned in the page margin, and the hairline that ties it to
// the written comment on the left.
function _pin(cx,cy,n){
  return '<circle cx="'+cx+'" cy="'+cy+'" r="5.6" fill="var(--oc)"/>'
       + '<text x="'+cx+'" y="'+(cy+2.3)+'" text-anchor="middle" font-family="Inter,sans-serif"'
       + ' font-size="6.6" font-weight="700" fill="#0b2b20">'+n+'</text>';
}
// Where bar `i` sits in a row, mirroring the layout in _musicRow exactly, so a
// mark can be placed against a known bar rather than by eye.
function _seg(x,w,segs,i){
  var gap=3,total=0,k;
  for(k=0;k<segs.length;k++) total+=segs[k];
  var avail=w-gap*(segs.length-1), cx=x;
  for(k=0;k<i;k++) cx+=avail*segs[k]/total+gap;
  return {x:cx, w:avail*segs[i]/total};
}
// A marked bar, drawn as ONE object: a band down the system at that bar, which
// ties both hands together the way a bar does, with the number on a tab at its
// head. A disc floating above the bar read as a blob attached to nothing, and a
// tab narrower than the bar read as a lollipop.
function _barMark(g,y,n){
  var x=(g.x-2.5), w=(g.w+5), cx=g.x+g.w/2, tw=13;
  return '<rect x="'+x.toFixed(1)+'" y="'+(y-2.5)+'" width="'+w.toFixed(1)+'" height="23" rx="2.5" fill="var(--oc)" opacity=".2"/>'
       + '<rect x="'+x.toFixed(1)+'" y="'+(y-2.5)+'" width="'+w.toFixed(1)+'" height="23" rx="2.5" fill="none" stroke="var(--oc)" stroke-width="1" opacity=".6"/>'
       + '<rect x="'+(cx-tw/2).toFixed(1)+'" y="'+(y-12)+'" width="'+tw+'" height="11" rx="2.5" fill="var(--oc)"/>'
       + '<text x="'+cx.toFixed(1)+'" y="'+(y-4.3)+'" text-anchor="middle" font-family="Inter,sans-serif"'
       + ' font-size="7" font-weight="700" fill="#0b2b20">'+n+'</text>';
}
// Each demo is ONE svg on a shared 4:3 viewBox, so the whole graphic scales
// with the card (no fixed-px parts to squash). --oc is the card's accent.
function _demoSvg(inner){
  return '<div class="sitem-demo"><svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">'+inner+'</svg></div>';

async function onSearch(q, opts){
  q=(q||'').trim(); if(!q) return;
  opts=opts||{};
  if(_askDebounce){ clearTimeout(_askDebounce); _askDebounce=null; }
  var el=document.getElementById('browse'); if(!el) return;
  var input=document.querySelector('.find .find-s input'); if(input && input.value!==q) input.value=q;
  window._askLastQuery=q;
  // On live typing keep the current results in place (just dim) rather than
  // flashing skeletons on every keystroke; show skeletons only on a cold search.
  var hasResults = !!el.querySelector('.rlist');
  if(opts.silent && hasResults){ el.style.opacity='0.55'; }
  else {
    el.innerHTML = _resultsHead('Searching for <b>'+escHtml(q)+'</b>…')
      + '<div class="rlist"><div class="rcard-sk"></div><div class="rcard-sk"></div><div class="rcard-sk"></div></div>';
  }
  try{
    var res = await db.rpc('ask_search', { p_q:q, p_limit:12 });
    if(window._askLastQuery!==q) return; // a newer search superseded this one
    el.style.opacity='';
    if(res.error) throw res.error;
    renderResults(el, q, res.data||[]);
  }catch(e){
    if(window._askLastQuery!==q) return;
    el.style.opacity='';
    el.innerHTML = _resultsHead('Search for <b>'+escHtml(q)+'</b>')
      + '<div class="results-empty">Search is not available right now. <button class="results-clear" style="display:inline" onclick="onSearch(window._askLastQuery)">Try again</button></div>';

}

/* cancel_credit_request has existed since the credits migration and had no
   caller, so the page promised a refund it could not perform. Either side may
   call it while the request is still open: the hold becomes a refund and the
   balance comes back. */
async function cancelRequest(id, mine, noun){
  noun = noun || 'question';
  const ok = await askDialog({
    title: mine ? ('Withdraw this '+noun+'?') : 'Decline this request?',
    body: mine
      ? 'It will be withdrawn before Matt answers, and the credits it is holding come straight back to you.'
      : 'The member gets the credits back and the request leaves your queue.',
    yes: mine ? 'Withdraw and refund' : 'Decline and refund',
    no: 'Keep it', coin: false
  });
  if(!ok) return;
  if(!await requireAuth()) return;
  const { error } = await db.rpc('cancel_credit_request', { p_id:id });
  if(error){ showToast('Could not do that. ' + (error.message||''), 4000); return; }
  showToast(mine ? 'Withdrawn. Your credits are back.' : 'Declined, and the member has been refunded.');
  await loadBalance();
  render();
}

async function deliver(id){
  const ta = document.getElementById('reply-'+id); const text = ((ta&&ta.value)||'').trim();
  if(text.length<2){ showToast('Write your reply first.', 3000); return; }
  if(!await requireAuth()) return;
  const { error } = await db.rpc('deliver_credit_request', { p_id:id, p_response:{ text:text } });
  if(error){ showToast('Could not deliver. '+(error.message||''), 4000); return; }
  showToast('Delivered. The member has been notified.');
  renderOwnerQueue();
}

// Drag the mobile sheet down to dismiss. A downward drag that starts while the
// content is scrolled to the top moves the whole sheet (not its contents) and
// closes it past a threshold; otherwise the body scrolls as normal.
function aqBindSheetDrag(){
  const ov=document.getElementById('aq-sheet'); if(!ov) return;
  const sheet=ov.querySelector('.aq-sheet'), body=ov.querySelector('.aq-sheet-body');
  if(!sheet || sheet._dragBound) return; sheet._dragBound=true;
  let startY=0, dy=0, dragging=false;
  sheet.addEventListener('touchstart', function(e){ startY=e.touches[0].clientY; dy=0; dragging=false; sheet.style.transition='none'; }, {passive:true});
  sheet.addEventListener('touchmove', function(e){
    dy=e.touches[0].clientY-startY;
    const atTop = !body || body.scrollTop<=0;
    if(dy>0 && atTop){ dragging=true; if(e.cancelable) e.preventDefault(); sheet.style.transform='translateY('+dy+'px)'; }
    else if(dragging){ sheet.style.transform='translateY('+Math.max(0,dy)+'px)'; }
  }, {passive:false});
  const end=function(){ sheet.style.transition='';
    if(dragging && dy>90){ sheet.style.transform=''; aqCloseSheet(); }
    else { sheet.style.transform='translateY(0)'; }
    dragging=false; dy=0;
  };
  sheet.addEventListener('touchend', end);
  sheet.addEventListener('touchcancel', end);
}

function _dayLabel(dateStr){
  if(!dateStr) return '';
  const d=new Date(dateStr+'T00:00:00'); const t=new Date(); t.setHours(0,0,0,0);
  const diff=Math.round((t-d)/864e5);
  if(diff<=0) return 'Today'; if(diff===1) return 'Yesterday'; if(diff<7) return diff+' days ago';
  return d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
}
// The member's own practice, read with their own RLS scope. Degrades gracefully:
// a missing RPC or an empty log simply shows less, never an error.
async function _aqContext(targetEmail){
  const out = { weekMins:0, streak:null, total:0, learning:[], recent:[], libCount:0, libTitles:[] };
  const email = targetEmail || myEmail; const isSelf = !targetEmail;
  try{
    const sevenAgo=new Date(Date.now()-6*864e5); sevenAgo.setHours(0,0,0,0);
    const sevenStr=sevenAgo.toISOString().slice(0,10);
    const [sessRes, collRes, streakRes] = await Promise.all([
      db.rpc('get_my_sessions', { p_email: email }).then(r=>r, ()=>({data:null})),
      isSelf ? db.from('user_collections').select('status, pieces(title,composer), user_pieces(title)').eq('email', email).then(r=>r, ()=>({data:null}))
             : db.rpc('get_user_collection', { p_email: email }).then(r=>r, ()=>({data:null})),
      (isSelf && myMemberKey) ? db.rpc('member_card_streak', { p_member_key: myMemberKey }).then(r=>r, ()=>({data:null})) : Promise.resolve({data:null})
    ]);
    const sessions = Array.isArray(sessRes && sessRes.data) ? sessRes.data : [];
    out.total = sessions.length;
    const pieceMins = {};
    sessions.forEach(function(s){
      if(String(s.session_date||'') >= sevenStr) out.weekMins += (s.duration_minutes||0);
      (s.practice_items||[]).forEach(function(it){
        if(it.item_type==='piece' || it.item_type==='book'){
          const n=String(it.piece_label||it.label||'').trim(); if(!n) return;
          pieceMins[n.toLowerCase()] = (pieceMins[n.toLowerCase()]||0) + (it.duration_minutes||0);
        }
      });
    });
    const recent = sessions.slice().sort(function(a,b){ return String(b.session_date||'').localeCompare(String(a.session_date||'')); }).slice(0,3);
    out.recent = recent.map(function(s){
      const seen={}, names=[];
      (s.practice_items||[]).forEach(function(it){ const n=String(it.piece_label||it.label||'').trim(); const k=n.toLowerCase(); if(n && !seen[k]){ seen[k]=1; names.push(n); } });
      return { date:s.session_date, mins:s.duration_minutes||0, what:names.slice(0,3).join(', '), note:String(s.notes||'').trim() };
    });
    const sk = streakRes && streakRes.data; const skRow = Array.isArray(sk)?sk[0]:sk;
    out.streak = skRow ? (skRow.current_streak!=null?skRow.current_streak:(skRow.streak!=null?skRow.streak:null)) : null;
    const coll = (Array.isArray(collRes && collRes.data) ? collRes.data : []).map(function(r){
      const t=String(r.title||(r.pieces&&r.pieces.title)||(r.user_pieces&&r.user_pieces.title)||'').trim();
      return { title:t, composer:String((r.pieces&&r.pieces.composer)||r.composer||'').trim(), status:r.status };
    }).filter(function(r){ return r.title; });
    out.libCount = coll.length;
    out.libTitles = coll.map(function(r){ return r.title; });
    out.learning = coll.filter(function(r){ return r.status==='learning'; }).map(function(r){
      return { title:r.title, composer:r.composer, mins:pieceMins[r.title.toLowerCase()]||0 };
    }).slice(0,4);
  }catch(e){ }
  return out;
}

/* Their last week and what they have actually been playing. `email` is passed
   only in the owner's view of a thread, where the admin policy lets Matt read
   the member's rows; a member's own call is scoped to them by RLS. */
async function memberContext(email){
  try{
    const since = new Date(Date.now() - 6*864e5).toISOString().slice(0,10);
    let weekQ = db.from('practice_sessions').select('id,duration_minutes').gte('session_date', since);
    let recentQ = db.from('practice_sessions').select('id,session_date').order('session_date',{ascending:false}).limit(25);
    if(email){ weekQ = weekQ.eq('email', email); recentQ = recentQ.eq('email', email); }
    const [wk, rc] = await Promise.all([weekQ, recentQ]);
    const week = wk.data || [];
    const ids = (rc.data || []).map(function(r){ return r.id; });
    const pieces = [];
    if(ids.length){
      const it = await db.from('practice_items').select('session_id,item_type,piece_label,label')
                   .in('session_id', ids).eq('item_type','piece');
      const ord = {}; ids.forEach(function(id,i){ ord[id] = i; });
      const seen = {};
      (it.data || []).slice().sort(function(a,b){ return (ord[a.session_id]||0) - (ord[b.session_id]||0); })
        .forEach(function(r){
          const n = String(r.piece_label || r.label || '').trim();
          const k = n.toLowerCase();
          if(n && !seen[k]){ seen[k] = 1; pieces.push(n); }
        });
    }
    return { sessions: week.length,
             minutes: week.reduce(function(a,s){ return a + (s.duration_minutes || 0); }, 0),
             pieces: pieces.slice(0,3) };
  }catch(e){ return null; }
}

async function aqThreadSend(id){

// Render the score PDF with PDF.js so it fits the panel width and re-fits on resize,
// instead of an <iframe> whose built-in viewer ignores the container size.
let _frPdfCleanup=null;
async function frMountScore(){
  if(_frPdfCleanup){ try{ _frPdfCleanup(); }catch(_){}; _frPdfCleanup=null; }
  const host=document.querySelector('.fr-pdf'); if(!host) return;
  const url=host.getAttribute('data-pdf'); if(!url) return;
  let pdf;
  try{
    const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';
    pdf=await pdfjs.getDocument(url).promise;
  }catch(e){ host.innerHTML='<div class="fr-pdf-wait">Could not open the score. <a href="'+escHtml(url)+'" target="_blank" rel="noopener" style="color:#3a6">Open it in a new tab</a>.</div>'; return; }
  let token=0;
  const draw=async function(){
    if(!document.body.contains(host)) return;
    const w=Math.floor(host.clientWidth); if(w<20) return;
    const my=++token; const dpr=Math.min(2, window.devicePixelRatio||1);
    const frag=document.createDocumentFragment();
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      if(my!==token) return;                       // a newer resize superseded this pass
      const base=page.getViewport({scale:1});
      const vp=page.getViewport({scale:(w/base.width)*dpr});
      const c=document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
      c.className='fr-pdf-page'; c.style.width='100%'; c.style.display='block';
      await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
      if(my!==token) return;
      frag.appendChild(c);
    }
    if(my!==token) return;
    host.innerHTML=''; host.appendChild(frag);
  };
  await draw();
  let t; const onResize=function(){ clearTimeout(t); t=setTimeout(draw, 180); };
  window.addEventListener('resize', onResize);
  _frPdfCleanup=function(){ window.removeEventListener('resize', onResize); };
}
