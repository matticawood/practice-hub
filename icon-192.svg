<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="32" fill="#111111"/>

  <defs>
    <!-- Clip to the P counter (interior of the bowl) -->
    <clipPath id="clip-p">
      <path d="M25,37 H50 A25,20 0 0,1 50,77 H25 Z"/>
    </clipPath>
    <!-- Clip to the R counter -->
    <clipPath id="clip-r">
      <path d="M109,37 H134 A25,20 0 0,1 134,77 H109 Z"/>
    </clipPath>
  </defs>

  <!-- ══ P ══ -->
  <!-- Stem -->
  <rect x="12" y="24" width="13" height="144" rx="3" fill="#f5c518"/>
  <!-- Bowl (D-shape): flat left at x=25, arc from (50,24) → (50,90) rightmost x=88 -->
  <path d="M25,24 H50 A38,33 0 0,1 50,90 H25 Z" fill="#f5c518"/>
  <!-- Counter (dark interior) -->
  <path d="M25,37 H50 A25,20 0 0,1 50,77 H25 Z" fill="#111111"/>
  <!-- Piano keys clipped to counter -->
  <g clip-path="url(#clip-p)">
    <!-- White keys -->
    <rect x="25" y="37" width="16" height="40" fill="#f5c518"/>
    <rect x="43" y="37" width="16" height="40" fill="#f5c518"/>
    <rect x="61" y="37" width="16" height="40" fill="#f5c518"/>
    <!-- Gaps between white keys -->
    <rect x="41" y="37" width="2"  height="40" fill="#111111"/>
    <rect x="59" y="37" width="2"  height="40" fill="#111111"/>
    <!-- Black keys (C# and D#) -->
    <rect x="36" y="37" width="9"  height="25" rx="1" fill="#111111"/>
    <rect x="54" y="37" width="9"  height="25" rx="1" fill="#111111"/>
  </g>

  <!-- ══ R ══ -->
  <!-- Stem -->
  <rect x="96" y="24" width="13" height="144" rx="3" fill="#f5c518"/>
  <!-- Bowl (same D-shape, shifted 84px right) -->
  <path d="M109,24 H134 A38,33 0 0,1 134,90 H109 Z" fill="#f5c518"/>
  <!-- Counter -->
  <path d="M109,37 H134 A25,20 0 0,1 134,77 H109 Z" fill="#111111"/>
  <!-- Piano keys clipped to counter -->
  <g clip-path="url(#clip-r)">
    <rect x="109" y="37" width="16" height="40" fill="#f5c518"/>
    <rect x="127" y="37" width="16" height="40" fill="#f5c518"/>
    <rect x="145" y="37" width="16" height="40" fill="#f5c518"/>
    <rect x="125" y="37" width="2"  height="40" fill="#111111"/>
    <rect x="143" y="37" width="2"  height="40" fill="#111111"/>
    <rect x="120" y="37" width="9"  height="25" rx="1" fill="#111111"/>
    <rect x="138" y="37" width="9"  height="25" rx="1" fill="#111111"/>
  </g>

  <!-- R leg (diagonal from bowl bottom-right) -->
  <line x1="134" y1="90" x2="172" y2="162"
        stroke="#f5c518" stroke-width="13" stroke-linecap="round"/>
</svg>
