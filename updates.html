<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Practice Room Updates — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.png"  />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
  <script src="/shared-header.js"></script>
  <script src="/shared-comments.js"></script>
  <style>
    /* ── Theme ──────────────────────────────────────────────────────────────── */
    :root {
      --bg:           #faf7f3;
      --surface:      #ffffff;
      --surface-2:    #f0ebe2;
      --border:       #e0d5c8;
      --text:         #1a1410;
      --text-muted:   #8a7868;
      --accent-subtle:#fdf0d8;
      /* Update accent: teal */
      --update-clr:        #0f766e;
      --update-bg:         rgba(15,118,110,.08);
      --update-border:     rgba(15,118,110,.22);
    }
    body { background: var(--bg); }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    #up-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    /* ── Page header ─────────────────────────────────────────────────────────── */
    .up-page-hdr {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .up-page-hdr h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }
    .up-page-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Admin form card ────────────────────────────────────────────────────── */
    .up-form-card {
      background: var(--surface);
      border: 1.5px solid var(--update-clr);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
    }
    .up-form-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 18px;
    }

    .up-form-field { margin-bottom: 16px; }
    .up-form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .up-form-input,
    .up-form-textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      resize: vertical;
      transition: border-color .15s;
    }
    .up-form-input:focus,
    .up-form-textarea:focus { outline: none; border-color: var(--update-clr); }
    .up-form-hint { font-size: .76rem; color: var(--text-muted); margin: 4px 0 0; }
    .up-form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    /* Post composer */
    .up-composer-wrap {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }
    .up-composer-body { padding: 14px 16px; background: var(--surface); }
    .up-composer-title {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--border);
      padding: 6px 0 10px;
      margin-bottom: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }
    .up-composer-title::placeholder { font-weight: 400; color: var(--text-muted); }
    .up-composer-title:focus { border-bottom-color: var(--update-clr); }
    .up-composer-textarea {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      resize: none;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.6;
      min-height: 90px;
      padding: 0;
      outline: none;
    }
    .up-composer-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    /* ── Feed cards ─────────────────────────────────────────────────────────── */
    .up-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-left: 3.5px solid var(--update-clr);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
      transition: border-color .15s;
      cursor: pointer;
    }
    .up-card:hover {
      border-color: rgba(15,118,110,.35);
      border-left-color: var(--update-clr);
    }

    /* Card header strip */
    .up-card-hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: var(--update-bg);
      border-bottom: 1px solid var(--update-border);
    }
    .up-type-badge {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: var(--update-clr);
    }
    .up-card-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .up-edit-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      margin-left: 8px;
      transition: background .15s;
    }
    .up-edit-btn:hover { background: var(--surface-2); border-color: #bbb; }

    /* Card body */
    .up-card-body { padding: 14px 18px 10px; }

    /* Post body */
    .up-post-body {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 4px 0 8px;
    }
    .up-post-media { margin-top: 10px; }
    .up-post-media > div { width: 100% !important; }

    /* Card title (shared) */
    .up-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin: 0 0 4px;
    }

    /* Card footer */
    .up-card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0 14px;
      margin: 0 18px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
    }
    .up-meta-counts { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
    .up-footer-btn {
      background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.82rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 6px; border-radius: 6px;
      transition: color .15s, background .15s;
    }
    .up-footer-btn:hover { color: var(--text); background: rgba(0,0,0,.05); }

    /* Detail view */
    #up-detail { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
    .up-detail-back {
      display: inline-flex; align-items: center; gap: 6px;
      background: none; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 6px 14px; font-size: 0.85rem; font-weight: 600;
      cursor: pointer; font-family: inherit; color: var(--text-muted);
      margin-bottom: 20px; transition: border-color .15s, color .15s;
    }
    .up-detail-back:hover { border-color: var(--text-muted); color: var(--text); }
    .up-detail-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-left: 3.5px solid var(--update-clr);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* Shared reaction button style */
    .focus-footer-btn, .tc-react-btn {
      background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.82rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 6px; border-radius: 6px;
      transition: color .15s, background .15s;
    }
    .focus-footer-btn:hover, .tc-react-btn:hover { color: var(--text); background: rgba(0,0,0,.05); }
    .tc-react-btn.liked { color: #e879a0; }

    /* Comments wrap */
    .up-cmt-wrap {
      margin-top: 12px;
    }
    .up-cmt-wrap .tc-comments-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* Empty state */
    .up-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      main { padding: 0; }
      #up-main { padding: 16px 0 80px; }
      .up-card,
      .up-detail-card { border-radius: 0; border-left: none; border-right: none; margin-bottom: 8px; }
      .up-card-body { padding: 14px 16px 10px; }
      .up-card-footer { padding: 8px 0 12px; margin: 0 16px; }
      .up-cmt-wrap { padding: 0 0 14px; }
      .tc-comments-section { border-radius: 0; border-left: none; border-right: none; }
      /* Detail view — full width on mobile */
      #up-detail { padding: 0 0 60px; }
      .up-detail-back { margin: 16px 16px 14px; }
      .up-cmt-wrap { margin-top: 8px; }
    }
  </style>
</head>
<body>
  <header id="app-header" style="display:none"></header>
  <main>
    <div id="up-main" style="display:none">

      <!-- Page header -->
      <div class="up-page-hdr">
        <div>
          <h2>Practice Room Updates</h2>
          <p class="up-page-desc">News, announcements and updates from Matthew Cawood.</p>
        </div>
        <button id="up-new-btn" class="btn btn-primary" onclick="openUpForm()" style="display:none">+ Post Update</button>
      </div>

      <!-- ── Admin form ──────────────────────────────────────────────────────── -->
      <div id="up-form-wrap" style="display:none">
        <div class="up-form-card">
          <h3 id="up-form-title">New Update</h3>

          <!-- Composer -->
          <div class="up-form-field">
            <label class="up-form-label">Content</label>
            <div class="up-composer-wrap">
              <div class="up-composer-body">
                <input class="up-composer-title" id="uppost-title" type="text"
                       placeholder="Title (optional)…" maxlength="120" />
                <textarea class="up-composer-textarea" id="uppost-body"
                          placeholder="What's the update?"
                          oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
              </div>
              <!-- Shared-comments.js inline toolbar injected here -->
              <div id="uppost-toolbar-area" style="border-top:1px solid var(--border);padding:8px 14px;background:var(--surface)"></div>
              <div class="up-composer-footer">
                <div style="flex:1"></div>
                <button class="btn btn-ghost btn-sm" onclick="closeUpForm()">Cancel</button>
                <button id="uppost-submit" class="btn btn-primary btn-sm" onclick="publishUpdate()">Publish &amp; Notify Members</button>
              </div>
            </div>
          </div>
          <div class="up-form-field" style="margin-top:12px">
            <label class="up-form-label">Published date</label>
            <input id="uppost-date" class="up-form-input" type="datetime-local" />
          </div>
        </div>
      </div>

      <!-- ── Feed ───────────────────────────────────────────────────────────── -->
      <div id="up-feed">
        <div class="up-empty">
          <div class="loading-spinner" style="margin:0 auto 12px"></div>
          Loading…
        </div>
      </div>

    </div>

    <!-- ── Post detail view ─────────────────────────────────────────────────── -->
    <div id="up-detail" style="display:none">
      <button class="up-detail-back" onclick="closeUpDetail()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <div id="up-detail-card"></div>
      <div id="up-detail-comments"></div>
    </div>

  </main>

<script>
/* ──────────────────────────────────────────────────────────────────────────── */
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db        = supabase.createClient(SUPA_URL, SUPA_ANON);
const OWNER_EMAIL = "matthew@matthewcawood.com";

/* ── SVG icon strings ────────────────────────────────────────────────────── */
const SVG_UPDATE = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-2px;margin-right:5px"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 9.5-9.5z"/></svg>`;
const SVG_CMT    = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-2px;margin-right:5px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
const SVG_EDIT   = `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-1px;margin-right:3px"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 9.5-9.5z"/></svg>`;

let myEmail = null, myName = null, myAvatarUrl = null, isAdmin = false;
let _updates        = [];
let _likerAvatarMap = {};
let _upLikersMap    = {}; // updateId → [email, ...]
let _editUpdateId   = null;
let _toolbarInjected = false;

/* ── Auth ─────────────────────────────────────────────────────────────────── */
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail    = session.user.email;
  const { data: ae } = await db.from("allowed_emails")
    .select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName      = ae?.name || myEmail.split("@")[0];
  myAvatarUrl = ae?.avatar_url || null;
  isAdmin     = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "studio", avatarUrl: myAvatarUrl });

  initCommentsSystem({
    db,
    auth: { email: myEmail, name: myName, avatarUrl: myAvatarUrl, isAdmin },
    comments:  { table: 'practice_room_update_comments', parentField: 'update_id' },
    reactions: { table: 'practice_room_update_likes',    parentField: 'update_id' },
    replyNotificationLinkFn: (parentId) => `/updates.html?post=${parentId}`,
    ownerEmail: OWNER_EMAIL,
    ownerNotifyTitleFn:   (name) => `${name} commented on an update`,
    ownerReactionTitleFn: (name, emoji) => `${name} reacted ${emoji} to an update`,
    onReactionChange: (parentId) => {
      const rxData = Comments.getReactionState(parentId);
      let total = 0, iMine = false;
      for (const d of Object.values(rxData)) { total += d.count; if (d.mine) iMine = true; }
      const u = _updates.find(x => x.id === parentId);
      const cc = u?.commentCount || 0;
      _setMeta(parentId, total, cc);
      if (!_upLikersMap[parentId]) _upLikersMap[parentId] = [];
      if (iMine && !_upLikersMap[parentId].includes(myEmail)) {
        if (!_likerAvatarMap[myEmail]) _likerAvatarMap[myEmail] = { url: myAvatarUrl, name: myName };
        _upLikersMap[parentId].unshift(myEmail);
      } else if (!iMine) {
        _upLikersMap[parentId] = _upLikersMap[parentId].filter(e => e !== myEmail);
      }
      _updateLikerChips(parentId);
    },
    onCommentChange: (parentId) => {
      const listEl = document.getElementById(`tc-comments-list-${parentId}`);
      const count  = listEl ? listEl.querySelectorAll('.tc-comment-item').length : 0;
      const u = _updates.find(x => x.id === parentId);
      if (u) u.commentCount = count;
      const rxData = Comments.getReactionState(parentId);
      let total = 0;
      for (const d of Object.values(rxData)) total += d.count;
      _setMeta(parentId, total, count);
    },
  });

  if (isAdmin) {
    document.getElementById("up-new-btn").style.display = "";
    // Inject toolbar on first form open
  }
  document.getElementById("up-main").style.display = "";

  const deepId = new URLSearchParams(window.location.search).get("post");
  await loadFeed(deepId);
})();

function _likerChipsInner(updateId) {
  const likers = (_upLikersMap[updateId] || []).slice(0, 3);
  const total  = (_upLikersMap[updateId] || []).length;
  if (!total) return "";
  const chips = likers.map(email => {
    const info  = _likerAvatarMap[email];
    const name  = info?.name || email.split("@")[0];
    const col   = _avatarColour(email);
    const inner = info?.url
      ? `<img src="${_esc(info.url)}" alt="${_esc(name)}">`
      : `<span style="background:${col.bg};color:${col.fg};width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:800;border-radius:50%">${name[0].toUpperCase()}</span>`;
    return `<div class="tc-like-chip">${inner}</div>`;
  }).join("");
  return chips + (total > 3 ? `<span style="font-size:.72rem;color:var(--text-muted);margin-left:6px">+${total - 3}</span>` : "");
}

function _updateLikerChips(updateId) {
  document.querySelectorAll(`.up-likers-${updateId}`).forEach(el => {
    const inner = _likerChipsInner(updateId);
    el.innerHTML = inner;
    el.style.display = inner ? "" : "none";
  });
}

function _setMeta(parentId, totalRx, cc) {
  const rxPart  = totalRx ? `<span>${totalRx} reaction${totalRx!==1?"s":""}</span>` : "";
  const cmtPart = cc      ? `<span onclick="event.stopPropagation();showDetail('${parentId}')" style="cursor:pointer">${cc} comment${cc!==1?"s":""}</span>` : "";
  const html = [rxPart, cmtPart].filter(Boolean).join(" · ");
  document.querySelectorAll(`.up-meta-${parentId}`).forEach(el => el.innerHTML = html);
}

/* ── Load feed ────────────────────────────────────────────────────────────── */
async function loadFeed(deepId = null) {
  const feed = document.getElementById("up-feed");
  feed.innerHTML = '<div class="up-empty"><div class="loading-spinner" style="margin:0 auto 12px"></div>Loading…</div>';

  const { data: rows, error } = await db
    .from("practice_room_updates")
    .select("*")
    .order("published_at", { ascending: false });

  if (error || !rows) {
    feed.innerHTML = '<div class="up-empty">Could not load updates.</div>';
    return;
  }
  if (!rows.length) {
    feed.innerHTML = `<div class="up-empty">Nothing here yet${isAdmin ? " — publish the first update above!" : "."}</div>`;
    return;
  }

  const ids = rows.map(r => r.id);
  const [{ data: allLikes }, { data: cmtRows }] = await Promise.all([
    db.from("practice_room_update_likes").select("update_id,email,emoji").in("update_id", ids),
    db.from("practice_room_update_comments").select("update_id").in("update_id", ids),
  ]);

  await Comments.loadReactions(ids);

  const cmtCountMap = {}, likersMap = {};
  _upLikersMap = {};
  (allLikes || []).forEach(l => {
    if (!likersMap[l.update_id]) likersMap[l.update_id] = [];
    if (likersMap[l.update_id].length < 3) likersMap[l.update_id].push(l.email);
    if (!_upLikersMap[l.update_id]) _upLikersMap[l.update_id] = [];
    if (!_upLikersMap[l.update_id].includes(l.email)) _upLikersMap[l.update_id].push(l.email);
  });
  (cmtRows || []).forEach(c => cmtCountMap[c.update_id] = (cmtCountMap[c.update_id] || 0) + 1);

  const likerEmails = [...new Set((allLikes || []).map(l => l.email))];
  if (likerEmails.length) {
    const { data: likerRows } = await db.from("allowed_emails")
      .select("email,avatar_url,name").in("email", likerEmails);
    (likerRows || []).forEach(r => { _likerAvatarMap[r.email] = { url: r.avatar_url, name: r.name }; });
  }

  _updates = rows.map(r => {
    const rxData = Comments.getReactionState(r.id);
    let totalRx = 0;
    for (const d of Object.values(rxData)) totalRx += d.count;
    return { ...r, likeCount: totalRx, commentCount: cmtCountMap[r.id] || 0, likers: likersMap[r.id] || [] };
  });

  renderFeed();

  if (deepId) {
    showDetail(deepId);
  }
}

/* ── Render ───────────────────────────────────────────────────────────────── */
function renderFeed() {
  const feed = document.getElementById("up-feed");
  if (!_updates.length) {
    feed.innerHTML = `<div class="up-empty">No updates yet.</div>`;
    return;
  }
  feed.innerHTML = _updates.map(upCardHTML).join("");
}

function upCardHTML(u) {
  const dateStr  = formatDate(u.published_at);
  const editBtn  = isAdmin
    ? `<button class="up-edit-btn" onclick="event.stopPropagation();openEditUpForm('${u.id}')">${SVG_EDIT}Edit</button>`
    : "";

  const rxData = Comments.getReactionState(u.id);
  let totalRx = 0;
  for (const d of Object.values(rxData)) totalRx += d.count;

  const safeKey  = `up_${u.id.replace(/-/g,'_')}`;
  const reactBtn = Comments.reactBtnHtml(u.id, safeKey);

  const likerChips = (u.likers || []).map(email => {
    const info  = _likerAvatarMap[email];
    const name  = info?.name || email.split("@")[0];
    const col   = _avatarColour(email);
    const inner = info?.url
      ? `<img src="${_esc(info.url)}" alt="${_esc(name)}">`
      : `<span style="background:${col.bg};color:${col.fg};width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:800;border-radius:50%">${name[0].toUpperCase()}</span>`;
    return `<div class="tc-like-chip">${inner}</div>`;
  }).join("");

  const rxPart  = totalRx        ? `<span>${totalRx} reaction${totalRx!==1?"s":""}</span>` : "";
  const cmtPart = u.commentCount ? `<span onclick="event.stopPropagation();showDetail('${u.id}')" style="cursor:pointer">${u.commentCount} comment${u.commentCount!==1?"s":""}</span>` : "";
  const metaTxt = [rxPart, cmtPart].filter(Boolean).join(" · ");

  return `
    <div class="up-card" id="up-${u.id}" onclick="showDetail('${u.id}')">
      <div class="up-card-hdr">
        <span class="up-type-badge">${SVG_UPDATE}Practice Room Update</span>
        <span class="up-card-date">${dateStr}</span>
        ${editBtn}
      </div>
      <div class="up-card-body" id="up-body-${u.id}">${_upBody(u)}</div>
      <div class="up-card-footer" onclick="event.stopPropagation()">
        ${reactBtn}
        <button class="up-footer-btn" onclick="showDetail('${u.id}')">
          ${SVG_CMT}${u.commentCount ? ` ${u.commentCount}` : ""}
        </button>
        <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
          <span class="tc-like-avatars up-likers-${u.id}" onclick="event.stopPropagation();Comments.showLikers('${u.id}',event)"
            style="cursor:pointer;${totalRx===0?"display:none":""}" title="See who reacted">${_likerChipsInner(u.id)}</span>
          <span class="up-meta-counts up-meta-${u.id}">${metaTxt}</span>
        </div>
      </div>
    </div>`;
}

function _upBody(u) {
  const title = u.title ? `<div class="up-card-title">${_esc(u.title)}</div>` : "";
  const body  = u.body  ? `<div class="up-post-body">${_esc(u.body)}</div>`   : "";
  const media = (Array.isArray(u.media) && u.media.length && window._tcRenderMedia)
    ? `<div class="up-post-media">${window._tcRenderMedia({ media: u.media })}</div>`
    : "";
  return `${title}${body}${media}`;
}

/* ── Detail view ─────────────────────────────────────────────────────────── */
function showDetail(updateId) {
  const u = _updates.find(x => x.id === updateId);
  if (!u) return;

  document.getElementById("up-main").style.display = "none";
  document.getElementById("up-detail").style.display = "";
  window.scrollTo(0, 0);
  history.pushState({ post: updateId }, "", "?post=" + updateId);

  const rxData = Comments.getReactionState(u.id);
  let totalRx = 0;
  for (const d of Object.values(rxData)) totalRx += d.count;
  const safeKey  = `up_det_${u.id.replace(/-/g,'_')}`;
  const reactBtn = Comments.reactBtnHtml(u.id, safeKey);

  const d = new Date(u.published_at || u.created_at);
  const day = d.getDate();
  const suffix = day===1||day===21||day===31?"st":day===2||day===22?"nd":day===3||day===23?"rd":"th";
  const dateStr = `${day}${suffix} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]} ${d.getFullYear()}`;

  document.getElementById("up-detail-card").innerHTML = `
    <div class="up-detail-card">
      <div class="up-card-hdr">
        <span class="up-type-badge">${SVG_UPDATE}Practice Room Update</span>
        <span class="up-card-date">${dateStr}</span>
      </div>
      <div class="up-card-body">${_upBody(u)}</div>
      <div class="up-card-footer" onclick="event.stopPropagation()">
        ${reactBtn}
        <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
          <span class="tc-like-avatars up-likers-${u.id}" onclick="event.stopPropagation();Comments.showLikers('${u.id}',event)"
            style="cursor:pointer;${totalRx===0?"display:none":""}" title="See who reacted">${_likerChipsInner(u.id)}</span>
          <span class="up-meta-counts up-meta-${u.id}">${[totalRx ? `<span>${totalRx} reaction${totalRx!==1?"s":""}</span>` : "", u.commentCount ? `<span>${u.commentCount} comment${u.commentCount!==1?"s":""}</span>` : ""].filter(Boolean).join(" · ")}</span>
        </div>
      </div>
    </div>`;

  document.getElementById("up-detail-comments").innerHTML = `
    <div class="up-cmt-wrap">
      <div class="tc-comments-section">
        <div id="tc-comments-hdr-${u.id}" class="tc-comments-hdr">Comments</div>
        <div id="tc-comments-list-${u.id}"></div>
        ${Comments.formHtml(u.id)}
      </div>
    </div>`;

  Comments.load(u.id).then(() => {
    const listEl = document.getElementById(`tc-comments-list-${u.id}`);
    const count  = listEl ? listEl.querySelectorAll('.tc-comment-item').length : 0;
    if (count !== u.commentCount) {
      u.commentCount = count;
      const rxData = Comments.getReactionState(u.id);
      let rx = 0; for (const d of Object.values(rxData)) rx += d.count;
      _setMeta(u.id, rx, count);
    }
  });
}

function closeUpDetail() {
  document.getElementById("up-detail").style.display = "none";
  document.getElementById("up-main").style.display = "";
  window.scrollTo(0, 0);
  history.pushState({}, "", "/updates.html");
}

window.addEventListener("popstate", (e) => {
  if (e.state?.post) {
    showDetail(e.state.post);
  } else {
    document.getElementById("up-detail").style.display = "none";
    document.getElementById("up-main").style.display = "";
    window.scrollTo(0, 0);
  }
});

/* ── Admin form ──────────────────────────────────────────────────────────── */
function openUpForm() {
  _editUpdateId = null;
  document.getElementById("up-form-title").textContent = "New Update";
  document.getElementById("uppost-submit").textContent = "Publish & Notify Members";
  document.getElementById("uppost-title").value = "";
  document.getElementById("uppost-body").value  = "";
  document.getElementById("uppost-body").style.height = "";
  _setDateNow("uppost-date");
  document.getElementById("up-form-wrap").style.display = "";
  document.getElementById("up-new-btn").style.display   = "none";
  // Inject shared-comments toolbar on first use
  if (!_toolbarInjected && window._inlineToolbarHtml) {
    const area = document.getElementById("uppost-toolbar-area");
    if (area) {
      area.innerHTML = window._inlineToolbarHtml("upp");
      _toolbarInjected = true;
    }
  }
  document.getElementById("up-form-wrap").scrollIntoView({ behavior:"smooth", block:"start" });
}

function openEditUpForm(updateId) {
  const u = _updates.find(x => x.id === updateId);
  if (!u) return;
  _editUpdateId = updateId;
  document.getElementById("up-form-title").textContent = "Edit Update";
  document.getElementById("uppost-submit").textContent = "Save Changes";
  document.getElementById("uppost-title").value = u.title || "";
  document.getElementById("uppost-body").value  = u.body  || "";
  _setDateFromTs("uppost-date", u.published_at);
  document.getElementById("up-form-wrap").style.display = "";
  document.getElementById("up-new-btn").style.display   = "none";
  // Inject toolbar if not yet done
  if (!_toolbarInjected && window._inlineToolbarHtml) {
    const area = document.getElementById("uppost-toolbar-area");
    if (area) {
      area.innerHTML = window._inlineToolbarHtml("upp");
      _toolbarInjected = true;
    }
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeUpForm() {
  _editUpdateId = null;
  document.getElementById("up-form-wrap").style.display = "none";
  document.getElementById("up-new-btn").style.display   = "";
  if (_toolbarInjected) {
    window._clearInlineState?.("upp");
  }
}

/* ── Publish / save ──────────────────────────────────────────────────────── */
async function publishUpdate() {
  const btn = document.getElementById("uppost-submit");
  if (!btn || btn.disabled) return;

  const title = document.getElementById("uppost-title").value.trim();
  const body  = document.getElementById("uppost-body").value.trim();
  const dateV = document.getElementById("uppost-date").value;
  if (!title && !body) { alert("Please add a title or some content."); return; }

  const media = (typeof Comments.readMedia === "function") ? Comments.readMedia("upp") : [];
  const payload = { title, body, media, published_at: _toIso(dateV) };

  btn.disabled = true;
  const origText = btn.textContent;

  if (_editUpdateId) {
    btn.textContent = "Saving…";
    const { error } = await db.from("practice_room_updates").update(payload).eq("id", _editUpdateId);
    if (error) { alert("Failed to save: " + error.message); btn.disabled = false; btn.textContent = origText; return; }
    closeUpForm();
    btn.disabled = false; btn.textContent = origText;
    _editUpdateId = null;
    await loadFeed();

  } else {
    btn.textContent = "Publishing…";
    const { data: post, error } = await db.from("practice_room_updates").insert(payload).select().single();
    if (error) { alert("Failed to publish: " + error.message); btn.disabled = false; btn.textContent = origText; return; }

    // Notify members
    btn.textContent = "Notifying members…";
    const { data: members } = await db.from("allowed_emails").select("email");
    if (members?.length) {
      const notifications = members.filter(m => m.email !== myEmail).map(m => ({
        email:    m.email,
        type:     "practice_room_update",
        title:    "New Practice Room Update",
        body:     (payload.title || payload.body || "").slice(0, 120),
        link_url: `/updates.html?post=${post.id}`,
        metadata: {},
      }));
      if (notifications.length) await db.from("notifications").insert(notifications);
    }

    closeUpForm();
    btn.disabled = false; btn.textContent = origText;
    await loadFeed(post.id);
  }
}

/* ── Utilities ───────────────────────────────────────────────────────────── */
function _setDateNow(inputId) {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  const el = document.getElementById(inputId);
  if (el) el.value = now.toISOString().slice(0, 16);
}

function _setDateFromTs(inputId, ts) {
  if (!ts) return;
  const d = new Date(ts);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  const el = document.getElementById(inputId);
  if (el) el.value = d.toISOString().slice(0, 16);
}

function _toIso(dateVal) {
  return dateVal ? new Date(dateVal).toISOString() : new Date().toISOString();
}

function formatDate(ts) {
  if (!ts) return "";
  const d   = new Date(ts);
  const day = d.getDate();
  const sfx = day===1||day===21||day===31 ? "st" : day===2||day===22 ? "nd" : day===3||day===23 ? "rd" : "th";
  const mon = ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()];
  return `${day}${sfx} ${mon} ${d.getFullYear()}`;
}

function _esc(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function _avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)",fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)",fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)",fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}
