<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Admin Analytics — The Practice Room</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    /* ── Layout ── */
    .analytics-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

    /* ── Overview stat cards ── */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
      margin-bottom: 32px;
    }
    @media (max-width: 900px) { .overview-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (max-width: 500px) { .overview-grid { grid-template-columns: repeat(2, 1fr); } }
    .stat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      text-align: center;
    }
    .stat-card .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      margin-bottom: 6px;
    }
    .stat-card .stat-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── Section headers ── */
    .section-header {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 14px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header .section-meta {
      font-size: 0.78rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: auto;
    }

    /* ── Student cards grid ── */
    .students-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      margin-bottom: 36px;
    }
    .student-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      position: relative;
      overflow: hidden;
    }
    .student-card::before {
      content: "";
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      border-radius: 12px 0 0 12px;
      background: var(--activity-color, #444);
    }
    .student-card.active-green::before  { background: #22c55e; }
    .student-card.active-amber::before  { background: #f59e0b; }
    .student-card.active-red::before    { background: #ef4444; }
    .student-card.active-none::before   { background: #555; }

    .sc-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .sc-email { font-size: 0.9rem; font-weight: 600; color: var(--text); word-break: break-all; }
    .sc-last-seen {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .sc-last-seen.green { background: #052b16; color: #22c55e; }
    .sc-last-seen.amber { background: #2b1900; color: #f59e0b; }
    .sc-last-seen.red   { background: #2b0606; color: #ef4444; }
    .sc-last-seen.none  { background: #1a1a1a; color: #666; }

    .sc-stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .sc-stat { text-align: center; }
    .sc-stat-val { font-size: 1.25rem; font-weight: 700; color: var(--text); }
    .sc-stat-lbl { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

    .sc-footer { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .sc-badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 20px;
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .sc-badge.pending { background: #1a1200; color: #f59e0b; border-color: #3a2a00; }
    .sc-badge.streak  { background: #1a0d00; color: #fb923c; border-color: #3a1f00; }
    .sc-view-btn {
      margin-left: auto;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 6px;
      background: none;
      border: 1.5px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }
    .sc-view-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Recent activity feed ── */
    .activity-feed { margin-bottom: 36px; }
    .activity-item {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: 6px;
      flex-shrink: 0;
    }
    .activity-body { flex: 1; }
    .activity-email { font-size: 0.85rem; font-weight: 600; color: var(--text); }
    .activity-detail { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .activity-time { font-size: 0.75rem; color: var(--text-muted); flex-shrink: 0; white-space: nowrap; }

    /* ── Top pieces table ── */
    .top-pieces { margin-bottom: 36px; }
    .top-piece-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .top-piece-row:last-child { border-bottom: none; }
    .top-piece-rank { font-size: 0.9rem; font-weight: 700; color: var(--text-muted); width: 24px; flex-shrink: 0; }
    .top-piece-name { flex: 1; font-size: 0.88rem; color: var(--text); }
    .top-piece-composer { font-size: 0.75rem; color: var(--text-muted); }
    .top-piece-bar-wrap { width: 120px; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; flex-shrink: 0; }
    .top-piece-bar { height: 100%; background: var(--accent); border-radius: 3px; }
    .top-piece-mins { font-size: 0.78rem; color: var(--text-muted); width: 56px; text-align: right; flex-shrink: 0; }

    /* ── Two column layout for bottom section ── */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 700px) { .two-col { grid-template-columns: 1fr; } }

    /* ── Loading ── */
    .loading-msg { text-align: center; color: var(--text-muted); padding: 60px 0; font-size: 0.95rem; }

    /* ── Requests list ── */
    .pending-req-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }
    .pending-req-item:last-child { border-bottom: none; }
    .pending-req-title { font-weight: 600; color: var(--text); }
    .pending-req-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    /* ── Week heatmap ── */
    .week-grid { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
    .week-cell {
      width: 12px; height: 12px;
      border-radius: 2px;
      background: var(--border);
    }
    .week-cell.l1 { background: #2a1f00; }
    .week-cell.l2 { background: #6b4c00; }
    .week-cell.l3 { background: #b07d00; }
    .week-cell.l4 { background: var(--accent); }

    /* ── Day of week heatmap ── */
    .dow-grid { display: flex; gap: 6px; margin-bottom: 8px; }
    .dow-cell {
      flex: 1; border-radius: 6px; padding: 10px 4px;
      text-align: center; background: var(--border);
    }
    .dow-cell-label { font-size: .65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .dow-cell-val   { font-size: .82rem; font-weight: 700; color: var(--text); }
    .dow-cell.l0 { background: var(--border); }
    .dow-cell.l1 { background: #2a1f00; }
    .dow-cell.l2 { background: #5a3f00; }
    .dow-cell.l3 { background: #996a00; }
    .dow-cell.l4 { background: var(--accent); }

    /* ── Type breakdown ── */
    .type-bar-wrap { display: flex; height: 10px; border-radius: 5px; overflow: hidden; gap: 2px; margin: 10px 0; }
    .type-bar-seg  { height: 100%; border-radius: 3px; }
    .type-legend   { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 8px; }
    .type-legend-item { display: flex; align-items: center; gap: 5px; font-size: .74rem; color: var(--text-muted); }
    .type-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* ── Clinic bookings ── */
    .clinic-item {
      padding: 10px 0; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 12px;
    }
    .clinic-item:last-child { border-bottom: none; }
    .clinic-date  { font-size: .78rem; font-weight: 700; color: var(--accent); min-width: 80px; flex-shrink: 0; }
    .clinic-name  { font-size: .85rem; font-weight: 600; color: var(--text); }
    .clinic-meta  { font-size: .74rem; color: var(--text-muted); margin-top: 2px; }
    .clinic-zoom  { font-size: .72rem; color: #2D8CFF; text-decoration: none; }
    .clinic-zoom:hover { text-decoration: underline; }

    /* ── Share card ── */
    .share-bar { display: flex; align-items: center; justify-content: flex-end; margin-bottom: 16px; }
    .share-btn {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 7px 14px; cursor: pointer;
      font-size: .78rem; color: var(--text-muted); font-family: inherit;
      transition: border-color .15s, color .15s;
    }
    .share-btn:hover { border-color: var(--accent); color: var(--text); }
    #share-card {
      background: #0d0d0d;
      border-radius: 16px;
      padding: 0;
      margin-bottom: 32px;
      border: 1px solid #222;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      overflow: hidden;
    }
    .scard-accent { height: 4px; background: linear-gradient(90deg, #f59e0b, #f97316, #ec4899); }
    .scard-body   { padding: 28px 32px; }
    .scard-top    { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; }
    .scard-title  { font-size: 1.1rem; font-weight: 800; color: #fff; letter-spacing: -.02em; }
    .scard-sub    { font-size: .72rem; color: #555; margin-top: 3px; }
    .scard-badge  { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 20px; padding: 5px 12px; font-size: .7rem; color: #888; }
    .scard-stats  { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 22px; align-items: start; }
    .scard-stat   { background: #141414; border-radius: 10px; padding: 14px 16px; border: 1px solid #1e1e1e; }
    .scard-stat .v { font-size: 1.3rem; font-weight: 800; color: #f59e0b; line-height: 1; margin-bottom: 5px; white-space: nowrap; }
    .scard-stat .l { font-size: .65rem; color: #555; text-transform: uppercase; letter-spacing: .06em; }
    .scard-divider { height: 1px; background: #1a1a1a; margin: 18px 0; }
    .scard-section-label { font-size: .65rem; color: #444; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .scard-type-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; gap: 2px; margin-bottom: 10px; }
    .scard-type-seg { height: 100%; border-radius: 3px; }
    .scard-type-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 18px; }
    .scard-type-item { display: flex; align-items: center; gap: 5px; font-size: .7rem; color: #666; }
    .scard-type-dot  { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .scard-pieces { display: flex; flex-direction: column; gap: 0; }
    .scard-piece  { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #1a1a1a; }
    .scard-piece:last-child { border-bottom: none; }
    .scard-piece-n  { font-size: .68rem; color: #3a3a3a; width: 14px; font-weight: 700; flex-shrink: 0; }
    .scard-piece-name { flex: 1; font-size: .8rem; color: #ccc; }
    .scard-piece-comp { font-size: .7rem; color: #444; margin-left: 5px; }
    .scard-piece-bar-wrap { width: 80px; height: 4px; background: #1e1e1e; border-radius: 2px; flex-shrink: 0; }
    .scard-piece-bar { height: 100%; background: #f59e0b; border-radius: 2px; }
    .scard-piece-mins { font-size: .7rem; color: #555; min-width: 52px; text-align: right; flex-shrink: 0; white-space: nowrap; }
    .scard-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 20px; padding-top: 16px; border-top: 1px solid #1a1a1a; }
    .scard-footer-brand { font-size: .72rem; color: #333; font-weight: 600; letter-spacing: .02em; }
    .scard-footer-url   { font-size: .65rem; color: #333; }

    /* ── Square share cards (YouTube Community — 1 stat each) ── */
    .sq-cards-wrap { position: fixed; top: -9999px; left: -9999px; pointer-events: none; }
    .sq-card {
      width: 500px; height: 500px;
      background: #080808; overflow: hidden;
      display: flex; flex-direction: column; position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
    }
    /* warm radial glow behind content */
    .sq-glow {
      position: absolute; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none;
      background: radial-gradient(ellipse 75% 65% at 50% 48%, rgba(245,158,11,.11) 0%, transparent 70%);
    }
    .sq-accent { height: 7px; background: linear-gradient(90deg, #f59e0b 0%, #f97316 55%, #ec4899 100%); flex-shrink: 0; position: relative; z-index: 1; }
    .sq-body   { display: flex; flex-direction: column; flex: 1; padding: 26px 32px 28px; position: relative; z-index: 1; }
    .sq-brand  { font-size: .6rem; font-weight: 800; color: #f59e0b; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
    /* centre stage — big number cards */
    /* nudge the whole stat block slightly above true centre */
    .sq-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-bottom: 20px; }
    /* label + value grouped as one readable unit */
    .sq-stat-unit { display: flex; flex-direction: column; align-items: center; }
    .sq-big-label { font-size: 1.05rem; font-weight: 500; color: #bbb; line-height: 1.35; margin-bottom: 14px; }
    .sq-big-value { font-size: 7rem; font-weight: 900; color: #fff; line-height: 1; letter-spacing: -.05em; white-space: nowrap; }
    .sq-big-sub   { font-size: .8rem; color: #444; margin-top: 5px; }
    /* top piece card */
    .sq-piece-title    { font-size: 2.1rem; font-weight: 900; color: #fff; line-height: 1.12; letter-spacing: -.03em; max-width: 390px; }
    .sq-piece-composer { font-size: .82rem; color: #4a4a4a; margin-top: 9px; }
    /* top 5 pieces list */
    .sq-pl-list { width: 100%; display: flex; flex-direction: column; }
    .sq-pl-item { display: flex; align-items: center; gap: 14px; padding: 11px 0; border-bottom: 1px solid #111; }
    .sq-pl-item:last-child { border-bottom: none; }
    .sq-pl-num  { font-size: .95rem; font-weight: 900; color: #222; width: 22px; text-align: right; flex-shrink: 0; line-height: 1; }
    .sq-pl-num.top { color: #f59e0b; }
    .sq-pl-info { flex: 1; overflow: hidden; }
    .sq-pl-name { font-size: .82rem; font-weight: 700; color: #ddd; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sq-pl-comp { font-size: .68rem; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .sq-pl-time { font-size: .75rem; font-weight: 700; color: #f59e0b; white-space: nowrap; flex-shrink: 0; }
    /* type bar card */
    .sq-type-wrap { display: flex; flex-direction: column; width: 100%; max-width: 380px; }
    .sq-type-bar  { display: flex; height: 18px; border-radius: 9px; overflow: hidden; gap: 3px; width: 100%; margin-bottom: 24px; }
    .sq-type-seg  { height: 100%; border-radius: 6px; flex-shrink: 0; }
    .sq-type-rows { display: flex; flex-direction: column; gap: 13px; width: 100%; }
    .sq-type-row  { display: flex; align-items: center; gap: 12px; }
    .sq-type-dot  { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .sq-type-name { font-size: .85rem; color: #aaa; flex: 1; }
    .sq-type-pct  { font-size: .85rem; font-weight: 800; color: #fff; min-width: 38px; text-align: right; }
    /* footer */
    .sq-footer { padding-top: 12px; border-top: 1px solid #111; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
    .sq-footer-brand { font-size: .62rem; color: #252525; font-weight: 600; letter-spacing: .03em; }
    .sq-footer-url   { font-size: .6rem; color: #252525; }
  </style>
</head>
<body>

<header id="app-header" style="display:none">
  <div class="header-logo"><img src="/icon-192.png" alt="The Practice Room"></div>
  <div style="flex:1">
    <h1>The Practice Room</h1>
    <p>Admin Analytics</p>
  </div>
  <div class="header-user">
    <span id="header-email"></span>
    <a class="btn btn-ghost btn-sm" href="/index.html"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>Database</a>
    <a class="btn btn-ghost btn-sm" href="https://app.matthewcawood.com">The Practice Room</a>
    <button class="btn btn-ghost btn-sm" id="logout-btn">Log out</button>
  </div>
</header>

<main id="app-main" style="display:none">
  <div class="analytics-wrap">
    <div id="analytics-loading" class="loading-msg">Loading analytics…</div>
    <div id="analytics-content" style="display:none"></div>
  </div>
</main>

<div id="app-auth" style="display:none">
  <div class="hub-header">
    <div style="width:56px;height:56px;border-radius:12px;overflow:hidden;margin:0 auto 12px"><img src="/icon-192.png" alt="" style="width:100%;height:100%;display:block"></div>
    <h1>The Practice Room</h1>
    <p>Admin access only</p>
  </div>
  <div style="max-width:360px;margin:0 auto;padding:0 20px">
    <div id="auth-step-email">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email"
               onkeydown="if(event.key==='Enter')sendOTP()" />
      </div>
      <div id="auth-error" style="color:#f87171;font-size:0.82rem;margin-bottom:10px;display:none"></div>
      <button class="btn btn-primary" style="width:100%" onclick="sendOTP()">Send magic link</button>
    </div>
    <div id="auth-step-otp" style="display:none">
      <p style="color:var(--text-muted);font-size:.88rem;margin-bottom:18px;text-align:center">
        Check your email for a 6-digit code.
      </p>
      <div class="form-group">
        <label>Code</label>
        <input type="text" id="auth-otp" placeholder="123456" maxlength="6" inputmode="numeric"
               autocomplete="one-time-code" onkeydown="if(event.key==='Enter')verifyOTP()" />
      </div>
      <div id="auth-otp-error" style="color:#f87171;font-size:0.82rem;margin-bottom:10px;display:none"></div>
      <button class="btn btn-primary" style="width:100%" onclick="verifyOTP()">Verify</button>
      <button class="btn btn-ghost btn-sm" style="width:100%;margin-top:10px" onclick="backToEmail()">← Use different email</button>
    </div>
  </div>
</div>

<!-- Hidden square cards for YouTube Community image downloads -->
<div class="sq-cards-wrap">
  <div id="sq-card-1" class="sq-card"></div>
  <div id="sq-card-2" class="sq-card"></div>
  <div id="sq-card-3" class="sq-card"></div>
  <div id="sq-card-4" class="sq-card"></div>
  <div id="sq-card-5" class="sq-card"></div>
  <div id="sq-card-6" class="sq-card"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════

const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Auth (OTP magic link) ─────────────────────────────────────
let otpEmail = "";

async function sendOTP() {
  const email = document.getElementById("auth-email").value.trim().toLowerCase();
  const errEl = document.getElementById("auth-error");
  errEl.style.display = "none";
  if (!email) { errEl.textContent = "Enter your email."; errEl.style.display = "block"; return; }
  if (email !== OWNER_EMAIL) {
    errEl.textContent = "Admin access only."; errEl.style.display = "block"; return;
  }
  const { error } = await db.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
  if (error) { errEl.textContent = error.message; errEl.style.display = "block"; return; }
  otpEmail = email;
  document.getElementById("auth-step-email").style.display = "none";
  document.getElementById("auth-step-otp").style.display   = "block";
  setTimeout(() => document.getElementById("auth-otp").focus(), 50);
}

async function verifyOTP() {
  const token = document.getElementById("auth-otp").value.trim();
  const errEl = document.getElementById("auth-otp-error");
  errEl.style.display = "none";
  if (!token) { errEl.textContent = "Enter the code."; errEl.style.display = "block"; return; }
  const { error } = await db.auth.verifyOtp({ email: otpEmail, token, type: "email" });
  if (error) { errEl.textContent = "Invalid or expired code."; errEl.style.display = "block"; return; }
  document.getElementById("app-auth").style.display = "none";
  await boot();
}

function backToEmail() {
  document.getElementById("auth-step-otp").style.display   = "none";
  document.getElementById("auth-step-email").style.display = "block";
  document.getElementById("auth-otp").value = "";
  document.getElementById("auth-otp-error").style.display  = "none";
}

async function boot() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    document.getElementById("app-auth").style.display = "block";
    return;
  }
  if (session.user.email !== OWNER_EMAIL) {
    document.getElementById("app-auth").style.display = "block";
    document.getElementById("auth-error").textContent = "Admin access only.";
    document.getElementById("auth-error").style.display = "block";
    await db.auth.signOut();
    return;
  }
  document.getElementById("header-email").textContent = session.user.email;
  document.getElementById("app-header").style.display = "flex";
  document.getElementById("app-main").style.display   = "block";
  document.getElementById("logout-btn").addEventListener("click", async () => {
    await db.auth.signOut(); location.reload();
  });
  await loadAnalytics();
}

// ── Data loading ─────────────────────────────────────────────
async function loadAnalytics() {
  // Fetch everything in parallel
  const [sessionsRes, itemsRes, streaksRes, requestsRes, piecesRes, gamesRes] = await Promise.all([
    db.from("practice_sessions")
      .select("id, email, session_date, duration_minutes, timing_mode")
      .order("session_date", { ascending: false }),
    db.from("practice_items")
      .select("id, session_id, item_type, piece_id, piece_label, label, duration_minutes"),
    db.from("streak_tokens").select("email, current_streak, longest_streak, last_session_date"),
    db.from("requests").select("id, email, type, title, done, created_at").order("created_at", { ascending: false }),
    db.from("pieces").select("id, title, composer"),
    db.from("passage_games").select("*").order("created_at", { ascending: false }),
  ]);

  if (sessionsRes.error) { console.error("sessions error:", sessionsRes.error); }
  if (itemsRes.error)    { console.error("items error:",    itemsRes.error); }

  // Attach practice_items to their sessions manually
  const itemsBySession = {};
  for (const item of (itemsRes.data || [])) {
    if (!itemsBySession[item.session_id]) itemsBySession[item.session_id] = [];
    itemsBySession[item.session_id].push(item);
  }
  const allSessions = (sessionsRes.data || []).map(s => ({
    ...s, practice_items: itemsBySession[s.id] || []
  }));

  const allStreaks  = streaksRes.data  || [];
  const allRequests = requestsRes.data || [];
  const allPieces   = piecesRes.data   || [];
  const allGames    = gamesRes.data    || [];
  const piecesMap   = Object.fromEntries(allPieces.map(p => [p.id, p]));

  // Fetch upcoming clinic bookings from Cal.com via edge function
  let upcomingClinics = [];
  try {
    const cRes = await fetch(`${SUPABASE_URL}/functions/v1/clinic-admin?action=upcoming`, {
      headers: { "Authorization": `Bearer ${SUPABASE_ANON}` }
    });
    const cData = await cRes.json();
    upcomingClinics = cData.bookings || [];
  } catch(e) { console.warn("Could not load clinic bookings:", e); }

  // Feature-usage time per view (what gets used most)
  let usageRows = [];
  try {
    const uRes = await db.from("feature_usage").select("email, view, seconds, day");
    usageRows = uRes.data || [];
  } catch(e) { console.warn("Could not load feature usage:", e); }

  // Community-health data: membership, community engagement, events, roadmap baseline.
  const _safe = async (p) => { try { return (await p).data || []; } catch (e) { console.warn("load failed:", e); return []; } };
  const [aeRows, posts, comments, likes, rsvps, attendance, events, baseline] = await Promise.all([
    _safe(db.from("allowed_emails").select("email, stripe_customer_id")),
    _safe(db.from("community_posts").select("email, type, created_at")),
    _safe(db.from("community_post_comments").select("email, created_at")),
    _safe(db.from("community_post_likes").select("email, created_at")),
    _safe(db.from("event_rsvps").select("event_id, email")),
    _safe(db.from("event_attendance").select("event_id, email")),
    _safe(db.from("live_events").select("id, title, scheduled_at, status")),
    _safe(db.from("practice_baseline").select("email, total_minutes")),
  ]);

  // Extra signals for the dense dashboard (all best-effort).
  const [pieceGoals, noteScores, chordScores, cfPosts, cfComments, cfLikes, actComments, actReactions, savedPosts, achEvents, feedbackRows] = await Promise.all([
    _safe(db.from("piece_goals").select("email, goal_date, target_date, started_at")),
    _safe(db.from("note_game_scores").select("email, created_at")),
    _safe(db.from("chord_game_scores").select("email, created_at")),
    _safe(db.from("content_feed_posts").select("id, type, created_at")),
    _safe(db.from("content_feed_comments").select("email, created_at")),
    _safe(db.from("content_feed_likes").select("email")),
    _safe(db.from("activity_comments").select("email, created_at")),
    _safe(db.from("activity_reactions").select("email")),
    _safe(db.from("saved_posts").select("email, post_type, created_at")),
    _safe(db.from("achievement_events").select("email, achievement_id")),
    _safe(db.from("feedback").select("email, type, created_at")),
  ]);

  // ── Who counts as a current member ──
  // The live allowed_emails list is the source of truth: cancelling a subscription
  // removes the row. So the membership gate is "are you still in allowed_emails?".
  // Anyone who appears in the DATA (sessions/usage/community) but is NOT on that
  // list is a former/churned member — drop them everywhere, count them as churned.
  const baseExcluded = new Set([...EXCLUDED_EMAILS]); // owner/reviewer only, captured before churn
  const memberSet = new Set((aeRows || []).map(r => (r.email || "").toLowerCase()).filter(e => e && !baseExcluded.has(e)));
  const haveMembership = memberSet.size > 0;

  // Secondary signal (best-effort): a member still listed but with no active Stripe
  // subscription (cancelled but not yet removed). Fails open if Stripe is down.
  let activeEmails = new Set(), activeCustomerIds = new Set(), hasSubData = false;
  try {
    const { data: { session } } = await db.auth.getSession();
    const r = await fetch("/.netlify/functions/active-subscribers", { headers: { Authorization: `Bearer ${session.access_token}` } });
    if (r.ok) {
      const j = await r.json();
      (j.emails || []).forEach(e => activeEmails.add((e || "").toLowerCase()));
      (j.customerIds || []).forEach(c => activeCustomerIds.add(c));
      hasSubData = activeEmails.size > 0 || activeCustomerIds.size > 0;
    } else { console.warn("active-subscribers:", r.status); }
  } catch (e) { console.warn("Could not load active subscribers:", e); }

  const churnedSet = new Set();
  if (haveMembership) {
    // (a) former members: have data but are no longer on the allowed_emails list
    const dataEmails = new Set();
    (allSessions || []).forEach(s => s.email && dataEmails.add(s.email.toLowerCase()));
    (usageRows || []).forEach(u => u.email && dataEmails.add((u.email || "").toLowerCase()));
    [...(posts || []), ...(comments || []), ...(likes || [])].forEach(r => r.email && dataEmails.add((r.email || "").toLowerCase()));
    (baseline || []).forEach(b => b.email && dataEmails.add((b.email || "").toLowerCase()));
    for (const e of dataEmails) if (!memberSet.has(e) && !baseExcluded.has(e)) churnedSet.add(e);
    // (b) still listed but no active Stripe subscription
    if (hasSubData) {
      for (const r of (aeRows || [])) {
        const e = (r.email || "").toLowerCase();
        if (!e || baseExcluded.has(e)) continue;
        const active = activeEmails.has(e) || (r.stripe_customer_id && activeCustomerIds.has(r.stripe_customer_id));
        if (!active) churnedSet.add(e);
      }
    }
    churnedSet.forEach(e => EXCLUDED_EMAILS.add(e)); // drop churned from every section
  }

  render(allSessions, allStreaks, allRequests, piecesMap, upcomingClinics, allGames);
  try { renderInsights({ allSessions, aeRows, posts, comments, likes, rsvps, attendance, events, baseline, usageRows, churnedCount: churnedSet.size, hasSubData: haveMembership, allStreaks, allGames, piecesMap, pieceGoals, noteScores, chordScores, cfPosts, cfComments, cfLikes, actComments, actReactions, savedPosts, achEvents, feedbackRows }); }
  catch (e) { console.error("renderInsights failed:", e); }
  try { renderFeatureUsage(usageRows); }
  catch (e) { console.error("renderFeatureUsage failed:", e); }
}

// ── Feature usage: total active time per view, most-used first ─────────────────
function renderFeatureUsage(usageRows) {
  const el = document.getElementById("analytics-content");
  if (!el) return;
  const rows = (usageRows || []).filter(r => !EXCLUDED_EMAILS.has((r.email || "").toLowerCase()));
  if (!rows.length) return;
  const wkStr = new Date(Date.now() - 6 * 86400000).toISOString().slice(0, 10);
  const byView = {}, byView7 = {}, users = {};
  for (const r of rows) {
    const v = r.view || "Unknown", s = Number(r.seconds) || 0;
    byView[v] = (byView[v] || 0) + s;
    (users[v] = users[v] || new Set()).add(r.email);
    if ((r.day || "") >= wkStr) byView7[v] = (byView7[v] || 0) + s;
  }
  const sorted  = Object.entries(byView).sort((a, b) => b[1] - a[1]);
  const max     = sorted.length ? sorted[0][1] : 1;
  const totalAll = sorted.reduce((s, [, v]) => s + v, 0);
  const fmtT = secs => fmtMins(secs / 60);
  let html = `<details style="margin-bottom:8px"><summary style="cursor:pointer;color:#cbd5e1;font-size:.95rem;font-weight:700;padding:8px 0;border-top:2px solid #1e2d4a;margin-top:24px">${ico('bars','#4ade80')}Feature usage detail — ${sorted.length} views · ${fmtT(totalAll)} total active time</summary>
    <div style="display:flex;flex-direction:column;gap:6px;margin:14px 0 28px">`;
  for (const [view, secs] of sorted.slice(0, 40)) {
    const pct = Math.max(2, Math.round(secs / max * 100));
    const u   = users[view] ? users[view].size : 0;
    const w7  = byView7[view] ? fmtT(byView7[view]) : "—";
    html += `<div style="display:flex;align-items:center;gap:10px;font-size:.85rem">
      <div style="flex:0 0 210px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${String(view).replace(/</g,"&lt;")}</div>
      <div style="flex:1;background:#0d1525;border-radius:6px;overflow:hidden;height:18px"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#4ade80,#22c55e)"></div></div>
      <div style="flex:0 0 72px;text-align:right;color:#4ade80;font-weight:700">${fmtT(secs)}</div>
      <div style="flex:0 0 60px;text-align:right;color:#64748b" title="last 7 days">${w7}</div>
      <div style="flex:0 0 44px;text-align:right;color:#64748b" title="distinct members">${ico('user','#64748b',11)}${u}</div>
    </div>`;
  }
  html += `</div>`;

  // ── Per-member breakdown: who spends time, and on what ──
  const byMember = {};
  for (const r of rows) {
    const m = (r.email || "").toLowerCase(), v = r.view || "Unknown", s = Number(r.seconds) || 0;
    if (!byMember[m]) byMember[m] = { total: 0, views: {} };
    byMember[m].total += s;
    byMember[m].views[v] = (byMember[m].views[v] || 0) + s;
  }
  const memSorted = Object.entries(byMember).sort((a, b) => b[1].total - a[1].total);
  const memMax = memSorted.length ? memSorted[0][1].total : 1;
  html += `<h2 class="section-header" style="border-bottom-color:#1e2d4a;margin-top:8px">
    ${ico('user','#60a5fa')}Feature usage by member
    <span class="section-meta">${memSorted.length} members</span></h2>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:28px">`;
  for (const [email, d] of memSorted.slice(0, 50)) {
    const pct = Math.max(2, Math.round(d.total / memMax * 100));
    const top = Object.entries(d.views).sort((a, b) => b[1] - a[1]).slice(0, 3)
      .map(([v, s]) => `${String(v).replace(/</g,"&lt;")} ${fmtT(s)}`).join("  ·  ");
    html += `<div style="display:flex;align-items:center;gap:10px;font-size:.85rem">
      <div style="flex:0 0 210px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${String(email).replace(/</g,"&lt;")}">${String(email).replace(/</g,"&lt;")}</div>
      <div style="flex:1;background:#0d1525;border-radius:6px;overflow:hidden;height:18px"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#60a5fa,#3b82f6)"></div></div>
      <div style="flex:0 0 72px;text-align:right;color:#60a5fa;font-weight:700">${fmtT(d.total)}</div>
      <div style="flex:0 0 320px;text-align:right;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="top views">${top}</div>
    </div>`;
  }
  html += `</div></details>`;
  el.insertAdjacentHTML("beforeend", html);
}

// ══════════════════════════════════════════════════════════════════════════════
// Command-center: the metrics that actually drive product decisions, pinned to the
// TOP of the page. Lifecycle/cohorts anchor on first-session ACTIVATION (members
// have no signup date). Renders above everything else via afterbegin.
// ══════════════════════════════════════════════════════════════════════════════
function renderInsights(d) {
  const el = document.getElementById("analytics-content");
  if (!el) return;
  const EX = EXCLUDED_EMAILS, now = Date.now(), DAY = 86400000;
  const low = e => (e || "").toLowerCase();
  const sessMins = s => (s.timing_mode === "per_item")
    ? (s.practice_items || []).reduce((a, i) => a + (i.duration_minutes || 0), 0)
    : (s.duration_minutes || 0);
  const sessions = (d.allSessions || []).filter(s => !EX.has(low(s.email)));
  const dAgo = ds => Math.floor((now - new Date(ds + "T12:00:00").getTime()) / DAY);
  const tAgo = ts => Math.floor((now - new Date(ts).getTime()) / DAY);

  // Per-member activation profile
  const mem = {};
  for (const s of sessions) {
    const e = low(s.email); if (!e) continue;
    const dt = s.session_date;
    if (!mem[e]) mem[e] = { first: dt, last: dt, count: 0, mins: 0 };
    const m = mem[e]; m.count++; m.mins += sessMins(s);
    if (dt < m.first) m.first = dt;
    if (dt > m.last)  m.last  = dt;
  }
  const memEmails = Object.keys(mem);

  // Cross-app activity recency per member: the most recent of a logged session,
  // any feature/page use, or a community action. So "quiet" means "stopped showing
  // up anywhere", not just "stopped logging practice".
  const act = {}, actEvents = [];
  const touch = (email, ds) => {
    const e = low(email); if (!e || !ds || EX.has(e)) return;
    const day = String(ds).slice(0, 10);
    actEvents.push({ e, x: dAgo(day) });
    if (!act[e]) act[e] = { first: day, last: day };
    else { if (day < act[e].first) act[e].first = day; if (day > act[e].last) act[e].last = day; }
  };
  (d.allSessions || []).forEach(s => touch(s.email, s.session_date));
  (d.usageRows   || []).forEach(u => touch(u.email, u.day));
  [...(d.posts || []), ...(d.comments || []), ...(d.likes || [])].forEach(r => touch(r.email, r.created_at));

  // Membership (current = on the allowed_emails list)
  const memberSet = new Set((d.aeRows || []).map(r => low(r.email)).filter(e => e && !EX.has(e)));
  memEmails.forEach(e => memberSet.add(e));
  Object.keys(act).forEach(e => memberSet.add(e)); // anyone active counts as a member
  const totalMembers = memberSet.size;
  const activated = memEmails.length;               // logged ≥1 practice session
  const activatedPct = totalMembers ? Math.round(activated / totalMembers * 100) : 0;

  // Lifecycle by LAST ACTIVITY anywhere in the app
  let nNew = 0, nActive = 0; const riskList = [], dormantList = [], neverArr = [];
  for (const e of memberSet) {
    const a = act[e];
    if (!a) { neverArr.push(e); continue; }          // on the list, never did anything
    const ls = dAgo(a.last), fs = dAgo(a.first);
    if (ls <= 7) { nActive++; if (fs <= 7) nNew++; }
    else if (ls <= 30) riskList.push({ email: e, days: ls });
    else dormantList.push({ email: e, days: ls });
  }
  riskList.sort((a, b) => a.days - b.days);

  // Active counts + previous-period deltas
  const activeIn = (a, b) => new Set(actEvents.filter(ev => ev.x >= a && ev.x < b).map(ev => ev.e)).size;
  const countIn  = (arr, key, a, b) => arr.filter(r => { const x = key === "sd" ? dAgo(r.session_date) : tAgo(r.created_at); return x >= a && x < b; }).length;
  const wau = activeIn(0, 7),  wauPrev = activeIn(7, 14);
  const mau = activeIn(0, 30), mauPrev = activeIn(30, 60);
  const sessWk = countIn(sessions, "sd", 0, 7), sessWkPrev = countIn(sessions, "sd", 7, 14);

  // Community engagement
  const cap = arr => (arr || []).filter(r => !EX.has(low(r.email)));
  const posts = cap(d.posts), comments = cap(d.comments), likes = cap(d.likes);
  const commIn = (a, b) => countIn(posts, "ts", a, b) + countIn(comments, "ts", a, b) + countIn(likes, "ts", a, b);
  const commWk = commIn(0, 7), commWkPrev = commIn(7, 14);
  const posterSet = new Set([...posts, ...comments].map(r => low(r.email)));
  const pctPosting = totalMembers ? Math.round(posterSet.size / totalMembers * 100) : 0;
  const contrib = {};
  for (const r of [...posts, ...comments]) contrib[low(r.email)] = (contrib[low(r.email)] || 0) + 1;
  const topContrib = Object.entries(contrib).sort((a, b) => b[1] - a[1]).slice(0, 8);

  // Roadmap level distribution (total track) — logged + prior-hours baseline
  const TH = [0, 50, 150, 350, 700, 1200, 2000, 3500];
  const STG = ["First Steps", "Beginner", "Foundations", "Intermediate", "Confident", "Advanced", "Performer", "Artist"];
  const baseMap = {}; let withPrior = 0;
  for (const r of (d.baseline || [])) { const e = low(r.email); if (EX.has(e)) continue; const m = Number(r.total_minutes) || 0; baseMap[e] = m; if (m > 0) withPrior++; }
  const lvlCounts = Array(8).fill(0);
  for (const e of memEmails) {
    const hrs = (mem[e].mins + (baseMap[e] || 0)) / 60;
    let lvl = 0; for (let i = 0; i < TH.length; i++) if (hrs >= TH[i]) lvl = i;
    lvlCounts[lvl]++;
  }
  const lvlMax = Math.max(...lvlCounts, 1);

  // Livestream attendance (past events)
  const pastEvents = (d.events || []).filter(e => new Date(e.scheduled_at).getTime() < now)
    .sort((a, b) => new Date(b.scheduled_at) - new Date(a.scheduled_at)).slice(0, 8);
  const setBy = (arr) => { const o = {}; for (const r of (arr || [])) { if (EX.has(low(r.email))) continue; (o[r.event_id] = o[r.event_id] || new Set()).add(low(r.email)); } return o; };
  const rsvpBy = setBy(d.rsvps), attBy = setBy(d.attendance);

  // 12-week trends
  const weeks = [];
  for (let w = 11; w >= 0; w--) {
    const a = w * 7, b = (w + 1) * 7;
    weeks.push({
      label: w === 0 ? "this wk" : `${w}w`,
      sessions: countIn(sessions, "sd", a, b),
      active: activeIn(a, b),
      comm: commIn(a, b),
    });
  }

  // ── Per-area engagement (from feature_usage) ──
  const areaOf = (view) => {
    const v = String(view || "");
    if (v.startsWith("Hub · Roadmap")) return "Roadmap";
    if (v.startsWith("Community"))      return "Community";
    if (v.startsWith("Content"))        return "Content";
    if (v.startsWith("Practice Tools")) return "Tools & games";
    if (v.startsWith("Resources"))      return "Resources";
    if (v.startsWith("Live Clinics"))   return "Live events";
    if (v.startsWith("Hub"))            return "Hub (other)";
    return null;
  };
  const AREA_ORDER = ["Practice log", "Roadmap", "Community", "Content", "Tools & games", "Resources", "Live events", "Hub (other)"];
  const areaAgg = {}; AREA_ORDER.forEach(a => areaAgg[a] = { mem: new Set(), secWk: 0, secPrev: 0 });
  (d.usageRows || []).forEach(u => {
    const e = low(u.email); if (!e || EX.has(e)) return;
    const a = areaOf(u.view); if (!a) return;
    const x = dAgo(u.day), s = Number(u.seconds) || 0;
    if (x < 7) { areaAgg[a].mem.add(e); areaAgg[a].secWk += s; }
    else if (x < 14) areaAgg[a].secPrev += s;
  });
  sessions.forEach(s => { if (dAgo(s.session_date) < 7) areaAgg["Practice log"].mem.add(low(s.email)); });
  areaAgg["Practice log"].secWk  = sessions.filter(s => dAgo(s.session_date) < 7).reduce((m, s) => m + sessMins(s), 0) * 60;
  areaAgg["Practice log"].secPrev = sessions.filter(s => { const x = dAgo(s.session_date); return x >= 7 && x < 14; }).reduce((m, s) => m + sessMins(s), 0) * 60;

  // Goals (best-effort: a goal_date marks completion)
  const goalsByMember = {}; let goalsSet = 0, goalsDone = 0;
  (d.pieceGoals || []).forEach(g => { const e = low(g.email); if (!e || EX.has(e)) return; goalsSet++; if (g.goal_date) goalsDone++; goalsByMember[e] = (goalsByMember[e] || 0) + 1; });

  // ── Insights & actions (prioritised: 0 high, 1 med, 2 low) ──
  const churnedN = d.churnedCount || 0;
  const churnPct = (totalMembers + churnedN) > 0 ? Math.round(churnedN / (totalMembers + churnedN) * 100) : 0;
  const roadmapWk = areaAgg["Roadmap"].mem.size, roadmapPct = wau ? Math.round(roadmapWk / wau * 100) : 0;
  const lurkers = Math.max(0, totalMembers - posterSet.size);
  let worstArea = null, worstDrop = 0;
  for (const a of AREA_ORDER) { const { secWk, secPrev } = areaAgg[a]; if (secPrev > 600 && secWk < secPrev) { const dr = Math.round((secPrev - secWk) / secPrev * 100); if (dr > worstDrop) { worstDrop = dr; worstArea = a; } } }
  const recentFeedback = (d.feedbackRows || []).filter(f => !EX.has(low(f.email)) && tAgo(f.created_at) <= 14).length;
  const insights = [];
  const addI = (sev, text) => insights.push({ sev, text });
  if (riskList.length)              addI(0, `<b>${riskList.length}</b> member${riskList.length > 1 ? "s" : ""} at-risk (active, then quiet 8–30 days) — reach out before they lapse.`);
  if (neverArr.length)              addI(0, `<b>${neverArr.length}</b> member${neverArr.length > 1 ? "s" : ""} joined but never did anything — fix onboarding or send a nudge.`);
  if (churnedN)                     addI(churnPct >= 15 ? 0 : 1, `Churn is <b>${churnPct}%</b> of all-time members (${churnedN} cancelled).`);
  if (wau && roadmapPct < 30)       addI(1, `Only <b>${roadmapPct}%</b> of active members opened the roadmap this week — promote it.`);
  if (totalMembers && lurkers > 0)  addI(lurkers > totalMembers * 0.6 ? 1 : 2, `<b>${lurkers}</b> of ${totalMembers} members never post (${pctPosting}% do) — seed discussion or prompt them.`);
  if (worstArea)                    addI(1, `<b>${worstArea}</b> usage down <b>${worstDrop}%</b> vs last week.`);
  if (recentFeedback)               addI(1, `<b>${recentFeedback}</b> feedback item${recentFeedback > 1 ? "s" : ""} in the last 2 weeks — review and reply.`);
  if (mau && wau) { const st = Math.round(wau / mau * 100); if (st < 40) addI(2, `Stickiness (WAU/MAU) is <b>${st}%</b> — members aren't returning weekly.`); }
  if (goalsSet && goalsDone / goalsSet < 0.3) addI(2, `Only <b>${Math.round(goalsDone / goalsSet * 100)}%</b> of piece goals reached completion (${goalsDone}/${goalsSet}).`);
  if (!insights.length)             addI(2, `Nothing urgent — engagement looks healthy.`);
  insights.sort((a, b) => a.sev - b.sev);

  // ── Helpers ──
  const delta = (cur, prev) => {
    if (prev === 0) return cur > 0 ? `<span style="color:#4ade80;font-size:.72rem;font-weight:700">▲ new</span>` : "";
    const p = Math.round((cur - prev) / prev * 100);
    if (p === 0) return `<span style="color:#64748b;font-size:.72rem;font-weight:700">– 0%</span>`;
    const c = p > 0 ? "#4ade80" : "#f87171", ar = p > 0 ? "▲" : "▼";
    return `<span style="color:${c};font-size:.72rem;font-weight:700">${ar} ${Math.abs(p)}%</span>`;
  };
  const kpi = (val, label, extra = "", color = "var(--text)") =>
    `<div class="stat-card"><div class="stat-value" style="color:${color}">${val}</div>
     <div class="stat-label">${label}</div>${extra ? `<div style="margin-top:4px">${extra}</div>` : ""}</div>`;
  const miniBars = (vals, color, fmt) => {
    const mx = Math.max(...vals.map(v => v.v), 1);
    return `<div style="display:flex;align-items:flex-end;gap:3px;height:64px;margin-top:6px">` +
      vals.map(v => `<div title="${v.label}: ${fmt(v.v)}" style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end">
        <div style="background:${color};border-radius:3px 3px 0 0;height:${Math.max(3, Math.round(v.v / mx * 100))}%;min-height:2px"></div></div>`).join("") +
      `</div><div style="display:flex;justify-content:space-between;font-size:.6rem;color:#64748b;margin-top:3px"><span>12w ago</span><span>now</span></div>`;
  };
  const list = (rows, color) => rows.length
    ? rows.map(r => `<div style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:.8rem">
        <span style="color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(r.email)}</span>
        <span style="color:${color};flex-shrink:0">${r.note}</span></div>`).join("")
    : `<p style="color:var(--text-muted);font-size:.82rem">None</p>`;

  // ── Build ──
  let h = `<div style="border-bottom:2px solid #1e2d4a;margin:0 0 18px;padding-bottom:6px">
    <h1 style="font-size:1.3rem;margin:0;color:#fff">${ico('health')}Community health</h1>
    <div style="font-size:.8rem;color:#64748b;margin-top:2px">The numbers that show whether the product is working. Owner/test excluded · Δ vs previous period.</div></div>`;

  const churned = d.churnedCount || 0;
  const churnRate = (totalMembers + churned) > 0 ? Math.round(churned / (totalMembers + churned) * 100) : 0;

  // KPI row
  h += `<div class="overview-grid">
    ${kpi(totalMembers, "Members", d.hasSubData ? `<span style="font-size:.72rem;color:#64748b">active subscribers</span>` : "")}
    ${kpi(activatedPct + "%", "Activated", `<span style="font-size:.72rem;color:#64748b">${activated}/${totalMembers} logged ≥1</span>`, activatedPct >= 60 ? "#4ade80" : "#f59e0b")}
    ${kpi(wau, "Active this week", delta(wau, wauPrev), "#4ade80")}
    ${kpi(mau, "Active this month", delta(mau, mauPrev), "#4ade80")}
    ${kpi(sessWk, "Sessions this week", delta(sessWk, sessWkPrev), "#60a5fa")}
    ${kpi(commWk, "Community actions / wk", delta(commWk, commWkPrev), "#a855f7")}
    ${d.hasSubData ? kpi(churned, "Churned", `<span style="font-size:.72rem;color:#64748b">${churnRate}% of all-time</span>`, "#ef4444") : ""}
  </div>`;

  // Insights & actions
  const sevC = ["#ef4444", "#f59e0b", "#3b82f6"];
  h += `<h2 class="section-header" style="margin-top:28px">${ico('warn')}Insights &amp; actions</h2>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:28px">
      ${insights.slice(0, 9).map(i => `<div style="padding:9px 12px;background:#0d1525;border-left:3px solid ${sevC[i.sev]};border-radius:6px;font-size:.86rem;color:#cbd5e1;line-height:1.4">${i.text}</div>`).join("")}
    </div>`;

  // Area engagement matrix
  const areaRows = AREA_ORDER.map(a => ({ a, m: areaAgg[a].mem.size, secWk: areaAgg[a].secWk, secPrev: areaAgg[a].secPrev }))
    .filter(r => r.m || r.secWk || r.secPrev);
  const areaMax = Math.max(1, ...areaRows.map(r => r.m));
  h += `<h2 class="section-header">${ico('bars')}Where the time goes <span class="section-meta">active members &amp; time · this week</span></h2>
    <div style="margin-bottom:28px">
      <div style="display:flex;gap:10px;font-size:.62rem;color:#64748b;text-transform:uppercase;letter-spacing:.05em;padding:0 2px 5px">
        <div style="flex:0 0 120px">Area</div><div style="flex:1">Active members</div><div style="flex:0 0 56px;text-align:right">% mbrs</div><div style="flex:0 0 70px;text-align:right">Time/wk</div><div style="flex:0 0 56px;text-align:right">WoW</div></div>
      ${areaRows.map(r => {
        const pct = Math.round(r.m / areaMax * 100), pm = totalMembers ? Math.round(r.m / totalMembers * 100) : 0;
        return `<div style="display:flex;align-items:center;gap:10px;font-size:.84rem;padding:2px 0">
          <div style="flex:0 0 120px;color:#cbd5e1">${r.a}</div>
          <div style="flex:1;display:flex;align-items:center;gap:8px"><div style="flex:1;background:#0d1525;border-radius:5px;overflow:hidden;height:16px"><div style="width:${Math.max(2, pct)}%;height:100%;background:linear-gradient(90deg,#38bdf8,#3b82f6)"></div></div><span style="flex:0 0 24px;color:#60a5fa;font-weight:700;text-align:right">${r.m}</span></div>
          <div style="flex:0 0 56px;text-align:right;color:#64748b">${pm}%</div>
          <div style="flex:0 0 70px;text-align:right;color:#cbd5e1">${r.secWk ? fmtMins(r.secWk / 60) : "—"}</div>
          <div style="flex:0 0 56px;text-align:right">${delta(Math.round(r.secWk), Math.round(r.secPrev)) || "—"}</div></div>`;
      }).join("")}
    </div>`;

  // Lifecycle
  const segs = [
    { n: "New", v: nNew, c: "#22c55e" },
    { n: "Active", v: nActive - nNew, c: "#4ade80" },
    { n: "At-risk (8–30d)", v: riskList.length, c: "#f59e0b" },
    { n: "Dormant (30d+)", v: dormantList.length, c: "#ef4444" },
    { n: "Never active", v: neverArr.length, c: "#475569" },
  ];
  if (d.hasSubData && churned) segs.push({ n: "Churned", v: churned, c: "#7f1d1d" });
  const segTot = segs.reduce((s, x) => s + x.v, 0) || 1;
  h += `<h2 class="section-header" style="margin-top:32px">${ico('refresh')}Member lifecycle <span class="section-meta">${totalMembers} active${d.hasSubData ? ` · ${churned} churned` : ""}</span></h2>
    <div style="display:flex;height:30px;border-radius:8px;overflow:hidden;margin-bottom:10px">
      ${segs.map(s => s.v ? `<div title="${s.n}: ${s.v}" style="width:${s.v / segTot * 100}%;background:${s.c};min-width:2px"></div>` : "").join("")}
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px;font-size:.8rem">
      ${segs.map(s => `<div style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:2px;background:${s.c}"></span><b style="color:var(--text)">${s.v}</b> <span style="color:var(--text-muted)">${s.n}</span></div>`).join("")}
    </div>
    <div class="two-col" style="margin-bottom:32px">
      <div><h3 class="section-header" style="font-size:.85rem;border-bottom-color:#1e2d4a;color:#f59e0b">${ico('warn')}At-risk — re-engage these</h3>
        ${list(riskList.slice(0, 12).map(r => ({ email: r.email, note: `${r.days}d quiet` })), "#f59e0b")}</div>
      <div><h3 class="section-header" style="font-size:.85rem;border-bottom-color:#1e2d4a;color:#94a3b8">${ico('moon')}Joined, never active</h3>
        ${list(neverArr.slice(0, 12).map(e => ({ email: e, note: "no activity" })), "#94a3b8")}
        ${neverArr.length > 12 ? `<p style="font-size:.72rem;color:#64748b;margin-top:6px">+${neverArr.length - 12} more</p>` : ""}</div>
    </div>`;

  // Trends
  h += `<h2 class="section-header" style="margin-top:8px">${ico('trend')}Last 12 weeks</h2>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:32px">
      <div class="stat-card" style="align-items:stretch;text-align:left">
        <div class="stat-label">Sessions / week</div>${miniBars(weeks.map(w => ({ label: w.label, v: w.sessions })), "#60a5fa", v => v)}</div>
      <div class="stat-card" style="align-items:stretch;text-align:left">
        <div class="stat-label">Active members / week</div>${miniBars(weeks.map(w => ({ label: w.label, v: w.active })), "#4ade80", v => v)}</div>
      <div class="stat-card" style="align-items:stretch;text-align:left">
        <div class="stat-label">Community actions / week</div>${miniBars(weeks.map(w => ({ label: w.label, v: w.comm })), "#a855f7", v => v)}</div>
    </div>`;

  // Roadmap distribution
  h += `<h2 class="section-header">${ico('map')}Roadmap levels <span class="section-meta">${activated} on the map · ${withPrior} added prior hours</span></h2>
    <div style="display:flex;flex-direction:column;gap:5px;margin-bottom:32px">`;
  for (let i = 0; i < 8; i++) {
    const pct = Math.max(2, Math.round(lvlCounts[i] / lvlMax * 100));
    h += `<div style="display:flex;align-items:center;gap:10px;font-size:.84rem">
      <div style="flex:0 0 120px;color:#cbd5e1">${STG[i]}</div>
      <div style="flex:1;background:#0d1525;border-radius:6px;overflow:hidden;height:18px"><div style="width:${pct}%;height:100%;background:linear-gradient(90deg,#f7cb33,#f0a500)"></div></div>
      <div style="flex:0 0 40px;text-align:right;color:#f0a500;font-weight:700">${lvlCounts[i]}</div></div>`;
  }
  h += `</div>`;

  // Community + attendance two-col
  h += `<div class="two-col" style="margin-bottom:32px">
    <div><h2 class="section-header">${ico('chat')}Community <span class="section-meta">${pctPosting}% of members post</span></h2>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px">
        ${kpi(posts.length, "Posts", "", "#a855f7")}
        ${kpi(comments.length, "Comments", "", "#a855f7")}
        ${kpi(likes.length, "Reactions", "", "#a855f7")}
      </div>
      <h3 class="section-header" style="font-size:.82rem;border-bottom-color:#1e2d4a">Top contributors</h3>
      ${topContrib.length ? topContrib.map(([e, n]) => `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);font-size:.8rem">
          <span style="color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(e)}</span><span style="color:#a855f7;flex-shrink:0">${n}</span></div>`).join("")
        : `<p style="color:var(--text-muted);font-size:.82rem">No posts yet.</p>`}
    </div>
    <div><h2 class="section-header">${ico('video')}Livestream attendance</h2>
      ${pastEvents.length ? pastEvents.map(ev => {
        const att = (attBy[ev.id] || new Set()).size, rsv = (rsvpBy[ev.id] || new Set()).size;
        const rate = rsv ? Math.round(att / rsv * 100) : null;
        const dt = new Date(ev.scheduled_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
        return `<div style="padding:8px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;justify-content:space-between;gap:8px;font-size:.82rem">
            <span style="color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(ev.title || "Untitled")}</span>
            <span style="color:#64748b;flex-shrink:0">${dt}</span></div>
          <div style="font-size:.72rem;color:var(--text-muted);margin-top:2px">
            <b style="color:#4ade80">${att} attended</b>${rsv ? ` · ${rsv} RSVP'd${rate !== null ? ` · ${rate}% turnout` : ""}` : ""}</div></div>`;
      }).join("") : `<p style="color:var(--text-muted);font-size:.82rem">No past events.</p>`}
    </div>
  </div>`;

  // ── Dense member table (one row per current member) ──
  const streakMap = {}; (d.allStreaks || []).forEach(s => streakMap[low(s.email)] = s);
  const gamesMap = {};
  const bumpGame = e => { e = low(e); if (e && !EX.has(e)) gamesMap[e] = (gamesMap[e] || 0) + 1; };
  (d.allGames || []).forEach(g => bumpGame(g.email));
  (d.noteScores || []).forEach(g => bumpGame(g.email));
  (d.chordScores || []).forEach(g => bumpGame(g.email));
  const postsMap = {}; posts.forEach(p => { const e = low(p.email); postsMap[e] = (postsMap[e] || 0) + 1; });
  const recentByMember = {}; sessions.forEach(s => { if (dAgo(s.session_date) < 28) { const e = low(s.email); recentByMember[e] = (recentByMember[e] || 0) + 1; } });
  const lvlOf = hrs => { let l = 0; for (let i = 0; i < TH.length; i++) if (hrs >= TH[i]) l = i; return l; };
  const mrows = [...memberSet].map(e => {
    const a = act[e], m = mem[e] || { count: 0, mins: 0 };
    const hrs = (m.mins + (baseMap[e] || 0)) / 60;
    return { e, ls: a ? dAgo(a.last) : null, sess: m.count, hrs, perWk: +((recentByMember[e] || 0) / 4).toFixed(1),
      streak: (streakMap[e] && streakMap[e].current_streak) || 0, lvl: lvlOf(hrs), games: gamesMap[e] || 0, posts: postsMap[e] || 0, goals: goalsByMember[e] || 0 };
  }).sort((a, b) => (a.ls == null ? 1e9 : a.ls) - (b.ls == null ? 1e9 : b.ls));
  const dotC = ls => ls == null ? "#475569" : ls <= 7 ? "#4ade80" : ls <= 30 ? "#f59e0b" : "#ef4444";
  const cell = (v, extra = "") => `<td style="padding:5px 7px;text-align:right;${extra}">${v}</td>`;
  h += `<h2 class="section-header">${ico('users')}Members <span class="section-meta">${mrows.length} · most recently active first</span></h2>
    <div style="overflow-x:auto;margin-bottom:24px"><table style="width:100%;border-collapse:collapse;font-size:.82rem">
      <thead><tr style="color:#64748b;text-transform:uppercase;font-size:.6rem;letter-spacing:.05em;border-bottom:1px solid #1e2d4a">
        <th style="padding:4px 7px"></th><th style="padding:4px 7px;text-align:left">Member</th>
        <th style="padding:4px 7px;text-align:right">Last</th><th style="padding:4px 7px;text-align:right">Sess</th>
        <th style="padding:4px 7px;text-align:right">Hrs</th><th style="padding:4px 7px;text-align:right">/wk</th>
        <th style="padding:4px 7px;text-align:right">Streak</th><th style="padding:4px 7px;text-align:left">Level</th>
        <th style="padding:4px 7px;text-align:right">Games</th><th style="padding:4px 7px;text-align:right">Posts</th>
        <th style="padding:4px 7px;text-align:right">Goals</th></tr></thead><tbody>
      ${mrows.map(r => `<tr style="border-bottom:1px solid var(--border)">
        <td style="padding:5px 7px"><span style="width:8px;height:8px;border-radius:50%;background:${dotC(r.ls)};display:inline-block"></span></td>
        <td style="padding:5px 7px;color:#cbd5e1;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(r.e)}</td>
        ${cell(r.ls == null ? "—" : r.ls === 0 ? "today" : r.ls + "d", "color:#64748b")}
        ${cell(r.sess || "—")}${cell(r.hrs ? Math.round(r.hrs) + "h" : "—")}${cell(r.perWk || "—")}
        ${cell(r.streak || "—", r.streak ? "color:#f59e0b;font-weight:700" : "color:#64748b")}
        <td style="padding:5px 7px;color:#94a3b8">${r.sess ? STG[r.lvl] : "—"}</td>
        ${cell(r.games || "—")}${cell(r.posts || "—")}${cell(r.goals || "—")}</tr>`).join("")}
    </tbody></table></div>`;

  h += `<div style="border-bottom:2px solid #1e2d4a;margin:8px 0 18px"></div>`;
  el.insertAdjacentHTML("afterbegin", h);
}

// ── Helpers ──────────────────────────────────────────────────
function fmtMins(mins, pad = false) {
  if (mins < 60) return `${Math.round(mins)}m`;
  const h = Math.floor(mins / 60), m = Math.round(mins % 60);
  if (m === 0) return `${h}h`;
  return pad ? `${h}h ${String(m).padStart(2,"0")}m` : `${h}h ${m}m`;
}
function fmtMinsSq(mins) { return fmtMins(mins, true); }

    inbox: '<polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>',
    target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',

    flame: '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    bars: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  };
  const s = size || 15;
  return `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${color || 'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;flex-shrink:0;margin-right:5px">${P[name] || ''}</svg>`;
}

function daysSince(dateStr) {
  if (!dateStr) return Infinity;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / 86400000);
}

function relativeDate(dateStr) {
  const days = daysSince(dateStr);
  if (days === 0)  return "Today";
  if (days === 1)  return "Yesterday";
  if (days < 7)   return `${days}d ago`;
  if (days < 30)  return `${Math.floor(days/7)}w ago`;
  if (days < 365) return `${Math.floor(days/30)}mo ago`;
  return `${Math.floor(days/365)}y ago`;
}

function activityClass(days) {
  if (days === Infinity) return "active-none";
  if (days <= 7)  return "active-green";
  if (days <= 14) return "active-amber";
  return "active-red";
}

function badgeClass(days) {
  if (days === Infinity) return "none";
  if (days <= 7)  return "green";
  if (days <= 14) return "amber";
  return "red";
}

function escHtml(s) {
  return String(s ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function shortEmail(email) {
  return email.replace(/@.*/, "");
}

// ── Constants ────────────────────────────────────────────────
const TYPE_COLORS = {
  piece:         { color: "#f59e0b", label: "Pieces" },
  technique:     { color: "#22c55e", label: "Technique" },
  sightreading:  { color: "#3b82f6", label: "Sight-reading" },
  eartraining:   { color: "#a855f7", label: "Ear training" },
  improvisation: { color: "#ec4899", label: "Improvisation" },
};

// ── Render ───────────────────────────────────────────────────
function render(allSessions, allStreaks, allRequests, piecesMap, upcomingClinics = [], allGames = []) {
  // ── Group by student ──────────────────────────────────────
  const studentMap = {}; // email → { sessions, totalMins, lastDate }
  for (const sess of allSessions) {
    if (EXCLUDED_EMAILS.has(sess.email)) continue; // exclude self
    if (!studentMap[sess.email]) {
      studentMap[sess.email] = { email: sess.email, sessions: [], totalMins: 0, lastDate: null };
    }
    const entry = studentMap[sess.email];
    entry.sessions.push(sess);
    const sessItems = sess.practice_items || [];
    let sessMins = 0;
    if (sess.timing_mode === "per_item") {
      sessMins = sessItems.reduce((s, i) => s + (i.duration_minutes || 0), 0);
    } else {
      sessMins = sess.duration_minutes || 0;
    }
    entry.totalMins += sessMins;
    if (!entry.lastDate || sess.session_date > entry.lastDate) entry.lastDate = sess.session_date;
  }

  const streakMap   = Object.fromEntries(allStreaks.map(s => [s.email, s]));
  const students    = Object.values(studentMap)
    .sort((a, b) => (b.lastDate || "") .localeCompare(a.lastDate || ""));

  // ── Platform totals ───────────────────────────────────────
  const totalStudents   = students.length;
  const totalSessions   = students.reduce((s, st) => s + st.sessions.length, 0);
  const totalMins       = students.reduce((s, st) => s + st.totalMins, 0);
  const activeThisWeek  = students.filter(st => daysSince(st.lastDate) <= 7).length;
  const activeThisMonth = students.filter(st => daysSince(st.lastDate) <= 30).length;
  const pendingRequests = allRequests.filter(r => !r.done).length;

  // ── Top pieces ────────────────────────────────────────────
  const pieceTotals = {};
  for (const sess of allSessions) {
    if (EXCLUDED_EMAILS.has(sess.email)) continue;
    const items    = sess.practice_items || [];
    const sessMins = sess.timing_mode === "per_item"
      ? null
      : (sess.duration_minutes || 0);

    items.forEach(item => {
      if (item.item_type !== "piece") return;
      const mins = sess.timing_mode === "per_item"
        ? (item.duration_minutes || 0)
        : (sessMins / (items.length || 1));
      if (mins <= 0) return;

      const key   = item.piece_id ? `id:${item.piece_id}` : `lbl:${(item.piece_label||item.label||"").toLowerCase()}`;
      const piece = item.piece_id ? piecesMap[item.piece_id] : null;
      const name  = piece ? piece.title : (item.piece_label || item.label || "Untitled");
      const comp  = piece?.composer || "";
      if (!pieceTotals[key]) pieceTotals[key] = { name, composer: comp, mins: 0, studentSet: new Set() };
      pieceTotals[key].mins += mins;
      pieceTotals[key].studentSet.add(sess.email);
    });
  }
  const topPieces = Object.values(pieceTotals)
    .sort((a, b) => b.mins - a.mins)
    .slice(0, 10);
  const maxPieceMins = topPieces[0]?.mins || 1;

  // ── Sessions per week (last 28 days) per student ─────────
  const cutoff28 = new Date(); cutoff28.setDate(cutoff28.getDate() - 28);
  for (const st of students) {
    const recent = st.sessions.filter(s => new Date(s.session_date) >= cutoff28);
    st.sessPerWeek = +(recent.length / 4).toFixed(1);
  }

  // ── Practice type breakdown (all students) ────────────────
  const typeMins = {};
  for (const sess of allSessions) {
    if (EXCLUDED_EMAILS.has(sess.email)) continue;
    for (const item of (sess.practice_items || [])) {
      const t = item.item_type || "other";
      typeMins[t] = (typeMins[t] || 0) + (item.duration_minutes || 0);
    }
  }
  const totalTypeMins = Object.values(typeMins).reduce((a, b) => a + b, 0) || 1;

  // ── Day of week heatmap ───────────────────────────────────
  const DOW_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const dowCounts  = Array(7).fill(0);
  for (const sess of allSessions) {
    if (EXCLUDED_EMAILS.has(sess.email)) continue;
    const d = new Date(sess.session_date + "T12:00:00");
    dowCounts[d.getDay()]++;
  }
  const maxDow = Math.max(...dowCounts, 1);

  // ── Pending requests ──────────────────────────────────────
  const pendingList = allRequests.filter(r => !r.done).slice(0, 15);

  // ── Recent activity (30 sessions, excluding owner) ────────
  const recentActivity = allSessions
    .filter(s => !EXCLUDED_EMAILS.has(s.email))
    .slice(0, 30);

  // ── Requests per student ──────────────────────────────────
  const pendingPerStudent = {};
  for (const r of allRequests) {
    if (!r.done) {
      pendingPerStudent[r.email] = (pendingPerStudent[r.email] || 0) + 1;
    }
  }

  // ── Passage Fixer stats ───────────────────────────────────
  const games = allGames.filter(g => !EXCLUDED_EMAILS.has(g.email));
  const totalGames     = games.length;
  const clearedGames   = games.filter(g => g.outcome === "cleared").length;
  const leveledUpGames = games.filter(g => g.outcome === "leveled_up").length;
  const abandonedGames = games.filter(g => g.outcome === "abandoned").length;
  const gamesThisWeek  = games.filter(g => daysSince((g.created_at||"").slice(0,10)) <= 7).length;

  const gamesWithAttempts = games.filter(g => g.attempts > 0);
  const avgAccuracy = gamesWithAttempts.length > 0
    ? Math.round(gamesWithAttempts.reduce((s, g) => s + (g.correct_count / g.attempts), 0) / gamesWithAttempts.length * 100)
    : 0;
  const avgSimplify = totalGames > 0
    ? (games.reduce((s, g) => s + (g.simplify_triggers || 0), 0) / totalGames).toFixed(1)
    : "—";
  const clearanceRate = totalGames > 0
    ? Math.round(((clearedGames + leveledUpGames) / totalGames) * 100)
    : 0;

  // Top passages by number of games
  const passageMap = {};
  for (const g of games) {
    const key = (g.passage_label || "").toLowerCase().trim();
    if (!key) continue;
    if (!passageMap[key]) passageMap[key] = {
      label: g.passage_label, piece: g.piece_label || "",
      count: 0, cleared: 0, leveledUp: 0, abandoned: 0,
      totalAccuracy: 0, accuracyCount: 0, simplifyTotal: 0, students: new Set()
    };
    const e = passageMap[key];
    e.count++;
    if (g.outcome === "cleared")   e.cleared++;
    if (g.outcome === "leveled_up") e.leveledUp++;
    if (g.outcome === "abandoned") e.abandoned++;
    if (g.attempts > 0) { e.totalAccuracy += g.correct_count / g.attempts; e.accuracyCount++; }
    e.simplifyTotal += g.simplify_triggers || 0;
    e.students.add(g.email);
  }
  const topPassages = Object.values(passageMap).sort((a, b) => b.count - a.count).slice(0, 15);

  // Per-student game summary
  const gamesByStudent = {};
  for (const g of games) {
    if (!gamesByStudent[g.email]) gamesByStudent[g.email] = { total: 0, cleared: 0, leveledUp: 0, abandoned: 0, accuracySum: 0, accuracyCount: 0 };
    const e = gamesByStudent[g.email];
    e.total++;
    if (g.outcome === "cleared")   e.cleared++;
    if (g.outcome === "leveled_up") e.leveledUp++;
    if (g.outcome === "abandoned") e.abandoned++;
    if (g.attempts > 0) { e.accuracySum += g.correct_count / g.attempts; e.accuracyCount++; }
  }

  // ── Build HTML ────────────────────────────────────────────
  let html = "";

  // ── Share card ───────────────────────────────────────────
  const weekSessions = allSessions.filter(s =>
    !EXCLUDED_EMAILS.has(s.email) && daysSince(s.session_date) <= 7

  html += `

  html += `

      <div class="scard-stats">

      </div>

      ${totalTypeMins > 0 ? `

      ${topPieces.length ? `

        ${topPieces.slice(0, 5).map((p, i) => {
          const barPct = Math.round((p.mins / (topPieces[0]?.mins || 1)) * 100);
          return `<div class="scard-piece">

            <div class="scard-piece-name">${escHtml(p.name)}${p.composer ? `<span class="scard-piece-comp">— ${escHtml(p.composer)}</span>` : ""}</div>
            <div class="scard-piece-bar-wrap"><div class="scard-piece-bar" style="width:${barPct}%"></div></div>
            <div class="scard-piece-mins">${fmtMins(p.mins)}</div>

        }).join("")}

        <div class="scard-footer-brand">The Practice Room</div>
        <div class="scard-footer-url">app.matthewcawood.com</div>
      </div>

    </div>
  </div>
  </details>`;

  // Overview stats
  html += `
  <div class="overview-grid">
    <div class="stat-card">
      <div class="stat-value">${totalStudents}</div>
      <div class="stat-label">Students</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">${activeThisWeek}</div>

    <div class="stat-card">
      <div class="stat-value">${activeThisMonth}</div>

  // Student cards (detail view — the dense Members table up top is the primary view)
  html += `<details style="margin-bottom:24px"><summary style="cursor:pointer;color:#64748b;font-size:.85rem;font-weight:600;padding:6px 0">Student cards (detailed)</summary>`;
  html += `<div class="students-grid" style="margin-top:10px">`;
  for (const st of students) {

  html += `</div></details>`;

  // Two column: top pieces + pending requests

      const barPct = Math.round((p.mins / maxPieceMins) * 100);

  html += `</div>`;

  html += `
