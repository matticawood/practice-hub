  } else {
    html += `<div style="margin-bottom:32px">`;
    for (const b of upcomingClinics) {
      const start   = new Date(b.start);
      const dateStr = start.toLocaleDateString("en-GB", { weekday:"short", day:"numeric", month:"short" });
      const timeStr = start.toLocaleTimeString("en-GB", { hour:"2-digit", minute:"2-digit" });
      const attendee = b.attendees?.[0];
      html += `<div class="clinic-item">
        <div class="clinic-date">${dateStr}<br>${timeStr}</div>
        <div>
          <div class="clinic-name">${escHtml(attendee?.name || "—")}</div>
          <div class="clinic-meta">${escHtml(attendee?.email || "")} · ${b.duration}min</div>
          ${b.meetingUrl ? `<a class="clinic-zoom" href="${b.meetingUrl}" target="_blank">Join Zoom →</a>` : ""}
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  // ── Passage Fixer section ─────────────────────────────────
  html += `<h2 class="section-header" style="border-bottom-color:#1e2d4a">
    ${ico('target','#a5b4fc')}Passage Fixer
    <span class="section-meta">${totalGames} games all time · ${gamesThisWeek} this week</span>
  </h2>`;

  if (totalGames === 0) {
    html += `<p style="color:var(--text-muted);font-size:.85rem;margin-bottom:32px">No passage games played yet.</p>`;
  } else {
    // Summary stat grid
    html += `<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:28px">
      <div class="stat-card" style="border-color:#1e2d4a">
        <div class="stat-value" style="color:#a5b4fc">${totalGames}</div>
        <div class="stat-label">Total games</div>
      </div>
      <div class="stat-card" style="border-color:#1e2d4a">
        <div class="stat-value" style="color:#4ade80">${clearanceRate}%</div>
        <div class="stat-label">Clearance rate</div>
      </div>
      <div class="stat-card" style="border-color:#1e2d4a">
        <div class="stat-value" style="color:#4ade80">${clearedGames}</div>
        <div class="stat-label">Cleared</div>
      </div>
      <div class="stat-card" style="border-color:#1e2d4a">
        <div class="stat-value" style="color:#60a5fa">${leveledUpGames}</div>
        <div class="stat-label">Levelled up</div>
      </div>
      <div class="stat-card" style="border-color:#1e2d4a">
        <div class="stat-value" style="color:var(--text-muted)">${abandonedGames}</div>
        <div class="stat-label">Abandoned</div>
      </div>
      <div class="stat-card" style="border-color:#1e2d4a">
        <div class="stat-value" style="color:#a5b4fc">${avgAccuracy}%</div>
        <div class="stat-label">Avg accuracy</div>
      </div>
    </div>`;

    // Two col: top passages + per-student
    html += `<div class="two-col" style="margin-bottom:32px">`;

    // Top passages
    html += `<div>
      <h3 class="section-header" style="font-size:.85rem;border-bottom-color:#1e2d4a">Most worked passages</h3>`;
    if (topPassages.length === 0) {
      html += `<p style="color:var(--text-muted);font-size:.85rem">None yet.</p>`;
    } else {
      const maxPassageCount = topPassages[0].count;
      html += `<div>`;
      for (const p of topPassages) {
        const barPct = Math.round((p.count / maxPassageCount) * 100);
        const pAcc   = p.accuracyCount > 0 ? Math.round((p.totalAccuracy / p.accuracyCount) * 100) : null;
        const successCount = p.cleared + p.leveledUp;
        html += `
        <div style="padding:10px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:6px">
            <div style="flex:1;min-width:0">
              <div style="font-size:.88rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(p.label)}</div>
              ${p.piece ? `<div style="font-size:.72rem;color:var(--text-muted);margin-top:1px">${escHtml(p.piece)}</div>` : ""}
            </div>
            <div style="font-size:.8rem;font-weight:700;color:#a5b4fc;flex-shrink:0">${p.count} game${p.count===1?"":"s"}</div>
          </div>
          <div style="height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-bottom:5px">
            <div style="height:100%;width:${barPct}%;background:#4f46e5;border-radius:2px"></div>
          </div>
          <div style="display:flex;gap:12px;font-size:.68rem;color:var(--text-muted)">
            <span>${p.students.size} student${p.students.size===1?"":"s"}</span>
            <span style="color:#4ade80">${successCount} cleared/levelled</span>
            ${pAcc !== null ? `<span>${pAcc}% accuracy</span>` : ""}
            ${p.simplifyTotal > 0 ? `<span>${(p.simplifyTotal/p.count).toFixed(1)} simplifies/game</span>` : ""}
          </div>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</div>`;

    // Per-student breakdown
    html += `<div><details><summary style="cursor:pointer;color:#64748b;font-size:.82rem;font-weight:600;padding:4px 0">Usage by student</summary>`;
    const gameStudents = Object.entries(gamesByStudent)
      .sort((a, b) => b[1].total - a[1].total);
    if (gameStudents.length === 0) {
      html += `<p style="color:var(--text-muted);font-size:.85rem">No usage yet.</p>`;
    } else {
      html += `<div>`;
      for (const [email, s] of gameStudents) {
        const acc     = s.accuracyCount > 0 ? Math.round((s.accuracySum / s.accuracyCount) * 100) : null;
        const succRate = s.total > 0 ? Math.round(((s.cleared + s.leveledUp) / s.total) * 100) : 0;
        html += `
        <div style="padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px">
          <div style="flex:1;min-width:0">
            <div style="font-size:.85rem;font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(email)}</div>
            <div style="font-size:.7rem;color:var(--text-muted);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap">
              <span>${s.total} game${s.total===1?"":"s"}</span>
              <span style="color:#4ade80">${s.cleared} cleared</span>
              ${s.leveledUp > 0 ? `<span style="color:#60a5fa">${s.leveledUp} levelled up</span>` : ""}
              ${s.abandoned > 0 ? `<span>${s.abandoned} abandoned</span>` : ""}
              ${acc !== null ? `<span>${acc}% accuracy</span>` : ""}
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:1.1rem;font-weight:800;color:${succRate>=70?"#4ade80":succRate>=40?"#f59e0b":"var(--text-muted)"}">${succRate}%</div>
            <div style="font-size:.62rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em">clear rate</div>
          </div>
        </div>`;
      }
      html += `</div>`;
    }
    html += `</details></div></div>`;

    // Recent passage game activity
    html += `<h3 class="section-header" style="font-size:.85rem;border-bottom-color:#1e2d4a">Recent passage game activity</h3>`;
    html += `<div class="activity-feed" style="margin-bottom:36px">`;
    const recentGames = games.slice(0, 20);
    for (const g of recentGames) {
      const outcomeColor = g.outcome === "cleared" ? "#4ade80" : g.outcome === "leveled_up" ? "#60a5fa" : "var(--text-muted)";
      const outcomeLabel = g.outcome === "cleared" ? "Cleared" : g.outcome === "leveled_up" ? "Levelled up" : "Abandoned";
      const acc = g.attempts > 0 ? Math.round((g.correct_count / g.attempts) * 100) : null;
      html += `
      <div class="activity-item">
        <div class="activity-dot" style="background:#4f46e5"></div>
        <div class="activity-body">
          <div class="activity-email">${escHtml(g.email)}</div>
          <div class="activity-detail">
            <strong style="color:var(--text)">${escHtml(g.passage_label)}</strong>
            ${g.piece_label ? ` — ${escHtml(g.piece_label)}` : ""}
            · Lv.${g.level} · ${g.attempts} attempts${acc !== null ? ` · ${acc}% accuracy` : ""}
            ${g.simplify_triggers > 0 ? ` · ${g.simplify_triggers} simplify` : ""}
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:.72rem;font-weight:700;color:${outcomeColor};text-transform:uppercase;letter-spacing:.06em">${outcomeLabel}</div>
          <div class="activity-time">${relativeDate((g.created_at||"").slice(0,10))}</div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }

  // Recent activity feed
  html += `
  <h2 class="section-header">⏱ Recent sessions <span class="section-meta">latest ${recentActivity.length}</span></h2>
  <div class="activity-feed">`;
  if (recentActivity.length === 0) {
    html += `<p style="color:var(--text-muted);font-size:0.85rem">No sessions yet.</p>`;
  } else {
    for (const sess of recentActivity) {
      const items    = sess.practice_items || [];
      const sessMins = sess.timing_mode === "per_item"
        ? items.reduce((s, i) => s + (i.duration_minutes || 0), 0)
        : (sess.duration_minutes || 0);
      const pieces   = items.filter(i => i.item_type === "piece")
        .map(i => i.piece_label || i.label || "Untitled").slice(0, 3);
      const detail   = pieces.length > 0
        ? pieces.join(", ") + (items.filter(i=>i.item_type==="piece").length > 3 ? " + more" : "")
        : `${items.length} item${items.length===1?"":"s"}`;

      html += `
      <div class="activity-item">
        <div class="activity-dot"></div>
        <div class="activity-body">
          <div class="activity-email">${escHtml(sess.email)}</div>
          <div class="activity-detail">${escHtml(detail)} · ${fmtMins(sessMins)}</div>
        </div>
        <div class="activity-time">${relativeDate(sess.session_date)}</div>
      </div>`;
    }
  }
  html += `</div>`;

  document.getElementById("analytics-loading").style.display  = "none";
  document.getElementById("analytics-content").style.display  = "block";
  document.getElementById("analytics-content").innerHTML = html;

  populateSquareCards({ weekSessions, weekMins, totalSessions, totalMins, typeMins, totalTypeMins, topPieces, weekLabel });
}

// ── Share card download ───────────────────────────────────────
async function downloadShareCard() {
  const card = document.getElementById("share-card");
  if (!card) return;
  const btn = document.querySelector(".share-btn");
  btn.textContent = "Generating…";
  try {
    const canvas = await html2canvas(card, {
      backgroundColor: "#111",
      scale: 2,
      useCORS: true,
    });
    const link = document.createElement("a");
    link.download = `practice-room-${new Date().toISOString().slice(0,10)}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  } finally {
    btn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Share summary`;
  }
}

// ── Square card population ────────────────────────────────────
function populateSquareCards({ weekSessions, weekMins, totalSessions, totalMins, typeMins, totalTypeMins, topPieces, weekLabel }) {

  // Shared shell: glow layer + accent bar + body wrapper
  function sqCard(innerHtml) {
    return `
      <div class="sq-glow"></div>
      <div class="sq-accent"></div>
      <div class="sq-body">
        <div class="sq-brand">The Practice Room</div>
        <div class="sq-center">${innerHtml}</div>
        <div class="sq-footer">
          <div class="sq-footer-brand">app.matthewcawood.com</div>
          <div class="sq-footer-url">${weekLabel}</div>
        </div>
      </div>`;
  }

  // Big-number cards: readable label above, giant number below
  function statCard(value, label, sub) {
    return sqCard(`
      <div class="sq-stat-unit">
        <div class="sq-big-label">${label}</div>
        <div class="sq-big-value">${value}</div>
        ${sub ? `<div class="sq-big-sub">${sub}</div>` : ""}
      </div>
    `);
  }

  // ── Card 1: Sessions this week ────────────────────────────
  document.getElementById("sq-card-1").innerHTML =
    statCard(weekSessions.length, "sessions logged this week");

  // ── Card 2: Practice time this week ──────────────────────
  document.getElementById("sq-card-2").innerHTML =
    statCard(fmtMinsSq(weekMins), "practice time this week");

  // ── Card 3: Total sessions all time ──────────────────────
  document.getElementById("sq-card-3").innerHTML =
    statCard(totalSessions, "sessions logged");

  // ── Card 4: Total practice time all time ─────────────────
  document.getElementById("sq-card-4").innerHTML =
    statCard(fmtMinsSq(totalMins), "practice time logged");

  // ── Card 5: Top 5 pieces ──────────────────────────────────
  const pieceItems = topPieces.slice(0, 5).map((p, i) => `
    <div class="sq-pl-item">
      <div class="sq-pl-num ${i === 0 ? "top" : ""}">${i + 1}</div>
      <div class="sq-pl-info">
        <div class="sq-pl-name">${escHtml(p.name)}</div>
      </div>
      <div class="sq-pl-time">${fmtMins(p.mins)}</div>
    </div>`).join("");

  document.getElementById("sq-card-5").innerHTML = sqCard(topPieces.length ? `
    <div style="font-size:.82rem;color:#bbb;margin-bottom:14px;text-align:left;width:100%;font-weight:500">Most practiced pieces</div>
    <div class="sq-pl-list">${pieceItems}</div>
  ` : `<div style="color:#333;font-size:.8rem">No piece data yet</div>`);

  // ── Card 6: Practice mix ──────────────────────────────────
  const typeBarSegs = Object.entries(TYPE_COLORS).map(([type, cfg]) => {
    const pct = ((typeMins[type] || 0) / (totalTypeMins || 1) * 100).toFixed(1);
    return Number(pct) > 0 ? `<div class="sq-type-seg" style="flex:${pct};background:${cfg.color}"></div>` : "";
  }).join("");

  const typeRows = Object.entries(TYPE_COLORS).map(([type, cfg]) => {
    const mins = typeMins[type] || 0;
    if (!mins) return "";
    const pct = (mins / (totalTypeMins || 1) * 100).toFixed(0);
    return `<div class="sq-type-row">
      <div class="sq-type-dot" style="background:${cfg.color}"></div>
      <div class="sq-type-name">${cfg.label}</div>
      <div class="sq-type-pct">${pct}%</div>
    </div>`;
  }).join("");

  document.getElementById("sq-card-6").innerHTML = sqCard(totalTypeMins > 0 ? `
    <div class="sq-type-wrap">
      <div style="font-size:.82rem;color:#bbb;margin-bottom:18px;text-align:left;font-weight:500">How the community practices</div>
      <div class="sq-type-bar">${typeBarSegs}</div>
      <div class="sq-type-rows">${typeRows}</div>
    </div>
  ` : `<div style="color:#333;font-size:.8rem">No data yet</div>`);
}

// ── Square card download ──────────────────────────────────────
async function downloadSquareCard(n) {
  const card = document.getElementById(`sq-card-${n}`);
  const btn  = document.getElementById(`sq-btn-${n}`);
  if (!card || !btn) return;
  const origText = btn.innerHTML;
  btn.textContent = "Generating…";
  try {
    const canvas = await html2canvas(card, {
      backgroundColor: "#080808",
      scale: 4,
      useCORS: true,
      width: 500,
      height: 500,
    });
    const link = document.createElement("a");
    const labels = ["", "sessions-week", "time-week", "total-sessions", "total-time", "top-piece", "practice-mix"];
    link.download = `practice-room-${labels[n]}-${new Date().toISOString().slice(0,10)}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
  } finally {
    btn.innerHTML = origText;
  }
}

// ── Start ─────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
