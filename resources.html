let _glossaryAllTerms = [];
let _glossaryLoaded   = false;

async function loadGlossary() {
  if (_glossaryLoaded) { renderGlossary(); return; }
  const container = document.getElementById("glossary-container");
  if (container) container.innerHTML = '<p class="ppd-loading">Loading&hellip;</p>';
  const { data, error } = await db.from("glossary").select("*").order("term");
  if (error) { console.error("Glossary load error:", error); return; }
  _glossaryAllTerms = data || [];
  _glossaryLoaded   = true;
  const cats = Array.from(new Set(_glossaryAllTerms.map(function(t) { return t.category; }))).sort();
  const sel  = document.getElementById("glossary-category");
  if (sel) {
    sel.innerHTML = '<option value="">All categories</option>' +
      cats.map(function(c) { return '<option value="' + escHtml(c) + '">' + escHtml(c) + '</option>'; }).join("");
  }
  renderGlossary();
}

function glossaryFilter() { renderGlossary(); }

const GLOSSARY_ORIGIN_ABBR = {
  'Italian':'It.', 'German':'Ger.', 'French':'Fr.',
  'Latin':'Lat.', 'Greek':'Gk.', 'English':'Eng.'
};

function renderGlossary() {
  const container = document.getElementById("glossary-container");
  if (!container) return;
  const q   = ((document.getElementById("glossary-search") && document.getElementById("glossary-search").value) || "").toLowerCase().trim();
  const cat = (document.getElementById("glossary-category") && document.getElementById("glossary-category").value) || "";
  const filtered = _glossaryAllTerms.filter(function(t) {
    const matchQ   = !q || t.term.toLowerCase().includes(q) || t.definition.toLowerCase().includes(q);
    const matchCat = !cat || t.category === cat;
    return matchQ && matchCat;
  });
  if (!filtered.length) {
    container.innerHTML = '<p class="ppd-loading" style="color:var(--text-muted)">No terms found.</p>';
    return;
  }
  const groups = {};
  filtered.forEach(function(t) {
    const letter = /^\d/.test(t.term) ? '#' : t.term[0].toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(t);
  });
  container.innerHTML = Object.keys(groups).sort(function(a, b) {
    if (a === '#') return -1; if (b === '#') return 1; return a.localeCompare(b);
  }).map(function(letter) {
    return '<div class="glossary-group">' +
      '<div class="glossary-letter">' + letter + '</div>' +
      groups[letter].map(function(t) {
        const originAbbr = t.origin ? (GLOSSARY_ORIGIN_ABBR[t.origin] || t.origin) : null;
        return '<div class="glossary-term">' +
          '<div class="glossary-term-header">' +
            '<span class="glossary-term-name">' + escHtml(t.term) + '</span>' +
            (originAbbr ? '<span class="glossary-term-origin">[' + escHtml(originAbbr) + ']</span>' : '') +
            '<span class="glossary-term-cat">' + escHtml(t.category) + '</span>' +
            (t.symbol_html ? '<span class="glossary-symbol">' + t.symbol_html + '</span>' : '') +
          '</div>' +
          '<div class="glossary-term-def">' + escHtml(t.definition) + '</div>' +
        '</div>';
      }).join("") +
    '</div>';
  }).join("");
}

// ── PPD (Piano Practice Daily) — finalized redesign ──────────────────────────
// Data/mutation layer below is preserved from the original; the render layer is
// the new _ppdnew.html design wired to real data + the real mutation functions.
let _ppdLoaded = false;
let _ppdAllSheets = [];
let _ppdReadingMap = new Map();
let _ppdNoteSlugs  = new Set();
let _ppdViewingListEmail = '';
let _ppdViewedMap = null;      // admin: another user's reading_list (null = viewing own)
let _ppdNotesMap = null;       // slug -> note text (lazy)
let _ppdInboxData = null;      // requests rows (lazy)

// View/UI state for the new shell
let _ppdView = 'library';            // library | mylist | notebook | requests
let _ppdFilterCat = '';
let _ppdQuery = '';
let _ppdMylistSub = 'reading';       // reading | read
let _ppdAnimCards = true;
let _ppdProgressAnimated = false;
let _ppdShellAdmin = null;

function _ppdReducedMotion() { return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches; }

// ── Preserved helpers ──
function _ppdEsc(str) {
  return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function _ppdAttr(str) { return _ppdEsc(str).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function _ppdCleanCat(cat) {
  return (cat || 'General').replace(/^category:\s*/i, '').trim() || 'General';
}
const _PPD_SMALL = new Set(['a','an','and','as','at','but','by','for','in','nor','of','on','or','so','the','to','up','via','vs','vs.']);
function _ppdTitleCase(str) {
  return str.toLowerCase().split(/\s+/).map(function(w, i) {
    return (i === 0 || !_PPD_SMALL.has(w)) ? w.charAt(0).toUpperCase() + w.slice(1) : w;
  }).join(' ');
}
function _ppdDisplayTitle(title) {
  let t = (title || '').replace(/^PIANO\s+PRACTICE\s+DAILY:\s*/i, '').trim();
  t = t.replace(/^([A-ZÉÀÈÙÂÊÎÔÛÄËÏÖÜÇ\s''&\/\-]+?)(\s*:.+)?$/, function(_, topic, rest) {
    const titled = _ppdTitleCase(topic);
    return rest ? titled + rest : titled;
  });
  return t || title;
}
function _ppdIsNew(sheet) {
  if (!sheet.created_at) return false;
  return Date.now() - new Date(sheet.created_at).getTime() < 14 * 24 * 60 * 60 * 1000;
}
// Deeper cover palette from the prototype
// Palette ordered so consecutive entries are far apart in hue → adjacent
// (alphabetical) categories get maximally distinct colours.
var _ppdCatColors = ['#b3713d','#4e9a5c','#4a7fb0','#b0529a','#a8893a','#3f9a86','#6a64b3','#7e983e','#3f8fa0','#9558b0','#b3506a','#5a7d52'];
// Assign each distinct category a colour by its position in the sorted list
// (not a hash) so different categories never collide until the palette wraps.
function _ppdCatColor(cat) {
  cat = _ppdCleanCat(cat);
  var cats = Array.from(new Set((_ppdAllSheets || []).map(function(s) { return _ppdCleanCat(s.category); }))).sort();
  var i = cats.indexOf(cat);
  if (i < 0) i = 0;
  return _ppdCatColors[i % _ppdCatColors.length];
}
function _ppdMono(cat) { return (_ppdCleanCat(cat) || '?').trim().charAt(0).toUpperCase(); }
function _ppdIntro(sheet) {
  const c = sheet.content;
  // new schema → overview; old schema → intro; legacy column fallback
  const raw = (c && (c.overview || c.intro)) || sheet.intro || '';
  return String(raw).replace(/<[^>]+>/g, '').trim();
}

// ── Reading time (NEW): words across the real content object @ 150 wpm ──
function _ppdCountWords(text) {
  if (!text) return 0;
  const m = String(text).trim().match(/\S+/g);
  return m ? m.length : 0;
}
function _ppdReadMins(sheet) {
  const c = sheet.content;
  let words = 0;
  if (c && Array.isArray(c.pages)) {
    // new schema
    words += _ppdCountWords(c.overview);
    c.pages.forEach(function(p) {
      (p.sections || []).forEach(function(sec) {
        words += _ppdCountWords(sec.heading);
        (sec.blocks || []).forEach(function(b) {
          if (b.type === 'ul') (b.items || []).forEach(function(i) { words += _ppdCountWords(i); });
          else words += _ppdCountWords(b.text);
        });
      });
    });
    (c.takeaways || []).forEach(function(t) { words += _ppdCountWords(t); });
    (c.glossary || []).forEach(function(g) { words += _ppdCountWords(g && g.term) + _ppdCountWords(g && g.definition); });
  } else if (c && typeof c === 'object') {
    words += _ppdCountWords(c.intro);
    words += _ppdCountWords(c.footer);
    const secs = [].concat(c.leftSections || [], c.rightSections || []);
    secs.forEach(function(sec) {
      if (!sec) return;
      words += _ppdCountWords(sec.heading);
      words += _ppdCountWords(sec.paragraph);
      (sec.bullets || []).forEach(function(b) { words += _ppdCountWords(b); });
    });
    (c.cheatBullets || []).forEach(function(b) { words += _ppdCountWords(b); });
  } else {
    words = _ppdCountWords(sheet.intro);
  }
  // keep in sync with theory/sheets/view.html readMins (170 wpm)
  return Math.max(1, Math.round(words / 170));
}
function _ppdFmtMins(m) {
  if (m >= 60) { const h = Math.floor(m / 60), mm = m % 60; return h + 'h' + (mm ? ' ' + mm + 'm' : ''); }
  return m + ' min';
}

// ── Reading-list pill (status) ──

  const status = _ppdReadingMap.get(sheetId) || 'none';
  const cls    = status === 'reading' ? 'ppd-pill-reading' : status === 'read' ? 'ppd-pill-read' : 'ppd-pill-none';
  const label  = status === 'reading' ? '&#128214; Reading' : status === 'read' ? '&#10003; Read' : '+ Save';
  const title  = status === 'none' ? 'Save to reading list' : status === 'reading' ? 'Mark as read (click again to remove)' : 'Remove from list';
  return '<button type="button" class="ppd-pill ' + cls + '" data-ppd-sheet="' + sheetId + '" title="' + title + '" onclick="event.preventDefault();event.stopPropagation();ppdCycleStatus(\'' + sheetId + '\', this)">' + label + '</button>';
}

// ── Book-cover card ──
function _ppdCard(sheet, opts) {
  opts = opts || {};

  const readonly = !!opts.readonly;
  const cat = _ppdCleanCat(sheet.category);

  else if (status === 'read') corner = '<span class="ppd-card-readmark" title="Read"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>';
  let admin = '';
  if (isOwner() && !readonly) {

// ── Count-up + progress motion ──
function _ppdCountUp(el, to, fmt, dur) {
  if (!el) return;
  const setFinal = function() { el.textContent = fmt ? fmt(to) : to; };
  if (_ppdReducedMotion()) { setFinal(); return; }
  const start = performance.now();
  function step(t) {
    const p = Math.min(1, (t - start) / dur), e = 1 - Math.pow(1 - p, 3), val = Math.round(e * to);
    el.textContent = fmt ? fmt(val) : val;
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
  setTimeout(setFinal, dur + 150); // safety net if rAF is throttled
}
function _ppdAnimProgress() {
  const total = _ppdAllSheets.length;
  const readCount = _ppdAllSheets.filter(function(s) { return _ppdReadingMap.get(s.id) === 'read'; }).length;
  const minsRead = _ppdAllSheets.filter(function(s) { return _ppdReadingMap.get(s.id) === 'read'; }).reduce(function(a, s) { return a + _ppdReadMins(s); }, 0);
  const pct = total ? Math.round(readCount / total * 100) : 0;
  const fill = document.getElementById('ppdFill');
  if (_ppdReducedMotion()) { if (fill) fill.style.width = pct + '%'; return; }
  if (fill) { fill.style.width = '0%'; setTimeout(function() { fill.style.width = pct + '%'; }, 40); }
  _ppdCountUp(document.getElementById('ppdStRead'), readCount, null, 900);
  _ppdCountUp(document.getElementById('ppdStMins'), minsRead, _ppdFmtMins, 900);
}

function _ppdRequestsHeader() {
  return '<div class="ppd-vhead"><div class="ppd-vhead-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 10h8M8 14h5"/></svg></div>' +

function _ppdRequestsContent() {
  if (_ppdInboxData === null) return '<p class="ppd-loading">Loading&hellip;</p>';
  const pending = _ppdInboxData.filter(function(r) { return !r.done; });
  const done    = _ppdInboxData.filter(function(r) { return  r.done; });
  if (!pending.length && !done.length) return '<div class="ppd-empty">No requests yet.</div>';
  function reqCard(r, isDone) {
    const meta = (isDone ? 'Added' : 'Pending') + ' · ' + _ppdEsc(r.email || 'anonymous') + ' · ' + new Date(r.created_at).toLocaleDateString('en-GB');
    const action = isDone
      ? '<button type="button" class="ppd-req-btn" onclick="ppdUndoRequest(' + r.id + ')">&#8629; Undo</button>'
      : '<button type="button" class="ppd-req-btn" onclick="ppdMarkReqDone(' + r.id + ')">&#10003; Mark added</button>';
    return '<div class="ppd-note' + (isDone ? ' done' : '') + '" style="--nc:' + (isDone ? '#5a8a6a' : '#5a86b4') + '">' +
      '<div class="ppd-note-cat">' + meta + '</div>' +
      '<div class="ppd-note-body">' + _ppdEsc(r.message) + '</div>' +
      '<div class="ppd-note-actions">' + action + '</div>' +
    '</div>';
  }
  let html = '';
  html += '<div class="ppd-hd"><span class="ppd-hd-title">Pending</span><span class="ppd-hd-count">' + pending.length + '</span><span class="ppd-hd-line"></span></div>';
  html += '<div class="ppd-notes">' + (pending.length ? pending.map(function(r) { return reqCard(r, false); }).join('') : '<div class="ppd-empty">No pending requests.</div>') + '</div>';
  html += '<div class="ppd-hd"><span class="ppd-hd-title">Added Articles</span><span class="ppd-hd-count">' + done.length + '</span><span class="ppd-hd-line"></span></div>';
  html += '<div class="ppd-notes">' + (done.length ? done.map(function(r) { return reqCard(r, true); }).join('') : '<div class="ppd-empty">None yet.</div>') + '</div>';
  return html;
}

// ── Main render ──
function _ppdRender() {
  const app = document.getElementById('ppd-index');
  if (!app) return;
  if (!document.getElementById('ppd-headcard') || _ppdShellAdmin !== isOwner()) {
    _ppdShellAdmin = isOwner();
    app.innerHTML = '<div class="ppd-headcard" id="ppd-headcard"><div class="ppd-tabrow-outer"><div class="ppd-tabrow" id="ppd-tabrow">' + _ppdTabRowInner() + '</div>' + _ppdSuggestBtn() + '</div>' +
      '<div class="ppd-headbody" id="ppd-headbody"></div></div><div id="ppd-content"></div>';
  }
  document.querySelectorAll('#ppd-tabrow .ppd-tab').forEach(function(b) { b.classList.toggle('active', b.dataset.ppdTab === _ppdView); });
  const hb = document.getElementById('ppd-headbody');
  hb.innerHTML = _ppdViewHeader();
  hb.classList.remove('anim');
  if (_ppdAnimCards && !_ppdReducedMotion()) { void hb.offsetWidth; hb.classList.add('anim'); }

// ── Preserved: reading-list status cycle ──
window.ppdCycleStatus = async function(sheetId, btn) {
  const current = _ppdReadingMap.get(sheetId) || 'none';
  const next = current === 'none' ? 'reading' : current === 'reading' ? 'read' : 'none';
  if (btn) { btn.disabled = true; btn.innerHTML = '&hellip;'; }
  let dbError = null;
  if (next === 'none') {
    const { error } = await db.from('reading_list').delete().eq('email', myEmail).eq('sheet_id', sheetId);
    dbError = error; if (!error) _ppdReadingMap.delete(sheetId);
  } else if (current === 'none') {
    const { error } = await db.from('reading_list').insert({ email: myEmail, sheet_id: sheetId, status: next });
    dbError = error; if (!error) _ppdReadingMap.set(sheetId, next);
  } else {
    const { error } = await db.from('reading_list').update({ status: next }).eq('email', myEmail).eq('sheet_id', sheetId);
    dbError = error; if (!error) _ppdReadingMap.set(sheetId, next);
  }
  if (dbError) {
    console.error('Reading list update failed:', dbError);
    if (btn) { btn.disabled = false; btn.innerHTML = current === 'none' ? '+ Save' : current === 'reading' ? '&#128214; Reading' : '&#10003; Read'; }
    return;
  }
  // Re-render the active view so cards, progress, counts and resume shelf all reflect the change.
  _ppdProgressAnimated = (_ppdView === 'library'); // keep progress static on in-view updates
  if (_ppdView === 'library') _ppdRenderLibraryBody();
  else _ppdRender();
};

// ── Preserved: data load ──
async function _ppdLoadSheets() {
  const results = await Promise.all([
    db.from('theory_sheets').select('*').order('created_at'),
    db.from('reading_list').select('sheet_id, status').eq('email', myEmail),
    db.from('sheet_notes').select('sheet_slug').eq('email', myEmail)
  ]);
  const sheetsRes  = results[0];
  const readingRes = results[1];
  const notesRes   = results[2];
  (readingRes.data || []).forEach(function(r) { _ppdReadingMap.set(r.sheet_id, r.status); });
  (notesRes.data   || []).forEach(function(r) { _ppdNoteSlugs.add(r.sheet_slug); });
  _ppdAllSheets = (sheetsRes.error || !sheetsRes.data) ? [] : sheetsRes.data;
  _ppdRender();
}

// Re-sync the reading list when returning to this page (e.g. back from an article,
// where opening/saving/finishing it changed the status). Covers bfcache restores.
async function _ppdRefreshReading() {
  if (!myEmail || !_ppdAllSheets || !_ppdAllSheets.length || _ppdViewedMap) return;
  try {
    const { data, error } = await db.from('reading_list').select('sheet_id, status').eq('email', myEmail);
    if (error || !data) return;
    _ppdReadingMap.clear();
    data.forEach(function(r) { _ppdReadingMap.set(r.sheet_id, r.status); });
    if (typeof _ppdRender === 'function') _ppdRender();
  } catch (e) {}
}

window.ppdStartRenameCategory = function(oldName) {

  _ppdRenameCategory(oldName, newName.trim());

async function _ppdRenameCategory(oldName, newName) {
  const ids = _ppdAllSheets.filter(function(s) { return _ppdCleanCat(s.category) === oldName; }).map(function(s) { return s.id; });
  if (!ids.length) return;
  const { error } = await db.from('theory_sheets').update({ category: newName }).in('id', ids);
  if (error) { alert('Rename failed: ' + error.message); return; }
  _ppdAllSheets = _ppdAllSheets.map(function(s) { return ids.includes(s.id) ? Object.assign({}, s, { category: newName }) : s; });

window.ppdMoveSheet = async function(id, selectEl) {

  if (newCat === '__new__') {
    const typed = prompt('New category name:');
    if (!typed || !typed.trim()) { _ppdRender(); return; }
    newCat = typed.trim();
  }
  const { data: updated, error } = await db.from('theory_sheets').update({ category: newCat }).eq('id', id).select();
  if (error) { alert('DB error: ' + error.message); _ppdRender(); return; }
  if (!updated || updated.length === 0) { alert('No rows updated — check Supabase RLS policies.'); _ppdRender(); return; }
  _ppdAllSheets = _ppdAllSheets.map(function(s) { return s.id === id ? Object.assign({}, s, { category: newCat }) : s; });
  _ppdProgressAnimated = true; _ppdRenderLibraryBody();
};

    : String(startFinger);
  const degreeOf = {};
  intervals.forEach((interval, deg) => {
    degreeOf[(rootSemi + interval + 120) % 12] = deg;
  });
  const map = new Map();
  for (let pos = 0; pos < 36; pos++) {
    const deg = degreeOf[pos % 12];
    if (deg !== undefined) {
      map.set(pos, deg === 0 ? crossingLabel : String(fingers[deg]));
    }
  }
  return map;
}

function buildChordColorMap(r, t, f) {
  const TOTAL  = 36;
  const colors = ['#f59e0b','#60a5fa','#34d399','#f472b6','#a78bfa'];
  const tOff   = (t - r + 12) % 12;
  const fOff   = (f - r + 12) % 12;
  const map    = new Map();
  const firstRoot = ((r % 12) + 12) % 12;
  let groupIdx = 0;
  for (let rootPos = firstRoot - 12; rootPos < TOTAL; rootPos += 12) {
    const tPos = rootPos + tOff;
    const fPos = rootPos + fOff;
    const visible = [];
    if (rootPos >= 0 && rootPos < TOTAL) visible.push(rootPos);
    if (tPos   >= 0 && tPos   < TOTAL) visible.push(tPos);
    if (fPos   >= 0 && fPos   < TOTAL) visible.push(fPos);
    if (visible.length > 0 && groupIdx < colors.length) {
      const col = colors[groupIdx++];
      visible.forEach(p => map.set(p, col));
    }
  }
  return map;
}

function buildScaleColorMap(scaleSemiSet, rootSemi) {
  const colors       = ['#f59e0b','#60a5fa','#34d399'];
  const overflowCol  = '#f472b6';
  const map = new Map();
  let octaveIdx = -1;
  for (let pos = 0; pos < 36; pos++) {
    const semi = pos % 12;
    if (semi === rootSemi) octaveIdx++;
    if (scaleSemiSet.has(semi)) {
      map.set(pos, octaveIdx >= 0 ? colors[Math.min(octaveIdx, 2)] : overflowCol);
    }
  }
  return map;
}

function buildPianoSVG(highlightSemis, isChord, fingerMap) {
  fingerMap = fingerMap || null;
  const OCTAVES = 3;
  const WW = 20, WH = 64, BW = 12, BH = 40;
  const totalW = OCTAVES * 7 * WW;

  const rootSemi = highlightSemis.length ? ((highlightSemis[0] % 12) + 12) % 12 : -1;
  const semiSet  = new Set(highlightSemis.map(function(s){ return ((s % 12) + 12) % 12; }));
  const isSingle = !isChord && highlightSemis.length === 1;
  const isScale  = !isChord && highlightSemis.length > 1;

  const chordMap = (isChord && highlightSemis.length >= 3)
    ? buildChordColorMap(
        ((highlightSemis[0]%12)+12)%12,
        ((highlightSemis[1]%12)+12)%12,
        ((highlightSemis[2]%12)+12)%12)
    : null;

  const scaleMap = isScale
    ? buildScaleColorMap(semiSet, rootSemi)
    : null;

  const whiteNotes = [0,2,4,5,7,9,11];
  const blackData  = [{s:1,r:0.9},{s:3,r:1.9},{s:6,r:3.9},{s:8,r:4.9},{s:10,r:5.9}];

  const wNormal  = '#f5f0e8';
  const bNormal  = '#1a1a1a';
  const singleHl = '#4f46e5';

  let h = `<svg viewBox="0 0 ${totalW} ${WH}" xmlns="http://www.w3.org/2000/svg" style="display:block;width:100%;height:auto;border-radius:6px;overflow:hidden">`;

  for (let oct = 0; oct < OCTAVES; oct++) {
    const ox = oct * 7 * WW;
    whiteNotes.forEach(function(semi, i) {
      const absPos = oct * 12 + semi;
      const x = ox + i * WW;
      const cx = x + WW / 2;
      let fill = wNormal;
      if      (chordMap)                    fill = chordMap.get(absPos) || wNormal;
      else if (scaleMap)                    fill = scaleMap.get(absPos) || wNormal;
      else if (isSingle && semiSet.has(semi)) fill = singleHl;
      h += `<rect x="${x+.5}" y=".5" width="${WW-1}" height="${WH-1}" rx="2" fill="${fill}" stroke="#c8c0b8" stroke-width=".5"/>`;
      if (fingerMap && fingerMap.has(absPos)) {
        const lbl  = fingerMap.get(absPos);
        const dual = lbl.includes('/');
        h += `<text x="${cx}" y="${WH-13}" text-anchor="middle" dominant-baseline="central"
          font-size="${dual ? 6.5 : 8.5}" font-weight="900" font-family="system-ui,sans-serif"
          fill="rgba(255,255,255,.9)">${lbl}</text>`;
      }
    });
  }

  for (let oct = 0; oct < OCTAVES; oct++) {
    const ox = oct * 7 * WW;
    blackData.forEach(function(bd) {
      const s = bd.s, r = bd.r;
      const absPos = oct * 12 + s;
      const x = ox + r * WW - BW / 2;
      const cx = x + BW / 2;
      let fill = bNormal;
      if      (chordMap)                    fill = chordMap.get(absPos) || bNormal;
      else if (scaleMap)                    fill = scaleMap.get(absPos) || bNormal;
      else if (isSingle && semiSet.has(s))  fill = singleHl;
      h += `<rect x="${x.toFixed(1)}" y="0" width="${BW}" height="${BH}" rx="2" fill="${fill}" stroke="#000" stroke-width=".5"/>`;
      if (fingerMap && fingerMap.has(absPos)) {
        const lbl  = fingerMap.get(absPos);
        const dual = lbl.includes('/');
        h += `<text x="${cx.toFixed(1)}" y="${BH - 8}" text-anchor="middle" dominant-baseline="central"
          font-size="${dual ? 5.5 : 7.5}" font-weight="900" font-family="system-ui,sans-serif"
          fill="rgba(255,255,255,.95)">${lbl}</text>`;
      }
    });
  }

  h += '</svg>';
  return h;
}

function keUpdatePiano(semis, isChord) {

function keClickChord(semis, idx) {
  keActiveNoteSemi = -1;

    keActiveChordIdx = idx;

function keScaleNotes(rootName, intervals) {
  const rootLetter = rootName[0];
  const rootSemi   = NOTE_SEMI[rootName] || 0;
  const letterIdx  = DIATONIC_LETTERS.indexOf(rootLetter);
  return intervals.map(function(interval, deg) {
    const targetSemi   = (rootSemi + interval) % 12;
    const letter       = DIATONIC_LETTERS[(letterIdx + deg) % 7];
    const base         = LETTER_SEMI[letter];
    const diff         = ((targetSemi - base) % 12 + 12) % 12;
    if (diff === 0)  return letter;
    if (diff === 1)  return letter + '#';
    if (diff === 11) return letter + 'b';
    if (diff === 2)  return letter + '##';
    if (diff === 10) return letter + 'bb';
    return letter;
  });
}

function keSigHTML(sig, useFlats) {
  const sharpsOrder = ['F','C','G','D','A','E','B'];
  const flatsOrder  = ['B','E','A','D','G','C','F'];
  if (sig === 0) return `<span style="color:#8a7868;font-size:.85rem">♮ None — no sharps or flats</span>`;
  if (sig > 7) {
    return `<span style="color:#8a7868;font-size:.85rem">${sig} ${useFlats ? 'flats' : 'sharps'} — theoretical key</span>`;
  }
  const arr = useFlats ? flatsOrder.slice(0, sig) : sharpsOrder.slice(0, sig);
  const sym = useFlats ? '♭' : '♯';
  return arr.map(function(n){ return `<span class="sig-note">${n}${sym}</span>`; }).join('');
}

function keChordsHTML(notes, romans, qualities, abbrs, classes) {

    Major:'#a5b4fc', Minor:'rgba(200,205,240,.65)',
    Diminished:'rgba(200,205,240,.35)', Augmented:'#f9a8d4'
  };
  return romans.map(function(roman, i) {
    const root  = notes[i];
    const third = notes[(i + 2) % 7];
    const fifth = notes[(i + 4) % 7];
    const suffix = abbrs[i]==='min' ? 'm' : abbrs[i]==='dim' ? '°' : abbrs[i]==='aug' ? '+' : '';
    const name   = root + suffix;
    const semis  = [NOTE_SEMI[root]||0, NOTE_SEMI[third]||0, NOTE_SEMI[fifth]||0];
    return `<div class="chord-card ${classes[i]}" onclick="keClickChord([${semis}],${i})" style="cursor:pointer">
      <div class="chord-roman">${roman}</div>
      <div class="chord-name" style="color:${colors[qualities[i]]}">${name}</div>
      <div class="chord-qual">${qualities[i]}</div>
      <div class="chord-notes">${root}<br>${third}<br>${fifth}</div>
    </div>`;
  }).join('');
}

function annularArcPath(cx, cy, r1, r2, startAngle, endAngle) {
  function pt(r, deg) {
    const rad = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(rad), cy + r * Math.sin(rad)];
  }
  const s1 = pt(r1, startAngle), e1 = pt(r1, endAngle);
  const s2 = pt(r2, startAngle), e2 = pt(r2, endAngle);
  return `M ${s2[0].toFixed(2)} ${s2[1].toFixed(2)} A ${r2} ${r2} 0 0 1 ${e2[0].toFixed(2)} ${e2[1].toFixed(2)} L ${e1[0].toFixed(2)} ${e1[1].toFixed(2)} A ${r1} ${r1} 0 0 0 ${s1[0].toFixed(2)} ${s1[1].toFixed(2)} Z`;
}

function buildCOF() {
  const svg = document.getElementById('cof-svg');
  if (!svg) return;
  const cx = 150, cy = 150, GAP = 1.8;
  const R_OUTER = 138, R_MID = 91, R_INNER = 54;

  let h = '';
  COF_KEYS.forEach(function(key, i) {
    const midAngle   = i * 30;
    const startAngle = midAngle - 15 + GAP / 2;
    const endAngle   = midAngle + 15 - GAP / 2;
    const majSel = keSelection.mode === 'major' && keSelection.idx === i;
    const minSel = keSelection.mode === 'minor' && keSelection.idx === i;

    const isEharmFlipped = majSel && keSelection.eharmFlipped;
    const outerFill = majSel ? '#f0ebe2' : '#1c2a45';
    const outerPath = annularArcPath(cx, cy, R_MID, R_OUTER, startAngle, endAngle);
    const lx = +(cx + ((R_MID + R_OUTER) / 2) * Math.sin(midAngle * Math.PI/180)).toFixed(2);
    const ly = +(cy - ((R_MID + R_OUTER) / 2) * Math.cos(midAngle * Math.PI/180)).toFixed(2);
    const majPrimary  = isEharmFlipped ? key.eharm  : key.name;
    const majSecondary= isEharmFlipped ? key.name   : key.eharm;
    const majPrimFill = majSel ? '#1a1410' : 'rgba(255,255,255,.9)';
    const majSecFill  = majSel ? 'rgba(26,20,16,.5)' : 'rgba(255,255,255,.4)';
    h += `<g onclick="selectMajorKey(${i})" style="cursor:pointer">
      <path d="${outerPath}" fill="${outerFill}" stroke="#06080f" stroke-width="1.5"/>`;
    if (key.eharm) {
      h += `<text x="${lx}" y="${ly - 5.5}" text-anchor="middle" dominant-baseline="central"
          font-size="${majPrimary.length > 2 ? '9' : '11'}" font-weight="800"
          fill="${majPrimFill}" font-family="system-ui,sans-serif">${majPrimary}</text>
        <text x="${lx}" y="${ly + 6}" text-anchor="middle" dominant-baseline="central"
          font-size="7" font-weight="600"
          fill="${majSecFill}" font-family="system-ui,sans-serif">${majSecondary}</text>`;
    } else {
      h += `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="central"
          font-size="${key.name.length > 1 ? '10.5' : '13'}" font-weight="800"
          fill="${majPrimFill}" font-family="system-ui,sans-serif">${key.name}</text>`;
    }
    h += `</g>`;

    const mKey = COF_MINOR_KEYS[i];
    const isMinEharmFlipped = minSel && keSelection.eharmFlipped;
    const innerFill = minSel ? '#f0ebe2' : '#0d1120';
    const innerPath = annularArcPath(cx, cy, R_INNER, R_MID, startAngle, endAngle);
    const mx = +(cx + ((R_INNER + R_MID) / 2) * Math.sin(midAngle * Math.PI/180)).toFixed(2);
    const my = +(cy - ((R_INNER + R_MID) / 2) * Math.cos(midAngle * Math.PI/180)).toFixed(2);
    const mPrimary   = (isMinEharmFlipped ? mKey.eharm : mKey.name).replace(' min','m');
    const mSecondary = mKey.eharm ? (isMinEharmFlipped ? mKey.name : mKey.eharm).replace(' min','m') : null;
    const mPrimFill  = minSel ? '#1a1410' : 'rgba(255,255,255,.78)';
    const mSecFill   = minSel ? 'rgba(26,20,16,.45)' : 'rgba(255,255,255,.38)';
    h += `<g onclick="selectMinorKey(${i})" style="cursor:pointer">
      <path d="${innerPath}" fill="${innerFill}" stroke="#06080f" stroke-width="1.5"/>`;
    if (mSecondary) {
      h += `<text x="${mx}" y="${my - 4.5}" text-anchor="middle" dominant-baseline="central"
          font-size="${mPrimary.length > 3 ? '6.5' : '7.5'}" font-weight="700"
          fill="${mPrimFill}" font-family="system-ui,sans-serif">${mPrimary}</text>
        <text x="${mx}" y="${my + 5}" text-anchor="middle" dominant-baseline="central"
          font-size="5.5" font-weight="600"
          fill="${mSecFill}" font-family="system-ui,sans-serif">${mSecondary}</text>`;
    } else {
      h += `<text x="${mx}" y="${my}" text-anchor="middle" dominant-baseline="central"
          font-size="${mPrimary.length > 3 ? '7.5' : '8.5'}" font-weight="600"
          fill="${mPrimFill}" font-family="system-ui,sans-serif">${mPrimary}</text>`;
    }
    h += `</g>`;
  });

  h += `<circle cx="${cx}" cy="${cy}" r="44" fill="#07091a" stroke="rgba(255,255,255,.08)" stroke-width="1.5"/>`;
  h += `<text x="${cx}" y="${cy - 7}" text-anchor="middle" font-size="9.5" font-weight="800" fill="rgba(255,245,220,.6)" font-family="system-ui,sans-serif" letter-spacing="1">KEY</text>`;
  h += `<text x="${cx}" y="${cy + 7}" text-anchor="middle" font-size="9.5" font-weight="800" fill="rgba(255,245,220,.6)" font-family="system-ui,sans-serif" letter-spacing="1">EXPLORER</text>`;

  svg.innerHTML = h;
}

function selectMajorKey(idx) {
  const key = COF_KEYS[idx];
  if (keSelection.mode === 'major' && keSelection.idx === idx && key.eharm) {
    keSelection = { mode: 'major', idx: idx, eharmFlipped: !keSelection.eharmFlipped };
  } else {
    keSelection = { mode: 'major', idx: idx, eharmFlipped: false };
  }
  buildCOF();
  renderKeyInfo();
}

function selectMinorKey(idx) {
  const key = COF_MINOR_KEYS[idx];
  if (keSelection.mode === 'minor' && keSelection.idx === idx && key.eharm) {
    keSelection = { mode: 'minor', idx: idx, eharmFlipped: !keSelection.eharmFlipped };
  } else {
    keSelection = { mode: 'minor', idx: idx, eharmFlipped: false };
  }
  buildCOF();
  renderKeyInfo();
}

function renderKeyInfo() {
  const el = document.getElementById('key-info');
  if (!el) return;
  keActiveChordIdx = -1;
  keActiveNoteSemi = -1;

  const flipped = keSelection.eharmFlipped;

  if (keSelection.mode === 'major') {
    const baseKey = COF_KEYS[keSelection.idx];
    const relMin  = COF_MINOR_KEYS[keSelection.idx];
    const dispName  = flipped ? baseKey.eharm  : baseKey.name;
    const dispSig   = flipped ? baseKey.eharmSig   : baseKey.sig;
    const dispFlats = flipped ? baseKey.eharmFlats  : baseKey.flats;
    const otherName = flipped ? baseKey.name + ' Major' : (baseKey.eharm ? baseKey.eharm + ' Major' : null);

    const notes  = keScaleNotes(dispName, MAJOR_INTERVALS);
    keCurrentScaleSemis   = notes.map(function(n){ return NOTE_SEMI[n] || 0; });
    keCurrentRootSemi     = baseKey.root;
    keCurrentScaleIntvl   = MAJOR_INTERVALS;
    keCurrentFingeringObj = MAJOR_FINGERING[baseKey.root] || null;
    keCurrentFingerMap    = buildFingerMap(baseKey.root, MAJOR_INTERVALS, keCurrentFingeringObj, keFingerHand);

    const eharmBadge = otherName
      ? `<span onclick="selectMajorKey(${keSelection.idx})"
           style="background:#fdf8ee;border:1px solid #e0d5c8;border-radius:6px;
                  padding:2px 8px;font-size:.72rem;font-weight:600;color:#8a6030;
                  margin-left:4px;cursor:pointer;transition:background .15s"
           title="Switch to ${otherName}"
           onmouseover="this.style.background='rgba(245,197,24,.14)'"
           onmouseout="this.style.background='#fdf8ee'">= ${otherName} ⇄</span>`
      : '';

    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap">
        <div class="key-title">${dispName} Major</div>${eharmBadge}
      </div>
      <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:20px">
        Relative minor: <strong style="color:#5a3a00">${relMin.name}</strong>
        <span style="color:#b8a898;margin-left:6px">· tap inner ring to explore</span>
      </div>

      ${buildRelatedKeysHTML('major', keSelection.idx)}

      <div class="ke-label">Scale notes <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:.65rem;color:#b8a898">— tap a note to highlight on keyboard</span></div>
      <div class="scale-notes-row">${keScaleHTML(notes)}</div>

      ${keFingeringToggleHTML()}
      <div id="ke-piano" style="margin-bottom:6px;overflow-x:auto;-webkit-overflow-scrolling:touch">${buildPianoSVG(keCurrentScaleSemis, false, keCurrentFingerMap)}</div>
      <div id="ke-piano-hint" style="font-size:.65rem;color:#b8a898;text-align:center;margin-bottom:20px">Tap a scale note or chord below &nbsp;·&nbsp; scale octaves <span style="color:#f472b6">■</span><span style="color:#f59e0b">■</span><span style="color:#60a5fa">■</span><span style="color:#34d399">■</span> &nbsp;·&nbsp; chord triads <span style="color:#f59e0b">■</span><span style="color:#60a5fa">■</span><span style="color:#34d399">■</span><span style="color:#f472b6">■</span></div>

      <div class="ke-label">Diatonic chords</div>
      <div class="chords-grid">${keChordsHTML(notes, MAJ_CHORD_ROMAN, MAJ_CHORD_QUALITY, MAJ_CHORD_ABBR, MAJ_CHORD_CLASSES)}</div>
      ${KE_CHORD_LEGEND}

      <div class="ke-label">Key signature</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:36px">${keSigHTML(dispSig, dispFlats)}</div>
    `;

  } else {
    const baseKey = COF_MINOR_KEYS[keSelection.idx];
    const dispName     = flipped ? baseKey.eharm       : baseKey.name;
    const dispSig      = flipped ? baseKey.eharmSig    : baseKey.sig;
    const dispFlats    = flipped ? baseKey.eharmFlats  : baseKey.flats;
    const dispRelMajor = flipped ? baseKey.eharmRelMajor : baseKey.relMajor;
    const otherName    = flipped ? baseKey.name        : baseKey.eharm;

    const scaleData = {
      natural:  { intervals: MINOR_INTERVALS, romans: MIN_CHORD_ROMAN, qualities: MIN_CHORD_QUALITY, abbrs: MIN_CHORD_ABBR, classes: MIN_CHORD_CLASSES },
      harmonic: { intervals: HARM_INTERVALS,  romans: HARM_CHORD_ROMAN, qualities: HARM_CHORD_QUALITY, abbrs: HARM_CHORD_ABBR, classes: HARM_CHORD_CLASSES },
      melodic:  { intervals: MEL_INTERVALS },
    };
    const sd    = scaleData[keMinorType];
    const rootName = dispName.replace(' min', '').trim();
    const notes = keScaleNotes(rootName, sd.intervals);
    keCurrentScaleSemis   = notes.map(function(n){ return NOTE_SEMI[n] || 0; });
    keCurrentRootSemi     = baseKey.root;
    keCurrentScaleIntvl   = sd.intervals;
    keCurrentFingeringObj = MINOR_FINGERING[baseKey.root] || null;
    keCurrentFingerMap    = buildFingerMap(baseKey.root, sd.intervals, keCurrentFingeringObj, keFingerHand);

    const natNotes = keScaleNotes(rootName, MINOR_INTERVALS);
    const vRoot    = natNotes[4];

    const eharmBadge = otherName
      ? `<span onclick="selectMinorKey(${keSelection.idx})"
           style="background:#fdf8ee;border:1px solid #e0d5c8;border-radius:6px;
                  padding:2px 8px;font-size:.72rem;font-weight:600;color:#8a6030;
                  margin-left:4px;cursor:pointer;transition:background .15s"
           title="Switch to ${otherName}"
           onmouseover="this.style.background='rgba(245,197,24,.14)'"
           onmouseout="this.style.background='#fdf8ee'">= ${otherName} ⇄</span>`
      : '';

    const tabs = ['natural','harmonic','melodic'].map(function(t){ return `
      <button onclick="selectMinorType('${t}')"
        style="flex:1;padding:8px 4px;border:none;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.02em;transition:background .15s,color .15s;
               background:${keMinorType===t ? '#F5C518' : 'transparent'};
               color:${keMinorType===t ? '#1a1410' : '#8a7868'}">
        ${t.charAt(0).toUpperCase()+t.slice(1)}
      </button>`; }).join('');

    const descMap = {
      natural:  'The unaltered scale — every note comes straight from the key signature.',
      harmonic: 'The ♮7 is raised by a semitone, creating a leading tone that pulls strongly back to the tonic. This gives you the <strong style="color:#5a3a00">major V chord</strong> and the <strong style="color:#5a3a00">vii°</strong> — both used regularly even in pieces written in natural minor.',
      melodic:  'The ♮6 and ♮7 are raised when ascending to avoid the awkward augmented 2nd between ♭6 and ♮7 in the harmonic minor. Descending, it reverts to natural minor. <strong style="color:#5a3a00">This is a melodic device, not a source of chords</strong> — the scale shape helps with smooth voice leading and singable lines.',
    };

    const chordsSection = keMinorType !== 'melodic' ? `
      <div class="ke-label">Diatonic chords</div>
      <div class="chords-grid">${keChordsHTML(notes, sd.romans, sd.qualities, sd.abbrs, sd.classes)}</div>
      ${KE_CHORD_LEGEND}
    ` : '';

    const inPracticeBox = keMinorType === 'natural' ? `
      <div style="background:#fdf8ee;border:1px solid #e8d8b0;border-radius:12px;padding:14px 16px;margin-bottom:22px">
        <div style="font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:#8a6030;margin-bottom:8px">In practice</div>
        <div style="font-size:.8rem;color:#5a4838;line-height:1.65">
          Minor key pieces primarily use these natural minor chords — but almost always replace the <strong style="color:#1a1410">v (minor dominant)</strong> with
          <strong style="color:#5a3a00">${vRoot} major (V)</strong>, borrowed from the harmonic minor.
          The raised leading tone creates a much stronger resolution back to the tonic.
          The <strong style="color:#1a1410">vii°</strong> from harmonic minor also appears regularly.
          Tap <strong style="color:#5a3a00">Harmonic</strong> above to see where these come from.
        </div>
      </div>` : '';

    el.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;flex-wrap:wrap">
        <div class="key-title">${dispName}</div>${eharmBadge}
      </div>
      <div style="font-size:.78rem;color:var(--text-muted);margin-bottom:16px">
        Relative major: <strong style="color:#5a3a00">${dispRelMajor} Major</strong>
        <span style="color:#b8a898;margin-left:6px">· tap outer ring to explore</span>
      </div>

      ${buildRelatedKeysHTML('minor', keSelection.idx)}

      <div style="display:flex;gap:3px;background:#f0ebe2;border:1px solid #e0d5c8;border-radius:12px;padding:3px;margin-bottom:16px">
        ${tabs}
      </div>
      <div style="font-size:.78rem;color:#6a5848;line-height:1.6;margin-bottom:18px">${descMap[keMinorType]}</div>

      ${inPracticeBox}

      <div class="ke-label">Scale notes <span style="font-weight:400;text-transform:none;letter-spacing:0;font-size:.65rem;color:#b8a898">— tap a note to highlight on keyboard</span></div>
      <div class="scale-notes-row">${keScaleHTML(notes)}</div>

      ${keFingeringToggleHTML()}
      <div id="ke-piano" style="margin-bottom:6px;overflow-x:auto;-webkit-overflow-scrolling:touch">${buildPianoSVG(keCurrentScaleSemis, false, keCurrentFingerMap)}</div>
      <div id="ke-piano-hint" style="font-size:.65rem;color:#b8a898;text-align:center;margin-bottom:20px">Tap a scale note or chord below &nbsp;·&nbsp; scale octaves <span style="color:#f472b6">■</span><span style="color:#f59e0b">■</span><span style="color:#60a5fa">■</span><span style="color:#34d399">■</span> &nbsp;·&nbsp; chord triads <span style="color:#f59e0b">■</span><span style="color:#60a5fa">■</span><span style="color:#34d399">■</span><span style="color:#f472b6">■</span></div>

      ${chordsSection}

      <div class="ke-label">Key signature</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;padding-bottom:36px">${keSigHTML(dispSig, dispFlats)}</div>
    `;
  }
}

function initKeyExplorer() {
  if (!document.getElementById('cof-svg')) return;
  buildCOF();
  renderKeyInfo();
  keyExplorerInit = true;
}

// ── Auth & boot ───────────────────────────────────────────────────────────────
(async function() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/"; return; }

  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails")
    .select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];

  try {
    initSharedHeader({
      db, myEmail, myName,
      isAdmin: isOwner(),
      activePage: "resources",
      avatarUrl: (ae && ae.avatar_url) || null
    });
  } catch(e) { console.error("initSharedHeader error:", e); }

  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("app-main").style.display = "block";
  document.getElementById("app-header").style.display = "";

  // Handle ?section= query param to deep-link to a section
  const sp = new URLSearchParams(window.location.search);
  const section = sp.get("section") || "";
  if (section === "ppd" || section === "glossary" || section === "key") {
    switchSection(section);
  } else {
    switchSection("library");
  }
})();

// ── SPA subnav interception for resources.html ───────────────────────────────
// Intercept clicks on shared-header nav/pill links that point to this page
// so section-switches happen instantly without a full page reload.
document.addEventListener('click', function(e) {
  const link = e.target.closest('.sh-mob-pill, .sh-tab-drop a, .sh-item, .sh-tab');
  if (!link) return;
  const href = link.getAttribute('href') || '';
  let path;
  try { path = new URL(href, location.origin).pathname; } catch(e2) { return; }
  if (path.replace(/\.html$/, '') !== '/resources') return;
  e.preventDefault();
  const sec = new URL(href, location.origin).searchParams.get('section') || '';
  const canonical = sec ? '/resources.html?section=' + sec : '/resources.html';
  history.pushState(null, '', canonical);
  switchSection(sec || 'library');
  if (window._shUpdateNav) window._shUpdateNav('resources');
});

</script>
