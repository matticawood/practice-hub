<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Resources — The Practice Room</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ── PPD (Piano Practice Daily) — finalized redesign ── */
    #panel-theory { padding: 0; }
    /* Scope COOL tokens to the PPD container only (page is warm theory-mode). */
    #ppd-index{
      --surface-2:#f1f1f4; --border:#e3e1e6; --hover:#e9e9ed;
      --text:#1a1410; --text-muted:#8a7868;
      background:var(--bg,#faf7f3);
      /* horizontal gutter comes from the shared `main` rule (matches the dashboard);
         only own vertical spacing here so PPD isn't double-inset */
      padding:0 0 40px; min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:var(--text);
    }
    #ppd-index *{box-sizing:border-box}

    /* ── Hero ── */
    #ppd-index .ppd-hero{position:relative}
    #ppd-index .ppd-hbtop{display:flex;align-items:center;gap:14px;margin-bottom:4px}
    #ppd-index .ppd-hbtitle{flex:1;min-width:0}
    #ppd-index .ppd-hero-icon{width:46px;height:46px;border-radius:13px;flex-shrink:0;background:linear-gradient(150deg,#f7d24a,#f5c518);color:#3a2c00;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 16px -7px rgba(245,197,24,.75)}
    #ppd-index .ppd-hero-icon svg{width:24px;height:24px}
    #ppd-index .ppd-eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#b8920a}
    #ppd-index .ppd-hero-title{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin:1px 0 0;line-height:1.1}
    #ppd-index .ppd-hero-sub{font-size:.92rem;color:var(--text-muted);margin:9px 0 0;max-width:540px;line-height:1.5}
    #ppd-index .ppd-hero-search-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
    #ppd-index .ppd-search{position:relative;flex:1;min-width:220px}
    #ppd-index .ppd-search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);width:18px;height:18px}
    #ppd-index .ppd-search input{width:100%;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px 12px 42px;font-size:.95rem;font-family:inherit;color:var(--text);transition:border-color .15s,box-shadow .15s}
    #ppd-index .ppd-search input::placeholder{color:var(--text-muted)}
    #ppd-index .ppd-search input:hover{border-color:#d6c5a8}
    #ppd-index .ppd-search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,197,24,.18)}
    #ppd-index .ppd-surprise{flex-shrink:0;display:inline-flex;align-items:center;gap:7px;background:linear-gradient(180deg,#f7d24a,#f5c518);color:#3a2c00;border:none;border-radius:12px;padding:0 18px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 7px 16px -7px rgba(245,197,24,.7);transition:transform .12s,box-shadow .15s}
    #ppd-index .ppd-surprise:hover{box-shadow:0 9px 20px -7px rgba(245,197,24,.8)}
    #ppd-index .ppd-surprise:active{transform:scale(.97)}
    #ppd-index .ppd-surprise svg{width:16px;height:16px}
    #ppd-index .ppd-hero-progress{display:flex;align-items:center;gap:12px;margin-top:16px}
    #ppd-index .ppd-progress-track{flex:1;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 1px 1px rgba(60,40,20,.05)}
    #ppd-index .ppd-progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#f7d24a,#f5c518)}
    #ppd-index .ppd-progress-label{font-size:.8rem;color:var(--text-muted);font-weight:600;white-space:nowrap}
    #ppd-index .ppd-progress-label strong{color:var(--text)}

    /* ── Category chips ── */
    #ppd-index .ppd-chips-row{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 1px 2px rgba(60,40,20,.05);padding:12px 14px;margin:0 0 18px}
    #ppd-index .ppd-hero-chips{margin-top:16px;padding-top:15px;border-top:1px solid var(--border)}
    #ppd-index .ppd-chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 30px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 30px),transparent)}
    #ppd-index .ppd-chips::-webkit-scrollbar{display:none}
    #ppd-index .ppd-chips.at-end{-webkit-mask-image:none;mask-image:none}
    /* match the community feed filter bar: transparent pills, subtle gold-tint when active */
    #ppd-index .ppd-chip{flex-shrink:0;scroll-snap-align:start;display:inline-flex;align-items:center;gap:7px;background:transparent;border:none;border-radius:999px;padding:7px 13px;font-size:.8rem;font-weight:600;color:var(--text-muted);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;font-family:inherit}
    #ppd-index .ppd-chip:active{transform:scale(.96)}
    #ppd-index .ppd-chip:hover:not(.active){color:var(--text)}
    #ppd-index .ppd-chip.active{background:rgba(245,197,24,.16);color:#8a5a00;font-weight:700}
    #ppd-index .ppd-chip-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
    #ppd-index .ppd-chip-count{font-size:.73rem;font-weight:700;color:var(--text-muted)}
    #ppd-index .ppd-chip.active .ppd-chip-count{color:#8a5a00}

    /* ── Unified section headers ── */
    #ppd-index .ppd-hd{display:flex;align-items:center;gap:10px;margin:28px 0 14px}
    #ppd-index .ppd-hd-mark{width:24px;height:24px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    #ppd-index .ppd-hd-mark svg{width:14px;height:14px}
    #ppd-index .ppd-hd-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
    #ppd-index .ppd-hd-title{font-size:1.04rem;font-weight:800;letter-spacing:-.01em;color:var(--text)}
    #ppd-index .ppd-hd-count{font-size:.76rem;font-weight:700;color:var(--text-muted);background:var(--surface-2);border-radius:99px;padding:2px 9px}
    #ppd-index .ppd-hd-line{flex:1;height:1px;background:var(--border)}
    #ppd-index .ppd-hd-meta{font-size:.76rem;color:var(--text-muted);font-weight:600;white-space:nowrap}

    /* ── Continue reading shelf ── */
    #ppd-index .ppd-resume{margin-top:0}
    #ppd-index .ppd-resume-inhero{margin-top:15px;padding-top:15px;border-top:1px solid var(--border)}
    #ppd-index .ppd-resume-inhero .ppd-hd{margin:0 0 11px}
    #ppd-index .ppd-resume-inhero .ppd-hd-line{display:none}
    /* embedded shelf, not a floating card-on-card (desktop keeps the fixed card width) */
    #ppd-index .ppd-resume-inhero .ppd-resume-card{background:var(--surface-2);border-color:transparent;box-shadow:none}
    /* quieter category section headers: drop the trailing line + per-category progress */
    #ppd-index .ppd-section .ppd-hd-line,#ppd-index .ppd-section .ppd-hd-meta{display:none}
    #ppd-index .ppd-resume-row{display:flex;gap:11px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-bottom:2px}
    #ppd-index .ppd-resume-card{scroll-snap-align:start}
    #ppd-index .ppd-resume-row::-webkit-scrollbar{display:none}
    #ppd-index .ppd-resume-card{flex:0 0 auto;scroll-snap-align:start;width:262px;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px;cursor:pointer;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(60,40,20,.05);transition:box-shadow .18s,transform .18s,border-color .18s}
    #ppd-index .ppd-resume-card:hover{box-shadow:0 10px 22px -10px rgba(60,40,20,.25);transform:translateY(-2px);border-color:#d6c5a8}
    #ppd-index .ppd-resume-spine{position:relative;overflow:hidden;width:40px;height:54px;border-radius:4px;flex-shrink:0;background-color:var(--rc,#888);background-image:linear-gradient(150deg,rgba(255,255,255,.2),rgba(0,0,0,.22));display:flex;align-items:center;justify-content:center;box-shadow:1px 1px 4px rgba(0,0,0,.18)}
    #ppd-index .ppd-resume-spine::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25)}
    #ppd-index .ppd-resume-spine span{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:22px;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.25)}
    #ppd-index .ppd-resume-info{min-width:0;flex:1}
    #ppd-index .ppd-resume-cat{font-size:.64rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rc,#888);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #ppd-index .ppd-resume-title{font-size:.9rem;font-weight:700;margin:3px 0 0;line-height:1.28;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    #ppd-index .ppd-resume-meta{font-size:.7rem;color:var(--text-muted);font-weight:600;margin-top:4px;display:inline-flex;align-items:center;gap:4px}
    #ppd-index .ppd-resume-meta svg{width:11px;height:11px}

    /* ── Section + cards ── */
    #ppd-index .ppd-section{margin-top:0}
    #ppd-index .ppd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
    /* compact book-row card: small spine + text, one card language with the resume shelf */
    #ppd-index .ppd-card{position:relative;display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:0 1px 2px rgba(60,40,20,.05);transition:box-shadow .2s,transform .2s,border-color .2s;text-decoration:none;padding:14px 15px}
    #ppd-index .ppd-card:hover{box-shadow:0 12px 26px -14px rgba(60,40,20,.3);transform:translateY(-2px);border-color:#d6c5a8}
    #ppd-index .ppd-card-spine{position:relative;overflow:hidden;width:46px;height:64px;border-radius:5px;flex-shrink:0;background-color:var(--cc,#c8a84b);background-image:linear-gradient(150deg,rgba(255,255,255,.2),rgba(0,0,0,.22));display:flex;align-items:center;justify-content:center;box-shadow:1px 1px 4px rgba(0,0,0,.18)}
    #ppd-index .ppd-card-spine::after{content:"";position:absolute;left:5px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.25)}
    #ppd-index .ppd-card-mono{font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:24px;line-height:1;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.25)}
    #ppd-index .ppd-card-main{min-width:0;flex:1}
    #ppd-index .ppd-card-cat{display:block;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--cc,#8a7868);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #ppd-index .ppd-card-new{position:absolute;z-index:1;top:13px;right:13px;font-size:.58rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#3a2c00;background:linear-gradient(180deg,#f7d24a,#f5c518);border-radius:99px;padding:2px 7px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
    #ppd-index .ppd-card-readmark{position:absolute;z-index:1;top:12px;right:12px;width:20px;height:20px;border-radius:50%;background:#eef6ee;color:#3f7a52;display:flex;align-items:center;justify-content:center}
    #ppd-index .ppd-card-readmark svg{width:12px;height:12px}
    #ppd-index .ppd-card-title{display:block;font-size:1.0rem;font-weight:750;line-height:1.22;color:var(--text);letter-spacing:-.01em;margin:3px 0 0}
    #ppd-index .ppd-card:hover .ppd-card-title{color:#7a5e00}
    #ppd-index .ppd-card-intro{font-size:.84rem;color:var(--text-muted);line-height:1.45;margin:5px 0 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    #ppd-index .ppd-card-foot{display:flex;align-items:center;gap:10px;margin-top:9px}
    #ppd-index .ppd-meta{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;color:var(--text-muted);font-weight:600}
    #ppd-index .ppd-meta svg{width:13px;height:13px}
    #ppd-index .ppd-meta-note{color:#9a7ab4}
    #ppd-index .ppd-pill{margin-left:auto;font-size:.73rem;font-weight:700;border:1.5px solid;border-radius:99px;padding:3px 12px;cursor:pointer;background:none;font-family:inherit;white-space:nowrap;transition:all .15s}
    #ppd-index .ppd-pill-none{border-color:var(--border);color:var(--text-muted)}
    #ppd-index .ppd-pill-none:hover{border-color:var(--accent);color:#6b5400;background:rgba(245,197,24,.1)}
    #ppd-index .ppd-pill-reading{border-color:#5a8a6a;color:#3f7a52;background:rgba(90,138,106,.1)}
    #ppd-index .ppd-pill-read{border-color:#c8b8a8;color:#6b5c4e;background:rgba(200,184,168,.14)}

    /* ── Unified header card (tabs + view header) ── */
    #ppd-index .ppd-headcard{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:0 1px 2px rgba(60,40,20,.05);overflow:hidden;margin-bottom:22px}
    #ppd-index .ppd-tabrow-outer{display:flex;align-items:center;border-bottom:1px solid var(--border);background:#fcfbf9}
    #ppd-index .ppd-tabrow{position:relative;flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:22px;padding:0 0 0 18px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(to right,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(to right,#000 calc(100% - 18px),transparent)}
    #ppd-index .ppd-tabrow::-webkit-scrollbar{display:none}
    #ppd-index .ppd-tab-underline{position:absolute;bottom:-1px;left:0;height:2px;width:0;background:var(--accent);border-radius:2px 2px 0 0;pointer-events:none;transition:transform .28s cubic-bezier(.45,.05,.2,1),width .28s cubic-bezier(.45,.05,.2,1)}
    #ppd-index .ppd-tabrow-spacer{flex:1 1 0;min-width:6px}
    #ppd-index .ppd-headbody{padding:20px 24px 18px}
    #ppd-index .ppd-tab{flex-shrink:0;position:relative;display:inline-flex;align-items:center;gap:7px;background:none;border:none;padding:13px 0 12px;font-size:.85rem;font-weight:700;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:color .15s;white-space:nowrap}
    #ppd-index .ppd-tab:hover{color:var(--text)}
    #ppd-index .ppd-tab.active{color:var(--text)}
    #ppd-index .ppd-tab svg{width:15px;height:15px}
    #ppd-index .ppd-tab-badge{font-size:.64rem;font-weight:800;background:var(--accent);color:#3a2c00;border-radius:99px;padding:1px 6px}
    #ppd-index .ppd-suggest{flex-shrink:0;margin:0 12px 0 8px;display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);border-radius:99px;padding:7px 13px;font-size:.83rem;font-weight:700;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s,background .15s;white-space:nowrap}
    #ppd-index .ppd-suggest:hover{color:var(--text);border-color:#d6c5a8}
    #ppd-index .ppd-suggest:active{transform:scale(.96)}
    #ppd-index .ppd-suggest svg{width:15px;height:15px}
    #ppd-index .ppd-newsheet{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px dashed #c8b8a8;border-radius:99px;padding:7px 13px;font-size:.81rem;font-weight:650;color:#6b5c4e;cursor:pointer;font-family:inherit;transition:all .15s;text-decoration:none;white-space:nowrap}
    #ppd-index .ppd-newsheet:hover{border-color:var(--accent);color:#1a1410}

    /* ── Sub-views (My List / Notebook) ── */
    #ppd-index .ppd-vhead{display:flex;align-items:center;gap:13px;margin:0}
    #ppd-index .ppd-vhead-icon{width:44px;height:44px;border-radius:13px;flex-shrink:0;background:linear-gradient(150deg,#f7d24a,#f5c518);color:#3a2c00;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 16px -7px rgba(245,197,24,.7)}
    #ppd-index .ppd-vhead-icon svg{width:23px;height:23px}
    #ppd-index .ppd-vhead-title{font-size:1.32rem;font-weight:800;letter-spacing:-.015em;line-height:1.1}
    #ppd-index .ppd-vhead-sub{font-size:.84rem;color:var(--text-muted);margin-top:3px}
    #ppd-index .ppd-seg{display:inline-flex;gap:4px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:4px;margin:16px 0 0}
    #ppd-index .ppd-seg button{display:inline-flex;align-items:center;gap:6px;background:none;border:none;border-radius:9px;padding:7px 16px;font-size:.84rem;font-weight:650;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all .15s}
    #ppd-index .ppd-seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(26,20,16,.12)}
    #ppd-index .ppd-seg .n{font-size:.72rem;font-weight:700;background:var(--surface);border-radius:99px;padding:0 6px;color:var(--text-muted)}
    #ppd-index .ppd-seg button.active .n{background:var(--surface-2)}
    #ppd-index .ppd-empty{text-align:center;color:var(--text-muted);padding:54px 20px;font-size:.92rem;line-height:1.6}
    #ppd-index .ppd-empty svg{width:40px;height:40px;color:var(--border);margin-bottom:10px}
    #ppd-index .ppd-viewing-bar{display:none;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:16px 0 0;font-size:.82rem;color:var(--text-muted)}
    #ppd-index .ppd-viewing-select{font-family:inherit;font-size:.82rem;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);padding:4px 8px;cursor:pointer}

    /* ── Notebook cards ── */
    #ppd-index .ppd-notes{display:flex;flex-direction:column;gap:12px}
    #ppd-index .ppd-note{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;border-left:4px solid var(--nc,#c8a84b);padding:14px 16px;box-shadow:0 1px 2px rgba(60,40,20,.05)}
    #ppd-index .ppd-note-cat{font-size:.64rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--nc,#c8a84b)}
    #ppd-index .ppd-note-title{font-size:1rem;font-weight:750;color:var(--text);text-decoration:none;display:inline-block;margin:3px 0 6px}
    #ppd-index .ppd-note-title:hover{color:#7a5e00}
    #ppd-index .ppd-note-body{position:relative;font-size:.87rem;color:#3a2e24;line-height:1.62;background:linear-gradient(180deg,#fdfbf6,#fbf7ee);border:1px solid #ece2d0;border-radius:10px;padding:12px 14px 13px 34px;box-shadow:inset 0 1px 2px rgba(120,90,40,.04);white-space:pre-wrap}
    #ppd-index .ppd-note-body::before{content:"\201C";position:absolute;left:11px;top:6px;font-family:Georgia,'Times New Roman',serif;font-size:30px;line-height:1;color:#d9b65a}
    #ppd-index .ppd-note-actions{display:flex;align-items:center;gap:10px;margin-top:10px}
    #ppd-index .ppd-req-btn{font-family:inherit;font-size:.76rem;font-weight:650;background:none;border:1px solid var(--border);border-radius:99px;color:var(--text-muted);cursor:pointer;padding:4px 12px;transition:all .15s}
    #ppd-index .ppd-req-btn:hover{border-color:var(--accent);color:#1a1410}
    #ppd-index .ppd-note.done{opacity:.5}

    /* ── Card admin toolbar ── */
    #ppd-index .ppd-admin{position:absolute;z-index:3;bottom:11px;right:11px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
    #ppd-index .ppd-card:hover .ppd-admin{opacity:1}
    #ppd-index .ppd-admin button,#ppd-index .ppd-admin a{width:25px;height:25px;border-radius:7px;border:none;background:rgba(255,255,255,.9);color:#6b5c4e;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.18);text-decoration:none}
    #ppd-index .ppd-admin button:hover,#ppd-index .ppd-admin a:hover{background:#fff;color:#1a1410}
    #ppd-index .ppd-admin button.del:hover{color:#c0392b}
    #ppd-index .ppd-admin svg{width:13px;height:13px}
    #ppd-index .ppd-rename{margin-left:8px;font-size:.66rem;font-weight:600;padding:2px 8px;background:none;border:1px dashed #c8b8a8;border-radius:99px;color:#a09585;cursor:pointer;font-family:inherit}
    #ppd-index .ppd-rename:hover{border-color:var(--accent);color:#6b5c4e}

    /* ── Floating category popup ── */
    #ppd-cat-popup{display:none;position:fixed;z-index:999;background:#fff;border:1px solid #e3e1e6;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.14);padding:4px;min-width:160px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    #ppd-cat-popup button{display:block;width:100%;text-align:left;background:none;border:none;padding:6px 10px;font-size:.82rem;color:#1a1410;cursor:pointer;border-radius:5px}
    #ppd-cat-popup button:hover{background:#f5f0e8}
    #ppd-cat-popup button.current{font-weight:700;color:#b8920a}
    #ppd-cat-popup hr{border:none;border-top:1px solid #e3e1e6;margin:3px 0}

    /* ── Suggest modal ── */
    #ppd-suggest-overlay{position:fixed;inset:0;background:rgba(26,20,16,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px;z-index:200}
    #ppd-suggest-overlay.open{display:flex}
    #ppd-suggest-overlay .ppd-modal{background:#fff;border:1px solid #e3e1e6;border-radius:18px;padding:24px 22px;width:100%;max-width:460px;box-shadow:0 24px 60px -16px rgba(26,20,16,.4);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    #ppd-suggest-overlay .ppd-modal h3{margin:0 0 6px;font-size:1.15rem;font-weight:800;color:#1a1410}
    #ppd-suggest-overlay .ppd-modal p{margin:0 0 14px;font-size:.88rem;color:#8a7868;line-height:1.5}
    #ppd-suggest-overlay .ppd-modal textarea{width:100%;box-sizing:border-box;background:#fff;border:1.5px solid #e3e1e6;border-radius:10px;padding:11px 13px;font-size:.92rem;font-family:inherit;color:#1a1410;resize:none;min-height:96px}
    #ppd-suggest-overlay .ppd-modal textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(245,197,24,.18)}
    #ppd-suggest-overlay .ppd-modal-error{font-size:.78rem;color:#c0392b;margin:8px 0 0;display:none}
    #ppd-suggest-overlay .ppd-modal-btns{display:flex;gap:10px;margin-top:16px}
    #ppd-suggest-overlay .ppd-modal-btns button{flex:1;padding:11px;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;font-family:inherit;border:none}
    #ppd-suggest-overlay .ppd-btn-cancel{background:#fff;border:1.5px solid #e3e1e6 !important;color:#8a7868}
    #ppd-suggest-overlay .ppd-btn-submit{background:linear-gradient(180deg,#f7d24a,#f5c518);color:#3a2c00;flex:1.6 !important;box-shadow:0 7px 16px -7px rgba(245,197,24,.7)}

    /* ── Motion ── */
    @keyframes ppdFadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @keyframes ppdFade{from{opacity:0}to{opacity:1}}
    #ppd-index .ppd-headbody.anim{animation:ppdFade .24s ease}
    #ppd-index .ppd-grid-anim .ppd-card{animation:ppdFadeUp .36s cubic-bezier(.22,.61,.36,1) both}
    #ppd-index .ppd-grid-anim .ppd-card:nth-child(2){animation-delay:.04s}
    #ppd-index .ppd-grid-anim .ppd-card:nth-child(3){animation-delay:.08s}
    #ppd-index .ppd-grid-anim .ppd-card:nth-child(4){animation-delay:.12s}
    #ppd-index .ppd-grid-anim .ppd-card:nth-child(n+5){animation-delay:.16s}
    #ppd-index .ppd-progress-fill{transition:width .9s cubic-bezier(.22,.61,.36,1)}
    @media (prefers-reduced-motion: reduce){
      #ppd-index .ppd-headbody.anim,#ppd-index .ppd-grid-anim .ppd-card{animation:none}
      #ppd-index .ppd-progress-fill,#ppd-index .ppd-tab-underline,#ppd-index .ppd-card,#ppd-index .ppd-resume-card{transition:none}
    }
    #ppd-index .ppd-loading,#ppd-index .ppd-no-results{font-size:.9rem;color:var(--text-muted);padding:16px 0}
    @media (max-width:560px){
      #ppd-index{padding:0 0 36px}
      #ppd-index .ppd-grid{grid-template-columns:1fr;gap:12px}
      #ppd-index .ppd-headbody{padding:18px 16px 15px}
      #ppd-index .ppd-resume-card{width:84vw;max-width:300px}
      /* in-hero shelf: single fills the width; multiple peek so swipe is obvious */
      #ppd-index .ppd-resume-inhero .ppd-resume-card{width:100%;max-width:none}
      #ppd-index .ppd-resume-inhero .ppd-resume-row.ppd-multi .ppd-resume-card{width:86%;max-width:none}
      #ppd-index .ppd-hbtop{flex-wrap:wrap;gap:11px}
      #ppd-index .ppd-newsheet{margin:10px 0 0 56px}
      /* tighter hero */
      /* compact hero on mobile: keep icon + eyebrow, drop only the long description */
      #ppd-index .ppd-hero-icon{width:40px;height:40px;border-radius:11px}
      #ppd-index .ppd-hero-icon svg{width:21px;height:21px}
      #ppd-index .ppd-hero-title{font-size:1.4rem}
      #ppd-index .ppd-hero-sub{display:none}
      #ppd-index .ppd-hero-search-row{margin-top:13px;gap:8px;flex-wrap:nowrap}
      #ppd-index .ppd-search{min-width:0;flex:1}
      #ppd-index .ppd-surprise{flex:0 0 auto;width:48px;padding:0;justify-content:center;min-height:48px}
      #ppd-index .ppd-surprise-txt{display:none}
      #ppd-index .ppd-hero-progress{margin-top:13px}
      #ppd-index .ppd-hero-chips{margin-top:13px;padding-top:12px}
      /* compact tabs so all nav labels fit beside the pinned Suggest */
      #ppd-index .ppd-tabrow{gap:16px;padding-left:14px}
      #ppd-index .ppd-tab{gap:5px;padding:12px 0 11px;font-size:.82rem}
      #ppd-index .ppd-tab svg{display:none}
      #ppd-index .ppd-suggest{margin:0 10px 0 6px;padding:7px 12px;font-size:.8rem}
    }

    /* ── In-grid loading state ── */
    .page-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 0;
      width: 100%;
    }

    /* ── Theory mode (warm light) ── */
    body.theory-mode {
      --bg: #faf7f3; --surface: #ffffff; --surface-2: #f0ebe2;
      --border: #e0d5c8; --text: #1a1410; --text-main: #1a1410;
      --text-muted: #8a7868; --accent-subtle: #fdf0d8;
      background: #faf7f3 !important; transition: background 0.2s;
    }
    body.theory-mode #app-header { background: #1a1410 !important; border-bottom-color: var(--accent) !important; }
    body.theory-mode #app-header h1 { color: #f5f0e8 !important; }
    body.theory-mode #app-header p  { color: #a09080 !important; }
    body.theory-mode #app-header .btn-ghost,
    body.theory-mode #app-header #header-email { color: #c8b8a8 !important; border-color: #4a3828 !important; }
    body.theory-mode .theory-section-btn.active { color: #1a1410; }
    body.theory-mode .glossary-letter  { color: #8a7868; background: #f0ebe2; border-bottom-color: #e0d5c8; }
    body.theory-mode .glossary-term    { border-bottom-color: #ede5d8; }
    body.theory-mode .glossary-term:hover { border-left-color: var(--accent); }
    body.theory-mode .glossary-term-name   { color: #1a1410; }
    body.theory-mode .glossary-term-origin { color: #a09080; }
    body.theory-mode .glossary-term-cat    { color: #8a6530; background: rgba(200,160,80,.08); border-color: rgba(200,160,80,.22); }
    body.theory-mode .glossary-term-def    { color: #5a4838; border-left-color: #e0d5c8; }
    body.theory-mode #theory-section-key { padding: 0; }
    /* ── Piece cards — override hardcoded dark values from style.css ── */
    body.theory-mode .card-title         { color: #1a1410; }
    body.theory-mode .card-meta          { color: #8a7868; }
    body.theory-mode .piece-card:hover   { border-color: #c8b8a8; }
    body.theory-mode .expand-chevron     { color: #8a7868; }
    body.theory-mode .section-label      { color: #8a7868; }
    body.theory-mode .section-text       { color: #3a2e28; }
    body.theory-mode .tag                { background: #f0ebe2; color: #5a4838; border-color: #d8cdc0; }
    /* ── Library layout — max-width + card spacing ── */
    #panel-library { max-width: 860px; margin: 0 auto; }
    body.theory-mode .pieces-grid { gap: 10px; }
    /* Darker inputs to match the card aesthetic */
    #panel-library .search-wrap,
    #panel-library .search-wrap input,
    #panel-library select {
      background: #2a211a !important;
      border-color: #3e3028 !important;
      color: #f5f0e8 !important;
      border-radius: 10px !important;
    }
    #panel-library .search-wrap input::placeholder { color: #a09585 !important; }
    #panel-library .search-icon { color: #7a6a5a !important; }
    /* Difficulty label — keep uppercase label style */
    body.theory-mode .lib-diff-badge .diff-label {
      font-size: 0.68rem;
      letter-spacing: 0.07em;
    }

    /* ── Library card — left accent + shadow ── */
    .lib-card {
      border-left: 3px solid var(--diff-color, #e0d5c8);
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
      transition: box-shadow .15s, transform .15s;
    }
    .lib-card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,.10);
      transform: translateY(-1px);
    }
    /* ── Grid layout for library ── */
    body.theory-mode .pieces-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    @media (max-width: 680px) {
      body.theory-mode .pieces-grid { grid-template-columns: 1fr; }
    }
    /* ── Fully dark card ── */
    .lib-card-header {
      background: transparent;
      border-top: 3px solid var(--diff-color, #f5c518);
      border-radius: 8px 8px 0 0;
      padding: 14px 16px 10px;
      flex-shrink: 0;
    }
    .lib-card-header .card-title,
    body.theory-mode .lib-card-header .card-title {
      color: #f5f0e8;
      font-size: 0.96rem;
      font-weight: 700;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .lib-card-header .card-meta,
    body.theory-mode .lib-card-header .card-meta { color: #a09585; font-size: 0.78rem; }
    .lib-card-content {
      padding: 0 16px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lib-card-blurb {
      font-size: 0.76rem;
      color: #b0a090;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .lib-card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    /* Outline tags on dark background */
    .lib-card-tags .tag,
    body.theory-mode .lib-card-tags .tag {
      background: transparent !important;
      border: 1px solid rgba(255,255,255,.15) !important;
      color: #7a6a5a !important;
      font-size: 0.68rem;
    }
    .lib-card-tags .tag:hover,
    body.theory-mode .lib-card-tags .tag:hover {
      border-color: rgba(255,255,255,.35) !important;
      color: #c8b8a8 !important;
    }
    /* Fully dark card */
    .lib-card,
    body.theory-mode .lib-card {
      background: #1a1410 !important;
      border-color: #2e261e !important;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      border-left: none !important;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      transition: box-shadow .15s, transform .15s;
    }
    .lib-card:hover,
    body.theory-mode .lib-card:hover {
      box-shadow: 0 6px 24px rgba(0,0,0,.28);
      transform: translateY(-2px);
      border-color: #3e342a !important;
    }
    /* ── Piece detail modal ── */
    .piece-modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 2000;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
      padding: 16px;
    }
    .piece-modal-overlay.open { opacity: 1; pointer-events: all; }
    .piece-modal {
      background: #faf7f3;
      border-radius: 20px;
      width: min(640px, 100%);
      max-height: 88vh;
      overflow-y: auto;
      display: flex; flex-direction: column;
      transform: translateY(20px) scale(.97);
      transition: transform .25s cubic-bezier(.34,1.3,.64,1);
      box-shadow: 0 32px 80px rgba(0,0,0,.35);
    }
    .piece-modal-overlay.open .piece-modal {
      transform: translateY(0) scale(1);
    }
    .pm-header {
      background: #1a1410;
      border-top: 3px solid var(--diff-color, #f5c518);
      padding: 22px 24px 20px;
      position: relative;
      flex-shrink: 0;
    }
    .pm-close {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255,255,255,.08); border: none;
      font-size: 1.1rem; color: rgba(255,255,255,.5);
      cursor: pointer; line-height: 1;
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      transition: color .12s, background .12s;
    }
    .pm-close:hover { color: #fff; background: rgba(255,255,255,.15); }
    .pm-title {
      font-size: 1.3rem; font-weight: 800;
      color: #f5f0e8; margin: 10px 0 5px; line-height: 1.3;
      padding-right: 36px;
    }
    .pm-meta { font-size: 0.83rem; color: #a09080; }
    .pm-body {
      padding: 22px 24px 30px;
      overflow-y: auto;
    }
    .pm-collection {
      margin-top: 22px; padding-top: 18px;
      border-top: 1px solid #e8e0d5;
    }
    .pm-collection-label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: #b0a090; margin-bottom: 10px;
    }
    .pm-collection-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    /* Reset diff colours inside dark header to bright originals */
    .pm-header.diff-0 { --diff-color: #67e8f9; }
    .pm-header.diff-1 { --diff-color: #4ade80; }
    .pm-header.diff-2 { --diff-color: #a3e635; }
    .pm-header.diff-3 { --diff-color: #facc15; }
    .pm-header.diff-4 { --diff-color: #fb923c; }
    .pm-header.diff-5 { --diff-color: #f87171; }
    /* Badge inside dark modal header */
    .pm-header .lib-diff-badge {
      background: rgba(255,255,255,.08) !important;
      border-color: var(--diff-color, #f5c518) !important;
    }
    .pm-header .lib-diff-badge .diff-label { color: var(--diff-color, #f5c518) !important; }
    .pm-header .lib-diff-badge .star.on    { color: var(--diff-color, #f5c518) !important; }
    .pm-header .lib-diff-badge .star.off   { color: rgba(255,255,255,.2) !important; }
    /* Badge with label */
    .lib-diff-badge {
      padding: 3px 10px;
      border-radius: 20px;
      margin-top: 0;
    }
    .lib-diff-badge .diff-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--diff-color);
      white-space: nowrap;
    }
    .lib-diff-badge .stars { gap: 1px; }
    .lib-diff-badge .star  { font-size: 0.65rem; }
    /* Stars pinned top-right of header */
    .lib-card-header-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .lib-card-header-top .card-title { flex: 1; }
    .lib-card-stars-corner {
      display: flex;
      gap: 1px;
      flex-shrink: 0;
      padding-top: 2px;
    }
    .lib-card-stars-corner .star { font-size: 0.6rem; opacity: 1 !important; }
    .lib-card-stars-corner .star.off { color: rgba(255,255,255,.25) !important; }

    /* ── Difficulty badge — light mode overrides ── */
    /* Replace dark pill backgrounds with light tints + coloured border */
    body.theory-mode .diff-0 { --diff-bg: #ecfeff; --diff-border: #67e8f9; --diff-color: #0e7490; }
    body.theory-mode .diff-1 { --diff-bg: #f0fdf4; --diff-border: #86efac; --diff-color: #15803d; }
    body.theory-mode .diff-2 { --diff-bg: #f7fee7; --diff-border: #bef264; --diff-color: #4d7c0f; }
    body.theory-mode .diff-3 { --diff-bg: #fefce8; --diff-border: #fde047; --diff-color: #a16207; }
    body.theory-mode .diff-4 { --diff-bg: #fff7ed; --diff-border: #fdba74; --diff-color: #c2410c; }
    body.theory-mode .diff-5 { --diff-bg: #fef2f2; --diff-border: #fca5a5; --diff-color: #b91c1c; }
    /* Collection footer bar */
    body.theory-mode .collection-footer       { background: #faf7f3; border-top: 1px solid #e8e0d5; }
    body.theory-mode .collection-footer-label { color: #b0a090; }
    /* Status buttons active states (were dark-bg neon) */
    body.theory-mode .status-btn.status-aspire.active    { background: #f3eeff; color: #6d28d9; border-color: #7c3aed; }
    body.theory-mode .status-btn.status-learning.active  { background: #e0f2fe; color: #0369a1; border-color: #0284c7; }
    body.theory-mode .status-btn.status-completed.active { background: #dcfce7; color: #15803d; border-color: #16a34a; }
    body.theory-mode .status-btn.status-aspire:hover     { background: #ede9fe; color: #5b21b6; }
    body.theory-mode .status-btn.status-learning:hover   { background: #bfdbfe; color: #1d4ed8; }
    body.theory-mode .status-btn.status-completed:hover  { background: #bbf7d0; color: #166534; }
    body.theory-mode .status-remove-btn                  { border-color: #fca5a5; }
    body.theory-mode .status-remove-btn:hover            { background: #fee2e2; }
    /* Status badges (were dark-bg neon) */
    body.theory-mode .status-badge.badge-aspire    { background: #f3eeff; color: #6d28d9; border-color: #7c3aed; }
    body.theory-mode .status-badge.badge-learning  { background: #e0f2fe; color: #0369a1; border-color: #0284c7; }
    body.theory-mode .status-badge.badge-completed { background: #dcfce7; color: #15803d; border-color: #16a34a; }
    /* Collection section headers (were pastel on dark) */
    body.theory-mode .status-aspire-header h2    { color: #6d28d9; }
    body.theory-mode .status-learning-header h2  { color: #0369a1; }
    body.theory-mode .status-completed-header h2 { color: #15803d; }
    /* ── Collection tab — dark styling to match library cards ── */
    #panel-lib-collection .col-search-wrap input,
    #panel-lib-collection #col-search-input {
      background: #2a211a !important;
      border-color: #3e3028 !important;
      color: #f5f0e8 !important;
      border-radius: 10px !important;
      padding: 10px 14px !important;
      font-size: 0.93rem !important;
    }
    #panel-lib-collection #col-search-input::placeholder { color: #a09585 !important; }
    #panel-lib-collection .form-group label { color: #7a6a5a !important; }
    .col-search-dropdown {
      background: #2a211a !important;
      border-color: #3e3028 !important;
    }
    .col-search-item { border-bottom-color: #3e3028 !important; }
    .col-search-item:hover { background: #342820 !important; }
    .col-search-item-title { color: #f5f0e8 !important; }
    .col-search-item-composer { color: #a09585 !important; }
    /* Collection piece cards — dark */
    .col-piece-card {
      background: #1a1410 !important;
      border-color: #2e261e !important;
    }
    .col-piece-card:hover { border-color: #3e342a !important; }
    .col-piece-title { color: #f5f0e8 !important; }
    .col-piece-composer { color: #a09585 !important; }
    /* Status chips on dark background */
    .col-status-chip {
      border-color: rgba(255,255,255,.2) !important;
      color: #a09585 !important;
    }
    .col-status-chip:hover { border-color: var(--accent) !important; color: var(--accent) !important; }
    .col-status-chip.active { background: var(--accent) !important; color: #000 !important; border-color: var(--accent) !important; }
    /* Section headers */
    .col-status-header { color: #a09585 !important; }
    .col-status-count { background: #2a211a !important; color: #a09585 !important; }
    /* Stars in collection */
    .col-diff-mini .star { color: rgba(255,255,255,.2) !important; opacity: 1 !important; }
    .col-diff-mini .star.on { color: var(--accent) !important; opacity: 1 !important; }
    /* Remove button */
    .col-remove-btn { border-color: rgba(248,113,113,.35) !important; color: #f87171 !important; }
    .col-remove-btn:hover { background: rgba(248,113,113,.12) !important; }
    /* Expand chevron */
    .col-expand-chevron { color: #7a6a5a !important; }
    /* Expand body */
    .col-card-body { border-top-color: #2e261e !important; }
    .col-card-body .card-section { border-bottom-color: #2e261e !important; }
    .col-card-body .section-label,
    body.theory-mode .col-card-body .section-label { color: #7a6a5a !important; }
    .col-card-body .section-label::after,
    body.theory-mode .col-card-body .section-label::after { background: #2e261e !important; }
    .col-card-body .section-text,
    body.theory-mode .col-card-body .section-text  { color: #c8b8a8 !important; }

    /* Danger button */
    body.theory-mode .btn-danger                 { border-color: #fca5a5; }
    body.theory-mode .btn-danger:hover           { background: #fee2e2; }
    /* Modals */
    body.theory-mode .modal h2                   { color: #1a1410; }
    body.theory-mode .login-title                { color: #1a1410; }
    body.theory-mode .login-error                { background: #fee2e2; border-color: #fca5a5; color: #b91c1c; }
    /* Viewing bar */
    body.theory-mode .viewing-bar                { background: #fdf5e0; border-color: #e8d8b0; color: #6b4f00; }
    body.theory-mode .viewing-bar select         { background: #fff; border-color: #c8b8a8; color: #1a1410; }
    body.theory-mode .key-title  { color: #1a1410 !important; }
    body.theory-mode .ke-label   { color: #8a7868 !important; border-bottom-color: #e0d5c8 !important; }
    body.theory-mode .scale-note { background: rgba(245,197,24,.10) !important; border-color: rgba(245,197,24,.35) !important; color: #6b4f00 !important; }
    body.theory-mode .scale-note:hover { background: rgba(245,197,24,.20) !important; }
    body.theory-mode .scale-degree { color: rgba(107,79,0,.45) !important; }
    body.theory-mode .scale-note.root { background: #F5C518 !important; border-color: #d4a800 !important; color: #1a1410 !important; }
    body.theory-mode .scale-note.root:hover { background: #e0b400 !important; }
    body.theory-mode .scale-note.root .scale-degree { color: rgba(26,20,16,.6) !important; }
    body.theory-mode .chord-card          { background: #ffffff !important; border-color: #e0d5c8 !important; }
    body.theory-mode .chord-card.tonic    { background: rgba(245,197,24,.10) !important; border-color: rgba(245,197,24,.45) !important; }
    body.theory-mode .chord-card.dominant { background: rgba(192,112,64,.07) !important; border-color: rgba(192,112,64,.30) !important; }
    body.theory-mode .chord-card.sub      { background: rgba(122,154,90,.07) !important; border-color: rgba(122,154,90,.30) !important; }
    body.theory-mode .chord-card.ke-active { border-color: #F5C518 !important; background: #fffce8 !important; box-shadow: 0 0 0 1px rgba(245,197,24,.35) !important; }
    body.theory-mode .chord-card:hover    { background: #fdf5df !important; }
    body.theory-mode .chord-roman  { color: #a07830 !important; }
    body.theory-mode .chord-name   { color: #1a1410 !important; }
    body.theory-mode .chord-qual   { color: #8a7868 !important; }
    body.theory-mode .chord-notes  { color: #a09080 !important; }
    body.theory-mode .sig-note     { background: rgba(245,197,24,.10) !important; border-color: rgba(245,197,24,.35) !important; color: #6b4f00 !important; }
    body.theory-mode #theory-section-key .key-explorer {
      background: #ffffff; border: 1.5px solid #e0d5c8; border-radius: var(--radius); overflow: hidden; padding: 16px;
    }

    /* ── Theory section nav ── */
    .theory-section-nav {
      display: flex; gap: 0; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 3px; margin-bottom: 20px;
      overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch;
    }
    .theory-section-nav::-webkit-scrollbar { display: none; }
    .theory-section-btn {
      flex: 1; min-width: fit-content; background: transparent; border: none;
      color: var(--text-muted); font-size: 0.82rem; font-weight: 700;
      padding: 7px 10px; border-radius: 8px; cursor: pointer;
      transition: background .15s, color .15s; white-space: nowrap;
    }
    .theory-section-btn.active { background: var(--accent); color: #fff; }
    .theory-section-btn:hover:not(.active) { color: var(--text); }
    .theory-section-panel { display: none; }
    .theory-section-panel.active { display: block; }
    .theory-content-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }

    /* ── Glossary ── */
    .glossary-group { margin-bottom: 6px; }
    .glossary-letter {
      font-size: 1.05rem; font-weight: 900; letter-spacing: .06em; text-transform: uppercase;
      color: var(--text-muted); padding: 16px 16px 8px; margin: 0 -16px;
      border-bottom: 1px solid var(--border); background: var(--surface-2);
    }
    .glossary-term {
      padding: 10px 0 10px 16px; border-bottom: 1px solid var(--border, #222);
      border-left: 2px solid transparent; transition: border-left-color .12s;
    }
    .glossary-term:last-child { border-bottom: none; }
    .glossary-term:hover { border-left-color: var(--accent); }
    .glossary-term-header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; margin-bottom: 5px; }
    .glossary-term-name   { font-weight: 700; font-size: .97rem; font-style: italic; color: var(--text-main); letter-spacing: -.01em; }
    .glossary-term-origin { font-size: .78rem; font-style: italic; color: var(--text-muted); font-weight: 400; }
    .glossary-term-cat    {
      font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      color: var(--accent); background: rgba(245,197,24,0.07);
      padding: 2px 8px; border-radius: 20px; margin-left: auto; flex-shrink: 0;
      border: 1px solid rgba(245,197,24,0.18);
    }
    .glossary-symbol { font-size: 1rem; margin-left: 4px; color: var(--text-main); }
    .glossary-term-def {
      font-size: .85rem; color: var(--text-muted); line-height: 1.65; margin-top: 4px;
      padding-left: 12px; border-left: 2px solid var(--border);
    }

    /* ── Key Explorer ── */
    .key-explorer { padding-top: 4px; }
    .ke-layout { display: block; }
    .cof-wrap  { display: flex; justify-content: center; margin: 0 auto 24px; max-width: 420px; }
    .cof-wrap svg { width: 100%; cursor: pointer; }
    .cof-segment { cursor: pointer; }
    .cof-segment path { transition: opacity .12s; }
    .cof-segment:hover path { opacity: .8; }
    .key-title { font-size: 1.7rem; font-weight: 800; color: var(--text); line-height: 1; }
    .scale-notes-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 4px; }
    .scale-note {
      background: rgba(99,102,241,.15); border: 1px solid rgba(99,102,241,.32);
      border-radius: 9px; padding: 8px 6px; font-size: .82rem; font-weight: 700;
      color: #d4d8f8; text-align: center; min-width: 36px; flex: 1; transition: background .12s;
    }
    .scale-note:hover { background: rgba(99,102,241,.28); }
    .scale-note.root { background: #4f46e5; border-color: #6366f1; color: #fff; }
    .scale-note.root:hover { background: #5b52ee; }
    .scale-degree { display: block; font-size: .52rem; font-weight: 400; color: rgba(165,180,252,.6); margin-top: 3px; }
    .scale-note.root .scale-degree { color: rgba(255,255,255,.65); }
    .chords-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-bottom: 22px; }
    @media (max-width: 640px) { .chords-grid { grid-template-columns: repeat(4, 1fr); } }
    .chord-card {
      background: rgba(99,102,241,.13); border: 1px solid rgba(99,102,241,.28);
      border-radius: 10px; padding: 10px 5px; text-align: center;
      transition: background .12s, border-color .12s;
    }
    .chord-card.tonic    { border-color: rgba(99,102,241,.55);  background: rgba(99,102,241,.22); }
    .chord-card.dominant { border-color: rgba(96,165,250,.45);  background: rgba(96,165,250,.14); }
    .chord-card.sub      { border-color: rgba(74,222,128,.38);  background: rgba(74,222,128,.1);  }
    .chord-card.ke-active { border-color: #f59e0b !important; background: rgba(245,158,11,.18) !important; box-shadow: 0 0 0 1px rgba(245,158,11,.35); }
    .chord-card:hover    { background: rgba(99,102,241,.22); }
    .chord-roman  { font-size: .58rem; color: rgba(165,180,252,.7); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 4px; }
    .chord-name   { font-size: .92rem; font-weight: 800; margin-bottom: 3px; }
    .chord-qual   { font-size: .6rem;  color: rgba(200,205,240,.65); margin-bottom: 5px; }
    .chord-notes  { font-size: .6rem;  color: rgba(165,180,252,.55); line-height: 1.5; }
    .ke-label { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: rgba(165,180,252,.75); margin-bottom: 10px; }
    .sig-note { background: rgba(99,102,241,.18); border: 1px solid rgba(99,102,241,.38); border-radius: 7px; padding: 5px 10px; font-size: .82rem; font-weight: 700; color: #c7d2fe; }

    /* ── Collection ── */
    .col-search-wrap { position: relative; margin-bottom: 24px; }
    .col-search-dropdown {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; z-index: 50; max-height: 280px; overflow-y: auto;
      display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    }
    .col-search-item { padding: 10px 14px; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
    .col-search-item:last-child { border-bottom: none; }
    .col-search-item:hover { background: var(--surface-2); }
    .col-search-item-info { flex: 1; min-width: 0; }
    .col-search-item-title    { font-size: 0.9rem; font-weight: 600; }
    .col-search-item-composer { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
    .col-search-item-status   { font-size: 0.72rem; color: var(--accent); margin-top: 2px; }
    .col-search-item-add { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    .col-status-section { margin-bottom: 28px; }
    .col-status-header { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .col-status-count  { background: var(--surface-2); border-radius: 10px; padding: 1px 7px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
    .col-piece-card    { background: var(--surface); border: 1.5px solid var(--border); border-radius: 10px; padding: 0; margin-bottom: 8px; display: flex; flex-direction: column; align-items: stretch; }
    .col-piece-info    { flex: 1; min-width: 0; }
    .col-piece-title   { font-size: 0.92rem; font-weight: 600; line-height: 1.3; }
    .col-piece-meta-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
    .col-piece-composer { font-size: 0.75rem; color: var(--text-muted); }
    .col-piece-actions { display: flex; gap: 5px; align-items: center; flex-shrink: 0; }
    .col-status-chip { font-size: 0.65rem; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; white-space: nowrap; transition: border-color 0.15s, color 0.15s, background 0.15s; line-height: 1.5; }
    .col-status-chip:hover { border-color: var(--accent); color: var(--accent); }
    .col-status-chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
    .col-diff-mini { font-size: 0.6rem; letter-spacing: 0.03em; color: var(--text-muted); white-space: nowrap; flex-shrink: 0; }
    .col-diff-mini .star { color: var(--text-muted); opacity: .35; }
    .col-diff-mini .star.on { color: var(--accent); opacity: 1; }
    .col-remove-btn { font-size: 0.68rem; padding: 2px 6px; border-radius: 6px; border: 1px solid #fca5a5; background: transparent; color: #e53e3e; cursor: pointer; transition: background 0.15s; line-height: 1.5; }
    .col-remove-btn:hover { background: #fee2e2; }
    .col-empty { color: var(--text-muted); font-size: 0.85rem; padding: 4px 0 8px; }
    .col-status-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 20px; border: 1px solid var(--border); background: var(--accent-subtle); color: var(--accent); font-weight: 600; white-space: nowrap; }

    /* ── Library sub-tabs ── */
    .sub-tab-bar { display: flex; gap: 2px; margin-bottom: 16px; align-items: stretch; background: #1a1410; border-radius: 10px; padding: 4px; border-bottom: none !important; }
    .sub-tab { flex: 0 0 auto; border-radius: 7px; border: none !important; border-bottom: none !important; margin-bottom: 0 !important; background: transparent; color: #a09585; font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.15s; line-height: 1; padding: 0 16px; display: flex; align-items: center; justify-content: center; min-height: 36px; }
    .sub-tab.active { background: var(--accent); color: #000; }
    .sub-tab:hover:not(.active) { color: #c8b8a8; }
    .sub-tab-count { background: rgba(255,255,255,.12); color: #a09080; border-radius: 10px; padding: 1px 6px; font-size: 0.72rem; margin-left: 4px; }
    .sub-tab.active .sub-tab-count { background: rgba(0,0,0,.18); color: #1a1410; }
    /* On phones the 3 sub-tabs (Aspire / Learning / Completed) overflowed the
       container at the right edge. Force equal-share via flex:1 + shrink the
       padding/badge so each tab fits. */
    @media (max-width: 500px) {
      .sub-tab {
        flex: 1 1 0; min-width: 0;
        padding: 0 6px; font-size: 0.74rem;
      }
      .sub-tab-count {
        padding: 1px 5px; font-size: 0.65rem;
        margin-left: 3px;
      }
    }

    /* ── Loading screen ── */
    #loading-screen {
      position: fixed; inset: 0; z-index: 9999; background: var(--bg, #13110a);
      display: flex; align-items: center; justify-content: center;
    }
    #loading-screen .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(245,197,24,.2); border-top-color: #F5C518;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      background: #1a1410; color: #faf7f3; padding: 10px 20px; border-radius: 8px;
      font-size: 0.88rem; opacity: 0; transition: opacity 0.3s; z-index: 9000; pointer-events: none;
    }
    #toast.visible { opacity: 1; }
  </style>
</head>
<body class="theory-mode">

<div id="loading-screen"><div class="spinner"></div></div>
<div id="toast"></div>

<header id="app-header" style="display:none"></header>
<script src="/shared-header.js"></script>

<main id="app-main" style="display:none">

  <!-- Library panel -->
  <div id="panel-library" style="display:none">
    <div class="sub-tab-bar" id="lib-sub-tab-bar">
      <button class="sub-tab active" data-lib-sub="all">All Pieces</button>
      <button class="sub-tab" data-lib-sub="books">Books</button>
      <button class="sub-tab" data-lib-sub="collection" id="lib-collection-sub-btn">My Collection</button>
    </div>

    <div id="panel-lib-all">
      <div class="controls">
        <div class="search-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="lib-search" placeholder="Search title, composer, tag&hellip;" autocomplete="off" />
        </div>
        <select id="lib-filter-difficulty">
          <option value="">All levels</option>
          <option value="0">Absolute Beginner</option>
          <option value="1">Beginner</option>
          <option value="2">Lower Intermediate</option>
          <option value="3">Upper Intermediate</option>
          <option value="4">Advanced</option>
          <option value="5">Expert</option>
        </select>
      </div>
      <p class="results-meta" id="lib-results-meta"></p>
      <div class="pieces-grid" id="lib-grid"></div>
      <div class="empty" id="lib-empty" style="display:none">
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" width="36" height="36"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></div>
        <p>No pieces match your search.</p>
      </div>
    </div>

    <div id="panel-lib-books" style="display:none">
      <div class="controls">
        <div class="search-wrap">
          <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="lib-book-search" placeholder="Search books&hellip;" autocomplete="off" />
        </div>
        <select id="lib-book-filter-difficulty">
          <option value="">All levels</option>
          <option value="0">Absolute Beginner</option>
          <option value="1">Beginner</option>
          <option value="2">Lower Intermediate</option>
          <option value="3">Upper Intermediate</option>
          <option value="4">Advanced</option>
          <option value="5">Expert</option>
        </select>
      </div>
      <p class="results-meta" id="lib-books-meta"></p>
      <div class="pieces-grid" id="lib-books-grid"></div>
      <div class="empty" id="lib-books-empty" style="display:none">
        <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" width="36" height="36"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg></div>
        <p>No books in the library yet.</p>
      </div>
    </div>

    <div id="panel-lib-collection" style="display:none">
      <div class="col-search-wrap">
        <div class="form-group" style="margin:0">
          <label>Search the library to add a piece</label>
          <input type="text" id="col-search-input" placeholder="Search by title or composer&hellip;" autocomplete="off" />
        </div>
        <div class="col-search-dropdown" id="col-search-dropdown"></div>
      </div>
      <div class="sub-tab-bar" style="margin-top:16px">
        <button class="sub-tab active" data-col-status="aspire">
          Aspire to Play <span class="sub-tab-count" id="col-count-aspire">0</span>
        </button>
        <button class="sub-tab" data-col-status="learning">
          Learning <span class="sub-tab-count" id="col-count-learning">0</span>
        </button>
        <button class="sub-tab" data-col-status="completed">
          Completed <span class="sub-tab-count" id="col-count-completed">0</span>
        </button>
      </div>
      <div id="col-active-list"></div>
    </div>
  </div><!-- /panel-library -->

  <!-- Theory panel -->
  <div id="panel-theory" style="display:none">

    <!-- PPD section -->
    <div id="theory-section-ppd" class="theory-section-panel active">
      <div id="ppd-suggest-overlay" onclick="if(event.target===this)ppdCloseSuggest()">
        <div class="ppd-modal">
          <h3>Suggest a topic</h3>
          <p>Is there a piece of theory you'd love a sheet on? We read every one.</p>
          <textarea id="ppd-suggest-text" placeholder="I'd love a sheet on&hellip;" rows="4"></textarea>
          <div class="ppd-modal-error" id="ppd-suggest-error"></div>
          <div class="ppd-modal-btns">
            <button class="ppd-btn-cancel" onclick="ppdCloseSuggest()">Cancel</button>
            <button class="ppd-btn-submit" id="ppd-suggest-btn" onclick="ppdSubmitSuggestion()">Send suggestion</button>
          </div>
        </div>
      </div>
      <div id="ppd-index"></div>
    </div><!-- /theory-section-ppd -->

    <!-- Glossary section -->
    <div id="theory-section-glossary" class="theory-section-panel">
      <div class="theory-content-card">
        <div style="padding:14px 16px 12px;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <input type="text" id="glossary-search" placeholder="Search terms&hellip;"
                   oninput="glossaryFilter()"
                   style="flex:1;min-width:140px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-main);font-size:0.88rem">
            <select id="glossary-category" onchange="glossaryFilter()"
                    style="padding:8px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-main);font-size:0.88rem">
              <option value="">All categories</option>
            </select>
          </div>
        </div>
        <div id="glossary-container" style="padding:0 16px 16px"><p class="ppd-loading">Loading&hellip;</p></div>
      </div>
    </div><!-- /theory-section-glossary -->

    <!-- Key Explorer section -->
    <div id="theory-section-key" class="theory-section-panel">
      <div class="key-explorer" style="padding:12px 16px">
        <div class="ke-layout">
          <div class="cof-wrap">
            <svg id="cof-svg" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg"></svg>
          </div>
          <div id="key-info"></div>
        </div>
      </div>
    </div><!-- /theory-section-key -->

  </div><!-- /panel-theory -->

  <!-- Piece detail modal -->
  <div id="piece-modal-overlay" class="piece-modal-overlay" onclick="closePieceModal()">
    <div class="piece-modal" onclick="event.stopPropagation()">
      <div id="piece-modal-inner"></div>
    </div>
  </div>

</main>

<script>
// ── Configuration ─────────────────────────────────────────────────────────────
const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";

// ── Utilities ─────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function showToast(msg, duration) {
  if (duration === undefined) duration = 3500;
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("visible");
  setTimeout(function() { el.classList.remove("visible"); }, duration);
}

function redirectToRoot() { window.location.href = "/"; }

// ── Token refresh ─────────────────────────────────────────────────────────────
async function ensureFreshToken() {
  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session) return false;
    const expiresAt = session.expires_at * 1000;
    if (Date.now() > expiresAt - 5 * 60 * 1000) {
      const { error } = await db.auth.refreshSession();
      if (error) return false;
    }
    return true;
  } catch(e) { return false; }
}

async function requireAuth() {
  const ok = await ensureFreshToken();
  if (!ok) { await db.auth.signOut().catch(function(){}); redirectToRoot(); }
  return ok;
}

document.addEventListener("visibilitychange", async function() {
  if (document.visibilityState !== "visible") return;
  const ok = await ensureFreshToken();
  if (!ok) { await db.auth.signOut().catch(function(){}); redirectToRoot(); }
});

function switchSection(s) {
  if (s === "library" || s === "books" || s === "collection") {
    document.getElementById("panel-library").style.display = "";
    document.getElementById("panel-theory").style.display  = "none";
    if (!_libraryLoaded) { loadLibrary(); }
    if (s === "books") {
      document.querySelectorAll(".sub-tab[data-lib-sub]").forEach(function(b) {
        b.classList.toggle("active", b.dataset.libSub === "books");
      });
      document.getElementById("panel-lib-all").style.display        = "none";
      document.getElementById("panel-lib-books").style.display      = "";

      if (_libraryLoaded) renderBooksLibrary();
    } else if (s === "collection") {
      document.querySelectorAll(".sub-tab[data-lib-sub]").forEach(function(b) {
        b.classList.toggle("active", b.dataset.libSub === "collection");
      });
      document.getElementById("panel-lib-all").style.display        = "none";

// ── LIBRARY ───────────────────────────────────────────────────────────────────
const LIB_DIFFICULTY_LABELS = { 0:"Absolute Beginner", 1:"Beginner", 2:"Lower Intermediate", 3:"Upper Intermediate", 4:"Advanced", 5:"Expert" };
let libAllPieces = [];
let libAllBooks  = [];
let _libraryLoaded = false;

function renderLibStars(n, color) {
  return Array.from({ length: 5 }, function(_, i) {
    var style = color ? (i < n ? 'style="color:' + color + '"' : 'style="color:rgba(255,255,255,.2)"') : '';
    return '<span class="star ' + (i < n ? "on" : "off") + '" ' + style + '>&#9733;</span>';
  }).join("");
}

function renderLibText(str) {
  if (!str) return "";
  return escHtml(str)
    .replace(/\*{0,2}(Before You Begin:?)\*{0,2}/gim, '<strong style="color:#c084fc;display:block;margin-top:10px">$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\n\n/g, "<br><br>")
    .replace(/\n/g, "<br>");
}

const COL_SHORT_LABELS = { aspire:"Aspire", learning:"Learning", completed:"Done" };

function libCollectionFooterHTML(pieceId) {
  const status = myCollection[pieceId] && myCollection[pieceId].status;
  return Object.entries(COL_SHORT_LABELS).map(function(pair) {
    const s = pair[0], label = pair[1];
    return '<button class="status-btn status-' + s + (status === s ? " active" : "") + '" ' +
      'data-lib-piece="' + pieceId + '" data-lib-status="' + s + '">' + label + '</button>';
  }).join("") +
  (status ? '<button class="status-remove-btn" data-lib-remove="' + pieceId + '">&times;</button>' : "");
}

// Bright diff colours for dark card headers (same as modal header)
var LIB_DIFF_COLORS = ['#67e8f9','#4ade80','#a3e635','#facc15','#fb923c','#f87171'];

function renderLibCard(piece, isBook) {
  isBook = isBook || false;
  const tags = (piece.tags || []).slice(0, 3).map(function(t) {
    return '<span class="tag" data-lib-tag="' + escHtml(t) + '">' + escHtml(t) + '</span>';
  }).join("");
  const hasDiff = piece.difficulty != null;
  const diffLabel = hasDiff ? LIB_DIFFICULTY_LABELS[piece.difficulty] : "";
  const diffColor = hasDiff ? LIB_DIFF_COLORS[piece.difficulty] : '#f5c518';
  const diffCls = hasDiff ? ' diff-' + piece.difficulty : '';
  // First ~160 chars of background text — CSS line-clamp handles the cutoff
  const bg = (piece.background || "").replace(/\n/g, " ").trim();
  const blurb = bg.slice(0, 160);
  return '<div class="piece-card lib-card' + diffCls + '" data-lib-id="' + piece.id + '" onclick="showPieceModal(' + piece.id + ')">' +
    '<div class="lib-card-header" style="border-top-color:' + diffColor + '">' +
      '<div class="lib-card-header-top">' +
        '<div class="card-title">' + escHtml(piece.title) + '</div>' +
        (hasDiff ? '<div class="lib-card-stars-corner">' + renderLibStars(piece.difficulty, diffColor) + '</div>' : '') +
      '</div>' +
      '<div class="card-meta">' +
        '<span>' + (isBook && piece.composer ? 'Author: ' + escHtml(piece.composer) : escHtml(piece.composer || "")) + '</span>' +
        (piece.year ? '<span>' + piece.year + '</span>' : '') +
      '</div>' +
    '</div>' +
    (blurb ? '<div class="lib-card-content"><p class="lib-card-blurb">' + escHtml(blurb) + '</p></div>' : '') +
  '</div>';
}

function renderLibrary() {
  const query      = document.getElementById("lib-search").value.trim().toLowerCase();
  const diffFilter = document.getElementById("lib-filter-difficulty").value;
  const filtered   = libAllPieces.filter(function(p) {
    const text = [p.title, p.composer, p.background, p.pianist_notes, p.challenges].concat(p.tags || []).join(" ").toLowerCase();
    return (!query || text.includes(query)) && (!diffFilter || String(p.difficulty) === diffFilter);
  });
  const grid  = document.getElementById("lib-grid");
  const meta  = document.getElementById("lib-results-meta");
  const empty = document.getElementById("lib-empty");
  if (filtered.length === 0) {
    grid.innerHTML = ""; empty.style.display = ""; meta.textContent = "";
  } else {
    empty.style.display = "none";
    grid.innerHTML = filtered.map(function(p) { return renderLibCard(p); }).join("");
    meta.textContent = filtered.length + " piece" + (filtered.length !== 1 ? "s" : "");
  }
}

async function loadLibrary() {
  _libraryLoaded = true;
  document.getElementById("lib-grid").innerHTML = '<div class="page-loading"><div class="loading-spinner"></div></div>';
  if (!_collectionLoaded) await loadCollection();
  const { data, error } = await db.from("pieces").select("*").order("title");
  if (error) { console.error("Library load error:", error); return; }
  const all = data || [];
  libAllPieces = all.filter(function(p) { return !p.kind || p.kind === "piece"; });
  libAllBooks  = all.filter(function(p) { return p.kind === "book"; });
  renderLibrary();
  renderBooksLibrary();
}

function renderBooksLibrary() {
  const query      = (document.getElementById("lib-book-search") && document.getElementById("lib-book-search").value || "").trim().toLowerCase();
  const diffFilter = (document.getElementById("lib-book-filter-difficulty") && document.getElementById("lib-book-filter-difficulty").value || "");
  const filtered   = libAllBooks.filter(function(b) {
    const text = [b.title, b.composer, b.background, b.pianist_notes].concat(b.tags || []).join(" ").toLowerCase();
    return (!query || text.includes(query)) && (!diffFilter || String(b.difficulty) === diffFilter);
  });
  const grid  = document.getElementById("lib-books-grid");
  const meta  = document.getElementById("lib-books-meta");
  const empty = document.getElementById("lib-books-empty");
  if (!grid) return;
  if (filtered.length === 0) {
    grid.innerHTML = ""; empty.style.display = ""; meta.textContent = "";
  } else {
    empty.style.display = "none";
    grid.innerHTML = filtered.map(function(b) { return renderLibCard(b, true); }).join("");
    meta.textContent = filtered.length + " book" + (filtered.length !== 1 ? "s" : "");
  }
}

// ── COLLECTION ────────────────────────────────────────────────────────────────
const COL_STATUS_LABELS = { aspire:"Aspire to Play", learning:"Learning", completed:"Completed" };
let myCollection = {};         // keyed by "piece_id" or "u_<user_piece_id>"
let _collectionLoaded = false;
let currentColStatus  = "aspire";

// Custom piece key helpers
function customKey(userPieceId) { return "u_" + userPieceId; }
function isCustomKey(k)         { return String(k).startsWith("u_"); }
function userPieceIdFromKey(k)  { return Number(String(k).slice(2)); }

async function loadCollection() {
  _collectionLoaded = true;
  myCollection = {};
  const { data: colRows, error: colErr } = await db.from("user_collections")
    .select("piece_id, user_piece_id, status").eq("email", myEmail);
  if (!colErr && colRows && colRows.length > 0) {
    // Library pieces
    const libIds = colRows.filter(function(r) { return r.piece_id; }).map(function(r) { return Number(r.piece_id); });
    if (libIds.length > 0) {
      const { data: piecesData } = await db.from("pieces").select("*").in("id", libIds);
      const pMap = {};
      (piecesData || []).forEach(function(p) { pMap[Number(p.id)] = p; });
      colRows.filter(function(r) { return r.piece_id; }).forEach(function(row) {
        const piece = pMap[Number(row.piece_id)];
        if (piece) myCollection[Number(row.piece_id)] = Object.assign({ status: row.status }, piece);
      });
    }
    // Custom pieces
    const customIds = colRows.filter(function(r) { return r.user_piece_id; }).map(function(r) { return Number(r.user_piece_id); });
    if (customIds.length > 0) {
      const { data: customData } = await db.from("user_pieces").select("*").in("id", customIds);
      const cMap = {};
      (customData || []).forEach(function(p) { cMap[Number(p.id)] = p; });
      colRows.filter(function(r) { return r.user_piece_id; }).forEach(function(row) {
        const piece = cMap[Number(row.user_piece_id)];
        if (piece) myCollection[customKey(row.user_piece_id)] = Object.assign({ status: row.status, _custom: true }, piece);
      });
    }
  }
  if (colErr) console.error("Collection load error:", colErr);
  renderCollection();
}

document.getElementById("panel-lib-collection").addEventListener("click", async function(e) {
  const subTab = e.target.closest("[data-col-status].sub-tab");
  if (subTab) {
    currentColStatus = subTab.dataset.colStatus;
    document.querySelectorAll(".sub-tab[data-col-status]").forEach(function(b) {
      b.classList.toggle("active", b === subTab);
    });
    renderCollection();
    return;
  }
  if (e.target.closest(".sub-tab")) return;
  const statusBtn = e.target.closest("[data-col-status]");
  if (statusBtn) {
    const pieceId   = Number(statusBtn.dataset.colPiece);
    const newStatus = statusBtn.dataset.colStatus;
    if (!pieceId || (myCollection[pieceId] && myCollection[pieceId].status === newStatus)) return;
    await colSetStatus(pieceId, newStatus);
    return;
  }
  const removeBtn = e.target.closest("[data-col-remove]");
  if (removeBtn) { await colRemove(removeBtn.dataset.colRemove); }
});

function renderCollection() {
  const colSearchWrap = document.querySelector(".col-search-wrap");
  if (colSearchWrap) colSearchWrap.style.display = "";

  const groups = { learning: [], aspire: [], completed: [] };
  Object.entries(myCollection).forEach(function(pair) {
    const key = pair[0], info = pair[1];
    if (groups[info.status]) {
      // For custom pieces, use the string key as _colKey so we can identify them later
      groups[info.status].push(Object.assign({ _colKey: key, id: isCustomKey(key) ? null : Number(key) }, info));
    }
  });

  ["learning","aspire","completed"].forEach(function(status) {
    const countEl = document.getElementById("col-count-" + status);
    if (countEl) countEl.textContent = groups[status].length;
  });

  const emptyMsgs = {
    learning:  "Nothing being learned yet — browse the library above.",
    aspire:    "No pieces or books on your wishlist yet.",
    completed: "No completed pieces or books yet — keep going!"
  };

  const items = groups[currentColStatus].sort(function(a, b) { return a.title.localeCompare(b.title); });
  const listEl = document.getElementById("col-active-list");
  if (!listEl) return;
  if (items.length === 0) {
    listEl.innerHTML = '<div class="col-empty">' + emptyMsgs[currentColStatus] + '</div>';
    return;
  }
  listEl.innerHTML = items.map(function(p) { return renderCollectionCard(p); }).join("");
}

window.colChipClick = async function(colKey, status) {

async function colSetStatus(colKey, status) {
  if (!await requireAuth()) return;
  if (isCustomKey(colKey)) {
    // Custom piece — update via user_piece_id
    const upId = userPieceIdFromKey(colKey);
    const { error } = await db.from("user_collections")
      .update({ status: status }).eq("email", myEmail).eq("user_piece_id", upId);
    if (error) { showToast("Error updating collection — please try again."); return; }
  } else {
    const { error } = await db.rpc("set_collection_status", {
      p_email: myEmail, p_piece_id: Number(colKey), p_status: status
    });
    if (error) { showToast("Error updating collection — please try again."); return; }
  }
  if (myCollection[colKey]) {
    myCollection[colKey].status = status;
  } else {
    const piece = isCustomKey(colKey) ? null : findAnyLibPiece(Number(colKey));
    myCollection[colKey] = piece ? Object.assign({}, piece, { status: status }) : { status: status };
  }
  renderCollection();
  refreshAllLibFooters();
  if (status === "completed") {
    showToast("Marked as Completed — well done!", 4000);
    // Notify owner that a member finished a piece (skip when owner is the user).
    if (myEmail && myEmail.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
      const piece = myCollection[colKey] || {};
      const title    = piece.title    || "a piece";
      const composer = piece.composer ? ` (${piece.composer})` : "";
      db.from("notifications").insert({
        email:    OWNER_EMAIL,
        type:     "member_milestone",
        title:    `${myName || "Someone"} completed a piece`,
        body:     `${title}${composer}`,
        link_url: `/practice-log.html?u=${encodeURIComponent(myEmail)}`,
        metadata: { collection_key: String(colKey), kind: "piece_completed" },
      }).then(() => {}).catch(() => {});
    }
  }
}

async function colRemove(colKey) {
  if (!await requireAuth()) return;
  if (isCustomKey(colKey)) {
    const upId = userPieceIdFromKey(colKey);
    const { error } = await db.from("user_collections")
      .delete().eq("email", myEmail).eq("user_piece_id", upId);
    if (error) { showToast("Error removing piece — please try again."); return; }
  } else {
    const { error } = await db.rpc("remove_collection_piece", {
      p_email: myEmail, p_piece_id: Number(colKey)
    });
    if (error) { showToast("Error removing piece — please try again."); return; }
  }
  delete myCollection[colKey];
  renderCollection();
  refreshAllLibFooters();
}

async function colAdd(pieceId, title, composer, status, fullPiece) {
  const { error } = await db.from("user_collections")
    .upsert({ email: myEmail, piece_id: pieceId, status: status }, { onConflict: "email,piece_id" });
  if (error) { showToast("Error adding piece"); return; }
  let piece = fullPiece || findAnyLibPiece(pieceId);
  if (!piece) {
    const { data } = await db.from("pieces").select("*").eq("id", pieceId).maybeSingle();
    piece = data;
  }
  myCollection[pieceId] = piece ? Object.assign({}, piece, { status: status }) : { status: status, title: title, composer: composer };
  renderCollection();
  refreshAllLibFooters();
  document.getElementById("col-search-dropdown").style.display = "none";
  document.getElementById("col-search-input").value = "";

async function colAddCustom(title, composer, status) {
  // Insert into user_pieces
  const { data: upData, error: upErr } = await db.from("user_pieces")
    .insert({ email: myEmail, title: title.trim(), composer: (composer || "").trim() })
    .select().single();
  if (upErr || !upData) { showToast("Error saving custom piece"); return; }
  // Add to user_collections
  const { error: ucErr } = await db.from("user_collections")
    .insert({ email: myEmail, user_piece_id: upData.id, status: status });
  if (ucErr) { showToast("Error adding to collection"); return; }

  renderCollection();
  document.getElementById("col-search-dropdown").style.display = "none";
  document.getElementById("col-search-input").value = "";
