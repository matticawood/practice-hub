[build]
  command = "echo 'no build step'"
  publish = "."

# Bundle functions with esbuild so a function can `import` a shared module that
# lives outside its own folder (send-campaign.mjs imports ../../email-templates.mjs,
# the single rendering source shared with the Email Studio page).
[functions]
  node_bundler = "esbuild"

# Serve .mjs with a JS MIME type so the browser can `import` the shared template
# module directly (some CDNs default .mjs to octet-stream, which blocks imports).
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# HTML pages must never be edge-cached, otherwise the Netlify CDN serves a
# stale page for up to s-maxage seconds after a deploy (the default is 300s,
# which caused "I deployed but nothing changed"). max-age=0 + must-revalidate
# forces both the browser and the CDN to revalidate against the etag every
# time, so a new deploy is visible immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker itself must always be fetched fresh so SW updates ship
# immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[edge_functions]]
  path = "/theory/*"
  function = "auth-guard"

[[edge_functions]]
  path = "/api/daily"
  function = "daily-api"

[[edge_functions]]
  path = "/api/daily-webhook"
  function = "daily-webhook"

[[edge_functions]]
  path = "/api/billing-portal"
  function = "billing-portal"
