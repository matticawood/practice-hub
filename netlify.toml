[build]
  command = "echo 'no build step'"
  publish = "."

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[edge_functions]]
  path = "/theory/*"
  function = "auth-guard"

[[edge_functions]]
  path = "/api/daily"
  function = "daily-api"

[[edge_functions]]
  path = "/api/daily-webhook"
  function = "daily-webhook"

[[edge_functions]]
  path = "/api/billing-portal"
  function = "billing-portal"
