[build]
  command = "echo 'no build step'"
  publish = "."

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# HTML pages must never be edge-cached, otherwise the Netlify CDN serves a
# stale page for up to s-maxage seconds after a deploy (the default is 300s,
# which caused "I deployed but nothing changed"). max-age=0 + must-revalidate
# forces both the browser and the CDN to revalidate against the etag every
# time, so a new deploy is visible immediately.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The service worker itself must always be fetched fresh so SW updates ship
# immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[edge_functions]]
  path = "/theory/*"
  function = "auth-guard"

[[edge_functions]]
  path = "/api/daily"
  function = "daily-api"

[[edge_functions]]
  path = "/api/daily-webhook"
  function = "daily-webhook"

[[edge_functions]]
  path = "/api/billing-portal"
  function = "billing-portal"
