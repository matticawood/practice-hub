<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Content Feed — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.png"  />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3.12.0"></script>
  <script src="/shared-achievements.js?v=9"></script>
  <script src="/shared-header.js?v=2026071802"></script>
<script src="/live-session.js?v=1"></script>
  <script src="/shared-comments.js"></script>
  <script src="/shared-member-modal.js?v=14"></script>
  <style>
    /* ── Theme ──────────────────────────────────────────────────────────────── */
    :root {
      --bg:           #faf7f3;
      --surface:      #ffffff;
      --surface-2:    #f0ebe2;
      --border:       #e0d5c8;
      --text:         #1a1410;
      --text-muted:   #8a7868;
      --accent-subtle:#fdf0d8;
      /* Content type colours */
      --yt-clr:    #dc2626;
      --yt-bg:     rgba(220,38,38,.08);
      --yt-border: rgba(220,38,38,.22);
      --blog-clr:  #4338ca;
      --blog-bg:   rgba(67,56,202,.08);
      --blog-border:rgba(67,56,202,.22);
      --post-clr:  #b45309;
      --post-bg:   rgba(180,83,9,.1);
      --post-border:rgba(180,83,9,.22);
    }
    body { background: var(--bg); }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    /* Match the dashboard's tight gap between the top bar and the title. */
    main { padding-top: 12px; }
    #cf-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* ── Page header (hero + filters in a white card) ────────────────────────── */
    .cf-page-hdr {
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(60,40,20,.08);
      padding: 20px 24px;
      margin-bottom: 18px;
    }
    .cf-hdr-top { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
    .cf-hero { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .cf-hero-icon {
      width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
      display: grid; place-items: center;
      background: rgba(245,197,24,.12); color: #b8900a;
      box-shadow: inset 0 0 0 1px rgba(245,197,24,.26);
    }
    .cf-hero-icon svg { width: 23px; height: 23px; }
    .cf-page-hdr h2 {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -.015em;
      color: var(--text); margin: 0; line-height: 1.1;
    }
    .cf-page-desc { font-size: .88rem; color: var(--text-muted); margin-top: 3px; }
    .cf-hdr-filters { display: flex; gap: 8px; flex-wrap: wrap; }

    /* Arrival animation — mirrors the community feed so the pages match. */
    @keyframes cfFadeUp { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: no-preference) {
      .cf-page-hdr { animation: cfFadeUp .5s cubic-bezier(.22,.61,.36,1) both; animation-delay: .02s; }
      #cf-feed.feed-arrive > .cf-card { animation: cfFadeUp .45s cubic-bezier(.22,.61,.36,1) both; }
      #cf-feed.feed-arrive > .cf-card:nth-child(1) { animation-delay: .10s; }
      #cf-feed.feed-arrive > .cf-card:nth-child(2) { animation-delay: .15s; }
      #cf-feed.feed-arrive > .cf-card:nth-child(3) { animation-delay: .20s; }
      #cf-feed.feed-arrive > .cf-card:nth-child(n+4) { animation-delay: .24s; }
    }

    /* ── Admin form card ────────────────────────────────────────────────────── */
    .cf-form-card {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
    }
    .cf-form-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 18px;
    }

    /* Type tab selector */
    .cf-type-tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 22px;
    }
    .cf-type-tab {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 8px 18px 10px;
      margin-bottom: -2px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .cf-type-tab:hover { color: var(--text); }
    .cf-type-tab.active-youtube { color: var(--yt-clr);   border-bottom-color: var(--yt-clr); }
    .cf-type-tab.active-blog    { color: var(--blog-clr); border-bottom-color: var(--blog-clr); }
    .cf-type-tab.active-post    { color: var(--post-clr); border-bottom-color: var(--post-clr); }

    .cf-form-field { margin-bottom: 16px; }
    .cf-form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .cf-form-input,
    .cf-form-textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      resize: vertical;
      transition: border-color .15s;
    }
    .cf-form-input:focus,
    .cf-form-textarea:focus { outline: none; border-color: var(--accent); }
    .cf-form-hint { font-size: .76rem; color: var(--text-muted); margin: 4px 0 0; }
    .cf-form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    /* Post composer (Post tab) */
    .cf-composer-wrap {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }
    .cf-composer-body { padding: 14px 16px; background: var(--surface); }
    .cf-composer-title {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--border);
      padding: 6px 0 10px;
      margin-bottom: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }
    .cf-composer-title::placeholder { font-weight: 400; color: var(--text-muted); }
    .cf-composer-title:focus { border-bottom-color: var(--accent); }
    .cf-composer-textarea {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      resize: none;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.6;
      min-height: 90px;
      padding: 0;
      outline: none;
    }
    .cf-composer-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    /* ── Blog bullet builder (admin form) ───────────────────────────────────── */
    .cf-bullets-builder { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .cf-bullet-row { display: flex; gap: 8px; align-items: center; }
    .cf-bullet-num {
      font-size: 0.78rem; font-weight: 800;
      color: var(--blog-clr);
      width: 20px; flex-shrink: 0; text-align: right;
    }
    .cf-bullet-input {
      flex: 1;
      padding: 8px 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text);
      transition: border-color .15s;
    }
    .cf-bullet-input:focus { outline: none; border-color: var(--blog-clr); }
    .cf-bullet-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1.1rem; padding: 2px 4px;
    }
    .cf-bullet-remove:hover { color: #ef4444; }
    .add-blog-bullet-btn {
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.84rem;
      color: var(--text-muted);
      width: 100%;
      transition: border-color .15s, color .15s;
    }
    .add-blog-bullet-btn:hover { border-color: var(--blog-clr); color: var(--blog-clr); }

    /* ── Blog card bullet points (rendered in feed) ─────────────────────────── */
    .cf-blog-intro {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin: 6px 0 8px;
    }
    .cf-blog-bullets {
      list-style: none; padding: 0;
      margin: 10px 0 14px;
      margin-left: 20px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .cf-blog-bullet { display: flex; gap: 10px; align-items: flex-start; }
    .cf-blog-bullet-num {
      min-width: 22px; height: 22px;
      background: var(--blog-clr);
      color: #fff;
      font-size: 0.68rem; font-weight: 800;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; margin-top: 2px;
    }
    .cf-blog-bullet-text {
      flex: 1; font-size: 0.88rem; color: var(--text); line-height: 1.5;
    }
    /* Post image previews */
    .cf-img-preview-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .cf-img-thumb {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
    }
    .cf-img-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cf-img-remove {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      border: none;
      color: #fff;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
    }
    .cf-img-remove:hover { background: #ef4444; }

    /* ── Filter bar ─────────────────────────────────────────────────────────── */
    .cf-filter-btn {
      position: relative;
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 8px 14px;
      cursor: pointer; transition: border-color .15s, background .15s;
      font-family: inherit; flex-shrink: 0;
      font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
      white-space: nowrap;
    }
    .cf-filter-btn:hover { border-color: var(--accent); }
    .cf-filter-btn.active { border-color: var(--accent); background: rgba(245,197,24,.08); color: var(--accent); }

    /* ── Feed cards ─────────────────────────────────────────────────────────── */
    .cf-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
      transition: border-color .15s;
    }
    .cf-card.type-youtube { border-left: 3.5px solid var(--yt-clr); }
    .cf-card.type-blog    { border-left: 3.5px solid var(--blog-clr); }
    .cf-card.type-post    { border-left: 3.5px solid var(--post-clr); }
    .cf-card.type-youtube:hover { border-color: rgba(220,38,38,.35); border-left-color: var(--yt-clr); }
    .cf-card.type-blog:hover    { border-color: rgba(67,56,202,.35);  border-left-color: var(--blog-clr); }
    .cf-card.type-post:hover    { border-color: rgba(180,83,9,.4);    border-left-color: var(--post-clr); }

    /* Card header strip */
    .cf-card-hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
    }
    .cf-card-hdr.type-youtube {
      background: var(--yt-bg);
      border-bottom: 1px solid var(--yt-border);
    }
    .cf-card-hdr.type-blog {
      background: var(--blog-bg);
      border-bottom: 1px solid var(--blog-border);
    }
    .cf-card-hdr.type-post {
      background: var(--post-bg);
      border-bottom: 1px solid var(--post-border);
    }
    .cf-type-badge {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .type-youtube .cf-type-badge { color: var(--yt-clr); }
    .type-blog    .cf-type-badge { color: var(--blog-clr); }
    .type-post    .cf-type-badge { color: var(--post-clr); }
    .cf-card-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .cf-edit-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      margin-left: 8px;
      transition: background .15s;
    }
    .cf-edit-btn:hover { background: var(--surface-2); border-color: #bbb; }

    /* Admin ⋮ menu (Edit / Delete) — mirrors community */
    .post-menu-wrap { position: relative; flex-shrink: 0; align-self: center; margin-left: 4px; }
    .post-menu-btn {
      width: 38px; height: 38px; border-radius: 50%;
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .post-menu-btn:hover { background: rgba(0,0,0,.05); color: var(--text); }
    .post-menu {
      position: absolute; top: calc(100% + 4px); right: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; box-shadow: 0 8px 24px rgba(60,40,20,.16);
      padding: 5px; min-width: 150px; z-index: 50;
      animation: postMenuIn .14s ease;
    }
    @keyframes postMenuIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
    .post-menu-item {
      display: flex; align-items: center; gap: 9px; width: 100%;
      background: none; border: none; cursor: pointer;
      padding: 8px 10px; border-radius: 7px;
      font-size: 0.85rem; font-weight: 600; color: var(--text);
      font-family: inherit; text-align: left; transition: background .12s;
    }
    .post-menu-item:hover { background: rgba(0,0,0,.05); }
    .post-menu-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: .85; }
    .post-menu-item-danger { color: #ef4444; }
    .post-menu-item-danger:hover { background: rgba(239,68,68,.1); }

    /* Card body */
    .cf-card-body { padding: 14px 18px 10px; }

    /* YouTube thumbnail */
    .cf-yt-thumb {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
      margin-bottom: 12px;
      aspect-ratio: 16 / 9;
    }
    .cf-yt-thumb img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: opacity .2s;
    }
    .cf-yt-thumb:hover img { opacity: .85; }
    .cf-yt-play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .cf-yt-play-btn {
      width: 58px; height: 58px;
      background: rgba(220,38,38,.92);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 18px rgba(0,0,0,.4);
      transition: background .15s, transform .15s;
    }
    .cf-yt-thumb:hover .cf-yt-play-btn {
      background: var(--yt-clr);
      transform: scale(1.07);
    }
    .cf-yt-play-icon {
      width: 0; height: 0;
      border-style: solid;
      border-width: 10px 0 10px 20px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }
    .cf-yt-embed {
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #000;
      margin-bottom: 12px;
    }
    .cf-yt-embed iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* Blog */
    .cf-blog-excerpt {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 6px 0 14px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cf-blog-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--blog-clr);
      text-decoration: none;
      background: rgba(67,56,202,.07);
      border: 1.5px solid rgba(67,56,202,.2);
      border-radius: 20px;
      padding: 6px 16px;
      transition: background .15s;
    }
    .cf-blog-link:hover { background: rgba(67,56,202,.14); }

    /* Post */
    .cf-post-body {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 4px 0 8px;
    }
    .cf-post-media { margin-top: 10px; }
    /* Force video/embed wrappers to fill the card width (shared-comments uses width:min(480px,70vw) inline) */
    .cf-post-media > div { width: 100% !important; }

    /* Card title (shared) */
    .cf-card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin: 0 0 4px;
    }

    /* Card footer */
    .cf-card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0 14px;
      margin: 0 18px;
      flex-wrap: wrap;
      border-top: 1px solid var(--border);
    }
    .cf-meta-counts { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
    .cf-footer-btn {
      background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.82rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 6px; border-radius: 6px;
      transition: color .15s, background .15s;
    }
    .cf-footer-btn:hover { color: var(--text); background: rgba(0,0,0,.05); }

    /* Detail view */
    #cf-detail { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
    .cf-detail-back {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text); font-size: 0.86rem; font-weight: 600;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 8px 15px 8px 11px; cursor: pointer;
      box-shadow: 0 1px 2px rgba(60,40,20,.05);
      transition: border-color .15s, color .15s, box-shadow .15s, transform .12s ease;
      font-family: inherit; margin: 16px 0;
    }
    .cf-detail-back svg { transition: transform .15s ease; }
    .cf-detail-back:hover { border-color: rgba(245,197,24,.55); box-shadow: 0 4px 14px rgba(60,40,20,.09); }
    .cf-detail-back:hover svg { transform: translateX(-2px); }
    .cf-detail-back:active { transform: scale(.96); }
    .cf-detail-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .cf-detail-card.type-youtube { border-left: 3.5px solid var(--yt-clr); }
    .cf-detail-card.type-blog    { border-left: 3.5px solid var(--blog-clr); }
    .cf-detail-card.type-post    { border-left: 3.5px solid var(--post-clr); }

    /* Shared reaction button style */
    .focus-footer-btn, .tc-react-btn {
      background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.82rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 6px; border-radius: 6px;
      transition: color .15s, background .15s;
    }
    .focus-footer-btn:hover, .tc-react-btn:hover { color: var(--text); background: rgba(0,0,0,.05); }
    .tc-react-btn.liked { color: #e879a0; }

    /* Comments wrap */
    .cf-cmt-wrap {
      margin-top: 12px;
    }
    .cf-cmt-wrap .tc-comments-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    /* Empty state */
    .cf-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      main { padding: 0; }
      /* No top gap — the header card connects straight to the top menu bar. */
      #cf-main { padding: 0 0 80px; }
      /* Header is a full-bleed white panel that connects into the first post. */
      .cf-page-hdr {
        border-radius: 0; border-left: none; border-right: none; border-top: none;
        border-bottom: 1px solid var(--border); box-shadow: none;
        padding: 16px; margin-bottom: 0; gap: 12px;
      }
      .cf-hero { gap: 12px; }

      /* Detail view stays inset — a framed single-post page, like community. */

    }

    /* ── Inline poll on content-feed posts ──────────────────────────────────── */
    /* No outer card — each OPTION is a white row with a coloured left edge. */
    .cf-poll { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .cf-poll-q { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 10px; }
    .cf-poll-clear { background:none; border:none; padding:0; margin-right:auto; font-family:inherit; font-size:.74rem; color:var(--text-muted); cursor:pointer; text-decoration:underline; }
    .cf-poll-clear:hover { color:#8b5cf6; }
    .cf-poll-btn {
      display: block; width: 100%; text-align: left;
      background: #fff; border: 1px solid var(--border); border-left: 4px solid #8b5cf6;
      border-radius: 8px; padding: 9px 13px; font-size: 0.85rem;
      color: var(--text); font-family: inherit; cursor: pointer;
      margin-bottom: 7px; transition: background .15s;
    }
    .cf-poll-btn:hover { background: rgba(139,92,246,.07); }
    .cf-poll-bar-row {
      margin-bottom: 7px; cursor: pointer; display: flex; flex-direction: column;
      background: #fff; border: 1px solid var(--border); border-left: 4px solid #8b5cf6;
      border-radius: 8px; padding: 8px 12px;
    }
    .cf-poll-bar-row.mine { border-left-color: #10b981; }
    .cf-poll-bar-row:hover .cf-poll-bar-fill { filter: brightness(1.08); }
    .cf-poll-bar-track { background: rgba(0,0,0,.06); border-radius: 4px; height: 6px; margin-top: 6px; order: 2; }
    .cf-poll-bar-fill { height: 100%; border-radius: 4px; background: rgba(139,92,246,.4); transition: width .4s ease; }
    .cf-poll-bar-fill.mine { background: #10b981; }
    .cf-poll-bar-meta { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-muted); }
    .cf-poll-mine { color: #10b981; }
    .cf-poll-pct { font-weight: 600; }
    /* Admin-only: who voted for this option. */
    .cf-poll-voters { order: 3; margin-top: 5px; font-size: .72rem; color: var(--text-muted); line-height: 1.45; }
    .cf-poll-footer { display:flex; align-items:center; gap:10px; margin-top: 8px; }
    .cf-poll-total { font-size: 0.74rem; color: var(--text-muted); }

<script>
/* ──────────────────────────────────────────────────────────────────────────── */
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db        = supabase.createClient(SUPA_URL, SUPA_ANON);
const OWNER_EMAIL = "matthew@matthewcawood.com";
const BUCKET    = "community-uploads";

/* ── SVG icon strings (used in card / button innerHTML) ─────────────────── */
const SVG_YT   = `<svg viewBox="0 0 16 16" width="13" height="13" fill="currentColor" style="display:inline;vertical-align:-2px;margin-right:5px"><polygon points="4,2 14,8 4,14"/></svg>`;
const SVG_BLOG = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-2px;margin-right:5px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`;
const SVG_POST = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-2px;margin-right:5px"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 9.5-9.5z"/></svg>`;
const SVG_CMT  = `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-2px;margin-right:5px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;
const SVG_EDIT = `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-1px;margin-right:3px"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 9.5-9.5z"/></svg>`;

let myEmail = null, myName = null, myAvatarUrl = null, isAdmin = false;
let _posts         = [];
let _commentsOpen  = new Set();   // post IDs with visible comments
let _commentsLoaded= new Set();   // post IDs where Comments.load() has been called
let _embeddedYt    = new Set();   // YT post IDs with inline embed active
let _activeFilter  = "all";
let _cfTab         = "youtube";
let _editPostId    = null;
let _editPoll      = null;          // existing poll on the post being edited (for reconcile on save)
let _ytTimer       = null;
let _likerAvatarMap = {};
let _cfLikersMap   = {}; // postId → [email, ...] kept in sync on react/unreact
let _postImages    = [];          // { file, objectUrl } for Post tab image upload
let _toolbarInjected = false;

/* ── Auth ─────────────────────────────────────────────────────────────────── */
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail    = session.user.email;
  const { data: ae } = await db.from("allowed_emails")
    .select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName      = ae?.name || myEmail.split("@")[0];
  myAvatarUrl = ae?.avatar_url || null;
  isAdmin     = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "studio", avatarUrl: myAvatarUrl });
  initMemberModal({ db, myEmail });

  initCommentsSystem({
    db,
    auth: { email: myEmail, name: myName, avatarUrl: myAvatarUrl, isAdmin },
    comments:  { table: 'content_feed_comments', parentField: 'post_id' },
    reactions: { table: 'content_feed_likes',    parentField: 'post_id' },
    commentReactionEventType: 'content_comment',
    replyNotificationLinkFn: (parentId) => `/content-feed.html?post=${parentId}`,
    ownerEmail: OWNER_EMAIL,
    ownerNotifyTitleFn:   (name) => `${name} commented on your content`,
    ownerReactionTitleFn: (name, emoji) => `${name} reacted ${emoji} to your content`,
    onReactionChange: (parentId) => {
      const rxData = Comments.getReactionState(parentId);
      let total = 0, iMine = false;
      for (const d of Object.values(rxData)) { total += d.count; if (d.mine) iMine = true; }
      const p = _posts.find(x => x.id === parentId);
      const cc = p?.commentCount || 0;
      _setMeta(parentId, total, cc);
      // Sync _cfLikersMap and re-render chips
      if (!_cfLikersMap[parentId]) _cfLikersMap[parentId] = [];
      if (iMine && !_cfLikersMap[parentId].includes(myEmail)) {
        if (!_likerAvatarMap[myEmail]) _likerAvatarMap[myEmail] = { url: myAvatarUrl, name: myName };
        _cfLikersMap[parentId].unshift(myEmail);
      } else if (!iMine) {
        _cfLikersMap[parentId] = _cfLikersMap[parentId].filter(e => e !== myEmail);
      }
      _updateLikerChips(parentId);
    },
    onCommentChange: (parentId) => {
      const listEl = document.getElementById(`tc-comments-list-${parentId}`);
      const count  = listEl ? listEl.querySelectorAll('.tc-comment-item').length : 0;
      const p = _posts.find(x => x.id === parentId);
      if (p) p.commentCount = count;
      const rxData = Comments.getReactionState(parentId);
      let total = 0;
      for (const d of Object.values(rxData)) total += d.count;
      _setMeta(parentId, total, count);
      // Update button label
      const btn = document.getElementById(`cf-cmt-btn-${parentId}`);
      if (btn && _commentsOpen.has(parentId)) btn.innerHTML = "Hide comments ↑";
      else if (btn) btn.innerHTML = `${SVG_CMT}Comments${count ? ` (${count})` : ""}`;
    },
  });

  if (isAdmin) document.getElementById("cf-new-btn").style.display = "";
  document.getElementById("cf-main").style.display = "";

  const deepId = new URLSearchParams(window.location.search).get("post");
  await loadFeed(deepId);
})();

function _likerChipsInner(postId) {
  const likers = (_cfLikersMap[postId] || []).slice(0, 3);
  const total  = (_cfLikersMap[postId] || []).length;
  if (!total) return "";
  const chips = likers.map(email => {
    const info  = _likerAvatarMap[email];
    const name  = info?.name || email.split("@")[0];
    const col   = _avatarColour(email);
    const inner = info?.url
      ? `<img src="${_esc(info.url)}" alt="${_esc(name)}">`
      : `<span style="background:${col.bg};color:${col.fg};width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:800;border-radius:50%">${name[0].toUpperCase()}</span>`;
    return `<div class="tc-like-chip">${inner}</div>`;
  }).join("");
  return chips + (total > 3 ? `<span style="font-size:.72rem;color:var(--text-muted);margin-left:6px">+${total - 3}</span>` : "");
}

function _updateLikerChips(postId) {
  document.querySelectorAll(`.cf-likers-${postId}`).forEach(el => {
    const inner = _likerChipsInner(postId);
    el.innerHTML = inner;
    el.style.display = inner ? "" : "none";
  });
}

function _setMeta(parentId, totalRx, cc) {
  // Reactions live on the heart + liker avatars; meta shows comments only.
  const cmtPart = cc      ? `<span onclick="event.stopPropagation();showCfDetail('${parentId}')" style="cursor:pointer">${cc} comment${cc!==1?"s":""}</span>` : "";
  const html = cmtPart;
  document.querySelectorAll(`.cf-meta-${parentId}`).forEach(el => el.innerHTML = html);
}

/* ── Load feed ────────────────────────────────────────────────────────────── */
async function loadFeed(deepId = null) {
  const feed = document.getElementById("cf-feed");
  feed.innerHTML = '<div class="cf-empty"><div class="loading-spinner" style="margin:0 auto 12px"></div>Loading…</div>';

  const { data: rows, error } = await db
    .from("content_feed_posts")
    .select("*")
    .order("published_at", { ascending: false });

  if (error || !rows) {
    feed.innerHTML = '<div class="cf-empty">Could not load feed.</div>';
    return;
  }
  if (!rows.length) {
    feed.innerHTML = `<div class="cf-empty">Nothing here yet${isAdmin ? " — publish the first post above!" : "."}</div>`;
    return;
  }

  // Normalise media items: imported posts use snake_case playback_id,
  // but renderers expect camelCase playbackId. Coerce once here.
  rows.forEach(r => {
    if (Array.isArray(r.media)) {
      r.media = r.media.map(m => {
        if (m.type === "mux" && m.playback_id && !m.playbackId) {
          return { ...m, playbackId: m.playback_id };
        }
        return m;
      });
    }
  });

  const ids = rows.map(r => r.id);
  const [{ data: allLikes }, { data: cmtRows }] = await Promise.all([
    db.from("content_feed_likes").select("post_id,email,emoji").in("post_id", ids),
    db.from("content_feed_comments").select("post_id").in("post_id", ids),
  ]);

  await Comments.loadReactions(ids);

  // Build maps
  const cmtCountMap = {}, likersMap = {};
  _cfLikersMap = {};
  (allLikes || []).forEach(l => {
    if (!likersMap[l.post_id]) likersMap[l.post_id] = [];
    if (likersMap[l.post_id].length < 3) likersMap[l.post_id].push(l.email);
    if (!_cfLikersMap[l.post_id]) _cfLikersMap[l.post_id] = [];
    if (!_cfLikersMap[l.post_id].includes(l.email)) _cfLikersMap[l.post_id].push(l.email);
  });
  (cmtRows || []).forEach(c => cmtCountMap[c.post_id] = (cmtCountMap[c.post_id] || 0) + 1);

  // Avatar map for likers
  const likerEmails = [...new Set((allLikes || []).map(l => l.email))];
  if (likerEmails.length) {
    const { data: likerRows } = await db.from("allowed_emails")
      .select("email,avatar_url,name").in("email", likerEmails);
    (likerRows || []).forEach(r => { _likerAvatarMap[r.email] = { url: r.avatar_url, name: r.name }; });
  }

  // Polls attached to posts (content_feed_post_polls). Mirror community's shape:
  // poll = { id, question, options:[{id,label}], voteCounts:{optId:n}, totalVotes, myVote }
  const pollMap = {};
  const { data: pollRows } = await db.from("content_feed_post_polls").select("id,post_id,question").in("post_id", ids);
  (pollRows || []).forEach(pr => { pollMap[pr.post_id] = { id: pr.id, question: pr.question }; });
  const pollIds = (pollRows || []).map(pr => pr.id);
  if (pollIds.length) {
    const [{ data: optRows }, { data: voteRows }, { data: myVoteRows }] = await Promise.all([
      db.from("content_feed_post_poll_options").select("id,poll_id,label,position").in("poll_id", pollIds).order("position"),
      db.from("content_feed_post_poll_votes").select("poll_id,option_id,email").in("poll_id", pollIds),
      db.from("content_feed_post_poll_votes").select("poll_id,option_id").eq("email", myEmail).in("poll_id", pollIds),
    ]);
    const optsByPoll = {}, vcByPoll = {}, totByPoll = {}, myByPoll = {}, votersByPoll = {};
    (optRows || []).forEach(o => { (optsByPoll[o.poll_id] = optsByPoll[o.poll_id] || []).push(o); });
    (voteRows || []).forEach(v => {
      if (!vcByPoll[v.poll_id]) vcByPoll[v.poll_id] = {};
      vcByPoll[v.poll_id][v.option_id] = (vcByPoll[v.poll_id][v.option_id] || 0) + 1;
      totByPoll[v.poll_id] = (totByPoll[v.poll_id] || 0) + 1;
      if (!votersByPoll[v.poll_id]) votersByPoll[v.poll_id] = {};
      (votersByPoll[v.poll_id][v.option_id] = votersByPoll[v.poll_id][v.option_id] || []).push(v.email);
    });
    (myVoteRows || []).forEach(v => { myByPoll[v.poll_id] = v.option_id; });
    // Admin only: resolve voter names so the owner can see who picked what.
    const voterNameMap = {};
    if (isAdmin) {
      const voterEmails = [...new Set((voteRows || []).map(v => v.email))];
      if (voterEmails.length) {
        const { data: nameRows } = await db.from("allowed_emails").select("email,name").in("email", voterEmails);
        (nameRows || []).forEach(r => { voterNameMap[r.email] = r.name || r.email.split("@")[0]; });
      }
    }
    Object.values(pollMap).forEach(pm => {
      pm.options    = optsByPoll[pm.id]  || [];
      pm.voteCounts = vcByPoll[pm.id]    || {};
      pm.totalVotes = totByPoll[pm.id]   || 0;
      pm.myVote     = myByPoll[pm.id]    || null;
      if (isAdmin) {
        pm.voters = {};
        const vb = votersByPoll[pm.id] || {};
        Object.keys(vb).forEach(optId => { pm.voters[optId] = vb[optId].map(e => voterNameMap[e] || e.split("@")[0]); });
      }
    });
  }

  _posts = rows.map(r => {
    const rxData = Comments.getReactionState(r.id);
    let totalRx = 0;
    for (const d of Object.values(rxData)) totalRx += d.count;
    return { ...r, likeCount: totalRx, commentCount: cmtCountMap[r.id] || 0, likers: likersMap[r.id] || [], poll: pollMap[r.id] || null };
  });

  renderFeed();

  if (deepId) {
    showCfDetail(deepId, false);
  }
}

/* ── Render ───────────────────────────────────────────────────────────────── */
function renderFeed() {
  const feed     = document.getElementById("cf-feed");
  const filtered = _activeFilter === "all" ? _posts : _posts.filter(p => p.type === _activeFilter);
  if (!filtered.length) {
    feed.innerHTML = `<div class="cf-empty">No ${_activeFilter === "all" ? "" : _activeFilter + " "}posts yet.</div>`;
    return;
  }
  feed.innerHTML = filtered.map(cfCardHTML).join("");
  // Stagger the cards in to match the community feed.
  feed.classList.remove("feed-arrive");
  void feed.offsetWidth;
  feed.classList.add("feed-arrive");
  // Re-open any previously open comment sections
  _commentsOpen.forEach(id => {
    const wrap = document.getElementById(`cf-cmt-wrap-${id}`);
    if (wrap) wrap.style.display = "";
  });
}

function cfCardHTML(p) {
  const dateStr  = formatDate(p.published_at);
  const editBtn  = _adminMenuHTML(p.id);

  const rxData = Comments.getReactionState(p.id);
  let totalRx = 0;
  for (const d of Object.values(rxData)) totalRx += d.count;

  const safeKey  = `cf_${p.id.replace(/-/g,'_')}`;
  const reactBtn = Comments.reactBtnHtml(p.id, safeKey);

  // Liker chips
  const likerChips = (p.likers || []).map(email => {
    const info  = _likerAvatarMap[email];
    const name  = info?.name || email.split("@")[0];
    const col   = _avatarColour(email);
    const inner = info?.url
      ? `<img src="${_esc(info.url)}" alt="${_esc(name)}">`
      : `<span style="background:${col.bg};color:${col.fg};width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:800;border-radius:50%">${name[0].toUpperCase()}</span>`;
    return `<div class="tc-like-chip">${inner}</div>`;
  }).join("");
  const likeAvatars = totalRx > 0
    ? `<span class="tc-like-avatars" onclick="event.stopPropagation();Comments.showLikers('${p.id}',event)" style="cursor:pointer;margin-left:4px" title="See who reacted">${likerChips}${totalRx > 3 ? `<span style="font-size:.72rem;color:var(--text-muted);margin-left:6px">+${totalRx - 3}</span>` : ""}</span>`
    : "";

  const cmtPart  = p.commentCount ? `<span onclick="event.stopPropagation();showCfDetail('${p.id}')" style="cursor:pointer">${p.commentCount} comment${p.commentCount!==1?"s":""}</span>` : "";
  const metaTxt  = cmtPart;

  const cmtOpen   = _commentsOpen.has(p.id);
  const cmtBtnTxt = cmtOpen ? "Hide comments ↑" : `${SVG_CMT}Comments${p.commentCount ? ` (${p.commentCount})` : ""}`;

  return `
    <div class="cf-card type-${_esc(p.type)}" id="cf-${p.id}" onclick="showCfDetail('${p.id}')" style="cursor:pointer">
      <div class="cf-card-hdr type-${_esc(p.type)}">
        <span class="cf-type-badge">${_typeBadge(p.type)}</span>
        <span class="cf-card-date">${dateStr}</span>
        ${editBtn}
      </div>
      <div class="cf-card-body" id="cf-body-${p.id}">${_cardBody(p)}</div>
      <div class="cf-card-footer" onclick="event.stopPropagation()">
        ${reactBtn}
        <button class="cf-footer-btn" onclick="showCfDetail('${p.id}')">
          ${SVG_CMT}${p.commentCount ? ` ${p.commentCount}` : ""}
        </button>
        ${window.SavedPosts ? SavedPosts.buttonHTML('content_feed', p.id, { className: 'sp-save-ghost', labelled: false }) : ''}
        <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
          <span class="tc-like-avatars cf-likers-${p.id}" onclick="event.stopPropagation();Comments.showLikers('${p.id}',event)"
            style="cursor:pointer;${totalRx===0?"display:none":""}" title="See who reacted">${_likerChipsInner(p.id)}</span>
          <span class="cf-meta-counts cf-meta-${p.id}">${metaTxt}</span>
        </div>
      </div>
    </div>`;
}

function _cardBody(p) {
  let body;
  if (p.type === "youtube") body = _ytBody(p);
  else if (p.type === "blog") body = _blogBody(p);
  else body = _postBody(p);
  return body + _cfPollHtml(p);
}

/* Inline poll on a content-feed post (mirrors community's card poll). */
function _cfPollHtml(p) {
  const poll = p.poll;
  if (!poll || !poll.options?.length) return "";
  const hasVoted = !!poll.myVote || isAdmin; // the owner (author) always sees results
  const COLORS = ["#8b5cf6","#f59e0b","#3b82f6","#ec4899","#10b981","#f97316","#06b6d4","#ef4444"]; // site category palette
  let html = `<div class="cf-poll" onclick="event.stopPropagation()"><div class="cf-poll-q">${_esc(poll.question)}</div>`;
  if (!hasVoted) {
    html += poll.options.map((o, i) =>
      `<button class="cf-poll-btn" style="border-left-color:${COLORS[i % COLORS.length]}" onclick="castCfVote(event,'${_esc(poll.id)}','${_esc(o.id)}','${p.id}')">${_esc(o.label)}</button>`
    ).join("");
  } else {
    html += poll.options.map((o, i) => {
      const c      = COLORS[i % COLORS.length];
      const count  = poll.voteCounts[o.id] || 0;
      const pct    = poll.totalVotes > 0 ? Math.round(count / poll.totalVotes * 100) : 0;
      const isMine = o.id === poll.myVote;
      const voters = (isAdmin && poll.voters && poll.voters[o.id]) ? poll.voters[o.id] : null;
      const votersHtml = (voters && voters.length) ? `<div class="cf-poll-voters">${voters.map(n => _esc(n)).join(", ")}</div>` : "";
      return `<div class="cf-poll-bar-row${isMine ? " mine" : ""}" style="border-left-color:${c}" onclick="castCfVote(event,'${_esc(poll.id)}','${_esc(o.id)}','${p.id}')">
        <div class="cf-poll-bar-track"><div class="cf-poll-bar-fill" style="width:${pct}%;background:${c}"></div></div>
        <div class="cf-poll-bar-meta"><span>${_esc(o.label)}${isMine ? " <span class='cf-poll-mine'>● you</span>" : ""}</span><span class="cf-poll-pct">${pct}%</span></div>
        ${votersHtml}
      </div>`;
    }).join("");
    const clearBtn = poll.myVote
      ? `<button class="cf-poll-clear" onclick="castCfVote(event,'${_esc(poll.id)}','${_esc(poll.myVote)}','${p.id}')">Clear my vote</button>`
      : "";
    html += `<div class="cf-poll-footer">${clearBtn}<span class="cf-poll-total">${poll.totalVotes} vote${poll.totalVotes !== 1 ? "s" : ""}</span></div>`;
  }
  return html + `</div>`;
}

async function castCfVote(ev, pollId, optionId, postId) {
  if (ev && ev.stopPropagation) ev.stopPropagation();
  // Capture the clicked card body NOW — ev.currentTarget is null'd once the awaits
  // below run, and the fallback id only matches the (possibly hidden) feed card.
  const container = (ev && ev.currentTarget && ev.currentTarget.closest)
    ? ev.currentTarget.closest(".cf-card-body")
    : document.getElementById("cf-body-" + postId);
  const post = _posts.find(p => p.id === postId);
  // Tapping your current choice (or "Clear my vote") removes the vote; otherwise (re)cast it.
  const removing = post?.poll?.myVote === optionId;
  if (removing) {
    const { error } = await db.from("content_feed_post_poll_votes").delete().eq("poll_id", pollId).eq("email", myEmail);
    if (error) { alert("Couldn't update vote: " + error.message); return; }
  } else {
    const { error } = await db.from("content_feed_post_poll_votes").upsert(
      { poll_id: pollId, option_id: optionId, email: myEmail }, { onConflict: "poll_id,email" });
    if (error) { alert("Couldn't cast vote: " + error.message); return; }
  }
  if (post?.poll) {
    const { data: votes } = await db.from("content_feed_post_poll_votes").select("option_id,email").eq("poll_id", pollId);
    const voteCounts = {};
    (votes || []).forEach(v => { voteCounts[v.option_id] = (voteCounts[v.option_id] || 0) + 1; });
    post.poll.voteCounts = voteCounts;
    post.poll.totalVotes = (votes || []).length;
    post.poll.myVote     = (votes || []).find(v => v.email === myEmail)?.option_id || null;
    // Re-render the exact card body the click came from (captured above, pre-await).
    if (container) container.innerHTML = _cardBody(post);
  }
}

function _ytBody(p) {
  const ytId = _esc(p.youtube_id || "");
  const title = _esc(p.title || "");
  if (_embeddedYt.has(p.id)) {
    return `<div class="cf-yt-embed"><iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" allowfullscreen loading="lazy"></iframe></div><div class="cf-card-title">${title}</div>`;
  }
  return `
    <div class="cf-yt-thumb" onclick="event.stopPropagation();embedYt('${p.id}', this)">
      <img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" alt="${title}" loading="lazy" />
      <div class="cf-yt-play"><div class="cf-yt-play-btn"><div class="cf-yt-play-icon"></div></div></div>
    </div>
    <div class="cf-card-title">${title}</div>`;
}

function _blogBody(p) {
  const url  = _esc(p.url || "#");
  const bulletData = (Array.isArray(p.media) ? p.media : []).find(m => m.type === "bullets");
  const bulletsHtml = bulletData?.items?.length
    ? `<p class="cf-blog-intro">In this week's article:</p>
       <ul class="cf-blog-bullets">${bulletData.items.map((item, i) =>
        `<li class="cf-blog-bullet">
          <span class="cf-blog-bullet-num">${i + 1}</span>
          <span class="cf-blog-bullet-text">${_esc(item)}</span>
        </li>`).join("")}</ul>`
    : "";
  return `
    <div class="cf-card-title">${_esc(p.title || "")}</div>
    ${bulletsHtml}
    <a href="${url}" target="_blank" rel="noopener" class="cf-blog-link">Read post ↗</a>`;
}

function _postBody(p) {
  const title   = p.title ? `<div class="cf-card-title">${_esc(p.title)}</div>` : "";
  const body    = p.body  ? `<div class="cf-post-body">${(window.renderUserContent?renderUserContent(p.body):_esc(p.body))}</div>`   : "";
  const media   = (Array.isArray(p.media) && p.media.length && window._tcRenderMedia)
    ? `<div class="cf-post-media">${window._tcRenderMedia({ media: p.media })}</div>`
    : "";
  return `${title}${body}${media}`;
}

function _typeBadge(type) {
  if (type === "youtube") return `${SVG_YT}YouTube`;
  if (type === "blog")    return `${SVG_BLOG}Monday Music Tips`;
  return `${SVG_POST}Post`;
}

/* ── Embed YouTube inline ────────────────────────────────────────────────── */
/* ── Post detail view ────────────────────────────────────────────────────── */
let _openedInPage = false; // true when a post was opened by tapping a card on the list

// Pause any playing videos (mux-player + native <video>) inside a container, so a
// feed video doesn't keep running behind the detail view, and the detail video
// stops on the way out. Mirrors community.html's _pauseVideosIn.
let _cfFeedScrollY = 0;
let _cfDetailPid = null;   // post currently shown in the detail view
function _cfPauseVideosIn(sel) {
  document.querySelectorAll(`${sel} mux-player, ${sel} video`).forEach(v => { try { v.pause(); } catch (e) {} });
  // YouTube iframes have no .pause() and keep playing (even hidden). Stop them:
  // a feed card reverts to its thumbnail (clean + no re-autoplay); anywhere else
  // (the detail view) the iframe is simply removed.
  document.querySelectorAll(`${sel} iframe`).forEach(f => {
    try {
      const body = f.closest('[id^="cf-body-"]');
      if (body) {
        const pid = body.id.slice("cf-body-".length);
        _embeddedYt.delete(pid);
        const p = _posts.find(x => x.id === pid);
        body.innerHTML = p ? _cardBody(p) : "";
      } else {
        f.remove();                       // detail iframe: just remove it
        if (_cfDetailPid) _embeddedYt.delete(_cfDetailPid);  // keep embed state honest
      }
    } catch (e) {}
  });
}

function showCfDetail(postId, push = true) {
  const p = _posts.find(x => x.id === postId);
  if (!p) return;

  _cfDetailPid = postId;             // track which post the detail view is showing
  _cfFeedScrollY = window.scrollY;   // remember feed position to restore on Back
  _cfPauseVideosIn("#cf-main");      // stop the feed video before hiding it
  document.getElementById("cf-main").style.display = "none";
  document.getElementById("cf-detail").style.display = "";
  window.scrollTo(0, 0);
  // Only add a history entry for in-page navigation. On a deep-link (push=false)
  // the current entry IS this post, so Back returns to the referring page.
  if (push) { _openedInPage = true; history.pushState({ post: postId }, "", "?post=" + postId); }

  const rxData = Comments.getReactionState(p.id);
  let totalRx = 0;
  for (const d of Object.values(rxData)) totalRx += d.count;
  const safeKey  = `cf_det_${p.id.replace(/-/g,'_')}`;
  const reactBtn = Comments.reactBtnHtml(p.id, safeKey);

  const d = new Date(p.published_at || p.created_at);
  const day = d.getDate();
  const suffix = day===1||day===21||day===31?"st":day===2||day===22?"nd":day===3||day===23?"rd":"th";
  const dateStr = `${day}${suffix} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]} ${d.getFullYear()}`;

  document.getElementById("cf-detail-card").innerHTML = `
    <div class="cf-detail-card type-${_esc(p.type)}">
      <div class="cf-card-hdr type-${_esc(p.type)}">
        <span class="cf-type-badge">${_typeBadge(p.type)}</span>
        <span class="cf-card-date">${dateStr}</span>
        ${_adminMenuHTML(p.id)}
      </div>
      <div class="cf-card-body">${_cardBody(p)}</div>
      <div class="cf-card-footer" onclick="event.stopPropagation()">
        ${reactBtn}
        <div style="margin-left:auto;display:flex;align-items:center;gap:6px">
          <span class="tc-like-avatars cf-likers-${p.id}" onclick="event.stopPropagation();Comments.showLikers('${p.id}',event)"
            style="cursor:pointer;${totalRx===0?"display:none":""}" title="See who reacted">${_likerChipsInner(p.id)}</span>
          <span class="cf-meta-counts cf-meta-${p.id}">${p.commentCount ? `<span>${p.commentCount} comment${p.commentCount!==1?"s":""}</span>` : ""}</span>
        </div>
      </div>
    </div>`;

  document.getElementById("cf-detail-comments").innerHTML = `
    <div class="cf-cmt-wrap">
      <div class="tc-comments-section">
        <div id="tc-comments-hdr-${p.id}" class="tc-comments-hdr">Comments</div>
        <div id="tc-comments-list-${p.id}"></div>
        ${Comments.formHtml(p.id)}
      </div>
    </div>`;

  Comments.load(p.id).then(() => {
    const listEl = document.getElementById(`tc-comments-list-${p.id}`);
    const count  = listEl ? listEl.querySelectorAll('.tc-comment-item').length : 0;
    if (count !== p.commentCount) {
      p.commentCount = count;
      const rxData = Comments.getReactionState(p.id);
      let rx = 0; for (const d of Object.values(rxData)) rx += d.count;
      _setMeta(p.id, rx, count);
    }
  });
}

function closeCfDetail() {
  // Take the user back to where they came from: the in-page list (if they tapped a
  // card) or the referring page like community (if they arrived via a deep-link).
  // Fall back to the list when there's no real back target (direct visit/bookmark).
  let sameOriginRef = false;
  try {
    const u = document.referrer ? new URL(document.referrer) : null;
    sameOriginRef = !!u && u.origin === location.origin && u.pathname !== location.pathname;
  } catch {}
  if (_openedInPage || sameOriginRef) { history.back(); return; }
  _cfPauseVideosIn("#cf-detail");     // stop the detail video on the way out
  document.getElementById("cf-detail").style.display = "none";
  document.getElementById("cf-main").style.display = "";
  window.scrollTo(0, 0);   // deep-link fallback: no saved feed position
  history.replaceState({}, "", "/content-feed.html");
}

window.addEventListener("popstate", (e) => {
  if (e.state?.post) {
    showCfDetail(e.state.post, false);
  } else {
    _cfPauseVideosIn("#cf-detail");   // stop the detail video before hiding it
    document.getElementById("cf-detail").style.display = "none";
    document.getElementById("cf-main").style.display = "";
    window.scrollTo(0, _cfFeedScrollY);  // restore the feed position (no jump to top)
  }
});

function embedYt(postId, thumbEl) {
  _embeddedYt.add(postId);
  const p = _posts.find(x => x.id === postId);
  if (!p) return;
  // Embed where the thumbnail was actually tapped — works in both the feed card
  // and the detail view (whose body has no cf-body-<id> element). Fall back to the
  // feed card body when no element is passed (e.g. programmatic calls).
  const body = (thumbEl && thumbEl.parentElement) || document.getElementById(`cf-body-${postId}`);
  if (body) body.innerHTML = _ytBody(p);
}

/* ── Comments toggle ─────────────────────────────────────────────────────── */
function toggleComments(postId) {
  if (_commentsOpen.has(postId)) {
    _commentsOpen.delete(postId);
    document.getElementById(`cf-cmt-wrap-${postId}`)?.style?.setProperty?.("display","none") ||
      (document.getElementById(`cf-cmt-wrap-${postId}`).style.display = "none");
    const btn = document.getElementById(`cf-cmt-btn-${postId}`);
    const p   = _posts.find(x => x.id === postId);
    if (btn) {
      btn.classList.remove("open");
      btn.innerHTML = `${SVG_CMT}Comments${p?.commentCount ? ` (${p.commentCount})` : ""}`;
    }
  } else {
    openComments(postId);
  }
}

function openComments(postId) {
  _commentsOpen.add(postId);
  const wrap = document.getElementById(`cf-cmt-wrap-${postId}`);
  if (wrap) wrap.style.display = "";
  const btn = document.getElementById(`cf-cmt-btn-${postId}`);
  if (btn) { btn.classList.add("open"); btn.innerHTML = "Hide comments ↑"; }
  if (!_commentsLoaded.has(postId)) {
    _commentsLoaded.add(postId);
    Comments.load(postId);
  }
}

    </div>

function _closePostMenus() {
  document.querySelectorAll(".post-menu").forEach(m => m.style.display = "none");
}
function togglePostMenu(id, e) {
  if (e) e.stopPropagation();
  // Find the menu relative to the clicked button: the feed card and the detail
  // view render the SAME id="post-menu-<id>", so getElementById would grab the
  // (hidden) feed one and the detail menu would never open.
  const btn = e && (e.currentTarget || e.target);
  const menu = (btn && btn.closest)
    ? btn.closest(".post-menu-wrap")?.querySelector(".post-menu")
    : document.getElementById(`post-menu-${id}`);
  if (!menu) return;
  const open = menu.style.display !== "none";
  _closePostMenus();
  if (!open) {
    menu.style.display = "block";
    setTimeout(() => document.addEventListener("click", _closePostMenus, { once: true }), 0);
  }
}

async function deleteCfPost(postId) {
  _closePostMenus();
  if (!confirm("Delete this post permanently? This cannot be undone.")) return;
  const { error } = await db.from("content_feed_posts").delete().eq("id", postId);
  if (error) { alert("Delete failed: " + error.message); return; }
  _posts = _posts.filter(p => p.id !== postId);
  document.getElementById(`cf-${postId}`)?.remove();
  // If we're in the detail view, close it
  if (document.getElementById("cf-detail").style.display !== "none") closeCfDetail();
}

function openEditCfForm(postId) {
  const p = _posts.find(x => x.id === postId);
  if (!p) return;
  // The edit form lives inside #cf-main, which the detail view hides. If we're on
  // the post detail page, swap back to the feed view so the form is visible.
  // (Don't call closeCfDetail() — it may fire history.back() and navigate away.)
  if (document.getElementById("cf-detail").style.display !== "none") {
    _cfPauseVideosIn("#cf-detail");
    document.getElementById("cf-detail").style.display = "none";
    document.getElementById("cf-main").style.display = "";
    if (location.search) history.replaceState({}, "", "/content-feed.html");
  }
  _editPostId = postId;
  document.getElementById("cf-form-title").textContent = "Edit Post";
  document.getElementById("cf-submit-btn").textContent = "Save Changes";
  document.getElementById("cf-form-wrap").style.display = "";
  document.getElementById("cf-new-btn").style.display   = "none";
  switchCfTab(p.type);

  if (p.type === "youtube") {
    const ytUrl = p.youtube_id ? `https://www.youtube.com/watch?v=${p.youtube_id}` : (p.url || "");
    document.getElementById("cfyt-url").value   = ytUrl;
    document.getElementById("cfyt-title").value = p.title || "";
    _setDateFromTs("cfyt-date", p.published_at);
  } else if (p.type === "blog") {
    document.getElementById("cfblog-title").value = p.title || "";
    document.getElementById("cfblog-url").value   = p.url   || "";
    _setDateFromTs("cfblog-date", p.published_at);
    const bulletData = (Array.isArray(p.media) ? p.media : []).find(m => m.type === "bullets");
    const items = bulletData?.items || [];
    document.getElementById("cfblog-b1").value = items[0] || "";
    document.getElementById("cfblog-b2").value = items[1] || "";
    document.getElementById("cfblog-b3").value = items[2] || "";
  } else {
    document.getElementById("cfpost-title").value = p.title || "";
    document.getElementById("cfpost-body").value  = p.body  || "";
    _setDateFromTs("cfpost-date", p.published_at);
    _postImages = [];
    document.getElementById("cfpost-img-grid").innerHTML = "";
    // Load any existing poll into the composer so it can be edited in place.
    _editPoll = p.poll || null;
    if (p.poll) _loadPollIntoComposer(p.poll);
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// Populate the shared-comments poll builder (key "cfp") from an existing poll.
function _loadPollIntoComposer(poll) {
  // The toolbar is injected by switchCfTab("post"); open the poll panel if closed.
  const panel = document.getElementById("inline-poll-cfp");
  if (!panel) return;
  if (panel.style.display === "none" && typeof window.toggleInlinePoll === "function") {
    window.toggleInlinePoll("cfp");
  }
  const q = document.getElementById("inline-poll-q-cfp");
  if (q) q.value = poll.question || "";
  const list = document.getElementById("inline-poll-opts-cfp");
  if (!list) return;
  const labels = (poll.options || []).map(o => o.label);
  while (list.querySelectorAll(".poll-option-input").length < Math.max(2, labels.length)) {
    window.addInlinePollOption?.("cfp");
  }
  list.querySelectorAll(".poll-option-input").forEach((inp, i) => { inp.value = labels[i] || ""; });
}

function closeCfForm() {
  _editPostId = null;
  _editPoll   = null;
  // Clean up object URLs
  _postImages.forEach(img => URL.revokeObjectURL(img.objectUrl));
  _postImages = [];
  document.getElementById("cfpost-img-grid").innerHTML = "";
  document.getElementById("cf-form-wrap").style.display = "none";
  document.getElementById("cf-new-btn").style.display   = "";
  // Clear inline toolbar state if it was injected
  if (_toolbarInjected) {
    window._clearInlineState?.("cfp");
  }
}

function switchCfTab(tab) {
  // Report the exact sub-view to presence ("live now").
  window._shPageDetail = ({ youtube: "Content · Videos", blog: "Content · Articles", post: "Content · Community Posts" })[tab] || "Content Feed";
  if (window._shPing) window._shPing();
  _cfTab = tab;
  ["youtube","blog","post"].forEach(t => {
    document.getElementById(`cf-tab-${t}`).style.display = (t === tab) ? "" : "none";
    const btn = document.getElementById(`tab-${t}`);
    if (btn) btn.className = `cf-type-tab${t === tab ? " active-" + t : ""}`;
  });
  // Bottom actions: hidden for Post tab (has its own submit)
  document.getElementById("cf-form-actions-main").style.display = tab === "post" ? "none" : "";
  // Inject shared-comments toolbar into Post tab on first use
  if (tab === "post" && !_toolbarInjected && window._inlineToolbarHtml) {
    const area = document.getElementById("cfpost-toolbar-area");
    if (area) {
      area.innerHTML = window._inlineToolbarHtml("cfp");
      _toolbarInjected = true;
    }
  }
}

/* ── Post images (Post tab) ─────────────────────────────────────────────── */
// Note: the shared-comments toolbar (injected for the Post tab) handles image/video uploads
// into its own internal state for rich comment-style media.
// We ALSO provide a dedicated image grid for post-level images (uploaded on submit).
// This handles images picked via the standard shared toolbar.
// For simplicity: images selected via toolbar go into _postImages via the standard
// toolbar flow (handled by shared-comments.js internally via key "cfp").
// On submit we read them out via Comments.readMedia?.('cfp') if available,
// falling back to just the text content.


/* ── Publish / save ──────────────────────────────────────────────────────── */
async function publishCfPost() {
  const isPost = _cfTab === "post";
  const btn = document.getElementById(isPost ? "cfpost-submit" : "cf-submit-btn");
  if (!btn || btn.disabled) return;

  let payload = {};

  if (_cfTab === "youtube") {
    const url   = document.getElementById("cfyt-url").value.trim();
    const title = document.getElementById("cfyt-title").value.trim();
    const dateV = document.getElementById("cfyt-date").value;
    if (!url || !title) { alert("Please add a YouTube URL and title."); return; }
    const ytId = _extractYtId(url);
    if (!ytId) { alert("Couldn't extract a video ID from that URL."); return; }
    payload = { type:"youtube", title, url, youtube_id:ytId, body:"", media:[], published_at: _toIso(dateV) };

  } else if (_cfTab === "blog") {
    const title = document.getElementById("cfblog-title").value.trim();
    const url   = document.getElementById("cfblog-url").value.trim();
    const dateV = document.getElementById("cfblog-date").value;
    if (!title || !url) { alert("Please add a title and URL."); return; }
    const bullets = [
      document.getElementById("cfblog-b1").value.trim(),
      document.getElementById("cfblog-b2").value.trim(),
      document.getElementById("cfblog-b3").value.trim(),
    ].filter(Boolean);
    const media = bullets.length ? [{ type: "bullets", items: bullets }] : [];
    payload = { type:"blog", title, url, body:"", media, published_at: _toIso(dateV) };

  } else {
    // Post type — read text + any media from shared-comments toolbar
    const title = document.getElementById("cfpost-title").value.trim();
    const body  = document.getElementById("cfpost-body").value.trim();
    const dateV = document.getElementById("cfpost-date").value;
    if (!title && !body) { alert("Please add a title or some content."); return; }

    // Read media from shared-comments.js internal state (key "cfp")
    // The toolbar uploads images to storage and stores finalized URLs in _inlineMedia["cfp"].
    // We access them via the module's internal state (it's a plain object reference).
    // Since we can't access it directly, use whatever is in the preview area as fallback.
    // Media will be gathered from Comments.readMedia if available (added in shared-comments.js).
    const media = (typeof Comments.readMedia === "function") ? Comments.readMedia("cfp") : [];
    payload = { type:"post", title, body, url:null, youtube_id:null, media, published_at: _toIso(dateV) };
  }

  btn.disabled = true;
  const origText = btn.textContent;

  if (_editPostId) {
    btn.textContent = "Saving…";
    const { error } = await db.from("content_feed_posts").update(payload).eq("id", _editPostId);
    if (error) { alert("Failed to save: " + error.message); btn.disabled = false; btn.textContent = origText; return; }

    // Reconcile the poll (post type only — other tabs have no poll builder).
    if (_cfTab === "post") {
      const _pollPanel = document.getElementById("inline-poll-cfp");
      const _pollOpen  = _pollPanel && _pollPanel.style.display !== "none";
      const pollData = (_pollOpen && typeof Comments.readPoll === "function") ? Comments.readPoll("cfp") : null;
      const wantPoll = !!(pollData && pollData.question && pollData.options?.length >= 2);
      const existing = _editPoll;
      try {
        if (existing && !wantPoll) {
          // Poll removed — delete it (cascades options + votes).
          await db.from("content_feed_post_polls").delete().eq("id", existing.id);
        } else if (!existing && wantPoll) {
          // Poll added during edit.
          const { data: pr } = await db.from("content_feed_post_polls")
            .insert({ post_id: _editPostId, question: pollData.question }).select().single();
          if (pr) await db.from("content_feed_post_poll_options")
            .insert(pollData.options.map((label, i) => ({ poll_id: pr.id, label, position: i })));
        } else if (existing && wantPoll) {
          // Poll edited. Update the question if changed (votes untouched).
          if (pollData.question !== existing.question) {
            await db.from("content_feed_post_polls").update({ question: pollData.question }).eq("id", existing.id);
          }
          // Reconcile options BY POSITION so votes survive label edits (e.g. typo
          // fixes). Each option keeps its id — and votes point at the id — so an
          // in-place label UPDATE leaves existing votes intact. We only ever lose
          // votes for an option that is actually removed.
          const oldOpts   = (existing.options || []).slice().sort((a, b) => (a.position || 0) - (b.position || 0));
          const newLabels = pollData.options;
          const matched   = Math.min(oldOpts.length, newLabels.length);
          // 1. Update changed labels in place (same id → votes preserved).
          for (let i = 0; i < matched; i++) {
            if (oldOpts[i].label !== newLabels[i] || (oldOpts[i].position || 0) !== i) {
              await db.from("content_feed_post_poll_options")
                .update({ label: newLabels[i], position: i }).eq("id", oldOpts[i].id);
            }
          }
          // 2. Insert any added options (existing votes untouched).
          if (newLabels.length > oldOpts.length) {
            await db.from("content_feed_post_poll_options").insert(
              newLabels.slice(oldOpts.length).map((label, k) => ({ poll_id: existing.id, label, position: oldOpts.length + k }))
            );
          }
          // 3. Delete only the removed options (only those options' votes are lost).
          if (oldOpts.length > newLabels.length) {
            const removeIds = oldOpts.slice(newLabels.length).map(o => o.id);
            await db.from("content_feed_post_poll_options").delete().in("id", removeIds);
          }
        }
      } catch (e) { console.warn("poll reconcile failed", e); }
    }

    closeCfForm();
    btn.disabled = false; btn.textContent = origText;
    _editPostId = null;
    await loadFeed();

  } else {
    btn.textContent = "Publishing…";
    const { data: post, error } = await db.from("content_feed_posts").insert(payload).select().single();
    if (error) { alert("Failed to publish: " + error.message); btn.disabled = false; btn.textContent = origText; return; }

    // Save a poll only if the poll builder is actually open with valid data.
    // (Mirrors shared-comments' _inlinePollOpen gate — the panel is hidden after
    // each publish via _clearInlineState, so stale inputs aren't re-saved to the
    // next post that didn't intend a poll.)
    const _pollPanel = document.getElementById("inline-poll-cfp");
    const _pollOpen  = _pollPanel && _pollPanel.style.display !== "none";
    const pollData = (_pollOpen && typeof Comments.readPoll === "function") ? Comments.readPoll("cfp") : null;
    if (pollData && pollData.question && pollData.options?.length >= 2 && post) {
      const { data: pollRow, error: pollErr } = await db.from("content_feed_post_polls")
        .insert({ post_id: post.id, question: pollData.question }).select().single();
      if (!pollErr && pollRow) {
        await db.from("content_feed_post_poll_options")
          .insert(pollData.options.map((label, i) => ({ poll_id: pollRow.id, label, position: i })));
      }
    }

    // Notify members
    btn.textContent = "Notifying members…";
    const notifTitle = payload.type === "youtube" ? "New YouTube Video"
                     : payload.type === "blog"    ? "New Monday Music Tips"
                     :                              "New Post";
    const { data: members } = await db.from("allowed_emails").select("email");
    if (members?.length) {
      const notifications = members.filter(m => m.email !== myEmail).map(m => ({
        email:    m.email,
        type:     "content_feed",
        title:    notifTitle,
        body:     (payload.title || payload.body || "").slice(0, 120),
        link_url: `/content-feed.html?post=${post.id}`,
        metadata: {},
      }));
      if (notifications.length) await db.from("notifications").insert(notifications);
    }

    closeCfForm();
    btn.disabled = false; btn.textContent = origText;
    await loadFeed(post.id);
  }
}

/* ── YouTube auto-title ──────────────────────────────────────────────────── */
function scheduleYtFetch() {
  clearTimeout(_ytTimer);
  _ytTimer = setTimeout(async () => {
    const url  = document.getElementById("cfyt-url")?.value.trim();
    if (!url) return;
    const ytId = _extractYtId(url);
    if (!ytId) return;
    try {
      const res  = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`);
      if (!res.ok) return;
      const data = await res.json();
      const titleEl = document.getElementById("cfyt-title");
      if (titleEl && !titleEl.value) titleEl.value = data.title || "";
    } catch(_) { /* silently ignore */ }
  }, 800);
}

function _extractYtId(url) {
  const m = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

/* ── Utilities ───────────────────────────────────────────────────────────── */
function _setDateNow(inputId) {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  const el = document.getElementById(inputId);
  if (el) el.value = now.toISOString().slice(0, 16);
}

function _setDateFromTs(inputId, ts) {
  if (!ts) return;
  const d = new Date(ts);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  const el = document.getElementById(inputId);
  if (el) el.value = d.toISOString().slice(0, 16);
}

function _toIso(dateVal) {
  return dateVal ? new Date(dateVal).toISOString() : new Date().toISOString();
}

function formatDate(ts) {
  if (!ts) return "";
  const d   = new Date(ts);
  const day = d.getDate();
  const sfx = day===1||day===21||day===31 ? "st" : day===2||day===22 ? "nd" : day===3||day===23 ? "rd" : "th";
  const mon = ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()];
  return `${day}${sfx} ${mon} ${d.getFullYear()}`;
}

function _esc(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function _avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)",fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)",fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)",fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}
