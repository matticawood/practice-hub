<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Feed — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
  <script src="/shared-header.js"></script>
  <script src="/shared-comments.js"></script>
  <style>
    /* ── Theme ──────────────────────────────────────────────────────────────── */
    :root {
      --bg:           #faf7f3;
      --surface:      #ffffff;
      --surface-2:    #f0ebe2;
      --border:       #e0d5c8;
      --text:         #1a1410;
      --text-muted:   #8a7868;
      --accent-subtle:#fdf0d8;
      /* Content type colours */
      --yt-clr:    #dc2626;
      --yt-bg:     rgba(220,38,38,.08);
      --yt-border: rgba(220,38,38,.22);
      --blog-clr:  #4338ca;
      --blog-bg:   rgba(67,56,202,.08);
      --blog-border:rgba(67,56,202,.22);
      --post-clr:  #b8900a;
      --post-bg:   rgba(245,197,24,.12);
      --post-border:rgba(245,197,24,.22);
    }
    body { background: var(--bg); }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    #cf-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    /* ── Page header ─────────────────────────────────────────────────────────── */
    .cf-page-hdr {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .cf-page-hdr h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }
    .cf-page-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Admin form card ────────────────────────────────────────────────────── */
    .cf-form-card {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
    }
    .cf-form-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 18px;
    }

    /* Type tab selector */
    .cf-type-tabs {
      display: flex;
      gap: 0;
      border-bottom: 2px solid var(--border);
      margin-bottom: 22px;
    }
    .cf-type-tab {
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      padding: 8px 18px 10px;
      margin-bottom: -2px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }
    .cf-type-tab:hover { color: var(--text); }
    .cf-type-tab.active-youtube { color: var(--yt-clr);   border-bottom-color: var(--yt-clr); }
    .cf-type-tab.active-blog    { color: var(--blog-clr); border-bottom-color: var(--blog-clr); }
    .cf-type-tab.active-post    { color: var(--post-clr); border-bottom-color: var(--post-clr); }

    .cf-form-field { margin-bottom: 16px; }
    .cf-form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .cf-form-input,
    .cf-form-textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      resize: vertical;
      transition: border-color .15s;
    }
    .cf-form-input:focus,
    .cf-form-textarea:focus { outline: none; border-color: var(--accent); }
    .cf-form-hint { font-size: .76rem; color: var(--text-muted); margin: 4px 0 0; }
    .cf-form-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: flex-end;
    }

    /* Post composer (Post tab) */
    .cf-composer-wrap {
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: var(--surface);
    }
    .cf-composer-body { padding: 14px 16px; }
    .cf-composer-title {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--border);
      padding: 6px 0 10px;
      margin-bottom: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      outline: none;
    }
    .cf-composer-title::placeholder { font-weight: 400; color: var(--text-muted); }
    .cf-composer-title:focus { border-bottom-color: var(--accent); }
    .cf-composer-textarea {
      width: 100%;
      box-sizing: border-box;
      background: transparent;
      border: none;
      resize: none;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.6;
      min-height: 90px;
      padding: 0;
      outline: none;
    }
    .cf-composer-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px 14px;
      border-top: 1.5px solid var(--border);
      background: var(--surface-2);
    }
    /* Post image previews */
    .cf-img-preview-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .cf-img-thumb {
      position: relative;
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      border: 1.5px solid var(--border);
      flex-shrink: 0;
    }
    .cf-img-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .cf-img-remove {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: rgba(0,0,0,.55);
      border: none;
      color: #fff;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      line-height: 1;
    }
    .cf-img-remove:hover { background: #ef4444; }

    /* ── Filter bar ─────────────────────────────────────────────────────────── */
    .cf-filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .cf-filter-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      transition: all .15s;
    }
    .cf-filter-btn:hover { color: var(--text); border-color: #bbb; }
    .cf-filter-btn.active             { background: var(--text);      border-color: var(--text);      color: var(--bg); }
    .cf-filter-btn.cf-yt.active       { background: var(--yt-clr);    border-color: var(--yt-clr);    color: #fff; }
    .cf-filter-btn.cf-blog.active     { background: var(--blog-clr);  border-color: var(--blog-clr);  color: #fff; }
    .cf-filter-btn.cf-post.active     { background: var(--accent);    border-color: var(--accent);    color: #1a1410; }

    /* ── Feed cards ─────────────────────────────────────────────────────────── */
    .cf-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
      transition: border-color .15s;
    }
    .cf-card.type-youtube:hover { border-color: rgba(220,38,38,.35); }
    .cf-card.type-blog:hover    { border-color: rgba(67,56,202,.35); }
    .cf-card.type-post:hover    { border-color: rgba(245,197,24,.4); }

    /* Card header strip */
    .cf-card-hdr {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 18px;
    }
    .cf-card-hdr.type-youtube {
      background: var(--yt-bg);
      border-bottom: 1.5px solid var(--yt-border);
      border-left: 3.5px solid var(--yt-clr);
    }
    .cf-card-hdr.type-blog {
      background: var(--blog-bg);
      border-bottom: 1.5px solid var(--blog-border);
      border-left: 3.5px solid var(--blog-clr);
    }
    .cf-card-hdr.type-post {
      background: var(--post-bg);
      border-bottom: 1.5px solid var(--post-border);
      border-left: 3.5px solid var(--post-clr);
    }
    .cf-type-badge {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
    }
    .type-youtube .cf-type-badge { color: var(--yt-clr); }
    .type-blog    .cf-type-badge { color: var(--blog-clr); }
    .type-post    .cf-type-badge { color: var(--post-clr); }
    .cf-card-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .cf-edit-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      margin-left: 8px;
      transition: background .15s;
    }
    .cf-edit-btn:hover { background: var(--surface-2); border-color: #bbb; }

    /* Card body */
    .cf-card-body { padding: 18px 22px 14px; }

    /* YouTube thumbnail */
    .cf-yt-thumb {
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      cursor: pointer;
      margin-bottom: 12px;
      aspect-ratio: 16 / 9;
    }
    .cf-yt-thumb img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: opacity .2s;
    }
    .cf-yt-thumb:hover img { opacity: .85; }
    .cf-yt-play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .cf-yt-play-btn {
      width: 58px; height: 58px;
      background: rgba(220,38,38,.92);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 18px rgba(0,0,0,.4);
      transition: background .15s, transform .15s;
    }
    .cf-yt-thumb:hover .cf-yt-play-btn {
      background: var(--yt-clr);
      transform: scale(1.07);
    }
    .cf-yt-play-icon {
      width: 0; height: 0;
      border-style: solid;
      border-width: 10px 0 10px 20px;
      border-color: transparent transparent transparent #fff;
      margin-left: 4px;
    }
    .cf-yt-embed {
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      background: #000;
      margin-bottom: 12px;
    }
    .cf-yt-embed iframe { width: 100%; height: 100%; border: 0; display: block; }

    /* Blog */
    .cf-blog-excerpt {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin: 6px 0 14px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cf-blog-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.83rem;
      font-weight: 700;
      color: var(--blog-clr);
      text-decoration: none;
      background: rgba(67,56,202,.07);
      border: 1.5px solid rgba(67,56,202,.2);
      border-radius: 20px;
      padding: 6px 16px;
      transition: background .15s;
    }
    .cf-blog-link:hover { background: rgba(67,56,202,.14); }

    /* Post */
    .cf-post-body {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 4px 0 8px;
    }
    .cf-post-media { margin-top: 10px; }

    /* Card title (shared) */
    .cf-card-title {
      font-size: 1.06rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin: 0 0 4px;
    }

    /* Card footer */
    .cf-card-footer {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 22px 14px;
      flex-wrap: wrap;
    }
    .cf-meta-counts { font-size: 0.8rem; color: var(--text-muted); }
    .cf-cmt-toggle {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      padding: 5px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      font-family: inherit;
      margin-left: auto;
      transition: border-color .15s, color .15s;
    }
    .cf-cmt-toggle:hover,
    .cf-cmt-toggle.open { border-color: var(--accent); color: var(--accent); }

    /* Shared reaction button style */
    .focus-footer-btn, .tc-react-btn {
      background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.83rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 0;
      transition: color .15s;
    }
    .focus-footer-btn:hover, .tc-react-btn:hover { color: var(--text); }
    .tc-react-btn.liked { color: #e53e3e; }

    /* Comments wrap */
    .cf-cmt-wrap {
      border-top: 1.5px solid var(--border);
      padding: 0 22px 22px;
    }
    .cf-cmt-wrap .tc-comments-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 16px;
    }

    /* Empty state */
    .cf-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .cf-card-body { padding: 14px 16px 10px; }
      .cf-card-footer { padding: 8px 16px 12px; }
      .cf-cmt-wrap { padding: 0 14px 14px; }
    }
  </style>
</head>
<body>
  <main>
    <div id="cf-main" style="display:none">

      <!-- Page header -->
      <div class="cf-page-hdr">
        <div>
          <h2>Content Feed</h2>
          <p class="cf-page-desc">YouTube videos, blog posts and resources — by Matthew Cawood.</p>
        </div>
        <button id="cf-new-btn" class="btn btn-primary" onclick="openCfForm()" style="display:none">+ Post</button>
      </div>

      <!-- ── Admin form ──────────────────────────────────────────────────────── -->
      <div id="cf-form-wrap" style="display:none">
        <div class="cf-form-card">
          <h3 id="cf-form-title">New Post</h3>

          <!-- Type tabs -->
          <div class="cf-type-tabs">
            <button class="cf-type-tab" id="tab-youtube" onclick="switchCfTab('youtube')">▶ YouTube</button>
            <button class="cf-type-tab" id="tab-blog"    onclick="switchCfTab('blog')">📝 Blog</button>
            <button class="cf-type-tab" id="tab-post"    onclick="switchCfTab('post')">✏️ Post</button>
          </div>

          <!-- YouTube tab -->
          <div id="cf-tab-youtube">
            <div class="cf-form-field">
              <label class="cf-form-label">YouTube URL</label>
              <input id="cfyt-url" class="cf-form-input" type="url"
                     placeholder="https://www.youtube.com/watch?v=…"
                     oninput="scheduleYtFetch()" />
              <p class="cf-form-hint">Title will be fetched automatically — edit it below if needed.</p>
            </div>
            <div class="cf-form-field">
              <label class="cf-form-label">Title</label>
              <input id="cfyt-title" class="cf-form-input" type="text" placeholder="Auto-filled from YouTube…" />
            </div>
            <div class="cf-form-field">
              <label class="cf-form-label">Published date</label>
              <input id="cfyt-date" class="cf-form-input" type="datetime-local" />
            </div>
          </div>

          <!-- Blog tab -->
          <div id="cf-tab-blog" style="display:none">
            <div class="cf-form-field">
              <label class="cf-form-label">Post title</label>
              <input id="cfblog-title" class="cf-form-input" type="text"
                     placeholder="e.g. Why slow practice is actually faster practice" />
            </div>
            <div class="cf-form-field">
              <label class="cf-form-label">Blog URL</label>
              <input id="cfblog-url" class="cf-form-input" type="url"
                     placeholder="https://matthewcawood.com/blog/…" />
            </div>
            <div class="cf-form-field">
              <label class="cf-form-label">Short description / excerpt</label>
              <textarea id="cfblog-excerpt" class="cf-form-textarea" rows="3"
                        placeholder="One or two sentences summarising what the post covers…"></textarea>
            </div>
            <div class="cf-form-field">
              <label class="cf-form-label">Published date</label>
              <input id="cfblog-date" class="cf-form-input" type="datetime-local" />
            </div>
          </div>

          <!-- Post tab — rich composer -->
          <div id="cf-tab-post" style="display:none">
            <div class="cf-form-field">
              <label class="cf-form-label">Content</label>
              <div class="cf-composer-wrap">
                <div class="cf-composer-body">
                  <input  class="cf-composer-title" id="cfpost-title" type="text"
                          placeholder="Title (optional)…" maxlength="120" />
                  <textarea class="cf-composer-textarea" id="cfpost-body"
                            placeholder="What do you want to share?"
                            oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
                  <!-- Image preview grid -->
                  <div class="cf-img-preview-grid" id="cfpost-img-grid"></div>
                </div>
                <!-- Shared-comments.js inline toolbar injected here -->
                <div id="cfpost-toolbar-area" style="border-top:1.5px solid var(--border);padding:8px 14px;background:var(--surface-2)"></div>
                <div class="cf-composer-footer">
                  <div style="flex:1"></div>
                  <button class="btn btn-ghost btn-sm" onclick="closeCfForm()">Cancel</button>
                  <button id="cfpost-submit" class="btn btn-primary btn-sm" onclick="publishCfPost()">Publish &amp; Notify Members</button>
                </div>
              </div>
            </div>
            <div class="cf-form-field" style="margin-top:12px">
              <label class="cf-form-label">Published date</label>
              <input id="cfpost-date" class="cf-form-input" type="datetime-local" />
            </div>
          </div>

          <!-- Submit / cancel for YouTube + Blog tabs -->
          <div class="cf-form-actions" id="cf-form-actions-main">
            <button class="btn btn-ghost btn-sm" onclick="closeCfForm()">Cancel</button>
            <button id="cf-submit-btn" class="btn btn-primary" onclick="publishCfPost()">Publish &amp; Notify Members</button>
          </div>
        </div>
      </div>

      <!-- ── Filter bar ──────────────────────────────────────────────────────── -->
      <div class="cf-filter-bar">
        <button class="cf-filter-btn active" onclick="setFilter('all',this)">All</button>
        <button class="cf-filter-btn cf-yt"   onclick="setFilter('youtube',this)">▶ YouTube</button>
        <button class="cf-filter-btn cf-blog" onclick="setFilter('blog',this)">📝 Blog</button>
        <button class="cf-filter-btn cf-post" onclick="setFilter('post',this)">✏️ Posts</button>
      </div>

      <!-- ── Feed ───────────────────────────────────────────────────────────── -->
      <div id="cf-feed">
        <div class="cf-empty">
          <div class="loading-spinner" style="margin:0 auto 12px"></div>
          Loading…
        </div>
      </div>

    </div>
  </main>

<script>
/* ──────────────────────────────────────────────────────────────────────────── */
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db        = supabase.createClient(SUPA_URL, SUPA_ANON);
const OWNER_EMAIL = "matthew@matthewcawood.com";
const BUCKET    = "community-uploads";

let myEmail = null, myName = null, myAvatarUrl = null, isAdmin = false;
let _posts         = [];
let _commentsOpen  = new Set();   // post IDs with visible comments
let _commentsLoaded= new Set();   // post IDs where Comments.load() has been called
let _embeddedYt    = new Set();   // YT post IDs with inline embed active
let _activeFilter  = "all";
let _cfTab         = "youtube";
let _editPostId    = null;
let _ytTimer       = null;
let _likerAvatarMap= {};
let _postImages    = [];          // { file, objectUrl } for Post tab image upload
let _toolbarInjected = false;

/* ── Auth ─────────────────────────────────────────────────────────────────── */
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail    = session.user.email;
  const { data: ae } = await db.from("allowed_emails")
    .select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName      = ae?.name || myEmail.split("@")[0];
  myAvatarUrl = ae?.avatar_url || null;
  isAdmin     = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "studio", avatarUrl: myAvatarUrl });

  initCommentsSystem({
    db,
    auth: { email: myEmail, name: myName, avatarUrl: myAvatarUrl, isAdmin },
    comments:  { table: 'content_feed_comments', parentField: 'post_id' },
    reactions: { table: 'content_feed_likes',    parentField: 'post_id' },
    replyNotificationLinkFn: (parentId) => `/content-feed.html?post=${parentId}`,
    onReactionChange: (parentId) => {
      const rxData = Comments.getReactionState(parentId);
      let total = 0;
      for (const d of Object.values(rxData)) total += d.count;
      const p = _posts.find(x => x.id === parentId);
      const cc = p?.commentCount || 0;
      _setMeta(parentId, total, cc);
    },
    onCommentChange: (parentId) => {
      const listEl = document.getElementById(`tc-comments-list-${parentId}`);
      const count  = listEl ? listEl.querySelectorAll('.tc-comment-item').length : 0;
      const p = _posts.find(x => x.id === parentId);
      if (p) p.commentCount = count;
      const rxData = Comments.getReactionState(parentId);
      let total = 0;
      for (const d of Object.values(rxData)) total += d.count;
      _setMeta(parentId, total, count);
      // Update button label
      const btn = document.getElementById(`cf-cmt-btn-${parentId}`);
      if (btn && _commentsOpen.has(parentId)) btn.textContent = "Hide comments ↑";
      else if (btn) btn.textContent = `💬 Comments${count ? ` (${count})` : ""}`;
    },
  });

  if (isAdmin) document.getElementById("cf-new-btn").style.display = "";
  document.getElementById("cf-main").style.display = "";

  const deepId = new URLSearchParams(window.location.search).get("post");
  await loadFeed(deepId);
})();

function _setMeta(parentId, totalRx, cc) {
  const txt = [
    totalRx ? `${totalRx} reaction${totalRx!==1?"s":""}` : "",
    cc       ? `${cc} comment${cc!==1?"s":""}` : "",
  ].filter(Boolean).join(" · ");
  document.querySelectorAll(`.cf-meta-${parentId}`).forEach(el => el.textContent = txt);
}

/* ── Load feed ────────────────────────────────────────────────────────────── */
async function loadFeed(deepId = null) {
  const feed = document.getElementById("cf-feed");
  feed.innerHTML = '<div class="cf-empty"><div class="loading-spinner" style="margin:0 auto 12px"></div>Loading…</div>';

  const { data: rows, error } = await db
    .from("content_feed_posts")
    .select("*")
    .order("published_at", { ascending: false });

  if (error || !rows) {
    feed.innerHTML = '<div class="cf-empty">Could not load feed.</div>';
    return;
  }
  if (!rows.length) {
    feed.innerHTML = `<div class="cf-empty">Nothing here yet${isAdmin ? " — publish the first post above!" : "."}</div>`;
    return;
  }

  const ids = rows.map(r => r.id);
  const [{ data: allLikes }, { data: cmtRows }] = await Promise.all([
    db.from("content_feed_likes").select("post_id,email,emoji").in("post_id", ids),
    db.from("content_feed_comments").select("post_id").in("post_id", ids),
  ]);

  await Comments.loadReactions(ids);

  // Build maps
  const cmtCountMap = {}, likersMap = {};
  (allLikes || []).forEach(l => {
    if (!likersMap[l.post_id]) likersMap[l.post_id] = [];
    if (likersMap[l.post_id].length < 3) likersMap[l.post_id].push(l.email);
  });
  (cmtRows || []).forEach(c => cmtCountMap[c.post_id] = (cmtCountMap[c.post_id] || 0) + 1);

  // Avatar map for likers
  const likerEmails = [...new Set((allLikes || []).map(l => l.email))];
  if (likerEmails.length) {
    const { data: likerRows } = await db.from("allowed_emails")
      .select("email,avatar_url,name").in("email", likerEmails);
    (likerRows || []).forEach(r => { _likerAvatarMap[r.email] = { url: r.avatar_url, name: r.name }; });
  }

  _posts = rows.map(r => {
    const rxData = Comments.getReactionState(r.id);
    let totalRx = 0;
    for (const d of Object.values(rxData)) totalRx += d.count;
    return { ...r, likeCount: totalRx, commentCount: cmtCountMap[r.id] || 0, likers: likersMap[r.id] || [] };
  });

  renderFeed();

  if (deepId) {
    setTimeout(() => {
      const el = document.getElementById(`cf-${deepId}`);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      openComments(deepId);
    }, 120);
  }
}

/* ── Render ───────────────────────────────────────────────────────────────── */
function renderFeed() {
  const feed     = document.getElementById("cf-feed");
  const filtered = _activeFilter === "all" ? _posts : _posts.filter(p => p.type === _activeFilter);
  if (!filtered.length) {
    feed.innerHTML = `<div class="cf-empty">No ${_activeFilter === "all" ? "" : _activeFilter + " "}posts yet.</div>`;
    return;
  }
  feed.innerHTML = filtered.map(cfCardHTML).join("");
  // Re-open any previously open comment sections
  _commentsOpen.forEach(id => {
    const wrap = document.getElementById(`cf-cmt-wrap-${id}`);
    if (wrap) wrap.style.display = "";
  });
}

function cfCardHTML(p) {
  const dateStr  = formatDate(p.published_at);
  const editBtn  = isAdmin
    ? `<button class="cf-edit-btn" onclick="event.stopPropagation();openEditCfForm('${p.id}')">✏️ Edit</button>`
    : "";

  const rxData = Comments.getReactionState(p.id);
  let totalRx = 0;
  for (const d of Object.values(rxData)) totalRx += d.count;

  const safeKey  = `cf_${p.id.replace(/-/g,'_')}`;
  const reactBtn = Comments.reactBtnHtml(p.id, safeKey);

  // Liker chips
  const likerChips = (p.likers || []).map(email => {
    const info  = _likerAvatarMap[email];
    const name  = info?.name || email.split("@")[0];
    const col   = _avatarColour(email);
    const inner = info?.url
      ? `<img src="${_esc(info.url)}" alt="${_esc(name)}">`
      : `<span style="background:${col.bg};color:${col.fg};width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:800;border-radius:50%">${name[0].toUpperCase()}</span>`;
    return `<div class="tc-like-chip">${inner}</div>`;
  }).join("");
  const likeAvatars = totalRx > 0
    ? `<span class="tc-like-avatars" onclick="event.stopPropagation();Comments.showLikers('${p.id}',event)" style="cursor:pointer;margin-left:4px" title="See who reacted">${likerChips}${totalRx > 3 ? `<span style="font-size:.72rem;color:var(--text-muted);margin-left:6px">+${totalRx - 3}</span>` : ""}</span>`
    : "";

  const metaTxt  = [
    totalRx         ? `${totalRx} reaction${totalRx!==1?"s":""}` : "",
    p.commentCount  ? `${p.commentCount} comment${p.commentCount!==1?"s":""}` : "",
  ].filter(Boolean).join(" · ");

  const cmtOpen   = _commentsOpen.has(p.id);
  const cmtBtnTxt = cmtOpen ? "Hide comments ↑" : `💬 Comments${p.commentCount ? ` (${p.commentCount})` : ""}`;

  return `
    <div class="cf-card type-${_esc(p.type)}" id="cf-${p.id}">
      <div class="cf-card-hdr type-${_esc(p.type)}">
        <span class="cf-type-badge">${_typeBadge(p.type)}</span>
        <span class="cf-card-date">${dateStr}</span>
        ${editBtn}
      </div>
      <div class="cf-card-body" id="cf-body-${p.id}">${_cardBody(p)}</div>
      <div class="cf-card-footer" onclick="event.stopPropagation()">
        ${reactBtn}
        ${likeAvatars}
        <span class="cf-meta-counts cf-meta-${p.id}">${metaTxt}</span>
        <button class="cf-cmt-toggle${cmtOpen ? " open" : ""}" id="cf-cmt-btn-${p.id}"
                onclick="toggleComments('${p.id}')">${cmtBtnTxt}</button>
      </div>
      <div id="cf-cmt-wrap-${p.id}" style="${cmtOpen ? "" : "display:none"}">
        <div class="cf-cmt-wrap">
          <div class="tc-comments-section">
            <div id="tc-comments-list-${p.id}"></div>
            ${Comments.formHtml(p.id)}
          </div>
        </div>
      </div>
    </div>`;
}

function _cardBody(p) {
  if (p.type === "youtube") return _ytBody(p);
  if (p.type === "blog")    return _blogBody(p);
  return _postBody(p);
}

function _ytBody(p) {
  const ytId = _esc(p.youtube_id || "");
  const title = _esc(p.title || "");
  if (_embeddedYt.has(p.id)) {
    return `<div class="cf-yt-embed"><iframe src="https://www.youtube.com/embed/${ytId}?autoplay=1" allowfullscreen loading="lazy"></iframe></div><div class="cf-card-title">${title}</div>`;
  }
  return `
    <div class="cf-yt-thumb" onclick="embedYt('${p.id}')">
      <img src="https://img.youtube.com/vi/${ytId}/hqdefault.jpg" alt="${title}" loading="lazy" />
      <div class="cf-yt-play"><div class="cf-yt-play-btn"><div class="cf-yt-play-icon"></div></div></div>
    </div>
    <div class="cf-card-title">${title}</div>`;
}

function _blogBody(p) {
  const url     = _esc(p.url || "#");
  const title   = _esc(p.title || "");
  const excerpt = _esc(p.body || "");
  return `
    <div class="cf-card-title">${title}</div>
    ${excerpt ? `<div class="cf-blog-excerpt">${excerpt}</div>` : ""}
    <a href="${url}" target="_blank" rel="noopener" class="cf-blog-link">Read post ↗</a>`;
}

function _postBody(p) {
  const title   = p.title ? `<div class="cf-card-title">${_esc(p.title)}</div>` : "";
  const body    = p.body  ? `<div class="cf-post-body">${_esc(p.body)}</div>`   : "";
  const media   = (Array.isArray(p.media) && p.media.length && window._tcRenderMedia)
    ? `<div class="cf-post-media">${window._tcRenderMedia({ media: p.media })}</div>`
    : "";
  return `${title}${body}${media}`;
}

function _typeBadge(type) {
  if (type === "youtube") return "▶ YouTube";
  if (type === "blog")    return "📝 Blog Post";
  return "✏️ Post";
}

/* ── Embed YouTube inline ────────────────────────────────────────────────── */
function embedYt(postId) {
  _embeddedYt.add(postId);
  const p    = _posts.find(x => x.id === postId);
  const body = document.getElementById(`cf-body-${postId}`);
  if (p && body) body.innerHTML = _ytBody(p);
}

/* ── Comments toggle ─────────────────────────────────────────────────────── */
function toggleComments(postId) {
  if (_commentsOpen.has(postId)) {
    _commentsOpen.delete(postId);
    document.getElementById(`cf-cmt-wrap-${postId}`)?.style?.setProperty?.("display","none") ||
      (document.getElementById(`cf-cmt-wrap-${postId}`).style.display = "none");
    const btn = document.getElementById(`cf-cmt-btn-${postId}`);
    const p   = _posts.find(x => x.id === postId);
    if (btn) {
      btn.classList.remove("open");
      btn.textContent = `💬 Comments${p?.commentCount ? ` (${p.commentCount})` : ""}`;
    }
  } else {
    openComments(postId);
  }
}

function openComments(postId) {
  _commentsOpen.add(postId);
  const wrap = document.getElementById(`cf-cmt-wrap-${postId}`);
  if (wrap) wrap.style.display = "";
  const btn = document.getElementById(`cf-cmt-btn-${postId}`);
  if (btn) { btn.classList.add("open"); btn.textContent = "Hide comments ↑"; }
  if (!_commentsLoaded.has(postId)) {
    _commentsLoaded.add(postId);
    Comments.load(postId);
  }
}

/* ── Filter ──────────────────────────────────────────────────────────────── */
function setFilter(type, btn) {
  _activeFilter = type;
  document.querySelectorAll(".cf-filter-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  renderFeed();
}

/* ── Admin form ──────────────────────────────────────────────────────────── */
function openCfForm() {
  _editPostId = null;
  document.getElementById("cf-form-title").textContent = "New Post";
  document.getElementById("cf-submit-btn").textContent = "Publish & Notify Members";
  // Reset all fields
  document.getElementById("cfyt-url").value     = "";
  document.getElementById("cfyt-title").value   = "";
  document.getElementById("cfblog-title").value  = "";
  document.getElementById("cfblog-url").value    = "";
  document.getElementById("cfblog-excerpt").value= "";
  document.getElementById("cfpost-title").value  = "";
  document.getElementById("cfpost-body").value   = "";
  document.getElementById("cfpost-body").style.height = "";
  _postImages = [];
  document.getElementById("cfpost-img-grid").innerHTML = "";
  ["cfyt-date","cfblog-date","cfpost-date"].forEach(id => _setDateNow(id));
  document.getElementById("cf-form-wrap").style.display = "";
  document.getElementById("cf-new-btn").style.display   = "none";
  switchCfTab("youtube");
  document.getElementById("cf-form-wrap").scrollIntoView({ behavior:"smooth", block:"start" });
}

function openEditCfForm(postId) {
  const p = _posts.find(x => x.id === postId);
  if (!p) return;
  _editPostId = postId;
  document.getElementById("cf-form-title").textContent = "Edit Post";
  document.getElementById("cf-submit-btn").textContent = "Save Changes";
  document.getElementById("cf-form-wrap").style.display = "";
  document.getElementById("cf-new-btn").style.display   = "none";
  switchCfTab(p.type);

  if (p.type === "youtube") {
    const ytUrl = p.youtube_id ? `https://www.youtube.com/watch?v=${p.youtube_id}` : (p.url || "");
    document.getElementById("cfyt-url").value   = ytUrl;
    document.getElementById("cfyt-title").value = p.title || "";
    _setDateFromTs("cfyt-date", p.published_at);
  } else if (p.type === "blog") {
    document.getElementById("cfblog-title").value   = p.title || "";
    document.getElementById("cfblog-url").value     = p.url   || "";
    document.getElementById("cfblog-excerpt").value = p.body  || "";
    _setDateFromTs("cfblog-date", p.published_at);
  } else {
    document.getElementById("cfpost-title").value = p.title || "";
    document.getElementById("cfpost-body").value  = p.body  || "";
    _setDateFromTs("cfpost-date", p.published_at);
    _postImages = [];
    document.getElementById("cfpost-img-grid").innerHTML = "";
  }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeCfForm() {
  _editPostId = null;
  // Clean up object URLs
  _postImages.forEach(img => URL.revokeObjectURL(img.objectUrl));
  _postImages = [];
  document.getElementById("cfpost-img-grid").innerHTML = "";
  document.getElementById("cf-form-wrap").style.display = "none";
  document.getElementById("cf-new-btn").style.display   = "";
  // Clear inline toolbar state if it was injected
  if (_toolbarInjected) {
    window._clearInlineState?.("cfp");
  }
}

function switchCfTab(tab) {
  _cfTab = tab;
  ["youtube","blog","post"].forEach(t => {
    document.getElementById(`cf-tab-${t}`).style.display = (t === tab) ? "" : "none";
    const btn = document.getElementById(`tab-${t}`);
    if (btn) btn.className = `cf-type-tab${t === tab ? " active-" + t : ""}`;
  });
  // Bottom actions: hidden for Post tab (has its own submit)
  document.getElementById("cf-form-actions-main").style.display = tab === "post" ? "none" : "";
  // Inject shared-comments toolbar into Post tab on first use
  if (tab === "post" && !_toolbarInjected && window._inlineToolbarHtml) {
    const area = document.getElementById("cfpost-toolbar-area");
    if (area) {
      area.innerHTML = window._inlineToolbarHtml("cfp");
      _toolbarInjected = true;
    }
  }
}

/* ── Post images (Post tab) ─────────────────────────────────────────────── */
// Note: the shared-comments toolbar (injected for the Post tab) handles image/video uploads
// into its own internal state for rich comment-style media.
// We ALSO provide a dedicated image grid for post-level images (uploaded on submit).
// This handles images picked via the standard shared toolbar.
// For simplicity: images selected via toolbar go into _postImages via the standard
// toolbar flow (handled by shared-comments.js internally via key "cfp").
// On submit we read them out via Comments.readMedia?.('cfp') if available,
// falling back to just the text content.

/* ── Publish / save ──────────────────────────────────────────────────────── */
async function publishCfPost() {
  const isPost = _cfTab === "post";
  const btn = document.getElementById(isPost ? "cfpost-submit" : "cf-submit-btn");
  if (!btn || btn.disabled) return;

  let payload = {};

  if (_cfTab === "youtube") {
    const url   = document.getElementById("cfyt-url").value.trim();
    const title = document.getElementById("cfyt-title").value.trim();
    const dateV = document.getElementById("cfyt-date").value;
    if (!url || !title) { alert("Please add a YouTube URL and title."); return; }
    const ytId = _extractYtId(url);
    if (!ytId) { alert("Couldn't extract a video ID from that URL."); return; }
    payload = { type:"youtube", title, url, youtube_id:ytId, body:"", media:[], published_at: _toIso(dateV) };

  } else if (_cfTab === "blog") {
    const title   = document.getElementById("cfblog-title").value.trim();
    const url     = document.getElementById("cfblog-url").value.trim();
    const excerpt = document.getElementById("cfblog-excerpt").value.trim();
    const dateV   = document.getElementById("cfblog-date").value;
    if (!title || !url) { alert("Please add a title and URL."); return; }
    payload = { type:"blog", title, url, body:excerpt, media:[], published_at: _toIso(dateV) };

  } else {
    // Post type — read text + any media from shared-comments toolbar
    const title = document.getElementById("cfpost-title").value.trim();
    const body  = document.getElementById("cfpost-body").value.trim();
    const dateV = document.getElementById("cfpost-date").value;
    if (!title && !body) { alert("Please add a title or some content."); return; }

    // Read media from shared-comments.js internal state (key "cfp")
    // The toolbar uploads images to storage and stores finalized URLs in _inlineMedia["cfp"].
    // We access them via the module's internal state (it's a plain object reference).
    // Since we can't access it directly, use whatever is in the preview area as fallback.
    // Media will be gathered from Comments.readMedia if available (added in shared-comments.js).
    const media = (typeof Comments.readMedia === "function") ? Comments.readMedia("cfp") : [];
    payload = { type:"post", title, body, url:null, youtube_id:null, media, published_at: _toIso(dateV) };
  }

  btn.disabled = true;
  const origText = btn.textContent;

  if (_editPostId) {
    btn.textContent = "Saving…";
    const { error } = await db.from("content_feed_posts").update(payload).eq("id", _editPostId);
    if (error) { alert("Failed to save: " + error.message); btn.disabled = false; btn.textContent = origText; return; }
    closeCfForm();
    btn.disabled = false; btn.textContent = origText;
    _editPostId = null;
    await loadFeed();

  } else {
    btn.textContent = "Publishing…";
    const { data: post, error } = await db.from("content_feed_posts").insert(payload).select().single();
    if (error) { alert("Failed to publish: " + error.message); btn.disabled = false; btn.textContent = origText; return; }

    // Notify members
    btn.textContent = "Notifying members…";
    const notifTitle = payload.type === "youtube" ? "New YouTube Video"
                     : payload.type === "blog"    ? "New Blog Post"
                     :                              "New Post";
    const { data: members } = await db.from("allowed_emails").select("email");
    if (members?.length) {
      const notifications = members.filter(m => m.email !== myEmail).map(m => ({
        email:    m.email,
        type:     "content_feed",
        title:    notifTitle,
        body:     (payload.title || payload.body || "").slice(0, 120),
        link_url: `/content-feed.html?post=${post.id}`,
        metadata: {},
      }));
      if (notifications.length) await db.from("notifications").insert(notifications);
    }

    closeCfForm();
    btn.disabled = false; btn.textContent = origText;
    await loadFeed(post.id);
  }
}

/* ── YouTube auto-title ──────────────────────────────────────────────────── */
function scheduleYtFetch() {
  clearTimeout(_ytTimer);
  _ytTimer = setTimeout(async () => {
    const url  = document.getElementById("cfyt-url")?.value.trim();
    if (!url) return;
    const ytId = _extractYtId(url);
    if (!ytId) return;
    try {
      const res  = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${ytId}&format=json`);
      if (!res.ok) return;
      const data = await res.json();
      const titleEl = document.getElementById("cfyt-title");
      if (titleEl && !titleEl.value) titleEl.value = data.title || "";
    } catch(_) { /* silently ignore */ }
  }, 800);
}

function _extractYtId(url) {
  const m = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

/* ── Utilities ───────────────────────────────────────────────────────────── */
function _setDateNow(inputId) {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  const el = document.getElementById(inputId);
  if (el) el.value = now.toISOString().slice(0, 16);
}

function _setDateFromTs(inputId, ts) {
  if (!ts) return;
  const d = new Date(ts);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  const el = document.getElementById(inputId);
  if (el) el.value = d.toISOString().slice(0, 16);
}

function _toIso(dateVal) {
  return dateVal ? new Date(dateVal).toISOString() : new Date().toISOString();
}

function formatDate(ts) {
  if (!ts) return "";
  const d   = new Date(ts);
  const day = d.getDate();
  const sfx = day===1||day===21||day===31 ? "st" : day===2||day===22 ? "nd" : day===3||day===23 ? "rd" : "th";
  const mon = ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()];
  return `${day}${sfx} ${mon} ${d.getFullYear()}`;
}

function _esc(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function _avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)",fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)",fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)",fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}
