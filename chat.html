<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3/dist/mux-player.mjs"></script>
  <style>
    :root {
      --bg:           #faf7f3;
      --surface:      #ffffff;
      --surface-2:    #f0ebe2;
      --border:       #e0d5c8;
      --text:         #1a1410;
      --text-muted:   #8a7868;
      --accent-subtle:#fdf0d8;
    }
    body { background: var(--bg); }
    /* ── Composer toolbar ─────────────────────────────────────────────────────── */
    .composer-toolbar {
      display: flex; align-items: center; gap: 4px;
      flex: 1; flex-wrap: wrap;
    }
    .toolbar-btn {
      width: 32px; height: 32px;
      background: none; border: 1.5px solid transparent;
      border-radius: 8px; cursor: pointer; font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: background .15s, border-color .15s, color .15s;
      position: relative;
      font-family: inherit;
    }
    .toolbar-btn:hover { background: rgba(0,0,0,.05); color: var(--text); border-color: var(--border); }
    .toolbar-btn.recording {
      color: #ef4444; border-color: #ef4444;
      animation: pulse-red 1s ease-in-out infinite;
    }
    .toolbar-btn[title]:hover::after {
      content: attr(title);
      position: absolute; bottom: calc(100% + 6px); left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); font-size: 0.72rem; white-space: nowrap;
      padding: 3px 8px; border-radius: 5px; pointer-events: none;
      z-index: 1000;
    }
    @keyframes pulse-red {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
      50%      { box-shadow: 0 0 0 5px rgba(239,68,68,.25); }
    }

    .composer-cancel {
      background: none; border: none; font-size: 0.85rem;
      color: var(--text-muted); cursor: pointer; font-family: inherit;
      padding: 6px 10px; border-radius: 6px;
      transition: color .15s;
    }
    .composer-cancel:hover { color: var(--text); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Recording indicator ─────────────────────────────────────────────────── */
    .recording-indicator {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem; color: #ef4444; font-weight: 600;
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      border-radius: 20px; padding: 4px 12px; margin-top: 8px;
    }
    .recording-stop-btn {
      background: rgba(239,68,68,.2); border: 1px solid rgba(239,68,68,.4);
      border-radius: 12px; color: #ef4444; cursor: pointer;
      font-size: 0.75rem; font-weight: 700; padding: 2px 10px; margin-left: 4px;
    }
    .recording-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444;
      animation: pulse-red 1s ease-in-out infinite;
    }
    /* ── Video recording preview panel ──────────────────────────────────────── */
    .video-rec-panel {
      background: #0d0d0d; border: 1.5px solid var(--border);
      border-radius: 12px; overflow: hidden; margin-top: 10px;
    }
    .video-rec-preview {
      display: block; width: 100%; height: auto;
      background: #000;
    }
    .video-rec-devices {
      display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px 0;
      background: var(--surface);
    }
    .video-rec-select {
      flex: 1; min-width: 0;
      background: var(--bg);
      border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.78rem; padding: 6px 8px;
      font-family: inherit; outline: none;
    }
    .video-rec-actions {
      display: flex; gap: 8px; padding: 10px 12px 12px;
      background: var(--surface);
    }
    .video-rec-start-btn {
      flex: 1; background: #ef4444; color: #fff; border: none;
      border-radius: 8px; font-weight: 700; font-size: 0.87rem;
      padding: 10px; cursor: pointer; transition: opacity .15s;
    }
    .video-rec-start-btn:hover { opacity: .85; }
    .video-rec-cancel-btn {
      background: var(--bg); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text-muted); cursor: pointer;
      font-size: 0.85rem; padding: 10px 16px;
    }
    .video-rec-recording-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px 12px; background: var(--surface);
      border-top: 1px solid var(--border);
    }
    .video-rec-recording-bar .recording-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #ef4444;
      animation: blink 1s ease-in-out infinite; flex-shrink: 0;
    }
    #video-rec-timer { font-size: 0.88rem; font-weight: 600; color: var(--text); flex: 1; }
    .video-rec-stop-btn {
      background: #ef4444; color: #fff; border: none; border-radius: 8px;
      font-weight: 700; font-size: 0.82rem; padding: 8px 14px; cursor: pointer;
    }

    /* ── Video URL inline panel ───────────────────────────────────────────────── */
    /* ── Video attach panel ───────────────────────────────────────────────────── */
    .video-attach-panel {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; margin-top: 10px; overflow: hidden;
    }
    .video-attach-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 0;
      font-size: 1rem; font-weight: 700; color: var(--text);
    }
    .video-attach-close {
      background: rgba(0,0,0,.06); border: none; border-radius: 6px;
      color: var(--text-muted); cursor: pointer;
      font-size: 0.85rem; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
    }
    .video-attach-tabs {
      display: flex; gap: 0; padding: 10px 16px 0;
      border-bottom: 1.5px solid var(--border);
    }
    .video-tab {
      background: none; border: none; border-bottom: 2.5px solid transparent;
      color: var(--text-muted); cursor: pointer; font-size: 0.88rem;
      font-weight: 600; padding: 6px 12px 10px; margin-bottom: -1.5px;
      transition: color .15s, border-color .15s;
    }
    .video-tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .video-dropzone {
      margin: 16px; border: 1.5px dashed rgba(0,0,0,.12);
      border-radius: 10px; padding: 32px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      transition: background .15s, border-color .15s;
    }
    .video-dropzone.drag-over { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.25); }
    .video-dropzone-icon { font-size: 2rem; opacity: .4; }
    .video-dropzone-text { color: var(--text-muted); font-size: 0.85rem; margin: 0; text-align: center; }
    .video-choose-btn {
      background: #fff; color: #000; border: none; border-radius: 20px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
      padding: 8px 20px; margin-top: 4px;
      transition: opacity .15s;
    }
    .video-choose-btn:hover { opacity: .85; }
    .mux-upload-progress {
      width: 80%; height: 4px;
      background: rgba(0,0,0,.08); border-radius: 4px; overflow: hidden;
    }
    .mux-upload-bar {
      height: 100%; background: var(--accent);
      border-radius: 4px; transition: width .3s;
      width: 0%;
    }
    mux-player {
      display: block; border-radius: 8px;
      background: transparent;
      --media-background-color: transparent;
      --media-object-fit: contain;
    }
    .mux-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* default 16:9 — JS overrides for portrait */
      background: transparent;
      overflow: hidden;
    }
    .mux-wrap mux-player {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }
    .mux-wrap.portrait {
      padding-top: 0;
      height: min(177.78vw, 72vh);
    }

    /* ── Composer upload progress overlay ────────────────────────────────────── */
    .mux-upload-overlay {
      display: flex; align-items: center; gap: 14px;
      background: rgba(245,197,24,.07);
      border: 1.5px solid rgba(245,197,24,.25);
      border-radius: 10px; padding: 14px 16px;
      margin-bottom: 10px;
    }
    .mux-upload-overlay-icon { font-size: 1.5rem; flex-shrink: 0; }
    .mux-upload-overlay-body { flex: 1; min-width: 0; }
    .mux-upload-overlay-filename {
      font-size: 0.85rem; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .mux-upload-overlay-track {
      width: 100%; height: 5px;
      background: rgba(0,0,0,.08); border-radius: 4px; overflow: hidden;
      margin-bottom: 6px;
    }
    .mux-upload-overlay-bar {
      height: 100%; background: var(--accent);
      border-radius: 4px; transition: width .25s ease;
      width: 0%;
    }
    @keyframes mux-stripe {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 0; }
    }
    .mux-upload-overlay-bar.processing {
      background-color: var(--accent);
      background-image: repeating-linear-gradient(
        45deg,
        rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 10px,
        transparent 10px, transparent 20px
      );
      background-size: 40px 100%;
      animation: mux-stripe 0.8s linear infinite;
    }
    .mux-upload-overlay-status {
      font-size: 0.75rem; color: var(--text-muted);
    }
    @keyframes mux-pulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mux-upload-overlay-status.processing {
      animation: mux-pulse 1.4s ease-in-out infinite;
      color: var(--accent);
    }
    /* Global fixed overlay for inline (reply/comment) Mux uploads */
    .mux-global-overlay {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      width: min(440px, calc(100vw - 32px)); z-index: 9999;
      display: flex; align-items: center; gap: 14px;
      background: rgba(245,197,24,.07); border: 1.5px solid rgba(245,197,24,.25);
      border-radius: 10px; padding: 14px 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,.35);
    }
    /* Comments: same mux-wrap aspect-ratio as posts */
    .comment-mux-wrap {
      position: relative; width: 100%; padding-top: 56.25%;
      background: transparent; overflow: hidden; border-radius: 8px;
      margin-top: 8px;
    }
    .comment-mux-wrap mux-player {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block;
    }
    .video-embed-tab {
      display: flex; gap: 8px; align-items: center; padding: 14px 16px;
    }
    .video-url-input {
      flex: 1; background: rgba(0,0,0,.05); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit;
      font-size: 0.87rem; outline: none; padding: 8px 12px;
    }
    .video-url-input::placeholder { color: #555; }
    .video-url-input:focus { border-color: rgba(0,0,0,.2); }
    .video-add-btn {
      background: var(--accent); color: #000; border: none; border-radius: 8px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; padding: 8px 16px;
      flex-shrink: 0;
    }

    /* ── Poll builder ─────────────────────────────────────────────────────────── */
    .poll-builder {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 14px; margin-top: 10px;
    }
    .poll-builder-title {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted); margin-bottom: 10px;
    }
    .poll-question-input, .poll-option-input {
      width: 100%; box-sizing: border-box;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 7px; color: var(--text);
      font-size: 0.87rem; font-family: inherit;
      padding: 8px 12px; margin-bottom: 8px;
      transition: border-color .15s;
    }
    .poll-question-input:focus, .poll-option-input:focus {
      outline: none; border-color: var(--accent);
    }
    .poll-question-input::placeholder, .poll-option-input::placeholder { color: #444; }
    .poll-options-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .poll-option-row { display: flex; align-items: center; gap: 6px; }
    .poll-option-row input { flex: 1; margin-bottom: 0; }
    .poll-option-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1.1rem; line-height: 1;
      padding: 2px 4px; transition: color .15s;
    }
    .poll-option-remove:hover { color: #ef4444; }
    .poll-add-option {
      background: none; border: 1.5px dashed var(--border);
      border-radius: 7px; color: var(--text-muted);
      font-size: 0.82rem; font-family: inherit;
      padding: 6px 12px; cursor: pointer; width: 100%;
      transition: border-color .15s, color .15s;
    }
    .poll-add-option:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Code embed panel ────────────────────────────────────────────────────── */
    .code-panel {
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 14px; margin-top: 10px;
    }
    .code-panel-title {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted); margin-bottom: 8px;
    }
    .code-panel textarea {
      width: 100%; box-sizing: border-box;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 7px; color: #a5f3fc;
      font-size: 0.82rem; font-family: 'Courier New', monospace;
      padding: 10px 12px; resize: vertical; min-height: 80px;
      transition: border-color .15s;
    }
    .code-panel textarea:focus { outline: none; border-color: var(--accent); }

    /* ── Media preview area ───────────────────────────────────────────────────── */
    .media-preview-area {
      margin-top: 10px;
    }
    .media-preview-images {
      display: grid; gap: 6px; margin-bottom: 6px;
    }
    .media-thumb-wrap {
      position: relative; display: block;
    }
    .media-thumb-wrap img {
      width: 100%; height: auto; max-height: 420px;
      object-fit: contain; border-radius: 8px;
      border: 1.5px solid var(--border); display: block;
    }
    .media-thumb-remove {
      position: absolute; top: 6px; right: 6px;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,.55); border: none;
      color: #fff; font-size: 0.8rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s;
    }
    .media-thumb-remove:hover { background: #ef4444; }
    .media-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 5px 10px 5px 8px;
      font-size: 0.8rem; color: var(--text-muted); margin: 4px 4px 4px 0;
    }
    .media-chip-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1rem; line-height: 1;
      padding: 0 2px; transition: color .15s;
    }
    .media-chip-remove:hover { color: #ef4444; }
    .media-preview-video-wrap {
      position: relative; margin-bottom: 8px;
    }
    .media-video-remove {
      display: block; width: 100%; margin-top: 6px;
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3);
      border-radius: 6px; color: #ef4444; cursor: pointer;
      font-size: 0.78rem; padding: 4px 0;
    }
    .media-video-remove:hover { background: rgba(239,68,68,.22); }
    /* ── Prevent iOS rubber-band scrolling on the page shell ─────────────────── */
    html, body {
      overscroll-behavior: none;
      /* Stops iOS from letting the page bounce/scroll when the keyboard opens */
    }

    /* ── Keep the header pinned — prevents it drifting up when keyboard opens ── */
    #app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    /* ── Community Chat — full-viewport wrapper ──────────────────────────────── */
    #view-chat {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      /* --win-h: window.innerHeight, updated on resize (real viewport, not CSS 100vh)
         --hdr-h: measured header height
         --kb-h:  keyboard height tracked via visualViewport */
      top: var(--hdr-h, 60px);
      height: calc(var(--win-h, 100svh) - var(--hdr-h, 60px) - var(--kb-h, 0px));
      z-index: 90;
      flex-direction: row;
      background: var(--bg);
      overflow: hidden;
      border-top: 1.5px solid var(--border);
    }

    /* ── Chat sidebar (conversation list) ────────────────────────────────────── */
    #chat-sidebar {
      width: 260px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      background: var(--surface);
      overflow: hidden;
    }
    @media (max-width: 640px) {
      #chat-sidebar { width: 100%; border-right: none; }
      #chat-sidebar.hidden-mobile { display: none; }
    }

    /* ── Chat main area (conversation + new-chat panel) ─────────────────────── */
    #chat-main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (max-width: 640px) {
      #chat-main-area { display: none; }
      #chat-main-area.show-mobile { display: flex; }
    }

    /* ── Chat sub-panels ─────────────────────────────────────────────────────── */
    #chat-panel-conversation, #chat-panel-new {
      display: flex; flex-direction: column; flex: 1; min-height: 0;
    }

    /* ── Conversations list panel ────────────────────────────────────────────── */
    .chat-list-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .chat-list-title {
      font-size: 1.1rem; font-weight: 700; color: var(--text);
    }
    .chat-new-btn {
      background: none; border: 1.5px solid var(--border);
      border-radius: 8px; cursor: pointer; color: var(--text-muted);
      padding: 6px 10px; display: flex; align-items: center; gap: 6px;
      font-size: 0.82rem; font-weight: 600; font-family: inherit;
      transition: border-color .15s, color .15s;
    }
    .chat-new-btn:hover { border-color: var(--accent); color: var(--text); }
    .chat-search-wrap {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .chat-search-input {
      width: 100%; box-sizing: border-box;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 8px 14px;
      font-size: 0.87rem; font-family: inherit; color: var(--text);
      outline: none; transition: border-color .15s;
    }
    .chat-search-input:focus { border-color: var(--accent); }
    .chat-conv-list {
      flex: 1; overflow-y: auto;
      background: var(--surface);
      overscroll-behavior: none; /* no rubber-band on iOS */
    }
    .chat-conv-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      /* Reset all button borders, then apply only the ones we want */
      border: none;
      border-bottom: 1px solid var(--border);
      border-left: 3px solid transparent;
      outline: none;
      cursor: pointer; background: none; width: 100%; text-align: left;
      font-family: inherit;
      transition: background .12s, border-left-color .12s;
      min-height: 60px;
      box-sizing: border-box;
    }
    .chat-conv-row:hover { background: var(--surface-2); }
    .chat-conv-row.active { background: var(--surface-2); border-left-color: var(--accent); }
    .chat-conv-row.unread .chat-conv-row-name { color: #fff; }
    .chat-conv-row.unread .chat-conv-row-preview { color: var(--text); }
    .chat-conv-row-avatars { flex-shrink: 0; position: relative; }
    .chat-conv-row-body { flex: 1; min-width: 0; }
    .chat-conv-row-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 2px;
    }
    .chat-conv-row-name {
      font-size: 0.9rem; font-weight: 700; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    }
    .chat-conv-row-time {
      font-size: 0.72rem; color: var(--text-muted); flex-shrink: 0;
    }
    .chat-conv-unread-badge {
      background: var(--accent, #f5c518); color: #1a1410;
      font-size: .68rem; font-weight: 800; line-height: 1;
      min-width: 18px; height: 18px; border-radius: 99px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0 4px; flex-shrink: 0;
    }
    .chat-conv-row-preview {
      font-size: 0.8rem; color: var(--text-muted);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-conv-empty {
      padding: 40px 20px; text-align: center;
      color: var(--text-muted); font-size: 0.87rem;
    }

    /* ── Active conversation panel ────────────────────────────────────────────── */
    .chat-conv-hdr {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .chat-back-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 4px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: color .15s;
    }
    .chat-back-btn:hover { color: var(--text); }
    .chat-conv-hdr-title {
      font-size: 0.95rem; font-weight: 700; color: var(--text);
      flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px 24px 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      background: var(--bg);
      overscroll-behavior: none; /* no rubber-band on iOS */
      contain: layout; /* reflows inside can't affect outside the scroll container */
    }
    .chat-msg-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .chat-msg-group.mine { flex-direction: row-reverse; }
    .chat-msg-avatar { flex-shrink: 0; align-self: flex-start; }
    .chat-msg-body { max-width: min(70%, 520px); min-width: 220px; display: flex; flex-direction: column; gap: 3px; }
    .chat-msg-group.mine .chat-msg-body { align-items: flex-end; }
    .chat-msg-meta {
      font-size: 0.73rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 6px;
      padding: 0 4px 2px;
    }
    .chat-msg-group.mine .chat-msg-meta { flex-direction: row-reverse; }
    .chat-msg-name { font-weight: 700; font-size: 0.82rem; color: var(--text); }
    .chat-msg-time { font-size: 0.72rem; color: var(--text-muted); }
    .chat-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 8px 12px;
      font-size: 0.88rem;
      color: var(--text);
      line-height: 1.5;
      word-break: break-word;
    }
    .chat-bubble.mine {
      background: var(--accent);
      border-color: transparent;
      color: #1a1410;
    }
    .chat-media { margin-top: 6px; }
    /* ── Typing indicator ── */
    .chat-typing {
      display: flex; align-items: center; gap: 8px;
      padding: 4px 16px 6px;
      font-size: 0.78rem; color: var(--text-muted);
    }
    .typing-dots { display: flex; align-items: center; gap: 3px; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-muted); display: block;
      animation: typingBounce 1.2s infinite ease-in-out;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: .4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }
    @media (max-width: 600px) {
      .chat-msg-body { max-width: 82%; }
      .chat-bubble-cont { max-width: 82%; }
      .chat-bubble-cont-mine { max-width: 82%; }
    }

    /* ── Chat reactions ──────────────────────────────────────────────────────── */
    /* Outer wrapper — just flex column, no relative so pills aren't clipped */
    .chat-bubble-wrap { display: inline-flex; flex-direction: column; max-width: 100%; }
    /* Inner wrapper anchors the absolutely-positioned trigger and picker */
    .chat-bubble-inner { position: relative; display: inline-flex; flex-direction: column; max-width: 100%; }
    .chat-react-trigger {
      opacity: 0; transition: opacity .15s;
      position: absolute; bottom: -12px; right: 8px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 50%; width: 24px; height: 24px;
      cursor: pointer; font-size: .78rem;
      display: flex; align-items: center; justify-content: center;
      z-index: 5; box-shadow: 0 1px 4px rgba(0,0,0,.14);
    }
    .chat-msg-group:hover .chat-react-trigger { opacity: 1; }
    .chat-react-picker {
      display: none; gap: 2px; flex-wrap: nowrap;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,.18);
      position: absolute; bottom: calc(100% + 6px); z-index: 200;
      white-space: nowrap;
    }
    .chat-react-picker.mine { right: 0; }
    .chat-react-picker:not(.mine) { left: 0; }
    .chat-react-picker button {
      background: none; border: none; cursor: pointer;
      font-size: 1.15rem; padding: 2px 4px; border-radius: 8px;
      transition: background .1s; line-height: 1.3;
    }
    .chat-react-picker button:hover,
    .chat-react-picker button.picked { background: rgba(245,197,24,.25); }
    /* Extra top margin leaves room for the trigger button overlapping the bottom of the bubble */
    .chat-rx-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 14px; }
    .chat-rx-pill {
      position: relative;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 12px; padding: 1px 7px; font-size: .82rem;
      cursor: pointer; display: inline-flex; align-items: center; gap: 3px;
      transition: background .1s, border-color .1s; line-height: 1.5;
    }
    .chat-rx-pill.mine { border-color: var(--accent); background: rgba(245,197,24,.12); }
    .chat-rx-pill span { font-size: .72rem; color: var(--text-muted); font-weight: 600; }
    /* "Who reacted" tooltip on hover */
    .chat-rx-pill::after {
      content: attr(data-names);
      position: absolute; bottom: calc(100% + 5px); left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.82); color: #fff;
      font-size: .7rem; padding: 3px 8px; border-radius: 6px;
      white-space: nowrap; z-index: 300; pointer-events: none;
      opacity: 0; transition: opacity .15s;
    }
    .chat-rx-pill:hover::after { opacity: 1; }

    /* Composer */
    .chat-composer {
      border-top: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }
    /* Input row always visible */
    .chat-input-row { background: var(--surface); padding-top: 6px; }
    /* Limit live camera preview height inside chat */
    .chat-composer .video-rec-preview { max-height: min(200px, 28vh); object-fit: contain; background: #000; }
    /* Limit recorded/uploaded video preview height inside chat */
    .chat-composer video.chat-preview-video { max-height: min(180px, 24vh); object-fit: contain; width: 100%; border-radius: 8px; display: block; }
    /* Cap and scroll just the media preview area so it never pushes the input off screen */
    #inline-media-preview-chat_main { max-height: min(200px, 26vh); overflow-y: auto; }
    /* Cap the mux player preview inside the chat media preview */
    #inline-media-preview-chat_main .comment-mux-wrap { padding-top: 0; height: min(180px, 24vh); }
    .chat-input-row {
      display: flex; gap: 8px; align-items: flex-end;
    }
    .chat-textarea {
      flex: 1;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 9px 14px;
      font-size: 0.88rem;
      font-family: inherit;
      color: var(--text);
      resize: none; outline: none;
      min-height: 38px; max-height: 140px;
      line-height: 1.5;
      transition: border-color .15s;
    }
    .chat-textarea:focus { border-color: var(--accent); }
    .chat-send-btn {
      background: var(--accent); border: none; border-radius: 50%;
      width: 36px; height: 36px; cursor: pointer; color: #1a1410;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: opacity .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .chat-send-btn:hover { opacity: .85; }
    .chat-send-btn:disabled { opacity: .4; cursor: default; }
    .chat-send-btn svg { width: 16px; height: 16px; }

    /* ── Image loading shimmer ── */
    .chat-img-wrap {
      background: var(--surface-2, #222);
      border-radius: 8px; overflow: hidden;
      position: relative; display: block;
    }
    /* Multi-image: wrapper clips overflow; img height+object-fit set via inline style */
    .chat-img-wrap.multi { height: 160px; overflow: hidden; }
    /* GPU-accelerated shimmer via transform (no paint per frame) */
    .chat-img-wrap::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.08) 50%, transparent 100%);
      transform: translateX(-100%);
      animation: chat-img-shimmer 1.4s ease-in-out infinite;
    }
    .chat-img-wrap.loaded::after { display: none; }
    @keyframes chat-img-shimmer {
      100% { transform: translateX(200%); }
    }
    .chat-img-wrap img {
      opacity: 0; transition: opacity 0.25s ease; display: block; width: 100%;
    }
    .chat-img-wrap.loaded img { opacity: 1; }
    /* Skip rendering off-screen messages during resize — biggest perf win */
    .chat-msg-group {
      content-visibility: auto;
      contain-intrinsic-height: auto 80px;
    }

    /* ── Image lightbox ── */
    #chat-img-modal {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,.88);
      display: none; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity .18s ease;
    }
    #chat-img-modal.open { display: flex; opacity: 1; }
    #chat-img-modal img {
      max-width: min(84vw, 1200px); max-height: 88vh;
      border-radius: 10px; object-fit: contain;
      box-shadow: 0 8px 48px rgba(0,0,0,.7);
      transition: opacity .12s ease;
    }
    #chat-img-modal-close {
      position: absolute; top: 16px; right: 18px;
      background: rgba(255,255,255,.12); border: none; border-radius: 50%;
      width: 38px; height: 38px; cursor: pointer; color: #fff;
      font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    #chat-img-modal-close:hover { background: rgba(255,255,255,.22); }
    .chat-img-modal-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.12); border: none; border-radius: 50%;
      width: 44px; height: 44px; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s; flex-shrink: 0;
    }
    .chat-img-modal-nav:hover { background: rgba(255,255,255,.26); }
    .chat-img-modal-nav:disabled { opacity: 0; pointer-events: none; }
    #chat-img-modal-prev { left: 14px; }
    #chat-img-modal-next { right: 14px; }
    #chat-img-modal-counter {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,.6); font-size: .82rem; font-weight: 600;
      background: rgba(0,0,0,.4); padding: 3px 10px; border-radius: 20px;
      pointer-events: none;
    }

    /* ── PDF modal ── */
    #chat-pdf-modal {
      position: fixed; inset: 0; z-index: 9000;
      background: #000;
      display: none; flex-direction: column; align-items: stretch;
      opacity: 0;
      transition: opacity .18s ease;
      /* Ensure it uses the real visual viewport on iOS */
      height: 100%; height: 100dvh;
    }
    #chat-pdf-modal.open { display: flex; opacity: 1; }
    #chat-pdf-modal-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: #1a1a1a; flex-shrink: 0;
    }
    #chat-pdf-modal-title {
      flex: 1; font-size: .88rem; font-weight: 600; color: #e5e5e5;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #chat-pdf-modal-download {
      background: rgba(255,255,255,.1); border: none; border-radius: 7px;
      color: #e5e5e5; font-size: .78rem; font-weight: 600; padding: 5px 12px;
      cursor: pointer; transition: background .15s; white-space: nowrap; font-family: inherit;
    }
    #chat-pdf-modal-download:hover { background: rgba(255,255,255,.2); }
    #chat-pdf-modal-close {
      background: rgba(255,255,255,.1); border: none; border-radius: 50%;
      width: 34px; height: 34px; cursor: pointer; color: #fff; font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s; flex-shrink: 0;
    }
    #chat-pdf-modal-close:hover { background: rgba(255,255,255,.22); }
    #chat-pdf-modal iframe {
      flex: 1; min-height: 0; border: none; background: #fff;
      width: 100%; display: block;
    }
    .chat-toolbar-wrap { padding: 0 2px; }
    .chat-empty {
      flex: 1; display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 0.87rem; text-align: center;
      padding: 40px 20px;
    }

    /* ── New Chat panel ───────────────────────────────────────────────────────── */
    .chat-new-hdr {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .chat-new-hdr-title {
      font-size: 1rem; font-weight: 700; color: var(--text); flex: 1;
    }
    .chat-new-cancel {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 0.85rem; font-family: inherit;
      padding: 4px 8px; border-radius: 6px; transition: color .15s;
    }
    .chat-new-cancel:hover { color: var(--text); }
    .chat-new-body {
      padding: 14px 16px;
      flex: 1; overflow-y: auto;
      background: var(--surface);
    }
    .chat-chips-row {
      display: flex; flex-wrap: wrap; gap: 6px;
      margin-bottom: 8px; min-height: 0;
    }
    .chat-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent-subtle); border: 1.5px solid var(--accent);
      border-radius: 20px; padding: 4px 10px 4px 8px;
      font-size: 0.82rem; font-weight: 600; color: var(--text);
    }
    .chat-chip-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1rem; line-height: 1;
      padding: 0 2px; transition: color .15s;
    }
    .chat-chip-remove:hover { color: #ef4444; }
    .chat-people-input {
      width: 100%; box-sizing: border-box;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 10px 14px;
      font-size: 0.87rem; font-family: inherit; color: var(--text);
      outline: none; transition: border-color .15s;
    }
    .chat-people-input:focus { border-color: var(--accent); }
    .chat-autocomplete {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; margin-top: 4px;
      max-height: 260px; overflow-y: auto;
      box-shadow: 0 4px 16px rgba(0,0,0,.08);
    }
    .chat-ac-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; cursor: pointer;
      transition: background .12s;
    }
    .chat-ac-item:hover { background: var(--surface-2); }
    .chat-ac-item:not(:last-child) { border-bottom: 1px solid var(--border); }
    .chat-ac-name { font-size: 0.88rem; font-weight: 600; color: var(--text); }
    .chat-new-footer {
      padding: 12px 16px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }
    .chat-start-btn {
      width: 100%; background: var(--accent); border: none;
      border-radius: 10px; padding: 12px;
      font-size: 0.92rem; font-weight: 700; font-family: inherit;
      cursor: pointer; color: #1a1410;
      transition: opacity .15s;
    }
    .chat-start-btn:disabled { opacity: .45; cursor: default; }

    /* chat.html: always show hamburger, always hide tab bar
       (the tab bar ends up inside #view-chat and is never needed here) */
    #sh-hamburger-btn { display: inline-flex !important; }
    .sh-tab-bar       { display: none       !important; }
  </style>
</head>
<body>
  <header id="app-header" style="display:none"></header>

  <div id="view-chat">

    <!-- LEFT: Sidebar — conversation list -->
    <div id="chat-sidebar">
      <div class="chat-list-hdr">
        <span class="chat-list-title">Messages</span>
        <button class="chat-new-btn" onclick="showNewChat()" title="New conversation">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          New Chat
        </button>
      </div>
      <div class="chat-search-wrap">
        <input class="chat-search-input" id="chat-search-input" type="search" placeholder="Search conversations…"
          oninput="_filterConvList(this.value)" />
      </div>
      <div class="chat-conv-list" id="chat-conv-list">
        <div class="chat-conv-empty">Loading conversations…</div>
      </div>
    </div>

    <!-- RIGHT: Main area — active conversation or new-chat panel -->
    <div id="chat-main-area">

      <!-- Sub-panel: Active conversation -->
      <div id="chat-panel-conversation">
        <div class="chat-conv-hdr">
          <!-- Back button: mobile only (hides sidebar, shows main) -->
          <button class="chat-back-btn" id="chat-mobile-back" onclick="_chatMobileBack()" title="Back" style="display:none">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="chat-conv-hdr-title" id="chat-conv-hdr-title">Group Chat</span>
        </div>
        <div class="chat-messages" id="chat-messages">
          <div class="chat-empty" id="chat-empty">No messages yet — say hello!</div>
        </div>
        <div class="chat-typing" id="chat-typing" style="display:none">
          <div class="typing-dots"><span></span><span></span><span></span></div>
          <span class="typing-label" id="chat-typing-label"></span>
        </div>
        <div class="chat-composer">
          <div class="chat-toolbar-wrap" id="chat-toolbar-container"></div>
          <div class="chat-input-row">
            <textarea class="chat-textarea" id="chat-input" rows="1"
              placeholder="Message…"
              oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,140)+'px';_broadcastTyping()"
              onkeydown="if(event.key==='Enter'&&event.shiftKey){event.preventDefault();sendChatMessage();}"></textarea>
            <button id="chat-send-btn" class="chat-send-btn" onclick="sendChatMessage()" title="Send (Shift+Enter)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Sub-panel: New Chat -->
      <div id="chat-panel-new" style="display:none">
        <div class="chat-new-hdr">
          <button class="chat-back-btn" onclick="showChatList()" title="Back">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <span class="chat-new-hdr-title">New Conversation</span>
          <button class="chat-new-cancel" onclick="showChatList()">Cancel</button>
        </div>
        <div class="chat-new-body">
          <div class="chat-chips-row" id="chat-selected-chips"></div>
          <input class="chat-people-input" id="chat-people-input" type="text" placeholder="Add people…"
            oninput="_onPeopleSearch(this.value)"
            onkeydown="_onPeopleKeydown(event)" />
          <div class="chat-autocomplete" id="chat-autocomplete" style="display:none"></div>
        </div>
        <div class="chat-new-footer">
          <button class="chat-start-btn" id="chat-start-btn" onclick="startNewChat()" disabled>Start Chat</button>
        </div>
      </div>

      <!-- Placeholder shown when no conversation selected (desktop) -->
      <div id="chat-no-selection" style="display:none;flex:1;align-items:center;justify-content:center;color:var(--text-muted);font-size:.9rem;flex-direction:column;gap:10px">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.3"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Select a conversation</span>
      </div>

    </div><!-- end #chat-main-area -->

  </div><!-- end #view-chat -->

<!-- Global Mux progress bar for inline video uploads -->
<div id="mux-global-overlay" style="display:none" class="mux-upload-overlay mux-global-overlay">
  <div class="mux-upload-overlay-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
  <div class="mux-upload-overlay-body">
    <div class="mux-upload-overlay-filename" id="mux-global-filename">Uploading video…</div>
    <div class="mux-upload-overlay-track"><div class="mux-upload-overlay-bar" id="mux-global-bar"></div></div>
    <div class="mux-upload-overlay-status" id="mux-global-status">Starting…</div>
  </div>
</div>
<!-- PDF preview modal -->
<div id="chat-pdf-modal">
  <div id="chat-pdf-modal-bar">
    <span id="chat-pdf-modal-title"></span>
    <a id="chat-pdf-modal-download" download>Download</a>
    <button id="chat-pdf-modal-close" onclick="_chatPdfModalClose()" aria-label="Close">✕</button>
  </div>
  <!-- Desktop: iframe viewer. Mobile: tap-to-open panel (native viewer handles zoom far better) -->
  <iframe id="chat-pdf-modal-frame" src="" title="PDF preview"></iframe>
  <div id="chat-pdf-modal-mobile" style="display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:32px;text-align:center">
    <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
    <p id="chat-pdf-mobile-name" style="color:#e5e5e5;font-weight:600;font-size:.95rem;margin:0"></p>
    <a id="chat-pdf-mobile-open" href="" target="_blank" style="background:var(--accent,#f5c518);color:#1a1410;font-weight:700;font-size:.9rem;padding:11px 28px;border-radius:10px;text-decoration:none;display:inline-block">Open PDF</a>
    <p style="color:#555;font-size:.78rem;margin:0">Opens in your browser's PDF viewer</p>
  </div>

// ── Real viewport height tracker ─────────────────────────────────────────────
// On iOS Safari, CSS 100vh = large viewport (URL bar collapsed) which is bigger
// than the actual current viewport. Use window.innerHeight instead, updated on
// every resize (URL bar expand/collapse, orientation change).
(function _trackWinH() {
  function set() {
    document.documentElement.style.setProperty('--win-h', window.innerHeight + 'px');
  }
  // rAF-debounce: fires at most once per animation frame rather than on every
  // resize pixel, preventing a full layout cascade 60-120× per second.
  let _rafId;
  window.addEventListener('resize', () => {
    if (_rafId) cancelAnimationFrame(_rafId);
    _rafId = requestAnimationFrame(set);
  });
  set();
})();

// ── Prevent iOS page push / rubber-band outside scrollable areas ─────────────
// overscroll-behavior:none alone doesn't stop touch-driven page movement on
// older iOS. Block touchmove on the document; allow it only inside elements

document.addEventListener('touchmove', function(e) {
  if (e.target.closest('.chat-messages, .chat-conv-list, .chat-autocomplete, .sh-notif-list')) {

}, { passive: false });

async function _uploadVideoToMux(file, onDone = null) {
  if (!file || !file.type.startsWith("video/")) { alert("Please select a video file."); return; }
  if (_muxUploading) { alert("A video upload is already in progress."); return; }

  // For inline (reply/comment) uploads use the global fixed bar; for modal use the in-composer one
  const _setOverlay = onDone ? _setGlobalMuxOverlay : _setMuxOverlay;

  if (!onDone) {
    // Close the video panel (only relevant for modal composer)
    _videoUrlPanelOpen = false;
    document.getElementById("composer-video-url-panel").style.display = "none";
    document.getElementById("toolbar-video-btn").classList.remove("recording");
  }
  _setOverlay({ show: true, filename: file.name, pct: 0, status: "Getting upload URL…" });

  _muxUploading = true;
  const _composerBtn = document.getElementById("composer-submit");
  if (_composerBtn) { _composerBtn.disabled = true; _composerBtn.title = "Please wait — video is processing…"; }
  try {
    // Step 1: get a direct Mux upload URL from our edge function
    const token = (await db.auth.getSession()).data.session?.access_token;
    if (!token) throw new Error("You appear to be signed out. Please refresh the page and sign in again.");
    console.log("[Mux] Requesting upload URL…");
    const createRes = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ action: "create-mux-upload" })
    });
    const createText = await createRes.text();
    console.log("[Mux] create-mux-upload response:", createRes.status, createText);
    let createData;
    try { createData = JSON.parse(createText); } catch { throw new Error("Bad response from server: " + createText); }
    if (createData.error) throw new Error(JSON.stringify(createData.error));
    const { uploadId, uploadUrl } = createData;
    if (!uploadUrl) throw new Error("No upload URL returned from server");

    // Step 2: PUT the file directly to Mux with XHR for progress
    _setOverlay({ pct: 0, status: "Uploading… 0%" });
    console.log("[Mux] Starting upload…");
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", uploadUrl);
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          console.log("[Mux] Upload progress:", pct + "%");
          _setOverlay({ pct, status: `Uploading… ${pct}%` });
        }
      };
      xhr.onload = () => {
        console.log("[Mux] Upload complete, status:", xhr.status);
        xhr.status < 300 ? resolve() : reject(new Error("Upload failed (" + xhr.status + ")"));
      };
      xhr.onerror = () => reject(new Error("Network error during upload"));
      xhr.send(file);
    });

    // Step 3: poll for Mux to finish processing
    const barId  = onDone ? "mux-global-bar" : "mux-overlay-bar";
    const barEl  = document.getElementById(barId);
    if (barEl) barEl.classList.add("processing");
    _setOverlay({ pct: 100, status: "Queuing for processing…" });
    console.log("[Mux] Upload done, polling for processing completion. uploadId:", uploadId);

    const processingMessages = [
      { after: 0,   msg: "Queuing for processing…" },
      { after: 10,  msg: "Encoding video…" },
      { after: 30,  msg: "Still encoding — larger videos take a minute or two…" },
      { after: 60,  msg: "Almost there, finishing up…" },
      { after: 120, msg: "This is taking longer than usual, but it's still going…" },
    ];

    let playbackId = null, muxAssetId = null;
    const pollStart = Date.now();
    for (let i = 0; i < 72; i++) {  // up to ~6 min
      await new Promise(r => setTimeout(r, 5000));
      const elapsed = Math.round((Date.now() - pollStart) / 1000);

      const msg = processingMessages.filter(m => elapsed >= m.after).pop()?.msg;
      if (msg) _setOverlay({ status: msg });

      const statusRes = await fetch("/api/daily", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ action: "get-mux-upload-status", uploadId })
      });
      const s = await statusRes.json();
      console.log(`[Mux] Poll ${i + 1} (${elapsed}s): uploadStatus=${s.status} assetStatus=${s.assetStatus} playbackId=${s.playbackId}`);
      if (s.playbackId && s.assetStatus === "ready") { playbackId = s.playbackId; muxAssetId = s.assetId; break; }
      if (s.status === "errored" || s.assetStatus === "errored") throw new Error("Mux reported an error processing the video");
    }
    if (!playbackId) throw new Error("Video processing timed out after 6 minutes — try again");

    console.log("[Mux] Done! playbackId:", playbackId);
    if (barEl) { barEl.classList.remove("processing"); barEl.style.background = "#10b981"; }
    _setOverlay({ pct: 100, status: "✓ Video ready!", filename: file.name });
    await new Promise(r => setTimeout(r, 1500));
    _setOverlay({ show: false });
    const muxItem = { type: "mux", playbackId, assetId: muxAssetId, name: file.name };
    if (onDone) { onDone(muxItem); }
    else { _composerMedia.push(muxItem); _renderMediaPreview(); }

  } catch (e) {
    console.error("[Mux] Upload error:", e);
    _setOverlay({ show: true, filename: "❌ Upload failed", status: e.message, processing: false });
    const barEl = document.getElementById(onDone ? "mux-global-bar" : "mux-overlay-bar");
    if (barEl) barEl.style.background = "#ef4444";
    // Add a dismiss button
    const statusElId = onDone ? "mux-global-status" : "mux-overlay-status";
    const statusEl = document.getElementById(statusElId);
    const dismissFn = onDone ? "_setGlobalMuxOverlay({show:false})" : "_setMuxOverlay({show:false});_muxUploading=false;_resetVideoDropzone()";
    if (statusEl) statusEl.innerHTML =
      escHtml(e.message) +
      `<br><button onclick="${dismissFn}"
        style="margin-top:8px;background:rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.12);
        border-radius:6px;color:#fff;cursor:pointer;font-size:.75rem;padding:4px 10px">Dismiss</button>`;
    if (!onDone) return; // modal path: dismiss button handles _muxUploading = false
  } finally {
    _muxUploading = false;
    const _composerBtnF = document.getElementById("composer-submit");
    if (_composerBtnF) { _composerBtnF.disabled = false; _composerBtnF.title = ""; }
  }
}

let _previewStream = null;

async function toggleVideoRecording() {
  // If already recording video, stop it
  if (_recordingType === "video") { _stopRecording(); return; }
  if (_recordingType) { alert("Already recording. Stop the current recording first."); return; }

  // If preview panel is already open, close it
  const panel = document.getElementById("video-rec-panel");
  if (panel.style.display !== "none") { cancelVideoPreview(); return; }

  try {
    // Get initial stream with defaults
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { aspectRatio: 16/9 } });
    _previewStream = stream;

    // Show live preview
    const preview = document.getElementById("video-rec-preview");
    preview.srcObject = stream;
    panel.style.display = "";
    document.getElementById("toolbar-videorec-btn").classList.add("recording");

    // Enumerate devices now that we have permission
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === "videoinput");
    const mics    = devices.filter(d => d.kind === "audioinput");

    const camSel = document.getElementById("video-rec-camera");
    const micSel = document.getElementById("video-rec-mic");

    // Get current track labels to pre-select
    const activeVideoLabel = stream.getVideoTracks()[0]?.label || "";
    const activeAudioLabel = stream.getAudioTracks()[0]?.label || "";

    camSel.innerHTML = cameras.map(d =>
      `<option value="${d.deviceId}" ${d.label === activeVideoLabel ? "selected" : ""}>${d.label || "Camera " + (cameras.indexOf(d)+1)}</option>`
    ).join("");

      `<option value="${d.deviceId}" ${d.label === activeAudioLabel ? "selected" : ""}>${d.label || "Mic " + (mics.indexOf(d)+1)}</option>`
    ).join("");

  } catch (e) {
    alert("Could not access camera/mic: " + e.message);
    document.getElementById("toolbar-videorec-btn").classList.remove("recording");
  }
}

function _startRecording(stream, type) {
  _recordingType = type;
  const chunks = [];
  const mr = new MediaRecorder(stream);
  mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const mime = mr.mimeType || (type === "voice" ? "audio/webm" : "video/webm");
    const blob = new Blob(chunks, { type: mime });
    const ext = type === "voice"
      ? (mime.includes("mp4") || mime.includes("m4a") || mime.includes("aac") ? "m4a" : mime.includes("ogg") ? "ogg" : "webm")
      : "webm";
    const name = `${type}-${Date.now()}.${ext}`;
    const duration = _recordingStart ? Math.round((Date.now() - _recordingStart) / 1000) : 0;
    clearInterval(_recordingTimer); _recordingTimer = null;
    document.getElementById("composer-recording-indicator").style.display = "none";
    const btnId = type === "voice" ? "toolbar-voice-btn" : "toolbar-videorec-btn";
    document.getElementById(btnId)?.classList.remove("recording");
    _recordingType = null; _voiceRecorder = null; _videoRecorder = null;

    if (type === "video") {
      // Hide and reset the preview panel
      const panel = document.getElementById("video-rec-panel");
      panel.style.display = "none";
      document.getElementById("video-rec-devices").style.display      = "";
      document.getElementById("video-rec-actions").style.display       = "";
      document.getElementById("video-rec-recording-bar").style.display = "none";
      document.getElementById("video-rec-preview").srcObject = null;
      // Route through Mux so large recordings are handled properly
      const file = new File([blob], name, { type: mime });
      _uploadVideoToMux(file);
    } else {
      // Voice recordings are small — store in Supabase Storage as before
      const url = URL.createObjectURL(blob);
      _composerMedia.push({ type: "audio", url, name, blob, duration });
      _renderMediaPreview();
    }
  };
  if (type === "voice") _voiceRecorder = mr; else _videoRecorder = mr;
  mr.start();
  _recordingStart = Date.now();
  const btnId = type === "voice" ? "toolbar-voice-btn" : "toolbar-videorec-btn";
  document.getElementById(btnId)?.classList.add("recording");
  const label = type === "voice" ? "Recording voice…" : "Recording video…";
  document.getElementById("composer-recording-label").textContent = label;
  document.getElementById("composer-recording-time").textContent  = "0:00";
  document.getElementById("composer-recording-indicator").style.display = "";
  _recordingTimer = setInterval(() => {
    const secs = Math.round((Date.now() - _recordingStart) / 1000);
    const m = Math.floor(secs / 60), s = secs % 60;
    const ts = `${m}:${String(s).padStart(2,"0")}`;
    document.getElementById("composer-recording-time").textContent = ts;
    const inPanel = document.getElementById("video-rec-timer");
    if (inPanel) inPanel.textContent = ts;
  }, 1000);
}
