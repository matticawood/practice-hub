// ── Conversations list ────────────────────────────────────────────────────────

async function _loadConversationsList() {
  const listEl = document.getElementById("chat-conv-list");
  listEl.innerHTML = `<div class="chat-conv-empty">Loading…</div>`;

  if (!myEmail) return;

  // 1. Fetch latest message per chat_id where user is involved
  //    We fetch the last 200 messages and group client-side (simple approach)
  const { data: msgs, error } = await db
    .from("community_messages")
    .select("chat_id, content, email, name, created_at, media")
    .order("created_at", { ascending: false })
    .limit(400);

  if (error) {
    listEl.innerHTML = `<div class="chat-conv-empty">Could not load conversations.</div>`;
    return;
  }

  // 2. Also fetch rooms this user participates in
  const { data: participantRows } = await db
    .from("community_chat_participants")
    .select("room_id")
    .eq("email", myEmail);
  const myRoomIds = new Set((participantRows || []).map(r => r.room_id));

  // 3. Deduplicate by chat_id — keep first (most recent) occurrence
  //    Also count unread messages using DB-backed read timestamps
  if (!_chatReadsLoaded) await _loadChatReads();
  const reads = _chatReadsCache;
  const unreadTally = {}; // chat_id → count (from fetched msgs)
  const seen = new Map(); // chat_id -> msg
  for (const msg of (msgs || [])) {
    const cid = msg.chat_id;
    const isDM = cid !== "group" && cid.includes("|") && cid.includes(myEmail);
    const isRoom = myRoomIds.has(cid);
    const isMine = cid === "group" || isDM || isRoom;
    if (!isMine) continue;
    // Count unread (messages not from me, newer than last read)
    if (msg.email !== myEmail) {
      const lastRead = reads[cid];
      if (!lastRead || msg.created_at > lastRead) {
        unreadTally[cid] = (unreadTally[cid] || 0) + 1;
      }
    }
    if (!seen.has(cid)) seen.set(cid, msg);
  }
  // Apply unread counts (keep current count for the active conversation which is always 0)
  for (const [cid] of seen) {
    _chatUnreadCounts[cid] = cid === _currentChatId ? 0 : (unreadTally[cid] || 0);
  }

  // Always include group chat even if no messages
  if (!seen.has("group")) {
    seen.set("group", { chat_id: "group", content: "", email: "", name: "", created_at: null });
  }

  // Always pin a DM with Matt (owner) for non-owner members
  if (myEmail && myEmail.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
    const mattDmId = _dmChatId(OWNER_EMAIL);
    if (!seen.has(mattDmId)) {
      seen.set(mattDmId, { chat_id: mattDmId, content: "", email: OWNER_EMAIL, name: "Matthew", created_at: null });
    }
  }

  // 4. Fetch room names for group DMs
  const roomIds = [...seen.keys()].filter(id => myRoomIds.has(id));
  let roomNames = {};
  if (roomIds.length) {
    const { data: rooms } = await db
      .from("community_chat_rooms")
      .select("id, name, created_at")
      .in("id", roomIds);
    const { data: participants } = await db
      .from("community_chat_participants")
      .select("room_id, email")
      .in("room_id", roomIds);
    for (const r of (rooms || [])) {
      const pEmails = (participants || []).filter(p => p.room_id === r.id).map(p => p.email).filter(e => e !== myEmail);
      roomNames[r.id] = r.name || pEmails.map(e => {
        const m = (_allMembers || []).find(m => m.email === e);
        return m ? m.name : e.split("@")[0];
      }).join(", ") || "Group";
    }
  }

  // 5. Sort: group first, then by recency
  const convList = [...seen.values()].sort((a, b) => {
    if (a.chat_id === "group") return -1;
    if (b.chat_id === "group") return 1;
    return (b.created_at || "") > (a.created_at || "") ? 1 : -1;
  });

  _chatConversations = convList;
  _renderConvList(convList, roomNames);
  _updateChatHeaderBadge();
}

function _renderConvList(convList, roomNames) {
  const listEl = document.getElementById("chat-conv-list");
  if (!convList.length) {
    listEl.innerHTML = `<div class="chat-conv-empty">No conversations yet — start one!</div>`;
    return;
  }

  listEl.innerHTML = convList.map(msg => {
    const cid = msg.chat_id;
    let name, avatarEl;

    if (cid === "group") {
      name = "Group Chat";
      avatarEl = `<div style="width:44px;height:44px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-muted)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>`;
    } else if (cid.includes("|")) {
      // DM
      const otherEmail = cid.split("|").find(e => e !== myEmail) || cid.split("|")[0];
      const member = (_allMembers || []).find(m => m.email === otherEmail);
      name = member ? member.name : (otherEmail.split("@")[0]);
      avatarEl = avatarHtml(otherEmail, name, 44, member?.avatar_url || null);
    } else {
      // Group DM room
      name = roomNames && roomNames[cid] ? roomNames[cid] : "Group";
      avatarEl = `<div style="width:44px;height:44px;border-radius:50%;background:var(--surface-2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text-muted)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>`;
    }

    const preview = msg.content
      ? escHtml(msg.content).slice(0, 60)
      : (Array.isArray(msg.media) && msg.media.length ? "Attachment" : "");
    const timeStr   = msg.created_at ? relativeTime(msg.created_at) : "";
    const unread    = _chatUnreadCounts[cid] || 0;
    const unreadHtml = unread > 0
      ? `<span class="chat-conv-unread-badge">${unread > 99 ? "99+" : unread}</span>` : "";

    return `<button class="chat-conv-row${unread > 0 ? " unread" : ""}" data-chat-id="${escHtml(cid)}" onclick="_openConversation('${escHtml(cid)}')">
      <div class="chat-conv-row-avatars">${avatarEl}</div>
      <div class="chat-conv-row-body">
        <div class="chat-conv-row-top">
          <span class="chat-conv-row-name">${escHtml(name)}</span>
          <span class="chat-conv-row-time">${timeStr}</span>
          ${unreadHtml}
        </div>
        <div class="chat-conv-row-preview">${preview}</div>
      </div>
    </button>`;
  }).join("");
}

function _filterConvList(q) {
  if (!q.trim()) {
    _renderConvList(_chatConversations, {});
    return;
  }
  const lq = q.toLowerCase();
  const filtered = _chatConversations.filter(msg => {
    const name = msg.chat_id === "group" ? "group chat" : msg.chat_id.toLowerCase();
    return name.includes(lq) || (msg.content || "").toLowerCase().includes(lq);
  });
  _renderConvList(filtered, {});
}

// ── Opening a conversation ────────────────────────────────────────────────────

async function _openConversation(chatIdOrEmail, otherName) {
  let chatId, title;
  if (!chatIdOrEmail || chatIdOrEmail === "group") {
    chatId = "group";
    title  = "Group Chat";
  } else if (chatIdOrEmail.includes("|")) {
    chatId = chatIdOrEmail;
    const parts = chatId.split("|");
    const other = parts.find(e => e !== myEmail) || parts[0];
    const member = (_allMembers || []).find(m => m.email === other);
    title = otherName || (member ? member.name : other.split("@")[0]);
  } else if (/^[0-9a-f-]{36}$/i.test(chatIdOrEmail)) {
    // UUID — group DM room
    chatId = chatIdOrEmail;
    title  = otherName || "Group";
  } else {
    // Raw email — DM
    chatId = _dmChatId(chatIdOrEmail);
    const member = (_allMembers || []).find(m => m.email === chatIdOrEmail);
    title  = otherName || (member ? member.name : chatIdOrEmail.split("@")[0]);
  }

  _currentChatId   = chatId;
  _currentChatName = title;

  _setChatPanel("conversation");
  document.getElementById("chat-conv-hdr-title").textContent = title;

  // Highlight active row in sidebar
  document.querySelectorAll(".chat-conv-row").forEach(r => {
    r.classList.toggle("active", r.dataset.chatId === chatId);
  });

  // Mobile: hide sidebar, show main area, show back button (use inline styles to match _chatMobileBack)
  const backBtn = document.getElementById("chat-mobile-back");
  if (window.matchMedia("(max-width: 640px)").matches) {
    document.getElementById("chat-sidebar").style.display   = "none";
    document.getElementById("chat-main-area").style.display = "flex";
    if (backBtn) backBtn.style.display = "flex";
  } else {
    if (backBtn) backBtn.style.display = "none";
  }

  // Inject toolbar
  const toolbarContainer = document.getElementById("chat-toolbar-container");
  _clearInlineState("chat_main");
  toolbarContainer.innerHTML = _inlineToolbarHtml("chat_main");

  // Load messages — fetch one extra to detect whether older pages exist
  document.getElementById("chat-messages").innerHTML =
    `<div class="chat-empty" id="chat-empty" style="color:var(--text-muted);font-size:.85rem">Loading…</div>`;
  _chatMessages  = [];
  _chatHasMore   = false;
  _chatLoadingMore = false;

  const { data, error } = await db
    .from("community_messages")
    .select("*")
    .eq("chat_id", chatId)
    .order("created_at", { ascending: false })
    .limit(CHAT_PAGE_SIZE + 1);

  if (error) {
    document.getElementById("chat-messages").innerHTML =
      `<div class="chat-empty">Could not load messages.</div>`;
    return;
  }

  const rows = data || [];
  if (rows.length > CHAT_PAGE_SIZE) { _chatHasMore = true; rows.pop(); }
  _chatMessages = rows.reverse(); // back to chronological order

  await _fetchPollsAndReactions(_chatMessages.map(m => m.id), true);

  // Mark conversation as read now that messages are loaded
  _markChatRead(chatId);
  _chatUnreadCounts[chatId] = 0;
  _updateConvRowBadge(chatId);
  _updateChatHeaderBadge();

  _renderChatMessages();
  _scrollChatToBottom(true);
}

// Fetch poll votes + reactions for a set of message IDs and merge into global maps.
// Pass reset=true on initial load to clear the maps first.
async function _fetchPollsAndReactions(msgIds, reset = false) {
  if (reset) { _chatPollVotes = {}; _chatRxMap = {}; }
  if (!msgIds.length) return;

  const msgs = msgIds.map(id => _chatMessages.find(m => m.id === id)).filter(Boolean);
  const pollMsgIds = msgs
    .filter(m => {
      const media = Array.isArray(m.media) ? m.media : (typeof m.media === "string" ? JSON.parse(m.media || "[]") : []);
      return media.some(x => x.type === "poll");
    })
    .map(m => m.id);

  const fetches = [
    db.from("community_chat_reactions").select("message_id,email,emoji").in("message_id", msgIds)
  ];
  if (pollMsgIds.length) {
    fetches.push(
      db.from("community_chat_poll_votes").select("message_id,option_idx").in("message_id", pollMsgIds),
      db.from("community_chat_poll_votes").select("message_id,option_idx").eq("email", myEmail).in("message_id", pollMsgIds)
    );
  }
  const results = await Promise.all(fetches);
  const rxRows  = results[0].data || [];
  const allVotes = results[1]?.data || [];
  const myVotes  = results[2]?.data || [];

  rxRows.forEach(r => {
    if (!_chatRxMap[r.message_id]) _chatRxMap[r.message_id] = {};
    if (!_chatRxMap[r.message_id][r.emoji]) _chatRxMap[r.message_id][r.emoji] = { count: 0, mine: false, emails: [] };
    _chatRxMap[r.message_id][r.emoji].count++;
    _chatRxMap[r.message_id][r.emoji].emails.push(r.email);
    if (r.email === myEmail) _chatRxMap[r.message_id][r.emoji].mine = true;
  });
  allVotes.forEach(v => {
    if (!_chatPollVotes[v.message_id]) _chatPollVotes[v.message_id] = { myVote: null, counts: {} };
    _chatPollVotes[v.message_id].counts[v.option_idx] = (_chatPollVotes[v.message_id].counts[v.option_idx] || 0) + 1;
  });
  myVotes.forEach(v => {
    if (!_chatPollVotes[v.message_id]) _chatPollVotes[v.message_id] = { myVote: null, counts: {} };
    _chatPollVotes[v.message_id].myVote = v.option_idx;
  });
}

// Load the next page of older messages and prepend them, preserving scroll position.
async function _loadMoreMessages() {
  if (_chatLoadingMore || !_chatHasMore || !_chatMessages.length) return;
  _chatLoadingMore = true;

  const btn = document.getElementById("chat-load-more-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Loading…"; }

  const oldest = _chatMessages[0].created_at;
  const { data } = await db
    .from("community_messages")
    .select("*")
    .eq("chat_id", _currentChatId)
    .lt("created_at", oldest)
    .order("created_at", { ascending: false })
    .limit(CHAT_PAGE_SIZE + 1);

  const rows = data || [];
  if (rows.length > CHAT_PAGE_SIZE) { _chatHasMore = true; rows.pop(); }
  else _chatHasMore = false;

  const newMsgs = rows.reverse();
  if (!newMsgs.length) { _chatLoadingMore = false; return; }

  _chatMessages = [...newMsgs, ..._chatMessages];
  await _fetchPollsAndReactions(newMsgs.map(m => m.id));

  // Prepend to DOM, preserving scroll position
  const container = document.getElementById("chat-messages");
  const prevScrollHeight = container.scrollHeight;

  // Remove old sentinel
  document.getElementById("chat-load-more-sentinel")?.remove();

  // Prepend new message nodes
  const frag = document.createDocumentFragment();
  const tmp  = document.createElement("div");
  newMsgs.forEach((msg, idx) => {
    const isMine  = msg.email === myEmail;
    const showMeta = idx === 0 || msg.email !== newMsgs[idx - 1].email;
    tmp.innerHTML = _chatMsgHtml(msg, isMine, showMeta);
    if (tmp.firstElementChild) frag.appendChild(tmp.firstElementChild);
  });
  container.insertBefore(frag, container.firstChild);

  // Re-insert sentinel if more pages remain
  if (_chatHasMore) container.insertAdjacentHTML("afterbegin", _chatLoadMoreSentinelHtml());

  // Restore scroll so the user stays at the same visual position
  container.scrollTop += container.scrollHeight - prevScrollHeight;

  _chatLoadingMore = false;
}

function _chatLoadMoreSentinelHtml() {
  return `<div id="chat-load-more-sentinel" style="text-align:center;padding:12px 0">
    <button id="chat-load-more-btn" onclick="_loadMoreMessages()"
      style="background:none;border:1px solid var(--border);border-radius:20px;color:var(--text-muted);
             font-size:.78rem;padding:5px 16px;cursor:pointer;font-family:inherit;transition:color .15s,border-color .15s"
      onmouseover="this.style.color='var(--text)';this.style.borderColor='var(--text)'"
      onmouseout="this.style.color='var(--text-muted)';this.style.borderColor='var(--border)'">
      Load earlier messages
    </button>
  </div>`;
}

// ── Chat reactions ─────────────────────────────────────────────────────────

const CHAT_EMOJIS = ["❤️","👍","😂","🔥","💪","👏","😮"];

function _rxNames(emails) {
  return (emails || []).map(e =>
    e === myEmail ? "You" : ((_allMembers || []).find(m => m.email === e)?.name || e.split("@")[0])
  ).join(", ");
}

function _chatRxHtml(msgId) {
  const rx = _chatRxMap[msgId] || {};
  return Object.entries(rx)
    .filter(([, d]) => d.count > 0)
    .map(([emoji, d]) => {
      const names = _rxNames(d.emails);
      return `<button class="chat-rx-pill${d.mine ? " mine" : ""}" data-names="${escHtml(names)}" onclick="pickChatReaction('${escHtml(msgId)}','${emoji}')">${emoji}${d.count > 1 ? `<span>${d.count}</span>` : ""}</button>`;
    }).join("");
}

function _chatPickerHtml(msgId, isMine) {
  const rx = _chatRxMap[msgId] || {};
  const btns = CHAT_EMOJIS.map(e => {
    const mine = rx[e]?.mine;
    return `<button class="${mine ? "picked" : ""}" data-emoji="${e}" onclick="pickChatReaction('${escHtml(msgId)}','${e}')">${e}</button>`;
  }).join("");
  return `<div class="chat-react-picker${isMine ? " mine" : ""}" id="chat-picker-${escHtml(msgId)}">${btns}</div>`;
}

function toggleChatReactPicker(msgId, ev) {
  ev.stopPropagation();
  // Close any other open picker
  document.querySelectorAll(".chat-react-picker").forEach(p => {
    if (p.id !== `chat-picker-${msgId}`) p.style.display = "none";
  });
  const picker = document.getElementById(`chat-picker-${msgId}`);
  if (!picker) return;
  const isOpen = picker.style.display === "flex";
  picker.style.display = isOpen ? "none" : "flex";
}

async function pickChatReaction(msgId, emoji) {
  // Close picker
  const picker = document.getElementById(`chat-picker-${msgId}`);
  if (picker) picker.style.display = "none";

  if (!_chatRxMap[msgId]) _chatRxMap[msgId] = {};
  const existingEmoji = Object.entries(_chatRxMap[msgId]).find(([, d]) => d.mine)?.[0];

  if (existingEmoji === emoji) {
    // Toggle off
    _chatRxMap[msgId][emoji].mine = false;
    _chatRxMap[msgId][emoji].count = Math.max(0, _chatRxMap[msgId][emoji].count - 1);
    _chatRxMap[msgId][emoji].emails = (_chatRxMap[msgId][emoji].emails || []).filter(e => e !== myEmail);
    await db.from("community_chat_reactions").delete()
      .eq("message_id", msgId).eq("email", myEmail);
  } else {
    // Remove previous reaction if any
    if (existingEmoji) {
      _chatRxMap[msgId][existingEmoji].mine = false;
      _chatRxMap[msgId][existingEmoji].count = Math.max(0, _chatRxMap[msgId][existingEmoji].count - 1);
      _chatRxMap[msgId][existingEmoji].emails = (_chatRxMap[msgId][existingEmoji].emails || []).filter(e => e !== myEmail);
      await db.from("community_chat_reactions").delete()
        .eq("message_id", msgId).eq("email", myEmail);
    }
    if (!_chatRxMap[msgId][emoji]) _chatRxMap[msgId][emoji] = { count: 0, mine: false, emails: [] };
    _chatRxMap[msgId][emoji].mine = true;
    _chatRxMap[msgId][emoji].count++;
    _chatRxMap[msgId][emoji].emails = [...(_chatRxMap[msgId][emoji].emails || []), myEmail];
    await db.from("community_chat_reactions")
      .upsert({ message_id: msgId, email: myEmail, emoji }, { onConflict: "message_id,email" });
  }

  _refreshChatRx(msgId);
  _chatRealtimeSub?.send({ type: "broadcast", event: "chat_reaction", payload: { message_id: msgId } });
}

function _refreshChatRx(msgId) {
  // Update pills row
  const rxRow = document.getElementById(`chat-rx-${msgId}`);
  if (rxRow) rxRow.innerHTML = _chatRxHtml(msgId);
  // Update picker button states
  const picker = document.getElementById(`chat-picker-${msgId}`);
  if (picker) {
    const rx = _chatRxMap[msgId] || {};
    picker.querySelectorAll("button[data-emoji]").forEach(btn => {
      btn.classList.toggle("picked", !!(rx[btn.dataset.emoji]?.mine));
    });
  }
}

async function _refreshChatRxFromDb(msgId) {
  const { data: rxRows } = await db.from("community_chat_reactions")
    .select("email,emoji").eq("message_id", msgId);
  _chatRxMap[msgId] = {};
  (rxRows || []).forEach(r => {
    if (!_chatRxMap[msgId][r.emoji]) _chatRxMap[msgId][r.emoji] = { count: 0, mine: false, emails: [] };
    _chatRxMap[msgId][r.emoji].count++;
    _chatRxMap[msgId][r.emoji].emails.push(r.email);
    if (r.email === myEmail) _chatRxMap[msgId][r.emoji].mine = true;
  });
  _refreshChatRx(msgId);
}

// ── Typing indicator ─────────────────────────────────────────────────────────
const _typingTimers = {}; // email -> clearTimeout handle

let _typingThrottle = 0;
function _broadcastTyping() {
  if (!_chatRealtimeSub || !_currentChatId) return;
  const now = Date.now();
  if (now - _typingThrottle < 2000) return; // throttle: max once per 2s
  _typingThrottle = now;
  _chatRealtimeSub.send({
    type: "broadcast", event: "typing",
    payload: { email: myEmail, name: myName || myEmail.split("@")[0], chat_id: _currentChatId }
  });
}

function _showTyping(email, name) {
  if (email === myEmail) return;
  // Clear previous timer for this user
  clearTimeout(_typingTimers[email]);
  const el    = document.getElementById("chat-typing");
  const label = document.getElementById("chat-typing-label");
  if (!el || !label) return;
  // Add to typing set
  if (!_showTyping._active) _showTyping._active = new Set();
  _showTyping._active.add(name);
  label.textContent = [..._showTyping._active].join(", ") + " is typing…";
  el.style.display = "flex";
  _scrollChatToBottom();
  // Auto-hide after 4s silence
  _typingTimers[email] = setTimeout(() => {
    _showTyping._active?.delete(name);
    if (!_showTyping._active?.size) {
      if (el) el.style.display = "none";
    } else {
      if (label) label.textContent = [..._showTyping._active].join(", ") + " is typing…";
    }
    _scrollChatToBottom();
  }, 4000);
}

async function castChatVote(messageId, optionIdx) {
  if (!myEmail) return;
  const prev = _chatPollVotes[messageId] || { myVote: null, counts: {} };

  // Optimistic update
  if (!_chatPollVotes[messageId]) _chatPollVotes[messageId] = { myVote: null, counts: {} };
  const vdata = _chatPollVotes[messageId];
  // Remove previous vote count
  if (vdata.myVote !== null && vdata.myVote !== undefined) {
    vdata.counts[vdata.myVote] = Math.max(0, (vdata.counts[vdata.myVote] || 1) - 1);
  }
  vdata.myVote = optionIdx;
  vdata.counts[optionIdx] = (vdata.counts[optionIdx] || 0) + 1;

  // Re-render just this message's poll
  const el = document.querySelector(`[data-msg-id="${CSS.escape(messageId)}"]`);
  if (el) {
    const msg = _chatMessages.find(m => m.id === messageId);
    if (msg) {
      const isMine = msg.email === myEmail;
      const prev = el.previousSibling;
      const next = el.nextSibling;
      const tmp = document.createElement("div");
      const showMeta = el.style.marginTop === "10px";
      tmp.innerHTML = _chatMsgHtml(msg, isMine, showMeta);
      el.replaceWith(tmp.firstElementChild);
    }
  }

  // Persist
  const { error } = await db.from("community_chat_poll_votes").upsert(
    { message_id: messageId, email: myEmail, option_idx: optionIdx },
    { onConflict: "message_id,email" }
  );
  if (error) { console.error("Poll vote error", error); return; }

  // Notify other clients so they can refresh this poll's results
  _chatRealtimeSub?.send({
    type: "broadcast",
    event: "poll_vote",
    payload: { message_id: messageId }
  });
}

// Re-fetch vote counts for a poll message and re-render it
async function _refreshChatPoll(messageId) {
  const [{ data: allVotes }, { data: myVotes }] = await Promise.all([
    db.from("community_chat_poll_votes").select("option_idx").eq("message_id", messageId),
    db.from("community_chat_poll_votes").select("option_idx").eq("message_id", messageId).eq("email", myEmail)
  ]);
  if (!_chatPollVotes[messageId]) _chatPollVotes[messageId] = { myVote: null, counts: {} };
  const vdata = _chatPollVotes[messageId];
  vdata.counts = {};
  (allVotes || []).forEach(v => {
    vdata.counts[v.option_idx] = (vdata.counts[v.option_idx] || 0) + 1;
  });
  if (myVotes?.length) vdata.myVote = myVotes[0].option_idx;

  const el  = document.querySelector(`[data-msg-id="${CSS.escape(messageId)}"]`);
  const msg = _chatMessages.find(m => m.id === messageId);
  if (el && msg) {
    const isMine   = msg.email === myEmail;
    const showMeta = el.style.marginTop !== "3px";
    const tmp = document.createElement("div");
    tmp.innerHTML = _chatMsgHtml(msg, isMine, showMeta);
    el.replaceWith(tmp.firstElementChild);
  }
}

// ── Single global realtime subscription ───────────────────────────────────────
// Track IDs we inserted ourselves so realtime echo doesn't duplicate them
const _myInsertedIds = new Set();

function _subscribeGlobalRealtime() {
  if (_chatRealtimeSub) return; // already subscribed
  _chatRealtimeSub = db.channel("community-chat-global")
    .on("postgres_changes", {
      event: "INSERT",
      schema: "public",
      table: "community_messages"
    }, payload => {
      const msg = payload.new;
      if (!msg) return;
      // Skip our own inserts (already shown optimistically)
      if (_myInsertedIds.has(msg.id)) { _myInsertedIds.delete(msg.id); return; }
      // Append to current conversation
      if (_chatState === "conversation" && msg.chat_id === _currentChatId) {
        if (_chatMessages.find(m => m.id === msg.id)) return;
        _chatMessages.push(msg);
        _appendChatMessage(msg);
        _scrollChatToBottom();
        _markChatRead(msg.chat_id); // still reading — keep marked as read
      } else if (msg.email !== myEmail) {
        // Background conversation — increment unread immediately
        _chatUnreadCounts[msg.chat_id] = (_chatUnreadCounts[msg.chat_id] || 0) + 1;
        _updateConvRowBadge(msg.chat_id);
        _updateChatHeaderBadge();
      }
      // Refresh sidebar preview
      if (document.getElementById("view-chat").style.display !== "none") _loadConversationsList();
    })
    .on("broadcast", { event: "new_message" }, ({ payload }) => {
      if (!payload) return;
      const msg = payload;
      // Skip our own messages (already shown optimistically)
      if (_myInsertedIds.has(msg.id)) { _myInsertedIds.delete(msg.id); return; }
      // Append to current conversation if it matches
      if (_chatState === "conversation" && msg.chat_id === _currentChatId) {
        if (_chatMessages.find(m => m.id === msg.id)) return;
        _chatMessages.push(msg);
        _appendChatMessage(msg);
        _scrollChatToBottom();
        _markChatRead(msg.chat_id);
      } else if (msg.email !== myEmail) {
        _chatUnreadCounts[msg.chat_id] = (_chatUnreadCounts[msg.chat_id] || 0) + 1;
        _updateConvRowBadge(msg.chat_id);
        _updateChatHeaderBadge();
      }
      // Refresh sidebar preview
      if (document.getElementById("view-chat").style.display !== "none") _loadConversationsList();
    })
    .on("broadcast", { event: "poll_vote" }, ({ payload }) => {
      if (!payload?.message_id) return;
      // Re-fetch fresh counts from DB and re-render that poll for all clients
      _refreshChatPoll(payload.message_id);
    })
    .on("broadcast", { event: "chat_reaction" }, ({ payload }) => {
      if (!payload?.message_id) return;
      _refreshChatRxFromDb(payload.message_id);
    })
    .on("broadcast", { event: "typing" }, ({ payload }) => {
      if (!payload || payload.chat_id !== _currentChatId) return;
      _showTyping(payload.email, payload.name);
    })
    .subscribe();
}

// Render all messages in the chat area
function _renderChatMessages() {
  // Clear image group store — old keys are stale after a full re-render
  Object.keys(_chatImgGroups).forEach(k => delete _chatImgGroups[k]);

  const container = document.getElementById("chat-messages");
  if (!_chatMessages.length) {
    container.innerHTML = `<div class="chat-empty" id="chat-empty">No messages yet — say hello!</div>`;
    return;
  }
  container.innerHTML = _chatHasMore ? _chatLoadMoreSentinelHtml() : "";
  let lastEmail = null;
  _chatMessages.forEach(msg => {
    const isMine  = msg.email === myEmail;
    const isGroup = msg.email === lastEmail;
    container.insertAdjacentHTML("beforeend", _chatMsgHtml(msg, isMine, !isGroup));
    lastEmail = msg.email;
  });
}

// Format timestamp as clock time (e.g. "12:21 PM"), falling back to date for older
function _chatTime(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  const yesterday = new Date(now); yesterday.setDate(now.getDate() - 1);
  const isYesterday = d.toDateString() === yesterday.toDateString();
  const hhmm = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (isToday)     return hhmm;
  if (isYesterday) return `Yesterday ${hhmm}`;
  return d.toLocaleDateString([], { month: "short", day: "numeric" }) + " " + hhmm;
}

// Build HTML for a single message
function _chatMsgHtml(msg, isMine, showMeta) {
  const rawMedia = Array.isArray(msg.media) ? msg.media
    : (typeof msg.media === "string" ? JSON.parse(msg.media || "[]") : []);

  // Separate polls (render outside the bubble so they don't inherit its colour)
  const pollItem    = rawMedia.find(m => m.type === "poll");
  const nonPollMedia = rawMedia.filter(m => m.type !== "poll");

  // Look up proper display name + avatar — use stored myAvatarUrl for own messages
  const member    = (_allMembers || []).find(m => m.email === msg.email);
  const dispName  = member?.name || msg.name || msg.email?.split("@")[0] || "Member";
  const avatarUrl = isMine ? (myAvatarUrl || member?.avatar_url || null) : (member?.avatar_url || null);
  const name      = escHtml(dispName);
  const timeStr   = _chatTime(msg.created_at);

  const mediaHtml = _renderCommentMedia({ media: nonPollMedia });
  const contentHtml = msg.content ? `<div>${escHtml(msg.content).replace(/\n/g, "<br>")}</div>` : "";
  const bubbleContent = contentHtml + (mediaHtml ? `<div class="chat-media">${mediaHtml}</div>` : "");

  const pollHtml = pollItem ? (() => {
    const opts   = Array.isArray(pollItem.options) ? pollItem.options : [];
    const vdata  = _chatPollVotes[msg.id] || { myVote: null, counts: {} };
    const total  = Object.values(vdata.counts).reduce((a, b) => a + b, 0);
    const voted  = (vdata.myVote !== null && vdata.myVote !== undefined) || isMine;
    const rows   = opts.map((o, i) => {
      const count = vdata.counts[i] || 0;
      const pct   = total ? Math.round((count / total) * 100) : 0;
      const isMe  = vdata.myVote === i;
      if (voted) {
        // Bars are always clickable so the user can change their vote
        return `<div onclick="castChatVote('${escHtml(msg.id)}',${i})" style="cursor:pointer;margin-bottom:8px;padding:2px 0">
          <div style="display:flex;justify-content:space-between;font-size:.82rem;margin-bottom:3px;color:var(--text)${isMe ? ";font-weight:700" : ""}">
            <span>${escHtml(o)}</span>
            <span style="color:var(--text-muted)">${pct}%</span>
          </div>
          <div style="height:6px;border-radius:4px;background:var(--border);overflow:hidden">
            <div style="height:100%;width:${pct}%;border-radius:4px;background:${isMe ? "var(--accent)" : "var(--text-muted)"}"></div>
          </div>
        </div>`;
      } else {
        return `<button onclick="castChatVote('${escHtml(msg.id)}',${i})" style="display:block;width:100%;text-align:left;padding:7px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:.85rem;color:var(--text);margin-bottom:6px;background:var(--surface);cursor:pointer;font-family:inherit;transition:border-color .15s,background .15s" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">${escHtml(o)}</button>`;
      }
    }).join("");
    return `<div style="margin-top:6px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;min-width:240px;max-width:320px">
      <div style="font-weight:700;font-size:.9rem;color:var(--text);margin-bottom:10px">${escHtml(pollItem.question || "Poll")}</div>
      ${rows}
      ${voted ? `<div style="font-size:.75rem;color:var(--text-muted);margin-top:4px">${total} vote${total !== 1 ? "s" : ""}</div>` : ""}
    </div>`;
  })() : "";

  const avatarEl = avatarHtml(msg.email, dispName, 34, avatarUrl);
  const metaHtml = showMeta
    ? `<div class="chat-msg-meta"><span class="chat-msg-name">${name}</span><span class="chat-msg-time">${timeStr}</span></div>`
    : "";

  // Only render the text/media bubble if there's something in it
  const bubbleHtml = bubbleContent
    ? `<div class="chat-bubble${isMine ? " mine" : ""}">${bubbleContent}</div>`
    : "";

  const rxHtml = `<div class="chat-rx-row" id="chat-rx-${escHtml(msg.id)}">${_chatRxHtml(msg.id)}</div>`;
  const pickerHtml = _chatPickerHtml(msg.id, isMine);
  const triggerBtn = `<button class="chat-react-trigger" onclick="toggleChatReactPicker('${escHtml(msg.id)}',event)" title="React">😊</button>`;

  // chat-bubble-inner is position:relative so picker + trigger are anchored to the bubble
  const innerWrap = (bubbleHtml || pollHtml)
    ? `<div class="chat-bubble-inner">${pickerHtml}${bubbleHtml}${pollHtml}${triggerBtn}</div>`
    : "";
  const bubbleWrap = innerWrap
    ? `<div class="chat-bubble-wrap">${innerWrap}${rxHtml}</div>`
    : "";

  return `
  <div class="chat-msg-group${isMine ? " mine" : ""}" data-msg-id="${escHtml(msg.id)}" style="margin-top:${showMeta ? "10" : "3"}px">
    <div class="chat-msg-avatar">${avatarEl}</div>
    <div class="chat-msg-body">
      ${metaHtml}
      ${bubbleWrap}
    </div>
  </div>`;
}

// Append a single new message to the DOM efficiently
function _appendChatMessage(msg) {
  const container = document.getElementById("chat-messages");
  const emptyEl = document.getElementById("chat-empty");
  if (emptyEl) emptyEl.remove();
  const isMine  = msg.email === myEmail;
  const prevMsg = _chatMessages[_chatMessages.length - 2];
  const isGroup = prevMsg && prevMsg.email === msg.email;
  container.insertAdjacentHTML("beforeend", _chatMsgHtml(msg, isMine, !isGroup));
}

// Scroll to bottom of chat
function _scrollChatToBottom(instant) {
  const el = document.getElementById("chat-messages");
  if (!el) return;
  el.scrollTo({ top: el.scrollHeight, behavior: instant ? "auto" : "smooth" });
}

// Send a message
async function sendChatMessage() {
  if (!myEmail) return;
  const sendBtn = document.getElementById("chat-send-btn");
  if (sendBtn && sendBtn.disabled) return;
  if (sendBtn) sendBtn.disabled = true;

  const input = document.getElementById("chat-input");
  const content = (input.value || "").trim();

  let media = [];
  try {
    media = await _uploadInlineMedia("chat_main");
  } catch (e) {
    alert(e.message || "Upload error");
    if (sendBtn) sendBtn.disabled = false;
    return;
  }

  // Include poll data (stored as a media item so it fits the existing schema)
  const pollData = _inlinePollOpen["chat_main"] ? _readInlinePoll("chat_main") : null;
  if (pollData) media = [...media, { type: "poll", question: pollData.question, options: pollData.options }];

  if (!content && !media.length) return;

  const optimistic = {
    id: "opt-" + Date.now(),
    chat_id: _currentChatId,
    email: myEmail,
    name: myName,
    content,
    media,
    created_at: new Date().toISOString()
  };
  _chatMessages.push(optimistic);
  _appendChatMessage(optimistic);
  _scrollChatToBottom();

  input.value = ""; input.style.height = "";
  _clearInlineState("chat_main");
  document.getElementById("chat-toolbar-container").innerHTML = _inlineToolbarHtml("chat_main");

  const { data: inserted, error } = await db.from("community_messages").insert({
    chat_id: _currentChatId,
    email:   myEmail,
    name:    myName,
    content,
    media
  }).select().single();

  if (error) { console.error("Chat send error", error); return; }

  // Register the real ID so the realtime echo is skipped (already shown optimistically)
  _myInsertedIds.add(inserted.id);

  const optEl = document.querySelector(`[data-msg-id="${optimistic.id}"]`);
  const idx = _chatMessages.findIndex(m => m.id === optimistic.id);
  if (idx !== -1) _chatMessages[idx] = inserted;
  // Re-render the optimistic DOM element with the real DB row so media URLs are final
  if (optEl) {
    const showMeta = optEl.style.marginTop !== "3px";
    const tmp = document.createElement("div");
    tmp.innerHTML = _chatMsgHtml(inserted, true, showMeta);
    optEl.replaceWith(tmp.firstElementChild);
  }

  // Broadcast the new message to all connected clients via the realtime channel
  // (postgres_changes requires the table to be in Supabase Realtime publication;
  //  broadcast works immediately for all connected clients)
  if (_chatRealtimeSub) {
    _chatRealtimeSub.send({
      type: "broadcast",
      event: "new_message",
      payload: inserted
    });
  }

  // Refresh conversation list so new/updated convos always appear immediately
  _loadConversationsList();
  if (sendBtn) sendBtn.disabled = false;
}

// Open a DM from a member card/name — called from existing member UI
function openDM(email, name) {
  _showChatView();
  _subscribeGlobalRealtime();
  _openConversation(email, name);
}

// ── New Chat flow ─────────────────────────────────────────────────────────────

async function showNewChat() {
  _newChatSelected = [];
  // Ensure members are loaded for autocomplete
  if (!_membersLoaded) await _loadAllMembers();
  _setChatPanel("new");
  document.getElementById("chat-selected-chips").innerHTML = "";
  document.getElementById("chat-people-input").value = "";
  document.getElementById("chat-autocomplete").style.display = "none";
  document.getElementById("chat-start-btn").disabled = true;
  // Mobile: show main area
  if (window.innerWidth <= 640) {
    document.getElementById("chat-sidebar").classList.add("hidden-mobile");
    document.getElementById("chat-main-area").classList.add("show-mobile");
  }
  setTimeout(() => document.getElementById("chat-people-input").focus(), 50);
}

function _onPeopleSearch(q) {
  const acEl = document.getElementById("chat-autocomplete");
  if (!q.trim()) { acEl.style.display = "none"; return; }
  const lq = q.toLowerCase();
  const selectedEmails = new Set(_newChatSelected.map(s => s.email));
  const results = (_allMembers || []).filter(m =>
    m.email !== myEmail &&
    !selectedEmails.has(m.email) &&
    ((m.name || "").toLowerCase().includes(lq) || (m.email || "").toLowerCase().includes(lq))
  ).slice(0, 8);

  if (!results.length) { acEl.style.display = "none"; return; }

  acEl.style.display = "block";
  acEl.innerHTML = results.map(m => `
    <div class="chat-ac-item" onclick="_selectPerson('${escHtml(m.email)}','${escHtml(m.name || "")}','${escHtml(m.avatar_url || "")}')">
      ${avatarHtml(m.email, m.name, 36, m.avatar_url || null)}
      <span class="chat-ac-name">${escHtml(m.name || m.email)}</span>
    </div>`).join("");
}

function _onPeopleKeydown(event) {
  if (event.key === "Escape") {
    document.getElementById("chat-autocomplete").style.display = "none";
  }
}

function _selectPerson(email, name, avatarUrl) {
  _newChatSelected.push({ email, name, avatarUrl });
  document.getElementById("chat-people-input").value = "";
  document.getElementById("chat-autocomplete").style.display = "none";
  _renderNewChatChips();
  document.getElementById("chat-start-btn").disabled = _newChatSelected.length === 0;
  document.getElementById("chat-people-input").focus();
}

function _removeNewChatPerson(email) {
  _newChatSelected = _newChatSelected.filter(s => s.email !== email);
  _renderNewChatChips();
  document.getElementById("chat-start-btn").disabled = _newChatSelected.length === 0;
}

function _renderNewChatChips() {
  const el = document.getElementById("chat-selected-chips");
  el.innerHTML = _newChatSelected.map(s => `
    <div class="chat-chip">
      ${avatarHtml(s.email, s.name, 22, s.avatarUrl || null)}
      <span>${escHtml(s.name || s.email)}</span>
      <button class="chat-chip-remove" onclick="_removeNewChatPerson('${escHtml(s.email)}')" title="Remove">×</button>
    </div>`).join("");
}

async function startNewChat() {
  if (!_newChatSelected.length) return;
  const btn = document.getElementById("chat-start-btn");
  btn.disabled = true;
  btn.textContent = "Starting…";

  const allParticipants = [myEmail, ..._newChatSelected.map(s => s.email)];

  if (_newChatSelected.length === 1) {
    // Simple DM
    const email = _newChatSelected[0].email;
    const name  = _newChatSelected[0].name;
    _showChatView();
    _subscribeGlobalRealtime();
    await _openConversation(email, name);
  } else {
    // Group DM — create a room
    const { data: room, error: roomErr } = await db.from("community_chat_rooms").insert({
      created_by: myEmail
    }).select().single();
    if (roomErr) { alert("Could not create group chat."); btn.disabled = false; btn.textContent = "Start Chat"; return; }

    const { error: partErr } = await db.from("community_chat_participants").insert(
      allParticipants.map(email => ({ room_id: room.id, email }))
    );
    if (partErr) { console.error("participants insert error", partErr); }

    const names = _newChatSelected.map(s => s.name || s.email.split("@")[0]).join(", ");
    _showChatView();
    _subscribeGlobalRealtime();
    await _openConversation(room.id, names);
  }
}

// ── Mux aspect ratio correction ───────────────────────────────────────────────
// After rendering, detect portrait videos and apply the tall wrapper class.
function fixMuxAspectRatios() {
  document.querySelectorAll('.mux-wrap').forEach(wrap => {
    const player = wrap.querySelector('mux-player');
    if (!player) return;
    const apply = () => {
      const w = player.videoWidth, h = player.videoHeight;
      if (!w || !h) return;
      wrap.classList.toggle('portrait', h > w);
    };
    // Already loaded (e.g. cached)
    if (player.videoWidth) { apply(); return; }
    player.addEventListener('loadedmetadata', apply, { once: true });
  });
}

// ── Chat view (simplified for standalone chat.html) ───────────────────────────
function _showChatView() {
  window._chatPageActive = true; // tell shared-header to step aside for badge management
  document.body.style.overflow = "hidden";
  document.documentElement.style.overflow = "hidden";
  // Hide the tab bar and show the hamburger instead (gives desktop users a nav option)
  const tb   = document.getElementById("sh-tab-bar");
  const hbtn = document.getElementById("sh-hamburger-btn");
  if (tb)   tb.style.display = "none";
  if (hbtn) hbtn.style.display = "inline-flex";
  const hdr   = document.getElementById("app-header");
  const topPx = hdr ? Math.round(hdr.getBoundingClientRect().bottom) : 60;
  // Set CSS variables; #view-chat uses calc(var(--win-h) - --hdr-h - --kb-h)
  document.documentElement.style.setProperty("--win-h", window.innerHeight + "px");
  document.documentElement.style.setProperty("--hdr-h", topPx + "px");
  const chatEl = document.getElementById("view-chat");
  // Clear any stale inline styles from previous renders
  chatEl.style.top = "";
  chatEl.style.height = "";
  chatEl.style.bottom = "";
  chatEl.style.display = "flex";
  // Track keyboard height via visualViewport → updates --kb-h CSS variable
  _attachChatViewportListener();
}
function _hideChatView() { /* no-op on chat.html — this IS the chat page */ }


async function _loadAllMembers() {
  _membersLoaded = true;
  const { data } = await db
    .from("allowed_emails")
    .select("email, name, headline, avatar_url")
    .eq("subscription_status", "active")
    .eq("onboarded", true)
    .order("name", { ascending: true });
  _allMembers = (data || []).filter(m => m.name && m.name.trim());
  // Re-render chat messages now that member names/avatars are available
  if (_chatMessages.length) {
    _renderChatMessages();
    _scrollChatToBottom(true);
  }
}

// ── Auth bootstrap ────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName      = ae?.name || myEmail.split("@")[0];
  isAdmin     = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();
  myAvatarUrl = ae?.avatar_url || null;

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "chat", avatarUrl: myAvatarUrl });

  await _loadAllMembers(); // load members first so avatars are ready when chat renders
  await showChat("group");
})();

</script>
