// ── Media preview rendering ───────────────────────────────────────────────────
function _renderMediaPreview() {
  const area = document.getElementById("composer-media-preview");
  if (!_composerMedia.length) { area.innerHTML = ""; return; }
  const images = _composerMedia.filter(m => m.type === "image");
  const others = _composerMedia.filter(m => m.type !== "image");
  let html = "";
  if (images.length) {
    const cols = Math.min(images.length, 2);
    html += `<div class="media-preview-images" style="grid-template-columns:repeat(${cols},1fr)">` +
      images.map((m, i) => {
        const idx = _composerMedia.indexOf(m);
        return `<div class="media-thumb-wrap">
          <img src="${m.url}" alt="${escHtml(m.name)}" style="${cols > 1 ? "height:180px;object-fit:cover" : ""}" />
          <button class="media-thumb-remove" onclick="removeMedia(${idx})" title="Remove">×</button>
        </div>`;
      }).join("") + `</div>`;
  }
  const rmBtnPost = (idx) => `<button onclick="removeMedia(${idx})" style="position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;transition:background .15s" onmouseover="this.style.background='#ef4444'" onmouseout="this.style.background='rgba(0,0,0,.55)'">×</button>`;
  others.forEach(m => {
    const idx = _composerMedia.indexOf(m);
    if (m.type === "mux") {
      html += `<div style="position:relative;margin-top:6px">
        <div class="mux-wrap"><mux-player playback-id="${escHtml(m.playbackId)}" controls></mux-player></div>
        ${rmBtnPost(idx)}
      </div>`;
    } else if (m.type === "youtube") {
      html += `<div style="position:relative;margin-top:6px;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden">
        <iframe src="https://www.youtube.com/embed/${escHtml(m.ytId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe>
        ${rmBtnPost(idx)}
      </div>`;
    } else if (m.type === "vimeo") {
      html += `<div style="position:relative;margin-top:6px;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden">
        <iframe src="https://player.vimeo.com/video/${escHtml(m.vimeoId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe>
        ${rmBtnPost(idx)}
      </div>`;
    } else if (m.type === "audio") {
      const dur = m.duration ? ` · ${m.duration}s` : "";
      html += `<div style="margin-top:6px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:.78rem;color:var(--text-muted)">🎙️ Voice message${escHtml(dur)}</span>
          <button onclick="removeMedia(${idx})" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.85rem;padding:0 2px" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--text-muted)'">×</button>
        </div>
        <audio controls preload="auto" style="width:100%;display:block;border-radius:8px"><source src="${escHtml(m.url)}" type="${_audioMimeType(m)}"></audio>
      </div>`;
    } else if (m.type === "code") {
      html += `<span class="media-chip"></> ${escHtml((m.html || "").slice(0, 30))}…<button class="media-chip-remove" onclick="removeMedia(${idx})" title="Remove">×</button></span>`;
    } else {
      html += `<span class="media-chip">📎 ${escHtml(m.name)}<button class="media-chip-remove" onclick="removeMedia(${idx})" title="Remove">×</button></span>`;
    }
  });
  area.innerHTML = html;
}

async function _deleteMuxAsset(assetId) {
  if (!assetId) return;
  try {
    const token = (await db.auth.getSession()).data.session?.access_token;
    await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ action: "delete-mux-asset", assetId })
    });
  } catch (e) { console.warn("Mux asset delete failed:", e); }
}

function removeMedia(idx) {
  const m = _composerMedia[idx];
  if (m?.type === "mux" && m.assetId) _deleteMuxAsset(m.assetId);
  _composerMedia.splice(idx, 1);
  _renderMediaPreview();
}

// ── Inline toolbar (comment + reply composers) ────────────────────────────────

function _inlineKey(key) {
  // Ensure per-key media array exists
  if (!_inlineMedia[key]) _inlineMedia[key] = [];
  return key;
}

function _renderInlineMediaPreview(key) {
  const area = document.getElementById(`inline-media-preview-${key}`);
  if (!area) return;
  const media = _inlineMedia[key] || [];
  if (!media.length) { area.innerHTML = ""; return; }
  const images = media.filter(m => m.type === "image");
  const others = media.filter(m => m.type !== "image");
  let html = "";
  if (images.length) {
    const cols = Math.min(images.length, 2);
    html += `<div class="media-preview-images" style="grid-template-columns:repeat(${cols},1fr)">` +
      images.map((m, i) => {
        const idx = media.indexOf(m);
        return `<div class="media-thumb-wrap">
          <img src="${m.url}" alt="${escHtml(m.name)}" style="${cols > 1 ? "height:180px;object-fit:cover" : ""}" />
          <button class="media-thumb-remove" onclick="removeInlineMedia('${key}',${idx})" title="Remove">×</button>
        </div>`;
      }).join("") + `</div>`;
  }
  const rmBtn = (fn) => `<button onclick="${fn}" style="position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;transition:background .15s" onmouseover="this.style.background='#ef4444'" onmouseout="this.style.background='rgba(0,0,0,.55)'">×</button>`;
  others.forEach(m => {
    const idx = media.indexOf(m);
    const rm  = `removeInlineMedia('${key}',${idx})`;
    if (m.type === "mux") {
      if (m._uploading && m._localUrl) {
        html += `<div style="position:relative;margin-top:6px">
          <video src="${escHtml(m._localUrl)}" class="chat-preview-video" style="border:1.5px solid var(--border)"></video>
          <div style="position:absolute;bottom:0;left:0;right:0;padding:6px 8px;background:rgba(0,0,0,.5);border-radius:0 0 8px 8px;font-size:.75rem;color:#fff;display:flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="animation:spin 1s linear infinite;flex-shrink:0"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10"/></svg> Uploading…</div>
          ${rmBtn(rm)}
        </div>`;
      } else if (m._uploading) {
        html += `<span class="media-chip" style="opacity:.6;margin-top:6px;display:inline-flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" style="animation:spin 1s linear infinite;flex-shrink:0"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10"/></svg>${escHtml(m.name)} — uploading…</span>`;
      } else {
        html += `<div style="position:relative;margin-top:6px">
          <div class="comment-mux-wrap"><mux-player playback-id="${escHtml(m.playbackId)}" controls></mux-player></div>
          ${rmBtn(rm)}
        </div>`;
      }
    } else if (m.type === "youtube") {
      html += `<div style="position:relative;margin-top:6px;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden">
        <iframe src="https://www.youtube.com/embed/${escHtml(m.ytId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe>
        ${rmBtn(rm)}
      </div>`;
    } else if (m.type === "vimeo") {
      html += `<div style="position:relative;margin-top:6px;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden">
        <iframe src="https://player.vimeo.com/video/${escHtml(m.vimeoId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe>
        ${rmBtn(rm)}
      </div>`;
    } else if (m.type === "audio") {
      const dur = m.duration ? ` · ${m.duration}s` : "";
      html += `<div style="margin-top:6px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:.78rem;color:var(--text-muted)">🎙️ Voice message${escHtml(dur)}</span>
          <button onclick="${rm}" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.85rem;padding:0 2px" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--text-muted)'">×</button>
        </div>
        <audio controls preload="auto" style="width:100%;display:block;border-radius:8px"><source src="${escHtml(m.url)}" type="${_audioMimeType(m)}"></audio>
      </div>`;
    } else {
      html += `<span class="media-chip" style="margin-top:6px">📎 ${escHtml(m.name)}<button class="media-chip-remove" onclick="${rm}" title="Remove">×</button></span>`;
    }
  });
  area.innerHTML = html;

  // Disable the relevant send button while a Mux video is still uploading/processing
  {
    const isUploading = (media || []).some(m => m._uploading);
    let sendBtnId;
    if (key === "chat_main")          sendBtnId = "chat-send-btn";
    else if (key === "main")          sendBtnId = "comment-send-btn";
    else if (key === "activity_main") sendBtnId = "activity-comment-send-btn";
    else                              sendBtnId = `reply-send-btn-${key}`; // post reply or activity reply
    const sendBtn = document.getElementById(sendBtnId);
    if (sendBtn) {
      sendBtn.disabled = isUploading;
      sendBtn.title = isUploading ? "Please wait — video is processing…" : (key === "chat_main" ? "Send (Shift+Enter)" : "");
    }
    // Also try activity reply btn (activity replies share UUID keys with post replies)
    const actReplySendBtn = document.getElementById(`activity-reply-send-btn-${key}`);
    if (actReplySendBtn) {
      actReplySendBtn.disabled = isUploading;
      actReplySendBtn.title = isUploading ? "Please wait — video is processing…" : "";
    }
  }
}

function removeInlineMedia(key, idx) {
  if (_inlineMedia[key]) {
    const m = _inlineMedia[key][idx];
    if (m?.type === "mux" && m.assetId) _deleteMuxAsset(m.assetId);
    _inlineMedia[key].splice(idx, 1);
  }
  _renderInlineMediaPreview(key);
}

async function inlineHandleImage(input, key) {
  _inlineKey(key);
  const files = Array.from(input.files || []);
  input.value = "";
  for (const file of files) {
    if (!file.type.startsWith("image/")) {
      alert(`"${file.name}" is not an image. Use the file attachment button to send other file types.`);
      continue;
    }
    const compressed = await compressImage(file);
    const url = URL.createObjectURL(compressed);
    _inlineMedia[key].push({ type: "image", url, name: compressed.name, blob: compressed });
    _renderInlineMediaPreview(key);
  }
}

function inlineHandleFile(input, key) {
  _inlineKey(key);
  const file = input.files[0];
  if (!file) return;
  _inlineMedia[key].push({ type: "file", name: file.name, blob: file });
  input.value = "";
  _renderInlineMediaPreview(key);
}

// ── Mutual exclusion: close every inline panel except the one being opened ────
function _closeInlineExcept(key, except) {
  if (except !== "video") {
    const vp = document.getElementById(`inline-vid-panel-${key}`);
    if (vp && vp.style.display !== "none") {
      vp.style.display = "none";
      document.getElementById(`inline-vid-btn-${key}`)?.classList.remove("recording");
    }
  }
  if (except !== "poll") {
    const pp = document.getElementById(`inline-poll-${key}`);
    if (pp && pp.style.display !== "none") {
      pp.style.display = "none";
      _inlinePollOpen[key] = false;
      (document.getElementById(`inline-${key === "main" ? "main" : key}-poll-btn`) ||
       document.getElementById(`inline-poll-btn-${key}`))?.classList.remove("recording");
    }
  }
  if (except !== "cam") {
    if (_inlineCamPreviewKey === key) inlineCancelCamPreview(key);
    if (_inlineCamKey === key && _inlineCamRec && _inlineCamRec.state !== "inactive") _inlineCamRec.stop();
  }
  if (except !== "voice") {
    if (_inlineVoiceRec[key] && _inlineVoiceRec[key].state !== "inactive") _inlineVoiceRec[key].stop();
  }
}

async function toggleInlineVoice(key) {
  if (_inlineVoiceRec[key]) {
    // Currently recording — stop
    if (_inlineVoiceRec[key].state !== "inactive") _inlineVoiceRec[key].stop();
    return;
  }
  _closeInlineExcept(key, "voice");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    const mr = new MediaRecorder(stream);
    _inlineVoiceRec[key] = mr;
    mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(_inlineRecTimer[key]);
      _inlineRecTimer[key] = null;
      _inlineVoiceRec[key] = null;
      const recInd = document.getElementById(`inline-recording-${key}`);
      if (recInd) recInd.style.display = "none";
      const btn = document.getElementById(`inline-${key === "main" ? "main" : key}-voice-btn`) ||
                  document.getElementById(`inline-voice-btn-${key}`);
      if (btn) btn.classList.remove("recording");
      const mime = mr.mimeType || "audio/webm";
      const blob = new Blob(chunks, { type: mime });
      const duration = _inlineRecStart[key] ? Math.round((Date.now() - _inlineRecStart[key]) / 1000) : 0;
      // Use the correct extension for the MIME type so storage serves it back correctly
      // iOS Safari records as audio/mp4; Chrome/Android as audio/webm
      const ext = mime.includes("mp4") || mime.includes("m4a") || mime.includes("aac") ? "m4a"
        : mime.includes("ogg") ? "ogg"
        : "webm";
      const name = `voice-${Date.now()}.${ext}`;
      _inlineKey(key);
      _inlineMedia[key].push({ type: "audio", url: URL.createObjectURL(blob), name, blob, duration, mimeType: mime });
      _renderInlineMediaPreview(key);
    };
    mr.start();
    _inlineRecStart[key] = Date.now();
    const voiceBtn = document.getElementById(`inline-${key === "main" ? "main" : key}-voice-btn`) ||
                     document.getElementById(`inline-voice-btn-${key}`);
    if (voiceBtn) voiceBtn.classList.add("recording");
    const recInd = document.getElementById(`inline-recording-${key}`);
    const timeEl = document.getElementById(`inline-rec-time-${key}`);
    if (recInd) recInd.style.display = "";
    _inlineRecTimer[key] = setInterval(() => {
      const secs = Math.round((Date.now() - _inlineRecStart[key]) / 1000);
      const m = Math.floor(secs / 60), s = secs % 60;
      if (timeEl) timeEl.textContent = `${m}:${String(s).padStart(2, "0")}`;
    }, 1000);
  } catch (e) {
    alert("Microphone access denied: " + e.message);
  }
}

function stopInlineVoice(key) {
  if (_inlineVoiceRec[key] && _inlineVoiceRec[key].state !== "inactive") {
    _inlineVoiceRec[key].stop();
  }
}

// ── Inline video ───────────────────────────────────────────────────────────────
function inlineToggleVideoPanel(key) {
  const panel  = document.getElementById(`inline-vid-panel-${key}`);
  const btn    = document.getElementById(`inline-vid-btn-${key}`);
  if (!panel) return;
  const open = panel.style.display === "none";
  if (open) _closeInlineExcept(key, "video");
  panel.style.display = open ? "" : "none";
  btn?.classList.toggle("recording", open);
  if (open) inlineSwitchVideoTab("upload", key);
}

function inlineSwitchVideoTab(tab, key) {
  const upPanel = document.getElementById(`inline-vt-up-${key}`);
  const emPanel = document.getElementById(`inline-vt-em-${key}`);
  const upBtn   = document.getElementById(`inline-vt-up-btn-${key}`);
  const emBtn   = document.getElementById(`inline-vt-em-btn-${key}`);
  const tabActive = "background:rgba(0,0,0,.07);border-radius:4px;font-weight:600";
  if (upPanel) upPanel.style.display = tab === "upload" ? "" : "none";
  if (emPanel) emPanel.style.display = tab === "embed"  ? "" : "none";
  if (upBtn) upBtn.style.cssText = upBtn.style.cssText.replace(/font-weight:\s*600/g, "") + (tab === "upload" ? tabActive : "");
  if (emBtn) emBtn.style.cssText = emBtn.style.cssText.replace(/font-weight:\s*600/g, "") + (tab === "embed"  ? tabActive : "");
}

function inlineHandleVideo(input, key) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  inlineToggleVideoPanel(key);
  if (!_inlineMedia[key]) _inlineMedia[key] = [];
  // Show a pending chip immediately so the user knows it's uploading
  const pendingIdx = _inlineMedia[key].length;
  _inlineMedia[key].push({ type: "mux", name: file.name, _uploading: true, _localUrl: URL.createObjectURL(file) });
  _renderInlineMediaPreview(key);
  _uploadVideoToMux(file, item => {
    _inlineMedia[key][pendingIdx] = item;
    _renderInlineMediaPreview(key);
  });
}

function inlineAddVideoUrl(key) {
  const input = document.getElementById(`inline-vurl-${key}`);
  const val   = input?.value.trim();
  if (!val) return;
  if (!_inlineMedia[key]) _inlineMedia[key] = [];
  const ytId = parseYouTubeId(val);
  const viId = parseVimeoId(val);
  if (ytId)      _inlineMedia[key].push({ type: "youtube",   ytId,     url: val, name: "YouTube video" });
  else if (viId) _inlineMedia[key].push({ type: "vimeo",     vimeoId: viId, url: val, name: "Vimeo video" });
  else           _inlineMedia[key].push({ type: "video-url", url: val, name: "Video" });
  if (input) input.value = "";
  inlineToggleVideoPanel(key);
  _renderInlineMediaPreview(key);
}

async function inlineToggleCamRec(key) {
  // If preview is open for this key, cancel it
  if (_inlineCamPreviewKey === key) { inlineCancelCamPreview(key); return; }
  // If actively recording for this key, stop it
  if (_inlineCamKey === key && _inlineCamRec && _inlineCamRec.state !== "inactive") {
    inlineStopCamRecording(key); return;
  }
  // Block concurrent recordings/previews
  if (_inlineCamRec && _inlineCamRec.state !== "inactive") {
    alert("Stop the current camera recording first."); return;
  }
  if (_inlineCamPreviewStream) { inlineCancelCamPreview(_inlineCamPreviewKey); }
  _closeInlineExcept(key, "cam");

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { aspectRatio: 16/9 } });
    _inlineCamPreviewStream = stream;
    _inlineCamPreviewKey    = key;

    const preview = document.getElementById(`inline-cam-preview-${key}`);
    const panel   = document.getElementById(`inline-cam-panel-${key}`);
    const btn     = document.getElementById(`inline-camrec-btn-${key}`);
    if (preview) preview.srcObject = stream;
    if (panel)   panel.style.display = "";
    if (btn)     btn.classList.add("recording");

    // Enumerate devices now that we have permission
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === "videoinput");
    const mics    = devices.filter(d => d.kind === "audioinput");
    const activeVideoLabel = stream.getVideoTracks()[0]?.label || "";
    const activeAudioLabel = stream.getAudioTracks()[0]?.label || "";

    const camSel = document.getElementById(`inline-cam-sel-${key}`);
    const micSel = document.getElementById(`inline-mic-sel-${key}`);
    if (camSel) camSel.innerHTML = cameras.map(d =>
      `<option value="${d.deviceId}" ${d.label === activeVideoLabel ? "selected" : ""}>${d.label || "Camera " + (cameras.indexOf(d)+1)}</option>`
    ).join("");
    if (micSel) micSel.innerHTML = mics.map(d =>
      `<option value="${d.deviceId}" ${d.label === activeAudioLabel ? "selected" : ""}>${d.label || "Mic " + (mics.indexOf(d)+1)}</option>`
    ).join("");
  } catch (e) {
    alert("Could not access camera/mic: " + e.message);
  }
}

async function inlineSwitchCamDevice(key) {
  if (!_inlineCamPreviewStream || _inlineCamPreviewKey !== key) return;
  const camSel = document.getElementById(`inline-cam-sel-${key}`);
  const micSel = document.getElementById(`inline-mic-sel-${key}`);
  _inlineCamPreviewStream.getTracks().forEach(t => t.stop());
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: camSel?.value ? { deviceId: { exact: camSel.value } } : true,
      audio: micSel?.value ? { deviceId: { exact: micSel.value } } : true,
    });
    _inlineCamPreviewStream = stream;
    const preview = document.getElementById(`inline-cam-preview-${key}`);
    if (preview) preview.srcObject = stream;
  } catch (e) { alert("Could not switch device: " + e.message); }
}

function inlineStartCamRecording(key) {
  if (!_inlineCamPreviewStream) return;
  // Hide device/action UI, show recording bar
  const devs    = document.getElementById(`inline-cam-devices-${key}`);
  const actions = document.getElementById(`inline-cam-actions-${key}`);
  const recBar  = document.getElementById(`inline-cam-recbar-${key}`);
  if (devs)    devs.style.display    = "none";
  if (actions) actions.style.display = "none";
  if (recBar)  recBar.style.display  = "";

  const stream = _inlineCamPreviewStream;
  _inlineCamPreviewStream = null;
  _inlineCamStream = stream;
  _inlineCamKey    = key;

  const chunks = [];
  const mr     = new MediaRecorder(stream);
  _inlineCamRec = mr;
  mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const mime = mr.mimeType || "video/webm";
    const blob = new Blob(chunks, { type: mime });
    const name = `video-${Date.now()}.webm`;
    const file = new File([blob], name, { type: mime });
    const ck   = _inlineCamKey;
    // Reset panel
    const panel   = document.getElementById(`inline-cam-panel-${ck}`);
    const preview = document.getElementById(`inline-cam-preview-${ck}`);
    const devEl   = document.getElementById(`inline-cam-devices-${ck}`);
    const actEl   = document.getElementById(`inline-cam-actions-${ck}`);
    const barEl   = document.getElementById(`inline-cam-recbar-${ck}`);
    const btnEl   = document.getElementById(`inline-camrec-btn-${ck}`);
    if (preview) preview.srcObject = null;
    if (panel)   panel.style.display   = "none";
    if (devEl)   devEl.style.display   = "";
    if (actEl)   actEl.style.display   = "";
    if (barEl)   barEl.style.display   = "none";
    if (btnEl)   btnEl.classList.remove("recording");
    clearInterval(_inlineRecTimer[ck]);
    _inlineCamRec = null; _inlineCamStream = null; _inlineCamKey = null; _inlineCamPreviewKey = null;
    // Queue Mux upload
    if (!_inlineMedia[ck]) _inlineMedia[ck] = [];
    const pendingIdx = _inlineMedia[ck].length;
    _inlineMedia[ck].push({ type: "mux", name, _uploading: true, _localUrl: URL.createObjectURL(blob) });
    _renderInlineMediaPreview(ck);
    _uploadVideoToMux(file, item => {
      _inlineMedia[ck][pendingIdx] = item;
      _renderInlineMediaPreview(ck);
    });
  };
  mr.start();

  _inlineRecStart[key] = Date.now();
  _inlineRecTimer[key] = setInterval(() => {
    const secs = Math.round((Date.now() - _inlineRecStart[key]) / 1000);
    const m = Math.floor(secs / 60), s = secs % 60;
    const el = document.getElementById(`inline-cam-timer-${key}`);
    if (el) el.textContent = `${m}:${String(s).padStart(2,"0")}`;
  }, 1000);
}

function inlineStopCamRecording(key) {
  if (_inlineCamRec && _inlineCamKey === key && _inlineCamRec.state !== "inactive") {
    _inlineCamRec.stop();
  }
}

function inlineCancelCamPreview(key) {
  if (_inlineCamPreviewStream) {
    _inlineCamPreviewStream.getTracks().forEach(t => t.stop());
    _inlineCamPreviewStream = null;
  }
  _inlineCamPreviewKey = null;
  const preview = document.getElementById(`inline-cam-preview-${key}`);
  const panel   = document.getElementById(`inline-cam-panel-${key}`);
  const btn     = document.getElementById(`inline-camrec-btn-${key}`);
  if (preview) preview.srcObject = null;
  if (panel)   panel.style.display = "none";
  if (btn)     btn.classList.remove("recording");
}

function toggleInlinePoll(key) {
  const panel = document.getElementById(`inline-poll-${key}`);
  if (!panel) return;
  const open = panel.style.display === "none";
  if (open) _closeInlineExcept(key, "poll");
  panel.style.display = open ? "" : "none";
  _inlinePollOpen[key] = open;
  const btn = document.getElementById(`inline-${key === "main" ? "main" : key}-poll-btn`) ||
              document.getElementById(`inline-poll-btn-${key}`);
  if (btn) btn.classList.toggle("recording", open);
  if (open) document.getElementById(`inline-poll-q-${key}`)?.focus();
}

function addInlinePollOption(key) {
  const list = document.getElementById(`inline-poll-opts-${key}`);
  if (!list) return;
  const count = list.querySelectorAll(".poll-option-input").length + 1;
  const row = document.createElement("div");
  row.className = "poll-option-row";
  row.innerHTML = `<input class="poll-option-input" placeholder="Option ${count}" /><button class="poll-option-remove" onclick="removeInlinePollOption(this)">×</button>`;
  list.appendChild(row);
}

function removeInlinePollOption(btn) {
  const list = btn.closest(".poll-options-list") || btn.closest("[id^='inline-poll-opts-']");
  if (!list) return;
  if (list.querySelectorAll(".poll-option-row").length <= 2) return;
  btn.closest(".poll-option-row").remove();
  list.querySelectorAll(".poll-option-input").forEach((input, i) => {
    if (!input.value) input.placeholder = `Option ${i + 1}`;
  });
}

function _readInlinePoll(key) {
  const q = document.getElementById(`inline-poll-q-${key}`)?.value.trim();
  const opts = Array.from(document.querySelectorAll(`#inline-poll-opts-${key} .poll-option-input`))
    .map(i => i.value.trim()).filter(Boolean);
  if (!q || opts.length < 2) return null;
  return { question: q, options: opts };
}

function _clearInlineState(key) {
  _inlineMedia[key] = [];
  _inlinePollOpen[key] = false;
  if (_inlineVoiceRec[key] && _inlineVoiceRec[key].state !== "inactive") {
    _inlineVoiceRec[key].stop();
  }
  _inlineVoiceRec[key] = null;
  if (_inlineCamKey === key && _inlineCamRec && _inlineCamRec.state !== "inactive") {
    _inlineCamRec.stop();
  }
  if (_inlineCamKey === key) { _inlineCamRec = null; _inlineCamKey = null; }
  clearInterval(_inlineRecTimer[key]);
  _inlineRecTimer[key] = null;
  _inlineRecStart[key] = null;
  _renderInlineMediaPreview(key);
  const recInd = document.getElementById(`inline-recording-${key}`);
  if (recInd) recInd.style.display = "none";
  // Hide all panels
  document.getElementById(`inline-poll-${key}`)?.style.setProperty("display", "none");
  document.getElementById(`inline-vid-panel-${key}`)?.style.setProperty("display", "none");
  document.getElementById(`inline-cam-panel-${key}`)?.style.setProperty("display", "none");
  // Reset all button highlights
  document.getElementById(`inline-poll-btn-${key}`)?.classList.remove("recording");
  document.getElementById(`inline-vid-btn-${key}`)?.classList.remove("recording");
  document.getElementById(`inline-voice-btn-${key}`)?.classList.remove("recording");
  document.getElementById(`inline-camrec-btn-${key}`)?.classList.remove("recording");
  // Also handle "main" static toolbar IDs when key === "main"
  if (key === "main") {
    document.getElementById("inline-main-poll-btn")?.classList.remove("recording");
    document.getElementById("inline-vid-btn-main")?.classList.remove("recording");
    document.getElementById("inline-main-voice-btn")?.classList.remove("recording");
    document.getElementById("inline-camrec-btn-main")?.classList.remove("recording");
    document.getElementById("inline-vid-panel-main")?.style.setProperty("display", "none");
    document.getElementById("inline-cam-panel-main")?.style.setProperty("display", "none");
  }
  // Cancel any open camera preview
  if (_inlineCamPreviewKey === key) inlineCancelCamPreview(key);
  const pollPanel = document.getElementById(`inline-poll-${key}`);
  if (pollPanel) pollPanel.style.display = "none";
  const pollQ = document.getElementById(`inline-poll-q-${key}`);
  if (pollQ) pollQ.value = "";
  const pollOpts = document.getElementById(`inline-poll-opts-${key}`);
  if (pollOpts) {
    // Reset to 2 blank options
    pollOpts.innerHTML = `
      <div class="poll-option-row"><input class="poll-option-input" placeholder="Option 1" /><button class="poll-option-remove" onclick="removeInlinePollOption(this)">×</button></div>
      <div class="poll-option-row"><input class="poll-option-input" placeholder="Option 2" /><button class="poll-option-remove" onclick="removeInlinePollOption(this)">×</button></div>
    `;
  }
}

// Render media attached to a comment row
function _renderCommentMedia(c) {
  const media = Array.isArray(c.media) ? c.media : [];
  if (!media.length) return "";
  let html = "";
  const images = media.filter(m => m.type === "image");
  const others = media.filter(m => m.type !== "image");
  if (images.length) {
    const cols = Math.min(images.length, 2);
    const gk = _chatImgGroupStore(images.map(m => m.url));
    const multi = cols > 1;
    html += `<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:6px;margin-top:6px">` +
      images.map((m, i) =>
        `<div class="chat-img-wrap${multi ? " multi" : ""}">` +
          `<img src="${escHtml(m.url)}" alt="${escHtml(m.name)}" decoding="async" ` +
            `style="${multi ? "height:160px;object-fit:cover;" : "max-height:420px;object-fit:contain;"}width:100%;cursor:pointer" ` +
            `onclick="_chatImgModalOpen('${gk}',${i})" loading="lazy" ` +
            `onload="this.closest('.chat-img-wrap').classList.add('loaded')">` +
        `</div>`
      ).join("") +
      `</div>`;
  }
  others.forEach(m => {
    if (m.type === "mux") {
      html += `<div style="margin-top:8px;width:min(480px,70vw);aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:#000"><mux-player playback-id="${escHtml(m.playbackId)}" controls style="width:100%;height:100%;display:block"></mux-player></div>`;
    } else if (m.type === "audio") {
      html += `<div style="margin-top:6px;min-width:240px"><audio controls preload="metadata" style="width:100%;min-width:240px;border-radius:8px"><source src="${escHtml(m.url)}" type="${_audioMimeType(m)}"></audio></div>`;
    } else if (m.type === "youtube") {
      html += `<div style="margin-top:8px;width:min(480px,70vw);border-radius:8px;overflow:hidden;aspect-ratio:16/9"><iframe src="https://www.youtube.com/embed/${escHtml(m.ytId)}" style="width:100%;height:100%;border:0;display:block" allowfullscreen loading="lazy"></iframe></div>`;
    } else if (m.type === "vimeo") {
      html += `<div style="margin-top:8px;width:min(480px,70vw);border-radius:8px;overflow:hidden;aspect-ratio:16/9"><iframe src="https://player.vimeo.com/video/${escHtml(m.vimeoId)}" style="width:100%;height:100%;border:0;display:block" allowfullscreen loading="lazy"></iframe></div>`;
    } else if (m.type === "file") {
      const isPdf = (m.name || "").toLowerCase().endsWith(".pdf");
      if (isPdf) {
        html += `<div style="margin-top:6px"><button onclick="_chatPdfModalOpen('${escHtml(m.url)}','${escHtml(m.name)}')" class="post-media-chip" style="background:none;border:none;cursor:pointer;font-family:inherit;padding:0"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>${escHtml(m.name)}</button></div>`;
      } else {
        html += `<div style="margin-top:6px"><a href="${escHtml(m.url)}" target="_blank" download="${escHtml(m.name)}" class="post-media-chip"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>${escHtml(m.name)}</a></div>`;
      }
    } else if (m.type === "poll") {
      const opts = Array.isArray(m.options) ? m.options : [];
      html += `<div style="margin-top:8px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;min-width:240px;max-width:340px">
        <div style="font-weight:700;font-size:.9rem;color:var(--text);margin-bottom:10px">${escHtml(m.question || "Poll")}</div>
        ${opts.map(o => `<div style="padding:7px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:.85rem;color:var(--text);margin-bottom:6px;background:var(--surface)">${escHtml(o)}</div>`).join("")}
      </div>`;
    }
  });
  return html;
}

// Upload inline media blobs to storage and return JSON-serialisable array
async function _uploadInlineMedia(key) {
  const media = _inlineMedia[key] || [];
  // Block if any video is still uploading to Mux
  if (media.some(m => m._uploading)) {
    throw new Error("A video is still uploading — please wait for it to finish.");
  }
  const result = [];
  for (const m of media) {
    if (m.type === "mux") {
      result.push({ type: "mux", playbackId: m.playbackId, assetId: m.assetId, name: m.name });
    } else if (m.type === "youtube") {
      result.push({ type: "youtube", ytId: m.ytId, url: m.url, name: m.name });
    } else if (m.type === "vimeo") {
      result.push({ type: "vimeo", vimeoId: m.vimeoId, url: m.url, name: m.name });
    } else if (m.blob) {
      const publicUrl = await uploadToStorage(m.blob, m.name);
      const entry = { type: m.type, url: publicUrl, name: m.name };
      if (m.duration)  entry.duration  = m.duration;
      if (m.mimeType)  entry.mimeType  = m.mimeType;
      result.push(entry);
    } else {
      result.push({ type: m.type, url: m.url, name: m.name });
    }
  }
  return result;
}
// Returns the correct MIME type for an audio media object.
// Stored mimeType takes precedence; falls back to extension in the filename.
function _audioMimeType(m) {
  if (m.mimeType) return m.mimeType;
  const ext = (m.name || "").split(".").pop().toLowerCase();
  return { m4a: "audio/mp4", mp4: "audio/mp4", ogg: "audio/ogg", webm: "audio/webm" }[ext] || "";
}

function parseYouTubeId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([^&\s]+)/);
  return m ? m[1] : null;
}
function parseVimeoId(url) {
  const m = url.match(/vimeo\.com\/(\d+)/);
  return m ? m[1] : null;
}
// ── Client-side image compression ────────────────────────────────────────────
// Resizes to maxPx on the longest side and re-encodes as JPEG @ quality.
// GIFs are returned as-is (compression strips animation).
// Falls back to original if canvas output is somehow larger.
async function compressImage(file, { maxPx = 1920, quality = 0.82 } = {}) {
  if (file.type === "image/gif") return file;
  return new Promise(resolve => {
    const img = new Image();
    const rawUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(rawUrl);
      let { naturalWidth: w, naturalHeight: h } = img;
      if (w > maxPx || h > maxPx) {
        const r = Math.min(maxPx / w, maxPx / h);
        w = Math.round(w * r);
        h = Math.round(h * r);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        if (!blob || blob.size >= file.size) { resolve(file); return; }
        const name = file.name.replace(/\.[^.]+$/, "") + ".jpg";
        resolve(new File([blob], name, { type: "image/jpeg" }));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(rawUrl); resolve(file); };
    img.src = rawUrl;
  });
}

async function uploadToStorage(blob, filename) {
  const MAX_MB = 500;
  if (blob.size > MAX_MB * 1024 * 1024) {
    const sizeMB = (blob.size / 1024 / 1024).toFixed(0);
    throw new Error(`"${filename}" is ${sizeMB} MB — files must be under ${MAX_MB} MB.`);
  }
  const safe = `${myEmail}/${Date.now()}-${filename.replace(/[^a-z0-9._-]/gi, "_")}`;
  const { data, error } = await db.storage.from("community-uploads").upload(safe, blob);
  if (error) {
    if (error.message?.toLowerCase().includes("size") || error.statusCode === 413) {
      throw new Error(`"${filename}" is too large for storage. Try a smaller file or use a video embed link instead.`);
    }
    throw error;
  }
  return db.storage.from("community-uploads").getPublicUrl(data.path).data.publicUrl;
}
function escHtml(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

// ── Image lightbox ────────────────────────────────────────────────────────────
const _chatImgGroups = {};  // groupKey → [url, ...]
let _chatImgCurrentGroup = null;
let _chatImgCurrentIdx   = 0;

function _chatImgGroupStore(urls) {
  const key = "g" + Date.now() + Math.random().toString(36).slice(2, 6);
  _chatImgGroups[key] = urls;
  return key;
}

function _chatImgModalOpen(groupKey, index = 0) {
  const urls  = _chatImgGroups[groupKey];
  if (!urls) return;
  _chatImgCurrentGroup = groupKey;
  _chatImgCurrentIdx   = index;
  const modal = document.getElementById("chat-img-modal");
  if (modal) { modal.style.display = "flex"; requestAnimationFrame(() => modal.classList.add("open")); }
  _chatImgModalShow();
  document.addEventListener("keydown", _chatImgModalKeyHandler);
}

function _chatImgModalShow() {
  const urls    = _chatImgGroups[_chatImgCurrentGroup] || [];
  const idx     = _chatImgCurrentIdx;
  const modal   = document.getElementById("chat-img-modal");
  if (modal && modal.style.display === "none") { modal.style.display = "flex"; requestAnimationFrame(() => modal.classList.add("open")); }
  const img     = document.getElementById("chat-img-modal-img");
  const prev    = document.getElementById("chat-img-modal-prev");
  const next    = document.getElementById("chat-img-modal-next");
  const counter = document.getElementById("chat-img-modal-counter");
  if (!modal || !img) return;

  img.src = urls[idx] || "";
  modal.classList.add("open");

  const multi = urls.length > 1;
  if (prev)    prev.disabled    = !multi || idx === 0;
  if (next)    next.disabled    = !multi || idx === urls.length - 1;
  if (counter) { counter.style.display = multi ? "" : "none"; counter.textContent = `${idx + 1} / ${urls.length}`; }
}

function _chatImgModalNav(dir) {
  const urls = _chatImgGroups[_chatImgCurrentGroup] || [];
  const next = _chatImgCurrentIdx + dir;
  if (next < 0 || next >= urls.length) return;
  _chatImgCurrentIdx = next;
  _chatImgModalShow();
}

function _chatImgModalClose() {
  const modal = document.getElementById("chat-img-modal");
  if (modal) modal.classList.remove("open");
  document.removeEventListener("keydown", _chatImgModalKeyHandler);
  setTimeout(() => {
    const img = document.getElementById("chat-img-modal-img");
    if (img) img.src = "";
    if (modal) modal.style.display = "none";
  }, 200);
  _chatImgCurrentGroup = null;
}

function _chatImgModalKeyHandler(e) {
  if (e.key === "Escape")     _chatImgModalClose();
  if (e.key === "ArrowRight") _chatImgModalNav(1);
  if (e.key === "ArrowLeft")  _chatImgModalNav(-1);
}

// ── PDF modal ─────────────────────────────────────────────────────────────────
const _isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

function _chatPdfModalOpen(url, name) {
  const modal      = document.getElementById("chat-pdf-modal");
  const frame      = document.getElementById("chat-pdf-modal-frame");
  const mobilePane = document.getElementById("chat-pdf-modal-mobile");
  const title      = document.getElementById("chat-pdf-modal-title");
  const dl         = document.getElementById("chat-pdf-modal-download");
  if (!modal) { window.open(url, "_blank"); return; }

  if (title) title.textContent = name || "Document";
  if (dl)    { dl.href = url; dl.download = name || "document.pdf"; }

  if (_isMobile) {
    // On mobile use the native PDF viewer via a tap — iframes crash on zoom
    if (frame)      { frame.style.display = "none"; frame.src = ""; }
    if (mobilePane) {
      mobilePane.style.display = "flex";
      const nameEl = document.getElementById("chat-pdf-mobile-name");
      const openEl = document.getElementById("chat-pdf-mobile-open");
      if (nameEl) nameEl.textContent = name || "Document";
      if (openEl) openEl.href = url;
    }
  } else {
    // Desktop: inline iframe works fine
    if (mobilePane) mobilePane.style.display = "none";
    if (frame)      { frame.style.display = "block"; frame.src = url; }
  }

  modal.style.display = "flex";
  requestAnimationFrame(() => modal.classList.add("open"));
  document.addEventListener("keydown", _chatPdfModalKeyClose);
}
function _chatPdfModalClose() {
  const modal = document.getElementById("chat-pdf-modal");
  const frame = document.getElementById("chat-pdf-modal-frame");
  if (modal) modal.classList.remove("open");
  document.removeEventListener("keydown", _chatPdfModalKeyClose);
  setTimeout(() => {
    if (frame) frame.src = "";
    if (modal) modal.style.display = "none";
  }, 200);
}

function _chatPdfModalKeyClose(e) { if (e.key === "Escape") _chatPdfModalClose(); }

function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}

function avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)", fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)", fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)", fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}

function avatarHtml(email, name, size = 32, avatarUrl = null) {
  const style = `width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;`;
  if (avatarUrl) {
    return `<div style="${style}overflow:hidden"><img src="${escHtml(avatarUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block" /></div>`;
  }
  const c = avatarColour(email);
  const ini = initials(name || email?.split("@")[0] || "?");
  const fontSize = Math.round(size * 0.34);
  return `<div style="${style}background:${c.bg};color:${c.fg};display:flex;align-items:center;justify-content:center;font-size:${fontSize}px;font-weight:800">${ini}</div>`;
}

function relativeTime(ts) {
  if (!ts) return "";
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if (m < 2)  return "just now";
  if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`;
  if (d === 1) return "yesterday";
  return `${d}d ago`;
}

function formatMinutes(mins) {
  if (!mins||mins<=0) return "0 min";
  const h = Math.floor(mins/60), m = mins%60;
  if (h===0) return `${m} min`;
  if (m===0) return `${h}h`;
  return `${h}h ${m}m`;
}

// ── Community Chat ────────────────────────────────────────────────────────────

let _currentChatId   = "group";       // 'group', 'email1|email2', or room UUID
let _currentChatName = "Group Chat";  // display name for current chat
let _chatRealtimeSub = null;          // single global realtime channel
let _chatMessages    = [];            // loaded messages for current conversation
let _chatConversations = [];          // list of all known conversations for this user
let _chatState       = "list";        // 'list' | 'conversation' | 'new'
let _chatPollVotes   = {};            // messageId -> { myVote: optionIdx|null, counts: {optionIdx: count} }
let _chatRxMap       = {};            // messageId -> { emoji -> { count, mine } }
let _chatHasMore     = false;         // whether older messages exist beyond current page
let _chatLoadingMore = false;         // guard against concurrent load-more requests
const CHAT_PAGE_SIZE = 50;            // messages per page
let _chatUnreadCounts = {};           // chat_id → unread count
let _chatReadsCache   = {};           // chat_id → last_read_at ISO string (in-memory mirror of DB)
let _chatReadsLoaded  = false;        // true once we've fetched from DB at least once

// ── Read-tracking (DB-backed, cross-device) ───────────────────────────────────
async function _loadChatReads() {
  if (!myEmail) return;
  const { data } = await db.from("community_chat_reads")
    .select("chat_id, last_read_at")
    .eq("email", myEmail);
  _chatReadsCache = {};
  (data || []).forEach(r => { _chatReadsCache[r.chat_id] = r.last_read_at; });
  _chatReadsLoaded = true;
}

function _markChatRead(chatId) {
  const now = new Date().toISOString();
  _chatReadsCache[chatId] = now;
  // Fire-and-forget upsert — keeps DB in sync for other devices
  db.from("community_chat_reads").upsert(
    { email: myEmail, chat_id: chatId, last_read_at: now },
    { onConflict: "email,chat_id" }
  ).then(() => {});
}

function _updateChatHeaderBadge() {
  const total = Object.values(_chatUnreadCounts).reduce((a, b) => a + b, 0);
  // Delegate to shared-header so the same badge function works on all pages
  if (window._shSetChatBadge) window._shSetChatBadge(total);
}
function _updateConvRowBadge(chatId) {
  const row = document.querySelector(`.chat-conv-row[data-chat-id="${CSS.escape(chatId)}"]`);
  if (!row) return;
  const count = _chatUnreadCounts[chatId] || 0;
  let badge = row.querySelector(".chat-conv-unread-badge");
  row.classList.toggle("unread", count > 0);
  if (count > 0) {
    if (!badge) {
      badge = document.createElement("span");
      badge.className = "chat-conv-unread-badge";
      row.querySelector(".chat-conv-row-top")?.appendChild(badge);
    }
    badge.textContent = count > 99 ? "99+" : String(count);
  } else if (badge) {
    badge.remove();
  }
}

// New-chat selection state
let _newChatSelected = [];            // [{email, name, avatarUrl}]

// Build a DM chat_id from two emails (sorted so it's canonical)
function _dmChatId(otherEmail) {
  return [myEmail, otherEmail].sort().join("|");
}

// ── Chat state switching ──────────────────────────────────────────────────────

function _setChatPanel(panel) {
  // Sidebar stays always visible — only toggle panels inside chat-main-area
  document.getElementById("chat-panel-conversation").style.display = panel === "conversation" ? "flex" : "none";
  document.getElementById("chat-panel-new").style.display          = panel === "new"          ? "flex" : "none";
  const noSel = document.getElementById("chat-no-selection");
  if (noSel) noSel.style.display = panel === "no-selection" ? "flex" : "none";
  _chatState = panel;
}

// Show the full chat view (switches away from posts/activity/members)
let _chatViewportHandler = null;
function _attachChatViewportListener() {
  _detachChatViewportListener();
  if (!window.visualViewport) return;
  _chatViewportHandler = () => {
    const vv = window.visualViewport;
    // Keyboard height = how much the visual viewport is shorter than the layout viewport.
    // vv.offsetTop accounts for any iOS layout-viewport scroll (usually 0).
    const kbH = Math.max(0, Math.round(window.innerHeight - vv.offsetTop - vv.height));
    document.documentElement.style.setProperty("--kb-h", kbH + "px");
  };
  window.visualViewport.addEventListener("resize", _chatViewportHandler);
  window.visualViewport.addEventListener("scroll", _chatViewportHandler);
  _chatViewportHandler(); // set initial value immediately
}
function _detachChatViewportListener() {
  if (_chatViewportHandler && window.visualViewport) {
    window.visualViewport.removeEventListener("resize", _chatViewportHandler);
    window.visualViewport.removeEventListener("scroll", _chatViewportHandler);
  }
  document.documentElement.style.setProperty("--kb-h", "0px");
  _chatViewportHandler = null;
}

// Called from the nav "Chat" button — open group chat with sidebar visible
async function showChat(chatIdOrEmail, otherName) {

}

// Called by Cancel/Back in the new-chat panel — return to prior conversation or no-selection
function showChatList() {

    _setChatPanel("conversation");
  } else {
