<style>
  :root{--bg:#0d0d0f;--surface:#161618;--surface2:#1e1e22;--border:#2b2b31;--ink:#f2f1ef;--mut:#9a9aa2;--gold:#f5c518}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px}
  header{display:flex;align-items:center;justify-content:space-between;padding:12px 22px;border-bottom:1px solid var(--border);background:var(--surface)}
  header .ht{font-weight:700;letter-spacing:.02em}
  header .hr{display:flex;align-items:center;gap:14px;color:var(--mut);font-size:.86rem}
  a.back{color:var(--gold);text-decoration:none;font-weight:600}
  .btn{background:var(--surface2);border:1px solid var(--border);color:var(--ink);border-radius:8px;padding:8px 13px;font-size:.86rem;font-weight:600;cursor:pointer;font-family:inherit}
  .btn:hover{border-color:#3a3a42}
  .btn-gold{background:var(--gold);color:#1a1410;border-color:var(--gold)}
  .btn-sm{padding:5px 10px;font-size:.8rem}
  main{padding:22px;display:none}
  .cs-grid{display:grid;grid-template-columns:minmax(0,380px) 1fr;gap:24px;max-width:1080px;margin:0 auto}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
  label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);margin:14px 0 5px}
  input[type=text],textarea,select{width:100%;background:#121214;border:1px solid var(--border);border-radius:8px;color:var(--ink);padding:9px 11px;font-size:.9rem;font-family:inherit}
  textarea{line-height:1.5;resize:vertical}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
  .seg{display:inline-flex;background:#121214;border:1px solid var(--border);border-radius:9px;padding:3px;gap:3px}
  .seg button{background:none;border:0;color:var(--mut);padding:7px 16px;border-radius:6px;font-weight:600;cursor:pointer;font-family:inherit;font-size:.86rem}
  .seg button.on{background:var(--gold);color:#1a1410}
  .swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .sw{width:30px;height:30px;border-radius:7px;border:2px solid transparent;cursor:pointer}
  .sw.on{border-color:var(--gold)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px}
  .hint{font-size:.74rem;color:var(--mut);margin-top:5px}
  .cs-preview{display:flex;flex-direction:column;align-items:center;gap:16px}
  .cs-stage{background:#0a0a0b;border:1px solid var(--border);border-radius:14px;padding:34px;display:flex;justify-content:center}
  .dlrow{display:flex;gap:10px;align-items:center;width:100%;max-width:420px}
  .dlrow input{flex:1}
  #auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center}
  #auth .box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px;width:300px}
  #auth h1{font-size:1.1rem;margin:0 0 14px}
  .err{color:#f87171;font-size:.8rem;margin-bottom:8px;display:none}

  /* ── the cover system ── */
  .bc{position:relative;width:320px;height:452px;overflow:hidden;font-family:'Inter',sans-serif}
  .bc-frame{position:absolute;inset:15px;border:1.5px solid var(--frame)}
  .bc-frame:before{content:"";position:absolute;inset:9px;border:1px solid var(--frame);opacity:.55}
  .bc-ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center}
  .bc-ey{font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.3em}
  .bc-ti{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.015em;line-height:1}
  .bc-bn{font-family:'Fraunces',serif;font-weight:500;font-size:15px;margin-top:14px;line-height:1.2;white-space:nowrap}
  .bc-au{font-weight:700;text-transform:uppercase;font-size:11.5px;letter-spacing:.26em}
  .bc-ro{display:block;font-family:'Fraunces',serif;font-style:italic;font-weight:500;text-transform:none;font-size:11.5px;margin-top:6px;white-space:nowrap}
  .bc.guide{background:#f5eee1;--frame:#a8811a}
  /* clef-hero lockup: eyebrow at top, big navy clef as the graphic hero, title beneath, name pinned bottom */
  .bc.guide .bc-ct{justify-content:flex-start;padding:46px 30px 38px}
  .bc.guide .bc-ey{color:#21405f;letter-spacing:.26em}
  .bc.guide .bc-cl{width:auto;height:172px;color:#21405f;display:block;margin:30px 0 10px}
  .bc.guide .bc-ti{color:#221c14;font-size:27px;line-height:1.05}
  .bc.guide .bc-bn{color:#3b3224;margin-top:14px}
  .bc.guide .bc-au{margin-top:auto;color:#221c14}.bc.guide .bc-ro{color:#74695a}
  .bc.work{--frame:#c69a3a;color:#f6efe1}
  .bc.work .bc-ct{justify-content:flex-start;padding:40px 30px 38px}
  .bc.work .bc-ey{color:#e7d9ba}
  .bc.work .bc-bk{font-size:11px;letter-spacing:.4em;font-weight:700;text-transform:uppercase;margin-top:30px;color:#d8b258}
  .bc.work .bc-nu{font-family:'Fraunces',serif;font-weight:600;font-size:114px;line-height:.82;margin:2px 0 12px;color:#f3ead6}
  .bc.work .bc-ti{color:#f6efe1;font-size:30px}
  .bc.work .bc-bn{color:#d9ccb1}
  .bc.work .bc-au{color:#efe8d9;margin-top:auto}.bc.work .bc-ro{color:#bfb49a}
  .bc-stk{position:absolute;top:60px;right:30px;width:82px;height:82px;border-radius:50%;background:#ecc63f;box-shadow:0 6px 14px rgba(0,0,0,.5);transform:rotate(-10deg);z-index:5}
  .bc-stk:before{content:"";position:absolute;inset:5px;border:1.5px solid rgba(58,47,18,.4);border-radius:50%}
  .bc-stk .s1{position:absolute;top:22px;left:0;width:100%;text-align:center;font-family:'Fraunces',serif;font-weight:600;font-size:25px;line-height:1;color:#3a2f12}
  .bc-stk .s2{position:absolute;top:50px;left:0;width:100%;text-align:center;font-size:7px;letter-spacing:.13em;font-weight:700;color:#3a2f12}
  /* inverted (cream) version of a workbook: cream paper, ACCENT-coloured frame + hero number/eyebrow,
     and an outline gold seal (cream fill, gold ring + gold text) kept in the same spot as the coloured seal */
