<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Animated style tree icon</title>
  <desc>A clean vector tree illustration with rounded leaves, curved branches, and motion accents.</desc>

  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.18"/>
    </filter>

    <linearGradient id="trunkGradient" x1="512" y1="310" x2="512" y2="830" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B27A45"/>
      <stop offset="1" stop-color="#6F4328"/>
    </linearGradient>

    <linearGradient id="leafGradient" x1="310" y1="260" x2="720" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7CCB69"/>
      <stop offset="0.5" stop-color="#4FA35B"/>
      <stop offset="1" stop-color="#2F7C47"/>
    </linearGradient>
  </defs>

  <!-- soft glow -->
  <circle cx="512" cy="475" r="365" fill="#F5C518" opacity="0.06"/>
  <circle cx="512" cy="475" r="285" fill="#F5C518" opacity="0.08"/>

  <!-- motion arcs -->
  <path d="M225 575C180 470 215 350 310 275" stroke="#F5C518" stroke-width="14" stroke-linecap="round" opacity="0.55"/>
  <path d="M805 330C875 430 855 560 770 650" stroke="#F5C518" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
  <path d="M250 705C195 610 180 505 225 415" stroke="#F5C518" stroke-width="8" stroke-linecap="round" opacity="0.35"/>
  <path d="M790 230C850 315 875 425 835 525" stroke="#F5C518" stroke-width="8" stroke-linecap="round" opacity="0.32"/>

  <!-- ground shadow -->
  <ellipse cx="512" cy="836" rx="235" ry="48" fill="#000000" opacity="0.14"/>

  <g filter="url(#softShadow)">
    <!-- canopy blobs -->
    <g>
      <circle cx="355" cy="360" r="128" fill="url(#leafGradient)"/>
      <circle cx="505" cy="285" r="155" fill="url(#leafGradient)"/>
      <circle cx="672" cy="365" r="132" fill="url(#leafGradient)"/>
      <circle cx="325" cy="525" r="125" fill="url(#leafGradient)"/>
      <circle cx="512" cy="495" r="184" fill="url(#leafGradient)"/>
      <circle cx="720" cy="530" r="125" fill="url(#leafGradient)"/>
      <circle cx="430" cy="650" r="118" fill="url(#leafGradient)"/>
      <circle cx="610" cy="660" r="122" fill="url(#leafGradient)"/>
    </g>

    <!-- branches behind trunk -->
    <g stroke="#75482B" stroke-linecap="round" stroke-linejoin="round">
      <path d="M515 560C455 495 410 438 360 382" stroke-width="34"/>
      <path d="M528 530C585 465 645 410 700 350" stroke-width="30"/>
      <path d="M510 470C495 405 480 350 455 295" stroke-width="24"/>
      <path d="M493 615C440 585 390 565 338 555" stroke-width="22"/>
      <path d="M540 625C598 590 650 570 705 562" stroke-width="22"/>
    </g>

    <!-- trunk -->
    <path d="M456 810C470 705 484 600 492 475C495 430 500 382 512 325C524 382 529 430 532 475C540 600 554 705 568 810H456Z" fill="url(#trunkGradient)"/>
    <path d="M502 780C508 665 510 540 512 385" stroke="#D19A5D" stroke-width="16" stroke-linecap="round" opacity="0.55"/>

    <!-- leaf highlights -->
    <g opacity="0.72">
      <ellipse cx="430" cy="300" rx="38" ry="24" fill="#A8E381"/>
      <ellipse cx="565" cy="255" rx="46" ry="28" fill="#A8E381"/>
      <ellipse cx="665" cy="410" rx="42" ry="25" fill="#A8E381"/>
      <ellipse cx="385" cy="520" rx="44" ry="27" fill="#A8E381"/>
      <ellipse cx="520" cy="455" rx="54" ry="32" fill="#A8E381"/>
      <ellipse cx="625" cy="620" rx="45" ry="27" fill="#A8E381"/>
      <ellipse cx="455" cy="665" rx="42" ry="25" fill="#A8E381"/>
    </g>
  </g>

  <!-- floating leaves / animated style accents -->
  <g>
    <ellipse cx="205" cy="360" rx="28" ry="16" fill="#59AA57" transform="rotate(-22 205 360)"/>
    <path d="M194 360C202 358 210 358 218 362" stroke="#2F7C47" stroke-width="4" stroke-linecap="round"/>

    <ellipse cx="815" cy="418" rx="28" ry="16" fill="#74C766" transform="rotate(28 815 418)"/>
    <path d="M804 418C812 416 820 417 828 421" stroke="#2F7C47" stroke-width="4" stroke-linecap="round"/>

    <ellipse cx="776" cy="690" rx="30" ry="17" fill="#4FA35B" transform="rotate(-18 776 690)"/>
    <path d="M764 690C772 687 781 688 789 693" stroke="#2F7C47" stroke-width="4" stroke-linecap="round"/>

    <ellipse cx="240" cy="660" rx="27" ry="15" fill="#7CCB69" transform="rotate(24 240 660)"/>
    <path d="M230 660C238 658 246 658 253 663" stroke="#2F7C47" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
