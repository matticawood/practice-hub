<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joining The Practice Room…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    .msg {
      text-align: center;
      opacity: 0.6;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    .dot {
      display: inline-block;
      animation: blink 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <p class="msg">
    Redirecting to checkout<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </p>

  <script>
    // ── Payment links per currency ─────────────────────────────────────────────
    const LINKS = {
      GBP: "https://buy.stripe.com/28EeV61nA9Z0fxJaAB5EY00",
      USD: "https://buy.stripe.com/eVq8wI4zMefg85haAB5EY01",
      CAD: "https://buy.stripe.com/bJe4gseam8UWbht8st5EY02",
      EUR: "https://buy.stripe.com/bJe28k0jw7QSbhtcIJ5EY03",
      AUD: "https://buy.stripe.com/28E5kw6HU0oqadpaAB5EY04",
      SEK: "https://buy.stripe.com/14A5kw7LY7QSfxJ2455EY05",
      NOK: "https://buy.stripe.com/9B65kw3vIc78bhtaAB5EY06",
      DKK: "https://buy.stripe.com/28E28keam7QS5X91015EY07",
      SGD: "https://buy.stripe.com/6oU8wIgiub341GT8st5EY09",
      NZD: "https://buy.stripe.com/00w00c0jw9Z099laAB5EY0a",
    };

    // ── Country → currency map ─────────────────────────────────────────────────
    const COUNTRY_CURRENCY = {
      // GBP
      GB: "GBP", JE: "GBP", GG: "GBP", IM: "GBP",
      // EUR
      DE: "EUR", FR: "EUR", IT: "EUR", ES: "EUR", NL: "EUR",
      PT: "EUR", BE: "EUR", AT: "EUR", IE: "EUR", FI: "EUR",
      GR: "EUR", LU: "EUR", SK: "EUR", SI: "EUR", EE: "EUR",
      LV: "EUR", LT: "EUR", CY: "EUR", MT: "EUR",
      // USD
      US: "USD",
      // CAD
      CA: "CAD",
      // AUD
      AU: "AUD", CX: "AUD", CC: "AUD", NF: "AUD",
      // NZD
      NZ: "NZD", CK: "NZD", NU: "NZD", PN: "NZD", TK: "NZD",
      // SEK
      SE: "SEK",
      // NOK
      NO: "NOK", SJ: "NOK", BV: "NOK",
      // DKK
      DK: "DKK", FO: "DKK", GL: "DKK",
      // SGD
      SG: "SGD",
    };

    function getCurrency() {
      // Try timezone first — most reliable cross-browser signal
      try {
        const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
        if (tz === "Europe/London" || tz === "Europe/Belfast") return "GBP";
        if (tz.startsWith("America/") && !["America/Toronto","America/Vancouver",
            "America/Winnipeg","America/Edmonton","America/Halifax","America/St_Johns",
            "America/Regina","America/Creston","America/Dawson","America/Whitehorse",
            "America/Glace_Bay","America/Goose_Bay","America/Moncton"].includes(tz)) return "USD";
        if (tz.startsWith("America/Toronto") || tz.startsWith("America/Vancouver") ||
            tz.includes("America/Winnipeg") || tz.includes("America/Edmonton") ||
            tz.includes("America/Halifax") || tz.includes("America/St_Johns") ||
            tz.includes("America/Regina") || tz.includes("America/Whitehorse") ||
            tz.includes("America/Dawson") || tz.includes("America/Moncton")) return "CAD";
        if (tz.startsWith("Australia/")) return "AUD";
        if (tz.startsWith("Pacific/Auckland") || tz === "Pacific/Chatham") return "NZD";
        if (tz === "Europe/Stockholm") return "SEK";
        if (tz === "Europe/Oslo") return "NOK";
        if (tz === "Europe/Copenhagen") return "DKK";
        if (tz === "Asia/Singapore") return "SGD";
        if (tz.startsWith("Europe/")) return "EUR";
      } catch (e) {}

      // Fallback: browser locale region (e.g. "en-GB" → "GB")
      try {
        const locales = [navigator.language, ...(navigator.languages || [])];
        for (const locale of locales) {
          const region = (locale || "").split("-")[1]?.toUpperCase();
          if (region && COUNTRY_CURRENCY[region]) return COUNTRY_CURRENCY[region];
        }
      } catch (e) {}

      return "GBP"; // default
    }

    const currency = getCurrency();
    const url = LINKS[currency] || LINKS.GBP;
    window.location.replace(url);
  </script>
</body>
</html>
