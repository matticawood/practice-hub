<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Joining The Practice Room…</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: system-ui, sans-serif;
      color: #fff;
    }
    .msg {
      text-align: center;
      opacity: 0.6;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    .dot {
      display: inline-block;
      animation: blink 1.2s infinite;
    }
    .dot:nth-child(2) { animation-delay: .2s; }
    .dot:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
  </style>
</head>
<body>
  <p class="msg" id="msg">
    Redirecting to checkout<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
  </p>
  <a id="manual" href="#" style="display:none;margin-top:18px;color:#fff;font-weight:600;text-decoration:underline">Continue to secure checkout</a>
  <script>
    // Forward any query string (notably ?vid=… for conversion attribution) to the
    // membership-redirect edge function, which threads it into Stripe as
    // client_reference_id.
    (function () {
      var base = "https://gyskfutmncprqxazgatv.supabase.co/functions/v1/membership-redirect";
      var url = base + (location.search || "");
      // Inside the iOS app (PWAShell) the WKWebView is pinned to app-bound domains,
      // so a JS redirect to this external host is BLOCKED ("no wifi" bounce). Only a
      // real user tap on an external link gets routed to the in-app Safari sheet. So
      // show a tappable link instead of auto-redirecting.
      if (/PWAShell/i.test(navigator.userAgent || "")) {
        var a = document.getElementById("manual");
        a.href = url;
        a.style.display = "inline-block";
        document.getElementById("msg").textContent = "You're being taken to secure checkout.";
        return;
      }
      window.location.replace(url);
    })();
  </script>
</body>
</html>
