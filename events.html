}

async function postComment(eventId) {
  const input   = document.getElementById("comment-input");
  const content = input.value.trim();
  const cmtMedia = _evMedia["main"] || [];
  const poll    = _evPollOpen["main"] ? _evReadPoll("main") : null;
  if (!content && !cmtMedia.length && !poll) return;

  input.disabled = true;
  let mediaJson = [];
  try { mediaJson = await _evUploadMedia("main"); }
  catch(e) { input.disabled = false; alert("Upload failed: " + e.message); return; }

  const { data: row, error } = await db.from("event_comments").insert({
    event_id: eventId, email: myEmail, name: myName,
    content: content || "",
    media: mediaJson.length ? mediaJson : null,
  }).select().single();
  input.disabled = false;
  if (error) { alert("Could not post: " + error.message); return; }

  if (poll && row) {
    await db.from("event_comment_polls").insert({
      comment_id: row.id, question: poll.question, options: poll.options
    });
  }

  input.value = ""; input.style.height = "";
  _evClearState("main");
  await loadComments(eventId);
}

// ── Start / End stream (admin) ─────────────────────────────────────────────────
async function startStream(eventId) {
  const btn = event.target;
  btn.disabled = true;

  try {
    // Refresh event from DB first
    const { data: latestEv } = await db.from("live_events").select("*").eq("id", eventId).single();

    // If room already exists (e.g. after page refresh), just rejoin
    if (latestEv?.daily_room_name) {
      currentEvent = { ...currentEvent, ...latestEv };
      // Patch the existing room to ensure recording + no prejoin UI
      const { data: { session: s } } = await db.auth.getSession();
      if (s) authToken = s.access_token;
      await fetch("/api/daily", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
        body: JSON.stringify({ action: "update-room", roomName: latestEv.daily_room_name, properties: {
          enable_prejoin_ui: false,
          enable_recording: "cloud"
        }})
      });
      // Determine whether to reuse the existing Mux live stream or create a fresh one.
      // A stream becomes "disabled" (locked) after complete() is called — reusing it
      // would silently fail to start RTMP streaming.
      let needNewStream = !latestEv.mux_live_stream_id;
      if (!needNewStream) {
        // Retrieve stream key + status for the existing live stream
        try {
          const skRes = await fetch("/api/daily", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
            body: JSON.stringify({ action: "get-mux-stream-key", eventId })
          });
          if (!skRes.ok) throw new Error(`HTTP ${skRes.status}`);
          const skData = await skRes.json();
          if (skData.status === "disabled" || !skData.streamKey) {
            needNewStream = true;
          } else {
            currentEvent._muxStreamKey        = skData.streamKey;
            currentEvent.mux_live_playback_id = skData.playbackId || currentEvent.mux_live_playback_id;
          }
        } catch(e) {
          console.warn("get-mux-stream-key failed:", e.message);
          alert("Could not reach the stream service — the hosting provider may be having a temporary outage. Please try again in a moment.");
          btn.disabled = false;
          return;
        }
      }
      if (needNewStream) {
        try {
          const muxRes = await fetch("/api/daily", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
            body: JSON.stringify({ action: "create-mux-livestream", eventId })
          });
          if (!muxRes.ok) throw new Error(`HTTP ${muxRes.status}`);
          const muxData = await muxRes.json();
          currentEvent._muxStreamKey        = muxData.muxStreamKey || null;
          currentEvent.mux_live_playback_id = muxData.muxLivePlaybackId || null;
        } catch(e) {
          console.warn("create-mux-livestream failed:", e.message);
          alert("Could not create a new stream — the hosting provider may be having a temporary outage. Please try again in a moment.");
          btn.disabled = false;
          return;
        }
      }
      const ok = await joinStream(eventId);
      if (!ok) btn.disabled = false;
      return;
    }

    btn.textContent = "Creating room…";

    // Refresh auth token
    const { data: { session } } = await db.auth.getSession();
    if (session) authToken = session.access_token;

    const res = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
      body: JSON.stringify({ action: "create-room", eventId })
    });
    const room = await res.json();
    console.log("[create-room response]", JSON.stringify(room));
    if (room.error) throw new Error(JSON.stringify(room.error));

    const { error } = await db.from("live_events").update({
      status: "live",
      daily_room_name: room.roomName,
      daily_room_url:  room.roomUrl
    }).eq("id", eventId);

    if (error) throw error;
    currentEvent = {
      ...currentEvent,
      status: "live",
      daily_room_name:      room.roomName,
      daily_room_url:       room.roomUrl,
      mux_live_playback_id: room.muxLivePlaybackId || null,
      _muxStreamKey:        room.muxStreamKey || null,  // client-only, not in DB
    };

    // Notify everyone who RSVPed (except the host)
    const { data: rsvps } = await db.from("event_rsvps").select("email").eq("event_id", eventId);
    if (rsvps?.length) {
      const evTitle = currentEvent?.title || "an event";
      const notifs = rsvps
        .filter(r => r.email && r.email.toLowerCase() !== myEmail.toLowerCase())
        .map(r => ({
          email:    r.email,
          type:     "event_live",
          title:    `${evTitle} is live now!`,
          body:     "Join the session — it's happening right now.",
          link_url: `/events.html`,
          metadata: { event_id: eventId },
        }));
      if (notifs.length) await db.from("notifications").insert(notifs);
    }

    const ok = await joinStream(eventId);
    if (!ok) {
      btn.textContent = "Go Live"; btn.className = btn.className.replace("btn-primary","btn-danger");
      btn.disabled = false;
    }
  } catch (e) {
    alert("Failed to start stream: " + e.message);
    btn.textContent = "Go Live"; btn.className = btn.className.replace("btn-primary","btn-danger");
    btn.disabled = false;
  }
}

// ── Join stream ───────────────────────────────────────────────────────────────
// Returns true on success, false on any failure (caller should restore UI).
async function joinStream(eventId) {
  // Refresh event to get latest room details
  const { data: ev } = await db.from("live_events").select("*").eq("id", eventId).single();
  if (!ev || ev.status !== "live") { alert("Stream is not live."); return false; }
  // Preserve client-only fields that aren't stored in the DB
  currentEvent = { ...ev, _muxStreamKey: currentEvent?._muxStreamKey || null };

  if (!ev.daily_room_name) { alert("Room not ready yet — try again in a moment."); return false; }

  // Always refresh the auth token before calling the edge function
  const { data: { session }, error: sessErr } = await db.auth.getSession();
  if (sessErr || !session) { alert("Session expired — please sign in again."); window.location.href = "/practice-log.html"; return false; }
  authToken = session.access_token;

  // Get a Daily.co token
  let tokenRes, result;
  try {
    tokenRes = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
      body: JSON.stringify({ action: "get-token", roomName: ev.daily_room_name, isOwner: isAdmin })
    });
    if (!tokenRes.ok) {
      alert(`Could not connect to the stream service (HTTP ${tokenRes.status}). The hosting provider may be having a temporary outage — please try again in a moment.`);
      return false;
    }
    result = await tokenRes.json();
  } catch (e) {
    alert("Could not reach the stream service. Please check your connection and try again.");
    return false;
  }
  if (result.error || !result.token) {
    alert("Could not get stream token: " + JSON.stringify(result.error || "no token returned"));
    return false;
  }

  if (typeof DailyIframe === "undefined") {
    alert("Daily.co SDK not loaded");
    return false;
  }

  // Destroy any existing call
  if (window._callFrame) {
    try { await window._callFrame.destroy(); } catch(e) {}
    window._callFrame = null;
  }

  const container = document.getElementById("daily-container");
  container.innerHTML = "";

  try {
    if (isAdmin) {
      // ── HOST: full Daily.co iframe UI with camera/mic controls ──────────────
      window._callFrame = DailyIframe.createFrame(container, {
        showLeaveButton: true,
        showFullscreenButton: true,
        iframeStyle: { position: "absolute", top: 0, left: 0, width: "100%", height: "100%", border: "none" }
      });

      // Register listeners BEFORE join() so events aren't missed
      window._callFrame.on("joined-meeting", async () => {
        // On REJOIN (stream_started_at already set) don't restart recording or
        // live streaming — the Mux RTMP stream reconnects automatically within
        // the 5-minute reconnect window and we'd just get duplicate Daily recordings
        // and an overwritten stream_started_at that would break VOD timestamps.
        if (currentEvent.stream_started_at) {
          console.log("[Mux] Rejoining existing stream — skipping startRecording/startLiveStreaming");
          return;
        }

        // First join only ────────────────────────────────────────────────────
        // Start Daily cloud recording
        try { await window._callFrame.startRecording(); } catch(e) {
          console.warn("startRecording failed:", e.message);
        }
        // Start RTMP live streaming to Mux (for the preview on the event page)
        const streamKey = currentEvent._muxStreamKey;
        console.log("[Mux] stream key present:", !!streamKey, "| playback ID:", currentEvent.mux_live_playback_id || "none");
        if (streamKey) {
          try {
            await window._callFrame.startLiveStreaming({
              rtmpUrl: `rtmps://global-live.mux.com:443/app/${streamKey}`
            });
            console.log("[Mux] live streaming started successfully");
            // Record the moment RTMP begins — this is VOD t=0 for Q&A timestamp sync
            const streamStartedAt = new Date().toISOString();
            currentEvent.stream_started_at = streamStartedAt;
            db.from("live_events").update({ stream_started_at: streamStartedAt }).eq("id", currentEvent.id).then();
          } catch(e) {
            console.warn("[Mux] startLiveStreaming failed:", e.message);
          }
        } else {
          console.warn("[Mux] no stream key — startLiveStreaming skipped. Check Netlify daily-api logs for create-room errors.");
        }
      });

      window._callFrame.on("left-meeting", () => {
        if (window._callFrame) { try { window._callFrame.destroy(); } catch(e) {} window._callFrame = null; }
        const c = document.getElementById("daily-container");
        if (c) c.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;"><p style="color:var(--text-muted)">You left the stream.</p><button class="btn btn-primary" onclick="joinStream('${ev.id}')">▶ Rejoin</button></div>`;
      });

      await window._callFrame.join({
        url: ev.daily_room_url,
        token: result.token
      });

    } else {
      // ── VIEWER: headless call object — no Daily.co UI whatsoever ───────────
      // Build the video + audio elements first
      container.innerHTML = `
        <video id="viewer-video" autoplay playsinline
          style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000;border-radius:var(--radius)">
        </video>
        <audio id="viewer-audio" autoplay></audio>
        <div id="viewer-waiting" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);pointer-events:none;">
          <svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.3"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
        </div>`;

      const call = DailyIframe.createCallObject({ videoSource: false, audioSource: false });
      window._callFrame = call;

      await call.join({ url: ev.daily_room_url, token: result.token });

      // Wire up remote tracks to our video/audio elements
      function syncTracks() {
        const videoEl = document.getElementById("viewer-video");
        const audioEl = document.getElementById("viewer-audio");
        const waitEl  = document.getElementById("viewer-waiting");
        if (!videoEl) return;

        const videoTracks = [], audioTracks = [];
        Object.values(call.participants()).forEach(p => {
          if (p.local) return;
          const vt = p.tracks?.video?.persistentTrack;
          const at = p.tracks?.audio?.persistentTrack;
          if (vt && p.tracks.video.state === "playable") videoTracks.push(vt);
          if (at && p.tracks.audio.state === "playable") audioTracks.push(at);
        });

        if (videoTracks.length) {
          videoEl.srcObject = new MediaStream(videoTracks);
          if (waitEl) waitEl.style.display = "none";
        } else {
          videoEl.srcObject = null;
          if (waitEl) waitEl.style.display = "flex";
        }
        if (audioTracks.length && audioEl) {
          audioEl.srcObject = new MediaStream(audioTracks);
        }
      }

      call.on("track-started",        syncTracks);
      call.on("track-stopped",        syncTracks);
      call.on("participant-joined",   syncTracks);
      call.on("participant-updated",  syncTracks);
      call.on("participant-left",     syncTracks);

      call.on("left-meeting", () => {
        if (window._callFrame) { try { window._callFrame.destroy(); } catch(e) {} window._callFrame = null; }
        const c = document.getElementById("daily-container");
        if (c) c.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;"><p style="color:var(--text-muted)">You left the stream.</p><button class="btn btn-primary" onclick="joinStream('${ev.id}')">▶ Rejoin</button></div>`;
      });
    }
  } catch(e) {
    alert("Failed to start video: " + e.message);
    return false;
  }

  // Show stream view
  document.getElementById("stream-event-title").textContent = ev.title;
  if (isAdmin) document.getElementById("stream-admin-bar").classList.add("visible");
  showView("stream");
  setupRealtimeStream(ev);
  return true;
}

// ── Realtime chat & Q&A ───────────────────────────────────────────────────────
// Incremented on every setup call so channel names are unique (avoids stale-
// channel conflicts when Supabase hasn't finished removing the old subscription).
let _channelGen = 0;

function setupRealtimeStream(ev) {
  console.log("[Stream] setupRealtimeStream for event", ev.id);

  // ── Clean up ALL existing channels before re-subscribing ──────────────────
  if (chatChannel)         { db.removeChannel(chatChannel);         chatChannel         = null; }
  if (qaChannel)           { db.removeChannel(qaChannel);           qaChannel           = null; }
  if (typingChannel)       { db.removeChannel(typingChannel);       typingChannel       = null; }
  if (discussionChannel)   { db.removeChannel(discussionChannel);   discussionChannel   = null; }
  if (streamStatusChannel) { db.removeChannel(streamStatusChannel); streamStatusChannel = null; }

  // Each setup gets a fresh generation suffix so new channel names don't clash
  // with channels the server may still be tearing down.
  const gen = ++_channelGen;
  console.log("[Stream] channel generation:", gen);

  // Seed avatar cache with known users
  _streamAvatarCache = {};
  _chatUnread = 0; _qaUnread = 0;
  if (myEmail)    _streamAvatarCache[myEmail]    = myAvatarUrl;
  if (OWNER_EMAIL) _streamAvatarCache[OWNER_EMAIL] = ownerAvatarUrl;

  // Reset typing state so stale flags don't suppress the next broadcast
  _typingActive   = false;
  _typingLastSent = 0;
  clearTimeout(_typingTimeout);
  Object.values(_typingClearTimers).forEach(t => clearTimeout(t));
  _typingUsers = {};
  _typingClearTimers = {};
  updateTypingIndicator();
  _qaTypingActive   = false;
  _qaTypingLastSent = 0;
  clearTimeout(_qaTypingTimeout);
  Object.values(_qaTypingClearTimers).forEach(t => clearTimeout(t));
  _qaTypingUsers = {};
  _qaTypingClearTimers = {};
  updateQATypingIndicator();

  // ── Clear panels immediately for a clean start ──────────────────────────────
  const chatEl = document.getElementById("chat-messages");
  const qaEl   = document.getElementById("qa-questions");
  if (chatEl) chatEl.innerHTML = "";
  if (qaEl)   qaEl.innerHTML   = "";
  document.getElementById("featured-qa-bar")?.classList.remove("visible");

  // ── Immediate history load ─────────────────────────────────────────────────
  // Load existing records RIGHT NOW without waiting for channel SUBSCRIBED (~1-2s).
  // The subscribe callbacks below catch anything that arrives in the gap.
  console.log("[Stream] loading chat history for event", ev.id);
  db.from("event_chat").select("*").eq("event_id", ev.id).order("created_at")
    .then(({ data, error }) => {
      if (error) { console.error("[Stream] chat history load error:", error); return; }
      console.log("[Stream] chat history loaded:", data?.length, "messages");
      if (data) data.forEach(m => appendChatMsg(m, true));
    });

  console.log("[Stream] loading Q&A history for event", ev.id);
  db.from("event_qa").select("*").eq("event_id", ev.id).order("created_at")
    .then(({ data, error }) => {
      if (error) { console.error("[Stream] Q&A history load error:", error); return; }
      console.log("[Stream] Q&A history loaded:", data?.length, "questions");
      if (!data) return;
      data.forEach(q => appendQAItem(q, true));
      const featured = data.find(q => q.is_featured);
      if (featured) {
        document.getElementById("featured-qa-text").textContent = featured.question;
        document.getElementById("featured-qa-asker").textContent = "— " + (featured.name || featured.email.split("@")[0]);
        document.getElementById("featured-qa-bar").classList.add("visible");
      }
    });

  // Load discussion comments immediately
  loadComments(ev.id);

  // ── Wire up channels (INSERT/UPDATE listeners) ─────────────────────────────

  // Discussion comments + poll votes
  discussionChannel = db.channel(`event-discussion-${ev.id}-${gen}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_comments",
      filter: `event_id=eq.${ev.id}` }, () => loadComments(ev.id))
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_comment_poll_votes" },
      () => loadComments(ev.id))
    .subscribe((status) => {
      console.log("[Stream] discussionChannel status:", status);
    });

  // Chat messages (postgres_changes only — typing moved to typingChannel)
  chatChannel = db.channel(`event-chat-${ev.id}-${gen}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_chat",
      filter: `event_id=eq.${ev.id}` }, p => {
        console.log("[Stream] chat INSERT received:", p.new?.id);
        appendChatMsg(p.new);
      })
    .subscribe(async (status) => {
      console.log("[Stream] chatChannel status:", status);
      if (status !== "SUBSCRIBED") return;
      // Second pass: catch any messages that arrived during the handshake gap.
      const { data, error } = await db.from("event_chat").select("*").eq("event_id", ev.id).order("created_at");
      if (error) { console.error("[Stream] chat second-pass error:", error); return; }
      if (data) data.forEach(m => appendChatMsg(m, true));
    });

  // Q&A questions (postgres_changes only — typing moved to typingChannel)
  qaChannel = db.channel(`event-qa-${ev.id}-${gen}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_qa",
      filter: `event_id=eq.${ev.id}` }, p => {
        console.log("[Stream] Q&A INSERT received:", p.new?.id);
        appendQAItem(p.new);
      })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "event_qa",
      filter: `event_id=eq.${ev.id}` }, p => updateQAItem(p.new))
    .subscribe(async (status) => {
      console.log("[Stream] qaChannel status:", status);
      if (status !== "SUBSCRIBED") return;
      // Second pass: catch any Q&A that arrived during the handshake gap.
      const { data, error } = await db.from("event_qa").select("*").eq("event_id", ev.id).order("created_at");
      if (error) { console.error("[Stream] Q&A second-pass error:", error); return; }
      if (!data) return;
      data.forEach(q => appendQAItem(q, true));
      const featured = data.find(q => q.is_featured);
      if (featured) {
        document.getElementById("featured-qa-text").textContent = featured.question;
        document.getElementById("featured-qa-asker").textContent = "— " + (featured.name || featured.email.split("@")[0]);
        document.getElementById("featured-qa-bar").classList.add("visible");
      }
    });

  // Typing broadcasts — fixed channel name (no gen suffix) so host + participants
  // always share the same channel even after the host rejoins the stream.
  typingChannel = db.channel(`event-typing-${ev.id}`, {
    config: { broadcast: { self: false } }
  })
    .on("broadcast", { event: "typing" }, ({ payload }) => {
      if (!payload?.email || payload.email === myEmail) return;
      if (payload.typing) {
        _typingUsers[payload.email] = payload.name || "Someone";
        clearTimeout(_typingClearTimers[payload.email]);
        _typingClearTimers[payload.email] = setTimeout(() => {
          delete _typingUsers[payload.email];
          delete _typingClearTimers[payload.email];
          updateTypingIndicator();
        }, 4000);
      } else {
        clearTimeout(_typingClearTimers[payload.email]);
        delete _typingUsers[payload.email];
        delete _typingClearTimers[payload.email];
      }
      updateTypingIndicator();
    })
    .on("broadcast", { event: "qa-typing" }, ({ payload }) => {
      if (!payload?.email || payload.email === myEmail) return;
      if (payload.typing) {
        _qaTypingUsers[payload.email] = payload.name || "Someone";
        clearTimeout(_qaTypingClearTimers[payload.email]);
        _qaTypingClearTimers[payload.email] = setTimeout(() => {
          delete _qaTypingUsers[payload.email];
          delete _qaTypingClearTimers[payload.email];
          updateQATypingIndicator();
        }, 4000);
      } else {
        clearTimeout(_qaTypingClearTimers[payload.email]);
        delete _qaTypingUsers[payload.email];
        delete _qaTypingClearTimers[payload.email];
      }
      updateQATypingIndicator();
    })
    .subscribe((status) => {
      console.log("[Stream] typingChannel status:", status);
    });

  // Watch for stream ending — send everyone back to the event detail page
  streamStatusChannel = db.channel(`stream-status-${ev.id}-${gen}`)
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "live_events",
      filter: `id=eq.${ev.id}` }, payload => {
      if (payload.new.status === "ended") {
        db.removeChannel(streamStatusChannel);
        streamStatusChannel = null;
        if (window._callFrame) {
          try { window._callFrame.destroy(); } catch(e) {}
          window._callFrame = null;
        }
        currentEvent = { ...currentEvent, ...payload.new };
        showView("detail");
        renderDetailView(currentEvent);
      }
    })
    .subscribe((status) => {
      console.log("[Stream] streamStatusChannel status:", status);
    });
}

function appendChatMsg(msg, skipUnread = false) {
  const el = document.getElementById("chat-messages");
  if (!el) return;
  // Deduplicate — the same message can arrive via both the realtime INSERT
  // listener and the history reload in the subscribe callback
  if (el.querySelector(`[data-id="${msg.id}"]`)) return;
  const mine = msg.email === myEmail;

  // Avatar: use cache, fall back to initials
  const cachedUrl = _streamAvatarCache[msg.email] || null;
  const av = avatarHtml(msg.name || msg.email.split("@")[0], msg.email, 26, cachedUrl);

  // Fetch avatar if not cached yet (fills in on next message from same user)
  if (!_streamAvatarCache.hasOwnProperty(msg.email)) {
    _streamAvatarCache[msg.email] = null; // mark as fetching
    db.from("allowed_emails").select("avatar_url").eq("email", msg.email).maybeSingle()
      .then(({ data }) => {
        _streamAvatarCache[msg.email] = data?.avatar_url || null;
        // Update existing avatar elements for this user
        document.querySelectorAll(`.chat-msg[data-email="${CSS.escape(msg.email)}"] .chat-msg-av`).forEach(avEl => {
          if (data?.avatar_url) avEl.outerHTML = avatarHtml(msg.name || msg.email.split("@")[0], msg.email, 26, data.avatar_url);
        });
      });
  }

  const div = document.createElement("div");
  div.className = "chat-msg" + (mine ? " mine" : "");
  div.dataset.id  = msg.id;
  div.dataset.email = msg.email;
  div.innerHTML = `
    <span class="chat-msg-av">${av}</span>
    <div class="chat-msg-body">
      <div class="chat-msg-author">${esc(msg.name || msg.email.split("@")[0])}</div>
      <div class="chat-msg-text">${esc(msg.message)}</div>
    </div>
  `;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;

  // Unread badge — increment if chat panel is not visible
  if (!skipUnread) {
    const chatVisible = document.getElementById("sidebar-chat")?.style.display !== "none";
    const sidebarHidden = document.getElementById("stream-wrap")?.classList.contains("sidebar-hidden");
    if (!chatVisible || sidebarHidden) {
      _chatUnread++;
      updateUnreadBadges();
    }
  }
}

function onChatTyping() {
  if (!typingChannel) return;
  const now = Date.now();
  // Re-send typing:true every 2 s while actively typing so the receiver's
  // 4-second auto-clear timer never expires while the user is still typing.
  if (now - _typingLastSent > 2000) {
    _typingLastSent = now;
    _typingActive   = true;
    typingChannel.send({ type: "broadcast", event: "typing",
      payload: { email: myEmail, name: myName || myEmail, typing: true } });
  }
  // Debounce the stop signal — reset on every keystroke
  clearTimeout(_typingTimeout);
  _typingTimeout = setTimeout(stopTypingBroadcast, 3000);
}

function stopTypingBroadcast() {
  if (!_typingActive) return;
  _typingActive   = false;
  _typingLastSent = 0; // reset so next typing session re-sends immediately
  if (typingChannel) typingChannel.send({ type: "broadcast", event: "typing",
    payload: { email: myEmail, name: myName || myEmail, typing: false } });
}

function updateTypingIndicator() {
  const el = document.getElementById("chat-typing");
  if (!el) return;
  const names = Object.values(_typingUsers).map(n => n.split(" ")[0]).slice(0, 2);
  if (!names.length) { el.style.display = "none"; return; }
  el.textContent = names.length === 1 ? `${names[0]} is typing…` : `${names.join(" & ")} are typing…`;
  el.style.display = "block";
}

function onQATyping() {
  if (!typingChannel) return;
  const now = Date.now();
  if (now - _qaTypingLastSent > 2000) {
    _qaTypingLastSent = now;
    _qaTypingActive   = true;
    typingChannel.send({ type: "broadcast", event: "qa-typing",
      payload: { email: myEmail, name: myName || myEmail, typing: true } });
  }
  clearTimeout(_qaTypingTimeout);
  _qaTypingTimeout = setTimeout(stopQATypingBroadcast, 3000);
}

function stopQATypingBroadcast() {
  if (!_qaTypingActive) return;
  _qaTypingActive   = false;
  _qaTypingLastSent = 0;
  if (typingChannel) typingChannel.send({ type: "broadcast", event: "qa-typing",
    payload: { email: myEmail, name: myName || myEmail, typing: false } });
}

function updateQATypingIndicator() {
  const el = document.getElementById("qa-typing");
  if (!el) return;
  const names = Object.values(_qaTypingUsers).map(n => n.split(" ")[0]).slice(0, 2);
  if (!names.length) { el.style.display = "none"; return; }
  el.textContent = names.length === 1 ? `${names[0]} is typing…` : `${names.join(" & ")} are typing…`;
  el.style.display = "block";
}

async function sendChat() {
  const input = document.getElementById("chat-input");
  const message = input.value.trim();
  if (!message || !currentEvent) return;
  input.value = "";
  // Clear typing indicator immediately on send
  clearTimeout(_typingTimeout);
  stopTypingBroadcast();
  await db.from("event_chat").insert({
    event_id: currentEvent.id, email: myEmail, name: myName, message
  });
}

function appendQAItem(q, skipUnread = false) {
  const el = document.getElementById("qa-questions");
  if (!el) return;
  const existing = el.querySelector(`[data-id="${q.id}"]`);
  if (existing) { existing.replaceWith(buildQAEl(q)); return; }
  el.appendChild(buildQAEl(q));
  el.scrollTop = el.scrollHeight;

  // Unread badge — increment if Q&A panel is not visible
  if (!skipUnread) {
    const qaVisible = document.getElementById("sidebar-qa")?.style.display !== "none";
    const sidebarHidden = document.getElementById("stream-wrap")?.classList.contains("sidebar-hidden");
    if (!qaVisible || sidebarHidden) {
      _qaUnread++;
      updateUnreadBadges();
    }
  }
}

function updateQAItem(partial) {
  // Realtime UPDATE payloads only include changed columns + primary key, so
  // we fetch the complete row before rebuilding to avoid rendering broken cards
  // with missing question text, wrong button states, etc.
  db.from("event_qa").select("*").eq("id", partial.id).single().then(({ data: q }) => {
    if (!q) return;
    const el = document.getElementById("qa-questions");
    if (!el) return;
    const existing = el.querySelector(`[data-id="${q.id}"]`);
    if (existing) existing.replaceWith(buildQAEl(q));

    // Update featured bar
    if (q.is_featured) {
      document.getElementById("featured-qa-text").textContent = q.question;
      document.getElementById("featured-qa-asker").textContent = "— " + (q.name || q.email.split("@")[0]);
      document.getElementById("featured-qa-bar").classList.add("visible");
    } else {
      document.getElementById("featured-qa-bar").classList.remove("visible");
    }
  });
}

function buildQAEl(q) {
  const div = document.createElement("div");
  div.className = "qa-item" + (q.is_featured ? " featured" : "");
  div.dataset.id = q.id;
  let actions = "";
  const svgStar     = `<svg viewBox="0 0 24 24" width="11" height="11" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
  const svgStarOut  = `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`;
  const svgCheck    = `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
  const svgUndo     = `<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.5"/></svg>`;
  if (isAdmin) {
    actions = `<div class="qa-item-actions">
      <button class="${q.is_featured ? "featured-btn" : ""}" onclick="featureQA('${q.id}', ${!q.is_featured})">
        ${q.is_featured ? svgStar + " Featured" : svgStarOut + " Feature"}
      </button>
      <button class="${q.answered ? "featured-btn" : ""}" onclick="markAnswered('${q.id}', ${q.answered})">
        ${q.answered ? svgUndo + " Unmark" : svgCheck + " Answered"}
      </button>
    </div>`;
  }
  div.innerHTML = `
    <div class="qa-item-asker">${esc(q.name || q.email.split("@")[0])}</div>
    <div class="qa-item-text">${esc(q.question)}</div>
    ${q.answered ? `<div style="font-size:.72rem;color:var(--accent);margin-top:4px;display:flex;align-items:center;gap:4px">${svgCheck} Answered</div>` : ""}
    ${actions}
  `;
  return div;
}

async function submitQA() {
  const input = document.getElementById("qa-input");
  const question = input.value.trim();
  if (!question || !currentEvent) return;
  input.value = "";
  clearTimeout(_qaTypingTimeout);
  stopQATypingBroadcast();
  await db.from("event_qa").insert({
    event_id: currentEvent.id, email: myEmail, name: myName, question
  });
}

async function featureQA(qaId, feature) {
  const now = new Date().toISOString();
  if (feature) {
    // Close any open feature windows in event_qa_features (the question being bumped)
    const { data: openWindows } = await db
      .from("event_qa_features")
      .select("id")
      .eq("event_id", currentEvent.id)
      .is("unfeatured_at", null);
    if (openWindows?.length) {
      await db.from("event_qa_features")
        .update({ unfeatured_at: now })
        .in("id", openWindows.map(w => w.id));
    }
    // Unfeature currently featured question in event_qa
    await db.from("event_qa")
      .update({ is_featured: false, unfeatured_at: now })
      .eq("event_id", currentEvent.id)
      .eq("is_featured", true);
    // Insert a new feature window for the newly featured question
    const { error: eInsert } = await db.from("event_qa_features").insert({
      qa_id:       qaId,
      event_id:    currentEvent.id,
      featured_at: now
    });
    if (eInsert) { console.error("featureQA insert error:", eInsert); alert("Could not feature question: " + eInsert.message); return; }
    // Mark the question as featured in event_qa (keep featured_at for legacy compat)
    const { error: e2 } = await db.from("event_qa")
      .update({ is_featured: true, featured_at: now })
      .eq("id", qaId);
    if (e2) { console.error("featureQA error:", e2); alert("Could not update question: " + e2.message); return; }
  } else {
    // Unfeature: close open windows for this specific question
    await db.from("event_qa_features")
      .update({ unfeatured_at: now })
      .eq("qa_id", qaId)
      .is("unfeatured_at", null);
    const { error: e2 } = await db.from("event_qa")
      .update({ is_featured: false, unfeatured_at: now })
      .eq("id", qaId);
    if (e2) { console.error("featureQA error:", e2); alert("Could not update question: " + e2.message); return; }
    document.getElementById("featured-qa-bar").classList.remove("visible");
  }

  // Immediately refresh the whole Q&A list so buttons reflect the new state
  // without having to wait for the realtime UPDATE event to arrive.
  await _refreshQAList();
}

async function _refreshQAList() {
  if (!currentEvent?.id) return;
  const { data } = await db.from("event_qa").select("*").eq("event_id", currentEvent.id).order("created_at");
  if (!data) return;
  const el = document.getElementById("qa-questions");
  if (!el) return;
  el.innerHTML = "";
  data.forEach(q => appendQAItem(q, true));
  const featured = data.find(q => q.is_featured);
  if (featured) {
    document.getElementById("featured-qa-text").textContent = featured.question;
    document.getElementById("featured-qa-asker").textContent = "— " + (featured.name || featured.email.split("@")[0]);
    document.getElementById("featured-qa-bar").classList.add("visible");
  }
}

async function markAnswered(qaId, currentState) {
  const nowAnswered = !currentState;
  const now = new Date().toISOString();
  if (nowAnswered) {
    // Close any open feature windows for this question so VOD overlay ends cleanly
    await db.from("event_qa_features")
      .update({ unfeatured_at: now })
      .eq("qa_id", qaId)
      .is("unfeatured_at", null);
  }
  const { error } = await db.from("event_qa").update({
    answered:    nowAnswered,
    is_featured: false,
    ...(nowAnswered ? { unfeatured_at: now } : {})
  }).eq("id", qaId);
  if (error) { console.error("markAnswered error:", error); alert("Could not update question: " + error.message); return; }
  if (nowAnswered) {
    document.getElementById("featured-qa-bar").classList.remove("visible");
  }
  // Immediately refresh the Q&A list so the button state reflects the change
  await _refreshQAList();
}

// ── VOD Q&A list ──────────────────────────────────────────────────────────────
// Shows all questions that were featured during the stream (whether or not they
// were explicitly marked "answered") with clickable timestamps to seek the player.
async function setupVodQaList(ev) {
  const wrap = document.getElementById("vod-qa-list-wrap");
  console.log("[VOD list] wrap:", !!wrap, "mux_playback_id:", ev.mux_playback_id, "ev.id:", ev.id);
  if (!wrap || !ev.mux_playback_id) return;

  // Primary source: event_qa_features — one row per feature window.
  // Fetch joined with event_qa so we get question text in one query.
  let featureWindows = null;
  let useLegacyFallback = false;
  const { data: fwData, error: fwErr } = await db
    .from("event_qa_features")
    .select("id, qa_id, featured_at, unfeatured_at, event_qa(id, question, name, email, answered)")
    .eq("event_id", ev.id)
    .order("featured_at", { ascending: true });

  if (fwErr) {
    // Table may not exist yet — fall back to legacy single-column approach
    console.warn("[VOD list] event_qa_features query failed, using legacy fallback:", fwErr.message);
    useLegacyFallback = true;
  } else {
    featureWindows = fwData || [];
    console.log("[VOD list] feature windows:", featureWindows.length);
  }

  // ── Legacy fallback: use featured_at on event_qa directly ─────────────────
  if (useLegacyFallback) {
    const { data: legacyQs } = await db
      .from("event_qa")
      .select("id, question, name, email, featured_at, unfeatured_at, answered")
      .eq("event_id", ev.id)
      .not("featured_at", "is", null)
      .order("featured_at", { ascending: true });
    if (!legacyQs?.length) return;
    featureWindows = legacyQs.map(q => ({
      id: q.id, qa_id: q.id,
      featured_at: q.featured_at, unfeatured_at: q.unfeatured_at,
      event_qa: q
    }));
  }

  if (!featureWindows.length) {
    console.log("[VOD list] no featured windows found");
    return;
  }

  // Deduplicate: one row per question (keyed by qa_id), ordered by first feature time
  const seenQa = new Set();
  const questions = [];
  for (const w of featureWindows) {
    if (!w.event_qa || seenQa.has(w.qa_id)) continue;
    seenQa.add(w.qa_id);
    questions.push({ ...w.event_qa, _firstFeaturedAt: w.featured_at });
  }

  // Build a flat map of all windows for timeline highlighting: qa_id → windows[]
  const windowsByQa = {};
  (featureWindows).forEach(w => {
    if (!windowsByQa[w.qa_id]) windowsByQa[w.qa_id] = [];
    windowsByQa[w.qa_id].push(w);
  });

  const streamStart = ev.stream_started_at ? new Date(ev.stream_started_at).getTime() : null;

  function fmtOffset(ts) {
    if (!streamStart || !ts) return null;
    const secs = Math.max(0, Math.round((new Date(ts).getTime() - streamStart) / 1000));
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = secs % 60;
    return h > 0
      ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
      : `${m}:${String(s).padStart(2,"0")}`;
  }

  const svgQ = `<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>`;

  wrap.innerHTML = `
    <div class="vod-qa-list">
      <div class="vod-qa-list-title">${svgQ} Questions featured in this session</div>
      ${questions.map(q => {
        // Build one timestamp button per feature window for this question
        const windows = windowsByQa[q.id] || [];
        const tsBtns = windows.length
          ? windows.map(w => {
              const offset = fmtOffset(w.featured_at);
              if (!offset) return '';
              const secs = Math.max(0, Math.round((new Date(w.featured_at).getTime() - streamStart) / 1000));
              return `<button class="vod-qa-ts" onclick="vodSeekTo(${secs})" title="Jump to this moment">${offset}</button>`;
            }).filter(Boolean).join("")
          : `<span class="vod-qa-ts no-ts">—</span>`;
        const asker = esc(q.name || q.email?.split("@")[0] || "Anonymous");
        return `
          <div class="vod-qa-row" data-qa-id="${q.id}">
            <div class="vod-qa-ts-group">${tsBtns}</div>
            <div class="vod-qa-row-body">
              <div class="vod-qa-row-q">${esc(q.question)}</div>
              <div class="vod-qa-row-asker">${asker}</div>
            </div>
          </div>`;
      }).join("")}
    </div>`;

  // Highlight the active question as the video plays.
  // Uses all feature windows so re-featuring a question highlights it each time.
  if (streamStart && featureWindows?.length) {
    const toOffset = ts => (new Date(ts).getTime() - streamStart) / 1000;
    const allWindows = featureWindows;
    const segments = allWindows
      .map((w, i) => {
        const start       = toOffset(w.featured_at);
        const nextStart   = allWindows[i + 1] ? toOffset(allWindows[i + 1].featured_at) : Infinity;
        const unfeatureAt = w.unfeatured_at ? toOffset(w.unfeatured_at) : Infinity;
        return { id: w.qa_id, start, end: Math.min(nextStart, unfeatureAt) };
      })
      .filter(s => s.start >= 0 && s.end > s.start);

    const player = document.getElementById("vod-mux-player");
    const nowFeaturedEl    = document.getElementById("vod-now-featured");
    const nowFeaturedText  = document.getElementById("vod-now-featured-text");
    const nowFeaturedAsker = document.getElementById("vod-now-featured-asker");

    // Build a quick lookup: qa_id → question object
    const questionById = {};
    questions.forEach(q => { questionById[q.id] = q; });

    if (player && segments.length) {
      let activeId = null;
      player.addEventListener("timeupdate", () => {
        const t = player.currentTime;
        const seg = segments.find(s => t >= s.start && t < s.end) || null;
        const newId = seg?.id || null;
        if (newId === activeId) return;
        activeId = newId;

        // Update "Now Featured" banner below the video
        if (nowFeaturedEl) {
          if (newId && questionById[newId]) {
            const q = questionById[newId];
            nowFeaturedText.textContent  = q.question;
            nowFeaturedAsker.textContent = "— " + (q.name || q.email?.split("@")[0] || "Anonymous");
            nowFeaturedEl.classList.add("visible");
          } else {
            nowFeaturedEl.classList.remove("visible");
          }
        }

        // Highlight and scroll matching row in the list
        wrap.querySelectorAll(".vod-qa-row").forEach(row => {
          row.classList.toggle("active", row.dataset.qaId === String(newId));
        });
        if (newId) {
          const activeRow = wrap.querySelector(`.vod-qa-row[data-qa-id="${newId}"]`);
          activeRow?.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      });
    }
  }
}

function vodSeekTo(seconds) {
  const player = document.getElementById("vod-mux-player");
  if (!player) return;
  player.currentTime = seconds;
  player.play?.();
  // Scroll the player into view smoothly
  document.getElementById("vod-player-wrap")?.scrollIntoView({ behavior: "smooth", block: "center" });
}

async function endStream() {
  if (!confirm("End the live stream for everyone?")) return;

  const btn = document.querySelector("#stream-admin-bar .btn-danger");
  if (btn) { btn.disabled = true; btn.textContent = "Ending…"; }

  // Stop live streaming to Mux (with timeout), then stop the recording cleanly
  if (window._callFrame) {
    try {
      await Promise.race([
        window._callFrame.stopLiveStreaming(),
        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 4000))
      ]);
    } catch(e) { console.warn("stopLiveStreaming:", e.message); }

    try {
      await new Promise((resolve) => {
        const done = () => { clearTimeout(timer); resolve(); };
        const timer = setTimeout(done, 6000); // max 6s wait
        window._callFrame.on("recording-stopped", done);
        window._callFrame.stopRecording().catch(done);
      });
    } catch(e) { console.warn("stopRecording:", e); }
  }

  // Delete the Mux live stream (stops billing, clears preview for all viewers)
  fetch("/api/daily", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
    body: JSON.stringify({ action: "delete-mux-livestream", eventId: currentEvent.id })
  }).catch(e => console.warn("delete-mux-livestream:", e));

  const endedAt = new Date().toISOString();
  await db.from("live_events").update({ status: "ended", ended_at: endedAt }).eq("id", currentEvent.id);
  currentEvent = { ...currentEvent, status: "ended", ended_at: endedAt };
  // showView already calls renderDetailView internally — don't call it twice or
  // the _recordingWatcher is created then immediately torn down and recreated,
  // which can cause the realtime subscription to miss the webhook update.
  showView("detail");
}

async function endStreamFromDetail(eventId) {
  if (!confirm("End the live stream?")) return;

  // Stop live streaming + recording if the host still has an active call frame
  if (window._callFrame) {
    try { await window._callFrame.stopLiveStreaming(); } catch(e) {
      console.warn("stopLiveStreaming:", e.message);
    }
    try {
      await new Promise((resolve) => {
        const done = () => { clearTimeout(timer); resolve(); };
        const timer = setTimeout(done, 6000);
        window._callFrame.on("recording-stopped", done);
        window._callFrame.stopRecording().catch(done);
      });
    } catch(e) { console.warn("stopRecording:", e); }
  }

  // Delete the Mux live stream
  fetch("/api/daily", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
    body: JSON.stringify({ action: "delete-mux-livestream", eventId })

  currentEvent = { ...currentEvent, status: "ended", ended_at: endedAt };
  renderDetailView(currentEvent);
}

async function joinBackstage(eventId) {
  // Refresh auth token
  const { data: { session } } = await db.auth.getSession();
  if (!session) { alert("Session expired — please sign in again."); window.location.href = "/practice-log.html"; return; }
  authToken = session.access_token;

  // Refresh event
  const { data: ev } = await db.from("live_events").select("*").eq("id", eventId).single();
  if (!ev) { alert("Event not found."); return; }
  currentEvent = ev;

  // Admin creates the backstage room if it doesn't exist yet
  if (isAdmin) {
    const createRes = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
      body: JSON.stringify({ action: "create-backstage-room", eventId })
    });
    const createData = await createRes.json();
    if (createData.error) {
      alert("Could not create backstage room: " + JSON.stringify(createData.error));
      return;
    }
  }

  // Get Daily.co token for the backstage room
  let tokenData;
  try {
    const tokenRes = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
      body: JSON.stringify({ action: "get-backstage-token", eventId })
    });
    tokenData = await tokenRes.json();
  } catch(e) {
    alert("Could not reach the server. Please check your connection.");
    return;
  }
  if (tokenData.error || !tokenData.token) {
    alert("Could not get backstage access: " + (tokenData.error || "unknown error"));
    return;
  }

  // Switch to backstage view
  showView("backstage");
  document.getElementById("backstage-event-name").textContent = ev.title || "";

  // Show the right bottom bar
  document.getElementById("backstage-admin-bar").style.display = isAdmin ? "flex" : "none";
  document.getElementById("backstage-guest-bar").style.display = isAdmin ? "none" : "flex";
  // Show invite row for admin only
  document.getElementById("backstage-invite-row").style.display = isAdmin ? "flex" : "none";

  // Update "Go Live" vs "Join Stream" button based on current stream status
  _updateBackstageGoLiveBtn();

  // If stream is live, show the live indicator
  const liveIndicator = document.getElementById("backstage-stream-indicator");
  if (liveIndicator) liveIndicator.style.display = (ev.status === "live") ? "inline-flex" : "none";

  // Destroy any existing backstage call frame
  if (window._backstageFrame) {
    try { await window._backstageFrame.destroy(); } catch(e) {}
    window._backstageFrame = null;
  }

  const container = document.getElementById("backstage-container");
  container.innerHTML = "";

  if (typeof DailyIframe === "undefined") {
    container.innerHTML = `<div style="color:var(--text-muted);padding:40px;text-align:center">Daily.co SDK not loaded</div>`;
    return;
  }

  window._backstageFrame = DailyIframe.createFrame(container, {
    showLeaveButton:      false,  // "Leave Backstage" button in our own bar
    showFullscreenButton: true,
    iframeStyle: {
      position: "absolute", top: 0, left: 0,
      width: "100%", height: "100%", border: "none"
    }
  });

  window._backstageFrame.on("left-meeting", () => {
    if (window._backstageFrame) {
      try { window._backstageFrame.destroy(); } catch(e) {}
      window._backstageFrame = null;
    }
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;">
        <p style="color:var(--text-muted)">You left the backstage.</p>
        <button class="btn btn-primary" onclick="joinBackstage('${eventId}')">Rejoin</button>
      </div>`;
  });

  // Build the backstage room URL from the token's room name
  const backstageRoomName = tokenData.roomName;
  const backstageUrl      = `https://practiceroom.daily.co/${backstageRoomName}`;

  try {
    await window._backstageFrame.join({ url: backstageUrl, token: tokenData.token });
  } catch(e) {
    console.error("Backstage join failed:", e);
    alert("Could not join the backstage room: " + e.message);
    return;
  }

  // Load the sidebar data
  await Promise.all([
    loadBackstageGuests(eventId),
    loadBackstageQA(eventId)
  ]);

  // Subscribe to Q&A updates so the Questions tab stays live
  if (backstageChannel) { db.removeChannel(backstageChannel); backstageChannel = null; }
  backstageChannel = db.channel(`backstage-qa-${eventId}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_qa",
        filter: `event_id=eq.${eventId}` }, () => {
      loadBackstageQA(eventId);
      // Show badge if Q&A tab is not active
      const bsQaTab = document.getElementById("bs-tab-qa");
      if (bsQaTab && !bsQaTab.classList.contains("active")) {
        const badge = document.getElementById("bs-qa-badge");
        if (badge) { badge.textContent = "+"; badge.classList.add("visible"); }
      }
    })
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "event_qa",
        filter: `event_id=eq.${eventId}` }, () => {
      loadBackstageQA(eventId);
    })
    .subscribe();
}

function _updateBackstageGoLiveBtn() {
  const btn = document.getElementById("backstage-golive-btn");
  if (!btn || !currentEvent) return;
  if (currentEvent.status === "live") {
    btn.textContent = "Join Stream →";
    btn.onclick = () => {
      // Leave backstage cleanly then join the main stream
      (async () => {
        if (window._backstageFrame) {
          try { await window._backstageFrame.leave(); } catch(e) {}
          try { await window._backstageFrame.destroy(); } catch(e) {}
          window._backstageFrame = null;
        }
        if (backstageChannel) { db.removeChannel(backstageChannel); backstageChannel = null; }
        await joinStream(currentEvent.id);
      })();
    };
    btn.className = "btn btn-sm btn-danger";
  } else {
    btn.textContent = "Go Live";
    btn.onclick = goLiveFromBackstage;
    btn.className = "btn btn-sm btn-danger";
  }
}

async function goLiveFromBackstage() {
  const btn = document.getElementById("backstage-golive-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Starting…"; }

  try {
    const { data: { session } } = await db.auth.getSession();
    if (session) authToken = session.access_token;

    const { data: latestEv } = await db.from("live_events").select("*").eq("id", currentEvent.id).single();
    currentEvent = { ...currentEvent, ...latestEv };

    if (latestEv?.daily_room_name) {
      // Main room already exists — check/create the Mux live stream
      let needNewStream = !latestEv.mux_live_stream_id;
      if (!needNewStream) {
        const skRes = await fetch("/api/daily", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
          body: JSON.stringify({ action: "get-mux-stream-key", eventId: currentEvent.id })
        });
        const skData = await skRes.json();
        if (skData.status === "disabled" || !skData.streamKey) {
          needNewStream = true;
        } else {
          currentEvent._muxStreamKey        = skData.streamKey;
          currentEvent.mux_live_playback_id = skData.playbackId || currentEvent.mux_live_playback_id;
        }
      }
      if (needNewStream) {
        const muxRes = await fetch("/api/daily", {
          method: "POST",
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
          body: JSON.stringify({ action: "create-mux-livestream", eventId: currentEvent.id })
        });
        const muxData = await muxRes.json();
        currentEvent._muxStreamKey        = muxData.muxStreamKey || null;
        currentEvent.mux_live_playback_id = muxData.muxLivePlaybackId || null;
      }
    } else {
      // No room yet — create the main room + Mux stream from scratch
      const res = await fetch("/api/daily", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
        body: JSON.stringify({ action: "create-room", eventId: currentEvent.id })
      });
      const room = await res.json();
      if (room.error) throw new Error(JSON.stringify(room.error));

      await db.from("live_events").update({
        status: "live",
        daily_room_name: room.roomName,
        daily_room_url:  room.roomUrl
      }).eq("id", currentEvent.id);

      currentEvent = {
        ...currentEvent,
        status:               "live",
        daily_room_name:      room.roomName,
        daily_room_url:       room.roomUrl,
        mux_live_playback_id: room.muxLivePlaybackId || null,
        _muxStreamKey:        room.muxStreamKey || null,
      };
    }

    // Mark event as live if not already
    if (currentEvent.status !== "live") {
      await db.from("live_events").update({ status: "live" }).eq("id", currentEvent.id);
      currentEvent = { ...currentEvent, status: "live" };
    }

    // Leave backstage cleanly, then join the main stream
    if (window._backstageFrame) {
      try { await window._backstageFrame.leave(); } catch(e) {}
      try { await window._backstageFrame.destroy(); } catch(e) {}
      window._backstageFrame = null;
    }
    if (backstageChannel) { db.removeChannel(backstageChannel); backstageChannel = null; }

    const ok = await joinStream(currentEvent.id);
    if (!ok && btn) { btn.disabled = false; btn.textContent = "Go Live"; }

  } catch(e) {
    console.error("goLiveFromBackstage:", e);
    alert("Failed to go live: " + e.message);
    if (btn) { btn.disabled = false; btn.textContent = "Go Live"; }
  }
}

async function leaveBackstage() {
  if (window._backstageFrame) {

function updateMonthlyLabel() {

  const dayOfMonth = d.getDate();
  const weekdays   = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const dayName    = weekdays[d.getDay()];
  const nthWeek    = Math.ceil(dayOfMonth / 7);
  const ordinals   = ["","1st","2nd","3rd","4th","5th"];
  document.getElementById("monthly-date-label").textContent    = `Same date each month (${ordinals[dayOfMonth] || dayOfMonth+"th"})`;
  document.getElementById("monthly-weekday-label").textContent = `Same weekday each month (${ordinals[nthWeek]} ${dayName})`;

function _getRecurrenceDates(startDate, rule) {
  const { frequency, monthlyType, endType, count, until } = rule;
  const dates = [new Date(startDate)];
  let current = new Date(startDate);
  const maxOccurrences = endType === "count" ? Number(count) : 200;
  const untilDate = endType === "until" ? new Date(until) : null;

  // For monthly-weekday: capture the Nth weekday pattern from startDate
  const startDay   = startDate.getDay();           // 0-6
  const nthWeek    = Math.ceil(startDate.getDate() / 7); // 1-5

  while (dates.length < maxOccurrences) {
    let next = new Date(current);
    switch (frequency) {
      case "daily":    next.setDate(next.getDate() + 1); break;
      case "weekly":   next.setDate(next.getDate() + 7); break;
      case "biweekly": next.setDate(next.getDate() + 14); break;
      case "yearly":   next.setFullYear(next.getFullYear() + 1); break;
      case "monthly":
        if (monthlyType === "weekday") {
          // Find the Nth occurrence of startDay in next month
          next.setDate(1);
          next.setMonth(next.getMonth() + 1);
          let count = 0, d = new Date(next);
          while (count < nthWeek || d.getDay() !== startDay) {
            if (d.getDay() === startDay) count++;
            if (count < nthWeek) d.setDate(d.getDate() + 1);
          }
          next = d;
        } else {
          next.setMonth(next.getMonth() + 1);
        }
        break;
    }
    if (untilDate && next > untilDate) break;
    dates.push(next);
    current = next;
  }
  return dates;
}

  document.getElementById("f-end-count").value = "8";
  if (untilPicker) { untilPicker.clear(); document.getElementById("until-trigger-text").innerHTML = `<span class="dt-placeholder">Pick an end date</span>`; }
  document.getElementById("monthly-opts").style.display = "none";
  document.getElementById("recurrence-field").style.display = "";
  document.getElementById("modal-create").style.display = "flex";
}

function openEditModal() {
  if (!currentEvent) return;
  editingEventId = currentEvent.id;
  document.getElementById("modal-title").textContent = "Edit Event";
  document.getElementById("f-title").value    = currentEvent.title || "";
  const fDesc = document.getElementById("f-desc");
  fDesc.value = currentEvent.description || "";
  autoResize(fDesc);
  document.getElementById("f-cover").value    = currentEvent.cover_url || "";
  document.getElementById("f-duration").value = currentEvent.duration_mins || 60;
  populateTzSelect();
  // Set the saved timezone
  const tzSel = document.getElementById("f-timezone");
  if (currentEvent.timezone) tzSel.value = currentEvent.timezone;
  if (!datePicker) initDatePicker();
  if (currentEvent.scheduled_at) {
    datePicker.setDate(new Date(currentEvent.scheduled_at), true);
  } else {
    datePicker.clear();
    document.getElementById("date-trigger-text").innerHTML = `<span class="dt-placeholder">Pick a date and time</span>`;
  }
  document.getElementById("modal-create").style.display = "flex";
  // Set cover preview after modal is visible so dimensions are available
  setCoverPreview(currentEvent.cover_url || null, currentEvent.cover_position ?? 50);
  loadPreviousCovers();
  // Hide recurrence field when editing (use edit-all/edit-one banner instead)
  document.getElementById("recurrence-field").style.display = "none";
  editingAllInSeries = false;
  const banner = document.getElementById("recurrence-banner");
  if (currentEvent.recurrence_group_id) {
    banner.style.display = "";
    banner.innerHTML = `Part of a recurring series. <button onclick="switchToEditAll()" style="background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-family:inherit;font-size:.85rem">Edit all events in series →</button>`;
  } else {
    banner.style.display = "none";
  }
}

function closeCreateModal() {
  document.getElementById("modal-create").style.display = "none";
  _savingEvent = false;
  editingAllInSeries = false;
}

let _savingEvent = false;
async function saveEvent() {
  if (_savingEvent) return;
  _savingEvent = true;
  const saveBtn = document.querySelector("#modal-create .btn-primary");
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = "Saving…"; }

  const title    = document.getElementById("f-title").value.trim();
  const desc     = document.getElementById("f-desc").value.trim();
  const cover    = document.getElementById("f-cover").value.trim();
  const coverPos = parseInt(document.getElementById("f-cover-pos").value) || 50;
  const dateVal  = document.getElementById("f-date").value;
  const duration = parseInt(document.getElementById("f-duration").value) || 60;

  if (!title || !dateVal) {
    alert("Title and date are required.");
    _savingEvent = false;
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "Save Event"; }
    return;
  }

  try {
    const timezone = document.getElementById("f-timezone").value || "Europe/London";
    const payload = {
      title,
      description:    desc || null,
      cover_url:      cover || null,
      cover_position: coverPos,
      scheduled_at:   new Date(dateVal).toISOString(),
      duration_mins:  duration,
      timezone,
      created_by:     myEmail
    };

    const isRecurring = !editingEventId && document.getElementById("f-recurring").checked;

    if (isRecurring) {
      const frequency   = document.querySelector(".freq-pill.active")?.dataset.freq || "weekly";
      const monthlyType = document.querySelector("input[name='monthly-type']:checked")?.value || "date";
      const endType     = document.querySelector("input[name='end-type']:checked")?.value || "count";
      const count       = parseInt(document.getElementById("f-end-count").value) || 8;
      const until       = document.getElementById("f-end-until").value || null;
      const rule        = { frequency, monthlyType, endType, count, until };
      const groupId   = crypto.randomUUID();
      const dates     = _getRecurrenceDates(new Date(dateVal), rule);
      const rows      = dates.map(d => ({
        ...payload,
        scheduled_at:        d.toISOString(),
        recurrence_group_id: groupId,
        recurrence_rule:     rule,
        status:              "scheduled",
      }));
      const { error: bulkErr } = await db.from("live_events").insert(rows);
      if (bulkErr) { alert("Error creating recurring events: " + bulkErr.message); _savingEvent = false; if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "Save Event"; } return; }
      closeCreateModal();
      loadEvents("upcoming");
      return;
    }

    if (editingEventId && editingAllInSeries && currentEvent.recurrence_group_id) {
      const sharedPayload = { title, description: desc || null, cover_url: cover || null, cover_position: coverPos, duration_mins: duration, timezone };
      await db.from("live_events").update(sharedPayload).eq("recurrence_group_id", currentEvent.recurrence_group_id);
      closeCreateModal();
      renderDetailView(currentEvent);
      return;
    }

    if (editingEventId) {
      await db.from("live_events").update(payload).eq("id", editingEventId);
      currentEvent = { ...currentEvent, ...payload };
    } else {
      const { data } = await db.from("live_events").insert(payload).select().single();
      currentEvent = data;
    }

    closeCreateModal();
    if (editingEventId) {
      renderDetailView(currentEvent);
    } else {
      showView("detail");
      renderDetailView(currentEvent);
    }
  } finally {
    _savingEvent = false;
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "Save Event"; }
  }
}

// ── Add Mux playback ID ───────────────────────────────────────────────────────
async function saveMuxPlaybackId(eventId) {
  const pid = document.getElementById("mux-pid-input").value.trim();
  if (!pid) return;
  await db.from("live_events").update({ mux_playback_id: pid }).eq("id", eventId);
  currentEvent = { ...currentEvent, mux_playback_id: pid };
  renderDetailView(currentEvent);
}

async function fetchRecordingFromDaily(eventId) {
  const btn = document.getElementById("fetch-rec-btn");
  btn.disabled = true;
  btn.textContent = "Fetching…";

  try {
    const { data: { session } } = await db.auth.getSession();
    if (session) authToken = session.access_token;

    const res = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
      body: JSON.stringify({ action: "fetch-recording", eventId })
    });
    const result = await res.json();

    if (result.error) {
      const detail = result.detail ? "\n\n" + JSON.stringify(result.detail, null, 2) : "";
      alert("Could not fetch recording: " + result.error + detail);
      btn.disabled = false;
      btn.textContent = "Fetch from Mux";
      return;
    }

    // Update local state and re-render
    currentEvent = { ...currentEvent, mux_asset_id: result.muxAssetId, mux_playback_id: result.muxPlaybackId };
    renderDetailView(currentEvent);
  } catch(e) {
    alert("Error: " + e.message);
    btn.disabled = false;
    btn.textContent = "Fetch from Mux";
  }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function formatEventDate(iso, timezone) {
  const d = new Date(iso);
  const tz = timezone || "UTC";
  const eventTzStr = d.toLocaleString("en-GB", {
    timeZone: tz,
    weekday: "short", day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
  // Get the timezone abbreviation
  const tzAbbr = new Intl.DateTimeFormat("en", { timeZone: tz, timeZoneName: "short" })
    .formatToParts(d).find(p => p.type === "timeZoneName")?.value || "";
  return `${eventTzStr} ${tzAbbr}`;
}

function formatEventDateWithLocal(iso, timezone) {
  const d = new Date(iso);
  const tz = timezone || "UTC";
  const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

  const primary = formatEventDate(iso, tz);

  // Only show local time if the viewer is in a different timezone
  if (localTz === tz) return `<div class="tz-display"><span class="tz-primary">${primary}</span></div>`;

  const localStr = d.toLocaleString("en-GB", {
    timeZone: localTz,
    hour: "2-digit", minute: "2-digit"
  });
  const localAbbr = new Intl.DateTimeFormat("en", { timeZone: localTz, timeZoneName: "short" })
    .formatToParts(d).find(p => p.type === "timeZoneName")?.value || "";

  return `<div class="tz-display">
    <span class="tz-primary">${primary}</span>
    <span class="tz-local"><span class="tz-local-label">Your time:</span> ${localStr} ${localAbbr}</span>
  </div>`;
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  const abs  = Math.abs(diff);
  const future = diff < 0;
  if (abs < 60000) return "just now";
  if (abs < 3600000) {
    const m = Math.floor(abs / 60000);
    return future ? `in ${m} minute${m !== 1 ? "s" : ""}` : `${m}m ago`;
  }
  if (abs < 86400000) {
    const h = Math.floor(abs / 3600000);
    return future ? `in ${h} hour${h !== 1 ? "s" : ""}` : `${h}h ago`;
  }
  const d = Math.floor(abs / 86400000);
  return future ? `in ${d} day${d !== 1 ? "s" : ""}` : `${d}d ago`;
}
// Always returns past-tense — used for ended events whose scheduled_at
// may still be in the future (event ended early before its start time)
function timeAgoAbs(iso) {
  const abs = Math.abs(Date.now() - new Date(iso).getTime());
  if (abs < 60000) return "just now";
  if (abs < 3600000) { const m = Math.floor(abs / 60000); return `${m}m ago`; }
  if (abs < 86400000) { const h = Math.floor(abs / 3600000); return `${h}h ago`; }
  const d = Math.floor(abs / 86400000);
  return `${d} day${d !== 1 ? "s" : ""} ago`;
}

function getInitials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}

function avatarColor(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)", fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)", fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)", fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}

function avatarHtml(name, email, size = 36, avatarUrl = null) {
  const style = `width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;`;
  if (avatarUrl) {
    return `<div style="${style}overflow:hidden"><img src="${esc(avatarUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block" /></div>`;
  }
  const initials = getInitials(name || email?.split("@")[0]);
  const colour = avatarColor(email || "");
  return `<div class="member-avatar" style="width:${size}px;height:${size}px;background:${colour.bg};color:${colour.fg};font-size:${Math.round(size*0.38)}px">${initials}</div>`;
}

// ── Image lightbox ────────────────────────────────────────────────────────────
function _evImgGroupStore(urls) {
  const key = "eg" + Date.now() + Math.random().toString(36).slice(2, 6);
  _evImgGroups[key] = urls;
  return key;
}

function _evImgModalOpen(groupKey, index) {
  index = index || 0;
  const urls = _evImgGroups[groupKey];
  if (!urls) return;
  _evImgCurrentGroup = groupKey;
  _evImgCurrentIdx   = index;
  const modal = document.getElementById("ev-img-modal");
  if (modal) { modal.style.display = "flex"; requestAnimationFrame(() => modal.classList.add("open")); }
  _evImgModalShow();
  document.addEventListener("keydown", _evImgModalKeyHandler);
}

function _evImgModalShow() {
  const urls    = _evImgGroups[_evImgCurrentGroup] || [];
  const idx     = _evImgCurrentIdx;
  const modal   = document.getElementById("ev-img-modal");
  if (modal && modal.style.display === "none") { modal.style.display = "flex"; requestAnimationFrame(() => modal.classList.add("open")); }
  const img     = document.getElementById("ev-img-modal-img");
  const prev    = document.getElementById("ev-img-modal-prev");
  const next    = document.getElementById("ev-img-modal-next");
  const counter = document.getElementById("ev-img-modal-counter");
  if (!modal || !img) return;
  img.src = urls[idx] || "";
  modal.classList.add("open");
  const multi = urls.length > 1;
  if (prev)    prev.disabled    = !multi || idx === 0;
  if (next)    next.disabled    = !multi || idx === urls.length - 1;
  if (counter) { counter.style.display = multi ? "" : "none"; counter.textContent = `${idx + 1} / ${urls.length}`; }
}

function _evImgModalNav(dir) {
  const urls = _evImgGroups[_evImgCurrentGroup] || [];
  const next = _evImgCurrentIdx + dir;
  if (next < 0 || next >= urls.length) return;
  _evImgCurrentIdx = next;
  _evImgModalShow();
}

function _evImgModalClose() {
  const modal = document.getElementById("ev-img-modal");
  if (modal) modal.classList.remove("open");
  document.removeEventListener("keydown", _evImgModalKeyHandler);
  setTimeout(() => {
    const img = document.getElementById("ev-img-modal-img");
    if (img) img.src = "";
    if (modal) modal.style.display = "none";
  }, 200);
  _evImgCurrentGroup = null;
}

function _evImgModalKeyHandler(e) {
  if (e.key === "Escape")     _evImgModalClose();
  if (e.key === "ArrowRight") _evImgModalNav(1);
  if (e.key === "ArrowLeft")  _evImgModalNav(-1);
}
</script>

<!-- Image lightbox modal -->
<div id="ev-img-modal" onclick="_evImgModalClose()">
  <button id="ev-img-modal-close" onclick="_evImgModalClose()" aria-label="Close">✕</button>
  <button id="ev-img-modal-prev" class="ev-img-modal-nav" onclick="event.stopPropagation();_evImgModalNav(-1)" aria-label="Previous">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <img id="ev-img-modal-img" src="" alt="" onclick="event.stopPropagation()">
  <button id="ev-img-modal-next" class="ev-img-modal-nav" onclick="event.stopPropagation();_evImgModalNav(1)" aria-label="Next">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
  <div id="ev-img-modal-counter" style="display:none"></div>
</div>
