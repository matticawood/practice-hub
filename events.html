<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events & Replays — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <style>
    /* ── Events page ─────────────────────────────────────────────────────────── */
    #app-header {
      position: sticky; top: 0; z-index: 150;
      background: var(--surface);
      border-bottom: 1.5px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .header-left  { display: flex; align-items: center; gap: 12px; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .app-logo {
      width: 30px; height: 30px;
      background: var(--accent); border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; text-decoration: none; flex-shrink: 0;
    }
    .header-title { font-size: 1rem; font-weight: 700; color: var(--text); }

    /* ── Main layout ─────────────────────────────────────────────────────────── */
    #events-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ── View transitions ────────────────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Events list ─────────────────────────────────────────────────────────── */
    .events-page-hdr {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .events-page-hdr h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }

    .evt-tabs {
      display: flex; gap: 4px;
      border-bottom: 1.5px solid var(--border);
      margin-bottom: 24px;
    }
    .evt-tab {
      background: none; border: none; cursor: pointer;
      padding: 8px 16px; font-size: 0.9rem; font-weight: 600;
      color: var(--text-muted); border-bottom: 2.5px solid transparent;
      margin-bottom: -1.5px; transition: color .15s, border-color .15s;
    }
    .evt-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }
    .event-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .event-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .event-card-cover {
      width: 100%; aspect-ratio: 16/7;
      background: var(--surface-2);
      object-fit: cover; display: block;
    }
    .event-card-cover-placeholder {
      width: 100%; aspect-ratio: 16/7;
      background: linear-gradient(135deg, #1a1200 0%, #2a2000 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }
    .event-card-body { padding: 14px 16px 16px; }
    .event-card-status {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; padding: 3px 8px; border-radius: 20px;
      margin-bottom: 8px;
    }
    .status-scheduled { background: #1a2a1a; color: #6bcb77; border: 1px solid #2a4a2a; }
    .status-live      { background: #2a1010; color: #ff6b6b; border: 1px solid #4a2020;
                        animation: pulse-border 1.5s infinite; }
    .status-ended     { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
    @keyframes pulse-border {
      0%, 100% { border-color: #4a2020; }
      50%      { border-color: #ff6b6b; }
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #ff6b6b;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .event-card-title {
      font-size: 1rem; font-weight: 700; color: #fff;
      margin-bottom: 6px; line-height: 1.3;
    }
    .event-card-meta { font-size: 0.8rem; color: var(--text-muted); }
    .event-card-footer {
      display: flex; align-items: center; gap: 8px;
      margin-top: 10px; flex-wrap: wrap;
    }
    .evt-badge {
      font-size: 0.72rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 4px;
    }

    /* ── Event detail ────────────────────────────────────────────────────────── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-muted); font-size: 0.88rem; font-weight: 600;
      padding: 6px 12px; border-radius: 8px;
      border: 1.5px solid var(--border); background: none;
      cursor: pointer; transition: border-color .15s, color .15s;
      margin-bottom: 20px;
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }

    .event-detail-cover {
      width: 100%; aspect-ratio: 16/5;
      border-radius: var(--radius); object-fit: cover;
      margin-bottom: 20px; display: block;
    }
    .event-detail-cover-placeholder {
      width: 100%; aspect-ratio: 16/5;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #1a1200 0%, #2a2000 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem; margin-bottom: 20px;
    }
    .event-detail-hdr {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 16px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .event-detail-title { font-size: 1.6rem; font-weight: 700; color: #fff; line-height: 1.2; }
    .event-detail-meta  { font-size: 0.88rem; color: var(--text-muted); margin-top: 6px; }
    .event-detail-desc  {
      color: var(--text-muted); font-size: 0.93rem; line-height: 1.7;
      margin-bottom: 20px;
    }

    .event-info-row {
      display: flex; gap: 20px; flex-wrap: wrap;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px;
      margin-bottom: 24px;
    }
    .event-info-item { display: flex; flex-direction: column; gap: 3px; }
    .event-info-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
                        letter-spacing: .08em; color: var(--text-muted); }
    .event-info-val   { font-size: 0.9rem; color: var(--text); font-weight: 600; }

    .event-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }

    /* ── Countdown ───────────────────────────────────────────────────────────── */
    .countdown-block {
      background: var(--accent-subtle); border: 1.5px solid #3d3200;
      border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px;
      text-align: center;
    }
    .countdown-label { font-size: 0.8rem; color: var(--accent); font-weight: 700;
                       text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .countdown-digits { display: flex; gap: 16px; justify-content: center; }
    .countdown-unit { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .countdown-num { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .countdown-unit-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;
                            letter-spacing: .08em; }

    /* ── Mux recording player ────────────────────────────────────────────────── */
    .recording-block {
      margin-bottom: 28px;
    }
    .recording-block h3 {
      font-size: 1rem; font-weight: 700; color: var(--text);
      margin-bottom: 12px;
    }
    .mux-player-wrap {
      width: 100%; aspect-ratio: 16/9;
      background: #000; border-radius: var(--radius); overflow: hidden;
    }
    mux-player { width: 100%; height: 100%; }

    /* ── Comments ────────────────────────────────────────────────────────────── */
    .comments-section h3 {
      font-size: 1rem; font-weight: 700; color: var(--text);
      margin-bottom: 14px;
    }
    .comment-input-row {
      display: flex; gap: 10px; margin-bottom: 18px;
    }
    .comment-input-row textarea {
      flex: 1; min-height: 64px; resize: vertical;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
      color: var(--text); font-size: 0.9rem; font-family: inherit;
    }
    .comment-input-row textarea:focus { outline: none; border-color: var(--accent); }
    .comment-list { display: flex; flex-direction: column; gap: 12px; }
    .comment-item {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px;
    }
    .comment-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .comment-author { font-size: 0.83rem; font-weight: 700; color: var(--accent); }
    .comment-date   { font-size: 0.75rem; color: var(--text-muted); }
    .comment-body   { font-size: 0.9rem; color: var(--text); line-height: 1.5; }

    /* ── Live stream layout — full viewport below header ────────────────────── */
    #view-stream.active {
      position: fixed;
      top: 56px; left: 0; right: 0;
      height: calc(100dvh - 56px); /* dvh accounts for mobile browser chrome */
      z-index: 100;
      display: flex; flex-direction: column;
      background: #000;
      overflow: hidden;
    }
    #stream-wrap {
      flex: 1; min-height: 0;
      display: flex; overflow: hidden;
    }
    #stream-video-col {
      flex: 1; min-width: 0; min-height: 0;
      background: #000; position: relative;
    }
    .video-ratio-wrap {
      width: 100%; height: 100%; position: relative; background: #000;
    }
    /* Daily.co SDK injects its own iframe — make sure it fills the container */
    .video-ratio-wrap iframe {
      position: absolute; top: 0; left: 0;
      width: 100% !important; height: 100% !important;
      border: none;
    }
    /* Featured Q&A — lives at top of sidebar on all screen sizes */
    #featured-qa-bar {
      display: none;
      background: #1a1200; border-bottom: 2px solid var(--accent);
      padding: 10px 14px; flex-shrink: 0;
      animation: slideDown .25s ease;
    }
    #featured-qa-bar.visible { display: block; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .featured-qa-label { font-size: 0.68rem; color: var(--accent); font-weight: 700;
                         text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; }
    .featured-qa-text  { font-size: 0.88rem; color: #fff; line-height: 1.4; }
    .featured-qa-asker { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

    #stream-sidebar {
      width: 320px; flex-shrink: 0;
      background: var(--surface); border-left: 1.5px solid var(--border);
      display: flex; flex-direction: column;
      min-height: 0; overflow: visible;
    }
    .stream-event-title {
      padding: 12px 16px 0;
      font-size: 0.9rem; font-weight: 700; color: var(--text);
      border-bottom: none;
    }
    .sidebar-tabs {
      display: flex; border-bottom: 1.5px solid var(--border);
      flex-shrink: 0;
    }
    .sid-tab {
      flex: 1; background: none; border: none; cursor: pointer;
      padding: 12px 10px; font-size: 0.85rem; font-weight: 600;
      color: var(--text-muted); border-bottom: 2.5px solid transparent;
      margin-bottom: -1.5px; transition: color .15s, border-color .15s;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      min-height: 44px; /* iOS minimum tap target */
    }
    .sid-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Chat */
    #sidebar-chat, #sidebar-qa { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #chat-messages, #qa-questions {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
      -webkit-overflow-scrolling: touch;
    }
    .chat-msg {
      background: var(--surface-2); border-radius: 8px; padding: 8px 10px;
    }
    .chat-msg-author { font-size: 0.75rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
    .chat-msg-text   { font-size: 0.88rem; color: var(--text); line-height: 1.4; word-break: break-word; }
    .chat-msg.mine   { background: #1a1200; border: 1px solid #3d3200; }

    .chat-input-row {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1.5px solid var(--border); flex-shrink: 0;
    }
    .chat-input-row input {
      flex: 1; background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-size: 0.88rem;
    }
    .chat-input-row input:focus { outline: none; border-color: var(--accent); }

    /* Q&A */
    .qa-item {
      background: var(--surface-2); border-radius: 8px; padding: 10px 12px;
      border: 1px solid var(--border);
    }
    .qa-item.featured { border-color: var(--accent); background: #1a1200; }
    .qa-item-asker { font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .qa-item-text  { font-size: 0.88rem; color: var(--text); line-height: 1.4; }
    .qa-item-actions {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .qa-item-actions button {
      font-size: 0.72rem; padding: 3px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-muted); cursor: pointer; transition: all .15s;
    }
    .qa-item-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .qa-item-actions button.featured-btn { border-color: var(--accent); color: var(--accent); }

    .qa-input-row {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1.5px solid var(--border); flex-shrink: 0;
    }
    .qa-input-row input {
      flex: 1; background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-size: 0.88rem;
    }
    .qa-input-row input:focus { outline: none; border-color: var(--accent); }

    /* Stream admin bar */
    #stream-admin-bar {
      display: none;
      background: #1a1200; border-top: 1.5px solid #3d3200;
      padding: 10px 16px; flex-shrink: 0;
      display: none; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    #stream-admin-bar.visible { display: flex; }
    .admin-bar-label { font-size: 0.8rem; color: var(--accent); font-weight: 700; }

    @media (max-width: 700px) {
      #view-stream.active { top: 56px; }
      #stream-wrap { flex-direction: column; }
      #stream-video-col { flex: none; aspect-ratio: 16/9; }
      .video-ratio-wrap { aspect-ratio: 16/9; height: auto; }
      #stream-sidebar { width: 100%; flex: 1; border-left: none; border-top: 1.5px solid var(--border); }
    }

    /* ── Admin create event form ──────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      z-index: 500; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 20px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-field label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
                        letter-spacing: .06em; color: var(--text-muted); }
    .form-field input, .form-field textarea, .form-field select {
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 10px 14px; color: var(--text);
      font-size: 0.9rem; font-family: inherit;
    }
    .form-field textarea { resize: vertical; min-height: 80px; }
    .form-field input:focus, .form-field textarea:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

    /* ── Admin event controls on detail page ─────────────────────────────────── */
    .admin-event-controls {
      background: #1a1200; border: 1.5px solid #3d3200;
      border-radius: var(--radius); padding: 14px 18px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .admin-event-controls span { font-size: 0.82rem; color: var(--accent); font-weight: 700; }

    /* ── Add Mux playback form ────────────────────────────────────────────────── */
    .mux-form {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 24px;
    }
    .mux-form h4 { font-size: 0.85rem; font-weight: 700; color: var(--accent);
                   margin-bottom: 10px; }
    .mux-form-row { display: flex; gap: 10px; }
    .mux-form-row input {
      flex: 1; background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 0.88rem;
    }
    .mux-form-row input:focus { outline: none; border-color: var(--accent); }

    /* ── Cover image upload ──────────────────────────────────────────────────── */
    .cover-upload-area {
      width: 100%; aspect-ratio: 16/6;
      background: var(--surface-2); border: 2px dashed var(--border);
      border-radius: 8px; cursor: pointer; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      position: relative; transition: border-color .15s;
    }
    .cover-upload-area:hover { border-color: var(--accent); }
    .cover-upload-area.has-image { border-style: solid; border-color: var(--border); }
    #cover-placeholder {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; color: var(--text-muted); font-size: 0.88rem;
      pointer-events: none;
    }
    #cover-preview-wrap { width: 100%; height: 100%; position: relative; }
    #cover-position-bar {
      display: none;
      position: absolute; right: 8px; top: 8px; bottom: 8px;
      width: 28px; flex-direction: column; align-items: center;
      gap: 4px; z-index: 2;
    }
    #cover-preview-wrap.has-image #cover-position-bar { display: flex; }
    #cover-position-bar label {
      font-size: 0.62rem; color: rgba(255,255,255,.7);
      writing-mode: vertical-rl; text-orientation: mixed;
      transform: rotate(180deg); letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 2px;
    }
    #cover-pos-slider {
      -webkit-appearance: slider-vertical;
      appearance: slider-vertical;
      width: 20px; flex: 1; cursor: pointer;
      accent-color: var(--accent);
      writing-mode: vertical-lr;
      direction: rtl;
    }
    #cover-upload-progress {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.7);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: var(--text); font-size: 0.88rem;
    }
    .upload-spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .prev-covers-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    }
    .prev-cover-thumb {
      aspect-ratio: 16/7; border-radius: 6px; overflow: hidden;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color .15s; position: relative;
    }
    .prev-cover-thumb:hover { border-color: var(--accent); }
    .prev-cover-thumb.selected { border-color: var(--accent); }
    .prev-cover-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Flatpickr dark theme overrides ─────────────────────────────────────── */
    .flatpickr-calendar {
      background: var(--surface-2) !important;
      border: 1.5px solid var(--border) !important;
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow) !important;
      font-family: inherit !important;
    }
    .flatpickr-months .flatpickr-month,
    .flatpickr-weekdays,
    span.flatpickr-weekday {
      background: var(--surface-2) !important;
      color: var(--text-muted) !important;
      fill: var(--text-muted) !important;
    }
    .flatpickr-day { color: var(--text) !important; border-radius: 6px !important; }
    .flatpickr-day:hover { background: var(--surface) !important; border-color: var(--accent) !important; }
    .flatpickr-day.selected,
    .flatpickr-day.selected:hover {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #000 !important;
    }
    .flatpickr-day.today { border-color: var(--accent) !important; }
    .flatpickr-day.flatpickr-disabled { color: var(--text-muted) !important; opacity: .35; }
    .numInputWrapper input,
    .flatpickr-time input {
      color: var(--text) !important;
      background: var(--surface) !important;
    }
    .flatpickr-time .flatpickr-time-separator,
    .flatpickr-time .flatpickr-am-pm { color: var(--text-muted) !important; }
    .flatpickr-current-month .flatpickr-monthDropdown-months,
    .flatpickr-current-month input.cur-year {
      color: var(--text) !important;
      background: transparent !important;
    }
    .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: var(--text-muted) !important; }
    .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg { fill: var(--accent) !important; }
    /* Hide the raw input — show only our styled trigger */
    .flatpickr-input { display: none !important; }
    .date-trigger {
      display: flex; align-items: center; gap: 10px;

           padding: 8px 16px; border-radius: 8px; font-size: 0.88rem;
           font-weight: 600; cursor: pointer; border: none;

    .btn-primary { background: var(--accent); color: #000; }

    .btn-ghost   { background: none; border: 1.5px solid var(--border); color: var(--text-muted); }

    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }

<script>
// ── Cover image upload ────────────────────────────────────────────────────────
async function handleCoverUpload(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert("Image must be under 5MB."); return; }

  const area     = document.getElementById("cover-upload-area");
  const progress = document.getElementById("cover-upload-progress");
  const status   = document.getElementById("cover-upload-status");

  progress.style.display = "flex";
  status.textContent = "Uploading…";

  const ext      = file.name.split(".").pop().toLowerCase();
  const fileName = `cover-${Date.now()}.${ext}`;

  const { data, error } = await db.storage
    .from("event-covers")
    .upload(fileName, file, { cacheControl: "3600", upsert: false });

  if (error) {
    progress.style.display = "none";
    alert("Upload failed: " + error.message);
    return;
  }

  const { data: urlData } = db.storage.from("event-covers").getPublicUrl(fileName);
  const publicUrl = urlData.publicUrl;

  // Update hidden input and preview
  document.getElementById("f-cover").value = publicUrl;
  setCoverPreview(publicUrl);
  progress.style.display = "none";

  // Refresh previous covers list
  loadPreviousCovers();
}

function setCoverPreview(url, position) {
  const area        = document.getElementById("cover-upload-area");
  const placeholder = document.getElementById("cover-placeholder");
  const preview     = document.getElementById("cover-preview");
  const wrap        = document.getElementById("cover-preview-wrap");
  const slider      = document.getElementById("cover-pos-slider");
  const pos         = position !== undefined ? position : 50;

  if (url) {
    preview.src = url;
    preview.style.display = "block";
    preview.style.objectPosition = `center ${pos}%`;
    placeholder.style.display = "none";
    area.classList.add("has-image");
    wrap.classList.add("has-image");
    slider.value = pos;
    document.getElementById("f-cover-pos").value = pos;
  } else {
    preview.style.display = "none";
    placeholder.style.display = "flex";
    area.classList.remove("has-image");
    wrap.classList.remove("has-image");
    slider.value = 50;
    document.getElementById("f-cover-pos").value = 50;
  }
}

function updateCoverPosition(val) {
  const preview = document.getElementById("cover-preview");
  if (preview) preview.style.objectPosition = `center ${val}%`;
  document.getElementById("f-cover-pos").value = val;
}

async function loadPreviousCovers() {
  // Pull distinct non-null cover_urls from past events
  const { data } = await db.from("live_events")
    .select("cover_url")
    .not("cover_url", "is", null)
    .order("created_at", { ascending: false })
    .limit(20);

  const section = document.getElementById("prev-covers-section");
  const grid    = document.getElementById("prev-covers-grid");
  if (!data || data.length === 0) { section.style.display = "none"; return; }

  // Deduplicate
  const seen = new Set();
  const unique = data.filter(r => {
    if (seen.has(r.cover_url)) return false;
    seen.add(r.cover_url); return true;
  });

  if (unique.length === 0) { section.style.display = "none"; return; }

  section.style.display = "block";
  const current = document.getElementById("f-cover").value;
  grid.innerHTML = unique.map(r => `
    <div class="prev-cover-thumb ${r.cover_url === current ? "selected" : ""}"
         onclick="selectPreviousCover('${r.cover_url}', this)">
      <img src="${r.cover_url}" alt="" loading="lazy" />
    </div>
  `).join("");
}

function selectPreviousCover(url, el) {
  document.getElementById("f-cover").value = url;
  setCoverPreview(url);
  // Highlight selected
  document.querySelectorAll(".prev-cover-thumb").forEach(t => t.classList.remove("selected"));
  el.classList.add("selected");
}

function showView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));

// ── Events list ───────────────────────────────────────────────────────────────
async function loadEvents(tab) {
  const grid = document.getElementById("events-grid");
  grid.innerHTML = `<p style="color:var(--text-muted);font-size:.9rem">Loading…</p>`;

  let query = db.from("live_events").select("*").order("scheduled_at", { ascending: tab === "upcoming" });
  if (tab === "upcoming") {
    query = query.in("status", ["scheduled", "live"]);
  } else {
    query = query.eq("status", "ended");
  }

  const { data: events } = await query;
  if (!events || events.length === 0) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">${tab === "upcoming" ? "📅" : "🎬"}</div>
      <p>${tab === "upcoming" ? "No upcoming events scheduled yet." : "No past replays yet."}</p>
    </div>`;
    return;
  }

  grid.innerHTML = "";
  events.forEach(ev => {
    const card = document.createElement("div");
    card.className = "event-card";
    card.onclick = () => openEvent(ev);

    const coverSrc = ev.cover_url || "/live-practice-clinic-default.jpg";
    const coverPos = ev.cover_url ? (ev.cover_position ?? 50) : 100;
    const cover = `<img class="event-card-cover" src="${coverSrc}" alt="" loading="lazy" style="object-position:center ${coverPos}%">`;

    const statusBadge = ev.status === "live"
      ? `<span class="event-card-status status-live"><span class="live-dot"></span> Live Now</span>`
      : ev.status === "scheduled"
      ? `<span class="event-card-status status-scheduled">Upcoming</span>`
      : `<span class="event-card-status status-ended">Replay</span>`;

    const dateStr = formatEventDate(ev.scheduled_at, ev.timezone);

    card.innerHTML = `
      ${cover}
      <div class="event-card-body">
        ${statusBadge}
        <div class="event-card-title">${esc(ev.title)}</div>
        <div class="event-card-meta">${dateStr}</div>
        <div class="event-card-footer">
          <span class="evt-badge">⏱ ${ev.duration_mins} min</span>
          ${ev.status === "live" ? `<span class="evt-badge" style="color:#ff6b6b">● Streaming now</span>` : ""}
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

      ? `<button class="btn btn-ghost" onclick="removeRsvp('${ev.id}')">✓ Going · Remove</button>`
      : `<button class="btn btn-primary" onclick="addRsvp('${ev.id}')">📅 I'm Going</button>`
    : "";

  el.innerHTML = `
    ${cover}
    <div class="event-detail-hdr">
      <div>
        <div class="event-detail-title">${esc(ev.title)}</div>
        <div class="event-detail-meta">Hosted by Matthew Cawood · ${ev.duration_mins} min</div>
      </div>
      <span class="event-card-status ${ev.status === "live" ? "status-live" : ev.status === "scheduled" ? "status-scheduled" : "status-ended"}">
        ${ev.status === "live" ? '<span class="live-dot"></span> Live Now' : ev.status === "scheduled" ? "Upcoming" : "Ended"}
      </span>
    </div>

    <div class="event-info-row">
      <div class="event-info-item">
        <span class="event-info-label">Date &amp; Time</span>
        <div class="event-info-val">${dateStr}</div>
      </div>
      <div class="event-info-item">
        <span class="event-info-label">Duration</span>
        <span class="event-info-val">${ev.duration_mins} minutes</span>
      </div>
      <div class="event-info-item">
        <span class="event-info-label">Attendees</span>
        <span class="event-info-val">${rsvpCount || 0} going</span>
      </div>
    </div>

    ${ev.description ? `<div class="event-detail-desc">${esc(ev.description)}</div>` : ""}

    ${adminHtml}
    ${countdownHtml}

    <div class="event-actions">
      ${joinBtn}
      ${rsvpBtn}
    </div>

    ${muxHtml}
    ${recordingHtml}

    <div class="comments-section">
      <h3>💬 Discussion</h3>
      <div class="comment-input-row">
        <textarea id="comment-input" placeholder="Ask a question or leave a comment…"></textarea>
        <button class="btn btn-primary btn-sm" onclick="postComment('${ev.id}')">Post</button>
      </div>
      <div class="comment-list" id="comment-list">
        <p style="color:var(--text-muted);font-size:.88rem">Loading comments…</p>
      </div>
    </div>
  `;

  loadComments(ev.id);

  if (ev.status === "scheduled") {
    startCountdown(new Date(ev.scheduled_at));
  }

  // For ended events without a recording yet, watch for the webhook to populate it
  if (ev.status === "ended" && !ev.mux_playback_id) {
    const recordingWatcher = db.channel(`event-recording-${ev.id}`)
      .on("postgres_changes", {
        event: "UPDATE", schema: "public", table: "live_events",
        filter: `id=eq.${ev.id}`
      }, payload => {
        if (payload.new.mux_playback_id) {
          db.removeChannel(recordingWatcher);
          currentEvent = { ...currentEvent, ...payload.new };
          renderDetailView(currentEvent);
        }
      })
      .subscribe();
  }
}

// ── Countdown ─────────────────────────────────────────────────────────────────
function startCountdown(targetDate) {
  if (countdownInterval) clearInterval(countdownInterval);
  function tick() {
    const el = document.getElementById("countdown-digits");
    if (!el) { clearInterval(countdownInterval); return; }
    const diff = targetDate - Date.now();
    if (diff <= 0) { el.innerHTML = `<span style="color:var(--accent)">Starting now…</span>`; clearInterval(countdownInterval); return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const unit = (n, l) => `<div class="countdown-unit"><span class="countdown-num">${String(n).padStart(2,"0")}</span><span class="countdown-unit-label">${l}</span></div>`;
    el.innerHTML = (d > 0 ? unit(d,"days") : "") + unit(h,"hrs") + unit(m,"min") + unit(s,"sec");
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

// ── RSVP ──────────────────────────────────────────────────────────────────────
async function addRsvp(eventId) {
  await db.from("event_rsvps").insert({ event_id: eventId, email: myEmail });

// ── Comments ──────────────────────────────────────────────────────────────────
async function loadComments(eventId) {
  const { data } = await db.from("event_comments")
    .select("*").eq("event_id", eventId).order("created_at", { ascending: true });
  const el = document.getElementById("comment-list");
  if (!el) return;
  if (!data || data.length === 0) {
    el.innerHTML = `<p style="color:var(--text-muted);font-size:.88rem">No comments yet. Be the first!</p>`;
    return;
  }
  el.innerHTML = data.map(c => `
    <div class="comment-item">
      <div class="comment-header">
        <span class="comment-author">${esc(c.name || c.email.split("@")[0])}</span>
        <span class="comment-date">${timeAgo(c.created_at)}</span>
      </div>
      <div class="comment-body">${esc(c.content)}</div>
    </div>
  `).join("");
}

async function postComment(eventId) {
  const input = document.getElementById("comment-input");
  const content = input.value.trim();
  if (!content) return;
  input.value = "";
  await db.from("event_comments").insert({
    event_id: eventId, email: myEmail, name: myName, content
  });
  loadComments(eventId);
}

// ── Start / End stream (admin) ─────────────────────────────────────────────────
async function startStream(eventId) {
  const btn = event.target;
  btn.disabled = true;

  try {
    // Refresh event from DB first
    const { data: latestEv } = await db.from("live_events").select("*").eq("id", eventId).single();

    // If room already exists (e.g. after page refresh), just rejoin
    if (latestEv?.daily_room_name) {
      currentEvent = { ...currentEvent, ...latestEv };
      const ok = await joinStream(eventId);
      if (!ok) btn.disabled = false;
      return;
    }

    btn.textContent = "Creating room…";

    // Refresh auth token
    const { data: { session } } = await db.auth.getSession();
    if (session) authToken = session.access_token;

    const res = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
      body: JSON.stringify({ action: "create-room", eventId })
    });
    const room = await res.json();
    if (room.error) throw new Error(JSON.stringify(room.error));

    const { error } = await db.from("live_events").update({
      status: "live",
      daily_room_name: room.roomName,
      daily_room_url:  room.roomUrl
    }).eq("id", eventId);

    if (error) throw error;
    currentEvent = { ...currentEvent, status: "live", daily_room_name: room.roomName, daily_room_url: room.roomUrl };

    const ok = await joinStream(eventId);
    if (!ok) {
      btn.textContent = "▶ Go Live";
      btn.disabled = false;
    }
  } catch (e) {
    alert("Failed to start stream: " + e.message);
    btn.textContent = "▶ Go Live";
    btn.disabled = false;
  }
}

async function endStreamFromDetail(eventId) {
  if (!confirm("End the live stream?")) return;
  await db.from("live_events").update({ status: "ended" }).eq("id", eventId);
  currentEvent = { ...currentEvent, status: "ended" };
  renderDetailView(currentEvent);
}

// ── Join stream ───────────────────────────────────────────────────────────────
// Returns true on success, false on any failure (caller should restore UI).
async function joinStream(eventId) {
  // Refresh event to get latest room details
  const { data: ev } = await db.from("live_events").select("*").eq("id", eventId).single();
  if (!ev || ev.status !== "live") { alert("Stream is not live."); return false; }
  currentEvent = ev;

  if (!ev.daily_room_name) { alert("Room not ready yet — try again in a moment."); return false; }

  // Always refresh the auth token before calling the edge function
  const { data: { session }, error: sessErr } = await db.auth.getSession();
  if (sessErr || !session) { alert("Session expired — please sign in again."); window.location.href = "/practice-log.html"; return false; }
  authToken = session.access_token;

  // Get a Daily.co token
  const tokenRes = await fetch("/api/daily", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${authToken}` },
    body: JSON.stringify({ action: "get-token", roomName: ev.daily_room_name, isOwner: isAdmin })
  });
  const result = await tokenRes.json();
  if (result.error || !result.token) {
    alert("Could not get stream token: " + JSON.stringify(result.error || "no token returned"));
    return false;
  }

  // Set up Daily.co call frame via SDK
  try {
    if (window._callFrame) {
      try { await window._callFrame.destroy(); } catch(e) {}
      window._callFrame = null;
    }

    if (typeof DailyIframe === "undefined") throw new Error("Daily.co SDK not loaded");

    const container = document.getElementById("daily-container");
    container.innerHTML = "";

    window._callFrame = DailyIframe.createFrame(container, {
      showLeaveButton: true,
      showFullscreenButton: true,
      iframeStyle: {
        position: "absolute", top: 0, left: 0,
        width: "100%", height: "100%", border: "none"
      }
    });

    await window._callFrame.join({
      url:           ev.daily_room_url,
      token:         result.token,
      startVideoOff: !isAdmin,
      startAudioOff: !isAdmin,
      // Viewers: don't request camera/mic access from the browser at all
      ...(!isAdmin ? { videoSource: false, audioSource: false } : {})
    });

    // When the user clicks Daily's Leave button, show a Rejoin prompt in-place
    window._callFrame.on("left-meeting", () => {
      if (window._callFrame) {
        try { window._callFrame.destroy(); } catch(e) {}
        window._callFrame = null;
      }
      const c = document.getElementById("daily-container");
      if (c) c.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:12px;">
          <p style="color:var(--text-muted)">You left the stream.</p>
          <button class="btn btn-primary" onclick="joinStream('${ev.id}')">▶ Rejoin</button>
        </div>`;
    });
  } catch(e) {
    alert("Failed to start video: " + e.message);
    return false;
  }

  // Show stream view
  document.getElementById("stream-event-title").textContent = ev.title;
  if (isAdmin) document.getElementById("stream-admin-bar").classList.add("visible");
  showView("stream");
  setupRealtimeStream(ev);
  return true;
}

// ── Realtime chat & Q&A ───────────────────────────────────────────────────────
function setupRealtimeStream(ev) {
  // Clean up any existing channels before re-subscribing
  if (chatChannel) { db.removeChannel(chatChannel); chatChannel = null; }
  if (qaChannel)   { db.removeChannel(qaChannel);   qaChannel   = null; }

  // Load existing chat
  db.from("event_chat").select("*").eq("event_id", ev.id)
    .order("created_at").then(({ data }) => {
      if (data) data.forEach(appendChatMsg);
    });

  // Load existing Q&A and restore featured banner if one is active
  db.from("event_qa").select("*").eq("event_id", ev.id)
    .order("created_at").then(({ data }) => {
      if (!data) return;
      data.forEach(appendQAItem);
      const featured = data.find(q => q.is_featured);
      if (featured) {
        document.getElementById("featured-qa-text").textContent = featured.question;
        document.getElementById("featured-qa-asker").textContent = "— " + (featured.name || featured.email.split("@")[0]);
        document.getElementById("featured-qa-bar").classList.add("visible");
      }
    });

  // Subscribe to new chat messages
  chatChannel = db.channel(`event-chat-${ev.id}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_chat",
      filter: `event_id=eq.${ev.id}` }, p => appendChatMsg(p.new))
    .subscribe();

  // Subscribe to new Q&A / updates
  qaChannel = db.channel(`event-qa-${ev.id}`)
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_qa",
      filter: `event_id=eq.${ev.id}` }, p => appendQAItem(p.new))
    .on("postgres_changes", { event: "UPDATE", schema: "public", table: "event_qa",
      filter: `event_id=eq.${ev.id}` }, p => updateQAItem(p.new))
    .subscribe();
}

function appendChatMsg(msg) {
  const el = document.getElementById("chat-messages");
  if (!el) return;
  const mine = msg.email === myEmail;
  const div = document.createElement("div");
  div.className = "chat-msg" + (mine ? " mine" : "");
  div.dataset.id = msg.id;
  div.innerHTML = `
    <div class="chat-msg-author">${esc(msg.name || msg.email.split("@")[0])}</div>
    <div class="chat-msg-text">${esc(msg.message)}</div>
  `;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

async function sendChat() {
  const input = document.getElementById("chat-input");
  const message = input.value.trim();
  if (!message || !currentEvent) return;
  input.value = "";
  await db.from("event_chat").insert({
    event_id: currentEvent.id, email: myEmail, name: myName, message
  });
}

function appendQAItem(q) {
  const el = document.getElementById("qa-questions");
  if (!el) return;
  const existing = el.querySelector(`[data-id="${q.id}"]`);
  if (existing) { existing.replaceWith(buildQAEl(q)); return; }
  el.appendChild(buildQAEl(q));
  el.scrollTop = el.scrollHeight;
}

function updateQAItem(q) {
  const el = document.getElementById("qa-questions");
  if (!el) return;
  const existing = el.querySelector(`[data-id="${q.id}"]`);
  if (existing) existing.replaceWith(buildQAEl(q));

  // Update featured bar
  if (q.is_featured) {
    document.getElementById("featured-qa-text").textContent = q.question;
    document.getElementById("featured-qa-asker").textContent = "— " + (q.name || q.email.split("@")[0]);
    document.getElementById("featured-qa-bar").classList.add("visible");
  } else {
    document.getElementById("featured-qa-bar").classList.remove("visible");
  }
}

function buildQAEl(q) {
  const div = document.createElement("div");
  div.className = "qa-item" + (q.is_featured ? " featured" : "");
  div.dataset.id = q.id;
  let actions = "";
  if (isAdmin) {
    actions = `<div class="qa-item-actions">
      <button class="${q.is_featured ? "featured-btn" : ""}" onclick="featureQA('${q.id}', ${!q.is_featured})">
        ${q.is_featured ? "★ Featured" : "☆ Feature"}
      </button>
      <button class="${q.answered ? "featured-btn" : ""}" onclick="markAnswered('${q.id}', ${q.answered})">
        ${q.answered ? "↩ Unmark" : "✓ Answered"}
      </button>
    </div>`;
  }
  div.innerHTML = `
    <div class="qa-item-asker">${esc(q.name || q.email.split("@")[0])}</div>
    <div class="qa-item-text">${esc(q.question)}</div>
    ${q.answered ? `<div style="font-size:.72rem;color:var(--accent);margin-top:4px">✓ Answered</div>` : ""}
    ${actions}
  `;
  return div;
}

async function submitQA() {
  const input = document.getElementById("qa-input");
  const question = input.value.trim();
  if (!question || !currentEvent) return;
  input.value = "";
  await db.from("event_qa").insert({
    event_id: currentEvent.id, email: myEmail, name: myName, question
  });
}

async function featureQA(qaId, feature) {
  // Unfeature all others first
  if (feature) {
    await db.from("event_qa").update({ is_featured: false }).eq("event_id", currentEvent.id);
  }
  await db.from("event_qa").update({ is_featured: feature }).eq("id", qaId);
  if (!feature) {
    document.getElementById("featured-qa-bar").classList.remove("visible");
  }
}

async function markAnswered(qaId, currentState) {
  const nowAnswered = !currentState;
  await db.from("event_qa").update({ answered: nowAnswered, is_featured: false }).eq("id", qaId);
  if (nowAnswered) {
    document.getElementById("featured-qa-bar").classList.remove("visible");
  }
}

async function endStream() {
  if (!confirm("End the live stream for everyone?")) return;
  await db.from("live_events").update({ status: "ended" }).eq("id", currentEvent.id);
  currentEvent = { ...currentEvent, status: "ended" };
  showView("detail");
}

function toggleRecording() {

  document.getElementById("btn-recording").textContent =
    isRecording ? "⏹ Stop Recording" : "⏺ Start Recording";

// ── Create / Edit event modal ─────────────────────────────────────────────────
function openCreateModal() {
  editingEventId = null;
  document.getElementById("modal-title").textContent = "New Event";
  document.getElementById("f-title").value    = "";
  document.getElementById("f-desc").value     = "";
  document.getElementById("f-cover").value    = "";
  document.getElementById("f-duration").value = "60";
  document.getElementById("date-trigger-text").innerHTML = `<span class="dt-placeholder">Pick a date and time</span>`;
  setCoverPreview("/live-practice-clinic-default.jpg", 100);
  populateTzSelect();
  if (!datePicker) initDatePicker(); else datePicker.clear();
  loadPreviousCovers();
  document.getElementById("modal-create").style.display = "flex";
}

function openEditModal() {
  if (!currentEvent) return;
  editingEventId = currentEvent.id;
  document.getElementById("modal-title").textContent = "Edit Event";
  document.getElementById("f-title").value    = currentEvent.title || "";
  document.getElementById("f-desc").value     = currentEvent.description || "";
  document.getElementById("f-cover").value    = currentEvent.cover_url || "";
  document.getElementById("f-duration").value = currentEvent.duration_mins || 60;
  setCoverPreview(currentEvent.cover_url || null, currentEvent.cover_position ?? 50);
  loadPreviousCovers();
  populateTzSelect();
  // Set the saved timezone
  const tzSel = document.getElementById("f-timezone");
  if (currentEvent.timezone) tzSel.value = currentEvent.timezone;
  if (!datePicker) initDatePicker();
  if (currentEvent.scheduled_at) {
    datePicker.setDate(new Date(currentEvent.scheduled_at), true);
  } else {
    datePicker.clear();
    document.getElementById("date-trigger-text").innerHTML = `<span class="dt-placeholder">Pick a date and time</span>`;
  }
  document.getElementById("modal-create").style.display = "flex";
}

function closeCreateModal() {
  document.getElementById("modal-create").style.display = "none";
  _savingEvent = false;
}

let _savingEvent = false;
async function saveEvent() {
  if (_savingEvent) return;
  _savingEvent = true;
  const saveBtn = document.querySelector("#modal-create .btn-primary");
  if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = "Saving…"; }

  const title    = document.getElementById("f-title").value.trim();
  const desc     = document.getElementById("f-desc").value.trim();
  const cover    = document.getElementById("f-cover").value.trim();
  const coverPos = parseInt(document.getElementById("f-cover-pos").value) || 50;
  const dateVal  = document.getElementById("f-date").value;
  const duration = parseInt(document.getElementById("f-duration").value) || 60;

  if (!title || !dateVal) {
    alert("Title and date are required.");
    _savingEvent = false;
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "Save Event"; }
    return;
  }

  try {
    const timezone = document.getElementById("f-timezone").value || "Europe/London";
    const payload = {
      title,
      description:    desc || null,
      cover_url:      cover || null,
      cover_position: coverPos,
      scheduled_at:   new Date(dateVal).toISOString(),
      duration_mins:  duration,
      timezone,
      created_by:     myEmail
    };

    if (editingEventId) {
      await db.from("live_events").update(payload).eq("id", editingEventId);
      currentEvent = { ...currentEvent, ...payload };
    } else {
      const { data } = await db.from("live_events").insert(payload).select().single();
      currentEvent = data;
    }

    closeCreateModal();
    if (editingEventId) {
      renderDetailView(currentEvent);
    } else {
      showView("detail");
      renderDetailView(currentEvent);
    }
  } finally {
    _savingEvent = false;
    if (saveBtn) { saveBtn.disabled = false; saveBtn.textContent = "Save Event"; }
  }
}

// ── Add Mux playback ID ───────────────────────────────────────────────────────
async function saveMuxPlaybackId(eventId) {
  const pid = document.getElementById("mux-pid-input").value.trim();
  if (!pid) return;
  await db.from("live_events").update({ mux_playback_id: pid }).eq("id", eventId);
  currentEvent = { ...currentEvent, mux_playback_id: pid };
  renderDetailView(currentEvent);
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function formatEventDate(iso, timezone) {
  const d = new Date(iso);
  const tz = timezone || "UTC";
  const eventTzStr = d.toLocaleString("en-GB", {
    timeZone: tz,
    weekday: "short", day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit"
  });
  // Get the timezone abbreviation
  const tzAbbr = new Intl.DateTimeFormat("en", { timeZone: tz, timeZoneName: "short" })
    .formatToParts(d).find(p => p.type === "timeZoneName")?.value || "";
  return `${eventTzStr} ${tzAbbr}`;
}

function formatEventDateWithLocal(iso, timezone) {
  const d = new Date(iso);
  const tz = timezone || "UTC";
  const localTz = Intl.DateTimeFormat().resolvedOptions().timeZone;

  const primary = formatEventDate(iso, tz);

  // Only show local time if the viewer is in a different timezone
  if (localTz === tz) return `<div class="tz-display"><span class="tz-primary">${primary}</span></div>`;

  const localStr = d.toLocaleString("en-GB", {
    timeZone: localTz,
    hour: "2-digit", minute: "2-digit"
  });
  const localAbbr = new Intl.DateTimeFormat("en", { timeZone: localTz, timeZoneName: "short" })
    .formatToParts(d).find(p => p.type === "timeZoneName")?.value || "";

  return `<div class="tz-display">
    <span class="tz-primary">${primary}</span>
    <span class="tz-local"><span class="tz-local-label">Your time:</span> ${localStr} ${localAbbr}</span>
  </div>`;
}

function timeAgo(iso) {
  const diff = Date.now() - new Date(iso).getTime();
  if (diff < 60000)  return "just now";
  if (diff < 3600000) return Math.floor(diff/60000) + "m ago";
  if (diff < 86400000) return Math.floor(diff/3600000) + "h ago";
  return Math.floor(diff/86400000) + "d ago";
}
