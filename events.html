      p.style.cssText = "width:100%;border-radius:var(--radius);display:block;--media-background-color:transparent;--media-object-fit:contain;";
      attachPlayerListeners(p);
      wrap.appendChild(p);
    }
    function scheduleRetry() {
      clearTimeout(retryTimer);
      retryTimer = setTimeout(spawnPlayer, 10000);
    }
    let hasPlayed = false;

    function attachPlayerListeners(p) {
      p.addEventListener("playing", () => {
        clearTimeout(retryTimer);
        hasPlayed = true;
        showPlayer(p);
      });
      // Only show "starting" overlay before the stream has ever played.
      // After that, let mux-player handle errors natively (host pausing/leaving
      // shouldn't look like the stream hasn't started yet).
      p.addEventListener("error", () => {
        if (!hasPlayed) { showStarting(); scheduleRetry(); }
      });
      const stallTimer = setTimeout(() => {
        if (!hasPlayed && p.readyState === 0) { showStarting(); scheduleRetry(); }
      }, 12000);
      p.addEventListener("canplay", () => clearTimeout(stallTimer));
    }

    if (player) attachPlayerListeners(player);
  }

  // For ended events without a recording yet, watch for the webhook to populate it
  // Always clean up any existing watcher/poller first to avoid duplicates
  if (_recordingWatcher) {
    db.removeChannel(_recordingWatcher);
    _recordingWatcher = null;
  }
  if (_recordingPoller) {
    clearInterval(_recordingPoller);
    _recordingPoller = null;
  }
  if (ev.status === "ended" && !ev.mux_playback_id) {
    // Realtime watcher — fires instantly when webhook updates the row
    _recordingWatcher = db.channel(`event-recording-${ev.id}`)
      .on("postgres_changes", {
        event: "UPDATE", schema: "public", table: "live_events",
        filter: `id=eq.${ev.id}`
      }, payload => {
        if (payload.new.mux_playback_id) {
          db.removeChannel(_recordingWatcher);
          _recordingWatcher = null;
          if (_recordingPoller) { clearInterval(_recordingPoller); _recordingPoller = null; }
          currentEvent = { ...currentEvent, ...payload.new };
          renderDetailView(currentEvent);
        }
      })
      .subscribe();

    // Polling fallback — every 15 s checks the DB; every 2 min (if admin) also
    // tries to pull the recording from Daily.co directly so we never rely solely
    // on the Daily.co → Netlify webhook which can fail silently.
    const pollEventId  = ev.id;
    const pollRoomName = ev.daily_room_name || null;
    let pollAttempts = 0;
    _recordingPoller = setInterval(async () => {
      pollAttempts++;
      if (pollAttempts > 80) { clearInterval(_recordingPoller); _recordingPoller = null; return; } // 20 min max

      // ① Check DB first — catches webhook if it fired
      const { data } = await db.from("live_events")
        .select("mux_playback_id, mux_asset_id")
        .eq("id", pollEventId)
        .single();
      if (data?.mux_playback_id) {
        clearInterval(_recordingPoller);
        _recordingPoller = null;
        if (_recordingWatcher) { db.removeChannel(_recordingWatcher); _recordingWatcher = null; }
        currentEvent = { ...currentEvent, mux_playback_id: data.mux_playback_id, mux_asset_id: data.mux_asset_id };
        renderDetailView(currentEvent);
        return;
      }

      // ② Every 4 attempts (~1 min), admin-only: ask Mux if the VOD is ready.
      //    Mux auto-creates a VOD via new_asset_settings when the live stream
      //    is completed. We check recent_asset_ids on the live stream.
      if (isAdmin && pollAttempts % 4 === 0) {
        try {
          const { data: { session } } = await db.auth.getSession();
          const token = session?.access_token || authToken;
          const res = await fetch("/api/daily", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
            body: JSON.stringify({ action: "fetch-recording", eventId: pollEventId })
          });
          const result = await res.json();
          if (result.muxPlaybackId) {
            clearInterval(_recordingPoller);
            _recordingPoller = null;
            if (_recordingWatcher) { db.removeChannel(_recordingWatcher); _recordingWatcher = null; }
            currentEvent = { ...currentEvent, mux_asset_id: result.muxAssetId, mux_playback_id: result.muxPlaybackId };
            renderDetailView(currentEvent);
          }
        } catch(e) { /* silent — will retry next cycle */ }
      }
    }, 15000);
  }
}

// ── Countdown ─────────────────────────────────────────────────────────────────
function startCountdown(targetDate) {
  if (countdownInterval) clearInterval(countdownInterval);
  function tick() {
    const el = document.getElementById("countdown-digits");
    if (!el) { clearInterval(countdownInterval); return; }
    const diff = targetDate - Date.now();
    if (diff <= 0) { el.innerHTML = `<span style="color:var(--accent)">Starting now…</span>`; clearInterval(countdownInterval); return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    const unit = (n, l) => `<div class="countdown-unit"><span class="countdown-num">${String(n).padStart(2,"0")}</span><span class="countdown-unit-label">${l}</span></div>`;
    el.innerHTML = (d > 0 ? unit(d,"days") : "") + unit(h,"hrs") + unit(m,"min") + unit(s,"sec");
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

// ── RSVP ──────────────────────────────────────────────────────────────────────
async function addRsvp(eventId) {
  const { error } = await db.from("event_rsvps").insert({
    event_id: eventId,
    email: myEmail,
    name: myName
  });
  if (error) {
    console.error("RSVP insert error:", error);
    alert("Could not save your RSVP: " + (error.message || JSON.stringify(error)));
    return;
  }
  // Notify the event owner (unless they're RSVPing themselves)
  if (myEmail.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
    const evTitle = currentEvent?.title || "an event";
    await db.from("notifications").insert({
      email:    OWNER_EMAIL,
      type:     "event_rsvp",
      title:    `${myName || "Someone"} is attending ${evTitle}`,
      body:     `${myName || myEmail} just RSVPed for "${evTitle}"`,
      link_url: `/events.html`,
      metadata: { event_id: eventId },
    });
  }
  renderDetailView(currentEvent);
}
async function removeRsvp(eventId) {
  const { error } = await db.from("event_rsvps").delete()
    .eq("event_id", eventId).eq("email", myEmail);
  if (error) {
    console.error("Remove RSVP error:", error);
    alert("Could not remove your RSVP: " + (error.message || JSON.stringify(error)));
    return;
  }
  renderDetailView(currentEvent);
}

// ── Comments ──────────────────────────────────────────────────────────────────
let _currentEventId = null;

async function loadComments(eventId) {
  _currentEventId = eventId;
  const listEl = document.getElementById("comments-list");
  const hdrEl  = document.getElementById("comments-hdr");
  if (listEl) listEl.innerHTML = '<div class="comments-empty">Loading…</div>';

  const { data: comments, error } = await db.from("event_comments")
    .select("*")
    .eq("event_id", eventId)
    .order("created_at", { ascending: true });

  if (error || !comments) {
    if (listEl) listEl.innerHTML = '<div class="comments-empty">Could not load comments.</div>';
    return;
  }

  const count = comments.length;
  if (hdrEl) hdrEl.textContent = count === 0 ? "Discussion" : `Discussion (${count})`;
  if (!count) {
    if (listEl) listEl.innerHTML = '<div class="comments-empty">No comments yet — be the first!</div>';
    return;
  }

  // Fetch avatar URLs for comment authors
  const commentEmails = [...new Set(comments.map(c => c.email))];
  const { data: avatarRows } = await db.from("allowed_emails")
    .select("email,avatar_url").in("email", commentEmails);
  const avatarMap = {};
  (avatarRows || []).forEach(r => { if (r.avatar_url) avatarMap[r.email] = r.avatar_url; });

  // Fetch polls attached to comments
  const commentIds = comments.map(c => c.id);
  const pollByComment = {};
  const { data: pollRows } = await db.from("event_comment_polls")
    .select("id,question,options,comment_id,event_comment_poll_votes(email,option_index)")
    .in("comment_id", commentIds);
  if (pollRows && pollRows.length) {
    pollRows.forEach(p => { pollByComment[p.comment_id] = p; });
  }

  // Build threaded structure
  const topLevel = comments.filter(c => !c.parent_id);
  const repliesMap = {};
  comments.filter(c => c.parent_id).forEach(c => {
    if (!repliesMap[c.parent_id]) repliesMap[c.parent_id] = [];
    repliesMap[c.parent_id].push(c);
  });

  function commentItemHTML(c, isReply = false) {
    const canDel  = isAdmin || c.email === myEmail;
    const dispName = esc(c.name || c.email.split("@")[0]);
    const replyPrefix = (isReply && c.reply_to_name)
      ? `<span class="reply-to-name">@${esc(c.reply_to_name)}</span> ` : "";
    const poll = pollByComment[c.id] || null;
    return `
      <div class="comment-item${isReply ? " is-reply" : ""}" id="comment-${c.id}">
        ${avatarHtml(c.name, c.email, 28, avatarMap[c.email] || null)}
        <div class="comment-body">
          <div class="comment-meta">
            <span class="comment-name">${dispName}</span>
            <span class="comment-time">${timeAgo(c.created_at)}</span>
            ${canDel ? `<button class="delete-btn" onclick="deleteComment('${c.id}','${eventId}')" title="Delete">Delete</button>` : ""}
          </div>
          ${c.content ? `<div class="comment-text">${replyPrefix}${esc(c.content)}</div>` : (replyPrefix ? `<div class="comment-text">${replyPrefix}</div>` : "")}
          ${_renderAttHtml(c)}
          ${poll ? _renderPollHtml(poll, c.id, c.email) : ""}
          ${!isReply ? `<button class="comment-reply-btn" onclick="startEvReply('${c.id}','${dispName.replace(/'/g,"\\'")}')">Reply</button>` : ""}
        </div>
      </div>`;
  }

  if (listEl) listEl.innerHTML = topLevel.map(c => {
    const replies = repliesMap[c.id] || [];
    const replyComposer = `
      <div id="ev-reply-composer-${c.id}" class="comment-item is-reply" style="display:none">
        ${avatarHtml(myName, myEmail, 28)}
        <div class="comment-body" style="flex:1;min-width:0">
          <textarea class="comment-input" placeholder="Write a reply…" rows="1"
            oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();evSubmitReply('${c.id}',this)}"
            style="width:100%;box-sizing:border-box;margin-bottom:4px;border-color:var(--accent)"
          ></textarea>
          ${_evToolbarHtml(c.id)}
          <div style="display:flex;justify-content:flex-end;gap:14px;margin-top:8px">
            <button onclick="cancelEvReply('${c.id}')" style="background:none;border:none;font-family:inherit;font-size:0.8rem;cursor:pointer;color:var(--text-muted);padding:0">Cancel</button>
            <button id="ev-reply-send-btn-${c.id}" onclick="evSubmitReply('${c.id}',document.querySelector('#ev-reply-composer-${c.id} textarea'))" style="background:none;border:none;font-family:inherit;font-size:0.8rem;font-weight:700;cursor:pointer;color:var(--accent);padding:0">Send</button>
          </div>
        </div>
      </div>`;
    return commentItemHTML(c) +
      `<div class="comment-replies">${replies.map(r => commentItemHTML(r, true)).join("")}${replyComposer}</div>`;
  }).join("");
}

function startEvReply(commentId, authorName) {
  document.querySelectorAll("[id^='ev-reply-composer-']").forEach(el => {
    if (el.style.display !== "none") {
      el.style.display = "none";
      const existingId = el.id.replace("ev-reply-composer-", "");
      _evClearState(existingId);
    }
  });
  const composer = document.getElementById(`ev-reply-composer-${commentId}`);
  if (!composer) return;
  composer.style.display = "flex";
  composer.dataset.replyToName = authorName;
  const ta = composer.querySelector("textarea");
  if (ta) { ta.value = ""; ta.focus(); }
}

function cancelEvReply(commentId) {
  const composer = document.getElementById(`ev-reply-composer-${commentId}`);
  if (composer) { composer.style.display = "none"; }
  _evClearState(commentId);
}

async function evSubmitReply(parentCommentId, textarea) {
  let content = textarea ? textarea.value.trim() : "";
  const replyMedia = _evMedia[parentCommentId] || [];
  const poll = _evPollOpen[parentCommentId] ? _evReadPoll(parentCommentId) : null;
  if (!content && !replyMedia.length && !poll) return;

  const composer = document.getElementById(`ev-reply-composer-${parentCommentId}`);
  const replyToName = composer?.dataset.replyToName || null;

  if (textarea) textarea.disabled = true;
  let mediaJson = [];
  try { mediaJson = await _evUploadMedia(parentCommentId); }
  catch(e) { if (textarea) textarea.disabled = false; alert("Upload failed: " + e.message); return; }

  const { data: row, error } = await db.from("event_comments").insert({
    event_id: _currentEventId, email: myEmail, name: myName,
    content: content || "", parent_id: parentCommentId,
    reply_to_name: replyToName,
    media: mediaJson.length ? mediaJson : null,
  }).select().single();

  if (poll && row) {
    await db.from("event_comment_polls").insert({
      comment_id: row.id, question: poll.question, options: poll.options
    });
  }

  if (textarea) textarea.disabled = false;
  if (error) { alert("Couldn't post reply: " + error.message); return; }

  // Notify the original commenter (unless replying to yourself)
  const { data: parent } = await db.from("event_comments").select("email,name").eq("id", parentCommentId).single();
  if (parent?.email && parent.email !== myEmail) {
    const evTitle = currentEvent?.title || "an event";
    await db.from("notifications").insert({
      email:    parent.email,
      type:     "comment_reply",
      title:    `${myName || "Someone"} replied to your comment`,
      body:     (content || "Sent an attachment").slice(0, 120),
      link_url: `/events.html`,
      metadata: { event_id: _currentEventId },
    });
  }

  _evClearState(parentCommentId);
  await loadComments(_currentEventId);
}

  el.style.height = "auto";

function _renderEvMediaPreview(key) {
  const area = document.getElementById(`ev-media-preview-${key}`);
  if (!area) return;
  const media = _evMedia[key] || [];
  if (!media.length) { area.innerHTML = ""; return; }
  const images = media.filter(m => m.type === "image");
  const others = media.filter(m => m.type !== "image");
  let html = "";
  if (images.length) {
    const cols = Math.min(images.length, 2);
    html += `<div class="ev-media-images" style="grid-template-columns:repeat(${cols},1fr)">` +
      images.map((m, i) => {
        const idx = media.indexOf(m);
        return `<div class="ev-media-thumb-wrap">
          <img src="${esc(m.url)}" alt="${esc(m.name)}" style="${cols > 1 ? "height:180px;object-fit:cover" : ""}" />
          <button class="ev-media-thumb-remove" onclick="evRemoveMedia('${key}',${idx})">×</button>
        </div>`;
      }).join("") + `</div>`;
  }
  const evRmBtn = (key, idx) => `<button onclick="evRemoveMedia('${key}',${idx})" style="position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;transition:background .15s" onmouseover="this.style.background='#ef4444'" onmouseout="this.style.background='rgba(0,0,0,.55)'">×</button>`;
  others.forEach(m => {
    const idx = media.indexOf(m);
    const rm  = `evRemoveMedia('${key}',${idx})`;
    if (m.type === "mux") {
      if (m._uploading) {
        html += `<div style="position:relative;margin-top:6px">
          <div class="mux-upload-overlay" style="margin-bottom:0">
            <div class="mux-upload-overlay-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
            <div class="mux-upload-overlay-body">
              <div class="mux-upload-overlay-filename">${esc(m.name)}</div>
              <div class="mux-upload-overlay-track"><div class="mux-upload-overlay-bar processing" id="inline-mux-upload-bar"></div></div>
              <div class="mux-upload-overlay-status processing" id="inline-mux-upload-status">Uploading…</div>
            </div>
          </div>
          ${evRmBtn(key, idx)}
        </div>`;
      } else {
        html += `<div style="position:relative;margin-top:6px">
          <div style="position:relative;width:100%;height:min(180px,24vh);overflow:hidden;border-radius:8px;background:transparent">
            <mux-player playback-id="${esc(m.playbackId)}" controls style="position:absolute;top:0;left:0;width:100%;height:100%"></mux-player>
          </div>
          ${evRmBtn(key, idx)}
        </div>`;
      }
    } else if (m.type === "youtube") {
      html += `<div style="position:relative;margin-top:6px;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden">
        <iframe src="https://www.youtube.com/embed/${esc(m.ytId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe>
        ${evRmBtn(key, idx)}
      </div>`;
    } else if (m.type === "vimeo") {
      html += `<div style="position:relative;margin-top:6px;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden">
        <iframe src="https://player.vimeo.com/video/${esc(m.vimeoId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe>
        ${evRmBtn(key, idx)}
      </div>`;
    } else if (m.type === "audio") {
      const dur = m.duration ? ` · ${m.duration}s` : "";
      html += `<div style="margin-top:6px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:.78rem;color:var(--text-muted)">🎙️ Voice message${dur}</span>
          <button onclick="${rm}" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.85rem;padding:0 2px" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--text-muted)'">×</button>
        </div>
        <audio src="${esc(m.url)}" controls style="width:100%;display:block;border-radius:8px"></audio>
      </div>`;
    } else {
      html += `<span class="ev-media-chip"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg> ${esc(m.name)}<button class="ev-media-chip-remove" onclick="${rm}">×</button></span>`;
    }
  });
  area.innerHTML = html;

  // Disable the relevant send button while a Mux video is still uploading/processing
  {
    const isUploading = (media || []).some(m => m._uploading);
    let sendBtnId;
    if (key === "main") sendBtnId = "ev-comment-send-btn";
    else                sendBtnId = `ev-reply-send-btn-${key}`;
    const sendBtn = document.getElementById(sendBtnId);
    if (sendBtn) {
      sendBtn.disabled = isUploading;
      sendBtn.title = isUploading ? "Please wait — video is processing…" : "";
    }
  }
}

async function _deleteMuxAsset(assetId) {
  if (!assetId) return;
  try {
    const token = (await db.auth.getSession()).data.session?.access_token;
    await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ action: "delete-mux-asset", assetId })
    });
  } catch (e) { console.warn("Mux asset delete failed:", e); }
}

function evRemoveMedia(key, idx) {
  if (_evMedia[key]) {
    const m = _evMedia[key][idx];
    if (m?.type === "mux" && m.assetId) _deleteMuxAsset(m.assetId);
    _evMedia[key].splice(idx, 1);
  }
  _renderEvMediaPreview(key);
}

async function evHandleImage(input, key) {
  _evKey(key);
  const files = Array.from(input.files || []);
  input.value = "";
  for (const file of files) {
    if (!file.type.startsWith("image/")) {
      alert(`"${file.name}" is not an image. Use the file attachment button to send other file types.`);
      continue;
    }
    const compressed = await compressImage(file);
    _evMedia[key].push({ type: "image", url: URL.createObjectURL(compressed), name: compressed.name, blob: compressed });
    _renderEvMediaPreview(key);
  }
}

function evHandleFile(input, key) {
  _evKey(key);
  const file = input.files[0];
  if (!file) return;
  _evMedia[key].push({ type: "file", name: file.name, blob: file });
  input.value = "";
  _renderEvMediaPreview(key);
}

// ── Mutual exclusion: close every ev media panel except the one being opened ──
function _closeEvExcept(key, except) {
  if (except !== "video") {
    const vp = document.getElementById(`ev-vid-panel-${key}`);
    if (vp && vp.style.display !== "none") {
      vp.style.display = "none";
      document.getElementById(`ev-vid-btn-${key}`)?.classList.remove("ev-toolbar-btn--active");
    }
  }
  if (except !== "poll") {
    const pp = document.getElementById(`ev-poll-${key}`);
    if (pp && pp.style.display !== "none") {
      pp.style.display = "none";
      _evPollOpen[key] = false;
      document.getElementById(`ev-poll-btn-${key}`)?.classList.remove("recording");
    }
  }
  if (except !== "cam") {
    if (_evCamPreviewKey === key) evCancelCamPreview(key);
    if (_evCamKey === key && _evCamRec && _evCamRec.state !== "inactive") _evCamRec.stop();
  }
  if (except !== "voice") {
    if (_evVoiceRec[key] && _evVoiceRec[key].state !== "inactive") _evVoiceRec[key].stop();
  }
}

async function evToggleVoice(key) {
  if (_evVoiceRec[key]) {
    if (_evVoiceRec[key].state !== "inactive") _evVoiceRec[key].stop();
    return;
  }
  _closeEvExcept(key, "voice");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    const mr = new MediaRecorder(stream);
    _evVoiceRec[key] = mr;
    mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(_evRecTimer[key]);
      _evRecTimer[key] = null;
      _evVoiceRec[key] = null;
      const recInd = document.getElementById(`ev-recording-${key}`);
      if (recInd) recInd.style.display = "none";
      const btn = document.getElementById(`ev-voice-btn-${key}`);
      if (btn) btn.classList.remove("recording");
      const mime = mr.mimeType || "audio/webm";
      const blob = new Blob(chunks, { type: mime });
      const duration = _evRecStart[key] ? Math.round((Date.now() - _evRecStart[key]) / 1000) : 0;
      const name = `voice-${Date.now()}.webm`;
      _evKey(key);
      _evMedia[key].push({ type: "audio", url: URL.createObjectURL(blob), name, blob, duration });
      _renderEvMediaPreview(key);
    };
    mr.start();
    _evRecStart[key] = Date.now();
    const btn = document.getElementById(`ev-voice-btn-${key}`);
    if (btn) btn.classList.add("recording");
    const recInd = document.getElementById(`ev-recording-${key}`);
    const timeEl = document.getElementById(`ev-rec-time-${key}`);
    if (recInd) recInd.style.display = "";
    _evRecTimer[key] = setInterval(() => {
      const secs = Math.round((Date.now() - _evRecStart[key]) / 1000);
      const m = Math.floor(secs / 60), s = secs % 60;
      if (timeEl) timeEl.textContent = `${m}:${String(s).padStart(2, "0")}`;
    }, 1000);
  } catch (e) {
    alert("Microphone access denied: " + e.message);
  }
}

function evStopVoice(key) {
  if (_evVoiceRec[key] && _evVoiceRec[key].state !== "inactive") _evVoiceRec[key].stop();
}

function evHandleVideo(input, key) {

function evAddVideoUrl(key) {
  const input = document.getElementById(`ev-vurl-${key}`);
  const val   = input?.value.trim();
  if (!val) return;
  _evKey(key);
  const ytMatch = val.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([^&\s]+)/);
  const viMatch = val.match(/vimeo\.com\/(\d+)/);
  if (ytMatch)      _evMedia[key].push({ type: "youtube",   ytId: ytMatch[1],    url: val, name: "YouTube video" });
  else if (viMatch) _evMedia[key].push({ type: "vimeo",     vimeoId: viMatch[1], url: val, name: "Vimeo video" });
  else              _evMedia[key].push({ type: "video-url", url: val, name: "Video" });
  if (input) input.value = "";
  evToggleVideoPanel(key);
  _renderEvMediaPreview(key);
}

async function evToggleCamRec(key) {
  // If preview is open for this key, cancel it
  if (_evCamPreviewKey === key) { evCancelCamPreview(key); return; }
  // If actively recording for this key, stop
  if (_evCamKey === key && _evCamRec && _evCamRec.state !== "inactive") {
    evStopCamRecording(key); return;
  }
  // Block concurrent recordings/previews
  if (_evCamRec && _evCamRec.state !== "inactive") {
    alert("Stop the current camera recording first."); return;
  }
  if (_evCamPreviewStream) { evCancelCamPreview(_evCamPreviewKey); }
  _closeEvExcept(key, "cam");

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { aspectRatio: 16/9 } });
    _evCamPreviewStream = stream;
    _evCamPreviewKey    = key;

    const preview = document.getElementById(`ev-cam-preview-${key}`);
    const panel   = document.getElementById(`ev-cam-panel-${key}`);
    const btn     = document.getElementById(`ev-camrec-btn-${key}`);
    if (preview) preview.srcObject = stream;
    if (panel)   panel.style.display = "";
    if (btn)     btn.classList.add("ev-toolbar-btn--active");

    // Enumerate devices now that we have permission
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === "videoinput");
    const mics    = devices.filter(d => d.kind === "audioinput");
    const activeVideoLabel = stream.getVideoTracks()[0]?.label || "";
    const activeAudioLabel = stream.getAudioTracks()[0]?.label || "";

    const camSel = document.getElementById(`ev-cam-sel-${key}`);
    const micSel = document.getElementById(`ev-mic-sel-${key}`);
    if (camSel) camSel.innerHTML = cameras.map(d =>
      `<option value="${d.deviceId}" ${d.label === activeVideoLabel ? "selected" : ""}>${d.label || "Camera " + (cameras.indexOf(d)+1)}</option>`
    ).join("");
    if (micSel) micSel.innerHTML = mics.map(d =>
      `<option value="${d.deviceId}" ${d.label === activeAudioLabel ? "selected" : ""}>${d.label || "Mic " + (mics.indexOf(d)+1)}</option>`
    ).join("");
  } catch (e) {
    alert("Could not access camera/mic: " + e.message);
  }
}

async function evSwitchCamDevice(key) {
  if (!_evCamPreviewStream || _evCamPreviewKey !== key) return;
  const camSel = document.getElementById(`ev-cam-sel-${key}`);
  const micSel = document.getElementById(`ev-mic-sel-${key}`);
  _evCamPreviewStream.getTracks().forEach(t => t.stop());
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: camSel?.value ? { deviceId: { exact: camSel.value } } : true,
      audio: micSel?.value ? { deviceId: { exact: micSel.value } } : true,
    });
    _evCamPreviewStream = stream;
    const preview = document.getElementById(`ev-cam-preview-${key}`);
    if (preview) preview.srcObject = stream;
  } catch (e) { alert("Could not switch device: " + e.message); }
}

function evStartCamRecording(key) {
  if (!_evCamPreviewStream) return;
  // Hide device/action UI, show recording bar
  const devs    = document.getElementById(`ev-cam-devices-${key}`);
  const actions = document.getElementById(`ev-cam-actions-${key}`);
  const recBar  = document.getElementById(`ev-cam-recbar-${key}`);
  if (devs)    devs.style.display    = "none";
  if (actions) actions.style.display = "none";
  if (recBar)  recBar.style.display  = "";

  const stream = _evCamPreviewStream;
  _evCamPreviewStream = null; // ownership moves to recorder
  _evCamStream = stream;
  _evCamKey    = key;

  const chunks = [];
  const mr     = new MediaRecorder(stream);
  _evCamRec    = mr;
  mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const mime = mr.mimeType || "video/webm";
    const blob = new Blob(chunks, { type: mime });
    const name = `video-${Date.now()}.webm`;
    const file = new File([blob], name, { type: mime });
    const ck   = _evCamKey;
    // Reset panel
    const panel   = document.getElementById(`ev-cam-panel-${ck}`);
    const preview = document.getElementById(`ev-cam-preview-${ck}`);
    const devEl   = document.getElementById(`ev-cam-devices-${ck}`);
    const actEl   = document.getElementById(`ev-cam-actions-${ck}`);
    const barEl   = document.getElementById(`ev-cam-recbar-${ck}`);
    const btnEl   = document.getElementById(`ev-camrec-btn-${ck}`);
    if (preview) preview.srcObject = null;
    if (panel)   panel.style.display   = "none";
    if (devEl)   devEl.style.display   = "";
    if (actEl)   actEl.style.display   = "";
    if (barEl)   barEl.style.display   = "none";
    if (btnEl)   btnEl.classList.remove("ev-toolbar-btn--active");
    clearInterval(_evRecTimer[ck]);
    _evCamRec = null; _evCamStream = null; _evCamKey = null; _evCamPreviewKey = null;
    // Queue Mux upload
    _evKey(ck);
    const pendingIdx = _evMedia[ck].length;
    _evMedia[ck].push({ type: "mux", name, _uploading: true, _localUrl: URL.createObjectURL(blob) });
    _renderEvMediaPreview(ck);
    _evUploadToMux(file, item => {
      _evMedia[ck][pendingIdx] = item;
      _renderEvMediaPreview(ck);
    });
  };
  mr.start();

  // Start timer
  _evRecStart[key] = Date.now();
  _evRecTimer[key] = setInterval(() => {
    const secs = Math.round((Date.now() - _evRecStart[key]) / 1000);
    const m = Math.floor(secs / 60), s = secs % 60;
    const el = document.getElementById(`ev-cam-timer-${key}`);
    if (el) el.textContent = `${m}:${String(s).padStart(2,"0")}`;
  }, 1000);
}

function evStopCamRecording(key) {
  if (_evCamRec && _evCamKey === key && _evCamRec.state !== "inactive") {
    _evCamRec.stop();
  }
}

function evCancelCamPreview(key) {
  if (_evCamPreviewStream) {
    _evCamPreviewStream.getTracks().forEach(t => t.stop());
    _evCamPreviewStream = null;
  }
  _evCamPreviewKey = null;
  const preview = document.getElementById(`ev-cam-preview-${key}`);
  const panel   = document.getElementById(`ev-cam-panel-${key}`);
  const btn     = document.getElementById(`ev-camrec-btn-${key}`);
  if (preview) preview.srcObject = null;
  if (panel)   panel.style.display = "none";
  if (btn)     btn.classList.remove("ev-toolbar-btn--active");
}

// ── Mux upload for events discussion ──────────────────────────────────────────
function _setGlobalMuxOverlay({ show, filename, pct, status, processing }) {
  if (show === false) return;
  const iBar = document.getElementById("inline-mux-upload-bar");
  const iSt  = document.getElementById("inline-mux-upload-status");
  if (iBar) {
    if (pct !== undefined) iBar.style.width = pct + "%";
    if (processing !== undefined) iBar.className = "mux-upload-overlay-bar" + (processing ? " processing" : "");
  }
  if (iSt && status !== undefined) iSt.textContent = status;
}

async function _evUploadToMux(file, onDone) {
  try {
    _setGlobalMuxOverlay({ show: true, filename: file.name, pct: 0, status: "Getting upload URL…" });
    const token = (await db.auth.getSession()).data.session?.access_token;
    const createRes = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ action: "create-mux-upload" })
    });
    const createData = await createRes.json();
    if (createData.error) throw new Error(JSON.stringify(createData.error));
    const { uploadId, uploadUrl } = createData;

    _setGlobalMuxOverlay({ pct: 0, status: "Uploading… 0%" });
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", uploadUrl);
      xhr.upload.onprogress = e => {
        if (!e.lengthComputable) return;
        const pct = Math.round((e.loaded / e.total) * 100);
        const barEl = document.getElementById("mux-global-bar");
        if (barEl) barEl.style.width = pct + "%";
        _setGlobalMuxOverlay({ pct, status: `Uploading… ${pct}%` });
      };
      xhr.onload = () => xhr.status < 300 ? resolve() : reject(new Error("Upload failed (" + xhr.status + ")"));
      xhr.onerror = () => reject(new Error("Network error during upload"));
      xhr.send(file);
    });

    _setGlobalMuxOverlay({ pct: 100, status: "Processing…", processing: true });
    let playbackId = null, muxAssetId = null;
    for (let i = 0; i < 72; i++) {
      await new Promise(r => setTimeout(r, 5000));
      const s = await (await fetch("/api/daily", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ action: "get-mux-upload-status", uploadId })
      })).json();
      if (s.playbackId && s.assetStatus === "ready") { playbackId = s.playbackId; muxAssetId = s.assetId; break; }
      if (s.status === "errored" || s.assetStatus === "errored") throw new Error("Mux reported an error");
      const msg = s.assetStatus === "preparing" ? "Preparing…" : s.status === "waiting" ? "Queued…" : null;
      if (msg) _setGlobalMuxOverlay({ status: msg });
    }
    if (!playbackId) throw new Error("Video processing timed out — try again");

    _setGlobalMuxOverlay({ pct: 100, status: "✓ Video ready!", filename: file.name });
    await new Promise(r => setTimeout(r, 1200));
    _setGlobalMuxOverlay({ show: false });
    onDone({ type: "mux", playbackId, assetId: muxAssetId, name: file.name });
  } catch (e) {
    console.error("[Mux] Event upload error:", e);
    _setGlobalMuxOverlay({ show: true, filename: "❌ Upload failed", status: e.message, processing: false });
    const barEl = document.getElementById("mux-global-bar");
    if (barEl) barEl.style.background = "#ef4444";
    const statusEl = document.getElementById("mux-global-status");
    if (statusEl) statusEl.innerHTML =
      escHtml(e.message) +
      `<br><button onclick="_setGlobalMuxOverlay({show:false})"
        style="margin-top:8px;background:rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.12);
        border-radius:6px;color:#fff;cursor:pointer;font-size:.75rem;padding:4px 10px">Dismiss</button>`;
  }
}

  // Cancel any open camera preview
  if (_evCamPreviewKey === key) evCancelCamPreview(key);
}

// Upload blobs to comment-attachments bucket
async function _evUploadMedia(key) {
  const media = _evMedia[key] || [];
  if (media.some(m => m._uploading)) throw new Error("A video is still uploading — please wait.");
  const result = [];
  for (const m of media) {
    if (m.type === "mux") {
      result.push({ type: "mux", playbackId: m.playbackId, assetId: m.assetId, name: m.name });
    } else if (m.type === "youtube") {
      result.push({ type: "youtube", ytId: m.ytId, url: m.url, name: m.name });
    } else if (m.type === "vimeo") {
      result.push({ type: "vimeo", vimeoId: m.vimeoId, url: m.url, name: m.name });
    } else if (m.blob) {
      const safe = `${(myEmail || "anon").replace(/[^a-z0-9]/gi, "_")}/${Date.now()}-${m.name.replace(/[^a-z0-9._-]/gi, "_")}`;
      const { error } = await db.storage.from("comment-attachments").upload(safe, m.blob);
      if (error) throw new Error(error.message);
      const { data: { publicUrl } } = db.storage.from("comment-attachments").getPublicUrl(safe);
      result.push({ type: m.type, url: publicUrl, name: m.name, size: m.blob.size, duration: m.duration });
    } else {
      result.push({ type: m.type, url: m.url, name: m.name });
    }
  }
  return result;
}

// ── Client-side image compression ────────────────────────────────────────────
async function compressImage(file, { maxPx = 1920, quality = 0.82 } = {}) {
  if (file.type === "image/gif") return file;
  return new Promise(resolve => {
    const img = new Image();
    const rawUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(rawUrl);
      let { naturalWidth: w, naturalHeight: h } = img;
      if (w > maxPx || h > maxPx) {
        const r = Math.min(maxPx / w, maxPx / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        if (!blob || blob.size >= file.size) { resolve(file); return; }
        const name = file.name.replace(/\.[^.]+$/, "") + ".jpg";
        resolve(new File([blob], name, { type: "image/jpeg" }));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(rawUrl); resolve(file); };
    img.src = rawUrl;
  });
}

// ── Render helpers ─────────────────────────────────────────────────────────────
function _fmtBytes(b) {
  if (!b) return "";
  if (b < 1024) return b + " B";
  if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
  return (b / 1048576).toFixed(1) + " MB";
}

function _renderAttHtml(c) {
  // Render multiple media items from jsonb array, or fall back to legacy single attachment columns
  const mediaArr = Array.isArray(c.media) ? c.media : [];
  if (mediaArr.length) {
    let html = "";
    const images = mediaArr.filter(m => m.type === "image");
    const others = mediaArr.filter(m => m.type !== "image");
    if (images.length) {
      const cols = Math.min(images.length, 2);
      const multi = cols > 1;
      const gk = _evImgGroupStore(images.map(m => m.url));
      html += `<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:6px;margin-top:8px">` +
        images.map((m, i) =>
          `<div class="ev-img-wrap${multi ? " multi" : ""}" style="cursor:pointer" onclick="_evImgModalOpen('${gk}',${i})">` +
            `<img src="${esc(m.url)}" alt="${esc(m.name)}" decoding="async" ` +
              `style="width:100%;${multi ? "" : "max-height:420px;object-fit:contain;"}" ` +
              `loading="lazy" onload="this.parentElement.classList.add('loaded')">` +
            `</div>`
        ).join("") +
        `</div>`;
    }
    others.forEach(m => {
      if (m.type === "audio") {
        html += `<div class="comment-att"><audio src="${esc(m.url)}" controls></audio></div>`;
      } else if (m.type === "mux") {
        html += `<div class="comment-mux-wrap" style="margin-top:8px"><mux-player playback-id="${esc(m.playbackId)}" controls></mux-player></div>`;
      } else if (m.type === "video" || m.type === "video-url") {
        html += `<div class="comment-att"><video src="${esc(m.url)}" controls preload="metadata"></video></div>`;
      } else if (m.type === "youtube") {
        html += `<div class="comment-att" style="position:relative;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden"><iframe src="https://www.youtube.com/embed/${esc(m.ytId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe></div>`;
      } else if (m.type === "vimeo") {
        html += `<div class="comment-att" style="position:relative;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden"><iframe src="https://player.vimeo.com/video/${esc(m.vimeoId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe></div>`;
      } else {
        const size = m.size ? ` · ${_fmtBytes(m.size)}` : "";
        html += `<div class="comment-att"><a class="comment-att-file" href="${esc(m.url)}" target="_blank" download="${esc(m.name)}">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span class="comment-att-fname">${esc(m.name)}</span><span class="comment-att-size">${size}</span>
        </a></div>`;
      }
    });
    return html;
  }
  // Legacy single-attachment fallback
  if (!c.attachment_url) return "";
  const url  = c.attachment_url;
  const name = c.attachment_name || "Attachment";
  const size = c.attachment_size ? ` · ${_fmtBytes(c.attachment_size)}` : "";
  switch (c.attachment_type) {
    case "image": {
      const lgk = _evImgGroupStore([url]);
      return `<div class="comment-att"><div class="ev-img-wrap" onclick="_evImgModalOpen('${lgk}',0)" style="cursor:pointer"><img src="${url}" alt="${esc(name)}" loading="lazy" onload="this.parentElement.classList.add('loaded')"></div></div>`;
    }
    case "video":
      return `<div class="comment-att"><video src="${url}" controls preload="metadata"></video></div>`;
    case "audio":
      return `<div class="comment-att"><audio src="${url}" controls></audio></div>`;
    default:
      return `<div class="comment-att"><a class="comment-att-file" href="${url}" target="_blank" download="${esc(name)}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span class="comment-att-fname">${esc(name)}</span><span class="comment-att-size">${size}</span>
      </a></div>`;
  }
}

function _renderPollHtml(poll, commentId, authorEmail) {
  if (!poll) return "";
  const opts      = typeof poll.options === "string" ? JSON.parse(poll.options) : (poll.options || []);
  const votes     = poll.event_comment_poll_votes || [];
  const total     = votes.length;
  const myVoteIdx = votes.find(v => v.email === myEmail)?.option_index ?? null;
  const hasVoted  = myVoteIdx !== null || (!!authorEmail && authorEmail === myEmail);

  let html = `<div class="poll-card"><div class="poll-card-question">${esc(poll.question)}</div>`;

  if (!hasVoted) {
    html += opts.map((opt, i) =>
      `<button type="button" class="poll-option-vote-btn" onclick="castVote('${poll.id}',${i},'${commentId}')">${esc(opt)}</button>`
    ).join("");
  } else {
    html += opts.map((opt, i) => {
      const cnt   = votes.filter(v => v.option_index === i).length;
      const pct   = total > 0 ? Math.round(cnt / total * 100) : 0;
      const isMine = myVoteIdx === i;
      return `<div class="poll-bar-row" onclick="castVote('${poll.id}',${i},'${commentId}')">
        <div class="poll-bar-label">
          <span>${esc(opt)}${isMine ? ` <span style="color:#10b981;font-size:.7em">●</span>` : ""}</span>
          <span>${pct}%</span>
        </div>
        <div class="poll-bar-track"><div class="poll-bar-fill${isMine ? " mine" : ""}" style="width:${pct}%"></div></div>
      </div>`;
    }).join("");
    html += `<div class="poll-footer"><span class="poll-total">${total} vote${total !== 1 ? "s" : ""}</span></div>`;
  }

  html += `</div>`;
  return html;
}

async function castVote(pollId, optionIndex, commentId) {
  // Delete existing vote first (upsert needs UPDATE RLS which we don't have),
  // then insert the new choice.
  await db.from("event_comment_poll_votes")
    .delete().eq("poll_id", pollId).eq("email", myEmail);
  await db.from("event_comment_poll_votes")
    .insert({ poll_id: pollId, email: myEmail, option_index: optionIndex });

  // Patch just the poll card in-place — no full discussion reload needed
  const { data: poll } = await db
    .from("event_comment_polls")
    .select("id,question,options,event_comment_poll_votes(email,option_index)")
    .eq("id", pollId)
    .single();
  if (!poll) return;
  const commentEl = document.getElementById(`comment-${commentId}`);
  if (!commentEl) return;
  const existingPoll = commentEl.querySelector(".poll-card");
  if (existingPoll) existingPoll.outerHTML = _renderPollHtml(poll, commentId);
}

async function deleteComment(commentId, eventId) {
  if (!confirm("Delete this message?")) return;
  await db.from("event_comments").delete().eq("id", commentId);
  loadComments(eventId);
}

async function loadAttendees(eventId) {
  const el = document.getElementById("attendee-list");
  if (!el) return;
  const { data, error } = await db.from("event_rsvps")
    .select("*")
    .eq("event_id", eventId)
    .limit(10);
  if (error) console.error("loadAttendees error:", error);
  if (!data || data.length === 0) {
    el.innerHTML = `<p style="color:var(--text-muted);font-size:.85rem">No RSVPs yet.</p>`;
    return;
  }
  const rsvpEmails = data.map(r => r.email).filter(Boolean);
  const { data: avRows } = await db.from("allowed_emails")
    .select("email,avatar_url").in("email", rsvpEmails);
  const avMap = {};
  (avRows || []).forEach(r => { if (r.avatar_url) avMap[r.email] = r.avatar_url; });
  el.innerHTML = data.map(r => {
    const name = r.name || r.email?.split("@")[0] || "Member";
    return `<div class="attendee-row">
      ${avatarHtml(name, r.email, 32, avMap[r.email] || null)}
      <span class="attendee-name">${esc(name)}</span>
