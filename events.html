<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Events & Replays — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player" type="module"></script>
  <script src="/shared-header.js"></script>
  <style>
    /* ── Events page ─────────────────────────────────────────────────────────── */

    /* Tab bar + notification styles injected by shared-header.js */

    /* ── Main layout ─────────────────────────────────────────────────────────── */
    #events-main {
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    /* ── View transitions ────────────────────────────────────────────────────── */
    .view { display: none; }
    .view.active { display: block; }

    /* ── Events list ─────────────────────────────────────────────────────────── */
    .events-page-hdr {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
    }
    .events-page-hdr h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }

    .evt-tabs {
      display: flex; gap: 4px;
      border-bottom: 1.5px solid var(--border);
      margin-bottom: 24px;
    }
    .evt-tab {
      background: none; border: none; cursor: pointer;
      padding: 8px 16px; font-size: 0.9rem; font-weight: 600;
      color: var(--text-muted); border-bottom: 2.5px solid transparent;
      margin-bottom: -1.5px; transition: color .15s, border-color .15s;
    }
    .evt-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .events-section-heading {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; color: var(--text-muted);
      margin: 28px 0 12px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .events-section-heading:first-child { margin-top: 0; }
    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-bottom: 8px;
    }
    /* Single-card sections always fill full width */
    .events-grid--single {
      grid-template-columns: 1fr;
    }
    .event-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: border-color .15s, transform .15s;
    }
    .event-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .event-card-cover {
      width: 100%; aspect-ratio: 16/7;
      background: var(--surface-2);
      object-fit: cover; display: block;
    }
    .event-card-cover-placeholder {
      width: 100%; aspect-ratio: 16/7;
      background: linear-gradient(135deg, #1a1200 0%, #2a2000 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem;
    }
    .event-card-body { padding: 14px 16px 16px; }
    .event-card-status {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; padding: 3px 8px; border-radius: 20px;
      margin-bottom: 8px;
    }
    .status-scheduled { background: #1a2a1a; color: #6bcb77; border: 1px solid #2a4a2a; }
    .status-live      { background: #2a1010; color: #ff6b6b; border: 1px solid #4a2020;
                        animation: pulse-border 1.5s infinite; }
    .status-ended     { background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); }
    @keyframes pulse-border {
      0%, 100% { border-color: #4a2020; }
      50%      { border-color: #ff6b6b; }
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #ff6b6b;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    .event-card-title {
      font-size: 1rem; font-weight: 700; color: #fff;
      margin-bottom: 6px; line-height: 1.3;
    }
    .event-card-meta { font-size: 0.8rem; color: var(--text-muted); }
    .event-card-ended { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; }
    .event-card-footer {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-top: 10px;
    }
    .evt-badge {
      font-size: 0.72rem; color: var(--text-muted);
      display: flex; align-items: center; gap: 4px;
    }

    /* ── Event detail ────────────────────────────────────────────────────────── */
    .back-btn {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text-muted); font-size: 0.84rem; font-weight: 500;
      padding: 4px 0; border: none; background: none;
      cursor: pointer; transition: color .15s;
      margin-bottom: 16px;
    }
    .back-btn:hover { color: var(--text); }

    .event-detail-cover {
      width: 100%; aspect-ratio: 16/5;
      border-radius: var(--radius); object-fit: cover;
      margin-bottom: 20px; display: block;
    }
    .event-detail-cover-placeholder {
      width: 100%; aspect-ratio: 16/5;
      border-radius: var(--radius);
      background: linear-gradient(135deg, #1a1200 0%, #2a2000 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 4rem; margin-bottom: 20px;
    }
    .event-detail-hdr {
      display: flex; justify-content: space-between;
      align-items: flex-start; gap: 16px; flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .event-detail-title { font-size: 1.6rem; font-weight: 700; color: #fff; line-height: 1.2; }
    .event-detail-meta  { font-size: 0.88rem; color: var(--text-muted); margin-top: 6px; }
    .event-detail-desc  {
      color: var(--text-muted); font-size: 0.93rem; line-height: 1.7;
      margin-bottom: 20px;
    }

    .event-info-row {
      display: flex; gap: 20px; flex-wrap: wrap;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px;
      margin-bottom: 24px;
    }
    .event-info-item { display: flex; flex-direction: column; gap: 3px; }
    .event-info-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
                        letter-spacing: .08em; color: var(--text-muted); }
    .event-info-val   { font-size: 0.9rem; color: var(--text); font-weight: 600; }

    .event-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px; }

    /* ── Countdown ───────────────────────────────────────────────────────────── */
    .countdown-block {
      background: var(--accent-subtle); border: 1.5px solid #3d3200;
      border-radius: var(--radius); padding: 20px 24px; margin-bottom: 24px;
      text-align: center;
    }
    .countdown-label { font-size: 0.8rem; color: var(--accent); font-weight: 700;
                       text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
    .countdown-digits { display: flex; gap: 16px; justify-content: center; }
    .countdown-unit { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .countdown-num { font-size: 2rem; font-weight: 700; color: var(--accent); line-height: 1; }
    .countdown-unit-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase;
                            letter-spacing: .08em; }

    /* ── Mux recording player ────────────────────────────────────────────────── */
    .recording-block {
      margin-bottom: 28px;
    }
    .recording-block h3 {
      font-size: 1rem; font-weight: 700; color: var(--text);
      margin-bottom: 12px;
    }
    .recording-processing {
      display: flex; align-items: center; gap: 14px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px;
      margin-bottom: 28px;
    }
    .recording-processing-spinner {
      width: 22px; height: 22px; flex-shrink: 0;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .live-preview-block { margin-bottom: 28px; }
    .live-preview-label {
      display: flex; align-items: center; gap: 8px;
      font-size: .8rem; font-weight: 700; color: #ff6b6b;
      margin-bottom: 10px;
    }
    .btn-link {
      background: none; border: none; padding: 0; cursor: pointer;
      color: var(--accent); font-size: inherit; font-family: inherit;
      text-decoration: underline;
    }
    .btn-link:hover { opacity: .8; }
    .mux-player-wrap { width: 100%; border-radius: var(--radius); overflow: hidden; position: relative; }
    /* ── VOD featured-question overlay ──────────────────────────────────────── */
    @keyframes vod-qa-fadein { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    /* ── Now Featured banner (below video, synced to playback) ─────────────── */
    #vod-now-featured {
      display: none; margin-top: 10px;
      background: rgba(201,168,76,.08);
      border-left: 3px solid var(--accent);
      border-radius: 6px; padding: 10px 14px;
      animation: vod-qa-fadein .25s ease;
    }
    #vod-now-featured.visible { display: block; }
    .vod-now-featured-label {
      font-size: .65rem; color: var(--accent); font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      display: flex; align-items: center; gap: 5px; margin-bottom: 5px;
    }
    #vod-now-featured-text  { font-size: .9rem; color: #fff; line-height: 1.4; }
    #vod-now-featured-asker { font-size: .75rem; color: var(--text-muted); margin-top: 3px; }
    /* ── VOD answered Q&A list ───────────────────────────────────────────────── */
    .vod-qa-list { margin-top: 20px; }
    .vod-qa-list-title {
      font-size: .75rem; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .07em;
      margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
    }
    .vod-qa-row {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 8px; border-top: 1px solid var(--border);
      border-radius: 6px; margin: 0 -8px;
      transition: background .2s ease;
    }
    .vod-qa-row:last-child { border-bottom: 1px solid var(--border); }
    .vod-qa-row.active {
      background: rgba(201,168,76,.1);
    }
    .vod-qa-row.active .vod-qa-row-q { color: #fff; }
    .vod-qa-ts-group { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
    .vod-qa-ts {
      flex-shrink: 0; font-size: .75rem; font-weight: 600;
      color: var(--accent); font-variant-numeric: tabular-nums;
      background: rgba(201,168,76,.12); border-radius: 4px;
      padding: 2px 7px; white-space: nowrap;
      cursor: pointer; border: none; font-family: inherit;
    }
    .vod-qa-ts:hover { background: rgba(201,168,76,.25); }
    .vod-qa-ts.no-ts { color: var(--text-muted); background: var(--surface-2); cursor: default; }
    .vod-qa-row-body { flex: 1; min-width: 0; }
    .vod-qa-row-q { font-size: .88rem; color: var(--text); line-height: 1.4; }
    .vod-qa-row-asker { font-size: .75rem; color: var(--text-muted); margin-top: 2px; }
    mux-player { width: 100%; display: block; background: transparent; --media-background-color: transparent; --media-object-fit: contain; }
    /* Hide broken poster/thumbnail until Mux finishes generating them */
    mux-player::part(poster) { background: var(--surface-2); }
    mux-player::part(poster) img,
    mux-player::part(thumbnail) img,
    media-poster-image img { display: none !important; }
    /* Shared Mux upload overlay styles (global fixed bar) */
    .mux-upload-overlay-icon { font-size: 1.5rem; flex-shrink: 0; }
    .mux-upload-overlay-body { flex: 1; min-width: 0; }
    .mux-upload-overlay-filename { font-size:.85rem; font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:8px; }
    .mux-upload-overlay-track { width:100%; height:5px; background:rgba(0,0,0,.08); border-radius:4px; overflow:hidden; margin-bottom:6px; }
    .mux-upload-overlay-bar { height:100%; background:var(--accent); border-radius:4px; transition:width .25s ease; width:0%; }
    @keyframes mux-stripe { 0%{background-position:0 0} 100%{background-position:40px 0} }
    .mux-upload-overlay-bar.processing { background-color:var(--accent); background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.12) 0px,rgba(0,0,0,.12) 10px,transparent 10px,transparent 20px); background-size:40px 100%; animation:mux-stripe .8s linear infinite; }
    .mux-upload-overlay-status { font-size:.75rem; color:var(--text-muted); }
    @keyframes mux-pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .mux-upload-overlay-status.processing { animation:mux-pulse 1.4s ease-in-out infinite; color:var(--accent); }
    /* Comment video: same 16:9 mux-wrap as post videos */
    .comment-mux-wrap {
      width:100%; aspect-ratio:16/9;
      background:transparent; overflow:hidden; border-radius:8px; margin-top:8px;
    }
    .comment-mux-wrap mux-player { width:100%; height:100%; display:block; }
    /* Cap Mux player height in all event media preview areas */
    [id^="ev-media-preview-"] .comment-mux-wrap {
      padding-top: 0;
      height: min(180px, 24vh);
    }
    /* ── Inline camera recording panel (matches post composer) ──────────────── */
    .ev-cam-panel {
      background:#0d0d0d; border:1.5px solid var(--border);
      border-radius:12px; overflow:hidden; margin-top:8px;
    }
    .ev-cam-preview { display:block; width:100%; height:auto; background:#000; }
    .ev-cam-devices { display:flex; gap:8px; padding:10px 12px 0; }
    .ev-cam-select {
      flex:1; min-width:0; background:rgba(0,0,0,.05); border:1.5px solid var(--border);
      border-radius:8px; color:var(--text); font-size:.78rem; padding:6px 8px;
      font-family:inherit; outline:none; overflow:hidden;
    }
    .ev-cam-actions { display:flex; gap:8px; padding:10px 12px 12px; }
    .ev-cam-start-btn {
      flex:1; background:#ef4444; color:#fff; border:none;
      border-radius:8px; font-weight:700; font-size:.87rem;
      padding:10px; cursor:pointer; transition:opacity .15s;
    }
    .ev-cam-start-btn:hover { opacity:.85; }
    .ev-cam-cancel-btn {
      background:rgba(0,0,0,.05); border:1.5px solid var(--border);
      border-radius:8px; color:var(--text-muted); cursor:pointer;
      font-size:.85rem; padding:10px 16px; font-family:inherit;
    }
    .ev-cam-recbar {
      display:flex; align-items:center; gap:10px;
      padding:10px 14px 12px; background:rgba(239,68,68,.08);
    }
    .ev-cam-recbar .ev-recording-dot {
      width:9px; height:9px; border-radius:50%; background:#ef4444;
      animation:blink 1s ease-in-out infinite; flex-shrink:0;
    }
    .ev-cam-stop-btn {
      background:#ef4444; color:#fff; border:none; border-radius:8px;
      font-weight:700; font-size:.82rem; padding:8px 14px; cursor:pointer;
    }

    /* ── Two-column detail layout ─────────────────────────────────────────────── */
    .event-detail-layout {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 32px;
      align-items: start;
    }
    /* Each column is its own flex stack — no shared row heights */
    .event-detail-left  { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .event-detail-right { display: flex; flex-direction: column; gap: 16px; }
    .comments-section   { margin-top: 0; }
    /* Kill trailing bottom margin so it doesn't stack on top of the flex gap */
    .event-detail-top > *:last-child,
    .event-detail-bottom > *:last-child,
    .event-detail-sidebar > *:last-child { margin-bottom: 0; }
    @media (max-width: 768px) {
      /* Switch to flex so order works after dissolving wrappers */
      .event-detail-layout  { display: flex; flex-direction: column; gap: 16px; align-items: stretch; }
      .event-detail-left,
      .event-detail-right   { display: contents; }
      /* Mobile order: title/host → date card → admin/countdown → attendees → discussion */
      .event-detail-top     { order: 1; }
      .event-detail-sidebar { order: 2; }
      .event-detail-bottom  { order: 3; }
      #attendees-card       { order: 4; }
      .comments-section     { order: 5; }
    }

    /* ── Sidebar ─────────────────────────────────────────────────────────────── */
    .event-detail-sidebar { display: flex; flex-direction: column; gap: 16px; }
    .sidebar-card {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
    }
    .sidebar-card-title {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted); margin-bottom: 14px;
    }
    .sidebar-date-row {
      display: flex; gap: 14px; align-items: center; margin-bottom: 10px;
    }
    .sidebar-date-box {
      background: var(--accent-subtle); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 6px 10px; text-align: center;
      min-width: 48px; flex-shrink: 0;
    }
    .sidebar-date-day { font-size: 1.4rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .sidebar-date-month { font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
                          letter-spacing: .08em; color: var(--text-muted); }
    .sidebar-date-info { font-size: 0.88rem; color: var(--text); line-height: 1.5; }
    .sidebar-info-row {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 0; border-top: 1px solid var(--border);
      font-size: 0.85rem; color: var(--text-muted);
    }
    .sidebar-info-row:first-of-type { border-top: none; }

    /* ── Attendees ───────────────────────────────────────────────────────────── */
    .member-avatar {
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: #fff; flex-shrink: 0; font-family: inherit;
    }
    .attendee-list { display: flex; flex-direction: column; gap: 10px; }
    .attendee-row { display: flex; align-items: center; gap: 10px; }
    .attendee-name { font-size: 0.88rem; color: var(--text); }

    /* ── Host row ────────────────────────────────────────────────────────────── */
    .host-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    }
    .host-label { font-size: 0.75rem; color: var(--text-muted); }
    .host-name  { font-size: 0.93rem; font-weight: 700; color: var(--text); }

    /* ── Status badge ────────────────────────────────────────────────────────── */
    .event-time-ago {
      font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px;
    }

    /* ── Comments ────────────────────────────────────────────────────────────── */
    .comments-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 0;
    }
    .comments-hdr {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted);
    }
    .comment-item {
      display: flex; gap: 10px;
      padding: 13px 20px;
      border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .comment-item:last-of-type { border-bottom: none; }
    .comment-body { flex: 1; min-width: 0; }
    .comment-meta {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 3px;
    }
    .comment-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .comment-time { font-size: 0.7rem; color: var(--text-muted); }
    .comment-text {
      font-size: 0.87rem; color: var(--text-muted);
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .comments-empty {
      padding: 24px 20px; text-align: center;
      color: var(--text-muted); font-size: 0.82rem;
    }
    .comment-form {
      display: flex; gap: 10px; align-items: flex-end;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
    }
    .comment-form .btn { align-self: stretch; border-radius: 20px; padding: 0 18px; }
    .comment-input {
      flex: 1; background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 20px; color: var(--text);
      font-size: 0.87rem; font-family: inherit;
      padding: 9px 14px; resize: none; min-height: 38px; max-height: 120px;
      transition: border-color .15s;
    }
    .comment-input:focus { outline: none; border-color: var(--accent); }
    .comment-reply-btn {
      background: none; border: none; cursor: pointer; font-family: inherit;
      font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
      padding: 2px 0; transition: color .15s;
    }
    .comment-reply-btn:hover { color: var(--accent); }
    .comment-replies { margin-left: 36px; margin-top: 4px; display: flex; flex-direction: column; gap: 0; }
    .reply-to-name { color: var(--accent); font-weight: 600; margin-right: 4px; }
    .delete-btn {
      background: none; border: none; font-family: inherit;
      font-size: 0.7rem; color: var(--text-muted); cursor: pointer; padding: 0 4px;
      transition: color .15s; margin-left: auto;
    }
    .delete-btn:hover { color: #ef4444; }
    /* ── Attachment toolbar (community-style) ────────────────────────────────── */
    .comment-toolbar {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
      padding: 5px 0 2px;
    }
    .ev-toolbar-btn {
      width: 30px; height: 30px;
      background: none; border: 1.5px solid transparent;
      border-radius: 8px; cursor: pointer; font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: background .15s, border-color .15s, color .15s;
      position: relative; font-family: inherit;
    }
    .ev-toolbar-btn:hover { background: rgba(255,255,255,.07); color: var(--text); border-color: var(--border); }
    .ev-toolbar-btn.recording {
      color: #ef4444; border-color: #ef4444;
      animation: ev-pulse-red 1s ease-in-out infinite;
    }
    @keyframes ev-pulse-red {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
      50%      { box-shadow: 0 0 0 4px rgba(239,68,68,.25); }
    }
    /* ── Recording indicator ─────────────────────────────────────────────────── */
    .ev-recording-indicator {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem; color: #ef4444; font-weight: 600;
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      border-radius: 20px; padding: 4px 12px; margin-top: 6px;
    }
    .ev-recording-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ef4444; animation: ev-pulse-red 1s ease-in-out infinite;
    }
    .ev-recording-stop {
      background: rgba(239,68,68,.2); border: 1px solid rgba(239,68,68,.4);
      border-radius: 12px; color: #ef4444; cursor: pointer;
      font-size: 0.75rem; font-weight: 700; padding: 2px 10px; margin-left: 4px;
    }
    /* ── Media preview area ─────────────────────────────────────────────────── */
    .ev-media-preview { margin-top: 8px; }
    .ev-media-images { display: grid; gap: 6px; margin-bottom: 6px; }
    .ev-media-thumb-wrap { position: relative; display: block; }
    .ev-media-thumb-wrap img {
      width: 100%; height: auto; max-height: 420px;
      object-fit: contain; border-radius: 8px;
      border: 1.5px solid var(--border); display: block;
    }
    .ev-media-thumb-remove {
      position: absolute; top: 6px; right: 6px;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,.55); border: none;
      color: #fff; font-size: 0.8rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s;
    }
    .ev-media-thumb-remove:hover { background: #ef4444; }
    .ev-media-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 4px 8px 4px 6px;
      font-size: 0.78rem; color: var(--text-muted); margin: 2px 2px 2px 0;
    }
    .ev-media-chip-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 0.9rem; line-height: 1; padding: 0 1px;
    }
    .ev-media-chip-remove:hover { color: #ef4444; }
    /* ── Poll builder ────────────────────────────────────────────────────────── */
    .ev-poll-builder {
      margin-top: 8px; padding: 12px 14px; background: var(--surface);
      border: 1.5px solid var(--border); border-radius: 8px;
    }
    .ev-poll-title { font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted); margin-bottom:8px; }
    .ev-poll-q-input, .ev-poll-opt-input {
      width:100%; box-sizing:border-box; background:var(--bg); border:1.5px solid var(--border);
      border-radius:6px; padding:7px 10px; color:var(--text); font-size:.88rem; font-family:inherit;
    }
    .ev-poll-q-input { margin-bottom:8px; }
    .ev-poll-q-input:focus, .ev-poll-opt-input:focus { outline:none; border-color:var(--accent); }
    .ev-poll-opts-list { display:flex; flex-direction:column; gap:5px; margin-bottom:8px; }
    .ev-poll-opt-row { display:flex; gap:6px; align-items:center; }
    .ev-poll-opt-row .ev-poll-opt-input { flex:1; }
    .ev-poll-opt-del { background:none; border:none; cursor:pointer; color:var(--text-muted); padding:2px; }
    .ev-poll-opt-del:hover { color:#e04040; }
    .ev-poll-add-opt {
      background:none; border:1.5px dashed var(--border); border-radius:6px;
      padding:5px 10px; color:var(--text-muted); font-size:.82rem; font-family:inherit;
      cursor:pointer; width:100%;
    }
    .ev-poll-add-opt:hover { border-color:var(--accent); color:var(--accent); }
    /* ── Rendered poll inside comment ────────────────────────────────────────── */
    .poll-card {
      background: transparent; border: none;
      border-radius: 10px; padding: 0; margin-top: 10px;
    }
    .poll-card-question { font-size:.97rem; font-weight:700; color:var(--text); margin-bottom:12px; }
    .poll-option-vote-btn {
      width:100%; text-align:left; background:rgba(0,0,0,.04);
      border:1.5px solid var(--border); border-radius:8px;
      padding:9px 14px; font-size:.87rem; color:var(--text);
      font-family:inherit; cursor:pointer; margin-bottom:8px;
      transition:border-color .15s,background .15s;
    }
    .poll-option-vote-btn:hover { border-color:var(--accent); background:rgba(245,197,24,.07); }
    .poll-bar-row { margin-bottom:8px; cursor:pointer; border-radius:6px; padding:2px 4px; }
    .poll-bar-row:hover .poll-bar-fill { filter:brightness(1.15); }
    .poll-bar-label {
      display:flex; justify-content:space-between; align-items:center;
      font-size:.85rem; color:var(--text); margin-bottom:4px;
    }
    .poll-bar-label span:last-child { color:var(--text-muted); font-size:.78rem; }
    .poll-bar-track { background:rgba(0,0,0,.06); border-radius:4px; height:6px; }
    .poll-bar-fill { height:100%; border-radius:4px; background:var(--accent); transition:width .4s ease; }
    .poll-bar-fill.mine { background:#10b981; }
    .poll-footer { display:flex; align-items:center; margin-top:10px; }
    .poll-total { font-size:.75rem; color:var(--text-muted); }
    /* ── Rendered attachment inside comment ──────────────────────────────────── */
    .comment-att { margin-top:10px; }
    .comment-att img { max-width:100%; max-height:300px; border-radius:8px; cursor:pointer; display:block; object-fit:cover; }
    .comment-att video { max-width:100%; max-height:300px; border-radius:8px; display:block; }
    .comment-att audio { width:100%; margin-top:4px; }
    .comment-att-file {
      display:inline-flex; align-items:center; gap:9px; padding:9px 14px;
      background:var(--bg); border:1.5px solid var(--border); border-radius:8px;
      color:var(--text); text-decoration:none; font-size:.85rem;
    }
    .comment-att-file:hover { border-color:var(--accent); }
    .comment-att-fname { font-weight:500; }
    .comment-att-size { color:var(--text-muted); font-size:.76rem; }

    /* ── Image shimmer placeholders ─────────────────────────────────────────── */
    .ev-img-wrap {
      position: relative; overflow: hidden; border-radius: 8px;
      background: var(--surface-2,#f0ebe4);
    }
    /* GPU-accelerated shimmer */
    .ev-img-wrap::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,.45) 50%, transparent 100%);
      transform: translateX(-100%);
      animation: ev-shimmer 1.4s ease-in-out infinite;
    }
    .ev-img-wrap.loaded::after { display: none; }
    .ev-img-wrap img { opacity: 0; transition: opacity .25s ease; display: block; width: 100%; }
    .ev-img-wrap.loaded img { opacity: 1; }
    .ev-img-wrap.multi { height: 160px; }
    .ev-img-wrap.multi img {
      width: 100% !important;
      height: 160px !important;
      object-fit: cover !important;
    }
    @keyframes ev-shimmer {
      100% { transform: translateX(200%); }
    }

    /* ── Image lightbox ─────────────────────────────────────────────────────── */
    #ev-img-modal {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,.88);
      display: none; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .18s ease;
    }
    #ev-img-modal.open { display: flex; opacity: 1; }
    #ev-img-modal img {
      max-width: min(84vw, 1200px); max-height: 88vh;
      border-radius: 10px; object-fit: contain;
      box-shadow: 0 8px 48px rgba(0,0,0,.7); transition: opacity .12s ease;
    }
    #ev-img-modal-close {
      position: absolute; top: 16px; right: 18px;
      background: rgba(255,255,255,.12); border: none; border-radius: 50%;
      width: 38px; height: 38px; cursor: pointer; color: #fff;
      font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    #ev-img-modal-close:hover { background: rgba(255,255,255,.22); }
    .ev-img-modal-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.12); border: none; border-radius: 50%;
      width: 44px; height: 44px; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s; flex-shrink: 0;
    }
    .ev-img-modal-nav:hover { background: rgba(255,255,255,.26); }
    .ev-img-modal-nav:disabled { opacity: 0; pointer-events: none; }
    #ev-img-modal-prev { left: 14px; }
    #ev-img-modal-next { right: 14px; }
    #ev-img-modal-counter {
      position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,.6); font-size: .82rem; font-weight: 600;
      background: rgba(0,0,0,.4); padding: 3px 10px; border-radius: 20px;
      pointer-events: none;
    }

    /* ── Live stream layout — full viewport below header ────────────────────── */
    #view-stream.active {
      position: fixed;
      top: 56px; left: 0; right: 0;
      height: calc(100dvh - 56px); /* dvh accounts for mobile browser chrome */
      z-index: 100;
      display: flex; flex-direction: column;
      background: #000;
      overflow: hidden;
    }
    #stream-wrap {
      flex: 1; min-height: 0;
      display: flex; overflow: hidden;
    }
    #stream-video-col {
      flex: 1; min-width: 0; min-height: 0;
      background: #000; position: relative;
    }
    .video-ratio-wrap {
      width: 100%; height: 100%; position: relative; background: #000;
    }
    /* Daily.co SDK injects its own iframe — make sure it fills the container */
    .video-ratio-wrap iframe {
      position: absolute; top: 0; left: 0;
      width: 100% !important; height: 100% !important;
      border: none;
    }
    /* Featured Q&A — lives at top of sidebar on all screen sizes */
    #featured-qa-bar {
      display: none;
      background: #1a1200; border-bottom: 2px solid var(--accent);
      padding: 10px 14px; flex-shrink: 0;
      animation: slideDown .25s ease;
    }
    #featured-qa-bar.visible { display: block; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
    .featured-qa-label { font-size: 0.68rem; color: var(--accent); font-weight: 700;
                         text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px;
                         display: flex; align-items: center; gap: 5px; }
    .featured-qa-text  { font-size: 0.88rem; color: #fff; line-height: 1.4; }
    .featured-qa-asker { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

    #stream-sidebar {
      width: 320px; flex-shrink: 0;
      background: var(--surface); border-left: 1.5px solid var(--border);
      display: flex; flex-direction: column;
      min-height: 0; overflow: visible;
    }
    .stream-event-title {
      padding: 12px 16px 0;
      font-size: 0.9rem; font-weight: 700; color: var(--text);
      border-bottom: none;
    }
    .sidebar-tabs {
      display: flex; border-bottom: 1.5px solid var(--border);
      flex-shrink: 0;
    }
    .sid-tab {
      flex: 1; background: none; border: none; cursor: pointer;
      padding: 12px 10px; font-size: 0.85rem; font-weight: 600;
      color: var(--text-muted); border-bottom: 2.5px solid transparent;
      margin-bottom: -1.5px; transition: color .15s, border-color .15s;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      min-height: 44px; /* iOS minimum tap target */
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .sid-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Chat */
    #sidebar-chat, #sidebar-qa { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #chat-messages, #qa-questions {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
      -webkit-overflow-scrolling: touch;
    }
    .chat-msg {
      display: flex; align-items: flex-start; gap: 8px;
      background: var(--surface-2); border-radius: 8px; padding: 8px 10px;
    }
    .chat-msg-av { flex-shrink: 0; margin-top: 1px; }
    .chat-msg-body { flex: 1; min-width: 0; }
    .chat-msg-author { font-size: 0.75rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
    .chat-msg-text   { font-size: 0.88rem; color: var(--text); line-height: 1.4; word-break: break-word; }
    .chat-msg.mine   { background: #1a1200; border: 1px solid #3d3200; }

    .chat-input-row {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1.5px solid var(--border); flex-shrink: 0;
    }
    .chat-input-row input {
      flex: 1; background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-size: 0.88rem;
    }
    .chat-input-row input:focus { outline: none; border-color: var(--accent); }

    /* Q&A */
    .qa-item {
      background: var(--surface-2); border-radius: 8px; padding: 10px 12px;
      border: 1px solid var(--border);
    }
    .qa-item.featured { border-color: var(--accent); background: #1a1200; }
    .qa-item-asker { font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .qa-item-text  { font-size: 0.88rem; color: var(--text); line-height: 1.4; }
    .qa-item-actions {
      display: flex; gap: 6px; margin-top: 8px;
    }
    .qa-item-actions button {
      font-size: 0.72rem; padding: 3px 8px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-muted); cursor: pointer; transition: all .15s;
    }
    .qa-item-actions button:hover { border-color: var(--accent); color: var(--accent); }
    .qa-item-actions button.featured-btn { border-color: var(--accent); color: var(--accent); }

    .qa-input-row {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1.5px solid var(--border); flex-shrink: 0;
    }
    .qa-input-row input {
      flex: 1; background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-size: 0.88rem;
    }
    .qa-input-row input:focus { outline: none; border-color: var(--accent); }

    /* Stream admin bar */
    #stream-admin-bar {
      display: none;
      background: #1a1200; border-top: 1.5px solid #3d3200;
      padding: 10px 16px; flex-shrink: 0;
      display: none; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    #stream-admin-bar.visible { display: flex; }
    .admin-bar-label { font-size: 0.8rem; color: var(--accent); font-weight: 700; }

    /* Tab unread badges */
    .sid-tab-badge {
      background: #ff6b6b; color: #fff;
      font-size: .65rem; font-weight: 700; line-height: 1;
      min-width: 16px; height: 16px; border-radius: 8px;
      padding: 0 4px; display: none; align-items: center; justify-content: center;
    }
    .sid-tab-badge.visible { display: flex; }

    /* Typing indicator */
    #chat-typing, #qa-typing {
      display: none; padding: 4px 12px 2px;
      font-size: .75rem; color: var(--text-muted); font-style: italic;
      flex-shrink: 0;
    }

    /* Sidebar toggle — visible on desktop and landscape mobile, hidden on portrait mobile */
    #stream-fullscreen-btn {
      display: flex;
      position: absolute; bottom: 10px; right: 10px; z-index: 10;
      background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.15);
      border-radius: 8px; padding: 7px 10px; cursor: pointer; color: #fff;
      align-items: center; gap: 6px; font-size: .75rem; font-weight: 600;
      backdrop-filter: blur(4px);
    }
    #stream-fullscreen-badge {
      background: #ff6b6b; color: #fff; font-size: .65rem; font-weight: 700;
      min-width: 16px; height: 16px; border-radius: 8px; padding: 0 4px;
      display: none; align-items: center; justify-content: center;
    }
    #stream-fullscreen-badge.visible { display: flex; }
    #stream-sidebar {
      transition: width .25s ease, opacity .2s ease, border-width .25s ease;
    }
    #stream-video-col {
      transition: flex .25s ease;
    }
    #stream-wrap.sidebar-hidden #stream-sidebar {
      width: 0 !important; opacity: 0; overflow: hidden;
      border-left-width: 0; pointer-events: none;
    }

    @media (max-width: 700px) {
      #view-stream.active { top: 56px; }
      #stream-wrap { flex-direction: column; }
      #stream-video-col { flex: none; aspect-ratio: 16/9; }
      .video-ratio-wrap { aspect-ratio: 16/9; height: auto; }
      #stream-sidebar { width: 100%; flex: 1; border-left: none; border-top: 1.5px solid var(--border); }
    }
    /* Portrait mobile: hide the toggle (stacked layout — no sidebar to collapse) */
    @media (max-width: 700px) and (orientation: portrait) {
      #stream-fullscreen-btn { display: none; }
    }
    /* Landscape mobile: let video fill height properly */
    @media (orientation: landscape) and (max-height: 520px) {
      #stream-video-col { flex: 1; }
      .video-ratio-wrap { aspect-ratio: unset; height: 100%; }
    }

    /* ── Admin create event form ──────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.7);
      z-index: 500; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 28px;
      width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    }
    .modal h2 { font-size: 1.2rem; font-weight: 700; color: #fff; margin-bottom: 20px; }
    .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .form-field label { font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
                        letter-spacing: .06em; color: var(--text-muted); }
    .form-field input, .form-field textarea, .form-field select {
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 10px 14px; color: var(--text);
      font-size: 0.9rem; font-family: inherit;
    }
    .form-field textarea { resize: none; overflow: hidden; min-height: 0; }
    .form-field input:focus, .form-field textarea:focus { outline: none; border-color: var(--accent); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; }

    /* ── Admin event controls on detail page ─────────────────────────────────── */
    .admin-event-controls {
      background: #1a1200; border: 1.5px solid #3d3200;
      border-radius: var(--radius); padding: 14px 18px;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 20px;
    }
    .admin-event-controls span { font-size: 0.82rem; color: var(--accent); font-weight: 700; }

    /* ── Add Mux playback form ────────────────────────────────────────────────── */
    .mux-form {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px; margin-bottom: 24px;
    }
    .mux-form h4 { font-size: 0.85rem; font-weight: 700; color: var(--accent);
                   margin-bottom: 10px; }
    .mux-form-row { display: flex; gap: 10px; }
    .mux-form-row input {
      flex: 1; background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: 0.88rem;
    }
    .mux-form-row input:focus { outline: none; border-color: var(--accent); }

    /* ── Cover image upload ──────────────────────────────────────────────────── */
    .cover-upload-area {
      width: 100%; aspect-ratio: 16/6;
      background: var(--surface-2); border: 2px dashed var(--border);
      border-radius: 8px; cursor: pointer; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      position: relative; transition: border-color .15s;
    }
    .cover-upload-area:hover { border-color: var(--accent); }
    .cover-upload-area.has-image { border-style: solid; border-color: var(--border); }
    #cover-placeholder {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; color: var(--text-muted); font-size: 0.88rem;
      pointer-events: none;
    }
    #cover-preview-wrap { width: 100%; height: 100%; position: relative; }
    #cover-position-bar {
      display: none;
      position: absolute; right: 8px; top: 8px; bottom: 8px;
      width: 28px; flex-direction: column; align-items: center;
      gap: 4px; z-index: 2;
    }
    #cover-preview-wrap.has-image #cover-position-bar { display: flex; }
    #cover-position-bar label {
      font-size: 0.62rem; color: rgba(255,255,255,.7);
      writing-mode: vertical-rl; text-orientation: mixed;
      transform: rotate(180deg); letter-spacing: .06em;
      text-transform: uppercase; margin-bottom: 2px;
    }
    #cover-pos-slider {
      -webkit-appearance: slider-vertical;
      appearance: slider-vertical;
      width: 20px; flex: 1; cursor: pointer;
      accent-color: var(--accent);
      writing-mode: vertical-lr;
      direction: rtl;
    }
    #cover-upload-progress {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.7);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: var(--text); font-size: 0.88rem;
    }
    .upload-spinner {
      width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .prev-covers-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
    }
    .prev-cover-thumb {
      aspect-ratio: 16/7; border-radius: 6px; overflow: hidden;
      cursor: pointer; border: 2px solid transparent;
      transition: border-color .15s; position: relative;
    }
    .prev-cover-thumb:hover { border-color: var(--accent); }
    .prev-cover-thumb.selected { border-color: var(--accent); }
    .prev-cover-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ── Flatpickr dark theme overrides ─────────────────────────────────────── */
    /* ── Frequency pills ─────────────────────────────────────────────────────── */
    .freq-pill {
      font-family: inherit; font-size: .83rem; cursor: pointer;
      padding: 5px 13px; border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text-muted);
      transition: border-color .15s, background .15s, color .15s;
    }
    .freq-pill:hover  { border-color: var(--accent); color: var(--text); }
    .freq-pill.active { border-color: var(--accent); background: rgba(245,197,24,.12); color: var(--accent); font-weight: 600; }

    .flatpickr-calendar {
      background: var(--surface-2) !important;
      border: 1.5px solid var(--border) !important;
      border-radius: var(--radius) !important;
      box-shadow: var(--shadow) !important;
      font-family: inherit !important;
    }
    .flatpickr-months .flatpickr-month,
    .flatpickr-weekdays,
    span.flatpickr-weekday {
      background: var(--surface-2) !important;
      color: var(--text-muted) !important;
      fill: var(--text-muted) !important;
    }
    .flatpickr-day { color: var(--text) !important; border-radius: 6px !important; }
    .flatpickr-day:hover { background: var(--surface) !important; border-color: var(--accent) !important; }
    .flatpickr-day.selected,
    .flatpickr-day.selected:hover {
      background: var(--accent) !important;
      border-color: var(--accent) !important;
      color: #000 !important;
    }
    .flatpickr-day.today { border-color: var(--accent) !important; }
    .flatpickr-day.flatpickr-disabled { color: var(--text-muted) !important; opacity: .35; }
    .numInputWrapper input,
    .flatpickr-time input {
      color: var(--text) !important;
      background: var(--surface) !important;
    }
    .flatpickr-time .flatpickr-time-separator,
    .flatpickr-time .flatpickr-am-pm { color: var(--text-muted) !important; }
    .flatpickr-current-month .flatpickr-monthDropdown-months,
    .flatpickr-current-month input.cur-year {
      color: var(--text) !important;
      background: transparent !important;
    }
    .flatpickr-prev-month svg, .flatpickr-next-month svg { fill: var(--text-muted) !important; }
    .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg { fill: var(--accent) !important; }
    /* Hide the raw input — show only our styled trigger */
    .flatpickr-input { display: none !important; }
    .date-trigger {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 10px 14px; cursor: pointer;
      transition: border-color .15s; color: var(--text); font-size: 0.9rem;
      user-select: none;
    }
    .date-trigger:hover { border-color: var(--accent); }
    .date-trigger .dt-icon { font-size: 1rem; }
    .date-trigger .dt-text { flex: 1; }
    .date-trigger .dt-placeholder { color: var(--text-muted); }

    /* ── Timezone display ────────────────────────────────────────────────────── */
    .tz-display {
      display: flex; flex-direction: column; gap: 3px;
    }
    .tz-primary { font-size: 0.95rem; font-weight: 600; color: var(--text); }
    .tz-local {
      font-size: 0.8rem; color: var(--accent);
      display: flex; align-items: center; gap: 5px;
    }
    .tz-local-label { color: var(--text-muted); font-weight: normal; }

    /* ── Buttons (shared with style.css) ─────────────────────────────────────── */
    .btn { display: inline-flex; align-items: center; gap: 6px;
           padding: 8px 16px; border-radius: 8px; font-size: 0.88rem;
           font-weight: 600; cursor: pointer; border: none;
           transition: opacity .15s, background .15s; }
    .btn:hover { opacity: .88; }
    .btn-primary { background: var(--accent); color: #000; }
    .btn-danger  { background: var(--danger); color: #fff; }
    .btn-ghost   { background: none; border: 1.5px solid var(--border); color: var(--text-muted); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-sm { padding: 5px 12px; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Empty state ─────────────────────────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 60px 20px; color: var(--text-muted);
      grid-column: 1 / -1;
    }
    .empty-state .empty-icon { font-size: 3rem; margin-bottom: 12px; }
    .empty-state p { font-size: 0.93rem; }

    /* ── Backstage view ──────────────────────────────────────────────────────── */
    #view-backstage.active {
      position: fixed;
      top: 56px; left: 0; right: 0;
      height: calc(100dvh - 56px);
      z-index: 100;
      display: flex; flex-direction: column;
      background: #0a0a0a;
      overflow: hidden;
    }
    #backstage-wrap {
      flex: 1; min-height: 0;
      display: flex; overflow: hidden;
    }
    #backstage-video-col {
      flex: 1; min-width: 0; min-height: 0;
      background: #0a0a0a; position: relative;
    }
    #backstage-video-col .video-ratio-wrap iframe {
      position: absolute; top: 0; left: 0;
      width: 100% !important; height: 100% !important;
      border: none;
    }
    #backstage-sidebar {
      width: 300px; flex-shrink: 0;
      background: var(--surface); border-left: 1.5px solid var(--border);
      display: flex; flex-direction: column; min-height: 0;
    }
    .backstage-title-row {
      padding: 10px 16px 8px;
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border);
    }
    .backstage-badge {
      font-size: .62rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .1em; color: #0d0d0d; background: var(--accent);
      border-radius: 20px; padding: 2px 8px; flex-shrink: 0;
    }
    .backstage-event-name {
      font-size: .85rem; font-weight: 600; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
    }
    #backstage-panel-guests,
    #backstage-panel-qa {
      flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden;
    }
    #backstage-guest-list,
    #backstage-qa-list {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .backstage-guest-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--surface-2); border-radius: 8px; padding: 8px 10px;
    }
    .backstage-guest-body { flex: 1; min-width: 0; }
    .backstage-guest-name { font-size: .88rem; color: var(--text); font-weight: 600;
                            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .backstage-guest-email { font-size: .72rem; color: var(--text-muted);
                             white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .backstage-invite-row {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1.5px solid var(--border); flex-shrink: 0;
    }
    .backstage-invite-row input {
      flex: 1; background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text); font-size: .88rem;
      font-family: inherit;
    }
    .backstage-invite-row input:focus { outline: none; border-color: var(--accent); }
    #backstage-admin-bar, #backstage-guest-bar {
      background: #0f0a00; border-top: 1.5px solid #3d3200;
      padding: 10px 16px; flex-shrink: 0;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .backstage-live-indicator {
      display: flex; align-items: center; gap: 6px;
      font-size: .78rem; color: #ff6b6b; font-weight: 700;
      background: rgba(255,107,107,.1); border: 1px solid rgba(255,107,107,.3);
      border-radius: 20px; padding: 3px 10px;
    }
    @media (max-width: 700px) {
      #backstage-wrap { flex-direction: column; }
      #backstage-video-col { flex: none; aspect-ratio: 16/9; }
      #backstage-sidebar { width: 100%; flex: 1; border-left: none; border-top: 1.5px solid var(--border); }
    }
  </style>
</head>
<body>

<!-- ── Header (populated by shared-header.js) ────────────────────────────── -->
<header id="app-header" style="display:none"></header>

<!-- ── Main ────────────────────────────────────────────────────────────────── -->
<main id="events-main" style="display:none">

  <!-- Tab bar injected by shared-header.js -->

  <!-- ── View: Events list ─────────────────────────────────────────────────── -->
  <div id="view-list" class="view active">
    <div class="events-page-hdr">
      <h1>Events &amp; Replays</h1>
      <button id="btn-new-event" class="btn btn-primary" style="display:none" onclick="openCreateModal()">
        + New Event
      </button>
    </div>
    <div class="evt-tabs">
      <button class="evt-tab active" onclick="showEvtTab('upcoming', this)">Upcoming</button>
      <button class="evt-tab" onclick="showEvtTab('past', this)">Past Replays</button>
    </div>
    <div id="events-grid"></div>
  </div>

  <!-- ── View: Event detail ─────────────────────────────────────────────────── -->
  <div id="view-detail" class="view">
    <button class="back-btn" onclick="showView('list')"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg> Back to Events</button>
    <div id="event-detail-content"></div>
  </div>

  <!-- ── View: Backstage ───────────────────────────────────────────────────── -->
  <div id="view-backstage" class="view" style="padding:0;max-width:100vw;">
    <div id="backstage-wrap">
      <!-- Video col -->
      <div id="backstage-video-col">
        <div class="video-ratio-wrap" id="backstage-container"></div>
      </div>
      <!-- Sidebar -->
      <div id="backstage-sidebar">
        <div class="backstage-title-row">
          <span class="backstage-badge">Backstage</span>
          <span class="backstage-event-name" id="backstage-event-name"></span>
        </div>
        <div class="sidebar-tabs" id="backstage-tabs">
          <button class="sid-tab active" id="bs-tab-guests" onclick="showBackstageTab('guests', this)">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Guests
          </button>
          <button class="sid-tab" id="bs-tab-qa" onclick="showBackstageTab('qa', this)">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 9V4a2 2 0 0 0-4 0v8"/><path d="M18 9a2 2 0 0 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
            Questions
            <span class="sid-tab-badge" id="bs-qa-badge"></span>
          </button>
        </div>
        <!-- Guests panel -->
        <div id="backstage-panel-guests">
          <div id="backstage-guest-list"></div>
          <div class="backstage-invite-row" id="backstage-invite-row" style="display:none">
            <input id="backstage-invite-input" placeholder="Invite by email…" type="email"
              onkeydown="if(event.key==='Enter'){event.preventDefault();inviteToBackstage()}" />
            <button class="btn btn-sm btn-primary" onclick="inviteToBackstage()">Invite</button>
          </div>
        </div>
        <!-- Q&A panel (host view with moderation) -->
        <div id="backstage-panel-qa" style="display:none">
          <div id="backstage-qa-list"></div>
        </div>
      </div>
    </div>
    <!-- Admin bottom bar -->
    <div id="backstage-admin-bar" style="display:none">
      <span class="admin-bar-label" style="display:inline-flex;align-items:center;gap:5px">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor" style="opacity:.8"><circle cx="12" cy="12" r="10"/></svg>
        Backstage
      </span>
      <span id="backstage-stream-indicator" style="display:none" class="backstage-live-indicator">
        <span class="live-dot"></span> Stream Live
      </span>
      <button id="backstage-golive-btn" class="btn btn-sm btn-danger" onclick="goLiveFromBackstage()">Go Live</button>
      <button class="btn btn-sm btn-ghost" onclick="leaveBackstage()">Leave Backstage</button>
    </div>
    <!-- Guest bottom bar -->
    <div id="backstage-guest-bar" style="display:none">
      <span style="font-size:.82rem;color:var(--text-muted);flex:1">You're in the backstage green room.</span>
      <button class="btn btn-sm btn-ghost" onclick="leaveBackstage()">Leave</button>
    </div>
  </div>

  <!-- ── View: Live stream ──────────────────────────────────────────────────── -->
  <div id="view-stream" class="view" style="padding:0;max-width:100vw;">
    <div id="stream-wrap">
      <!-- Video col -->
      <div id="stream-video-col">
        <div class="video-ratio-wrap" id="daily-container"></div>
        <!-- Landscape fullscreen toggle -->
        <button id="stream-fullscreen-btn" onclick="toggleStreamSidebar()" title="Toggle chat">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span id="stream-fullscreen-label">Hide chat</span>
          <span id="stream-fullscreen-badge"></span>
        </button>
      </div> <!-- /stream-video-col -->
      <!-- Sidebar -->
      <div id="stream-sidebar">
        <div class="stream-event-title" id="stream-event-title"></div>
        <div id="featured-qa-bar">
          <div class="featured-qa-label">
            <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Featured Question
          </div>
          <div class="featured-qa-text" id="featured-qa-text"></div>
          <div class="featured-qa-asker" id="featured-qa-asker"></div>
        </div>
        <div class="sidebar-tabs">
          <button class="sid-tab active" id="sid-tab-chat" onclick="showSidebarTab('chat', this)">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Chat
            <span class="sid-tab-badge" id="chat-badge"></span>
          </button>
          <button class="sid-tab" id="sid-tab-qa" onclick="showSidebarTab('qa', this)">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 9V4a2 2 0 0 0-4 0v8"/><path d="M18 9a2 2 0 0 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
            Questions
            <span class="sid-tab-badge" id="qa-badge"></span>
          </button>
        </div>
        <!-- Chat panel -->
        <div id="sidebar-chat" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
          <div id="chat-messages"></div>
          <div id="chat-typing"></div>
          <div class="chat-input-row">
            <input id="chat-input" placeholder="Say something…" maxlength="300"
              oninput="onChatTyping()"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}" />
            <button class="btn btn-primary btn-sm" onclick="sendChat()">Send</button>
          </div>
        </div>
        <!-- Q&A panel -->
        <div id="sidebar-qa" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
          <div id="qa-questions"></div>
          <div id="qa-typing"></div>
          <div class="qa-input-row">
            <input id="qa-input" placeholder="Ask a question…" maxlength="400"
              oninput="onQATyping()"
              onkeydown="if(event.key==='Enter'){event.preventDefault();submitQA()}" />
            <button class="btn btn-primary btn-sm" onclick="submitQA()">Ask</button>
          </div>
        </div>
      </div>
    </div>
    <!-- Admin stream controls -->
    <div id="stream-admin-bar">
      <span class="admin-bar-label" style="display:inline-flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg> Host Controls</span>
      <button class="btn btn-sm btn-danger" onclick="endStream()">
        <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
        End Stream
      </button>
      <button class="btn btn-sm btn-ghost" onclick="showView('detail')">← Back to event page</button>
    </div>
  </div>

</main>

<!-- ── Create / Edit event modal ──────────────────────────────────────────── -->
<div id="modal-create" class="modal-overlay" style="display:none">
  <div class="modal">
    <h2 id="modal-title">New Event</h2>
    <div id="recurrence-banner" style="display:none;background:rgba(245,197,24,.1);border:1px solid rgba(245,197,24,.3);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:.85rem;color:var(--text-muted)">Part of a recurring series. <button onclick="switchToEditAll()" style="background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;font-family:inherit;font-size:.85rem">Edit all events in series →</button></div>
    <div class="form-field">
      <label>Title *</label>
      <input id="f-title" placeholder="Live Practice Clinic: …" />
    </div>
    <div class="form-field">
      <label>Description</label>
      <textarea id="f-desc" rows="3" placeholder="What will we cover in this session?" oninput="autoResize(this)"></textarea>
    </div>
    <div class="form-field">
      <label>Cover Image</label>
      <div id="cover-upload-area" class="cover-upload-area" onclick="document.getElementById('cover-file-input').click()">
        <input id="cover-file-input" type="file" accept="image/*" style="display:none" onchange="handleCoverUpload(this)" />
        <div id="cover-preview-wrap">
          <div id="cover-placeholder">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.4"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span>Click to upload an image</span>
            <span style="font-size:0.75rem;color:var(--text-muted)">JPG, PNG, WebP — max 5MB</span>
          </div>
          <img id="cover-preview" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:8px;" />
          <div id="cover-position-bar" onclick="event.stopPropagation()">
            <label>Crop</label>
            <input id="cover-pos-slider" type="range" min="0" max="100" value="50"
              oninput="updateCoverPosition(this.value)" />
          </div>
        </div>
        <div id="cover-upload-progress" style="display:none">
          <div class="upload-spinner"></div>
          <span id="cover-upload-status">Uploading…</span>
        </div>
      </div>
      <input id="f-cover" type="hidden" />
      <input id="f-cover-pos" type="hidden" value="50" />

      <!-- Previous covers -->
      <div id="prev-covers-section" style="margin-top:10px;display:none">
        <div style="font-size:0.75rem;color:var(--text-muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.06em">Previous covers</div>
        <div id="prev-covers-grid" class="prev-covers-grid"></div>
      </div>
    </div>
    <div class="form-field">
      <label>Date &amp; Time *</label>
      <input id="f-date" type="text" placeholder="Pick a date and time" />
      <div class="date-trigger" id="date-trigger" onclick="datePicker && datePicker.open()">
        <span class="dt-icon"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></span>
        <span class="dt-text" id="date-trigger-text"><span class="dt-placeholder">Pick a date and time</span></span>
      </div>
    </div>
    <div class="form-field">
      <label>Timezone</label>
      <select id="f-timezone"></select>
    </div>
    <div class="form-field">
      <label>Duration (minutes)</label>
      <input id="f-duration" type="number" value="60" min="15" max="360" />
    </div>
    <div class="form-field" id="recurrence-field">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">

// ── Cover image upload ────────────────────────────────────────────────────────
async function handleCoverUpload(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { alert("Image must be under 5MB."); return; }

  const area     = document.getElementById("cover-upload-area");
  const progress = document.getElementById("cover-upload-progress");
  const status   = document.getElementById("cover-upload-status");

  progress.style.display = "flex";
  status.textContent = "Uploading…";

  const ext      = file.name.split(".").pop().toLowerCase();
  const fileName = `cover-${Date.now()}.${ext}`;

  const { data, error } = await db.storage
    .from("event-covers")
    .upload(fileName, file, { cacheControl: "3600", upsert: false });

  if (error) {
    progress.style.display = "none";
    alert("Upload failed: " + error.message);
    return;
  }

  const { data: urlData } = db.storage.from("event-covers").getPublicUrl(fileName);
  const publicUrl = urlData.publicUrl;

  // Update hidden input and preview
  document.getElementById("f-cover").value = publicUrl;
  setCoverPreview(publicUrl);
  progress.style.display = "none";

  // Refresh previous covers list
  loadPreviousCovers();
}

function setCoverPreview(url, position) {
  const area        = document.getElementById("cover-upload-area");
  const placeholder = document.getElementById("cover-placeholder");
  const preview     = document.getElementById("cover-preview");
  const wrap        = document.getElementById("cover-preview-wrap");
  const slider      = document.getElementById("cover-pos-slider");
  const pos         = position !== undefined ? position : 50;

  if (url) {
    preview.src = url;
    preview.style.display = "block";
    preview.style.objectPosition = `center ${pos}%`;
    placeholder.style.display = "none";
    area.classList.add("has-image");
    wrap.classList.add("has-image");
    slider.value = pos;
    document.getElementById("f-cover-pos").value = pos;
  } else {
    preview.style.display = "none";
    placeholder.style.display = "flex";
    area.classList.remove("has-image");
    wrap.classList.remove("has-image");
    slider.value = 50;
    document.getElementById("f-cover-pos").value = 50;
  }
}

function updateCoverPosition(val) {
  const preview = document.getElementById("cover-preview");
  if (preview) preview.style.objectPosition = `center ${val}%`;
  document.getElementById("f-cover-pos").value = val;
}

async function loadPreviousCovers() {
  // Pull distinct non-null cover_urls from past events
  const { data } = await db.from("live_events")
    .select("cover_url")
    .not("cover_url", "is", null)
    .order("created_at", { ascending: false })
    .limit(20);

  const section = document.getElementById("prev-covers-section");
  const grid    = document.getElementById("prev-covers-grid");
  if (!data || data.length === 0) { section.style.display = "none"; return; }

  // Deduplicate
  const seen = new Set();
  const unique = data.filter(r => {
    if (seen.has(r.cover_url)) return false;
    seen.add(r.cover_url); return true;
  });

  if (unique.length === 0) { section.style.display = "none"; return; }

  section.style.display = "block";
  const current = document.getElementById("f-cover").value;
  grid.innerHTML = unique.map(r => `
    <div class="prev-cover-thumb ${r.cover_url === current ? "selected" : ""}"
         onclick="selectPreviousCover('${r.cover_url}', this)">
      <img src="${r.cover_url}" alt="" loading="lazy" />
    </div>
  `).join("");
}

function selectPreviousCover(url, el) {
  document.getElementById("f-cover").value = url;
  setCoverPreview(url);
  // Highlight selected
  document.querySelectorAll(".prev-cover-thumb").forEach(t => t.classList.remove("selected"));
  el.classList.add("selected");
}

function showView(name) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById("view-" + name).classList.add("active");

  if (name !== "stream") {
    // Clean up realtime channels when leaving stream
    if (chatChannel)         { db.removeChannel(chatChannel);         chatChannel         = null; }
    if (qaChannel)           { db.removeChannel(qaChannel);           qaChannel           = null; }
    if (typingChannel)       { db.removeChannel(typingChannel);       typingChannel       = null; }
    if (discussionChannel)   { db.removeChannel(discussionChannel);   discussionChannel   = null; }
    if (streamStatusChannel) { db.removeChannel(streamStatusChannel); streamStatusChannel = null; }
    // Clean up main stream Daily.co call frame
    if (window._callFrame) { window._callFrame.destroy(); window._callFrame = null; }
  }
  if (name !== "backstage") {
    // Clean up backstage channel and call frame
    if (backstageChannel) { db.removeChannel(backstageChannel); backstageChannel = null; }
    if (window._backstageFrame) {
      try { window._backstageFrame.destroy(); } catch(e) {}
      window._backstageFrame = null;
    }
  }
  if (name === "detail" && currentEvent) {
    renderDetailView(currentEvent);
  }
  window.scrollTo(0, 0);
}

// ── Events list ───────────────────────────────────────────────────────────────
async function loadEvents(tab) {
  const grid = document.getElementById("events-grid");
  grid.innerHTML = `<p style="color:var(--text-muted);font-size:.9rem">Loading…</p>`;

  // Fetch all non-live events + live events; filter client-side so scheduled
  // events past their end time (scheduled_at + duration_mins) appear in Past.
  // Past events: sort by ended_at desc (most recently ended first), fall back to scheduled_at
  let query = db.from("live_events").select("*");
  if (tab === "upcoming") {
    query = query.in("status", ["scheduled", "live"]).order("scheduled_at", { ascending: true });
  } else {
    query = query.in("status", ["ended", "scheduled"])
      .order("ended_at",    { ascending: false, nullsFirst: false })
      .order("scheduled_at", { ascending: false });
  }

  const { data: rawEvents } = await query;

  const now = Date.now();
  function _effectivelyEnded(ev) {
    if (ev.status === "ended") return true;
    if (ev.status === "live")  return false;
    // scheduled: treat as past if scheduled_at + duration has passed
    const endMs = new Date(ev.scheduled_at).getTime() + (ev.duration_mins || 60) * 60000;
    return endMs <= now;
  }

  const events = (rawEvents || []).filter(ev =>
    tab === "upcoming" ? !_effectivelyEnded(ev) : _effectivelyEnded(ev)
  );

  if (!events || events.length === 0) {
    const emptyIcon = tab === "upcoming"
      ? `<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.35;margin-bottom:12px"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`
      : `<svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.35;margin-bottom:12px"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>`;
    grid.innerHTML = `<div class="empty-state">
      ${emptyIcon}
      <p>${tab === "upcoming" ? "No upcoming events scheduled yet." : "No past replays yet."}</p>
    </div>`;
    return;
  }

  grid.innerHTML = "";

  const eventsToRender = [...events];

  // Renders a labelled section with its own grid.
  // Single-card sections get events-grid--single so the card spans full width.
  function addSection(label, items) {
    const h = document.createElement("div");
    h.className = "events-section-heading";
    h.textContent = label;
    grid.appendChild(h);

    const g = document.createElement("div");
    g.className = "events-grid" + (items.length === 1 ? " events-grid--single" : "");
    items.forEach(ev => g.appendChild(buildEventCard(ev)));
    grid.appendChild(g);
  }

  if (tab === "past") {
    const [latest, ...rest] = eventsToRender;
    addSection("Last Live Session", [latest]);
    if (rest.length > 0) addSection("Previous Live Sessions", rest);
    return;
  }

  if (tab === "upcoming") {
    const [next, ...rest] = eventsToRender;
    addSection("Next Live Session", [next]);
    if (rest.length > 0) addSection("Future Live Sessions", rest);
    return;
  }

  eventsToRender.forEach(ev => grid.appendChild(buildEventCard(ev)));
}

}

  // Recording player (or processing indicator)
  const recordingHtml = ev.mux_playback_id ? `

  // Countdown (scheduled only)

    : ev.status === "scheduled"

  // Live preview: detect 412 "stream not active yet" and show a starting indicator
  // that auto-retries until RTMP starts flowing.
  if (ev.status === "live" && ev.mux_live_playback_id) {
    const player   = document.getElementById("live-preview-player");
    const starting = document.getElementById("live-preview-starting");
    let retryTimer = null;

    const wrap = document.getElementById("live-preview-wrap");
    const pid  = ev.mux_live_playback_id;

    function showStarting() {
      if (player)   player.style.display   = "none";
      if (starting) starting.style.display = "flex";
    }
    function showPlayer(p) {
      if (starting) starting.style.display = "none";
      if (p) p.style.display = "block";
    }
    function spawnPlayer() {
      // Fully replace the player element — attribute toggle doesn't work on iOS Safari
      if (!wrap) return;
      const old = document.getElementById("live-preview-player");
      if (old) old.remove();
      const p = document.createElement("mux-player");
      p.id = "live-preview-player";
      p.setAttribute("playback-id", pid);
