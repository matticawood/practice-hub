<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Feedback & Roadmap — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icon-192.png"  />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js?v=2026071801"></script>
  <style>
    /* ── Light theme override (style.css defaults to dark) ── */
    :root {
      --bg:#faf7f3; --surface:#ffffff; --surface-2:#f1f1f4; --border:#e3e1e6;
      --text:#1a1410; --text-muted:#8a7868; --accent:#f5c518; --radius:12px;
    }
    body { background: var(--bg); min-height: 100vh; min-height: 100dvh; }

    /* ── Page layout ── */
    #feedback-main {
      max-width: 760px;
      margin: 0 auto;
      padding: 28px 18px 96px;
    }

    /* ── Hero header panel ── */
    .fb-hero {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 18px 20px 14px; margin-bottom: 18px;
      box-shadow: 0 1px 3px rgba(60,40,20,.05);
      animation: fbCardIn .34s cubic-bezier(.22,.61,.36,1) both;
    }
    .fb-hero-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .fb-hero-lead { display: flex; align-items: center; gap: 13px; min-width: 0; }
    .fb-hero-icon {
      width: 44px; height: 44px; border-radius: 13px; flex-shrink: 0;
      background: linear-gradient(150deg, #f7d24a, #f5c518); color: #3a2c00;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 7px 16px -7px rgba(245,197,24,.75);
    }
    .fb-hero-icon svg { width: 23px; height: 23px; }
    .fb-hero h2 {
      font-size: 1.22rem; font-weight: 800; color: var(--text); margin: 0;
      letter-spacing: -.01em; line-height: 1.2;
    }
    .fb-hero p {
      font-size: 0.8rem; color: var(--text-muted); margin: 3px 0 0;
    }

    /* ── + Submit button ── */
    #submit-btn.btn {
      background: linear-gradient(180deg, #f7d24a, #f5c518);
      color: #3a2c00; border: none; font-weight: 700;
      padding: 9px 16px; border-radius: 99px; font-size: 0.84rem;
      box-shadow: 0 7px 16px -7px rgba(245,197,24,.7); cursor: pointer;
      transition: transform .12s, box-shadow .15s; white-space: nowrap; flex-shrink: 0;
    }
    #submit-btn.btn:hover { box-shadow: 0 9px 20px -7px rgba(245,197,24,.8); }
    #submit-btn.btn:active { transform: scale(.96); }

    /* ── Filter bar (inside hero) ── */
    .fb-filter-bar {
      display: flex; gap: 7px; flex-wrap: nowrap;
      margin-top: 14px; padding: 14px 2px 2px; border-top: 1px solid var(--border);
      overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
      -webkit-mask-image: linear-gradient(to right, black calc(100% - 28px), transparent 100%);
      mask-image: linear-gradient(to right, black calc(100% - 28px), transparent 100%);
    }
    .fb-filter-bar::-webkit-scrollbar { display: none; }
    .fb-filter-bar.at-end { -webkit-mask-image: none; mask-image: none; }
    .fb-filter {
      background: var(--surface-2); border: 1.5px solid transparent;
      color: var(--text-muted); padding: 6px 14px; flex-shrink: 0;
      border-radius: 99px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
      transition: all .15s; font-family: inherit; white-space: nowrap;
    }
    .fb-filter:hover { background: #e8e6ea; color: var(--text); }
    .fb-filter.active {
      border-color: var(--accent); color: #6b5400;
      background: rgba(245,197,24,.14);
    }

    /* ── Cards ── */
    .fb-cards { display: flex; flex-direction: column; gap: 12px; }
    .fb-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 18px;
      display: flex; gap: 14px; align-items: flex-start;
      box-shadow: 0 1px 3px rgba(60,40,20,.05);
      transition: box-shadow .18s, transform .18s, border-color .18s;
      animation: fbCardIn .32s cubic-bezier(.22,.61,.36,1) both;
    }
    .fb-card:hover { box-shadow: 0 6px 18px -8px rgba(60,40,20,.18); border-color: #d6d1c8; }
    @keyframes fbCardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .fb-vote-col {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      flex-shrink: 0; min-width: 38px;
    }
    .fb-upvote-btn {
      background: var(--surface-2); border: 1.5px solid var(--border); color: var(--text-muted);
      width: 36px; height: 30px; border-radius: 8px; cursor: pointer;
      font-size: 0.8rem; transition: all .15s;
      display: flex; align-items: center; justify-content: center;
    }
    .fb-upvote-btn:hover { border-color: #d6d1c8; color: var(--text); }
    .fb-upvote-btn.voted {
      border-color: var(--accent); color: #6b5400;
      background: rgba(245,197,24,.16);
    }
    .fb-vote-num { font-size: 0.82rem; font-weight: 800; color: var(--text); }
    .fb-card-body { flex: 1; min-width: 0; }
    .fb-card-title { font-size: 0.94rem; font-weight: 700; color: var(--text); margin-bottom: 5px; line-height: 1.35; }
    .fb-card-desc { font-size: 0.83rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 8px; }
    .fb-card-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .fb-badge {
      display: inline-flex; align-items: center;
      padding: 3px 9px; border-radius: 99px;
      font-size: 0.68rem; font-weight: 700; letter-spacing: .01em;
    }
    .fb-badge-bug     { background: rgba(239,68,68,.12);  color: #dc2626; }
    .fb-badge-feature { background: rgba(99,102,241,.12); color: #4f46e5; }
    .fb-badge-general { background: rgba(100,116,139,.12);color: #475569; }
    .fb-badge-open    { background: rgba(100,116,139,.1); color: #64748b; }
    .fb-badge-planned { background: rgba(37,99,235,.12);  color: #2563eb; }
    .fb-badge-added,
    .fb-badge-fixed   { background: rgba(22,163,74,.12);  color: #15803d; }
    .fb-badge-declined{ background: rgba(100,116,139,.1); color: #64748b; }
    .fb-card-author { font-size: 0.73rem; color: var(--text-muted); }
    .fb-admin-note {
      margin-top: 10px; padding: 9px 12px;
      background: rgba(22,163,74,.08); border: 1px solid rgba(22,163,74,.2);
      border-radius: 9px; font-size: 0.8rem; color: #15803d; line-height: 1.45;
    }
    .fb-admin-row { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .fb-admin-row select, .fb-admin-row input {
      background: var(--surface); border: 1.5px solid var(--border); color: var(--text);
      padding: 6px 9px; border-radius: 7px; font-size: 0.77rem; font-family: inherit;
    }
    .fb-admin-row select:focus, .fb-admin-row input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,197,24,.18); }
    .fb-admin-row input { flex: 1; min-width: 100px; }
    .fb-admin-row button {
      background: var(--surface); border: 1.5px solid var(--border); color: var(--text-muted);
      padding: 6px 12px; border-radius: 7px; font-size: 0.77rem; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: all .15s;
    }
    .fb-admin-row button:hover { border-color: var(--accent); color: #6b5400; }
    .fb-admin-row .fb-delete-btn {
      margin-left: auto; border-color: rgba(220,38,38,.3); color: #dc2626;
      display: inline-flex; align-items: center; justify-content: center; padding: 6px 8px;
    }
    .fb-admin-row .fb-delete-btn:hover { border-color: #dc2626; color: #fff; background: #dc2626; }
    .fb-admin-row .fb-delete-btn svg { width: 14px; height: 14px; display: block; }

    /* ── Replies ── */
    .fb-replies { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); }
    .fb-reply-item {
      display: flex; flex-direction: column; gap: 3px;
      padding: 9px 11px; border-radius: 9px;
      margin-bottom: 6px; font-size: 0.8rem;
      background: var(--surface); border: 1px solid var(--border);
      animation: fbReplyIn .28s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes fbReplyIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .fb-reply-item-meta { display: flex; align-items: center; gap: 7px; color: var(--text-muted); font-size: 0.72rem; }
    .fb-reply-item-name { font-weight: 700; color: var(--text); }
    .fb-reply-owner { background: rgba(245,197,24,.08); border-color: rgba(245,197,24,.28); }
    .fb-reply-owner .fb-reply-item-name { color: #6b5400; }
    .fb-reply-item-body { color: var(--text); line-height: 1.5; }
    .fb-reply-input-row {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 0; opacity: 0; margin-top: 0; overflow: hidden;
      transition: max-height .3s cubic-bezier(.22,.61,.36,1), opacity .22s ease, margin-top .3s ease;
    }
    .fb-reply-input-row.open { max-height: 340px; opacity: 1; margin-top: 8px; }
    .fb-reply-input-row textarea {
      background: var(--surface); border: 1.5px solid var(--border); color: var(--text);
      padding: 8px 10px; border-radius: 8px; font-size: 0.82rem;
      font-family: inherit; resize: none; overflow-y: hidden; line-height: 1.45;
      min-height: 56px;
    }
    .fb-reply-input-row textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,197,24,.18); }
    .fb-reply-actions { display: flex; gap: 8px; align-items: center; }
    .fb-reply-send-btn {
      background: linear-gradient(180deg, #f7d24a, #f5c518); border: none; color: #3a2c00;
      padding: 6px 16px; border-radius: 8px; font-size: 0.78rem; font-weight: 700; cursor: pointer;
      box-shadow: 0 5px 12px -6px rgba(245,197,24,.7); transition: transform .12s;
    }
    .fb-reply-send-btn:active { transform: scale(.96); }
    .fb-reply-cancel-btn { background: none; border: none; color: var(--text-muted); padding: 6px 8px; font-size: 0.78rem; cursor: pointer; font-family: inherit; }
    .fb-reply-cancel-btn:hover { color: var(--text); }
    .fb-reply-btn {
      background: var(--surface); border: 1.5px solid var(--border); color: var(--text-muted);
      padding: 5px 12px; border-radius: 8px; font-size: 0.74rem; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: inherit;
      transition: all .15s;
    }
    .fb-reply-btn:hover { border-color: #d6d1c8; color: var(--text); }
    .fb-reply-count { font-size: 0.73rem; color: var(--text-muted); font-weight: 600; margin-top: 6px; }
    .fb-reply-delete-btn { background: none; border: none; color: var(--text-muted); padding: 0 4px; font-size: 0.9rem; line-height: 1; cursor: pointer; margin-left: auto; transition: color .15s; }
    .fb-reply-delete-btn:hover { color: #dc2626; }

    /* ── Empty / loading ── */
    .fb-empty { text-align: center; padding: 56px 20px; color: var(--text-muted); font-size: 0.9rem; }

    /* ── Submit modal ── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(26,20,16,.45); z-index: 200;
      -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px);
      display: flex; align-items: center; justify-content: center; padding: 18px;
      opacity: 0; pointer-events: none; transition: opacity .2s;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .fb-modal {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 18px; padding: 24px 22px; width: 100%; max-width: 480px;
      box-shadow: 0 24px 60px -16px rgba(26,20,16,.4);
      transform: translateY(20px) scale(.98); transition: transform .24s cubic-bezier(.22,.61,.36,1);
    }
    .modal-overlay.open .fb-modal { transform: none; }
    .fb-modal-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px;
    }
    .fb-modal-header h2 { font-size: 1.1rem; font-weight: 800; color: var(--text); margin: 0; letter-spacing: -.01em; }
    .modal-x-btn {
      background: var(--surface-2); border: none; color: var(--text-muted); font-size: 0.95rem;
      cursor: pointer; width: 30px; height: 30px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; transition: all .15s;
    }
    .modal-x-btn:hover { color: var(--text); background: var(--border); }
    .form-label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing: .06em; }
    .form-input {
      width: 100%; background: var(--surface); border: 1.5px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 10px 12px;
      font-size: 0.9rem; font-family: inherit; transition: border-color .15s, box-shadow .15s; box-sizing: border-box;
    }
    .form-input:hover { border-color: #d6d1c8; }
    .form-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(245,197,24,.18); }

    /* ── Modal action buttons ── */
    .fb-modal .btn {
      padding: 11px 16px; border-radius: 10px; font-size: 0.88rem; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: transform .12s, box-shadow .15s; border: none;
    }
    .fb-modal .btn:active { transform: scale(.97); }
    .fb-modal #fb-submit-btn {
      background: linear-gradient(180deg, #f7d24a, #f5c518); color: #3a2c00;
      box-shadow: 0 7px 16px -7px rgba(245,197,24,.7);
    }
    .fb-modal .btn-ghost {
      background: var(--surface); border: 1.5px solid var(--border); color: var(--text-muted);
    }
    .fb-modal .btn-ghost:hover { border-color: #d6d1c8; color: var(--text); }

    /* ── Toast ── */
    #fb-toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px);
      background: #1a1410; border: none; color: #fff;
      padding: 11px 22px; border-radius: 12px; font-size: 0.88rem; font-weight: 600;
      box-shadow: 0 12px 30px -8px rgba(26,20,16,.5);
      opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
      z-index: 9999; white-space: nowrap;
    }
    #fb-toast.visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- ── Header (populated by shared-header.js) ── -->
<header id="app-header" style="display:none"></header>

<!-- ── Tab bar injected by shared-header.js ── -->

<main id="feedback-main">

  <!-- Hero header panel -->
  <div class="fb-hero">
    <div class="fb-hero-top">
      <div class="fb-hero-lead">
        <div class="fb-hero-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="9" y1="18" x2="15" y2="18"></line>
            <line x1="10" y1="22" x2="14" y2="22"></line>
            <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"></path>
          </svg>
        </div>
        <div>
          <h2>Feedback & Roadmap</h2>
          <p>Feature requests, bug reports, and ideas</p>
        </div>
      </div>
      <button class="btn btn-sm" id="submit-btn" onclick="openFbModal()" style="display:none">+ Submit</button>
    </div>

    <!-- Filter bar -->
    <div class="fb-filter-bar" id="fb-filter-bar">
      <button class="fb-filter active" data-fbf="all"     onclick="setFbFilter('all')">All</button>
      <button class="fb-filter"        data-fbf="feature"  onclick="setFbFilter('feature')">Features</button>
      <button class="fb-filter"        data-fbf="bug"      onclick="setFbFilter('bug')">Bugs</button>
      <button class="fb-filter"        data-fbf="general"  onclick="setFbFilter('general')">General</button>
      <button class="fb-filter"        data-fbf="planned"  onclick="setFbFilter('planned')">Planned</button>
      <button class="fb-filter"        data-fbf="done"     onclick="setFbFilter('done')">Done</button>
    </div>
  </div>

  <!-- Content -->
  <div id="fb-loading" style="padding:32px;text-align:center;color:var(--text-muted);font-size:0.88rem">Loading…</div>
  <div id="fb-cards" class="fb-cards" style="display:none"></div>
  <div id="fb-empty" class="fb-empty" style="display:none">Nothing here yet. Be the first!</div>

</main>

<!-- ── Submit modal ── -->
<div class="modal-overlay" id="fb-modal-overlay" onmousedown="handleFbOverlayDown(event)" onclick="handleFbOverlayClick(event)">
  <div class="fb-modal">
    <div class="fb-modal-header">
      <h2>Submit Feedback</h2>
      <button class="modal-x-btn" onclick="closeFbModal()">✕</button>
    </div>
    <div style="margin-bottom:14px">
      <label class="form-label">Category</label>
      <select id="fb-cat" class="form-input">
        <option value="feature">Feature Request</option>
        <option value="bug">Bug Report</option>
        <option value="general">General Feedback</option>
      </select>
    </div>
    <div style="margin-bottom:14px">
      <label class="form-label">Title <span style="color:#ef4444">*</span></label>
      <input id="fb-title-inp" class="form-input" placeholder="Short summary…" maxlength="120" />
    </div>
    <div style="margin-bottom:20px">
      <label class="form-label">More detail (optional)</label>
      <textarea id="fb-body-inp" class="form-input" rows="3" style="min-height:84px;resize:none;overflow-y:hidden" placeholder="Steps to reproduce, extra context…" oninput="_fbAutoGrow(this, 200)"></textarea>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-ghost" onclick="closeFbModal()" style="flex:1">Cancel</button>
      <button class="btn" id="fb-submit-btn" onclick="submitFbItem()" style="flex:2">Submit</button>
    </div>
  </div>
</div>

<!-- ── Toast ── -->
<div id="fb-toast"></div>

<script>
const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNER_EMAIL   = "matthew@matthewcawood.com";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let myEmail  = null;
let myName   = null;
let isAdmin  = false;
let _fbData    = [];
let _fbReplies = {};
let _fbFilter  = "all";

// ── Helpers ──────────────────────────────────────────────────────────
function isOwner() { return isAdmin; }

function showToast(msg, duration = 3000) {
  const el = document.getElementById("fb-toast");
  el.textContent = msg;
  el.classList.add("visible");
  setTimeout(() => el.classList.remove("visible"), duration);
}

function _fbEsc(s) {
  return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// Auto-grow a textarea as the user types, capped so it never balloons.
function _fbAutoGrow(el, max = 150) {
  if (!el) return;
  el.style.height = "auto";
  const h = Math.min(el.scrollHeight, max);
  el.style.height = h + "px";
  el.style.overflowY = el.scrollHeight > max ? "auto" : "hidden";
}

// ── Init ─────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session?.user?.email) {
    // Not signed in — redirect to hub which handles auth
    window.location.replace("/practice-log.html");
    return;
  }

  myEmail = session.user.email;
  isAdmin = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  const { data: ae } = await db.from("allowed_emails")
    .select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = ae?.name || myEmail.split("@")[0];

  // Show submit button now we know the user is signed in
  document.getElementById("submit-btn").style.display = "";

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "hub", avatarUrl: ae?.avatar_url || null });

  await loadFbItems();
})();

// ── Load & render ─────────────────────────────────────────────────────
async function loadFbItems() {
  document.getElementById("fb-loading").style.display = "block";
  document.getElementById("fb-cards").style.display   = "none";
  document.getElementById("fb-empty").style.display   = "none";

  const { data, error } = await db
    .from("feedback")
    .select("*")
    .order("upvotes",    { ascending: false })
    .order("created_at", { ascending: false });

  document.getElementById("fb-loading").style.display = "none";

  if (error) {
    document.getElementById("fb-empty").style.display = "block";
    document.getElementById("fb-empty").textContent = "Failed to load. Please try again.";
    return;
  }

  _fbData = data || [];
  _fbReplies = {};
  _fbData.forEach(f => { _fbReplies[f.id] = Array.isArray(f.replies) ? f.replies : []; });
  renderFbItems();
}

function setFbFilter(f) {
  _fbFilter = f;
  document.querySelectorAll(".fb-filter").forEach(b =>
    b.classList.toggle("active", b.dataset.fbf === f)
  );
  renderFbItems();
}

function renderFbItems() {
  const cardsEl = document.getElementById("fb-cards");
  const emptyEl = document.getElementById("fb-empty");
  if (!cardsEl || !emptyEl) return;

  let items = _fbData;
  if (_fbFilter === "done") {
    items = items.filter(f => f.status === "added" || f.status === "fixed");
  } else {
    // Hide completed items from every other tab — they only live in "Done" now.
    items = items.filter(f => f.status !== "added" && f.status !== "fixed");
    if (_fbFilter !== "all") {
      if (["planned","declined"].includes(_fbFilter)) {
        items = items.filter(f => f.status === _fbFilter);
      } else {
        items = items.filter(f => f.category === _fbFilter);
      }
    }
  }

  if (!items.length) {
    cardsEl.style.display = "none";
    emptyEl.style.display = "block";
    emptyEl.textContent = _fbFilter === "all"
      ? "No feedback yet. Be the first to submit!"
      : "Nothing in this category yet.";
    return;
  }

  emptyEl.style.display = "none";
  cardsEl.style.display = "flex";

  const CAT_LABEL = { bug: "Bug", feature: "Feature", general: "General" };
  const ST_LABEL  = { open: "Open", planned: "Planned", added: "Added", fixed: "Fixed", declined: "Declined" };

  cardsEl.innerHTML = items.map(fb => {
    const upvotedBy = Array.isArray(fb.upvoted_by) ? fb.upvoted_by : [];
    const hasVoted  = myEmail && upvotedBy.includes(myEmail);
    const name = fb.display_name || (fb.email?.split("@")[0] ?? "Anonymous");
    const date = new Date(fb.created_at).toLocaleDateString("en-GB", { day:"numeric", month:"short" });
    const adminRow = isOwner() ? `
      <div class="fb-admin-row">
        <select id="fbst-${fb.id}">
          ${["open","planned","added","fixed","declined"].map(s =>
            `<option value="${s}" ${fb.status===s?"selected":""}>${ST_LABEL[s]}</option>`
          ).join("")}
        </select>
        <input id="fbn-${fb.id}" placeholder="Admin note…" value="${_fbEsc(fb.admin_note||"")}" />
        <button onclick="saveFbAdmin('${fb.id}')">Save</button>
        <button class="fb-delete-btn" onclick="deleteFbItem('${fb.id}')" title="Delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg></button>
      </div>` : "";
    const replyCount = (_fbReplies[fb.id] || []).length;
    const replyCountHtml = replyCount > 0
      ? `<div class="fb-reply-count">${replyCount} ${replyCount === 1 ? "reply" : "replies"}</div>`
      : "";
    return `
      <div class="fb-card" id="fbc-${fb.id}">
        <div class="fb-vote-col">
          <button class="fb-upvote-btn ${hasVoted?"voted":""}" id="fbv-${fb.id}"
            onclick="toggleFbVote('${fb.id}')" title="${hasVoted?"Remove vote":"Upvote"}">▲</button>
          <span class="fb-vote-num" id="fbvn-${fb.id}">${fb.upvotes}</span>
        </div>
        <div class="fb-card-body">
          <div class="fb-card-title">${_fbEsc(fb.title)}</div>
          ${fb.body ? `<div class="fb-card-desc">${_fbEsc(fb.body)}</div>` : ""}
          <div class="fb-card-meta">
            <span class="fb-badge fb-badge-${fb.category}">${CAT_LABEL[fb.category]||fb.category}</span>
            ${fb.status!=="open"?`<span class="fb-badge fb-badge-${fb.status}">${ST_LABEL[fb.status]||fb.status}</span>`:""}
            <span class="fb-card-author">${_fbEsc(name)} · ${date}</span>
          </div>
          ${fb.admin_note?`<div class="fb-admin-note">${_fbEsc(fb.admin_note)}</div>`:""}
          ${adminRow}
          ${replyCountHtml}
          <div class="fb-replies" id="fb-replies-${fb.id}">
            ${_fbRepliesHTML(fb.id)}
          </div>
        </div>
      </div>`;
  }).join("");
}

// ── Upvote ────────────────────────────────────────────────────────────
async function toggleFbVote(id) {
  if (!myEmail) return;
  const fb  = _fbData.find(f => f.id === id);
  if (!fb) return;
  const btn = document.getElementById("fbv-" + id);
  const num = document.getElementById("fbvn-" + id);
  if (btn) btn.disabled = true;

  const { data, error } = await db.rpc("toggle_feedback_upvote", { p_id: id, p_email: myEmail });
  if (error) { console.warn(error); if (btn) btn.disabled = false; return; }

  const upvoted = data?.upvoted;
  if (upvoted) {
    fb.upvotes++;
    if (!fb.upvoted_by) fb.upvoted_by = [];
    if (!fb.upvoted_by.includes(myEmail)) fb.upvoted_by.push(myEmail);
  } else {
    fb.upvotes = Math.max(0, fb.upvotes - 1);
    fb.upvoted_by = (fb.upvoted_by || []).filter(e => e !== myEmail);
  }
  if (btn) { btn.disabled = false; btn.classList.toggle("voted", !!upvoted); }
  if (num) num.textContent = fb.upvotes;
}

// ── Admin: save status / note ─────────────────────────────────────────
async function saveFbAdmin(id) {
  const statusEl = document.getElementById("fbst-" + id);
  const noteEl   = document.getElementById("fbn-"  + id);
  const { error } = await db.rpc("admin_update_feedback", {
    p_id: id, p_status: statusEl?.value, p_note: noteEl?.value?.trim() || null
  });
  if (error) { showToast("Error: " + error.message, 3000); return; }
  const fb = _fbData.find(f => f.id === id);
  if (fb) { fb.status = statusEl.value; fb.admin_note = noteEl.value?.trim() || null; }
  renderFbItems();
  showToast("✓ Updated", 2000);
}

// ── Admin: delete item ────────────────────────────────────────────────
async function deleteFbItem(id) {
  if (!isOwner()) return;
  if (!confirm("Delete this feedback item permanently?")) return;
  const { error } = await db.from("feedback").delete().eq("id", id);
  if (error) { showToast("Error: " + error.message, 3000); return; }
  _fbData = _fbData.filter(f => f.id !== id);
  renderFbItems();
  showToast("✓ Deleted", 2000);
}

// ── Submit modal ──────────────────────────────────────────────────────
function openFbModal() {
  const el = document.getElementById("fb-modal-overlay");
  if (el) { el.style.display = "flex"; setTimeout(() => el.classList.add("open"), 10); }
  setTimeout(() => document.getElementById("fb-title-inp")?.focus(), 50);
}
function closeFbModal() {
  const el = document.getElementById("fb-modal-overlay");
  if (el) { el.classList.remove("open"); setTimeout(() => el.style.display = "none", 220); }
}
// Only close when the press STARTED on the backdrop — otherwise selecting text
// inside the dialog and releasing the mouse over the backdrop would close it.
let _fbDownOnOverlay = false;
function handleFbOverlayDown(e) {
  _fbDownOnOverlay = (e.target === document.getElementById("fb-modal-overlay"));
}
function handleFbOverlayClick(e) {
  if (_fbDownOnOverlay && e.target === document.getElementById("fb-modal-overlay")) closeFbModal();
  _fbDownOnOverlay = false;
}

async function submitFbItem() {
  const category = document.getElementById("fb-cat")?.value;
  const title    = document.getElementById("fb-title-inp")?.value?.trim();
  const body     = document.getElementById("fb-body-inp")?.value?.trim();
  if (!title) { document.getElementById("fb-title-inp")?.focus(); return; }

  const btn = document.getElementById("fb-submit-btn");
  if (btn) { btn.disabled = true; btn.textContent = "Submitting…"; }

  const displayName = myName || myEmail?.split("@")[0] || null;
  const { data, error } = await db.from("feedback")
    .insert({ email: myEmail, display_name: displayName, category, title, body: body || null })
    .select().single();

  if (btn) { btn.disabled = false; btn.textContent = "Submit"; }
  if (error) { showToast("Error: " + error.message, 4000); return; }

  _fbData.unshift(data);
  closeFbModal();
  document.getElementById("fb-title-inp").value = "";
  const _bodyInp = document.getElementById("fb-body-inp");
  _bodyInp.value = "";
  _fbAutoGrow(_bodyInp, 200);
  setFbFilter("all");
  showToast("✓ Feedback submitted. Thanks!", 3000);

  // Notify the owner when someone else posts
  if (myEmail.toLowerCase() !== OWNER_EMAIL.toLowerCase()) {
    const posterName = displayName || myEmail.split("@")[0];
    await db.from("notifications").insert({
      email:    OWNER_EMAIL,
      type:     "app_update",
      title:    `${posterName} posted new feedback`,
      body:     title.length > 100 ? title.slice(0, 100) + "…" : title,
      link_url: null,
      read:     false
    });
  }
}

// ── Replies ───────────────────────────────────────────────────────────
function _fbRepliesHTML(feedbackId) {
  const replies = _fbReplies[feedbackId] || [];
  const replyItems = replies.map(r => {
    const rName = _fbEsc(r.display_name || r.email?.split("@")[0] || "Anonymous");
    const rDate = new Date(r.created_at).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
    const ownerClass = r.is_owner ? " fb-reply-owner" : "";
    const deleteBtn  = isOwner()
      ? `<button class="fb-reply-delete-btn" onclick="deleteFbReply('${r.id}','${feedbackId}')" title="Delete reply">×</button>`
      : "";
    return `
      <div class="fb-reply-item${ownerClass}" id="fbr-${r.id}">
        <div class="fb-reply-item-meta">
          <span class="fb-reply-item-name">${rName}</span>
          <span>${rDate}</span>
          ${deleteBtn}
        </div>
        <div class="fb-reply-item-body">${_fbEsc(r.body)}</div>
      </div>`;
  }).join("");

  return `
    ${replyItems}
    <button class="fb-reply-btn" onclick="toggleFbReply('${feedbackId}')">Reply</button>
    <div class="fb-reply-input-row" id="fb-reply-input-${feedbackId}">
      <textarea id="fb-reply-ta-${feedbackId}" rows="2" placeholder="Write a reply…" oninput="_fbAutoGrow(this, 140)"></textarea>
      <div class="fb-reply-actions">
        <button class="fb-reply-send-btn" onclick="submitFbReply('${feedbackId}')">Send</button>
        <button class="fb-reply-cancel-btn" onclick="toggleFbReply('${feedbackId}')">Cancel</button>
      </div>
    </div>`;
}

function toggleFbReply(feedbackId) {
  const row = document.getElementById("fb-reply-input-" + feedbackId);
  if (!row) return;
  const isOpen = row.classList.contains("open");
  row.classList.toggle("open", !isOpen);
  if (!isOpen) document.getElementById("fb-reply-ta-" + feedbackId)?.focus();
}

async function submitFbReply(feedbackId) {
  if (!myEmail) return;
  const ta   = document.getElementById("fb-reply-ta-" + feedbackId);
  const body = ta?.value?.trim();
  if (!body) { ta?.focus(); return; }

  const sendBtn = document.querySelector(`#fb-reply-input-${feedbackId} .fb-reply-send-btn`);
  if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = "Sending…"; }

  const displayName = myName || myEmail?.split("@")[0] || null;
  const { data: newReply, error } = await db.rpc("add_feedback_reply", {
    p_feedback_id:  feedbackId,
    p_email:        myEmail,
    p_display_name: displayName,
    p_body:         body,
    p_is_owner:     isOwner()
  });

  if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = "Send"; }
  if (error) { showToast("Error: " + error.message, 3000); return; }

  if (!_fbReplies[feedbackId]) _fbReplies[feedbackId] = [];
  if (newReply) _fbReplies[feedbackId].push(newReply);

  const fbIdx = _fbData.findIndex(f => f.id === feedbackId);
  if (fbIdx !== -1) _fbData[fbIdx].replies = _fbReplies[feedbackId];

  // Notify thread participants
  const origPost = _fbData.find(f => f.id === feedbackId);
  if (origPost) {
    const replierName  = displayName || "Someone";
    const shortTitle   = origPost.title?.length > 50 ? origPost.title.slice(0, 50) + "…" : origPost.title;
    const notifBody    = `"${shortTitle}" — ${body.length > 80 ? body.slice(0,80) + "…" : body}`;
    const previousReplies = _fbReplies[feedbackId]?.slice(0, -1) || [];
    const toNotify = new Set();
    if (origPost.email) toNotify.add(origPost.email.toLowerCase());
    previousReplies.forEach(r => { if (r.email) toNotify.add(r.email.toLowerCase()); });
    toNotify.delete(myEmail.toLowerCase());
    for (const email of toNotify) {
      await db.from("notifications").insert({
        email, type: "comment_reply",
        title: `${replierName} replied to a feedback thread`,
        body:  notifBody,
        link_url: `/feedback.html?thread=${feedbackId}`,
        read: false,
      });
    }
  }

  if (ta) ta.value = "";
  const repliesEl = document.getElementById("fb-replies-" + feedbackId);
  if (repliesEl) repliesEl.innerHTML = _fbRepliesHTML(feedbackId);

  const count   = _fbReplies[feedbackId].length;
  const cardBody = document.querySelector(`#fbc-${feedbackId} .fb-card-body`);
  if (cardBody) {
    let countEl = cardBody.querySelector(".fb-reply-count");
    if (!countEl) {
      countEl = document.createElement("div");
      countEl.className = "fb-reply-count";
      cardBody.insertBefore(countEl, document.getElementById("fb-replies-" + feedbackId));
    }
    countEl.textContent = `${count} ${count === 1 ? "reply" : "replies"}`;
  }
}

async function deleteFbReply(replyId, feedbackId) {
  if (!isOwner()) return;
  const { error } = await db.rpc("delete_feedback_reply", {
    p_feedback_id: feedbackId, p_reply_id: replyId
  });
  if (error) { showToast("Error: " + error.message, 3000); return; }

  if (_fbReplies[feedbackId]) {
    _fbReplies[feedbackId] = _fbReplies[feedbackId].filter(r => r.id !== replyId);
  }
  const fbIdx = _fbData.findIndex(f => f.id === feedbackId);
  if (fbIdx !== -1) _fbData[fbIdx].replies = _fbReplies[feedbackId];

  const repliesEl = document.getElementById("fb-replies-" + feedbackId);
  if (repliesEl) repliesEl.innerHTML = _fbRepliesHTML(feedbackId);

  const count    = (_fbReplies[feedbackId] || []).length;
  const cardBody = document.querySelector(`#fbc-${feedbackId} .fb-card-body`);
  if (cardBody) {
    const countEl = cardBody.querySelector(".fb-reply-count");
    if (countEl) {
      count === 0 ? countEl.remove()
                  : (countEl.textContent = `${count} ${count === 1 ? "reply" : "replies"}`);
    }
  }
  showToast("✓ Reply deleted", 2000);
}

// ── Filter bar scroll fade ────────────────────────────────────────────
// Drop the right-edge mask once the row is scrolled to the end (or fully fits).
(function () {
  const row = document.getElementById("fb-filter-bar");
  if (!row) return;
  function update() {
    const atEnd = row.scrollLeft + row.clientWidth >= row.scrollWidth - 2;
    row.classList.toggle("at-end", atEnd);
  }
  update();
  row.addEventListener("scroll", update, { passive: true });
  window.addEventListener("resize", update, { passive: true });
})();
</script>
