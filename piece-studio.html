<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Piece Studio</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f4f2ee; --panel:#fff; --ink:#221f1b; --muted:#6b655c; --line:#e3ded4;
    --accent:#9a6a30; --accent-d:#7c5324; --good:#3f8f5a; --good-bg:#eaf5ee;
    --warn:#b26a1e; --warn-bg:#fbf0e2; --draft:#8a5ea6; --draft-bg:#f2ecf7;
    --danger:#b3403f; --focus:0 0 0 3px rgba(154,106,48,.2);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;font-size:14px}
  h1{font-family:Georgia,serif;font-weight:600;letter-spacing:-.01em}
  a{color:var(--accent-d)}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:1000px;margin:0 auto;padding:24px 18px 120px}

  /* auth */
  #auth{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  #auth h1{font-size:22px;margin:0 0 4px}
  #auth p{color:var(--muted);margin:0 0 18px;font-size:13px}
  .fld{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff;color:var(--ink)}
  .fld:focus{outline:none;border-color:var(--accent);box-shadow:var(--focus)}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-weight:600}
  .btn:hover{background:var(--accent-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .btn.good{background:var(--good)}
  .btn.good:hover{filter:brightness(.94)}
  .btn.danger{background:#fff;color:var(--danger);border:1px solid #e6c9c8}
  .err{color:var(--danger);font-size:12.5px;margin-top:8px;display:none}

  /* header */
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  .topbar h1{font-size:24px;margin:0}
  .spacer{flex:1}
  .tabs{display:flex;gap:6px;margin:16px 0 4px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px}
  .tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .searchbox{flex:1;min-width:180px;max-width:320px}
  .meta{color:var(--muted);font-size:12.5px;margin:8px 2px}

  /* card */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .card.dirty{border-color:var(--warn)}
  .row{display:flex;align-items:center;gap:12px;padding:12px 14px}
  .row:hover{background:#faf8f4}
  .band{flex:0 0 26px;width:26px;height:26px;line-height:26px;text-align:center;border-radius:7px;color:#fff;font-weight:700;font-size:12px}
  .b0{background:#8b8f96}.b1{background:#3f8f86}.b2{background:#4b8a4e}.b3{background:#5566b8}.b4{background:#b5852f}.b5{background:#a4506a}
  .rt{flex:1;min-width:0}
  .rt .t{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rt .c{color:var(--muted);font-size:12.5px}
  .badge{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px;border-radius:999px}
  .badge.draft{background:var(--draft-bg);color:var(--draft)}
  .badge.pub{background:var(--good-bg);color:var(--good)}
  .chips{display:flex;gap:5px}
  .lchip{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted);text-decoration:none}
  .lchip.ok{color:var(--good);border-color:#bfe3cc;background:var(--good-bg)}
  .lchip.no{color:#b0a99e}
  .exp{border-top:1px solid var(--line);padding:16px;display:none;background:#fcfbf8}
  .card.open .exp{display:block}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field{display:flex;flex-direction:column;gap:4px}
  .field.full{grid-column:1/-1}
  label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  textarea.fld{resize:vertical;min-height:70px;line-height:1.5}
  textarea.big{min-height:120px}
  .linkrow{display:flex;gap:8px;align-items:center}
  .linkrow .fld{flex:1}
  .media{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
  .media .yt img{width:200px;border-radius:8px;border:1px solid var(--line);display:block}
  .media iframe{width:280px;height:200px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .diffpick{display:flex;gap:5px}
  .diffpick button{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:700}
  .diffpick button.on{color:#fff}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .savednote{color:var(--good);font-size:12.5px;font-weight:600;display:none}
  .empty{text-align:center;color:var(--muted);padding:50px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
  .toast.show{opacity:1}
  @media(max-width:620px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <h1>Piece Studio</h1>
  <p>Owner sign-in. Review, edit and publish library pieces.</p>
  <div id="step-email">
    <input class="fld" id="auth-email" type="email" placeholder="you@email.com" autocomplete="email">
    <div class="err" id="auth-err"></div>
    <button class="btn" style="margin-top:12px;width:100%" onclick="sendOTP()">Send code</button>
  </div>
  <div id="step-otp" style="display:none">
    <input class="fld" id="auth-otp" inputmode="numeric" placeholder="6-digit code">
    <div class="err" id="otp-err"></div>
    <button class="btn" style="margin-top:12px;width:100%" onclick="verifyOTP()">Verify</button>
    <button class="btn ghost sm" style="margin-top:8px" onclick="backEmail()">Back</button>
  </div>
</div>

<!-- APP -->
<div class="wrap" id="app" style="display:none">
  <div class="topbar">
    <h1>Piece Studio</h1>
    <span class="spacer"></span>
    <button class="btn good sm" id="approve-all" onclick="approveAllDrafts()" style="display:none">Approve all drafts</button>
    <button class="btn ghost sm" onclick="signOut()">Sign out</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-f="draft">Drafts <span id="c-draft"></span></button>
    <button class="tab" data-f="published">Published <span id="c-pub"></span></button>
    <button class="tab" data-f="all">All <span id="c-all"></span></button>
    <input class="fld searchbox" id="search" placeholder="Search title, composer, tag…">
  </div>
  <div class="meta" id="meta"></div>
  <div id="list"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNER_EMAIL   = "matthew@matthewcawood.com";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let otpEmail = "";
let PIECES = [];
let filter = "draft";
let query = "";
const openIds = new Set();

/* ---------- auth ---------- */
async function sendOTP(){
  const email=document.getElementById("auth-email").value.trim().toLowerCase();
  const err=document.getElementById("auth-err"); err.style.display="none";
  if(email!==OWNER_EMAIL){ err.textContent="Owner access only."; err.style.display="block"; return; }
  const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
  if(error){ err.textContent=error.message; err.style.display="block"; return; }
  otpEmail=email;
  document.getElementById("step-email").style.display="none";
  document.getElementById("step-otp").style.display="block";
  setTimeout(()=>document.getElementById("auth-otp").focus(),50);
}
async function verifyOTP(){
  const token=document.getElementById("auth-otp").value.trim();
  const err=document.getElementById("otp-err"); err.style.display="none";
  const {error}=await db.auth.verifyOtp({email:otpEmail,token,type:"email"});
  if(error){ err.textContent="Invalid or expired code."; err.style.display="block"; return; }
  await boot();
}
function backEmail(){ document.getElementById("step-otp").style.display="none"; document.getElementById("step-email").style.display="block"; }
async function signOut(){ await db.auth.signOut(); location.reload(); }

async function boot(){
  const {data:{session}}=await db.auth.getSession();
  if(!session || session.user.email!==OWNER_EMAIL){ return; }
  document.getElementById("auth").style.display="none";
  document.getElementById("app").style.display="block";
  await load();
}
async function load(){
  const {data,error}=await db.from("pieces").select("*").eq("kind","piece");
  if(error){ toast("Load failed: "+error.message); return; }
  PIECES=(data||[]).sort((a,b)=>{
    const sa=a.status==="draft"?0:1, sb=b.status==="draft"?0:1;
    if(sa!==sb) return sa-sb;
    // Ignore leading punctuation so a nickname-first title ("'Bethena' ...") files under B.
    const ka=(a.title||"").toLowerCase().replace(/^[^a-z0-9]+/,""), kb=(b.title||"").toLowerCase().replace(/^[^a-z0-9]+/,"");
    return ka.localeCompare(kb);
  });
  render();
}

/* ---------- helpers ---------- */
function esc(s){return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function deburr(s){return (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");}
function ytId(url){ if(!url) return ""; const m=String(url).match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/); return m?m[1]:""; }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
function isPdf(u){ return /\.pdf(\?|$)/i.test(u||""); }

/* ---------- render ---------- */
function counts(){
  const d=PIECES.filter(p=>p.status==="draft").length;
  const pub=PIECES.filter(p=>p.status!=="draft").length;
  document.getElementById("c-draft").textContent="("+d+")";
  document.getElementById("c-pub").textContent="("+pub+")";
  document.getElementById("c-all").textContent="("+PIECES.length+")";
  document.getElementById("approve-all").style.display=d>0?"":"none";
}
function render(){
  counts();
  let rows=PIECES;
  if(filter==="draft") rows=rows.filter(p=>p.status==="draft");
  else if(filter==="published") rows=rows.filter(p=>p.status!=="draft");
  if(query){ const q=deburr(query.toLowerCase());
    rows=rows.filter(p=>deburr([p.title,p.composer,(p.tags||[]).join(" ")].join(" ").toLowerCase()).includes(q)); }
  document.getElementById("meta").textContent=rows.length+" piece"+(rows.length!==1?"s":"");
  const list=document.getElementById("list");
  if(!rows.length){ list.innerHTML='<div class="empty">Nothing here.</div>'; return; }
  list.innerHTML=rows.map(cardHTML).join("");
}
function cardHTML(p){
  const open=openIds.has(p.id);
  const draft=p.status==="draft";
  const b=(p.difficulty==null?0:p.difficulty);
  const sheet=p.sheet_music_url, vid=p.youtube_url;
  return '<div class="card'+(open?" open":"")+'" data-id="'+p.id+'">'+
    '<div class="row" onclick="toggle('+p.id+',event)">'+
      '<span class="band b'+b+'">'+b+'</span>'+
      '<div class="rt"><div class="t">'+esc(p.title)+'</div><div class="c">'+esc(p.composer||"")+(p.year?" · "+p.year:"")+'</div></div>'+
      '<div class="chips">'+
        (sheet?'<a class="lchip ok" href="'+esc(sheet)+'" target="_blank" onclick="event.stopPropagation()">PDF</a>':'<span class="lchip no">PDF</span>')+
        (vid?'<a class="lchip ok" href="'+esc(vid)+'" target="_blank" onclick="event.stopPropagation()">VIDEO</a>':'<span class="lchip no">VIDEO</span>')+
      '</div>'+
      '<span class="badge '+(draft?"draft":"pub")+'">'+(draft?"Draft":"Live")+'</span>'+
    '</div>'+
    (open?editorHTML(p):"")+
  '</div>';
}
function editorHTML(p){
  const b=(p.difficulty==null?0:p.difficulty);
  const yt=ytId(p.youtube_url);
  const diffBtns=[0,1,2,3,4,5].map(n=>'<button class="'+(n===b?"on b"+n:"")+'" onclick="setDiff('+p.id+','+n+')">'+n+'</button>').join("");
  return '<div class="exp" id="exp-'+p.id+'">'+
    '<div class="grid">'+
      '<div class="field full"><label>Title</label><input class="fld" id="f-title-'+p.id+'" value="'+esc(p.title)+'"></div>'+
      '<div class="field"><label>Composer</label><input class="fld" id="f-composer-'+p.id+'" value="'+esc(p.composer||"")+'"></div>'+
      '<div class="field"><label>Year</label><input class="fld" id="f-year-'+p.id+'" value="'+esc(p.year||"")+'"></div>'+
      '<div class="field"><label>Difficulty band</label><div class="diffpick" id="diff-'+p.id+'" data-v="'+b+'">'+diffBtns+'</div></div>'+
      '<div class="field"><label>Tags (comma separated)</label><input class="fld" id="f-tags-'+p.id+'" value="'+esc((p.tags||[]).join(", "))+'"></div>'+
      '<div class="field full"><label>Background</label><textarea class="fld" id="f-background-'+p.id+'">'+esc(p.background||"")+'</textarea></div>'+
      '<div class="field full"><label>Pianist notes</label><textarea class="fld big" id="f-pianist_notes-'+p.id+'">'+esc(p.pianist_notes||"")+'</textarea></div>'+
      '<div class="field full"><label>Challenges &amp; level rationale</label><textarea class="fld big" id="f-challenges-'+p.id+'">'+esc(p.challenges||"")+'</textarea></div>'+
      '<div class="field full"><label>Sheet music URL</label><div class="linkrow"><input class="fld" id="f-sheet_music_url-'+p.id+'" value="'+esc(p.sheet_music_url||"")+'" placeholder="https://…pdf or purchase page"><a class="btn ghost sm" href="'+esc(p.sheet_music_url||"#")+'" target="_blank">Open</a><button class="btn ghost sm" onclick="previewPdf('+p.id+')">Preview</button></div></div>'+
      '<div class="field full"><label>YouTube URL</label><div class="linkrow"><input class="fld" id="f-youtube_url-'+p.id+'" value="'+esc(p.youtube_url||"")+'" placeholder="https://youtube.com/watch?v=…"><a class="btn ghost sm" href="'+esc(p.youtube_url||"#")+'" target="_blank">Open</a></div></div>'+
    '</div>'+
    '<div class="media" id="media-'+p.id+'">'+
      (yt?'<div class="yt"><a href="'+esc(p.youtube_url)+'" target="_blank"><img src="https://i.ytimg.com/vi/'+yt+'/mqdefault.jpg" alt="video thumbnail"></a></div>':'')+
    '</div>'+
    '<div class="actions">'+
      '<button class="btn" onclick="savePiece('+p.id+')">Save changes</button>'+
      (p.status==="draft"
        ? '<button class="btn good" onclick="approve('+p.id+')">Approve &amp; publish</button>'
        : '<button class="btn ghost sm" onclick="unpublish('+p.id+')">Unpublish</button>')+
      '<button class="btn danger sm" onclick="delPiece('+p.id+')">Delete</button>'+
      '<span class="spacer"></span>'+
      '<span class="savednote" id="saved-'+p.id+'">Saved ✓</span>'+
    '</div>'+
  '</div>';
}

/* ---------- interactions ---------- */
function toggle(id,e){ if(e&&e.target.closest("a,button,input,textarea")) return;
  if(openIds.has(id)) openIds.delete(id); else openIds.add(id); render(); }
function setDiff(id,n){ const el=document.getElementById("diff-"+id); el.dataset.v=n;
  [...el.children].forEach((b,i)=>{ b.className=(i===n?"on b"+i:""); }); }
function previewPdf(id){
  const url=document.getElementById("f-sheet_music_url-"+id).value.trim();
  const m=document.getElementById("media-"+id);
  if(!isPdf(url)){ toast("Not a direct PDF link — opening in a new tab instead."); window.open(url,"_blank"); return; }
  let f=m.querySelector("iframe.pdfprev");
  if(f){ f.remove(); return; }
  f=document.createElement("iframe"); f.className="pdfprev"; f.src=url; m.appendChild(f);
}
function gather(id){
  const tags=document.getElementById("f-tags-"+id).value.split(",").map(t=>t.trim()).filter(Boolean);
  const yr=document.getElementById("f-year-"+id).value.trim();
  return {
    title:document.getElementById("f-title-"+id).value.trim(),
    composer:document.getElementById("f-composer-"+id).value.trim(),
    year:yr?parseInt(yr,10):null,
    difficulty:parseInt(document.getElementById("diff-"+id).dataset.v,10),
    tags,
    background:document.getElementById("f-background-"+id).value.trim(),
    pianist_notes:document.getElementById("f-pianist_notes-"+id).value.trim(),
    challenges:document.getElementById("f-challenges-"+id).value.trim(),
    sheet_music_url:document.getElementById("f-sheet_music_url-"+id).value.trim()||null,
    youtube_url:document.getElementById("f-youtube_url-"+id).value.trim()||null
  };
}
async function savePiece(id, extra){
  const patch=Object.assign(gather(id), extra||{});
  const {error}=await db.from("pieces").update(patch).eq("id",id);
  if(error){ toast("Save failed: "+error.message); return false; }
  const p=PIECES.find(x=>x.id===id); Object.assign(p,patch);
  const s=document.getElementById("saved-"+id); if(s){ s.style.display="inline"; setTimeout(()=>s.style.display="none",1600); }
  return true;
}
async function approve(id){ if(await savePiece(id,{status:"published"})){
  // Absorb any member's exact-title custom piece into this now-library piece (moves their
  // practice history too). Fuzzy/near matches are left for Merge Studio review.
  let merged=0; try{ const {data}=await db.rpc("auto_merge_exact_customs",{p_library_piece_id:id}); merged=data||0; }catch(e){}
  toast(merged>0?("Published ✓ — merged "+merged+" member custom piece"+(merged>1?"s":"")):"Published ✓"); render(); } }
async function unpublish(id){ if(await savePiece(id,{status:"draft"})){ toast("Moved to drafts"); render(); } }
async function approveAllDrafts(){
  const drafts=PIECES.filter(p=>p.status==="draft").map(p=>p.id);
  if(!drafts.length) return;
  if(!confirm("Publish all "+drafts.length+" drafts as they are? (Unsaved edits in open cards are not included.)")) return;
  const {error}=await db.from("pieces").update({status:"published"}).in("id",drafts);
  if(error){ toast("Failed: "+error.message); return; }
  PIECES.forEach(p=>{ if(drafts.includes(p.id)) p.status="published"; });
  let mergedTotal=0;
  for(const did of drafts){ try{ const {data}=await db.rpc("auto_merge_exact_customs",{p_library_piece_id:did}); mergedTotal+=(data||0); }catch(e){} }
  toast("Published "+drafts.length+" pieces"+(mergedTotal>0?(" — merged "+mergedTotal+" member custom"):"")); render();
}
async function delPiece(id){
  const p=PIECES.find(x=>x.id===id);
  if(!confirm('Delete "'+(p?p.title:"")+'" permanently? This also removes it from any member collections.')) return;
  await db.from("user_collections").delete().eq("piece_id",id);
  const {error}=await db.from("pieces").delete().eq("id",id);
  if(error){ toast("Delete failed: "+error.message); return; }
  PIECES=PIECES.filter(x=>x.id!==id); openIds.delete(id); toast("Deleted"); render();
}

/* ---------- events ---------- */
document.getElementById("tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab"); if(!t) return;
  filter=t.dataset.f;
  [...document.querySelectorAll(".tab")].forEach(x=>x.classList.toggle("on",x===t));
  render();
});
document.getElementById("search").addEventListener("input",e=>{ query=e.target.value.trim(); render(); });
document.getElementById("auth-otp")&&document.getElementById("auth-otp").addEventListener("keydown",e=>{ if(e.key==="Enter") verifyOTP(); });
document.getElementById("auth-email").addEventListener("keydown",e=>{ if(e.key==="Enter") sendOTP(); });

boot();
</script>
</body>
</html>
