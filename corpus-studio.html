<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corpus Studio · The Practice Room</title>
<link rel="icon" href="/icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* app light theme (body.hub-mode) tokens — kept consistent with the rest of the app */
    --bg:#faf7f3; --panel:#ffffff; --card:#ffffff; --ink:#1a1410; --ink2:#4a443b; --muted:#8a7868;
    --line:#e9e6e1; --line2:#ddd9d2; --gold:#f5c518; --gold-ink:#9c7a12; --gold-soft:#fdf0d8;
    --shadow:0 1px 2px rgba(30,20,10,.04),0 3px 12px rgba(30,20,10,.05);
    --shadow-h:0 4px 10px rgba(30,20,10,.06),0 14px 30px rgba(30,20,10,.09);
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  a{color:var(--gold);}
  .clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .btn{background:var(--gold);color:#1a1410;border:none;border-radius:11px;padding:11px 20px;font:800 .9rem/1 var(--sans);cursor:pointer;}
  .btn:hover{filter:brightness(1.05);}
  .link{background:none;border:none;color:var(--gold-ink);font:700 .82rem/1 var(--sans);cursor:pointer;padding:0;}
  .link:hover{text-decoration:underline;}
  .empty{color:var(--muted);text-align:center;padding:44px 0;font-size:.95rem;}

  /* top bar */
  .bar{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .bar-in{max-width:1120px;margin:0 auto;padding:13px 22px;display:flex;align-items:center;gap:14px;}
  .brand{font:800 1.12rem/1 var(--sans);letter-spacing:-.02em;display:flex;align-items:center;gap:8px;}
  .brand .dot{width:11px;height:11px;border-radius:3px;background:linear-gradient(135deg,#b07d17,#6b4bb0);}
  .bstat{font-size:.76rem;color:var(--muted);margin-left:4px;}
  .bar .sp{flex:1;}
  .searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line2);border-radius:11px;padding:8px 12px;width:min(320px,42vw);box-shadow:var(--shadow);}
  .searchbox input{border:none;outline:none;background:none;font-size:.9rem;color:var(--ink);width:100%;}
  .searchbox svg{flex:0 0 auto;}

  .wrap{max-width:1120px;margin:0 auto;padding:22px 22px 100px;}

  /* hero */
  .hero-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 14px;}
  .hero-head h2{font:800 1.5rem/1.1 var(--sans);letter-spacing:-.025em;margin:0;}
  .hero-head p{font-size:.86rem;color:var(--muted);margin:5px 0 0;}
  .shuffle{display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:9px 14px;font:700 .82rem/1 var(--sans);color:var(--ink2);cursor:pointer;box-shadow:var(--shadow);}
  .shuffle:hover{border-color:#6b4bb0;color:#6b4bb0;}
  .hero{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  .feat{position:relative;background:linear-gradient(160deg,#f4eeff 0%,#fffdf9 62%);border:1px solid #e6ddf4;border-radius:18px;padding:20px 20px 18px;cursor:pointer;transition:.16s;display:flex;flex-direction:column;min-height:194px;}
  .feat:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:#d6c8ee;}
  .feat .tag{font:800 .6rem/1 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:#6b4bb0;background:#eae1fb;border-radius:20px;padding:5px 10px;align-self:flex-start;margin-bottom:11px;}
  .feat h3{font:700 1.16rem/1.28 var(--serif);margin:0 0 8px;letter-spacing:-.01em;}
  .feat .ins{font:400 .9rem/1.55 var(--serif);color:var(--ink2);flex:1;}
  .feat .go{margin-top:13px;font:700 .8rem/1 var(--sans);color:#6b4bb0;display:flex;align-items:center;gap:6px;}

  /* rails */
  .sec{display:flex;align-items:center;gap:11px;margin:34px 0 3px;}
  .sec .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--acc);font-size:1.02rem;}
  .sec .sn{font:800 1.08rem/1 var(--sans);letter-spacing:-.015em;}
  .sec .sc{font:700 .7rem/1;color:var(--acc);background:var(--soft);border-radius:20px;padding:4px 9px;}
  .sec .sd{font-size:.8rem;color:var(--muted);}
  .sec .browse{margin-left:auto;}
  .rail{display:flex;gap:13px;overflow-x:auto;padding:12px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:thin;}
  .rail::-webkit-scrollbar{height:9px;} .rail::-webkit-scrollbar-thumb{background:#e2dacb;border-radius:5px;} .rail::-webkit-scrollbar-track{background:transparent;}
  .tile{flex:0 0 258px;scroll-snap-align:start;background:#fff;border:1px solid var(--line);border-top:3px solid var(--acc);border-radius:14px;padding:15px 16px 14px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;min-height:150px;}
  .tile:hover{box-shadow:var(--shadow-h);transform:translateY(-2px);border-color:var(--line2);}
  .tile h4{font:700 1.02rem/1.3 var(--serif);margin:0 0 6px;letter-spacing:-.01em;}
  .tile .sm{font:400 .84rem/1.5 var(--serif);color:var(--ink2);flex:1;}
  .tile .mt{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px;}
  .chip{font:600 .66rem/1 var(--sans);color:var(--acc);background:var(--soft);border-radius:20px;padding:4px 8px;}
  .chip.plain{color:var(--muted);background:#f1ebe0;}

  /* modal: read your own material */
  .mbg{position:fixed;inset:0;background:rgba(38,28,10,.34);z-index:50;display:none;backdrop-filter:blur(3px);}
  .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(640px,94vw);max-height:88vh;z-index:51;background:var(--panel);border:1px solid var(--line2);border-radius:20px;box-shadow:0 24px 66px rgba(38,28,10,.32);display:none;flex-direction:column;overflow:hidden;}
  .mbg.open,.modal.open{display:flex;}
  .mhead{padding:20px 24px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-top:4px solid var(--acc,#6b4bb0);}
  .mhead .mt{font:800 1.24rem/1.28 var(--serif);letter-spacing:-.01em;}
  .mhead .ms{font-size:.82rem;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
  .mbody{padding:14px 24px 20px;overflow:auto;}
  .kicker{font:800 .68rem/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;}
  .kicker:first-child{margin-top:2px;}
  .take{padding:11px 0;border-bottom:1px solid var(--line);}
  .take:last-child{border-bottom:none;}
  .take .tk{font:600 .96rem/1.4 var(--serif);color:var(--ink);}
  .take .td{font:400 .88rem/1.6 var(--serif);color:var(--ink2);margin-top:3px;}
  .idea-chips{display:flex;gap:7px;flex-wrap:wrap;}
  .idea-chip{font:600 .78rem/1.3 var(--sans);color:#6b4bb0;background:#efe6ff;border:1px solid #e2d5fa;border-radius:9px;padding:6px 11px;cursor:pointer;}
  .idea-chip:hover{background:#e6d8fc;}
  .src-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .src-row:last-child{border-bottom:none;}
  .src-row .st{font:600 .88rem/1.35 var(--sans);color:var(--ink);flex:1;min-width:0;}
  .src-row .sd{font-size:.73rem;color:var(--muted);white-space:nowrap;}
  .mfoot{padding:14px 24px;border-top:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap;align-items:center;background:#fbf8f2;}
  .mfoot .lbl{font-size:.8rem;color:var(--muted);margin-right:2px;}
  .mx{background:none;border:none;font-size:1.5rem;color:var(--muted);cursor:pointer;line-height:1;padding:0;}
  .a-ghost{background:#f2ede2;border:1px solid var(--line2);color:var(--ink2);border-radius:9px;padding:8px 14px;font:700 .8rem/1 var(--sans);cursor:pointer;}
  .a-ghost:hover{border-color:var(--gold);color:var(--gold);}
  .a-gold{background:var(--gold);border:none;color:#1a1410;border-radius:9px;padding:8px 14px;font:800 .8rem/1 var(--sans);cursor:pointer;}

  /* draft workspace */
  #dpanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(840px,95vw);max-height:92vh;z-index:60;background:var(--panel);border:1px solid var(--line2);border-radius:20px;box-shadow:0 26px 72px rgba(38,28,10,.34);display:none;flex-direction:column;overflow:hidden;}
  #dpanel.open{display:flex;}
  .dhead{display:flex;align-items:center;gap:12px;padding:15px 22px;border-bottom:1px solid var(--line);background:#fbf8f2;}
  .dhead .dt{font:800 1.02rem/1.3 var(--sans);letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fswitch{display:inline-flex;gap:3px;background:#efe9dd;border:1px solid var(--line2);border-radius:10px;padding:3px;}
  .fswitch button{background:none;border:none;font:700 .76rem/1 var(--sans);color:var(--ink2);padding:8px 13px;border-radius:7px;cursor:pointer;}
  .fswitch button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow);}
  .dbody{padding:24px 32px;overflow:auto;}
  .sheet-edit{outline:none;min-height:170px;border-radius:8px;}
  .sheet-edit:focus{box-shadow:0 0 0 3px var(--gold-soft);}
  .sheet h3{font:800 .8rem/1.3 var(--sans);letter-spacing:.05em;text-transform:uppercase;color:var(--gold-ink);margin:22px 0 9px;}
  .sheet h3:first-child{margin-top:0;}
  .sheet p{font:400 1.02rem/1.72 var(--serif);color:var(--ink);margin:0 0 11px;}
  .sheet p.num{margin:15px 0 6px;font-weight:600;}
  .sheet p.num b{color:var(--gold);}
  .sheet ul{margin:0 0 14px;padding-left:22px;}
  .sheet li{font:400 1rem/1.68 var(--serif);color:var(--ink);margin-bottom:7px;}
  .sheet .src{font:600 .78em/1 var(--sans);color:var(--gold-ink);background:var(--gold-soft);border-radius:5px;padding:1px 6px;white-space:nowrap;}
  .dsrc{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:.79rem;color:var(--muted);}
  .dfoot{display:flex;gap:9px;align-items:center;padding:13px 22px;border-top:1px solid var(--line);background:#fbf8f2;}
  .dfoot input{flex:1;border:1px solid var(--line2);border-radius:10px;padding:10px 13px;font-size:.86rem;background:#fff;outline:none;}
  .dfoot input:focus{border-color:var(--gold);}
  .edit-note{font-size:.72rem;color:var(--muted);padding:0 22px 12px;background:#fbf8f2;}

  input.gate{width:100%;padding:13px 16px;border-radius:12px;border:1px solid var(--line2);background:#fff;color:var(--ink);font-size:1rem;}
  input.gate:focus{outline:none;border-color:var(--gold);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);}

  /* search results overlay */
  #searchres{margin-top:14px;}
  .res-row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;}

  @media(max-width:860px){ .hero{grid-template-columns:1fr;} .searchbox{width:auto;flex:1;} }
</style>
</head>
<body>

<!-- owner gate -->
<div id="gate" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;">
  <div class="card" style="max-width:380px;width:100%;padding:28px;">
    <h1 style="font-size:1.3rem;margin:0 0 4px;letter-spacing:-.02em;">Corpus Studio</h1>
    <p style="color:var(--muted);font-size:.86rem;margin:0 0 16px;">Owner access only.</p>
    <div id="step1">
      <input id="a-email" class="gate" type="email" placeholder="you@email.com" style="margin-bottom:9px;">
      <button class="btn" style="width:100%;" onclick="sendOTP()">Send code</button>
    </div>
    <div id="step2" style="display:none;">
      <input id="a-otp" class="gate" inputmode="numeric" placeholder="6-digit code" style="margin-bottom:9px;">
      <button class="btn" style="width:100%;" onclick="verifyOTP()">Verify</button>
    </div>
    <div id="a-err" style="display:none;color:#c0392b;font-size:.82rem;margin-top:9px;"></div>
  </div>
</div>

<div id="app" style="display:none;">
  <div class="bar"><div class="bar-in">
    <div class="brand"><span class="dot"></span>Corpus Studio<span class="bstat" id="stat"></span></div>
    <div class="sp"></div>
    <div class="searchbox">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#948d7d" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" placeholder="Search everything you've said…">
    </div>
    <button class="link" onclick="logout()">Sign out</button>
  </div></div>

  <div class="wrap">
    <div id="searchwrap" style="display:none;"><div id="searchres"></div></div>

    <div id="dashboard">
      <div class="hero-head">
        <div><h2>Threads worth making</h2><p>Ideas of yours that combine into something you haven't made explicit. A fresh set each time.</p></div>
        <button class="shuffle" onclick="shuffleHero()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Shuffle</button>
      </div>
      <div class="hero" id="hero"></div>
      <div id="rails"></div>
    </div>
  </div>
</div>

<!-- read your own material -->
<div class="mbg" id="mbg" onclick="closeModal()"></div>
<div class="modal" id="modal">
  <div class="mhead" id="m-head">
    <div><div class="mt" id="m-title"></div><div class="ms" id="m-sub"></div></div>
    <button class="mx" onclick="closeModal()">×</button>
  </div>
  <div class="mbody" id="m-body"></div>
  <div class="mfoot"><span class="lbl">Draft into a:</span>
    <button class="a-gold" onclick="draftFromModal('video')">Video plan</button>
    <button class="a-ghost" onclick="draftFromModal('mmt')">MMT plan</button>
  </div>
</div>

<!-- draft workspace (editable) -->
<div class="mbg" id="dbg" onclick="closeDraft()"></div>
<div id="dpanel">
  <div class="dhead">
    <div class="dt" id="d-title"></div>
    <div class="fswitch" id="d-switch">
      <button data-m="video" onclick="switchFormat('video')">Video</button>
      <button data-m="mmt" onclick="switchFormat('mmt')">MMT</button>
    </div>
    <button class="mx" onclick="closeDraft()">×</button>
  </div>
  <div class="dbody">
    <div id="d-sheet" class="sheet sheet-edit" contenteditable="true" spellcheck="false"></div>
    <div id="d-src" class="dsrc"></div>
  </div>
  <div class="edit-note">This is yours to edit. Click in and type, or ask AI to adjust below.</div>
  <div class="dfoot">
    <button class="a-gold" onclick="copyDraft()">Copy</button>
    <input id="d-adjust" placeholder="Ask AI to adjust — 'tighten the opening', 'add an analogy'…" onkeydown="if(event.key==='Enter')adjustDraft()">
    <button class="a-ghost" onclick="adjustDraft()">Adjust</button>
  </div>
</div>

<script>
const SUPABASE_URL="https://gyskfutmncprqxazgatv.supabase.co";
const SUPABASE_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNERS=["matthew@matthewcawood.com","enquiries@matthewcawood.com"];
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
const $=id=>document.getElementById(id);
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SRC={video:"Video",mmt:"Monday Music Tips",reply:"Reply",post:"Post",weekly_focus:"Weekly focus",theory_sheet:"Theory sheet",lesson:"Lesson"};
const MLAB={video:"Video plan",mmt:"MMT plan"};
const fmtDate=d=>d?new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"";
const fmtMon =d=>d?new Date(d).toLocaleDateString("en-GB",{month:"short",year:"numeric"}):"";

// ── auth ──
let otpEmail="";
function showErr(m){$("a-err").textContent=m;$("a-err").style.display="block";}
async function sendOTP(){
  const email=$("a-email").value.trim().toLowerCase(); $("a-err").style.display="none";
  if(!OWNERS.includes(email))return showErr("Owner access only.");
  const{error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:false}});
  if(error)return showErr(error.message);
  otpEmail=email;$("step1").style.display="none";$("step2").style.display="block";$("a-otp").focus();
}
async function verifyOTP(){
  $("a-err").style.display="none";
  const{error}=await db.auth.verifyOtp({email:otpEmail,token:$("a-otp").value.trim(),type:"email"});
  if(error)return showErr("Invalid or expired code."); enter();
}
async function logout(){await db.auth.signOut();location.reload();}
async function enter(){ $("gate").style.display="none";$("app").style.display="block"; loadAll(); }

// ── colour-coded categories ──
const CATS={
  thread:{name:"Threads across your work",icon:"🔗",acc:"#6b4bb0",soft:"#efe6ff",desc:"Separate ideas of yours that combine"},
  signature:{name:"Signature themes",icon:"⭐",acc:"#b07d17",soft:"#f7edd6",desc:"What you return to most"},
  gem:{name:"Underexposed gems",icon:"💎",acc:"#3f7d42",soft:"#e2f0e2",desc:"Strong, but you've rarely aired them"},
  quiet:{name:"Gone quiet",icon:"🌙",acc:"#4a6a92",soft:"#e7eef7",desc:"You haven't touched these in a while"},
  scattered:{name:"Scattered across pieces",icon:"🕸️",acc:"#2f8f8a",soft:"#dcefee",desc:"One idea spread over many pieces"},
};

// ── load everything (all precomputed, no AI) ──
let _conns=[],_themes=[],_themesById={},_heroPool=[],_heroSeed=0;
async function loadAll(){
  $("rails").innerHTML=`<div class="empty">Loading your corpus…</div>`;
  const[cn,th,own]=await Promise.all([
    db.from("corpus_connections").select("*").order("id"),
    db.from("corpus_themes").select("*"),
    db.from("corpus_entries").select("id",{count:"exact",head:true}).eq("provenance","own"),
  ]);
  _conns=cn.data||[]; _themes=th.data||[]; _themesById=Object.fromEntries(_themes.map(t=>[t.id,t]));
  $("stat").textContent=`· ${_conns.length} threads and ${_themes.length} themes, distilled from ${(own.count||0).toLocaleString()} pieces of your own words`;
  _heroPool=_conns.slice(); shuffleHero();
  renderRails();
}

// ── HERO (top threads, shuffleable for brainstorming) ──
function shuffleHero(){
  // rotate a deterministic window so Shuffle feels fresh without Math.random
  const n=_heroPool.length; if(!n){$("hero").innerHTML="";return;}
  const pick=[]; for(let k=0;k<Math.min(3,n);k++){ pick.push(_heroPool[(_heroSeed+k)%n]); }
  _heroSeed=(_heroSeed+3)%n;
  $("hero").innerHTML=pick.map(c=>`<div class="feat" onclick="openThread(${c.id})">
    <span class="tag">Thread</span>
    <h3 class="clamp2">${esc(c.framework)}</h3>
    <div class="ins clamp3">${esc(c.insight||"")}</div>
    <div class="go">Read &amp; draft <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>`).join("");
}

// ── RAILS (colour-coded categories) ──
function railData(){
  const oldest=_themes.filter(t=>t.size>=3&&t.last_mentioned).sort((a,b)=>new Date(a.last_mentioned)-new Date(b.last_mentioned));
  return [
    {cat:"thread",items:_conns.map(c=>({kind:"thread",raw:c}))},
    {cat:"signature",items:_themes.filter(t=>t.size>=4).sort((a,b)=>b.size-a.size).map(t=>({kind:"theme",raw:t}))},
    {cat:"gem",items:_themes.filter(t=>t.avg_quality>=4.4&&t.size<=12).sort((a,b)=>b.avg_quality-a.avg_quality).map(t=>({kind:"theme",raw:t}))},
    {cat:"quiet",items:oldest.map(t=>({kind:"theme",raw:t}))},
    {cat:"scattered",items:_themes.filter(t=>t.source_spread>=4).sort((a,b)=>b.source_spread-a.source_spread).map(t=>({kind:"theme",raw:t}))},
  ];
}
function renderRails(){
  const rails=railData().filter(r=>r.items.length);
  $("rails").innerHTML=rails.map(r=>{
    const c=CATS[r.cat];
    const tiles=r.items.slice(0,18).map(it=>tileHTML(it,r.cat)).join("");
    return `<section style="--acc:${c.acc};--soft:${c.soft};">
      <div class="sec"><span class="ic">${c.icon}</span><span class="sn">${c.name}</span><span class="sc">${r.items.length}</span><span class="sd">${c.desc}</span></div>
      <div class="rail">${tiles}</div>
    </section>`;
  }).join("");
}
function tileHTML(it,cat){
  if(it.kind==="thread"){
    const c=it.raw;
    return `<div class="tile" onclick="openThread(${c.id})">
      <h4 class="clamp2">${esc(c.framework)}</h4>
      <div class="sm clamp3">${esc(c.insight||"")}</div>
      <div class="mt">${(c.themes||[]).slice(0,2).map(x=>`<span class="chip">${esc(x.label)}</span>`).join("")}</div></div>`;
  }
  const t=it.raw; const last=t.last_mentioned?fmtMon(t.last_mentioned):"";
  const metaChip = cat==="quiet"&&last ? `<span class="chip plain">last ${last}</span>`
    : cat==="scattered" ? `<span class="chip">${t.source_spread} pieces</span>`
    : cat==="gem" ? `<span class="chip">quality ${(+t.avg_quality).toFixed(1)}</span>`
    : `<span class="chip">×${t.size} mentions</span>`;
  return `<div class="tile" onclick="openTheme(${t.id})">
    <h4 class="clamp2">${esc(t.label||"")}</h4>
    <div class="sm clamp3">${esc(t.summary||"")}</div>
    <div class="mt">${metaChip}</div></div>`;
}

// ── READ modal ──
let _modalKind=null,_modalRaw=null;
function setModalAccent(hex){ $("m-head").style.setProperty("--acc",hex); }
function openThread(id){
  const c=_conns.find(x=>x.id===id); if(!c)return; _modalKind="thread"; _modalRaw=c;
  setModalAccent(CATS.thread.acc);
  $("m-title").textContent=c.framework;
  $("m-sub").innerHTML=`<span>Thread across ${(c.themes||[]).length} of your ideas</span>`;
  let html="";
  if(c.insight)html+=`<div style="font:400 1.04rem/1.7 var(--serif);color:var(--ink);margin:4px 0 6px;">${esc(c.insight)}</div>`;
  if(c.content_angle)html+=`<div style="font:600 .96rem/1.6 var(--serif);color:#6b4bb0;margin:0 0 8px;">→ ${esc(c.content_angle)}</div>`;
  if((c.themes||[]).length){
    html+=`<div class="kicker">The ideas it links — tap to read each</div><div class="idea-chips">`+
      c.themes.map(x=>`<span class="idea-chip" onclick="openThemeById(${x.id})">${esc(x.label)}</span>`).join("")+`</div>`;
  }
  const srcs=(c.sources||[]);
  if(srcs.length){
    html+=`<div class="kicker">Where this comes from</div>`+
      srcs.map(s=>`<div class="src-row"><span class="st">${esc(s.title||"(untitled)")}</span>${s.published_at?`<span class="sd">${fmtDate(s.published_at)}</span>`:""}${s.url?`<a class="link" href="${esc(s.url)}" target="_blank" rel="noopener">Open ↗</a>`:""}</div>`).join("");
  }
  $("m-body").innerHTML=html; openModal();
}
function openTheme(themeId){
  const t=_themesById[themeId]; if(!t)return; _modalKind="theme"; _modalRaw=t;
  setModalAccent(CATS.signature.acc);
  $("m-title").textContent=t.label||"";
  $("m-sub").innerHTML=`<span>Said ×${t.size||0} across ${t.source_spread||0} pieces</span>${t.last_mentioned?`<span>· last ${fmtMon(t.last_mentioned)}</span>`:""}`;
  let html=t.summary?`<div style="font:400 1.04rem/1.7 var(--serif);color:var(--ink);margin:4px 0 6px;">${esc(t.summary)}</div>`:"";
  const takes=(t.examples||[]);
  if(takes.length){
    html+=`<div class="kicker">Your takes on this</div>`+
      takes.map(x=>`<div class="take"><div class="tk">${esc(x.concept||"")}</div>${x.description?`<div class="td">${esc(x.description)}</div>`:""}</div>`).join("");
  }
  const srcs=(t.source_entries||[]);
  if(srcs.length){
    html+=`<div class="kicker">Where you said it</div>`+
      srcs.map(s=>`<div class="src-row"><span class="st">${esc(s.title||"(untitled)")}</span>${s.published_at?`<span class="sd">${fmtDate(s.published_at)}</span>`:""}${s.url?`<a class="link" href="${esc(s.url)}" target="_blank" rel="noopener">Open ↗</a>`:""}</div>`).join("");
  }
  $("m-body").innerHTML=html||`<div class="empty">No material linked.</div>`; openModal();
}
async function openThemeById(themeId){ if(!_themesById[themeId]){ const{data}=await db.from("corpus_themes").select("*").eq("id",themeId).single(); if(data)_themesById[themeId]=data;} openTheme(themeId); }
function openModal(){$("modal").classList.add("open");$("mbg").classList.add("open");$("modal").scrollTop=0;$("m-body").scrollTop=0;}
function closeModal(){$("modal").classList.remove("open");$("mbg").classList.remove("open");}

function draftFromModal(mode){
  if(!_modalRaw)return; closeModal();
  if(_modalKind==="thread"){
    const c=_modalRaw, seed=`${c.framework}\n${c.insight||""}${c.content_angle?"\n"+c.content_angle:""}`;
    openDraft(c.framework, seed, mode, (c.sources||[]).map(s=>({title:s.title,url:s.url,published_at:s.published_at})));
  }else{
    const t=_modalRaw, seed=`${t.label}\n${t.summary||""}\n`+(t.examples||[]).map(x=>x.concept).join("; ");
    openDraft(t.label, seed, mode, (t.source_entries||[]).map(s=>({title:s.title,url:s.url,published_at:s.published_at})));
  }
}

// ── DRAFT workspace (the only AI; editable) ──
let _seed="",_mode="video",_dsrc=[];
function openDraft(title, seed, mode, srcs){
  _seed=seed;_mode=mode;_dsrc=srcs||[];
  $("d-title").textContent=title; syncSwitch();
  $("dpanel").classList.add("open");$("dbg").classList.add("open");
  runDraft();
}
function syncSwitch(){ document.querySelectorAll("#d-switch button").forEach(b=>b.classList.toggle("on",b.dataset.m===_mode)); }
function closeDraft(){$("dpanel").classList.remove("open");$("dbg").classList.remove("open");}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeDraft();closeModal();}});
function switchFormat(mode){ if(mode===_mode)return; _mode=mode; syncSwitch(); runDraft(); }
async function runDraft(){
  $("d-sheet").innerHTML=`<div class="empty">Drafting your ${MLAB[_mode].toLowerCase()} from your own words… (a few seconds)</div>`;
  $("d-src").innerHTML="";
  const{data,error}=await db.functions.invoke("corpus-ai",{body:{query:_seed,mode:_mode,provenance:"own"}});
  if(error||(data&&data.error)){ $("d-sheet").innerHTML=`<div class="empty">Error: ${esc((error&&error.message)||(data&&data.error)||"failed")}</div>`; return; }
  renderDraft(data.synthesis||"", data.sources||_dsrc);
}
function renderDraft(text, sources){
  $("d-sheet").innerHTML=mdRender(text);
  const src=(sources||[]).map(s=>s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||SRC[s.source_type]||s.source_type||"source")}</a>`:esc(s.title||"")).filter(Boolean).join(" · ");
  $("d-src").innerHTML=src?`<b style="color:var(--ink2);">Built from your:</b> ${src}`:"";
}
function copyDraft(){
  const txt=$("d-sheet").innerText.trim(); navigator.clipboard.writeText(txt);
  const b=event&&event.target; if(b){const o=b.textContent;b.textContent="Copied";setTimeout(()=>b.textContent=o,1200);}
}
async function adjustDraft(){
  const inp=$("d-adjust"); const instruction=inp.value.trim(); if(!instruction)return;
  const current=$("d-sheet").innerText.trim(); if(!current)return;
  inp.disabled=true; const ph=inp.placeholder; inp.value=""; inp.placeholder="Adjusting…"; $("d-sheet").style.opacity=".45";
  const{data,error}=await db.functions.invoke("corpus-ai",{body:{query:_seed,mode:"refine",context:current,instruction,provenance:"own"}});
  $("d-sheet").style.opacity="1"; inp.disabled=false; inp.placeholder=ph;
  if(error||(data&&data.error)){ inp.placeholder="Couldn't adjust — try again."; return; }
  renderDraft(data.synthesis||current, data.sources||_dsrc);
}

// ── markdown → reference sheet ──
function mdRender(t){
  const lines=esc(t).split(/\n/); let html="",inList=false;
  const close=()=>{if(inList){html+="</ul>";inList=false;}};
  for(const raw of lines){
    let line=raw.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\[Source:\s*([^\]]+)\]/g,'<span class="src">$1</span>');
    const h=line.match(/^\s*#{1,4}\s+(.*)/), li=line.match(/^\s*[-*•]\s+(.*)/), num=line.match(/^\s*(\d+)\.\s+(.*)/);
    if(h){close();html+=`<h3>${h[1].replace(/[:*]+$/,"")}</h3>`;}
    else if(li){if(!inList){html+="<ul>";inList=true;}html+=`<li>${li[1]}</li>`;}
    else if(num){close();html+=`<p class="num"><b>${num[1]}.</b> ${num[2]}</p>`;}
    else if(!line.trim()){close();}
    else{close();html+=`<p>${line}</p>`;}
  }
  close(); return html;
}

// ── Search (keyword, on demand — no AI) ──
let _searchTimer=null;
$("q")&&$("q").addEventListener("input",e=>{ clearTimeout(_searchTimer); const v=e.target.value.trim();
  if(!v){$("searchwrap").style.display="none";$("dashboard").style.display="";return;}
  _searchTimer=setTimeout(runSearch,320);
});
$("q")&&$("q").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch();});
async function runSearch(){
  const q=$("q").value.trim(); if(!q){$("searchwrap").style.display="none";$("dashboard").style.display="";return;}
  $("dashboard").style.display="none"; $("searchwrap").style.display="";
  $("searchres").innerHTML=`<div class="empty">Searching…</div>`;
  const{data,error}=await db.rpc("search_corpus",{p_q:q,p_provenance:"own",p_source:null,p_limit:50});
  if(error){$("searchres").innerHTML=`<div class="empty">Error.</div>`;return;}
  if(!data||!data.length){$("searchres").innerHTML=`<div class="empty">Nothing found for “${esc(q)}”.</div>`;return;}
  $("searchres").innerHTML=`<div class="hero-head"><div><h2 style="font-size:1.2rem;">Search · ${data.length}</h2></div></div>`+data.map(r=>{
    const title=r.title||"(untitled "+(SRC[r.source_type]||r.source_type).toLowerCase()+")";
    const snip=esc(r.snippet).replace(/«/g,"<mark>").replace(/»/g,"</mark>");
    return `<div class="res-row"><div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;"><span class="chip" style="color:#8a6a2a;background:#f3ece0;">${esc(SRC[r.source_type]||r.source_type)}</span><span style="flex:1;font:700 .98rem/1.3 var(--serif);">${esc(title)}</span><span style="font-size:.72rem;color:var(--muted);">${fmtDate(r.published_at)}</span></div><div style="font:400 .9rem/1.55 var(--serif);color:var(--ink2);">${snip}</div>${r.url?`<div style="margin-top:8px;"><a class="link" href="${esc(r.url)}" target="_blank" rel="noopener">Open original ↗</a></div>`:""}</div>`;
  }).join("");
}

(async()=>{const{data:{session}}=await db.auth.getSession(); if(session&&OWNERS.includes((session.user.email||"").toLowerCase()))enter();})();
