<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corpus Studio &middot; The Practice Room</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { background: var(--bg, #0f1115); color: var(--text, #e8eaed); }
  .cs-wrap { max-width: 900px; margin: 0 auto; padding: 18px 16px 80px; }
  .cs-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .cs-top h1 { font-size:1.4rem; margin:0; display:flex; align-items:center; gap:10px; }
  .cs-stats { font-size:.8rem; color:var(--text-muted,#8a94a6); margin-bottom:16px; }
  .cs-searchbar { display:flex; gap:8px; margin-bottom:10px; }
  .cs-searchbar input { flex:1; padding:12px 14px; border-radius:11px; border:1px solid rgba(255,255,255,.14);
    background:rgba(255,255,255,.05); color:inherit; font-size:1rem; }
  .cs-searchbar input:focus { outline:none; border-color:#F5C518; }
  .cs-btn { flex:none; background:#F5C518; color:#1a1400; font-weight:800; border:none; border-radius:11px;
    padding:0 18px; font-size:.9rem; cursor:pointer; }
  .cs-filters { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:18px; }
  .cs-seg { display:inline-flex; border:1px solid rgba(255,255,255,.14); border-radius:9px; overflow:hidden; }
  .cs-seg button { background:none; border:none; color:var(--text-muted,#8a94a6); padding:7px 13px; font-size:.82rem; cursor:pointer; }
  .cs-seg button.on { background:rgba(245,197,24,.16); color:#F5C518; font-weight:700; }
  .cs-filters select { background:rgba(255,255,255,.05); color:inherit; border:1px solid rgba(255,255,255,.14);
    border-radius:9px; padding:7px 10px; font-size:.82rem; }
  .cs-results { display:flex; flex-direction:column; gap:10px; }
  .cs-card { border:1px solid rgba(255,255,255,.10); border-radius:12px; padding:14px 16px; background:rgba(255,255,255,.02); }
  .cs-card-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap; }
  .cs-badge { font-size:.66rem; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:3px 8px; border-radius:6px;
    background:rgba(245,197,24,.14); color:#F5C518; }
  .cs-badge.gen { background:rgba(255,255,255,.08); color:var(--text-muted,#8a94a6); }
  .cs-title { font-weight:700; font-size:.98rem; color:var(--text,#e8eaed); flex:1; min-width:0; }
  .cs-meta { font-size:.72rem; color:var(--text-muted,#8a94a6); }
  .cs-snip { font-size:.86rem; line-height:1.55; color:var(--text-muted,#b6bdc9); }
  .cs-snip mark { background:rgba(245,197,24,.28); color:#fff; padding:0 2px; border-radius:3px; }
  .cs-actions { display:flex; gap:14px; margin-top:9px; }
  .cs-link { font-size:.78rem; color:#F5C518; text-decoration:none; cursor:pointer; background:none; border:none; padding:0; }
  .cs-link:hover { text-decoration:underline; }
  .cs-empty { color:var(--text-muted,#8a94a6); text-align:center; padding:40px 0; }
  /* detail */
  .cs-modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:50; }
  .cs-modal { position:fixed; inset:0; margin:auto; max-width:760px; max-height:86vh; height:max-content; z-index:51;
    background:var(--surface,#171a20); border:1px solid rgba(255,255,255,.14); border-radius:14px; display:none; flex-direction:column; overflow:hidden; }
  .cs-modal.open, .cs-modal-bg.open { display:flex; }
  .cs-modal-h { display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.1); }
  .cs-modal-h .cs-title { font-size:1.05rem; }
  .cs-modal-body { padding:18px; overflow:auto; white-space:pre-wrap; line-height:1.65; font-size:.92rem; }
  .cs-x { background:none; border:none; color:var(--text-muted,#8a94a6); font-size:1.4rem; cursor:pointer; line-height:1; }

  /* ── aesthetic overhaul ── */
  body { background:
      radial-gradient(1100px 520px at 50% -8%, rgba(245,197,24,.06), transparent 60%),
      #0a0c10; }
  .cs-wrap { max-width: 1000px; }
  .cs-top h1 { letter-spacing:-.01em; }
  .cs-seg { border-radius:11px; background:rgba(255,255,255,.03); padding:3px; gap:2px; border:1px solid rgba(255,255,255,.07); }
  .cs-seg button { border-radius:8px; font-weight:600; transition:.15s; }
  .cs-seg button.on { box-shadow:0 1px 0 rgba(0,0,0,.3); }

  /* Map dashboard */
  #map-panel { min-height: 60vh; }
  .map-layout { display:grid; grid-template-columns: 236px 1fr; gap:26px; align-items:start; }
  .lens-nav { display:flex; flex-direction:column; gap:7px; position:sticky; top:14px; }
  .lens-btn { text-align:left; background:none; border:1px solid transparent; border-radius:13px; padding:12px 14px; cursor:pointer; color:var(--text-muted,#8a94a6); transition:.16s; }
  .lens-btn:hover { background:rgba(255,255,255,.035); color:var(--text,#e9ecf1); }
  .lens-btn.on { background:linear-gradient(180deg, rgba(245,197,24,.14), rgba(245,197,24,.05)); border-color:rgba(245,197,24,.32); color:#fff; }
  .lens-btn .ln-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .lens-btn .ln-name { font-weight:700; font-size:.92rem; letter-spacing:-.005em; }
  .lens-btn .ln-count { font-size:.72rem; font-weight:700; color:var(--text-muted,#8a94a6); background:rgba(255,255,255,.06); border-radius:20px; padding:2px 8px; }
  .lens-btn.on .ln-count { color:#1a1400; background:#F5C518; }
  .lens-btn .ln-desc { font-size:.72rem; line-height:1.45; margin-top:4px; opacity:.75; }
  .lens-main .lm-head { margin-bottom:16px; }
  .lens-main .lm-title { font-size:1.35rem; font-weight:800; letter-spacing:-.015em; color:#fff; }
  .lens-main .lm-sub { font-size:.85rem; color:var(--text-muted,#8a94a6); margin-top:3px; line-height:1.5; }
  .theme-card { position:relative; border:1px solid rgba(255,255,255,.09); border-radius:15px; padding:16px 18px 15px;
    background:linear-gradient(180deg, rgba(255,255,255,.028), rgba(255,255,255,.012)); transition:.16s; margin-bottom:11px; }
  .theme-card:hover { border-color:rgba(245,197,24,.35); transform:translateY(-1px); box-shadow:0 6px 22px rgba(0,0,0,.28); }
  .tc-label { font-size:1.02rem; font-weight:700; color:#fff; letter-spacing:-.01em; line-height:1.3; padding-right:70px; }
  .tc-rank { position:absolute; top:14px; right:16px; font-size:.72rem; font-weight:800; color:rgba(245,197,24,.55); font-variant-numeric:tabular-nums; }
  .tc-sum { font-size:.87rem; line-height:1.55; color:var(--text-muted,#aab2c0); margin:7px 0 11px; }
  .tc-foot { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .tc-badge { font-size:.68rem; font-weight:600; color:var(--text-muted,#8a94a6); background:rgba(255,255,255,.055); border-radius:20px; padding:3px 9px; display:inline-flex; align-items:center; gap:4px; }
  .tc-badge b { color:#e9ecf1; font-weight:700; }
  .tc-explore { margin-left:auto; font-size:.78rem; font-weight:700; color:#F5C518; background:rgba(245,197,24,.1); border:1px solid rgba(245,197,24,.25); border-radius:9px; padding:6px 12px; cursor:pointer; transition:.15s; }
  .tc-explore:hover { background:#F5C518; color:#1a1400; }
  @media (max-width:720px){
    .map-layout { grid-template-columns:1fr; gap:14px; }
    .lens-nav { flex-direction:row; overflow-x:auto; position:static; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
    .lens-btn { flex:0 0 auto; min-width:150px; }
    .lens-btn .ln-desc { display:none; }
    .tc-explore { margin-left:0; }
  }
</style>
</head>
<body>

<!-- Owner-only gate -->
<div id="gate" style="min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
  <div class="login-card" style="max-width:360px; width:100%;">
    <h1 class="login-title" style="margin-bottom:6px;">Corpus Studio</h1>
    <p style="color:var(--text-muted,#8a94a6); font-size:.85rem; margin-top:0;">Owner access only.</p>
    <div id="step1">
      <input id="a-email" type="email" placeholder="you@email.com" style="width:100%; padding:11px; border-radius:9px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:inherit; margin-bottom:8px;">
      <button class="btn btn-primary" style="width:100%;" onclick="sendOTP()">Send code</button>
    </div>
    <div id="step2" style="display:none;">
      <input id="a-otp" inputmode="numeric" placeholder="6-digit code" style="width:100%; padding:11px; border-radius:9px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:inherit; margin-bottom:8px;">
      <button class="btn btn-primary" style="width:100%;" onclick="verifyOTP()">Verify</button>
    </div>
    <div id="a-err" style="display:none; color:#ef4444; font-size:.82rem; margin-top:8px;"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="cs-wrap" style="display:none;">
  <div class="cs-top">
    <h1>📚 Corpus Studio</h1>
    <button id="logout" class="cs-link" onclick="logout()">Sign out</button>
  </div>
  <div class="cs-stats" id="cs-stats">Loading…</div>

  <div class="cs-seg" id="mode-seg" style="margin-bottom:16px;">
    <button data-mode="ideas" class="on">Ideas</button>
    <button data-mode="map">Map</button>
    <button data-mode="search">Keyword search</button>
  </div>

  <div id="map-panel" style="display:none;"></div>

  <div id="ideas-panel">
    <textarea id="idea-q" rows="4" placeholder="Describe your idea — a title, a thumbnail line, or a rough concept — and I'll find your relevant past thinking and pull it into angles and frameworks. Or just describe a theme to dig for ideas." style="width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:inherit;font-size:.98rem;resize:vertical;font-family:inherit;"></textarea>
    <div style="display:flex;align-items:center;gap:14px;margin-top:10px;flex-wrap:wrap;">
      <button class="cs-btn" style="padding:11px 20px;" onclick="findThinking()">Find my thinking</button>
      <label style="font-size:.8rem;color:var(--text-muted,#8a94a6);display:flex;align-items:center;gap:6px;"><input type="checkbox" id="idea-gen"> include AI-generated reference</label>
    </div>
    <div id="idea-out" style="margin-top:22px;"></div>
    <div id="idea-history" style="margin-top:30px;"></div>
  </div>

  <div id="search-panel" style="display:none;">
  <div class="cs-searchbar">
    <input id="q" placeholder="Search everything you've said… e.g. voice leading, pedal note, when to move on" autocomplete="off">
    <button class="cs-btn" onclick="runSearch()">Search</button>
  </div>
  <div class="cs-filters">
    <div class="cs-seg" id="prov-seg">
      <button data-prov="own" class="on">Your words</button>
      <button data-prov="generated">Generated</button>
      <button data-prov="">All</button>
    </div>
    <select id="src">
      <option value="">All sources</option>
      <option value="video">Videos</option>
      <option value="mmt">Monday Music Tips</option>
      <option value="reply">Replies</option>
      <option value="weekly_focus">Weekly focus</option>
      <option value="post">Posts</option>
      <option value="theory_sheet">Theory sheets</option>
      <option value="lesson">Lessons</option>
    </select>
  </div>

  <div class="cs-results" id="results"></div>
  </div><!-- /search-panel -->
</div>

<div class="cs-modal-bg" id="modal-bg" onclick="closeDetail()"></div>
<div class="cs-modal" id="modal">
  <div class="cs-modal-h">
    <span class="cs-badge" id="d-badge"></span>
    <span class="cs-title" id="d-title"></span>
    <button class="cs-link" id="d-copy" onclick="copyDetail()">Copy</button>
    <a class="cs-link" id="d-open" target="_blank" rel="noopener">Open original ↗</a>
    <button class="cs-x" onclick="closeDetail()">×</button>
  </div>
  <div class="cs-modal-body" id="d-body"></div>
</div>

<script>
const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNER_EMAILS  = ["matthew@matthewcawood.com","enquiries@matthewcawood.com"];
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = id => document.getElementById(id);

const SRC = { video:"Video", mmt:"Monday Music Tips", reply:"Reply", post:"Post", weekly_focus:"Weekly focus", theory_sheet:"Theory sheet", lesson:"Lesson" };
function esc(s){ return String(s||"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hl(s){ return esc(s).replace(/«/g,"<mark>").replace(/»/g,"</mark>"); }
function fmtDate(d){ return d ? new Date(d).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : ""; }

// ── Auth ──
let otpEmail = "";
function showErr(m){ $("a-err").textContent = m; $("a-err").style.display = "block"; }
async function sendOTP(){
  const email = $("a-email").value.trim().toLowerCase();
  $("a-err").style.display = "none";
  if (!OWNER_EMAILS.includes(email)) return showErr("Owner access only.");
  const { error } = await db.auth.signInWithOtp({ email, options:{ shouldCreateUser:false } });
  if (error) return showErr(error.message);
  otpEmail = email; $("step1").style.display="none"; $("step2").style.display="block"; $("a-otp").focus();
}
async function verifyOTP(){
  $("a-err").style.display = "none";
  const { error } = await db.auth.verifyOtp({ email:otpEmail, token:$("a-otp").value.trim(), type:"email" });
  if (error) return showErr("Invalid or expired code.");
  enter();
}
async function logout(){ await db.auth.signOut(); location.reload(); }

async function enter(){
  $("gate").style.display = "none";
  $("app").style.display = "block";
  loadStats();
  loadHistory();
}

// ── Mode toggle (Ideas | Keyword search) ──
document.querySelectorAll("#mode-seg button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#mode-seg button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  const m = b.dataset.mode;
  $("ideas-panel").style.display  = m === "ideas"  ? "" : "none";
  $("map-panel").style.display    = m === "map"    ? "" : "none";
  $("search-panel").style.display = m === "search" ? "" : "none";
  if (m === "search" && !$("results").innerHTML) runSearch();
  if (m === "map" && !$("map-panel").dataset.loaded) loadMap();
});

// ── Map: a navigable dashboard of five lenses over your concept themes ──
let _themesById = {}, _lenses = [], _lensIdx = 0, _showAll = false;
async function loadMap(){
  $("map-panel").innerHTML = `<div class="cs-empty">Building your map…</div>`;
  const { data: themes, error } = await db.from("corpus_themes").select("*");
  if (error || !themes){ $("map-panel").innerHTML = `<div class="cs-empty">Couldn't load the map.</div>`; return; }
  $("map-panel").dataset.loaded = "1";
  _themesById = Object.fromEntries(themes.map(t => [t.id, t]));
  const byOldest = themes.filter(t => t.size >= 3 && t.last_mentioned).sort((a,b)=> new Date(a.last_mentioned) - new Date(b.last_mentioned));
  _lenses = [
    { name:"Signature themes", desc:"The ideas you return to most — your core, repeated philosophy.", items: themes.filter(t=>t.size>=4).sort((a,b)=>b.size-a.size) },
    { name:"Scattered", desc:"One idea spread across many different pieces.", items: themes.filter(t=>t.source_spread>=4).sort((a,b)=>b.source_spread-a.source_spread) },
    { name:"Gone quiet", desc:"Recurring themes you haven't touched in a long time — worth resurfacing.", items: byOldest },
    { name:"Underexposed gems", desc:"High-quality takes you've made only a handful of times — better than their airtime.", items: themes.filter(t=>t.avg_quality>=4.4 && t.size<=12).sort((a,b)=>b.avg_quality-a.avg_quality) },
    { name:"Ripe to expand", desc:"Your strongest, most distinctive ideas — seeds for new content.", items: themes.filter(t=>t.avg_quality>=4.5).sort((a,b)=> (b.avg_quality-a.avg_quality) || (a.size-b.size)) },
  ];
  $("map-panel").innerHTML = `<div class="map-layout"><nav class="lens-nav" id="lens-nav"></nav><div class="lens-main" id="lens-main"></div></div>`;
  selectLens(0);
}
function selectLens(i){
  _lensIdx = i; _showAll = false;
  $("lens-nav").innerHTML = _lenses.map((l,idx)=>`
    <button class="lens-btn ${idx===_lensIdx?'on':''}" onclick="selectLens(${idx})">
      <div class="ln-top"><span class="ln-name">${esc(l.name)}</span><span class="ln-count">${l.items.length}</span></div>
      <div class="ln-desc">${esc(l.desc)}</div>
    </button>`).join("");
  renderLensMain();
}
function renderLensMain(){
  const l = _lenses[_lensIdx];
  const shown = _showAll ? l.items : l.items.slice(0,10);
  const cards = shown.map((t,idx)=>themeCard(t, idx+1)).join("") || `<div class="cs-empty">Nothing here yet.</div>`;
  const more = (!_showAll && l.items.length>10)
    ? `<div style="text-align:center;margin-top:6px;"><button class="cs-link" onclick="_showAll=true;renderLensMain();">Show all ${l.items.length}</button></div>` : "";
  $("lens-main").innerHTML = `<div class="lm-head"><div class="lm-title">${esc(l.name)}</div><div class="lm-sub">${esc(l.desc)}</div></div>${cards}${more}`;
}
function themeCard(t, rank){
  const last = t.last_mentioned ? new Date(t.last_mentioned).toLocaleDateString("en-GB",{month:"short",year:"numeric"}) : "";
  return `<div class="theme-card">
    <div class="tc-rank">${rank}</div>
    <div class="tc-label">${esc(t.label||"")}</div>
    <div class="tc-sum">${esc(t.summary||"")}</div>
    <div class="tc-foot">
      <span class="tc-badge"><b>×${t.size}</b> mentions</span>
      <span class="tc-badge"><b>${t.source_spread}</b> pieces</span>
      ${last?`<span class="tc-badge">last <b>${last}</b></span>`:""}
      <button class="tc-explore" onclick="exploreTheme(${t.id})">Explore →</button>
    </div></div>`;
}
function exploreTheme(id){
  const t = _themesById[id]; if (!t) return;
  document.querySelector('#mode-seg button[data-mode="ideas"]').click();
  $("idea-q").value = (t.label||"") + (t.summary ? "\n" + t.summary : "");
  $("idea-q").scrollIntoView({behavior:"smooth", block:"center"});
  findThinking();
}

// ── Ideas: retrieval + synthesis via corpus-ai ──
function mdRender(t){
  let h = esc(t);
  h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  h = h.replace(/\[Source: ([^\]]+)\]/g, '<span style="color:#F5C518;font-size:.82em;">[$1]</span>');
  return h;
}
$("idea-q").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey||e.ctrlKey)) findThinking(); });
let _lastQuery = "", _lastSynthesis = "";
function renderOut(data){
  const src = (data.sources||[]).map(s => s.url
    ? `<a class="cs-link" href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title||SRC[s.source_type]||s.source_type)}</a>`
    : `<span>${esc(s.title||SRC[s.source_type]||s.source_type)}</span>`).join(" · ");
  const bar = `<div class="cs-actions" style="margin:0 0 12px;flex-wrap:wrap;">
    <button class="cs-link" onclick="copyOut()">Copy</button>
    <button class="cs-link" onclick="reformat('video')">Shape into a video plan</button>
    <button class="cs-link" onclick="reformat('mmt')">Shape into a Monday Music Tips plan</button></div>`;
  $("idea-out").innerHTML = bar +
    `<div style="border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:20px 22px;background:rgba(255,255,255,.02);white-space:pre-wrap;line-height:1.65;font-size:.95rem;">${mdRender(data.synthesis||"")}</div>` +
    (src ? `<div style="margin-top:14px;font-size:.8rem;color:var(--text-muted,#8a94a6);"><strong style="color:var(--text,#e8eaed);">Drawn from your:</strong> ${src}</div>` : "");
}
function copyOut(){ navigator.clipboard.writeText(_lastSynthesis); }
async function callCorpus(q, mode, context){
  $("idea-out").innerHTML = `<div class="cs-empty">${mode==='synthesis'?'Reading your corpus and thinking':'Reshaping into a '+(mode==='video'?'video plan':'Monday Music Tips plan')}… (a few seconds)</div>`;
  const prov = $("idea-gen").checked ? null : "own";
  const { data, error } = await db.functions.invoke("corpus-ai", { body: { query:q, mode, context:context||"", provenance:prov } });
  if (error || (data && data.error)){ $("idea-out").innerHTML = `<div class="cs-empty">Error: ${esc((error&&error.message)||(data&&data.error)||"failed")}</div>`; return; }
  _lastQuery = q; _lastSynthesis = data.synthesis||"";
  renderOut(data); loadHistory();
}
async function findThinking(){ const q = $("idea-q").value.trim(); if (q) await callCorpus(q, "synthesis", ""); }
async function reformat(mode){ if (_lastQuery) await callCorpus(_lastQuery, mode, _lastSynthesis); }
async function loadHistory(){
  const { data } = await db.from("corpus_idea_runs").select("id,mode,query,created_at").order("created_at",{ascending:false}).limit(25);
  if (!data || !data.length){ $("idea-history").innerHTML=""; return; }
  const label = m => m==='video'?'Video plan':m==='mmt'?'MMT plan':'Ideas';
  $("idea-history").innerHTML = `<div style="font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.5;margin-bottom:8px;">Saved · ${data.length}</div>` +
    data.map(r => `<div class="cs-card" style="padding:10px 14px;cursor:pointer;margin-bottom:8px;" onclick="openRun('${r.id}')">
      <div class="cs-card-head" style="margin:0;"><span class="cs-badge ${r.mode==='synthesis'?'':'gen'}">${label(r.mode)}</span>
        <span class="cs-title" style="font-weight:600;font-size:.9rem;">${esc((r.query||'').slice(0,90))}</span>
        <span class="cs-meta">${fmtDate(r.created_at)}</span></div></div>`).join("");
}
async function openRun(id){
  const { data } = await db.from("corpus_idea_runs").select("query,mode,synthesis,sources").eq("id",id).single();
  if (!data) return;
  _lastQuery = data.query; _lastSynthesis = data.synthesis||"";
  renderOut({synthesis:data.synthesis, sources:data.sources||[]});
  $("idea-out").scrollIntoView({behavior:"smooth",block:"start"});
}

async function loadStats(){
  try {
    const own = await db.from("corpus_entries").select("id",{count:"exact",head:true}).eq("provenance","own");
    const gen = await db.from("corpus_entries").select("id",{count:"exact",head:true}).eq("provenance","generated");
    $("cs-stats").textContent = `${(own.count||0).toLocaleString()} pieces in your own voice · ${(gen.count||0).toLocaleString()} generated reference`;
  } catch(e){ $("cs-stats").textContent = ""; }
}

// ── Search ──
let _prov = "own";
document.querySelectorAll("#prov-seg button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#prov-seg button").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); _prov = b.dataset.prov; runSearch();
});
$("src").onchange = runSearch;
$("q").addEventListener("keydown", e => { if (e.key === "Enter") runSearch(); });

async function runSearch(){
  const q = $("q").value.trim();
  const src = $("src").value || null;
  $("results").innerHTML = `<div class="cs-empty">Searching…</div>`;
  const { data, error } = await db.rpc("search_corpus", {
    p_q: q, p_provenance: _prov || null, p_source: src, p_limit: 60
  });
  if (error){ $("results").innerHTML = `<div class="cs-empty">Error: ${esc(error.message)}</div>`; return; }
  if (!data || !data.length){ $("results").innerHTML = `<div class="cs-empty">Nothing found${q?` for “${esc(q)}”`:""}.</div>`; return; }
  $("results").innerHTML = data.map(r => {
    const badge = r.provenance === "own"
      ? `<span class="cs-badge">${esc(SRC[r.source_type]||r.source_type)}</span>`
      : `<span class="cs-badge gen">${esc(SRC[r.source_type]||r.source_type)}</span>`;
    const title = r.title || "(untitled " + (SRC[r.source_type]||r.source_type).toLowerCase() + ")";
    const open = r.url ? `<a class="cs-link" href="${esc(r.url)}" target="_blank" rel="noopener">Open original ↗</a>` : "";
    return `<div class="cs-card">
      <div class="cs-card-head">${badge}<span class="cs-title">${esc(title)}</span>
        <span class="cs-meta">${fmtDate(r.published_at)} · ${(r.word_count||0).toLocaleString()} words</span></div>
      <div class="cs-snip">${hl(r.snippet)}</div>
      <div class="cs-actions"><button class="cs-link" onclick="openDetail('${r.id}')">View full</button>${open}</div>
    </div>`;
  }).join("");
}

// ── Detail ──
let _detailText = "";
async function openDetail(id){
  const { data } = await db.from("corpus_entries").select("title,body,url,source_type,provenance").eq("id", id).single();
  if (!data) return;
  _detailText = data.body || "";
  $("d-badge").textContent = SRC[data.source_type] || data.source_type;
  $("d-badge").className = "cs-badge" + (data.provenance === "own" ? "" : " gen");
  $("d-title").textContent = data.title || "(untitled)";
  $("d-body").textContent = data.body || "";
  const open = $("d-open");
  if (data.url){ open.href = data.url; open.style.display = ""; } else { open.style.display = "none"; }
  $("modal").classList.add("open"); $("modal-bg").classList.add("open");
}
function closeDetail(){ $("modal").classList.remove("open"); $("modal-bg").classList.remove("open"); }
function copyDetail(){ navigator.clipboard.writeText(_detailText).then(()=>{ $("d-copy").textContent="Copied"; setTimeout(()=>$("d-copy").textContent="Copy",1200); }); }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDetail(); });

// restore session
(async () => {
  const { data:{ session } } = await db.auth.getSession();
  if (session && OWNER_EMAILS.includes((session.user.email||"").toLowerCase())) enter();
})();
</script>
<script src="/studio-nav.js" defer></script>
</body>
