// ── Views ─────────────────────────────────────────────────────
// Push/replace a history entry for in-page view changes so swipe-back / browser-back
// steps Lesson → Course → Overview instead of leaving the page.
function _courseHist(state, url, push) {
  /* A lesson credits its own estimated minutes when it is marked done, so a live
     session clock stands down while one is OPEN and gives the time back on the
     way out. The course list and the overview log nothing, so it keeps running
     there: only what logs its own time stops it. */
  if (window.RMLive) {
    if (state && state.view === "lesson") {
      RMLive.hold("lesson", "This lesson logs your time when the video finishes.");
    } else {
      RMLive.release("lesson");
    }
  }
  if (push === false) return;
  if (location.pathname + location.search !== url) history.pushState(state, "", url);
  else history.replaceState(state, "", url);
}

// Crossfade, dots, and an interval that pauses under the pointer. The timer is
// held on window because a view swap throws the element away while it is still
// running, and an interval calling into detached nodes never stops on its own.
// The hold before a slide plays: the still lands first, so the picture is a
// picture before it starts moving. Learn's number, so both heroes feel the same.
const CV_HOLD = 1200;
let _muxReady = null;
function ensureMuxPlayer() {
  if (_muxReady) return _muxReady;
  if (window.customElements && customElements.get("mux-player")) return (_muxReady = Promise.resolve());
  _muxReady = new Promise(done => {
    const t = document.createElement("script");
    t.src = "https://cdn.jsdelivr.net/npm/@mux/mux-player@3.12.0";
    t.onload = done; t.onerror = done;          // a failed load just leaves the still
    document.head.appendChild(t);
  });
  return _muxReady;
}

/* Only the slide you are on plays, and it plays muted, looped, with no player
   showing and nothing clickable. A phone gets to say no: reduced motion, Data
   Saver or a connection the browser calls 2g all stay a still. */
function cvPlay(slide) {
  if (!slide) return;
  const still = slide.querySelector(".cv-bd[data-mux]");
  if (!still || slide.querySelector(".cv-vid")) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const net = navigator.connection || {};
  if (net.saveData || /(^|-)2g$/.test(net.effectiveType || "")) return;
  setTimeout(() => {
    if (!slide.classList.contains("on") || slide.querySelector(".cv-vid")) return;
    ensureMuxPlayer().then(() => {
      if (!slide.classList.contains("on") || slide.querySelector(".cv-vid")) return;
      const m = document.createElement("mux-player");
      m.className = "cv-vid";
      m.setAttribute("playback-id", still.dataset.mux);
      m.setAttribute("stream-type", "on-demand");
      m.setAttribute("autoplay", "muted");
      m.setAttribute("muted", "");
      m.setAttribute("loop", "");
      m.setAttribute("playsinline", "");
      m.setAttribute("nohotkeys", "");
      m.setAttribute("tabindex", "-1");
      m.setAttribute("start-time", String(20));
      m.addEventListener("playing", () => { cvExpand(slide.closest(".cv-hero")); m.classList.add("ready"); }, { once: true });
      // Its chrome is already off, so no state of it is wrong to show: a
      // backstop can reveal it even if it never reports itself playing.
      setTimeout(() => { cvExpand(slide.closest(".cv-hero")); m.classList.add("ready"); }, 2600);
      still.insertAdjacentElement("afterend", m);   // over the still, under the scrim
    });
  }, CV_HOLD);
}
function cvStop(slide) { slide.querySelectorAll(".cv-vid").forEach(v => v.remove()); }

/* When it starts playing the hero settles into the video's own shape, so the
   frame is 16:9 and nothing is cropped. Not on a phone: 16:9 of a 375px screen
   is shorter than the hero already is, so it would shrink rather than grow -
   which is why Learn skips it there too. Once tall it stays tall, so moving
   between slides is not a series of height changes. */
function cvExpand(hero) {
  if (!hero || hero.dataset.tall || window.innerWidth <= 640) return;
  const from = hero.clientHeight, to = Math.round(hero.clientWidth * 9 / 16);
  if (to <= from + 8) return;
  hero.dataset.tall = "1";
  // Growing under someone who has scrolled past would shove the page down, so
  // off-screen it happens instantly and the scroll position absorbs it.
  const away = window.scrollY > 60;
  if (away) hero.style.transition = "none";
  hero.style.setProperty("--cvh", to + "px");
  if (away) { window.scrollBy(0, to - from); requestAnimationFrame(() => { hero.style.transition = ""; }); }
}

function wireHero(root) {
  if (window._cvTimer) { clearInterval(window._cvTimer); window._cvTimer = null; }
  const cv = root.querySelector(".cv-hero");
  if (!cv) return;
  const slides = [...cv.querySelectorAll(".cv-slide")];
  const dots = [...cv.querySelectorAll(".cv-dot")];
  let at = 0;
  const show = i => { at = (i + slides.length) % slides.length;
    slides.forEach((s, k) => { const on = k === at; s.classList.toggle("on", on);
      if (on) cvPlay(s); else cvStop(s); });
    dots.forEach((d, k) => d.classList.toggle("on", k === at)); };
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const run = () => { if (still || slides.length < 2) return;
    clearInterval(window._cvTimer); window._cvTimer = setInterval(() => show(at + 1), 7000); };
  dots.forEach(d => d.onclick = e => { e.stopPropagation(); show(+d.dataset.i); run(); });
  cv.querySelectorAll("[data-go]").forEach(b => b.onclick = e => { e.stopPropagation();
    if (b.dataset.go) openLesson(b.dataset.go, b.dataset.course); else renderCourse(b.dataset.course); });
  cv.querySelectorAll("[data-open]").forEach(b => b.onclick = e => { e.stopPropagation(); renderCourse(b.dataset.open); });
  // Pausing on the whole hero meant a pointer resting anywhere over a very
  // large picture silently stopped the rotation, which reads as it working
  // only sometimes. Only the words and buttons hold it now - the part you
  // would be about to click, where a slide changing under you is the problem.
  const hold = cv.querySelector(".cv-in");
  if (hold) {
    hold.addEventListener("mouseenter", () => clearInterval(window._cvTimer));
    hold.addEventListener("mouseleave", run);
  }
  cvPlay(slides[0]);
  run();
}

function renderOverview(push) {
  window._shPageDetail = "Courses"; if (window._shPing) window._shPing();
  document.title = "Courses · The Practice Room";
  _courseHist({ view: "overview" }, "/courses.html", push);
  const v = document.getElementById("view");

  const order = {}; COURSES.forEach((c, i) => order[c.key] = i);
  const total = LESSONS.length;
  const doneCount = LESSONS.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
  const overallPct = total ? Math.round(doneCount / total * 100) : 0;
  const ordered = [...LESSONS].sort((a, b) => (order[a.course] - order[b.course]) || (a.level - b.level) || (a.sort_order - b.sort_order));
  const next = ordered.find(l => !(PROGRESS[l.id] && PROGRESS[l.id].completed));
  const anyDone = doneCount > 0;

  // The hero replaces the old head card and the resume card: its first slide
  // IS "continue where you left off", at the size Learn gives that job.

  // ── Premium course cards: full vertical units with progress bar + CTA ──
  // Live courses are the ones with published lessons. Courses flagged `soon` are
  // shown after them as inert cards, so the list never looks like a finished set.
  const liveCourses = COURSES.filter(c => !c.soon && LESSONS.some(l => l.course === c.key));
  const soonCourses = COURSES.filter(c => c.soon);

  // Premium course card: a coloured hero (Mux thumbnail for video courses, icon-on-
  // gradient for written ones) over a body with title, promise, progress and a CTA.
  function courseCard(c) {
    const ls = LESSONS.filter(l => l.course === c.key);
    const done = ls.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
    const pct = ls.length ? Math.round(done / ls.length * 100) : 0;
    const started = done > 0;
    const isVideo = c.format === "video" && c.thumbId;
    const hero = isVideo
      ? `<div class="cc-hero cc-hero--video">
           <img class="cc-hero-img" src="https://image.mux.com/${c.thumbId}/thumbnail.webp?width=880&height=495&fit_mode=smartcrop&time=${c.thumbTime || 0}" alt="" loading="lazy">
           <span class="cc-hero-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>
           <span class="cc-hero-tag">Video course</span>
         </div>`
      : `<div class="cc-hero cc-hero--icon"><span class="cc-hero-ic">${c.icon}</span></div>`;
    return `<div class="course-card" data-course="${c.key}" style="--cc-accent:${c.color}">
      ${hero}
      <div class="cc-body">
        ${c.audience ? `<div class="cc-level">${c.audience}</div>` : ""}
        <div class="cc-title">${c.label}</div>
        <div class="cc-blurb">${c.blurb}</div>
        <div class="cc-spacer"></div>
        ${started ? `<div class="cc-track"><div class="cc-track-fill" style="width:${pct}%"></div></div>` : ""}
        <div class="cc-foot">
          <span class="cc-count">${ls.length} lesson${ls.length === 1 ? "" : "s"}${started ? ` · ${pct}% done` : ""}</span>
          <span class="cc-cta">${started ? "Continue" : "Start"}${ARROW_ICON}</span>
        </div>
      </div></div>`;
  }

  // Same shape as a live card, greyed back and not clickable: it exists to answer
  // "is that everything?", which is the question that precedes a cancellation.
  function soonCard(c) {
    return `<div class="course-card soon" style="--cc-accent:${c.color}">
      <div class="cc-hero cc-hero--icon"><span class="cc-hero-ic">${c.icon}</span></div>
      <div class="cc-body">
        ${c.audience ? `<div class="cc-level">${c.audience}</div>` : ""}
        <div class="cc-title">${c.label}</div>
        <div class="cc-blurb">${c.blurb}</div>
        <div class="cc-spacer"></div>
        <div class="cc-foot"><span class="soon-badge">${c.soon}</span></div>
      </div></div>`;
  }

  // Big space-filling feature card (used when only one course is live, so the
  // page reads as a rich, full offering rather than one lonely card).
  function featureCard(c) {
    const ls = LESSONS.filter(l => l.course === c.key);
    const done = ls.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
    const byLv = {}; ls.forEach(l => (byLv[l.level] = byLv[l.level] || []).push(l));
    const levels = Object.keys(byLv).map(Number).sort((a, b) => a - b);
    const levelRows = levels.map(lv => {
      const lv2 = byLv[lv];
      const ld = lv2.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
      const lp = lv2.length ? Math.round(ld / lv2.length * 100) : 0;
      return `<div class="cf-level"><div class="cf-level-top"><span class="cf-level-name">Level ${lv}</span>
        <span class="cf-level-meta">${ld}/${lv2.length} lesson${lv2.length === 1 ? "" : "s"}</span></div>
        <div class="cc-bar"><i style="width:${lp}%"></i></div></div>`;
    }).join("");
    return `<div class="course-feature" data-course="${c.key}" style="--cc-accent:${c.color};--cc-tint:${c.color}1f">
      <div class="cf-head"><div class="course-ic cf-ic">${c.icon}</div>
        <div class="cf-head-text"><div class="cf-eyebrow">Course</div><div class="cf-title">${c.label}</div>
          <div class="cf-blurb">${c.blurb}</div></div></div>
      <div class="cf-stats">
        <div class="cf-stat"><b>${ls.length}</b><span>lesson${ls.length === 1 ? "" : "s"}</span></div>
        <div class="cf-stat"><b>${levels.length}</b><span>level${levels.length === 1 ? "" : "s"}</span></div>
        <div class="cf-stat"><b>${done}</b><span>done</span></div>
      </div>
      <div class="cf-levels-h">Lessons by level</div>
      <div class="cf-levels">${levelRows}</div>
      <button class="cf-cta">${done > 0 ? "Continue learning" : "Start the course"}${ARROW_ICON}</button></div>`;
  }

  // ── Hero: three slides. The course you are furthest into, then the next
  // furthest, then one that is coming. A course that has never been opened
  // still fills a slot if you have not started two, so the hero is never
  // half-empty. The backdrop follows the rule the cards already use: the
  // course's own artwork if it has any, otherwise its colour and its icon. ──
  const prog = {};
  LESSONS.forEach(l => { const p = prog[l.course] || (prog[l.course] = { total: 0, done: 0 });
    p.total++; if (PROGRESS[l.id] && PROGRESS[l.id].completed) p.done++; });
  const heroLive = COURSES.filter(c => !c.soon && prog[c.key]);
  const heroPick = [
    ...heroLive.filter(c => prog[c.key].done > 0).sort((a, b) => prog[b.key].done - prog[a.key].done),
    ...heroLive.filter(c => !prog[c.key].done),
  ].slice(0, 2);
  const heroSoon = COURSES.find(c => c.soon);
  if (heroSoon) heroPick.push(heroSoon);

  const PLAY_TRI = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>';
  function heroSlide(c, i) {
    const art = c.format === "video" && c.thumbId;
    const bd = art
      ? `<img class="cv-bd" data-mux="${c.thumbId}" src="https://image.mux.com/${c.thumbId}/thumbnail.webp?width=1600&height=900&fit_mode=smartcrop&time=${c.thumbTime || 0}" alt=""${i ? ' loading="lazy"' : ""}>`
      : `<div class="cv-plate"></div><div class="cv-plate-ic">${c.icon}</div>`;
    let kick, title, meta, extra = "", acts = "";
    if (c.soon) {
      kick = "Coming soon"; title = c.label; meta = escHtml(c.blurb);
      extra = `<div class="cv-soon">${escHtml(c.soon)}</div>`;
    } else if (prog[c.key].done > 0) {
      const p = prog[c.key];
      const nx = ordered.find(l => l.course === c.key && !(PROGRESS[l.id] && PROGRESS[l.id].completed));
      kick = "Continue &middot; " + escHtml(c.label);
      title = escHtml(nx ? nx.title : c.label);
      meta = nx
        ? `Level ${nx.level}${nx.est_minutes ? ` &middot; <b>${nx.est_minutes} min</b>` : ""} &middot; Lesson ${p.done + 1} of ${p.total}`
        : `All ${p.total} lessons done`;
      extra = `<div class="cv-track"><i style="width:${Math.round(p.done / p.total * 100)}%"></i></div>`;
      acts = `<div class="cv-acts">
        <button class="cv-btn cv-btn-p" data-go="${nx ? nx.id : ""}" data-course="${c.key}">${nx ? PLAY_TRI + " Continue" : "Course contents"}</button>
        ${nx ? `<button class="cv-btn cv-btn-g" data-open="${c.key}">Course contents</button>` : ""}</div>`;
    } else {
      kick = "Start a course"; title = escHtml(c.label);
      meta = `${prog[c.key].total} lessons${c.audience ? " &middot; " + escHtml(c.audience) : ""}`;
      acts = `<div class="cv-acts"><button class="cv-btn cv-btn-p" data-open="${c.key}">Start the course</button></div>`;
    }
    return `<div class="cv-slide${i ? "" : " on"}" style="--pc:${c.color}">${bd}<div class="cv-scrim"></div>
      <div class="cv-in"><span class="cv-kick">${kick}</span>
        <div class="cv-title">${title}</div><div class="cv-meta">${meta}</div>${extra}${acts}</div></div>`;
  }
  const cvFoot = total ? `<div class="cv-foot">
    <div class="cv-nums"><span><b>${liveCourses.length}</b> course${liveCourses.length === 1 ? "" : "s"}</span>
      <span><b>${total}</b> lessons</span><span><b>${doneCount}</b> done</span></div>
    <div class="cv-obar"><i style="width:${overallPct}%"></i></div></div>` : "";

  const cvHero = heroPick.length ? `<div class="cv-hero">${heroPick.map(heroSlide).join("")}${cvFoot}
    ${heroPick.length > 1 ? `<div class="cv-dots">${heroPick.map((_, i) =>
      `<button class="cv-dot${i ? "" : " on"}" data-i="${i}" aria-label="Slide ${i + 1}"></button>`).join("")}</div>` : ""}</div>` : "";

  const coursesHTML = (liveCourses.length === 1 && !soonCourses.length)
    ? featureCard(liveCourses[0])
    : `<div class="course-grid">${liveCourses.map(courseCard).join("")}${soonCourses.map(soonCard).join("")}</div>`;

  v.innerHTML = cvHero + `<div class="ov-sec">Your course${liveCourses.length === 1 ? "" : "s"}</div>` + coursesHTML;

  wireHero(v);
  v.querySelectorAll(".course-card:not(.soon), .course-feature").forEach(el => el.onclick = () => renderCourse(el.dataset.course));
  scrollTop();
}

function renderCourse(courseKey, push) {
  if (window._cvTimer) { clearInterval(window._cvTimer); window._cvTimer = null; }
  document.querySelectorAll(".cv-vid").forEach(v => v.remove());
  const c = COURSE[courseKey];
  window._shPageDetail = "Courses · " + c.label; if (window._shPing) window._shPing();
  document.title = c.label + " · The Practice Room";
  _courseHist({ view: "course", course: courseKey }, "/courses.html?course=" + encodeURIComponent(courseKey), push);
  const v = document.getElementById("view");
  const ls = LESSONS.filter(l => l.course === courseKey);
  // A course with practice breaks reads as a single-column sequence (lesson, break, lesson),
  // not the multi-column grid used for courses of independent lessons.
  const _linear = ls.some(l => l.break_after);
  const byLevel = {};
  ls.forEach(l => { (byLevel[l.level] = byLevel[l.level] || []).push(l); });
  const levels = Object.keys(byLevel).map(Number).sort((a, b) => a - b);

  const groups = levels.map(lv => {
    const rows = byLevel[lv].slice().sort((a, b) => a.sort_order - b.sort_order).map((l, i) => {
      const done = PROGRESS[l.id] && PROGRESS[l.id].completed;
      const chk = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
      // Video lessons show a frame from their own video; written lessons show a clean
      // designed panel in the course colour. Both use the same rich card layout.
      const overlays = `${l.est_minutes ? `<span class="lvr-dur">${l.est_minutes} min</span>` : ""}${done ? `<span class="lvr-check">${chk}</span>` : ""}`;
      const lvl = Math.min(5, Math.max(1, l.level || 1));
      const thumb = l.thumb_id
        ? `<div class="lvr-thumb"><img src="https://image.mux.com/${l.thumb_id}/thumbnail.webp?width=440&height=248&fit_mode=smartcrop" alt="" loading="lazy">
            <span class="lvr-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>${overlays}</div>`
        : `<div class="lvr-thumb lvr-thumb--num lvr-l${lvl}"><span class="lvr-num">${i + 1}</span>${l.card_label ? `<span class="lvr-topic">${escHtml(l.card_label)}</span>` : ""}${overlays}</div>`;
      const row = `<div class="lesson-vrow${done ? " is-done" : ""}" data-id="${l.id}">
        ${thumb}
        <div class="lvr-info"><div class="lvr-eyebrow">Lesson ${i + 1}</div>
          <div class="lvr-title">${escHtml(l.title)}</div>
          ${l.summary ? `<div class="lvr-sum">${escHtml(l.summary)}</div>` : ""}</div>
      </div>`;
      // A practice break sits inline after its lesson, not as a clickable lesson of its own,
      // so the member sees at a glance that they should go and practise before moving on.
      const brk = l.break_after ? `<div class="lesson-break">
        <div class="lesson-break-label"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 4 3 12 11 12"/></svg>Practice break</div>
        <div class="lesson-break-body">${escHtml(l.break_after)}</div>
        <a class="lesson-break-log" href="/practice-log.html?log=piece">Log your practice</a>
      </div>` : "";
      return row + brk;
    }).join("");
    const levelHead = levels.length > 1 ? `<div class="level-h"><span class="lvl">Level ${lv}</span><span class="ln"></span></div>` : "";
    return `<div class="level-group">${levelHead}<div class="lesson-grid${_linear ? " linear" : ""}">${rows}</div></div>`;
  }).join("");

  // Premium course hero: colour, audience, progress, and a Continue button that jumps to
  // the first unfinished lesson.
  const _doneN = ls.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
  const _pct = ls.length ? Math.round(_doneN / ls.length * 100) : 0;
  const _seq = ls.slice().sort((a, b) => a.level - b.level || a.sort_order - b.sort_order);
  const _next = _seq.find(l => !(PROGRESS[l.id] && PROGRESS[l.id].completed)) || _seq[0];
  const chArt = c.format === "video" && c.thumbId
    ? `<img class="ch-bd" src="https://image.mux.com/${c.thumbId}/thumbnail.webp?width=1600&height=900&fit_mode=smartcrop&time=${c.thumbTime || 0}" alt=""><div class="ch-bd-scrim"></div>`
    : "";
  const courseHero = `<div class="course-hero" style="--cc-accent:${c.color}">${chArt}
    <div class="ch-top">
      <div class="ch-ic">${c.icon}</div>
      <div class="ch-head">
        ${c.audience ? `<span class="ch-level">${c.audience}</span>` : ""}
        <div class="ch-title">${c.label}</div>
        <div class="ch-blurb">${c.blurb}</div>
      </div>
    </div>
    ${ls.length ? `<div class="ch-prog">
      <div class="ch-track"><i style="width:${_pct}%"></i></div>
      <div class="ch-prog-meta"><span>${_doneN} of ${ls.length} lesson${ls.length === 1 ? "" : "s"} done</span><span>${_pct}%</span></div>
    </div>
    <button class="ch-cta" data-continue>${_doneN > 0 ? "Continue where you left off" : "Start the course"}${ARROW_ICON}</button>` : ""}
  </div>`;

  // For the Absolute Beginner Course, an always-visible "too easy" exit so anyone
  // who already plays a little can jump straight to real pieces rather than feel
  // stuck in a course pitched below them.
  const tooEasy = courseKey === "first-steps"
    ? `<a class="too-easy" href="/resources.html">
         <span class="te-text">This course is for complete beginners. <strong>Already play a little? Find pieces at your level.</strong></span>
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
       </a>`
    : "";
  v.innerHTML = `
    <div class="crumbs"><a data-home>Courses</a><span class="sep">/</span><span>${c.label}</span></div>
    ${courseHero}
    ${tooEasy}
    <div style="--cc-accent:${c.color}">${groups || `<div class="empty">No lessons published yet.</div>`}</div>`;
  v.querySelector("[data-home]").onclick = renderOverview;
  const _ctaBtn = v.querySelector(".ch-cta[data-continue]");
  if (_ctaBtn && _next) _ctaBtn.onclick = () => openLesson(_next.id, courseKey);
  v.querySelectorAll(".lesson-row, .lesson-vrow").forEach(r => r.onclick = () => openLesson(r.dataset.id, courseKey));
  scrollTop();
}

async function openLesson(id, courseKey, push) {
  const v = document.getElementById("view");
  v.innerHTML = `<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>`;
  const { data: lesson, error } = await db.from("lessons").select("*").eq("id", id).single();
  if (error || !lesson) {
    showToast("Could not load that lesson.");
    if (courseKey && COURSE[courseKey]) renderCourse(courseKey, false); else renderOverview(false);
    return;
  }
  const c = COURSE[lesson.course] || { label: "Course" };
  window._shPageDetail = "Courses · " + c.label + " · " + lesson.title; if (window._shPing) window._shPing();
  document.title = lesson.title + " · The Practice Room";
  _courseHist({ view: "lesson", lesson: id, course: lesson.course }, "/courses.html?lesson=" + encodeURIComponent(id), push);

  v.innerHTML = `<div class="lesson-reader">
    <div class="crumbs"><a data-home>Courses</a><span class="sep">/</span><a data-course>${c.label}</a><span class="sep">/</span><span>Lesson</span></div>
    <div class="reader-head">
      <h2>${escHtml(lesson.title)}</h2>
      ${lesson.summary ? `<div class="sub">${escHtml(lesson.summary)}</div>` : ""}
      ${SHEET_MUSIC[lesson.course] ? `<a class="sheet-btn" href="${SHEET_MUSIC[lesson.course].url}" target="_blank" rel="noopener" download><span class="sheet-ico">&#x2913;</span>${escHtml(SHEET_MUSIC[lesson.course].label)}</a>` : ""}
    </div>
    <div id="lesson-body"></div>
    <div class="complete-bar" id="complete-bar"></div></div>`;

  v.querySelector("[data-home]").onclick = renderOverview;
  v.querySelector("[data-course]").onclick = () => renderCourse(lesson.course);

  const body = document.getElementById("lesson-body");
  body.innerHTML = LessonRender.html(lesson.blocks || []);
  // Free-text answers: the renderer matches locally first; this only runs when
  // that fails, so a correct answer phrased differently still marks correct.
  if (LessonRender.setGrader) {
    LessonRender.setGrader(async (q) => {
      try {
        const { data, error } = await db.functions.invoke("quiz-grade", { body: q });
        return !error && !!(data && data.correct);
      } catch (e) { return false; }
    });
  }
  let lastScore = null;
  LessonRender.init(body, {
    onQuizScore: (score, total) => { lastScore = { score, total }; },
    onShare: () => showToast("Sharing from lessons is coming soon."),
  });

  // Complete toggle: mark complete, or un-mark if it was done by accident.
  const bar = document.getElementById("complete-bar");
  function paintBar() {
    const done = PROGRESS[id] && PROGRESS[id].completed;
    bar.innerHTML = done
      ? `<span class="done-note">${CHECK_BIG} Completed</span><button class="btn" id="toggle-complete">Mark as not complete</button>`
      : `<button class="btn btn-gold" id="toggle-complete">Mark complete</button>`;
    bar.querySelector("#toggle-complete").onclick = () => {
      // Un-marking removes the practice this lesson logged and recomputes the
      // streak, so confirm it — stops an accidental tap wiping a real completion.
      if (done && !confirm("Mark this lesson as not complete? This removes the practice time it logged and may affect your streak.")) return;
      setDone(!done);
    };
  }
  async function setDone(done) {
    const btn = bar.querySelector("#toggle-complete"); btn.disabled = true; btn.textContent = "Saving…";
    const row = {
      email: myEmail, lesson_id: id, completed: done,
      score: done ? lastScore : ((PROGRESS[id] && PROGRESS[id].score) || null),
      completed_at: done ? new Date().toISOString() : null, updated_at: new Date().toISOString(),
    };
    const { error: e } = await db.from("lesson_progress").upsert(row, { onConflict: "email,lesson_id" });
    if (e) { paintBar(); showToast("Could not save. Try again."); return; }
    PROGRESS[id] = { completed: done, score: row.score };
    paintBar();

    // Auto-log the lesson's time toward practice — once, deduped by origin_ref.
    // Completing moves BOTH goals: the day (a practice day) and the hours (toward
    // the next roadmap level). Un-marking removes the entry. The toast makes it
    // visible so it's never re-logged manually.
    let loggedMins = 0, loggedSessionId = null;
    try {
      if (done && window.PracticeAutolog) {
        const r = await window.PracticeAutolog.logAppActivity(db, {
          email: myEmail, source: "app-lesson", originRef: "lesson:" + id,
          // Learning a piece counts as repertoire; theory/ear courses count as musicianship.
          minutes: lesson.est_minutes, itemType: lesson.course === "learn-your-first-piece" ? "piece" : "theory",
          items: lesson.course === "first-steps" ? _fsSplit(lesson.est_minutes) : null,
          label: lesson.title, notes: "Course lesson: " + lesson.title,
        });
        loggedMins = r.logged ? r.minutes : 0;
        loggedSessionId = r.logged ? r.sessionId : null;
        if (r.logged) { try { await db.rpc("recompute_streak_tokens", { p_email: myEmail }); } catch (_) {} }
      } else if (!done && window.PracticeAutolog) {
        await window.PracticeAutolog.removeAppActivity(db, {
          email: myEmail, source: "app-lesson", originRef: "lesson:" + id });
        try { await db.rpc("recompute_streak_tokens", { p_email: myEmail }); } catch (_) {}
        // Un-marking removed the lesson + its auto-logged practice. Revoke any
        // badge that no longer holds (e.g. First Lesson, First Note), keeping ones
        // still earned by other data.
        try { if (window.tcReconcileAchievements) await window.tcReconcileAchievements(); } catch (_) {}
      }
    } catch (_) {}

    // On completion, open the time editor so the logged minutes are adjustable
    // right here (not only later in the practice log). Fall back to a toast if
    // nothing was logged (e.g. re-completing an already-logged lesson).
    if (done && loggedSessionId) {
      openLoggedTimeEditor(loggedSessionId, loggedMins);
    } else {
      showToast(done ? "Lesson complete" : "Marked as not complete");
    }
    // Re-check achievements (First Lesson, Theory: Level 1) after a completion.
    if (done && window.tcCheckAchievements) window.tcCheckAchievements({ force: true });
  }
  paintBar();
  // Video lessons complete themselves: when the member watches to the end it marks done
  // (which auto-logs the practice). They can still toggle it manually with the button.
  const _vid = body.querySelector("mux-player");
  if (_vid) {
    let _autoDone = false;
    const _finish = () => {
      if (_autoDone || (PROGRESS[id] && PROGRESS[id].completed)) return;
      _autoDone = true; setDone(true);
    };
    _vid.addEventListener("ended", _finish, { once: true });
    // Fallback: some players don't fire "ended" if the final moment buffers, so treat
    // watching to >=97% as complete too. logAppActivity also dedupes by origin_ref.
    const _tu = () => {
      const d = _vid.duration || 0, t = _vid.currentTime || 0;
      if (d > 0 && t / d >= 0.97) { _vid.removeEventListener("timeupdate", _tu); _finish(); }
    };
    _vid.addEventListener("timeupdate", _tu);
  }
  scrollTop();
}

function scrollTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }

// ── Boot ──────────────────────────────────────────────────────
(async function () {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/"; return; }
  myEmail = session.user.email;

  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];

  try {
    initSharedHeader({ db, myEmail, myName, isAdmin: myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase(), activePage: "learn", avatarUrl: (ae && ae.avatar_url) || null });
  } catch (e) { console.error("initSharedHeader error:", e); }

  // Owner-only preview: ?preview=1 includes DRAFT lessons so an unpublished course
  // can be walked end-to-end on the courses page before going live. Members always
  // see published lessons only.
  const _isOwner = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();
  const _preview = _isOwner && new URLSearchParams(location.search).get("preview") === "1";
  let _lessonsQ = db.from("lessons").select("id,course,level,sort_order,title,summary,est_minutes,break_after,thumb_id,card_label")
    .in("course", COURSES.map(c => c.key));
  if (!_preview) _lessonsQ = _lessonsQ.eq("status", "published");
  _lessonsQ = _lessonsQ.order("course").order("level").order("sort_order");
  const _emailLc = (myEmail || "").toLowerCase();
  const [{ data: lessons }, { data: prog }, { data: _sess }, { data: _base },
         { data: _fsIds }, { data: _ns }, { data: _cs }, { data: _es }, { data: _is }, { data: _msc }, { data: _uc }] = await Promise.all([
    _lessonsQ,
    db.from("lesson_progress").select("lesson_id,completed,score").eq("email", myEmail),
    db.from("practice_sessions").select("duration_minutes").eq("email", myEmail),
    db.from("practice_baseline").select("total_minutes").eq("email", myEmail).maybeSingle(),
    db.from("lessons").select("id").eq("course", "first-steps"),
    db.from("note_game_scores").select("score").eq("email", myEmail),
    db.from("chord_game_scores").select("score").eq("email", myEmail),
    db.from("ear_game_scores").select("score").eq("email", myEmail),
    db.from("interval_game_scores").select("score").eq("email", _emailLc),
    db.from("member_self_checks").select("checks").eq("email", myEmail).maybeSingle(),
    db.from("user_collections").select("status").eq("email", myEmail),
  ]);
  if (_preview) { try { showToast("Preview mode: showing draft lessons too"); } catch (_) {} }
  LESSONS = lessons || [];
  PROGRESS = {};
  (prog || []).forEach(p => { PROGRESS[p.lesson_id] = { completed: p.completed, score: p.score }; });

  // Course order: The Absolute Beginner Course sits UNDER Music Theory by default,
  // and lifts ABOVE it for a flagged absolute beginner — the same signal as the
  // dashboard "Start here" pick: they've started it (sticky), OR they look fresh
  // (under 5h total incl. prior hours, no real game score) and haven't dismissed
  // it. Owner preview: ?bf=1 forces the beginner-first order.
  const _maxScore = a => (a || []).reduce((m, r) => Math.max(m, r.score || 0), 0);
  const _totMin = (_sess || []).reduce((a, r) => a + (r.duration_minutes || 0), 0) + ((_base && _base.total_minutes) || 0);
  const _fsIdSet = new Set((_fsIds || []).map(r => r.id));
  const _fsStarted = (prog || []).some(p => p.completed && _fsIdSet.has(p.lesson_id));
  const _dismissed = !!(_msc && _msc.checks && _msc.checks.abc_dismissed);
  const _noStrongScore = _maxScore(_ns) < 8 && _maxScore(_cs) < 4 && _maxScore(_es) < 4 && _maxScore(_is) < 4;
  // A piece they are Learning or have Completed means they're actually playing, so
  // they aren't a fresh beginner. Aspire/wishlist pieces don't count (wanting to
  // play something isn't playing it).
  const _playsPieces = (_uc || []).some(r => r.status === "learning" || r.status === "completed");
  let _beginnerFirst = _fsStarted || (!_dismissed && _totMin < 300 && _noStrongScore && !_playsPieces);
  if (_isOwner && new URLSearchParams(location.search).get("bf") === "1") _beginnerFirst = true;
  const _fsi = COURSES.findIndex(c => c.key === "first-steps");
  if (_fsi > -1) {
    const [_fsc] = COURSES.splice(_fsi, 1);
    const _thi = COURSES.findIndex(c => c.key === "theory");
    COURSES.splice(_thi < 0 ? 0 : (_beginnerFirst ? _thi : _thi + 1), 0, _fsc);
  }

  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("app-main").style.display = "block";
  document.getElementById("app-header").style.display = "";

  // Deep-link straight to a lesson or course; otherwise the overview.
  const _sp = new URLSearchParams(location.search);
  const _lz = _sp.get("lesson"), _cz = _sp.get("course");
  if (_lz) openLesson(_lz, null, true);
  else if (_cz && COURSE[_cz]) renderCourse(_cz, true);
  else renderOverview(true);
})();

// Swipe-back / browser-back steps Lesson → Course → Overview.
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
window.addEventListener("popstate", (e) => {
  const s = e.state || {};
  if (s.view === "lesson" && s.lesson)      openLesson(s.lesson, s.course, false);
  else if (s.view === "course" && s.course) renderCourse(s.course, false);
  else                                      renderOverview(false);
});
</script>
</body>
</html>
