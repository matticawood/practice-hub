<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Courses · The Practice Room</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/lessons-render.js?v=43"></script>
<!-- Global styles so the shared header (its buttons use .btn/.btn-ghost/.btn-bell/
     #presence-btn from style.css) renders identically to every other page. Our
     own warm tokens + component CSS below override what we need. -->
<link rel="stylesheet" href="/style.css" />
<style>
  /* Warm "theory-mode" tokens — identical to resources.html so Courses matches
     the rest of the member section. */
  :root {
    --bg:#faf7f3; --surface:#ffffff; --surface-2:#f1f1f4; --border:#e0d5c8;
    --text:#1a1410; --text-muted:#8a7868; --accent:#F5C518; --accent-dark:#9a6f12;
    --accent-subtle:#fdf0d8;
    --shadow:0 1px 2px rgba(60,40,20,.05);
    --shadow-lift:0 8px 22px -10px rgba(60,40,20,.22);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  #loading-screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:50; }
  .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:#1a1410; color:#fff; padding:10px 16px; border-radius:10px; font-size:.85rem; opacity:0; pointer-events:none; transition:.25s; z-index:60; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); }
  #toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
  main { display:none; max-width:1400px; margin:0 auto; padding:28px 20px 110px; }
  /* Overview cards + lesson rows flow into grids so they fill the page width
     (parity with the Pieces Library), while the lesson reader stays narrow. */
  /* Courses sit 3 to a row, then collapse straight to a single list at the
     breakpoint (no awkward 2-up step where one card wraps underneath). */
  .course-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:stretch; }
  .course-grid .course-card { margin-bottom:0; }
  @media (max-width:900px) { .course-grid { grid-template-columns:1fr; } }
  .lesson-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr)); gap:10px; align-items:stretch; }
  .lesson-grid .lesson-row, .lesson-grid .lesson-vrow { margin-bottom:0; height:100%; }
  .lesson-grid.linear { grid-template-columns:1fr; gap:10px; }
  .lesson-break { display:flex; flex-direction:column; gap:7px; padding:13px 16px; border-radius:12px;
    background:color-mix(in srgb, var(--cc-accent,#d99e12) 8%, var(--surface)); border:1px solid color-mix(in srgb, var(--cc-accent,#d99e12) 28%, var(--border)); }
  .lesson-break-label { display:inline-flex; align-items:center; gap:6px; font-size:.6rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--cc-accent,#b8860b); }
  .lesson-break-body { font-size:.9rem; line-height:1.5; color:var(--text); }
  .lesson-break-log { align-self:flex-start; font-size:.8rem; font-weight:700; color:var(--cc-accent,#b8860b); text-decoration:none; }
  .lesson-break-log:hover { text-decoration:underline; }
  .lesson-reader { max-width:960px; margin:0 auto; }
  /* Let the lesson content fill the wider reader (renderer caps it at 680). */
  .lesson-reader .lr-body { max-width:none; }
  /* Keep the keyboard at its proportioned width and centre it; at full reader
     width it would become a stubby, over-wide strip (its height is capped). */
  .lesson-reader .lr-kbd { max-width:700px; margin-left:auto; margin-right:auto; }

  /* Page title — a bordered card with a gold icon tile, a coloured eyebrow line
     above the title, and a description below: matches the resources headers. */
  .page-head-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:20px 22px; margin:8px 0 18px; }
  .ph-row { display:flex; align-items:center; gap:14px; }
  .ph-icon { width:48px; height:48px; border-radius:14px; flex-shrink:0; background:linear-gradient(150deg,#f7d24a,#f5c518); color:#3a2c00; display:flex; align-items:center; justify-content:center; box-shadow:0 7px 16px -7px rgba(245,197,24,.7); }
  .ph-icon svg { width:24px; height:24px; }
  .ph-eyebrow { font-size:.72rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:3px; }
  .ph-title { font-size:1.7rem; font-weight:800; letter-spacing:-.02em; line-height:1.08; }
  .ph-sub { font-size:.92rem; color:var(--text-muted); line-height:1.5; margin-top:13px; max-width:560px; }
  @media (max-width:560px) {
    .page-head-card { padding:16px; }
    .ph-icon { width:42px; height:42px; border-radius:12px; }
    .ph-icon svg { width:22px; height:22px; }
    .ph-title { font-size:1.42rem; }
  }

  .crumbs { display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--text-muted); margin:4px 0 16px; flex-wrap:wrap; font-weight:600; }
  .crumbs a { color:var(--accent-dark); cursor:pointer; font-weight:700; }
  .crumbs a:hover { color:#6b5400; }
  .crumbs span.sep { opacity:.45; }

  /* "Too easy?" exit on the Absolute Beginner Course landing */
  .too-easy { display:flex; align-items:center; gap:12px; margin:0 0 18px; padding:13px 16px; border-radius:13px;
    text-decoration:none; color:var(--text); background:var(--surface-2); border:1px solid var(--border);
    transition:transform .15s ease, border-color .15s ease, background .15s ease; }
  .too-easy:hover { transform:translateY(-1px); border-color:var(--accent); background:var(--accent-subtle); }
  .too-easy .te-text { flex:1; min-width:0; font-size:.88rem; line-height:1.4; color:var(--text-muted); }
  .too-easy .te-text strong { color:var(--text); font-weight:700; }
  .too-easy svg { width:18px; height:18px; flex-shrink:0; color:var(--accent-dark); }

  /* Premium course cards — a coloured hero over a clean body. */
  .course-card { display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:20px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .22s, transform .22s, border-color .22s; }
  .course-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lift); border-color:color-mix(in srgb, var(--cc-accent) 45%, var(--border)); }
  .cc-hero { position:relative; aspect-ratio:16/9; overflow:hidden; }
  .cc-hero--icon { display:flex; align-items:center; justify-content:center;
    background:radial-gradient(130% 150% at 12% 8%, color-mix(in srgb, var(--cc-accent) 30%, transparent), transparent 62%),
               linear-gradient(140deg, color-mix(in srgb, var(--cc-accent) 20%, var(--surface)), color-mix(in srgb, var(--cc-accent) 7%, var(--surface))); }
  .cc-hero-ic { width:66px; height:66px; border-radius:19px; display:flex; align-items:center; justify-content:center; background:var(--surface); color:var(--cc-accent); box-shadow:0 10px 26px -12px color-mix(in srgb, var(--cc-accent) 85%, transparent); }
  .cc-hero-ic svg { width:34px; height:34px; }
  .cc-hero--video { background:#141019; }
  .cc-hero-img { width:100%; height:100%; object-fit:cover; display:block; }
  .cc-hero--video::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 50%, rgba(0,0,0,.4)); }
  .cc-hero-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.94); color:#141019; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px -8px rgba(0,0,0,.55); transition:transform .2s; z-index:1; }
  .cc-hero-play svg { width:22px; height:22px; margin-left:3px; }
  .course-card:hover .cc-hero-play { transform:translate(-50%,-50%) scale(1.07); }
  .cc-hero-tag { position:absolute; left:12px; top:12px; z-index:1; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:rgba(0,0,0,.48); padding:5px 10px; border-radius:99px; }
  .cc-body { display:flex; flex-direction:column; flex:1; padding:17px 19px 17px; }
  .cc-level { align-self:flex-start; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.65rem; font-weight:800; letter-spacing:.02em; color:var(--cc-accent); background:color-mix(in srgb, var(--cc-accent) 13%, transparent); border:1px solid color-mix(in srgb, var(--cc-accent) 30%, transparent); padding:4px 9px; border-radius:99px; margin-bottom:10px; }
  .cc-title { font-size:1.22rem; font-weight:800; letter-spacing:-.02em; }
  .cc-blurb { color:var(--text-muted); font-size:.89rem; line-height:1.5; margin-top:6px; }
  .cc-spacer { flex:1; min-height:14px; }
  .cc-track { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 1px rgba(60,40,20,.06); margin-bottom:12px; }
  .cc-track-fill { height:100%; border-radius:99px; background:linear-gradient(90deg, color-mix(in srgb, var(--cc-accent) 65%, #fff), var(--cc-accent)); transition:width .5s cubic-bezier(.4,0,.2,1); }
  .cc-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cc-count { font-size:.78rem; color:var(--text-muted); font-weight:600; }
  .cc-cta { display:inline-flex; align-items:center; gap:5px; font-size:.83rem; font-weight:800; color:var(--cc-accent); }
  .cc-cta svg { width:16px; height:16px; }

  /* ── Overview dashboard ── */
  .ov-hero .ov-overall { margin-top:16px; padding-top:15px; border-top:1px solid var(--border); }
  .ov-overall .bar { height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 1px rgba(60,40,20,.06); }
  .ov-overall .bar > i { display:block; height:100%; background:linear-gradient(90deg,#f7d24a,#f5c518); border-radius:99px; transition:width .6s cubic-bezier(.4,0,.2,1); }
  .ov-overall .lbl { font-size:.76rem; color:var(--text-muted); font-weight:600; margin-top:8px; }
  .ov-sec { font-size:.7rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin:6px 2px 12px; }

  /* Continue / start card — the hero action */
  .resume-card { position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px 17px; margin-bottom:20px; cursor:pointer; box-shadow:var(--shadow); transition:transform .18s,box-shadow .18s,border-color .18s; }
  .resume-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--cc,var(--accent)); }
  .resume-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--accent); }
  .resume-card.done { cursor:default; border-color:var(--border); background:var(--surface); box-shadow:var(--shadow); }
  .resume-card.done::before { display:none; }
  .resume-card.done:hover { transform:none; box-shadow:var(--shadow); border-color:var(--border); }
  .resume-ic { width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .resume-ic svg { width:24px; height:24px; }
  .resume-meta { flex:1; min-width:0; }
  .resume-eyebrow { font-size:.66rem; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--accent-dark); }
  .resume-title { font-weight:800; font-size:1.06rem; letter-spacing:-.01em; margin-top:2px; line-height:1.22; }
  .resume-sub { color:var(--text-muted); font-size:.81rem; margin-top:3px; }
  .resume-go { width:36px; height:36px; border-radius:50%; background:var(--accent); color:#3a2c00; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .resume-go svg { width:18px; height:18px; }

  /* Course card badges + coming-soon state */
  .cc-badge { font-size:.66rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:#8a6530; background:rgba(200,160,80,.12); border:1px solid rgba(200,160,80,.25); padding:6px 11px; border-radius:99px; white-space:nowrap; }
  .soon-badge { flex:0 0 auto; font-size:.64rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--border); padding:6px 11px; border-radius:99px; }
  /* Coming-soon courses are greyed back so the live course stands out. */
  .course-card.soon { cursor:default; background:linear-gradient(180deg,var(--surface),var(--surface-2)); border-style:dashed; }
  .course-card.soon::before { display:none; }
  .course-card.soon .course-ic { background:var(--surface-2); color:var(--text-muted); }
  .course-card.soon .nm { color:var(--text-muted); }
  .cc-soonfoot { font-size:.82rem; color:var(--text-muted); font-weight:600; margin-top:18px; display:flex; align-items:center; gap:8px; }
  /* Big feature card — shown when a single course is live, fills the space */
  .course-feature { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:30px; box-shadow:var(--shadow); position:relative; overflow:hidden; cursor:pointer; transition:box-shadow .2s,transform .2s,border-color .2s; }
  .course-feature::before { content:""; position:absolute; left:0; top:0; height:5px; width:100%; background:var(--cc-accent,var(--accent)); }
  .course-feature:hover { border-color:var(--accent); box-shadow:var(--shadow-lift); }
  .cf-head { display:flex; gap:18px; align-items:flex-start; }
  .cf-ic { flex:0 0 auto; }
  .cf-eyebrow { font-size:.66rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--cc-accent,var(--accent)); }
  .cf-title { font-size:1.7rem; font-weight:800; letter-spacing:-.02em; margin-top:3px; }
  .cf-blurb { color:var(--text-muted); font-size:.98rem; line-height:1.5; margin-top:6px; }
  .cf-stats { display:flex; gap:12px; margin:22px 0; }
  .cf-stat { flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:14px 10px; text-align:center; }
  .cf-stat b { display:block; font-size:1.55rem; font-weight:800; letter-spacing:-.02em; line-height:1; }
  .cf-stat span { font-size:.68rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:5px; display:block; }
  .cf-levels-h { font-size:.7rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin:4px 0 12px; }
  .cf-levels { display:flex; flex-direction:column; gap:14px; }
  .cf-level-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .cf-level-name { font-size:.92rem; font-weight:700; }
  .cf-level-meta { font-size:.78rem; color:var(--text-muted); font-weight:600; }
  .cf-cta { margin-top:26px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(90deg,#f7d24a,#f5c518); color:#3a2a08; border:none; border-radius:14px; padding:15px; font-size:1rem; font-weight:800; cursor:pointer; font-family:inherit; box-shadow:0 5px 16px -7px rgba(240,165,0,.55); }
  .cf-cta:hover { opacity:.93; }
  .cf-cta svg { width:18px; height:18px; }
  .cc-soonfoot .dot { width:7px; height:7px; border-radius:50%; background:var(--text-muted); opacity:.5; }

  /* Premium course hero (lesson page header) */
  .course-hero { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; margin:8px 0 22px; }
  .course-hero::before { content:""; position:absolute; left:0; right:0; top:0; height:135px; pointer-events:none;
    background:radial-gradient(120% 170% at 10% -10%, color-mix(in srgb, var(--cc-accent) 28%, transparent), transparent 60%),
              linear-gradient(150deg, color-mix(in srgb, var(--cc-accent) 18%, var(--surface)), color-mix(in srgb, var(--cc-accent) 4%, var(--surface))); }
  .course-hero > * { position:relative; }
  .ch-top { display:flex; gap:18px; align-items:flex-start; padding:24px 26px 0; }
  .ch-ic { width:64px; height:64px; border-radius:18px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:var(--surface); color:var(--cc-accent); box-shadow:0 10px 26px -12px color-mix(in srgb, var(--cc-accent) 85%, transparent); }
  .ch-ic svg { width:32px; height:32px; }
  .ch-head { min-width:0; padding-top:2px; }
  .ch-level { display:inline-block; font-size:.65rem; font-weight:800; letter-spacing:.02em; color:var(--cc-accent); background:color-mix(in srgb, var(--cc-accent) 13%, transparent); border:1px solid color-mix(in srgb, var(--cc-accent) 30%, transparent); padding:4px 9px; border-radius:99px; margin-bottom:9px; }
  .ch-title { font-size:1.7rem; font-weight:800; letter-spacing:-.02em; line-height:1.1; }
  .ch-blurb { color:var(--text-muted); font-size:.95rem; line-height:1.5; margin-top:7px; max-width:640px; }
  .ch-prog { padding:20px 26px 0; }
  .ch-track { height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 1px rgba(60,40,20,.06); }
  .ch-track > i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, color-mix(in srgb, var(--cc-accent) 65%, #fff), var(--cc-accent)); transition:width .5s cubic-bezier(.4,0,.2,1); }
  .ch-prog-meta { display:flex; justify-content:space-between; font-size:.78rem; color:var(--text-muted); font-weight:600; margin-top:8px; }
  .ch-cta { display:inline-flex; align-items:center; gap:7px; margin:18px 26px 24px; padding:12px 20px; border:none; border-radius:12px; cursor:pointer; font-family:inherit; font-size:.92rem; font-weight:800; color:#fff; background:var(--cc-accent); box-shadow:0 9px 22px -9px color-mix(in srgb, var(--cc-accent) 90%, transparent); transition:filter .15s, transform .15s; }
  .ch-cta:hover { filter:brightness(.96); transform:translateY(-1px); }
  .ch-cta svg { width:17px; height:17px; }
  @media (max-width:560px) { .ch-top { flex-direction:column; gap:13px; padding:20px 18px 0; } .ch-title { font-size:1.42rem; } .ch-prog { padding:16px 18px 0; } .ch-cta { margin:16px 18px 20px; } }

  /* Levels + lessons */
  .level-group { margin-bottom:24px; }
  .level-h { display:flex; align-items:center; gap:10px; margin:0 0 11px; }
  .level-h .lvl { font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.11em; color:color-mix(in srgb, var(--cc-accent) 70%, #2a2320); }
  .level-h .ln { flex:1; height:1px; background:var(--border); }
  .lesson-row { display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px 16px; margin-bottom:9px; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .18s,transform .18s,border-color .18s; }
  .lesson-row:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-lift); }
  .lesson-row .tick { width:26px; height:26px; border-radius:50%; border:2px solid var(--border); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:800; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .lesson-row .tick.done { background:var(--accent); border-color:var(--accent); }
  .lesson-row .tick.done svg { width:13px; height:13px; stroke:#3a2c00; stroke-width:3.4; fill:none; }
  .lesson-row .lt { flex:1; min-width:0; }
  .lesson-row .lt .t { font-weight:750; font-size:.97rem; letter-spacing:-.01em; }
  .lesson-row .lt .s { color:var(--text-muted); font-size:.82rem; line-height:1.4; margin-top:2px; }
  .lesson-row .mins { font-size:.73rem; color:var(--text-muted); font-weight:600; flex:0 0 auto; }
  /* Video lesson card — thumbnail + explanation */
  .lesson-vrow { display:flex; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .18s, transform .18s, border-color .18s; }
  .lesson-vrow:hover { transform:translateY(-1px); box-shadow:var(--shadow-lift); border-color:color-mix(in srgb, var(--cc-accent) 45%, var(--border)); }
  .lvr-thumb { position:relative; flex:0 0 auto; width:158px; align-self:stretch; background:#141019; overflow:hidden; }
  .lvr-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .lvr-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.92); color:#141019; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px -6px rgba(0,0,0,.5); transition:transform .18s; }
  .lvr-play svg { width:15px; height:15px; margin-left:2px; }
  .lesson-vrow:hover .lvr-play { transform:translate(-50%,-50%) scale(1.08); }
  .lvr-dur { position:absolute; right:6px; bottom:6px; font-size:.62rem; font-weight:700; color:#fff; background:rgba(0,0,0,.62); padding:2px 6px; border-radius:6px; }
  .lvr-check { position:absolute; left:7px; top:7px; width:22px; height:22px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px -2px rgba(0,0,0,.4); }
  .lvr-check svg { width:13px; height:13px; stroke:var(--cc-accent); stroke-width:3.4; fill:none; }
  /* Designed thumbnail for written lessons (no video): a numbered panel in the course

// Measure the exact vertical nudge that optically centres the lesson-card number's ink on the
// stave, from the actually rendered font, and expose it as --num-nudge. A hardcoded constant was
// wrong across line-box metrics; this is provably correct on any device / font fallback.
function setNumNudge() {
  try {
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;font-family:'Times New Roman',Times,serif;font-weight:600;font-size:3.4rem;line-height:1;white-space:nowrap";
    const ref = document.createElement("span");
    ref.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
    probe.textContent = "8"; probe.appendChild(ref); document.body.appendChild(probe);
    const pr = probe.getBoundingClientRect(), rr = ref.getBoundingClientRect();
    const cs = getComputedStyle(probe);
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; ctx.textBaseline = "alphabetic";
    const m = ctx.measureText("8");
    document.body.removeChild(probe);
    const baselineFromTop = rr.top - pr.top;
    const inkCenterAboveBaseline = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;

// The Absolute Beginner Course (first-steps) is holistic: every lesson is
// playing a piece, working on technique, reading, and understanding at once. So
// its practice time is spread across all four roadmap tracks with a fixed
// weighting that leans to repertoire, rather than counted as pure musicianship
// like the Theory course. item_type strings map to tracks in practice-log
// (_RM_TYPE_TO_TRACK): piece->Repertoire, technique->Technique,
// sightreading->Sight-reading, theory->Musicianship.
const FS_TRACK_WEIGHTS = [
  { itemType: "piece",        w: 0.40 }, // Repertoire
  { itemType: "technique",    w: 0.25 }, // Technique
  { itemType: "sightreading", w: 0.15 }, // Sight reading
  { itemType: "theory",       w: 0.20 }, // Musicianship

// Largest-remainder allocation of `total` whole minutes across weights so the
// parts always sum exactly to the session total (no drift, no lost minute).
function _allocate(exacts, total) {
  const out = exacts.map(v => Math.floor(v));
  let left = total - out.reduce((a, b) => a + b, 0);
  const order = exacts.map((v, i) => ({ i, frac: v - Math.floor(v) }))
    .sort((a, b) => b.frac - a.frac);
  for (let k = 0; k < left; k++) out[order[k % order.length].i] += 1;
  return out;
}
function _fsSplit(total) {
  total = Math.round(Number(total) || 0);
  if (total <= 0) return [];
  const mins = _allocate(FS_TRACK_WEIGHTS.map(t => total * t.w), total);
  return FS_TRACK_WEIGHTS
    .map((t, i) => ({ itemType: t.itemType, minutes: mins[i] }))
    .filter(r => r.minutes > 0);
}
// Re-spread a new total across a session's existing items in their current
// proportions (used when the member adjusts the logged time). A single-item
// session just takes the whole value; a split session stays balanced.
function _reallocate(cur, total) {
  total = Math.round(Number(total) || 0);
  const sum = cur.reduce((a, b) => a + b, 0);
  if (total <= 0) return cur.map(() => 0);
  if (sum <= 0) return cur.map((_, i) => (i === 0 ? total : 0));
  return _allocate(cur.map(v => (v / sum) * total), total);
}

async function _tmSave() {

  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", wire);
  else wire();
})();

// ── Views ─────────────────────────────────────────────────────
// Push/replace a history entry for in-page view changes so swipe-back / browser-back
// steps Lesson → Course → Overview instead of leaving the page.
function _courseHist(state, url, push) {
  if (push === false) return;
  if (location.pathname + location.search !== url) history.pushState(state, "", url);
  else history.replaceState(state, "", url);
}

function renderOverview(push) {
  window._shPageDetail = "Courses"; if (window._shPing) window._shPing();
  document.title = "Courses · The Practice Room";
  _courseHist({ view: "overview" }, "/courses.html", push);
  const v = document.getElementById("view");

  const order = {}; COURSES.forEach((c, i) => order[c.key] = i);
  const total = LESSONS.length;
  const doneCount = LESSONS.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
  const overallPct = total ? Math.round(doneCount / total * 100) : 0;
  const ordered = [...LESSONS].sort((a, b) => (order[a.course] - order[b.course]) || (a.level - b.level) || (a.sort_order - b.sort_order));
  const next = ordered.find(l => !(PROGRESS[l.id] && PROGRESS[l.id].completed));
  const anyDone = doneCount > 0;

  // ── Hero: title + an overall-progress bar that turns the landing into a dashboard ──
  const hero = `<div class="page-head-card ov-hero">
    <div class="ph-row"><div class="ph-icon">${GRAD_ICON}</div>
      <div class="ph-text"><div class="ph-eyebrow">Learn</div><div class="ph-title">Courses</div></div></div>
    <div class="ph-sub">Short, beginner-friendly lessons. Learn a little, try it at the piano, check your understanding.</div>
    ${total ? `<div class="ov-overall"><div class="bar"><i style="width:${overallPct}%"></i></div><div class="lbl">${doneCount} of ${total} lesson${total === 1 ? "" : "s"} complete</div></div>` : ""}
  </div>`;

  // ── Continue / start card: jumps straight to the next unfinished lesson ──
  let resume = "";
  if (next) {
    const nc = COURSE[next.course] || {};
    resume = `<div class="resume-card" style="--cc:${nc.color || 'var(--accent)'}" data-lesson="${next.id}" data-course="${next.course}">
      <div class="resume-ic" style="background:${nc.color}1f;color:${nc.color}">${nc.icon || ""}</div>
      <div class="resume-meta"><div class="resume-eyebrow"${nc.color ? ` style="color:${nc.color}"` : ""}>${anyDone ? "Continue learning" : "Start here"}</div>
        <div class="resume-title">${escHtml(next.title)}</div>
        <div class="resume-sub">${escHtml(nc.label || "")} &middot; Level ${next.level}${next.est_minutes ? ` &middot; ${next.est_minutes} min` : ""}</div></div>
      <div class="resume-go"${nc.color ? ` style="background:${nc.color};color:#fff"` : ""}>${ARROW_ICON}</div></div>`;
  } else if (total) {
    resume = `<div class="resume-card done">
      <div class="resume-ic" style="background:var(--accent-subtle);color:var(--accent-dark)">${CHECK_BIG}</div>
      <div class="resume-meta"><div class="resume-eyebrow">All caught up</div>
        <div class="resume-title">You've finished every published lesson</div>
        <div class="resume-sub">New lessons are on the way.</div></div></div>`;
  }

  // ── Premium course cards: full vertical units with progress bar + CTA ──
  // Only show courses that actually have published lessons — no "coming soon".
  const liveCourses = COURSES.filter(c => LESSONS.some(l => l.course === c.key));

  // Premium course card: a coloured hero (Mux thumbnail for video courses, icon-on-
  // gradient for written ones) over a body with title, promise, progress and a CTA.
  function courseCard(c) {
    const ls = LESSONS.filter(l => l.course === c.key);
    const done = ls.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
    const pct = ls.length ? Math.round(done / ls.length * 100) : 0;
    const started = done > 0;
    const isVideo = c.format === "video" && c.thumbId;
    const hero = isVideo
      ? `<div class="cc-hero cc-hero--video">
           <img class="cc-hero-img" src="https://image.mux.com/${c.thumbId}/thumbnail.webp?width=880&height=495&fit_mode=smartcrop&time=${c.thumbTime || 0}" alt="" loading="lazy">
           <span class="cc-hero-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>
           <span class="cc-hero-tag">Video course</span>
         </div>`
      : `<div class="cc-hero cc-hero--icon"><span class="cc-hero-ic">${c.icon}</span></div>`;
    return `<div class="course-card" data-course="${c.key}" style="--cc-accent:${c.color}">
      ${hero}
      <div class="cc-body">
        ${c.audience ? `<div class="cc-level">${c.audience}</div>` : ""}
        <div class="cc-title">${c.label}</div>
        <div class="cc-blurb">${c.blurb}</div>
        <div class="cc-spacer"></div>
        ${started ? `<div class="cc-track"><div class="cc-track-fill" style="width:${pct}%"></div></div>` : ""}
        <div class="cc-foot">
          <span class="cc-count">${ls.length} lesson${ls.length === 1 ? "" : "s"}${started ? ` · ${pct}% done` : ""}</span>
          <span class="cc-cta">${started ? "Continue" : "Start"}${ARROW_ICON}</span>
        </div>
      </div></div>`;
  }

  // Big space-filling feature card (used when only one course is live, so the
  // page reads as a rich, full offering rather than one lonely card).
  function featureCard(c) {
    const ls = LESSONS.filter(l => l.course === c.key);
    const done = ls.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
    const byLv = {}; ls.forEach(l => (byLv[l.level] = byLv[l.level] || []).push(l));
    const levels = Object.keys(byLv).map(Number).sort((a, b) => a - b);
    const levelRows = levels.map(lv => {
      const lv2 = byLv[lv];
      const ld = lv2.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
      const lp = lv2.length ? Math.round(ld / lv2.length * 100) : 0;
      return `<div class="cf-level"><div class="cf-level-top"><span class="cf-level-name">Level ${lv}</span>
        <span class="cf-level-meta">${ld}/${lv2.length} lesson${lv2.length === 1 ? "" : "s"}</span></div>
        <div class="cc-bar"><i style="width:${lp}%"></i></div></div>`;
    }).join("");
    return `<div class="course-feature" data-course="${c.key}" style="--cc-accent:${c.color};--cc-tint:${c.color}1f">
      <div class="cf-head"><div class="course-ic cf-ic">${c.icon}</div>
        <div class="cf-head-text"><div class="cf-eyebrow">Course</div><div class="cf-title">${c.label}</div>
          <div class="cf-blurb">${c.blurb}</div></div></div>
      <div class="cf-stats">
        <div class="cf-stat"><b>${ls.length}</b><span>lesson${ls.length === 1 ? "" : "s"}</span></div>
        <div class="cf-stat"><b>${levels.length}</b><span>level${levels.length === 1 ? "" : "s"}</span></div>
        <div class="cf-stat"><b>${done}</b><span>done</span></div>
      </div>
      <div class="cf-levels-h">Lessons by level</div>
      <div class="cf-levels">${levelRows}</div>
      <button class="cf-cta">${done > 0 ? "Continue learning" : "Start the course"}${ARROW_ICON}</button></div>`;
  }

  const coursesHTML = liveCourses.length === 1
    ? featureCard(liveCourses[0])
    : `<div class="course-grid">${liveCourses.map(courseCard).join("")}</div>`;

  v.innerHTML = hero + resume + `<div class="ov-sec">Your course${liveCourses.length === 1 ? "" : "s"}</div>` + coursesHTML;

  const rc = v.querySelector(".resume-card[data-lesson]");
  if (rc) rc.onclick = () => openLesson(rc.dataset.lesson, rc.dataset.course);
  v.querySelectorAll(".course-card, .course-feature").forEach(el => el.onclick = () => renderCourse(el.dataset.course));
  scrollTop();
}

function renderCourse(courseKey, push) {
  const c = COURSE[courseKey];
  window._shPageDetail = "Courses · " + c.label; if (window._shPing) window._shPing();
  document.title = c.label + " · The Practice Room";
  _courseHist({ view: "course", course: courseKey }, "/courses.html?course=" + encodeURIComponent(courseKey), push);
  const v = document.getElementById("view");
  const ls = LESSONS.filter(l => l.course === courseKey);
  // A course with practice breaks reads as a single-column sequence (lesson, break, lesson),
  // not the multi-column grid used for courses of independent lessons.
  const _linear = ls.some(l => l.break_after);
  const byLevel = {};
  ls.forEach(l => { (byLevel[l.level] = byLevel[l.level] || []).push(l); });
  const levels = Object.keys(byLevel).map(Number).sort((a, b) => a - b);

  const groups = levels.map(lv => {
    const rows = byLevel[lv].slice().sort((a, b) => a.sort_order - b.sort_order).map((l, i) => {
      const done = PROGRESS[l.id] && PROGRESS[l.id].completed;
      const chk = '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>';
      // Video lessons show a frame from their own video; written lessons show a clean
      // designed panel in the course colour. Both use the same rich card layout.
      const overlays = `${l.est_minutes ? `<span class="lvr-dur">${l.est_minutes} min</span>` : ""}${done ? `<span class="lvr-check">${chk}</span>` : ""}`;
      const lvl = Math.min(5, Math.max(1, l.level || 1));
      const thumb = l.thumb_id
        ? `<div class="lvr-thumb"><img src="https://image.mux.com/${l.thumb_id}/thumbnail.webp?width=440&height=248&fit_mode=smartcrop" alt="" loading="lazy">
            <span class="lvr-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>${overlays}</div>`
        : `<div class="lvr-thumb lvr-thumb--num lvr-l${lvl}"><span class="lvr-num">${i + 1}</span>${l.card_label ? `<span class="lvr-topic">${escHtml(l.card_label)}</span>` : ""}${overlays}</div>`;
      const row = `<div class="lesson-vrow${done ? " is-done" : ""}" data-id="${l.id}">
        ${thumb}
        <div class="lvr-info"><div class="lvr-eyebrow">Lesson ${i + 1}</div>
          <div class="lvr-title">${escHtml(l.title)}</div>
          ${l.summary ? `<div class="lvr-sum">${escHtml(l.summary)}</div>` : ""}</div>
      </div>`;
      // A practice break sits inline after its lesson, not as a clickable lesson of its own,
      // so the member sees at a glance that they should go and practise before moving on.
      const brk = l.break_after ? `<div class="lesson-break">
        <div class="lesson-break-label"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9"/><polyline points="3 4 3 12 11 12"/></svg>Practice break</div>
        <div class="lesson-break-body">${escHtml(l.break_after)}</div>
        <a class="lesson-break-log" href="/practice-log.html?log=piece">Log your practice</a>
      </div>` : "";
      return row + brk;
    }).join("");
    const levelHead = levels.length > 1 ? `<div class="level-h"><span class="lvl">Level ${lv}</span><span class="ln"></span></div>` : "";
    return `<div class="level-group">${levelHead}<div class="lesson-grid${_linear ? " linear" : ""}">${rows}</div></div>`;
  }).join("");

  // Premium course hero: colour, audience, progress, and a Continue button that jumps to
  // the first unfinished lesson.
  const _doneN = ls.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
  const _pct = ls.length ? Math.round(_doneN / ls.length * 100) : 0;
  const _seq = ls.slice().sort((a, b) => a.level - b.level || a.sort_order - b.sort_order);
  const _next = _seq.find(l => !(PROGRESS[l.id] && PROGRESS[l.id].completed)) || _seq[0];
  const courseHero = `<div class="course-hero" style="--cc-accent:${c.color}">
    <div class="ch-top">
      <div class="ch-ic">${c.icon}</div>
      <div class="ch-head">
        ${c.audience ? `<span class="ch-level">${c.audience}</span>` : ""}
        <div class="ch-title">${c.label}</div>
        <div class="ch-blurb">${c.blurb}</div>
      </div>
    </div>
    ${ls.length ? `<div class="ch-prog">
      <div class="ch-track"><i style="width:${_pct}%"></i></div>
      <div class="ch-prog-meta"><span>${_doneN} of ${ls.length} lesson${ls.length === 1 ? "" : "s"} done</span><span>${_pct}%</span></div>
    </div>
    <button class="ch-cta" data-continue>${_doneN > 0 ? "Continue where you left off" : "Start the course"}${ARROW_ICON}</button>` : ""}
  </div>`;

  // For the Absolute Beginner Course, an always-visible "too easy" exit so anyone
  // who already plays a little can jump straight to real pieces rather than feel
  // stuck in a course pitched below them.
  const tooEasy = courseKey === "first-steps"
    ? `<a class="too-easy" href="/resources.html">
         <span class="te-text">This course is for complete beginners. <strong>Already play a little? Find pieces at your level.</strong></span>
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
       </a>`
    : "";
  v.innerHTML = `
    <div class="crumbs"><a data-home>Courses</a><span class="sep">/</span><span>${c.label}</span></div>
    ${courseHero}
    ${tooEasy}
    <div style="--cc-accent:${c.color}">${groups || `<div class="empty">No lessons published yet.</div>`}</div>`;
  v.querySelector("[data-home]").onclick = renderOverview;
  const _ctaBtn = v.querySelector(".ch-cta[data-continue]");
  if (_ctaBtn && _next) _ctaBtn.onclick = () => openLesson(_next.id, courseKey);
  v.querySelectorAll(".lesson-row, .lesson-vrow").forEach(r => r.onclick = () => openLesson(r.dataset.id, courseKey));
  scrollTop();
}

async function openLesson(id, courseKey, push) {
  const v = document.getElementById("view");
  v.innerHTML = `<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>`;
  const { data: lesson, error } = await db.from("lessons").select("*").eq("id", id).single();
  if (error || !lesson) {
    showToast("Could not load that lesson.");
    if (courseKey && COURSE[courseKey]) renderCourse(courseKey, false); else renderOverview(false);
    return;
  }
  const c = COURSE[lesson.course] || { label: "Course" };
  window._shPageDetail = "Courses · " + c.label + " · " + lesson.title; if (window._shPing) window._shPing();
  document.title = lesson.title + " · The Practice Room";
  _courseHist({ view: "lesson", lesson: id, course: lesson.course }, "/courses.html?lesson=" + encodeURIComponent(id), push);

  v.innerHTML = `<div class="lesson-reader">
    <div class="crumbs"><a data-home>Courses</a><span class="sep">/</span><a data-course>${c.label}</a><span class="sep">/</span><span>Lesson</span></div>
    <div class="reader-head">
      <h2>${escHtml(lesson.title)}</h2>
      ${lesson.summary ? `<div class="sub">${escHtml(lesson.summary)}</div>` : ""}
      ${SHEET_MUSIC[lesson.course] ? `<a class="sheet-btn" href="${SHEET_MUSIC[lesson.course].url}" target="_blank" rel="noopener" download><span class="sheet-ico">&#x2913;</span>${escHtml(SHEET_MUSIC[lesson.course].label)}</a>` : ""}
    </div>
    <div id="lesson-body"></div>
    <div class="complete-bar" id="complete-bar"></div></div>`;

  v.querySelector("[data-home]").onclick = renderOverview;
  v.querySelector("[data-course]").onclick = () => renderCourse(lesson.course);

  const body = document.getElementById("lesson-body");
  body.innerHTML = LessonRender.html(lesson.blocks || []);
  let lastScore = null;
  LessonRender.init(body, {
    onQuizScore: (score, total) => { lastScore = { score, total }; },
    onShare: () => showToast("Sharing from lessons is coming soon."),
  });

  // Complete toggle: mark complete, or un-mark if it was done by accident.
  const bar = document.getElementById("complete-bar");
  function paintBar() {
    const done = PROGRESS[id] && PROGRESS[id].completed;
    bar.innerHTML = done
      ? `<span class="done-note">${CHECK_BIG} Completed</span><button class="btn" id="toggle-complete">Mark as not complete</button>`
      : `<button class="btn btn-gold" id="toggle-complete">Mark complete</button>`;
    bar.querySelector("#toggle-complete").onclick = () => {
      // Un-marking removes the practice this lesson logged and recomputes the
      // streak, so confirm it — stops an accidental tap wiping a real completion.
      if (done && !confirm("Mark this lesson as not complete? This removes the practice time it logged and may affect your streak.")) return;
      setDone(!done);
    };
  }
  async function setDone(done) {
    const btn = bar.querySelector("#toggle-complete"); btn.disabled = true; btn.textContent = "Saving…";
    const row = {
      email: myEmail, lesson_id: id, completed: done,
      score: done ? lastScore : ((PROGRESS[id] && PROGRESS[id].score) || null),
      completed_at: done ? new Date().toISOString() : null, updated_at: new Date().toISOString(),
    };
    const { error: e } = await db.from("lesson_progress").upsert(row, { onConflict: "email,lesson_id" });
    if (e) { paintBar(); showToast("Could not save. Try again."); return; }
    PROGRESS[id] = { completed: done, score: row.score };
    paintBar();

    // Auto-log the lesson's time toward practice — once, deduped by origin_ref.
    // Completing moves BOTH goals: the day (a practice day) and the hours (toward
    // the next roadmap level). Un-marking removes the entry. The toast makes it
    // visible so it's never re-logged manually.
    let loggedMins = 0, loggedSessionId = null;
    try {
      if (done && window.PracticeAutolog) {
        const r = await window.PracticeAutolog.logAppActivity(db, {
          email: myEmail, source: "app-lesson", originRef: "lesson:" + id,
          // Learning a piece counts as repertoire; theory/ear courses count as musicianship.
          minutes: lesson.est_minutes, itemType: lesson.course === "learn-your-first-piece" ? "piece" : "theory",
          items: lesson.course === "first-steps" ? _fsSplit(lesson.est_minutes) : null,
          label: lesson.title, notes: "Course lesson: " + lesson.title,
        });
        loggedMins = r.logged ? r.minutes : 0;
        loggedSessionId = r.logged ? r.sessionId : null;
        if (r.logged) { try { await db.rpc("recompute_streak_tokens", { p_email: myEmail }); } catch (_) {} }
      } else if (!done && window.PracticeAutolog) {
        await window.PracticeAutolog.removeAppActivity(db, {
          email: myEmail, source: "app-lesson", originRef: "lesson:" + id });
        try { await db.rpc("recompute_streak_tokens", { p_email: myEmail }); } catch (_) {}
        // Un-marking removed the lesson + its auto-logged practice. Revoke any
        // badge that no longer holds (e.g. First Lesson, First Note), keeping ones
        // still earned by other data.
        try { if (window.tcReconcileAchievements) await window.tcReconcileAchievements(); } catch (_) {}
      }
    } catch (_) {}

    // On completion, open the time editor so the logged minutes are adjustable
    // right here (not only later in the practice log). Fall back to a toast if
    // nothing was logged (e.g. re-completing an already-logged lesson).
    if (done && loggedSessionId) {
      openLoggedTimeEditor(loggedSessionId, loggedMins);
    } else {
      showToast(done ? "Lesson complete" : "Marked as not complete");
    }
    // Re-check achievements (First Lesson, Theory: Level 1) after a completion.
    if (done && window.tcCheckAchievements) window.tcCheckAchievements({ force: true });
  }
  paintBar();
  // Video lessons complete themselves: when the member watches to the end it marks done
  // (which auto-logs the practice). They can still toggle it manually with the button.
  const _vid = body.querySelector("mux-player");
  if (_vid) {
    let _autoDone = false;
    const _finish = () => {
      if (_autoDone || (PROGRESS[id] && PROGRESS[id].completed)) return;
      _autoDone = true; setDone(true);
    };
    _vid.addEventListener("ended", _finish, { once: true });
    // Fallback: some players don't fire "ended" if the final moment buffers, so treat
    // watching to >=97% as complete too. logAppActivity also dedupes by origin_ref.
    const _tu = () => {
      const d = _vid.duration || 0, t = _vid.currentTime || 0;
      if (d > 0 && t / d >= 0.97) { _vid.removeEventListener("timeupdate", _tu); _finish(); }
    };
    _vid.addEventListener("timeupdate", _tu);
  }
  scrollTop();
}

function scrollTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }

// ── Boot ──────────────────────────────────────────────────────
(async function () {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/"; return; }
  myEmail = session.user.email;

  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];

  try {
    initSharedHeader({ db, myEmail, myName, isAdmin: myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase(), activePage: "resources", avatarUrl: (ae && ae.avatar_url) || null });
  } catch (e) { console.error("initSharedHeader error:", e); }

  // Owner-only preview: ?preview=1 includes DRAFT lessons so an unpublished course
  // can be walked end-to-end on the courses page before going live. Members always
  // see published lessons only.
  const _isOwner = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();
  const _preview = _isOwner && new URLSearchParams(location.search).get("preview") === "1";
  let _lessonsQ = db.from("lessons").select("id,course,level,sort_order,title,summary,est_minutes,break_after,thumb_id,card_label")
    .in("course", COURSES.map(c => c.key));
  if (!_preview) _lessonsQ = _lessonsQ.eq("status", "published");
  _lessonsQ = _lessonsQ.order("course").order("level").order("sort_order");
  const _emailLc = (myEmail || "").toLowerCase();
  const [{ data: lessons }, { data: prog }, { data: _sess }, { data: _base },
         { data: _fsIds }, { data: _ns }, { data: _cs }, { data: _es }, { data: _is }, { data: _msc }, { data: _uc }] = await Promise.all([
    _lessonsQ,
    db.from("lesson_progress").select("lesson_id,completed,score").eq("email", myEmail),
    db.from("practice_sessions").select("duration_minutes").eq("email", myEmail),
    db.from("practice_baseline").select("total_minutes").eq("email", myEmail).maybeSingle(),
    db.from("lessons").select("id").eq("course", "first-steps"),
    db.from("note_game_scores").select("score").eq("email", myEmail),
    db.from("chord_game_scores").select("score").eq("email", myEmail),
    db.from("ear_game_scores").select("score").eq("email", myEmail),
    db.from("interval_game_scores").select("score").eq("email", _emailLc),
    db.from("member_self_checks").select("checks").eq("email", myEmail).maybeSingle(),
    db.from("user_collections").select("status").eq("email", myEmail),
  ]);
  if (_preview) { try { showToast("Preview mode: showing draft lessons too"); } catch (_) {} }
  LESSONS = lessons || [];
  PROGRESS = {};
  (prog || []).forEach(p => { PROGRESS[p.lesson_id] = { completed: p.completed, score: p.score }; });

  // Course order: The Absolute Beginner Course sits UNDER Music Theory by default,
  // and lifts ABOVE it for a flagged absolute beginner — the same signal as the
  // dashboard "Start here" pick: they've started it (sticky), OR they look fresh
  // (under 5h total incl. prior hours, no real game score) and haven't dismissed
  // it. Owner preview: ?bf=1 forces the beginner-first order.
  const _maxScore = a => (a || []).reduce((m, r) => Math.max(m, r.score || 0), 0);
  const _totMin = (_sess || []).reduce((a, r) => a + (r.duration_minutes || 0), 0) + ((_base && _base.total_minutes) || 0);
  const _fsIdSet = new Set((_fsIds || []).map(r => r.id));
  const _fsStarted = (prog || []).some(p => p.completed && _fsIdSet.has(p.lesson_id));
  const _dismissed = !!(_msc && _msc.checks && _msc.checks.abc_dismissed);
  const _noStrongScore = _maxScore(_ns) < 8 && _maxScore(_cs) < 4 && _maxScore(_es) < 4 && _maxScore(_is) < 4;
  // A piece they are Learning or have Completed means they're actually playing, so
  // they aren't a fresh beginner. Aspire/wishlist pieces don't count (wanting to
  // play something isn't playing it).
  const _playsPieces = (_uc || []).some(r => r.status === "learning" || r.status === "completed");
  let _beginnerFirst = _fsStarted || (!_dismissed && _totMin < 300 && _noStrongScore && !_playsPieces);
  if (_isOwner && new URLSearchParams(location.search).get("bf") === "1") _beginnerFirst = true;
  const _fsi = COURSES.findIndex(c => c.key === "first-steps");
  if (_fsi > -1) {
    const [_fsc] = COURSES.splice(_fsi, 1);
    const _thi = COURSES.findIndex(c => c.key === "theory");
    COURSES.splice(_thi < 0 ? 0 : (_beginnerFirst ? _thi : _thi + 1), 0, _fsc);
  }

  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("app-main").style.display = "block";
  document.getElementById("app-header").style.display = "";

  // Deep-link straight to a lesson or course; otherwise the overview.
  const _sp = new URLSearchParams(location.search);
  const _lz = _sp.get("lesson"), _cz = _sp.get("course");
  if (_lz) openLesson(_lz, null, true);
  else if (_cz && COURSE[_cz]) renderCourse(_cz, true);
  else renderOverview(true);
})();

// Swipe-back / browser-back steps Lesson → Course → Overview.
if ("scrollRestoration" in history) history.scrollRestoration = "manual";
window.addEventListener("popstate", (e) => {
  const s = e.state || {};
  if (s.view === "lesson" && s.lesson)      openLesson(s.lesson, s.course, false);
  else if (s.view === "course" && s.course) renderCourse(s.course, false);
  else                                      renderOverview(false);
});
</script>
</body>
