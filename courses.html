<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Courses · The Practice Room</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/lessons-render.js?v=1"></script>
<!-- Global styles so the shared header (its buttons use .btn/.btn-ghost/.btn-bell/
     #presence-btn from style.css) renders identically to every other page. Our
     own warm tokens + component CSS below override what we need. -->
<link rel="stylesheet" href="/style.css" />
<style>
  /* Warm "theory-mode" tokens — identical to resources.html so Courses matches
     the rest of the member section. */
  :root {
    --bg:#faf7f3; --surface:#ffffff; --surface-2:#f0ebe2; --border:#e0d5c8;
    --text:#1a1410; --text-muted:#8a7868; --accent:#F5C518; --accent-dark:#9a6f12;
    --accent-subtle:#fdf0d8;
    --shadow:0 1px 2px rgba(60,40,20,.05);
    --shadow-lift:0 8px 22px -10px rgba(60,40,20,.22);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  #loading-screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:50; }
  .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:#1a1410; color:#fff; padding:10px 16px; border-radius:10px; font-size:.85rem; opacity:0; pointer-events:none; transition:.25s; z-index:60; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); }
  #toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
  main { display:none; max-width:760px; margin:0 auto; padding:18px 18px 110px; }

  /* Page title — a bordered card with a gold icon tile, a coloured eyebrow line
     above the title, and a description below: matches the resources headers. */
  .page-head-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:20px 22px; margin:8px 0 18px; }
  .ph-row { display:flex; align-items:center; gap:14px; }
  .ph-icon { width:48px; height:48px; border-radius:14px; flex-shrink:0; background:linear-gradient(150deg,#f7d24a,#f5c518); color:#3a2c00; display:flex; align-items:center; justify-content:center; box-shadow:0 7px 16px -7px rgba(245,197,24,.7); }
  .ph-icon svg { width:24px; height:24px; }
  .ph-eyebrow { font-size:.72rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:3px; }
  .ph-title { font-size:1.7rem; font-weight:800; letter-spacing:-.02em; line-height:1.08; }
  .ph-sub { font-size:.92rem; color:var(--text-muted); line-height:1.5; margin-top:13px; max-width:560px; }
  @media (max-width:560px) {
    .page-head-card { padding:16px; }
    .ph-icon { width:42px; height:42px; border-radius:12px; }
    .ph-icon svg { width:22px; height:22px; }
    .ph-title { font-size:1.42rem; }
  }

  .crumbs { display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--text-muted); margin:4px 0 16px; flex-wrap:wrap; font-weight:600; }
  .crumbs a { color:var(--accent-dark); cursor:pointer; font-weight:700; }
  .crumbs a:hover { color:#6b5400; }
  .crumbs span.sep { opacity:.45; }

  /* Course cards */
  .course-card { display:flex; align-items:center; gap:15px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; margin-bottom:14px; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .2s,transform .2s,border-color .2s; }
  .course-card:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow-lift); }
  .course-ic { width:48px; height:48px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:var(--accent-subtle); flex:0 0 auto; }
  .course-ic svg { width:24px; height:24px; }
  .course-meta { flex:1; min-width:0; }
  .course-meta .nm { font-weight:750; font-size:1.08rem; letter-spacing:-.01em; }
  .course-meta .ds { color:var(--text-muted); font-size:.85rem; line-height:1.45; margin-top:3px; }
  .pbar { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-top:11px; box-shadow:inset 0 1px 1px rgba(60,40,20,.05); }
  .pbar > i { display:block; height:100%; background:linear-gradient(90deg,#f7d24a,#f5c518); border-radius:99px; transition:width .4s; }
  .pct { font-size:.73rem; color:var(--text-muted); font-weight:600; margin-top:6px; }

  /* Levels + lessons */
  .level-group { margin-bottom:24px; }
  .level-h { display:flex; align-items:center; gap:10px; margin:0 0 11px; }
  .level-h .lvl { font-size:.64rem; font-weight:800; text-transform:uppercase; letter-spacing:.09em; color:#8a6530; background:rgba(200,160,80,.1); border:1px solid rgba(200,160,80,.22); padding:4px 10px; border-radius:99px; }
  .level-h .ln { flex:1; height:1px; background:var(--border); }
  .lesson-row { display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px 16px; margin-bottom:9px; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .18s,transform .18s,border-color .18s; }
  .lesson-row:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-lift); }
  .lesson-row .tick { width:24px; height:24px; border-radius:50%; border:2px solid var(--border); flex:0 0 auto; display:flex; align-items:center; justify-content:center; }
  .lesson-row .tick.done { background:var(--accent); border-color:var(--accent); }
  .lesson-row .tick.done svg { width:13px; height:13px; stroke:#3a2c00; stroke-width:3.4; fill:none; }
  .lesson-row .lt { flex:1; min-width:0; }
  .lesson-row .lt .t { font-weight:750; font-size:.97rem; letter-spacing:-.01em; }
  .lesson-row .lt .s { color:var(--text-muted); font-size:.82rem; line-height:1.4; margin-top:2px; }
  .lesson-row .mins { font-size:.73rem; color:var(--text-muted); font-weight:600; flex:0 0 auto; }

  /* Lesson reader */
  .reader-head h2 { font-size:1.4rem; font-weight:800; letter-spacing:-.015em; margin:2px 0 5px; }
  .reader-head .sub { color:var(--text-muted); font-size:.9rem; line-height:1.5; margin-bottom:10px; }

  /* Buttons — match the gold gradient + ghost button used across the app */
  /* Scoped to #app-main so these never override the shared header's own .btn
     (its chat/bell buttons use .btn from style.css). */
  #app-main .btn { border:1.5px solid var(--border); background:var(--surface); color:var(--text); border-radius:12px; padding:10px 16px; font-size:.86rem; font-weight:700; cursor:pointer; font-family:inherit; transition:border-color .15s,color .15s; }
  #app-main .btn:hover { border-color:#d6c5a8; }
  #app-main .btn-gold { background:linear-gradient(180deg,#f7d24a,#f5c518); color:#3a2c00; border:none; box-shadow:0 7px 16px -7px rgba(245,197,24,.7); transition:transform .12s,box-shadow .15s; }
  #app-main .btn-gold:hover { transform:translateY(-1px); box-shadow:0 10px 20px -8px rgba(245,197,24,.75); }
  #app-main .btn:disabled { opacity:.6; cursor:default; transform:none; box-shadow:none; }

  .complete-bar { position:sticky; bottom:0; background:linear-gradient(180deg,rgba(250,247,243,0),var(--bg) 32%); padding:20px 0 8px; margin-top:26px; display:flex; align-items:center; gap:12px; }
  .complete-bar .done-note { color:var(--accent-dark); font-weight:700; font-size:.86rem; }
  .empty { color:var(--text-muted); font-size:.9rem; text-align:center; padding:34px 10px; }
</style>
</head>
<body class="theory-mode">

<div id="loading-screen"><div class="spinner"></div></div>
<div id="toast"></div>

<header id="app-header" style="display:none"></header>
<script src="/shared-achievements.js?v=4"></script>
<script src="/shared-header.js?v=2026060923"></script>

<main id="app-main">
  <div id="view"></div>
</main>

<script>
const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNER_EMAIL   = "matthew@matthewcawood.com";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { autoRefreshToken: true, persistSession: true, detectSessionInUrl: false }
});

let myEmail = "";
let myName  = "";

// Icons + colours are the exact ones the practice-log type picker uses
// (TYPE_SVG in practice-log.html): Theory = document, Ear Training = headphones,
// Improvisation = lightning bolt — so the learning section matches logging.
const SVG = inner => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">${inner}</svg>`;
const COURSES = [
  { key: "theory", label: "Music Theory", blurb: "How music works, from note names to harmony.", color: "#10b981",
    icon: SVG('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>') },
  { key: "ear", label: "Ear Training", blurb: "Train your ear to recognise notes, intervals and chords.", color: "#ec4899",
    icon: SVG('<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>') },
  { key: "improv", label: "Improvisation", blurb: "Start making up your own music at the keyboard.", color: "#f97316",
    icon: SVG('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>') },
];
const COURSE = Object.fromEntries(COURSES.map(c => [c.key, c]));

// state
let LESSONS = [];          // all published lessons (no blocks)
let PROGRESS = {};         // lesson_id -> { completed, score }

function escHtml(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
// Graduation-cap icon for the Courses landing title (gold tile, like resources heroes)
const GRAD_ICON = SVG('<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.5 3 6 3s6-2 6-3v-5"/><line x1="22" y1="10" x2="22" y2="15.5"/>');
// Page-title block matching the resources sections: a bordered card with a gold
// icon tile, a coloured eyebrow above the title, and a description below.
function pageHead(iconSvg, eyebrow, title, sub) {
  return `<div class="page-head-card">` +
    `<div class="ph-row"><div class="ph-icon">${iconSvg}</div>` +
    `<div class="ph-text"><div class="ph-eyebrow">${escHtml(eyebrow)}</div><div class="ph-title">${escHtml(title)}</div></div></div>` +
    `${sub ? `<div class="ph-sub">${escHtml(sub)}</div>` : ""}</div>`;
}
function showToast(msg, ms) {
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("visible");
  setTimeout(() => el.classList.remove("visible"), ms || 2600);
}

// ── Views ─────────────────────────────────────────────────────
function renderOverview() {
  window._shPageDetail = "Courses"; if (window._shPing) window._shPing();
  const v = document.getElementById("view");
  const cards = COURSES.map(c => {
    const ls = LESSONS.filter(l => l.course === c.key);
    const done = ls.filter(l => PROGRESS[l.id] && PROGRESS[l.id].completed).length;
    const pct = ls.length ? Math.round(done / ls.length * 100) : 0;
    const meta = ls.length ? `${done} of ${ls.length} lessons` : "Coming soon";
    return `<div class="course-card" data-course="${c.key}">
      <div class="course-ic" style="background:${c.color}1f;color:${c.color}">${c.icon}</div>
      <div class="course-meta">
        <div class="nm">${c.label}</div>
        <div class="ds">${c.blurb}</div>
        ${ls.length ? `<div class="pbar"><i style="width:${pct}%"></i></div><div class="pct">${meta}</div>` : `<div class="pct">${meta}</div>`}
      </div>
    </div>`;
  }).join("");
  v.innerHTML = pageHead(GRAD_ICON, "Learn", "Courses", "Short, beginner-friendly lessons. Learn a little, try it at the piano, check your understanding.") + cards;
  v.querySelectorAll(".course-card").forEach(el => el.onclick = () => {
    if (!LESSONS.some(l => l.course === el.dataset.course)) { showToast("Lessons for this course are coming soon."); return; }
    renderCourse(el.dataset.course);
  });
  scrollTop();
}

function renderCourse(courseKey) {
  const c = COURSE[courseKey];
  window._shPageDetail = "Courses · " + c.label; if (window._shPing) window._shPing();
  const v = document.getElementById("view");
  const ls = LESSONS.filter(l => l.course === courseKey);
  const byLevel = {};
  ls.forEach(l => { (byLevel[l.level] = byLevel[l.level] || []).push(l); });
  const levels = Object.keys(byLevel).map(Number).sort((a, b) => a - b);

  const groups = levels.map(lv => {
    const rows = byLevel[lv].map(l => {
      const done = PROGRESS[l.id] && PROGRESS[l.id].completed;
      return `<div class="lesson-row" data-id="${l.id}">
        <div class="tick ${done ? "done" : ""}">${done ? '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' : ""}</div>
        <div class="lt"><div class="t">${escHtml(l.title)}</div>${l.summary ? `<div class="s">${escHtml(l.summary)}</div>` : ""}</div>
        ${l.est_minutes ? `<div class="mins">${l.est_minutes} min</div>` : ""}
      </div>`;
    }).join("");
    return `<div class="level-group"><div class="level-h"><span class="lvl">Level ${lv}</span><span class="ln"></span></div>${rows}</div>`;
  }).join("");

  v.innerHTML = `
    <div class="crumbs"><a data-home>Courses</a><span class="sep">/</span><span>${c.label}</span></div>
    ${pageHead(c.icon, "Course", c.label, c.blurb)}
    ${groups || `<div class="empty">No lessons published yet.</div>`}`;
  v.querySelector("[data-home]").onclick = renderOverview;
  v.querySelectorAll(".lesson-row").forEach(r => r.onclick = () => openLesson(r.dataset.id, courseKey));
  scrollTop();
}

async function openLesson(id, courseKey) {
  const v = document.getElementById("view");
  v.innerHTML = `<div class="empty"><div class="spinner" style="margin:0 auto"></div></div>`;
  const { data: lesson, error } = await db.from("lessons").select("*").eq("id", id).single();
  if (error || !lesson) { showToast("Could not load that lesson."); renderCourse(courseKey); return; }
  const c = COURSE[lesson.course] || { label: "Course" };
  window._shPageDetail = "Courses · " + c.label + " · " + lesson.title; if (window._shPing) window._shPing();

  const alreadyDone = PROGRESS[id] && PROGRESS[id].completed;
  v.innerHTML = `
    <div class="crumbs"><a data-home>Courses</a><span class="sep">/</span><a data-course>${c.label}</a><span class="sep">/</span><span>Lesson</span></div>
    <div class="reader-head">
      <h2>${escHtml(lesson.title)}</h2>
      ${lesson.summary ? `<div class="sub">${escHtml(lesson.summary)}</div>` : ""}
    </div>
    <div id="lesson-body"></div>
    <div class="complete-bar">
      <button class="btn btn-gold" id="mark-complete" ${alreadyDone ? "disabled" : ""}>${alreadyDone ? "Completed" : "Mark complete"}</button>
      <span class="done-note" id="done-note" style="${alreadyDone ? "" : "display:none"}">Nice work.</span>
    </div>`;

  v.querySelector("[data-home]").onclick = renderOverview;
  v.querySelector("[data-course]").onclick = () => renderCourse(lesson.course);

  const body = document.getElementById("lesson-body");
  body.innerHTML = LessonRender.html(lesson.blocks || []);
  let lastScore = null;
  LessonRender.init(body, {
    onQuizScore: (score, total) => { lastScore = { score, total }; },
    onShare: () => showToast("Sharing from lessons is coming soon."),
  });

  document.getElementById("mark-complete").onclick = async () => {
    const btn = document.getElementById("mark-complete"); btn.disabled = true; btn.textContent = "Saving…";
    const row = {
      email: myEmail, lesson_id: id, completed: true,
      score: lastScore, completed_at: new Date().toISOString(), updated_at: new Date().toISOString(),
    };
    const { error: e } = await db.from("lesson_progress").upsert(row, { onConflict: "email,lesson_id" });
    if (e) { btn.disabled = false; btn.textContent = "Mark complete"; showToast("Could not save. Try again."); return; }
    PROGRESS[id] = { completed: true, score: lastScore };
    btn.textContent = "Completed";
    document.getElementById("done-note").style.display = "";
    showToast("Lesson complete");
  };
  scrollTop();
}

function scrollTop() { window.scrollTo({ top: 0, behavior: "smooth" }); }

// ── Boot ──────────────────────────────────────────────────────
(async function () {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/"; return; }
  myEmail = session.user.email;

  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];

  try {
    initSharedHeader({ db, myEmail, myName, isAdmin: myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase(), activePage: "courses", avatarUrl: (ae && ae.avatar_url) || null });
  } catch (e) { console.error("initSharedHeader error:", e); }

  const [{ data: lessons }, { data: prog }] = await Promise.all([
    db.from("lessons").select("id,course,level,sort_order,title,summary,est_minutes")
      .eq("status", "published").order("course").order("level").order("sort_order"),
    db.from("lesson_progress").select("lesson_id,completed,score").eq("email", myEmail),
  ]);
  LESSONS = lessons || [];
  PROGRESS = {};
  (prog || []).forEach(p => { PROGRESS[p.lesson_id] = { completed: p.completed, score: p.score }; });

  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("app-main").style.display = "block";
  document.getElementById("app-header").style.display = "";

  renderOverview();
})();
</script>
</body>
</html>
