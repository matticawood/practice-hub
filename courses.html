<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Courses · The Practice Room</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/lessons-render.js?v=43"></script>
<!-- Global styles so the shared header (its buttons use .btn/.btn-ghost/.btn-bell/
     #presence-btn from style.css) renders identically to every other page. Our
     own warm tokens + component CSS below override what we need. -->
<link rel="stylesheet" href="/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Warm "theory-mode" tokens — identical to resources.html so Courses matches
     the rest of the member section. */
  /* Same ramp as the library. Choosing what to learn is the same act on both
     pages, so they are the same environment; the lesson pages inside a course
     stay light, because working through one is reading and answering, not
     browsing. Neutral rather than warm: a brown grey under near-black reads as
     dirty, and leaves gold as the only warm thing on the page. */
  :root {
    --bg:#0c0c0e; --surface:#17171a; --surface-2:#1f1f24; --border:#2c2c33;
    --text:#f3f3f5; --text-2:#c6c6cd; --text-muted:#9a9aa4; --text-faint:#6a6a74;
    --control:#24242b; --control-hover:#31313a; --border-2:#43434e;
    --accent:#F5C518; --accent-dark:#e0b415; --accent-subtle:#2a2313;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 28px -20px rgba(0,0,0,.8);
    --shadow-lift:0 2px 6px rgba(0,0,0,.45), 0 20px 40px -24px rgba(0,0,0,.9);
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  /* A LESSON stays light. Choosing a course is browsing, which is why this page
     is dark, but working through a lesson is reading and answering questions —
     the same split that keeps the panel under a video light on the library.
     The tokens are redefined on the reader rather than its parts restyled, so
     everything inside follows: the body the lesson renderer writes, its quiz
     blocks, its tables and its code, none of which know about this page. */
  /* The ground behind a LESSON lifts off near-black. Near-black is right for
     browsing, where the artwork should carry and the ground disappear, but a
     lesson is a white document and white on near-black glares at every edge.
     A soft charcoal recedes instead of fighting, which is what every document
     surface in a dark app does. The index keeps the darker ground. */
  body:has(.lesson-reader) { background:#1a1a1a; }   /* style.css --surface */

  /* Light and NEUTRAL, not cream. The warm palette this used to carry —
     #faf7f3 on #e0d5c8 with brown-grey text — is the same scheme taken out of
     the rest of the app for reading dirty, and left here it made the lesson the
     one surface still wearing the old look inside a neutral dark app. That
     mismatch is what read as dated rather than the lightness itself. White
     ground, neutral greys, gold still the only warm thing. */
  .lesson-reader {
    --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f4f7; --border:#e5e5ea;
    --text:#15151a; --text-2:#45454f; --text-muted:#6e6e7a; --text-faint:#9a9aa6;
    --control:#f4f4f7; --control-hover:#ebebf0; --border-2:#d7d7de;
    --accent-dark:#8a6a05; --accent-subtle:#fdf6df;
    --shadow:0 1px 2px rgba(15,15,25,.05);
    --shadow-lift:0 8px 22px -10px rgba(15,15,25,.18);
    background:var(--bg); color:var(--text);
    border:1px solid rgba(255,255,255,.06);
    border-radius:18px; padding:30px 30px 34px; margin:0 0 40px;
    box-shadow:0 18px 50px -28px rgba(0,0,0,.75);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .lesson-reader .crumbs { font-size:.78rem; color:var(--text-muted); margin-bottom:20px; }
  .lesson-reader .crumbs a { color:var(--accent-dark); font-weight:600; cursor:pointer; text-decoration:none; }
  .lesson-reader .crumbs a:hover { text-decoration:underline; }
  .lesson-reader .crumbs .sep { margin:0 7px; color:var(--text-faint); }
  /* The lesson opens on its own title in the display face, with the promise of
     the lesson under it, rather than on a bold line of the same font as the
     body. It is the one moment on the page that should feel composed. */
  .lesson-reader .reader-head { padding-bottom:20px; margin-bottom:6px;
    border-bottom:1px solid var(--border); }
  .lesson-reader .reader-head h2 { margin:0; font:800 1.85rem/1.15 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;letter-spacing:-.025em;
    letter-spacing:-.02em; color:var(--text); }
  .lesson-reader .reader-head .sub { margin-top:10px; font-size:1rem; line-height:1.55;
    color:var(--text-muted); max-width:36rem; }
  @media (max-width:640px) {
    .lesson-reader .reader-head h2 { font-size:1.5rem; }
  }
  @media (max-width:640px) {
    /* Full width on a phone, where a rounded card inside a dark page wastes the
       edges. Two attempts at this failed by trying to cancel the padding around
       it: a fixed -20px assumed one ancestor with one padding, and 100vw with a
       negative margin assumed the panel's parent was centred in the viewport.
       Neither held. So the padding is taken off the container instead and given
       back to the views that want it, which needs no assumptions at all. */
    #app-main { padding:0 0 110px; }
    /* Gutters go on plain content only, and as left/right - never the padding
       shorthand. The shorthand also overwrote the padding of the cards among
       these children (.too-easy, .resume-card, .page-head-card), giving them
       24px above their text and nothing below, which is what pushed it off
       centre. */
    #view > *:not(.lesson-reader) { padding-left:18px; padding-right:18px; }
    #view > *:first-child { margin-top:24px; }
    /* A card that runs to both edges cannot keep the corners and side borders
       of a card that floats: they meet the screen edge and read as a mistake.
       Vertical padding is left alone, which is what centres the text. */
    #view > .page-head-card, #view > .resume-card,
    #view > .too-easy, #view > .course-hero {
      border-radius:0; border-left-width:0; border-right-width:0; }
    /* the hero's own rows already carry the gutter, so it takes none itself */
    #view > .course-hero { padding-left:0; padding-right:0; }
    .lesson-reader { border-radius:0; border:0; box-shadow:none;
      width:auto; margin:0 0 40px; padding:20px 18px 26px; }
  }
  #loading-screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:50; }
  /* Fixed positioning ignores the body padding that makes room for the sidebar,
     so the spinner centred on the viewport rather than on the area it covers.
     Same query and width as the sidebar itself. */
  @media (min-width: 1025px), (orientation: landscape) and (min-width: 769px) {
    #loading-screen { left:244px; }
  }
  .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:#2a2a32; color:#fff; padding:10px 16px; border-radius:10px; font-size:.85rem; opacity:0; pointer-events:none; transition:.25s; z-index:60; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); }
  #toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
  /* Learn's gutters exactly, so a full-bleed hero pulls out through the same
     padding on both pages and the two read as one place. */
  main { display:none; max-width:none; margin:0; padding:22px clamp(18px,2.6vw,52px) 110px; }
  /* Overview cards + lesson rows flow into grids so they fill the page width
     (parity with the Pieces Library), while the lesson reader stays narrow. */
  /* Courses sit 3 to a row, then collapse straight to a single list at the
     breakpoint (no awkward 2-up step where one card wraps underneath). */
  .course-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:stretch; }
  .course-grid .course-card { margin-bottom:0; }
  @media (max-width:900px) { .course-grid { grid-template-columns:1fr; } }
  .lesson-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr)); gap:10px; align-items:stretch; }
  .lesson-grid .lesson-row, .lesson-grid .lesson-vrow { margin-bottom:0; height:100%; }
  .lesson-grid.linear { grid-template-columns:1fr; gap:10px; }
  .lesson-break { display:flex; flex-direction:column; gap:7px; padding:13px 16px; border-radius:12px;
    background:color-mix(in srgb, var(--cc-accent,#d99e12) 8%, var(--surface)); border:1px solid color-mix(in srgb, var(--cc-accent,#d99e12) 28%, var(--border)); }
  .lesson-break-label { display:inline-flex; align-items:center; gap:6px; font-size:.6rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--cc-accent,#b8860b); }
  .lesson-break-body { font-size:.9rem; line-height:1.5; color:var(--text); }
  .lesson-break-log { align-self:flex-start; font-size:.8rem; font-weight:700; color:var(--cc-accent,#b8860b); text-decoration:none; }
  .lesson-break-log:hover { text-decoration:underline; }
  .lesson-reader { max-width:960px; margin:0 auto; }
  /* Let the lesson content fill the wider reader (renderer caps it at 680). */
  .lesson-reader .lr-body { max-width:none; }
  /* Keep the keyboard at its proportioned width and centre it; at full reader
     width it would become a stubby, over-wide strip (its height is capped). */
  .lesson-reader .lr-kbd { max-width:700px; margin-left:auto; margin-right:auto; }

  /* Page title — a bordered card with a gold icon tile, a coloured eyebrow line
     above the title, and a description below: matches the resources headers. */
  .page-head-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); padding:20px 22px; margin:8px 0 18px; }
  .ph-row { display:flex; align-items:center; gap:14px; }
  .ph-icon { width:48px; height:48px; border-radius:14px; flex-shrink:0; background:linear-gradient(150deg,#f7d24a,#f5c518); color:#3a2c00; display:flex; align-items:center; justify-content:center; box-shadow:0 7px 16px -7px rgba(245,197,24,.7); }
  .ph-icon svg { width:24px; height:24px; }
  .ph-eyebrow { font-size:.72rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:3px; }
  .ph-title { font-size:1.7rem; font-weight:800; letter-spacing:-.02em; line-height:1.08; }
  .ph-sub { font-size:.92rem; color:var(--text-muted); line-height:1.5; margin-top:13px; max-width:560px; }
  @media (max-width:560px) {
    .page-head-card { padding:16px; }
    .ph-icon { width:42px; height:42px; border-radius:12px; }
    .ph-icon svg { width:22px; height:22px; }
    .ph-title { font-size:1.42rem; }
  }

  /* ── Courses hero ──────────────────────────────────────────────────────
     The surface Learn opens with, on this page. Full bleed out through the
     page padding and up under the chrome; a backdrop that obeys the rule the
     course cards already follow - the course's own artwork if it has any,
     otherwise its colour as a plate with its icon; and the next action on it. */
  /* The bleed has to match the gutter the column actually has, not the one
     this page asks for. The shared stylesheet overrides main's horizontal
     padding to a flat 28px above 1025px - and it wins here, because this page
     styles `main` by element while Learn and the library use #app-main - so a
     clamp-based bleed overshot by 5px and gave the whole page a sideways
     scrollbar. The gutter is a variable now, set in both places, so the two
     cannot drift apart again. */
  main { --cv-gut:clamp(18px,2.6vw,52px); }
  @media (min-width:1025px), (orientation:landscape) and (min-width:769px) {
    main { --cv-gut:28px; }
  }
  .cv-hero { position:relative; display:block; overflow:hidden; color:#fff;
    margin:-22px calc(var(--cv-gut) * -1) 22px;
    --cvh:clamp(20rem,26vw,25rem); height:var(--cvh); background:#17171c;
    /* so the settle into 16:9 when playback starts is a move, not a jump */
    transition:height .55s cubic-bezier(.4,0,.2,1); }
  .cv-slide { position:absolute; inset:0; opacity:0; pointer-events:none; transition:opacity .6s ease; }
  .cv-slide.on { opacity:1; pointer-events:auto; }
  .cv-bd { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 40%; }
  .cv-plate { position:absolute; inset:0;
    background:radial-gradient(120% 140% at 76% 16%, color-mix(in srgb, var(--pc) 40%, transparent), transparent 62%),
      linear-gradient(140deg, color-mix(in srgb, var(--pc) 24%, #16141c), #100e13); }
  .cv-plate-ic { position:absolute; right:9%; top:50%; transform:translateY(-50%);
    width:clamp(5rem,10vw,8.5rem); aspect-ratio:1; border-radius:24px; display:grid; place-items:center;
    background:rgba(16,14,19,.55); border:1px solid color-mix(in srgb, var(--pc) 38%, transparent);
    color:var(--pc); box-shadow:0 18px 44px -18px color-mix(in srgb, var(--pc) 80%, transparent); }
  .cv-plate-ic svg { width:52%; height:52%; }
  /* The tile catches the light, the same way Learn's plate slides do: the gleam
     is contained BY the tile, because a band crossing the whole plate reads as
     a stream of light passing over the page rather than the object itself
     catching it. Only the slide you are looking at runs it. */
  .cv-plate-ic { overflow:hidden; }
  .cv-slide.on .cv-plate-ic::after { content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(104deg, transparent 38%, rgba(255,255,255,.34) 50%, transparent 62%);
    transform:translateX(-130%); animation:cv-gleam 6.5s ease-in-out infinite; }
  @keyframes cv-gleam { 0% { transform:translateX(-130%); } 26% { transform:translateX(130%); } 100% { transform:translateX(130%); } }
  /* The halo swells as the gleam crosses, so the tile lifts rather than just
     being wiped by a highlight. */
  .cv-slide.on .cv-plate-ic { animation:cv-halo 6.5s ease-in-out infinite; }
  @keyframes cv-halo {
    0%, 100% { box-shadow:0 18px 44px -18px color-mix(in srgb, var(--pc) 70%, transparent); }
    13%      { box-shadow:0 18px 56px -12px color-mix(in srgb, var(--pc) 100%, transparent),
                          0 0 0 5px color-mix(in srgb, var(--pc) 14%, transparent); } }
  @media (prefers-reduced-motion:reduce) {
    .cv-slide.on .cv-plate-ic, .cv-slide.on .cv-plate-ic::after { animation:none; } }

  /* The slide plays its own footage behind the words, muted, with no player of
     any kind showing. Every part of mux-player's chrome is named off, not just
     --controls: the centre play button and the spinner are the two that show
     through. It fades up only once it reports itself playing. */
  mux-player.cv-vid { position:absolute; inset:0; width:100%; height:100%; z-index:0;
    pointer-events:none; opacity:0; transition:opacity .6s ease;
    --media-object-fit:cover; --media-object-position:center;
    --controls:none; --center-controls:none; --play-button:none;
    --loading-indicator:none; --dialog:none; }
  mux-player.cv-vid.ready { opacity:1; }
  mux-player.cv-vid::part(center play button),
  mux-player.cv-vid::part(play button),
  mux-player.cv-vid::part(loading indicator) { display:none; }
  .cv-scrim { position:absolute; inset:0; background:linear-gradient(90deg,
    rgba(8,8,10,.95) 0%, rgba(8,8,10,.86) 34%, rgba(8,8,10,.42) 66%, rgba(8,8,10,.14) 100%); }
  .cv-in { position:absolute; left:clamp(18px,2.6vw,52px); right:clamp(18px,2.6vw,52px);
    bottom:clamp(78px,7vw,96px); max-width:34rem; }
  .cv-kick { display:inline-flex; align-items:center; gap:8px; font-size:.63rem; font-weight:800;
    letter-spacing:.14em; text-transform:uppercase; color:#fff;
    background:color-mix(in srgb, var(--pc) 80%, #000); border-radius:999px; padding:6px 13px; }
  .cv-title { font:700 clamp(1.85rem,3.4vw,2.85rem)/1.08 Fraunces,Georgia,serif; letter-spacing:-.02em; margin:14px 0 0; }
  .cv-meta { margin:9px 0 0; font-size:.92rem; color:rgba(255,255,255,.82); }
  .cv-meta b { color:#fff; font-weight:600; }
  .cv-track { margin:16px 0 0; max-width:22rem; height:5px; border-radius:999px; background:rgba(255,255,255,.22); overflow:hidden; }
  .cv-track i { display:block; height:100%; border-radius:999px; background:var(--pc); }
  .cv-acts { display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .cv-btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; border-radius:999px;
    padding:12px 22px; font:inherit; font-weight:700; font-size:.92rem; cursor:pointer; }
  .cv-btn svg { width:14px; height:14px; }
  .cv-btn-p { background:#fff; color:#111; }
  .cv-btn-p:hover { background:#eaeaee; }
  .cv-btn-g { background:rgba(255,255,255,.12); color:#fff; border:1px solid rgba(255,255,255,.28); }
  .cv-btn-g:hover { background:rgba(255,255,255,.2); }
  .cv-soon { display:inline-flex; align-items:center; margin-top:18px; font-size:.85rem; font-weight:700; color:#fff;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.26); border-radius:999px; padding:9px 16px; }
  .cv-dots { position:absolute; right:clamp(16px,2.4vw,34px); bottom:clamp(74px,7vw,92px); display:flex; gap:7px; z-index:4; }
  .cv-dot { width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.38); border:0; padding:0; cursor:pointer; }
  .cv-dot.on { background:#fff; }
  @media (prefers-reduced-motion:reduce) { .cv-slide { transition:none; } }

  /* The numbers sit in the foot of the hero itself, under a hairline, the way
     the library counts do on Learn - so the hero ends on what you have rather
     than on the edge of a picture. */
  .cv-foot { position:absolute; left:0; right:0; bottom:0; z-index:3;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
    padding:14px clamp(20px,2.6vw,44px) 16px;
    border-top:1px solid rgba(255,255,255,.13);
    background:linear-gradient(180deg, rgba(11,11,14,.10), rgba(11,11,14,.62)); }
  .cv-nums { display:flex; gap:18px; flex-wrap:wrap; font-size:.86rem; color:rgba(255,255,255,.72); }
  .cv-nums b { color:#fff; font-weight:700; }
  .cv-obar { flex:1 1 10rem; max-width:20rem; height:6px; border-radius:999px;
    background:rgba(255,255,255,.22); overflow:hidden; }
  .cv-obar i { display:block; height:100%; border-radius:999px; background:var(--accent); }

  /* The phone rules for the hero live HERE, after the component, not up with
     the other mobile rules near the top of the sheet. A media query adds no
     specificity, so a plain .cv-scrim written above .cv-scrim simply loses on
     source order - which is exactly what happened: the dots moved and the
     scrim did not. */
  @media (max-width:640px) {
    #view > .cv-hero { padding:0; margin:0 0 18px; --cvh:23rem; }
    #view > .cv-hero:first-child { margin-top:0; }
    .cv-in { left:18px; right:18px; bottom:92px; max-width:none; }
    /* Stays a row on a phone, with the bar simply narrower and in line with the
       counts. Turning the foot into a column was what broke it: flex-basis
       becomes a HEIGHT in a column, so the bar's `flex:1 1 10rem` rendered a
       6px rule about 160px tall and swallowed the bottom of the hero. */
    .cv-foot { gap:12px; padding:12px 18px 14px; }
    .cv-nums { gap:12px; font-size:.8rem; flex-wrap:nowrap; min-width:0; }
    .cv-obar { flex:0 1 96px; max-width:96px; height:6px; }
    /* Side by side, not stacked: two rows of button ate about 70px of picture
       for no gain, and both labels fit across a phone once they stop trying to
       be full width. */
    .cv-acts { gap:9px; flex-wrap:nowrap; }
    .cv-acts .cv-btn { flex:1 1 0; min-width:0; padding:12px 10px; font-size:.86rem; white-space:nowrap; }
    /* the words sit over the picture rather than beside it, and the bottom of
       this particular picture is a keyboard - bright enough to read a ghost
       button straight off - so the scrim runs down and goes to solid. */
    .cv-scrim { background:linear-gradient(180deg, rgba(8,8,10,.34) 0%, rgba(8,8,10,.12) 20%,
      rgba(8,8,10,.68) 48%, rgba(8,8,10,.93) 72%, rgba(8,8,10,1) 88%); }
    .cv-btn-g { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.34); }
    .cv-plate-ic { right:auto; left:50%; top:28%; transform:translate(-50%,-50%); }
    .cv-title { font-size:1.75rem; }
    .cv-dots { right:16px; left:auto; top:16px; bottom:auto; }
    .cv-hero { --cvh:26rem; }
  }

  .crumbs { display:flex; align-items:center; gap:8px; font-size:.8rem; color:var(--text-muted); margin:4px 0 16px; flex-wrap:wrap; font-weight:600; }
  .crumbs a { color:var(--accent-dark); cursor:pointer; font-weight:700; }
  .crumbs a:hover { color:#6b5400; }
  .crumbs span.sep { opacity:.45; }

  /* "Too easy?" exit on the Absolute Beginner Course landing */
  .too-easy { display:flex; align-items:center; gap:12px; margin:0 0 18px; padding:13px 16px; border-radius:13px;
    text-decoration:none; color:var(--text); background:var(--surface-2); border:1px solid var(--border);
    transition:transform .15s ease, border-color .15s ease, background .15s ease; }
  .too-easy:hover { transform:translateY(-1px); border-color:var(--accent); background:var(--accent-subtle); }
  .too-easy .te-text { flex:1; min-width:0; font-size:.88rem; line-height:1.4; color:var(--text-muted); }
  .too-easy .te-text strong { color:var(--text); font-weight:700; }
  .too-easy svg { width:18px; height:18px; flex-shrink:0; color:var(--accent-dark); }

  /* Premium course cards — a coloured hero over a clean body. */
  .course-card { display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:20px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .22s, transform .22s, border-color .22s; }
  .course-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lift); border-color:color-mix(in srgb, var(--cc-accent) 45%, var(--border)); }
  .cc-hero { position:relative; aspect-ratio:16/9; overflow:hidden; }
  .cc-hero--icon { display:flex; align-items:center; justify-content:center;
    background:radial-gradient(130% 150% at 12% 8%, color-mix(in srgb, var(--cc-accent) 30%, transparent), transparent 62%),
               linear-gradient(140deg, color-mix(in srgb, var(--cc-accent) 20%, var(--surface)), color-mix(in srgb, var(--cc-accent) 7%, var(--surface))); }
  .cc-hero-ic { width:66px; height:66px; border-radius:19px; display:flex; align-items:center; justify-content:center; background:var(--surface); color:var(--cc-accent); box-shadow:0 10px 26px -12px color-mix(in srgb, var(--cc-accent) 85%, transparent); }
  .cc-hero-ic svg { width:34px; height:34px; }
  .cc-hero--video { background:#141019; }
  .cc-hero-img { width:100%; height:100%; object-fit:cover; display:block; }
  .cc-hero--video::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 50%, rgba(0,0,0,.4)); }
  .cc-hero-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.94); color:#141019; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px -8px rgba(0,0,0,.55); transition:transform .2s; z-index:1; }
  .cc-hero-play svg { width:22px; height:22px; margin-left:3px; }
  .course-card:hover .cc-hero-play { transform:translate(-50%,-50%) scale(1.07); }
  .cc-hero-tag { position:absolute; left:12px; top:12px; z-index:1; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:rgba(0,0,0,.48); padding:5px 10px; border-radius:99px; }
  .cc-body { display:flex; flex-direction:column; flex:1; padding:17px 19px 17px; }
  .cc-level { align-self:flex-start; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.65rem; font-weight:800; letter-spacing:.02em; color:color-mix(in srgb, var(--cc-accent) 62%, #fff); background:color-mix(in srgb, var(--cc-accent) 20%, transparent); border:1px solid color-mix(in srgb, var(--cc-accent) 42%, transparent); padding:4px 9px; border-radius:99px; margin-bottom:10px; }
  .cc-title { font-size:1.22rem; font-weight:800; letter-spacing:-.02em; }
  .cc-blurb { color:var(--text-muted); font-size:.89rem; line-height:1.5; margin-top:6px; }
  .cc-spacer { flex:1; min-height:14px; }
  .cc-track { height:7px; background:#2c2c34; border-radius:99px; overflow:hidden; margin-bottom:12px; }
  .cc-track-fill { height:100%; border-radius:99px; background:linear-gradient(90deg, color-mix(in srgb, var(--cc-accent) 65%, #fff), var(--cc-accent)); transition:width .5s cubic-bezier(.4,0,.2,1); }
  .cc-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cc-count { font-size:.78rem; color:var(--text-muted); font-weight:600; }
  /* Blue and crimson sit too dark on this ground for label-sized text; a touch
     of white lifts those without washing out the green and the pink. */
  .cc-cta { display:inline-flex; align-items:center; gap:5px; font-size:.83rem; font-weight:800;
    color:color-mix(in srgb, var(--cc-accent) 80%, #fff); }
  .cc-cta svg { width:16px; height:16px; }

  /* ── Overview dashboard ── */
  .ov-hero .ov-overall { margin-top:16px; padding-top:15px; border-top:1px solid var(--border); }
  .ov-overall .bar { height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 1px rgba(60,40,20,.06); }
  .ov-overall .bar > i { display:block; height:100%; background:linear-gradient(90deg,#f7d24a,#f5c518); border-radius:99px; transition:width .6s cubic-bezier(.4,0,.2,1); }
  .ov-overall .lbl { font-size:.76rem; color:var(--text-muted); font-weight:600; margin-top:8px; }
  .ov-sec { font-size:.7rem; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); margin:6px 2px 12px; }

  /* Continue / start card — the hero action */
  .resume-card { position:relative; overflow:hidden; display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:15px 17px; margin-bottom:20px; cursor:pointer; box-shadow:var(--shadow); transition:transform .18s,box-shadow .18s,border-color .18s; }
  .resume-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--cc,var(--accent)); }
  .resume-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:var(--accent); }
  .resume-card.done { cursor:default; border-color:var(--border); background:var(--surface); box-shadow:var(--shadow); }
  .resume-card.done::before { display:none; }
  .resume-card.done:hover { transform:none; box-shadow:var(--shadow); border-color:var(--border); }
  .resume-ic { width:46px; height:46px; border-radius:13px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .resume-ic svg { width:24px; height:24px; }
  .resume-meta { flex:1; min-width:0; }
  .resume-eyebrow { font-size:.66rem; font-weight:800; letter-spacing:.11em; text-transform:uppercase; color:var(--accent); }
  .resume-title { font-weight:800; font-size:1.06rem; letter-spacing:-.01em; margin-top:2px; line-height:1.22; }
  .resume-sub { color:var(--text-muted); font-size:.81rem; margin-top:3px; }
  .resume-go { width:36px; height:36px; border-radius:50%; background:var(--accent); color:#3a2c00; display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .resume-go svg { width:18px; height:18px; }

  /* Course card badges + coming-soon state */
  .cc-badge { font-size:.66rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:#e2be7c; background:rgba(200,160,80,.16); border:1px solid rgba(200,160,80,.34); padding:6px 11px; border-radius:99px; white-space:nowrap; }
  .soon-badge { flex:0 0 auto; font-size:.64rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--border); padding:6px 11px; border-radius:99px; }
  /* Coming-soon courses are greyed back so the live course stands out. */
  .course-card.soon { cursor:default; background:linear-gradient(180deg,var(--surface),var(--surface-2)); border-style:dashed; }
  .course-card.soon::before { display:none; }
  .course-card.soon .course-ic { background:var(--surface-2); color:var(--text-muted); }
  .course-card.soon .nm { color:var(--text-muted); }
  .course-card.soon:hover { transform:none; box-shadow:var(--shadow); border-color:var(--border); }
  .course-card.soon .cc-hero { opacity:.5; filter:saturate(.5); }
  .course-card.soon .cc-title, .course-card.soon .cc-blurb, .course-card.soon .cc-level { color:var(--text-muted); }
  .cc-soonfoot { font-size:.82rem; color:var(--text-muted); font-weight:600; margin-top:18px; display:flex; align-items:center; gap:8px; }
  /* Big feature card — shown when a single course is live, fills the space */
  .course-feature { background:var(--surface); border:1px solid var(--border); border-radius:22px; padding:30px; box-shadow:var(--shadow); position:relative; overflow:hidden; cursor:pointer; transition:box-shadow .2s,transform .2s,border-color .2s; }
  .course-feature::before { content:""; position:absolute; left:0; top:0; height:5px; width:100%; background:var(--cc-accent,var(--accent)); }
  .course-feature:hover { border-color:var(--accent); box-shadow:var(--shadow-lift); }
  .cf-head { display:flex; gap:18px; align-items:flex-start; }
  .cf-ic { flex:0 0 auto; }
  .cf-eyebrow { font-size:.66rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; color:var(--cc-accent,var(--accent)); }
  .cf-title { font-size:1.7rem; font-weight:800; letter-spacing:-.02em; margin-top:3px; }
  .cf-blurb { color:var(--text-muted); font-size:.98rem; line-height:1.5; margin-top:6px; }
  .cf-stats { display:flex; gap:12px; margin:22px 0; }
  .cf-stat { flex:1; background:var(--surface-2); border:1px solid var(--border); border-radius:14px; padding:14px 10px; text-align:center; }
  .cf-stat b { display:block; font-size:1.55rem; font-weight:800; letter-spacing:-.02em; line-height:1; }
  .cf-stat span { font-size:.68rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:.05em; margin-top:5px; display:block; }
  .cf-levels-h { font-size:.7rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); margin:4px 0 12px; }
  .cf-levels { display:flex; flex-direction:column; gap:14px; }
  .cf-level-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .cf-level-name { font-size:.92rem; font-weight:700; }
  .cf-level-meta { font-size:.78rem; color:var(--text-muted); font-weight:600; }
  .cf-cta { margin-top:26px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(90deg,#f7d24a,#f5c518); color:#3a2a08; border:none; border-radius:14px; padding:15px; font-size:1rem; font-weight:800; cursor:pointer; font-family:inherit; box-shadow:0 5px 16px -7px rgba(240,165,0,.55); }
  .cf-cta:hover { opacity:.93; }
  .cf-cta svg { width:18px; height:18px; }
  .cc-soonfoot .dot { width:7px; height:7px; border-radius:50%; background:var(--text-muted); opacity:.5; }

  /* Premium course hero (lesson page header) */
  .course-hero { position:relative; background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:var(--shadow); overflow:hidden; margin:8px 0 22px; }
  .course-hero::before { content:""; position:absolute; left:0; right:0; top:0; height:135px; pointer-events:none;
    background:radial-gradient(120% 170% at 10% -10%, color-mix(in srgb, var(--cc-accent) 28%, transparent), transparent 60%),
              linear-gradient(150deg, color-mix(in srgb, var(--cc-accent) 18%, var(--surface)), color-mix(in srgb, var(--cc-accent) 4%, var(--surface))); }
  .course-hero > * { position:relative; }
  /* centre, not flex-start: the 64px tile against a three-line head left 35px
     of dead space under the icon. */
  .ch-top { display:flex; gap:18px; align-items:center; padding:24px 26px 0; }
  .ch-ic { width:64px; height:64px; border-radius:18px; flex:0 0 auto; display:flex; align-items:center; justify-content:center; background:var(--surface); color:var(--cc-accent); box-shadow:0 10px 26px -12px color-mix(in srgb, var(--cc-accent) 85%, transparent); }
  .ch-ic svg { width:32px; height:32px; }
  /* A course with artwork keeps it on the way in, instead of arriving as if it
     had none. Same source as the card you clicked. */
  .course-hero > .ch-bd { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    object-position:50% 38%; opacity:.5; }
  .course-hero > .ch-bd-scrim { position:absolute; inset:0; background:linear-gradient(90deg,
    rgba(12,12,14,.96) 0%, rgba(12,12,14,.88) 40%, rgba(12,12,14,.55) 100%); }
  .ch-head { min-width:0; }
  .ch-level { display:inline-block; font-size:.65rem; font-weight:800; letter-spacing:.02em; color:var(--cc-accent); background:color-mix(in srgb, var(--cc-accent) 13%, transparent); border:1px solid color-mix(in srgb, var(--cc-accent) 30%, transparent); padding:4px 9px; border-radius:99px; margin-bottom:9px; }
  .ch-title { font-size:1.7rem; font-weight:800; letter-spacing:-.02em; line-height:1.1; }
  .ch-blurb { color:var(--text-muted); font-size:.95rem; line-height:1.5; margin-top:7px; max-width:640px; }
  .ch-prog { padding:20px 26px 0; }
  .ch-track { height:8px; background:var(--surface-2); border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 1px rgba(60,40,20,.06); }
  .ch-track > i { display:block; height:100%; border-radius:99px; background:linear-gradient(90deg, color-mix(in srgb, var(--cc-accent) 65%, #fff), var(--cc-accent)); transition:width .5s cubic-bezier(.4,0,.2,1); }
  .ch-prog-meta { display:flex; justify-content:space-between; font-size:.78rem; color:var(--text-muted); font-weight:600; margin-top:8px; }
  .ch-cta { display:inline-flex; align-items:center; gap:7px; margin:18px 26px 24px; padding:12px 20px; border:none; border-radius:12px; cursor:pointer; font-family:inherit; font-size:.92rem; font-weight:800; color:#fff; background:var(--cc-accent); box-shadow:0 9px 22px -9px color-mix(in srgb, var(--cc-accent) 90%, transparent); transition:filter .15s, transform .15s; }
  .ch-cta:hover { filter:brightness(.96); transform:translateY(-1px); }
  .ch-cta svg { width:17px; height:17px; }
  @media (max-width:560px) { .ch-top { flex-direction:column; align-items:flex-start; gap:13px; padding:20px 18px 0; } .ch-title { font-size:1.42rem; } .ch-prog { padding:16px 18px 0; } .ch-cta { margin:16px 18px 20px; } }

  /* Levels + lessons */
  .level-group { margin-bottom:24px; }
  .level-h { display:flex; align-items:center; gap:10px; margin:0 0 11px; }
  .level-h .lvl { font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.11em; color:color-mix(in srgb, var(--cc-accent) 70%, #2a2320); }
  .level-h .ln { flex:1; height:1px; background:var(--border); }
  .lesson-row { display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px 16px; margin-bottom:9px; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .18s,transform .18s,border-color .18s; }
  .lesson-row:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-lift); }
  .lesson-row .tick { width:26px; height:26px; border-radius:50%; border:2px solid var(--border); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:800; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .lesson-row .tick.done { background:var(--accent); border-color:var(--accent); }
  .lesson-row .tick.done svg { width:13px; height:13px; stroke:#3a2c00; stroke-width:3.4; fill:none; }
  .lesson-row .lt { flex:1; min-width:0; }
  .lesson-row .lt .t { font-weight:750; font-size:.97rem; letter-spacing:-.01em; }
  .lesson-row .lt .s { color:var(--text-muted); font-size:.82rem; line-height:1.4; margin-top:2px; }
  .lesson-row .mins { font-size:.73rem; color:var(--text-muted); font-weight:600; flex:0 0 auto; }
  /* Video lesson card — thumbnail + explanation */
  .lesson-vrow { display:flex; gap:14px; background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .18s, transform .18s, border-color .18s; }
  .lesson-vrow:hover { transform:translateY(-1px); box-shadow:var(--shadow-lift); border-color:color-mix(in srgb, var(--cc-accent) 45%, var(--border)); }
  .lvr-thumb { position:relative; flex:0 0 auto; width:158px; align-self:stretch; background:#141019; overflow:hidden; }
  .lvr-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .lvr-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.92); color:#141019; display:flex; align-items:center; justify-content:center; box-shadow:0 6px 16px -6px rgba(0,0,0,.5); transition:transform .18s; }
  .lvr-play svg { width:15px; height:15px; margin-left:2px; }
  .lesson-vrow:hover .lvr-play { transform:translate(-50%,-50%) scale(1.08); }
  .lvr-dur { position:absolute; right:6px; bottom:6px; font-size:.62rem; font-weight:700; color:#fff; background:rgba(0,0,0,.62); padding:2px 6px; border-radius:6px; }
  .lvr-check { position:absolute; left:7px; top:7px; width:22px; height:22px; border-radius:50%; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px -2px rgba(0,0,0,.4); }
  .lvr-check svg { width:13px; height:13px; stroke:var(--cc-accent); stroke-width:3.4; fill:none; }
  /* Designed thumbnail for written lessons (no video): a numbered panel in the course
     colour, shaded light at level 1 down to deep at level 5, with a faint staff-line
     texture. The big number is the lesson's position within its level, so no two cards
     look the same and the shade separates e.g. Level 1 Lesson 1 from Level 2 Lesson 1. */
  .lvr-thumb--num { display:block; min-height:124px; }
  /* a real five-line stave (line 2px, space 8px -> 5 lines in 42px), centred in the panel */
  .lvr-thumb--num::before { content:""; position:absolute; left:16px; right:16px; top:50%; height:42px; transform:translateY(-50%);
    background:repeating-linear-gradient(currentColor 0 2px, transparent 2px 10px); opacity:.16; }
  /* number pinned to the panel centre so it always sits on the stave, independent of the label.
     Times New Roman uses lining figures (every digit the same height on one baseline). The exact
     vertical nudge to optically centre the ink on the stave is measured at runtime from the actually
     rendered font (--num-nudge, see setNumNudge) so it is correct on any device / font fallback. */
  .lvr-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Times New Roman',Times,serif; font-weight:600; font-size:3.4rem; line-height:1; letter-spacing:-.01em;
    transform:translateY(var(--num-nudge, 0px)); }
  /* label pinned at the bottom; may wrap to two lines without pushing the number */
  .lvr-topic { position:absolute; left:0; right:0; bottom:11px; text-align:center; padding:0 10px;
    font-size:.6rem; letter-spacing:.13em; text-transform:uppercase; font-weight:800; opacity:.85; line-height:1.3;
    display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
  .lvr-thumb--num .lvr-dur { top:7px; bottom:auto; background:rgba(20,16,26,.34); }
  /* Mixed into white these were pale chips for a light page; on this one they
     are mixed into the surface and lit from the accent instead. */
  .lvr-l1 { background:color-mix(in srgb, var(--cc-accent) 16%, var(--surface-2));
            color:color-mix(in srgb, var(--cc-accent) 75%, #fff); }
  .lvr-l2 { background:color-mix(in srgb, var(--cc-accent) 28%, var(--surface-2));
            color:color-mix(in srgb, var(--cc-accent) 82%, #fff); }
  .lvr-l3 { background:color-mix(in srgb, var(--cc-accent) 82%, #13241c); color:#fff; }
  .lvr-l4 { background:color-mix(in srgb, var(--cc-accent) 60%, #13241c); color:color-mix(in srgb, var(--cc-accent) 8%, #fff); }
  .lvr-l5 { background:color-mix(in srgb, var(--cc-accent) 42%, #13241c); color:color-mix(in srgb, var(--cc-accent) 8%, #fff); }
  .lvr-info { flex:1; min-width:0; padding:12px 15px; display:flex; flex-direction:column; justify-content:center; }
  .lvr-eyebrow { font-size:.62rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--cc-accent); margin-bottom:3px; }
  .lvr-title { font-weight:750; font-size:1rem; letter-spacing:-.01em; }
  .lvr-sum { color:var(--text-muted); font-size:.84rem; line-height:1.45; margin-top:4px; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; line-clamp:3; overflow:hidden; }
  .lesson-vrow.is-done .lvr-title { color:var(--text-muted); }
  @media (max-width:520px) { .lvr-thumb { width:116px; } }
  /* "Coming soon" placeholder level + row */
  .soon-group .level-h .lvl { color:var(--text-muted); }
  .lesson-row.soon { cursor:default; background:linear-gradient(180deg,var(--surface),var(--surface-2)); border-style:dashed; box-shadow:none; }
  .lesson-row.soon:hover { transform:none; border-color:var(--border); box-shadow:none; }
  .lesson-row.soon .lock { width:24px; height:24px; border-radius:50%; background:var(--surface); border:1.5px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-muted); flex:0 0 auto; }
  .lesson-row.soon .lock svg { width:12px; height:12px; }
  .lesson-row.soon .lt .t { color:var(--text-muted); }

  /* Lesson reader */
  .reader-head h2 { font-size:1.4rem; font-weight:800; letter-spacing:-.015em; margin:2px 0 5px; }
  .reader-head .sub { color:var(--text-muted); font-size:.9rem; line-height:1.5; margin-bottom:10px; }
  .sheet-btn { display:inline-flex; align-items:center; gap:8px; margin:2px 0 4px; background:var(--surface,#fff); border:1.5px solid var(--accent,#f5c518); border-radius:10px; padding:8px 14px; font-weight:700; font-size:.85rem; color:var(--text,#1a1410); text-decoration:none; }
  .sheet-btn:hover { background:color-mix(in srgb, var(--accent,#f5c518) 10%, var(--surface,#fff)); }
  .sheet-btn .sheet-ico { font-size:1.05rem; line-height:1; color:var(--accent-dark,#9a6f12); }

  /* Buttons — match the gold gradient + ghost button used across the app */
  /* Scoped to #app-main so these never override the shared header's own .btn
     (its chat/bell buttons use .btn from style.css). */
  #app-main .btn { border:1.5px solid var(--border); background:var(--surface); color:var(--text); border-radius:12px; padding:10px 16px; font-size:.86rem; font-weight:700; cursor:pointer; font-family:inherit; transition:border-color .15s,color .15s; }
  #app-main .btn:hover { border-color:var(--border-2); }
  /* Finishing a lesson is the moment worth celebrating, and it was the same
     flat yellow as every box on the page. A filled, slightly lifted green reads
     as completion rather than as another highlighter. */
  #app-main .btn-gold { background:linear-gradient(180deg,#16a34a,#12833c); color:#fff;
    border:none; font-weight:700; box-shadow:0 2px 12px -4px rgba(22,163,74,.7); }
  #app-main .btn-gold:hover { background:linear-gradient(180deg,#18b053,#149244);
    box-shadow:0 4px 18px -5px rgba(22,163,74,.8); }

  #app-main .btn:disabled { opacity:.6; cursor:default; transform:none; box-shadow:none; }

  /* Logged-time editor shown when a lesson is marked complete */

function escHtml(s) {
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

// Measure the exact vertical nudge that optically centres the lesson-card number's ink on the
// stave, from the actually rendered font, and expose it as --num-nudge. A hardcoded constant was
// wrong across line-box metrics; this is provably correct on any device / font fallback.
function setNumNudge() {
  try {
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;font-family:'Times New Roman',Times,serif;font-weight:600;font-size:3.4rem;line-height:1;white-space:nowrap";
    const ref = document.createElement("span");
    ref.style.cssText = "display:inline-block;width:0;height:0;vertical-align:baseline";
    probe.textContent = "8"; probe.appendChild(ref); document.body.appendChild(probe);
    const pr = probe.getBoundingClientRect(), rr = ref.getBoundingClientRect();
    const cs = getComputedStyle(probe);
    const ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`; ctx.textBaseline = "alphabetic";

    const baselineFromTop = rr.top - pr.top;
    const inkCenterAboveBaseline = (m.actualBoundingBoxAscent - m.actualBoundingBoxDescent) / 2;

function showToast(msg, ms) {

// ── Logged-time editor ────────────────────────────────────────
// Opens after a lesson is marked complete so the auto-logged minutes can be
// adjusted immediately. Writes straight to the session + its practice item.
let _tmSessionId = null, _tmOrig = 0;
function _tmClamp(n) { n = Math.round(Number(n) || 0); return Math.max(1, Math.min(600, n)); }
function openLoggedTimeEditor(sessionId, minutes) {
  _tmSessionId = sessionId;
  _tmOrig = _tmClamp(minutes);
  const back = document.getElementById("tc-time-modal");
  const input = document.getElementById("tc-tm-input");
  document.getElementById("tc-tm-sub").textContent =
    "Added " + _tmOrig + " min to your practice. Adjust it if you spent more or less time.";
  input.value = _tmOrig;
  document.getElementById("tc-tm-save").disabled = false;
  document.getElementById("tc-tm-save").textContent = "Done";
  back.classList.add("show");
}
function closeLoggedTimeEditor() {
  document.getElementById("tc-time-modal").classList.remove("show");
  _tmSessionId = null;
}
// The Absolute Beginner Course (first-steps) is holistic: every lesson is
// playing a piece, working on technique, reading, and understanding at once. So
// its practice time is spread across all four roadmap tracks with a fixed
// weighting that leans to repertoire, rather than counted as pure musicianship
// like the Theory course. item_type strings map to tracks in practice-log
// (_RM_TYPE_TO_TRACK): piece->Repertoire, technique->Technique,
// sightreading->Sight-reading, theory->Musicianship.
const FS_TRACK_WEIGHTS = [
  { itemType: "piece",        w: 0.40 }, // Repertoire
  { itemType: "technique",    w: 0.25 }, // Technique
  { itemType: "sightreading", w: 0.15 }, // Sight reading
  { itemType: "theory",       w: 0.20 }, // Musicianship
];
// Largest-remainder allocation of `total` whole minutes across weights so the
// parts always sum exactly to the session total (no drift, no lost minute).
function _allocate(exacts, total) {
  const out = exacts.map(v => Math.floor(v));
  let left = total - out.reduce((a, b) => a + b, 0);
  const order = exacts.map((v, i) => ({ i, frac: v - Math.floor(v) }))
    .sort((a, b) => b.frac - a.frac);
  for (let k = 0; k < left; k++) out[order[k % order.length].i] += 1;
  return out;
}
function _fsSplit(total) {
  total = Math.round(Number(total) || 0);
  if (total <= 0) return [];
  const mins = _allocate(FS_TRACK_WEIGHTS.map(t => total * t.w), total);
  return FS_TRACK_WEIGHTS
    .map((t, i) => ({ itemType: t.itemType, minutes: mins[i] }))
    .filter(r => r.minutes > 0);
}
// Re-spread a new total across a session's existing items in their current
// proportions (used when the member adjusts the logged time). A single-item
// session just takes the whole value; a split session stays balanced.
function _reallocate(cur, total) {
  total = Math.round(Number(total) || 0);
  const sum = cur.reduce((a, b) => a + b, 0);
  if (total <= 0) return cur.map(() => 0);
  if (sum <= 0) return cur.map((_, i) => (i === 0 ? total : 0));
  return _allocate(cur.map(v => (v / sum) * total), total);
}

// Apply whatever time is shown and close. A no-op write is skipped when the
// default is untouched, so "Done" always just means "that's right".
async function _tmSave() {

  const saveBtn = document.getElementById("tc-tm-save");
  const mins = _tmClamp(input.value);
  input.value = mins;

    await db.from("practice_sessions").update({ duration_minutes: mins }).eq("id", _tmSessionId);
    // Re-spread the new total across the session's items in their current
    // proportions, so a multi-track split (this course) stays balanced and a
    // single-item session (theory) just takes the whole value.
    const { data: its } = await db.from("practice_items")
      .select("id,duration_minutes").eq("session_id", _tmSessionId).order("sort_order");
    if (its && its.length) {
      const shares = _reallocate(its.map(x => x.duration_minutes || 0), mins);
      for (let i = 0; i < its.length; i++) {
        await db.from("practice_items").update({ duration_minutes: shares[i] }).eq("id", its[i].id);
      }

  showToast("Practice time updated to " + mins + " min");
}
