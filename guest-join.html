<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joining backstage — The Practice Room</title>
  <style>
    :root {
      --bg:         #0a0a0a;
      --surface:    #141414;
      --surface-2:  #222222;
      --border:     #2a2a2a;
      --text:       #e8e8e8;
      --text-muted: #888;
      --accent:     #f5c518;
      --radius:     10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Compact top bar ──────────────────────────────────────────────────── */
    .live-top-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px; flex-shrink: 0;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .live-top-bar .logo {
      font-weight: 800; font-size: .88rem; color: var(--accent);
      letter-spacing: -.02em; flex-shrink: 0;
    }
    .live-top-bar .live-top-title {
      flex: 1; font-size: .82rem; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .live-top-badge {
      font-size: .67rem; font-weight: 700; padding: 3px 8px;
      border-radius: 20px; flex-shrink: 0;
    }
    .live-top-badge.live      { background: rgba(239,68,68,.15);  color: #ef4444;        border: 1px solid rgba(239,68,68,.35); }
    .live-top-badge.backstage { background: rgba(245,197,24,.15); color: var(--accent);  border: 1px solid rgba(245,197,24,.3); }

    /* ── Status screen ────────────────────────────────────────────────────── */
    #status-screen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 32px 24px; text-align: center;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-title { font-size: 1.05rem; font-weight: 700; }
    #status-sub   { font-size: .85rem; color: var(--text-muted); max-width: 320px; }

    /* ── Call wrap (flex row — matches #stream-wrap) ──────────────────────── */
    #call-wrap {
      display: none; flex: 1; min-height: 0;
      overflow: hidden; flex-direction: row;
    }

    /* ── Video column ─────────────────────────────────────────────────────── */
    #guest-video-col {
      flex: 1; min-width: 0; min-height: 0;
      background: #000; position: relative;
    }

    /* Waiting placeholder */
    #video-waiting {
      position: absolute; inset: 0; bottom: 72px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); pointer-events: none;
    }

    /* "You're featured" badge */
    #featured-banner {
      display: none; position: absolute; top: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(245,197,24,.15); border: 1px solid rgba(245,197,24,.45);
      border-radius: 20px; padding: 4px 14px;
      font-size: .75rem; color: var(--accent); font-weight: 600;
      z-index: 10; white-space: nowrap;
    }

    /* On-deck banner */
    #on-deck-banner {
      display: none; position: absolute; bottom: 72px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15,15,15,.96); border: 1.5px solid #22c55e;
      border-radius: var(--radius); padding: 11px 18px; z-index: 20;
      align-items: center; gap: 10px;
      min-width: 200px; max-width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,.6);
    }
    #on-deck-banner .dot   { color: #22c55e; }
    #on-deck-banner .label { font-size: .82rem; color: var(--text); flex: 1; }
    #on-deck-banner button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0; }

    /* Transition overlay */
    #transition-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(0,0,0,.85); z-index: 30;
      flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    #transition-overlay .spinner { border-top-color: #22c55e; }
    #transition-overlay p { color: #22c55e; font-weight: 600; }

    /* Controls bar */
    #call-controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      z-index: 10;
    }
    .ctrl-btn {
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      color: var(--text); border-radius: 8px; padding: 7px 13px;
      font-size: .8rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background .15s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.18); }
    .ctrl-btn.muted { background: rgba(239,68,68,.2); border-color: rgba(239,68,68,.4); color: #f87171; }
    .ctrl-leave {
      background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.35);
      color: #f87171; margin-left: auto;
    }
    .ctrl-leave:hover { background: rgba(239,68,68,.28); }
    #guest-name-label { font-size: .8rem; color: var(--text-muted); margin-left: 4px; }

    /* ── Zoom-style device selector button groups ───────────────────────── */
    .dev-group {
      display: inline-flex; align-items: stretch;
      border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
      overflow: visible; position: relative;
    }
    .dev-group > .ctrl-btn { border: none !important; border-radius: 8px 0 0 8px !important; }
    .dev-group > .ctrl-btn:only-child { border-radius: 8px !important; }
    .dev-chevron {
      display: inline-flex; align-items: center; justify-content: center;
      width: 22px; min-width: 22px; padding: 0;
      background: rgba(255,255,255,.08); border: none;
      border-left: 1px solid rgba(255,255,255,.12);
      border-radius: 0 8px 8px 0; cursor: pointer;
      color: rgba(255,255,255,.45); transition: background .12s, color .12s;
    }
    .dev-chevron:hover { background: rgba(255,255,255,.18); color: rgba(255,255,255,.9); }
    .dev-menu {
      position: absolute; bottom: calc(100% + 8px); left: 0;
      min-width: 200px; max-width: 280px;
      background: #1c1c1c; border: 1px solid rgba(255,255,255,.15); border-radius: 8px;
      padding: 4px 0; box-shadow: 0 4px 20px rgba(0,0,0,.65); z-index: 9999;
    }
    .dev-menu-header {
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: rgba(255,255,255,.35); padding: 6px 14px 3px;
    }
    .dev-menu-item {
      display: block; width: 100%; text-align: left;
      padding: 7px 14px; font-size: .8rem; color: rgba(255,255,255,.82);
      background: none; border: none; cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dev-menu-item:hover { background: rgba(255,255,255,.08); }

    /* Backstage grid */
    #bs-grid {
      display: none; position: absolute; inset: 0;
      background: transparent; overflow: hidden;
    }
    #bs-guest-grid {
      position: absolute; inset: 0;
      display: grid; gap: 4px; padding: 4px; overflow: hidden;
      background: transparent; /* watermark shows through from #guest-video-col */
    }
    .bs-tile {
      position: relative; background: transparent; border-radius: 6px;
      overflow: hidden; display: flex; align-items: center;
      justify-content: center; min-height: 0;
    }
    .bs-video-wrap {
      position: relative; max-width: 100%; max-height: 100%;
      aspect-ratio: 16/9; flex-shrink: 0;
    }
    .bs-video-wrap video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .bs-tile-name {
      position: absolute; font-weight: 600; white-space: nowrap;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.9);
      pointer-events: none; background: rgba(0,0,0,.45); border-radius: 4px;
    }
    .bs-cam-off-overlay {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      background: #111; color: var(--text-muted); font-size: .75rem;
    }
    #bs-hidden-strip {
      position: absolute; bottom: 52px; left: 6px; right: 6px;
      display: none; gap: 4px; flex-wrap: wrap; z-index: 10;
      pointer-events: none;
    }

    /* ── Sidebar (matches #stream-sidebar) ────────────────────────────────── */
    #guest-sidebar {
      width: 320px; flex-shrink: 0;
      background: var(--surface); border-left: 1.5px solid var(--border);
      display: flex; flex-direction: column;
      min-height: 0; overflow: visible;
    }

    /* Featured Q&A bar — top of sidebar */
    #featured-qa-bar {
      display: none;
      background: #1a1200; border-bottom: 2px solid var(--accent);
      padding: 10px 14px; flex-shrink: 0;
      animation: slideDown .25s ease;
    }
    #featured-qa-bar.visible { display: block; }
    @keyframes slideDown { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }
    .featured-qa-label {
      font-size: 0.68rem; color: var(--accent); font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px;
      display: flex; align-items: center; gap: 5px;
    }
    .featured-qa-text  { font-size: 0.88rem; color: #fff; line-height: 1.4; }
    .featured-qa-asker { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

    /* Sidebar tabs */
    .sidebar-tabs {
      display: flex; border-bottom: 1.5px solid var(--border); flex-shrink: 0;
    }
    .sid-tab {
      flex: 1; background: none; border: none; cursor: pointer;
      padding: 12px 10px; font-size: 0.85rem; font-weight: 600;
      color: var(--text-muted); border-bottom: 2.5px solid transparent;
      margin-bottom: -1.5px; transition: color .15s, border-color .15s;
      touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      min-height: 44px;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    }
    .sid-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* Tab unread badges */
    .sid-tab-badge {
      background: #ff6b6b; color: #fff;
      font-size: .65rem; font-weight: 700; line-height: 1;
      min-width: 16px; height: 16px; border-radius: 8px;
      padding: 0 4px; display: none; align-items: center; justify-content: center;
    }
    .sid-tab-badge.visible { display: flex; }

    /* Typing indicators */
    #chat-typing, #qa-typing {
      display: none; padding: 4px 12px 2px;
      font-size: .75rem; color: var(--text-muted); font-style: italic;
      flex-shrink: 0;
    }

    /* Panel containers */
    #sidebar-chat, #sidebar-qa {
      display: flex; flex-direction: column; flex: 1; min-height: 0;
    }

    /* Message / question scroll lists */
    #chat-messages, #qa-questions {
      flex: 1; min-height: 0; overflow-y: auto; padding: 12px;
      display: flex; flex-direction: column; gap: 8px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
      -webkit-overflow-scrolling: touch;
    }

    /* Chat message items */
    .chat-msg {
      display: flex; align-items: flex-start; gap: 8px;
      background: var(--surface-2); border-radius: 8px; padding: 8px 10px;
    }
    .chat-msg-av   { flex-shrink: 0; margin-top: 1px; }
    .chat-msg-body { flex: 1; min-width: 0; }
    .chat-msg-author { font-size: 0.75rem; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
    .chat-msg-text   { font-size: 0.88rem; color: var(--text); line-height: 1.4; word-break: break-word; }
    .chat-msg.mine   { background: #1a1200; border: 1px solid #3d3200; }

    /* Chat input row */
    .chat-input-row {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1.5px solid var(--border); flex-shrink: 0;
    }
    .chat-input-row input {
      flex: 1; background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-size: 0.88rem; font-family: inherit;
    }
    .chat-input-row input:focus { outline: none; border-color: var(--accent); }
    .chat-input-row button {
      background: var(--accent); border: none; border-radius: 8px;
      padding: 8px 14px; color: #000; font-size: .85rem; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
    }
    .chat-input-row button:hover { opacity: .88; }

    /* Q&A items */
    .qa-item {
      background: var(--surface-2); border-radius: 8px; padding: 10px 12px;
      border: 1px solid var(--border);
    }
    .qa-item.featured { border-color: var(--accent); background: #1a1200; }
    .qa-item-asker { font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .qa-item-text  { font-size: 0.88rem; color: var(--text); line-height: 1.4; }

    /* Q&A input row */
    .qa-input-row {
      display: flex; gap: 8px; padding: 10px 12px;
      border-top: 1.5px solid var(--border); flex-shrink: 0;
    }
    .qa-input-row input {
      flex: 1; background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; color: var(--text);
      font-size: 0.88rem; font-family: inherit;
    }
    .qa-input-row input:focus { outline: none; border-color: var(--accent); }
    .qa-input-row button {
      background: var(--accent); border: none; border-radius: 8px;
      padding: 8px 14px; color: #000; font-size: .85rem; font-weight: 700;
      cursor: pointer; flex-shrink: 0;
    }
    .qa-input-row button:hover { opacity: .88; }

    /* ── Mobile: stacked layout (≤700 px) ────────────────────────────────── */
    @media (max-width: 700px) {
      #call-wrap      { flex-direction: column; }
      #guest-video-col { flex: none; aspect-ratio: 16/9; }
      #guest-sidebar  { width: 100%; flex: 1; border-left: none; border-top: 1.5px solid var(--border); }
    }
    /* Portrait mobile: controls stay visible; waiting area adjusts */
    @media (max-width: 700px) {
      #video-waiting { bottom: 0; }
    }

    /* ── Landscape mobile: let video fill height ──────────────────────────── */
    @media (orientation: landscape) and (max-height: 520px) {
      #guest-video-col { flex: 1; aspect-ratio: unset; }
    }
  </style>
</head>
<body>

  <!-- Compact top bar (same as stream / backstage views) -->
  <div class="live-top-bar">
    <span class="logo">The Practice Room</span>
    <span class="live-top-title" id="header-event-title">Loading…</span>
    <span class="live-top-badge backstage" id="header-badge">Backstage</span>
  </div>

  <!-- Status / loading screen -->
  <div id="status-screen">
    <div class="spinner" id="status-spinner"></div>
    <div id="status-title">Connecting to backstage…</div>
    <div id="status-sub"></div>
  </div>

  <!-- Call UI (custom rendering — no Daily iframe) -->
  <div id="call-wrap">

    <!-- ── Video column ───────────────────────────────────────────────────── -->
    <div id="guest-video-col">
      <!-- Hidden audio elements for remote participants -->
      <div id="audio-els" style="display:none"></div>

      <!-- Waiting placeholder -->
      <div id="video-waiting">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="opacity:.25"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </div>

      <!-- Gallery grid (gallery mode) -->
      <div id="video-gallery" style="position:absolute;inset:0;bottom:72px;display:none;padding:6px;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap;align-content:center;"></div>

      <!-- Single featured video + thumbnails (spotlight/solo mode) -->
      <div id="video-main" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:transparent;">
        <video id="featured-video" autoplay playsinline style="width:100%;height:100%;object-fit:contain;background:transparent;"></video>
      </div>
      <div id="video-thumbs" style="position:absolute;bottom:72px;left:0;right:0;display:flex;gap:6px;justify-content:center;padding:0 12px;pointer-events:none;flex-wrap:wrap;"></div>

      <!-- "You're featured" indicator -->
      <div id="featured-banner">★ You're featured on stream</div>

      <!-- On-deck banner -->
      <div id="on-deck-banner">
        <span class="dot">●</span>
        <span class="label">You're on deck — host can spotlight you</span>
        <button onclick="this.closest('#on-deck-banner').style.display='none'" title="Dismiss">×</button>
      </div>

      <!-- Transition overlay -->
      <div id="transition-overlay">
        <div class="spinner"></div>
        <p>Host went live — moving you to the main stream…</p>
      </div>

      <!-- Backstage grid (shown instead of gallery/main/thumbs when in backstage) -->
      <div id="bs-grid"></div>

      <!-- Controls -->
      <div id="call-controls">
        <div class="dev-group" id="dev-group-mic">
          <button id="btn-mic" class="ctrl-btn" onclick="toggleMic()" title="Toggle microphone">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            Mic
          </button>
        </div>
        <div class="dev-group" id="dev-group-cam">
          <button id="btn-cam" class="ctrl-btn" onclick="toggleCam()" title="Toggle camera">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            Cam
          </button>
        </div>
        <button class="ctrl-btn ctrl-leave" onclick="confirmLeave()">Leave</button>
      </div>
    </div><!-- /guest-video-col -->

    <!-- ── Sidebar: Chat + Q&A (matches stream view sidebar) ─────────────── -->
    <div id="guest-sidebar">

      <!-- Featured Q&A bar — top of sidebar, same as stream view -->
      <div id="featured-qa-bar">
        <div class="featured-qa-label">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Featured Question
        </div>
        <div class="featured-qa-text" id="featured-qa-text"></div>
        <div class="featured-qa-asker" id="featured-qa-asker"></div>
      </div>

      <!-- Tabs -->
      <div class="sidebar-tabs">
        <button class="sid-tab active" id="sid-tab-chat" onclick="showGuestTab('chat',this)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Chat
          <span class="sid-tab-badge" id="chat-badge"></span>
        </button>
        <button class="sid-tab" id="sid-tab-qa" onclick="showGuestTab('qa',this)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 9V4a2 2 0 0 0-4 0v8"/><path d="M18 9a2 2 0 0 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>
          Questions
          <span class="sid-tab-badge" id="qa-badge"></span>
        </button>
      </div>

      <!-- Chat panel -->
      <div id="sidebar-chat" style="display:flex;flex-direction:column;flex:1;overflow:hidden;">
        <div id="chat-messages"></div>
        <div id="chat-typing"></div>
        <div class="chat-input-row">
          <input id="chat-input" placeholder="Say something…" maxlength="300"
            oninput="onGuestChatTyping()"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendGuestChat()}" />
          <button onclick="sendGuestChat()">Send</button>
        </div>
      </div>

      <!-- Q&A panel -->
      <div id="sidebar-qa" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
        <div id="qa-questions"></div>
        <div id="qa-typing"></div>
        <div class="qa-input-row">
          <input id="qa-input" placeholder="Ask a question…" maxlength="400"
            oninput="onGuestQATyping()"
            onkeydown="if(event.key==='Enter'){event.preventDefault();submitGuestQA()}" />
          <button onclick="submitGuestQA()">Ask</button>
        </div>
      </div>
    </div><!-- /guest-sidebar -->

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/@daily-co/daily-js"></script>

    let _camOn         = true;
    // Backstage/room grid state
    let _bsSpotlightId = null;
    let _bsHiddenIds   = new Set();
    let _requestChannel  = null; // postgres_changes subscription for approval
    let _approvalPoller  = null; // fallback poller — fires if realtime doesn't
    let _approvalHandled = false; // guard: only act on approval once

    // ── UI helpers ────────────────────────────────────────────────────────────
    function setStatus(title, sub = "", spinner = true) {
      document.getElementById("status-spinner").style.display = spinner ? "" : "none";
      document.getElementById("status-title").textContent = title;
      document.getElementById("status-sub").textContent   = sub;
    }
    function showError(title, sub = "") {
      document.getElementById("status-screen").style.display = "flex";
      document.getElementById("call-wrap").style.display = "none";
      setStatus(title, sub, false);
    }
    function setHeader(eventTitle, isLive) {
      document.getElementById("header-event-title").textContent = eventTitle || "Live Event";
      const badge = document.getElementById("header-badge");
      badge.textContent = isLive ? "Live" : "Backstage";
      badge.className   = "live-top-badge " + (isLive ? "live" : "backstage");
    }

    // ── Step 1: Request access — creates a pending row, host must approve ─────
    async function requestAccess() {
      setStatus("Requesting access…", "Waiting for the host to let you in");

      let data;
      try {
        const res = await fetch("/api/daily", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "request-guest-access", inviteToken, eventId })
        });
        data = await res.json();
      } catch(e) {
        showError("Connection failed", "Could not reach the server — check your internet and refresh.");
        return;
      }
      if (data.error) {
        const notReady = data.error.includes("hasn't opened") || data.error.includes("room not");
        showError(
          notReady ? "Host isn't ready yet" : "Could not connect",
          notReady ? "The host hasn't opened the room yet. Try again in a moment." : data.error
        );
        return;
      }

      guestName = data.guestName || "Guest";
      setHeader(data.eventTitle, data.eventStatus === "live");
      const nameLabel = document.getElementById("guest-name-label");
      if (nameLabel) nameLabel.textContent = guestName;
      setStatus("Waiting for host…", `${guestName} — the host has been notified and will let you in shortly`, false);

      _approvalHandled = false;

      function handleApproval(row) {
        if (_approvalHandled) return;
        _approvalHandled = true;
        if (_requestChannel) { db.removeChannel(_requestChannel); _requestChannel = null; }
        if (_approvalPoller) { clearInterval(_approvalPoller); _approvalPoller = null; }
        if (row.status === "approved" && row.daily_token && row.room_url) {
          joinWithToken(row.daily_token, row.room_url, data.eventTitle, data.eventStatus);
        } else if (row.status === "approved") {
          // Approved but room details missing — show error instead of silently staying stuck
          showError("Could not join", "The host approved your request but room details are missing. Please refresh the page and try again.");
        } else if (row.status === "rejected") {
          showError("Request declined", "The host declined your request to join. Contact the host if you think this is a mistake.");
        }
      }

      // Primary: postgres_changes subscription (instant when realtime publication is configured)
      _requestChannel = db.channel(`guest-req-${data.requestId}`)
        .on("postgres_changes", {
          event: "UPDATE", schema: "public", table: "event_guest_requests",
          filter: `id=eq.${data.requestId}`
        }, payload => { handleApproval(payload.new); })
        .subscribe();

      // Fallback: poll the DB every 3 s in case realtime isn't set up
      _approvalPoller = setInterval(async () => {
        if (_approvalHandled) { clearInterval(_approvalPoller); _approvalPoller = null; return; }
        try {
          const { data: row } = await db
            .from("event_guest_requests")
            .select("status, daily_token, room_url")
            .eq("id", data.requestId)
            .single();
          if (row && (row.status === "approved" || row.status === "rejected")) {
            handleApproval(row);
          }
        } catch(e) { /* silent — will retry */ }
      }, 3000);
    }

    // ── Step 2: Join the Daily room with an approved token ────────────────────
    async function joinWithToken(dailyToken, roomUrl, eventTitle, eventStatus) {
      setStatus("Joining…", "");

      _bsSpotlightId = null;
      _bsHiddenIds   = new Set();

      // Tear down any existing call
      if (callObject) {
        const old = callObject;
        callObject = null;
        try { await old.leave(); }   catch(e) {}
        try { await old.destroy(); } catch(e) {}
      }

      callObject = DailyIframe.createCallObject();

      const renderAll = () => renderBsGrid();

      callObject.on("joined-meeting",      renderAll);
      callObject.on("participant-joined",  renderAll);
      callObject.on("participant-updated", renderAll);
      callObject.on("participant-left", e => {
        if (_bsSpotlightId === e.participant?.session_id) _bsSpotlightId = null;
        _bsHiddenIds.delete(e.participant?.session_id);
        renderAll();
      });
      callObject.on("track-started",  renderAll);
      callObject.on("track-stopped",  renderAll);

      callObject.on("app-message", (e) => {
        const msg = e.data;
        if (!msg?.type) return;
        if (msg.type === "bs-spotlight") {
          _bsSpotlightId = msg.session_id || null;
          renderBsGrid();
        } else if (msg.type === "bs-hide") {
          if (msg.hidden) _bsHiddenIds.add(msg.session_id);
          else            _bsHiddenIds.delete(msg.session_id);
          renderBsGrid();
        }
      });

      callObject.on("left-meeting", () => {
        if (!callObject) return; // intentional cleanup — don't show error
        callObject = null;
        showError("You left the call", "Refresh the page to rejoin.");
      });

      // Update header badge when streaming starts/stops
      callObject.on("live-streaming-started", () => {
        const badge = document.getElementById("header-badge");
        if (badge) { badge.textContent = "Live"; badge.className = "live-top-badge live"; }
      });
      callObject.on("live-streaming-stopped", () => {
        const badge = document.getElementById("header-badge");
        if (badge) { badge.textContent = "Backstage"; badge.className = "live-top-badge backstage"; }
      });

      // Show call UI
      document.getElementById("status-screen").style.display = "none";
      document.getElementById("call-wrap").style.display = "flex";
      document.getElementById("transition-overlay").style.display = "none";

      // Apply the same diagonal watermark background as the backstage/viewer views
      (function() {
        const unit = "The Practice Room  •  ";
        const ms   = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        ms.style.cssText = "position:absolute;visibility:hidden;pointer-events:none;";
        const mt   = document.createElementNS("http://www.w3.org/2000/svg", "text");
        mt.setAttribute("font-family", "system-ui,-apple-system,sans-serif");
        mt.setAttribute("font-size",   "13");
        mt.setAttribute("font-weight", "700");
        mt.setAttributeNS("http://www.w3.org/XML/1998/namespace", "xml:space", "preserve");
        mt.textContent = unit;
        ms.appendChild(mt);
        document.body.appendChild(ms);
        const U  = Math.ceil(mt.getComputedTextLength());
        document.body.removeChild(ms);
        const W  = Math.round(U * Math.cos(22 * Math.PI / 180));
        const H  = Math.round(U * Math.sin(22 * Math.PI / 180));
        const ln = unit.repeat(8);
        const at = `font-family='system-ui,-apple-system,sans-serif' font-size='13' font-weight='700' fill='rgba(245,197,24,0.15)' xml:space='preserve'`;
        const sv =
          `<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H * 2}'>` +
          `<text x='${-U}' y='${H}'     transform='rotate(-22 0 ${H})'     ${at}>${ln}</text>` +
          `<text x='${-U}' y='${H * 2}' transform='rotate(-22 0 ${H * 2})' ${at}>${ln}</text>` +
          `</svg>`;
        const vc = document.getElementById("guest-video-col");
        if (vc) {
          vc.style.background = `#0f0e0c url("data:image/svg+xml,${encodeURIComponent(sv)}") repeat`;
          vc.style.backgroundSize = `${W}px ${H * 2}px`;
        }
      })();

      try {
        await callObject.join({ url: roomUrl, token: dailyToken });
        _micOn = true; _camOn = true;
        updateCtrlBtns();
      } catch(e) {
        showError("Could not join call", e.message);
        return;
      }

      // Re-fetch event status now (may have changed while waiting for approval)
      db.from("live_events").select("status").eq("id", eventId).single()
        .then(({ data: ev }) => { if (ev) setHeader(eventTitle, ev.status === "live"); });

      // Start chat / Q&A sidebar subscriptions
      _initGuestSidebar(eventId);

      await injectDeviceSelectors();
    }

    // ── Backstage grid renderer ───────────────────────────────────────────────

    function renderBsGrid() {
      if (!callObject) return;

      // Switch visible elements
      document.getElementById("video-gallery").style.display  = "none";
      document.getElementById("video-main").style.display     = "none";
      document.getElementById("video-thumbs").innerHTML       = "";
      document.getElementById("video-waiting").style.display  = "none";
      const bsRoot = document.getElementById("bs-grid");
      bsRoot.style.display = "block";

      const allParts = Object.values(callObject.participants());
      // Exclude audience viewers (is_owner:false → p.owner !== true)
      const backstageParts = allParts.filter(p => p.local || p.owner === true);
      const visibleParts = backstageParts.filter(p => !_bsHiddenIds.has(p.session_id));
      const hiddenParts  = backstageParts.filter(p =>  _bsHiddenIds.has(p.session_id));

      // Build / reuse CSS grid wrapper
      let grid = bsRoot.querySelector("#bs-guest-grid");
      if (!grid) {
        grid = document.createElement("div");
        grid.id = "bs-guest-grid";
        bsRoot.appendChild(grid);
        if (window.ResizeObserver)
          new ResizeObserver(() => { if (callObject) renderBsGrid(); }).observe(bsRoot);
      }

      // Layout: spotlight or equal gallery
      const spotPart   = _bsSpotlightId ? visibleParts.find(p => p.session_id === _bsSpotlightId) : null;
      const otherParts = spotPart ? visibleParts.filter(p => p.session_id !== _bsSpotlightId) : visibleParts;
      const stripH     = Math.max(56, Math.min(140, Math.round(bsRoot.clientHeight * 0.22)));

      if (spotPart) {
        const cols = Math.max(1, otherParts.length);
        grid.style.gridTemplateRows    = otherParts.length ? `1fr ${stripH}px` : "1fr";
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      } else {
        const cols = visibleParts.length <= 1 ? 1 : 2;
        const rows = Math.ceil(visibleParts.length / cols);
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        grid.style.gridTemplateRows    = `repeat(${rows}, 1fr)`;
      }

      const rendered = new Set();
      visibleParts.forEach(p => {
        rendered.add(p.session_id);
        const isSpotlit = spotPart?.session_id === p.session_id;

        let tile = document.getElementById(`bsg-tile-${p.session_id}`);
        if (!tile) {
          tile = document.createElement("div");
          tile.id = `bsg-tile-${p.session_id}`;
          tile.className = "bs-tile";

          const videoWrap = document.createElement("div");
          videoWrap.className = "bs-video-wrap";

          const video = document.createElement("video");
          video.autoplay = true; video.playsInline = true; video.muted = !!p.local;
          const syncWrap = () => {
            let w = video.videoWidth, h = video.videoHeight;
            if (!w || !h) {
              const vt = video.srcObject?.getVideoTracks?.();
              if (vt?.length) { const s = vt[0].getSettings(); w = s.width; h = s.height; }
            }
            if (w && h) videoWrap.style.aspectRatio = `${w} / ${h}`;
            bsUpdateTileLabel(tile);
          };
          video.addEventListener("loadedmetadata", syncWrap);
          video.addEventListener("resize",         syncWrap);
          video.addEventListener("playing",        syncWrap);
          videoWrap.appendChild(video);

          const nameLabel = document.createElement("div");
          nameLabel.className = "bs-tile-name";
          nameLabel.style.cssText = "bottom:6px;left:8px;";
          videoWrap.appendChild(nameLabel);

          tile.appendChild(videoWrap);

          const camOff = document.createElement("div");
          camOff.className = "bs-cam-off-overlay";
          camOff.innerHTML =
            `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">` +
            `<path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3m3-3h6l2 3h4a2 2 0 0 1 2 2v9.34"/>` +
            `<line x1="1" y1="1" x2="23" y2="23"/></svg><span>Camera off</span>`;
          tile.appendChild(camOff);
          grid.appendChild(tile);
        }

        // Spotlight grid position
        if (isSpotlit) {
          tile.style.gridRow = "1"; tile.style.gridColumn = "1 / -1";
        } else if (spotPart) {
          tile.style.gridRow = "2"; tile.style.gridColumn = "auto";
        } else {
          tile.style.gridRow = tile.style.gridColumn = "";
        }

        // Name
        const nameLabel = tile.querySelector(".bs-tile-name");
        if (nameLabel) nameLabel.textContent = p.user_name || (p.local ? "You" : "Guest");

        // Video track
        const videoWrap = tile.querySelector(".bs-video-wrap");
        const video     = tile.querySelector("video");
        const camOff    = tile.querySelector(".bs-cam-off-overlay");
        const hasVideo  = p.tracks?.video?.state === "playable";
        if (hasVideo && video) {
          const track = p.tracks.video.persistentTrack;
          if (track) {
            if (!video.srcObject || video.srcObject.getVideoTracks()[0] !== track)
              video.srcObject = new MediaStream([track]);
            if (videoWrap) {
              videoWrap.style.display = "";
              const s = track.getSettings?.() || {};
              const w = s.width || video.videoWidth, h = s.height || video.videoHeight;
              if (w && h) videoWrap.style.aspectRatio = `${w} / ${h}`;
            }
          }
          if (camOff) camOff.style.display = "none";
        } else {
          if (videoWrap) videoWrap.style.display = "none";
          if (video) video.srcObject = null;
          if (camOff) camOff.style.display = "flex";
        }

        // Audio (remote only)
        if (!p.local && p.tracks?.audio?.state === "playable") {
          let audio = tile.querySelector("audio");
          if (!audio) { audio = document.createElement("audio"); audio.autoplay = true; tile.appendChild(audio); }
          const track = p.tracks.audio.persistentTrack;
          if (track && (!audio.srcObject || audio.srcObject.getAudioTracks()[0] !== track))
            audio.srcObject = new MediaStream([track]);
        }

        bsUpdateTileLabel(tile);
      });

      // Gallery: last tile of an odd count spans both columns
      if (!spotPart && visibleParts.length > 1 && visibleParts.length % 2 !== 0) {
        const last = visibleParts[visibleParts.length - 1];
        const lastTile = document.getElementById(`bsg-tile-${last.session_id}`);
        if (lastTile) lastTile.style.gridColumn = "1 / -1";
      }

      // Remove departed/hidden tiles
      grid.querySelectorAll("[id^='bsg-tile-']").forEach(el => {
        if (!rendered.has(el.id.replace("bsg-tile-", ""))) el.remove();
      });

      // Hidden participants pill strip
      let hiddenStrip = bsRoot.querySelector("#bs-hidden-strip");
      if (!hiddenStrip) {
        hiddenStrip = document.createElement("div");
        hiddenStrip.id = "bs-hidden-strip";
        bsRoot.appendChild(hiddenStrip);
      }
      hiddenStrip.style.display = hiddenParts.length ? "flex" : "none";
      hiddenStrip.innerHTML = hiddenParts.map(p => `
        <div style="pointer-events:auto;display:inline-flex;align-items:center;gap:5px;
                    background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);
                    border-radius:20px;padding:3px 10px 3px 8px;
                    font-size:.72rem;color:var(--text-muted);">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>${p.user_name || "Guest"}
        </div>`).join("");
    }

    function bsUpdateTileLabel(tile) {
      const nameLabel = tile.querySelector(".bs-tile-name");
      if (!nameLabel) return;
      const h    = tile.clientHeight || 100;
      const size = Math.max(9, Math.min(15, Math.round(h * 0.055)));
      nameLabel.style.fontSize = `${size}px`;
      nameLabel.style.padding  = `${Math.round(size * 0.15)}px ${Math.round(size * 0.4)}px`;
      nameLabel.style.bottom   = `${Math.round(size * 0.55)}px`;
      nameLabel.style.left     = `${Math.round(size * 0.7)}px`;
    }

    async function injectDeviceSelectors() {
      // Add Zoom-style chevron buttons to the mic and cam device groups
      const chevronSvg = `<svg viewBox="0 0 24 24" width="8" height="8" fill="none" stroke="currentColor"
        stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>`;

      ["mic", "cam"].forEach(type => {
        const group = document.getElementById("dev-group-" + type);
        if (!group || group.querySelector(".dev-chevron")) return;
        const ch = document.createElement("button");
        ch.className = "dev-chevron";
        ch.title = type === "mic" ? "Select microphone" : "Select camera";
        ch.innerHTML = chevronSvg;
        ch.addEventListener("click", e => { e.stopPropagation(); _gOpenDeviceMenu(type, ch); });
        group.appendChild(ch);
      });
    }

    function _gOpenDeviceMenu(type, chevronEl) {
      const menuId = "dev-menu-" + type;
      // Toggle: close if already open
      const existing = document.getElementById(menuId);
      if (existing) { existing.remove(); return; }
      document.querySelectorAll(".dev-menu").forEach(m => m.remove());

      if (!callObject) return;

      callObject.enumerateDevices().then(({ devices }) => {
        const kind = type === "mic" ? "audioinput" : "videoinput";
        const list = (devices || []).filter(d => d.kind === kind);

        const menu = document.createElement("div");
        menu.className = "dev-menu"; menu.id = menuId;

        const header = document.createElement("div");
        header.className = "dev-menu-header";
        header.textContent = type === "mic" ? "Microphone" : "Camera";
        menu.appendChild(header);

        if (!list.length) {
          const empty = document.createElement("button");
          empty.className = "dev-menu-item"; empty.disabled = true;
          empty.style.opacity = ".5"; empty.textContent = "No devices found";
          menu.appendChild(empty);
        } else {
          list.forEach(d => {
            const btn = document.createElement("button");
            btn.className = "dev-menu-item";
            btn.textContent = d.label || (type === "mic" ? "Microphone" : "Camera");
            btn.onclick = async () => {
              try {
                await callObject.setInputDevicesAsync(
                  type === "mic" ? { audioDeviceId: d.deviceId } : { videoDeviceId: d.deviceId }
                );
              } catch(e) { console.warn("Could not switch device:", e); }
              menu.remove();
            };
            menu.appendChild(btn);
          });
        }

        chevronEl.closest(".dev-group").appendChild(menu);

        setTimeout(() => {
          function closeMenu(e) {
            if (menu.isConnected && !menu.contains(e.target)) {
              menu.remove();
              document.removeEventListener("click", closeMenu);
            }
          }
          document.addEventListener("click", closeMenu);
        }, 0);
      }).catch(e => console.warn("Could not enumerate devices for menu:", e));
    }

    // ── Mic / cam controls ────────────────────────────────────────────────────
    function updateCtrlBtns() {
      const micBtn = document.getElementById("btn-mic");
      const camBtn = document.getElementById("btn-cam");
      if (micBtn) {
        micBtn.classList.toggle("muted", !_micOn);
        micBtn.childNodes.forEach(n => { if (n.nodeType === 3) n.remove(); });
        micBtn.appendChild(document.createTextNode(_micOn ? " Mic" : " Muted"));
      }
      if (camBtn) {
        camBtn.classList.toggle("muted", !_camOn);
      }
    }

    async function toggleMic() {
      if (!callObject) return;
      _micOn = !_micOn;
      await callObject.setLocalAudio(_micOn);
      const btn = document.getElementById("btn-mic");
      if (btn) {
        btn.classList.toggle("muted", !_micOn);
        const svg = btn.querySelector("svg");
        btn.innerHTML = "";
        if (svg) btn.appendChild(svg);
        btn.appendChild(document.createTextNode(_micOn ? " Mic" : " Muted"));
      }
    }

    async function toggleCam() {
      if (!callObject) return;
      _camOn = !_camOn;
      await callObject.setLocalVideo(_camOn);
      document.getElementById("btn-cam")?.classList.toggle("muted", !_camOn);
    }

    function confirmLeave() {
      if (!confirm("Leave the " + (document.getElementById("header-badge")?.textContent === "Live" ? "stream" : "backstage") + "?")) return;
      if (callObject) {
        callObject.leave().catch(() => {});
      }
    }

    // ── Sidebar tab switching ─────────────────────────────────────────────────
    function showGuestTab(tab, btn) {
      document.querySelectorAll(".sid-tab").forEach(t => t.classList.remove("active"));
      if (btn) btn.classList.add("active");
      document.getElementById("sidebar-chat").style.display = tab === "chat" ? "flex" : "none";
      document.getElementById("sidebar-qa").style.display   = tab === "qa"   ? "flex" : "none";
      if (tab === "chat") {
        const badge = document.getElementById("chat-badge");
        if (badge) { badge.textContent = ""; badge.classList.remove("visible"); }
        const msgs = document.getElementById("chat-messages");
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
      }
      if (tab === "qa") {
        const badge = document.getElementById("qa-badge");
        if (badge) { badge.textContent = ""; badge.classList.remove("visible"); }
      }
    }

    // ── Sidebar: DB subscriptions (set up after joining) ──────────────────────
    let _chatCh   = null;
    let _qaCh     = null;
    let _typingCh = null;
    // Typing state
    let _gTypingActive = false; let _gTypingLastSent = 0; let _gTypingTimeout = null;
    let _gTypingUsers = {}; let _gTypingClearTimers = {};
    let _gQATypingActive = false; let _gQATypingLastSent = 0; let _gQATypingTimeout = null;
    let _gQATypingUsers = {}; let _gQATypingClearTimers = {};

    function _initGuestSidebar(evId) {
      // ── Chat ──────────────────────────────────────────────────────────────
      if (_chatCh) { db.removeChannel(_chatCh); _chatCh = null; }
      document.getElementById("chat-messages").innerHTML = "";

      db.from("event_chat").select("*").eq("event_id", evId).order("created_at")
        .then(({ data }) => { if (data) data.forEach(m => _appendGuestChat(m, true)); });

      _chatCh = db.channel(`guest-chat-${evId}`)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_chat",
            filter: `event_id=eq.${evId}` }, p => _appendGuestChat(p.new))
        .subscribe(async status => {
          if (status !== "SUBSCRIBED") return;
          const { data } = await db.from("event_chat").select("*").eq("event_id", evId).order("created_at");
          if (data) data.forEach(m => _appendGuestChat(m, true));
        });

      // ── Q&A ───────────────────────────────────────────────────────────────
      if (_qaCh) { db.removeChannel(_qaCh); _qaCh = null; }
      document.getElementById("qa-questions").innerHTML = "";

      db.from("event_qa").select("*").eq("event_id", evId).order("created_at")
        .then(({ data }) => {
          if (data) {
            data.forEach(q => _appendGuestQA(q, true));
            _updateGuestFeaturedBar(data.find(q => q.is_featured) || null);
          }
        });

      _qaCh = db.channel(`guest-qa-${evId}`)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_qa",
            filter: `event_id=eq.${evId}` }, p => _appendGuestQA(p.new))
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "event_qa",
            filter: `event_id=eq.${evId}` }, p => _handleGuestQAUpdate(p.new))
        .subscribe(async status => {
          if (status !== "SUBSCRIBED") return;
          const { data } = await db.from("event_qa").select("*").eq("event_id", evId).order("created_at");
          if (data) {
            data.forEach(q => _appendGuestQA(q, true));
            _updateGuestFeaturedBar(data.find(q => q.is_featured) || null);
          }
        });

      // ── Typing channel (shared with events.html so indicators cross both) ─
      if (_typingCh) { db.removeChannel(_typingCh); _typingCh = null; }
      _typingCh = db.channel(`event-typing-${evId}`, { config: { broadcast: { self: false } } })
        .on("broadcast", { event: "typing" }, ({ payload }) => {
          const _tKey = payload?.email || (payload?.name ? "guest:" + payload.name : null);
          if (!_tKey || payload?.name === guestName) return;
          if (payload.typing) {
            _gTypingUsers[_tKey] = payload.name || "Someone";
            clearTimeout(_gTypingClearTimers[_tKey]);
            _gTypingClearTimers[_tKey] = setTimeout(() => {
              delete _gTypingUsers[_tKey];
              delete _gTypingClearTimers[_tKey];
              _updateGuestTypingMerged();
            }, 4000);
          } else {
            clearTimeout(_gTypingClearTimers[_tKey]);
            delete _gTypingUsers[_tKey];
            delete _gTypingClearTimers[_tKey];
          }
          _updateGuestTypingMerged();
        })
        .on("broadcast", { event: "qa-typing" }, ({ payload }) => {
          const _tKey = payload?.email || (payload?.name ? "guest:" + payload.name : null);
          if (!_tKey || payload?.name === guestName) return;
          if (payload.typing) {
            _gQATypingUsers[_tKey] = payload.name || "Someone";
            clearTimeout(_gQATypingClearTimers[_tKey]);
            _gQATypingClearTimers[_tKey] = setTimeout(() => {
              delete _gQATypingUsers[_tKey];
              delete _gQATypingClearTimers[_tKey];
              _updateGuestTypingMerged();
            }, 4000);
          } else {
            clearTimeout(_gQATypingClearTimers[_tKey]);
            delete _gQATypingUsers[_tKey];
            delete _gQATypingClearTimers[_tKey];
          }
          _updateGuestTypingMerged();
        })
        .subscribe();
    }

    function _updateGuestTypingMerged() {
      // Merge chat + Q&A typers so indicator shows regardless of active tab
      const all = {};
      Object.values(_gTypingUsers).forEach(n => { all[n] = n; });
      Object.values(_gQATypingUsers).forEach(n => { all[n] = n; });
      const names = Object.values(all).map(n => n.split(" ")[0]).slice(0, 2);
      const text = names.length === 0 ? ""
        : names.length === 1 ? `${names[0]} is typing…`
        : `${names.join(" & ")} are typing…`;
      ["chat-typing", "qa-typing"].forEach(id => {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = text;
        el.style.display = text ? "block" : "none";
      });
    }

    // Keep legacy aliases in case called elsewhere
    function _updateGuestTyping()   { _updateGuestTypingMerged(); }
    function _updateGuestQATyping() { _updateGuestTypingMerged(); }

    function _appendGuestChat(msg, skipBadge = false) {
      const el = document.getElementById("chat-messages");
      if (!el || el.querySelector(`[data-id="${msg.id}"]`)) return;
      const mine     = msg.name === guestName;
      const initials = (msg.name || "?").split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
      const div = document.createElement("div");
      div.className = "chat-msg" + (mine ? " mine" : "");
      div.dataset.id = msg.id;
      div.innerHTML = `
        <span class="chat-msg-av">
          <span style="width:28px;height:28px;border-radius:50%;background:var(--border);
            display:inline-flex;align-items:center;justify-content:center;
            font-size:.65rem;font-weight:700;color:var(--text-muted);">${initials}</span>
        </span>
        <div class="chat-msg-body">
          <div class="chat-msg-author">${_gEsc(msg.name || "?")}</div>
          <div class="chat-msg-text">${_gEsc(msg.message)}</div>
        </div>`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
      if (!skipBadge) {
        const chatVisible = document.getElementById("sidebar-chat")?.style.display !== "none";
        if (!chatVisible) {
          const badge = document.getElementById("chat-badge");
          if (badge) { badge.textContent = "+"; badge.classList.add("visible"); }
        }
      }
    }

    function _appendGuestQA(q, skipBadge = false) {
      const el = document.getElementById("qa-questions");
      if (!el) return;
      const existing = el.querySelector(`[data-id="${q.id}"]`);
      const item = _buildGuestQAEl(q);
      if (existing) { existing.replaceWith(item); return; }
      el.appendChild(item);
      el.scrollTop = el.scrollHeight;
      if (!skipBadge) {
        const qaVisible = document.getElementById("sidebar-qa")?.style.display !== "none";
        if (!qaVisible) {
          const badge = document.getElementById("qa-badge");
          if (badge) { badge.textContent = "+"; badge.classList.add("visible"); }
        }
      }
    }

    function _handleGuestQAUpdate(partial) {
      db.from("event_qa").select("*").eq("id", partial.id).single().then(({ data: q }) => {
        if (!q) return;
        _appendGuestQA(q, true);
        db.from("event_qa").select("*").eq("event_id", q.event_id).order("created_at")
          .then(({ data }) => {
            if (data) _updateGuestFeaturedBar(data.find(x => x.is_featured) || null);
          });
      });
    }

    function _buildGuestQAEl(q) {
      const div = document.createElement("div");
      div.className = "qa-item" + (q.is_featured ? " featured" : "");
      div.dataset.id = q.id;
      div.innerHTML = `
        <div class="qa-item-asker">${_gEsc(q.name || "Anonymous")}</div>
        <div class="qa-item-text">${_gEsc(q.question)}</div>
        ${q.is_featured ? `<div style="font-size:.7rem;color:var(--accent);margin-top:4px;">★ Featured on stream</div>` : ""}
        ${q.answered   ? `<div style="font-size:.7rem;color:#22c55e;margin-top:4px;">✓ Answered</div>` : ""}`;
      return div;
    }

    function _updateGuestFeaturedBar(q) {
      const bar   = document.getElementById("featured-qa-bar");
      const text  = document.getElementById("featured-qa-text");
      const asker = document.getElementById("featured-qa-asker");
      if (!bar) return;
      if (q) {
        bar.classList.add("visible");
        if (text)  text.textContent  = q.question;
        if (asker) asker.textContent = "— " + (q.name || "Anonymous");
      } else {
        bar.classList.remove("visible");
      }
    }

    function _gEsc(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // ── Send / submit ─────────────────────────────────────────────────────────
    async function sendGuestChat() {
      const input = document.getElementById("chat-input");
      if (!input) return;
      const text = input.value.trim();
      if (!text || !eventId) return;
      input.value = "";
      clearTimeout(_gTypingTimeout);
      if (_gTypingActive && _typingCh) {
        _gTypingActive = false;
        _typingCh.send({ type: "broadcast", event: "typing", payload: { name: guestName, typing: false } });
      }
      await db.from("event_chat").insert({ event_id: eventId, email: "", name: guestName, message: text });
    }

    async function submitGuestQA() {
      const input = document.getElementById("qa-input");
      if (!input) return;
      const question = input.value.trim();
      if (!question || !eventId) return;
      input.value = "";
      clearTimeout(_gQATypingTimeout);
      if (_gQATypingActive && _typingCh) {
        _gQATypingActive = false;
        _typingCh.send({ type: "broadcast", event: "qa-typing", payload: { name: guestName, typing: false } });
      }
      await db.from("event_qa").insert({ event_id: eventId, email: "", name: guestName, question });
    }

    function onGuestChatTyping() {
      if (!_typingCh) return;
      const now = Date.now();
      if (now - _gTypingLastSent > 2000) {
        _gTypingLastSent = now; _gTypingActive = true;
        _typingCh.send({ type: "broadcast", event: "typing", payload: { name: guestName, typing: true } });
      }
      clearTimeout(_gTypingTimeout);
      _gTypingTimeout = setTimeout(() => {
        if (_gTypingActive && _typingCh) {
          _gTypingActive = false;
          _typingCh.send({ type: "broadcast", event: "typing", payload: { name: guestName, typing: false } });
        }
      }, 3000);
    }

    function onGuestQATyping() {
      if (!_typingCh) return;
      const now = Date.now();
      if (now - _gQATypingLastSent > 2000) {
        _gQATypingLastSent = now; _gQATypingActive = true;
        _typingCh.send({ type: "broadcast", event: "qa-typing", payload: { name: guestName, typing: true } });
      }
      clearTimeout(_gQATypingTimeout);
      _gQATypingTimeout = setTimeout(() => {
        if (_gQATypingActive && _typingCh) {
          _gQATypingActive = false;
          _typingCh.send({ type: "broadcast", event: "qa-typing", payload: { name: guestName, typing: false } });
        }
      }, 3000);
    }

    // ── Init ──────────────────────────────────────────────────────────────────
    async function init() {
      if (!inviteToken || !eventId) {
        showError("Invalid link", "This invite link is missing required parameters.");
        return;
      }
      db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
      await requestAccess();
    }

    init();
  </script>
</body>
</html>
