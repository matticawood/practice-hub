<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joining backstage — The Practice Room</title>
  <style>
    :root {
      --bg:          #0a0a0a;
      --surface:     #141414;
      --border:      #2a2a2a;
      --text:        #e8e8e8;
      --text-muted:  #888;
      --accent:      #f5c518;
      --radius:      10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ─────────────────────────────────── */
    #guest-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: var(--surface);
    }
    #guest-header .logo {
      font-weight: 800;
      font-size: .95rem;
      color: var(--accent);
      letter-spacing: -.02em;
    }
    #guest-header .event-title {
      font-size: .85rem;
      color: var(--text-muted);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #guest-header .badge {
      background: rgba(245,197,24,.15);
      color: var(--accent);
      font-size: .7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
      border: 1px solid rgba(245,197,24,.3);
      flex-shrink: 0;
    }

    /* ── Main layout ─────────────────────────────── */
    #guest-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Loading / error states */
    #status-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 32px 24px;
      text-align: center;
    }
    #status-icon {
      font-size: 2.5rem;
      opacity: .6;
    }
    #status-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }
    #status-sub {
      font-size: .85rem;
      color: var(--text-muted);
      max-width: 320px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Call frame */
    #call-wrap {
      display: none;
      flex: 1;
      position: relative;
      background: #000;
    }
    #call-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100% !important;
      height: 100% !important;
      border: none;
    }

    /* Transition overlay — shown when moving from backstage → live stream */
    #transition-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.85);
      z-index: 10;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    #transition-overlay .spinner { border-top-color: #22c55e; }
    #transition-overlay p { color: #22c55e; font-weight: 600; font-size: .95rem; }

    /* On-deck banner */
    #on-deck-banner {
      display: none;
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15,15,15,.96);
      border: 1.5px solid #22c55e;
      border-radius: var(--radius);
      padding: 12px 20px;
      z-index: 20;
      align-items: center;
      gap: 10px;
      min-width: 240px;
      max-width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,.6);
    }
    #on-deck-banner span.dot { color: #22c55e; }
    #on-deck-banner span.label { font-size: .83rem; color: var(--text); flex: 1; }
    #on-deck-banner button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; line-height: 1; padding: 0; flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="guest-header">
    <span class="logo">The Practice Room</span>
    <span class="event-title" id="header-event-title">Loading…</span>
    <span class="badge" id="header-badge">Backstage</span>
  </div>

  <!-- Main -->
  <div id="guest-main">
    <!-- Status / loading screen -->
    <div id="status-screen">
      <div class="spinner" id="status-spinner"></div>
      <div id="status-title">Connecting to backstage…</div>
      <div id="status-sub"></div>
    </div>

    <!-- Daily.co call frame -->
    <div id="call-wrap">
      <div id="daily-guest-container" style="position:absolute;inset:0"></div>
      <!-- Transition overlay when host goes live -->
      <div id="transition-overlay">
        <div class="spinner"></div>
        <p>Host went live — moving you to the main stream…</p>
      </div>
      <!-- On-deck banner (after being moved to main stream) -->
      <div id="on-deck-banner">
        <span class="dot">●</span>
        <span class="label">You're on deck — the host can spotlight you at any time</span>
        <button onclick="this.closest('#on-deck-banner').style.display='none'" title="Dismiss">×</button>
      </div>
    </div>
  </div>

  <!-- Supabase (anon key only — for Realtime broadcast channel) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- Daily.co SDK -->
  <script src="https://unpkg.com/@daily-co/daily-js"></script>

  <script>
    // ── Config ──────────────────────────────────────────────────────────────
    const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";

    // Read URL params
    const params      = new URLSearchParams(location.search);
    const inviteToken = params.get("token");
    const eventId     = params.get("event");

    let db           = null;
    let callFrame    = null;
    let bcastChannel = null;
    let currentRoom  = null; // { token, roomName, roomUrl, guestName, eventTitle, eventStatus }

    // ── Helpers ──────────────────────────────────────────────────────────────
    function setStatus(title, sub = "", showSpinner = true) {
      document.getElementById("status-spinner").style.display = showSpinner ? "" : "none";
      document.getElementById("status-title").textContent = title;
      document.getElementById("status-sub").textContent   = sub;
    }

    function showError(title, sub = "") {
      setStatus(title, sub, false);
      document.getElementById("status-icon").textContent = "⚠️";
      document.getElementById("status-icon").style.display = "";
      document.getElementById("status-spinner").style.display = "none";
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    async function init() {
      if (!inviteToken || !eventId) {
        showError("Invalid link", "This invite link is missing required parameters.");
        return;
      }

      // Init Supabase (anon — only used for Realtime broadcast)
      db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

      await joinCall(false);
    }

    // ── Join call (forStream = false → backstage, true → main stream) ───────
    async function joinCall(forStream) {
      setStatus(
        forStream ? "Moving you to the main stream…" : "Connecting to backstage…",
        "", true
      );

      let data;
      try {
        const res = await fetch("/api/daily", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "get-guest-token", inviteToken, eventId, forStream })
        });
        data = await res.json();
      } catch(e) {
        showError("Connection failed", "Could not reach the server. Check your internet and try refreshing.");
        return;
      }

      if (data.error) {
        showError(
          data.error === "Backstage room not found — the host hasn't opened it yet."
            ? "Backstage isn't open yet"
            : "Could not join",
          data.error === "Backstage room not found — the host hasn't opened it yet."
            ? "The host hasn't opened the backstage room yet. Try refreshing in a moment."
            : data.error
        );
        return;
      }

      currentRoom = data;

      // Update header
      document.getElementById("header-event-title").textContent = data.eventTitle || "Live Event";
      document.getElementById("header-badge").textContent = forStream ? "Live" : "Backstage";
      document.getElementById("header-badge").style.background = forStream
        ? "rgba(239,68,68,.15)" : "rgba(245,197,24,.15)";
      document.getElementById("header-badge").style.borderColor = forStream
        ? "rgba(239,68,68,.35)" : "rgba(245,197,24,.3)";
      document.getElementById("header-badge").style.color = forStream ? "#ef4444" : "var(--accent)";

      // Destroy existing frame if rejoining
      if (callFrame) {
        try { await callFrame.destroy(); } catch(e) {}
        callFrame = null;
      }

      // Hide transition overlay, show call
      document.getElementById("transition-overlay").style.display = "none";
      document.getElementById("call-wrap").style.display = "block";
      document.getElementById("status-screen").style.display = "none";

      const container = document.getElementById("daily-guest-container");
      container.innerHTML = "";

      callFrame = DailyIframe.createFrame(container, {
        showLeaveButton:      true,
        showFullscreenButton: true,
        iframeStyle: { position: "absolute", top: 0, left: 0, width: "100%", height: "100%", border: "none" }
      });

      callFrame.on("joined-meeting", () => {
        if (forStream) {
          document.getElementById("on-deck-banner").style.display = "flex";
        }
      });

      callFrame.on("left-meeting", () => {
        if (callFrame) { try { callFrame.destroy(); } catch(e) {} callFrame = null; }
        document.getElementById("call-wrap").style.display = "none";
        document.getElementById("status-screen").style.display = "flex";
        setStatus("You left the " + (forStream ? "stream" : "backstage"), "Refresh to rejoin.", false);
      });

      try {
        await callFrame.join({ url: data.roomUrl, token: data.token });
      } catch(e) {
        document.getElementById("call-wrap").style.display = "none";
        document.getElementById("status-screen").style.display = "flex";
        showError("Could not join call", e.message);
        return;
      }

      // Subscribe to backstage broadcast channel (only while in backstage)
      if (!forStream) {
        subscribeToBackstageBroadcast();
      }
    }

    // ── Backstage broadcast — auto-move when host goes live ──────────────────
    function subscribeToBackstageBroadcast() {
      if (bcastChannel) { db.removeChannel(bcastChannel); bcastChannel = null; }

      bcastChannel = db.channel(`backstage-bcast-${eventId}`, {
        config: { broadcast: { self: false } }
      })
      .on("broadcast", { event: "host-went-live" }, async () => {
        // Show transition overlay
        const overlay = document.getElementById("transition-overlay");
        if (overlay) overlay.style.display = "flex";

        // Clean up broadcast channel
        if (bcastChannel) { db.removeChannel(bcastChannel); bcastChannel = null; }

        // Leave backstage
        if (callFrame) {
          try { await callFrame.leave(); } catch(e) {}
          try { await callFrame.destroy(); } catch(e) {}
          callFrame = null;
        }

        // Join main stream
        await joinCall(true);
      })
      .subscribe();
    }

    // ── Kick off ─────────────────────────────────────────────────────────────
    init();
  </script>
</body>
</html>
