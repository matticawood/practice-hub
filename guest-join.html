<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Joining backstage — The Practice Room</title>
  <style>
    :root {
      --bg:         #0a0a0a;
      --surface:    #141414;
      --border:     #2a2a2a;
      --text:       #e8e8e8;
      --text-muted: #888;
      --accent:     #f5c518;
      --radius:     10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────────── */
    #guest-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      background: var(--surface);
    }
    .logo { font-weight: 800; font-size: .92rem; color: var(--accent); letter-spacing: -.02em; }
    #header-event-title { font-size: .83rem; color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #header-badge {
      background: rgba(245,197,24,.15); color: var(--accent);
      font-size: .68rem; font-weight: 700; padding: 3px 8px;
      border-radius: 20px; border: 1px solid rgba(245,197,24,.3); flex-shrink: 0;
    }

    /* ── Status screen ─────────────────────────── */
    #status-screen {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px; padding: 32px 24px; text-align: center;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status-title { font-size: 1.05rem; font-weight: 700; }
    #status-sub   { font-size: .85rem; color: var(--text-muted); max-width: 320px; }

    /* ── Call wrap ─────────────────────────────── */
    #call-wrap {
      display: none; flex: 1; overflow: hidden;
    }

    /* Main (featured) video */
    #video-main {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    #video-main video {
      width: 100%; height: 100%; object-fit: contain;
    }

    /* Thumbnail strip — other participants */
    #video-thumbs {
      position: absolute; bottom: 72px; left: 0; right: 0;
      display: flex; gap: 6px; justify-content: center;
      padding: 0 12px; pointer-events: none;
      flex-wrap: wrap;
    }
    .thumb-tile {
      height: 72px; width: auto; aspect-ratio: 16/9; /* overridden per-tile by JS */
      border-radius: 6px; overflow: hidden; background: #1a1a1a;
      border: 1.5px solid var(--border); flex-shrink: 0; position: relative;
    }
    .thumb-tile video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .thumb-tile .thumb-name {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,.6); color: #fff;
      font-size: .6rem; padding: 2px 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Gallery grid mode */
    #video-gallery {
      position: absolute; inset: 0; bottom: 72px;
      display: none;
      padding: 6px;
      gap: 6px;
      justify-content: center; align-items: center; flex-wrap: wrap;
      align-content: center;
    }
    .gallery-tile {
      flex: 0 0 auto;
      background: #1a1a1a; border-radius: 8px;
      overflow: hidden; position: relative;
      border: 1.5px solid var(--border);
    }
    .gallery-tile video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .gallery-tile .tile-name {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,.55); color: #fff;
      font-size: .7rem; padding: 3px 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Waiting placeholder */
    #video-waiting {
      position: absolute; inset: 0; bottom: 72px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); pointer-events: none;
    }

    /* "You're featured" badge */
    #featured-banner {
      display: none; position: absolute; top: 12px; left: 50%;
      transform: translateX(-50%);
      background: rgba(245,197,24,.15);
      border: 1px solid rgba(245,197,24,.45);
      border-radius: 20px; padding: 4px 14px;
      font-size: .75rem; color: var(--accent); font-weight: 600;
      z-index: 10; white-space: nowrap;
    }

    /* On-deck banner */
    #on-deck-banner {
      display: none; position: absolute; bottom: 72px; left: 50%;
      transform: translateX(-50%);
      background: rgba(15,15,15,.96); border: 1.5px solid #22c55e;
      border-radius: var(--radius); padding: 11px 18px; z-index: 20;
      align-items: center; gap: 10px;
      min-width: 200px; max-width: 90%;
      box-shadow: 0 8px 32px rgba(0,0,0,.6);
    }
    #on-deck-banner .dot   { color: #22c55e; }
    #on-deck-banner .label { font-size: .82rem; color: var(--text); flex: 1; }
    #on-deck-banner button { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.1rem; line-height: 1; padding: 0; }

    /* Transition overlay */
    #transition-overlay {
      display: none; position: absolute; inset: 0;
      background: rgba(0,0,0,.85); z-index: 30;
      flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    }
    #transition-overlay .spinner { border-top-color: #22c55e; }
    #transition-overlay p { color: #22c55e; font-weight: 600; }

    /* Controls bar */
    #call-controls {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 8px;
      padding: 10px 14px;
      background: linear-gradient(transparent, rgba(0,0,0,.85));
      z-index: 10;
    }
    .ctrl-btn {
      background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15);
      color: var(--text); border-radius: 8px; padding: 7px 13px;
      font-size: .8rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      transition: background .15s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.18); }
    .ctrl-btn.muted { background: rgba(239,68,68,.2); border-color: rgba(239,68,68,.4); color: #f87171; }
    .ctrl-leave {
      background: rgba(239,68,68,.15); border-color: rgba(239,68,68,.35);
      color: #f87171; margin-left: auto;
    }
    .ctrl-leave:hover { background: rgba(239,68,68,.28); }
    #guest-name-label { font-size: .8rem; color: var(--text-muted); margin-left: 4px; }

    /* ── Backstage grid (same layout as member guests in events.html) ── */
    #bs-grid {
      display: none; position: absolute; inset: 0;
      background: var(--bg); overflow: hidden;
    }

    /* ── Chat / Q&A sidebar ─────────────────────────────────────────── */
    #call-wrap { flex-direction: row; }
    #guest-video-col {
      flex: 1; position: relative; overflow: hidden; background: #000;
    }
    #guest-sidebar {
      width: 280px; flex: none;
      background: var(--surface); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .guest-sidebar-tabs {
      display: flex; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .guest-sid-tab {
      flex: 1; padding: 10px 6px; border: none; background: none;
      color: var(--text-muted); font-size: .78rem; font-weight: 600;
      cursor: pointer; border-bottom: 2px solid transparent;
      transition: color .15s, border-color .15s; position: relative;
    }
    .guest-sid-tab.active { color: var(--text); border-bottom-color: var(--accent); }
    .guest-tab-badge {
      display: none; position: absolute; top: 5px; right: 6px;
      background: var(--accent); color: #000; font-size: .6rem;
      font-weight: 700; border-radius: 99px; padding: 1px 5px; line-height: 1.4;
    }
    .guest-tab-badge.visible { display: inline-block; }
    .guest-panel {
      flex: 1; display: none; flex-direction: column; min-height: 0; overflow: hidden;
    }
    .guest-panel.active { display: flex; }
    .guest-messages, .guest-qa-list {
      flex: 1; overflow-y: auto; padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    .guest-chat-msg { display: flex; gap: 8px; align-items: flex-start; }
    .guest-chat-msg.mine { flex-direction: row-reverse; }
    .guest-chat-av { flex-shrink: 0; }
    .guest-chat-body { display: flex; flex-direction: column; gap: 2px; max-width: 75%; }
    .guest-chat-msg.mine .guest-chat-body { align-items: flex-end; }
    .guest-chat-author { font-size: .7rem; color: var(--text-muted); }
    .guest-chat-text {
      background: var(--bg); border-radius: 10px; padding: 6px 10px;
      font-size: .83rem; color: var(--text); word-break: break-word;
      border: 1px solid var(--border);
    }
    .guest-chat-msg.mine .guest-chat-text {
      background: rgba(245,197,24,.12); border-color: rgba(245,197,24,.3);
    }
    .guest-typing {
      font-size: .73rem; color: var(--text-muted); padding: 2px 10px 4px;
      flex-shrink: 0; min-height: 18px;
    }
    .guest-input-row {
      display: flex; gap: 6px; padding: 8px;
      border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .guest-input-row input {
      flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; color: var(--text); font-size: .83rem;
      outline: none;
    }
    .guest-input-row input:focus { border-color: var(--accent); }
    .guest-input-row button {
      background: var(--accent); border: none; border-radius: 6px;
      padding: 7px 13px; color: #000; font-size: .8rem; font-weight: 700; cursor: pointer;
    }
    /* Q&A items */
    .guest-qa-item {
      padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--bg); font-size: .83rem;
    }
    .guest-qa-item.featured { border-color: var(--accent); background: rgba(245,197,24,.05); }
    .guest-qa-asker { font-size: .71rem; color: var(--text-muted); margin-bottom: 3px; }
    .guest-qa-text  { color: var(--text); line-height: 1.4; }
    /* Featured question bar above video */
    #guest-featured-bar {
      display: none; padding: 7px 14px; flex-shrink: 0;
      background: rgba(245,197,24,.1); border-bottom: 1px solid rgba(245,197,24,.3);
      position: relative; z-index: 5;
    }
    #guest-featured-bar.visible { display: block; }
    #guest-featured-bar .fq-label { font-size: .67rem; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
    #guest-featured-text  { font-size: .86rem; color: #fff; line-height: 1.4; }
    #guest-featured-asker { font-size: .73rem; color: var(--text-muted); margin-top: 2px; }
    #bs-guest-grid {
      position: absolute; inset: 0;
      display: grid; gap: 4px; padding: 4px; overflow: hidden;
    }
    .bs-tile {
      position: relative; background: #111; border-radius: 6px;
      overflow: hidden; display: flex; align-items: center;
      justify-content: center; min-height: 0;
    }
    .bs-video-wrap {
      position: relative; max-width: 100%; max-height: 100%;
      aspect-ratio: 16/9; flex-shrink: 0;
    }
    .bs-video-wrap video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .bs-tile-name {
      position: absolute; font-weight: 600; white-space: nowrap;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.9);
      pointer-events: none; background: rgba(0,0,0,.45);
      border-radius: 4px;
    }
    .bs-cam-off-overlay {
      position: absolute; inset: 0; display: none; flex-direction: column;
      align-items: center; justify-content: center; gap: 6px;
      color: var(--text-muted); font-size: .75rem;
    }
    #bs-hidden-strip {
      position: absolute; bottom: 52px; left: 6px; right: 6px;
      display: none; gap: 4px; flex-wrap: wrap; z-index: 10;
      pointer-events: none;
    }
    /* Device selects injected into controls */
    .dev-select {
      font-size: .76rem; padding: 5px 6px; background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
      color: var(--text); max-width: 130px; cursor: pointer;
    }
    .dev-sep { width: 1px; height: 18px; background: rgba(255,255,255,.15); flex-shrink: 0; }
  </style>
</head>
<body>

  <!-- Header -->
  <div id="guest-header">
    <span class="logo">The Practice Room</span>
    <span id="header-event-title">Loading…</span>
    <span id="header-badge">Backstage</span>
  </div>

  <!-- Status / loading screen -->
  <div id="status-screen">
    <div class="spinner" id="status-spinner"></div>
    <div id="status-title">Connecting to backstage…</div>
    <div id="status-sub"></div>
  </div>

  <!-- Call UI (custom rendering — no Daily iframe) -->
  <div id="call-wrap">

    <!-- ── Video column ───────────────────────────────────────────── -->
    <div id="guest-video-col">
      <!-- Hidden audio elements for remote participants -->
      <div id="audio-els" style="display:none"></div>

      <!-- Featured question bar (above video area) -->
      <div id="guest-featured-bar">
        <div class="fq-label">★ Featured question</div>
        <div id="guest-featured-text"></div>
        <div id="guest-featured-asker"></div>
      </div>

      <!-- Waiting placeholder -->
      <div id="video-waiting">
        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" style="opacity:.25"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
      </div>

      <!-- Gallery grid (gallery mode) -->
      <div id="video-gallery"></div>

      <!-- Single featured video + thumbnails (spotlight/solo mode) -->
      <div id="video-main">
        <video id="featured-video" autoplay playsinline></video>
      </div>
      <div id="video-thumbs"></div>

      <!-- "You're featured" indicator -->
      <div id="featured-banner">★ You're featured on stream</div>

      <!-- On-deck banner -->
      <div id="on-deck-banner">
        <span class="dot">●</span>
        <span class="label">You're on deck — host can spotlight you</span>
        <button onclick="this.closest('#on-deck-banner').style.display='none'" title="Dismiss">×</button>
      </div>

      <!-- Transition overlay -->
      <div id="transition-overlay">
        <div class="spinner"></div>
        <p>Host went live — moving you to the main stream…</p>
      </div>

      <!-- Backstage grid (shown instead of gallery/main/thumbs when in backstage) -->
      <div id="bs-grid"></div>

      <!-- Controls -->
      <div id="call-controls">
        <button id="btn-mic" class="ctrl-btn" onclick="toggleMic()" title="Toggle microphone">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          Mic
        </button>
        <button id="btn-cam" class="ctrl-btn" onclick="toggleCam()" title="Toggle camera">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
          Cam
        </button>
        <span id="guest-name-label"></span>
        <button class="ctrl-btn ctrl-leave" onclick="confirmLeave()">Leave</button>
      </div>
    </div><!-- /guest-video-col -->

    <!-- ── Sidebar: Chat + Q&A ────────────────────────────────────── -->
    <div id="guest-sidebar">
      <div class="guest-sidebar-tabs">
        <button class="guest-sid-tab active" id="gsid-tab-chat" onclick="showGuestTab('chat',this)">
          Chat
          <span class="guest-tab-badge" id="guest-chat-badge"></span>
        </button>
        <button class="guest-sid-tab" id="gsid-tab-qa" onclick="showGuestTab('qa',this)">
          Questions
          <span class="guest-tab-badge" id="guest-qa-badge"></span>
        </button>
      </div>

      <!-- Chat panel -->
      <div class="guest-panel active" id="guest-panel-chat">
        <div class="guest-messages" id="guest-chat-messages"></div>
        <div class="guest-typing" id="guest-chat-typing"></div>
        <div class="guest-input-row">
          <input id="guest-chat-input" placeholder="Say something…" maxlength="300"
            oninput="onGuestChatTyping()"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendGuestChat()}" />
          <button onclick="sendGuestChat()">Send</button>
        </div>
      </div>

      <!-- Q&A panel -->
      <div class="guest-panel" id="guest-panel-qa">
        <div class="guest-qa-list" id="guest-qa-list"></div>
        <div class="guest-typing" id="guest-qa-typing"></div>
        <div class="guest-input-row">
          <input id="guest-qa-input" placeholder="Ask a question…" maxlength="400"
            oninput="onGuestQATyping()"
            onkeydown="if(event.key==='Enter'){event.preventDefault();submitGuestQA()}" />
          <button onclick="submitGuestQA()">Ask</button>
        </div>
      </div>
    </div><!-- /guest-sidebar -->

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/@daily-co/daily-js"></script>
  <script>
    const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
    const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";

    const params      = new URLSearchParams(location.search);
    const inviteToken = params.get("token");
    const eventId     = params.get("event");

    let db           = null;
    let callObject   = null;
    let guestName    = "";

    // Layout state
    let _layout        = { preset: "default", session_id: null };
    let _micOn         = true;
    let _camOn         = true;
    // Backstage/room grid state
    let _bsSpotlightId = null;
    let _bsHiddenIds   = new Set();
    let _requestChannel = null; // postgres_changes subscription for approval
    let _approvalPoller = null; // fallback poller — fires if realtime doesn't
    let _approvalHandled = false; // guard: only act on approval once

    // ── UI helpers ───────────────────────────────────────────────────────────
    function setStatus(title, sub = "", spinner = true) {
      document.getElementById("status-spinner").style.display = spinner ? "" : "none";
      document.getElementById("status-title").textContent = title;
      document.getElementById("status-sub").textContent   = sub;
    }
    function showError(title, sub = "") {
      document.getElementById("status-screen").style.display = "flex";
      document.getElementById("call-wrap").style.display = "none";
      setStatus(title, sub, false);
    }
    function setHeader(eventTitle, isLive) {
      document.getElementById("header-event-title").textContent = eventTitle || "Live Event";
      const badge = document.getElementById("header-badge");
      badge.textContent = isLive ? "Live" : "Backstage";
      badge.style.background    = isLive ? "rgba(239,68,68,.15)"  : "rgba(245,197,24,.15)";
      badge.style.borderColor   = isLive ? "rgba(239,68,68,.35)"  : "rgba(245,197,24,.3)";
      badge.style.color         = isLive ? "#ef4444"              : "var(--accent)";
    }

    // ── Step 1: Request access — creates a pending row, host must approve ───────
    async function requestAccess() {
      setStatus("Requesting access…", "Waiting for the host to let you in");

      let data;
      try {
        const res = await fetch("/api/daily", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "request-guest-access", inviteToken, eventId })
        });
        data = await res.json();
      } catch(e) {
        showError("Connection failed", "Could not reach the server — check your internet and refresh.");
        return;
      }
      if (data.error) {
        const notReady = data.error.includes("hasn't opened") || data.error.includes("room not");
        showError(
          notReady ? "Host isn't ready yet" : "Could not connect",
          notReady ? "The host hasn't opened the room yet. Try again in a moment." : data.error
        );
        return;
      }

      guestName = data.guestName || "Guest";
      setHeader(data.eventTitle, data.eventStatus === "live");
      document.getElementById("guest-name-label").textContent = guestName;
      setStatus("Waiting for host…", `${guestName} — the host has been notified and will let you in shortly`, false);

      _approvalHandled = false;

      function handleApproval(row) {
        if (_approvalHandled) return;
        _approvalHandled = true;
        if (_requestChannel) { db.removeChannel(_requestChannel); _requestChannel = null; }
        if (_approvalPoller) { clearInterval(_approvalPoller); _approvalPoller = null; }
        if (row.status === "approved" && row.daily_token && row.room_url) {
          joinWithToken(row.daily_token, row.room_url, data.eventTitle, data.eventStatus);
        } else if (row.status === "rejected") {
          showError("Request declined", "The host declined your request to join. Contact the host if you think this is a mistake.");
        }
      }

      // Primary: postgres_changes subscription (instant when realtime publication is configured)
      _requestChannel = db.channel(`guest-req-${data.requestId}`)
        .on("postgres_changes", {
          event: "UPDATE", schema: "public", table: "event_guest_requests",
          filter: `id=eq.${data.requestId}`
        }, payload => { handleApproval(payload.new); })
        .subscribe();

      // Fallback: poll the DB every 3 s in case realtime isn't set up
      _approvalPoller = setInterval(async () => {
        if (_approvalHandled) { clearInterval(_approvalPoller); _approvalPoller = null; return; }
        try {
          const { data: row } = await db
            .from("event_guest_requests")
            .select("status, daily_token, room_url")
            .eq("id", data.requestId)
            .single();
          if (row && (row.status === "approved" || row.status === "rejected")) {
            handleApproval(row);
          }
        } catch(e) { /* silent — will retry */ }
      }, 3000);
    }

    // ── Step 2: Join the Daily room with an approved token ────────────────────
    async function joinWithToken(dailyToken, roomUrl, eventTitle, eventStatus) {
      setStatus("Joining…", "");

      _bsSpotlightId = null;
      _bsHiddenIds   = new Set();

      // Tear down any existing call
      if (callObject) {
        const old = callObject;
        callObject = null;
        try { await old.leave(); }   catch(e) {}
        try { await old.destroy(); } catch(e) {}
      }

      callObject = DailyIframe.createCallObject();

      const renderAll = () => renderBsGrid();

      callObject.on("joined-meeting",    renderAll);
      callObject.on("participant-joined",  renderAll);
      callObject.on("participant-updated", renderAll);
      callObject.on("participant-left",  e => {
        if (_bsSpotlightId === e.participant?.session_id) _bsSpotlightId = null;
        _bsHiddenIds.delete(e.participant?.session_id);
        renderAll();
      });
      callObject.on("track-started",  renderAll);
      callObject.on("track-stopped",  renderAll);

      callObject.on("app-message", (e) => {
        const msg = e.data;
        if (!msg?.type) return;
        if (msg.type === "bs-spotlight") {
          _bsSpotlightId = msg.session_id || null;
          renderBsGrid();
        } else if (msg.type === "bs-hide") {
          if (msg.hidden) _bsHiddenIds.add(msg.session_id);
          else            _bsHiddenIds.delete(msg.session_id);
          renderBsGrid();
        }
      });

      callObject.on("left-meeting", () => {
        if (!callObject) return; // intentional cleanup — don't show error
        callObject = null;
        showError("You left the call", "Refresh the page to rejoin.");
      });

      // Show call UI
      document.getElementById("status-screen").style.display = "none";
      document.getElementById("call-wrap").style.display = "flex";
      document.getElementById("transition-overlay").style.display = "none";

      try {
        await callObject.join({ url: roomUrl, token: dailyToken });
        _micOn = true; _camOn = true;
        updateCtrlBtns();
      } catch(e) {
        showError("Could not join call", e.message);
        return;
      }

      // Start chat / Q&A sidebar subscriptions
      _initGuestSidebar(eventId);

      await injectDeviceSelectors();
    }

    // ── Backstage grid renderer (matches member-guest view in events.html) ───

    function renderBsGrid() {
      if (!callObject) return;

      // Switch visible elements
      document.getElementById("video-gallery").style.display  = "none";
      document.getElementById("video-main").style.display     = "none";
      document.getElementById("video-thumbs").innerHTML       = "";
      document.getElementById("video-waiting").style.display  = "none";
      const bsRoot = document.getElementById("bs-grid");
      bsRoot.style.display = "block";

      const allParts = Object.values(callObject.participants());
      // Exclude audience viewers (is_owner:false → p.owner !== true)
      const backstageParts = allParts.filter(p => p.local || p.owner === true);
      const visibleParts = backstageParts.filter(p => !_bsHiddenIds.has(p.session_id));
      const hiddenParts  = backstageParts.filter(p =>  _bsHiddenIds.has(p.session_id));

      // Build / reuse CSS grid wrapper
      let grid = bsRoot.querySelector("#bs-guest-grid");
      if (!grid) {
        grid = document.createElement("div");
        grid.id = "bs-guest-grid";
        bsRoot.appendChild(grid);
        if (window.ResizeObserver)
          new ResizeObserver(() => { if (_inBackstage) renderBsGrid(); }).observe(bsRoot);
      }

      // Layout: spotlight or equal gallery
      const spotPart   = _bsSpotlightId ? visibleParts.find(p => p.session_id === _bsSpotlightId) : null;
      const otherParts = spotPart ? visibleParts.filter(p => p.session_id !== _bsSpotlightId) : visibleParts;
      const stripH     = Math.max(56, Math.min(140, Math.round(bsRoot.clientHeight * 0.22)));

      if (spotPart) {
        const cols = Math.max(1, otherParts.length);
        grid.style.gridTemplateRows    = otherParts.length ? `1fr ${stripH}px` : "1fr";
        grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      } else {
        grid.style.gridTemplateRows    = "";
        grid.style.gridTemplateColumns = `repeat(${visibleParts.length <= 1 ? 1 : 2}, 1fr)`;
      }

      const rendered = new Set();
      visibleParts.forEach(p => {
        rendered.add(p.session_id);
        const isSpotlit = spotPart?.session_id === p.session_id;

        let tile = document.getElementById(`bsg-tile-${p.session_id}`);
        if (!tile) {
          tile = document.createElement("div");
          tile.id = `bsg-tile-${p.session_id}`;
          tile.className = "bs-tile";

          const videoWrap = document.createElement("div");
          videoWrap.className = "bs-video-wrap";

          const video = document.createElement("video");
          video.autoplay = true; video.playsInline = true; video.muted = !!p.local;
          const syncWrap = () => {
            let w = video.videoWidth, h = video.videoHeight;
            if (!w || !h) {
              const vt = video.srcObject?.getVideoTracks?.();
              if (vt?.length) { const s = vt[0].getSettings(); w = s.width; h = s.height; }
            }
            if (w && h) videoWrap.style.aspectRatio = `${w} / ${h}`;
            bsUpdateTileLabel(tile);
          };
          video.addEventListener("loadedmetadata", syncWrap);
          video.addEventListener("resize",         syncWrap);
          video.addEventListener("playing",        syncWrap);
          videoWrap.appendChild(video);

          const nameLabel = document.createElement("div");
          nameLabel.className = "bs-tile-name";
          nameLabel.style.cssText = "bottom:6px;left:8px;";
          videoWrap.appendChild(nameLabel);

          tile.appendChild(videoWrap);

          const camOff = document.createElement("div");
          camOff.className = "bs-cam-off-overlay";
          camOff.innerHTML =
            `<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">` +
            `<path d="M21 21H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3m3-3h6l2 3h4a2 2 0 0 1 2 2v9.34"/>` +
            `<line x1="1" y1="1" x2="23" y2="23"/></svg><span>Camera off</span>`;
          tile.appendChild(camOff);
          grid.appendChild(tile);
        }

        // Spotlight grid position
        if (isSpotlit) {
          tile.style.gridRow = "1"; tile.style.gridColumn = "1 / -1";
        } else if (spotPart) {
          tile.style.gridRow = "2"; tile.style.gridColumn = "auto";
        } else {
          tile.style.gridRow = tile.style.gridColumn = "";
        }

        // Name
        const nameLabel = tile.querySelector(".bs-tile-name");
        if (nameLabel) nameLabel.textContent = p.user_name || (p.local ? "You" : "Guest");

        // Video track
        const videoWrap = tile.querySelector(".bs-video-wrap");
        const video     = tile.querySelector("video");
        const camOff    = tile.querySelector(".bs-cam-off-overlay");
        const hasVideo  = p.tracks?.video?.state === "playable";
        if (hasVideo && video) {
          const track = p.tracks.video.persistentTrack;
          if (track) {
            if (!video.srcObject || video.srcObject.getVideoTracks()[0] !== track)
              video.srcObject = new MediaStream([track]);
            if (videoWrap) {
              videoWrap.style.display = "";
              const s = track.getSettings?.() || {};
              const w = s.width || video.videoWidth, h = s.height || video.videoHeight;
              if (w && h) videoWrap.style.aspectRatio = `${w} / ${h}`;
            }
          }
          if (camOff) camOff.style.display = "none";
        } else {
          if (videoWrap) videoWrap.style.display = "none";
          if (video) video.srcObject = null;
          if (camOff) camOff.style.display = "flex";
        }

        // Audio (remote only)
        if (!p.local && p.tracks?.audio?.state === "playable") {
          let audio = tile.querySelector("audio");
          if (!audio) { audio = document.createElement("audio"); audio.autoplay = true; tile.appendChild(audio); }
          const track = p.tracks.audio.persistentTrack;
          if (track && (!audio.srcObject || audio.srcObject.getAudioTracks()[0] !== track))
            audio.srcObject = new MediaStream([track]);
        }

        bsUpdateTileLabel(tile);
      });

      // Remove departed/hidden tiles
      grid.querySelectorAll("[id^='bsg-tile-']").forEach(el => {
        if (!rendered.has(el.id.replace("bsg-tile-", ""))) el.remove();
      });

      // Hidden participants pill strip
      let hiddenStrip = bsRoot.querySelector("#bs-hidden-strip");
      if (!hiddenStrip) {
        hiddenStrip = document.createElement("div");
        hiddenStrip.id = "bs-hidden-strip";
        bsRoot.appendChild(hiddenStrip);
      }
      hiddenStrip.style.display = hiddenParts.length ? "flex" : "none";
      hiddenStrip.innerHTML = hiddenParts.map(p => `
        <div style="pointer-events:auto;display:inline-flex;align-items:center;gap:5px;
                    background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);
                    border-radius:20px;padding:3px 10px 3px 8px;
                    font-size:.72rem;color:var(--text-muted);">
          <svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>${p.user_name || "Guest"}
        </div>`).join("");
    }

    function bsUpdateTileLabel(tile) {
      const nameLabel = tile.querySelector(".bs-tile-name");
      if (!nameLabel) return;
      const h    = tile.clientHeight || 100;
      const size = Math.max(9, Math.min(15, Math.round(h * 0.055)));
      nameLabel.style.fontSize = `${size}px`;
      nameLabel.style.padding  = `${Math.round(size * 0.15)}px ${Math.round(size * 0.4)}px`;
      nameLabel.style.bottom   = `${Math.round(size * 0.55)}px`;
      nameLabel.style.left     = `${Math.round(size * 0.7)}px`;
    }

    async function injectDeviceSelectors() {
      let devices = [];
      try { const r = await callObject.enumerateDevices(); devices = r.devices || []; } catch(e) {}
      const mics = devices.filter(d => d.kind === "audioinput");
      const cams = devices.filter(d => d.kind === "videoinput");
      const micOpts = mics.map(m => `<option value="${m.deviceId}">${m.label||"Microphone"}</option>`).join("");
      const camOpts = cams.map(c => `<option value="${c.deviceId}">${c.label||"Camera"}</option>`).join("");
      const bar = document.getElementById("call-controls");
      if (!bar || bar.querySelector(".dev-select")) return; // already injected
      const micBtn = document.getElementById("btn-mic");
      if (micBtn && micOpts) {
        const sel = document.createElement("select");
        sel.className = "dev-select"; sel.title = "Microphone";
        sel.innerHTML = micOpts;
        sel.onchange = async () => { try { await callObject.setInputDevicesAsync({ audioDeviceId: sel.value }); } catch(e) {} };
        micBtn.insertAdjacentElement("afterend", sel);
      }
      const sep = document.createElement("div"); sep.className = "dev-sep";
      document.getElementById("btn-cam")?.insertAdjacentElement("beforebegin", sep);
      const camBtn = document.getElementById("btn-cam");
      if (camBtn && camOpts) {
        const sel = document.createElement("select");
        sel.className = "dev-select"; sel.title = "Camera";
        sel.innerHTML = camOpts;
        sel.onchange = async () => { try { await callObject.setInputDevicesAsync({ videoDeviceId: sel.value }); } catch(e) {} };
        camBtn.insertAdjacentElement("afterend", sel);
      }
    }

    // ── (Stream rendering removed — guests always see the room grid) ─────────
    function renderLayout() { renderBsGrid(); } // fallback alias, not normally called
    let _activeSpeakerId = null;
    function _unusedRenderLayout() {
      if (!callObject) return;
      const all    = Object.values(callObject.participants());
      const local  = callObject.participants().local;
      const others = all.filter(p => !p.local);

      // Sync audio for remote participants (always)
      syncAudio(others);

      const waiting = document.getElementById("video-waiting");
      if (!others.length) {
        // No one else yet
        clearMainVideo();
        document.getElementById("video-thumbs").innerHTML = "";
        document.getElementById("video-gallery").style.display = "none";
        document.getElementById("video-gallery").innerHTML = "";
        document.getElementById("video-main").style.display = "flex";
        if (waiting) waiting.style.display = "flex";
        return;
      }
      if (waiting) waiting.style.display = "none";

      if (_layout.preset === "default") {
        // Gallery — show everyone (including local) in a grid
        document.getElementById("video-main").style.display = "none";
        document.getElementById("video-thumbs").innerHTML = "";
        showGallery(all);
      } else {
        // Spotlight / single-participant / solo
        document.getElementById("video-gallery").style.display = "none";
        document.getElementById("video-gallery").innerHTML = "";
        document.getElementById("video-main").style.display = "flex";

        let featured;
        if (_layout.preset === "single-participant" && _layout.session_id) {
          featured = all.find(p => p.session_id === _layout.session_id) || others[0];
        } else if (_layout.preset === "spotlight" && _activeSpeakerId) {
          featured = all.find(p => p.session_id === _activeSpeakerId) || others[0];
        } else {
          featured = others[0];
        }

        showFeaturedParticipant(featured);
        showThumbnails(all.filter(p => p !== featured));
      }
    }

    // Returns the aspect ratio of a participant's video track.
    // Reads track.getSettings() first (available immediately for remote tracks),
    // then falls back to video element intrinsics.
    function getVideoAR(p, videoEl) {
      const vt = p?.tracks?.video?.persistentTrack;
      if (vt) {
        const s = vt.getSettings?.() || {};
        if (s.width && s.height) return s.width / s.height;
      }
      if (videoEl?.videoWidth && videoEl?.videoHeight)
        return videoEl.videoWidth / videoEl.videoHeight;
      return 16 / 9; // safe default
    }

    function showGallery(participants) {
      const grid = document.getElementById("video-gallery");
      grid.style.display = "flex";

      const count = participants.length;
      const w = Math.min(260, Math.max(120, Math.floor((window.innerWidth - 24) / Math.ceil(Math.sqrt(count))) - 8));

      while (grid.children.length > count) grid.lastChild.remove();

      participants.forEach((p, i) => {
        let tile = grid.children[i];
        if (!tile) {
          tile = document.createElement("div");
          tile.className = "gallery-tile";
          tile.innerHTML = `<video autoplay playsinline></video><div class="tile-name"></div>`;
          grid.appendChild(tile);
        }
        const vid = tile.querySelector("video");
        attachTrack(vid, p, true, tile);
        // Height from actual track AR — recalculated on every renderLayout call
        const ar = getVideoAR(p, vid);
        tile.style.width  = w + "px";
        tile.style.height = Math.round(w / ar) + "px";
        tile.querySelector(".tile-name").textContent = p.user_name || "Guest";
      });
    }

    function showFeaturedParticipant(p) {
      const vid = document.getElementById("featured-video");
      if (!p) { vid.srcObject = null; return; }
      attachTrack(vid, p, false);
    }

    function showThumbnails(participants) {
      const strip = document.getElementById("video-thumbs");
      strip.innerHTML = "";
      participants.forEach(p => {
        const tile = document.createElement("div");
        tile.className = "thumb-tile";
        const vid = document.createElement("video");
        vid.autoplay = true; vid.playsInline = true;
        const nameEl = document.createElement("div");
        nameEl.className = "thumb-name";
        nameEl.textContent = p.user_name || "Guest";
        tile.appendChild(vid);
        tile.appendChild(nameEl);
        strip.appendChild(tile);
        attachTrack(vid, p, true, tile);
      });
    }

    function attachTrack(videoEl, participant, muted, tileEl) {
      videoEl.muted = muted || participant?.local || false;
      const vt = participant?.tracks?.video?.persistentTrack;
      if (vt && participant?.tracks?.video?.state === "playable") {
        if (!videoEl.srcObject || !videoEl.srcObject.getVideoTracks().includes(vt)) {
          videoEl.srcObject = new MediaStream([vt]);
        }
        // Sync tile aspect-ratio from track settings immediately
        if (tileEl) _syncTileAR(videoEl, vt, tileEl);
        // Re-sync on dimension changes (phone rotation, resolution switch)
        if (tileEl && !videoEl._arSynced) {
          const sync = () => _syncTileAR(videoEl, vt, tileEl);
          videoEl.addEventListener("loadedmetadata", sync);
          videoEl.addEventListener("resize",         sync);
          videoEl.addEventListener("playing",        sync);
          videoEl._arSynced = true;
        }
      } else {
        videoEl.srcObject = null;
        if (tileEl) tileEl.style.aspectRatio = "16 / 9";
      }
    }

    function _syncTileAR(videoEl, track, tileEl) {
      const s = track?.getSettings?.() || {};
      const w = s.width  || videoEl.videoWidth;
      const h = s.height || videoEl.videoHeight;
      if (w && h) tileEl.style.aspectRatio = `${w} / ${h}`;
    }

    function clearMainVideo() {
      const vid = document.getElementById("featured-video");
      if (vid) vid.srcObject = null;
    }

    function syncAudio(remoteParticipants) {
      const container = document.getElementById("audio-els");
      const existing  = {};
      container.querySelectorAll("audio[data-session]").forEach(a => {
        existing[a.dataset.session] = a;
      });

      const seen = new Set();
      remoteParticipants.forEach(p => {
        seen.add(p.session_id);
        const at = p.tracks?.audio?.persistentTrack;
        if (!at || p.tracks.audio.state !== "playable") return;
        let el = existing[p.session_id];
        if (!el) {
          el = document.createElement("audio");
          el.autoplay = true;
          el.dataset.session = p.session_id;
          container.appendChild(el);
        }
        if (!el.srcObject || !el.srcObject.getAudioTracks().includes(at)) {
          el.srcObject = new MediaStream([at]);
        }
      });
      // Remove audio elements for participants who left
      Object.entries(existing).forEach(([sid, el]) => {
        if (!seen.has(sid)) el.remove();
      });
    }

    // ── Mic / cam controls ───────────────────────────────────────────────────
    function updateCtrlBtns() {
      const micBtn = document.getElementById("btn-mic");
      const camBtn = document.getElementById("btn-cam");
      if (micBtn) {
        micBtn.classList.toggle("muted", !_micOn);
        micBtn.querySelector("svg + span, svg")?.nextSibling;
        micBtn.childNodes.forEach(n => { if (n.nodeType === 3) n.remove(); });
        micBtn.appendChild(document.createTextNode(_micOn ? " Mic" : " Muted"));
      }
      if (camBtn) {
        camBtn.classList.toggle("muted", !_camOn);
      }
    }

    async function toggleMic() {
      if (!callObject) return;
      _micOn = !_micOn;
      await callObject.setLocalAudio(_micOn);
      // Update button text
      const btn = document.getElementById("btn-mic");
      if (btn) {
        btn.classList.toggle("muted", !_micOn);
        // Rebuild text node
        const svg = btn.querySelector("svg");
        btn.innerHTML = "";
        if (svg) btn.appendChild(svg);
        btn.appendChild(document.createTextNode(_micOn ? " Mic" : " Muted"));
      }
    }

    async function toggleCam() {
      if (!callObject) return;
      _camOn = !_camOn;
      await callObject.setLocalVideo(_camOn);
      document.getElementById("btn-cam")?.classList.toggle("muted", !_camOn);
    }

    function confirmLeave() {
      if (!confirm("Leave the " + (document.getElementById("header-badge")?.textContent === "Live" ? "stream" : "backstage") + "?")) return;
      if (callObject) {
        // Keep callObject set so left-meeting knows it was a user-initiated leave
        // (the handler will null it and show the "you left" message as expected)
        callObject.leave().catch(() => {});
      }
    }

    // ── Sidebar: tab switching ────────────────────────────────────────────────
    function showGuestTab(tab, btn) {
      document.querySelectorAll(".guest-sid-tab").forEach(t => t.classList.remove("active"));
      if (btn) btn.classList.add("active");
      document.getElementById("guest-panel-chat").classList.toggle("active", tab === "chat");
      document.getElementById("guest-panel-qa").classList.toggle("active",   tab === "qa");
      if (tab === "chat") {
        const badge = document.getElementById("guest-chat-badge");
        if (badge) { badge.textContent = ""; badge.classList.remove("visible"); }
        const msgs = document.getElementById("guest-chat-messages");
        if (msgs) msgs.scrollTop = msgs.scrollHeight;
      }
      if (tab === "qa") {
        const badge = document.getElementById("guest-qa-badge");
        if (badge) { badge.textContent = ""; badge.classList.remove("visible"); }
      }
    }

    // ── Sidebar: DB subscriptions (set up after joining) ──────────────────────
    let _chatCh   = null;
    let _qaCh     = null;
    let _typingCh = null;
    // Typing state
    let _gTypingActive   = false; let _gTypingLastSent = 0; let _gTypingTimeout = null;
    let _gTypingUsers = {}; let _gTypingClearTimers = {};
    let _gQATypingActive   = false; let _gQATypingLastSent = 0; let _gQATypingTimeout = null;
    let _gQATypingUsers = {}; let _gQATypingClearTimers = {};

    function _initGuestSidebar(evId) {
      // ── Chat ──────────────────────────────────────────────────────────────
      if (_chatCh) { db.removeChannel(_chatCh); _chatCh = null; }
      document.getElementById("guest-chat-messages").innerHTML = "";

      db.from("event_chat").select("*").eq("event_id", evId).order("created_at")
        .then(({ data }) => { if (data) data.forEach(m => _appendGuestChat(m, true)); });

      _chatCh = db.channel(`guest-chat-${evId}`)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_chat",
            filter: `event_id=eq.${evId}` }, p => _appendGuestChat(p.new))
        .subscribe(async status => {
          if (status !== "SUBSCRIBED") return;
          const { data } = await db.from("event_chat").select("*").eq("event_id", evId).order("created_at");
          if (data) data.forEach(m => _appendGuestChat(m, true));
        });

      // ── Q&A ───────────────────────────────────────────────────────────────
      if (_qaCh) { db.removeChannel(_qaCh); _qaCh = null; }
      document.getElementById("guest-qa-list").innerHTML = "";

      db.from("event_qa").select("*").eq("event_id", evId).order("created_at")
        .then(({ data }) => {
          if (data) {
            data.forEach(q => _appendGuestQA(q, true));
            _updateGuestFeaturedBar(data.find(q => q.is_featured) || null);
          }
        });

      _qaCh = db.channel(`guest-qa-${evId}`)
        .on("postgres_changes", { event: "INSERT", schema: "public", table: "event_qa",
            filter: `event_id=eq.${evId}` }, p => _appendGuestQA(p.new))
        .on("postgres_changes", { event: "UPDATE", schema: "public", table: "event_qa",
            filter: `event_id=eq.${evId}` }, p => _handleGuestQAUpdate(p.new))
        .subscribe(async status => {
          if (status !== "SUBSCRIBED") return;
          const { data } = await db.from("event_qa").select("*").eq("event_id", evId).order("created_at");
          if (data) {
            data.forEach(q => _appendGuestQA(q, true));
            _updateGuestFeaturedBar(data.find(q => q.is_featured) || null);
          }
        });

      // ── Typing channel (shared with events.html so indicators cross both) ─
      if (_typingCh) { db.removeChannel(_typingCh); _typingCh = null; }
      _typingCh = db.channel(`event-typing-${evId}`, { config: { broadcast: { self: false } } })
        .on("broadcast", { event: "typing" }, ({ payload }) => {
          if (!payload?.name) return;
          if (payload.typing) {
            _gTypingUsers[payload.name] = payload.name;
            clearTimeout(_gTypingClearTimers[payload.name]);
            _gTypingClearTimers[payload.name] = setTimeout(() => {
              delete _gTypingUsers[payload.name];
              _updateGuestTyping();
            }, 4000);
          } else {
            clearTimeout(_gTypingClearTimers[payload.name]);
            delete _gTypingUsers[payload.name];
          }
          _updateGuestTyping();
        })
        .on("broadcast", { event: "qa-typing" }, ({ payload }) => {
          if (!payload?.name) return;
          if (payload.typing) {
            _gQATypingUsers[payload.name] = payload.name;
            clearTimeout(_gQATypingClearTimers[payload.name]);
            _gQATypingClearTimers[payload.name] = setTimeout(() => {
              delete _gQATypingUsers[payload.name];
              _updateGuestQATyping();
            }, 4000);
          } else {
            clearTimeout(_gQATypingClearTimers[payload.name]);
            delete _gQATypingUsers[payload.name];
          }
          _updateGuestQATyping();
        })
        .subscribe();
    }

    function _updateGuestTyping() {
      const el = document.getElementById("guest-chat-typing");
      if (!el) return;
      const names = Object.keys(_gTypingUsers).map(n => n.split(" ")[0]).slice(0, 2);
      el.textContent = names.length === 0 ? ""
        : names.length === 1 ? `${names[0]} is typing…`
        : `${names.join(" & ")} are typing…`;
    }
    function _updateGuestQATyping() {
      const el = document.getElementById("guest-qa-typing");
      if (!el) return;
      const names = Object.keys(_gQATypingUsers).map(n => n.split(" ")[0]).slice(0, 2);
      el.textContent = names.length === 0 ? ""
        : names.length === 1 ? `${names[0]} is typing…`
        : `${names.join(" & ")} are typing…`;
    }

    function _appendGuestChat(msg, skipBadge = false) {
      const el = document.getElementById("guest-chat-messages");
      if (!el || el.querySelector(`[data-id="${msg.id}"]`)) return;
      const mine = msg.name === guestName;
      const initials = (msg.name || "?").split(" ").map(w => w[0]).join("").slice(0,2).toUpperCase();
      const div = document.createElement("div");
      div.className = "guest-chat-msg" + (mine ? " mine" : "");
      div.dataset.id = msg.id;
      div.innerHTML = `
        <span class="guest-chat-av">
          <span style="width:26px;height:26px;border-radius:50%;background:var(--border);
            display:inline-flex;align-items:center;justify-content:center;
            font-size:.65rem;font-weight:700;color:var(--text-muted);">${initials}</span>
        </span>
        <div class="guest-chat-body">
          <div class="guest-chat-author">${_gEsc(msg.name || "?")}</div>
          <div class="guest-chat-text">${_gEsc(msg.message)}</div>
        </div>`;
      el.appendChild(div);
      el.scrollTop = el.scrollHeight;
      if (!skipBadge) {
        const isActive = document.getElementById("guest-panel-chat")?.classList.contains("active");
        if (!isActive) {
          const badge = document.getElementById("guest-chat-badge");
          if (badge) { badge.textContent = "+"; badge.classList.add("visible"); }
        }
      }
    }

    function _appendGuestQA(q, skipBadge = false) {
      const el = document.getElementById("guest-qa-list");
      if (!el) return;
      const existing = el.querySelector(`[data-id="${q.id}"]`);
      const item = _buildGuestQAEl(q);
      if (existing) { existing.replaceWith(item); return; }
      el.appendChild(item);
      el.scrollTop = el.scrollHeight;
      if (!skipBadge) {
        const isActive = document.getElementById("guest-panel-qa")?.classList.contains("active");
        if (!isActive) {
          const badge = document.getElementById("guest-qa-badge");
          if (badge) { badge.textContent = "+"; badge.classList.add("visible"); }
        }
      }
    }

    function _handleGuestQAUpdate(partial) {
      // Fetch full row then update the item and featured bar
      db.from("event_qa").select("*").eq("id", partial.id).single().then(({ data: q }) => {
        if (!q) return;
        _appendGuestQA(q, true); // replaces existing item
        // Refresh featured bar — re-query all to get current state
        db.from("event_qa").select("*").eq("event_id", q.event_id).order("created_at")
          .then(({ data }) => {
            if (data) _updateGuestFeaturedBar(data.find(x => x.is_featured) || null);
          });
      });
    }

    function _buildGuestQAEl(q) {
      const div = document.createElement("div");
      div.className = "guest-qa-item" + (q.is_featured ? " featured" : "");
      div.dataset.id = q.id;
      div.innerHTML = `
        <div class="guest-qa-asker">${_gEsc(q.name || "Anonymous")}</div>
        <div class="guest-qa-text">${_gEsc(q.question)}</div>
        ${q.is_featured ? `<div style="font-size:.7rem;color:var(--accent);margin-top:4px;">★ Featured on stream</div>` : ""}
        ${q.answered   ? `<div style="font-size:.7rem;color:#22c55e;margin-top:4px;">✓ Answered</div>` : ""}`;
      return div;
    }

    function _updateGuestFeaturedBar(q) {
      const bar   = document.getElementById("guest-featured-bar");
      const text  = document.getElementById("guest-featured-text");
      const asker = document.getElementById("guest-featured-asker");
      if (!bar) return;
      if (q) {
        bar.classList.add("visible");
        if (text)  text.textContent  = q.question;
        if (asker) asker.textContent = "— " + (q.name || "Anonymous");
      } else {
        bar.classList.remove("visible");
      }
    }

    function _gEsc(s) {
      return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
                      .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    // ── Send / submit ─────────────────────────────────────────────────────────
    async function sendGuestChat() {
      const input = document.getElementById("guest-chat-input");
      if (!input) return;
      const text = input.value.trim();
      if (!text || !eventId) return;
      input.value = "";
      // Stop typing broadcast
      clearTimeout(_gTypingTimeout);
      if (_gTypingActive && _typingCh) {
        _gTypingActive = false;
        _typingCh.send({ type: "broadcast", event: "typing", payload: { name: guestName, typing: false } });
      }
      await db.from("event_chat").insert({ event_id: eventId, email: "", name: guestName, message: text });
    }

    async function submitGuestQA() {
      const input = document.getElementById("guest-qa-input");
      if (!input) return;
      const question = input.value.trim();
      if (!question || !eventId) return;
      input.value = "";
      clearTimeout(_gQATypingTimeout);
      if (_gQATypingActive && _typingCh) {
        _gQATypingActive = false;
        _typingCh.send({ type: "broadcast", event: "qa-typing", payload: { name: guestName, typing: false } });
      }
      await db.from("event_qa").insert({ event_id: eventId, email: "", name: guestName, question });
    }

    function onGuestChatTyping() {
      if (!_typingCh) return;
      const now = Date.now();
      if (now - _gTypingLastSent > 2000) {
        _gTypingLastSent = now; _gTypingActive = true;
        _typingCh.send({ type: "broadcast", event: "typing", payload: { name: guestName, typing: true } });
      }
      clearTimeout(_gTypingTimeout);
      _gTypingTimeout = setTimeout(() => {
        if (_gTypingActive && _typingCh) {
          _gTypingActive = false;
          _typingCh.send({ type: "broadcast", event: "typing", payload: { name: guestName, typing: false } });
        }
      }, 3000);
    }

    function onGuestQATyping() {
      if (!_typingCh) return;
      const now = Date.now();
      if (now - _gQATypingLastSent > 2000) {
        _gQATypingLastSent = now; _gQATypingActive = true;
        _typingCh.send({ type: "broadcast", event: "qa-typing", payload: { name: guestName, typing: true } });
      }
      clearTimeout(_gQATypingTimeout);
      _gQATypingTimeout = setTimeout(() => {
        if (_gQATypingActive && _typingCh) {
          _gQATypingActive = false;
          _typingCh.send({ type: "broadcast", event: "qa-typing", payload: { name: guestName, typing: false } });
        }
      }, 3000);
    }

    // ── Init ─────────────────────────────────────────────────────────────────
    async function init() {
      if (!inviteToken || !eventId) {
        showError("Invalid link", "This invite link is missing required parameters.");
        return;
      }
      db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
      await requestAccess();
    }

    init();
  </script>
</body>
</html>
