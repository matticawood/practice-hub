<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-label="Interval quality ladder">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#bfb2a2"/>
    </marker>
  </defs>
  <style>
    .bx   { fill:#ffffff; stroke:#d8cdbf; stroke-width:1.5; }
    .bxk  { fill:#fdf3d8; stroke:#e2c766; stroke-width:1.5; }
    .band { fill:#fdfaf1; stroke:#e8dcc0; stroke-width:1.5; }
    .ln   { stroke:#bfb2a2; stroke-width:2; stroke-linecap:round; fill:none; }
    .t    { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .name { font-size:19px; font-weight:800; fill:#1a1410; }
    .namek{ font-size:19px; font-weight:800; fill:#2a1c02; }
    .nums { font-size:13.5px; font-weight:600; fill:#7a5300; }
    .step { font-size:12px; font-weight:500; fill:#8a7868; }
    .grp  { font-size:11px; font-weight:700; fill:#b07c08; letter-spacing:.07em; }
  </style>

  <!-- Augmented (top), reached by going a semitone up from either family -->
  <rect class="bx" x="265" y="22" width="170" height="44" rx="10"/>
  <text class="t name" x="350" y="51" text-anchor="middle">Augmented</text>
  <line class="ln" x1="350" y1="110" x2="350" y2="72" marker-end="url(#ar)"/>
  <text class="t step" x="362" y="97">one semitone higher</text>

  <!-- fork joins the major-scale row to that upward step -->
  <line class="ln" x1="350" y1="110" x2="210" y2="196"/>
  <line class="ln" x1="350" y1="110" x2="505" y2="196"/>

  <!-- the major-scale row, grouped -->
  <rect class="band" x="58" y="196" width="584" height="104" rx="16"/>
  <text class="t grp" x="350" y="217" text-anchor="middle">THE INTERVALS IN A MAJOR SCALE</text>

  <rect class="bxk" x="95" y="228" width="230" height="64" rx="12"/>
  <text class="t namek" x="210" y="255" text-anchor="middle">Major</text>
  <text class="t nums" x="210" y="278" text-anchor="middle">2nd &#183; 3rd &#183; 6th &#183; 7th</text>

  <rect class="bxk" x="390" y="228" width="230" height="64" rx="12"/>
  <text class="t namek" x="505" y="255" text-anchor="middle">Perfect</text>
  <text class="t nums" x="505" y="278" text-anchor="middle">unison &#183; 4th &#183; 5th &#183; octave</text>

  <!-- major -> minor -> diminished -->
  <line class="ln" x1="210" y1="300" x2="210" y2="344" marker-end="url(#ar)"/>
  <text class="t step" x="222" y="326">one semitone lower</text>
  <rect class="bx" x="130" y="344" width="160" height="44" rx="10"/>
  <text class="t name" x="210" y="373" text-anchor="middle">Minor</text>

  <line class="ln" x1="210" y1="388" x2="210" y2="432" marker-end="url(#ar)"/>
  <text class="t step" x="222" y="414">one semitone lower again</text>
  <rect class="bx" x="110" y="432" width="200" height="44" rx="10"/>
  <text class="t name" x="210" y="461" text-anchor="middle">Diminished</text>

  <!-- perfect -> diminished -->
  <line class="ln" x1="505" y1="300" x2="505" y2="344" marker-end="url(#ar)"/>
  <text class="t step" x="517" y="326">one semitone lower</text>
  <rect class="bx" x="405" y="344" width="200" height="44" rx="10"/>
  <text class="t name" x="505" y="373" text-anchor="middle">Diminished</text>
</svg>
