<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" role="img" aria-label="Interval quality ladder">
  <style>
    .bx   { fill:#ffffff; stroke:#d8cdbf; stroke-width:1.5; }
    .bxk  { fill:#fdf3d8; stroke:#e2c766; stroke-width:1.5; }
    .ln   { stroke:#c9bdae; stroke-width:2; stroke-linecap:round; }
    .t    { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
    .name { font-size:19px; font-weight:800; fill:#1a1410; }
    .namek{ font-size:19px; font-weight:800; fill:#2a1c02; }
    .nums { font-size:13.5px; font-weight:600; fill:#7a5300; }
    .step { font-size:12px; font-weight:500; fill:#8a7868; }
    .grp  { font-size:11px; font-weight:700; fill:#b07c08; letter-spacing:.07em; }
  </style>

  <!-- Augmented (top) -->
  <rect class="bx" x="270" y="18" width="160" height="44" rx="10"/>
  <text class="t name" x="350" y="47" text-anchor="middle">Augmented</text>

  <!-- stub + fork down to the two families -->
  <line class="ln" x1="350" y1="62" x2="350" y2="98"/>
  <text class="t step" x="362" y="90">one semitone higher</text>
  <line class="ln" x1="350" y1="98" x2="210" y2="190"/>
  <line class="ln" x1="350" y1="98" x2="505" y2="190"/>

  <!-- the major-scale row -->
  <text class="t grp" x="350" y="176" text-anchor="middle">THE INTERVALS IN A MAJOR SCALE</text>

  <rect class="bxk" x="90" y="190" width="240" height="64" rx="12"/>
  <text class="t namek" x="210" y="217" text-anchor="middle">Major</text>
  <text class="t nums" x="210" y="240" text-anchor="middle">2nd &#183; 3rd &#183; 6th &#183; 7th</text>

  <rect class="bxk" x="385" y="190" width="240" height="64" rx="12"/>
  <text class="t namek" x="505" y="217" text-anchor="middle">Perfect</text>
  <text class="t nums" x="505" y="240" text-anchor="middle">unison &#183; 4th &#183; 5th &#183; octave</text>

  <!-- major -> minor -> diminished -->
  <line class="ln" x1="210" y1="254" x2="210" y2="300"/>
  <text class="t step" x="222" y="282">one semitone lower</text>
  <rect class="bx" x="130" y="300" width="160" height="44" rx="10"/>
  <text class="t name" x="210" y="329" text-anchor="middle">Minor</text>

  <line class="ln" x1="210" y1="344" x2="210" y2="390"/>
  <text class="t step" x="222" y="372">one semitone lower again</text>
  <rect class="bx" x="110" y="390" width="200" height="44" rx="10"/>
  <text class="t name" x="210" y="419" text-anchor="middle">Diminished</text>

  <!-- perfect -> diminished -->
  <line class="ln" x1="505" y1="254" x2="505" y2="300"/>
  <text class="t step" x="517" y="282">one semitone lower</text>
  <rect class="bx" x="405" y="300" width="200" height="44" rx="10"/>
  <text class="t name" x="505" y="329" text-anchor="middle">Diminished</text>
</svg>
