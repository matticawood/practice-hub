<!DOCTYPE html>

  <script>
    (function() {
      function hasSession() {
        try { const s = JSON.parse(localStorage.getItem('practiceRoom_session')); if (s && s.email) return true; }
        catch(e) {}
        // fallback: a Supabase auth token means we're logged in even if the
        // custom session key is momentarily missing (multi-tab / token refresh).
        try {
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k && k.indexOf('-auth-token') !== -1 && localStorage.getItem(k)) return true;
          }
        } catch(e) {}
        return false;
      }
      if (hasSession()) return;
      // The session can momentarily read as missing while the app rewrites it
      // (token refresh, multi-tab). Retry briefly before redirecting, so a logged-in
      // user is never bounced to the dashboard by that race.
      var tries = 0;
      var iv = setInterval(function() {
        tries++;
        if (hasSession()) { clearInterval(iv); return; }
        if (tries >= 25) { clearInterval(iv); window.location.replace('/'); } // ~2.5s grace
      }, 100);
    })();
  </script>

  <style>
    /* ============================================================
       NEW paginated article reader (new-schema content)
       ============================================================ */
    .ar-mode{
      --bg:#faf7f3; --surface:#ffffff; --surface-2:#f1f1f4; --border:#e3e1e6;
      --text:#1a1410; --text-muted:#6b5f54; --soft:#8a7868; --accent:#f5c518; --cc:#5a86b4;
      background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      -webkit-font-smoothing:antialiased; min-height:100vh;
    }
    .ar-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:11px 16px;background:rgba(250,247,243,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
    .ar-back{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:8px 14px 8px 11px;font-size:.86rem;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;text-decoration:none;transition:border-color .15s,box-shadow .15s}
    .ar-back:hover{border-color:rgba(245,197,24,.55);box-shadow:0 4px 14px rgba(60,40,20,.09)}
    .ar-back svg{width:14px;height:14px;transition:transform .15s}
    .ar-back:hover svg{transform:translateX(-2px)}
    .ar-spacer{flex:1}
    .ar-act{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:8px 12px;font-size:.82rem;font-weight:600;color:var(--text-muted);cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
    .ar-act:hover:not(:disabled){border-color:#d6c5a8;color:var(--text)}
    .ar-act:disabled{opacity:.55;cursor:default}
    .ar-act svg{width:15px;height:15px;flex-shrink:0}
    .ar-act.saved{border-color:var(--accent);color:#6b5400;background:rgba(245,197,24,.12)}
    .ar-act.read{border-color:#a8cca8;color:#3a6e3a;background:#eef6ee}

    .ar-wrap{max-width:680px;margin:0 auto;padding:30px 22px 44px}
    .ar-eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#b8920a;display:flex;align-items:center;gap:8px}
    .ar-eyebrow::after{content:"";flex:1;height:1px;background:var(--border)}
    .ar-title{font-size:2.05rem;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin:12px 0 0}
    .ar-meta{display:flex;align-items:center;gap:14px;margin-top:13px;font-size:.82rem;color:var(--soft);font-weight:600;flex-wrap:wrap}
    .ar-meta .dot{width:9px;height:9px;border-radius:50%;background:var(--cc)}
    .ar-meta-item{display:inline-flex;align-items:center;gap:5px}
    .ar-meta-item svg{width:14px;height:14px}

    .ar-overview{margin:22px 0 4px;font-size:1.17rem;line-height:1.62;color:#3a2e24;font-weight:450;border-left:3px solid var(--cc);padding-left:18px}

    .ar-page{animation:arIn .26s ease}
    /* Monday Music Tips arrive as a body of HTML rather than the sections the
       Piano Practice Daily schema builds, so the prose is styled directly. */
    .ar-html{font-size:1.04rem;line-height:1.75;color:#3a2e24}
    .ar-html > *:first-child{margin-top:0}
    .ar-html p{margin:0 0 1.15em}
    .ar-html h2{font-size:1.35rem;font-weight:750;line-height:1.25;color:var(--text);margin:2em 0 .6em;letter-spacing:-.01em}
    .ar-html h3{font-size:1.1rem;font-weight:750;color:var(--text);margin:1.7em 0 .5em}
    .ar-html ul,.ar-html ol{margin:0 0 1.15em;padding-left:1.3em}
    .ar-html li{margin-bottom:.5em}
    .ar-html a{color:#8a5a00;text-decoration:underline;text-underline-offset:2px}
    .ar-html strong{font-weight:700;color:var(--text)}
    .ar-html img,.ar-html iframe{max-width:100%;border-radius:12px;display:block;margin:1.4em 0}
    .ar-html iframe{aspect-ratio:16/9;height:auto;width:100%;border:0}
    .ar-html blockquote{margin:1.4em 0;padding:2px 0 2px 18px;border-left:3px solid var(--cc,#b45309);color:#5a4838}
    .ar-html hr{border:0;border-top:1px solid var(--border);margin:2em 0}
    @keyframes arIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .ar-section{margin-top:30px}
    .ar-section:first-child{margin-top:26px}
    .ar-h2{font-size:1.32rem;font-weight:750;letter-spacing:-.01em;line-height:1.25;margin:0 0 12px;display:flex;align-items:center;gap:11px}
    .ar-h2::before{content:"";width:5px;height:1.05em;border-radius:3px;background:var(--cc);flex-shrink:0}
    .ar-p{font-size:1.06rem;line-height:1.74;color:#2b2118;margin:0 0 15px}
    .ar-p:last-child{margin-bottom:0}
    .ar-ul{margin:0 0 16px;padding:0;list-style:none}
    .ar-ul li{position:relative;font-size:1.04rem;line-height:1.62;color:#2b2118;padding:0 0 9px 26px}
    .ar-ul li::before{content:"";position:absolute;left:6px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--cc);transform:rotate(45deg)}
    .ar-ul li:last-child{padding-bottom:0}
    .ar-ul li b,.ar-p b{color:var(--text);font-weight:700}

    .ar-takeaways{margin-top:34px;background:linear-gradient(180deg,#fffdf7,#fdf6e6);border:1px solid #ecdcae;border-radius:16px;padding:22px 24px;box-shadow:0 1px 3px rgba(120,90,40,.06)}
    .ar-take-hd{display:flex;align-items:center;gap:10px;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#9a7400;margin-bottom:14px}
    .ar-take-hd svg{width:18px;height:18px}
    .ar-take-list{margin:0;padding:0;list-style:none}
    .ar-take-list li{position:relative;font-size:1.03rem;line-height:1.55;color:#2b2118;padding:0 0 12px 32px}
    .ar-take-list li:last-child{padding-bottom:0}
    .ar-take-list li svg{position:absolute;left:0;top:1px;width:20px;height:20px;color:#5a8a6a}

    /* glossary */
    .ar-glossary{margin-top:30px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px 23px}
    .ar-gloss-hd{display:flex;align-items:center;gap:9px;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);margin-bottom:15px}
    .ar-gloss-hd svg{width:17px;height:17px}
    .ar-gloss-list{display:flex;flex-direction:column;gap:12px}
    .ar-gloss-item{display:flex;flex-direction:column;gap:2px}
    .ar-gloss-term{font-weight:750;color:var(--text);font-size:1rem}
    .ar-gloss-def{color:#4a3e34;font-size:.98rem;line-height:1.5}

    .ar-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:38px;padding-top:20px;border-top:1px solid var(--border)}
    .ar-pg-btn{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--border);border-radius:11px;padding:11px 16px;font-size:.9rem;font-weight:700;color:var(--text);cursor:pointer;font-family:inherit;transition:all .15s}
    .ar-pg-btn:hover:not(:disabled){border-color:rgba(245,197,24,.6);box-shadow:0 5px 14px -6px rgba(60,40,20,.2)}
    .ar-pg-btn:disabled{opacity:.35;cursor:default}
    .ar-pg-btn.next{background:linear-gradient(180deg,#f7d24a,#f5c518);border:none;color:#3a2c00;box-shadow:0 7px 16px -7px rgba(245,197,24,.7)}
    .ar-pg-btn.finish{background:linear-gradient(180deg,#6fbf73,#4e9a5c);border:none;color:#fff;box-shadow:0 7px 16px -7px rgba(78,154,92,.7)}
    .ar-pg-btn svg{width:16px;height:16px}
    .ar-dots{display:flex;align-items:center;gap:8px}
    .ar-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
    .ar-dot.on{background:var(--accent);width:22px;border-radius:99px}
    .ar-pg-label{font-size:.8rem;color:var(--soft);font-weight:600;white-space:nowrap}

    @media (max-width:620px){
      .ar-act .lbl{display:none}
      .ar-act{padding:8px 10px}
    }
    @media (max-width:560px){
      .ar-wrap{padding:22px 16px 38px}
      .ar-title{font-size:1.7rem}
      .ar-overview{font-size:1.08rem;padding-left:14px}
      .ar-pg-btn{padding:11px 14px}
      .ar-pg-label{display:none}
    }

    /* ============================================================
       A4 handout (off-screen export source: PDF + PNG)
       ============================================================ */
    #export-root{position:fixed;left:-99999px;top:0;pointer-events:none}
    .ho-page{
      --cc:#b0529a; --cc2:#8e3f7e;
      width:820px; height:1160px; /* A4 portrait ratio 210:297 */
      background:#fffdf9; color:#1a1410; overflow:hidden;
      position:relative; display:flex; flex-direction:column;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      /* lock font size so iOS Safari doesn't inflate text and break pagination */
      -webkit-text-size-adjust:100%; text-size-adjust:100%;
    }
    .ho-head{position:relative;flex-shrink:0;overflow:hidden;background:linear-gradient(135deg,var(--cc),var(--cc2));color:#fff;padding:34px 46px 30px}
    .ho-head.slim{padding:22px 46px}
    .ho-mono{position:absolute;right:24px;bottom:-44px;font-family:Georgia,'Times New Roman',serif;font-weight:800;font-size:240px;line-height:1;color:rgba(255,255,255,.12);pointer-events:none}
    .ho-eyebrow{position:relative;z-index:1;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.85)}
    .ho-title{position:relative;z-index:1;font-size:33px;font-weight:800;letter-spacing:-.02em;line-height:1.12;margin-top:11px}
    .ho-head-meta{position:relative;z-index:1;display:flex;gap:16px;margin-top:14px;font-size:13.5px;font-weight:600;color:rgba(255,255,255,.9)}
    .ho-head-meta .pipe{opacity:.5}
    .ho-slim-row{position:relative;z-index:1;display:flex;align-items:baseline;justify-content:space-between;gap:16px}
    .ho-slim-brand{font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.85)}
    .ho-slim-title{font-size:18px;font-weight:700;color:#fff;margin-top:5px}
    .ho-slim-pg{font-size:14px;font-weight:700;color:rgba(255,255,255,.85);white-space:nowrap}
    .ho-body{padding:36px 46px 26px;flex:1;min-height:0;overflow:hidden}
    .ho-overview{font-size:16.5px;line-height:1.6;color:#2b2118;border-left:4px solid var(--cc);padding-left:18px;margin-bottom:4px}
    .ho-section{margin-top:24px}
    .ho-cont{margin-top:0}
    .ho-body > .ho-overview:first-child, .ho-body > .ho-section:first-child, .ho-body > .ho-cont:first-child, .ho-body > .ho-gloss:first-child, .ho-body > .ho-take:first-child{margin-top:0}
    .ho-h2{font-size:18px;font-weight:750;letter-spacing:-.01em;line-height:1.25;margin-bottom:11px;display:flex;align-items:center;gap:10px}
    .ho-h2::before{content:"";width:5px;height:1.05em;border-radius:3px;background:var(--cc)}
    .ho-p{font-size:14.5px;line-height:1.68;color:#2b2118;margin-bottom:12px}
    .ho-p:last-child{margin-bottom:0}
    .ho-ul{list-style:none;margin-bottom:14px;padding:0}
    .ho-ul li{position:relative;font-size:14.5px;line-height:1.55;color:#2b2118;padding:0 0 9px 26px}
    .ho-ul li::before{content:"";position:absolute;left:6px;top:.62em;width:7px;height:7px;border-radius:2px;background:var(--cc);transform:rotate(45deg)}
    .ho-p b,.ho-ul li b{font-weight:750;color:#1a1410}
    .ho-take{margin-top:26px;background:linear-gradient(180deg,#fffdf6,#fdf4e2);border:1px solid #ecdcae;border-radius:12px;padding:20px 24px}
    .ho-take-hd{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9a7400;margin-bottom:13px}
    .ho-take-hd svg{width:19px;height:19px}
    .ho-take ul{list-style:none;padding:0;margin:0}
    .ho-take li{position:relative;font-size:14.5px;line-height:1.5;color:#2b2118;padding:0 0 11px 30px}
    .ho-take li:last-child{padding-bottom:0}
    .ho-take li svg{position:absolute;left:0;top:1px;width:19px;height:19px;color:#5a8a6a}
    .ho-foot{display:flex;flex-shrink:0;align-items:center;justify-content:space-between;background:#1a1410;color:#cbbfa9;padding:13px 46px;font-size:12px;font-weight:600;letter-spacing:.02em}
    .ho-foot b{color:#f5c518}
    .ho-gloss-item{font-size:14.5px;line-height:1.55;color:#2b2118;margin-bottom:9px}
    .ho-gloss-term{font-weight:750;color:#1a1410}
    .ho-gloss-def{color:#2b2118}

    /* ============================================================
       Shared notes card (both modes)
       ============================================================ */
    .notes-card { width: 210mm; background: #f0ebe0; box-shadow: 0 3px 16px rgba(0,0,0,0.35); padding: 6mm 14mm 8mm; flex-shrink: 0; }
    .notes-header { display: flex; align-items: center; gap: 7px; border-bottom: 1px solid #c8c2b8; padding-bottom: 3mm; margin-bottom: 4mm; }
    .notes-label { font-family: Georgia, serif; font-size: 8pt; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #999; }
    .notes-status { margin-left: auto; font-family: Georgia, serif; font-size: 8pt; font-style: italic; color: #bbb; }
    .notes-textarea {
      width: 100%; border: none; background: transparent;
      background-image: repeating-linear-gradient(transparent, transparent 31px, #d5cfc3 31px, #d5cfc3 32px);
      background-attachment: local; font-family: 'Caveat', cursive; font-size: 15pt; color: #1a3a5c;
      line-height: 32px; resize: none; outline: none; min-height: 96px; box-sizing: border-box; padding: 2px 0 0; overflow: hidden;
    }
    .notes-textarea::placeholder { color: #c8c2b8; }
    /* new reader: clean light notes card */
    .ar-mode .notes-card { width:100%; max-width:680px; margin:4px auto 44px; background:var(--surface); border:1px solid var(--border); border-radius:16px; box-shadow:0 2px 16px rgba(60,40,20,.07); padding:20px 24px 22px; }
    .ar-mode .notes-header { border-bottom:1px solid var(--border); padding-bottom:11px; margin-bottom:13px; gap:8px; }
    .ar-mode .notes-label { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:.7rem; font-weight:800; letter-spacing:.12em; color:var(--soft); }
    .ar-mode .notes-status { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-style:normal; font-size:.74rem; color:var(--soft); }
    .ar-mode .notes-textarea { background-image:none; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:1.02rem; line-height:1.7; color:var(--text); }
    .ar-mode .notes-textarea::placeholder { color:var(--soft); opacity:.75; }
    .ar-mode .notes-fab { background:var(--surface); border:1.5px solid var(--border); color:var(--text); }
    #status-btn { transition: background 0.15s, color 0.15s; }
    #status-btn.status-none    { background: #f0ebe0; color: #111; border-color: #f0ebe0; }
    #status-btn.status-reading { background: #e8f2e8; color: #3a6e3a; border-color: #a8cca8; }
    #status-btn.status-read    { background: rgba(240,235,224,0.25); color: #f0ebe0; border-color: rgba(240,235,224,0.45); font-weight: normal; }
    @media print { .notes-card { display: none; } }
    .notes-fab { position: fixed; bottom: 28px; right: 28px; width: 48px; height: 48px; border-radius: 50%; background: #f0ebe0; border: 1.5px solid #c8c2b8; box-shadow: 0 3px 12px rgba(0,0,0,0.25); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.15s, box-shadow 0.15s; z-index: 50; }
    .notes-fab:hover { transform: scale(1.08); box-shadow: 0 5px 18px rgba(0,0,0,0.3); }
    @media screen and (max-width: 650px) { .notes-fab { display: none; } }
    @media screen and (max-width: 650px) { .notes-card { width: 100%; box-shadow: none; padding: 5mm 5mm 6mm; } }
    /* On a phone the notes panel is the full width of the screen, so it stops
       pretending to be a card: no side or bottom edges, square corners, and it
       runs to the physical bottom of the page rather than floating 44px above
       it. The safe-area inset keeps the last line clear of the home indicator. */
    @media screen and (max-width: 650px) {
      .ar-mode .notes-card {
        max-width:none; width:auto; margin:4px 0 0;
        border-radius:0; border-left:0; border-right:0; border-bottom:0;
        box-shadow:none;
        padding:18px 16px calc(22px + env(safe-area-inset-bottom)); }
      /* and the page stops holding it 20px off the bottom */
      body.ar-mode { padding-bottom:0; }
    }

    /* export progress overlay */
    .ho-overlay{position:fixed;inset:0;background:rgba(26,20,16,.72);z-index:9999;display:flex;align-items:center;justify-content:center;color:#f0ebe0;font-family:-apple-system,sans-serif;font-size:1rem;letter-spacing:.03em;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

    /* initial loading screen (matches the reader theme) */
    #ar-loader{position:fixed;inset:0;z-index:9500;background:#faf7f3;display:flex;align-items:center;justify-content:center;transition:opacity .35s ease}
    #ar-loader.hide{opacity:0;pointer-events:none}
    .arl-inner{display:flex;flex-direction:column;align-items:center;gap:20px}
    .arl-brand{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:.72rem;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:#b8920a;animation:arlPulse 1.5s ease-in-out infinite}
    .arl-spinner{width:30px;height:30px;border:3px solid #e8e2d8;border-top-color:#f5c518;border-radius:50%;animation:arlSpin .8s linear infinite}
    @keyframes arlSpin{to{transform:rotate(360deg)}}
    @keyframes arlPulse{0%,100%{opacity:.45}50%{opacity:1}}
  </style>

<!-- ========== NEW paginated reader (new schema) ========== -->
<div id="ar-root" style="display:none">
  <div class="ar-top">

<script>
  const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const OWNER = 'matthew@matthewcawood.com';
  let currentContent = null;
  let currentSlug = '';
  let currentSheetId = null;
  let isNew = false;
  let isOwner = false;
  let userEmail = '';
  try {
    const s = JSON.parse(localStorage.getItem('practiceRoom_session'));
    isOwner = s?.email?.toLowerCase() === OWNER;
    userEmail = s?.email || '';
  } catch(e) {}

  function esc(str) {
    return String(str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // Allow a safe subset of inline markup (<b>, <i>, <em>, <strong>) authored by the generator,
  // but escape everything else so stray angle brackets never break layout.
  function rich(str){
    let s = esc(str);
    s = s.replace(/&lt;(\/?)(b|i|em|strong)&gt;/g, '<$1$2>');
    return s;
  }

  function hideLoader(){ const l=document.getElementById('ar-loader'); if(l){ l.classList.add('hide'); setTimeout(()=>{ if(l.parentNode) l.remove(); }, 420); } }

  let _backTo = '../../resources.html';
  function goBack(){
    if (document.referrer && /resources\.html|index\.html|learn\.html/.test(document.referrer)) { history.back(); }
    else { window.location.href = _backTo; }
  }

  /* ============================================================
     Category colour (mirrors resources.html _ppdCatColor:
     sorted-index assignment over a 12-colour palette)
     ============================================================ */
  const PALETTE = ['#b3713d','#4e9a5c','#4a7fb0','#b0529a','#a8893a','#3f9a86','#6a64b3','#7e983e','#3f8fa0','#9558b0','#b3506a','#5a7d52'];
  function hashIdx(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))>>>0; } return h % PALETTE.length; }
  let _catColors = null;
  async function categoryColor(cat){
    if(!cat) return PALETTE[2];
    if(!_catColors){
      _catColors = {};
      try{
        const { data } = await db.from('theory_sheets').select('cat:content->>category');
        const cats = [...new Set((data||[]).map(r => r.cat).filter(Boolean))].sort();
        cats.forEach((c,i)=> _catColors[c] = PALETTE[i % PALETTE.length]);
      }catch(e){ _catColors = {}; }
    }
    return _catColors[cat] || PALETTE[hashIdx(cat)];
  }
  function darken(hex, amt){
    const n = parseInt(hex.slice(1),16);
    let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    r=Math.round(r*(1-amt)); g=Math.round(g*(1-amt)); b=Math.round(b*(1-amt));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }

  /* ============================================================
     Schema helpers
     ============================================================ */
  function isNewSchema(c){ return c && Array.isArray(c.pages) && c.pages.length > 0; }

  function plainText(c){
    let t = (c.overview||'') + ' ';
    (c.pages||[]).forEach(p => (p.sections||[]).forEach(s => {
      t += (s.heading||'') + ' ';
      (s.blocks||[]).forEach(b => { t += (b.type==='ul' ? (b.items||[]).join(' ') : (b.text||'')) + ' '; });
    }));
    (c.glossary||[]).forEach(g => { t += (g && g.term ? g.term : '') + ' ' + (g && g.definition ? g.definition : '') + ' '; });
    t += (c.takeaways||[]).join(' ');
    return t.replace(/<[^>]+>/g,'');
  }
  // keep in sync with resources.html _ppdReadMins (same fields, same wpm)
  function readMins(c){
    const words = plainText(c).trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1, Math.round(words / 170));
  }

  /* ============================================================
     NEW reader render
     ============================================================ */
  let _page = 0;
  let _cc = PALETTE[2];

  function checkSVG(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';}
  function starSVG(){return '<svg viewBox="0 0 24 24" fill="currentColor" style="color:#c79a22"><path d="M12 2.5l2.7 6.5 7 .6-5.3 4.6 1.6 6.8L12 17.9 6 21.6l1.6-6.8L2.3 9.6l7-.6z"/></svg>';}
  function bookSVG(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';}
  function arGlossary(c){
    if(!(c.glossary&&c.glossary.length)) return '';
    return '<div class="ar-glossary"><div class="ar-gloss-hd">'+bookSVG()+'In This Article</div><div class="ar-gloss-list">'+
      c.glossary.map(g=>'<div class="ar-gloss-item"><span class="ar-gloss-term">'+rich(g.term)+'</span><span class="ar-gloss-def">'+rich(g.definition)+'</span></div>').join('')+'</div></div>';
  }
  function clockSVG(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';}
  // closing section: practice points vs key takeaways
  function takeMeta(c){
    return c.takeawaysKind==='takeaways'
      ? { label:'Key Takeaways', icon:starSVG() }
      : { label:'Practice This', icon:checkSVG() };
  }

  function arBlock(b){
    if(b.type==='ul') return '<ul class="ar-ul">'+(b.items||[]).map(i=>'<li>'+rich(i)+'</li>').join('')+'</ul>';
    return '<p class="ar-p">'+rich(b.text)+'</p>';
  }
  function arSection(s){
    return '<div class="ar-section"><h2 class="ar-h2">'+rich(s.heading)+'</h2>'+(s.blocks||[]).map(arBlock).join('')+'</div>';
  }
  function arTakeaways(c){
    if(!(c.takeaways&&c.takeaways.length)) return '';
    const m = takeMeta(c);
    return '<div class="ar-takeaways"><div class="ar-take-hd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>'+m.label+'</div>'+
      '<ul class="ar-take-list">'+c.takeaways.map(t=>'<li>'+m.icon+rich(t)+'</li>').join('')+'</ul></div>';
  }

  function renderReader(){
    const c = currentContent, n = c.pages.length, last = _page === n-1;
    const mins = readMins(c);
    let h = '<div class="ar-eyebrow">Piano Practice Daily</div>'+
      '<h1 class="ar-title">'+rich(c.title)+'</h1>'+
      '<div class="ar-meta"><span class="ar-meta-item"><span class="dot"></span>'+esc(c.category||'')+'</span>'+
        '<span class="ar-meta-item">'+clockSVG()+mins+' min read</span>'+
        (n>1?'<span class="ar-meta-item" style="color:var(--soft)">Page '+(_page+1)+' of '+n+'</span>':'')+'</div>';
    h += '<div class="ar-page" id="arpage">';
    if(_page===0 && c.overview) h += '<div class="ar-overview">'+rich(c.overview)+'</div>';
    h += (c.pages[_page].sections||[]).map(arSection).join('');
    if(last){ h += arGlossary(c); h += arTakeaways(c); }
    h += '</div>';
    if(n>1){
      h += '<div class="ar-pager">'+
        '<button class="ar-pg-btn" '+(_page===0?'disabled':'')+' onclick="goPage(-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Back</button>'+
        '<div class="ar-dots">'+Array.from({length:n},(_,i)=>'<span class="ar-dot'+(i===_page?' on':'')+'" onclick="jumpPage('+i+')"></span>').join('')+'</div>'+
        (last
          ? '<button class="ar-pg-btn finish" onclick="finishArticle()">'+(currentStatus==='read'?'Read ✓':'Finish')+'</button>'
          : '<button class="ar-pg-btn next" onclick="goPage(1)">Next<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>')+
      '</div>';
    }
    document.getElementById('app').innerHTML = h;
  }
  window.goPage = function(d){ const n=currentContent.pages.length; _page=Math.max(0,Math.min(n-1,_page+d)); renderReader(); window.scrollTo({top:0,behavior:'smooth'}); };
  window.jumpPage = function(i){ _page=i; renderReader(); window.scrollTo({top:0,behavior:'smooth'}); };
  window.finishArticle = async function(){
    if(currentStatus!=='read'){ await setStatus('read'); }
    renderReader();
    // Always offer the time adjust when Finish is pressed (standalone reader only —
    // a modal inside the embedded practice-log iframe would be clipped). Works
    // whether this read was just logged now or was already logged before.
    if (_embedded || !window.PracticeAutolog || !window.openArticleTimeEditor
        || !userEmail || !currentSheetId || !currentContent) return;
    try {
      const originRef = 'article:' + currentSheetId;
      // No-op if already logged; ensures a session exists and gives us its id.
      const res = await PracticeAutolog.logAppActivity(db, {
        email: userEmail, source: 'app-article', originRef,
        minutes: readMins(currentContent), itemType: 'theory',
        label: currentContent.title || 'Article',
        notes: 'Piano Practice Daily: ' + (currentContent.title || ''),
      });
      if (res.logged) { try { await db.rpc('recompute_streak_tokens', { p_email: userEmail }); } catch (_) {} }
      let sid = res.sessionId;
      if (!sid) {
        const { data } = await db.from('practice_sessions').select('id')
          .eq('email', userEmail).eq('source', 'app-article').eq('origin_ref', originRef).limit(1);
        sid = data && data[0] && data[0].id;
      }
      if (sid) openArticleTimeEditor(sid, res.minutes || readMins(currentContent));
    } catch (_) {}
  };

  /* ============================================================
     A4 handout export (PDF + PNGs)
     ============================================================ */
  // ----- export building blocks -----
  function hoBlockHTML(b){
    return b.type==='ul'
      ? '<ul class="ho-ul">'+(b.items||[]).map(i=>'<li>'+rich(i)+'</li>').join('')+'</ul>'
      : '<p class="ho-p">'+rich(b.text)+'</p>';
  }
  function hoHead(c, pageNo, total){
    const mono = (c.category||c.title||'P').trim().charAt(0).toUpperCase();
    const pageMeta = total>1 ? ('Page '+pageNo+' of '+total) : (readMins(c)+' min read');
    return '<div class="ho-head"><div class="ho-mono">'+esc(mono)+'</div>'+
      '<div class="ho-eyebrow">Piano Practice Daily</div>'+
      '<div class="ho-title">'+rich(c.title)+'</div>'+
      '<div class="ho-head-meta"><span>'+esc(c.category||'')+'</span><span class="pipe">|</span><span>'+pageMeta+'</span></div></div>';
  }
  function hoFoot(c, pageNo, total){
    return '<div class="ho-foot"><span>matthewcawood.com</span><span><b>Piano Practice Daily</b> &nbsp;·&nbsp; Page '+pageNo+' of '+total+'</span></div>';
  }
  // Flatten the whole article into atomic units that may be split across pages.
  function hoUnits(c){
    const units = [];
    if(c.overview) units.push('<div class="ho-overview">'+rich(c.overview)+'</div>');
    (c.pages||[]).forEach(p => (p.sections||[]).forEach(s=>{
      const blocks = s.blocks||[];
      // keep the heading with its first block so a heading never sits alone at a page bottom
      let head = '<div class="ho-section"><div class="ho-h2">'+rich(s.heading)+'</div>';
      if(blocks.length) head += hoBlockHTML(blocks[0]);
      head += '</div>';
      units.push(head);
      for(let i=1;i<blocks.length;i++) units.push('<div class="ho-cont">'+hoBlockHTML(blocks[i])+'</div>');
    }));
    if(c.glossary && c.glossary.length){
      // glossary flows like body content (heading + per-term rows) so a long one
      // breaks across pages instead of being one oversized, un-splittable card.
      const gi = function(g){ return '<div class="ho-gloss-item"><span class="ho-gloss-term">'+rich(g.term)+'</span>: <span class="ho-gloss-def">'+rich(g.definition)+'</span></div>'; };
      units.push('<div class="ho-section"><div class="ho-h2">In This Article</div>'+gi(c.glossary[0])+'</div>');
      for(let i=1;i<c.glossary.length;i++) units.push('<div class="ho-cont">'+gi(c.glossary[i])+'</div>');
    }
    if(c.takeaways && c.takeaways.length){
      const m = takeMeta(c);
      units.push('<div class="ho-take"><div class="ho-take-hd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>'+m.label+'</div><ul>'+
        c.takeaways.map(t=>'<li>'+m.icon+rich(t)+'</li>').join('')+'</ul></div>');
    }
    return units;
  }

  // Build A4 pages by flowing units and breaking when the next unit would overflow.
  async function buildHandoutNodes(){
    const c = currentContent;
    const root = document.getElementById('export-root');
    const cc2 = darken(_cc, 0.22);
    const units = hoUnits(c);

    function newPage(){
      const el = document.createElement('div');
      el.className = 'ho-page';
      el.style.setProperty('--cc', _cc);
      el.style.setProperty('--cc2', cc2);
      el.innerHTML = hoHead(c,1,1) + '<div class="ho-body"></div>' + hoFoot(c,1,1);
      return el;
    }

    // --- pass 1: measure to decide page breaks ---
    root.innerHTML = '';
    let probe = newPage(); root.appendChild(probe);
    let body = probe.querySelector('.ho-body');
    await document.fonts.ready;
    const pages = []; let cur = [];
    for(const u of units){
      body.insertAdjacentHTML('beforeend', u);
      if(body.scrollHeight > body.clientHeight + 1 && cur.length){
        body.removeChild(body.lastChild);     // this unit doesn't fit; push to next page
        pages.push(cur); cur = [];
        root.removeChild(probe); probe = newPage(); root.appendChild(probe); body = probe.querySelector('.ho-body');
        body.insertAdjacentHTML('beforeend', u);
        cur.push(u);
      } else {
        cur.push(u);
      }
    }
    if(cur.length) pages.push(cur);
    root.removeChild(probe);

    // --- pass 2: render final pages with correct page numbers ---
    const total = Math.max(1, pages.length);
    root.innerHTML = '';
    const nodes = [];
    pages.forEach((unitsArr, i) => {
      const el = document.createElement('div');
      el.className = 'ho-page';
      el.style.setProperty('--cc', _cc);
      el.style.setProperty('--cc2', cc2);
      el.innerHTML = hoHead(c,i+1,total) + '<div class="ho-body">'+unitsArr.join('')+'</div>' + hoFoot(c,i+1,total);
      root.appendChild(el);
      nodes.push(el);
    });
    await document.fonts.ready;
    // rare safety net: a single oversized unit alone on a page — shrink just that page's body
    for(const el of nodes){
      const b = el.querySelector('.ho-body');
      if(b && b.scrollHeight > b.clientHeight + 1){
        const scale = b.clientHeight / b.scrollHeight;
        b.style.transformOrigin = 'top left';
        b.style.width = (100/scale) + '%';
        b.style.transform = 'scale(' + scale + ')';
      }
    }
    return nodes; // left in #export-root for the caller to capture one at a time
  }

  const isMobileUA = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

  function showOverlay(msg){
    const o = document.createElement('div');
    o.className = 'ho-overlay';
    o.id = 'ho-ov';
    o.textContent = msg;
    document.body.appendChild(o);
    return o;
  }

  window.exportPDF = async function(){
    if(!isNewSchema(currentContent)) return;
    const btn = document.getElementById('ar-pdf');
    btn.disabled = true;
    const ov = showOverlay('Building PDF…');
    const root = document.getElementById('export-root');
    try{
      const nodes = await buildHandoutNodes();
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit:'pt', format:'a4' }); // 595.28 x 841.89
      const W = pdf.internal.pageSize.getWidth(), H = pdf.internal.pageSize.getHeight();
      // mobile Safari has tight canvas-memory limits: lower ratio, JPEG, one page at a time
      const ratio = isMobileUA ? 2 : 2.6;
      for(let i=0;i<nodes.length;i++){
        if(ov) ov.textContent = 'Building PDF… page '+(i+1)+' of '+nodes.length;
        const jpeg = await htmlToImage.toJpeg(nodes[i], { pixelRatio: ratio, width:820, height:1160, quality:0.92, backgroundColor:'#fffdf9', skipFonts:false });
        if(i) pdf.addPage();
        pdf.addImage(jpeg, 'JPEG', 0, 0, W, H);
        nodes[i].remove();                 // free the rendered page before the next
        await new Promise(r=>setTimeout(r,20));
      }
      root.innerHTML = '';
      pdf.save((currentSlug||'article')+'.pdf');
    }catch(e){ console.error(e); root.innerHTML=''; alert('PDF export failed. Please try again.'); }
    finally{ document.getElementById('ho-ov')?.remove(); btn.disabled = false; }
  };

  window.exportPNGs = async function(){
    if(!isNewSchema(currentContent)) return;
    const btn = document.getElementById('ar-png');
    btn.disabled = true;
    const ov = showOverlay('Building images…');
    const root = document.getElementById('export-root');
    try{
      const nodes = await buildHandoutNodes();
      const base = currentSlug||'article';
      const ratio = isMobileUA ? 2 : 3;
      const urls = [];
      for(let i=0;i<nodes.length;i++){
        if(ov) ov.textContent = 'Building images… '+(i+1)+' of '+nodes.length;
        urls.push(await htmlToImage.toPng(nodes[i], { pixelRatio: ratio, width:820, height:1160, skipFonts:false }));
        nodes[i].remove();
        await new Promise(r=>setTimeout(r,20));
      }
      root.innerHTML = '';
      if(urls.length === 1){
        const a = document.createElement('a'); a.href = urls[0]; a.download = base+'.png'; a.click();
      } else {
        const zip = new JSZip();
        urls.forEach((u,i)=> zip.file(base+'-page-'+(i+1)+'.png', u.split(',')[1], {base64:true}));
        const blob = await zip.generateAsync({type:'blob'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = base+'-images.zip'; a.click();
        setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
      }
    }catch(e){ console.error(e); root.innerHTML=''; alert('Image export failed. Please try again.'); }
    finally{ document.getElementById('ho-ov')?.remove(); btn.disabled = false; }
  };

  /* ============================================================
     OLD broadsheet render (legacy schema fallback)
     ============================================================ */
  function buildSectionsHTML(c) {
    const sectionHTML = (sec) => {
      const bullets = (sec.bullets || []).filter(b => b.trim()).map(b => `<li>${esc(b)}</li>`).join('');
      return `<section><h2>${esc(sec.heading)}</h2>${sec.paragraph?.trim() ? `<p>${esc(sec.paragraph)}</p>` : ''}${bullets ? `<ul>${bullets}</ul>` : ''}</section>`;
    };
    const left  = (c.leftSections  || []).slice(0, 4);
    const right = (c.rightSections || []).slice(0, 4);
    const maxLen = Math.max(left.length, right.length);
    let html = '';
    for (let i = 0; i < maxLen; i++) { if (left[i]) html += sectionHTML(left[i]); if (right[i]) html += sectionHTML(right[i]); }
    const cheatBullets = (c.cheatBullets || []).map(b => `<li>${esc(b)}</li>`).join('');
    html += `<div class="cheat-sheet" style="grid-column:1/-1;grid-row:5"><h3>${esc(c.cheatTitle || 'CHEAT SHEET')}</h3><ul>${cheatBullets}</ul></div>`;
    return `<div class="col">${html}</div>`;
  }
  function renderOld(c) {
    document.title = `Piano Practice Daily — ${c.title}`;
    document.getElementById('s-title').textContent  = c.title  || '';
    document.getElementById('s-intro').textContent  = c.intro  || '';
    document.getElementById('s-footer').textContent = c.footer || '';
    document.getElementById('s-columns').innerHTML  = buildSectionsHTML(c);
  }

  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
  async function downloadSheet() {
    if (!currentContent) return;
    const element = document.getElementById('sheet-page');
    const btn = document.querySelector('button[onclick="downloadSheet()"]');
    if (btn) { btn.textContent = '↓ Generating…'; btn.disabled = true; }
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:#a8a49a;z-index:9999;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;color:#f0ebe0;font-size:1rem;letter-spacing:0.05em';
    overlay.textContent = 'Generating…';
    document.body.appendChild(overlay);
    try {
      await document.fonts.ready;
      const prevTransform = element.style.transform;
      const prevMarginBottom = element.style.marginBottom;
      element.style.transform = 'none'; element.style.marginBottom = '0';
      const dataUrl = await htmlToImage.toJpeg(element, { quality: 0.98, pixelRatio: 3, skipFonts: false, backgroundColor: '#f0ebe0' });
      element.style.transform = prevTransform; element.style.marginBottom = prevMarginBottom;
      if (isIOS) {
        const newTab = window.open('', '_blank');
        newTab.document.write(`<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save Sheet</title></head><body style="margin:0;background:#f5f5f5;font-family:sans-serif"><div style="background:#1a1a1a;padding:16px 20px;text-align:center"><p style="color:#fff;font-size:15px;font-weight:600;margin:0 0 4px">Press and hold the image below</p><p style="color:#aaa;font-size:13px;margin:0">then tap <strong style="color:#F5C518">Save to Photos</strong></p></div><div style="padding:12px"><img src="${dataUrl}" style="width:100%;display:block;box-shadow:0 2px 12px rgba(0,0,0,0.15)"></div></body></html>`);
        newTab.document.close(); return;
      }
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
      pdf.addImage(dataUrl, 'JPEG', 0, 0, 210, 297);
      pdf.save((currentSlug || 'sheet') + '.pdf');
    } catch(e) {
      element.style.transform = ''; element.style.marginBottom = ''; window.print();
    } finally {
      document.body.removeChild(overlay);
      if (btn) { btn.textContent = '↓ Download'; btn.disabled = false; }
    }
  }

  /* ============================================================
     Load
     ============================================================ */
  async function loadSheet() {
    const params = new URLSearchParams(window.location.search);

    /* Monday Music Tips read here too. The text has always been in this
       database - mmt_articles.body_html - and the app was sending members out
       to the public website to read something it already held, which lost the
       reader, the back button and any record they had read it. Single page:
       these are written as one piece, unlike a Piano Practice Daily article
       which is authored in pages. */
    const mmtSlug = params.get('mmt');
    if (mmtSlug) { await loadMmt(mmtSlug); return; }

    const slug = params.get('slug');
    if (!slug) { window.location.replace('../index.html'); return; }
    currentSlug = slug;
    loadNote(slug);

    const { data } = await db.from('theory_sheets').select('id, content, title').eq('slug', slug).single();

    if (data && data.content) {
      currentContent = data.content;
      currentSheetId = data.id;
      if (isNewSchema(data.content)) {
        isNew = true;
        document.title = `Piano Practice Daily — ${data.content.title}`;
        _cc = await categoryColor(data.content.category);
        document.body.classList.add('ar-mode');
        document.getElementById('ar-root').style.display = '';
        document.getElementById('ar-root').style.setProperty('--cc', _cc);
        // move shared notes textarea into the reader mount
        document.getElementById('ar-notes-mount').replaceWith(document.getElementById('notes-card'));
        if (isOwner) document.getElementById('ar-png').style.display = '';
        renderReader();
      } else {
        document.getElementById('old-root').style.display = '';
        renderOld(data.content);
      }
      hideLoader();
      loadSheetStatusById(data.id);
      return;
    }

    const staticRes = await fetch(slug + '.html');
    if (staticRes.ok) { window.location.replace(slug + '.html'); return; }

    document.getElementById('old-root').style.display = '';
    document.getElementById('s-title').textContent = 'Sheet not found';
    document.getElementById('s-intro').textContent = 'This sheet has no content yet. Go back to the sheet list and regenerate it.';
    document.getElementById('s-columns').innerHTML = '<div class="col"><section><p><a href="../index.html" style="color:#111">← Back to all sheets</a></p></section></div>';
    hideLoader();
  }

  async function loadMmt(slug) {
    const { data } = await db.from('mmt_articles')
      .select('title, excerpt, body_html, published_at, created_at')
      .eq('slug', slug).eq('status', 'published').single();
    if (!data) {
      document.getElementById('old-root').style.display = '';
      document.getElementById('s-title').textContent = 'Article not found';
      document.getElementById('s-intro').textContent = 'This Monday Music Tip is not available.';
      hideLoader();
      return;
    }
    document.title = 'Monday Music Tips — ' + data.title;
    _cc = '#b45309';                       // Monday Music Tips' own colour in Learn
    document.body.classList.add('ar-mode');
    const root = document.getElementById('ar-root');
    root.style.display = '';
    root.style.setProperty('--cc', _cc);
    /* Save, Notes and the exports all key off a theory sheet id. Rather than
       show controls that cannot work, the top bar carries just the way back. */
    ['ar-save', 'ar-pdf', 'ar-png'].forEach(id => {
      const el = document.getElementById(id); if (el) el.style.display = 'none';
    });
    const notesBtn = document.querySelector('.ar-act[onclick="openNotes()"]');
    if (notesBtn) notesBtn.style.display = 'none';
    /* A tip is reached from Learn, not from the Piano Practice Daily library,
       so the way back says so. */
    const backLbl = document.querySelector('.ar-back .lbl');
    if (backLbl) backLbl.textContent = 'Learn';
    _backTo = '/learn.html';
    const mount = document.getElementById('ar-notes-mount');
    if (mount) mount.remove();

    const words = String(data.body_html || '').replace(/<[^>]+>/g, ' ').split(/\s+/).filter(Boolean).length;
    const mins = Math.max(1, Math.round(words / 200));
    const when = new Date(data.published_at || data.created_at)
      .toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

    document.getElementById('app').innerHTML =
      '<div class="ar-eyebrow">Monday Music Tips</div>' +
      '<h1 class="ar-title">' + esc(data.title) + '</h1>' +
      '<div class="ar-meta"><span class="ar-meta-item"><span class="dot"></span>' + esc(when) + '</span>' +
        '<span class="ar-meta-item">' + clockSVG() + mins + ' min read</span></div>' +
      /* The excerpt is a machine-made truncation of the opening paragraph,
         so printing it above the article says the same words twice and cuts
         the second copy mid-word. The body speaks for itself. */
      '<div class="ar-page ar-html">' + (data.body_html || '') + '</div>';
    hideLoader();
  }

  /* ============================================================
     Reading status (reading_list)
     ============================================================ */
  let currentStatus = 'none';
  const STATUS_LABELS = { none: '+ Save to My List', reading: '📖 Reading', read: '✓ Read' };
  const STATUS_NEXT   = { none: 'reading', reading: 'read', read: 'none' };

  function updateStatusBtn(status) {
    currentStatus = status;
    // old broadsheet button
    const old = document.getElementById('status-btn');
    if (old) { old.textContent = STATUS_LABELS[status]; old.className = `status-${status}`; old.style.display = ''; }
    // new reader save chip
    const sv = document.getElementById('ar-save'), lbl = document.getElementById('ar-save-lbl');
    if (sv && lbl) {
      sv.classList.toggle('saved', status==='reading');
      sv.classList.toggle('read', status==='read');
      lbl.textContent = status==='read' ? 'Read' : (status==='reading' ? 'Saved' : 'Save');
    }
  }

  const _embedded = (window.parent !== window);
  async function loadSheetStatusById(sheetId) {
    if (!userEmail || !sheetId) { updateStatusBtn('none'); return; }
    const { data } = await db.from('reading_list').select('status').eq('email', userEmail).eq('sheet_id', sheetId).single();
    const status = data?.status || 'none';
    // Opening an article adds it to your reading list automatically (Continue reading),
    // unless it's already marked. Skip when embedded inside the practice log.
    if (status === 'none' && !_embedded) {
      currentStatus = 'none';
      await setStatus('reading');
    } else {
      updateStatusBtn(status);
    }
  }

  async function setStatus(next){
    if (!userEmail || !currentSheetId) return;
    const wasRead = currentStatus === 'read';
    if (next === 'none') {
      await db.from('reading_list').delete().eq('email', userEmail).eq('sheet_id', currentSheetId);
    } else if (currentStatus === 'none') {
      await db.from('reading_list').insert({ email: userEmail, sheet_id: currentSheetId, status: next });
    } else {
      await db.from('reading_list').update({ status: next }).eq('email', userEmail).eq('sheet_id', currentSheetId);
    }
    updateStatusBtn(next);
    // Auto-log the read toward practice when the article is finished; remove it if
    // it's later un-marked. Deduped by origin_ref so it can only ever count once.
    // Uses the same read-time estimate shown in the reader (readMins).
    try {
      if (window.PracticeAutolog && currentContent) {
        const originRef = 'article:' + currentSheetId;
        if (next === 'read' && !wasRead) {
          const r = await PracticeAutolog.logAppActivity(db, {
            email: userEmail, source: 'app-article', originRef,
            minutes: readMins(currentContent), itemType: 'theory',
            label: currentContent.title || 'Article',
            notes: 'Piano Practice Daily: ' + (currentContent.title || ''),
          });
          if (r.logged) { try { await db.rpc('recompute_streak_tokens', { p_email: userEmail }); } catch (_) {} }
        } else if (wasRead && next !== 'read') {
          await PracticeAutolog.removeAppActivity(db, { email: userEmail, source: 'app-article', originRef });
          try { await db.rpc('recompute_streak_tokens', { p_email: userEmail }); } catch (_) {}
        }
      }
    } catch (_) {}
  }
  async function cycleSheetStatus() {
    if (!userEmail || !currentSheetId) return;
    await setStatus(STATUS_NEXT[currentStatus]);
  }
  // reader Save chip: simple bookmark toggle (none <-> reading); 'read' is set by Finish
  async function toggleSaveStatus() {
    if (!userEmail || !currentSheetId) return;
    await setStatus(currentStatus === 'none' ? 'reading' : 'none');
  }

  /* ============================================================
     Read-time editor — opens after Finish so the member can adjust the
     auto-logged minutes (the read estimate is only a word-count guess). Mirrors
     the course-lesson editor. Self-contained so it doesn't depend on app CSS.
     ============================================================ */
  (function(){
    const css = `
      .atm-back{position:fixed;inset:0;z-index:9000;background:rgba(20,16,8,.5);display:none;align-items:center;justify-content:center;padding:20px}
      .atm-back.show{display:flex}
      .atm{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 24px 60px -20px rgba(0,0,0,.4);padding:22px;text-align:center;font-family:inherit}
      .atm-tick{width:44px;height:44px;border-radius:50%;background:rgba(245,197,24,.18);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
      .atm-tick svg{width:24px;height:24px}
      .atm h3{margin:0 0 4px;font-size:1.05rem;color:var(--text)}
      .atm p{margin:0 0 16px;color:var(--text-muted);font-size:.86rem;line-height:1.45}
      .atm-step{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}
      .atm-step button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:1.3rem;font-weight:700;cursor:pointer;line-height:1;font-family:inherit}
      .atm-step button:hover{border-color:#d6c5a8}
      .atm-step .val{min-width:88px}
      .atm-step .val input{width:64px;text-align:center;font-size:1.5rem;font-weight:800;color:var(--text);border:none;background:none;font-family:inherit;-moz-appearance:textfield}
      .atm-step .val input::-webkit-outer-spin-button,.atm-step .val input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
      .atm-step .val .u{display:block;font-size:.7rem;color:var(--text-muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-top:-2px}
      .atm-done{width:100%;background:linear-gradient(180deg,#f7d24a,#f5c518);color:#3a2c00;border:none;border-radius:12px;padding:11px 14px;font-size:.88rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 7px 16px -7px rgba(245,197,24,.7)}
      .atm-done:disabled{opacity:.6;cursor:default}`;
    const st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    const back = document.createElement('div'); back.className = 'atm-back';
    back.innerHTML =
      '<div class="atm" role="dialog" aria-modal="true">'+
        '<div class="atm-tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></div>'+
        '<h3>Article read</h3>'+
        '<p id="atm-sub">Added to your practice. Adjust the time if you spent more or less.</p>'+
        '<div class="atm-step">'+
          '<button type="button" id="atm-minus" aria-label="Less time">&minus;</button>'+
          '<span class="val"><input type="number" id="atm-input" min="1" max="600" inputmode="numeric"><span class="u">minutes</span></span>'+
          '<button type="button" id="atm-plus" aria-label="More time">+</button>'+
        '</div>'+
        '<button type="button" class="atm-done" id="atm-done">Done</button>'+
      '</div>';
    document.body.appendChild(back);
    const input = back.querySelector('#atm-input'), doneBtn = back.querySelector('#atm-done');
    let sid = null, orig = 0;
    const clamp = n => { n = Math.round(Number(n)||0); return Math.max(1, Math.min(600, n)); };
    window.openArticleTimeEditor = function(sessionId, minutes){
      sid = sessionId; orig = clamp(minutes);
      back.querySelector('#atm-sub').textContent = 'Added ' + orig + ' min to your practice. Adjust it if you spent more or less time.';
      input.value = orig; doneBtn.disabled = false; doneBtn.textContent = 'Done';
      back.classList.add('show');
      setTimeout(() => { try { input.focus(); input.select(); } catch(_){} }, 40);
    };
    function close(){ back.classList.remove('show'); sid = null; }
    async function save(){
      const mins = clamp(input.value); input.value = mins;
      if (!sid || mins === orig) { close(); return; }
      doneBtn.disabled = true; doneBtn.textContent = 'Saving…';
      try {
        await db.from('practice_sessions').update({ duration_minutes: mins }).eq('id', sid);
        await db.from('practice_items').update({ duration_minutes: mins }).eq('session_id', sid);
      } catch(_){}
      close();
    }
    back.querySelector('#atm-minus').onclick = () => { input.value = clamp(input.value) - 1; };
    back.querySelector('#atm-plus').onclick  = () => { input.value = clamp(input.value) + 1; };
    input.onchange = () => { input.value = clamp(input.value); };
    doneBtn.onclick = save;
    back.addEventListener('click', e => { if (e.target === back) save(); });
  })();

  /* ============================================================
     Notes
     ============================================================ */
  function openNotes() {
    const card = document.getElementById('notes-card');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(() => document.getElementById('notes-textarea').focus(), 400);
  }
  let notesSaveTimer = null;
  function autoResize(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }
  async function loadNote(slug) {
    if (!userEmail) return;
    const { data } = await db.from('sheet_notes').select('note').eq('email', userEmail).eq('sheet_slug', slug).single();
    const ta = document.getElementById('notes-textarea');
    if (data && data.note) { ta.value = data.note; autoResize(ta); }
  }
  function onNotesInput() {
    const ta = document.getElementById('notes-textarea');
    autoResize(ta);
    document.getElementById('notes-status').textContent = 'Saving…';
    clearTimeout(notesSaveTimer);
    notesSaveTimer = setTimeout(() => saveNote(ta.value), 1500);
  }
  async function saveNote(text) {
    if (!userEmail || !currentSlug) return;
    const status = document.getElementById('notes-status');
    let error;
    if (!text.trim()) {
      ({ error } = await db.from('sheet_notes').delete().eq('email', userEmail).eq('sheet_slug', currentSlug));
    } else {
      ({ error } = await db.from('sheet_notes').upsert({ email: userEmail, sheet_slug: currentSlug, note: text, updated_at: new Date().toISOString() }, { onConflict: 'email,sheet_slug' }));
    }
    if (error) {
      console.error('Note save failed:', error);
      status.textContent = 'Save failed ✗'; status.style.color = '#c0392b';
      setTimeout(() => { status.textContent = ''; status.style.color = ''; }, 3000);
      return;
    }
    status.textContent = 'Saved ✓';
    setTimeout(() => { status.textContent = ''; }, 2000);
  }

  /* ============================================================
     Embedded mode (inside practice-log.html iframe)
     ============================================================ */
  if (window.parent !== window) {
    document.body.style.minHeight = '0';
    document.body.style.padding   = '0 0 20px';
    const hubLink = document.querySelector('.sheet-nav a[href="/"]');
    if (hubLink) hubLink.style.display = 'none';
    const fab = document.querySelector('.notes-fab');
    if (fab) fab.style.display = 'none';
  }

  document.addEventListener('keydown', e => {
    if (!isNew) return;
    if (e.key === 'ArrowRight') goPage(1);
    if (e.key === 'ArrowLeft')  goPage(-1);
  });

  loadSheet();
  setTimeout(hideLoader, 8000); // safety net: never leave the loader stuck
</script>

</body>
</html>
