<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Studios &middot; The Practice Room</title>
<link rel="icon" href="/icon-192.png">
<!-- Reuse the app design system (dark theme, gold accent, .login-card / .btn). -->
<link rel="stylesheet" href="/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  /* Auth gate */
  #auth { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-wrap { width:100%; max-width:380px; }
  .fld { width:100%; box-sizing:border-box; padding:11px 13px; margin-top:10px;
         background:var(--surface-2); border:1px solid var(--border); border-radius:9px;
         color:var(--text); font:inherit; }
  .fld:focus { outline:none; border-color:var(--accent); }
  .err { color:#f87171; font-size:.85rem; margin-top:10px; display:none; }
  .full { width:100%; margin-top:10px; }
  /* Hub */
  #hub { display:none; max-width:1040px; margin:0 auto; padding:28px 20px 64px; }
  .hub-head { display:flex; align-items:center; justify-content:space-between; gap:16px; }
  .hub-title { display:flex; align-items:center; gap:12px; }
  .hub-title img { width:40px; height:40px; border-radius:9px; }
  .hub-title h1 { font-size:1.5rem; margin:0; }
  .hub-sub { color:var(--text-muted); font-size:.9rem; margin:6px 0 24px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .tile { position:relative; display:flex; flex-direction:column; gap:9px; padding:18px;
          background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
          text-decoration:none; color:var(--text); transition:border-color .15s, transform .15s, box-shadow .15s; }
  .tile:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:var(--shadow); }
  .tile .ic { width:28px; height:28px; color:var(--accent); }
  .tile .nm { font-weight:700; font-size:1.05rem; }
  .tile .ds { color:var(--text-muted); font-size:.84rem; line-height:1.45; }
  .tile .tag { position:absolute; top:14px; right:14px; font-size:.62rem; text-transform:uppercase;
               letter-spacing:.06em; color:var(--accent-dim); border:1px solid var(--tag-border);
               background:var(--tag-bg); padding:2px 7px; border-radius:999px; }
  .grp-label { font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-muted);
               margin:26px 0 10px; font-weight:700; }
  .grp-label:first-of-type { margin-top:6px; }
</style>
</head>
<body>
  <!-- Owner-only gate (OTP, same pattern as the studios) -->
  <div id="auth">
    <div class="auth-wrap">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo"><img src="/icon-192.png" alt="The Practice Room"></div>
          <h1 class="login-title">Studios</h1>
        </div>
        <div id="step1">
          <input id="a-email" class="fld" type="email" placeholder="Owner email" autocomplete="email">
          <button class="btn btn-primary full" id="b-send">Send code</button>
        </div>
        <div id="step2" style="display:none">
          <input id="a-otp" class="fld" inputmode="numeric" placeholder="6-digit code">
          <button class="btn btn-primary full" id="b-verify">Verify</button>
          <button class="btn full" id="b-back">Back</button>
        </div>
        <p class="err" id="a-err"></p>
      </div>
    </div>
  </div>

  <!-- The hub -->
  <div id="hub">
    <div class="hub-head">
      <div class="hub-title"><img src="/icon-192.png" alt=""><h1>Studios</h1></div>
      <button class="btn" id="logout">Sign out</button>
    </div>
    <p class="hub-sub">All your authoring and admin tools in one place.</p>
    <div id="grid-content"></div>
  </div>

<script>
const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNER_EMAIL   = "matthew@matthewcawood.com";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// Inline icons (stroke = currentColor = gold)
const I = {
  lesson:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  cover:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
  email:'<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
  idea:'<path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>',
  mmt:'<path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8M15 18h-5M10 6h8v4h-8z"/>',
  analytics:'<path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/>',
  sight:'<circle cx="8" cy="18" r="3"/><path d="M11 18V5l9-2v13"/><circle cx="17" cy="16" r="3"/>',
  database:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
  piece:'<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="m14 22 2 2 4-4"/>',
};
const svg = p => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;

const GROUPS = [
  { label:"Content", tiles:[
    { href:"/lesson-studio.html", name:"Lesson Studio", icon:I.lesson, desc:"Write and edit the course lessons (Theory, and more)." },
    { href:"/book-studio.html",   name:"Book Studio",   icon:I.book,   desc:"Design and lay out the store PDFs and workbooks." },
    { href:"/cover-studio.html",  name:"Cover Studio",  icon:I.cover,  desc:"Create the book and workbook covers." },
    { href:"/mmt-studio.html",    name:"Monday Music Tips", icon:I.mmt, desc:"Write and publish the Monday Music Tips articles." },
    { href:"/idea-studio.html",   name:"Idea Studio",   icon:I.idea,   desc:"Draft and plan YouTube video ideas." },
    { href:"/?view=database",     name:"Piano Database",icon:I.database,desc:"The piece and book library. Add and enrich pieces, and use the Requests tab to link student requests and free-choice pieces to a catalogue entry." },
    { href:"/piece-studio.html",  name:"Piece Studio",  icon:I.piece,  desc:"Review, edit and publish library pieces. Approve draft pieces, with their video and sheet-music links, before they go live." },
    { href:"/merge-studio.html",  name:"Merge Studio",  icon:I.piece,  desc:"Merge members' free-typed custom pieces into their library equivalents, so completed pieces leave rotation on Stats and duplicates collapse into one." },
  ]},
  { label:"Comms & data", tiles:[
    { href:"/email-studio.html",     name:"Email Studio",   icon:I.email,     desc:"Write, template and send email campaigns." },
    { href:"/admin-analytics.html",  name:"Admin Analytics",icon:I.analytics, desc:"Traffic, store, bookings, email and course progress." },
  ]},
  { label:"Local tools", tiles:[
    { href:"http://localhost:7700", name:"Sight Reading Studio", icon:I.sight, tag:"Local",
      desc:"Generate and bank ABRSM sight-reading exercises. Runs on your machine (node server.mjs)." },
  ]},
];

function renderGrid(){
  document.getElementById("grid-content").innerHTML = GROUPS.map(g => `
    <div class="grp-label">${g.label}</div>
    <div class="grid">${g.tiles.map(t => `
      <a class="tile" href="${t.href}"${t.tag ? ' target="_blank" rel="noopener"' : ''}>
        ${t.tag ? `<span class="tag">${t.tag}</span>` : ""}
        ${svg(t.icon)}
        <span class="nm">${t.name}</span>
        <span class="ds">${t.desc}</span>
      </a>`).join("")}</div>`).join("");
}

// ── Auth ──────────────────────────────────────────────────────
let otpEmail = "";
const $ = id => document.getElementById(id);
function showErr(m){ const e=$("a-err"); e.textContent=m; e.style.display="block"; }
async function sendOTP(){
  const email = $("a-email").value.trim().toLowerCase();
  $("a-err").style.display="none";
  if (email !== OWNER_EMAIL) return showErr("Admin access only.");
  const { error } = await db.auth.signInWithOtp({ email, options:{ shouldCreateUser:false } });
  if (error) return showErr(error.message);
  otpEmail = email; $("step1").style.display="none"; $("step2").style.display="block"; $("a-otp").focus();
}
async function verifyOTP(){
  $("a-err").style.display="none";
  const token = $("a-otp").value.trim();
  const { error } = await db.auth.verifyOtp({ email:otpEmail, token, type:"email" });
  if (error) return showErr("Invalid or expired code.");
  enterHub();
}
function enterHub(){ $("auth").style.display="none"; $("hub").style.display="block"; renderGrid(); }

$("b-send").onclick   = sendOTP;
$("b-verify").onclick = verifyOTP;
$("b-back").onclick   = () => { $("step2").style.display="none"; $("step1").style.display="block"; };
$("a-email").addEventListener("keydown", e => { if (e.key==="Enter") sendOTP(); });
$("a-otp").addEventListener("keydown",   e => { if (e.key==="Enter") verifyOTP(); });
$("logout").onclick   = async () => { await db.auth.signOut(); location.reload(); };

(async function boot(){
  const { data:{ session } } = await db.auth.getSession();
  if (session && session.user.email.toLowerCase() === OWNER_EMAIL) { enterHub(); }
  else { if (session) await db.auth.signOut(); $("auth").style.display="flex"; }
})();
</script>
</body>
</html>
