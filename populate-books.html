function log(msg, cls = "") {
  const el = document.getElementById("log");
  el.style.display = "";
  el.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  el.scrollTop = el.scrollHeight;
}

async function populate() {
  const btn = document.getElementById("run-btn");
  btn.disabled = true;
  btn.textContent = "Running…";
  document.getElementById("log").innerHTML = "";

  log("Fetching existing pieces (searching by title to catch wrongly-categorised books)…");
  const bookTitles = BOOKS.map(b => b.title);
  const { data: existing, error: fetchErr } = await db
    .from("pieces")
    .select("id, title, kind")
    .in("title", bookTitles);

  if (fetchErr) {
    log(`\nError: ${fetchErr.message}`, "err");
    log("If you see an RLS error, make sure you are logged into the app in this browser first,\nthen reload this page and try again.", "err");
    btn.disabled = false;
    btn.textContent = "Retry";
    return;
  }

  const wrongKind = (existing || []).filter(r => r.kind !== "book").length;
  if (wrongKind > 0) log(`  ⚠ ${wrongKind} row(s) found with wrong kind — will be fixed.\n`, "update");

  const existingMap = new Map((existing || []).map(b => [b.title.toLowerCase(), b.id]));
  log(`Found ${existingMap.size} existing book(s).\n`);

  let inserted = 0, updated = 0, errors = 0;

  for (const book of BOOKS) {
    const payload = {
      title:          book.title,
      composer:       book.composer,
      difficulty:     book.difficulty,
      tags:           book.tags,
      background:     book.background,
      pianist_notes:  book.pianist_notes,
      challenges:     book.challenges,
      kind:           "book",
    };

    const existingId = existingMap.get(book.title.toLowerCase());

    if (existingId) {
      // Update existing row
      const { error } = await db.from("pieces").update(payload).eq("id", existingId);
      if (error) {
        log(`  ERROR updating "${book.title}": ${error.message}`, "err");
        errors++;
      } else {
        log(`  ↻ upd  ${book.title}`, "update");
        updated++;
      }
    } else {
      // Insert new row
      const { error } = await db.from("pieces").insert(payload);
      if (error) {
        log(`  ERROR inserting "${book.title}": ${error.message}`, "err");
        errors++;
      } else {
        log(`  ✓ new  ${book.title}`, "ok");
        inserted++;
      }
    }
  }

  log(`\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`, "done");
  log(`Done.  ${inserted} inserted · ${updated} updated · ${errors} error(s)`, "done");
  if (errors === 0) btn.textContent = "Done ✓";
  else { btn.disabled = false; btn.textContent = "Retry"; }
}
</script>
