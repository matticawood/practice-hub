# Supabase CLI config.
#
# IMPORTANT: these two edge functions are PUBLIC by design and must stay that way.
#   - membership-redirect : the browser navigates to it (join.html) with no JWT,
#                           then it 302-redirects to a Stripe Payment Link.
#   - stripe-webhook      : Stripe calls it with a stripe-signature header (verified
#                           in-code), never a Supabase JWT.
# `supabase functions deploy` defaults verify_jwt = true, which would 401 both and
# break checkout + member provisioning. Pinning verify_jwt = false here keeps any
# future `supabase functions deploy` from re-enabling auth on them.
project_id = "gyskfutmncprqxazgatv"

[functions.membership-redirect]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false
