# Supabase CLI config.
#
# IMPORTANT: these two edge functions are PUBLIC by design and must stay that way.
#   - membership-redirect : the browser navigates to it (join.html) with no JWT,
#                           then it 302-redirects to a Stripe Payment Link.
#   - stripe-webhook      : Stripe calls it with a stripe-signature header (verified
#                           in-code), never a Supabase JWT.
# `supabase functions deploy` defaults verify_jwt = true, which would 401 both and
# break checkout + member provisioning. Pinning verify_jwt = false here keeps any
# future `supabase functions deploy` from re-enabling auth on them.
project_id = "gyskfutmncprqxazgatv"

[functions.membership-redirect]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

# clinic-webhook is also Stripe-called (stripe-signature, no JWT) — must stay public.
[functions.clinic-webhook]
verify_jwt = false

# cal-webhook is called by Cal.com (X-Cal-Signature-256, no JWT) — must stay public.
[functions.cal-webhook]
verify_jwt = false

# booking-manage is opened from an email link in the browser (no JWT) — must stay public.
[functions.booking-manage]
verify_jwt = false

# store-webhook is called by Stripe (no JWT) — must stay public.
[functions.store-webhook]
verify_jwt = false

# store-access is opened from a delivery email link in the browser (no JWT) — must stay public.
[functions.store-access]
verify_jwt = false

# membership-price returns the membership price in the visitor's local currency
# for display on /signup. Read-only, called from the browser. verify_jwt false.
[functions.membership-price]
verify_jwt = false

# community-stats returns aggregate practice totals (sessions/hours) for social
# proof on /signup. Read-only, no PII, called from the browser. verify_jwt false.
[functions.community-stats]
verify_jwt = false

# course-progress records how far a buyer gets through a store course. Called
# from the static course player with the anon key; the buyer's access_token is
# the gate, so verify_jwt must stay false.
[functions.course-progress]
verify_jwt = false

# lesson-ai streams Claude-drafted lesson content to Lesson Studio. It does its own
# owner-auth (checks the caller's JWT is the owner) and is called from the browser,
# so verify_jwt must stay false (the function reads the bearer token itself).
[functions.lesson-ai]
verify_jwt = false

# Book Studio page design. Same owner-auth-in-function pattern as lesson-ai.
[functions.book-ai]
verify_jwt = false
