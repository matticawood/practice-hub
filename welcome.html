<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Welcome to The Practice Room</title>
<link rel="icon" href="/icon-192.png">
<!-- Reuse the app's own design system so this matches the login screen exactly. -->
<link rel="stylesheet" href="/style.css">
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         padding:24px; background:var(--bg); }
  .welcome-wrap { width:100%; max-width:420px; }
  .welcome-msg { text-align:center; color:var(--text-muted); font-size:0.95rem; line-height:1.7; margin:20px 0 0; }
  .welcome-spinner { width:30px; height:30px; margin:22px auto 0; border:3px solid var(--surface-2);
                     border-top-color:var(--accent); border-radius:50%; animation:wspin .8s linear infinite; }
  @keyframes wspin { to { transform:rotate(360deg); } }
  #wfallback { display:none; }
  .welcome-btn { display:block; width:100%; margin-top:20px; padding:12px; text-align:center; text-decoration:none; }
  .welcome-note { text-align:center; font-size:0.8rem; color:var(--text-muted); margin-top:14px; }
</style>
</head>
<body>
  <div class="welcome-wrap">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo"><img src="/icon-192.png" alt="The Practice Room"></div>
        <h1 class="login-title">The Practice Room</h1>
      </div>

      <p class="welcome-msg" id="wmsg">Thanks for joining. Getting your account ready.</p>
      <div class="welcome-spinner" id="wspin"></div>

      <div id="wfallback">
        <p class="welcome-msg" style="margin-top:0">You're all set. Your membership is active.</p>
        <a class="btn btn-primary welcome-btn" id="wbtn" href="/?welcome=1">Log in to The Practice Room</a>
        <p class="welcome-note">We have also emailed you a login link, in case you need it.</p>
      </div>
    </div>
  </div>

<script>
// Auto-login after Stripe checkout. Best-effort only: if anything goes wrong we
// show the "log in" fallback. The member is already provisioned by the webhook and
// can always log in normally, so we never dead-end.
(function () {
  var FN_URL = "https://gyskfutmncprqxazgatv.supabase.co/functions/v1/checkout-login";
  var ANON   = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
  var sid = new URLSearchParams(location.search).get("session_id") || "";

  function fallback() {
    var s = document.getElementById("wspin"); if (s) s.style.display = "none";
    var m = document.getElementById("wmsg");  if (m) m.style.display = "none";
    document.getElementById("wfallback").style.display = "block";
  }

  var done = false;
  var timer = setTimeout(function () { if (!done) { done = true; fallback(); } }, 8000);

  if (!sid || sid.indexOf("cs_") !== 0) { clearTimeout(timer); return fallback(); }

  fetch(FN_URL + "?session_id=" + encodeURIComponent(sid), {
    method: "GET",
    headers: { "apikey": ANON, "Authorization": "Bearer " + ANON }
  })
  .then(function (r) { return r.json(); })
  .then(function (d) {
    if (done) return; done = true; clearTimeout(timer);
    if (d && d.ok && d.action_link) {
      document.getElementById("wmsg").textContent = "Logging you in.";
      location.replace(d.action_link);
    } else { fallback(); }
  })
  .catch(function () { if (done) return; done = true; clearTimeout(timer); fallback(); });
})();
</script>
</body>
</html>
