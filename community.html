<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js"></script>
  <style>
    /* ── Community page ────────────────────────────────────────────────────────── */
    #community-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    /* ── Page header ─────────────────────────────────────────────────────────── */
    .community-page-hdr {
      margin-bottom: 28px;
    }
    .community-page-hdr h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin: 0 0 4px;
    }
    .community-page-hdr p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin: 0;
    }

    /* ── Post type composer ──────────────────────────────────────────────────── */
    .composer-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 28px;
    }
    .composer-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .post-type-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .post-type-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
      font-family: inherit;
    }
    .post-type-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .post-type-btn.active {
      background: rgba(245,197,24,.1);
      border-color: var(--accent);
      color: var(--accent);
    }
    .composer-textarea-wrap {
      margin-top: 12px;
      display: none;
    }
    .composer-textarea-wrap.visible { display: block; }
    .composer-textarea {
      width: 100%;
      box-sizing: border-box;
      background: #0f0f0f;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.9rem;
      font-family: inherit;
      padding: 12px 14px;
      resize: vertical;
      min-height: 80px;
      transition: border-color .15s;
    }
    .composer-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 10px;
    }
    .composer-type-label {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .composer-submit {
      padding: 8px 18px;
      font-size: 0.85rem;
    }
    .composer-coming-soon {
      font-size: 0.78rem;
      color: #444;
      font-style: italic;
      margin-top: 10px;
    }

    /* ── Feed section header ─────────────────────────────────────────────────── */
    .feed-section-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .feed-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--text-muted);
    }
    .feed-section-sub {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* ── Feed card wrapper ───────────────────────────────────────────────────── */
    .feed-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 16px;
      margin-bottom: 24px;
    }

    /* ── Feed items (shared with practice-log) ───────────────────────────────── */
    .feed-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .feed-item:last-child { border-bottom: none; }
    .feed-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      flex-shrink: 0;
      letter-spacing: .02em;
    }
    .feed-body { flex: 1; min-width: 0; }
    .feed-text {
      font-size: 0.87rem;
      color: var(--text);
      line-height: 1.4;
    }
    .feed-text strong { color: #fff; font-weight: 700; }
    .feed-text .feed-duration { color: var(--accent); font-weight: 700; }
    .feed-time {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .feed-empty {
      text-align: center;
      padding: 40px 0;
      color: var(--text-muted);
      font-size: 0.87rem;
      line-height: 1.6;
    }

    /* Achievement mini-badge */
    .feed-ach-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border-radius: 10px;
      padding: 7px 10px;
      margin-top: 5px;
      border: 1px solid;
      max-width: 100%;
    }
    .feed-ach-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.2rem; }
    .feed-ach-name { font-size: 0.78rem; font-weight: 700; line-height: 1.2; }
    .feed-ach-desc { font-size: 0.68rem; color: var(--text-muted); line-height: 1.3; margin-top: 1px; }

    /* Reaction button */
    .feed-react-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: 1px solid transparent;
      border-radius: 20px;
      padding: 3px 8px;
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color .15s, color .15s, background .15s;
      margin-top: 4px;
      line-height: 1;
      font-family: inherit;
    }
    .feed-react-btn:hover { border-color: var(--border); color: #e879a0; }
    .feed-react-btn.reacted { color: #e879a0; border-color: rgba(232,121,160,.3); background: rgba(232,121,160,.08); }
    .feed-react-btn .react-count { font-weight: 600; }

    /* See more */
    .see-more-btn {
      display: block;
      width: 100%;
      margin: 4px 0 8px;
      padding: 10px;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text-muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color .15s, color .15s;
      text-align: center;
      font-family: inherit;
    }
    .see-more-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Monthly champions */
    .monthly-champs-card {
      background: linear-gradient(135deg, rgba(245,158,11,.12), rgba(236,72,153,.08));
      border: 1px solid rgba(245,158,11,.25);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .monthly-champs-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: #FFD700;
      margin-bottom: 12px;
      letter-spacing: .02em;
    }
    .monthly-champs-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .monthly-champ-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }
    .monthly-champ-medal { font-size: 1.1rem; width: 24px; text-align: center; }
    .monthly-champ-name  { flex: 1; font-weight: 600; color: var(--text); }
    .monthly-champ-time  { font-size: 0.75rem; color: var(--text-muted); }
    .monthly-champs-sub  { font-size: 0.68rem; color: var(--text-muted); text-align: right; }
  </style>
</head>
<body>

  <header id="app-header" style="display:none"></header>

  <main>
    <div id="community-main" style="display:none">

      <!-- Page header -->
      <div class="community-page-hdr">
        <h2>Community</h2>
        <p>See what your fellow Practice Room members have been up to.</p>
      </div>

      <!-- Post composer (coming soon) -->
      <div class="composer-card">
        <div class="composer-label">Share something</div>
        <div class="post-type-row">
          <button class="post-type-btn" data-type="progress" onclick="selectPostType(this)">📈 Share Your Progress</button>
          <button class="post-type-btn" data-type="feedback" onclick="selectPostType(this)">🎹 Get Feedback</button>
          <button class="post-type-btn" data-type="question" onclick="selectPostType(this)">💬 Ask a Question</button>
          <button class="post-type-btn" data-type="post" onclick="selectPostType(this)">✏️ Just Post</button>
        </div>
        <div class="composer-textarea-wrap" id="composer-textarea-wrap">
          <textarea class="composer-textarea" id="composer-textarea" placeholder="What's on your mind?"></textarea>
          <div class="composer-footer">
            <span class="composer-type-label" id="composer-type-label"></span>
            <button class="btn btn-sm" id="composer-submit-btn" onclick="submitPost()">Post</button>
          </div>
        </div>
        <div class="composer-coming-soon" id="composer-coming-soon">Posts &amp; threads coming soon — for now you can see everyone's recent practice activity below.</div>
      </div>

      <!-- Activity feed -->
      <div class="feed-section-hdr">
        <div class="feed-section-title">Recent Activity</div>
        <span class="feed-section-sub">Last 14 days</span>
      </div>
      <div class="feed-card">
        <div id="community-feed-list">
          <div class="feed-item" style="border:none;padding:20px 0">
            <div style="width:100%;text-align:center;color:var(--text-muted);font-size:0.85rem">
              <div class="loading-spinner" style="margin:0 auto 10px"></div>
              Loading feed…
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

<script>
// ── Supabase ──────────────────────────────────────────────────────────────────
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db = supabase.createClient(SUPA_URL, SUPA_ANON);

// ── State ─────────────────────────────────────────────────────────────────────
const OWNER_EMAIL = "matthew@matthewcawood.com";
const LB_EXCLUDED = new Set(["matthew@matthewcawood.com", "mcawoodcanada@gmail.com"]);

let myEmail = null;
let myName  = null;
let isAdmin = false;

let _feedRows  = [];
let _feedPage  = 1;
const FEED_PER_PAGE = 20;

// ── Auth + init ───────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail = session.user.email;

  const { data: ae } = await db.from("allowed_emails").select("name").eq("email", myEmail).maybeSingle();
  myName  = ae?.name || myEmail.split("@")[0];
  isAdmin = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "community" });

  document.getElementById("community-main").style.display = "";

  await loadFeed();
})();

// ── Helpers ───────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

function formatMinutes(mins) {
  if (!mins || mins <= 0) return "0 min";
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  if (h === 0) return `${m} min`;
  if (m === 0) return `${h}h`;
  return `${h}h ${m}m`;
}

function feedRelativeTime(ts) {
  if (!ts) return "";
  const diff  = Date.now() - new Date(ts).getTime();
  const mins  = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  const days  = Math.floor(diff / 86400000);
  if (mins  <  2)  return "just now";
  if (mins  < 60)  return `${mins} minutes ago`;
  if (hours <  2)  return "1 hour ago";
  if (hours < 24)  return `${hours} hours ago`;
  if (days  === 1) return "yesterday";
  return `${days} days ago`;
}

function avatarColour(email) {
  const PALETTES = [
    { bg:"rgba(59,130,246,.2)",  fg:"#93c5fd" },
    { bg:"rgba(245,158,11,.18)", fg:"#fcd34d" },
    { bg:"rgba(16,185,129,.18)", fg:"#6ee7b7" },
    { bg:"rgba(139,92,246,.2)",  fg:"#c4b5fd" },
    { bg:"rgba(249,115,22,.18)", fg:"#fdba74" },
    { bg:"rgba(236,72,153,.18)", fg:"#f9a8d4" },
    { bg:"rgba(6,182,212,.18)",  fg:"#67e8f9" },
    { bg:"rgba(132,204,22,.18)", fg:"#bef264" },
  ];
  let hash = 0;
  for (const c of (email || "")) hash = (hash * 31 + c.charCodeAt(0)) & 0xffffffff;
  return PALETTES[Math.abs(hash) % PALETTES.length];
}

// ── Feed loading ──────────────────────────────────────────────────────────────
async function loadFeed() {
  const list = document.getElementById("community-feed-list");

  const dayOfMonth = new Date().getDate();
  const championsPromise = dayOfMonth <= 7
    ? db.rpc("get_last_month_leaderboard")
    : Promise.resolve({ data: [] });

  const [feedResult, champResult] = await Promise.all([
    db.rpc("get_activity_feed", { p_email: myEmail }),
    championsPromise,
  ]);

  if (feedResult.error) {
    list.innerHTML = `<div class="feed-empty">Community feed coming soon.</div>`;
    return;
  }

  // Monthly champions HTML
  let champHTML = "";
  const champs = (champResult.data || [])
    .filter(r => !LB_EXCLUDED.has(r.email?.toLowerCase()))
    .slice(0, 3);

  if (champs.length > 0) {
    const now       = new Date();
    const lastMonth = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const monthName = lastMonth.toLocaleString("default", { month: "long" });
    const MEDALS       = ["🥇", "🥈", "🥉"];
    champHTML = `
      <div class="monthly-champs-card">
        <div class="monthly-champs-title">🏆 ${escHtml(monthName)} Champions</div>
        <div class="monthly-champs-list">
          ${champs.map((r, i) => `
            <div class="monthly-champ-row">
              <span class="monthly-champ-medal">${MEDALS[i]}</span>
              <span class="monthly-champ-name">${escHtml(r.name || r.email.split("@")[0])}</span>
              <span class="monthly-champ-time">${formatMinutes(Number(r.total_minutes) || 0)}</span>
            </div>`).join("")}
        </div>
        <div class="monthly-champs-sub">Practice time logged in ${escHtml(monthName)}</div>
      </div>`;
  }

  _feedRows = (feedResult.data || []).filter(r => !LB_EXCLUDED.has(r.email?.toLowerCase()));
  _feedPage = 1;

  renderFeedPage(list, champHTML);
}

function renderFeedPage(listEl, champHTML = "") {
  const list = listEl || document.getElementById("community-feed-list");
  if (!list) return;

  if (!_feedRows.length) {
    list.innerHTML = (champHTML || "") + '<div class="feed-empty">No activity in the last 14 days.</div>';
    return;
  }

  const visible = _feedRows.slice(0, _feedPage * FEED_PER_PAGE);
  const hasMore = visible.length < _feedRows.length;

  list.innerHTML = (champHTML || "") +
    visible.map(row => feedItemHTML(row)).join("") +
    (hasMore
      ? `<button class="see-more-btn" onclick="loadMoreFeed()">Show 20 more <span style="opacity:.6">(${_feedRows.length - visible.length} remaining)</span></button>`
      : "");
}

function loadMoreFeed() {
  _feedPage++;
  renderFeedPage();
  const btn = document.getElementById("community-feed-list")?.querySelector(".see-more-btn");
  if (btn) btn.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

function feedItemHTML(row) {
  const name     = row.name || row.email.split("@")[0];
  const initials = name.split(" ").map(w => w[0]).join("").toUpperCase().slice(0, 2);
  const colour   = avatarColour(row.email);
  const timeAgo  = feedRelativeTime(row.created_at || row.session_date);
  const count    = row.reaction_count || 0;
  const reacted  = row.i_reacted || false;

  const reactBtn = row.item_id != null
    ? `<button class="feed-react-btn${reacted ? " reacted" : ""}"
         data-count="${count}"
         onclick="toggleReaction(this,'${row.event_type}',${row.item_id})"
       ><svg viewBox="0 0 24 24" width="14" height="14" fill="${reacted ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="react-count">${count > 0 ? count : ""}</span></button>`
    : "";

  if (row.event_type === "achievement") {
    // Simplified achievement rendering (no heavy SVG data required)
    const aname = row.achievement_name || "Achievement";
    const adesc = row.achievement_desc || "";
    return `<div class="feed-item">
      <div class="feed-avatar" style="background:${colour.bg};color:${colour.fg}">${escHtml(initials)}</div>
      <div class="feed-body">
        <div class="feed-text">
          <strong style="color:${colour.fg}">${escHtml(name)}</strong>
          <span style="color:var(--text-muted)"> unlocked an achievement</span>
        </div>
        <div class="feed-ach-badge" style="background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)">
          <span class="feed-ach-icon">🏅</span>
          <div>
            <div class="feed-ach-name" style="color:#fcd34d">${escHtml(aname)}</div>
            ${adesc ? `<div class="feed-ach-desc">${escHtml(adesc)}</div>` : ""}
          </div>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px">
          <div class="feed-time">${timeAgo}</div>
          ${reactBtn}
        </div>
      </div>
    </div>`;
  }

  const duration = formatMinutes(row.duration_minutes || 0);
  return `<div class="feed-item">
    <div class="feed-avatar" style="background:${colour.bg};color:${colour.fg}">${escHtml(initials)}</div>
    <div class="feed-body">
      <div class="feed-text">
        <strong style="color:${colour.fg}">${escHtml(name)}</strong> logged <span class="feed-duration">${duration}</span>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px">
        <div class="feed-time">${timeAgo}</div>
        ${reactBtn}
      </div>
    </div>
  </div>`;
}

async function toggleReaction(btn, eventType, itemId) {
  const wasReacted = btn.classList.contains("reacted");
  let count = parseInt(btn.dataset.count) || 0;
  const newCount = wasReacted ? Math.max(0, count - 1) : count + 1;

  // Optimistic update
  btn.classList.toggle("reacted", !wasReacted);
  btn.dataset.count = newCount;
  btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="${!wasReacted ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="react-count">${newCount > 0 ? newCount : ""}</span>`;

  const { error } = await db.rpc("toggle_feed_reaction", {
    p_reactor: myEmail,
    p_event_type: eventType,
    p_item_id: itemId
  });

  if (error) {
    // Revert on failure
    btn.classList.toggle("reacted", wasReacted);
    btn.dataset.count = count;
    btn.innerHTML = `<svg viewBox="0 0 24 24" width="14" height="14" fill="${wasReacted ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg><span class="react-count">${count > 0 ? count : ""}</span>`;
    console.warn("Reaction failed:", error.message);
  }
}

// ── Composer ──────────────────────────────────────────────────────────────────
let _selectedPostType = null;
const POST_TYPE_LABELS = {
  progress: "Sharing your progress",
  feedback: "Asking for feedback",
  question: "Asking a question",
  post:     "Just posting"
};

function selectPostType(btn) {
  const type = btn.dataset.type;

  if (_selectedPostType === type) {
    // Deselect
    _selectedPostType = null;
    btn.classList.remove("active");
    document.getElementById("composer-textarea-wrap").classList.remove("visible");
    document.getElementById("composer-coming-soon").style.display = "";
    return;
  }

  // Select new type
  _selectedPostType = type;
  document.querySelectorAll(".post-type-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");

  document.getElementById("composer-type-label").textContent = POST_TYPE_LABELS[type] || "";
  document.getElementById("composer-textarea-wrap").classList.add("visible");
  document.getElementById("composer-coming-soon").style.display = "none";
  document.getElementById("composer-textarea").focus();
}
