async function _uploadVideoToMux(file) {
  if (!file || !file.type.startsWith("video/")) { alert("Please select a video file."); return; }
  if (_muxUploading) { alert("A video upload is already in progress."); return; }

  // Close the video panel and show the persistent overlay in the composer
  _videoUrlPanelOpen = false;
  document.getElementById("composer-video-url-panel").style.display = "none";
  document.getElementById("toolbar-video-btn").classList.remove("recording");
  _setMuxOverlay({ show: true, filename: file.name, pct: 0, status: "Getting upload URL…" });

  _muxUploading = true;
  try {
    // Step 1: get a direct Mux upload URL from our edge function
    const token = (await db.auth.getSession()).data.session?.access_token;
    console.log("[Mux] Requesting upload URL…");
    const createRes = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ action: "create-mux-upload" })
    });
    const createText = await createRes.text();
    console.log("[Mux] create-mux-upload response:", createRes.status, createText);
    let createData;
    try { createData = JSON.parse(createText); } catch { throw new Error("Bad response from server: " + createText); }
    if (createData.error) throw new Error(JSON.stringify(createData.error));
    const { uploadId, uploadUrl } = createData;
    if (!uploadUrl) throw new Error("No upload URL returned from server");

    // Step 2: PUT the file directly to Mux with XHR for progress
    _setMuxOverlay({ pct: 0, status: "Uploading… 0%" });
    console.log("[Mux] Starting upload…");
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", uploadUrl);
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          console.log("[Mux] Upload progress:", pct + "%");
          _setMuxOverlay({ pct, status: `Uploading… ${pct}%` });
        }
      };
      xhr.onload = () => {
        console.log("[Mux] Upload complete, status:", xhr.status);
        xhr.status < 300 ? resolve() : reject(new Error("Upload failed (" + xhr.status + ")"));
      };
      xhr.onerror = () => reject(new Error("Network error during upload"));
      xhr.send(file);
    });

    // Step 3: poll for Mux to finish processing
    const barEl = document.getElementById("mux-overlay-bar");
    if (barEl) barEl.classList.add("processing");
    _setMuxOverlay({ pct: 100, status: "Queuing for processing…" });
    console.log("[Mux] Upload done, polling for processing completion. uploadId:", uploadId);

    const processingMessages = [
      { after: 0,   msg: "Queuing for processing…" },
      { after: 10,  msg: "Encoding video…" },
      { after: 30,  msg: "Still encoding — larger videos take a minute or two…" },
      { after: 60,  msg: "Almost there, finishing up…" },
      { after: 120, msg: "This is taking longer than usual, but it's still going…" },
    ];

    let playbackId = null, muxAssetId = null;
    const pollStart = Date.now();
    for (let i = 0; i < 72; i++) {  // up to ~6 min
      await new Promise(r => setTimeout(r, 5000));
      const elapsed = Math.round((Date.now() - pollStart) / 1000);

      // Pick the most relevant message for how long we've been waiting
      const msg = processingMessages.filter(m => elapsed >= m.after).pop()?.msg;
      if (msg) _setMuxOverlay({ status: msg });

      const statusRes = await fetch("/api/daily", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ action: "get-mux-upload-status", uploadId })
      });
      const s = await statusRes.json();
      console.log(`[Mux] Poll ${i + 1} (${elapsed}s): uploadStatus=${s.status} assetStatus=${s.assetStatus} playbackId=${s.playbackId}`);
      if (s.playbackId) { playbackId = s.playbackId; muxAssetId = s.assetId; break; }
      if (s.status === "errored" || s.assetStatus === "errored") throw new Error("Mux reported an error processing the video");
    }
    if (!playbackId) throw new Error("Video processing timed out after 6 minutes — try again");

    console.log("[Mux] Done! playbackId:", playbackId);
    // Success state
    if (barEl) { barEl.classList.remove("processing"); barEl.style.background = "#10b981"; }
    _setMuxOverlay({ pct: 100, status: "✓ Video ready!", filename: file.name });
    await new Promise(r => setTimeout(r, 1500));
    _setMuxOverlay({ show: false });
    _composerMedia.push({ type: "mux", playbackId, assetId: muxAssetId, name: file.name });
    _renderMediaPreview();

  } catch (e) {
    console.error("[Mux] Upload error:", e);
    // Show error in the overlay — keep bar where it was, turn it red
    _setMuxOverlay({ show: true, filename: "❌ Upload failed", status: e.message, processing: false });
    const barEl = document.getElementById("mux-overlay-bar");
    if (barEl) barEl.style.background = "#ef4444";
    // Add a dismiss button
    const statusEl = document.getElementById("mux-overlay-status");
    if (statusEl) statusEl.innerHTML =
      escHtml(e.message) +
      `<br><button onclick="_setMuxOverlay({show:false});_muxUploading=false;_resetVideoDropzone()"
        style="margin-top:8px;background:rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.12);
        border-radius:6px;color:#fff;cursor:pointer;font-size:.75rem;padding:4px 10px">Dismiss</button>`;
    return; // don't run finally's _muxUploading = false yet — dismiss button handles it
  } finally {
    _muxUploading = false;
  }
}

function addVideoUrl() {

  const ytId = parseYouTubeId(val);
  const viId = parseVimeoId(val);

async function toggleVoiceRecording() {
  if (_recordingType === "voice") {
    _stopRecording(); return;
  }
  if (_recordingType) { alert("Already recording. Stop the current recording first."); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    _startRecording(stream, "voice");
  } catch (e) { alert("Could not access microphone: " + e.message); }
}

let _previewStream = null;

async function toggleVideoRecording() {
  // If already recording video, stop it
  if (_recordingType === "video") { _stopRecording(); return; }
  if (_recordingType) { alert("Already recording. Stop the current recording first."); return; }

  // If preview panel is already open, close it
  const panel = document.getElementById("video-rec-panel");
  if (panel.style.display !== "none") { cancelVideoPreview(); return; }

  try {
    // Get initial stream with defaults
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { aspectRatio: 16/9 } });
    _previewStream = stream;

    // Show live preview
    const preview = document.getElementById("video-rec-preview");
    preview.srcObject = stream;
    panel.style.display = "";
    document.getElementById("toolbar-videorec-btn").classList.add("recording");

    // Enumerate devices now that we have permission
    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === "videoinput");
    const mics    = devices.filter(d => d.kind === "audioinput");

    const camSel = document.getElementById("video-rec-camera");
    const micSel = document.getElementById("video-rec-mic");

    // Get current track labels to pre-select
    const activeVideoLabel = stream.getVideoTracks()[0]?.label || "";
    const activeAudioLabel = stream.getAudioTracks()[0]?.label || "";

    camSel.innerHTML = cameras.map(d =>
      `<option value="${d.deviceId}" ${d.label === activeVideoLabel ? "selected" : ""}>${d.label || "Camera " + (cameras.indexOf(d)+1)}</option>`
    ).join("");
    micSel.innerHTML = mics.map(d =>
      `<option value="${d.deviceId}" ${d.label === activeAudioLabel ? "selected" : ""}>${d.label || "Mic " + (mics.indexOf(d)+1)}</option>`
    ).join("");

  } catch (e) {
    alert("Could not access camera/mic: " + e.message);
    document.getElementById("toolbar-videorec-btn").classList.remove("recording");
  }
}

async function switchCamera() {
  if (!_previewStream) return;
  const camSel = document.getElementById("video-rec-camera");
  const micSel = document.getElementById("video-rec-mic");
  const videoId = camSel.value;
  const audioId = micSel.value;

  // Stop existing tracks
  _previewStream.getTracks().forEach(t => t.stop());

  try {
    const constraints = {
      video: videoId ? { deviceId: { exact: videoId } } : true,
      audio: audioId ? { deviceId: { exact: audioId } } : true
    };
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    _previewStream = stream;
    document.getElementById("video-rec-preview").srcObject = stream;
  } catch (e) {
    alert("Could not switch device: " + e.message);
  }
}

function startVideoRecordingFromPreview() {
  if (!_previewStream) return;
  // Keep the preview panel open so they can see themselves while recording
  document.getElementById("video-rec-devices").style.display = "none";
  document.getElementById("video-rec-actions").style.display  = "none";
  document.getElementById("video-rec-recording-bar").style.display = "";
  _startRecording(_previewStream, "video");
  _previewStream = null; // ownership transferred to recorder
}

function cancelVideoPreview() {
  if (_previewStream) { _previewStream.getTracks().forEach(t => t.stop()); _previewStream = null; }
  const preview = document.getElementById("video-rec-preview");
  preview.srcObject = null;
  document.getElementById("video-rec-panel").style.display = "none";
  document.getElementById("toolbar-videorec-btn").classList.remove("recording");
}

function _startRecording(stream, type) {
  _recordingType = type;
  const chunks = [];
  const mr = new MediaRecorder(stream);
  mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const mime = mr.mimeType || (type === "voice" ? "audio/webm" : "video/webm");
    const blob = new Blob(chunks, { type: mime });
    const name = `${type}-${Date.now()}.webm`;
    const duration = _recordingStart ? Math.round((Date.now() - _recordingStart) / 1000) : 0;
    clearInterval(_recordingTimer); _recordingTimer = null;
    document.getElementById("composer-recording-indicator").style.display = "none";
    const btnId = type === "voice" ? "toolbar-voice-btn" : "toolbar-videorec-btn";
    document.getElementById(btnId)?.classList.remove("recording");
    _recordingType = null; _voiceRecorder = null; _videoRecorder = null;

    if (type === "video") {
      // Hide and reset the preview panel
      const panel = document.getElementById("video-rec-panel");
      panel.style.display = "none";
      document.getElementById("video-rec-devices").style.display      = "";
      document.getElementById("video-rec-actions").style.display       = "";
      document.getElementById("video-rec-recording-bar").style.display = "none";
      document.getElementById("video-rec-preview").srcObject = null;
      // Route through Mux so large recordings are handled properly
      const file = new File([blob], name, { type: mime });
      _uploadVideoToMux(file);
    } else {
      // Voice recordings are small — store in Supabase Storage as before
      const url = URL.createObjectURL(blob);
      _composerMedia.push({ type: "audio", url, name, blob, duration });
      _renderMediaPreview();
    }
  };
  if (type === "voice") _voiceRecorder = mr; else _videoRecorder = mr;
  mr.start();
  _recordingStart = Date.now();
  const btnId = type === "voice" ? "toolbar-voice-btn" : "toolbar-videorec-btn";
  document.getElementById(btnId)?.classList.add("recording");
  const label = type === "voice" ? "Recording voice…" : "Recording video…";
  document.getElementById("composer-recording-label").textContent = label;
  document.getElementById("composer-recording-time").textContent  = "0:00";
  document.getElementById("composer-recording-indicator").style.display = "";
  _recordingTimer = setInterval(() => {
    const secs = Math.round((Date.now() - _recordingStart) / 1000);
    const m = Math.floor(secs / 60), s = secs % 60;
    const ts = `${m}:${String(s).padStart(2,"0")}`;
    document.getElementById("composer-recording-time").textContent = ts;
    const inPanel = document.getElementById("video-rec-timer");
    if (inPanel) inPanel.textContent = ts;
  }, 1000);
}

function _stopRecording() {
  if (_voiceRecorder && _voiceRecorder.state !== "inactive") _voiceRecorder.stop();
  if (_videoRecorder && _videoRecorder.state !== "inactive") _videoRecorder.stop();
}

// ── Media preview rendering ───────────────────────────────────────────────────
function _renderMediaPreview() {
  const area = document.getElementById("composer-media-preview");
  if (!_composerMedia.length) { area.innerHTML = ""; return; }
  const images = _composerMedia.filter(m => m.type === "image");
  const others = _composerMedia.filter(m => m.type !== "image");
  let html = "";
  if (images.length) {
    html += `<div class="media-preview-images">` +
      images.map((m, i) => {
        const idx = _composerMedia.indexOf(m);
        return `<div class="media-thumb-wrap">
          <img src="${m.url}" alt="${escHtml(m.name)}" />
          <button class="media-thumb-remove" onclick="removeMedia(${idx})" title="Remove">×</button>
        </div>`;
      }).join("") + `</div>`;
  }
  others.forEach(m => {
    const idx = _composerMedia.indexOf(m);
    // Mux videos get a real player preview
    if (m.type === "mux") {
      html += `<div class="media-preview-video-wrap">
        <div class="mux-wrap"><mux-player playback-id="${escHtml(m.playbackId)}" controls></mux-player></div>
        <button class="media-video-remove" onclick="removeMedia(${idx})" title="Remove">× Remove</button>
      </div>`;
      return;
    }
    const _clipSvg = `<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>`;
    let icon = _clipSvg, label = escHtml(m.name);
    if (m.type === "audio")     { icon = "🎙️"; label = `Voice message${m.duration ? " · " + m.duration + "s" : ""}`; }
    if (m.type === "video")     { icon = "🎬"; }
    if (m.type === "youtube")   { icon = "▶️"; label = `YouTube · ${escHtml(m.ytId)}`; }
    if (m.type === "vimeo")     { icon = "▶️"; label = `Vimeo · ${escHtml(m.vimeoId)}`; }
    if (m.type === "video-url") { icon = "🎬"; }
    if (m.type === "code")      { icon = "</>"; label = escHtml((m.html || "").slice(0, 30)) + "…"; }
    html += `<span class="media-chip">${icon} ${label}<button class="media-chip-remove" onclick="removeMedia(${idx})" title="Remove">×</button></span>`;
  });
  area.innerHTML = html;
}

async function _deleteMuxAsset(assetId) {
  if (!assetId) return;
  try {
    const token = (await db.auth.getSession()).data.session?.access_token;
    await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ action: "delete-mux-asset", assetId })
    });
  } catch (e) { console.warn("Mux asset delete failed:", e); }
}

function removeMedia(idx) {
  const m = _composerMedia[idx];
  if (m?.type === "mux" && m.assetId) _deleteMuxAsset(m.assetId);
  _composerMedia.splice(idx, 1);
  _renderMediaPreview();
}

// ── Submit post (rich) ────────────────────────────────────────────────────────
async function submitPost() {
  if (_muxUploading) { alert("Please wait for the video upload to finish."); return; }
  const title   = document.getElementById("composer-title").value.trim();
  const content = document.getElementById("composer-content").value.trim();
  if (!title)   { alert("Please add a title."); document.getElementById("composer-title").focus(); return; }
  if (!content) { alert("Please add some content."); document.getElementById("composer-content").focus(); return; }
  if (!_selectedType) { alert("Please choose a post type."); return; }

  // Collect poll data if builder open
  let pollData = null;
  if (_pollBuilderOpen) {
    const q = document.getElementById("poll-question-input").value.trim();
    const opts = Array.from(document.querySelectorAll("#poll-options-list .poll-option-input"))
      .map(i => i.value.trim()).filter(Boolean);
    if (q && opts.length >= 2) pollData = { question: q, options: opts };
  }

  // Collect code if panel open
  if (_codePanelOpen) {
    const html = document.getElementById("composer-code-input").value.trim();
    if (html) _composerMedia.push({ type: "code", html, name: "Code embed" });
  }

  const btn = document.getElementById("composer-submit");
  btn.disabled = true; btn.textContent = "Posting…";

  // Upload blobs to storage
  const mediaJson = [];
  try {
    for (const m of _composerMedia) {
      if (m.type === "mux") {
        // Already uploaded to Mux — just store the playback ID
        mediaJson.push({ type: "mux", playbackId: m.playbackId, assetId: m.assetId, name: m.name });
      } else if (m.blob) {
        const publicUrl = await uploadToStorage(m.blob, m.name);
        const entry = { type: m.type, url: publicUrl, name: m.name };
        if (m.duration) entry.duration = m.duration;
        mediaJson.push(entry);
      } else {
        const entry = { type: m.type, url: m.url, name: m.name };
        if (m.ytId)     entry.ytId     = m.ytId;
        if (m.vimeoId)  entry.vimeoId  = m.vimeoId;
        if (m.html)     entry.html     = m.html;
        if (m.duration) entry.duration = m.duration;
        mediaJson.push(entry);
      }
    }
  } catch (e) {
    btn.disabled = false; btn.textContent = "Post";
    alert("Failed to upload media: " + e.message); return;
  }

  const { data: post, error } = await db.from("community_posts").insert({
    email: myEmail, name: myName, type: _selectedType, title, content,
    media: mediaJson
  }).select().single();

  if (error) {
    btn.disabled = false; btn.textContent = "Post";
    alert("Couldn't post: " + error.message); return;
  }

  // Insert poll
  if (pollData && post) {
    const { data: pollRow } = await db.from("community_post_polls").insert({
      post_id: post.id, question: pollData.question
    }).select().single();
    if (pollRow) {
      await db.from("community_post_poll_options").insert(
        pollData.options.map((label, i) => ({ poll_id: pollRow.id, label, position: i }))
      );
    }
  }

  btn.disabled = false; btn.textContent = "Post";
  _resetComposer();
  await loadPosts();
}

// ── Posts ─────────────────────────────────────────────────────────────────────
async function loadPosts() {
  const list = document.getElementById("posts-list");
  list.innerHTML = '<div class="posts-empty"><div class="loading-spinner" style="margin:0 auto 12px"></div>Loading posts…</div>';

  const { data: posts, error } = await db
    .from("community_posts")
    .select("*")
    .order("created_at", { ascending: false })
    .limit(100);

  if (error || !posts) {
    list.innerHTML = '<div class="posts-empty">Could not load posts.</div>';
    return;
  }

  if (!posts.length) {
    list.innerHTML = `<div class="posts-empty">No posts yet — be the first to share something! 👆</div>`;
    return;
  }

  // Fetch like counts, comment counts, poll info in parallel
  const ids = posts.map(p => p.id);
  const [{ data: allLikes }, { data: myLikes }, { data: commentCounts }, { data: polls }] = await Promise.all([
    db.from("community_post_likes").select("post_id,email").in("post_id", ids),
    db.from("community_post_likes").select("post_id").eq("email", myEmail).in("post_id", ids),
    db.from("community_post_comments").select("post_id").in("post_id", ids),
    db.from("community_post_polls").select("post_id,question,id").in("post_id", ids)
  ]);

  const likeCountMap    = {};
  const likersMap       = {}; // post_id → [email, ...]  (up to 3)
  const commentCountMap = {};
  const pollMap         = {};
  const myLikeSet       = new Set((myLikes || []).map(l => l.post_id));

  (allLikes || []).forEach(l => {
    likeCountMap[l.post_id] = (likeCountMap[l.post_id] || 0) + 1;
    if (!likersMap[l.post_id]) likersMap[l.post_id] = [];
    if (likersMap[l.post_id].length < 3) likersMap[l.post_id].push(l.email);
  });
  (commentCounts|| []).forEach(c => commentCountMap[c.post_id] = (commentCountMap[c.post_id] || 0) + 1);
  (polls        || []).forEach(p => pollMap[p.post_id]         = { id: p.id, question: p.question });

  // Fetch full poll data (options + votes) for inline rendering
  const pollIds = (polls || []).map(p => p.id);
  if (pollIds.length) {
    const [{ data: optRows }, { data: voteRows }, { data: myVoteRows }] = await Promise.all([
      db.from("community_post_poll_options").select("id,poll_id,label,position").in("poll_id", pollIds).order("position"),
      db.from("community_post_poll_votes").select("poll_id,option_id").in("poll_id", pollIds),
      db.from("community_post_poll_votes").select("poll_id,option_id").eq("email", myEmail).in("poll_id", pollIds)
    ]);
    const optsByPoll = {}, voteCountsByPoll = {}, totalByPoll = {}, myVoteByPoll = {};
    (optRows     || []).forEach(o => { (optsByPoll[o.poll_id] = optsByPoll[o.poll_id] || []).push(o); });
    (voteRows    || []).forEach(v => {
      if (!voteCountsByPoll[v.poll_id]) voteCountsByPoll[v.poll_id] = {};
      voteCountsByPoll[v.poll_id][v.option_id] = (voteCountsByPoll[v.poll_id][v.option_id] || 0) + 1;
      totalByPoll[v.poll_id] = (totalByPoll[v.poll_id] || 0) + 1;
    });
    (myVoteRows  || []).forEach(v => { myVoteByPoll[v.poll_id] = v.option_id; });
    Object.values(pollMap).forEach(pm => {
      pm.options     = optsByPoll[pm.id]      || [];
      pm.voteCounts  = voteCountsByPoll[pm.id] || {};
      pm.totalVotes  = totalByPoll[pm.id]      || 0;
      pm.myVote      = myVoteByPoll[pm.id]     || null;
      pm.optionCount = pm.options.length;
    });
  }

  // Fetch avatar URLs + badges for all post authors
  const allEmails = [...new Set(posts.map(p => p.email))];
  const { data: avatarRows } = await db.from("allowed_emails")
    .select("email,avatar_url,badge").in("email", allEmails);
  const avatarUrlMap = {};
  const badgeMap     = {};
  (avatarRows || []).forEach(r => {
    if (r.avatar_url) avatarUrlMap[r.email] = r.avatar_url;
    if (r.badge)      badgeMap[r.email]     = r.badge;
  });

  _posts = posts.map(p => ({
    ...p,
    likeCount:    likeCountMap[p.id]    || 0,
    commentCount: commentCountMap[p.id] || 0,
    iLiked:       myLikeSet.has(p.id),
    likers:       likersMap[p.id]       || [],
    poll:         pollMap[p.id]         || null,
    avatarUrl:    avatarUrlMap[p.email] || null,
    badge:        badgeMap[p.email]     || null
  }));

  _renderFilteredPosts();
}

function postCardHTML(p) {
  const pt      = POST_TYPES[p.type] || POST_TYPES.post;
  const name    = escHtml(p.name || p.email.split("@")[0]);
  const timeAgo = relativeTime(p.created_at);
  const PREVIEW = 200;
  const content = p.content || "";
  const preview = content.length > PREVIEW
    ? escHtml(content.slice(0, PREVIEW)) + `<span class="post-see-more">… See more</span>`
    : escHtml(content);

  const likeIcon = p.iLiked
    ? `<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`
    : `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;

  // Build media section for card (list view) — render everything inline
  let mediaHtml = "";
  const media = p.media || [];
  const images = media.filter(m => m.type === "image");
  if (images.length) {
    const shown = images.slice(0, 2);
    mediaHtml += `<div class="post-media-strip">${shown.map(m =>
      `<img src="${escHtml(m.url)}" alt="${escHtml(m.name)}" loading="lazy" />`
    ).join("")}</div>`;
  }
  // Inline richMedia — all non-image types
  let richMedia = "";
  const fileChips = [];
  media.forEach(m => {
    if (m.type === "audio") {
      const dur = m.duration ? ` · ${m.duration}s` : "";
      richMedia += `<div class="post-card-inline-media" onclick="event.stopPropagation()">
        <div class="post-card-media-label">🎙️ Voice message${escHtml(dur)}</div>
        <audio controls src="${escHtml(m.url)}" style="width:100%"></audio>
      </div>`;
    } else if (m.type === "mux") {
      richMedia += `<div class="post-card-inline-media post-card-video" onclick="event.stopPropagation()">
        <div class="mux-wrap"><mux-player playback-id="${escHtml(m.playbackId)}" controls></mux-player></div>
      </div>`;
    } else if (m.type === "video") {
      richMedia += `<div class="post-card-inline-media post-card-video" onclick="event.stopPropagation()">
        <video controls src="${escHtml(m.url)}" style="width:100%;max-height:360px;border-radius:8px"></video>
      </div>`;
    } else if (m.type === "youtube") {
      const ytId = escHtml(m.ytId || "");
      richMedia += `<div class="post-card-inline-media post-card-embed" onclick="event.stopPropagation()">
        <iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen loading="lazy"></iframe>
      </div>`;
    } else if (m.type === "vimeo") {
      const viId = escHtml(m.vimeoId || "");
      richMedia += `<div class="post-card-inline-media post-card-embed" onclick="event.stopPropagation()">
        <iframe src="https://player.vimeo.com/video/${viId}" allowfullscreen loading="lazy"></iframe>
      </div>`;
    } else if (m.type === "video-url") {
      richMedia += `<div class="post-card-inline-media" onclick="event.stopPropagation()">
        <a href="${escHtml(m.url)}" target="_blank" rel="noopener" class="post-card-link">🎬 ${escHtml(m.url)}</a>
      </div>`;
    } else if (m.type === "code") {
      const safeHtml = escHtml(m.html || "");
      richMedia += `<div class="post-card-inline-media" onclick="event.stopPropagation()">
        <div class="post-card-media-label">&lt;/&gt; Code embed</div>
        <iframe sandbox="allow-scripts" srcdoc="${safeHtml}"
          style="width:100%;min-height:140px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2)"></iframe>
      </div>`;
    } else if (m.type === "file") {
      fileChips.push(`<a href="${escHtml(m.url)}" target="_blank" rel="noopener"
        class="post-media-chip" onclick="event.stopPropagation()" style="text-decoration:none;display:inline-flex;align-items:center;gap:5px"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>${escHtml(m.name)}</a>`);
    }
  });
  if (richMedia) mediaHtml += richMedia;
  const fileChipsHtml = fileChips.length ? `<div style="margin-top:8px;margin-bottom:4px">${fileChips.join("")}</div>` : "";

  // Inline poll
  if (p.poll && p.poll.options?.length) {
    const poll = p.poll;
    const hasVoted = !!poll.myVote;
    let pollHtml = `<div class="card-poll" onclick="event.stopPropagation()">
      <div class="card-poll-question">${escHtml(poll.question)}</div>`;
    if (!hasVoted) {
      pollHtml += poll.options.map(o =>
        `<button class="card-poll-btn" onclick="castCardVote('${escHtml(poll.id)}','${escHtml(o.id)}','${p.id}')">
          ${escHtml(o.label)}</button>`
      ).join("");
    } else {
      pollHtml += poll.options.map(o => {
        const count = poll.voteCounts[o.id] || 0;
        const pct   = poll.totalVotes > 0 ? Math.round(count / poll.totalVotes * 100) : 0;
        const isMine = o.id === poll.myVote;
        return `<div class="card-poll-bar-row${isMine ? " mine" : ""}" onclick="castCardVote('${escHtml(poll.id)}','${escHtml(o.id)}','${p.id}')">
          <div class="card-poll-bar-track">
            <div class="card-poll-bar-fill${isMine ? " mine" : ""}" style="width:${pct}%"></div>
          </div>
          <div class="card-poll-bar-meta">
            <span>${escHtml(o.label)}${isMine ? " <span class='card-poll-mine-dot'>●</span>" : ""}</span>
            <span class="card-poll-pct">${pct}%</span>
          </div>
        </div>`;
      }).join("");
      pollHtml += `<div class="card-poll-footer">
        <span class="card-poll-total">${poll.totalVotes} vote${poll.totalVotes !== 1 ? "s" : ""}</span>
      </div>`;
    }
    pollHtml += `</div>`;
    mediaHtml += pollHtml;
  }

  const hasMedia    = !!(images.length || richMedia);
  const clampClass  = hasMedia ? "clamp-short" : "clamp-long";
  const isTruncated = p.content.length > (hasMedia ? 120 : 400);
  const seeMore     = isTruncated ? `<span class="post-see-more-link">See more</span>` : "";

  return `
    <div class="post-card" onclick="showDetail('${p.id}')">
      <div class="post-author-row">
        <a href="/profile.html?u=${encodeURIComponent(p.email)}" onclick="event.stopPropagation()" style="display:contents;text-decoration:none">
          ${avatarHtml(p.email, p.name, 28, p.avatarUrl)}
          <span class="post-author-name" style="cursor:pointer">${name}</span>
        </a>
        ${p.badge ? `<span class="author-badge">${escHtml(p.badge)}</span>` : ""}
        <div style="margin-left:auto;display:flex;align-items:center;gap:8px;flex-shrink:0">
          <span class="post-type-badge" style="color:${pt.color};background:${pt.bg};border-color:${pt.border}">${escHtml(pt.label)}</span>
          <span class="post-author-time">${timeAgo}</span>
        </div>
      </div>
      <div class="post-title">${escHtml(p.title)}</div>
      <div class="post-preview ${clampClass}">${preview}</div>
      ${seeMore}
      ${mediaHtml}
      ${fileChipsHtml}
      <div class="post-footer" onclick="event.stopPropagation()">
        <button class="post-footer-btn ${p.iLiked ? "liked" : ""}" data-post-id="${p.id}" onclick="toggleLike(this,'${p.id}')">
          ${likeIcon}
        </button>
        <button class="post-footer-btn" onclick="showDetail('${p.id}')">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <div class="post-footer-right">
          ${p.likers.length ? `<div class="post-footer-avatars" onclick="showLikersPopover('${p.id}',event)">${p.likers.map(e => {
            const c = avatarColour(e);
            const ini = e[0].toUpperCase();
            return `<div class="post-footer-avatar" style="background:${c.bg};color:${c.fg}">${ini}</div>`;
          }).join("")}</div>` : ""}
          <span class="post-footer-meta like-count-${p.id}">
            ${p.likeCount ? `<span ${p.likeCount ? `onclick="showLikersPopover('${p.id}',event)"` : ""} style="cursor:pointer">${p.likeCount} like${p.likeCount !== 1 ? "s" : ""}</span>` : ""}
            ${p.likeCount && p.commentCount ? " · " : ""}
            ${p.commentCount ? `<span onclick="event.stopPropagation();showDetail('${p.id}')" style="cursor:pointer">${p.commentCount} comment${p.commentCount !== 1 ? "s" : ""}</span>` : ""}
          </span>
        </div>
      </div>
    </div>`;
}

// ── Like toggle ───────────────────────────────────────────────────────────────
let _likersPopover = null;

async function showLikersPopover(postId, event) {
  event.stopPropagation();
  _dismissLikersPopover();

  // Fetch all likers + their names
  const { data: likes } = await db.from("community_post_likes")
    .select("email").eq("post_id", postId);
  if (!likes?.length) return;

  const emails = likes.map(l => l.email);
  const { data: nameRows } = await db.from("allowed_emails")
    .select("email,name").in("email", emails);
  const nameMap = {};
  (nameRows || []).forEach(r => { nameMap[r.email] = r.name; });

  const rows = emails.map(e => {
    const name = nameMap[e] || e.split("@")[0];
    const c = avatarColour(e);
    return `<div class="likers-popover-row">
      <div class="likers-popover-avatar" style="background:${c.bg};color:${c.fg}">${name[0].toUpperCase()}</div>
      <span class="likers-popover-name">${escHtml(name)}</span>
    </div>`;
  }).join("");

  const pop = document.createElement("div");
  pop.className = "likers-popover";
  pop.innerHTML = `<div class="likers-popover-title">Liked by</div>${rows}`;
  document.body.appendChild(pop);
  _likersPopover = pop;

  // Position near the click, keeping it on screen
  const { clientX: x, clientY: y } = event;
  const pw = 220, ph = 48 + emails.length * 38;
  const left = Math.min(x, window.innerWidth  - pw - 12);
  const top  = Math.min(y + 8, window.innerHeight - ph - 12);
  pop.style.left = left + "px";
  pop.style.top  = top  + "px";

  setTimeout(() => document.addEventListener("click", _dismissLikersPopover, { once: true }), 0);
}

function _dismissLikersPopover() {
  if (_likersPopover) { _likersPopover.remove(); _likersPopover = null; }
}

async function toggleLike(btn, postId) {
  const isLiked  = btn.classList.contains("liked");
  const post     = _posts.find(p => p.id === postId);
  if (!post) return;

  const newLiked = !isLiked;
  const newCount = newLiked ? post.likeCount + 1 : Math.max(0, post.likeCount - 1);

  // Optimistic
  post.iLiked    = newLiked;
  post.likeCount = newCount;
  _updateLikeUI(btn, newLiked, newCount, postId);

  const { error } = newLiked
    ? await db.from("community_post_likes").insert({ post_id: postId, email: myEmail })
    : await db.from("community_post_likes").delete().eq("post_id", postId).eq("email", myEmail);

  if (error) {
    // Revert
    post.iLiked    = isLiked;
    post.likeCount = post.likeCount + (isLiked ? 1 : -1);
    _updateLikeUI(btn, isLiked, post.likeCount, postId);
  }
}

function _updateLikeUI(btn, liked, count, postId) {
  btn.classList.toggle("liked", liked);
  const svg = liked
    ? `<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`
    : `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  btn.innerHTML = svg;
  // Update the meta text (likes · comments)
  const post = _posts.find(p => p.id === postId);
  const commentCount = post?.commentCount || 0;
  const metaEl = document.querySelector(`.like-count-${postId}`);
  if (metaEl) {
    metaEl.textContent = [
      count ? count + " like" + (count !== 1 ? "s" : "") : "",
      commentCount ? commentCount + " comment" + (commentCount !== 1 ? "s" : "") : ""
    ].filter(Boolean).join(" · ");
  }
  // Also update detail view like button if open
  const detailBtn = document.getElementById(`detail-like-btn`);
  if (detailBtn && detailBtn.dataset.postId === postId) {
    _updateDetailLikeBtn(detailBtn, liked, count, postId);
  }
}

// ── Detail view ───────────────────────────────────────────────────────────────

        mediaHtml += `<video controls src="${escHtml(m.url)}" style="width:100%;max-height:360px;margin-bottom:8px"></video>`;
      } else if (m.type === "youtube") {

        mediaHtml += `<iframe src="https://www.youtube.com/embed/${ytId}" allowfullscreen></iframe>`;
      } else if (m.type === "vimeo") {
        const viId = escHtml(m.vimeoId || "");
        mediaHtml += `<iframe src="https://player.vimeo.com/video/${viId}" allowfullscreen></iframe>`;

      } else if (m.type === "file") {

          <iframe sandbox="allow-scripts" srcdoc="${safeHtml}" style="width:100%;min-height:160px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface-2)"></iframe>`;
      }
    }
    mediaHtml += `</div>`;

// ── Poll voting UI ─────────────────────────────────────────────────────────────
async function loadPollDetail(pollId) {
  const area = document.getElementById("detail-poll-area");
  if (!area) return;

  // Fetch options + votes in parallel
  const [{ data: opts }, { data: votes }, { data: pollRow }] = await Promise.all([
    db.from("community_post_poll_options").select("id,label,position").eq("poll_id", pollId).order("position"),
    db.from("community_post_poll_votes").select("option_id,email").eq("poll_id", pollId),
    db.from("community_post_polls").select("question").eq("id", pollId).single()
  ]);

  if (!opts || !pollRow) { area.innerHTML = ""; return; }

  const totalVotes = (votes || []).length;
  const myVote     = (votes || []).find(v => v.email === myEmail);
  const myOptId    = myVote ? myVote.option_id : null;
  const voteCountMap = {};
  (votes || []).forEach(v => { voteCountMap[v.option_id] = (voteCountMap[v.option_id] || 0) + 1; });

  _renderPollUI(area, pollId, pollRow.question, opts, voteCountMap, myOptId, totalVotes);
}

function _renderPollUI(area, pollId, question, opts, voteCountMap, myOptId, totalVotes) {
  const hasVoted = !!myOptId;
  let html = `<div class="poll-card">
    <div class="poll-card-question">${escHtml(question)}</div>`;

  if (!hasVoted) {
    // Show voting buttons
    html += opts.map(o => `
      <button class="poll-option-vote-btn" onclick="castVote('${escHtml(pollId)}','${escHtml(o.id)}')">
        ${escHtml(o.label)}
      </button>`).join("");
  } else {
    // Show bar chart
    html += opts.map(o => {
      const count = voteCountMap[o.id] || 0;
      const pct   = totalVotes > 0 ? Math.round(count / totalVotes * 100) : 0;
      const isMine = o.id === myOptId;
      return `<div class="poll-bar-row" onclick="castVote('${escHtml(pollId)}','${escHtml(o.id)}')">
        <div class="poll-bar-label">
          <span>${escHtml(o.label)}${isMine ? " <span style='color:#10b981;font-size:.7em'>●</span>" : ""}</span>
          <span>${pct}%</span>
        </div>
        <div class="poll-bar-track">
          <div class="poll-bar-fill${isMine ? " mine" : ""}" style="width:${pct}%"></div>
        </div>
      </div>`;
    }).join("");
    html += `<div class="poll-footer">
      <span class="poll-total">${totalVotes} vote${totalVotes !== 1 ? "s" : ""}</span>
    </div>`;
  }
  html += `</div>`;
  area.innerHTML = html;
}

// Temporarily show vote buttons so user can pick a different option
// The upsert in castVote handles overwriting the existing vote in the DB
async function changeDetailVote(pollId) {
  const area = document.getElementById("detail-poll-area");
  if (!area) return;
  const [{ data: opts }, { data: pollRow }] = await Promise.all([
    db.from("community_post_poll_options").select("id,label,position").eq("poll_id", pollId).order("position"),
    db.from("community_post_polls").select("question").eq("id", pollId).single()
  ]);
  if (!opts || !pollRow) return;
  _renderPollUI(area, pollId, pollRow.question, opts, {}, null, 0);
}

async function castVote(pollId, optionId) {
  const { error } = await db.from("community_post_poll_votes").upsert({
    poll_id: pollId, option_id: optionId, email: myEmail
  }, { onConflict: "poll_id,email" });
  if (error) { alert("Couldn't cast vote: " + error.message); return; }
  await loadPollDetail(pollId);
}

function clearCardVote(postId) {
  const post = _posts.find(p => p.id === postId);
  if (!post?.poll) return;
  post.poll.myVote = null; // locally clear — DB vote stays until they pick a new one (upsert)
  const cardEl = document.querySelector(`.post-card[onclick*="${postId}"]`);
  if (cardEl) cardEl.outerHTML = postCardHTML(post);
}

async function castCardVote(pollId, optionId, postId) {
  const { error } = await db.from("community_post_poll_votes").upsert({
    poll_id: pollId, option_id: optionId, email: myEmail
  }, { onConflict: "poll_id,email" });
  if (error) { alert("Couldn't cast vote: " + error.message); return; }
  // Refresh vote counts for this post's poll
  const post = _posts.find(p => p.id === postId);
  if (post?.poll) {
    const { data: votes } = await db.from("community_post_poll_votes").select("poll_id,option_id").eq("poll_id", pollId);
    const voteCounts = {};
    (votes || []).forEach(v => { voteCounts[v.option_id] = (voteCounts[v.option_id] || 0) + 1; });
    post.poll.voteCounts  = voteCounts;
    post.poll.totalVotes  = (votes || []).length;
    post.poll.myVote      = optionId;
    // Re-render just this card
    const cardEl = document.querySelector(`[onclick*="showDetail('${postId}')"]`);
    if (cardEl) cardEl.outerHTML = postCardHTML(post);
  }
}

async function deletePost(postId) {
  if (!confirm("Delete this post? This can't be undone.")) return;
  // Clean up any Mux assets before deleting the post
  const post = _posts.find(p => p.id === postId);
  if (post?.media) {
    const muxItems = post.media.filter(m => m.type === "mux" && m.assetId);
    await Promise.all(muxItems.map(m => _deleteMuxAsset(m.assetId)));
  }
  const { error } = await db.from("community_posts").delete().eq("id", postId);
  if (error) { alert("Couldn't delete: " + error.message); return; }
  showList();
  await loadPosts();
}

// ── Comments ──────────────────────────────────────────────────────────────────
async function loadComments(postId) {
  const listEl = document.getElementById("comments-list");
  const hdrEl  = document.getElementById("comments-hdr");
  listEl.innerHTML = '<div class="comments-empty"><div class="loading-spinner" style="margin:0 auto 8px;width:18px;height:18px"></div></div>';

  const { data: comments, error } = await db
    .from("community_post_comments")
    .select("*")
    .eq("post_id", postId)
    .order("created_at", { ascending: true });

  if (error || !comments) { listEl.innerHTML = '<div class="comments-empty">Could not load comments.</div>'; return; }

  const count = comments.length;
  hdrEl.textContent = count === 0 ? "Comments" : `${count} Comment${count !== 1 ? "s" : ""}`;

  // Update comment count in post card
  const post = _posts.find(p => p.id === postId);
  if (post) {
    post.commentCount = count;
    document.querySelectorAll(`.comment-count-${postId}`).forEach(el => el.textContent = count || "");
  }

  if (!count) { listEl.innerHTML = '<div class="comments-empty">No comments yet — be the first!</div>'; return; }

  // Fetch avatar URLs for comment authors
  const commentEmails = [...new Set(comments.map(c => c.email))];
  const { data: cmtAvatarRows } = await db.from("allowed_emails")
    .select("email,avatar_url").in("email", commentEmails);
  const cmtAvatarMap = {};
  (cmtAvatarRows || []).forEach(r => { if (r.avatar_url) cmtAvatarMap[r.email] = r.avatar_url; });

  // Build threaded structure: top-level comments + their replies
  const topLevel = comments.filter(c => !c.parent_comment_id);
  const repliesMap = {};
  comments.filter(c => c.parent_comment_id).forEach(c => {
    if (!repliesMap[c.parent_comment_id]) repliesMap[c.parent_comment_id] = [];
    repliesMap[c.parent_comment_id].push(c);
  });

  function commentHTML(c, isReply = false, threadId = null) {
    const canDel   = isAdmin || c.email === myEmail;
    const dispName = escHtml(c.name || c.email.split("@")[0]);
    const rootId   = threadId || c.id;
    const replyPrefix = (isReply && c.reply_to_name)
      ? `<span class="reply-to-name">@${escHtml(c.reply_to_name)}</span> ` : "";
    return `
      <div class="comment-item${isReply ? " is-reply" : ""}" id="comment-${c.id}">
        <a href="/profile.html?u=${encodeURIComponent(c.email)}" style="display:contents;text-decoration:none">
          ${avatarHtml(c.email, c.name, 28, cmtAvatarMap[c.email] || null)}
        </a>
        <div class="comment-body">
          <div class="comment-meta">
            <a href="/profile.html?u=${encodeURIComponent(c.email)}" style="text-decoration:none"><span class="comment-name" style="cursor:pointer">${dispName}</span></a>
            <span class="comment-time">${relativeTime(c.created_at)}</span>
            ${canDel ? `<button onclick="deleteComment('${c.id}','${postId}')" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:.7rem;color:var(--text-muted);padding:0 4px;font-family:inherit;transition:color .15s" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--text-muted)'">Delete</button>` : ""}
          </div>
          <div class="comment-text">${replyPrefix}${escHtml(c.content)}</div>
          <button class="comment-reply-btn" onclick="startReply('${rootId}','${dispName.replace(/'/g,"\\'")}','${c.email.replace(/'/g,"\\'")}')">Reply</button>
        </div>
      </div>`;
  }

  listEl.innerHTML = topLevel.map(c => {
    const replies = repliesMap[c.id] || [];
    const replyComposer = `
      <div id="reply-composer-${c.id}" class="comment-item is-reply" style="display:none">
        ${avatarHtml(myEmail, myName, 28, null)}
        <div class="comment-body">
          <textarea class="comment-input" placeholder="Write a reply…" rows="1"
            oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitReply('${c.id}',this)}"
            style="width:100%;box-sizing:border-box;margin-bottom:6px"
          ></textarea>
          <div style="display:flex;justify-content:flex-end;gap:14px">
            <button onclick="cancelReply('${c.id}')" style="background:none;border:none;font-family:inherit;font-size:0.8rem;cursor:pointer;color:var(--text-muted);padding:0">Cancel</button>
            <button onclick="submitReply('${c.id}',this.closest('.comment-item').querySelector('textarea'))" style="background:none;border:none;font-family:inherit;font-size:0.8rem;font-weight:700;cursor:pointer;color:var(--accent);padding:0">Send</button>
          </div>
        </div>
      </div>`;
    return commentHTML(c) +
      `<div class="comment-replies">${replies.map(r => commentHTML(r, true, c.id)).join("")}${replyComposer}</div>`;
  }).join("");
}

function cancelReply(commentId) {
  const composer = document.getElementById(`reply-composer-${commentId}`);
  if (composer) { composer.style.display = "none"; composer.querySelector("textarea").value = ""; }
}

function startReply(commentId, authorName, authorEmail) {
  // Hide any other open reply composers
  document.querySelectorAll("[id^='reply-composer-']").forEach(el => el.style.display = "none");
  const composer = document.getElementById(`reply-composer-${commentId}`);
  if (!composer) return;
  composer.style.display = "flex";
  composer.dataset.replyToName  = authorName;
  composer.dataset.replyToEmail = authorEmail;
  const ta = composer.querySelector("textarea");
  ta.value = ""; ta.focus();
}

async function submitReply(parentCommentId, textarea) {
  let content = textarea.value.trim();
  if (!content) return;
  // Strip any @Name prefix the user may have typed (we store it separately)
  const composer    = document.getElementById(`reply-composer-${parentCommentId}`);
  const replyToName = composer?.dataset.replyToName || null;
  if (replyToName && content.startsWith(`@${replyToName}`)) {
    content = content.slice(replyToName.length + 1).trimStart();
  }
  if (!content) return;
  const replyToEmail = composer?.dataset.replyToEmail || null;

  textarea.disabled = true;

  const { error } = await db.from("community_post_comments").insert({
    post_id:           _currentPostId,
    email:             myEmail,
    name:              myName,
    content,
    parent_comment_id: parentCommentId,
    reply_to_name:     replyToName,
  });

  // Notify the person being replied to
  if (!error && replyToEmail && replyToEmail !== myEmail) {
    const { error: notifErr } = await db.from("notifications").insert({
      email:    replyToEmail,
      type:     "comment_reply",
      title:    `${myName || "Someone"} replied to your comment`,
      body:     content.slice(0, 120),
      link_url: `/community.html?post=${_currentPostId}`,
      metadata: {},
    });
    if (notifErr) console.error("[reply notif] insert failed:", notifErr);
  }

  textarea.disabled = false;
  if (error) { alert("Couldn't post reply: " + error.message); return; }
  await loadComments(_currentPostId);
}

async function submitComment() {
  const input = document.getElementById("comment-input");
  const content = input.value.trim();
  if (!content || !_currentPostId) return;

  input.disabled = true;
  const { error } = await db.from("community_post_comments").insert({
    post_id: _currentPostId, email: myEmail, name: myName, content
  });
  input.disabled = false;

  if (error) { alert("Couldn't post comment: " + error.message); return; }

  // Notify the post owner if it's not their own comment
  const post = _posts.find(p => p.id === _currentPostId);
  if (post && post.email && post.email !== myEmail) {
    const { error: notifErr } = await db.from("notifications").insert({
      email:    post.email,
      type:     "new_comment",
      title:    `${myName || "Someone"} commented on your post`,
      body:     content.slice(0, 120),
      link_url: `/community.html?post=${_currentPostId}`,
      metadata: {},
    });
    if (notifErr) console.error("Notification insert failed:", notifErr);
  }

  input.value = "";
  input.style.height = "";
  await loadComments(_currentPostId);
}

async function deleteComment(commentId, postId) {
  if (!confirm("Delete this comment?")) return;
  await db.from("community_post_comments").delete().eq("id", commentId);
  await loadComments(postId);
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

// ── Activity feed ─────────────────────────────────────────────────────────────
async function loadActivity() {
  _activityLoaded = true;
  const list = document.getElementById("community-feed-list");

  const dayOfMonth = new Date().getDate();
  const champPromise = dayOfMonth <= 7
    ? db.rpc("get_last_month_leaderboard")
    : Promise.resolve({ data: [] });

  const [feedResult, champResult] = await Promise.all([
    db.rpc("get_activity_feed", { p_email: myEmail }),
    champPromise,
  ]);

  if (feedResult.error) {
    list.innerHTML = '<div class="feed-empty">Community activity coming soon.</div>';
    return;
  }

  let champHTML = "";
  const champs = (champResult.data || []).filter(r => !LB_EXCLUDED.has(r.email?.toLowerCase())).slice(0, 3);
  if (champs.length) {
    const now = new Date();
    const last = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const mName = last.toLocaleString("default", { month: "long" });
    champHTML = `<div class="monthly-champs-card" style="margin:12px 0 4px">
      <div class="monthly-champs-title">🏆 ${escHtml(mName)} Champions</div>
      <div class="monthly-champs-list">${champs.map((r,i) => `
        <div class="monthly-champ-row">
          <span class="monthly-champ-medal">${["🥇","🥈","🥉"][i]}</span>
          <span class="monthly-champ-name">${escHtml(r.name || r.email.split("@")[0])}</span>
          <span class="monthly-champ-time">${formatMinutes(Number(r.total_minutes)||0)}</span>
        </div>`).join("")}
      </div>
      <div class="monthly-champs-sub">Practice time in ${escHtml(mName)}</div>
    </div>`;
  }

  _feedRows = (feedResult.data || []).filter(r => !LB_EXCLUDED.has(r.email?.toLowerCase()));

  // Bulk-load reactions + comment counts for all feed items that have an item_id
  _rxMap = {}; _cmtMap = {};
  const validRows = _feedRows.filter(r => r.item_id != null);
  if (validRows.length) {
    const itemIds = [...new Set(validRows.map(r => String(r.item_id)))];
    const [rxRes, cmtRes] = await Promise.all([
      db.from("activity_reactions").select("event_type,item_id,email,emoji").in("item_id", itemIds),
      db.from("activity_comments").select("event_type,item_id,id").in("item_id", itemIds),
    ]);
    for (const rx of (rxRes.data || [])) {
      const key = `${rx.event_type}:${rx.item_id}`;
      if (!_rxMap[key]) _rxMap[key] = {};
      if (!_rxMap[key][rx.emoji]) _rxMap[key][rx.emoji] = { count: 0, mine: false };
      _rxMap[key][rx.emoji].count++;
      if (rx.email === myEmail) _rxMap[key][rx.emoji].mine = true;
    }
    for (const c of (cmtRes.data || [])) {
      const key = `${c.event_type}:${c.item_id}`;
      _cmtMap[key] = (_cmtMap[key] || 0) + 1;
    }
  }

  _feedPage = 1;
  renderFeedPage(list, champHTML);
}

function renderFeedPage(list, champHTML = "") {
  if (!_feedRows.length) {
    list.innerHTML = (champHTML || "") + '<div class="feed-empty" style="padding:40px 0;text-align:center;color:var(--text-muted)">No activity in the last 14 days.</div>';
    return;
  }
  const visible = _feedRows.slice(0, _feedPage * FEED_PER_PAGE);
  const hasMore = visible.length < _feedRows.length;
  list.innerHTML = (champHTML || "") + visible.map(feedItemHTML).join("") +
    (hasMore ? `<button class="see-more-btn" style="margin-top:4px" onclick="loadMoreFeed()">Show 20 more <span style="opacity:.6">(${_feedRows.length - visible.length} remaining)</span></button>` : "");
}

function loadMoreFeed() {
  _feedPage++;
  renderFeedPage(document.getElementById("community-feed-list"));
}

function feedItemHTML(row) {
  const name    = row.name || row.email.split("@")[0];
  const ini     = initials(name);
  const colour  = avatarColour(row.email);
  const timeAgo = relativeTime(row.created_at || row.session_date);

  // Build per-item reaction + comment footer
  const itemKey  = row.item_id != null ? `${row.event_type}:${String(row.item_id)}` : null;
  const rxData   = itemKey ? (_rxMap[itemKey] || {}) : {};
  const cmtCount = itemKey ? (_cmtMap[itemKey] || 0) : 0;
  const safeKey  = itemKey ? itemKey.replace(/[^a-z0-9]/gi, "_") : null;

  // Work out Like button state
  let myEmoji = null;
  let totalRx = 0;
  if (itemKey) {
    for (const [e, d] of Object.entries(rxData)) {
      totalRx += d.count;
      if (d.mine) myEmoji = e;
    }
  }
  const likeLabel = myEmoji
    ? (totalRx > 0 ? `${myEmoji} ${totalRx}` : myEmoji)
    : (totalRx > 0 ? String(totalRx) : "Like");

  const footer = itemKey ? `
    <div class="activity-footer">
      <div class="activity-actions" id="actions-${safeKey}">
        <button class="activity-like-btn${myEmoji ? " reacted" : ""}" id="like-btn-${safeKey}"
          onclick="toggleReactPicker('${safeKey}','${row.event_type}','${String(row.item_id)}')"
        >${likeLabel || "Like"}</button>
        <div class="activity-react-picker" id="picker-${safeKey}" style="display:none">
          ${ACTIVITY_EMOJIS.map(e => {
            const d = rxData[e] || { count: 0, mine: false };
            return `<button class="${d.mine ? "picked" : ""}"
              onclick="pickReaction(event,'${safeKey}','${row.event_type}','${String(row.item_id)}','${e}')"
            >${e}${d.count > 0 ? `<span class="picker-count">${d.count}</span>` : ""}</button>`;
          }).join("")}
        </div>
        <button class="activity-cmt-btn" id="cmt-btn-${safeKey}"
          onclick="toggleActivityComments(this,'${row.event_type}','${String(row.item_id)}')"
        >${cmtCount > 0 ? cmtCount + " Comments" : "Comment"}</button>
      </div>
      <div class="activity-cmt-section" id="cmt-${safeKey}" style="display:none">
        <div class="activity-cmt-list"></div>
        <div class="activity-cmt-composer">
          <textarea class="comment-input" placeholder="Write a comment…" rows="1"
            oninput="autoResize(this)"></textarea>
          <button class="activity-cmt-submit"
            onclick="submitActivityComment(this,'${row.event_type}','${String(row.item_id)}')">Post</button>
        </div>
      </div>
    </div>` : "";

  if (row.event_type === "achievement") {
    const ach   = ACH[row.achievement_id] || {};
    const aname = ach.name || row.achievement_id || "Achievement";
    const adesc = ach.desc || "";
    const cat   = ACH_CAT[row.achievement_id] || "sessions";
    const col   = _BADGE_PALETTE[cat] || _BADGE_PALETTE.sessions;
    const badge = achBadgeSVG(row.achievement_id, 46);
    return `<div class="feed-item">
      <div class="feed-avatar" style="background:${colour.bg};color:${colour.fg}">${ini}</div>
      <div class="feed-body">
        <div class="feed-text"><strong style="color:${colour.fg}">${escHtml(name)}</strong> <span style="color:var(--text-muted)">unlocked an achievement</span> <span class="feed-time">· ${timeAgo}</span></div>
        <div class="feed-ach-badge" style="background:${col[0]}12;border-color:${col[0]}40">
          <span class="feed-ach-icon">${badge}</span>
          <div>
            <div class="feed-ach-name" style="color:${col[0]}">${escHtml(aname)}</div>
            ${adesc ? `<div class="feed-ach-desc">${escHtml(adesc)}</div>` : ""}
          </div>
        </div>
        ${footer}
      </div>
    </div>`;
  }

  return `<div class="feed-item">
    <div class="feed-avatar" style="background:${colour.bg};color:${colour.fg}">${ini}</div>
    <div class="feed-body">
      <div class="feed-text"><strong style="color:${colour.fg}">${escHtml(name)}</strong> logged a practice session <span class="feed-time">· ${timeAgo}</span></div>
      <div class="feed-session-block" style="background:rgba(245,197,24,.07);border-color:rgba(245,197,24,.25)">
        <div class="feed-session-icon"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
        <div class="feed-session-duration">${formatMinutes(row.duration_minutes||0)}</div>
      </div>
      ${footer}
    </div>
  </div>`;
}

// ── Activity reactions — picker ───────────────────────────────────────────────
let _openPicker = null; // currently open picker safeKey

// Close picker when clicking outside
document.addEventListener("click", e => {
  if (!_openPicker) return;
  const picker = document.getElementById(`picker-${_openPicker}`);
  const likeBtn = document.getElementById(`like-btn-${_openPicker}`);
  if (picker && !picker.contains(e.target) && e.target !== likeBtn && !likeBtn?.contains(e.target)) {
    picker.style.display = "none";
    _openPicker = null;
  }
});

function toggleReactPicker(safeKey, eventType, itemId) {
  const picker = document.getElementById(`picker-${safeKey}`);
  if (!picker) return;

  if (_openPicker && _openPicker !== safeKey) {
    const prev = document.getElementById(`picker-${_openPicker}`);
    if (prev) prev.style.display = "none";
  }

  const isOpen = picker.style.display !== "none";
  picker.style.display = isOpen ? "none" : "";
  _openPicker = isOpen ? null : safeKey;
}

async function pickReaction(event, safeKey, eventType, itemId, emoji) {
  event.stopPropagation(); // don't bubble to document close listener

  const picker  = document.getElementById(`picker-${safeKey}`);
  const likeBtn = document.getElementById(`like-btn-${safeKey}`);
  const key     = `${eventType}:${String(itemId)}`;
  if (!_rxMap[key]) _rxMap[key] = {};

  const pickerBtn = event.currentTarget;
  const wasPicked = pickerBtn.classList.contains("picked");
  const existingEmoji = Object.keys(_rxMap[key]).find(e => _rxMap[key][e]?.mine);

  // Close picker
  if (picker) picker.style.display = "none";
  _openPicker = null;

  // If re-tapping my own emoji → remove reaction
  if (wasPicked) {
    pickerBtn.classList.remove("picked");
    const d = _rxMap[key][emoji];
    if (d) { d.mine = false; d.count = Math.max(0, d.count - 1); }
    _refreshLikeBtn(safeKey, key);
    _refreshPickerCounts(safeKey, key);
    await db.from("activity_reactions").delete()
      .eq("email", myEmail).eq("event_type", eventType)
      .eq("item_id", String(itemId)).eq("emoji", emoji);
    return;
  }

  // Remove any previous reaction first (only one at a time)
  if (existingEmoji) {
    const prevBtn = picker?.querySelector(".picked");
    if (prevBtn) prevBtn.classList.remove("picked");
    const d = _rxMap[key][existingEmoji];
    if (d) { d.mine = false; d.count = Math.max(0, d.count - 1); }
    await db.from("activity_reactions").delete()
      .eq("email", myEmail).eq("event_type", eventType)
      .eq("item_id", String(itemId)).eq("emoji", existingEmoji);
  }

  // Add new reaction
  pickerBtn.classList.add("picked");
  if (!_rxMap[key][emoji]) _rxMap[key][emoji] = { count: 0, mine: false };
  _rxMap[key][emoji].mine = true;
  _rxMap[key][emoji].count++;
  _refreshLikeBtn(safeKey, key);
  _refreshPickerCounts(safeKey, key);

  await db.from("activity_reactions")
    .insert({ email: myEmail, event_type: eventType, item_id: String(itemId), emoji });
}

function _refreshLikeBtn(safeKey, key) {
  const btn = document.getElementById(`like-btn-${safeKey}`);
  if (!btn) return;
  const rxData = _rxMap[key] || {};
  let myEmoji = null, total = 0;
  for (const [e, d] of Object.entries(rxData)) {
    total += d.count;
    if (d.mine) myEmoji = e;
  }
  const label = myEmoji
    ? (total > 0 ? `${myEmoji} ${total}` : myEmoji)
    : (total > 0 ? String(total) : "Like");
  btn.classList.toggle("reacted", !!myEmoji);
  btn.innerHTML = label;
}

function _refreshPickerCounts(safeKey, key) {
  const picker = document.getElementById(`picker-${safeKey}`);
  if (!picker) return;
  const rxData = _rxMap[key] || {};
  picker.querySelectorAll("button").forEach((btn, i) => {
    const e = ACTIVITY_EMOJIS[i];
    if (!e) return;
    const d = rxData[e] || { count: 0 };
    btn.innerHTML = `${e}${d.count > 0 ? `<span class="picker-count">${d.count}</span>` : ""}`;
  });
}

// ── Activity comments ─────────────────────────────────────────────────────────
async function toggleActivityComments(btn, eventType, itemId) {
  const safeKey = `${eventType}:${String(itemId)}`.replace(/[^a-z0-9]/gi, "_");
  const section = document.getElementById(`cmt-${safeKey}`);
  if (!section) return;

  const isOpen = section.style.display !== "none";
  section.style.display = isOpen ? "none" : "";
  btn.classList.toggle("open", !isOpen);

  if (!isOpen) {
    await loadActivityComments(section, eventType, String(itemId));
  }
}

async function loadActivityComments(section, eventType, itemId) {
  const listEl = section.querySelector(".activity-cmt-list");
  listEl.innerHTML = `<div style="font-size:.78rem;color:var(--text-muted);padding:4px 0">Loading…</div>`;

  const { data, error } = await db.from("activity_comments")
    .select("id,email,name,content,created_at")
    .eq("event_type", eventType).eq("item_id", itemId)
    .order("created_at", { ascending: true });

  if (error) { listEl.innerHTML = ""; return; }

  if (!data.length) {
    listEl.innerHTML = `<div style="font-size:.78rem;color:var(--text-muted);padding:2px 0">No comments yet — be the first!</div>`;
    return;
  }

  listEl.innerHTML = data.map(c => {
    const n   = c.name || c.email.split("@")[0];
    const col = avatarColour(c.email);
    const canDel = c.email === myEmail || isAdmin;
    return `<div class="activity-cmt-item" id="acmt-${c.id}">
      <div class="feed-avatar" style="width:26px;height:26px;min-width:26px;font-size:.65rem;background:${col.bg};color:${col.fg}">${initials(n)}</div>
      <div class="activity-cmt-content">
        <div class="activity-cmt-meta">
          <strong style="color:${col.fg}">${escHtml(n)}</strong>
          <span class="activity-cmt-time">${relativeTime(c.created_at)}</span>
          ${canDel ? `<button class="activity-cmt-del" title="Delete" onclick="deleteActivityComment('${c.id}','${eventType}','${itemId}')">×</button>` : ""}
        </div>
        <div class="activity-cmt-text">${escHtml(c.content)}</div>
      </div>
    </div>`;
  }).join("");

  // Keep count in sync
  const key = `${eventType}:${itemId}`;
  _cmtMap[key] = data.length;
  _updateCmtBtn(eventType, itemId, data.length);
}

async function submitActivityComment(btn, eventType, itemId) {
  const section = btn.closest(".activity-cmt-section");
  const textarea = section.querySelector(".comment-input");
  const content  = textarea.value.trim();
  if (!content) return;

  btn.disabled = true;
  const { error } = await db.from("activity_comments").insert({
    event_type: eventType, item_id: String(itemId),
    email: myEmail, name: myName, content,
  });
  btn.disabled = false;
  if (error) { alert("Couldn't post comment — please try again."); return; }

  textarea.value = ""; textarea.style.height = "";
  await loadActivityComments(section, eventType, String(itemId));
}

async function deleteActivityComment(commentId, eventType, itemId) {
  const el = document.getElementById(`acmt-${commentId}`);
  if (el) el.style.opacity = "0.4";
  const { error } = await db.from("activity_comments").delete().eq("id", commentId);
  if (error) { if (el) el.style.opacity = ""; return; }
  if (el) el.remove();
  const key = `${eventType}:${String(itemId)}`;
  _cmtMap[key] = Math.max(0, (_cmtMap[key] || 1) - 1);
  _updateCmtBtn(eventType, itemId, _cmtMap[key]);
}

function _updateCmtBtn(eventType, itemId, count) {
  const safeKey = `${eventType}:${String(itemId)}`.replace(/[^a-z0-9]/gi, "_");
  const btn = document.getElementById(`cmt-btn-${safeKey}`);
  if (btn) btn.innerHTML = count > 0 ? `${count} Comments` : "Comment";
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}

function avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)", fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)", fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)", fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}

function avatarHtml(email, name, size = 32, avatarUrl = null) {
  const style = `width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;`;
  if (avatarUrl) {
    return `<div style="${style}overflow:hidden"><img src="${escHtml(avatarUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block" /></div>`;
  }
  const c = avatarColour(email);
  const ini = initials(name || email?.split("@")[0] || "?");
  const fontSize = Math.round(size * 0.34);
  return `<div style="${style}background:${c.bg};color:${c.fg};display:flex;align-items:center;justify-content:center;font-size:${fontSize}px;font-weight:800">${ini}</div>`;
}

function relativeTime(ts) {
  if (!ts) return "";
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if (m < 2)  return "just now";
  if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`;
  if (d === 1) return "yesterday";
  return `${d}d ago`;
}

function formatMinutes(mins) {
  if (!mins||mins<=0) return "0 min";
  const h = Math.floor(mins/60), m = mins%60;
  if (h===0) return `${m} min`;
  if (m===0) return `${h}h`;
  return `${h}h ${m}m`;
}

// ── Mux aspect ratio correction ───────────────────────────────────────────────
// After rendering, detect portrait videos and apply the tall wrapper class.
function fixMuxAspectRatios() {
  document.querySelectorAll('.mux-wrap').forEach(wrap => {
    const player = wrap.querySelector('mux-player');
    if (!player) return;
    const apply = () => {
      const w = player.videoWidth, h = player.videoHeight;
      if (!w || !h) return;
      wrap.classList.toggle('portrait', h > w);
    };
    // Already loaded (e.g. cached)
    if (player.videoWidth) { apply(); return; }
    player.addEventListener('loadedmetadata', apply, { once: true });
  });
}
