<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js"></script>
  <style>
    /* ── Layout ──────────────────────────────────────────────────────────────── */
    #community-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    /* ── Page tabs: Posts | Activity ──────────────────────────────────────────── */
    .comm-page-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .comm-page-hdr h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      margin: 0;
    }
    .comm-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }
    .comm-tab {
      background: none; border: none; cursor: pointer;
      padding: 6px 16px; font-size: 0.82rem; font-weight: 700;
      color: var(--text-muted); border-radius: 6px;
      transition: background .15s, color .15s; font-family: inherit;
      white-space: nowrap;
    }
    .comm-tab.active { background: var(--accent); color: #1a1410; }

    /* ── Composer ─────────────────────────────────────────────────────────────── */
    .composer-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 24px;
    }
    .composer-prompt {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .composer-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 800; flex-shrink: 0;
    }
    .composer-placeholder {
      flex: 1;
      background: #0f0f0f;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 0.87rem;
      color: #444;
      cursor: text;
      transition: border-color .15s;
    }
    .composer-placeholder:hover { border-color: #3a3a3a; }

    .composer-expanded { display: none; }
    .composer-expanded.open { display: block; }

    .composer-type-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin: 14px 0 12px;
    }
    .post-type-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 0.78rem; font-weight: 600;
      color: var(--text-muted);
      cursor: pointer; transition: border-color .15s, color .15s, background .15s;
      font-family: inherit;
    }
    .post-type-btn:hover { border-color: #3a3a3a; color: var(--text); }
    .post-type-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(245,197,24,.08);
    }

    .composer-title-input {
      width: 100%; box-sizing: border-box;
      background: #0f0f0f; border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 1rem; font-weight: 700; font-family: inherit;
      padding: 10px 14px; margin-bottom: 10px;
      transition: border-color .15s;
    }
    .composer-title-input:focus { outline: none; border-color: var(--accent); }
    .composer-title-input::placeholder { font-weight: 400; color: #3a3a3a; }

    .composer-textarea {
      width: 100%; box-sizing: border-box;
      background: #0f0f0f; border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 0.9rem; font-family: inherit;
      padding: 10px 14px; resize: vertical; min-height: 90px;
      transition: border-color .15s;
    }
    .composer-textarea:focus { outline: none; border-color: var(--accent); }

    .composer-actions {
      display: flex; align-items: center;
      justify-content: flex-end; gap: 10px;
      margin-top: 10px;
    }
    .composer-cancel {
      background: none; border: none; font-size: 0.85rem;
      color: var(--text-muted); cursor: pointer; font-family: inherit;
      padding: 6px 10px; border-radius: 6px;
      transition: color .15s;
    }
    .composer-cancel:hover { color: var(--text); }

    /* ── Post cards ───────────────────────────────────────────────────────────── */
    .post-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px 14px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .post-card:hover { border-color: rgba(245,197,24,.35); }

    .post-type-badge {
      display: inline-block;
      font-size: 0.67rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      border-radius: 20px; padding: 3px 10px;
      border: 1px solid; margin-bottom: 10px;
    }

    .post-title {
      font-size: 1.05rem; font-weight: 700;
      color: #fff; line-height: 1.3;
      margin-bottom: 10px;
    }

    .post-author-row {
      display: flex; align-items: center;
      gap: 8px; margin-bottom: 10px;
    }
    .post-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 800; flex-shrink: 0;
    }
    .post-author-name { font-size: 0.82rem; font-weight: 600; color: var(--text); }
    .post-author-time { font-size: 0.75rem; color: var(--text-muted); margin-left: auto; }

    .post-preview {
      font-size: 0.88rem; color: var(--text-muted);
      line-height: 1.55; margin-bottom: 12px;
      white-space: pre-wrap; word-break: break-word;
    }
    .post-see-more {
      color: var(--accent); font-weight: 600; font-size: 0.82rem;
    }

    .post-footer {
      display: flex; align-items: center; gap: 16px;
      border-top: 1px solid var(--border); padding-top: 10px;
      margin-top: 4px;
    }
    .post-footer-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: none; cursor: pointer;
      font-size: 0.82rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 0;
      transition: color .15s;
    }
    .post-footer-btn:hover { color: var(--text); }
    .post-footer-btn.liked { color: #e879a0; }
    .post-footer-btn svg { flex-shrink: 0; }

    .posts-empty {
      text-align: center; padding: 48px 0;
      color: var(--text-muted); font-size: 0.87rem; line-height: 1.7;
    }

    /* ── Detail view ─────────────────────────────────────────────────────────── */
    .detail-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-muted); font-size: 0.85rem; font-weight: 600;
      background: none; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 6px 12px; cursor: pointer;
      transition: border-color .15s, color .15s; font-family: inherit;
      margin-bottom: 20px;
    }
    .detail-back:hover { border-color: var(--accent); color: var(--accent); }

    .detail-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px 18px;
      margin-bottom: 20px;
    }
    .detail-title {
      font-size: 1.3rem; font-weight: 700; color: #fff;
      line-height: 1.3; margin: 10px 0 12px;
    }
    .detail-content {
      font-size: 0.92rem; color: var(--text-muted);
      line-height: 1.65; white-space: pre-wrap; word-break: break-word;
      margin-bottom: 16px;
    }
    .detail-footer {
      display: flex; align-items: center; gap: 16px;
      border-top: 1px solid var(--border); padding-top: 12px;
    }
    .detail-delete-btn {
      margin-left: auto;
      background: none; border: none; cursor: pointer;
      font-size: 0.75rem; color: #3a3a3a;
      font-family: inherit; padding: 4px 8px;
      border-radius: 5px; transition: color .15s;
    }
    .detail-delete-btn:hover { color: #ef4444; }

    /* ── Comments ─────────────────────────────────────────────────────────────── */
    .comments-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .comments-hdr {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted);
    }
    .comment-item {
      display: flex; gap: 10px;
      padding: 13px 20px;
      border-bottom: 1px solid rgba(255,255,255,.04);
    }
    .comment-item:last-of-type { border-bottom: none; }
    .comment-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 800; flex-shrink: 0; margin-top: 1px;
    }
    .comment-body { flex: 1; min-width: 0; }
    .comment-meta {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 3px;
    }
    .comment-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .comment-time { font-size: 0.7rem; color: var(--text-muted); }
    .comment-text {
      font-size: 0.87rem; color: var(--text-muted);
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .comments-empty {
      padding: 24px 20px; text-align: center;
      color: var(--text-muted); font-size: 0.82rem;
    }
    .comment-form {
      display: flex; gap: 10px; align-items: flex-end;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
    }
    .comment-input {
      flex: 1; background: #0f0f0f;
      border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text);
      font-size: 0.87rem; font-family: inherit;
      padding: 9px 12px; resize: none; min-height: 38px; max-height: 120px;
      transition: border-color .15s;
    }
    .comment-input:focus { outline: none; border-color: var(--accent); }

    /* ── Activity feed — island cards ────────────────────────────────────────── */
    #community-feed-list { display: flex; flex-direction: column; gap: 10px; }
    .feed-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
    }
    .feed-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 800; flex-shrink: 0;
    }
    .feed-body { flex: 1; min-width: 0; }
    .feed-text { font-size: 0.87rem; color: var(--text); line-height: 1.4; }
    .feed-text strong { color: #fff; font-weight: 700; }
    .feed-text .feed-duration { color: var(--accent); font-weight: 700; }
    .feed-time { font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
    .feed-empty { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.87rem; }
    .feed-ach-badge {
      display: inline-flex; align-items: center; gap: 8px;
      border-radius: 10px; padding: 7px 10px;
      margin-top: 5px; border: 1px solid; max-width: 100%;
    }
    .feed-ach-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 1.1rem; }
    .feed-ach-name { font-size: 0.78rem; font-weight: 700; line-height: 1.2; }
    .feed-ach-desc { font-size: 0.68rem; color: var(--text-muted); margin-top: 1px; }
    /* ── Activity actions (Like + Comment) ───────────────────────────────────── */
    .activity-footer { margin-top: 7px; }
    .activity-actions {
      display: flex; align-items: center; gap: 8px; position: relative;
    }
    /* Like button */
    .activity-like-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: 1.5px solid var(--border);
      border-radius: 20px; padding: 5px 13px;
      font-size: 0.82rem; font-weight: 600; font-family: inherit;
      color: var(--text-muted); cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
      line-height: 1;
    }
    .activity-like-btn .like-emoji { font-size: 1rem; line-height: 1; }
    .activity-like-btn:hover { border-color: rgba(255,255,255,.25); color: var(--text); }
    .activity-like-btn.reacted {
      border-color: rgba(255,255,255,.22);
      background: rgba(255,255,255,.07);
      color: var(--text);
    }
    /* Comment button — same shape */
    .activity-cmt-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: 1.5px solid var(--border);
      border-radius: 20px; padding: 5px 13px;
      font-size: 0.82rem; font-weight: 600; font-family: inherit;
      color: var(--text-muted); cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
      line-height: 1;
    }
    .activity-cmt-btn:hover { border-color: rgba(255,255,255,.25); color: var(--text); }
    .activity-cmt-btn.open { border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.07); color: var(--text); }
    /* Emoji picker popup */
    .activity-react-picker {
      position: absolute; bottom: calc(100% + 8px); left: 0;
      background: #1a1a1a; border: 1.5px solid var(--border);
      border-radius: 32px; padding: 6px 8px;
      display: flex; align-items: center; gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      z-index: 200; white-space: nowrap;
    }
    .activity-react-picker button {
      display: inline-flex; flex-direction: column; align-items: center; gap: 1px;
      background: none; border: none; border-radius: 10px;
      padding: 5px 7px; cursor: pointer; font-size: 1.3rem; line-height: 1;
      transition: transform .12s, background .12s;
      position: relative;
    }
    .activity-react-picker button:hover { transform: scale(1.35); background: rgba(255,255,255,.08); }
    .activity-react-picker button.picked { background: rgba(255,255,255,.1); }
    .activity-react-picker button .picker-count {
      font-size: 0.62rem; color: var(--text-muted); font-family: inherit; line-height: 1;
    }
    /* Comment section */
    .activity-cmt-section {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .activity-cmt-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .activity-cmt-item { display: flex; align-items: flex-start; gap: 8px; }
    .activity-cmt-content { flex: 1; min-width: 0; }
    .activity-cmt-meta {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.75rem; margin-bottom: 2px;
    }
    .activity-cmt-time { color: var(--text-muted); }
    .activity-cmt-del {
      margin-left: auto; background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 1rem; padding: 0 2px; line-height: 1;
    }
    .activity-cmt-del:hover { color: #f87171; }
    .activity-cmt-text { font-size: 0.83rem; color: var(--text); line-height: 1.45; word-break: break-word; }
    .activity-cmt-composer { display: flex; align-items: flex-start; gap: 8px; }
    .activity-cmt-submit {
      flex-shrink: 0; padding: 7px 14px;
      background: var(--accent); color: #000;
      border: none; border-radius: 8px; font-size: 0.8rem;
      font-weight: 700; cursor: pointer; font-family: inherit;
      transition: opacity .15s;
    }
    .activity-cmt-submit:disabled { opacity: .5; cursor: default; }
    .see-more-btn {
      display: block; width: 100%; margin: 4px 0 8px;
      padding: 10px; background: transparent;
      border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text-muted); font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: border-color .15s, color .15s;
      text-align: center; font-family: inherit;
    }
    .see-more-btn:hover { border-color: var(--accent); color: var(--accent); }
    .monthly-champs-card {
      background: linear-gradient(135deg, rgba(245,158,11,.12), rgba(236,72,153,.08));
      border: 1px solid rgba(245,158,11,.25); border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
    }
    .monthly-champs-title { font-size: 0.85rem; font-weight: 800; color: #FFD700; margin-bottom: 12px; }
    .monthly-champs-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .monthly-champ-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
    .monthly-champ-medal { font-size: 1.1rem; width: 24px; text-align: center; }
    .monthly-champ-name { flex: 1; font-weight: 600; color: var(--text); }
    .monthly-champ-time { font-size: 0.75rem; color: var(--text-muted); }
    .monthly-champs-sub { font-size: 0.68rem; color: var(--text-muted); text-align: right; }
  </style>
</head>
<body>

  <header id="app-header" style="display:none"></header>

  <main>
    <div id="community-main" style="display:none">

      <!-- ── List view ──────────────────────────────────────────────────────── -->
      <div id="view-list">

        <div class="comm-page-hdr">
          <h2>Community</h2>
          <div class="comm-tabs">
            <button class="comm-tab active" id="tab-btn-posts"    onclick="switchTab('posts')">Posts</button>
            <button class="comm-tab"        id="tab-btn-activity" onclick="switchTab('activity')">Activity</button>
          </div>
        </div>

        <!-- Composer -->
        <div class="composer-card" id="composer-card">
          <!-- Collapsed prompt -->
          <div class="composer-prompt" id="composer-prompt" onclick="openComposer()">
            <div class="composer-avatar" id="composer-avatar-el"></div>
            <div class="composer-placeholder">Share something with the community…</div>
          </div>
          <!-- Expanded -->
          <div class="composer-expanded" id="composer-expanded">
            <div class="composer-type-row">
              <button class="post-type-btn" data-type="progress" onclick="selectType(this)">📈 Share Your Progress</button>
              <button class="post-type-btn" data-type="feedback" onclick="selectType(this)">🎹 Get Feedback</button>
              <button class="post-type-btn" data-type="question" onclick="selectType(this)">💬 Ask a Question</button>
              <button class="post-type-btn" data-type="post"     onclick="selectType(this)">✏️ Just Post</button>
            </div>
            <input  class="composer-title-input" id="composer-title"   placeholder="Add a title…" maxlength="120" />
            <textarea class="composer-textarea"  id="composer-content" placeholder="What's on your mind?" rows="4"></textarea>
            <div class="composer-actions">
              <button class="composer-cancel" onclick="closeComposer()">Cancel</button>
              <button class="btn btn-sm" id="composer-submit" onclick="submitPost()">Post</button>
            </div>
          </div>
        </div>

        <!-- Posts panel -->
        <div id="panel-posts">
          <div id="posts-list">
            <div class="posts-empty">
              <div class="loading-spinner" style="margin:0 auto 12px"></div>
              Loading posts…
            </div>
          </div>
        </div>

        <!-- Activity panel -->
        <div id="panel-activity" style="display:none">
          <div id="community-feed-list">
            <div style="text-align:center;padding:40px 0;color:var(--text-muted);font-size:0.85rem">
              <div class="loading-spinner" style="margin:0 auto 10px"></div>
              Loading activity…
            </div>
          </div>
        </div>

      </div><!-- end #view-list -->

      <!-- ── Detail view ─────────────────────────────────────────────────────── -->
      <div id="view-detail" style="display:none">
        <button class="detail-back" onclick="showList()">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>

        <div id="detail-post-area"></div>

        <div class="comments-section">
          <div class="comments-hdr" id="comments-hdr">Comments</div>
          <div id="comments-list"></div>
          <div class="comment-form">
            <div class="comment-avatar" id="comment-avatar-el"></div>
            <textarea class="comment-input" id="comment-input" placeholder="Write a comment…" rows="1"
              oninput="autoResize(this)"
              onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitComment();}"></textarea>
            <button class="btn btn-sm" onclick="submitComment()" style="flex-shrink:0">Send</button>
          </div>
        </div>

      </div><!-- end #view-detail -->

    </div><!-- end #community-main -->
  </main>

<script>

function _lerpHex(h1,h2,t){const p=s=>parseInt(s,16);const r=Math.round(p(h1.slice(1,3))+(p(h2.slice(1,3))-p(h1.slice(1,3)))*t);const g=Math.round(p(h1.slice(3,5))+(p(h2.slice(3,5))-p(h1.slice(3,5)))*t);const b=Math.round(p(h1.slice(5,7))+(p(h2.slice(5,7))-p(h1.slice(5,7)))*t);return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;}

// ── Auth ──────────────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails").select("name").eq("email", myEmail).maybeSingle();
  myName  = ae?.name || myEmail.split("@")[0];
  isAdmin = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "community" });

  // Avatars
  const colour = avatarColour(myEmail);
  ["composer-avatar-el", "comment-avatar-el"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = initials(myName);
    el.style.background = colour.bg;
    el.style.color = colour.fg;
  });

  document.getElementById("community-main").style.display = "";
  await loadPosts();
})();

// ── Tab switching ─────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById("tab-btn-posts").classList.toggle("active", tab === "posts");
  document.getElementById("tab-btn-activity").classList.toggle("active", tab === "activity");
  document.getElementById("panel-posts").style.display    = tab === "posts"    ? "" : "none";
  document.getElementById("panel-activity").style.display = tab === "activity" ? "" : "none";
  document.getElementById("composer-card").style.display  = tab === "posts"    ? "" : "none";
  if (tab === "activity" && !_activityLoaded) loadActivity();
}

// ── View switching: list ↔ detail ──────────────────────────────────────────────
function showDetail(postId) {
  _currentPostId = postId;
  document.getElementById("view-list").style.display   = "none";
  document.getElementById("view-detail").style.display = "";
  window.scrollTo(0, 0);
  renderDetail(postId);
  loadComments(postId);
}

function showList() {
  _currentPostId = null;
  document.getElementById("view-detail").style.display = "none";
  document.getElementById("view-list").style.display   = "";
  window.scrollTo(0, 0);
}

// ── Composer ──────────────────────────────────────────────────────────────────
function openComposer() {
  document.getElementById("composer-prompt").style.display   = "none";
  document.getElementById("composer-expanded").classList.add("open");
  document.getElementById("composer-title").focus();
}

function closeComposer() {
  document.getElementById("composer-prompt").style.display   = "";
  document.getElementById("composer-expanded").classList.remove("open");
  document.getElementById("composer-title").value   = "";
  document.getElementById("composer-content").value = "";
  document.querySelectorAll(".post-type-btn").forEach(b => b.classList.remove("active"));
  _selectedType = null;
}

function selectType(btn) {
  document.querySelectorAll(".post-type-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  _selectedType = btn.dataset.type;
}

async function submitPost() {
  const title   = document.getElementById("composer-title").value.trim();
  const content = document.getElementById("composer-content").value.trim();
  if (!title)   { alert("Please add a title."); document.getElementById("composer-title").focus(); return; }
  if (!content) { alert("Please add some content."); document.getElementById("composer-content").focus(); return; }
  if (!_selectedType) { alert("Please choose a post type."); return; }

  const btn = document.getElementById("composer-submit");
  btn.disabled = true; btn.textContent = "Posting…";

  const { error } = await db.from("community_posts").insert({
    email: myEmail, name: myName, type: _selectedType, title, content
  });

  btn.disabled = false; btn.textContent = "Post";

  if (error) { alert("Couldn't post: " + error.message); return; }

  closeComposer();
  await loadPosts();
}

// ── Posts ─────────────────────────────────────────────────────────────────────
async function loadPosts() {
  const list = document.getElementById("posts-list");
  list.innerHTML = '<div class="posts-empty"><div class="loading-spinner" style="margin:0 auto 12px"></div>Loading posts…</div>';

  const { data: posts, error } = await db
    .from("community_posts")
    .select("*")
    .order("created_at", { ascending: false })
    .limit(100);

  if (error || !posts) {
    list.innerHTML = '<div class="posts-empty">Could not load posts.</div>';
    return;
  }

  if (!posts.length) {
    list.innerHTML = `<div class="posts-empty">No posts yet — be the first to share something! 👆</div>`;
    return;
  }

  // Fetch like counts + my likes in parallel
  const ids = posts.map(p => p.id);
  const [{ data: allLikes }, { data: myLikes }, { data: commentCounts }] = await Promise.all([
    db.from("community_post_likes").select("post_id").in("post_id", ids),
    db.from("community_post_likes").select("post_id").eq("email", myEmail).in("post_id", ids),
    db.from("community_post_comments").select("post_id").in("post_id", ids)
  ]);

  const likeCountMap    = {};
  const commentCountMap = {};
  const myLikeSet       = new Set((myLikes || []).map(l => l.post_id));

  (allLikes     || []).forEach(l => likeCountMap[l.post_id]    = (likeCountMap[l.post_id]    || 0) + 1);
  (commentCounts|| []).forEach(c => commentCountMap[c.post_id] = (commentCountMap[c.post_id] || 0) + 1);

  _posts = posts.map(p => ({
    ...p,
    likeCount:    likeCountMap[p.id]    || 0,
    commentCount: commentCountMap[p.id] || 0,
    iLiked:       myLikeSet.has(p.id)
  }));

  list.innerHTML = _posts.map(p => postCardHTML(p)).join("");
}

function postCardHTML(p) {
  const pt      = POST_TYPES[p.type] || POST_TYPES.post;
  const colour  = avatarColour(p.email);
  const ini     = initials(p.name || p.email.split("@")[0]);
  const name    = escHtml(p.name || p.email.split("@")[0]);
  const timeAgo = relativeTime(p.created_at);
  const PREVIEW = 200;
  const content = p.content || "";
  const preview = content.length > PREVIEW
    ? escHtml(content.slice(0, PREVIEW)) + `<span class="post-see-more">… See more</span>`
    : escHtml(content);

  const likeIcon = p.iLiked
    ? `<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`
    : `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;

  return `
    <div class="post-card" onclick="showDetail('${p.id}')">
      <span class="post-type-badge" style="color:${pt.color};background:${pt.bg};border-color:${pt.border}">${escHtml(pt.label)}</span>
      <div class="post-title">${escHtml(p.title)}</div>
      <div class="post-author-row">
        <div class="post-avatar" style="background:${colour.bg};color:${colour.fg}">${ini}</div>
        <span class="post-author-name">${name}</span>
        <span class="post-author-time">${timeAgo}</span>
      </div>
      <div class="post-preview">${preview}</div>
      <div class="post-footer" onclick="event.stopPropagation()">
        <button class="post-footer-btn ${p.iLiked ? "liked" : ""}" data-post-id="${p.id}" onclick="toggleLike(this,'${p.id}')">
          ${likeIcon}
          <span class="like-count-${p.id}">${p.likeCount || ""}</span>
        </button>
        <button class="post-footer-btn" onclick="showDetail('${p.id}')">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="comment-count-${p.id}">${p.commentCount || ""}</span>
        </button>
      </div>
    </div>`;
}

// ── Like toggle ───────────────────────────────────────────────────────────────
async function toggleLike(btn, postId) {
  const isLiked  = btn.classList.contains("liked");
  const post     = _posts.find(p => p.id === postId);
  if (!post) return;

  const newLiked = !isLiked;
  const newCount = newLiked ? post.likeCount + 1 : Math.max(0, post.likeCount - 1);

  // Optimistic
  post.iLiked    = newLiked;
  post.likeCount = newCount;
  _updateLikeUI(btn, newLiked, newCount, postId);

  const { error } = newLiked
    ? await db.from("community_post_likes").insert({ post_id: postId, email: myEmail })
    : await db.from("community_post_likes").delete().eq("post_id", postId).eq("email", myEmail);

  if (error) {
    // Revert
    post.iLiked    = isLiked;
    post.likeCount = post.likeCount + (isLiked ? 1 : -1);
    _updateLikeUI(btn, isLiked, post.likeCount, postId);
  }
}

function _updateLikeUI(btn, liked, count, postId) {
  btn.classList.toggle("liked", liked);
  const svg = liked
    ? `<svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`
    : `<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  btn.innerHTML = svg + `<span class="like-count-${postId}">${count || ""}</span>`;
  // Also update detail view like button if open
  const detailBtn = document.getElementById(`detail-like-btn`);
  if (detailBtn && detailBtn.dataset.postId === postId) {
    _updateDetailLikeBtn(detailBtn, liked, count, postId);
  }
  document.querySelectorAll(`.like-count-${postId}`).forEach(el => el.textContent = count || "");
}

// ── Detail view ───────────────────────────────────────────────────────────────

function _updateDetailLikeBtn(btn, liked, count, postId) {

async function deletePost(postId) {
  if (!confirm("Delete this post? This can't be undone.")) return;
  const { error } = await db.from("community_posts").delete().eq("id", postId);
  if (error) { alert("Couldn't delete: " + error.message); return; }
  showList();
  await loadPosts();
}

// ── Comments ──────────────────────────────────────────────────────────────────
async function loadComments(postId) {
  const listEl = document.getElementById("comments-list");
  const hdrEl  = document.getElementById("comments-hdr");
  listEl.innerHTML = '<div class="comments-empty"><div class="loading-spinner" style="margin:0 auto 8px;width:18px;height:18px"></div></div>';

  const { data: comments, error } = await db
    .from("community_post_comments")
    .select("*")
    .eq("post_id", postId)
    .order("created_at", { ascending: true });

  if (error || !comments) { listEl.innerHTML = '<div class="comments-empty">Could not load comments.</div>'; return; }

  const count = comments.length;
  hdrEl.textContent = count === 0 ? "Comments" : `${count} Comment${count !== 1 ? "s" : ""}`;

  // Update comment count in post card
  const post = _posts.find(p => p.id === postId);
  if (post) {
    post.commentCount = count;
    document.querySelectorAll(`.comment-count-${postId}`).forEach(el => el.textContent = count || "");
  }

  if (!count) { listEl.innerHTML = '<div class="comments-empty">No comments yet — be the first!</div>'; return; }

  listEl.innerHTML = comments.map(c => {
    const colour = avatarColour(c.email);
    const ini    = initials(c.name || c.email.split("@")[0]);
    const canDel = isAdmin || c.email === myEmail;
    return `
      <div class="comment-item" id="comment-${c.id}">
        <div class="comment-avatar" style="background:${colour.bg};color:${colour.fg}">${ini}</div>
        <div class="comment-body">
          <div class="comment-meta">
            <span class="comment-name">${escHtml(c.name || c.email.split("@")[0])}</span>
            <span class="comment-time">${relativeTime(c.created_at)}</span>
            ${canDel ? `<button onclick="deleteComment('${c.id}','${postId}')" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:.7rem;color:#333;padding:0 4px;font-family:inherit;transition:color .15s" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='#333'">Delete</button>` : ""}
          </div>
          <div class="comment-text">${escHtml(c.content)}</div>
        </div>
      </div>`;
  }).join("");
}

async function submitComment() {
  const input = document.getElementById("comment-input");
  const content = input.value.trim();
  if (!content || !_currentPostId) return;

  input.disabled = true;

  const { error } = await db.from("community_post_comments").insert({
    post_id: _currentPostId, email: myEmail, name: myName, content
  });

  input.disabled = false;

  if (error) { alert("Couldn't post comment: " + error.message); return; }

  input.value = "";
  input.style.height = "";
  await loadComments(_currentPostId);
}

async function deleteComment(commentId, postId) {
  if (!confirm("Delete this comment?")) return;
  await db.from("community_post_comments").delete().eq("id", commentId);
  await loadComments(postId);
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

// ── Activity feed ─────────────────────────────────────────────────────────────
async function loadActivity() {
  _activityLoaded = true;
  const list = document.getElementById("community-feed-list");

  const dayOfMonth = new Date().getDate();
  const champPromise = dayOfMonth <= 7
    ? db.rpc("get_last_month_leaderboard")
    : Promise.resolve({ data: [] });

  const [feedResult, champResult] = await Promise.all([
    db.rpc("get_activity_feed", { p_email: myEmail }),
    champPromise,
  ]);

  if (feedResult.error) {
    list.innerHTML = '<div class="feed-empty">Community activity coming soon.</div>';
    return;
  }

  let champHTML = "";
  const champs = (champResult.data || []).filter(r => !LB_EXCLUDED.has(r.email?.toLowerCase())).slice(0, 3);
  if (champs.length) {
    const now = new Date();
    const last = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    const mName = last.toLocaleString("default", { month: "long" });
    champHTML = `<div class="monthly-champs-card" style="margin:12px 0 4px">
      <div class="monthly-champs-title">🏆 ${escHtml(mName)} Champions</div>
      <div class="monthly-champs-list">${champs.map((r,i) => `
        <div class="monthly-champ-row">
          <span class="monthly-champ-medal">${["🥇","🥈","🥉"][i]}</span>
          <span class="monthly-champ-name">${escHtml(r.name || r.email.split("@")[0])}</span>
          <span class="monthly-champ-time">${formatMinutes(Number(r.total_minutes)||0)}</span>
        </div>`).join("")}
      </div>
      <div class="monthly-champs-sub">Practice time in ${escHtml(mName)}</div>
    </div>`;
  }

  _feedRows = (feedResult.data || []).filter(r => !LB_EXCLUDED.has(r.email?.toLowerCase()));

  // Bulk-load reactions + comment counts for all feed items that have an item_id
  _rxMap = {}; _cmtMap = {};
  const validRows = _feedRows.filter(r => r.item_id != null);
  if (validRows.length) {
    const itemIds = [...new Set(validRows.map(r => String(r.item_id)))];
    const [rxRes, cmtRes] = await Promise.all([
      db.from("activity_reactions").select("event_type,item_id,email,emoji").in("item_id", itemIds),
      db.from("activity_comments").select("event_type,item_id,id").in("item_id", itemIds),
    ]);
    for (const rx of (rxRes.data || [])) {
      const key = `${rx.event_type}:${rx.item_id}`;
      if (!_rxMap[key]) _rxMap[key] = {};
      if (!_rxMap[key][rx.emoji]) _rxMap[key][rx.emoji] = { count: 0, mine: false };
      _rxMap[key][rx.emoji].count++;
      if (rx.email === myEmail) _rxMap[key][rx.emoji].mine = true;
    }
    for (const c of (cmtRes.data || [])) {
      const key = `${c.event_type}:${c.item_id}`;
      _cmtMap[key] = (_cmtMap[key] || 0) + 1;
    }
  }

  _feedPage = 1;
  renderFeedPage(list, champHTML);
}

function renderFeedPage(list, champHTML = "") {
  if (!_feedRows.length) {
    list.innerHTML = (champHTML || "") + '<div class="feed-empty" style="padding:40px 0;text-align:center;color:var(--text-muted)">No activity in the last 14 days.</div>';
    return;
  }
  const visible = _feedRows.slice(0, _feedPage * FEED_PER_PAGE);
  const hasMore = visible.length < _feedRows.length;
  list.innerHTML = (champHTML || "") + visible.map(feedItemHTML).join("") +
    (hasMore ? `<button class="see-more-btn" style="margin-top:4px" onclick="loadMoreFeed()">Show 20 more <span style="opacity:.6">(${_feedRows.length - visible.length} remaining)</span></button>` : "");
}

function loadMoreFeed() {
  _feedPage++;
  renderFeedPage(document.getElementById("community-feed-list"));
}

function feedItemHTML(row) {
  const name    = row.name || row.email.split("@")[0];
  const ini     = initials(name);
  const colour  = avatarColour(row.email);
  const timeAgo = relativeTime(row.created_at || row.session_date);

  // Build per-item reaction + comment footer
  const itemKey  = row.item_id != null ? `${row.event_type}:${String(row.item_id)}` : null;
  const rxData   = itemKey ? (_rxMap[itemKey] || {}) : {};
  const cmtCount = itemKey ? (_cmtMap[itemKey] || 0) : 0;
  const safeKey  = itemKey ? itemKey.replace(/[^a-z0-9]/gi, "_") : null;

  // Work out Like button state
  let myEmoji = null;
  let totalRx = 0;
  if (itemKey) {
    for (const [e, d] of Object.entries(rxData)) {
      totalRx += d.count;
      if (d.mine) myEmoji = e;
    }
  }
  const likeIcon  = myEmoji || "❤️";
  const likeLabel = myEmoji ? (totalRx > 0 ? String(totalRx) : "") : (totalRx > 0 ? `${totalRx}` : "Like");

  const footer = itemKey ? `
    <div class="activity-footer">
      <div class="feed-time" style="margin-bottom:6px">${timeAgo}</div>
      <div class="activity-actions" id="actions-${safeKey}">
        <button class="activity-like-btn${myEmoji ? " reacted" : ""}" id="like-btn-${safeKey}"
          onclick="toggleReactPicker('${safeKey}','${row.event_type}','${String(row.item_id)}')"
        ><span class="like-emoji">${likeIcon}</span>${likeLabel}</button>
        <div class="activity-react-picker" id="picker-${safeKey}" style="display:none">
          ${ACTIVITY_EMOJIS.map(e => {
            const d = rxData[e] || { count: 0, mine: false };
            return `<button class="${d.mine ? "picked" : ""}"
              onclick="pickReaction(event,'${safeKey}','${row.event_type}','${String(row.item_id)}','${e}')"
            >${e}${d.count > 0 ? `<span class="picker-count">${d.count}</span>` : ""}</button>`;
          }).join("")}
        </div>
        <button class="activity-cmt-btn" id="cmt-btn-${safeKey}"
          onclick="toggleActivityComments(this,'${row.event_type}','${String(row.item_id)}')"
        >💬 ${cmtCount > 0 ? cmtCount : "Comment"}</button>
      </div>
      <div class="activity-cmt-section" id="cmt-${safeKey}" style="display:none">
        <div class="activity-cmt-list"></div>
        <div class="activity-cmt-composer">
          <textarea class="comment-input" placeholder="Write a comment…" rows="1"
            oninput="autoResize(this)"></textarea>
          <button class="activity-cmt-submit"
            onclick="submitActivityComment(this,'${row.event_type}','${String(row.item_id)}')">Post</button>
        </div>
      </div>
    </div>` : `<div class="feed-time" style="margin-top:4px">${timeAgo}</div>`;

  if (row.event_type === "achievement") {
    const ach   = ACH[row.achievement_id] || {};
    const aname = ach.name || row.achievement_id || "Achievement";
    const adesc = ach.desc || "";
    const cat   = ACH_CAT[row.achievement_id] || "sessions";
    const col   = _BADGE_PALETTE[cat] || _BADGE_PALETTE.sessions;
    const badge = achBadgeSVG(row.achievement_id, 38);
    return `<div class="feed-item">
      <div class="feed-avatar" style="background:${colour.bg};color:${colour.fg}">${ini}</div>
      <div class="feed-body">
        <div class="feed-text"><strong style="color:${colour.fg}">${escHtml(name)}</strong> <span style="color:var(--text-muted)">unlocked an achievement</span></div>
        <div class="feed-ach-badge" style="background:rgba(0,0,0,.25);border-color:rgba(255,255,255,.08)">
          <span class="feed-ach-icon">${badge}</span>
          <div>
            <div class="feed-ach-name" style="color:${col[0]}">${escHtml(aname)}</div>
            ${adesc ? `<div class="feed-ach-desc">${escHtml(adesc)}</div>` : ""}
          </div>
        </div>
        ${footer}
      </div>
    </div>`;
  }

  return `<div class="feed-item">
    <div class="feed-avatar" style="background:${colour.bg};color:${colour.fg}">${ini}</div>
    <div class="feed-body">
      <div class="feed-text"><strong style="color:${colour.fg}">${escHtml(name)}</strong> logged <span class="feed-duration">${formatMinutes(row.duration_minutes||0)}</span></div>
      ${footer}
    </div>
  </div>`;
}

// ── Activity reactions — picker ───────────────────────────────────────────────
let _openPicker = null; // currently open picker safeKey

// Close picker when clicking outside
document.addEventListener("click", e => {
  if (!_openPicker) return;
  const picker = document.getElementById(`picker-${_openPicker}`);
  const likeBtn = document.getElementById(`like-btn-${_openPicker}`);
  if (picker && !picker.contains(e.target) && e.target !== likeBtn && !likeBtn?.contains(e.target)) {
    picker.style.display = "none";
    _openPicker = null;
  }
});

function toggleReactPicker(safeKey, eventType, itemId) {
  const picker = document.getElementById(`picker-${safeKey}`);
  if (!picker) return;

  if (_openPicker && _openPicker !== safeKey) {
    const prev = document.getElementById(`picker-${_openPicker}`);
    if (prev) prev.style.display = "none";
  }

  const isOpen = picker.style.display !== "none";
  picker.style.display = isOpen ? "none" : "";
  _openPicker = isOpen ? null : safeKey;
}

async function pickReaction(event, safeKey, eventType, itemId, emoji) {
  event.stopPropagation(); // don't bubble to document close listener

  const picker  = document.getElementById(`picker-${safeKey}`);
  const likeBtn = document.getElementById(`like-btn-${safeKey}`);
  const key     = `${eventType}:${String(itemId)}`;
  if (!_rxMap[key]) _rxMap[key] = {};

  const pickerBtn = event.currentTarget;
  const wasPicked = pickerBtn.classList.contains("picked");
  const existingEmoji = Object.keys(_rxMap[key]).find(e => _rxMap[key][e]?.mine);

  // Close picker
  if (picker) picker.style.display = "none";
  _openPicker = null;

  // If re-tapping my own emoji → remove reaction
  if (wasPicked) {
    pickerBtn.classList.remove("picked");
    const d = _rxMap[key][emoji];
    if (d) { d.mine = false; d.count = Math.max(0, d.count - 1); }
    _refreshLikeBtn(safeKey, key);
    _refreshPickerCounts(safeKey, key);
    await db.from("activity_reactions").delete()
      .eq("email", myEmail).eq("event_type", eventType)
      .eq("item_id", String(itemId)).eq("emoji", emoji);
    return;
  }

  // Remove any previous reaction first (only one at a time)
  if (existingEmoji) {
    const prevBtn = picker?.querySelector(".picked");
    if (prevBtn) prevBtn.classList.remove("picked");
    const d = _rxMap[key][existingEmoji];
    if (d) { d.mine = false; d.count = Math.max(0, d.count - 1); }
    await db.from("activity_reactions").delete()
      .eq("email", myEmail).eq("event_type", eventType)
      .eq("item_id", String(itemId)).eq("emoji", existingEmoji);
  }

  // Add new reaction
  pickerBtn.classList.add("picked");
  if (!_rxMap[key][emoji]) _rxMap[key][emoji] = { count: 0, mine: false };
  _rxMap[key][emoji].mine = true;
  _rxMap[key][emoji].count++;
  _refreshLikeBtn(safeKey, key);
  _refreshPickerCounts(safeKey, key);

  await db.from("activity_reactions")
    .insert({ email: myEmail, event_type: eventType, item_id: String(itemId), emoji });
}

function _refreshLikeBtn(safeKey, key) {
  const btn = document.getElementById(`like-btn-${safeKey}`);
  if (!btn) return;
  const rxData = _rxMap[key] || {};
  let myEmoji = null, total = 0;
  for (const [e, d] of Object.entries(rxData)) {
    total += d.count;
    if (d.mine) myEmoji = e;
  }
  const icon  = myEmoji || "❤️";
  const label = myEmoji ? (total > 0 ? String(total) : "") : (total > 0 ? String(total) : "Like");
  btn.classList.toggle("reacted", !!myEmoji);
  btn.innerHTML = `<span class="like-emoji">${icon}</span>${label}`;
}

function _refreshPickerCounts(safeKey, key) {
  const picker = document.getElementById(`picker-${safeKey}`);
  if (!picker) return;
  const rxData = _rxMap[key] || {};
  picker.querySelectorAll("button").forEach((btn, i) => {
    const e = ACTIVITY_EMOJIS[i];
    if (!e) return;
    const d = rxData[e] || { count: 0 };
    btn.innerHTML = `${e}${d.count > 0 ? `<span class="picker-count">${d.count}</span>` : ""}`;
  });
}

// ── Activity comments ─────────────────────────────────────────────────────────
async function toggleActivityComments(btn, eventType, itemId) {
  const safeKey = `${eventType}:${String(itemId)}`.replace(/[^a-z0-9]/gi, "_");
  const section = document.getElementById(`cmt-${safeKey}`);
  if (!section) return;

  const isOpen = section.style.display !== "none";
  section.style.display = isOpen ? "none" : "";
  btn.classList.toggle("open", !isOpen);

  if (!isOpen) {
    await loadActivityComments(section, eventType, String(itemId));
  }
}

async function loadActivityComments(section, eventType, itemId) {
  const listEl = section.querySelector(".activity-cmt-list");
  listEl.innerHTML = `<div style="font-size:.78rem;color:var(--text-muted);padding:4px 0">Loading…</div>`;

  const { data, error } = await db.from("activity_comments")
    .select("id,email,name,content,created_at")
    .eq("event_type", eventType).eq("item_id", itemId)
    .order("created_at", { ascending: true });

  if (error) { listEl.innerHTML = ""; return; }

  if (!data.length) {
    listEl.innerHTML = `<div style="font-size:.78rem;color:var(--text-muted);padding:2px 0">No comments yet — be the first!</div>`;
    return;
  }

  listEl.innerHTML = data.map(c => {
    const n   = c.name || c.email.split("@")[0];
    const col = avatarColour(c.email);
    const canDel = c.email === myEmail || isAdmin;
    return `<div class="activity-cmt-item" id="acmt-${c.id}">
      <div class="feed-avatar" style="width:26px;height:26px;min-width:26px;font-size:.65rem;background:${col.bg};color:${col.fg}">${initials(n)}</div>
      <div class="activity-cmt-content">
        <div class="activity-cmt-meta">
          <strong style="color:${col.fg}">${escHtml(n)}</strong>
          <span class="activity-cmt-time">${relativeTime(c.created_at)}</span>
          ${canDel ? `<button class="activity-cmt-del" title="Delete" onclick="deleteActivityComment('${c.id}','${eventType}','${itemId}')">×</button>` : ""}
        </div>
        <div class="activity-cmt-text">${escHtml(c.content)}</div>
      </div>
    </div>`;
  }).join("");

  // Keep count in sync
  const key = `${eventType}:${itemId}`;
  _cmtMap[key] = data.length;
  _updateCmtBtn(eventType, itemId, data.length);
}

async function submitActivityComment(btn, eventType, itemId) {
  const section = btn.closest(".activity-cmt-section");
  const textarea = section.querySelector(".comment-input");
  const content  = textarea.value.trim();
  if (!content) return;

  btn.disabled = true;
  const { error } = await db.from("activity_comments").insert({
    event_type: eventType, item_id: String(itemId),
    email: myEmail, name: myName, content,
  });
  btn.disabled = false;
  if (error) { alert("Couldn't post comment — please try again."); return; }

  textarea.value = ""; textarea.style.height = "";
  await loadActivityComments(section, eventType, String(itemId));
}

async function deleteActivityComment(commentId, eventType, itemId) {
  const el = document.getElementById(`acmt-${commentId}`);
  if (el) el.style.opacity = "0.4";
  const { error } = await db.from("activity_comments").delete().eq("id", commentId);
  if (error) { if (el) el.style.opacity = ""; return; }
  if (el) el.remove();
  const key = `${eventType}:${String(itemId)}`;
  _cmtMap[key] = Math.max(0, (_cmtMap[key] || 1) - 1);
  _updateCmtBtn(eventType, itemId, _cmtMap[key]);
}

function _updateCmtBtn(eventType, itemId, count) {
  const safeKey = `${eventType}:${String(itemId)}`.replace(/[^a-z0-9]/gi, "_");
  const btn = document.getElementById(`cmt-btn-${safeKey}`);
  if (btn) btn.innerHTML = `💬 ${count > 0 ? count : "Comment"}`;
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function escHtml(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}

function avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)", fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)", fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)", fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}

function relativeTime(ts) {
  if (!ts) return "";
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if (m < 2)  return "just now";
  if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`;
  if (d === 1) return "yesterday";
  return `${d}d ago`;
}

function formatMinutes(mins) {
  if (!mins||mins<=0) return "0 min";
  const h = Math.floor(mins/60), m = mins%60;
  if (h===0) return `${m} min`;
  if (m===0) return `${h}h`;
  return `${h}h ${m}m`;
}
