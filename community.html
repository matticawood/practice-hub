<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3/dist/mux-player.mjs"></script>
  <style>
    /* ── Light theme override ────────────────────────────────────────────────── */
    :root {
      --bg:           #faf7f3;
      --surface:      #ffffff;
      --surface-2:    #f0ebe2;
      --border:       #e0d5c8;
      --text:         #1a1410;
      --text-muted:   #8a7868;
      --accent-subtle:#fdf0d8;
    }
    body { background: var(--bg); }

    /* ── Layout ──────────────────────────────────────────────────────────────── */
    #community-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    /* ── Page tabs: Posts | Activity ──────────────────────────────────────────── */
    .comm-page-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .comm-page-hdr h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }
    .comm-tabs {
      display: flex;
      gap: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
    }
    .comm-tab {
      background: none; border: none; cursor: pointer;
      padding: 6px 16px; font-size: 0.82rem; font-weight: 700;
      color: var(--text-muted); border-radius: 6px;
      transition: background .15s, color .15s; font-family: inherit;
      white-space: nowrap;
    }
    .comm-tab.active { background: var(--accent); color: #1a1410; }

    /* ── Space cards ──────────────────────────────────────────────────────────── */
    .space-cards-row {
      display: flex; gap: 8px; padding: 14px 0 8px;
      overflow-x: auto; scrollbar-width: none;
    }
    .space-cards-row::-webkit-scrollbar { display: none; }
    .space-card {
      position: relative;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 8px 14px;
      cursor: pointer; transition: border-color .15s, background .15s;
      font-family: inherit; flex-shrink: 0;
    }
    .space-card:hover { border-color: var(--accent); }
    .space-card.active {
      border-color: var(--accent);
      background: rgba(245,197,24,.08);
    }
    .space-card-icon { font-size: 1.5rem; line-height: 1; }
    .space-card-label {
      font-size: 0.78rem; font-weight: 600; color: var(--text-muted);
      text-align: center; line-height: 1.3; white-space: nowrap;
    }
    .space-card.active .space-card-label { color: var(--accent); }
    .space-card-badge {
      position: absolute; top: -7px; right: -7px;
      background: #e53e3e; color: #fff;
      font-size: 0.62rem; font-weight: 800;
      min-width: 17px; height: 17px; border-radius: 999px;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px; line-height: 1; pointer-events: none;
      border: 2px solid var(--bg);
    }

    /* ── Composer prompt bar (list view) ─────────────────────────────────────── */
    .composer-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 24px;
      cursor: pointer;
      transition: border-color .15s;
    }
    .composer-card:hover { border-color: rgba(245,197,24,.35); }
    .composer-prompt {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .composer-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.72rem; font-weight: 800; flex-shrink: 0;
    }
    .composer-placeholder {
      flex: 1;
      background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 9px 16px;
      font-size: 0.87rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    /* ── Composer modal ───────────────────────────────────────────────────────── */
    .composer-modal-backdrop {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,.65);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .composer-modal {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      width: 100%; max-width: 640px;
      max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column;
      position: relative;
    }
    .composer-modal-hdr {
      padding: 16px 18px 0;
      flex-shrink: 0;
    }
    .composer-modal-body {
      padding: 0 18px;
      flex: 1; overflow-y: auto;
    }
    .composer-modal-footer {
      padding: 12px 18px 16px;
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .composer-type-row {
      display: flex; gap: 8px; flex-wrap: wrap;
      margin: 12px 0 14px;
    }
    .post-type-btn {
      background: none;
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 5px 13px;
      font-size: 0.78rem; font-weight: 600;
      color: var(--text-muted);
      cursor: pointer; transition: border-color .15s, color .15s, background .15s;
      font-family: inherit;
    }
    .post-type-btn:hover { border-color: #3a3a3a; color: var(--text); }
    .post-type-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(245,197,24,.08);
    }

    .composer-title-input {
      width: 100%; box-sizing: border-box;
      background: transparent; border: none;
      border-bottom: 1.5px solid var(--border);
      color: var(--text);
      font-size: 1.05rem; font-weight: 700; font-family: inherit;
      padding: 10px 2px; margin-bottom: 4px;
      transition: border-color .15s;
    }
    .composer-title-input:focus { outline: none; border-bottom-color: var(--accent); }
    .composer-title-input::placeholder { font-weight: 400; color: var(--text-muted); }

    .composer-textarea {
      width: 100%; box-sizing: border-box;
      background: transparent; border: none;
      color: var(--text);
      font-size: 0.95rem; font-family: inherit; line-height: 1.6;
      padding: 10px 2px; resize: none;
      min-height: 60px; overflow: hidden;
    }
    .composer-textarea:focus { outline: none; }

    /* ── Composer toolbar ─────────────────────────────────────────────────────── */
    .composer-toolbar {
      display: flex; align-items: center; gap: 4px;
      flex: 1;
    }
    .toolbar-btn {
      width: 32px; height: 32px;
      background: none; border: 1.5px solid transparent;
      border-radius: 8px; cursor: pointer; font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: background .15s, border-color .15s, color .15s;
      position: relative;
      font-family: inherit;
    }
    .toolbar-btn:hover { background: rgba(0,0,0,.05); color: var(--text); border-color: var(--border); }
    .toolbar-btn.recording {
      color: #ef4444; border-color: #ef4444;
      animation: pulse-red 1s ease-in-out infinite;
    }
    .toolbar-btn[title]:hover::after {
      content: attr(title);
      position: absolute; bottom: calc(100% + 6px); left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); font-size: 0.72rem; white-space: nowrap;
      padding: 3px 8px; border-radius: 5px; pointer-events: none;
      z-index: 10;
    }
    @keyframes pulse-red {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
      50%      { box-shadow: 0 0 0 5px rgba(239,68,68,.25); }
    }

    .composer-cancel {
      background: none; border: none; font-size: 0.85rem;
      color: var(--text-muted); cursor: pointer; font-family: inherit;
      padding: 6px 10px; border-radius: 6px;
      transition: color .15s;
    }
    .composer-cancel:hover { color: var(--text); }

    /* ── Recording indicator ─────────────────────────────────────────────────── */
    .recording-indicator {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.8rem; color: #ef4444; font-weight: 600;
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
      border-radius: 20px; padding: 4px 12px; margin-top: 8px;
    }
    .recording-stop-btn {
      background: rgba(239,68,68,.2); border: 1px solid rgba(239,68,68,.4);
      border-radius: 12px; color: #ef4444; cursor: pointer;
      font-size: 0.75rem; font-weight: 700; padding: 2px 10px; margin-left: 4px;
    }
    .recording-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444;
      animation: pulse-red 1s ease-in-out infinite;
    }
    /* ── Video recording preview panel ──────────────────────────────────────── */
    .video-rec-panel {
      background: #0d0d0d; border: 1.5px solid var(--border);
      border-radius: 12px; overflow: hidden; margin-top: 10px;
    }
    .video-rec-preview {
      display: block; width: 100%; height: auto;
      background: #000;
    }
    .video-rec-devices {
      display: flex; gap: 8px; padding: 10px 12px 0;
    }
    .video-rec-select {
      flex: 1; background: rgba(0,0,0,.05);
      border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 0.78rem; padding: 6px 8px;
      font-family: inherit; outline: none;
    }
    .video-rec-actions {
      display: flex; gap: 8px; padding: 10px 12px 12px;
    }
    .video-rec-start-btn {
      flex: 1; background: #ef4444; color: #fff; border: none;
      border-radius: 8px; font-weight: 700; font-size: 0.87rem;
      padding: 10px; cursor: pointer; transition: opacity .15s;
    }
    .video-rec-start-btn:hover { opacity: .85; }
    .video-rec-cancel-btn {
      background: rgba(0,0,0,.05); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text-muted); cursor: pointer;
      font-size: 0.85rem; padding: 10px 16px;
    }
    .video-rec-recording-bar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 14px 12px; background: rgba(239,68,68,.08);
    }
    .video-rec-recording-bar .recording-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #ef4444;
      animation: blink 1s ease-in-out infinite; flex-shrink: 0;
    }
    #video-rec-timer { font-size: 0.88rem; font-weight: 600; color: var(--text); flex: 1; }
    .video-rec-stop-btn {
      background: #ef4444; color: #fff; border: none; border-radius: 8px;
      font-weight: 700; font-size: 0.82rem; padding: 8px 14px; cursor: pointer;
    }

    /* ── Video URL inline panel ───────────────────────────────────────────────── */
    /* ── Video attach panel ───────────────────────────────────────────────────── */
    .video-attach-panel {
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 12px; margin-top: 10px; overflow: hidden;
    }
    .video-attach-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px 0;
      font-size: 1rem; font-weight: 700; color: var(--text);
    }
    .video-attach-close {
      background: rgba(0,0,0,.06); border: none; border-radius: 6px;
      color: var(--text-muted); cursor: pointer;
      font-size: 0.85rem; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
    }
    .video-attach-tabs {
      display: flex; gap: 0; padding: 10px 16px 0;
      border-bottom: 1.5px solid var(--border);
    }
    .video-tab {
      background: none; border: none; border-bottom: 2.5px solid transparent;
      color: var(--text-muted); cursor: pointer; font-size: 0.88rem;
      font-weight: 600; padding: 6px 12px 10px; margin-bottom: -1.5px;
      transition: color .15s, border-color .15s;
    }
    .video-tab.active { color: #fff; border-bottom-color: #fff; }
    .video-dropzone {
      margin: 16px; border: 1.5px dashed rgba(0,0,0,.12);
      border-radius: 10px; padding: 32px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      transition: background .15s, border-color .15s;
    }
    .video-dropzone.drag-over { background: rgba(0,0,0,.05); border-color: rgba(0,0,0,.25); }
    .video-dropzone-icon { font-size: 2rem; opacity: .4; }
    .video-dropzone-text { color: var(--text-muted); font-size: 0.85rem; margin: 0; text-align: center; }
    .video-choose-btn {
      background: #fff; color: #000; border: none; border-radius: 20px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer;
      padding: 8px 20px; margin-top: 4px;
      transition: opacity .15s;
    }
    .video-choose-btn:hover { opacity: .85; }
    .mux-upload-progress {
      width: 80%; height: 4px;
      background: rgba(0,0,0,.08); border-radius: 4px; overflow: hidden;
    }
    .mux-upload-bar {
      height: 100%; background: var(--accent);
      border-radius: 4px; transition: width .3s;
      width: 0%;
    }
    mux-player {
      display: block; border-radius: 8px;
      background: transparent;
      --media-background-color: transparent;
      --media-object-fit: contain;
    }
    .mux-wrap {
      position: relative;
      width: 100%;
      padding-top: 56.25%; /* default 16:9 — JS overrides for portrait */
      background: transparent;
      overflow: hidden;
    }
    .mux-wrap mux-player {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
    }
    .mux-wrap.portrait {
      padding-top: 0;
      height: min(177.78vw, 72vh);
    }

    /* ── Composer upload progress overlay ────────────────────────────────────── */
    .mux-upload-overlay {
      display: flex; align-items: center; gap: 14px;
      background: rgba(245,197,24,.07);
      border: 1.5px solid rgba(245,197,24,.25);
      border-radius: 10px; padding: 14px 16px;
      margin-bottom: 10px;
    }
    .mux-upload-overlay-icon { font-size: 1.5rem; flex-shrink: 0; }
    .mux-upload-overlay-body { flex: 1; min-width: 0; }
    .mux-upload-overlay-filename {
      font-size: 0.85rem; font-weight: 600; color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 8px;
    }
    .mux-upload-overlay-track {
      width: 100%; height: 5px;
      background: rgba(0,0,0,.08); border-radius: 4px; overflow: hidden;
      margin-bottom: 6px;
    }
    .mux-upload-overlay-bar {
      height: 100%; background: var(--accent);
      border-radius: 4px; transition: width .25s ease;
      width: 0%;
    }
    @keyframes mux-stripe {
      0%   { background-position: 0 0; }
      100% { background-position: 40px 0; }
    }
    .mux-upload-overlay-bar.processing {
      background-color: var(--accent);
      background-image: repeating-linear-gradient(
        45deg,
        rgba(0,0,0,.12) 0px, rgba(0,0,0,.12) 10px,
        transparent 10px, transparent 20px
      );
      background-size: 40px 100%;
      animation: mux-stripe 0.8s linear infinite;
    }
    .mux-upload-overlay-status {
      font-size: 0.75rem; color: var(--text-muted);
    }
    @keyframes mux-pulse { 0%,100% { opacity: 1 } 50% { opacity: .4 } }
    .mux-upload-overlay-status.processing {
      animation: mux-pulse 1.4s ease-in-out infinite;
      color: var(--accent);
    }
    .video-embed-tab {
      display: flex; gap: 8px; align-items: center; padding: 14px 16px;
    }
    .video-url-input {
      flex: 1; background: rgba(0,0,0,.05); border: 1.5px solid var(--border);
      border-radius: 8px; color: var(--text); font-family: inherit;
      font-size: 0.87rem; outline: none; padding: 8px 12px;
    }
    .video-url-input::placeholder { color: #555; }
    .video-url-input:focus { border-color: rgba(0,0,0,.2); }
    .video-add-btn {
      background: var(--accent); color: #000; border: none; border-radius: 8px;
      font-size: 0.85rem; font-weight: 700; cursor: pointer; padding: 8px 16px;
      flex-shrink: 0;
    }

    /* ── Poll builder ─────────────────────────────────────────────────────────── */
    .poll-builder {
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 14px; margin-top: 10px;
    }
    .poll-builder-title {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted); margin-bottom: 10px;
    }
    .poll-question-input, .poll-option-input {
      width: 100%; box-sizing: border-box;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 7px; color: var(--text);
      font-size: 0.87rem; font-family: inherit;
      padding: 8px 12px; margin-bottom: 8px;
      transition: border-color .15s;
    }
    .poll-question-input:focus, .poll-option-input:focus {
      outline: none; border-color: var(--accent);
    }
    .poll-question-input::placeholder, .poll-option-input::placeholder { color: #444; }
    .poll-options-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
    .poll-option-row { display: flex; align-items: center; gap: 6px; }
    .poll-option-row input { flex: 1; margin-bottom: 0; }
    .poll-option-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1.1rem; line-height: 1;
      padding: 2px 4px; transition: color .15s;
    }
    .poll-option-remove:hover { color: #ef4444; }
    .poll-add-option {
      background: none; border: 1.5px dashed var(--border);
      border-radius: 7px; color: var(--text-muted);
      font-size: 0.82rem; font-family: inherit;
      padding: 6px 12px; cursor: pointer; width: 100%;
      transition: border-color .15s, color .15s;
    }
    .poll-add-option:hover { border-color: var(--accent); color: var(--accent); }

    /* ── Code embed panel ────────────────────────────────────────────────────── */
    .code-panel {
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 14px; margin-top: 10px;
    }
    .code-panel-title {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .08em; color: var(--text-muted); margin-bottom: 8px;
    }
    .code-panel textarea {
      width: 100%; box-sizing: border-box;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 7px; color: #a5f3fc;
      font-size: 0.82rem; font-family: 'Courier New', monospace;
      padding: 10px 12px; resize: vertical; min-height: 80px;
      transition: border-color .15s;
    }
    .code-panel textarea:focus { outline: none; border-color: var(--accent); }

    /* ── Media preview area ───────────────────────────────────────────────────── */
    .media-preview-area {
      margin-top: 10px;
    }
    .media-preview-images {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px;
    }
    .media-thumb-wrap {
      position: relative; display: inline-block;
    }
    .media-thumb-wrap img {
      width: 80px; height: 80px; object-fit: cover;
      border-radius: 8px; border: 1.5px solid var(--border); display: block;
    }
    .media-thumb-remove {
      position: absolute; top: -6px; right: -6px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--surface-2); border: 1.5px solid var(--border);
      color: var(--text-muted); font-size: 0.75rem; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background .15s, color .15s;
    }
    .media-thumb-remove:hover { background: #ef4444; color: #fff; border-color: #ef4444; }
    .media-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 5px 10px 5px 8px;
      font-size: 0.8rem; color: var(--text-muted); margin: 4px 4px 4px 0;
    }
    .media-chip-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1rem; line-height: 1;
      padding: 0 2px; transition: color .15s;
    }
    .media-chip-remove:hover { color: #ef4444; }
    .media-preview-video-wrap {
      position: relative; margin-bottom: 8px;
    }
    .media-video-remove {
      display: block; width: 100%; margin-top: 6px;
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3);
      border-radius: 6px; color: #ef4444; cursor: pointer;
      font-size: 0.78rem; padding: 4px 0;
    }
    .media-video-remove:hover { background: rgba(239,68,68,.22); }

    /* ── Post card media strip ────────────────────────────────────────────────── */
    .post-media-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      gap: 6px;
      margin: 0 -20px 14px;
      background: transparent;
    }
    .post-media-strip img {
      display: block;
      width: 100%; height: auto;
    }
    .post-media-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,0,0,.05); border: 1px solid var(--border);
      border-radius: 20px; padding: 4px 10px;
      font-size: 0.78rem; color: var(--text-muted);
      margin: 0 6px 8px 0;
    }

    /* ── Inline media in post cards ──────────────────────────────────────────── */
    .post-card-inline-media {
      margin: 0 -20px 0;
      padding: 10px 20px;
      border-top: 1px solid var(--border);
    }
    .post-card-inline-media:last-of-type { margin-bottom: 10px; }
    .post-card-media-label {
      font-size: 0.75rem; color: var(--text-muted);
      margin-bottom: 6px;
    }
    .post-card-link {
      color: var(--accent); font-size: 0.85rem;
      word-break: break-all; text-decoration: none;
    }
    .post-card-embed {
      padding-left: 0; padding-right: 0;
    }
    .post-card-embed iframe {
      display: block; width: 100%;
      aspect-ratio: 16/9; border: none;
    }
    .post-card-video { padding-left: 0; padding-right: 0; }

    /* ── Detail view media ────────────────────────────────────────────────────── */
    .detail-media-section { margin-bottom: 16px; }
    .detail-media-section img {
      width: 100%; border-radius: 10px; margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .detail-media-section video,
    .detail-media-section audio {
      width: 100%; border-radius: 8px; margin-bottom: 8px;
    }
    .detail-media-section iframe {
      width: 100%; aspect-ratio: 16/9; border-radius: 10px;
      border: 1px solid var(--border); margin-bottom: 8px;
    }
    .detail-yt-thumb {
      position: relative; display: block; margin-bottom: 8px;
      border-radius: 10px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .detail-yt-thumb img { width: 100%; display: block; }
    .detail-yt-play {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,.4);
    }
    .detail-yt-play svg { opacity: .9; }

    /* ── Poll voting UI (detail view) ────────────────────────────────────────── */
    .poll-card {
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 16px; margin-bottom: 16px;
    }
    .poll-card-question {
      font-size: 0.97rem; font-weight: 700; color: var(--text);
      margin-bottom: 12px;
    }
    .poll-option-vote-btn {
      width: 100%; text-align: left; background: rgba(0,0,0,.04);
      border: 1.5px solid var(--border); border-radius: 8px;
      padding: 9px 14px; font-size: 0.87rem; color: var(--text);
      font-family: inherit; cursor: pointer; margin-bottom: 8px;
      transition: border-color .15s, background .15s;
    }
    .poll-option-vote-btn:hover { border-color: var(--accent); background: rgba(245,197,24,.07); }
    .poll-option-vote-btn.voted { border-color: var(--accent); background: rgba(245,197,24,.12); color: #fff; }
    .poll-bar-row {
      margin-bottom: 8px; cursor: pointer; border-radius: 6px; padding: 2px 4px;
    }
    .poll-bar-row:hover .poll-bar-fill { filter: brightness(1.15); }
    .poll-bar-label {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.85rem; color: var(--text); margin-bottom: 4px;
    }
    .poll-bar-label span:last-child { color: var(--text-muted); font-size: 0.78rem; }
    .poll-bar-track {
      background: rgba(0,0,0,.06); border-radius: 4px; height: 6px;
    }
    .poll-bar-fill {
      height: 100%; border-radius: 4px;
      background: var(--accent); transition: width .4s ease;
    }
    .poll-bar-fill.mine { background: #10b981; }
    .poll-footer { display: flex; align-items: center; margin-top: 10px; }
    .poll-total { font-size: 0.75rem; color: var(--text-muted); }

    /* ── Inline poll in post cards ───────────────────────────────────────────── */
    .card-poll {
      margin: 0 -20px; padding: 14px 20px 10px;
      border-top: 1px solid var(--border);
    }
    .card-poll-question {
      font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 10px;
    }
    .card-poll-btn {
      display: block; width: 100%; text-align: left;
      background: rgba(0,0,0,.04); border: 1.5px solid var(--border);
      border-radius: 8px; padding: 8px 12px; font-size: 0.85rem;
      color: var(--text); font-family: inherit; cursor: pointer;
      margin-bottom: 6px; transition: border-color .15s, background .15s;
    }
    .card-poll-btn:hover { border-color: var(--accent); background: rgba(245,197,24,.07); }
    .card-poll-bar-row { margin-bottom: 7px; cursor: pointer; border-radius: 6px; padding: 2px 0; }
    .card-poll-bar-row:hover .card-poll-bar-fill { filter: brightness(1.15); }
    .card-poll-bar-track {
      position: relative; background: rgba(0,0,0,.06);
      border-radius: 4px; height: 7px; margin-bottom: 3px;
    }
    .card-poll-bar-fill {
      height: 100%; border-radius: 4px;
      background: rgba(0,0,0,.12); transition: width .4s ease;
    }
    .card-poll-bar-fill.mine { background: #10b981; }
    .card-poll-bar-meta {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; color: var(--text-muted);
    }
    .card-poll-mine-dot { color: #10b981; }
    .card-poll-pct { font-weight: 600; }
    .card-poll-footer { display: flex; align-items: center; margin-top: 6px; }
    .card-poll-total { font-size: 0.72rem; color: var(--text-muted); }

    /* ── Post cards ───────────────────────────────────────────────────────────── */
    .post-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px 14px;
      margin-bottom: 14px;
      cursor: pointer;
      transition: border-color .15s;
      overflow: hidden;
    }
    .post-card:hover { border-color: rgba(245,197,24,.35); }

    .post-type-badge {
      display: inline-block;
      font-size: 0.65rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em;
      border-radius: 20px; padding: 2px 8px;
      border: 1px solid; white-space: nowrap; flex-shrink: 0;
    }

    .post-title {
      font-size: 1.05rem; font-weight: 700;
      color: var(--text); line-height: 1.3;
      margin-top: 6px; margin-bottom: 10px;
    }

    .post-author-row {
      display: flex; align-items: center;
      gap: 8px; margin-bottom: 10px;
    }
    .post-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 800; flex-shrink: 0;
    }
    .post-author-name { font-size: 0.82rem; font-weight: 600; color: var(--text); }
    .post-author-time { font-size: 0.75rem; color: var(--text-muted); margin-left: auto; }
    .author-badge {
      display: inline-flex; align-items: center;
      background: rgba(245,197,24,.13); border: 1px solid rgba(245,197,24,.25);
      color: var(--accent, #f5c518);
      padding: 1px 8px; border-radius: 99px;
      font-size: 0.67rem; font-weight: 700; letter-spacing: .02em;
      white-space: nowrap; flex-shrink: 0;
    }

    .post-preview {
      font-size: 0.88rem; color: var(--text-muted);
      line-height: 1.55; margin-bottom: 10px;
      word-break: break-word;
      display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
    }
    .post-preview.clamp-short { -webkit-line-clamp: 2; }
    .post-preview.clamp-long  { -webkit-line-clamp: 5; }
    .post-see-more-link {
      font-size: 0.82rem; font-weight: 600;
      color: var(--text-muted); margin-bottom: 10px; display: block;
    }
    .post-see-more-link:hover { color: var(--accent); }
    .post-see-more {
      color: var(--accent); font-weight: 600; font-size: 0.82rem;
    }

    .post-footer {
      display: flex; align-items: center;
      border-top: 1px solid var(--border); padding-top: 10px;
      margin-top: 4px; gap: 8px;
    }
    .post-footer-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: none; border: none; cursor: pointer;
      font-size: 0.82rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 6px;
      transition: color .15s; border-radius: 6px;
    }
    .post-footer-btn:hover { color: var(--text); background: rgba(0,0,0,.05); }
    .post-footer-btn.liked { color: #e879a0; }
    .post-footer-btn svg { flex-shrink: 0; }
    .post-footer-right {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
    }
    .post-footer-avatars {
      display: flex; align-items: center; cursor: pointer;
    }
    .post-footer-avatar {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.52rem; font-weight: 800;
      margin-left: -6px; flex-shrink: 0;
    }
    .post-footer-avatar:first-child { margin-left: 0; }
    .likers-popover {
      position: fixed; z-index: 9999;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
      min-width: 140px; max-width: 220px;
    }
    .likers-popover-title { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
    .likers-popover-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .likers-popover-row:last-child { margin-bottom: 0; }
    .likers-popover-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; flex-shrink: 0; }
    .likers-popover-name { font-size: 0.82rem; color: var(--text); }
    .post-footer-meta {
      font-size: 0.78rem; color: var(--text-muted); white-space: nowrap;
    }

    .posts-empty {
      text-align: center; padding: 48px 0;
      color: var(--text-muted); font-size: 0.87rem; line-height: 1.7;
    }

    /* ── Detail view ─────────────────────────────────────────────────────────── */
    .detail-back {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--text-muted); font-size: 0.85rem; font-weight: 600;
      background: none; border: 1.5px solid var(--border);
      border-radius: 8px; padding: 6px 12px; cursor: pointer;
      transition: border-color .15s, color .15s; font-family: inherit;
      margin-bottom: 20px;
    }
    .detail-back:hover { border-color: var(--accent); color: var(--accent); }

    .detail-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 24px 18px;
      margin-bottom: 20px;
    }
    .detail-title {
      font-size: 1.3rem; font-weight: 700; color: var(--text);
      line-height: 1.3; margin: 10px 0 12px;
    }
    .detail-content {
      font-size: 0.92rem; color: var(--text-muted);
      line-height: 1.65; white-space: pre-wrap; word-break: break-word;
      margin-bottom: 16px;
    }
    .detail-footer {
      display: flex; align-items: center; gap: 16px;
      border-top: 1px solid var(--border); padding-top: 12px;
    }
    .detail-delete-btn {
      margin-left: auto;
      background: none; border: none; cursor: pointer;
      font-size: 0.75rem; color: #3a3a3a;
      font-family: inherit; padding: 4px 8px;
      border-radius: 5px; transition: color .15s;
    }
    .detail-delete-btn:hover { color: #ef4444; }

    /* ── Comments ─────────────────────────────────────────────────────────────── */
    .comments-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .comments-hdr {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted);
    }
    .comment-item {
      display: flex; gap: 10px;
      padding: 13px 20px;
      border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .comment-item:last-of-type { border-bottom: none; }
    .comment-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 800; flex-shrink: 0; margin-top: 1px;
    }
    .comment-body { flex: 1; min-width: 0; }
    .comment-meta {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 3px;
    }
    .comment-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .comment-time { font-size: 0.7rem; color: var(--text-muted); }
    .comment-text {
      font-size: 0.87rem; color: var(--text-muted);
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .comments-empty {
      padding: 24px 20px; text-align: center;
      color: var(--text-muted); font-size: 0.82rem;
    }
    .comment-form {
      display: flex; gap: 10px; align-items: flex-end;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
    }
    .comment-form .btn { align-self: stretch; border-radius: 20px; padding: 0 18px; }
    .comment-input {
      flex: 1; background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 20px; color: var(--text);
      font-size: 0.87rem; font-family: inherit;
      padding: 9px 14px; resize: none; min-height: 38px; max-height: 120px;
      transition: border-color .15s;
    }
    .comment-input:focus { outline: none; border-color: var(--accent); }
    .comment-reply-btn {
      background: none; border: none; cursor: pointer; font-family: inherit;
      font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
      padding: 2px 0; transition: color .15s;
    }
    .comment-reply-btn:hover { color: var(--accent); }
    .comment-replies { margin-left: 36px; margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
    .reply-to-name { color: var(--accent); font-weight: 600; margin-right: 4px; }
    .inline-reply-composer {
      margin-left: 36px; margin-top: 10px; margin-bottom: 4px;
    }
    .inline-reply-composer .irc-row {
      display: flex; gap: 10px; align-items: flex-start;
    }
    .inline-reply-composer textarea {
      flex: 1; min-width: 0;
      background: transparent; border: 1.5px solid var(--accent);
      border-radius: 16px; color: var(--text); font-size: 0.85rem;
      font-family: inherit; padding: 7px 12px; resize: none;
      min-height: 34px; max-height: 100px;
    }
    .inline-reply-composer textarea:focus { outline: none; }
    .inline-reply-composer .irc-actions {
      display: flex; justify-content: flex-end; gap: 14px;
      margin-top: 6px; padding-left: 38px; margin-bottom: 6px;
    }
    .inline-reply-composer .irc-send {
      background: none; border: none; font-family: inherit;
      font-size: 0.8rem; font-weight: 700; cursor: pointer; color: var(--accent); padding: 0;
    }
    .inline-reply-composer .irc-cancel {
      background: none; border: none; font-family: inherit;
      font-size: 0.8rem; cursor: pointer; color: var(--text-muted); padding: 0;
    }
    .inline-reply-composer .irc-cancel:hover { color: var(--text); }

    /* ── Activity feed — island cards ────────────────────────────────────────── */
    #community-feed-list { display: flex; flex-direction: column; gap: 12px; }
    .feed-item {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 18px 20px;
      background: var(--surface);
      border: 1.5px solid #d0c4b4;
      border-radius: var(--radius);
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
    }
    .feed-avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.78rem; font-weight: 800; flex-shrink: 0;
    }
    .feed-body { flex: 1; min-width: 0; }
    .feed-text { font-size: 0.9rem; color: var(--text); line-height: 1.4; }
    .feed-text strong { color: var(--text); font-weight: 700; }
    .feed-time { font-size: 0.72rem; color: var(--text-muted); }
    .feed-empty { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.87rem; }
    .feed-ach-badge {
      display: flex; align-items: center; gap: 12px;
      border-radius: 12px; padding: 12px 14px;
      margin-top: 8px; border: 1px solid; width: 100%; box-sizing: border-box;
    }
    .feed-ach-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .feed-ach-name { font-size: 0.92rem; font-weight: 700; line-height: 1.2; }
    .feed-ach-desc { font-size: 0.76rem; color: var(--text-muted); margin-top: 3px; }
    /* ── Activity actions (Like + Comment) ───────────────────────────────────── */
    .activity-footer { margin-top: 7px; }
    .activity-actions {
      display: flex; align-items: center; gap: 8px; position: relative;
    }
    /* Like button */
    .activity-like-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,.04); border: 1.5px solid rgba(0,0,0,.08);
      border-radius: 8px; padding: 6px 16px;
      font-size: 0.83rem; font-weight: 600; font-family: inherit;
      color: var(--text); cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
      line-height: 1;
    }
    .activity-like-btn:hover { border-color: rgba(0,0,0,.18); background: rgba(0,0,0,.06); }
    .activity-like-btn.reacted {
      border-color: rgba(0,0,0,.2);
      background: rgba(0,0,0,.07);
    }
    /* Comment button — same shape */
    .activity-cmt-btn {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,.04); border: 1.5px solid rgba(0,0,0,.08);
      border-radius: 8px; padding: 6px 16px;
      font-size: 0.83rem; font-weight: 600; font-family: inherit;
      color: var(--text); cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
      line-height: 1;
    }
    .activity-cmt-btn:hover { border-color: rgba(0,0,0,.18); background: rgba(0,0,0,.06); }
    .activity-cmt-btn.open { border-color: rgba(0,0,0,.2); background: rgba(0,0,0,.07); }
    /* Session duration block — mirrors the achievement badge */
    .feed-session-block {
      display: flex; align-items: center; gap: 12px;
      border-radius: 12px; padding: 12px 14px;
      margin-top: 8px; margin-bottom: 2px;
      background: rgba(0,0,0,.25);
      border: 1px solid rgba(0,0,0,.06);
      width: 100%; box-sizing: border-box;
    }
    .feed-session-icon { display: flex; align-items: center; flex-shrink: 0; color: var(--accent); }
    .feed-session-duration { font-size: 1.3rem; font-weight: 800; color: var(--accent); line-height: 1; }
    .feed-session-label { font-size: 0.74rem; color: var(--text-muted); margin-top: 4px; }
    /* Emoji picker popup */
    .activity-react-picker {
      position: absolute; bottom: calc(100% + 8px); left: 0;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 32px; padding: 6px 8px;
      display: flex; align-items: center; gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
      z-index: 200; white-space: nowrap;
    }
    .activity-react-picker button {
      display: inline-flex; flex-direction: column; align-items: center; gap: 1px;
      background: none; border: none; border-radius: 10px;
      padding: 5px 7px; cursor: pointer; font-size: 1.3rem; line-height: 1;
      transition: transform .12s, background .12s;
      position: relative;
    }
    .activity-react-picker button:hover { transform: scale(1.35); background: rgba(0,0,0,.06); }
    .activity-react-picker button.picked { background: rgba(0,0,0,.07); }
    .activity-react-picker button .picker-count {
      font-size: 0.62rem; color: var(--text-muted); font-family: inherit; line-height: 1;
    }
    /* Comment section */
    .activity-cmt-section {
      margin-top: 10px; padding-top: 10px;
      border-top: 1px solid var(--border);
    }
    .activity-cmt-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
    .activity-cmt-item { display: flex; align-items: flex-start; gap: 8px; }
    .activity-cmt-content { flex: 1; min-width: 0; }
    .activity-cmt-meta {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.75rem; margin-bottom: 2px;
    }
    .activity-cmt-time { color: var(--text-muted); }
    .activity-cmt-del {
      margin-left: auto; background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 1rem; padding: 0 2px; line-height: 1;
    }
    .activity-cmt-del:hover { color: #f87171; }
    .activity-cmt-text { font-size: 0.83rem; color: var(--text); line-height: 1.45; word-break: break-word; }
    .activity-cmt-composer { display: flex; align-items: flex-start; gap: 8px; }
    .activity-cmt-submit {
      flex-shrink: 0; padding: 7px 14px;
      background: var(--accent); color: #000;
      border: none; border-radius: 8px; font-size: 0.8rem;
      font-weight: 700; cursor: pointer; font-family: inherit;
      transition: opacity .15s;
    }
    .activity-cmt-submit:disabled { opacity: .5; cursor: default; }
    .see-more-btn {
      display: block; width: 100%; margin: 4px 0 8px;
      padding: 10px; background: transparent;
      border: 1.5px solid var(--border); border-radius: 8px;
      color: var(--text-muted); font-size: 0.82rem; font-weight: 600;
      cursor: pointer; transition: border-color .15s, color .15s;
      text-align: center; font-family: inherit;
    }
    .see-more-btn:hover { border-color: var(--accent); color: var(--accent); }
    .monthly-champs-card {
      background: linear-gradient(135deg, rgba(245,158,11,.12), rgba(236,72,153,.08));
      border: 1px solid rgba(245,158,11,.25); border-radius: 14px;
      padding: 16px; margin-bottom: 12px;
    }
    .monthly-champs-title { font-size: 0.85rem; font-weight: 800; color: #FFD700; margin-bottom: 12px; }
    .monthly-champs-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
    .monthly-champ-row { display: flex; align-items: center; gap: 10px; font-size: 0.85rem; }
    .monthly-champ-medal { font-size: 1.1rem; width: 24px; text-align: center; }
    .monthly-champ-name { flex: 1; font-weight: 600; color: var(--text); }
    .monthly-champ-time { font-size: 0.75rem; color: var(--text-muted); }
    .monthly-champs-sub { font-size: 0.68rem; color: var(--text-muted); text-align: right; }

    /* ── Members directory ───────────────────────────────────────────────────── */
    #panel-members { padding-top: 4px; }
    .members-search-wrap {
      position: relative; margin-bottom: 20px;
    }
    .members-search-wrap input {
      width: 100%; box-sizing: border-box;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-size: 0.9rem; font-family: inherit;
      padding: 10px 14px 10px 38px;
      transition: border-color .15s; outline: none;
    }
    .members-search-wrap input:focus { border-color: var(--accent); }
    .members-search-wrap svg {
      position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
      color: var(--text-muted); pointer-events: none;
    }
    .members-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }
    .member-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 20px 16px 16px;
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; text-align: center;
      transition: border-color .15s;
      cursor: default;
    }
    .member-card:hover { border-color: rgba(245,197,24,.4); }
    .member-avatar {
      width: 64px; height: 64px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
    }
    .member-avatar-initials {
      width: 64px; height: 64px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 800; flex-shrink: 0;
    }
    .member-name {
      font-size: 0.92rem; font-weight: 700; color: var(--text);
      line-height: 1.2;
    }
    .member-badge {
      font-size: 0.68rem; font-weight: 600;
      color: var(--accent); background: rgba(245,197,24,.1);
      border: 1px solid rgba(245,197,24,.25);
      border-radius: 20px; padding: 2px 8px;
    }
    .member-headline {
      font-size: 0.78rem; color: var(--text-muted);
      line-height: 1.3; max-width: 100%;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .member-location {
      font-size: 0.72rem; color: var(--text-muted);
      display: flex; align-items: flex-start; gap: 4px;
      text-align: left; line-height: 1.3;
    }
    .member-location svg { flex-shrink: 0; margin-top: 1px; }
    .member-instrument {
      font-size: 0.72rem; color: var(--text-muted);
    }

    /* ── Member profile modal (stays dark regardless of page theme) ─────────── */
    .member-modal, .member-modal * {
      --text:       #f0f0f0;
      --text-muted: #888888;
      --border:     #2a2a2a;
      --surface:    #1e1e1e;
      --surface-2:  #252525;
    }
    .member-modal-backdrop {
      position: fixed; inset: 0; z-index: 999;
      background: rgba(0,0,0,.75);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .member-modal {
      background: #161616;
      border: 1.5px solid #2a2a2a;
      border-radius: 16px;
      width: 100%; max-width: 640px;
      height: 82vh;
      display: flex; flex-direction: column;
      position: relative; overflow: hidden;
      color: #f0f0f0;
    }
    .member-modal-close {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      background: rgba(0,0,0,.4); border: none; color: var(--text-muted);
      font-size: 1.1rem; cursor: pointer; line-height: 1;
      width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
      border-radius: 6px; transition: background .15s, color .15s;
    }
    .member-modal-close:hover { background: rgba(0,0,0,.08); color: #fff; }
    /* Hero: avatar left, info right */
    .member-modal-hero {
      display: flex; align-items: center; gap: 18px;
      padding: 24px 48px 20px 24px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .member-modal-avatar {
      width: 76px; height: 76px; border-radius: 50%;
      object-fit: cover; flex-shrink: 0;
      border: 2px solid var(--border);
    }
    .member-modal-avatar-initials {
      width: 76px; height: 76px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; font-weight: 800;
      border: 2px solid rgba(0,0,0,.06);
    }
    .member-modal-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
    .member-modal-name {
      font-size: 1.1rem; font-weight: 700; color: #fff; line-height: 1.2;
    }
    .member-modal-badge {
      display: inline-flex; align-items: center;
      font-size: 0.72rem; font-weight: 600; white-space: nowrap;
      color: var(--accent); background: rgba(245,197,24,.1);
      border: 1px solid rgba(245,197,24,.3);
      border-radius: 20px; padding: 3px 10px; width: fit-content;
    }
    .member-modal-headline {
      font-size: 0.85rem; color: var(--text-muted); line-height: 1.4;
    }
    .member-modal-meta { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-top: 2px; }
    .member-modal-meta-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.78rem; color: var(--text-muted); line-height: 1.3;
    }
    .member-modal-meta-item svg { flex-shrink: 0; }
    /* Tabs */
    .member-modal-tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      padding: 0 20px; flex-shrink: 0; background: var(--surface);
    }
    .member-modal-tab {
      background: none; border: none; cursor: pointer;
      padding: 11px 18px; font-size: 0.82rem; font-weight: 700;
      color: var(--text-muted); font-family: inherit;
      border-bottom: 2px solid transparent; margin-bottom: -1px;
      transition: color .15s, border-color .15s;
    }
    .member-modal-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .member-modal-tab:hover:not(.active) { color: var(--text); }
    /* Tab panels */
    .member-modal-panels { flex: 1; overflow-y: auto; padding: 20px; }
    .member-modal-panel { display: none; }
    .member-modal-panel.active { display: block; }
    /* About tab */
    .mm-about-section { margin-bottom: 20px; }
    .mm-about-label {
      font-size: 0.68rem; font-weight: 700; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px;
    }
    .mm-about-value { font-size: 0.88rem; color: var(--text); line-height: 1.55; }
    .mm-social-links { display: flex; gap: 8px; flex-wrap: wrap; }
    .mm-social-links a {
      display: flex; align-items: center; gap: 6px;
      font-size: 0.8rem; color: var(--text-muted);
      background: rgba(0,0,0,.05); border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 12px; text-decoration: none;
      transition: border-color .15s, color .15s;
    }
    .mm-social-links a:hover { border-color: var(--accent); color: var(--accent); }
    /* Posts tab */
    .mm-post-item {
      background: rgba(255,255,255,.03); border: 1px solid var(--border);
      border-radius: 10px; padding: 14px 16px; margin-bottom: 10px;
      cursor: pointer; transition: border-color .15s;
    }
    .mm-post-item:hover { border-color: rgba(245,197,24,.3); }
    .mm-post-type { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; }
    .mm-post-title { font-size: 0.9rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .mm-post-preview { font-size: 0.82rem; color: var(--text-muted); line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .mm-post-time { font-size: 0.72rem; color: var(--text-muted); margin-top: 6px; }
    /* Activity tab */
    .mm-activity-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 12px 0; border-bottom: 1px solid var(--border);
    }
    .mm-activity-item:last-child { border-bottom: none; }
    .mm-activity-icon {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }
    .mm-activity-body { flex: 1; min-width: 0; }
    .mm-activity-title { font-size: 0.88rem; color: var(--text); font-weight: 600; line-height: 1.3; }
    .mm-activity-desc { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; line-height: 1.3; }
    .mm-activity-time { font-size: 0.72rem; color: var(--text-muted); margin-top: 3px; }
    /* Achievements tab */
    .mm-ach-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }
    .mm-ach-card {
      background: rgba(255,255,255,.03);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 10px 12px;
      display: flex; flex-direction: column; align-items: center;
      gap: 7px; text-align: center;
    }
    .mm-ach-card-name {
      font-size: 0.75rem; font-weight: 700; line-height: 1.2;
    }
    .mm-ach-card-desc {
      font-size: 0.68rem; color: var(--text-muted); line-height: 1.3;
    }
    .mm-ach-card-date {
      font-size: 0.65rem; color: var(--text-muted); margin-top: 2px;
    }
    .mm-tab-empty { text-align: center; padding: 40px 0; color: var(--text-muted); font-size: 0.85rem; }
    .mm-tab-loading { text-align: center; padding: 30px 0; color: var(--text-muted); font-size: 0.85rem; }
    @media (max-width: 480px) {
      .member-modal-hero { gap: 14px; padding: 20px 44px 16px 18px; }
      .member-modal-avatar, .member-modal-avatar-initials { width: 60px; height: 60px; font-size: 1.2rem; }
    }
    .members-empty {
      text-align: center; padding: 60px 0;
      color: var(--text-muted); font-size: 0.87rem;
    }
    .members-count {
      font-size: 0.78rem; color: var(--text-muted);
      margin-bottom: 16px;
    }
    @media (max-width: 480px) {
      .members-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .member-card { padding: 16px 10px 12px; }
    }
    @media (max-width: 600px) {
      main { padding: 0; }
      #community-main { padding: 16px 0 80px; }
      .post-card {
        border-radius: 0;
        border-left: none;
        border-right: none;
        margin-bottom: 8px;
      }
      .feed-item {
        border-radius: 0;
        border-left: none;
        border-right: none;
        margin-bottom: 8px;
      }
      .comm-page-hdr { padding: 0 16px; flex-direction: column; align-items: stretch; gap: 8px; }
      .comm-tabs { width: 100%; }
      .comm-tab { flex: 1; text-align: center; padding: 7px 8px; }
      .space-cards-row { padding: 14px 16px 8px; }
      .composer-card { margin: 0 0 12px; border-radius: 0; border-left: none; border-right: none; }
      #posts-list { margin: 0; }
      #community-feed-list { gap: 0; }
    }
  </style>
</head>
<body>

  <header id="app-header" style="display:none"></header>

  <main>
    <div id="community-main" style="display:none">

      <!-- ── List view ──────────────────────────────────────────────────────── -->
      <div id="view-list">

        <div class="comm-page-hdr">
          <h2>Community</h2>
          <div class="comm-tabs">
            <button class="comm-tab active" id="tab-btn-posts"    onclick="switchTab('posts')">Posts</button>
            <button class="comm-tab"        id="tab-btn-activity" onclick="switchTab('activity')">Activity</button>
            <button class="comm-tab"        id="tab-btn-members"  onclick="switchTab('members')">Members</button>
          </div>
        </div>

        <!-- Composer modal (hidden by default) -->
        <div class="composer-modal-backdrop" id="composer-modal-backdrop" style="display:none" onclick="handleBackdropClick(event)">
          <div class="composer-modal" id="composer-modal" onclick="event.stopPropagation()">
            <!-- Header: type selector -->
            <div class="composer-modal-hdr">
              <div class="composer-type-row">
                <button class="post-type-btn" data-type="progress" onclick="selectType(this)">Share Your Progress</button>
                <button class="post-type-btn" data-type="feedback" onclick="selectType(this)">Get Feedback</button>
                <button class="post-type-btn" data-type="question" onclick="selectType(this)">Ask a Question</button>
                <button class="post-type-btn" data-type="post"     onclick="selectType(this)">Just Post</button>
              </div>
            </div>

            <!-- Body -->
            <div class="composer-modal-body">
              <input class="composer-title-input" id="composer-title" placeholder="Add a title…" maxlength="120" />
              <textarea class="composer-textarea" id="composer-content" placeholder="What are you working on?" rows="3" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>

              <!-- Media preview area -->
              <div class="media-preview-area" id="composer-media-preview"></div>

              <!-- Mux upload progress (shown during video upload) -->
              <div id="mux-upload-overlay" style="display:none" class="mux-upload-overlay">
                <div class="mux-upload-overlay-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
                <div class="mux-upload-overlay-body">
                  <div class="mux-upload-overlay-filename" id="mux-overlay-filename">Uploading video…</div>
                  <div class="mux-upload-overlay-track">
                    <div class="mux-upload-overlay-bar" id="mux-overlay-bar"></div>
                  </div>
                  <div class="mux-upload-overlay-status" id="mux-overlay-status">Starting…</div>
                </div>
              </div>

              <!-- Video recording preview panel -->
              <div id="video-rec-panel" style="display:none" class="video-rec-panel">
                <video id="video-rec-preview" autoplay muted playsinline class="video-rec-preview"></video>
                <!-- Device selectors (hidden while recording) -->
                <div class="video-rec-devices" id="video-rec-devices">
                  <select id="video-rec-camera" class="video-rec-select" onchange="switchCamera()">
                    <option>Loading cameras…</option>
                  </select>
                  <select id="video-rec-mic" class="video-rec-select" onchange="switchCamera()">
                    <option>Loading mics…</option>
                  </select>
                </div>
                <!-- Pre-recording actions -->
                <div class="video-rec-actions" id="video-rec-actions">
                  <button class="video-rec-start-btn" id="video-rec-start-btn" onclick="startVideoRecordingFromPreview()">⏺ Start Recording</button>
                  <button class="video-rec-cancel-btn" onclick="cancelVideoPreview()">Cancel</button>
                </div>
                <!-- Active recording bar (shown while recording) -->
                <div class="video-rec-recording-bar" id="video-rec-recording-bar" style="display:none">
                  <span class="recording-dot"></span>
                  <span id="video-rec-timer">0:00</span>
                  <button class="video-rec-stop-btn" onclick="_stopRecording()">■ Stop & Upload</button>
                </div>
              </div>

              <!-- Recording indicator -->
              <div id="composer-recording-indicator" style="display:none" class="recording-indicator">
                <span class="recording-dot"></span>
                <span id="composer-recording-label">Recording…</span>
                <span id="composer-recording-time" style="margin-left:4px;font-weight:400;opacity:.8">0:00</span>
                <button class="recording-stop-btn" onclick="toggleVideoRecording()">■ Stop</button>
              </div>

              <!-- Video attach panel (toggled) -->
              <div id="composer-video-url-panel" style="display:none" class="video-attach-panel">
                <div class="video-attach-header">
                  <span>Attach video</span>
                  <button class="video-attach-close" onclick="toggleVideoPanel()" title="Close">✕</button>
                </div>
                <div class="video-attach-tabs">
                  <button class="video-tab active" id="video-tab-upload-btn" onclick="switchVideoTab('upload')">Upload</button>
                  <button class="video-tab" id="video-tab-embed-btn" onclick="switchVideoTab('embed')">Embed link</button>
                </div>
                <!-- Upload tab -->
                <div id="video-tab-upload-panel">
                  <div class="video-dropzone" id="video-dropzone"
                    ondragover="event.preventDefault();this.classList.add('drag-over')"
                    ondragleave="this.classList.remove('drag-over')"
                    ondrop="handleVideoDrop(event)">
                    <div class="video-dropzone-icon"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
                    <p class="video-dropzone-text">Drop your video files here to attach them</p>
                    <button class="video-choose-btn" onclick="document.getElementById('file-input-video').click()">Choose video</button>
                  </div>
                </div>
                <!-- Embed tab -->
                <div id="video-tab-embed-panel" style="display:none" class="video-embed-tab">
                  <input type="text" id="composer-video-url-input" placeholder="Paste YouTube or Vimeo URL…" class="video-url-input" />
                  <button class="video-add-btn" onclick="addVideoUrl()">Add</button>
                </div>
              </div>

              <!-- Poll builder (toggled) -->
              <div id="composer-poll-builder" style="display:none" class="poll-builder">
                <div class="poll-builder-title">Poll</div>
                <input class="poll-question-input" id="poll-question-input" placeholder="Ask a question…" />
                <div class="poll-options-list" id="poll-options-list">
                  <div class="poll-option-row">
                    <input class="poll-option-input" placeholder="Option 1" />
                    <button class="poll-option-remove" onclick="removePollOption(this)" title="Remove">×</button>
                  </div>
                  <div class="poll-option-row">
                    <input class="poll-option-input" placeholder="Option 2" />
                    <button class="poll-option-remove" onclick="removePollOption(this)" title="Remove">×</button>
                  </div>
                </div>
                <button class="poll-add-option" onclick="addPollOption()">+ Add option</button>
              </div>

              <!-- Code embed panel (toggled) -->
              <div id="composer-code-panel" style="display:none" class="code-panel">
                <div class="code-panel-title">&lt;/&gt; Code / HTML embed</div>
                <textarea id="composer-code-input" placeholder="Paste HTML or JavaScript here…"></textarea>
              </div>

              <!-- Hidden file inputs -->
              <input type="file" id="file-input-image" accept="image/*" multiple style="display:none" onchange="handleImageFiles(this)" />
              <input type="file" id="file-input-file"  style="display:none" onchange="handleFileAttach(this)" />
              <input type="file" id="file-input-video" accept="video/*" style="display:none" onchange="handleVideoFile(this)" />
            </div>

            <!-- Footer: toolbar + actions -->
            <div class="composer-modal-footer">
              <div class="composer-toolbar">
                <!-- Image -->
                <button class="toolbar-btn" title="Image" onclick="document.getElementById('file-input-image').click()">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                </button>
                <!-- File attachment -->
                <button class="toolbar-btn" title="File" onclick="document.getElementById('file-input-file').click()">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <!-- Video upload/embed -->
                <button class="toolbar-btn" title="Video" id="toolbar-video-btn" onclick="toggleVideoPanel()">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="4"/><polygon points="10 8 18 12 10 16 10 8" fill="currentColor" stroke="none"/></svg>
                </button>
                <!-- Voice recording -->
                <button class="toolbar-btn" title="Voice recording" id="toolbar-voice-btn" onclick="toggleVoiceRecording()">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <!-- Video recording -->
                <button class="toolbar-btn" title="Video recording" id="toolbar-videorec-btn" onclick="toggleVideoRecording()">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
                </button>
                <!-- Poll -->
                <button class="toolbar-btn" title="Poll" id="toolbar-poll-btn" onclick="togglePollBuilder()">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                </button>
                <!-- Code embed -->
                <button class="toolbar-btn" title="Code embed" id="toolbar-code-btn" onclick="toggleCodePanel()">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                </button>
              </div>
              <button class="composer-cancel" onclick="closeComposer()">Cancel</button>
              <button class="btn btn-sm" id="composer-submit" onclick="submitPost()">Post</button>
            </div>
          </div>
        </div>

        <!-- Posts panel -->

function _lerpHex(h1,h2,t){const p=s=>parseInt(s,16);const r=Math.round(p(h1.slice(1,3))+(p(h2.slice(1,3))-p(h1.slice(1,3)))*t);const g=Math.round(p(h1.slice(3,5))+(p(h2.slice(3,5))-p(h1.slice(3,5)))*t);const b=Math.round(p(h1.slice(5,7))+(p(h2.slice(5,7))-p(h1.slice(5,7)))*t);return`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;}

function achBadgeSVG(id,size=38){const cat=ACH_CAT[id]||'sessions';const uid=++_bdgUID;const shape=_BADGE_CAT_SHAPE[cat]||'circle';const el=_BADGE_SHAPE[shape];const pal=_BADGE_PALETTE[cat]||_BADGE_PALETTE.sessions;const catIds=ACH_CAT_ORDER[cat]||[id];const ti=Math.max(0,catIds.indexOf(id));const t=catIds.length>1?ti/(catIds.length-1):0;const topC=t<=0.5?_lerpHex(pal[0],pal[1],t*2):pal[1];const botC=t<=0.5?pal[2]:_lerpHex(pal[2],pal[1],(1-t)*2);const iconPaths=ACH_ICON_MAP[id]||_AI.STAR;return`<svg viewBox="0 0 54 54" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g${uid}" x1="27" y1="2" x2="27" y2="52" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="${topC}"/><stop offset="100%" stop-color="${botC}"/></linearGradient></defs>${el} fill="url(#g${uid})" stroke="rgba(0,0,0,.18)" stroke-width="1.5"/>${_BADGE_SHINE[shape]}<g transform="translate(15,15)"><svg viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">${iconPaths}</svg></g></svg>`;}

// ── Auth ──────────────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName  = ae?.name || myEmail.split("@")[0];
  isAdmin = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "community", avatarUrl: ae?.avatar_url || null });

  // Avatars
  const colour = avatarColour(myEmail);
  ["composer-avatar-el", "comment-avatar-el"].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    if (ae?.avatar_url) {
      el.innerHTML = `<img src="${ae.avatar_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">`;
      el.style.background = "none";
    } else {
      el.textContent = initials(myName);
      el.style.background = colour.bg;
      el.style.color = colour.fg;
    }
  });
  // Modal composer avatar (inside modal header area not needed — handled by prompt bar)

  document.getElementById("community-main").style.display = "";
  await loadPosts();

  // Deep-link: ?post=<id> — open post directly (e.g. from a notification)
  const _deepPostId = new URLSearchParams(window.location.search).get("post");
  if (_deepPostId) showDetail(_deepPostId);

  // Mark Feed as seen on initial load
  if (!localStorage.getItem("comm_seen_feed")) {
    localStorage.setItem("comm_seen_feed", new Date().toISOString());
  }
})();

function switchTab(tab) {
  document.getElementById("tab-btn-posts").classList.toggle("active", tab === "posts");
  document.getElementById("tab-btn-activity").classList.toggle("active", tab === "activity");
  document.getElementById("tab-btn-members").classList.toggle("active", tab === "members");

  document.getElementById("panel-activity").style.display = tab === "activity" ? "" : "none";

// ── Members directory ─────────────────────────────────────────────────────────
let _membersLoaded = false;
let _allMembers    = [];

const _memberColours = [
  { bg: "#2d1b4e", fg: "#c084fc" }, { bg: "#1a3a2a", fg: "#6fcf97" },
  { bg: "#2d2010", fg: "#f5c518" }, { bg: "#1a2a3d", fg: "#60a5fa" },
  { bg: "#3a1a1a", fg: "#f87171" }, { bg: "#1a2d2d", fg: "#34d399" },
];

function _memberColour(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return _memberColours[Math.abs(h) % _memberColours.length];
}

function _memberInitials(name) {
  const parts = (name || "?").trim().split(/\s+/);
  return parts.length >= 2
    ? (parts[0][0] + parts[parts.length - 1][0]).toUpperCase()
    : (parts[0][0] || "?").toUpperCase();
}

async function loadMembers() {
  _membersLoaded = true;
  const { data, error } = await db
    .from("allowed_emails")
    .select("email, name, headline, location, instrument, avatar_url, badge, bio, website, instagram, twitter, youtube")
    .eq("subscription_status", "active")
    .eq("onboarded", true)
    .order("name", { ascending: true });

  if (error || !data) {
    document.getElementById("members-grid").innerHTML =
      `<div class="members-empty">Couldn't load members.</div>`;
    return;
  }
  _allMembers = data.filter(m => m.name && m.name.trim());
  renderMembers(_allMembers);
}

function renderMembers(members) {
  const grid  = document.getElementById("members-grid");
  const count = document.getElementById("members-count");
  count.textContent = `${members.length} member${members.length === 1 ? "" : "s"}`;
  if (!members.length) {
    grid.innerHTML = `<div class="members-empty">No members found.</div>`;
    return;
  }
  grid.innerHTML = members.map(m => {
    const name  = (m.name || "").trim();
    const col   = _memberColour(name);
    const avatarHTML = m.avatar_url
      ? `<img class="member-avatar" src="${m.avatar_url}" alt="${name}" onerror="this.replaceWith(initials_el('${name}'))">`
      : `<div class="member-avatar-initials" style="background:${col.bg};color:${col.fg}">${_memberInitials(name)}</div>`;
    const badgeHTML    = m.badge    ? `<div class="member-badge">${m.badge}</div>` : "";
    const headlineHTML = m.headline ? `<div class="member-headline">${m.headline}</div>` : "";
    const locationHTML = m.location
      ? `<div class="member-location"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>${m.location}</div>`
      : "";
    const instrHTML    = m.instrument ? `<div class="member-instrument">🎹 ${m.instrument}</div>` : "";
    const idx = _allMembers.findIndex(a => a.name === m.name && a.location === m.location);
    return `<div class="member-card" style="cursor:pointer" onclick="openMemberModal(${idx})">
      ${avatarHTML}
      <div class="member-name">${name}</div>
      ${badgeHTML}
      ${headlineHTML}
      ${locationHTML}
      ${instrHTML}
    </div>`;
  }).join("");
}

function filterMembers() {
  const q = (document.getElementById("members-search").value || "").toLowerCase();
  if (!q) { renderMembers(_allMembers); return; }
  renderMembers(_allMembers.filter(m =>
    (m.name       || "").toLowerCase().includes(q) ||
    (m.headline   || "").toLowerCase().includes(q) ||
    (m.location   || "").toLowerCase().includes(q) ||
    (m.instrument || "").toLowerCase().includes(q)
  ));
}

  if (badge) { badge.style.display = "none"; badge.textContent = ""; }

function _updateSpaceBadges() {
  const types = [null, "progress", "feedback", "question", "post"];
  types.forEach(type => {
    const key    = "comm_seen_" + (type || "feed");
    const seenAt = localStorage.getItem(key);
    const badge  = document.getElementById("badge-" + (type || "feed"));
    if (!badge) return;
    const posts  = type ? _posts.filter(p => p.type === type) : _posts;
    const count  = seenAt ? posts.filter(p => new Date(p.created_at) > new Date(seenAt)).length : posts.length;
    if (count > 0) {
      badge.textContent   = count > 99 ? "99+" : count;
      badge.style.display = "flex";
    } else {
      badge.style.display = "none";
    }
  });
}

function _renderFilteredPosts() {
  const list = document.getElementById("posts-list");
  const filtered = _postFilter ? _posts.filter(p => p.type === _postFilter) : _posts;
  if (!filtered.length) {
    const label = _postFilter ? `No ${_postFilter} posts yet.` : "No posts yet — be the first to share something! 👆";
    list.innerHTML = `<div class="posts-empty">${label}</div>`;
  } else {
    list.innerHTML = filtered.map(p => postCardHTML(p)).join("");

}

function parseYouTubeId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([^&\s]+)/);
  return m ? m[1] : null;
}
function parseVimeoId(url) {
  const m = url.match(/vimeo\.com\/(\d+)/);
  return m ? m[1] : null;
}
async function uploadToStorage(blob, filename) {
  const MAX_MB = 500;
  if (blob.size > MAX_MB * 1024 * 1024) {
    const sizeMB = (blob.size / 1024 / 1024).toFixed(0);
    throw new Error(`"${filename}" is ${sizeMB} MB — files must be under ${MAX_MB} MB.`);
  }
  const safe = `${myEmail}/${Date.now()}-${filename.replace(/[^a-z0-9._-]/gi, "_")}`;
  const { data, error } = await db.storage.from("community-uploads").upload(safe, blob);
  if (error) {
    if (error.message?.toLowerCase().includes("size") || error.statusCode === 413) {
      throw new Error(`"${filename}" is too large for storage. Try a smaller file or use a video embed link instead.`);
    }
    throw error;
  }
  return db.storage.from("community-uploads").getPublicUrl(data.path).data.publicUrl;
}
