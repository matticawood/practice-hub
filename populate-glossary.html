    .filter-btn.active { background: #1a3a1a; border-color: #2d6a2d; color: #4ade80; }

    .btn-primary { background: #2d6a2d; color: #9de89d; }
    .btn-missing { background: #1a3a6a; color: #7ab4ff; }
    .btn-stop    { background: #6a2d2d; color: #e89d9d; }
    .btn-apply   { background: #2d4a6a; color: #7ab4ff; }
    .btn-neutral { background: #222; color: #aaa; border: 1px solid #333; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .progress-wrap { margin-top: 14px; display: none; }
    .progress-bar-bg { background: #222; border-radius: 4px; height: 8px; overflow: hidden; }

    .progress-label { font-size: 0.8rem; color: #888; margin-top: 6px; }

    .stats-bar { font-size: 0.82rem; color: #888; margin-bottom: 14px; display: none; }
    .stats-bar span { margin-right: 14px; }
    .ok  { color: #4ade80; }
    .warn { color: #facc15; }
    .err { color: #f87171; }
    .info { color: #7ab4ff; }

    .result-header { background: #1e1e1e; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 10px; }
    .result-meta { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
    .result-title { font-size: 0.9rem; font-weight: 600; }
    .badge { font-size: 0.7rem; padding: 2px 7px; border-radius: 10px; background: #222; color: #888; border: 1px solid #333; white-space: nowrap; }
    .badge-cat  { background: #1a2a3a; color: #7ab4ff; border-color: #1e3a5a; }
    .badge-orig { background: #2a1a2a; color: #c084fc; border-color: #3a1a4a; }
    .badge-sym  { background: #2a2a1a; color: #fbbf24; border-color: #4a3a1a; }
    .result-status { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; flex-shrink: 0; }

    .status-error   { background: #3a1a1a; color: #f87171; }
    .status-pending { background: #1a1a2a; color: #888; }
    .status-skipped { background: #2a2a1a; color: #888; }

<body>

<h1>📖 Populate Glossary</h1>
<p class="sub">
  Generates definitions for all glossary terms using Claude. Each term gets its own focused API call.<br>
  Use <strong>Generate missing only</strong> for a first run, or <strong>Generate all</strong> to regenerate everything.
</p>

<div class="card">
  <label for="api-key">Anthropic API Key</label>
  <input type="password" id="api-key" placeholder="sk-ant-…" />

  <div class="filter-row" id="cat-filters"></div>

  <div class="controls">
    <button class="btn-missing" id="missing-btn" onclick="startGeneration('missing')">⚡ Generate missing only</button>
    <button class="btn-primary" id="all-btn" onclick="startGeneration('all')">↺ Regenerate all</button>
    <button class="btn-stop" id="stop-btn" onclick="shouldStop=true" style="display:none">⏹ Stop</button>
    <span id="status" style="font-size:0.85rem;color:#888"></span>
  </div>
  <div class="progress-wrap" id="progress-wrap">
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill"></div></div>
    <div class="progress-label" id="progress-label"></div>
  </div>
</div>

<div class="card" id="apply-bar">
  <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
    <button class="btn-apply" id="apply-btn" onclick="applySelected()">✓ Apply selected to database</button>
    <button class="btn-neutral" onclick="selectAll(true)">Select all</button>
    <button class="btn-neutral" onclick="selectAll(false)">Deselect all</button>
    <button class="btn-neutral" id="retry-btn" onclick="retryFailed()" style="display:none">↺ Retry failed</button>
    <span id="apply-status" style="font-size:0.85rem;color:#888"></span>
  </div>
</div>

<div class="card">
  <details>
    <summary>+ Add a new term</summary>
    <div class="add-form">
      <div>
        <label>Term</label>
        <input type="text" id="new-term" placeholder="e.g. Schwebend" />
      </div>
      <div>
        <label>Category</label>
        <select id="new-cat"></select>
      </div>
      <div>
        <label>Origin</label>
        <select id="new-origin">
          <option value="">None</option>
          <option>Italian</option>
          <option>German</option>
          <option>French</option>
          <option>Latin</option>
          <option>Greek</option>
        </select>
      </div>
      <div>
        <label>Type</label>
        <select id="new-type">
          <option value="term">term</option>
          <option value="symbol">symbol</option>
        </select>
      </div>
    </div>
    <div style="margin-top:10px;display:flex;gap:10px;align-items:center">
      <button class="btn-missing" onclick="addAndGenerate()">⚡ Add &amp; generate definition</button>
      <span id="add-status" style="font-size:0.85rem;color:#888"></span>
    </div>
  </details>
</div>

<div class="stats-bar" id="stats-bar"></div>
<div id="results-container"></div>

// ── State ─────────────────────────────────────────────────────────────────────
let existingMap    = {}; // "term||category" → { id, definition }
let generatedMap   = {}; // "term||category" → definition string
let shouldStop     = false;
let activeFilter   = "All";

const key = t => t.term + "||" + t.category;

// ── Init ──────────────────────────────────────────────────────────────────────
const saved = localStorage.getItem("anthropic_key");
if (saved) document.getElementById("api-key").value = saved;

(async function init() {
  const { data } = await db.from("glossary").select("id, term, category, definition");
  if (data) data.forEach(r => { existingMap[r.term + "||" + r.category] = { id: r.id, definition: r.definition }; });

  // Populate "Add new term" category dropdown
  const allCats = [...new Set(GLOSSARY_TERMS.map(t => t.category))].sort();
  const newCatSel = document.getElementById("new-cat");
  allCats.forEach(c => { const o = document.createElement("option"); o.value = o.textContent = c; newCatSel.appendChild(o); });

  // Build category filter buttons
  const cats = ["All", ...new Set(GLOSSARY_TERMS.map(t => t.category))];
  const filterRow = document.getElementById("cat-filters");
  cats.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (cat === "All" ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => {
      activeFilter = cat;
      filterRow.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.textContent === cat));
      renderStatsBar();
    };
    filterRow.appendChild(btn);
  });

  renderStatsBar();
})();

function renderStatsBar() {
  const terms = filteredTerms();
  const missing = terms.filter(t => !existingMap[key(t)]?.definition).length;
  const existing = terms.length - missing;
  const bar = document.getElementById("stats-bar");
  bar.style.display = "block";
  bar.innerHTML = `<span class="info">${terms.length} terms${activeFilter !== "All" ? " in " + activeFilter : ""}</span><span class="ok">${existing} have definitions</span><span class="warn">${missing} missing</span>`;
}

function filteredTerms() {
  return activeFilter === "All" ? GLOSSARY_TERMS : GLOSSARY_TERMS.filter(t => t.category === activeFilter);
}

// ── API call ──────────────────────────────────────────────────────────────────
async function generateDefinition(t, apiKey) {
  const originNote = t.origin ? ` (${t.origin} origin)` : "";
  const prompt = `Write a glossary definition for the musical term "${t.term}"${originNote}, category: ${t.category}.

Requirements:
- 20–55 words, one to three sentences
- Stand alone — a complete beginner must understand it without looking up other terms
- Technically accurate; avoid absolute claims such as "the slowest", "the only", "always means"
- Include what the term sounds like, where it appears in a score, or what effect it creates — whichever is most useful
- British English spelling
- Do not begin with the term name itself
- Do not use "This term", "This word", "This is a", "Refers to"

Return only the definition. No labels, no quotation marks.`;

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "content-type": "application/json",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-5",
      max_tokens: 200,
      system: "You are a music educator writing a glossary for The Practice Room, a piano practice app for students from complete beginner to advanced level. Use British English. Write with precision and warmth. Each definition must be self-contained — no references to other glossary terms.",
      messages: [{ role: "user", content: prompt }]
    })
  });
  if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message || `HTTP ${res.status}`); }
  const data = await res.json();
  return (data.content?.[0]?.text || "").trim();
}

// ── Generation ────────────────────────────────────────────────────────────────
async function startGeneration(mode) {
  const apiKey = document.getElementById("api-key").value.trim();
  if (!apiKey) { alert("Enter your Anthropic API key."); return; }
  localStorage.setItem("anthropic_key", apiKey);

  const terms = filteredTerms().filter(t => mode === "all" || !existingMap[key(t)]?.definition);
  if (!terms.length) { alert("No terms to generate."); return; }

  shouldStop = false;
  generatedMap = {};
  document.getElementById("results-container").innerHTML = "";
  document.getElementById("apply-bar").style.display = "none";
  document.getElementById("missing-btn").disabled = true;
  document.getElementById("all-btn").disabled = true;
  document.getElementById("stop-btn").style.display = "inline-block";
  document.getElementById("progress-wrap").style.display = "block";
  document.getElementById("progress-fill").style.width = "0%";

  terms.forEach(t => {
    document.getElementById("results-container").appendChild(renderCard(t, "pending", null, null));
  });

  let done = 0, failed = 0;
  const BATCH = 4;
  for (let i = 0; i < terms.length; i += BATCH) {
    if (shouldStop) break;
    const batch = terms.slice(i, i + BATCH);
    document.getElementById("status").textContent = `Processing ${Math.min(i + BATCH, terms.length)} of ${terms.length}…`;
    await Promise.all(batch.map(async t => {
      try {
        let def, lastErr;
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            if (attempt > 0) await sleep(attempt * 3000);
            def = await generateDefinition(t, apiKey);
            break;
          } catch(e) { lastErr = e; }
        }
        if (def) { generatedMap[key(t)] = def; updateCard(t, "done", def, null); done++; }
        else throw lastErr;
      } catch(e) { updateCard(t, "error", null, e.message); failed++; }
      const pct = ((done + failed) / terms.length * 100).toFixed(0);
      document.getElementById("progress-fill").style.width = pct + "%";
      document.getElementById("progress-label").textContent = `${done + failed} of ${terms.length} — ${done} ok, ${failed} failed`;
    }));
    if (i + BATCH < terms.length && !shouldStop) await sleep(800);
  }

  document.getElementById("status").textContent = "";
  document.getElementById("missing-btn").disabled = false;
  document.getElementById("all-btn").disabled = false;
  document.getElementById("stop-btn").style.display = "none";
  if (done > 0)   { document.getElementById("apply-bar").style.display = "block"; }
  if (failed > 0) { document.getElementById("retry-btn").style.display = "inline-block"; }
}

async function retryFailed() {
  const apiKey = document.getElementById("api-key").value.trim();
  if (!apiKey) return;
  const failed = [...document.querySelectorAll(".status-error")].map(el => {
    const k = el.closest(".result-item")?.dataset.key;
    return GLOSSARY_TERMS.find(t => key(t) === k);
  }).filter(Boolean);
  if (!failed.length) return;
  document.getElementById("retry-btn").disabled = true;
  shouldStop = false;
  let done = 0, err = 0;
  for (let i = 0; i < failed.length; i += 4) {
    if (shouldStop) break;
    await Promise.all(failed.slice(i, i+4).map(async t => {
      updateCard(t, "pending", null, null);
      try {
        const def = await generateDefinition(t, apiKey);
        generatedMap[key(t)] = def; updateCard(t, "done", def, null); done++;
      } catch(e) { updateCard(t, "error", null, e.message); err++; }
    }));
    if (i + 4 < failed.length) await sleep(800);
  }
  document.getElementById("retry-btn").disabled = false;
  if (err === 0) document.getElementById("retry-btn").style.display = "none";
}

// ── Apply ─────────────────────────────────────────────────────────────────────
async function applySelected() {
  const checked = [...document.querySelectorAll(".apply-check:checked")];
  if (!checked.length) { alert("Nothing selected."); return; }
  const btn = document.getElementById("apply-btn");
  btn.disabled = true;
  document.getElementById("apply-status").textContent = "Applying…";

  let applied = 0, failed = 0;
  for (const cb of checked) {
    const k = cb.dataset.key;
    const def = generatedMap[k];
    if (!def) continue;
    const t = GLOSSARY_TERMS.find(t => key(t) === k);
    if (!t) continue;
    const existing = existingMap[k];
    let error;
    if (existing) {
      const { error: e } = await db.from("glossary").update({ definition: def }).eq("id", existing.id);
      error = e;
    } else {
      const { error: e } = await db.from("glossary").insert({
        term: t.term, definition: def, category: t.category,
        origin: t.origin || null, entry_type: t.entry_type
      });
      error = e;
    }
    if (error) { failed++; }
    else { applied++; existingMap[k] = { ...(existingMap[k] || {}), definition: def }; cb.checked = false; cb.disabled = true; }
  }
  document.getElementById("apply-status").textContent = `✓ ${applied} saved${failed ? `, ${failed} failed` : ""}`;
  btn.disabled = false;
  renderStatsBar();
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function renderCard(t, status, def, err) {
  const k = key(t);
  const existing = existingMap[k];
  const el = document.createElement("div");
  el.className = "result-item";
  el.id = "card-" + k.replace(/[^a-z0-9]/gi, "_");
  el.dataset.key = k;

  const statusHtml = {
    done:    `<span class="result-status status-done">✓ Generated</span>`,
    error:   `<span class="result-status status-error">✗ Failed</span>`,
    pending: `<span class="result-status status-pending">Pending</span>`,
  }[status] || "";

  const symBadge = t.entry_type === "symbol" ? `<span class="badge badge-sym">symbol</span>` : "";
  const origBadge = t.origin ? `<span class="badge badge-orig">${t.origin}</span>` : "";

  el.innerHTML = `
    <div class="result-header" onclick="this.nextElementSibling.classList.toggle('open')">
      <div class="result-meta">
        <span class="result-title">${t.term}</span>
        <span class="badge badge-cat">${t.category}</span>
        ${origBadge}${symBadge}
      </div>
      ${statusHtml}
    </div>
    <div class="result-body">
      ${existing?.definition ? `<div class="section-label">Current definition</div><div class="section-text existing">${existing.definition}</div>` : ""}
      ${status === "done" && def ? `
        <div class="section-label">Generated</div>
        <div class="section-text">${def}</div>
        <div class="apply-row">
          <input type="checkbox" class="apply-check" data-key="${k}" checked />
          <label class="apply-label">Include in apply</label>
        </div>` : ""}
      ${status === "error" ? `<div style="color:#f87171;font-size:0.85rem;padding:4px 0">${err}</div>` : ""}
    </div>`;
  return el;
}

function updateCard(t, status, def, err) {
  const k = key(t);
  const id = "card-" + k.replace(/[^a-z0-9]/gi, "_");
  const existing = document.getElementById(id);
  const newCard = renderCard(t, status, def, err);
  if (existing) existing.replaceWith(newCard);
  else document.getElementById("results-container").appendChild(newCard);
}

function selectAll(val) {
  document.querySelectorAll(".apply-check").forEach(cb => { if (!cb.disabled) cb.checked = val; });
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── Add new term ──────────────────────────────────────────────────────────────
async function addAndGenerate() {
  const termVal = document.getElementById("new-term").value.trim();
  const cat     = document.getElementById("new-cat").value;
  const origin  = document.getElementById("new-origin").value || null;
  const etype   = document.getElementById("new-type").value;
  const apiKey  = document.getElementById("api-key").value.trim();
  const status  = document.getElementById("add-status");

  if (!termVal) { status.textContent = "Enter a term first."; return; }
  if (!apiKey)  { status.textContent = "Enter your API key first."; return; }

  // Check for duplicate in GLOSSARY_TERMS
  if (GLOSSARY_TERMS.find(t => t.term.toLowerCase() === termVal.toLowerCase() && t.category === cat)) {
    status.textContent = `"${termVal}" already exists in ${cat}.`; return;
  }

  const t = { term: termVal, category: cat, origin, entry_type: etype };
  GLOSSARY_TERMS.push(t);
  status.textContent = "Generating…";

  // Refresh the category filter buttons to include any new category
  const filterRow = document.getElementById("cat-filters");
  if (![...filterRow.querySelectorAll(".filter-btn")].some(b => b.textContent === cat)) {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.textContent = cat;
    btn.onclick = () => {
      activeFilter = cat;
      filterRow.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.textContent === cat));
      renderStatsBar();
    };
    filterRow.appendChild(btn);
  }

  // Scroll to / show the results container
  document.getElementById("apply-bar").style.display = "block";
  document.getElementById("results-container").prepend(renderCard(t, "pending", null, null));

  try {
    const def = await generateDefinition(t, apiKey);
    generatedMap[key(t)] = def;
    updateCard(t, "done", def, null);
    status.textContent = `✓ Definition ready — select it below and apply to database.`;
    document.getElementById("new-term").value = "";
  } catch(e) {
    updateCard(t, "error", null, e.message);
    status.textContent = `Failed: ${e.message}`;
    GLOSSARY_TERMS.pop(); // remove from list if it failed
  }
  renderStatsBar();
}
</script>
</body>
</html>
