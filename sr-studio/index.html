<!doctype html><html><head><meta charset="utf-8"><title>Sight Reading Studio</title>
<style>
  :root{--ink:#1a1a1a;--mut:#666;--line:#e2e2e2;--ok:#137a3a;--bad:#b00020;--amber:#b8860b;--bg:#faf8f4;--sel:#2d6cdf}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;align-items:center;gap:18px;padding:12px 20px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:5}
  header h1{font-size:17px;margin:0;font-weight:700}
  .grades{display:flex;gap:6px}
  .gr{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-weight:600}
  .gr.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .gr small{opacity:.7;font-weight:500}
  .wrap{max-width:1180px;margin:18px auto;padding:0 20px;display:grid;grid-template-columns:1fr 320px;gap:22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}
  #score{min-height:150px;display:flex;align-items:center;justify-content:center;overflow-x:auto}
  #score svg{max-width:100%;height:auto}
  .report{margin-top:10px;font-size:13.5px}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-weight:700;font-size:12px}
  .pill.ok{background:#e6f5ec;color:var(--ok)} .pill.bad{background:#fdecef;color:var(--bad)} .pill.amber{background:#fbf3e0;color:var(--amber)}
  .report ul{margin:6px 0 0;padding-left:18px} .report ul.err{color:var(--bad)} .report .warn{margin-top:8px} .report .warn ul{color:var(--amber)}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  button{font:inherit;padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
  button.primary{background:var(--ok);color:#fff;border-color:var(--ok)}
  button:disabled{opacity:.45;cursor:default}
  label{display:block;font-size:12px;color:var(--mut);font-weight:600;margin:10px 0 3px}
  input,select{width:100%;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .meta{display:grid;grid-template-columns:1fr 1fr 1fr 2fr;gap:8px;margin-bottom:6px}
  /* editor */
  .ed h4{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
  .lane{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
  .bar{display:flex;gap:5px;padding:6px;border:1px dashed var(--line);border-radius:8px;position:relative}
  .bar.full{border-color:#cfe6d6} .bar.bad{border-color:#f3c9d0;background:#fdf5f6}
  .bar .fill{position:absolute;top:-8px;left:6px;font-size:10px;font-weight:700;background:#fff;padding:0 4px;color:var(--mut)}
  .bar.bad .fill{color:var(--bad)} .bar.full .fill{color:var(--ok)}
  .note{border:1px solid var(--line);border-radius:8px;padding:5px 5px 4px;min-width:52px;text-align:center;background:#fff;cursor:pointer;user-select:none}
  .note.sel{border-color:var(--sel);box-shadow:0 0 0 2px rgba(45,108,223,.18)}
  .note .pn{font-weight:700;font-size:14px;line-height:1.1}
  .note .du{font-size:11px;color:var(--mut)}
  .note .mk{font-size:10px;color:var(--amber);height:12px;letter-spacing:1px}
  .nudge{display:flex;justify-content:center;gap:3px;margin-top:2px}
  .nudge button{padding:0 6px;font-size:12px;border-radius:5px}
  .palette{margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fcfbf9;font-size:13px}
  .palette.hidden{display:none}
  .prow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:5px 0}
  .prow b{font-size:11px;color:var(--mut);width:64px}
  .tg{padding:4px 8px;border:1px solid var(--line);border-radius:7px;background:#fff;cursor:pointer;font-size:12px;font-weight:600}
  .tg.on{background:var(--sel);color:#fff;border-color:var(--sel)}
  .bank h3{font-size:14px;margin:0 0 8px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
  .row a{color:var(--mut);cursor:pointer;text-decoration:none} .muted{color:var(--mut)}
  .hint{font-size:11.5px;color:var(--mut);margin-top:4px}
</style></head>
<body>
<header>
  <h1>Sight Reading Studio</h1>
  <div class="grades" id="grades"></div>
  <div class="muted" id="status" style="margin-left:auto"></div>
</header>
<div class="wrap">
  <div>
    <div class="card">
      <div id="score" class="muted">Click “New candidate” to begin.</div>
      <div class="report" id="report"></div>
      <div class="btns">
        <button class="primary" id="approve" disabled>✓ Approve &amp; bank</button>
        <button id="regen">↻ New candidate</button>
        <button id="skip">Skip</button>
      </div>
    </div>
    <div class="card ed" style="margin-top:16px">
      <div class="meta">
        <div><label>Key</label><input id="m_key"></div>
        <div><label>Mode</label><select id="m_mode"><option value="maj">major</option><option value="min">minor</option></select></div>
        <div><label>Time</label><input id="m_time"></div>
        <div><label>Tempo / character</label><input id="m_tempo"></div>
      </div>
      <h4>Right hand</h4><div class="lane" id="rhLane"></div>
      <h4>Left hand</h4><div class="lane" id="lhLane"></div>
      <div class="palette hidden" id="palette"></div>
      <div class="hint">Click a note to select it, then use the palette below it (pitch ↑↓, length, articulation, delete, insert). The bar borders turn green when full, red when the beats don’t add up.</div>
    </div>
  </div>
  <div class="card bank">
    <h3>Banked — Grade <span id="bankGrade">2</span> (<span id="bankCount">0</span>/120)</h3>
    <div id="bankList"></div>
  </div>
</div>
<script>
let grade=2, model=null, sel=null; // sel = {hand,index}
const $=s=>document.querySelector(s);
const api=(p,o)=>fetch(p,o).then(r=>r.json());
const KEYPC={c:0,d:2,e:4,f:5,g:7,a:9,b:11,bf:10,ef:3,af:8,df:1,cs:1,fs:6};
const SCALE={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10]};
const FLATKEYS=new Set(['f','bf','ef','af','df']);
const SH=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], FL=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const useFlat=()=>model.meta.flat;
const nameOf=m=>{const pc=((m%12)+12)%12,oct=Math.floor(m/12)-1;return (useFlat()?FL:SH)[pc]+oct;};
const DURS=[['¼',0.25],['½',0.5],['¾',0.75],['♩',1],['♩.',1.5],['𝅗𝅥',2],['𝅗𝅥.',3],['𝅝',4]];
const durLabel=d=>(DURS.find(x=>x[1]===d)||[d])[0];
const barUnits=()=>{const[a,b]=model.meta.time.split('/').map(Number);return (a/b)*4;};

function diatonic(m,dir){
  const tonic=KEYPC[model.meta.key]??0, sc=SCALE[model.meta.mode];
  let x=m+dir; for(let k=0;k<13;k++){ if(sc.includes(((x-tonic)%12+12)%12)) return x; x+=dir; } return m;
}
function nudge(arr,dir){ return Array.isArray(arr)?arr.map(x=>diatonic(x,dir)):diatonic(arr,dir); }

function renderLane(hand){
  const lane=$(hand==='rh'?'#rhLane':'#lhLane'); lane.innerHTML='';
  const notes=model[hand], bu=barUnits(); let t=0, bar=mkBar(); let barSum=0;
  notes.forEach((n,i)=>{
    bar.appendChild(noteEl(hand,i,n));
    barSum+=n.d; t+=n.d;
    if(Math.abs(t%bu)<1e-9){ tagBar(bar,barSum,bu); lane.appendChild(bar); bar=mkBar(); barSum=0; }
  });
  if(barSum>0){ tagBar(bar,barSum,bu); lane.appendChild(bar); }
}
function mkBar(){ const d=document.createElement('div'); d.className='bar'; return d; }
function tagBar(bar,sum,bu){ const f=document.createElement('span'); f.className='fill';
  const beats=(sum/(bu/(+model.meta.time.split('/')[0]))).toFixed(2).replace(/\.00$/,'');
  f.textContent = Math.abs(sum-bu)<1e-9?'✓':`${sum} / ${bu}`; bar.classList.add(Math.abs(sum-bu)<1e-9?'full':'bad'); bar.prepend(f); }
function noteEl(hand,i,n){
  const d=document.createElement('div'); d.className='note'+(sel&&sel.hand===hand&&sel.index===i?' sel':'');
  const marks=[n.dyn?n.dyn:'',n.art?({'-.':'.','--':'_','->':'>'})[n.art]:'',n.slur||'',n.hp?n.hp.replace(/\\\\/g,'').replace('!','!'):''].filter(Boolean).join(' ');
  d.innerHTML=`<div class="pn">${n.rest?'rest':(Array.isArray(n.m)?n.m.map(nameOf).join('+'):nameOf(n.m))}</div>
    <div class="du">${durLabel(n.d)}</div><div class="mk">${marks||'&nbsp;'}</div>`;
  d.onclick=()=>{ sel={hand,index:i}; draw(); };
  return d;
}
function selectedNote(){ return sel? model[sel.hand][sel.index] : null; }

function renderPalette(){
  const pal=$('#palette'); const n=selectedNote();
  if(!n){ pal.className='palette hidden'; return; } pal.className='palette';
  const dynOpts=['','pp','p','mp','mf','f','ff'].map(x=>`<option ${n.dyn===x?'selected':''}>${x||'—'}</option>`).join('');
  pal.innerHTML=`
   <div class="prow"><b>Pitch</b>
     <button class="tg" data-a="down">↓ lower</button><button class="tg" data-a="up">↑ higher</button>
     <button class="tg" data-a="oct-">−8va</button><button class="tg" data-a="oct+">+8va</button>
     <button class="tg" data-a="rest">${n.rest?'un-rest':'make rest'}</button></div>
   <div class="prow"><b>Length</b> ${DURS.map(d=>`<button class="tg ${n.d===d[1]?'on':''}" data-d="${d[1]}">${d[0]}</button>`).join('')}</div>
   <div class="prow"><b>Marks</b>
     <button class="tg ${n.art==='-.'?'on':''}" data-m="stac">stacc .</button>
     <button class="tg ${n.art==='--'?'on':''}" data-m="ten">ten _</button>
     <button class="tg ${n.art==='->'?'on':''}" data-m="acc">accent ></button>
     <button class="tg ${n.slur==='('?'on':''}" data-m="slo">slur (</button>
     <button class="tg ${n.slur===')'?'on':''}" data-m="slc">slur )</button>
     <button class="tg ${n.hp==='\\\\<'?'on':''}" data-m="cre">cresc &lt;</button>
     <button class="tg ${n.hp==='\\\\>'?'on':''}" data-m="dim">dim &gt;</button>
     <button class="tg ${n.hp==='\\\\!'?'on':''}" data-m="end">end !</button></div>
   <div class="prow"><b>Dynamic</b> <select id="dynSel" style="width:90px">${dynOpts}</select>
     <span style="flex:1"></span>
     <button class="tg" data-a="insert">＋ insert after</button>
     <button class="tg" data-a="del" style="color:var(--bad)">✕ delete</button></div>`;
  pal.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a));
  pal.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ selectedNote().d=+b.dataset.d; commit(); });
  pal.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>mark(b.dataset.m));
  $('#dynSel').onchange=e=>{ const v=e.target.value; const n=selectedNote(); if(v==='—'||v==='')delete n.dyn; else n.dyn=v; commit(); };
}
function act(a){ const n=selectedNote(); if(!n)return;
  if(a==='up') n.m=nudge(n.m,1); else if(a==='down') n.m=nudge(n.m,-1);
  else if(a==='oct+') n.m=Array.isArray(n.m)?n.m.map(x=>x+12):n.m+12;
  else if(a==='oct-') n.m=Array.isArray(n.m)?n.m.map(x=>x-12):n.m-12;
  else if(a==='rest'){ if(n.rest){delete n.rest; n.m=60;} else {n.rest=true; delete n.m;} }
  else if(a==='del'){ model[sel.hand].splice(sel.index,1); sel=null; }
  else if(a==='insert'){ const c={m:Array.isArray(n.m)?n.m[0]:(n.m??60),d:1}; model[sel.hand].splice(sel.index+1,0,c); sel.index++; }
  commit();
}
function mark(m){ const n=selectedNote();
  if(m==='stac') n.art=n.art==='-.'?undefined:'-.';
  else if(m==='ten') n.art=n.art==='--'?undefined:'--';
  else if(m==='acc') n.art=n.art==='->'?undefined:'->';
  else if(m==='slo') n.slur=n.slur==='('?undefined:'(';
  else if(m==='slc') n.slur=n.slur===')'?undefined:')';
  else if(m==='cre') n.hp=n.hp==='\\<'?undefined:'\\<';
  else if(m==='dim') n.hp=n.hp==='\\>'?undefined:'\\>';
  else if(m==='end') n.hp=n.hp==='\\!'?undefined:'\\!';
  if(n.art===undefined)delete n.art; if(n.slur===undefined)delete n.slur; if(n.hp===undefined)delete n.hp;
  commit();
}
let timer=null;
function commit(){ draw(); clearTimeout(timer); timer=setTimeout(rerender,250); }
function draw(){ renderLane('rh'); renderLane('lh'); renderPalette(); }

async function rerender(){
  model.meta.flat = FLATKEYS.has(model.meta.key) || (model.meta.mode==='min' && ['d','g','c','f'].includes(model.meta.key));
  const d=await api('/api/render',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({meta:model.meta,rh:model.rh,lh:model.lh})});
  if(d.error){ $('#report').innerHTML=`<span class="pill bad">${d.error}</span>`; $('#approve').disabled=true; return; }
  $('#score').innerHTML=d.svg; showReport(d.validation); model.ex=d.ex;
}
function setModel(ex){ model={meta:{grade,key:ex.key,mode:ex.mode,flat:ex.flat,time:ex.time,tempo:ex.tempo,partial:ex.partial},rh:ex.rh,lh:ex.lh,ex};
  sel=null; $('#m_key').value=ex.key; $('#m_mode').value=ex.mode; $('#m_time').value=ex.time; $('#m_tempo').value=ex.tempo; draw(); }
['m_key','m_mode','m_time','m_tempo'].forEach(id=>$('#'+id).addEventListener('change',()=>{
  model.meta.key=$('#m_key').value.trim(); model.meta.mode=$('#m_mode').value; model.meta.time=$('#m_time').value.trim(); model.meta.tempo=$('#m_tempo').value.trim(); commit(); }));

function showReport(v){ const errs=v.errors||[],warns=v.warnings||[]; let h='';
  h += errs.length? `<span class="pill bad">${errs.length} error${errs.length>1?'s':''} — fix before banking</span><ul class="err">`+errs.map(p=>`<li>${p}</li>`).join('')+`</ul>`
                  : `<span class="pill ok">✓ no errors</span> <span class="muted">RH finger ${v.rhF} · LH finger ${v.lhF}</span>`;
  if(warns.length) h+=`<div class="warn"><span class="pill amber">${warns.length} to review (optional)</span><ul>`+warns.map(p=>`<li>${p}</li>`).join('')+`</ul></div>`;
  $('#report').innerHTML=h; $('#approve').disabled=errs.length>0; }

function drawGrades(c){ $('#grades').innerHTML='';
  for(const g of [2,3,4]){ const b=document.createElement('div'); b.className='gr'+(g===grade?' on':'');
    b.innerHTML=`Grade ${g} <small>${c[g]||0}/120</small>`; b.onclick=()=>{grade=g;refresh();}; $('#grades').appendChild(b); } }
async function newCandidate(){ $('#score').innerHTML='<span class="muted">generating…</span>'; const d=await api('/api/generate?grade='+grade);
  setModel(d.ex); $('#score').innerHTML=d.svg; showReport(d.validation); }
async function approve(){ const r=await api('/api/approve',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({ex:{grade,...model.meta,rh:model.rh,lh:model.lh}})});
  if(r.error){ alert(r.error); return; } await refresh(); newCandidate(); }
async function refresh(){ const c=await api('/api/counts'); drawGrades(c);
  $('#bankGrade').textContent=grade; $('#bankCount').textContent=c[grade]||0;
  const {bank}=await api('/api/bank?grade='+grade);
  $('#bankList').innerHTML=bank.length?bank.map(e=>`<div class="row"><span>${e.i+1}. ${e.key} ${e.mode} ${e.time} · <span class="muted">${e.tempo}</span></span><span><a onclick="viewBank(${e.i})">view</a> · <a onclick="delBank(${e.i})">✕</a></span></div>`).join(''):'<span class="muted">none yet</span>'; }
window.viewBank=async i=>{ const d=await api(`/api/view?grade=${grade}&i=${i}`); setModel(d.ex); $('#score').innerHTML=d.svg; showReport(d.validation); };
window.delBank=async i=>{ if(!confirm('Remove exercise '+(i+1)+'?'))return; await api('/api/delete',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({grade,i})}); refresh(); };
$('#regen').onclick=newCandidate; $('#skip').onclick=newCandidate; $('#approve').onclick=approve;
refresh();
</script>
</body></html>
