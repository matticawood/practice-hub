<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Recalibrate Difficulty Ratings</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; margin: 0; padding: 24px; }
    h1 { font-size: 1.2rem; margin-bottom: 4px; }
    p.sub { font-size: 0.85rem; color: #888; margin-bottom: 24px; }
    .card { background: #1a1a1a; border: 1px solid #2a2a2a; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    label { display: block; font-size: 0.8rem; color: #888; margin-bottom: 6px; }
    input { width: 100%; padding: 9px 12px; background: #111; border: 1px solid #333; border-radius: 6px; color: #e0e0e0; font-size: 0.9rem; font-family: monospace; outline: none; }
    input:focus { border-color: #555; }
    button { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-size: 0.9rem; }
    .btn-primary { background: #2d6a2d; color: #9de89d; }
    .btn-primary:hover { background: #3a8a3a; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-apply { background: #1a3a6a; color: #7ab4ff; }
    .btn-apply:hover { background: #1a4a8a; }
    .btn-apply:disabled { opacity: 0.5; cursor: not-allowed; }
    .log { font-size: 0.8rem; color: #aaa; margin-top: 12px; line-height: 1.8; }
    .log .ok { color: #4ade80; }
    .log .err { color: #f87171; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th { text-align: left; padding: 8px 10px; border-bottom: 1px solid #2a2a2a; color: #888; font-weight: normal; font-size: 0.75rem; }
    td { padding: 8px 10px; border-bottom: 1px solid #1e1e1e; }
    tr:hover td { background: #1e1e1e; }
    .diff-old { color: #888; }
    .diff-new { font-weight: 600; }
    .diff-up   { color: #f87171; }
    .diff-down { color: #4ade80; }
    .diff-same { color: #888; }
    .diff-label { font-size: 0.72rem; color: #666; }
    .summary { font-size: 0.85rem; color: #aaa; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.72rem; margin-left: 6px; }
    .badge-up   { background: #3a1a1a; color: #f87171; }
    .badge-down { background: #1a3a1a; color: #4ade80; }
    .badge-same { background: #1a1a1a; color: #666; }
  </style>
</head>
<body>

<h1>🎹 Recalibrate Difficulty Ratings</h1>
<p class="sub">Fetches all <strong>Beginner</strong> pieces and asks Claude to decide which should be reclassified as <strong>Absolute Beginner</strong> (pre-Grade 1). You can review before applying.</p>

<div class="card">
  <label for="api-key">Anthropic API Key</label>
  <input type="password" id="api-key" placeholder="sk-ant-…" />
  <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
    <button class="btn-primary" id="run-btn" onclick="runRecalibration()">⚡ Fetch &amp; Rate All Pieces</button>
    <span id="status" style="font-size:0.85rem;color:#888"></span>
  </div>
  <div class="log" id="log"></div>
</div>

<div class="card" id="results-card" style="display:none">
  <div class="summary" id="summary"></div>
  <table>
    <thead>
      <tr>
        <th>Title</th>
        <th>Composer</th>
        <th>Current</th>
        <th>Proposed</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>
  <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
    <button class="btn-apply" id="apply-btn" onclick="applyChanges()">✓ Apply All Changes</button>
    <span id="apply-status" style="font-size:0.85rem;color:#888"></span>
  </div>
</div>

<script>
  const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
  const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  const DIFF_LABELS = ["Absolute Beginner", "Beginner", "Lower Intermediate", "Upper Intermediate", "Advanced", "Expert"];

  let proposedChanges = [];

  function log(msg, type = "") {
    const el = document.getElementById("log");
    el.innerHTML += `<div class="${type}">${msg}</div>`;
  }

  function setStatus(msg) {
    document.getElementById("status").textContent = msg;
  }

  async function runRecalibration() {
    const apiKey = document.getElementById("api-key").value.trim();
    if (!apiKey) { alert("Please enter your Anthropic API key."); return; }
    localStorage.setItem("anthropic_key", apiKey);

    document.getElementById("log").innerHTML = "";
    document.getElementById("results-card").style.display = "none";
    document.getElementById("run-btn").disabled = true;
    setStatus("Fetching pieces from Supabase…");

    const { data: pieces, error } = await db.from("pieces").select("id, title, composer, difficulty").eq("difficulty", 1).order("title");
    if (error || !pieces) {
      log("Failed to fetch pieces: " + (error?.message || "unknown error"), "err");
      setStatus(""); document.getElementById("run-btn").disabled = false; return;
    }

    if (!pieces.length) {
      log("No Beginner pieces found.", "ok");
      setStatus(""); document.getElementById("run-btn").disabled = false; return;
    }

    log(`✓ Loaded ${pieces.length} Beginner pieces`);
    setStatus("Sending to Claude…");

    const pieceList = pieces.map(p =>
      `${p.id}|${p.title}${p.composer ? " — " + p.composer : ""}`
    ).join("\n");

    const prompt = `You are helping recategorise piano pieces for a repertoire database used by adult piano students.

All pieces below are currently rated "Beginner". Your job is to decide which should be reclassified as "Absolute Beginner".

Use these ABRSM-based criteria:
0 = Absolute Beginner: pre-Grade 1. Five-finger positions, hands rarely together, very simple rhythms, no position shifts, minimal music reading required. A student in their first 1–3 months could play these.
1 = Beginner: approximately ABRSM Grade 1–2. Simple melodies with basic accompaniment, some hand coordination, limited position shifts.

Concrete examples of Absolute Beginner (0) pieces for calibration:
- Chopsticks
- Mary Had a Little Lamb (simple piano arrangement)
- Für Elise (opening 4 bars only / simplified versions)
- Ode to Joy (very simple single-hand or easy two-hand arrangements)
- Twinkle Twinkle Little Star (piano arrangement)
- Hot Cross Buns
- Lightly Row (Faber/Bastien method)
- Middle C pieces from any beginner method book
- Folk song arrangements at ABRSM Initial Grade level

If a piece in the list is of similar simplicity or difficulty to the above examples, rate it 0. Otherwise rate it 1.

Here are the pieces (format: id|title — composer):
${pieceList}

Return ONLY a valid JSON array, no markdown, no explanation:
[{"id": 1, "difficulty": 0}, ...]

Include every piece. Use only integers 0 or 1.`;

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {
          "x-api-key": apiKey,
          "anthropic-version": "2023-06-01",
          "content-type": "application/json",
          "anthropic-dangerous-direct-browser-access": "true"
        },
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 4096,
          messages: [{ role: "user", content: prompt }]
        })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error?.message || `API error ${res.status}`);
      }

      const data = await res.json();
      const text = data.content?.[0]?.text || "";
      const ratings = JSON.parse(text);

      log(`✓ Received ${ratings.length} ratings from Claude`);
      setStatus("Done — review below");

      // Build lookup
      const ratingMap = {};
      ratings.forEach(r => { ratingMap[r.id] = r.difficulty; });

      // Build proposed changes
      proposedChanges = [];
      let up = 0, down = 0, same = 0;

      const tbody = document.getElementById("results-body");
      tbody.innerHTML = "";

      pieces.forEach(p => {
        const proposed = ratingMap[p.id];
        if (!proposed) return;
        const oldDiff = p.difficulty || 0;
        const change = proposed - oldDiff;
        if (change > 0) up++;
        else if (change < 0) down++;
        else same++;

        proposedChanges.push({ id: p.id, difficulty: proposed });

        const changeClass = change > 0 ? "diff-up" : change < 0 ? "diff-down" : "diff-same";
        const arrow = change > 0 ? "↑" : change < 0 ? "↓" : "→";

        tbody.innerHTML += `
          <tr>
            <td>${p.title}</td>
            <td style="color:#888">${p.composer || "—"}</td>
            <td class="diff-old">${DIFF_LABELS[oldDiff] ?? "—"}</td>
            <td class="diff-new ${changeClass}">
              ${DIFF_LABELS[proposed]}
              <span class="diff-label">${arrow}</span>
            </td>
          </tr>`;
      });

      document.getElementById("summary").innerHTML =
        `<strong>${pieces.length} pieces rated</strong> —
        <span class="badge badge-up">${up} increased</span>
        <span class="badge badge-down">${down} decreased</span>
        <span class="badge badge-same">${same} unchanged</span>`;

      document.getElementById("results-card").style.display = "block";

    } catch(err) {
      log("Error: " + err.message, "err");
      setStatus("");
    }

    document.getElementById("run-btn").disabled = false;
  }

  async function applyChanges() {
    if (!proposedChanges.length) return;
    const btn = document.getElementById("apply-btn");
    btn.disabled = true;
    document.getElementById("apply-status").textContent = "Applying…";

    let applied = 0, failed = 0;
    for (const change of proposedChanges) {
      const { error } = await db.from("pieces").update({ difficulty: change.difficulty }).eq("id", change.id);
      if (error) failed++;
      else applied++;
    }

    document.getElementById("apply-status").textContent =
      `✓ ${applied} updated${failed ? `, ${failed} failed` : ""}`;
    btn.disabled = false;
  }

  // Pre-fill saved key
  const saved = localStorage.getItem("anthropic_key");
  if (saved) document.getElementById("api-key").value = saved;
</script>
</body>
</html>
