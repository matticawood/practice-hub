<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Billing — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js?v=2026060903"></script>
  <style>
    /* Light theme — coherent with community / hub (which override style.css's default). */
    :root {
      --bg: #faf7f3; --surface: #ffffff; --surface-2: #f1f1f4; --border: #e3e1e6;
      --text: #1a1410; --text-muted: #8a7868; --accent: #f5c518; --radius: 10px;
    }
    /* dvh = the live visible viewport, so the page doesn't overshoot past the
       mobile browser/app chrome + bottom nav (which 100vh does). */
    body { background: var(--bg); min-height: 100vh; min-height: 100dvh; }
    /* Top spacing as padding (not margin) so it can't collapse through <body> and
       add to its min-height — that was the few-px overscroll on desktop. */
    .billing-wrap { max-width: 440px; margin: 0 auto; padding: 52px 18px 28px; }
    .billing-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 34px 28px 24px;
      text-align: center;
      box-shadow: 0 18px 44px -22px rgba(60,40,20,.3);
      animation: billingIn .35s cubic-bezier(.22,.61,.36,1);
    }
    @keyframes billingIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .billing-card { animation: none; } }
    /* Gold gradient badge (coherent with achievement medallions / champion tiles) */
    .billing-badge {
      width: 60px; height: 60px; border-radius: 18px;
      margin: 0 auto 18px;
      display: flex; align-items: center; justify-content: center;
      color: #7a5c00;
      background: linear-gradient(155deg, #fdf1d0, #f7da8c);
      box-shadow: 0 9px 20px -9px rgba(245,197,24,.7), inset 0 1px 1px rgba(255,255,255,.75);
    }
    .billing-badge svg { width: 28px; height: 28px; }
    .billing-title { font-size: 1.32rem; font-weight: 800; color: var(--text); letter-spacing: -.01em; margin: 0 0 18px; }
    /* Live subscription status pill */
    .billing-status {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: .76rem; font-weight: 700; letter-spacing: .01em;
      color: #15803d; background: rgba(22,163,74,.1); border: 1px solid rgba(22,163,74,.22);
      border-radius: 20px; padding: 5px 13px; margin-bottom: 22px;
    }
    .billing-status-dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; box-shadow: 0 0 0 3px rgba(22,163,74,.16); }
    .billing-status.inactive { color: #b45309; background: rgba(245,158,11,.1); border-color: rgba(245,158,11,.25); }
    .billing-status.inactive .billing-status-dot { background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.16); }
    /* What the portal lets you do */
    .billing-features {
      list-style: none; margin: 0 0 24px; padding: 15px 16px;
      text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 2px 8px -4px rgba(60,40,20,.1);
      display: flex; flex-direction: column; gap: 12px;
    }
    .billing-features li { display: flex; align-items: center; gap: 11px; font-size: .86rem; color: var(--text); }
    .billing-features li svg { width: 18px; height: 18px; color: #b8860b; flex-shrink: 0; }
    .billing-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; box-sizing: border-box;
      padding: 13px 24px;
      background: linear-gradient(180deg, #f7d24a, #f5c518);
      color: #1a1410; font-size: .92rem; font-weight: 800;
      border-radius: 13px; border: none; cursor: pointer; font-family: inherit;
      box-shadow: 0 8px 18px -8px rgba(245,197,24,.75);
      transition: filter .15s, box-shadow .15s, opacity .15s;
    }
    .billing-btn:hover { filter: brightness(1.04); box-shadow: 0 11px 22px -8px rgba(245,197,24,.85); }
    .billing-btn:active { transform: translateY(1px); }
    .billing-btn:disabled { opacity: .6; cursor: default; box-shadow: none; filter: none; }
    .billing-btn svg { width: 15px; height: 15px; }
    .billing-error { margin-top: 14px; font-size: .83rem; color: #ef4444; display: none; }
    .billing-secure { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; font-size: .74rem; color: var(--text-muted); }
    .billing-secure svg { width: 13px; height: 13px; opacity: .85; }
    .billing-loading { display: inline-flex; align-items: center; gap: 8px; }
    .billing-spinner { width: 16px; height: 16px; border: 2px solid rgba(26,20,16,.3); border-top-color: #1a1410; border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body class="hub-mode">

<header id="app-header" style="display:none"></header>

<div class="billing-wrap">
  <div class="billing-card">
    <div class="billing-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="3"></rect><line x1="1" y1="10" x2="23" y2="10"></line><line x1="6" y1="15" x2="9" y2="15"></line></svg>
    </div>
    <h1 class="billing-title">Manage your billing</h1>

    <div class="billing-status" id="billing-status" style="display:none">
      <span class="billing-status-dot"></span>
      <span id="billing-status-label"></span>
    </div>

    <ul class="billing-features">
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>Update your payment method</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="8" y1="13" x2="16" y2="13"></line><line x1="8" y1="17" x2="13" y2="17"></line></svg>View invoices &amp; receipts</li>
      <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>Change or cancel anytime</li>
    </ul>

    <button class="billing-btn" id="billing-btn" onclick="openPortal()">
      Open billing portal
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
    </button>
    <div class="billing-error" id="billing-error"></div>

    <div class="billing-secure">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
      Secured by Stripe
    </div>
  </div>
</div>
<script>
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db = supabase.createClient(SUPA_URL, SUPA_ANON);

// Initialise header + sidebar. Guard against the getSession() microtask firing
// before DOMContentLoaded (which injects the header HTML via shared-header.js),
// which would leave the chat/notif buttons as null when initSharedHeader queries them.
db.auth.getSession().then(({ data: { session } }) => {
  if (!session) return;
  const run = () => initSharedHeader({ db, myEmail: session.user.email, activePage: "" });
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", run);
  else run();
});

async function openPortal() {
  const btn = document.getElementById("billing-btn");
  const errEl = document.getElementById("billing-error");
  errEl.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = `<span class="billing-loading"><span class="billing-spinner"></span>Redirecting…</span>`;

  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session?.access_token) {
      window.location.href = "/login.html?redirect=/billing.html";
      return;
    }

    const targetEmail = new URLSearchParams(location.search).get("email");
    const body = targetEmail ? JSON.stringify({ targetEmail }) : undefined;

    const res = await fetch("/.netlify/functions/billing-portal", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${session.access_token}`,
        "Content-Type": "application/json",
      },
      body,
    });

    const json = await res.json();

    if (!res.ok || !json.url) {
      throw new Error(json.error || "Something went wrong. Please try again.");
    }

    // Open the Stripe billing portal in a new tab / external Safari so it
    // doesn't take over the WKWebView in the iOS app. In a regular browser
    // this also lands in a new tab so the member can come back to the app
    // afterwards. Falls back to a same-tab navigation if window.open is
    // blocked (rare).
    const opened = window.open(json.url, "_blank");
    if (!opened) window.location.href = json.url;

    // Reset button state — they can press again if needed.
    btn.disabled = false;
    btn.innerHTML = _billingBtnHTML;

  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = _billingBtnHTML;
    errEl.textContent = e.message;
    errEl.style.display = "block";
  }
}

// Captured once so the button can be restored to its labelled state after a redirect.
const _billingBtnHTML = document.getElementById("billing-btn").innerHTML;

// Show the member's current subscription status as a pill (best-effort nicety).
(async function loadBillingStatus() {
  try {
    const { data: { session } } = await db.auth.getSession();
    const email = new URLSearchParams(location.search).get("email") || session?.user?.email;
    if (!email) return;
    const { data } = await db.from("allowed_emails").select("subscription_status").eq("email", email).maybeSingle();
    const status = (data?.subscription_status || "").toLowerCase();
    const el = document.getElementById("billing-status");
    const label = document.getElementById("billing-status-label");
    if (!el || !label) return;
    const ACTIVE = { active: "Active subscription", trialing: "Trial active" };
    const OTHER  = { past_due: "Payment past due", canceled: "Subscription canceled", unpaid: "Payment needed", incomplete: "Setup incomplete", paused: "Subscription paused" };
    if (ACTIVE[status])      { label.textContent = ACTIVE[status]; el.classList.remove("inactive"); el.style.display = ""; }
    else if (OTHER[status])  { label.textContent = OTHER[status]; el.classList.add("inactive");    el.style.display = ""; }
    // unknown / empty status → leave the pill hidden
  } catch (_) { /* status is a nicety; never block the page on it */ }
})();
</script>

</body>
</html>
