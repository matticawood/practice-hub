<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Billing — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="/icon-192.png" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js"></script>
  <style>
    .billing-wrap {
      max-width: 480px;
      margin: 80px auto 0;
      padding: 0 20px 60px;
      text-align: center;
    }
    .billing-icon {
      width: 56px; height: 56px;
      background: rgba(201,168,76,.12);
      border: 1px solid rgba(201,168,76,.25);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      font-size: 1.5rem;
    }
    .billing-title {
      font-size: 1.3rem; font-weight: 800; color: var(--text); margin-bottom: 8px;
    }
    .billing-sub {
      font-size: .88rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 32px;
    }
    .billing-btn {
      display: inline-block;
      padding: 12px 28px;
      background: var(--accent);
      color: #1a1410;
      font-size: .9rem;
      font-weight: 800;
      border-radius: 999px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .15s;
    }
    .billing-btn:hover { opacity: .85; }
    .billing-btn:disabled { opacity: .5; cursor: default; }
    .billing-error {
      margin-top: 20px;
      font-size: .83rem;
      color: #ef4444;
      display: none;
    }
    .billing-loading {
      display: inline-flex; align-items: center; gap: 8px;
    }
    .billing-spinner {
      width: 16px; height: 16px;
      border: 2px solid rgba(26,20,16,.3);
      border-top-color: #1a1410;
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="sh-header-mount"></div>

<div class="billing-wrap">
  <div class="billing-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
      <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
      <line x1="1" y1="10" x2="23" y2="10"></line>
    </svg>
  </div>
  <div class="billing-title">Manage Your Billing</div>
  <div class="billing-sub">
    Update your payment method, view invoices or cancel your subscription. Everything is handled securely through Stripe.
  </div>
  <button class="billing-btn" id="billing-btn" onclick="openPortal()">
    Open Billing Portal
  </button>
  <div class="billing-error" id="billing-error"></div>
  <!-- iOS-in-app fallback: the WKWebView swallows window.open, so the Stripe
       portal can't open from inside the app. Show instructions instead. -->
  <!-- TEMP debug: shows the UA so we can tune the in-app detection. Remove later. -->
  <div id="ua-debug" style="margin-top:18px;padding:10px;border:1px dashed #888;border-radius:6px;font-size:11px;color:#888;word-break:break-all"></div>
  <div class="billing-app-fallback" id="billing-app-fallback" style="display:none;border:1.5px solid var(--border);border-radius:10px;padding:18px 20px;text-align:center;line-height:1.55;font-size:.9rem;color:var(--text)">
    <div style="font-weight:700;margin-bottom:8px">Billing isn't available inside the app yet</div>
    <div style="color:var(--text-muted);font-size:.85rem">
      To manage your subscription, open <strong>app.matthewcawood.com</strong>
      in your browser, sign in, and navigate to <em>Billing</em>.
    </div>
  </div>
</div>
<script>
  // Detect the iOS in-app WebView: iPhone / iPad UA but the standalone-Safari
  // marker is missing. Hide the portal button and show the fallback message.
  (function() {
    const ua = navigator.userAgent || "";
    const isIOSApp = /iPhone|iPad|iPod/.test(ua) && !/Safari\//.test(ua);
    const dbg = document.getElementById("ua-debug");
    if (dbg) dbg.textContent = "UA: " + ua + " | detected as iOS app: " + isIOSApp;
    if (!isIOSApp) return;
    const btn      = document.getElementById("billing-btn");
    const sub      = document.querySelector(".billing-sub");
    const fallback = document.getElementById("billing-app-fallback");
    if (btn) btn.style.display = "none";
    if (sub) sub.style.display = "none";
    if (fallback) fallback.style.display = "block";
  })();
</script>

<script>
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db = supabase.createClient(SUPA_URL, SUPA_ANON);

async function openPortal() {
  const btn = document.getElementById("billing-btn");
  const errEl = document.getElementById("billing-error");
  errEl.style.display = "none";
  btn.disabled = true;
  btn.innerHTML = `<span class="billing-loading"><span class="billing-spinner"></span>Redirecting…</span>`;

  try {
    const { data: { session } } = await db.auth.getSession();
    if (!session?.access_token) {
      window.location.href = "/login.html?redirect=/billing.html";
      return;
    }

    const targetEmail = new URLSearchParams(location.search).get("email");
    const body = targetEmail ? JSON.stringify({ targetEmail }) : undefined;

    const res = await fetch("/.netlify/functions/billing-portal", {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${session.access_token}`,
        "Content-Type": "application/json",
      },
      body,
    });

    const json = await res.json();

    if (!res.ok || !json.url) {
      throw new Error(json.error || "Something went wrong. Please try again.");
    }

    // Open the Stripe billing portal in a new tab / external Safari so it
    // doesn't take over the WKWebView in the iOS app. In a regular browser
    // this also lands in a new tab so the member can come back to the app
    // afterwards. Falls back to a same-tab navigation if window.open is
    // blocked (rare).
    const opened = window.open(json.url, "_blank");
    if (!opened) window.location.href = json.url;

    // Reset button state — they can press again if needed.
    btn.disabled = false;
    btn.textContent = "Open Billing Portal";

  } catch (e) {
    btn.disabled = false;
    btn.textContent = "Open Billing Portal";
    errEl.textContent = e.message;
    errEl.style.display = "block";
  }
}
</script>

</body>
</html>
