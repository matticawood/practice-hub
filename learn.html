<style>
  /* ── The proposed system, piloted here: one border, four radii, three weights,
     six type sizes, two faces. Warm ground, single accent. ── */
  :root {
    --bg:#f6f3ee; --surface:#ffffff; --surface-2:#efe9e0; --border:#e4dbcf;
    --text:#171310; --text-2:#544c43; --text-muted:#6b6155; --text-faint:#8a7d6e;
    --accent:#F5C518; --accent-dark:#8a6a05; --accent-subtle:#fdf3d9;
    --r-s:10px; --r-m:14px; --r-l:20px; --r-pill:999px;
    --shadow:0 1px 2px rgba(23,19,16,.05), 0 12px 28px -20px rgba(23,19,16,.35);
    --shadow-lift:0 2px 6px rgba(23,19,16,.07), 0 20px 40px -24px rgba(23,19,16,.5);
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --disp:Fraunces,Georgia,serif;
    --t-video:#2563eb; --t-clinic:#7c3aed; --t-sheet:#0e9f6e; --t-article:#b45309; --t-course:#be123c;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:400 16px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
  #loading-screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:50; }
  .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:#171310; color:#fff;
    padding:10px 16px; border-radius:var(--r-s); font-size:.82rem; opacity:0; pointer-events:none; transition:.25s; z-index:60; }
  #toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
  #app-main { max-width:1200px; margin:0 auto; padding:22px 20px 110px; }

  /* ── hero ── */
  .lh { display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; padding:6px 0 22px; }
  .lh-l { flex:1; min-width:15rem; }
  .lh h1 { margin:0 0 6px; font:700 clamp(1.75rem,4vw,2.05rem)/1.05 var(--disp); letter-spacing:-.02em; }
  .lh p { margin:0; color:var(--text-muted); font-size:.82rem; }
  .lh-next { margin-left:auto; background:var(--accent-subtle); border:1px solid var(--accent);
    border-radius:var(--r-m); padding:13px 17px; min-width:16rem; text-decoration:none; color:inherit; display:block; }
  .lh-next:hover { box-shadow:var(--shadow-lift); }
  .lh-next b { display:block; font:700 .72rem/1 var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--accent-dark); margin-bottom:4px; }
  .lh-next span { display:block; font:600 .94rem/1.25 var(--sans); }
  .lh-next em { display:block; font-style:normal; color:var(--text-muted); font-size:.82rem; margin-top:2px; }

  /* ── resume band: a wide card, not a lone tile stranded in an empty rail ── */
  .resumes { display:grid; grid-template-columns:repeat(auto-fill,minmax(19rem,26rem)); gap:12px; margin-bottom:4px; }
  .res { display:flex; gap:13px; align-items:center; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-m); padding:12px; text-decoration:none; color:inherit; box-shadow:var(--shadow);
    transition:transform .18s, box-shadow .18s, border-color .18s; }
  .res:hover { transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:color-mix(in srgb,var(--tc) 40%,var(--border)); }
  .res-th { flex:0 0 5.5rem; aspect-ratio:16/10; border-radius:var(--r-s); overflow:hidden; position:relative;
    background:color-mix(in srgb, var(--tc) 10%, #fff); display:grid; place-items:center; }
  .res-th img { width:100%; height:100%; object-fit:cover; }
  .res-th svg { width:24px; height:24px; color:color-mix(in srgb, var(--tc) 65%, #fff); }
  .res-b { min-width:0; flex:1; display:flex; flex-direction:column; gap:3px; }
  .res-k { font:700 .72rem/1 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--tc); }
  .res-t { font:600 .94rem/1.3 var(--sans); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .res-m { font-size:.78rem; color:var(--text-muted); }

  /* ── rows ── */
  .row { margin-top:30px; }
  .rh { display:flex; align-items:baseline; gap:10px; margin:0 0 11px; }
  .rh h2 { margin:0; font:700 1.12rem/1.2 var(--sans); letter-spacing:-.012em; }
  .rh .rs { color:var(--text-muted); font-size:.82rem; }
  .rh .all { margin-left:auto; background:none; border:none; padding:0; cursor:pointer; font:600 .82rem/1 var(--sans); color:var(--accent-dark); }
  .rh .all:hover { text-decoration:underline; }
  .rail { display:flex; gap:12px; overflow-x:auto; padding-bottom:9px; scroll-snap-type:x proximity;
    scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .rail::-webkit-scrollbar { height:7px; }
  .rail::-webkit-scrollbar-thumb { background:var(--border); border-radius:var(--r-pill); }
  .rail::-webkit-scrollbar-track { background:transparent; }

  /* ── card ── */
  .c { flex:0 0 15.5rem; scroll-snap-align:start; display:flex; flex-direction:column; gap:8px;
    text-decoration:none; color:inherit; }
  .c .th { position:relative; display:block; aspect-ratio:16/9; border-radius:var(--r-m); overflow:hidden;
    background:var(--surface-2); box-shadow:var(--shadow); transition:transform .22s, box-shadow .22s; }
  .c:hover .th { transform:translateY(-3px); box-shadow:var(--shadow-lift); }
  .c:focus-visible .th { outline:2px solid var(--accent-dark); outline-offset:3px; }
  .c img { width:100%; height:100%; object-fit:cover; display:block; }
  /* No thumbnail: a quiet tinted plate with the type mark, never the title —
     the title always sits below the tile so every card in a row aligns. */
  /* Ruled like manuscript paper, so a thing with no thumbnail still has a
     surface. The previous plate sat within 3% of the page and read as a hole. */
  .c .flat { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:space-between;
    padding:13px 14px; color:#fff;
    background:
      repeating-linear-gradient(180deg, transparent 0 13px,
        color-mix(in srgb, #fff 26%, transparent) 13px 14px),
      linear-gradient(150deg, var(--tc), color-mix(in srgb, var(--tc) 62%, #12100e)); }
  .c .flat svg { width:19px; height:19px; color:rgba(255,255,255,.85); flex:0 0 auto; }
  .c .flat b { font:600 1.16rem/1.15 var(--disp); letter-spacing:-.012em; color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.22);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .c .flat:not(:has(b)) { align-items:center; justify-content:center; }
  .c .flat:not(:has(b)) svg { width:34px; height:34px; }
  .crail .flat, .c.soon .flat { align-items:center; justify-content:center; }
  .crail .flat svg, .c.soon .flat svg { width:46px; height:46px; }
  .pl { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:2.6rem; height:2.6rem;
    border-radius:50%; background:rgba(18,16,14,.62); display:grid; place-items:center; }
  .pl::after { content:""; border-left:.85rem solid #fff; border-top:.52rem solid transparent;
    border-bottom:.52rem solid transparent; margin-left:.2rem; }
  .du { position:absolute; right:6px; bottom:6px; background:rgba(18,16,14,.82); color:#fff;
    font:600 .72rem/1 ui-monospace,monospace; padding:3px 5px; border-radius:6px; }
  .dn { position:absolute; left:6px; top:6px; background:#eef6ee; color:#2f6b45;
    font:700 .72rem/1 var(--sans); letter-spacing:.04em; text-transform:uppercase; padding:4px 7px; border-radius:var(--r-pill); }
  .ck { font:700 .72rem/1 var(--sans); letter-spacing:.09em; text-transform:uppercase; color:var(--tc); }
  .ct { font:500 .88rem/1.35 var(--sans); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .cm { font-size:.78rem; color:var(--text-muted); }
  .vrail .c { flex:0 0 9.5rem; }
  .vrail .c .th { aspect-ratio:9/16; }

  /* ── course card ── */
  .crail .c { flex:0 0 16.5rem; }
  .c .cb { display:flex; flex-direction:column; gap:4px; }
  .c .lv { font:700 .72rem/1 var(--sans); letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
  .c .bl { font-size:.82rem; color:var(--text-muted); line-height:1.45; }
  .c .ft { display:flex; justify-content:space-between; gap:8px; font-size:.78rem; color:var(--text-muted); margin-top:2px; }
  .c .ft b { color:var(--accent-dark); font-weight:600; }
  .bar { height:4px; background:var(--surface-2); border-radius:var(--r-pill); overflow:hidden; margin-top:4px; }
  .bar i { display:block; height:100%; background:var(--accent-dark); border-radius:var(--r-pill); }
  .c.soon .th { filter:saturate(.4); opacity:.55; }
  .c.soon { cursor:default; }
  .badge { font:700 .72rem/1 var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted);
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-pill); padding:4px 9px; }

  /* ── search + grid ── */
  .lctl { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:26px 0 0; }
  .lsearch { flex:1; min-width:15rem; display:flex; align-items:center; gap:9px; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--r-s); padding:11px 14px; box-shadow:var(--shadow); }
  .lsearch input { flex:1; border:none; outline:none; background:none; font:400 .94rem var(--sans); color:var(--text); }
  .lfil { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-pill); padding:8px 14px;
    font:600 .82rem/1 var(--sans); color:var(--text-muted); cursor:pointer; display:flex; align-items:center; gap:7px; }
  .lfil:hover { border-color:var(--accent-dark); color:var(--text); }
  .lfil[aria-pressed="true"] { color:#fff; background:var(--fc); border-color:var(--fc); }
  .lfil .fn { font-size:.72rem; opacity:.75; font-variant-numeric:tabular-nums; }
  .lcount { font-size:.82rem; color:var(--text-muted); margin:12px 0; }
  .lcount b { color:var(--text); font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:16px 12px; }
  .grid .c { flex:none; }
  .empty { background:var(--surface); border:1px dashed var(--border); border-radius:var(--r-m);
    padding:34px; text-align:center; color:var(--text-muted); font-size:.94rem; }
  .morewrap { text-align:center; margin-top:20px; }
  .more { background:var(--surface); border:1px solid var(--border); border-radius:var(--r-pill);
    padding:10px 20px; font:600 .82rem/1 var(--sans); color:var(--text-2); cursor:pointer; }
  .more:hover { border-color:var(--accent-dark); color:var(--text); }

  /* ── drills ── */
  .drills { display:grid; grid-template-columns:repeat(auto-fill,minmax(10.5rem,1fr)); gap:12px; }
  .drill { display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-m); padding:13px 14px; text-decoration:none; color:inherit; box-shadow:var(--shadow);
    transition:transform .18s, box-shadow .18s, border-color .18s; min-height:44px; }
  .drill:hover { transform:translateY(-2px); box-shadow:var(--shadow-lift); border-color:color-mix(in srgb,var(--ccol) 45%,var(--border)); }
  .drill-ic { width:36px; height:36px; border-radius:var(--r-s); flex:0 0 auto; display:grid; place-items:center;
    background:color-mix(in srgb,var(--ccol) 14%,#fff); color:var(--ccol); }
  .drill-ic svg { width:19px; height:19px; }
  .drill-nm { font:600 .88rem/1.25 var(--sans); }

  @media (max-width:640px) {
    #app-main { padding:16px 14px 90px; }
    .c { flex:0 0 72vw; } .vrail .c { flex:0 0 42vw; } .crail .c { flex:0 0 76vw; }
    .lh-next { margin-left:0; width:100%; }
    .row { margin-top:26px; }
    .grid { grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; animation:none !important; } }
</style>

    // `soon` is the line shown where the lesson count and CTA normally sit.
    { key: "upper-intermediate-walkthrough", label: "Upper Intermediate Walkthrough", soon: "Coming in September",
      blurb: "A full upper intermediate piece, bar by bar, including how to make decisions and learn effectively.",
      color: "#14b8a6", audience: "Upper intermediate",
      icon: SVGI('<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="4" x2="8" y2="14"/><line x1="12" y1="4" x2="12" y2="14"/><line x1="16" y1="4" x2="16" y2="14"/>') },
    { key: "sight-reading-beginners", label: "Sight Reading for Beginners", soon: "Coming in September",
      blurb: "Play music you have never seen before, with the exact formula for improvement.",
      color: "#0ea5e9", audience: "Beginners",
      icon: SVGI('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>') },
  ];
  const META = Object.fromEntries(CMETA.map(c => [c.key, c]));

  COURSES = (cs.data || []).filter(c => META[c.key]).map(c => {
    const mine = lessons.filter(l => l.course === c.key);
    const d = mine.filter(l => done.has(l.id)).length;
    return Object.assign({}, META[c.key], { n:mine.length, done:d,
      pct: mine.length ? Math.round(d / mine.length * 100) : 0 });
  }).filter(c => c.n > 0);
  COURSES.push(
    { key:null, label:"Upper Intermediate Walkthrough", audience:"Upper intermediate", color:"#14b8a6",
      soon:"Coming in September", icon:SVGI('<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="4" x2="8" y2="14"/><line x1="12" y1="4" x2="12" y2="14"/><line x1="16" y1="4" x2="16" y2="14"/>'),
      blurb:"A full upper intermediate piece, bar by bar, including how to make decisions and learn effectively." },
    { key:null, label:"Sight Reading for Beginners", audience:"Beginners", color:"#0ea5e9",
      soon:"Coming in September", icon:SVGI('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'),
      blurb:"Play music you have never seen before, with the exact formula for improvement." });

  /* every browsable item, normalised to one shape */
  ITEMS = [];
  (sheets.data || []).forEach(s => ITEMS.push({
    type:"sheet", title:s.title, topic:s.category, date:s.created_at, done:readSet.has(s.id),
    href:"/theory/sheets/view.html?slug=" + encodeURIComponent(s.slug),
    meta:(s.category || "Piano Practice Daily") + " · " + fmtDate(s.created_at) }));
  (evs.data || []).filter(e => e.mux_playback_id).forEach(e => ITEMS.push({
    type:"clinic", title:(e.title || "").replace(/^Live Practice Clinic:?\s*/i, ""), date:e.scheduled_at,
    img:"https://image.mux.com/" + e.mux_playback_id + "/thumbnail.webp?width=480&height=270&fit_mode=smartcrop&time=25",
    playable:true, dur:e.duration_mins ? e.duration_mins + " min" : "",
    href:"/events.html?event=" + encodeURIComponent(e.id), meta:"Clinic replay · " + fmtDate(e.scheduled_at) }));
  // The content feed carries three kinds of thing and only two of them are
  // learning material. `blog` posts announce a Monday Music Tips article, which
  // is already here from mmt_articles, so they would show everything twice.
  // Clinic topic polls are a question to the room, not something to learn from,
  // and clinic announcements duplicate the clinic itself from live_events.
  // A poll is identified by having a poll row, not by its title, because a post
  // is a poll, a video or a written post and the title cannot be trusted to say
  // which. The title check is only a backstop for one older poll whose rows are
  // gone. Clinic announcements are dropped because live_events already has them.
  const pollIds = new Set((polls.data || []).map(p => p.post_id));
  const FEED_SKIP = /topic poll|^live practice clinic|^live q&a/i;
  const muxId = p => {
    const m = (p.media || []).find(x => x && x.type === "mux");
    return m ? (m.playbackId || m.playback_id || "") : "";
  };
  (feed.data || []).forEach(p => {
    if (p.type === "blog") return;                       // duplicates mmt_articles
    if (pollIds.has(p.id) || FEED_SKIP.test(p.title || "")) return;
    const mux = muxId(p);
    if (p.youtube_id) {
      const vert = p.orientation === "portrait";
      ITEMS.push({ type:"video", title:p.title, date:p.published_at, playable:true, vertical:vert,
        img:"https://i.ytimg.com/vi/" + p.youtube_id + (vert ? "/oardefault.jpg" : "/mqdefault.jpg"),
        href:p.url || ("https://youtu.be/" + p.youtube_id), external:true,
        dur:p.duration_seconds ? mins(p.duration_seconds) : "",
        meta:(vert ? "Short · " : "Video · ") + fmtDate(p.published_at) });
    } else if (mux) {                                    // Matthew's own uploads
      ITEMS.push({ type:"video", title:p.title, date:p.published_at, playable:true,
        img:"https://image.mux.com/" + mux + "/thumbnail.webp?width=480&height=270&fit_mode=smartcrop&time=8",
        href:"/content-feed.html?post=" + encodeURIComponent(p.id),
        dur:p.duration_seconds ? mins(p.duration_seconds) : "",
        meta:"Video · " + fmtDate(p.published_at) });
    } else {
      ITEMS.push({ type:"video", title:p.title, date:p.published_at,
        href:"/content-feed.html?post=" + encodeURIComponent(p.id),
        meta:"Post · " + fmtDate(p.published_at) });
    }
  });
  (mmt.data || []).forEach(a => ITEMS.push({
    type:"article", title:a.title, date:a.published_at || a.created_at, img:a.cover_image || "",
    href:"https://matthewcawood.com/monday-music-tips/" + encodeURIComponent(a.slug), external:true,
    meta:"Monday Music Tips · " + fmtDate(a.published_at || a.created_at) }));
  lessons.forEach(l => { if (META[l.course]) ITEMS.push({
    type:"course", title:l.title, topic:META[l.course].label, done:done.has(l.id),
    href:"/courses.html?lesson=" + encodeURIComponent(l.id),
    meta:META[l.course].label + (l.est_minutes ? " · " + l.est_minutes + " min" : "") }); });

  /* A title can legitimately exist in two tables; show it once. */
  const seenTitle = new Set();
  ITEMS = ITEMS.filter(i => {
    const k = (i.type === "course" ? "lesson:" : "") + (i.title || "").trim().toLowerCase();
    if (!k || seenTitle.has(k)) return false;
    seenTitle.add(k); return true;
  });

  /* topics come from the only vocabulary that is actually populated today */
  const counts = {};
  ITEMS.forEach(i => { if (i.topic) counts[i.topic] = (counts[i.topic] || 0) + 1; });
  TOPICS = Object.keys(counts).map(n => ({ name:n, count:counts[n] })).sort((a,b) => b.count - a.count);

  /* continue row */
  CONTINUE = [];
  const started = COURSES.filter(c => c.key && c.done > 0 && c.done < c.n).sort((a,b) => b.pct - a.pct)[0];
  if (started) CONTINUE.push({ k:"Course", mark:"course", tc:"var(--t-course)", t:started.label,
    m:started.done + " of " + started.n + " lessons", pct:started.pct, href:"/courses.html?course=" + started.key });
  const piece = (ups.data || [])[0];
  if (piece) CONTINUE.push({ k:"Piece", mark:"sheet", tc:"var(--t-sheet)", t:piece.title + (piece.composer ? " — " + piece.composer : ""),
    m:piece.last_practiced_at ? "Last practised " + fmtDate(piece.last_practiced_at) : "Not practised yet",
    href:"/resources.html?section=library" });
  const nextUp = (evs.data || []).filter(e => e.scheduled_at && new Date(e.scheduled_at) > new Date()).slice(-1)[0];
  if (nextUp) CONTINUE.push({ k:"Next clinic", tc:"var(--t-clinic)", t:(nextUp.title || "").replace(/^Live Practice Clinic:?\s*/i, ""),
    m:new Date(nextUp.scheduled_at).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}),
    href:"/events.html?event=" + nextUp.id });
}


/* ── card ───────────────────────────────────────────────────────────────────── */
function card(it) {
  const T = TYPES[it.type] || TYPES.video;
  const inner = it.img
    ? '<img src="' + esc(it.img) + '" alt="" loading="lazy">'
      + (it.playable ? '<span class="pl"></span>' : "")
      + (it.dur ? '<span class="du">' + esc(it.dur) + "</span>" : "")
    : '<span class="flat" style="--tc:' + T.colour + '">' + (MARK[it.type] || MARK.video)
      + (it.topic ? "<b>" + esc(it.topic) + "</b>" : "") + "</span>";
  return '<a class="c" href="' + esc(it.href) + '"' + (it.external ? ' target="_blank" rel="noopener"' : "")
    + '><span class="th' + (it.vertical ? " v" : "") + '">' + inner
    + (it.done ? '<span class="dn">' + (it.type === "sheet" ? "Read" : "Done") + "</span>" : "")
    + '</span><span class="ck" style="--tc:' + T.colour + '">' + esc(T.label) + "</span>"
    + '<span class="ct">' + esc(it.title) + "</span>"
    + (it.meta ? '<span class="cm">' + esc(it.meta) + "</span>" : "") + "</a>";
}
function courseCard(c) {
  const hero = c.thumbId
    ? '<span class="th"><img src="https://image.mux.com/' + c.thumbId + '/thumbnail.webp?width=560&height=315&fit_mode=smartcrop&time='
      + (c.thumbTime || 0) + '" alt="" loading="lazy"><span class="pl"></span></span>'
    : '<span class="th"><span class="flat" style="--tc:' + c.color + '">' + (c.icon || MARK.course) + "</span></span>";
  const body = '<span class="cb"><span class="lv">' + esc(c.audience || "") + "</span>"
    + '<span class="ct">' + esc(c.label) + "</span>"
    + '<span class="bl">' + esc(c.blurb || "") + "</span>"
    + (c.done ? '<span class="bar"><i style="width:' + c.pct + '%"></i></span>' : "")
    + '<span class="ft">' + (c.soon
        ? '<span class="badge">' + esc(c.soon) + "</span>"
        : "<span>" + c.n + " lesson" + (c.n === 1 ? "" : "s") + (c.done ? " · " + c.pct + "%" : "")
          + "</span><b>" + (c.done ? "Continue" : "Start") + "</b>")
    + "</span></span>";
  return c.soon
    ? '<div class="c soon">' + hero + body + "</div>"
    : '<a class="c" href="/courses.html?course=' + esc(c.key) + '">' + hero + body + "</a>";
}
function row(title, sub, items, opts) {
  if (!items.length) return "";
  const o = opts || {};
  return '<section class="row"><header class="rh"><h2>' + esc(title) + "</h2>"
    + (sub ? '<span class="rs">' + esc(sub) + "</span>" : "")
    + (o.seeAll ? '<button class="all" type="button" data-see="' + esc(o.seeAll) + '">See all</button>' : "")
    + '</header><div class="' + (items.length <= 4 && !o.vertical ? "grid" : "rail")
    + (o.vertical ? " vrail" : "") + (o.course ? " crail" : "") + '">'
    + items.map(o.course ? courseCard : card).join("") + "</div></section>";
}

/* ── filtering ──────────────────────────────────────────────────────────────── */
function filtered() {
  const t = term.trim().toLowerCase();
  return ITEMS.filter(i =>
    (!type  || i.type === type) &&
    (!topic || i.topic === topic) &&
    (!t     || i.title.toLowerCase().includes(t) || (i.topic || "").toLowerCase().includes(t)));
}
const byDate = (a, b) => new Date(b.date || 0) - new Date(a.date || 0);

/* ── render ─────────────────────────────────────────────────────────────────── */
function render() {
  const counts = {}; ITEMS.forEach(i => counts[i.type] = (counts[i.type] || 0) + 1);
  const browsing = !!(term || type || topic);
  const flat = ITEMS.filter(i => !i.vertical);
  const next = CONTINUE.find(c => c.k === "Next clinic");
  const resume = CONTINUE.filter(c => c.k !== "Next clinic");

  let html =
    '<div class="lh"><div class="lh-l"><h1>Learn</h1><p>'
    + (counts.video || 0) + " videos · " + (counts.clinic || 0) + " clinic replays · "
    + (counts.sheet || 0) + " sheets · " + (counts.article || 0) + " articles · "
    + (counts.course || 0) + " course lessons</p></div>"
    + (next ? '<a class="lh-next" href="' + esc(next.href) + '"><b>Next live clinic</b><span>'
        + esc(next.t) + "</span><em>" + esc(next.m) + "</em></a>" : "")
    + "</div>"
    + (resume.length
        ? '<div class="resumes">' + resume.map(c =>
            '<a class="res" href="' + esc(c.href) + '" style="--tc:' + c.tc + '">'
            + '<span class="res-th">' + (MARK[c.mark] || MARK.course) + "</span>"
            + '<span class="res-b"><span class="res-k">' + esc(c.k) + "</span>"
            + '<span class="res-t">' + esc(c.t) + "</span>"
            + (c.pct != null ? '<span class="bar"><i style="width:' + c.pct + '%"></i></span>' : "")
            + '<span class="res-m">' + esc(c.m) + "</span></span></a>").join("") + "</div>"
        : "")
    + '<div class="lctl"><label class="lsearch"><input id="ln-q" type="search" placeholder="Search the library" value="'
    + esc(term) + '" autocomplete="off"></label><div id="ln-types" style="display:flex;gap:8px;flex-wrap:wrap">'
    + Object.keys(TYPES).map(k => '<button class="lfil" type="button" data-type="' + k + '" aria-pressed="'
        + (type === k) + '" style="--fc:' + TYPES[k].colour + '">' + esc(TYPES[k].label)
        + '<span class="fn">' + (counts[k] || 0) + "</span></button>").join("")
    + "</div></div>";

  if (browsing) {
    const list = filtered().sort(byDate);
    const shown = showAll ? list : list.slice(0, 36);
    html += '<div class="lcount"><b>' + list.length + "</b> item" + (list.length === 1 ? "" : "s")
      + (topic ? " in " + esc(topic) : "") + (term ? ' matching "' + esc(term) + '"' : "")
      + ' · <button class="all" id="ln-clear" type="button">clear</button></div>'
      + (shown.length ? '<div class="grid">' + shown.map(card).join("") + "</div>"
          + (!showAll && list.length > shown.length
              ? '<div class="morewrap"><button class="more" id="ln-all" type="button">Show all ' + list.length + "</button></div>" : "")
        : '<div class="empty">Nothing matches that yet.</div>');
  } else {
    const seen = new Set();
    const take = (pred, n) => flat.filter(i => pred(i) && !seen.has(i.href)).sort(byDate).slice(0, n)
      .map(i => { seen.add(i.href); return i; });

    html += row("New this week", "", take(() => true, 12), {});
    html += row("Paths", "courses", COURSES, { course:true });
    html += row("Clinic replays", (counts.clinic || 0) + " sessions", take(i => i.type === "clinic", 12), { seeAll:"clinic" });
    html += row("Videos", (counts.video || 0) + " on the channel", take(i => i.type === "video", 14), { seeAll:"video" });
    TOPICS.slice(0, 6).forEach(t => {
      html += row(t.name, t.count + " items",
        flat.filter(i => i.topic === t.name).sort(byDate).slice(0, 12), { seeAll:"topic:" + t.name });
    });
    html += row("Piano Practice Daily", (counts.sheet || 0) + " sheets", take(i => i.type === "sheet", 14), { seeAll:"sheet" });
    html += row("Monday Music Tips", (counts.article || 0) + " articles", take(i => i.type === "article", 14), { seeAll:"article" });
    const shorts = ITEMS.filter(i => i.vertical).sort(byDate).slice(0, 24);
    html += row("Shorts", "a minute or two each", shorts, { vertical:true });
  }

  html += '<section class="row"><header class="rh"><h2>Drills</h2><span class="rs">come back to these</span></header>'
    + '<div class="drills">' + DRILLS.map(d =>
        '<a class="drill" style="--ccol:' + d.colour + '" href="/tools.html' + (d.key ? "?section=" + d.key : "") + '">'
        + '<span class="drill-ic">' + d.icon + '</span><span class="drill-nm">' + esc(d.name) + "</span></a>").join("")
    + "</div></section>";

  $("ln-root").innerHTML = html;
  wire();
}

function wire() {
  const q = $("ln-q");
  if (q) q.oninput = e => { term = e.target.value; showAll = false; render(); const n = $("ln-q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  const ty = $("ln-types");
  if (ty) ty.querySelectorAll(".lfil").forEach(b => b.onclick = () => {
    type = (type === b.dataset.type) ? "" : b.dataset.type; topic = ""; showAll = false; render();
  });
  document.querySelectorAll("[data-see]").forEach(b => b.onclick = () => {
    const v = b.dataset.see;
    if (v.startsWith("topic:")) { topic = v.slice(6); type = ""; } else { type = v; topic = ""; }
    showAll = false; render(); window.scrollTo({ top:0, behavior:"smooth" });
  });
  const all = $("ln-all");   if (all) all.onclick = () => { showAll = true; render(); };
  const clr = $("ln-clear"); if (clr) clr.onclick = () => { topic = type = term = ""; showAll = false; render(); };
}

/* ── boot ───────────────────────────────────────────────────────────────────── */
(async function() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/"; return; }
  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];
  try {
    initSharedHeader({ db, myEmail, myName, isAdmin: myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase(),
      activePage:"learn", avatarUrl:(ae && ae.avatar_url) || null });
  } catch (e) { console.error("initSharedHeader error:", e); }

  const sp = new URLSearchParams(location.search);
  topic = sp.get("topic") || ""; type = sp.get("type") || ""; term = sp.get("q") || "";

  try { await load(); render(); }
  catch (e) {
    console.error("learn load error:", e);
    $("ln-root").innerHTML = '<div class="empty">Something went wrong loading the library. Reload to try again.</div>';
  }
  $("loading-screen").style.display = "none";
  $("app-main").style.display = "block";
  $("app-header").style.display = "";
})();

</script>
</body>
</html>
