<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Learn · The Practice Room</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* ── The proposed system, piloted here: one border, four radii, three weights,
     six type sizes, two faces. Warm ground, single accent. ── */
  :root {
    --bg:#f6f3ee; --surface:#ffffff; --surface-2:#efe9e0; --border:#e4dbcf;
    --text:#171310; --text-2:#544c43; --text-muted:#6b6155; --text-faint:#8a7d6e;
    --accent:#F5C518; --accent-dark:#8a6a05; --accent-subtle:#fdf3d9;
    --r-s:10px; --r-m:14px; --r-l:20px; --r-pill:999px;
    --shadow:0 1px 2px rgba(23,19,16,.05), 0 12px 28px -20px rgba(23,19,16,.35);
    --shadow-lift:0 2px 6px rgba(23,19,16,.07), 0 20px 40px -24px rgba(23,19,16,.5);
    --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --disp:Fraunces,Georgia,serif;
    --t-video:#2563eb; --t-clinic:#7c3aed; --t-sheet:#0e9f6e; --t-article:#b45309; --t-course:#be123c;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:400 16px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
  #loading-screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:50; }
  .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:#171310; color:#fff;
    padding:10px 16px; border-radius:var(--r-s); font-size:.82rem; opacity:0; pointer-events:none; transition:.25s; z-index:60; }
  #toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
  /* Rows run to the edges rather than sitting in a 1200px box with dead space
     either side. Text inside the billboard still has its own width limit, so
     nothing becomes an unreadable line. */
  #app-main { max-width:none; margin:0; padding:22px clamp(18px,2.6vw,52px) 110px; }

  /* ── billboard: the page opens with content, not with a label. One piece,
     full width, with the next action on it. ── */
  .ln-bb { position:relative; display:block; cursor:pointer; border-radius:var(--r-l); overflow:hidden;
    margin:0 0 30px; min-height:19rem; text-decoration:none; color:#fff; background:#1a1512;
    box-shadow:0 2px 8px rgba(23,19,16,.10), 0 30px 60px -40px rgba(23,19,16,.75); }
  .ln-bb-img { position:absolute; inset:0; }
  /* A 16:9 still inside a very wide, short box crops from the centre and takes
     the top of the head off. Bias the crop upward so the face stays in frame. */
  .ln-bb-img img { width:100%; height:100%; object-fit:cover; object-position:50% 22%; display:block; }
  @media (max-width:640px) { .ln-bb-img img { object-position:50% 30%; } }
  .ln-bb-img::after { content:""; position:absolute; inset:0;
    background:linear-gradient(90deg, rgba(14,12,10,.94) 0%, rgba(14,12,10,.82) 38%, rgba(14,12,10,.28) 72%, rgba(14,12,10,.12) 100%); }
  .ln-bb-in { position:relative; padding:38px 40px; max-width:38rem; display:flex; flex-direction:column;
    justify-content:center; min-height:19rem; }
  .ln-bb-krow { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
  .ln-bb-k { display:inline-flex; align-items:center; gap:8px;
    font:700 .72rem/1 var(--sans); letter-spacing:.14em; text-transform:uppercase; color:#12100e;
    background:var(--accent); border-radius:var(--r-pill); padding:7px 12px; }
  .ln-bb h2 { margin:0 0 12px; font:600 clamp(1.7rem,3.4vw,2.5rem)/1.12 var(--disp);
    letter-spacing:-.022em; color:#fff; text-wrap:balance; }
  .ln-bb p { margin:0 0 22px; font-size:.97rem; line-height:1.55; color:rgba(255,255,255,.8); max-width:34rem; }
  .ln-bb-acts { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .ln-bb-go, .ln-bb-go2 { display:inline-flex; align-items:center; justify-content:center;
    border-radius:var(--r-pill); padding:11px 20px; font:600 .88rem/1 var(--sans);
    letter-spacing:.01em; text-decoration:none; transition:background .18s, border-color .18s; }
  .ln-bb-go { background:#fff; color:#12100e; border:1px solid #fff; }
  .ln-bb-go:hover { background:var(--accent); border-color:var(--accent); }
  .ln-bb-go2 { background:rgba(255,255,255,.09); color:#fff; border:1px solid rgba(255,255,255,.42); }
  .ln-bb-go2:hover { background:rgba(255,255,255,.18); border-color:#fff; }

  .ln-bb-when { font:600 .84rem/1 var(--sans); color:rgba(255,255,255,.82); }
  .ln-bb-lib { display:flex; gap:16px; flex-wrap:wrap; margin-top:24px; padding-top:16px;
    border-top:1px solid rgba(255,255,255,.14); font:500 .8rem/1 var(--sans); color:rgba(255,255,255,.62); }
  .ln-bb-lib b { color:rgba(255,255,255,.9); font-weight:600; font-variant-numeric:tabular-nums; }
  /* On a phone: one image, text anchored to the bottom of it, over a scrim that
     is clear at the top and opaque where the words are. No second panel. */
  @media (max-width:640px) {
    .ln-bb { min-height:26rem; }
    .ln-bb-img::after { background:linear-gradient(180deg,
        rgba(14,12,10,0) 0%, rgba(14,12,10,.10) 30%, rgba(14,12,10,.80) 62%,
        rgba(14,12,10,.95) 84%, rgba(14,12,10,.97) 100%); }
    .ln-bb-img img { object-position:50% 20%; }
    .ln-bb-in { padding:20px 18px 22px; min-height:26rem; max-width:none; justify-content:flex-end; }
    .ln-bb-krow { margin-bottom:10px; }
    .ln-bb h2 { font-size:1.42rem; margin-bottom:8px; }
    .ln-bb p { font-size:.88rem; line-height:1.45; margin-bottom:15px;
      display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .ln-bb-lib { margin-top:15px; padding-top:12px; gap:11px; font-size:.75rem; }
  }



  /* ── rows ── */
  .ln-row { margin-top:30px; }

  /* Watch without leaving the page: the row stays exactly where it was behind
     the scrim, so dipping in and out of a row costs nothing. */
  .ln-lb { position:fixed; inset:0; z-index:900; display:none; overflow-y:auto;
    background:rgba(14,12,10,.78); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px);
    padding:clamp(16px,5vh,56px) clamp(12px,4vw,40px); }
  .ln-lb.open { display:block; }
  @keyframes ln-lb-up   { from { transform:translateY(100%); } to { transform:none; } }
  @keyframes ln-lb-down { from { transform:none; } to { transform:translateY(100%); } }
  @keyframes ln-lb-fade { from { opacity:0; } to { opacity:1; } }
  .ln-lb.open { animation:ln-lb-fade .18s ease-out; }
  .ln-lb.open .ln-lb-in { animation:ln-lb-up .28s cubic-bezier(.22,.61,.36,1); }
  .ln-lb.closing .ln-lb-in { animation:ln-lb-down .2s ease-in forwards; }
  @media (prefers-reduced-motion: reduce) {
    .ln-lb.open, .ln-lb.open .ln-lb-in, .ln-lb.closing .ln-lb-in { animation:none; }
  }
  .ln-lb-in { max-width:min(1040px,100%); margin:0 auto; position:relative; padding-top:46px; }
  /* Above the media, not on it: sitting over the player covered YouTube's own
     captions and settings buttons. Out of the flow so it cannot shorten it. */
  .ln-lb-close { position:absolute; top:0; right:0; z-index:3;
    width:38px; height:38px; border-radius:50%; border:1px solid rgba(255,255,255,.28);
    background:rgba(20,17,15,.72); color:#fff; font-size:1.15rem; line-height:1; cursor:pointer;
    display:grid; place-items:center; }
  .ln-lb-close:hover { background:rgba(255,255,255,.16); border-color:#fff; }
  /* The media is the point, so it sits first and full width. */
  .ln-lb-media { border-radius:var(--r-l); overflow:hidden; background:#000;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.75); }
  .ln-lb-media .cf-yt-embed, .ln-lb-media .cf-yt-thumb { border-radius:0; }
  .ln-lb-media mux-player, .ln-lb-media video { width:100%; display:block; }
  .ln-lb-body { padding:18px 20px 14px; }
  .ln-lb-body .cf-card-title { font:700 1.32rem/1.3 var(--serif); margin:0 0 6px; }
  .ln-lb-meta { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    border-top:1px solid var(--border); margin-top:14px; padding-top:12px;
    font:500 .8rem/1 var(--sans); color:var(--text-muted); }
  .ln-lb-count { margin-left:auto; font:500 .78rem/1 var(--sans); color:var(--text-muted); }
  /* .tc-comments-section already draws its own card, so this is only spacing.
     Giving it a background and border made a box inside a box. */
  /* Everything below the video arrives at once. Until it does, this is a plain
     surface with one spinner, rather than four things appearing in sequence and
     the loader creeping down the page. */
  .ln-lb-under { background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-l); margin-top:14px; overflow:hidden; }
  .ln-lb-under > .ln-lb-loader { display:none; }
  .ln-lb-under.loading > .ln-lb-loader { display:grid; place-items:center; min-height:190px; }
  .ln-lb-under.loading > .ln-lb-body, .ln-lb-under.loading > .ln-lb-cmts { display:none; }
  .ln-lb-loading { display:grid; place-items:center; padding:34px 0;
    color:var(--text-muted); font:500 .85rem/1 var(--sans); }
  /* The embed keeps a 16:9 box, so capping only its height would letterbox it.
     Cap the WIDTH to whatever 16:9 allows at this screen height and centre it,
     and the whole video scales to fit instead of running off the bottom. */
  @media (orientation:landscape) and (max-height:520px) {
    .ln-lb-media .cf-yt-embed, .ln-lb-media .cf-yt-thumb {
      width:min(100%, calc(100vh * 16 / 9)); margin-left:auto; margin-right:auto; }
    .ln-lb-media mux-player, .ln-lb-media video { max-height:100vh; width:auto; margin:0 auto; }
  }
  /* Inside the lightbox the media block IS the spacing, so the embed's own
     bottom margin just leaves a black strip under the video. */
  .ln-lb-media .cf-yt-embed, .ln-lb-media .cf-yt-thumb, .ln-lb-media .cf-post-media { margin-bottom:0; }
  /* The panel is the card now, so the comments section drops its own frame and
     keeps only a divider between it and the reaction row. */
  .ln-lb-cmts .tc-comments-section { border:0; border-top:1px solid var(--border);
    border-radius:0; background:transparent; margin:0; }
  @media (max-width:640px) {
    .ln-lb { padding:0; background:rgba(14,12,10,.92); }
    /* Video hard against the top, as it is on YouTube, so the close sits on it. */
    .ln-lb-in { padding-top:0; }
    .ln-lb-media { border-radius:0; flex:0 0 auto; }
    /* The sheet covers the screen, so the white has to run to the bottom even
       when the content is short. Otherwise the scrim shows below it. */
    .ln-lb-in { min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; }
    .ln-lb-under { border-radius:0; border-left:0; border-right:0; border-top:0;
      margin-top:0; flex:1 0 auto; }
    .ln-lb-close { position:fixed; top:10px; right:10px;
      background:rgba(0,0,0,.55); border-color:rgba(255,255,255,.35); }
  }
    color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .ln-rh { display:flex; align-items:baseline; gap:10px; margin:0 0 11px; }
  .ln-rh h2 { margin:0; font:700 1.12rem/1.2 var(--sans); letter-spacing:-.012em; }
  .ln-rh .ln-rs { color:var(--text-muted); font-size:.82rem; }
  .ln-rh .ln-all { margin-left:auto; background:none; border:none; padding:0; cursor:pointer; font:600 .82rem/1 var(--sans); color:var(--accent-dark); }
  .ln-rh .ln-all:hover { text-decoration:underline; }
  .ln-tip { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    padding:14px 16px; text-align:center; }
  .ln-tip span { font:700 .92rem/1.3 var(--serif); color:#f4f1ea; text-wrap:balance;
    display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .ln-rail { display:flex; gap:12px; overflow-x:auto; padding-bottom:9px; scroll-snap-type:x proximity;
    scrollbar-width:thin; scrollbar-color:var(--border) transparent; }
  .ln-rail::-webkit-scrollbar { height:7px; }
  .ln-rail::-webkit-scrollbar-thumb { background:var(--border); border-radius:var(--r-pill); }
  .ln-rail::-webkit-scrollbar-track { background:transparent; }

  /* ── card ── */
  .ln-c { flex:0 0 auto; width:15.5rem; scroll-snap-align:start; display:flex; flex-direction:column; gap:8px;
    text-decoration:none; color:inherit; }
  .ln-c .ln-th { position:relative; display:block; aspect-ratio:16/9; border-radius:var(--r-m); overflow:hidden;
    background:var(--surface-2); box-shadow:var(--shadow); transition:transform .22s, box-shadow .22s; }
  .ln-c:hover .ln-th { transform:translateY(-3px); box-shadow:var(--shadow-lift); }
  .ln-c:focus-visible .ln-th { outline:2px solid var(--accent-dark); outline-offset:3px; }
  .ln-c img { width:100%; height:100%; object-fit:cover; display:block; }
  /* No thumbnail: a quiet tinted plate with the type mark, never the title —
     the title always sits below the tile so every card in a row aligns. */
  /* Any plate, anywhere: an icon has no intrinsic size, so state it once here
     rather than per context, which is how it kept coming back oversized. */
  .ln-flat { position:absolute; inset:0; display:grid; place-items:center;
    background:linear-gradient(145deg, var(--tc), color-mix(in srgb, var(--tc) 55%, #000)); }
  .ln-flat svg { width:38px; height:38px; color:rgba(255,255,255,.92); }
  .ln-pl { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:2.6rem; height:2.6rem;
    border-radius:50%; background:rgba(18,16,14,.62); display:grid; place-items:center; }
  .ln-pl::after { content:""; border-left:.85rem solid #fff; border-top:.52rem solid transparent;
    border-bottom:.52rem solid transparent; margin-left:.2rem; }
  .ln-du { position:absolute; right:6px; bottom:6px; background:rgba(18,16,14,.82); color:#fff;
    font:600 .72rem/1 ui-monospace,monospace; padding:3px 5px; border-radius:6px; }
  /* Marks what a member would lose by leaving, rather than marking what they
     could get for nothing elsewhere. Only on videos, where it is not obvious. */
  .ln-only { position:absolute; left:6px; top:6px; background:var(--accent); color:#12100e;
    font:700 .6rem/1 var(--sans); letter-spacing:.07em; text-transform:uppercase;
    padding:4px 7px; border-radius:var(--r-pill); }
  @media (max-width:640px) { .ln-only { font-size:.7rem; padding:5px 9px; left:8px; top:8px; } }
  .ln-dn { position:absolute; right:6px; top:6px; background:#eef6ee; color:#2f6b45;
    font:700 .72rem/1 var(--sans); letter-spacing:.04em; text-transform:uppercase; padding:4px 7px; border-radius:var(--r-pill); }
  .ln-ck { font:700 .72rem/1 var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--text-muted); }
  .ln-ct { font:500 .88rem/1.35 var(--sans); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .ln-cm { font-size:.78rem; color:var(--text-muted); }
  .ln-vrail .ln-c { flex:0 0 auto; width:9.5rem; }
  .ln-vrail .ln-c .ln-th { aspect-ratio:9/16; }

  /* ── course card ── */
  /* The course card is lifted verbatim from courses.html, styles and all, so a
     course looks the same wherever a member meets it. */
  .course-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; align-items:stretch; }
  .course-grid .course-card { margin-bottom:0; }
  .course-card { display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border); border-radius:20px; overflow:hidden; cursor:pointer; box-shadow:var(--shadow); transition:box-shadow .22s, transform .22s, border-color .22s; }
  .course-card:hover { transform:translateY(-4px); box-shadow:var(--shadow-lift); border-color:color-mix(in srgb, var(--cc-accent) 45%, var(--border)); }
  .cc-hero { position:relative; aspect-ratio:16/9; overflow:hidden; }
  .cc-hero--icon { display:flex; align-items:center; justify-content:center;
    background:radial-gradient(130% 150% at 12% 8%, color-mix(in srgb, var(--cc-accent) 30%, transparent), transparent 62%),
               linear-gradient(140deg, color-mix(in srgb, var(--cc-accent) 20%, var(--surface)), color-mix(in srgb, var(--cc-accent) 7%, var(--surface))); }
  .cc-hero-ic { width:66px; height:66px; border-radius:19px; display:flex; align-items:center; justify-content:center; background:var(--surface); color:var(--cc-accent); box-shadow:0 10px 26px -12px color-mix(in srgb, var(--cc-accent) 85%, transparent); }
  .cc-hero-ic svg { width:34px; height:34px; }
  .cc-hero--video { background:#141019; }
  .cc-hero-img { width:100%; height:100%; object-fit:cover; display:block; }
  .cc-hero--video::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, transparent 50%, rgba(0,0,0,.4)); }
  .cc-hero-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:54px; height:54px; border-radius:50%; background:rgba(255,255,255,.94); color:#141019; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px -8px rgba(0,0,0,.55); transition:transform .2s; z-index:1; }
  .cc-hero-play svg { width:22px; height:22px; margin-left:3px; }
  .course-card:hover .cc-hero-play { transform:translate(-50%,-50%) scale(1.07); }
  .cc-hero-tag { position:absolute; left:12px; top:12px; z-index:1; font-size:.6rem; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:rgba(0,0,0,.48); padding:5px 10px; border-radius:99px; }
  .cc-body { display:flex; flex-direction:column; flex:1; padding:17px 19px 17px; }
  .cc-level { align-self:flex-start; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:.65rem; font-weight:800; letter-spacing:.02em; color:var(--cc-accent); background:color-mix(in srgb, var(--cc-accent) 13%, transparent); border:1px solid color-mix(in srgb, var(--cc-accent) 30%, transparent); padding:4px 9px; border-radius:99px; margin-bottom:10px; }
  .cc-title { font-size:1.22rem; font-weight:800; letter-spacing:-.02em; }
  .cc-blurb { color:var(--text-muted); font-size:.89rem; line-height:1.5; margin-top:6px; }
  .cc-spacer { flex:1; min-height:14px; }
  .cc-track { height:7px; background:var(--surface-2); border-radius:99px; overflow:hidden; box-shadow:inset 0 1px 1px rgba(60,40,20,.06); margin-bottom:12px; }
  .cc-track-fill { height:100%; border-radius:99px; background:linear-gradient(90deg, color-mix(in srgb, var(--cc-accent) 65%, #fff), var(--cc-accent)); transition:width .5s cubic-bezier(.4,0,.2,1); }
  .cc-foot { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .cc-count { font-size:.78rem; color:var(--text-muted); font-weight:600; }
  .cc-cta { display:inline-flex; align-items:center; gap:5px; font-size:.83rem; font-weight:800; color:var(--cc-accent); }
  .cc-cta svg { width:16px; height:16px; }
  .cc-badge { font-size:.66rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; color:#8a6530; background:rgba(200,160,80,.12); border:1px solid rgba(200,160,80,.25); padding:6px 11px; border-radius:99px; white-space:nowrap; }
  .soon-badge { flex:0 0 auto; font-size:.64rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--text-muted); background:var(--surface-2); border:1px solid var(--border); padding:6px 11px; border-radius:99px; }
  .course-card.soon { cursor:default; background:linear-gradient(180deg,var(--surface),var(--surface-2)); border-style:dashed; }
  .course-card.soon::before { display:none; }
  .course-card.soon .course-ic { background:var(--surface-2); color:var(--text-muted); }
  .course-card.soon .nm { color:var(--text-muted); }
  .course-card.soon:hover { transform:none; box-shadow:var(--shadow); border-color:var(--border); }
  .course-card.soon .cc-hero { opacity:.5; filter:saturate(.5); }
  .course-card.soon .cc-title, .course-card.soon .cc-blurb, .course-card.soon .cc-level { color:var(--text-muted); }
  .cc-soonfoot { font-size:.82rem; color:var(--text-muted); font-weight:600; margin-top:18px; display:flex; align-items:center; gap:8px; }
  .cc-soonfoot .dot { width:7px; height:7px; border-radius:50%; background:var(--text-muted); opacity:.5; }
  /* Only two changes to the lifted component: a fixed width so it sits in a
     rail, and link decoration off, since here the card is an <a> rather than a
     div with an onclick as it is on the courses page. */
  .ln-crail .cc-hero { position:relative; }
  /* The lifted card puts its "Video course" tag at top left with a z-index, so
     the exclusive badge goes to the opposite corner or it is simply covered. */
  .ln-crail .ln-only { left:auto; right:11px; top:11px; z-index:2; }
  .ln-crail .course-card { flex:0 0 auto; width:20rem; scroll-snap-align:start;
    text-decoration:none; color:inherit;
    /* courses.html runs a cooler --surface-2 than this page, and the coming-soon
       card gradients from --surface to it, so carry that value with the part. */
    --surface-2:#f1f1f4; }
  @media (max-width:640px) { .ln-crail .course-card { width:76vw; } }

<script>

const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNER_EMAIL   = "matthew@matthewcawood.com";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {

let myEmail = "", myName = "";

const SVGI = inner => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + "</svg>";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const $ = id => document.getElementById(id);

const TYPES = {
  video:   { label:"Video",   colour:"var(--t-video)"   },
  clinic:  { label:"Clinic",  colour:"var(--t-clinic)"  },
  sheet:   { label:"PPD",     colour:"var(--t-sheet)"   },

};
/* One mark per content type, used when a thing has no thumbnail of its own. */
const MARK = {

  clinic:  SVGI('<circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49"/>'),
  sheet:   SVGI('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>'),
  article: SVGI('<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>'),
  course:  SVGI('<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.2 2.7 2.5 6 2.5s6-1.3 6-2.5v-5"/>'),
};

/* Course presentation, identical to the array in courses.html. Static, so it
   lives at module scope rather than being rebuilt inside the loader. */
const CMETA = [
  { key: "first-steps", label: "The Absolute Beginner Course", blurb: "Never played before? Start here and play your first pieces.", color: "#8b5cf6", audience: "Absolute beginners",
    icon: SVGI('<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>') },
  { key: "learn-your-first-piece", label: "Learn Your First Piece", blurb: "Ready for a real piece? Learn your first one, bar by bar.", color: "#2563eb", audience: "Beginners",
    format: "video", thumbId: "Uav7E8LAdqGDVIgS00iOsm91FYJ9vb4pNawk6KMwfchc", thumbTime: 21,
    icon: SVGI('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>') },
  { key: "theory", label: "Music Theory", blurb: "How music works, from note names to harmony.", color: "#10b981", audience: "Absolute beginner to intermediate",
    icon: SVGI('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>') },
  { key: "ear", label: "Ear Training", blurb: "Train your ear to recognise notes, intervals and chords.", color: "#ec4899", audience: "All levels",
    icon: SVGI('<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>') },
  { key: "improv", label: "Improvisation", blurb: "Start making up your own music at the keyboard.", color: "#f97316", audience: "Beginner and up",
    icon: SVGI('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>') },
  // Announced before they exist, so the course list never reads as a finished set.
  // `soon` is the line shown where the lesson count and CTA normally sit.
  { key: "upper-intermediate-walkthrough", label: "Upper Intermediate Walkthrough", soon: "Coming in September",
    blurb: "A full upper intermediate piece, bar by bar, including how to make decisions and learn effectively.",
    color: "#14b8a6", audience: "Upper intermediate",
    icon: SVGI('<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="4" x2="8" y2="14"/><line x1="12" y1="4" x2="12" y2="14"/><line x1="16" y1="4" x2="16" y2="14"/>') },
  { key: "sight-reading-beginners", label: "Sight Reading for Beginners", soon: "Coming in September",
    blurb: "Play music you have never seen before, with the exact formula for improvement.",
    color: "#0ea5e9", audience: "Beginners",
    icon: SVGI('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>') },
];
const CMETA_BY_KEY = Object.fromEntries(CMETA.map(c => [c.key, c]));

let ITEMS = [], COURSES = [], CONTINUE = [], TOPICS = [], VOCAB = [], MYSYMS = {};
let PICKS = [], PICK_WHY = "";
let FEED = {};                      // post id -> raw row, for the lightbox
let topic = "", type = "", term = "", showAll = false, symptom = "";

function fmtDate(d) {
  if (!d) return "";
  const t = new Date(d), days = Math.round((Date.now() - t) / 86400000);
  if (days < 1) return "today";
  if (days < 2) return "yesterday";
  if (days < 14) return days + " days ago";
  return t.toLocaleDateString(undefined, { month:"short", year:"numeric" });
}
function mins(sec) { return sec ? (sec < 60 ? sec + "s" : Math.round(sec / 60) + " min") : ""; }
async function load() {
  const [cs, ls, prog, sheets, read, evs, feed, mmt, ups, polls, vocab, tags, cmeta, mine, picks] = await Promise.all([
    db.from("courses").select("key,title,status,sort").order("sort"),
    db.from("lessons").select("id,course,title,level,est_minutes,status").eq("status","published"),
    db.from("lesson_progress").select("lesson_id,completed").eq("email", myEmail),
    db.from("theory_sheets").select("id,title,slug,category,created_at").order("created_at",{ascending:false}),
    db.from("reading_list").select("sheet_id,status").eq("email", myEmail),
    db.from("live_events").select("id,title,scheduled_at,duration_mins,mux_playback_id,status").order("scheduled_at",{ascending:false}),
    db.from("content_feed_posts").select("id,type,title,url,youtube_id,media,published_at,duration_seconds,orientation").order("published_at",{ascending:false}),
    db.from("mmt_articles").select("id,slug,title,cover_image,published_at,created_at").order("created_at",{ascending:false}),
    db.from("user_pieces").select("id,title,composer,last_practiced_at").eq("email", myEmail).order("last_practiced_at",{ascending:false,nullsFirst:false}).limit(1),
    db.from("content_feed_post_polls").select("post_id"),
    db.from("symptom_vocab").select("id,family,label,sort_order").order("sort_order"),
    db.from("content_symptoms").select("content_type,content_ref,symptom_id"),
    db.from("content_meta").select("content_type,content_ref,kind"),
    db.from("my_practice_symptoms").select("symptom_id,session_date").eq("email", myEmail),
    db.rpc("picks_for", { em: myEmail, n: 14 }),
  ]);

  const lessons = ls.data || [], done = new Set((prog.data || []).filter(p => p.completed).map(p => p.lesson_id));
  const readSet = new Set((read.data || []).filter(r => r.status === "read").map(r => r.sheet_id));

  /* courses, with the two announced ones carried from courses.html */
  const META = CMETA_BY_KEY;

  COURSES = (cs.data || []).filter(c => META[c.key]).map(c => {
    const mine = lessons.filter(l => l.course === c.key);
    const d = mine.filter(l => done.has(l.id)).length;
    return Object.assign({}, META[c.key], { n:mine.length, done:d,
      pct: mine.length ? Math.round(d / mine.length * 100) : 0 });
  }).filter(c => c.n > 0);
  COURSES.push(
    { key:null, label:"Upper Intermediate Walkthrough", audience:"Upper intermediate", color:"#14b8a6",
      soon:"Coming in September", icon:SVGI('<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="4" x2="8" y2="14"/><line x1="12" y1="4" x2="12" y2="14"/><line x1="16" y1="4" x2="16" y2="14"/>'),
      blurb:"A full upper intermediate piece, bar by bar, including how to make decisions and learn effectively." },
    { key:null, label:"Sight Reading for Beginners", audience:"Beginners", color:"#0ea5e9",
      soon:"Coming in September", icon:SVGI('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'),
      blurb:"Play music you have never seen before, with the exact formula for improvement." });

  /* every browsable item, normalised to one shape */
  ITEMS = [];
  (sheets.data || []).forEach(s => ITEMS.push({
    type:"sheet", ctype:"theory_sheet", ref:s.id, title:s.title, topic:s.category, date:s.created_at, done:readSet.has(s.id), only:true,
    href:"/theory/sheets/view.html?slug=" + encodeURIComponent(s.slug),
    meta:fmtDate(s.created_at) }));
  (evs.data || []).filter(e => e.mux_playback_id).forEach(e => ITEMS.push({
    type:"clinic", ctype:"clinic", ref:e.id, title:(e.title || "").replace(/^Live Practice Clinic:?\s*/i, ""), date:e.scheduled_at,
    img:"https://image.mux.com/" + e.mux_playback_id + "/thumbnail.webp?width=480&height=270&fit_mode=smartcrop&time=25",
    mux:e.mux_playback_id, only:true,
    playable:true, dur:e.duration_mins ? e.duration_mins + " min" : "",
    href:"/events.html?event=" + encodeURIComponent(e.id), meta:fmtDate(e.scheduled_at) }));
  // The content feed carries three kinds of thing and only two of them are
  // learning material. `blog` posts announce a Monday Music Tips article, which
  // is already here from mmt_articles, so they would show everything twice.
  // Clinic topic polls are a question to the room, not something to learn from,
  // and clinic announcements duplicate the clinic itself from live_events.
  // A poll is identified by having a poll row, not by its title, because a post
  // is a poll, a video or a written post and the title cannot be trusted to say
  // which. The title check is only a backstop for one older poll whose rows are
  // gone. Clinic announcements are dropped because live_events already has them.
  const pollIds = new Set((polls.data || []).map(p => p.post_id));
  const FEED_SKIP = /topic poll|^live practice clinic|^live q&a/i;
  const muxId = p => {
    const m = (p.media || []).find(x => x && x.type === "mux");
    return m ? (m.playbackId || m.playback_id || "") : "";
  };
  (feed.data || []).forEach(p => { FEED[p.id] = p; });
  (feed.data || []).forEach(p => {
    if (p.type === "blog") return;                       // duplicates mmt_articles
    if (pollIds.has(p.id) || FEED_SKIP.test(p.title || "")) return;
    const mux = muxId(p);
    if (p.youtube_id) {
      const vert = p.orientation === "portrait";
      ITEMS.push({ type:"video", ctype:"video", ref:p.youtube_id, title:p.title, date:p.published_at, playable:true, vertical:vert,
        img:"https://i.ytimg.com/vi/" + p.youtube_id + (vert ? "/oardefault.jpg" : "/mqdefault.jpg"),
        href:"/content-feed.html?post=" + encodeURIComponent(p.id),
        dur:p.duration_seconds ? mins(p.duration_seconds) : "",
        meta:fmtDate(p.published_at) });
    } else if (mux) {                                    // Matthew's own uploads
      ITEMS.push({ type:"video", title:p.title, date:p.published_at, playable:true, only:true,
        img:"https://image.mux.com/" + mux + "/thumbnail.webp?width=480&height=270&fit_mode=smartcrop&time=8",
        href:"/content-feed.html?post=" + encodeURIComponent(p.id),
        dur:p.duration_seconds ? mins(p.duration_seconds) : "",
        meta:fmtDate(p.published_at) });
    } else {
      ITEMS.push({ type:"video", title:p.title, date:p.published_at,
        href:"/content-feed.html?post=" + encodeURIComponent(p.id),
        meta:fmtDate(p.published_at) });
    }
  });
  (mmt.data || []).forEach(a => ITEMS.push({
    type:"article", ctype:"mmt", ref:String(a.id), title:a.title, date:a.published_at || a.created_at,
    bg:mmtBg(a.slug || ""),
    href:"https://matthewcawood.com/monday-music-tips/" + encodeURIComponent(a.slug), external:true,
    meta:fmtDate(a.published_at || a.created_at) }));
  lessons.forEach(l => { if (META[l.course]) ITEMS.push({
    type:"course", ctype:"lesson", ref:l.id, title:l.title, topic:META[l.course].label, done:done.has(l.id),
    href:"/courses.html?lesson=" + encodeURIComponent(l.id),
    meta:META[l.course].label + (l.est_minutes ? " · " + l.est_minutes + " min" : "") }); });

  /* A title can legitimately exist in two tables; show it once. */
  const seenTitle = new Set();
  ITEMS = ITEMS.filter(i => {
    const k = (i.type === "course" ? "lesson:" : "") + (i.title || "").trim().toLowerCase();
    if (!k || seenTitle.has(k)) return false;
    seenTitle.add(k); return true;
  });

  /* Symptoms: one vocabulary, used at both ends. Content says which problem it
     solves; a member's practice notes say which problem they have. The join is
     (content_type, content_ref), which every source resolves to exactly. */
  VOCAB = (vocab.data || []).filter(v => v.id !== "__none__");
  const kindOf = {};
  (cmeta.data || []).forEach(m => kindOf[m.content_type + ":" + m.content_ref] = m.kind);
  const symOf = {};
  (tags.data || []).forEach(t => (symOf[t.content_type + ":" + t.content_ref] ||= []).push(t.symptom_id));
  ITEMS.forEach(i => {
    const k = i.ctype + ":" + i.ref;
    i.kind = kindOf[k] || "";
    i.syms = symOf[k] || [];
  });

  /* The member's own recent signals decide which families lead. Only their own
     practice notes feed this, never anything they wrote to other people. */
  const recent = Date.now() - 120 * 86400000;
  MYSYMS = {};
  (mine.data || []).forEach(r => {
    if (r.session_date && new Date(r.session_date).getTime() < recent) return;
    MYSYMS[r.symptom_id] = (MYSYMS[r.symptom_id] || 0) + 1;
  });

  /* One row of things that might actually help, chosen from what this member has
     written about, then what their practice shows, then what they read. */
  PICKS = [];
  PICK_WHY = "";
  const pk = (picks && picks.data) || [];
  if (pk.length) {
    const byHref = {};
    ITEMS.forEach(i => { byHref[i.href] = i; });
    PICKS = pk.map(r => byHref[r.href] || {
      type: r.content_type === "mmt" ? "article" : r.content_type === "theory_sheet" ? "sheet"
          : r.content_type === "lesson" ? "course" : r.content_type,
      title: r.title, href: r.href, meta: "" }).filter(Boolean);
    const topic = pk[0].topic, src = pk[0].source;
    PICK_WHY = src === "said"      ? "you\u2019ve mentioned " + topic + " a few times"
             : src === "behaviour" ? "based on what you\u2019ve been practicing"
             :                       "you\u2019ve been reading about " + topic;
  }

  /* topics come from the only vocabulary that is actually populated today */
  const counts = {};
  ITEMS.forEach(i => { if (i.topic) counts[i.topic] = (counts[i.topic] || 0) + 1; });
  TOPICS = Object.keys(counts).map(n => ({ name:n, count:counts[n] })).sort((a,b) => b.count - a.count);

  /* continue row */
  CONTINUE = [];
  const started = COURSES.filter(c => c.key && c.done > 0 && c.done < c.n).sort((a,b) => b.pct - a.pct)[0];
  if (started) CONTINUE.push({ k:"Course", mark:"course", tc:"var(--t-course)", t:started.label,
    m:started.done + " of " + started.n + " lessons", pct:started.pct, href:"/courses.html?course=" + started.key });
  const piece = (ups.data || [])[0];
  if (piece) CONTINUE.push({ k:"Piece", mark:"sheet", tc:"var(--t-sheet)", t:piece.title + (piece.composer ? " — " + piece.composer : ""),
    m:piece.last_practiced_at ? "Last practised " + fmtDate(piece.last_practiced_at) : "Not practised yet",
    href:"/resources.html?section=library" });
  const nextUp = (evs.data || []).filter(e => e.scheduled_at && new Date(e.scheduled_at) > new Date()).slice(-1)[0];
  if (nextUp) CONTINUE.push({ k:"Next clinic", tc:"var(--t-clinic)", t:(nextUp.title || "").replace(/^Live Practice Clinic:?\s*/i, ""),
    m:new Date(nextUp.scheduled_at).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}),
    href:"/events.html?event=" + nextUp.id });
}


/* ── card ───────────────────────────────────────────────────────────────────── */
/* Monday Music Tips have no cover art; the website's catalogue draws a
   gradient from the slug with the title on it. Same palette, same hash, so a
   given article looks the same in both places. */
const MMT_BG = [
  ["#4a3f31","#2a241d","#161310"], ["#3a4250","#232a33","#11151b"],
  ["#463046","#2b1f2e","#160f17"], ["#314a40","#1d2a26","#0e1613"],
  ["#4d2f31","#2e1d1f","#170d0e"], ["#373451","#222033","#11101c"],
  ["#44402f","#29271c","#14130d"], ["#2f4548","#1c2a2c","#0d1416"],
];
function mmtBg(slug) {
  let h = 0;
  for (let i = 0; i < slug.length; i++) h = (h * 31 + slug.charCodeAt(i)) >>> 0;
  const [a, b, c] = MMT_BG[h % MMT_BG.length];
  return "radial-gradient(130% 90% at 50% -10%, " + a + " 0%, " + b + " 45%, " + c + " 100%)";
}

function card(it) {
  const T = TYPES[it.type] || TYPES.video;
  const inner = it.img
    ? '<img src="' + esc(it.img) + '" alt="" loading="lazy">'
      + (it.playable ? '<span class="ln-pl"></span>' : "")
      + (it.dur ? '<span class="ln-du">' + esc(it.dur) + "</span>" : "")
    : it.bg
      ? '<span class="ln-tip" style="background:' + it.bg + '"><span>' + esc(it.title) + "</span></span>"
      : '<span class="ln-flat" style="--tc:' + T.colour + '">' + (MARK[it.type] || MARK.video) + "</span>";
  return '<a class="ln-c" href="' + esc(it.href) + '"' + (it.external ? ' target="_blank" rel="noopener"' : "")
    + '><span class="ln-th' + (it.vertical ? " ln-v" : "") + '">' + inner
    + (it.only ? '<span class="ln-only">Exclusive</span>' : "")
    + (it.done ? '<span class="ln-dn">' + (it.type === "sheet" ? "Read" : "Done") + "</span>" : "")
    + '</span><span class="ln-ck">' + esc(T.label) + "</span>"
    + '<span class="ln-ct">' + esc(it.title) + "</span>"
    + (it.meta ? '<span class="ln-cm">' + esc(it.meta) + "</span>" : "") + "</a>";
}

function courseCard(c) {
  const ls = c.n || 0, pct = c.pct || 0, started = (c.done || 0) > 0;
  const hero = (c.format === "video" && c.thumbId)
    ? '<div class="cc-hero cc-hero--video">'
        + '<img class="cc-hero-img" src="https://image.mux.com/' + c.thumbId
        + '/thumbnail.webp?width=880&height=495&fit_mode=smartcrop&time=' + (c.thumbTime || 0) + '" alt="" loading="lazy">'
        + '<span class="cc-hero-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>'
        + '<span class="cc-hero-tag">Video course</span>'
        + (c.soon ? "" : '<span class="ln-only">Exclusive</span>') + "</div>"
    : '<div class="cc-hero cc-hero--icon"><span class="cc-hero-ic">' + (c.icon || "") + "</span>"
        + (c.soon ? "" : '<span class="ln-only">Exclusive</span>') + "</div>";
  const body = '<div class="cc-body">'
    + (c.audience ? '<div class="cc-level">' + esc(c.audience) + "</div>" : "")
    + '<div class="cc-title">' + esc(c.label) + "</div>"
    + '<div class="cc-blurb">' + esc(c.blurb || "") + "</div>"
    + '<div class="cc-spacer"></div>'
    + (started ? '<div class="cc-track"><div class="cc-track-fill" style="width:' + pct + '%"></div></div>' : "")
    + '<div class="cc-foot">'
    + (c.soon
        ? '<span class="soon-badge">' + esc(c.soon) + "</span>"
        : '<span class="cc-count">' + ls + " lesson" + (ls === 1 ? "" : "s")
          + (started ? " · " + pct + "% done" : "") + "</span>"
          + '<span class="cc-cta">' + (started ? "Continue" : "Start") + "</span>")
    + "</div></div>";
  return c.soon
    ? '<div class="course-card soon" style="--cc-accent:' + c.color + '">' + hero + body + "</div>"
    : '<a class="course-card" href="/courses.html?course=' + esc(c.key) + '" style="--cc-accent:' + c.color + '">' + hero + body + "</a>";
}

function row(title, sub, items, opts) {
  if (!items.length) return "";
  const o = opts || {};
  return '<section class="ln-row"><div class="ln-rh"><h2>' + esc(title) + "</h2>"
    + (sub ? '<span class="ln-rs">' + esc(sub) + "</span>" : "")
    + (o.seeAll ? '<button class="ln-all" type="button" data-see="' + esc(o.seeAll) + '">See all</button>' : "")
    + '</div><div class="' + (items.length <= 4 && !o.vertical && !o.rail ? "ln-grid" : "ln-rail")
    + (o.vertical ? " ln-vrail" : "") + (o.course ? " ln-crail" : "") + '">'
    + items.map(o.course ? courseCard : card).join("") + "</div></section>";
}

/* ── filtering ──────────────────────────────────────────────────────────────── */
function filtered() {
  const t = term.trim().toLowerCase();
  return ITEMS.filter(i =>
    (!type    || i.type === type) &&
    (!topic   || i.topic === topic) &&
    (!symptom || (i.syms || []).includes(symptom)) &&
    (!t     || i.title.toLowerCase().includes(t) || (i.topic || "").toLowerCase().includes(t)));
}
const byDate = (a, b) => new Date(b.date || 0) - new Date(a.date || 0);

/* ── lightbox ───────────────────────────────────────────────────────────────
   Watching should not cost a page load. The post renders through the shared
   module, so it is the same thing content-feed shows, in a different frame. */
let LB_OPEN = null;

/* The faces beside the count, as the feed shows them. */
function likerChips(p) {
  const all = p._likers || [];
  if (!all.length) return "";
  const info = p._likerInfo || {};
  const chips = all.slice(0, 3).map(em => {
    const r = info[em] || {};
    const name = r.name || em.split("@")[0];
    const inner = r.avatar_url
      ? '<img src="' + esc(r.avatar_url) + '" alt="' + esc(name) + '">'
      : '<span style="background:var(--surface-2);color:var(--text-muted);width:100%;height:100%;display:flex;'
        + 'align-items:center;justify-content:center;font-size:.5rem;font-weight:800;border-radius:50%">'
        + esc(name[0].toUpperCase()) + "</span>";
    return '<div class="tc-like-chip">' + inner + "</div>";
  }).join("");
  return '<span class="tc-like-avatars" style="display:inline-flex;align-items:center;margin-left:4px">'
    + chips + (all.length > 3 ? '<span style="font-size:.72rem;color:var(--text-muted);margin-left:6px">+'
    + (all.length - 3) + "</span>" : "") + "</span>";
}

async function openPost(postId) {
  const p = FEED[postId];
  if (!p) { location.href = "/content-feed.html?post=" + encodeURIComponent(postId); return; }

  const media = $("ln-lb-media"), body = $("ln-lb-body"), cmts = $("ln-lb-cmts");

  /* Open FIRST. The media needs nothing from the server, so it can play straight
     away; only the reaction tally and the comments have to be fetched, and those
     show a loader rather than an empty box. */
  body.innerHTML = PostView.bodyHtml(p);
  media.innerHTML = "";
  const hoisted = body.querySelector(".cf-yt-thumb, .cf-yt-embed, .cf-post-media");
  if (hoisted) media.appendChild(hoisted);
  const embed = PostView.embedHtml(p);
  if (embed) media.innerHTML = embed;
  media.querySelectorAll("mux-player, video").forEach(v => { try { v.play(); } catch (err) {} });
  cmts.innerHTML = "";
  $("ln-lb-under").classList.add("loading");    // one spinner, nothing showing yet

  LB_OPEN = postId;
  $("ln-lb").classList.remove("closing");
  $("ln-lb").classList.add("open");
  document.body.style.overflow = "hidden";
  history.pushState({ lb: postId }, "", "?post=" + encodeURIComponent(postId));

  PostView.trackMedia(media, "video", p.youtube_id || postId);
  PostView.recordView("video", p.youtube_id || postId, 0, false);

  /* Now fill in what needed a round trip. */
  try {
    const [polls, cmtRows, likes] = await Promise.all([
      db.from("content_feed_post_polls").select("id,post_id,question").eq("post_id", postId),
      db.from("content_feed_comments").select("post_id").eq("post_id", postId),
      db.from("content_feed_likes").select("email").eq("post_id", postId),
    ]);
    if (LB_OPEN !== postId) return;                  // they closed it, or opened another
    p.commentCount = (cmtRows.data || []).length;

    const emails = [...new Set((likes.data || []).map(l => l.email))];
    p._likers = emails;
    if (emails.length) {
      const who = await db.from("allowed_emails").select("email,avatar_url,name").in("email", emails.slice(0, 40));
      p._likerInfo = Object.fromEntries((who.data || []).map(r => [r.email, r]));
    }

    const pr = (polls.data || [])[0];
    if (pr) {
      const [opts, votes, mine] = await Promise.all([
        db.from("content_feed_post_poll_options").select("id,poll_id,label,position").eq("poll_id", pr.id).order("position"),
        db.from("content_feed_post_poll_votes").select("poll_id,option_id,email").eq("poll_id", pr.id),
        db.from("content_feed_post_poll_votes").select("poll_id,option_id").eq("poll_id", pr.id).eq("email", myEmail),
      ]);
      const counts = {}; let total = 0;
      (votes.data || []).forEach(v => { counts[v.option_id] = (counts[v.option_id] || 0) + 1; total++; });
      p.poll = { id: pr.id, question: pr.question, options: opts.data || [],
                 voteCounts: counts, totalVotes: total,
                 myVote: (mine.data || [])[0] ? (mine.data || [])[0].option_id : null };
    }

    await Comments.loadReactions([postId]);
    if (LB_OPEN !== postId) return;

    // Build the whole panel while it is still hidden, including the comment list,
    // so it appears complete rather than assembling itself on screen.
    body.innerHTML = PostView.bodyHtml(p);
    body.querySelectorAll(".cf-yt-thumb, .cf-yt-embed, .cf-post-media").forEach(el => el.remove());
    const cc = p.commentCount || 0;
    body.insertAdjacentHTML("beforeend",
      '<div class="ln-lb-meta">' + Comments.reactBtnHtml(postId, "ln_lb_" + postId.replace(/-/g, "_"))
      + likerChips(p)
      + '<span class="ln-lb-count">' + (cc ? cc + " comment" + (cc === 1 ? "" : "s") : "No comments yet") + "</span>"
      + "</div>");

    cmts.innerHTML = '<div class="tc-comments-section">'
      + '<div id="tc-comments-hdr-' + postId + '" class="tc-comments-hdr">Comments</div>'
      + '<div id="tc-comments-list-' + postId + '"></div>' + Comments.formHtml(postId) + "</div>";
    await Comments.load(postId);                 // wait for the list, not just the shell
    if (LB_OPEN !== postId) return;
    $("ln-lb-under").classList.remove("loading");
  } catch (e) {
    console.error("lightbox load error:", e);
    if (LB_OPEN === postId) {
      cmts.innerHTML = '<div class="ln-lb-loading">Comments could not load.</div>';
      $("ln-lb-under").classList.remove("loading");
    }
  }
}

function closePost(fromPop) {
  if (!LB_OPEN) return;
  const lb = $("ln-lb");
  PostView.pauseVideosIn("#ln-lb", LB_OPEN);      // stop the audio immediately
  LB_OPEN = null;
  document.body.style.overflow = "";
  if (!fromPop) history.pushState({}, "", location.pathname);

  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const done = () => {
    lb.classList.remove("open", "closing");
    $("ln-lb-media").innerHTML = ""; $("ln-lb-body").innerHTML = ""; $("ln-lb-cmts").innerHTML = "";
    $("ln-lb-under").classList.add("loading");
  };
  if (reduced) return done();
  lb.classList.add("closing");
  setTimeout(done, 200);                          // matches ln-lb-down
}

/* ── render ─────────────────────────────────────────────────────────────────── */
function render() {
  const counts = {}; ITEMS.forEach(i => counts[i.type] = (counts[i.type] || 0) + 1);
  const browsing = !!(term || type || topic || symptom);
  const flat = ITEMS.filter(i => !i.vertical);
  const next = CONTINUE.find(c => c.k === "Next clinic");
  const resume = CONTINUE.filter(c => c.k !== "Next clinic");

  // What we want them to do next: the clinic if it is close, otherwise the
  // course they are part way through, otherwise the newest thing published.
  const soon = next && CONTINUE.find(c => c.k === "Next clinic");
  const carry = resume[0];
  const fresh = flat.filter(i => i.img).sort(byDate)[0];
  const lastClinic = flat.filter(i => i.type === "clinic" && i.img).sort(byDate)[0];
  let bb = null;
  if (soon)        bb = { kick:"Next live clinic", title:soon.t, when:soon.m, blurb:"A live session working through one topic. It becomes a replay here afterwards.", href:soon.href, img:(lastClinic || fresh || {}).img, go:"RSVP", mux:(lastClinic || {}).mux,
                       go2:lastClinic ? { label:"Watch the last one", href:lastClinic.href } : null };
  else if (carry)  bb = { kick:"Pick up where you left off", title:carry.t, when:carry.m, blurb:"You are part way through this one.", href:carry.href, img:(fresh||{}).img, go:"Continue",
                       go2:lastClinic ? { label:"Browse the replays", href:lastClinic.href } : null };
  else if (fresh)  bb = { kick:"Latest", title:fresh.title, when:fresh.meta, blurb:"The newest thing in the library.", href:fresh.href, img:fresh.img, go:"Watch now", mux:fresh.mux,
                       go2:lastClinic ? { label:"Browse the replays", href:lastClinic.href } : null };

  let html = bb
    ? '<div class="ln-bb" data-href="' + esc(bb.href) + '">'
      + (bb.img ? '<span class="ln-bb-img"><img src="' + esc(bb.img) + '" alt=""'
          + (bb.mux ? ' data-mux="' + esc(bb.mux) + '"' : "") + "></span>" : "")
      + '<span class="ln-bb-in"><span class="ln-bb-krow">'
      + '<span class="ln-bb-k">' + esc(bb.kick) + "</span>"
      + (bb.when ? '<span class="ln-bb-when">' + esc(bb.when) + "</span>" : "") + "</span>"
      + "<h2>" + esc(bb.title) + "</h2>"
      + (bb.blurb ? "<p>" + esc(bb.blurb) + "</p>" : "")
      + '<span class="ln-bb-acts">'
      + '<a class="ln-bb-go" href="' + esc(bb.href) + '">' + esc(bb.go) + "</a>"
      + (bb.go2 ? '<a class="ln-bb-go2" href="' + esc(bb.go2.href) + '">' + esc(bb.go2.label) + "</a>" : "")
      + "</span>"
      + '<span class="ln-bb-lib">'
      + "<span><b>" + (counts.video || 0) + "</b> videos</span>"
      + "<span><b>" + (counts.clinic || 0) + "</b> clinic replays</span>"
      + "<span><b>" + (counts.sheet || 0) + "</b> sheets</span>"
      + "<span><b>" + (counts.article || 0) + "</b> articles</span>"
      + "<span><b>" + COURSES.filter(c => c.key).length + "</b> courses</span>"
      + "</span></div>"
    : "";

  html +=
    '<div class="ln-lctl"><div id="ln-types" style="display:flex;gap:8px;flex-wrap:wrap">'
    + Object.keys(TYPES).map(k => '<button class="ln-lfil" type="button" data-type="' + k + '" aria-pressed="'
        + (type === k) + '" style="--fc:' + TYPES[k].colour + '">' + esc(TYPES[k].label)
        + '<span class="ln-fn">' + (counts[k] || 0) + "</span></button>").join("")
    + "</div></div>";

  if (browsing) {
    const list = filtered().sort(byDate);
    const shown = showAll ? list : list.slice(0, 36);
    html += '<div class="ln-lcount"><b>' + list.length + "</b> item" + (list.length === 1 ? "" : "s")
      + (topic ? " in " + esc(topic) : "")
      + (symptom ? " for \u201c" + esc((VOCAB.find(v => v.id === symptom) || {}).label || symptom) + "\u201d" : "")
      + (term ? ' matching "' + esc(term) + '"' : "")
      + ' · <button class="ln-all" id="ln-clear" type="button">clear</button></div>'
      + (shown.length ? '<div class="ln-grid">' + shown.map(card).join("") + "</div>"
          + (!showAll && list.length > shown.length
              ? '<div class="ln-morewrap"><button class="ln-more" id="ln-all" type="button">Show all ' + list.length + "</button></div>" : "")
        : '<div class="ln-empty">Nothing matches that yet.</div>');
  } else {
    const seen = new Set();
    const take = (pred, n) => flat.filter(i => pred(i) && !seen.has(i.href)).sort(byDate).slice(0, n)
      .map(i => { seen.add(i.href); return i; });

    const weekAgo = Date.now() - 8 * 86400000;
    const recent = flat.filter(i => i.date && new Date(i.date).getTime() > weekAgo);
    if (recent.length >= 4) html += row("New this week", "", take(i => recent.includes(i), 12), {});
    else html += row("Recently added", "", take(() => true, 12), {});
    if (PICKS.length >= 3) html += row("Might help right now", PICK_WHY, PICKS.slice(0, 14), { rail:true });
    html += row("Paths", "courses", COURSES, { course:true });
    html += row("Clinic replays", (counts.clinic || 0) + " sessions", take(i => i.type === "clinic", 12), { seeAll:"clinic" });
    html += row("Videos", (counts.video || 0) + " on the channel", take(i => i.type === "video", 14), { seeAll:"video" });
    // Topic rows are deliberately absent. A topic like pedalling should gather a
    // video, an article, a Monday Music Tip and a short, and only Piano Practice
    // Daily carries a category today, so a "topic" row here would in fact be a
    // Piano Practice Daily row wearing a topic's name. They return with tagging.
    html += row("Piano Practice Daily", (counts.sheet || 0) + " sheets", take(i => i.type === "sheet", 14), { seeAll:"sheet" });
    html += row("Monday Music Tips", (counts.article || 0) + " articles", take(i => i.type === "article", 14), { seeAll:"article" });
    const shorts = ITEMS.filter(i => i.vertical).sort(byDate).slice(0, 24);
    html += row("Shorts", "a minute or two each", shorts, { vertical:true });
  }

  $("ln-root").innerHTML = html;
  wire();
  billboardMotion();
}

/* Netflix-style: the billboard still becomes a short silent loop once it is
   ready. Mux serves animated webp straight from the playback id, so there is no
   player and no sound; if it fails the still simply stays. */
function billboardMotion() {
  const img = document.querySelector(".ln-bb-img img[data-mux]");
  if (!img) return;
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  // Runs on a phone too, but the phone gets to say no: Data Saver, or a
  // connection the browser reports as 2g, and it stays a still.
  const net = navigator.connection || {};
  if (net.saveData) return;
  if (/(^|-)2g$/.test(net.effectiveType || "")) return;
  const id = img.dataset.mux;
  const probe = new Image();
  probe.onload = () => { img.src = probe.src; };
  probe.src = "https://image.mux.com/" + id + "/animated.webp?width=640&start=20&end=25&fps=10";
}

function wire() {
  const bbEl = document.querySelector(".ln-bb[data-href]");
  if (bbEl) bbEl.onclick = e => { if (!e.target.closest("a")) location.href = bbEl.dataset.href; };
  // Anything that points at a feed post opens in place instead of navigating.
  document.querySelectorAll('a[href^="/content-feed.html?post="]').forEach(a => {
    a.addEventListener("click", e => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;   // let people open a new tab
      e.preventDefault();
      openPost(decodeURIComponent(a.getAttribute("href").split("post=")[1] || ""));
    });
  });
  const q = $("ln-q");
  if (q) q.oninput = e => { term = e.target.value; showAll = false; render(); const n = $("ln-q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  const ty = $("ln-types");
  if (ty) ty.querySelectorAll(".lfil").forEach(b => b.onclick = () => {
    type = (type === b.dataset.type) ? "" : b.dataset.type; topic = ""; showAll = false; render();
  });
  document.querySelectorAll("[data-see]").forEach(b => b.onclick = () => {
    const v = b.dataset.see;
    if (v.startsWith("topic:")) { topic = v.slice(6); type = ""; } else { type = v; topic = ""; }
    showAll = false; render(); window.scrollTo({ top:0, behavior:"smooth" });
  });
  const all = $("ln-all");   if (all) all.onclick = () => { showAll = true; render(); };
  const clr = $("ln-clear"); if (clr) clr.onclick = () => { topic = type = term = symptom = ""; showAll = false; render(); };
}

/* Close on the cross, on the scrim, on Escape, and on Back. */
(function wireLightbox() {
  const lb = document.getElementById("ln-lb");
  if (!lb) return;
  const close = document.getElementById("ln-lb-close");
  if (close) close.onclick = () => closePost();
  lb.addEventListener("click", e => { if (e.target === lb) closePost(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && LB_OPEN) closePost(); });
  window.addEventListener("popstate", e => {
    const want = e.state && e.state.lb;
    if (LB_OPEN && !want) closePost(true);
    else if (want && want !== LB_OPEN) openPost(want);
  });
})();

/* ── boot ───────────────────────────────────────────────────────────────────── */
(async function() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/"; return; }
  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];
  const myAvatarUrl = (ae && ae.avatar_url) || null;
  const iAmOwner = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();
  try {
    initSharedHeader({ db, myEmail, myName, isAdmin: iAmOwner,
      activePage:"learn", avatarUrl: myAvatarUrl });
  } catch (e) { console.error("initSharedHeader error:", e); }

  // The lightbox renders a real content-feed post, so it needs the same three
  // modules that page uses. Failing here must not stop the library loading.
  try {
    PostView.init({ db, getPost: id => FEED[id], isAdmin: iAmOwner });
    if (window.initMemberModal) initMemberModal({ db, myEmail });
    initCommentsSystem({
      db,
      auth: { email: myEmail, name: myName, avatarUrl: myAvatarUrl, isAdmin: iAmOwner },
      comments:  { table: "content_feed_comments", parentField: "post_id" },
      reactions: { table: "content_feed_likes",    parentField: "post_id" },
      commentReactionEventType: "content_comment",
      replyNotificationLinkFn: id => `/content-feed.html?post=${id}`,
      ownerEmail: OWNER_EMAIL,
      ownerNotifyTitleFn:   name => `${name} commented on your content`,
      ownerReactionTitleFn: (name, emoji) => `${name} reacted ${emoji} to your content`,
    });
  } catch (e) { console.error("post modules init error:", e); }

  const sp = new URLSearchParams(location.search);
  topic = sp.get("topic") || ""; type = sp.get("type") || ""; term = sp.get("q") || "";

  try { await load(); render(); }
  catch (e) {
    console.error("learn load error:", e);
    $("ln-root").innerHTML = '<div class="ln-empty">Something went wrong loading the library. Reload to try again.</div>';
  }
  $("loading-screen").style.display = "none";
  $("app-main").style.display = "block";
  $("app-header").style.display = "";
})();
