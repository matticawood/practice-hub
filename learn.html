<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Learn · The Practice Room</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="/style.css" />
<style>
  /* Warm "theory-mode" tokens — identical to resources.html and courses.html. */
  :root {
    --bg:#faf7f3; --surface:#ffffff; --surface-2:#f1f1f4; --border:#e0d5c8;
    --text:#1a1410; --text-muted:#8a7868; --accent:#F5C518; --accent-dark:#9a6f12;
    --accent-subtle:#fdf0d8;
    --shadow:0 1px 2px rgba(60,40,20,.05);
    --shadow-lift:0 8px 22px -10px rgba(60,40,20,.22);
    /* One colour per content type, used on chips, spines and type badges so a
       member learns the coding once and it holds everywhere on the page. */
    --t-video:#2563eb; --t-clinic:#7c3aed; --t-sheet:#0e9f6e;
    --t-article:#b45309; --t-course:#be123c; --t-piece:#0369a1; --t-drill:#db2777;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  #loading-screen { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:var(--bg); z-index:50; }
  .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  #toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:#1a1410; color:#fff; padding:10px 16px; border-radius:10px; font-size:.85rem; opacity:0; pointer-events:none; transition:.25s; z-index:60; box-shadow:0 10px 30px -10px rgba(0,0,0,.4); }
  #toast.visible { opacity:1; transform:translateX(-50%) translateY(0); }
  #app-main { max-width:1400px; margin:0 auto; padding:22px 20px 110px; }

  /* ── section furniture ── */
  .ln-sec { margin-top:38px; }
  .ln-sec:first-child { margin-top:0; }
  .ln-head { display:flex; align-items:baseline; gap:12px; margin-bottom:3px; flex-wrap:wrap; }
  .ln-head h2 { margin:0; font-size:1.16rem; font-weight:800; letter-spacing:-.01em; }
  .ln-mode { font:800 .62rem/1 var(--sans,-apple-system,system-ui,sans-serif); letter-spacing:.11em;
    text-transform:uppercase; color:var(--text-muted); background:var(--surface-2);
    border:1px solid var(--border); border-radius:99px; padding:4px 9px; }
  .ln-sub { margin:0 0 14px; color:var(--text-muted); font-size:.88rem; max-width:70ch; }
  .ln-more { margin-left:auto; font-size:.82rem; font-weight:700; color:var(--accent-dark);
    background:none; border:none; cursor:pointer; padding:0; }
  .ln-more:hover { text-decoration:underline; }

  /* ── card grids ── */
  .ln-tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(214px,1fr)); gap:13px; }
  .ln-tile { display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border);
    border-radius:15px; overflow:hidden; box-shadow:var(--shadow); text-decoration:none; color:inherit;
    transition:box-shadow .2s, transform .2s, border-color .2s; }
  .ln-tile:hover { box-shadow:var(--shadow-lift); transform:translateY(-3px); border-color:#d6c5a8; }
  .ln-thumb.ln-vert { aspect-ratio:9/16; }
  .ln-shorts { display:flex; gap:11px; overflow-x:auto; padding-bottom:6px; scroll-snap-type:x proximity; }
  .ln-shorts::-webkit-scrollbar { height:7px; }
  .ln-shorts::-webkit-scrollbar-thumb { background:var(--border); border-radius:99px; }
  .ln-shorts .ln-tile { flex:0 0 152px; scroll-snap-align:start; }
  .ln-thumb { position:relative; aspect-ratio:16/9; background:var(--surface-2); overflow:hidden; }
  .ln-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .ln-thumb.ln-flat { display:grid; place-items:center;
    background:linear-gradient(140deg, var(--cc), color-mix(in srgb, var(--cc) 58%, #000)); }
  .ln-thumb.ln-flat span { font:800 .68rem/1 system-ui,sans-serif; letter-spacing:.12em;
    text-transform:uppercase; color:rgba(255,255,255,.94); }
  .ln-play { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:42px; height:42px;
    border-radius:50%; background:rgba(20,20,20,.72); display:grid; place-items:center; }
  .ln-play::after { content:""; border-left:13px solid #fff; border-top:8px solid transparent;
    border-bottom:8px solid transparent; margin-left:3px; }
  .ln-dur { position:absolute; right:7px; bottom:7px; background:rgba(20,20,20,.82); color:#fff;
    font:700 .68rem/1 system-ui,sans-serif; padding:3px 6px; border-radius:5px; font-variant-numeric:tabular-nums; }
  .ln-done { position:absolute; left:7px; top:7px; background:#eef6ee; color:#3f7a52; border-radius:99px;
    font:800 .6rem/1 system-ui,sans-serif; letter-spacing:.05em; text-transform:uppercase; padding:4px 7px; }
  .ln-body { padding:10px 12px 12px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .ln-kind { font:800 .6rem/1 system-ui,sans-serif; letter-spacing:.09em; text-transform:uppercase; color:var(--tc); }
  .ln-title { font-weight:650; font-size:.9rem; line-height:1.33; flex:1; }
  .ln-meta { font-size:.75rem; color:var(--text-muted); }

  /* ── continue ── */
  .ln-cont { display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr)); gap:12px; }
  .ln-cc { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px 15px;
    box-shadow:var(--shadow); display:flex; flex-direction:column; gap:7px; text-decoration:none; color:inherit; }
  .ln-cc:hover { box-shadow:var(--shadow-lift); border-color:#d6c5a8; }
  .ln-cc .k { font:800 .62rem/1 system-ui,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--tc); }
  .ln-cc .t { font-weight:700; font-size:.97rem; line-height:1.3; }
  .ln-bar { height:5px; background:var(--surface-2); border-radius:99px; overflow:hidden; }
  .ln-bar i { display:block; height:100%; background:var(--accent-dark); border-radius:99px; }
  .ln-cc .m { font-size:.78rem; color:var(--text-muted); }

  /* ── courses ── */
  .ln-courses { display:grid; grid-template-columns:repeat(auto-fill,minmax(214px,1fr)); gap:13px; }
  .ln-course { display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--border);
    border-radius:16px; overflow:hidden; box-shadow:var(--shadow); text-decoration:none; color:inherit;
    transition:box-shadow .2s, transform .2s, border-color .2s; }
  .ln-course:hover { box-shadow:var(--shadow-lift); transform:translateY(-3px); border-color:#d6c5a8; }
  
  .ln-course .cb { padding:11px 13px 13px; display:flex; flex-direction:column; gap:5px; flex:1; }
  .ln-course .lv { font:800 .6rem/1 system-ui,sans-serif; letter-spacing:.08em; text-transform:uppercase; color:var(--text-muted); }
  .ln-course .nm { font-weight:700; font-size:.95rem; line-height:1.28; }
  .ln-course .bl { font-size:.79rem; color:var(--text-muted); line-height:1.45; flex:1; }
  .ln-course .ft { display:flex; justify-content:space-between; align-items:center; gap:8px;
    font-size:.77rem; color:var(--text-muted); padding-top:9px; border-top:1px solid var(--border); }
  .ln-course .ft b { color:var(--accent-dark); }
  .ln-course.soon { border-style:dashed; background:linear-gradient(180deg,var(--surface),var(--surface-2)); cursor:default; }
  .ln-course.soon:hover { transform:none; box-shadow:var(--shadow); border-color:var(--border); }
  .ln-course.soon .hero { opacity:.42; filter:saturate(.45); }
  .ln-course.soon .nm, .ln-course.soon .bl, .ln-course.soon .lv { color:var(--text-muted); }
  .ln-badge { font:800 .61rem/1 system-ui,sans-serif; letter-spacing:.06em; text-transform:uppercase;
    color:var(--text-muted); background:var(--surface); border:1px solid var(--border);
    border-radius:99px; padding:4px 9px; }

  /* ── topics ── */
  .ln-topics { display:grid; grid-template-columns:repeat(auto-fill,minmax(178px,1fr)); gap:10px; }
  .ln-topic { text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:13px;
    padding:12px 13px; cursor:pointer; font-family:inherit; color:inherit; display:flex; flex-direction:column;
    gap:4px; box-shadow:var(--shadow); transition:box-shadow .2s, border-color .2s, transform .2s; }
  .ln-topic:hover { box-shadow:var(--shadow-lift); border-color:#d6c5a8; transform:translateY(-2px); }
  .ln-topic[aria-pressed="true"] { background:var(--accent-subtle); border-color:var(--accent-dark);
    box-shadow:inset 0 0 0 1px var(--accent-dark); }
  .ln-topic .tn { font-weight:700; font-size:.9rem; line-height:1.25; }
  .ln-topic .tc { font-size:.75rem; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .ln-topic:focus-visible { outline:2px solid var(--accent-dark); outline-offset:2px; }

  /* ── browse ── */
  .ln-controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:13px; }
  .ln-search { flex:1; min-width:220px; display:flex; align-items:center; gap:9px; background:var(--surface);
    border:1px solid var(--border); border-radius:11px; padding:10px 13px; box-shadow:var(--shadow); }
  .ln-search input { flex:1; border:none; outline:none; background:none; font:inherit; font-size:.92rem; color:var(--text); }
  .ln-filters { display:flex; gap:6px; flex-wrap:wrap; }
  .ln-fil { background:var(--surface); border:1px solid var(--border); border-radius:99px; padding:7px 13px;
    font:600 .82rem/1 inherit; color:var(--text-muted); cursor:pointer; font-family:inherit; display:flex;
    align-items:center; gap:7px; }
  .ln-fil:hover { border-color:#d6c5a8; color:var(--text); }
  .ln-fil[aria-pressed="true"] { color:#fff; background:var(--fc,var(--accent-dark)); border-color:var(--fc,var(--accent-dark)); }
  .ln-fil .fn { font-size:.72rem; opacity:.75; font-variant-numeric:tabular-nums; }
  .ln-fil:focus-visible { outline:2px solid var(--accent-dark); outline-offset:2px; }
  .ln-count { font-size:.82rem; color:var(--text-muted); margin-bottom:11px; }
  .ln-count b { color:var(--text); font-variant-numeric:tabular-nums; }
  .ln-empty { background:var(--surface); border:1px dashed var(--border); border-radius:14px;
    padding:26px; color:var(--text-muted); font-size:.9rem; text-align:center; }

  /* ── drills: the dashboard's own .dtool component ── */
  .ln-dtools { display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:10px; }
  .ln-dtool { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
    border-radius:13px; padding:12px 13px; text-decoration:none; color:inherit; box-shadow:var(--shadow);
    transition:box-shadow .2s, border-color .2s, transform .2s; }
  .ln-dtool:hover { box-shadow:var(--shadow-lift); border-color:color-mix(in srgb,var(--ccol) 45%,var(--border));
    transform:translateY(-2px); }
  .ln-dtool-ic { width:34px; height:34px; border-radius:10px; flex-shrink:0; display:grid; place-items:center;
    background:color-mix(in srgb,var(--ccol) 14%,#fff); color:var(--ccol); }
  .ln-dtool-ic svg { width:18px; height:18px; }
  .ln-dtool-nm { font-weight:700; font-size:.86rem; line-height:1.25; }

  /* ── look up ── */
  .ln-look { display:grid; grid-template-columns:repeat(auto-fit,minmax(268px,1fr)); gap:12px; }
  .ln-look a { display:flex; align-items:center; gap:13px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:15px 16px; text-decoration:none; color:inherit; box-shadow:var(--shadow);
    transition:box-shadow .2s, border-color .2s; }
  .ln-look a:hover { box-shadow:var(--shadow-lift); border-color:#d6c5a8; }
  .ln-look .ic { width:38px; height:38px; border-radius:11px; flex-shrink:0; display:grid; place-items:center;
    background:color-mix(in srgb,var(--ccol) 14%,#fff); color:var(--ccol); }
  .ln-look .ic svg { width:20px; height:20px; }
  .ln-look .nm { font-weight:700; font-size:.94rem; }
  .ln-look .sb { font-size:.79rem; color:var(--text-muted); margin-top:2px; }

  /* ── top strip ── */
  .ln-top { display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:26px;
    padding-bottom:18px; border-bottom:1px solid var(--border); }
  .ln-top-l { flex:1; min-width:260px; }
  .ln-top h1 { margin:0 0 5px; font-size:clamp(1.7rem,4vw,2.3rem); font-weight:800; letter-spacing:-.025em; }
  .ln-count-line { margin:0; color:var(--text-muted); font-size:.9rem; }
  .ln-next { flex:0 0 auto; display:flex; flex-direction:column; gap:3px; text-decoration:none; color:inherit;
    background:linear-gradient(135deg, var(--accent-subtle), var(--surface)); border:1px solid var(--accent);
    border-radius:14px; padding:13px 17px; box-shadow:var(--shadow); min-width:250px; }
  .ln-next:hover { box-shadow:var(--shadow-lift); }
  .ln-next-k { font:800 .62rem/1 system-ui,sans-serif; letter-spacing:.11em; text-transform:uppercase; color:var(--accent-dark); }
  .ln-next-t { font-weight:750; font-size:1rem; line-height:1.25; }
  .ln-next-d { font-size:.82rem; color:var(--text-muted); }

  /* ── course hero, matching courses.html ── */
  .ln-course .ln-hero { display:block; position:relative; aspect-ratio:16/9; overflow:hidden;
    background:linear-gradient(135deg,var(--cc),color-mix(in srgb,var(--cc) 58%,#000)); }
  .ln-course .ln-hero-img img { width:100%; height:100%; object-fit:cover; display:block; }
  .ln-course .ln-hero-ic { position:absolute; inset:0; display:grid; place-items:center; color:rgba(255,255,255,.94); }
  .ln-course .ln-hero-ic svg { width:34px; height:34px; }
  .ln-course .cb { display:flex; flex-direction:column; gap:5px; padding:11px 13px 13px; flex:1; }
  .ln-morewrap { text-align:center; margin-top:18px; }
  .ln-morewrap .ln-more { margin:0; }

  .ln-skel { background:var(--surface-2); border-radius:14px; height:150px; animation:lnPulse 1.3s ease-in-out infinite; }
  @keyframes lnPulse { 0%,100%{opacity:.55} 50%{opacity:.9} }
  @media (prefers-reduced-motion:reduce) { *{transition:none!important;animation:none!important} }
  @media (max-width:640px) { #app-main { padding:16px 14px 60px; } .ln-sec { margin-top:30px; } }
</style>
</head>

<script>
const SUPABASE_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const OWNER_EMAIL   = "matthew@matthewcawood.com";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
  auth: { autoRefreshToken:true, persistSession:true, detectSessionInUrl:false }
});
let myEmail = "", myName = "";

const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
const $  = id => document.getElementById(id);

/* Every item on this page is one of these types. Learn owns no reader: each type
   knows only its colour, its label and the existing page that opens it. */
const TYPES = {
  video:   { label:"Video",   colour:"var(--t-video)"   },
  clinic:  { label:"Clinic",  colour:"var(--t-clinic)"  },
  sheet:   { label:"PPD",     colour:"var(--t-sheet)"   },
  article: { label:"Article", colour:"var(--t-article)" },
  course:  { label:"Course",  colour:"var(--t-course)"  },
};

const SVGI = inner => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';
const DRILLS = [
  { key:"note",     name:"Note Recognition",  colour:"#10b981", icon:SVGI('<circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 18V5l12-2v13"/><path d="M9 9l12-2"/>') },
  { key:"chord",    name:"Chord Recognition", colour:"#8b5cf6", icon:SVGI('<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>') },
  { key:"ear",      name:"Chord Ear Training",colour:"#ec4899", icon:SVGI('<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>') },
  { key:"interval", name:"Interval Training", colour:"#0ea5e9", icon:SVGI('<line x1="4" y1="20" x2="20" y2="4"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/>') },
  { key:"metro",    name:"Metronome",         colour:"#f97316", icon:SVGI('<path d="M12 3l6 18H6z"/><line x1="12" y1="21" x2="17" y2="7"/>') },
  { key:"",         name:"Passage Fixer",     colour:"#14b8a6", icon:SVGI('<path d="M14.7 6.3a4 4 0 0 0-5.6 5.6L3 18v3h3l6.1-6.1a4 4 0 0 0 5.6-5.6l-2.5 2.5-2.1-2.1z"/>') },
];

/* ── state ── */
let ITEMS = [];          // everything browsable, normalised
let COURSES = [];        // course cards
let CONTINUE = [];       // personal resume row
let TOPICS = [];         // { name, count }
let topic = "", type = "", term = "", showAll = false;

/* ── helpers ── */
function fmtDate(d) {
  if (!d) return "";
  const t = new Date(d), now = new Date(), days = Math.round((now - t) / 86400000);
  if (days < 1) return "today";
  if (days < 2) return "yesterday";
  if (days < 14) return days + " days ago";
  return t.toLocaleDateString(undefined, { month:"short", year:"numeric" });
}
function mins(sec) { return sec ? Math.round(sec / 60) + " min" : ""; }

function tile(it) {
  const T = TYPES[it.type] || TYPES.video;
  const thumb = it.img
    ? '<div class="ln-thumb' + (it.vertical ? " ln-vert" : "") + '"><img src="' + esc(it.img) + '" alt="" loading="lazy">'
        + (it.playable ? '<span class="ln-play"></span>' : "")
        + (it.dur ? '<span class="ln-dur">' + esc(it.dur) + "</span>" : "")
        + (it.done ? '<span class="ln-done">Done</span>' : "") + "</div>"
    : '<div class="ln-thumb ln-flat" style="--cc:' + T.colour + '"><span>' + esc(it.topic || T.label) + "</span>"
        + (it.done ? '<span class="ln-done">Read</span>' : "") + "</div>";
  return '<a class="ln-tile" href="' + esc(it.href) + '"' + (it.external ? ' target="_blank" rel="noopener"' : "") + '>'
    + thumb
    + '<div class="ln-body" style="--tc:' + T.colour + '">'
    + '<span class="ln-kind">' + esc(T.label) + (it.external ? " · on the website" : "") + "</span>"
    + '<span class="ln-title">' + esc(it.title) + "</span>"
    + '<span class="ln-meta">' + esc(it.meta || "") + "</span>"
    + "</div></a>";
}

/* ── data ── */
async function load() {
  const [cs, ls, prog, sheets, read, evs, feed, mmt, ups, polls] = await Promise.all([
    db.from("courses").select("key,title,status,sort").order("sort"),
    db.from("lessons").select("id,course,title,level,est_minutes,status").eq("status","published"),
    db.from("course_progress").select("lesson_id,status").eq("email", myEmail),
    db.from("theory_sheets").select("id,title,slug,category,created_at").order("created_at",{ascending:false}),
    db.from("reading_list").select("sheet_id,status").eq("email", myEmail),
    db.from("live_events").select("id,title,scheduled_at,duration_mins,mux_playback_id,status").order("scheduled_at",{ascending:false}),
    db.from("content_feed_posts").select("id,type,title,url,youtube_id,media,published_at,duration_seconds,orientation").order("published_at",{ascending:false}),
    db.from("mmt_articles").select("slug,title,cover_image,published_at,created_at").order("created_at",{ascending:false}),
    db.from("user_pieces").select("id,title,composer,last_practiced_at").eq("email", myEmail).order("last_practiced_at",{ascending:false,nullsFirst:false}).limit(1),
    db.from("content_feed_post_polls").select("post_id"),
  ]);

  const lessons = ls.data || [], done = new Set((prog.data || []).filter(p => p.status === "completed").map(p => p.lesson_id));
  const readSet = new Set((read.data || []).filter(r => r.status === "read").map(r => r.sheet_id));

  /* courses, with the two announced ones carried from courses.html */
  const CMETA = [
    { key: "first-steps", label: "The Absolute Beginner Course", blurb: "Never played before? Start here and play your first pieces.", color: "#8b5cf6", audience: "Absolute beginners",
      icon: SVGI('<path d="M7 20h10"/><path d="M10 20c5.5-2.5.8-6.4 3-10"/><path d="M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8z"/><path d="M14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z"/>') },
    { key: "learn-your-first-piece", label: "Learn Your First Piece", blurb: "Ready for a real piece? Learn your first one, bar by bar.", color: "#2563eb", audience: "Beginners",
      format: "video", thumbId: "Uav7E8LAdqGDVIgS00iOsm91FYJ9vb4pNawk6KMwfchc", thumbTime: 21,
      icon: SVGI('<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>') },
    { key: "theory", label: "Music Theory", blurb: "How music works, from note names to harmony.", color: "#10b981", audience: "Absolute beginner to intermediate",
      icon: SVGI('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/>') },
    { key: "ear", label: "Ear Training", blurb: "Train your ear to recognise notes, intervals and chords.", color: "#ec4899", audience: "All levels",
      icon: SVGI('<path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/>') },
    { key: "improv", label: "Improvisation", blurb: "Start making up your own music at the keyboard.", color: "#f97316", audience: "Beginner and up",
      icon: SVGI('<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>') },
    // Announced before they exist, so the course list never reads as a finished set.
    // `soon` is the line shown where the lesson count and CTA normally sit.
    { key: "upper-intermediate-walkthrough", label: "Upper Intermediate Walkthrough", soon: "Coming in September",
      blurb: "A full upper intermediate piece, bar by bar, including how to make decisions and learn effectively.",
      color: "#14b8a6", audience: "Upper intermediate",
      icon: SVGI('<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="4" x2="8" y2="14"/><line x1="12" y1="4" x2="12" y2="14"/><line x1="16" y1="4" x2="16" y2="14"/>') },
    { key: "sight-reading-beginners", label: "Sight Reading for Beginners", soon: "Coming in September",
      blurb: "Play music you have never seen before, with the exact formula for improvement.",
      color: "#0ea5e9", audience: "Beginners",
      icon: SVGI('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>') },
  ];
  const META = Object.fromEntries(CMETA.map(c => [c.key, c]));

  COURSES = (cs.data || []).filter(c => META[c.key]).map(c => {
    const mine = lessons.filter(l => l.course === c.key);
    const d = mine.filter(l => done.has(l.id)).length;
    return Object.assign({}, META[c.key], { n:mine.length, done:d,
      pct: mine.length ? Math.round(d / mine.length * 100) : 0 });
  }).filter(c => c.n > 0);
  COURSES.push(
    { key:null, label:"Upper Intermediate Walkthrough", audience:"Upper intermediate", color:"#14b8a6",
      soon:"Coming in September", icon:SVGI('<rect x="3" y="4" width="18" height="16" rx="2"/><line x1="8" y1="4" x2="8" y2="14"/><line x1="12" y1="4" x2="12" y2="14"/><line x1="16" y1="4" x2="16" y2="14"/>'),
      blurb:"A full upper intermediate piece, bar by bar, including how to make decisions and learn effectively." },
    { key:null, label:"Sight Reading for Beginners", audience:"Beginners", color:"#0ea5e9",
      soon:"Coming in September", icon:SVGI('<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'),
      blurb:"Play music you have never seen before, with the exact formula for improvement." });

  /* every browsable item, normalised to one shape */
  ITEMS = [];
  (sheets.data || []).forEach(s => ITEMS.push({
    type:"sheet", title:s.title, topic:s.category, date:s.created_at, done:readSet.has(s.id),
    href:"/theory/sheets/view.html?slug=" + encodeURIComponent(s.slug),
    meta:(s.category || "Piano Practice Daily") + " · " + fmtDate(s.created_at) }));
  (evs.data || []).filter(e => e.mux_playback_id).forEach(e => ITEMS.push({
    type:"clinic", title:(e.title || "").replace(/^Live Practice Clinic:?\s*/i, ""), date:e.scheduled_at,
    img:"https://image.mux.com/" + e.mux_playback_id + "/thumbnail.webp?width=480&height=270&fit_mode=smartcrop&time=25",
    playable:true, dur:e.duration_mins ? e.duration_mins + " min" : "",
    href:"/events.html?event=" + encodeURIComponent(e.id), meta:"Clinic replay · " + fmtDate(e.scheduled_at) }));
  // The content feed carries three kinds of thing and only two of them are
  // learning material. `blog` posts announce a Monday Music Tips article, which
  // is already here from mmt_articles, so they would show everything twice.
  // Clinic topic polls are a question to the room, not something to learn from,
  // and clinic announcements duplicate the clinic itself from live_events.
  // A poll is identified by having a poll row, not by its title, because a post
  // is a poll, a video or a written post and the title cannot be trusted to say
  // which. The title check is only a backstop for one older poll whose rows are
  // gone. Clinic announcements are dropped because live_events already has them.
  const pollIds = new Set((polls.data || []).map(p => p.post_id));
  const FEED_SKIP = /topic poll|^live practice clinic|^live q&a/i;
  const muxId = p => {
    const m = (p.media || []).find(x => x && x.type === "mux");
    return m ? (m.playbackId || m.playback_id || "") : "";
  };
  (feed.data || []).forEach(p => {
    if (p.type === "blog") return;                       // duplicates mmt_articles
    if (pollIds.has(p.id) || FEED_SKIP.test(p.title || "")) return;
    const mux = muxId(p);
    if (p.youtube_id) {
      const vert = p.orientation === "portrait";
      ITEMS.push({ type:"video", title:p.title, date:p.published_at, playable:true, vertical:vert,
        img:"https://i.ytimg.com/vi/" + p.youtube_id + (vert ? "/oardefault.jpg" : "/mqdefault.jpg"),
        href:p.url || ("https://youtu.be/" + p.youtube_id), external:true,
        dur:p.duration_seconds ? mins(p.duration_seconds) : "",
        meta:(vert ? "Short · " : "Video · ") + fmtDate(p.published_at) });
    } else if (mux) {                                    // Matthew's own uploads
      ITEMS.push({ type:"video", title:p.title, date:p.published_at, playable:true,
        img:"https://image.mux.com/" + mux + "/thumbnail.webp?width=480&height=270&fit_mode=smartcrop&time=8",
        href:"/content-feed.html?post=" + encodeURIComponent(p.id),
        dur:p.duration_seconds ? mins(p.duration_seconds) : "",
        meta:"Video · " + fmtDate(p.published_at) });
    } else {
      ITEMS.push({ type:"video", title:p.title, date:p.published_at,
        href:"/content-feed.html?post=" + encodeURIComponent(p.id),
        meta:"Post · " + fmtDate(p.published_at) });
    }
  });
  (mmt.data || []).forEach(a => ITEMS.push({
    type:"article", title:a.title, date:a.published_at || a.created_at, img:a.cover_image || "",
    href:"https://matthewcawood.com/monday-music-tips/" + encodeURIComponent(a.slug), external:true,
    meta:"Monday Music Tips · " + fmtDate(a.published_at || a.created_at) }));
  lessons.forEach(l => { if (META[l.course]) ITEMS.push({
    type:"course", title:l.title, topic:META[l.course].label, done:done.has(l.id),
    href:"/courses.html?lesson=" + encodeURIComponent(l.id),
    meta:META[l.course].label + (l.est_minutes ? " · " + l.est_minutes + " min" : "") }); });

  /* A title can legitimately exist in two tables; show it once. */
  const seenTitle = new Set();
  ITEMS = ITEMS.filter(i => {
    const k = (i.type === "course" ? "lesson:" : "") + (i.title || "").trim().toLowerCase();
    if (!k || seenTitle.has(k)) return false;
    seenTitle.add(k); return true;
  });

  /* topics come from the only vocabulary that is actually populated today */
  const counts = {};
  ITEMS.forEach(i => { if (i.topic) counts[i.topic] = (counts[i.topic] || 0) + 1; });
  TOPICS = Object.keys(counts).map(n => ({ name:n, count:counts[n] })).sort((a,b) => b.count - a.count);

  /* continue row */
  CONTINUE = [];
  const started = COURSES.filter(c => c.key && c.done > 0 && c.done < c.n).sort((a,b) => b.pct - a.pct)[0];
  if (started) CONTINUE.push({ k:"Course", tc:"var(--t-course)", t:started.label,
    m:started.done + " of " + started.n + " lessons", pct:started.pct, href:"/courses.html?course=" + started.key });
  const piece = (ups.data || [])[0];
  if (piece) CONTINUE.push({ k:"Piece", tc:"var(--t-piece)", t:piece.title + (piece.composer ? " — " + piece.composer : ""),
    m:piece.last_practiced_at ? "Last practised " + fmtDate(piece.last_practiced_at) : "Not practised yet",
    href:"/resources.html?section=library" });
  const nextUp = (evs.data || []).filter(e => e.scheduled_at && new Date(e.scheduled_at) > new Date()).slice(-1)[0];
  if (nextUp) CONTINUE.push({ k:"Next clinic", tc:"var(--t-clinic)", t:(nextUp.title || "").replace(/^Live Practice Clinic:?\s*/i, ""),
    m:new Date(nextUp.scheduled_at).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}),
    href:"/events.html?event=" + nextUp.id });
}

/* ── render ── */
function filtered() {
  const t = term.trim().toLowerCase();
  return ITEMS.filter(i =>
    (!type  || i.type === type) &&
    (!topic || i.topic === topic) &&
    (!t     || i.title.toLowerCase().includes(t) || (i.topic || "").toLowerCase().includes(t)));
}

function render() {
  const latest  = ITEMS.filter(i => i.date && !i.vertical).sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 10);
  const shorts  = ITEMS.filter(i => i.vertical).sort((a,b) => new Date(b.date) - new Date(a.date));
  const list    = filtered().filter(i => !i.vertical).sort((a,b) => new Date(b.date || 0) - new Date(a.date || 0));
  const shown   = showAll ? list : list.slice(0, 30);
  const counts  = {}; ITEMS.forEach(i => counts[i.type] = (counts[i.type] || 0) + 1);
  const nVid = counts.video || 0, nSheet = counts.sheet || 0, nArt = counts.article || 0,
        nClin = counts.clinic || 0, nLes = counts.course || 0;

  const courseCard = c => {
    const hero = c.thumbId
      ? '<span class="ln-hero ln-hero-img"><img src="https://image.mux.com/' + c.thumbId
        + '/thumbnail.webp?width=560&height=315&fit_mode=smartcrop&time=' + (c.thumbTime || 0)
        + '" alt="" loading="lazy"><span class="ln-play"></span></span>'
      : '<span class="ln-hero" style="--cc:' + c.color + '"><span class="ln-hero-ic">' + (c.icon || "") + "</span></span>";
    const foot = c.soon
      ? '<span class="ln-badge">' + esc(c.soon) + "</span>"
      : '<span>' + c.n + " lesson" + (c.n === 1 ? "" : "s") + (c.done ? " · " + c.pct + "% done" : "")
        + "</span><b>" + (c.done ? "Continue" : "Start") + "</b>";
    const inner = hero + '<span class="cb">'
      + (c.audience ? '<span class="lv">' + esc(c.audience) + "</span>" : "")
      + '<span class="nm">' + esc(c.label) + "</span>"
      + '<span class="bl">' + esc(c.blurb || "") + "</span>"
      + (c.done && !c.soon ? '<span class="ln-bar"><i style="width:' + c.pct + '%"></i></span>' : "")
      + '<span class="ft">' + foot + "</span></span>";
    return c.soon
      ? '<div class="ln-course soon" style="--cc:' + c.color + '">' + inner + "</div>"
      : '<a class="ln-course" href="/courses.html?course=' + esc(c.key) + '" style="--cc:' + c.color + '">' + inner + "</a>";
  };

  const nextClinic = CONTINUE.find(c => c.k === "Next clinic");
  const resume = CONTINUE.filter(c => c.k !== "Next clinic");

  $("ln-root").innerHTML =
    '<div class="ln-top">'
    + '<div class="ln-top-l"><h1>Learn</h1>'
    + '<p class="ln-count-line">' + nVid + " videos · " + nClin + " clinic replays · " + nSheet
    + " sheets · " + nArt + " articles · " + nLes + " course lessons</p></div>"
    + (nextClinic
        ? '<a class="ln-next" href="' + esc(nextClinic.href) + '">'
          + '<span class="ln-next-k">Next live clinic</span>'
          + '<span class="ln-next-t">' + esc(nextClinic.t) + "</span>"
          + '<span class="ln-next-d">' + esc(nextClinic.m) + "</span></a>"
        : "")
    + "</div>"

    + (resume.length ? section("Pick up where you left off", "", "",
        '<div class="ln-cont">' + resume.map(c =>
          '<a class="ln-cc" href="' + esc(c.href) + '" style="--tc:' + c.tc + '">'
          + '<span class="k">' + esc(c.k) + '</span><span class="t">' + esc(c.t) + "</span>"
          + (c.pct != null ? '<span class="ln-bar"><i style="width:' + c.pct + '%"></i></span>' : "")
          + '<span class="m">' + esc(c.m) + "</span></a>").join("") + "</div>") : "")

    + section("New this week", "", "",
        '<div class="ln-tiles">' + latest.map(tile).join("") + "</div>")

    + section("Paths", "work through", "Courses are the one thing here that genuinely has a level.",
        '<div class="ln-courses">' + COURSES.map(courseCard).join("") + "</div>")

    + section("Work on", "any level", "The door is a problem, not a level. Topics come from the categories that exist today, so clinics, videos and articles join these once they are tagged.",
        '<div class="ln-topics" id="ln-topics">' + TOPICS.map(t =>
          '<button class="ln-topic" type="button" aria-pressed="' + (topic === t.name) + '" data-topic="' + esc(t.name) + '">'
          + '<span class="tn">' + esc(t.name) + '</span><span class="tc">' + t.count + " item" + (t.count === 1 ? "" : "s") + "</span></button>").join("") + "</div>")

    + section("The library", "", "Search across every course lesson, sheet, replay, video and article at once.",
        '<div class="ln-controls">'
        + '<label class="ln-search"><input id="ln-q" type="search" placeholder="Search everything" value="' + esc(term) + '" autocomplete="off"></label>'
        + '<div class="ln-filters" id="ln-types">'
        + Object.keys(TYPES).map(k => '<button class="ln-fil" type="button" data-type="' + k + '" aria-pressed="' + (type === k)
            + '" style="--fc:' + TYPES[k].colour + '">' + esc(TYPES[k].label) + '<span class="fn">' + (counts[k] || 0) + "</span></button>").join("")
        + "</div></div>"
        + '<div class="ln-count"><b>' + list.length + "</b> item" + (list.length === 1 ? "" : "s")
        + (topic ? " in " + esc(topic) : "") + (term ? ' matching "' + esc(term) + '"' : "")
        + (topic || type || term ? ' · <button class="ln-more" id="ln-clear" type="button">clear</button>' : "") + "</div>"
        + (shown.length
            ? '<div class="ln-tiles">' + shown.map(tile).join("") + "</div>"
              + (!showAll && list.length > shown.length
                  ? '<div class="ln-morewrap"><button class="ln-more" id="ln-all" type="button">Show all ' + list.length + "</button></div>" : "")
            : '<div class="ln-empty">Nothing matches that yet.</div>'))

    + (shorts.length ? section("Shorts", "", "Quick ones, a minute or two each.",
        '<div class="ln-shorts">' + shorts.slice(0, 40).map(tile).join("") + "</div>") : "")

    + section("Drills", "repeat", "No end and no level. You come back to these rather than finishing them.",
        '<div class="ln-dtools">' + DRILLS.map(d =>
          '<a class="ln-dtool" style="--ccol:' + d.colour + '" href="/tools.html' + (d.key ? "?section=" + d.key : "") + '">'
          + '<span class="ln-dtool-ic">' + d.icon + '</span><span class="ln-dtool-nm">' + esc(d.name) + "</span></a>").join("") + "</div>");

  wire();
}

function section(title, mode, sub, inner) {
  return '<section class="ln-sec"><div class="ln-head"><h2>' + esc(title) + "</h2>"
    + (mode ? '<span class="ln-mode">' + esc(mode) + "</span>" : "") + "</div>"
    + (sub ? '<p class="ln-sub">' + esc(sub) + "</p>" : "") + inner + "</section>";
}

function wire() {
  const q = $("ln-q");
  if (q) q.oninput = e => { term = e.target.value; showAll = false; render(); $("ln-q").focus(); };
  const tp = $("ln-topics");
  if (tp) tp.querySelectorAll(".ln-topic").forEach(b => b.onclick = () => {
    topic = (topic === b.dataset.topic) ? "" : b.dataset.topic; showAll = false; render();
    document.getElementById("ln-topics").scrollIntoView({ block:"start", behavior:"smooth" });
  });
  const ty = $("ln-types");
  if (ty) ty.querySelectorAll(".ln-fil").forEach(b => b.onclick = () => {
    type = (type === b.dataset.type) ? "" : b.dataset.type; showAll = false; render();
  });
  const all = $("ln-all");   if (all)   all.onclick   = () => { showAll = true; render(); };
  const clr = $("ln-clear"); if (clr)   clr.onclick   = () => { topic = type = term = ""; showAll = false; render(); };
}

/* ── boot ── */
(async function() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/"; return; }
  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName = (ae && ae.name) || myEmail.split("@")[0];
  try {
    initSharedHeader({ db, myEmail, myName, isAdmin: myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase(),
      activePage:"learn", avatarUrl:(ae && ae.avatar_url) || null });
  } catch (e) { console.error("initSharedHeader error:", e); }

  const sp = new URLSearchParams(location.search);
  topic = sp.get("topic") || ""; type = sp.get("type") || ""; term = sp.get("q") || "";

  try { await load(); render(); }
  catch (e) {
    console.error("learn load error:", e);
    $("ln-root").innerHTML = '<div class="ln-empty">Something went wrong loading the library. Reload the page to try again.</div>';
  }
  document.getElementById("loading-screen").style.display = "none";
  document.getElementById("app-main").style.display = "block";
  document.getElementById("app-header").style.display = "";
})();
</script>
</body>
</html>
