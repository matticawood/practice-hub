    /* picks_for stores a clinic under its events.html address, which is what
       this card's href used to be. Without the old address kept here, a picked
       clinic matched nothing in ITEMS and For you drew the bare row instead:
       no thumbnail, and the raw "Live Practice Clinic: ..." title rather than
       the short one every other clinic card shows. */
    altHref: "/events.html?event=" + encodeURIComponent(e.id),
    meta:fmtDate(e.scheduled_at) });
  });
  // The content feed carries three kinds of thing and only two of them are
  // learning material. `blog` posts announce a Monday Music Tips article, which
  // is already here from mmt_articles, so they would show everything twice.
  // Clinic topic polls are a question to the room, not something to learn from,
  // and clinic announcements duplicate the clinic itself from live_events.
  // A poll is identified by having a poll row, not by its title, because a post
  // is a poll, a video or a written post and the title cannot be trusted to say
  // which. The title check is only a backstop for one older poll whose rows are
  // gone. Clinic announcements are dropped because live_events already has them.
  const pollIds = new Set((polls.data || []).map(p => p.post_id));
  const FEED_SKIP = /topic poll|^live practice clinic|^live q&a/i;
  const muxId = p => {
    const m = (p.media || []).find(x => x && x.type === "mux");
    return m ? (m.playbackId || m.playback_id || "") : "";
  };
  (feed.data || []).forEach(p => { FEED[p.id] = p; });
  (feed.data || []).forEach(p => {
    if (p.type === "blog") return;                       // duplicates mmt_articles
    /* A clinic's post exists so its video and discussion live with everything
       else. The card for it is built from live_events above, which knows the
       schedule, so the post must not raise a second one. */
    if (p.type === "clinic") return;
    if (pollIds.has(p.id) || FEED_SKIP.test(p.title || "")) return;
    const mux = muxId(p);
    if (p.youtube_id) {
      const vert = p.orientation === "portrait";
      ITEMS.push({ type:"video", ctype:"video", ref:p.youtube_id, title:p.title, date:p.published_at, playable:true, vertical:vert,
        yt:p.youtube_id, mins:Math.max(1, Math.round((p.duration_seconds || 0) / 60)),
        img:"https://i.ytimg.com/vi/" + p.youtube_id + (vert ? "/oardefault.jpg" : "/mqdefault.jpg"),
        href:"/content-feed.html?post=" + encodeURIComponent(p.id),
        dur:p.duration_seconds ? mins(p.duration_seconds) : "",
        meta:fmtDate(p.published_at) });
    } else if (mux) {                                    // Matthew's own uploads
      ITEMS.push({ type:"video", title:p.title, date:p.published_at, playable:true, only:true,
        img:"https://image.mux.com/" + mux + "/thumbnail.webp?width=480&height=270&fit_mode=smartcrop&time=8",
        href:"/content-feed.html?post=" + encodeURIComponent(p.id),
        dur:p.duration_seconds ? mins(p.duration_seconds) : "",
        meta:fmtDate(p.published_at) });
    } else {
      /* No YouTube id and no Mux media means there is nothing to learn from
         here: it is a written post or a member's question, which belongs in the
         community feed, not the library. */
      return;
    }
  });
  (mmt.data || []).forEach(a => ITEMS.push({
    type:"article", ctype:"mmt", ref:String(a.id), title:a.title, date:a.published_at || a.created_at,
    mins:Math.max(1, Math.round((words["mmt:" + a.id] || 800) / READ_WPM)),
    bg:mmtBg(a.slug || ""),
    /* Read in the app's own reader now, not on the public website. The old
       address is kept so a pick coming back from picks_for still matches the
       library item it belongs to. */
    href:"/theory/sheets/view.html?mmt=" + encodeURIComponent(a.slug),
    altHref:"https://matthewcawood.com/monday-music-tips/" + encodeURIComponent(a.slug),
    meta:fmtDate(a.published_at || a.created_at) }));
  /* Course lessons are deliberately NOT browsable on their own. They sit in a
     sequence, and a lesson met out of order assumes things the member has not
     been told yet. Courses are reachable through Paths and the courses page,
     and For you can still surface a lesson, but only when they are up to it. */

  /* A title can legitimately exist in two tables; show it once. */
  const seenTitle = new Set();
  ITEMS = ITEMS.filter(i => {
    const k = (i.type === "course" ? "lesson:" : "") + (i.title || "").trim().toLowerCase();
    if (!k || seenTitle.has(k)) return false;
    seenTitle.add(k); return true;
  });

  /* Symptoms: one vocabulary, used at both ends. Content says which problem it
     solves; a member's practice notes say which problem they have. The join is
     (content_type, content_ref), which every source resolves to exactly. */
  VOCAB = (vocab.data || []).filter(v => v.id !== "__none__");
  const kindOf = {};
  (cmeta.data || []).forEach(m => kindOf[m.content_type + ":" + m.content_ref] = m.kind);
  const symOf = {};
  (tags.data || []).forEach(t => (symOf[t.content_type + ":" + t.content_ref] ||= []).push(t.symptom_id));
  ITEMS.forEach(i => {
    const k = i.ctype + ":" + i.ref;
    i.kind = kindOf[k] || "";
    i.syms = symOf[k] || [];
  });

  /* The member's own recent signals decide which families lead. Only their own
     practice notes feed this, never anything they wrote to other people. */
  const recent = Date.now() - 120 * 86400000;
  MYSYMS = {};
  (mine.data || []).forEach(r => {
    if (r.session_date && new Date(r.session_date).getTime() < recent) return;
    MYSYMS[r.symptom_id] = (MYSYMS[r.symptom_id] || 0) + 1;
  });

  /* One row of things that might actually help, chosen from what this member has
     written about, then what their practice shows, then what they read. */
  PICKS = []; PICK_SHORTS = [];
  PICK_WHY = ""; PICK_SUB = "";
  /* picks_for is fired at the top of load(), not here, so it runs alongside
     everything above rather than after it. The reveal waits for it, so where it
     starts is where the page's opening time is decided. */

  /* topics come from the only vocabulary that is actually populated today */
  const counts = {};
  ITEMS.forEach(i => { if (i.topic) counts[i.topic] = (counts[i.topic] || 0) + 1; });
  TOPICS = Object.keys(counts).map(n => ({ name:n, count:counts[n] })).sort((a,b) => b.count - a.count);

  /* continue row */
  CONTINUE = [];
  const started = COURSES.filter(c => c.key && c.done > 0 && c.done < c.n).sort((a,b) => b.pct - a.pct)[0];
  if (started) CONTINUE.push({ k:"Course", mark:"course", tc:"var(--t-course)", t:started.label,
    m:started.done + " of " + started.n + " lessons", pct:started.pct, href:"/courses.html?course=" + started.key,
    /* Carried so the hero can show the course itself rather than borrowing a
       photograph from whatever happened to be published last. */
    mux:started.thumbId || null, muxTime:started.thumbTime || 0,
    colour:started.color, icon:started.icon });
  const piece = (ups.data || [])[0];
  if (piece) CONTINUE.push({ k:"Piece", mark:"sheet", tc:"var(--t-sheet)", t:piece.title + (piece.composer ? " — " + piece.composer : ""),
    m:piece.last_practiced_at ? "Last practised " + fmtDate(piece.last_practiced_at) : "Not practised yet",
    href:"/resources.html?section=library" });
  const nextUp = (evs.data || []).filter(e => e.scheduled_at && new Date(e.scheduled_at) > new Date()).slice(-1)[0];
  if (nextUp) CONTINUE.push({ k:"Next clinic", tc:"var(--t-clinic)", t:(nextUp.title || "").replace(/^Live Practice Clinic:?\s*/i, "").trim() || "Live Practice Clinic",
    m:new Date(nextUp.scheduled_at).toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"}),
    href:"/events.html?event=" + nextUp.id });
}


/* ── card ───────────────────────────────────────────────────────────────────── */
/* Monday Music Tips have no cover art; the website's catalogue draws a
   gradient from the slug with the title on it. Same palette, same hash, so a
   given article looks the same in both places. */
/* Eight palettes, and every one of them was landing on screen as the same
   near-black. The light stop sat at the gradient origin and the origin was
   above the top edge, so almost none of it reached the card. The origin is now
   just inside the top and the light stops are brighter, which is what makes
   one article distinguishable from the next. The dark edges are the point of
   the treatment and they stay: the falloff still reaches the darkest stop
   before the border. */
const MMT_BG = [
  ["#7a6a4e","#2a241d","#161310"], ["#5f6a80","#232a33","#11151b"],
  ["#734f73","#2b1f2e","#160f17"], ["#4d7767","#1d2a26","#0e1613"],
  ["#7c4d51","#2e1d1f","#170d0e"], ["#585481","#222033","#11101c"],
  ["#6e664a","#29271c","#14130d"], ["#4c7276","#1c2a2c","#0d1416"],
];
/* The first stop of an article's gradient is its lightest, which is the colour
   its icon and halo should take so the plate reads as one object. */
function mmtLight(bg) {
  const m = String(bg || "").match(/#[0-9a-f]{6}/i);
  return m ? m[0] : "#5f6a80";
}
function mmtBg(slug) {
  let h = 0;
  for (let i = 0; i < slug.length; i++) h = (h * 31 + slug.charCodeAt(i)) >>> 0;
  const [a, b, c] = MMT_BG[h % MMT_BG.length];
  return "radial-gradient(115% 105% at 50% 2%, " + a + " 0%, " + b + " 44%, " + c + " 100%)";
}

function card(it, o) {
  const T = TYPES[it.type] || TYPES.video;

  const inner = it.img
    ? '<img src="' + esc(it.img) + '" alt="" loading="lazy"'
      + (it.vertical && it.yt ? ' data-yt="' + esc(it.yt) + '" data-try="0"' : "") + ">"
      + (it.playable ? '<span class="ln-pl"></span>' : "")
      + (it.dur ? '<span class="ln-du">' + esc(it.dur) + "</span>" : "")
    : it.bg
      ? '<span class="ln-tip" style="background:' + it.bg + '"><span>Monday Music Tips</span></span>'
      : it.type === "sheet"
        ? '<span class="ln-book" style="--tc:' + ppdCatColour(it.cat || it.topic) + '"><i>'
            + esc(ppdMono(it.cat || it.topic)) + "</i></span>"
        : '<span class="ln-flat" style="--tc:' + T.colour + '">'
            + (MARK[it.type] || MARK.video) + "</span>";
  return '<a class="ln-c' + (it.vertical ? " ln-cv" : "") + '" href="' + esc(it.href) + '"' + (it.external ? ' target="_blank" rel="noopener"' : "")
    + '><span class="ln-th' + (it.vertical ? " ln-v" : "") + '">' + inner
    + (it.only ? '<span class="ln-only">Exclusive</span>' : "")
    + (it.done ? '<span class="ln-dn">' + (it.type === "sheet" ? "Read" : "Done") + "</span>" : "")
    + "</span>"
    + '<span class="ln-meta"><span class="ln-ck' + (o && o.showTopic && it.topic ? " ln-ck-t" : "") + '">'
    + esc(o && o.showTopic && it.topic ? it.topic : T.label) + "</span>"
    + '<span class="ln-ct">' + esc(it.title) + "</span>"
    + (it.meta ? '<span class="ln-cm">' + esc(it.meta) + "</span>" : "") + "</span></a>";
}

function courseCard(c) {
  const ls = c.n || 0, pct = c.pct || 0, started = (c.done || 0) > 0;
  const hero = (c.format === "video" && c.thumbId)
    ? '<div class="cc-hero cc-hero--video">'
        + '<img class="cc-hero-img" src="https://image.mux.com/' + c.thumbId
        + '/thumbnail.webp?width=880&height=495&fit_mode=smartcrop&time=' + (c.thumbTime || 0) + '" alt="" loading="lazy">'
        + '<span class="cc-hero-play"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>'
        + '<span class="cc-hero-tag">Video course</span>'
        + (c.soon ? "" : '<span class="ln-only">Exclusive</span>') + "</div>"
    : '<div class="cc-hero cc-hero--icon"><span class="cc-hero-ic">' + (c.icon || "") + "</span>"
        + (c.soon ? "" : '<span class="ln-only">Exclusive</span>') + "</div>";
  const body = '<div class="cc-body">'
    + (c.audience ? '<div class="cc-level">' + esc(c.audience) + "</div>" : "")
    + '<div class="cc-title">' + esc(c.label) + "</div>"
    + '<div class="cc-blurb">' + esc(c.blurb || "") + "</div>"
    + '<div class="cc-spacer"></div>'
    + (started ? '<div class="cc-track"><div class="cc-track-fill" style="width:' + pct + '%"></div></div>' : "")
    + '<div class="cc-foot">'
    + (c.soon
        ? '<span class="soon-badge">' + esc(c.soon) + "</span>"
        : '<span class="cc-count">' + ls + " lesson" + (ls === 1 ? "" : "s")
          + (started ? " · " + pct + "% done" : "") + "</span>"
          + '<span class="cc-cta">' + (started ? "Continue" : "Start") + "</span>")
    + "</div></div>";
  return c.soon
    ? '<div class="course-card soon" style="--cc-accent:' + c.color + '">' + hero + body + "</div>"
    : '<a class="course-card" href="/courses.html?course=' + esc(c.key) + '" style="--cc-accent:' + c.color + '">' + hero + body + "</a>";
}

/* Toggling rebuilds the rows under the reader, which without this reads as a
   jump rather than as a change. They fade down, are rebuilt at the scroll
   position they were already at, and fade back. The hero and the control are
   outside the fade and are not rebuilt at all, so the thumb goes on sliding
   while everything below it is replaced. Reduced motion gets the rebuild with
   none of the movement.
   The timers are deliberately timers: requestAnimationFrame does not run in a
   backgrounded tab, and the call that clears the class is what makes the rows
   visible again, so a frozen frame would leave the page blank. */
function swapView() {
  const root = document.getElementById("ln-root");
  const still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!root || still) return render();
  const y = window.scrollY;
  root.classList.add("ln-swap");
  setTimeout(() => {
    render();                                  // the class is on the container, so it survives
    window.scrollTo(0, y);
    setTimeout(() => root.classList.remove("ln-swap"), 20);
  }, 180);
}

/* What each rail could still show, and how it should draw it, so scrolling to
   the end of one can extend it. Everything is already in memory, so this costs
   a render rather than a request. */
const RAIL_MORE = {};
let RAIL_SEQ = 0;

function row(title, sub, items, opts) {
  if (!items.length) return "";
  const o = opts || {};
  /* `all` is the full set this row was sliced from. Held against a key on the
     rail so scrolling to the end can take the next slice. */
  let more = "";
  if (o.all && o.all.length > items.length) {
    const key = "r" + (++RAIL_SEQ);
    RAIL_MORE[key] = { all:o.all, opts:o };
    more = ' data-more="' + key + '" data-shown="' + items.length + '"';
  }
  return '<section class="ln-row"><div class="ln-rh"><h2>' + esc(title) + "</h2>"
    + (sub ? '<span class="ln-rs">' + esc(sub) + "</span>" : "")
    + (o.seeAll ? '<button class="ln-all" type="button" data-see="' + esc(o.seeAll) + '">See all</button>' : "")
    + '</div><div class="' + (items.length <= 4 && !o.vertical && !o.rail ? "ln-grid" : "ln-rail")
    + (o.big ? " ln-big" : "")
    + (o.vertical ? " ln-vrail" : "") + (o.course ? " ln-crail" : "") + '"' + more + '>'
    + items.map(it => o.course ? courseCard(it) : card(it, o)).join("") + "</div></section>";
}

/* ── Everything ──────────────────────────────────────────────────────────────
   The whole library in one place, filtered by the two questions a member
   actually asks: how long have I got, and what do I want to work on. Shorts
   are excluded; they have their own row and never sit right beside long-form. */
const TIME_BANDS = [
  { k:"s", label:"Under 5 min", test:i => (i.mins || 0) > 0 && i.mins < 5 },
  { k:"m", label:"5 to 15 min", test:i => i.mins >= 5 && i.mins < 15 },
  { k:"l", label:"15 min plus", test:i => i.mins >= 15 },
];
let band = "", libTopic = "", libShown = 24;

function everything(from) {
  const base = (from || ITEMS).filter(i => !i.vertical);
  const b = TIME_BANDS.find(x => x.k === band);
  const pool = base.filter(i => (!b || b.test(i)) && (!libTopic || (i.syms || []).includes(libTopic)));
  const topics = VOCAB.map(v => ({ id:v.id, label:v.topic || v.label,
      n:base.filter(i => (i.syms || []).includes(v.id)).length }))
    .filter(t => t.n >= 6).sort((a, x) => x.n - a.n);

  let h = '<section class="ln-row"><div class="ln-rh"><h2>Everything</h2>'
    + '<span class="ln-rs">' + base.length + " pieces to work through</span></div>"
    + '<div class="ln-fbar ln-selrow">'
    + '<label class="ln-sel"><span>Length</span><select id="ln-band"><option value="">Any length</option>'
    + TIME_BANDS.map(t => '<option value="' + t.k + '"' + (band === t.k ? " selected" : "") + ">"
        + t.label + "</option>").join("") + "</select></label>"
    + '<label class="ln-sel"><span>Focus</span><select id="ln-topic"><option value="">Anything</option>'
    + topics.map(t => '<option value="' + esc(t.id) + '"' + (libTopic === t.id ? " selected" : "") + ">"
        + esc(t.label) + " (" + t.n + ")</option>").join("") + "</select></label></div>"
    + '<div class="ln-libcount">' + pool.length + (pool.length === 1 ? " piece" : " pieces")
    + (band || libTopic ? ' · <button class="ln-all" type="button" id="ln-libclear">clear</button>' : "")
    + "</div>";

  const shown = pool.slice().sort(byDate).slice(0, libShown);
  h += shown.length ? '<div class="ln-grid">' + shown.map(card).join("") + "</div>"
                    : '<div class="ln-empty">Nothing matches that yet.</div>';
  if (pool.length > shown.length)
    h += '<div class="ln-morewrap"><button class="ln-more" id="ln-libmore" type="button">Show more</button></div>';
  return h + "</section>";
}

/* ── filtering ──────────────────────────────────────────────────────────────── */
function filtered() {
  const t = term.trim().toLowerCase();
  return ITEMS.filter(i =>
    (!onlyEx  || i.only) &&
    (!type    || i.type === type) &&
    (!topic   || i.topic === topic) &&
    (!symptom || (i.syms || []).includes(symptom)) &&
    (!t     || i.title.toLowerCase().includes(t) || (i.topic || "").toLowerCase().includes(t)));
}
/* How long YouTube's own chrome stays up once playback starts. Its player
   autohides after three seconds of pointer inactivity; the extra second is
   headroom, since this is their timing and not ours. */
const YT_AUTOHIDE = 4000;
/* Where the embed is told to begin, so the opening titles are already past. */
const YT_START = 15;
/* Piano Practice Daily categories take their colour from the same place the
   Piano Practice Daily pages do: a twelve colour palette assigned by the
   category's position in the sorted list of distinct categories, so Harmony is
   the same colour here as on the sheet itself and in resources. Assigned by
   sorted index rather than by hashing, so two categories cannot collide until
   the palette wraps. Mirrors _ppdCatColor in resources.html. */
const PPD_PALETTE = ["#b3713d","#4e9a5c","#4a7fb0","#b0529a","#a8893a","#3f9a86",
                     "#6a64b3","#7e983e","#3f8fa0","#9558b0","#b3506a","#5a7d52"];
let PPD_CATS = [];
const ppdCleanCat = c => (c || "General").replace(/^category:\s*/i, "").trim() || "General";
/* The same letter the library puts on the spine. */
function ppdMono(cat) { return (ppdCleanCat(cat) || "?").trim().charAt(0).toUpperCase(); }
function ppdCatColour(cat) {
  const i = PPD_CATS.indexOf(ppdCleanCat(cat));
  return PPD_PALETTE[(i < 0 ? 0 : i) % PPD_PALETTE.length];
}
const byDate = (a, b) => new Date(b.date || 0) - new Date(a.date || 0);

/* ── lightbox ───────────────────────────────────────────────────────────────
   Watching should not cost a page load. The post renders through the shared
   module, so it is the same thing content-feed shows, in a different frame. */
let LB_OPEN = null;

/* The faces beside the count, as the feed shows them. */
function likerChips(p) {
  const all = p._likers || [];
  if (!all.length) return "";
  const info = p._likerInfo || {};
  const chips = all.slice(0, 3).map(em => {
    const r = info[em] || {};
    const name = r.name || em.split("@")[0];
    const inner = r.avatar_url
      ? '<img src="' + esc(r.avatar_url) + '" alt="' + esc(name) + '">'
      : '<span style="background:var(--surface-2);color:var(--text-muted);width:100%;height:100%;display:flex;'
        + 'align-items:center;justify-content:center;font-size:.5rem;font-weight:800;border-radius:50%">'
        + esc(name[0].toUpperCase()) + "</span>";
    return '<div class="tc-like-chip">' + inner + "</div>";
  }).join("");
  return '<span class="tc-like-avatars" style="display:inline-flex;align-items:center;margin-left:4px">'
    + chips + (all.length > 3 ? '<span style="font-size:.72rem;color:var(--text-muted);margin-left:6px">+'
    + (all.length - 3) + "</span>" : "") + "</span>";
}

/* The comment tables the lightbox reads. A library post is a content-feed post;
   a clinic replay is an event, and its discussion is event_comments, which uses
   event_id for the parent and parent_id for a reply where the feed table uses
   post_id and parent_comment_id. Swapped per open, because only one panel is
   ever open at a time. */
const LB_SRC_POST = {
  comments:  { table: "content_feed_comments", parentField: "post_id", replyField: "parent_comment_id" },
  reactions: { table: "content_feed_likes",    parentField: "post_id" },
  replyNotificationLinkFn: id => `/content-feed.html?post=${id}`,
};
const LB_SRC_CLINIC = {
  comments:  { table: "event_comments", parentField: "event_id", replyField: "parent_id" },
  reactions: { table: "content_feed_likes", parentField: "post_id" },   // unused: a clinic has no reaction row
  replyNotificationLinkFn: id => `/learn.html?clinic=${id}`,
};

/* A clinic replay in the library panel. Same panel as a post, fed from the
   event: the video Mux already put on it, the timestamped Q&A, and the
   event's own comments. */
async function openClinic(eventId) {
  const ev = CLINIC_BY_ID[eventId];
  if (!ev || !ev.mux_playback_id) { location.href = "/events.html?event=" + encodeURIComponent(eventId); return; }

  const media = $("ln-lb-media"), body = $("ln-lb-body"), cmts = $("ln-lb-cmts");
  /* In Learn a clinic is named the way every other clinic card here is named,
     with the "Live Practice Clinic:" off the front. The prefix belongs on the
     clinic page, where it says what the thing is; here the row it sits in has
     already said that. The event's own title is untouched. */
  const fullTitle = ev.title || "Live Practice Clinic";
  const title = fullTitle.replace(/^Live Practice Clinic:?\s*/i, "") || fullTitle;

  /* The box before the video. A mux-player with no frame around it has almost
     no size until its metadata arrives, so it drew as a sliver and then jumped
     to 16:9 as it started. The wrapper holds the shape from the first paint and
     the poster is Mux's own thumbnail, so there is a still of the clinic there
     while it loads rather than a black gap that changes size. */
  media.innerHTML = '<div style="width:100%;aspect-ratio:16/9;background:#000;overflow:hidden">'
    + '<mux-player playback-id="' + esc(ev.mux_playback_id) + '"'
    + ' poster="https://image.mux.com/' + esc(ev.mux_playback_id) + '/thumbnail.webp?width=960&time=25"'
    + ' metadata-video-title="' + esc(fullTitle) + '" accent-color="#c9a84c" autoplay'
    + ' style="width:100%;height:100%;display:block;--media-object-fit:contain"></mux-player></div>';
  media.querySelectorAll("mux-player").forEach(v => {
    const go = () => { try { const r = v.play(); if (r && r.catch) r.catch(() => {}); } catch (err) {} };
    go();
    v.addEventListener("loadedmetadata", go, { once: true });
    v.addEventListener("canplay", go, { once: true });
  });
  body.innerHTML = '<div class="ln-lb-title">' + esc(title) + "</div>"
    + '<div class="ln-lb-sub">' + esc(fmtDate(ev.scheduled_at)) + "</div>";
  cmts.innerHTML = "";
  const qaReset = $("ln-lb-qa"); if (qaReset) qaReset.innerHTML = "";
  $("ln-lb-under").classList.add("loading");

  LB_OPEN = eventId;
  wireLbDrag();
  addLbDragZone();
  $("ln-lb").classList.remove("closing");
  $("ln-lb").classList.add("open");
  document.body.style.overflow = "hidden";
  history.pushState({ lb: eventId, clinic: 1 }, "", "?clinic=" + encodeURIComponent(eventId));

  PostView.trackMedia(media, "clinic", eventId);
  PostView.recordView("clinic", eventId, 0, false);

  try {
    if (window.Comments && Comments.useSource) Comments.useSource(LB_SRC_CLINIC);
    const qa = window.ClinicQA ? await ClinicQA.load(db, eventId) : null;
    if (LB_OPEN !== eventId) return;

    const qaEl = $("ln-lb-qa");
    qaEl.innerHTML = qa ? ClinicQA.html(qa) : "";
    if (qa && !qaEl.dataset.wired) {
      qaEl.dataset.wired = "1";
      ClinicQA.wire(qaEl, secs => {
        const pl = media.querySelector("mux-player, video");
        if (!pl) return;
        try { pl.currentTime = secs; pl.play(); } catch (err) {}
        media.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    cmts.innerHTML = '<div class="tc-comments-section">'
      + '<div id="tc-comments-hdr-' + eventId + '" class="tc-comments-hdr">Comments</div>'
      + '<div id="tc-comments-list-' + eventId + '"></div>' + Comments.formHtml(eventId) + "</div>";
    await Comments.load(eventId);
    if (LB_OPEN !== eventId) return;
    $("ln-lb-under").classList.remove("loading");
  } catch (e) {
    console.error("clinic lightbox load error:", e);
    if (LB_OPEN === eventId) {
      cmts.innerHTML = '<div class="ln-lb-loading">Comments could not load.</div>';
      $("ln-lb-under").classList.remove("loading");
    }
  }
}

async function openPost(postId) {
  if (window.Comments && Comments.useSource) Comments.useSource(LB_SRC_POST);
  const p = FEED[postId];
  if (!p) { location.href = "/content-feed.html?post=" + encodeURIComponent(postId); return; }

  const media = $("ln-lb-media"), body = $("ln-lb-body"), cmts = $("ln-lb-cmts");

  /* Open FIRST. The media needs nothing from the server, so it can play straight
     away; only the reaction tally and the comments have to be fetched, and those
     show a loader rather than an empty box. */
  body.innerHTML = PostView.bodyHtml(p);
  media.innerHTML = "";
  const hoisted = body.querySelector(".cf-yt-thumb, .cf-yt-embed, .cf-post-media");
  if (hoisted) media.appendChild(hoisted);
  const embed = PostView.embedHtml(p);
  if (embed) media.innerHTML = embed;
  /* A YouTube post carries autoplay in its embed URL, so it starts on its own.
     A clinic is a mux-player, which is a custom element: calling play() on it
     the instant it is written into the DOM happens before it has upgraded, so
     the call was landing on nothing and the replay just sat there. Ask for
     autoplay on the element, which it honours whenever it becomes ready, and
     try again on the first event that says it can actually start. */
  media.querySelectorAll("mux-player, video").forEach(v => {
    v.setAttribute("autoplay", "");
    const go = () => { try { const r = v.play(); if (r && r.catch) r.catch(() => {}); } catch (err) {} };
    go();
    v.addEventListener("loadedmetadata", go, { once: true });
    v.addEventListener("canplay", go, { once: true });
  });
  cmts.innerHTML = "";
  const qaReset = $("ln-lb-qa"); if (qaReset) qaReset.innerHTML = "";
  $("ln-lb-under").classList.add("loading");    // one spinner, nothing showing yet

  LB_OPEN = postId;
  wireLbDrag();
  addLbDragZone();
  $("ln-lb").classList.remove("closing");
  $("ln-lb").classList.add("open");
  document.body.style.overflow = "hidden";
  history.pushState({ lb: postId }, "", "?post=" + encodeURIComponent(postId));

  /* Filed as what it is: a clinic is indexed by its event, everything else by
     its own reference. */
  const evId  = CLINIC_EVENT_BY_POST[postId];
  const vType = evId ? "clinic" : "video";
  const vRef  = evId || p.youtube_id || postId;
  PostView.trackMedia(media, vType, vRef);
  PostView.recordView(vType, vRef, 0, false);

  /* Now fill in what needed a round trip. */
  try {
    const [polls, cmtRows, likes] = await Promise.all([
      db.from("content_feed_post_polls").select("id,post_id,question").eq("post_id", postId),
      db.from("content_feed_comments").select("post_id").eq("post_id", postId),
      db.from("content_feed_likes").select("email").eq("post_id", postId),
    ]);
    if (LB_OPEN !== postId) return;                  // they closed it, or opened another
    p.commentCount = (cmtRows.data || []).length;

    const emails = [...new Set((likes.data || []).map(l => l.email))];
    p._likers = emails;
    if (emails.length) {
      const who = await db.from("allowed_emails").select("email,avatar_url,name").in("email", emails.slice(0, 40));
      p._likerInfo = Object.fromEntries((who.data || []).map(r => [r.email, r]));
    }

    const pr = (polls.data || [])[0];
    if (pr) {
      const [opts, votes, mine] = await Promise.all([
        db.from("content_feed_post_poll_options").select("id,poll_id,label,position").eq("poll_id", pr.id).order("position"),
        db.from("content_feed_post_poll_votes").select("poll_id,option_id,email").eq("poll_id", pr.id),
        db.from("content_feed_post_poll_votes").select("poll_id,option_id").eq("poll_id", pr.id).eq("email", myEmail),
      ]);
      const counts = {}; let total = 0;
      (votes.data || []).forEach(v => { counts[v.option_id] = (counts[v.option_id] || 0) + 1; total++; });
      p.poll = { id: pr.id, question: pr.question, options: opts.data || [],
                 voteCounts: counts, totalVotes: total,
                 myVote: (mine.data || [])[0] ? (mine.data || [])[0].option_id : null };
    }

    /* Only a clinic has these, and a failure to find them must never keep the
       panel from opening, so it resolves to nothing rather than throwing. */
    const qa = evId && window.ClinicQA ? await ClinicQA.load(db, evId) : null;

    await Comments.loadReactions([postId]);
    if (LB_OPEN !== postId) return;

    // Build the whole panel while it is still hidden, including the comment list,
    // so it appears complete rather than assembling itself on screen.
    body.innerHTML = PostView.bodyHtml(p);
    body.querySelectorAll(".cf-yt-thumb, .cf-yt-embed, .cf-post-media").forEach(el => el.remove());
    const cc = p.commentCount || 0;
    body.insertAdjacentHTML("beforeend",
      '<div class="ln-lb-meta">' + Comments.reactBtnHtml(postId, "ln_lb_" + postId.replace(/-/g, "_"))
      + likerChips(p)
      + '<span class="ln-lb-count">' + (cc ? cc + " comment" + (cc === 1 ? "" : "s") : "No comments yet") + "</span>"
      + "</div>");

    /* Rendered with the rest of the panel, so it appears complete rather than
       arriving after it. Seeks the player that is actually on screen. */
    const qaEl = $("ln-lb-qa");
    qaEl.innerHTML = qa ? ClinicQA.html(qa) : "";
    if (qa && !qaEl.dataset.wired) {
      qaEl.dataset.wired = "1";
      ClinicQA.wire(qaEl, secs => {
        const pl = media.querySelector("mux-player, video");
        if (!pl) return;
        try { pl.currentTime = secs; pl.play(); } catch (err) {}
        media.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }

    cmts.innerHTML = '<div class="tc-comments-section">'
      + '<div id="tc-comments-hdr-' + postId + '" class="tc-comments-hdr">Comments</div>'
      + '<div id="tc-comments-list-' + postId + '"></div>' + Comments.formHtml(postId) + "</div>";
    await Comments.load(postId);                 // wait for the list, not just the shell
    if (LB_OPEN !== postId) return;
    $("ln-lb-under").classList.remove("loading");
  } catch (e) {
    console.error("lightbox load error:", e);
    if (LB_OPEN === postId) {
      cmts.innerHTML = '<div class="ln-lb-loading">Comments could not load.</div>';
      $("ln-lb-under").classList.remove("loading");
    }
  }
}

function closePost(fromPop) {
  if (!LB_OPEN) return;
  const lb = $("ln-lb");
  PostView.pauseVideosIn("#ln-lb", LB_OPEN);      // stop the audio immediately
  LB_OPEN = null;
  document.body.style.overflow = "";
  if (!fromPop) history.pushState({}, "", location.pathname);

  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const done = () => {
    lb.classList.remove("open", "closing", "ln-lb-dragged");
    const inner = lb.querySelector(".ln-lb-in");
    if (inner) { inner.style.transition = ""; inner.style.transform = ""; }
    lb.style.background = "";
    $("ln-lb-media").innerHTML = ""; $("ln-lb-body").innerHTML = ""; $("ln-lb-cmts").innerHTML = "";
    $("ln-lb-under").classList.add("loading");
  };
  if (reduced) return done();
  lb.classList.add("closing");
  setTimeout(done, 310);                          // matches ln-lb-down
}

/* Drag down to dismiss, the way a sheet behaves everywhere else on a phone.
   Only from the top of the panel and only downward, so scrolling the comments
   is never mistaken for a dismiss: the gesture is ignored unless the panel is
   already scrolled to the top and the finger is moving mostly vertically. It
   follows the finger, and lets go past a quarter of the screen or on a flick. */
/* Closing empties the media, which takes the drag strip with it, so it is put
   back on every open. The listeners below are bound once; this is not. */
function addLbDragZone() {
  const media = document.getElementById("ln-lb-media");
  if (!media || media.querySelector(".ln-lb-dragzone")) return;
  const z = document.createElement("div");
  z.className = "ln-lb-dragzone";
  z.setAttribute("aria-hidden", "true");
  media.appendChild(z);
}

/* A rail that has more behind it grows as you reach the end of it, rather than
   stopping at an arbitrary fourteen. Everything is already in memory, so this
   is a render and not a request, and it fires a screen ahead so the cards are
   there before the scroll arrives at them. */
function wireRailGrowth() {
  document.querySelectorAll(".ln-rail[data-more]").forEach(rail => {
    if (rail.dataset.wired) return;
    rail.dataset.wired = "1";
    const grow = () => {
      const spec = RAIL_MORE[rail.dataset.more];
      if (!spec) return;
      const shown = Number(rail.dataset.shown || 0);
      if (shown >= spec.all.length) return;
      if (rail.scrollLeft + rail.clientWidth < rail.scrollWidth - rail.clientWidth) return;
      const next = spec.all.slice(shown, shown + 12);
      if (!next.length) return;
      rail.insertAdjacentHTML("beforeend",
        next.map(it => spec.opts.course ? courseCard(it) : card(it, spec.opts)).join(""));
      rail.dataset.shown = String(shown + next.length);
      fixShortThumbs();                       // the new cards need their stills too
    };
    rail.addEventListener("scroll", grow, { passive: true });
    grow();                                   // a wide screen may already be at the end
  });
}

function wireLbDrag() {
  const lb = document.getElementById("ln-lb");
  const inner = lb && lb.querySelector(".ln-lb-in");
  if (!lb || !inner || lb.dataset.drag) return;
  lb.dataset.drag = "1";

  /* A handle, because most of the top of this panel is the video, and a video
     is the one place a drag cannot start: a cross-origin YouTube frame keeps
     its own touches, so the gesture never reaches this page at all. The bar
     sits above the media, is always draggable, and says the panel can be
     pulled away. Dragging the white panel below still works too. */
  let grab = inner.querySelector(".ln-lb-grab");
  if (!grab) {
    grab = document.createElement("div");
    grab.className = "ln-lb-grab";
    grab.setAttribute("aria-hidden", "true");
    inner.insertBefore(grab, inner.firstChild);
  }

  let y0 = 0, x0 = 0, dy = 0, t0 = 0, live = false, decided = false;

  const start = e => {
    if (!LB_OPEN || e.touches.length !== 1) return;
    // Anywhere below the top of the scroller is reading, not dismissing.
    if (lb.scrollTop > 0 && !e.target.closest(".ln-lb-grab, .ln-lb-dragzone")) return;
    const t = e.touches[0];
    y0 = t.clientY; x0 = t.clientX; dy = 0; t0 = Date.now();
    live = true; decided = false;
  };

  const move = e => {
    if (!live || e.touches.length !== 1) return;
    const t = e.touches[0];
    const dx = t.clientX - x0;
    dy = t.clientY - y0;
    if (!decided) {
      if (Math.abs(dy) < 6 && Math.abs(dx) < 6) return;      // not a gesture yet
      if (dy <= 0 || Math.abs(dx) > Math.abs(dy)) { live = false; return; }
      decided = true;
    }
    /* Not passive, so the browser can be told to stop scrolling and rubber
       banding underneath: without this it fights the transform and the panel
       appears not to move at all. */
    if (e.cancelable) e.preventDefault();
    inner.style.transition = "none";
    inner.style.transform = "translateY(" + dy + "px)";
    lb.style.background = "rgba(11,11,14," + Math.max(0.3, 0.92 - dy / 900) + ")";
  };

  const release = () => {
    if (!live) return;
    const wasDragging = decided;
    live = false; decided = false;
    lb.style.background = "";
    if (!wasDragging) { inner.style.transform = ""; return; }
    const quick = Date.now() - t0 < 300 && dy > 60;
    if (dy > window.innerHeight * 0.22 || quick) {
      /* Carries on from where the finger left it rather than snapping back to
         the top and then playing the close animation. */
      lb.classList.add("ln-lb-dragged");
      inner.style.transition = "transform .26s cubic-bezier(.4,0,.7,.35)";
      inner.style.transform = "translateY(100%)";
      closePost();
    } else {
      inner.style.transition = "transform .22s ease";
      inner.style.transform = "";                 // not far enough, settle back
    }
  };

  lb.addEventListener("touchstart", start, { passive: true });
  lb.addEventListener("touchmove", move, { passive: false });
  lb.addEventListener("touchend", release, { passive: true });
  lb.addEventListener("touchcancel", release, { passive: true });
}


/* The row of things that might actually help, and the picked hero slides.
   Deliberately separate from load(): see the note at its call site. */
async function loadPicks() {
  /* One call. The retry existed because these views return nothing to an
     unauthenticated caller, so issued too early the row silently never
     appeared - but this is now started from inside load(), which only runs
     once the session is attached and myEmail is set, so there is no window
     where it can fire early.

     Retrying on an empty result also punished exactly the wrong people: 25 of
     the 101 members have no symptom signals at all and 24 have never logged a
     session, so an empty result is the correct answer for them, and they were
     paying for the slowest query on the page twice over to be told so. */
  const picks = await db.rpc("picks_for", { em: myEmail, n: 14 });
  let pk = (picks && picks.data) || [];
  if (pk.length) {
    const byHref = {};
    ITEMS.forEach(i => { byHref[i.href] = i; if (i.altHref) byHref[i.altHref] = i; });
    PICK_SHORTS = pk.filter(r => r.fmt === "short").map(r => Object.assign({},
      byHref[r.href] || { type:"video", title:r.title, href:r.href, meta:"" },
      { topic:r.topic, vertical:true })).filter(Boolean);
    pk = pk.filter(r => r.fmt !== "short");
    PICKS = pk.map(r => Object.assign({}, byHref[r.href] || {
      type: r.content_type === "mmt" ? "article" : r.content_type === "theory_sheet" ? "sheet"
          : r.content_type === "lesson" ? "course" : r.content_type,
      title: r.title, href: r.href, meta: "" },
      /* topic becomes the reason it was picked, which is what the card says.
         The article's own category has to survive that, because the book takes
         its colour and its letter from the category, not from the reason. */
      { topic: r.topic, cat: (byHref[r.href] || {}).topic })).filter(Boolean);
    /* Each card names the problem it answers, so a sub-line listing them again
       only wrapped onto two lines and said the same thing twice. */
    PICK_WHY = "For you";
    PICK_SUB = "";
  }

  render();          // fill in what the first paint could not know
}

/* ── render ─────────────────────────────────────────────────────────────────── */
function render() {
  /* onlyEx is deliberately not in here. Searching or picking a type gives a
     flat grid of results; Practice Room exclusives is not a search, it is this
     same page with the public material taken out, so it keeps its rows and the
     order they come in. */
  const browsing = !!(term || type || topic || symptom);
  const pool = onlyEx ? ITEMS.filter(i => i.only) : ITEMS;
  // Counts follow the pool, so a row's subtitle tells the truth in both views.
  const counts = {}; pool.forEach(i => counts[i.type] = (counts[i.type] || 0) + 1);
  const flat = pool.filter(i => !i.vertical);
  /* The hero is built from the whole library, never from the filtered pool.
     Built from the pool, its Latest slide became the newest exclusive rather
     than the newest thing, so the hero changed when the filter did and had to
     be rebuilt: the very thing it is kept out of the re-render to avoid. */
  const everyone = ITEMS.filter(i => !i.vertical);
  const next = CONTINUE.find(c => c.k === "Next clinic");
  const resume = CONTINUE.filter(c => c.k !== "Next clinic");

  // What we want them to do next: the clinic if it is close, otherwise the
  // course they are part way through, otherwise the newest thing published.
  const soon = next && CONTINUE.find(c => c.k === "Next clinic");
  let carry = resume[0];
  /* ?heroplate=1 — a look at the one non-video slide the hero can produce.
     A course you are part way through that has no video of its own falls back
     to a plate in the course's own colour, and you only see it if the course
     you happen to be on has no video. This forces it so it can be judged.
     Remove once that decision is made. */
  if (new URLSearchParams(location.search).get("heroplate")) {
    const noVid = COURSES.find(c => c.key && !c.thumbId);
    if (noVid) carry = { k:"Course", t:noVid.label, m:"4 of " + (noVid.n || 33) + " lessons",
      href:"/courses.html?course=" + noVid.key, mux:null, muxTime:0,
      colour:noVid.color, icon:noVid.icon };
  }
  /* A sheet or an article has no thumbnail, which used to rule it out of the
     hero entirely: the newest thing in the library could be a Monday Music Tips
     article and the hero would silently show the newest video instead. They
     take a plate, the same treatment a course without a video takes. Their
     covers are deliberately not used: the title is set into that artwork, so it
     would appear twice with the headline over the top. */
  const heroPlate = it => {
    if (!it) return null;
    if (it.type === "sheet")
      // the tile stays - it is Learn's own plate - and the book stands in it
      return { colour: ppdCatColour(it.cat || it.topic), icon: MARK.sheet };
    if (it.type === "article")
      return { colour: mmtLight(it.bg), icon: MARK.article, wash: it.bg };
    return null;
  };
  const fresh = everyone.filter(i => i.img || heroPlate(i)).sort(byDate)[0];
  const lastClinic = everyone.filter(i => i.type === "clinic" && i.img).sort(byDate)[0];
  /* The hero rotates rather than showing one thing: the clinic, the newest
     piece, and whatever is most relevant to this member. One slot, three jobs,
     instead of three competing blocks down the page. */
  /* Every still on the page is sized for a card: 320px from YouTube, 480 from
     Mux. Across a full-bleed hero they turn to mush, so both are asked for
     again at full size. Rewriting the Mux width keeps its own crop and time. */
  const bigStill = u => !u ? ""
    : u.replace(/width=\d+/, "width=1600").replace(/height=\d+/, "height=900");
  const heroImg = it => !it ? "" : (it.yt
    ? "https://i.ytimg.com/vi/" + it.yt + "/maxresdefault.jpg" : bigStill(it.img));
  /* Six slides, the same six for everyone: the clinic, the course, a video
     picked for you, the newest video, a Monday Music Tips article and a Piano
     Practice Daily sheet. Every content type gets a place rather than competing
     for one, which is what used to leave sheets and articles out of the hero
     altogether whenever a video outranked them.
     Each is a recommendation where the engine has one and the most recent of
     that type where it does not, so the carousel is the same shape for a member
     it knows nothing about as for one it knows well. */
  const slides = [];
  const used = new Set();
  const pickOf = t => PICKS.find(p => p.type === t && !used.has(p.href) && (p.img || heroPlate(p)));
  const newestOf = t => everyone.filter(i => i.type === t && !used.has(i.href) && (i.img || heroPlate(i)))
    .sort(byDate)[0];
  const take = it => { if (it) used.add(it.href); return it; };
  const ctaFor = it => it.type === "sheet" || it.type === "article" ? "Read it" : "Watch now";
  const mediaOf = it => ({ img:heroImg(it), yt:it.yt, mux:it.mux,
                           plate:it.img ? null : heroPlate(it) });

  // 1. the clinic
  if (soon) slides.push({ kick:"Next live clinic", title:soon.t, when:soon.m,
    blurb:"A live session working through one topic. It becomes a replay here afterwards.",
    href:soon.href, img:heroImg(lastClinic || fresh), go:"RSVP", mux:(lastClinic || {}).mux,
    go2:lastClinic ? { label:"Watch the last one", href:lastClinic.href } : null });
  else if (lastClinic) slides.push({ kick:"Latest clinic replay", title:lastClinic.title,
    when:lastClinic.meta, blurb:"An hour working through one topic, with the questions answered.",
    href:lastClinic.href, ...mediaOf(lastClinic), go:"Watch now" });

  // 2. the course
  if (carry) slides.push({ kick:"Pick up where you left off", title:carry.t, when:carry.m,
    blurb:"You are part way through this one.", href:carry.href, go:"Continue",
    img: carry.mux ? "https://image.mux.com/" + carry.mux
        + "/thumbnail.webp?width=1600&height=900&fit_mode=smartcrop&time=" + (carry.muxTime || 0) : "",
    mux: carry.mux,
    /* A course with no video of its own gets its own plate, in its own colour,
       so it still looks like that course and not like a missing image. */
    plate: carry.mux ? null : { colour:carry.colour, icon:carry.icon } });
  else {
    /* Nothing started yet, so the course slot offers one rather than going
       missing: this is the answer to "where do I begin". */
    const c0 = COURSES.find(c => c.key);
    if (c0) slides.push({ kick:"Start a course", title:c0.label, when:(c0.n || 0) + " lessons",
      blurb:c0.blurb || "Start at the beginning and work through it.",
      href:"/courses.html?course=" + c0.key, go:"Start",
      img: c0.thumbId ? "https://image.mux.com/" + c0.thumbId
          + "/thumbnail.webp?width=1600&height=900&fit_mode=smartcrop&time=" + (c0.thumbTime || 0) : "",
      mux: c0.thumbId || null,
      plate: c0.thumbId ? null : { colour:c0.color, icon:c0.icon } });
  }

  // 3-6. one of each kind: picked where we can, newest where we cannot
  const forYou = take(pickOf("video") || newestOf("video"));
  if (forYou) slides.push({ kick:"For you", title:forYou.title, when:forYou.meta || "",
    blurb:forYou.topic ? "Picked because you have been working on " + forYou.topic + "."
                       : "Picked for what you have been working on.",
    href:forYou.href, ...mediaOf(forYou), go:"Watch now" });

  const newest = take(newestOf("video"));
  if (newest) slides.push({ kick:"Latest", title:newest.title, when:newest.meta,
    blurb:"The newest thing in the library.", href:newest.href,
    ...mediaOf(newest), go:"Watch now" });

  const tip = take(pickOf("article") || newestOf("article"));
  if (tip) slides.push({ kick:"Monday Music Tips", title:tip.title, when:tip.meta || "",
    blurb:tip.topic ? "Picked because you have been working on " + tip.topic + "."
                    : "A short read on how playing actually works.",
    href:tip.href, ...mediaOf(tip), go:"Read it" });

  const ppd = take(pickOf("sheet") || newestOf("sheet"));
  if (ppd) slides.push({ kick:"Piano Practice Daily", title:ppd.title, when:ppd.meta || "",
    blurb:ppd.topic ? "Picked because you have been working on " + ppd.topic + "."

  const slideHtml = b =>

  const lessons = COURSES.filter(c => c.key).reduce((a, c) => a + (c.n || 0), 0);
  const segHtml =

    + 'Practice Room exclusives<span class="ln-fn">'
    + (ITEMS.filter(i => i.only).length + lessons) + "</span></button>"
    + "</div>";

  /* The stat line was repeated inside every slide, and says the same thing on
     all of them, so it belongs to the hero rather than to a slide. As the
     hero's own foot it also gives the filter an obvious home: the line already
     names the content types, and the control says which set of them you are
     looking at. Counted off the whole library, never the filtered pool. */
  const libAll = {};
  ITEMS.forEach(i => libAll[i.type] = (libAll[i.type] || 0) + 1);
  const footHtml =
    '<div class="ln-bb-foot"><span class="ln-bb-lib">'
    + "<span><b>" + (libAll.video || 0) + "</b> videos</span>"
    + "<span><b>" + (libAll.clinic || 0) + "</b> clinic replays</span>"
    /* One count, not two. Piano Practice Daily and Monday Music Tips are both

    + "<span><b>" + ((libAll.sheet || 0) + (libAll.article || 0)) + "</b> articles</span>"

  let html = "";


  if (browsing) {

      + (symptom ? " for \u201c" + esc((VOCAB.find(v => v.id === symptom) || {}).label || symptom) + "\u201d" : "")

    html += shown.length

        + (!showAll && list.length > shown.length

      .map(i => { seen.add(i.href); return i; });

    const category = (pred, n) => flat.filter(pred).sort(byDate).slice(0, n);

      if (!onlyEx && PICKS.length >= 3)

    /* For you and Recently added are both about the whole library rather than

    }

    html += row(onlyEx ? "Courses" : "Paths",
                onlyEx ? COURSES.filter(c => c.key).reduce((a, c) => a + (c.n || 0), 0)
                         + " lessons across " + COURSES.filter(c => c.key).length + " courses"

    const allClinics = flat.filter(i => i.type === "clinic").sort(byDate);

    const allVideos = flat.filter(i => i.type === "video").sort(byDate);

      { seeAll:"video", all:allVideos });
    // Topic rows are deliberately absent. A topic like pedalling should gather a

    // Daily carries a category today, so a "topic" row here would in fact be a
    // Piano Practice Daily row wearing a topic's name. They return with tagging.
    const allSheets = flat.filter(i => i.type === "sheet").sort(byDate);
    html += row("Piano Practice Daily", (counts.sheet || 0) + " sheets", allSheets.slice(0, 14),
      { seeAll:"sheet", all:allSheets });
    const allArticles = flat.filter(i => i.type === "article").sort(byDate);
    html += row("Monday Music Tips", (counts.article || 0) + " articles", allArticles.slice(0, 14),
      { seeAll:"article", all:allArticles });
    const allShorts = pool.filter(i => i.vertical).sort(byDate);
    html += row("Shorts", "a minute or two each", allShorts.slice(0, 24),
      { vertical:true, all:allShorts });
    html += everything(pool);
  }

  /* The hero is kept out of the rows and replaced only when it would actually
     differ. Rebuilding it on every render restarted the carousel and killed
     whatever was playing, so filtering the library below it threw the hero
     back to its first slide and its still. Nothing about the hero depends on
     the filter, so pressing a filter should leave it alone. */
  const root = $("ln-root");
  let rows = document.getElementById("ln-rows");
  if (!rows) {
    root.innerHTML = '<div id="ln-hero"></div><div id="ln-rows"></div>';
    rows = document.getElementById("ln-rows");
  }
  /* Compared on the slides, not on the markup. The markup carries which slide
     is currently showing, so it differs the moment the carousel advances, and
     comparing it rebuilt the hero anyway. What matters is whether the slides
     themselves changed, which happens once, when the picks arrive. */
  const heroSig = slides.map(b => b.kick + "|" + b.href + "|" + b.img).join("~");
  const heroChanged = heroSig !== LAST_HERO;
  if (heroChanged) {
    document.getElementById("ln-hero").innerHTML = heroHtml;
    LAST_HERO = heroSig;
  }

  wire(heroChanged);
  wireRailGrowth();
  fixShortThumbs();

/* What the hero was last built from, so it is rebuilt only when it differs. */
let LAST_HERO = "";

/* Netflix-style: the billboard still becomes a short silent loop once it is
   ready. Mux serves animated webp straight from the playback id, so there is no
   player and no sound; if it fails the still simply stays. */
const SHORT_THUMBS = ["oardefault", "oar2", "frame0", "hq720"];
function fixShortThumbs() {
  document.querySelectorAll("img[data-yt]").forEach(img => {
    const check = () => {
      // YouTube serves a 120x90 grey card when the requested still does not
      // exist. It loads fine, so onerror never fires and the card looks empty.
      if (img.naturalWidth > 200) return;
      const n = Number(img.dataset.try || 0) + 1;
      if (n >= SHORT_THUMBS.length) return;
      img.dataset.try = n;
      img.src = "https://i.ytimg.com/vi/" + img.dataset.yt + "/" + SHORT_THUMBS[n] + ".jpg";
    };
    if (img.complete && img.naturalWidth) check();
    img.addEventListener("load", check);
  });
}

/* Rotation. Pauses while the pointer is over it, and does not auto-advance for
   anyone who has asked for reduced motion. */
function wireCarousel() {
  const bb = document.getElementById("ln-bb");
  if (BB_TIMER) { clearInterval(BB_TIMER); BB_TIMER = null; }
  if (!bb) return;
  const slides = [...bb.querySelectorAll(".ln-bb-slide")];
  const dots   = [...bb.querySelectorAll(".ln-bb-dot")];
  if (slides.length < 2) return;

  const show = n => {
    BB_AT = (n + slides.length) % slides.length;
    slides.forEach((sl, i) => sl.classList.toggle("on", i === BB_AT));
    dots.forEach((d, i) => d.classList.toggle("on", i === BB_AT));
    billboardMotion();
  };
  dots.forEach(d => d.onclick = e => {
    e.stopPropagation();
    show(Number(d.dataset.slide));
    start();                                    // a manual pick resets the clock
  });

  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  /* A still has said what it has to say in a few seconds. A slide that is
     playing has spent most of that getting the video up: a YouTube one cannot
     be shown for four seconds while its chrome clears, and then there is the
     cross-fade. Seven seconds would leave about two of actual video, so a slide
     that is playing keeps the hero for longer. Checked as it goes rather than
     fixed up front, because when the slide arrives it is not playing yet. */
  const DWELL_STILL = 7000, DWELL_PLAYING = 16000;
  function start() {
    if (BB_TIMER) clearInterval(BB_TIMER);
    if (reduced) return;
    let waited = 0;
    BB_TIMER = setInterval(() => {
      waited += 1000;
      const on = bb.querySelector(".ln-bb-slide.on");
      const need = on && on.querySelector(".ln-bb-vid.ready") ? DWELL_PLAYING : DWELL_STILL;
      if (waited >= need) { waited = 0; show(BB_AT + 1); }
    }, 1000);
  }
  bb.addEventListener("mouseenter", () => { if (BB_TIMER) clearInterval(BB_TIMER); });
  bb.addEventListener("mouseleave", start);
  start();
}

/* Once moving picture starts, the hero settles into the video's own 16:9 so
   nothing is cropped. It grows ONCE and stays there for the rest of the visit,
   so the height still never changes from slide to slide: a slide with no video
   simply fills the taller frame with its still. Phones keep the compact hero,
   where 16:9 would leave no room for the title. */
/* The first slide's video is fetched while the loading screen is still up, so
   the page opens on something ready to move rather than on a still that jumps a
   second later. Capped, so a slow video never holds the page hostage. */
/* How long the still is held before the video takes over. One number, used
   both when a slide is switched to and when the page first appears, or the
   first slide gets a different hold from every slide after it. */
const BB_HOLD = 1200;
let BB_GO = null, BB_REVEALED = false;
const BB_PENDING = [];
/* How long the page will wait for the hero's first frame before opening on
   the still instead. It was 2,500ms, and measured it never once won: the
   video is not ready until about 6.5s, so the wait always ran to the cap
   and simply held a finished page back by more than a second. 700ms is
   enough for a warm or cached one to make it; anything slower fades in
   afterwards, which is what the hero already does. */
const BB_FIRST = new Promise(res => { BB_GO = res; setTimeout(res, 700); });
/* A YouTube slide cannot be shown for four seconds after it starts and the
   loading screen will not wait that long, so it reveals mid-wait and the
   cross-fade happens on the live page. A Mux slide has no such wait. */

/* Ready during the hold means wait: the settle into 16:9 is worth seeing, and
   it cannot be seen behind a loading screen. */
function bbShow(el) {
  if (!el || !el.isConnected) return;
  if (BB_GO) { BB_GO(); }
  if (!BB_REVEALED) { BB_PENDING.push(el); return; }
  bbExpand(); el.classList.add("ready");
}
function bbReveal() {
  BB_REVEALED = true;
  setTimeout(() => BB_PENDING.splice(0).forEach(el => {
    if (el.isConnected) { bbExpand(); el.classList.add("ready"); }
  }), BB_HOLD);                               // the still holds, then the video
}

function bbExpand() {
  const bb = document.getElementById("ln-bb");
  if (!bb || bb.dataset.tall || window.innerWidth <= 640) return;
  const from = bb.clientHeight, to = Math.round(bb.clientWidth * 9 / 16);
  if (to <= from + 8) return;
  bb.dataset.tall = "1";
  // Growing under somebody who has scrolled past would shove the page down, so
  // off-screen it happens instantly and the scroll position absorbs it.
  const away = window.scrollY > 60;
  if (away) bb.style.transition = "none";
  bb.style.setProperty("--bbh", to + "px");
  if (away) {
    window.scrollBy(0, to - from);
    requestAnimationFrame(() => { bb.style.transition = ""; });
  }
}

function billboardMotion() {
  /* The ACTIVE slide's still, not simply the first on the page. */
  const img = document.querySelector(".ln-bb-slide.on .ln-bb-img img[data-mux], "
    + ".ln-bb-slide.on .ln-bb-img img[data-yt]");
  document.querySelectorAll(".ln-bb-slide:not(.on) .ln-bb-img img").forEach(o => {
    if (o.dataset.still) o.src = o.dataset.still;       // put the resting slides back to a still
  });
  document.querySelectorAll(".ln-bb-slide:not(.on) .ln-bb-vid").forEach(f => f.remove());
  const nothingToWaitFor = () => { if (BB_GO) BB_GO(); };
  if (!img) return nothingToWaitFor();
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return nothingToWaitFor();
  // Runs on a phone too, but the phone gets to say no: Data Saver, or a
  // connection the browser reports as 2g, and it stays a still.
  const net = navigator.connection || {};
  if (net.saveData) return nothingToWaitFor();
  if (/(^|-)2g$/.test(net.effectiveType || "")) return nothingToWaitFor();
  if (!img.dataset.still) img.dataset.still = img.src;   // remember the still to return to
  const wrap = img.closest(".ln-bb-img");
  if (!wrap || wrap.querySelector(".ln-bb-vid")) return;

  /* Same shape either way: the still lands, then the slide plays its own video
     muted, without controls, not clickable, and only while you are on it. The
     very first one starts straight away, because the loading screen is holding
     for it; later slides let their still land first. */
  /* The two sources do not get the same treatment, because they do not have
     the same problem. Mux is our own player with its chrome switched off, so
     there is nothing to hide from and nothing to wait out. YouTube has to run
     unseen until its chrome clears, which is the only reason any of the
     waiting exists: it must not leak onto the slides that never needed it. */
  const attach = (build, delay, backstop) => {
    const go = () => {
      if (!wrap.closest(".ln-bb-slide").classList.contains("on")) return nothingToWaitFor();
      if (wrap.querySelector(".ln-bb-vid")) return;
      const el = build(el0 => bbShow(el0));
      wrap.appendChild(el);
      if (backstop) setTimeout(() => bbShow(el), backstop);
    };
    if (delay) setTimeout(go, delay); else go();
  };
  /* Mux: the still lands and holds, then it plays, and however it reports
     itself ready it never hangs, because a backstop shows it anyway. Its
     chrome is already off, so no state of it is wrong to show. The hold is
     the same on the first slide as on every other one; it used to be skipped
     on first load, which is why the opening slide had no hold at all. */
  const playMux = build => attach(build, BB_HOLD, 2600);
  /* YouTube: attached at once, since it is invisible behind the still either
     way and every moment it is not loading is taken off the head start it
     needs. No backstop, ever: a timer that shows the player regardless is a
     timer that shows the play button, because the one state that must never
     be revealed is the one before playback starts. If it never reports itself
     playing the slide stays on its still, which beats somebody else's play
     button. The page cannot hang on that; the loading gate has its own
     timeout. */
  const playYt = build => attach(build, 0, 0);

  if (img.dataset.mux) return playMux(ready => {
    const m = document.createElement("mux-player");
    m.addEventListener("playing", () => ready(m), { once:true });
    m.className = "ln-bb-vid ln-bb-mux";
    m.setAttribute("playback-id", img.dataset.mux);
    m.setAttribute("stream-type", "on-demand");
    m.setAttribute("autoplay", "muted");
    m.setAttribute("muted", "");
    m.setAttribute("loop", "");
    m.setAttribute("playsinline", "");
    m.setAttribute("nohotkeys", "");
    m.setAttribute("tabindex", "-1");
    m.setAttribute("start-time", "20");
    return m;
  });

  /* YouTube, played behind the still until its own chrome has gone.
     The embed cannot be told to drop its chrome: modestbranding and showinfo
     are deprecated, and hiding the iframe hides the picture with it. What it
     does do is autohide, about three seconds after playback starts. So the
     video runs where it cannot be seen for that long, and only then does the
     still cross-fade to it. controls=0 means the bottom bar never draws, and
     pointer-events:none means nothing can bring the chrome back by hovering. */
  if (img.dataset.yt) return playYt(ready => {
    const id = img.dataset.yt;
    const f = document.createElement("iframe");
    f.className = "ln-bb-vid ln-bb-yt";
    f.allow = "autoplay; encrypted-media";
    f.setAttribute("tabindex", "-1");
    f.src = "https://www.youtube.com/embed/" + encodeURIComponent(id)
      + "?autoplay=1&mute=1&controls=0&loop=1&playsinline=1&modestbranding=1&rel=0&disablekb=1"
      + "&iv_load_policy=3&fs=0&cc_load_policy=0&enablejsapi=1&origin=" + encodeURIComponent(location.origin)
      + "&start=" + YT_START + "&playlist=" + encodeURIComponent(id);
    /* The embed reports on itself once asked: enablejsapi plus a `listening`
       handshake, and it posts back both state changes and a running position.
       The position is what we key off, because it is the one signal that
       cannot lie about whether the video is really moving: once it has passed
       four seconds beyond where we told it to start, playback has genuinely
       run that long and the chrome has autohidden. A state change alone would
       fire the moment it says "playing", which is before the title strip has
       gone anywhere. */
    let seen = null, advanced = 0;
    const onMsg = e => {
      let host = ""; try { host = new URL(e.origin).hostname; } catch (x) { return; }
      if (!/(^|\.)youtube(-nocookie)?\.com$/.test(host)) return;
      let d; try { d = JSON.parse(e.data); } catch (x) { return; }
      const t = d && d.info && typeof d.info.currentTime === "number" ? d.info.currentTime : null;
      if (t === null) return;
      /* A single position reading can be reported without the video moving: a
         phone that refuses to autoplay still answers with a position, which is
         how a stopped player with its play button showing came to be revealed.
         Movement cannot be faked, so the reveal waits for the position to
         actually advance, several times, and to have run past the point where
         the player hides its own chrome. */
      if (seen !== null && t > seen + 0.15) advanced++;
      seen = t;
      if (advanced < 3 || t < YT_START + YT_AUTOHIDE / 1000) return;
      window.removeEventListener("message", onMsg);
      ready(f);
    };
    window.addEventListener("message", onMsg);
    f.addEventListener("load", () => {
      try { f.contentWindow.postMessage(JSON.stringify({ event:"listening", id:"ln-bb" }), "*"); }
      catch (x) {}
    }, { once:true });
    return f;
  });
  nothingToWaitFor();
}

function wire(heroChanged) {
  document.querySelectorAll(".ln-bb-slide[data-href]").forEach(sl => {
    sl.onclick = e => {
      if (e.target.closest("a") || e.target.closest(".ln-bb-dot")) return;
      /* The button on top of the slide opens the post in place, because it is
         an anchor and the wiring below catches it. The picture behind it was
         a plain navigation, so clicking the slide itself - which is most of
         what there is to click - left the page for the feed. Same destination,
         two different behaviours on one tile. */
      const href = sl.dataset.href || "";
      if (href.startsWith("/content-feed.html?post=")) {
        openPost(decodeURIComponent(href.split("post=")[1] || ""));
        return;
      }
      location.href = href;
    };
  });
  if (heroChanged !== false) wireCarousel();
  /* Anything that points at a feed post opens in place instead of navigating.
     Bound once on the document rather than to each anchor as it is rendered:
     the cards are ours and got wired, but the command palette is built by the
     shared header long after this runs, so searching for a video and clicking
     the result left the page for the feed. Same video, different route, two
     different behaviours - which is exactly how it looked from the outside. */
  if (!window.__lnFeedClickWired) {
    window.__lnFeedClickWired = true;
    document.addEventListener("click", e => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;   // let people open a new tab
      /* Both spellings of the same destination. The palette sends videos to
         /learn.html?post= so they open here rather than on the feed page; when
         that link is clicked while already on Learn there is nothing to
         navigate to, so it opens the lightbox in place. */
      /* A clinic replay is the same panel fed from its event, so it is caught
         here too rather than being followed to the events page. */
      const c = e.target.closest('a[href^="/learn.html?clinic="]');
      if (c) {
        e.preventDefault();
        openClinic(decodeURIComponent(c.getAttribute("href").split("clinic=")[1] || ""));
        return;
      }
      const a = e.target.closest('a[href^="/content-feed.html?post="], a[href^="/learn.html?post="]');
      if (!a) return;
      e.preventDefault();
      openPost(decodeURIComponent(a.getAttribute("href").split("post=")[1] || ""));
    }, true);
  }
  const q = $("ln-q");
  if (q) q.oninput = e => { term = e.target.value; showAll = false; render(); const n = $("ln-q"); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } };
  const ty = $("ln-types");
  if (ty) ty.querySelectorAll(".ln-segb").forEach(b => b.onclick = () => {
    const want = b.dataset.ex === "1";
    if (want === onlyEx) return;                          // already there
    onlyEx = want; showAll = false;
    /* Updated in place. The control lives in the hero, which is not rebuilt,
       so the thumb simply transitions to its new position and nothing has to
       be staged around the render. */
    ty.dataset.at = want ? "1" : "0";
    ty.querySelectorAll(".ln-segb").forEach(x =>
      x.setAttribute("aria-pressed", String((x.dataset.ex === "1") === want)));
    swapView();
  });
  document.querySelectorAll("[data-see]").forEach(b => b.onclick = () => {
    const v = b.dataset.see;
    if (v.startsWith("topic:")) { topic = v.slice(6); type = ""; } else { type = v; topic = ""; }
    showAll = false; render(); window.scrollTo({ top:0, behavior:"smooth" });
  });
  const all = $("ln-all");   if (all) all.onclick = () => { showAll = true; render(); };
  const bs = $("ln-band");  if (bs) bs.onchange = e => { band = e.target.value; libShown = 24; render(); };
  const ts = $("ln-topic"); if (ts) ts.onchange = e => { libTopic = e.target.value; libShown = 24; render(); };
  const lm = $("ln-libmore");  if (lm) lm.onclick = () => { libShown += 24; render(); };
  const lc = $("ln-libclear"); if (lc) lc.onclick = () => { band = ""; libTopic = ""; libShown = 24; render(); };
  const clr = $("ln-clear"); if (clr) clr.onclick = () => { topic = type = term = symptom = ""; onlyEx = false; showAll = false; render(); };
}

/* Close on the cross, on the scrim, on Escape, and on Back. */
(function wireLightbox() {
  const lb = document.getElementById("ln-lb");
  if (!lb) return;
  const close = document.getElementById("ln-lb-close");
  if (close) close.onclick = () => closePost();
  lb.addEventListener("click", e => { if (e.target === lb) closePost(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && LB_OPEN) closePost(); });
  window.addEventListener("popstate", e => {
    const want = e.state && e.state.lb;
    if (LB_OPEN && !want) closePost(true);
    else if (want && want !== LB_OPEN) openPost(want);
  });
})();

/* Leaving the page while it is still booting - tapping Videos or Clinic replays
   before it has finished - freezes it into the back/forward cache mid-load.
   Coming back restores that exact frozen page: the loading screen still up, and
   promises whose requests died with the navigation, so nothing ever settles.
   The page then sits there until the suspended timeouts resume and fire, which
   is the "stuck on loading" when you go to a filtered tab and come back.
   A restored page that never finished booting is thrown away and loaded again. */
window.addEventListener("pageshow", e => {
  if (!e.persisted) return;
  const ls = document.getElementById("loading-screen");
  if (ls && getComputedStyle(ls).display !== "none") location.reload();
});

/* ── boot ───────────────────────────────────────────────────────────────────── */
(async function() {
  /* A watchdog over the whole boot. Three things here can wait forever with
     nothing on screen: getSession() while the auth client is refreshing a
     token, the allowed_emails lookup, and load() with its 26 queries - none of
     them has a timeout, so one stalled request leaves the spinner up
     indefinitely. That is not "waiting for everything to load", it is stuck,
     and it should say so rather than spin. Cleared at the reveal. */
  const stuck = setTimeout(() => {
    const ls = document.getElementById("loading-screen");
    if (!ls || ls.style.display === "none") return;
    ls.classList.add("centred");
    ls.innerHTML = '<div class="ln-stuck">'
      + '<p>This is taking longer than it should.</p>'
      + '<button type="button" id="ln-retry">Try again</button></div>';
    const r = document.getElementById("ln-retry");
    if (r) r.onclick = () => location.reload();
  }, 20000);
  window.__lnBootWatchdog = stuck;

  /* Caught once in the wild: navigating away from a filtered tab and back left
     the page on its loading screen with picks_for not yet issued at 9s - so the
     boot had not even reached load() - and it only came good around 27s. No
     auth request went out and no lock was held, so it is the client stalling
     internally rather than the network.

     It is not reproducible on demand, so rather than guess: if the session has
     not arrived in three and a half seconds, reload once. A fresh document clears whatever
     the client is stuck behind. The guard means it can only do this a single
     time per tab, so a genuine outage cannot become a reload loop - the second
     time through it waits, and the 20s watchdog offers the retry button. */
  performance.mark("B_scriptStart");
  const RETRY_KEY = "ln-session-retry";
  const _session = await Promise.race([
    db.auth.getSession().then(r => r.data.session),
    new Promise(r => setTimeout(() => r("__stalled__"), 3500)),
  ]);
  if (_session === "__stalled__") {
    if (!sessionStorage.getItem(RETRY_KEY)) {
      sessionStorage.setItem(RETRY_KEY, "1");
      console.warn("LEARN-STALL: session did not resolve in 3.5s, reloading once");
      location.reload();
      return;
    }
    console.warn("LEARN-STALL: session stalled a second time, waiting it out");
  }
  sessionStorage.removeItem(RETRY_KEY);
  const session = _session === "__stalled__"
    ? (await db.auth.getSession()).data.session
    : _session;
  performance.mark("B_session");
  if (!session) { window.location.href = "/"; return; }
  myEmail = session.user.email;
  /* Started here, not after the header. load() needs nothing but myEmail, which
     we now have - checked: it touches no myName, iAmOwner or avatar - and
     everything between this point and where it used to be called is about a
     second of setup it can run underneath instead of queue behind. Measured:
     the first request fired at 566ms but the data batch did not start until
     1,674ms. The rejection is captured here so an early failure cannot become
     an unhandled rejection before the try below is reached. */
  performance.mark("B_loadFired");
  const DATA_READY = load().then(v => ({ ok: true, v }), e => ({ ok: false, e }));

  const ae = window.shMyRow ? await window.shMyRow(db, myEmail)
    : (await db.from("allowed_emails").select("name,avatar_url").eq("email", myEmail).maybeSingle()).data;
  myName = (ae && ae.name) || myEmail.split("@")[0];
  const myAvatarUrl = (ae && ae.avatar_url) || null;
  const iAmOwner = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();
  try {
    initSharedHeader({ db, myEmail, myName, isAdmin: iAmOwner,
      activePage:"learn", avatarUrl: myAvatarUrl });
    /* Shown as soon as it exists, not held back to the reveal. The loading
       screen is already inset past the sidebar, so keeping the chrome hidden
       left the skeleton floating beside an empty column. With the header and
       sidebar up, what is loading is only the content area - which is the
       truth, and looks like the page arriving rather than a blank screen. */
    $("app-header").style.display = "";
    $("app-main").style.display = "block";
  } catch (e) { console.error("initSharedHeader error:", e); }

  // The lightbox renders a real content-feed post, so it needs the same three
  // modules that page uses. Failing here must not stop the library loading.
  try {
    PostView.init({ db, getPost: id => FEED[id], isAdmin: iAmOwner });
    if (window.initMemberModal) initMemberModal({ db, myEmail });
    initCommentsSystem({
      db,
      auth: { email: myEmail, name: myName, avatarUrl: myAvatarUrl, isAdmin: iAmOwner },
      comments:  { table: "content_feed_comments", parentField: "post_id" },
      reactions: { table: "content_feed_likes",    parentField: "post_id" },
      commentReactionEventType: "content_comment",
      replyNotificationLinkFn: id => `/content-feed.html?post=${id}`,
      ownerEmail: OWNER_EMAIL,
      ownerNotifyTitleFn:   name => `${name} commented on your content`,
      ownerReactionTitleFn: (name, emoji) => `${name} reacted ${emoji} to your content`,
    });
  } catch (e) { console.error("post modules init error:", e); }

  const sp = new URLSearchParams(location.search);
  topic = sp.get("topic") || ""; type = sp.get("type") || ""; term = sp.get("q") || "";

  try {
    const res = await DATA_READY;
    if (!res.ok) throw res.e;
    render();
  }
  catch (e) {
    console.error("learn load error:", e);
    $("ln-root").innerHTML = '<div class="ln-empty">Something went wrong loading the library. Reload to try again.</div>';
  }
  /* Both waits run together, so the page opens on a finished picture: the hero
     with its first frame, and the picks row already in place rather than
     arriving a second later and shoving everything down.

     The picks timeout is a failsafe, not a deadline. It is long because the
     page should wait for the row rather than open without it - at 4s it was
     cutting in and letting the row land afterwards, which is the thing it
     exists to prevent. It only fires if the call has genuinely failed, and
     then the page opens without that row rather than hanging. */
  /* Only wait for the picks when the view will actually show them. Browsing -
     ?type=video, ?type=clinic, a topic, a search - renders a flat grid and
     never builds the For you row at all, so holding the page for that call was
     over a second of loading screen for something the page would not draw. The
     hero's For you slide falls back to the newest of its kind and fills in when
     the call lands. */
  const _wantsPicks = !(term || type || topic);
  await Promise.all([
    BB_FIRST,                          // capped at 700ms where it is defined
    _wantsPicks
      ? Promise.race([PICKS_READY || Promise.resolve(),
                      new Promise(r => setTimeout(r, 15000))])
      : Promise.resolve(),
  ]);
  clearTimeout(stuck);
  /* TEMPORARY - remove once the accumulation is understood. Each load appends
     its own timings, so a trend over many clicks can be read instead of
     inferred from two or three samples. Keeps the last 40. */
  try {
    const _r = performance.getEntriesByType("resource").filter(e => e.name.indexOf("/rest/v1/") > -1);
    const _p = _r.filter(e => e.name.indexOf("picks_for") > -1)[0];
    const _log = JSON.parse(localStorage.getItem("ln-loadlog") || "[]");
    _log.push({
      at: new Date().toISOString().slice(11, 19),
      url: location.search || "(library)",
      reveal: Math.round(performance.now()),
      picks: _p ? Math.round(_p.duration) : null,
      data: _r.length ? Math.round(Math.max(..._r.map(e => e.responseEnd))) : null,
      reqs: _r.length,
      nav: (performance.getEntriesByType("navigation")[0] || {}).type,
    });
    localStorage.setItem("ln-loadlog", JSON.stringify(_log.slice(-40)));
  } catch (e) { /* diagnostics must never break the page */ }
  $("loading-screen").style.display = "none";
  $("app-main").style.display = "block";
  $("app-header").style.display = "";
  bbReveal();

  /* ?post=<id> opens that post's lightbox over the drawn page. This is where
     the ⌘K palette sends a video, so a video found in search plays the way it
     plays everywhere else instead of navigating to the feed page. Opened after
     the reveal, so the lightbox never sits over a loading screen, and the id is
     dropped from the URL so a reload or a back-press lands on plain Learn. */
  /* ?clinic=<id> is the same thing for a replay, which is what its card links
     to so that opening it in a new tab still lands on the viewer. */
  const deepClinic = sp.get("clinic");
  if (deepClinic) {
    history.replaceState({}, "", location.pathname);
    openClinic(deepClinic);
  }
  const deepPost = sp.get("post");
  if (deepPost) {
    history.replaceState({}, "", location.pathname);
    openPost(deepPost);
  }

})();

</script>
