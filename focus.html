<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Weekly Practice Focus — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.png"  />
  <link rel="apple-touch-icon" href="/icon-512.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@mux/mux-player@3/dist/mux-player.mjs"></script>
  <script src="/shared-achievements.js?v=9"></script>
  <script src="/shared-header.js?v=2026071802"></script>
<script src="/live-session.js?v=1"></script>
  <script src="/shared-comments.js?v=20260823a"></script>
  <script src="/shared-member-modal.js?v=14"></script>
  <style>
    /* ── Light theme (matches community.html) ───────────────────────────────── */
    :root {
      --bg:           #faf7f3;
      --surface:      #ffffff;
      --surface-2:    #f0ebe2;
      --border:       #e0d5c8;
      --text:         #1a1410;
      --text-muted:   #8a7868;
      --accent-subtle:#fdf0d8;
    }
    body { background: var(--bg); }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    /* Match the dashboard's tight gap between the top bar and the title. */
    main { padding-top: 12px; }
    #focus-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    /* ── Page header ─────────────────────────────────────────────────────────── */
    /* ── Page header (hero in a white card) ──────────────────────────────────── */
    .focus-page-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 5px 18px rgba(60,40,20,.08);
      padding: 20px 24px;
      margin-bottom: 18px;
    }
    .focus-hero { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .focus-hero-icon {
      width: 46px; height: 46px; border-radius: 13px; flex-shrink: 0;
      display: grid; place-items: center;
      background: rgba(245,197,24,.14); color: #b8900a;
      box-shadow: inset 0 0 0 1px rgba(245,197,24,.28);
    }
    .focus-hero-icon svg { width: 23px; height: 23px; }
    .focus-page-hdr h2 {
      font-size: 1.5rem; font-weight: 800; letter-spacing: -.015em;
      color: var(--text); margin: 0; line-height: 1.1;
    }
    .focus-page-desc {
      font-size: 0.88rem; color: var(--text-muted); margin-top: 3px;
    }

    /* Arrival animation — mirrors the community feed so the pages match. */
    @keyframes focusFadeUp { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: no-preference) {
      .focus-page-hdr { animation: focusFadeUp .5s cubic-bezier(.22,.61,.36,1) both; animation-delay: .02s; }
      #focus-list.feed-arrive > * { animation: focusFadeUp .45s cubic-bezier(.22,.61,.36,1) both; }
      #focus-list.feed-arrive > *:nth-child(1) { animation-delay: .10s; }
      #focus-list.feed-arrive > *:nth-child(2) { animation-delay: .15s; }
      #focus-list.feed-arrive > *:nth-child(3) { animation-delay: .20s; }
      #focus-list.feed-arrive > *:nth-child(n+4) { animation-delay: .24s; }
    }

    /* ── Admin form card ────────────────────────────────────────────────────── */
    .focus-form-card {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
    }
    .focus-form-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 20px;
    }
    .focus-form-field { margin-bottom: 16px; }
    .focus-form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .focus-form-input,
    .focus-form-textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      resize: vertical;
      transition: border-color .15s;
    }
    .focus-form-input:focus,
    .focus-form-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Steps builder */
    .steps-builder { display: flex; flex-direction: column; gap: 10px; }
    .step-row {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .step-row-top { display: flex; gap: 8px; align-items: flex-start; }
    .step-num {
      font-size: 0.78rem; font-weight: 800;
      color: var(--accent);
      width: 20px; flex-shrink: 0;
      padding-top: 10px;
    }
    .step-row-top textarea {
      flex: 1;
      padding: 8px 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text);
      resize: vertical;
      min-height: 48px;
      transition: border-color .15s;
    }
    .step-row-top textarea:focus { outline: none; border-color: var(--accent); }
    .step-remove-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 8px 4px; font-size: 1rem;
      flex-shrink: 0;
    }
    .step-remove-btn:hover { color: #e53e3e; }
    .step-bullets { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .step-bullet-row { display: flex; gap: 6px; align-items: center; margin-left: 28px; }
    .step-bullet-row input {
      flex: 1;
      padding: 6px 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
    }
    .step-bullet-row input:focus { outline: none; border-color: var(--accent); }
    .bullet-remove-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1rem;
    }
    .bullet-remove-btn:hover { color: #e53e3e; }
    .add-bullet-btn {
      margin-left: 28px; margin-top: 4px;
      background: none; border: none; cursor: pointer;
      font-size: 0.78rem; color: var(--text-muted);
      font-family: inherit; padding: 2px 0;
      text-decoration: underline;
    }
    .add-bullet-btn:hover { color: var(--text); }
    .add-step-btn {
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text-muted);
      width: 100%;
      transition: border-color .15s, color .15s;
    }
    .add-step-btn:hover { border-color: var(--accent); color: var(--accent); }
    .form-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    /* ── Focus card ─────────────────────────────────────────────────────────── */
    .focus-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 14px;
      transition: border-color .15s;
    }
    .focus-card:hover { border-color: rgba(245,197,24,.35); }

    /* Accent header strip */
    .focus-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 18px;
      background: linear-gradient(90deg, rgba(245,197,24,.14) 0%, rgba(245,197,24,.04) 100%);
      border-bottom: 1px solid rgba(245,197,24,.22);
      border-left: 3.5px solid var(--accent);
    }
    .focus-card-label {
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: .07em;
      text-transform: uppercase;
      color: #b8900a;
    }
    .focus-card-date {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .focus-this-week-badge {
      display: inline-flex;
      align-items: center;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--accent);
      color: #1a1410;
      padding: 3px 8px;
      border-radius: 999px;
      line-height: 1;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Card body */
    .focus-card-body { padding: 14px 18px 10px; }
    .focus-headline {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin: 0 0 10px;
    }
    .focus-intro-preview {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Expand toggle */
    .focus-card-footer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0 14px;
      margin: 0 18px;
    }
    .focus-footer-btn, .tc-react-btn {
      background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.82rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 6px; border-radius: 6px;
      transition: color .15s, background .15s;
    }
    .focus-footer-btn:hover, .tc-react-btn:hover { color: var(--text); background: rgba(0,0,0,.05); }
    .focus-footer-btn.liked, .tc-react-btn.liked { color: #e879a0; }
    .focus-meta-counts { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
    .focus-card-footer-right {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
    }
    .focus-liker-avatars { display: flex; align-items: center; cursor: pointer; }
    .focus-liker-avatar {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.52rem; font-weight: 800;
      margin-left: -6px; flex-shrink: 0; overflow: hidden;
    }
    .focus-liker-avatar:first-child { margin-left: 0; }
    .focus-liker-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

    /* ── Expanded content ────────────────────────────────────────────────────── */
    .focus-expanded {
      border-top: 1.5px solid var(--border);
      padding: 20px 22px;
    }
    .focus-expanded-headline {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 14px;
      line-height: 1.4;
    }
    .focus-expanded-headline em {
      font-style: normal;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.92rem;
    }
    .focus-body-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .focus-try-label {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .focus-steps { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 10px; }
    .focus-step { display: flex; gap: 12px; align-items: flex-start; }
    .focus-step-num {
      min-width: 24px; height: 24px;
      background: var(--accent);
      color: #1a1410;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .focus-step-content { flex: 1; font-size: 0.9rem; color: var(--text); line-height: 1.55; }
    .focus-step-bullets { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
    .focus-step-bullet {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 0.88rem; color: var(--text-muted); line-height: 1.5;
    }
    .focus-step-bullet::before {
      content: "•";
      color: var(--accent);
      font-size: 1rem;
      line-height: 1.5;
      flex-shrink: 0;
    }
    .focus-divider {
      height: 1.5px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── Admin edit button on card ──────────────────────────────────────────── */
    .focus-edit-btn {
      background: none; border: 1px solid rgba(245,197,24,.4);
      border-radius: 5px; padding: 2px 9px;
      font-size: 0.72rem; font-weight: 700; color: #b8900a;
      cursor: pointer; font-family: inherit;
      transition: background .15s, border-color .15s;
      margin-left: auto;
    }
    .focus-edit-btn:hover { background: rgba(245,197,24,.15); border-color: var(--accent); }

    /* Admin ⋮ menu (Edit / Delete) — mirrors community */
    .post-menu-wrap { position: relative; flex-shrink: 0; align-self: center; margin-left: 4px; }
    .post-menu-btn {
      width: 30px; height: 30px; border-radius: 50%;
      background: none; border: none; cursor: pointer; color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      transition: background .15s, color .15s;
    }
    .post-menu-btn:hover { background: rgba(0,0,0,.05); color: var(--text); }
    .post-menu {
      position: absolute; top: calc(100% + 4px); right: 0;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; box-shadow: 0 8px 24px rgba(60,40,20,.16);
      padding: 5px; min-width: 150px; z-index: 50;
      animation: postMenuIn .14s ease;
    }
    @keyframes postMenuIn { from { opacity: 0; transform: translateY(-4px) scale(.98); } to { opacity: 1; transform: none; } }
    .post-menu-item {
      display: flex; align-items: center; gap: 9px; width: 100%;
      background: none; border: none; cursor: pointer;
      padding: 8px 10px; border-radius: 7px;
      font-size: 0.85rem; font-weight: 600; color: var(--text);
      font-family: inherit; text-align: left; transition: background .12s;
    }
    .post-menu-item:hover { background: rgba(0,0,0,.05); }
    .post-menu-item svg { width: 15px; height: 15px; flex-shrink: 0; opacity: .85; }
    .post-menu-item-danger { color: #ef4444; }
    .post-menu-item-danger:hover { background: rgba(239,68,68,.1); }

    .comments-hdr {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.76rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted);
    }
    .comment-item {
      display: flex; gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .comment-item:last-of-type { border-bottom: none; }
    .comment-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 800; flex-shrink: 0; margin-top: 1px;
    }
    .comment-body { flex: 1; min-width: 0; }
    .comment-meta {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 3px;
    }
    .comment-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .comment-time { font-size: 0.7rem; color: var(--text-muted); }
    .comment-text {
      font-size: 0.87rem; color: var(--text-muted);
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    /* comment/composer/reaction CSS lives in shared-comments.js */

    /* Empty state */
    .focus-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Archive section header */
    .focus-archive-hdr {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin: 32px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--border);
    }

    /* ── Detail view ─────────────────────────────────────────────────────────── */
    #focus-detail { max-width: 720px; margin: 0 auto; padding: 0 16px 40px; }
    .focus-detail-back {
      display: inline-flex; align-items: center; gap: 5px;
      color: var(--text); font-size: 0.86rem; font-weight: 600;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: var(--radius); padding: 8px 15px 8px 11px; cursor: pointer;
      box-shadow: 0 1px 2px rgba(60,40,20,.05);
      transition: border-color .15s, color .15s, box-shadow .15s, transform .12s ease;
      font-family: inherit; margin: 16px 0;
    }
    .focus-detail-back svg { transition: transform .15s ease; }
    .focus-detail-back:hover { border-color: rgba(245,197,24,.55); box-shadow: 0 4px 14px rgba(60,40,20,.09); }
    .focus-detail-back:hover svg { transform: translateX(-2px); }
    .focus-detail-back:active { transform: scale(.96); }
    .focus-detail-cmt-wrap {
      margin-top: 12px;
    }
    .focus-detail-cmt-wrap .tc-comments-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    @media (max-width: 600px) {
      main { padding: 0; }
      /* No top gap — the header card connects straight to the top menu bar. */
      #focus-main { padding: 0 0 80px; }
      /* Header is a full-bleed white panel that connects into the first post. */
      .focus-page-hdr {
        border-radius: 0; border-left: none; border-right: none; border-top: none;
        border-bottom: 1px solid var(--border); box-shadow: none;
        padding: 16px; margin-bottom: 0; gap: 10px;
      }
      .focus-hero { gap: 12px; }
      .focus-hero-icon { width: 40px; height: 40px; border-radius: 11px; }
      .focus-hero-icon svg { width: 20px; height: 20px; }
      .focus-page-hdr h2 { font-size: 1.25rem; }
      .focus-page-desc { font-size: .8rem; }
      #new-focus-btn { flex-shrink: 0; padding: 8px 14px; font-size: .82rem; }
      /* Posts stack flush, separated by a single hairline (feed, not cards). */
      #focus-main .focus-card { border: none; border-bottom: 1px solid var(--border); border-radius: 0; margin-bottom: 0; }
      #focus-list .focus-card:last-child { border-bottom: none; }
      .focus-archive-hdr { margin: 20px 16px 12px; }
      .focus-card-header { border-left: none; }
      .focus-card-body { padding: 14px 16px 10px; }
      .focus-card-footer { padding: 8px 0 12px; margin: 0 16px; }
      #focus-main .tc-comments-section { border-radius: 0; border-left: none; border-right: none; }
      /* Detail view stays inset — a framed single-post page, like community. */
      #focus-detail { padding: 0 16px 60px; }
      .focus-detail-back { margin: 16px 0 14px; }
      .focus-card { cursor: pointer; }
      .focus-expanded { padding: 20px 16px; }
      .focus-detail-cmt-wrap { margin-top: 8px; }
    }

    /* rich composer + lightbox CSS lives in shared-comments.js */

      animation: pulse-red 1s ease-in-out infinite;

    /* ── Video recording preview panel ──────────────────────────────────────── */

    .video-tab {

    .video-dropzone-text { color: var(--text-muted); font-size: 0.85rem; margin: 0; text-align: center; }
    .video-choose-btn {
      background: #fff; color: #000; border: none; border-radius: 20px;

      transition: opacity .15s;
    }
    .video-choose-btn:hover { opacity: .85; }
    .mux-upload-progress {
      width: 80%; height: 4px;
      background: rgba(0,0,0,.08); border-radius: 4px; overflow: hidden;
    }
    .mux-upload-bar {
      height: 100%; background: var(--accent);

      width: 100%;

    }

    /* ── Composer upload progress overlay ────────────────────────────────────── */
    .mux-upload-overlay {
      display: flex; align-items: center; gap: 14px;
      background: rgba(245,197,24,.07);
      border: 1.5px solid rgba(245,197,24,.25);
      border-radius: 10px; padding: 14px 16px;

    }
    .mux-upload-overlay-icon { font-size: 1.5rem; flex-shrink: 0; }

      font-size: 0.85rem; font-weight: 700; cursor: pointer; padding: 8px 16px;
      flex-shrink: 0;

    /* ── Poll builder ─────────────────────────────────────────────────────────── */

    .poll-question-input, .poll-option-input {

    .poll-options-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }

    .poll-option-remove {

    /* ── Media preview area ───────────────────────────────────────────────────── */
    .media-preview-area {
      margin-top: 10px;
    }
    .media-preview-images {
      display: grid; gap: 6px; margin-bottom: 6px;
    }
    .media-thumb-wrap {
      position: relative; display: block;
    }
    .media-thumb-wrap img {
      width: 100%; height: auto; max-height: 420px;
      object-fit: contain; border-radius: 8px;
      border: 1.5px solid var(--border); display: block;

      position: absolute; top: 6px; right: 6px;

      cursor: pointer; transition: background .15s;

      display: inline-flex; align-items: center; gap: 6px;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 20px; padding: 5px 10px 5px 8px;
      font-size: 0.8rem; color: var(--text-muted); margin: 4px 4px 4px 0;
    }
    .media-chip-remove {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1rem; line-height: 1;
      padding: 0 2px; transition: color .15s;
    }
    .media-chip-remove:hover { color: #ef4444; }
    .media-preview-video-wrap {
      position: relative; margin-bottom: 8px;

    .media-video-remove {
      display: block; width: 100%; margin-top: 6px;
      background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.3);
      border-radius: 6px; color: #ef4444; cursor: pointer;
      font-size: 0.78rem; padding: 4px 0;
    }
    .media-video-remove:hover { background: rgba(239,68,68,.22); }

    /* ── Image lightbox modal ─────────────────────────────────────────────────── */
    #comm-img-modal {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(0,0,0,.88);
      display: none; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .18s ease;
    }
    #comm-img-modal.open { display: flex; opacity: 1; }
    #comm-img-modal img {
      max-width: min(84vw, 1200px); max-height: 88vh;
      border-radius: 10px; object-fit: contain;
      box-shadow: 0 8px 48px rgba(0,0,0,.7); transition: opacity .12s ease;
    }
    #comm-img-modal-close {
      position: absolute; top: 16px; right: 18px;
      background: rgba(255,255,255,.12); border: none; border-radius: 50%;
      width: 38px; height: 38px; cursor: pointer; color: #fff;
      font-size: 1.3rem; display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    #comm-img-modal-close:hover { background: rgba(255,255,255,.22); }
    .comm-img-modal-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.12); border: none; border-radius: 50%;
      width: 44px; height: 44px; cursor: pointer; color: #fff;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s; flex-shrink: 0;

    .comm-img-modal-nav:hover { background: rgba(255,255,255,.26); }
    .comm-img-modal-nav:disabled { opacity: 0; pointer-events: none; }
    #comm-img-modal-prev { left: 14px; }
    #comm-img-modal-next { right: 14px; }

  </style>

<body>

  <header id="app-header" style="display:none"></header>

  <main>
<div id="focus-main" style="display:none">
  <div class="focus-page-hdr" style="display:none">
    <div class="focus-hero">
      <div class="focus-hero-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>
      </div>
      <div class="focus-hero-text">
        <h2>Weekly Practice Focus</h2>
        <p class="focus-page-desc">A new technique or concept to work on each week.</p>
      </div>
    </div>
    <button id="new-focus-btn" class="btn btn-primary" onclick="openFocusForm()" style="display:none">+ New Focus</button>
  </div>
  <button id="fx-new" onclick="openFocusForm()" style="display:none">+ New focus</button>

  <!-- Admin write form -->
  <div id="focus-form-wrap" style="display:none">
    <div class="focus-form-card">
      <h3 id="focus-form-title">New Weekly Focus</h3>

      <div class="focus-form-field">
        <label class="focus-form-label">Headline — what members will work on this week</label>
        <input id="ff-headline" class="focus-form-input" type="text"
               placeholder="e.g. Learn to group notes instead of controlling every note individually" />
      </div>

      <div class="focus-form-field">
        <label class="focus-form-label">Intro — 1–2 sentences explaining the concept</label>
        <textarea id="ff-intro" class="focus-form-textarea" rows="3"
                  placeholder="One of the biggest reasons fast passages feel difficult…"></textarea>
      </div>

      <div class="focus-form-field">
        <label class="focus-form-label">Steps — "This week, try this:"</label>
        <div id="ff-steps" class="steps-builder"></div>
        <button class="add-step-btn" onclick="addStep()">+ Add step</button>
      </div>

      <div class="focus-form-field">
        <label class="focus-form-label">Closing — takeaway or encouragement</label>
        <textarea id="ff-closing" class="focus-form-textarea" rows="3"
                  placeholder="You may notice that the passage suddenly feels smoother…"></textarea>
      </div>

      <div class="focus-form-field">
        <label class="focus-form-label">Theme — which shelf it lives on</label>
        <select id="ff-theme" class="focus-form-input">
          <option value="hands">Hands &amp; fingering</option>
          <option value="sound">Sound &amp; musicality</option>
          <option value="method">How to practise</option>
          <option value="read">Understanding the music</option>
        </select>
        <p style="font-size:.76rem;color:var(--text-muted);margin:4px 0 0">This is how members find it months later, so it matters more than the date.</p>
      </div>

      <div class="focus-form-field">
        <label class="focus-form-label">Published date</label>
        <input id="ff-date" class="focus-form-input" type="datetime-local" />
        <p style="font-size:.76rem;color:var(--text-muted);margin:4px 0 0">Leave as-is for today, or backdate if needed.</p>
      </div>

      <div class="form-actions">
        <button class="btn btn-ghost btn-sm" onclick="closeFocusForm()">Cancel</button>
        <button id="ff-submit" class="btn btn-primary" onclick="publishFocus()">Publish &amp; Notify Members</button>
      </div>
    </div>
  </div>

  <!-- Focus list -->
  <div id="focus-list"></div>
</div>

    <div id="focus-detail" style="display:none">
      <button class="focus-detail-back" onclick="closeFocusDetail()">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <button id="fx-done-btn" class="fx-done-btn" onclick="fxToggleDone(_currentDetailId, this)">Mark as done</button>
      <div id="focus-detail-card"></div>
      <div id="focus-detail-comments"></div>
    </div>
  </main>

<script>
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db        = supabase.createClient(SUPA_URL, SUPA_ANON);
const OWNER_EMAIL = "matthew@matthewcawood.com";

let myEmail    = null;
let myName     = null;
let myAvatarUrl = null;
let isAdmin    = false;
let _focuses   = [];      // loaded focus rows + metadata
let _currentDetailId = null;
let _stepCount = 0;         // for unique step IDs in form

// ── Auth ──────────────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails")
    .select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName      = ae?.name || myEmail.split("@")[0];
  myAvatarUrl = ae?.avatar_url || null;
  isAdmin     = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "learn", avatarUrl: myAvatarUrl });
  initMemberModal({ db, myEmail });

  initCommentsSystem({
    db,
    auth: { email: myEmail, name: myName, avatarUrl: myAvatarUrl, isAdmin },
    comments:  { table: 'weekly_focus_comments',  parentField: 'focus_id' },
    reactions: { table: 'weekly_focus_likes',      parentField: 'focus_id' },
    commentReactionEventType: 'focus_comment',
    replyNotificationLinkFn: (parentId) => `/focus.html?post=${parentId}`,
    ownerEmail: OWNER_EMAIL,
    ownerNotifyTitleFn:   (name) => `${name} commented on a weekly focus`,
    ownerReactionTitleFn: (name, emoji) => `${name} reacted ${emoji} to a weekly focus`,
    onReactionChange: (parentId) => {
      const rxData = Comments.getReactionState(parentId);
      let total = 0;
      for (const d of Object.values(rxData)) total += d.count;
      const f = _focuses.find(x => x.id === parentId);
      const cc = f?.commentCount || 0;
      const html = _focusMetaHTML(parentId, total, cc);
      document.querySelectorAll(`.like-count-${parentId}`).forEach(el => el.innerHTML = html);
      // Keep f.likers in sync and refresh avatar chips
      if (f) {
        const iLiked = Object.values(rxData).some(d => d.mine);
        if (iLiked && !f.likers.includes(myEmail)) {
          f.likers = [myEmail, ...f.likers].slice(0, 3);
        } else if (!iLiked) {
          f.likers = f.likers.filter(e => e !== myEmail);
        }
        const chipsHTML = _focusLikerChips(f);
        document.querySelectorAll(`.focus-chips-${parentId}`).forEach(el => {
          el.innerHTML = chipsHTML;
          el.style.display = chipsHTML ? "" : "none";
        });
      }
    },
    onCommentChange: (parentId) => {
      // Count comment items directly from the DOM (includes replies)
      const listEl = document.getElementById(`tc-comments-list-${parentId}`);
      const count = listEl ? listEl.querySelectorAll('.tc-comment-item').length : 0;
      const f = _focuses.find(x => x.id === parentId);
      if (f) f.commentCount = count;
      // Update meta count span (use innerHTML so clickable spans render)
      const rxData = Comments.getReactionState(parentId);
      let total = 0;
      for (const d of Object.values(rxData)) total += d.count;
      const html = _focusMetaHTML(parentId, total, count);
      document.querySelectorAll(`.like-count-${parentId}`).forEach(el => el.innerHTML = html);
    },
  });

  if (isAdmin) {
    document.getElementById("new-focus-btn").style.display = "";
    document.getElementById("fx-new").style.display = "";
  }

  document.getElementById("focus-main").style.display = "";

  await loadFocuses();

  // Deep-link: ?post=<id>
  const deepId = new URLSearchParams(window.location.search).get("post");
  if (deepId) showFocusDetail(deepId, false);
})();

// ── Load focuses ──────────────────────────────────────────────────────────────
let _doneSet = new Set();
let _fxView = (function () { try { return localStorage.getItem("fxView") || "theme"; } catch (e) { return "theme"; } })();

async function loadFocuses() {
  const list = document.getElementById("focus-list");


  const { data: rows, error } = await db
    .from("weekly_focus")
    .select("*")
    .order("published_at", { ascending: false });

  if (error || !rows) {
    list.innerHTML = '<div class="focus-empty">Could not load focuses.</div>';
    { const sk = document.getElementById("fx-loading"); if (sk) sk.remove(); }
    return;
  }
  if (!rows.length) {
    list.innerHTML = `<div class="focus-empty">No weekly focuses yet${isAdmin ? " — publish the first one above!" : "."}</div>`;
    { const sk = document.getElementById("fx-loading"); if (sk) sk.remove(); }
    return;
  }

  const ids = rows.map(r => r.id);
  const [{ data: allLikes }, { data: cmtCounts }, { data: doneRows }] = await Promise.all([
    db.from("weekly_focus_likes").select("focus_id,email,emoji").in("focus_id", ids),
    db.from("weekly_focus_comments").select("focus_id").in("focus_id", ids),
    // RLS only ever returns this member's own rows, so no email filter is needed
    db.from("weekly_focus_done").select("focus_id"),
  ]);
  _doneSet = new Set((doneRows || []).map(r => r.focus_id));

  // Load reactions into shared-comments module (uses same table — share the result)
  await Comments.loadReactions(ids);

  // Build comment counts + liker avatar chips from allLikes
  const cmtCountMap = {}, likersMap = {};
  (allLikes || []).forEach(l => {
    if (!likersMap[l.focus_id]) likersMap[l.focus_id] = [];
    if (likersMap[l.focus_id].length < 3) likersMap[l.focus_id].push(l.email);
  });
  (cmtCounts || []).forEach(c => cmtCountMap[c.focus_id] = (cmtCountMap[c.focus_id] || 0) + 1);

  // Fetch avatar URLs for liker chips — include current user so their avatar shows
  const likerEmails = [...new Set([myEmail, ...(allLikes || []).map(l => l.email)])];
  const likerAvatarMap = {};
  if (likerEmails.length) {
    const { data: likerRows } = await db.from("allowed_emails")
      .select("email,avatar_url,name").in("email", likerEmails);
    (likerRows || []).forEach(r => { likerAvatarMap[r.email] = { url: r.avatar_url || null, name: r.name || r.email.split("@")[0] }; });
  }

  _focuses = rows.map((r, i) => {
    const rxData = Comments.getReactionState(r.id);
    let totalRx = 0, myEmoji = null;
    for (const [e, d] of Object.entries(rxData)) { totalRx += d.count; if (d.mine) myEmoji = e; }
    return {
      ...r,
      likeCount:    totalRx,
      commentCount: cmtCountMap[r.id] || 0,
      iLiked:       !!myEmoji,
      myEmoji,
      likers:       likersMap[r.id]   || [],
      isCurrentWeek: i === 0,
      done:          _doneSet.has(r.id),
    };
  });
  window._likerAvatarMap = likerAvatarMap;

  document.body.classList.add("fx-idx");
  renderFocusList();
  const sk = document.getElementById("fx-loading");
  if (sk) sk.remove();
}

/* ── Themes ────────────────────────────────────────────────────────────────
   A focus is worth doing long after its week, but until now the only way to
   find one was to remember when it came out. These are the shelves: broad
   enough that every focus lands on one, narrow enough to mean something. */
const FX_THEME = {
  hands:  { name: "Hands & fingering",       c: "#b4762b",
            ic: '<path d="M9 11V5a1.5 1.5 0 0 1 3 0v6"/><path d="M12 11V4a1.5 1.5 0 0 1 3 0v7"/><path d="M15 11V6a1.5 1.5 0 0 1 3 0v8a7 7 0 0 1-7 7h-1a6 6 0 0 1-5-2.7l-2-3a1.6 1.6 0 0 1 2.6-1.8L9 16"/>' },
  sound:  { name: "Sound & musicality",      c: "#8558d6",
            ic: '<path d="M3 12h2l2-6 3 14 3-11 2 5h6"/>' },
  method: { name: "How to practise",         c: "#c0405f",
            ic: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/>' },
  read:   { name: "Understanding the music", c: "#2f8f78",
            ic: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><path d="M9 7h7M9 11h5"/>' },
};
const FX_ORDER = ["hands", "sound", "method", "read"];
function fxTheme(f) { return FX_THEME[f && f.theme] || FX_THEME.method; }
function fxIcon(t)  { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + t.ic + '</svg>'; }

window.fxSetView = function (v) {
  _fxView = v;
  document.getElementById("fx-by-theme").style.display = v === "theme" ? "" : "none";
  document.getElementById("fx-by-week").style.display  = v === "week"  ? "" : "none";
  document.getElementById("fx-v-theme").classList.toggle("on", v === "theme");
  document.getElementById("fx-v-week").classList.toggle("on", v === "week");
  try { localStorage.setItem("fxView", v); } catch (e) {}
};

/* One button, both directions, and the page updates without a reload so the
   count in the hero and the badge on the card stay in step. */
window.fxToggleDone = async function (focusId, btn) {
  const f = _focuses.find(x => x.id === focusId);
  if (!f) return;
  const wasDone = _doneSet.has(focusId);
  if (btn) btn.disabled = true;
  const { error } = wasDone
    ? await db.from("weekly_focus_done").delete().eq("email", myEmail).eq("focus_id", focusId)
    : await db.from("weekly_focus_done").insert({ email: myEmail, focus_id: focusId });
  if (btn) btn.disabled = false;
  if (error) { alert("Could not save that just now."); return; }
  if (wasDone) _doneSet.delete(focusId); else _doneSet.add(focusId);
  f.done = !wasDone;
  if (btn) fxPaintDone(btn, f.done);
  const n = document.getElementById("fx-done-count");
  if (n) n.textContent = _doneSet.size;
  renderFocusList();
};
function fxPaintDone(btn, done) {
  btn.classList.toggle("on", done);
  btn.innerHTML = done
    ? '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>Done'
    : "Mark as done";
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderFocusList() {
  const list = document.getElementById("focus-list");
  if (!_focuses.length) return;

  const current = _focuses[0];
  const t = fxTheme(current);
  const firstDate = formatFocusDate(_focuses[_focuses.length - 1].published_at);

  /* This week leads, because a weekly focus is the most time-sensitive thing
     on the page. Everything since is shelved underneath it. */
  let html = `
    <div class="fx-hero" style="--c:${t.c}">
      <div class="fx-mark">${fxIcon(t)}</div>
      <div class="fx-hin">
        <span class="fx-kick">This week</span>
        <div class="fx-h1">${escHtml(current.headline)}</div>
        <p class="fx-sub">${escHtml((current.intro || "").replace(/\s+/g, " "))}</p>
        <div class="fx-acts">
          <button class="fx-go" onclick="showFocusDetail('${current.id}')">Start this week</button>
          <span class="fx-when">${(current.steps || []).length} steps &middot; ${formatFocusDate(current.published_at)}</span>
        </div>
      </div>
      <div class="fx-foot">
        <span><b>${_focuses.length}</b> focuses &middot; a new one every Monday</span>
        <span><b id="fx-done-count">${_doneSet.size}</b> done &middot; since ${firstDate}</span>
      </div>
    </div>
    <div class="fx-views">
      <button id="fx-v-theme" class="${_fxView === "theme" ? "on" : ""}" onclick="fxSetView('theme')">By theme</button>
      <button id="fx-v-week"  class="${_fxView === "week"  ? "on" : ""}" onclick="fxSetView('week')">By week</button>
    </div>`;

  /* By theme: what it helps with, which is how you reach for one months later. */
  let byTheme = "";
  FX_ORDER.forEach(key => {
    const th = FX_THEME[key];
    const inTheme = _focuses.filter(f => (f.theme || "method") === key);
    if (!inTheme.length) return;
    byTheme += `<section class="fx-sh" style="--c:${th.c}">
      <div class="fx-sh-h"><span class="fx-sh-d"></span><h2>${th.name}</h2><span class="fx-sh-n">${inTheme.length}</span></div>
      <div class="fx-sh-r">${inTheme.map(fxCardHTML).join("")}</div></section>`;
  });

  /* By week: the run of Mondays, which is the thing that shows there is
     never a gap. */
  let byWeek = "";
  _focuses.forEach((f, i) => {
    const th = fxTheme(f), d = new Date(f.published_at);
    const py = i > 0 ? new Date(_focuses[i - 1].published_at).getFullYear() : null;
    if (i === 0 || d.getFullYear() !== py) byWeek += `<div class="fx-yr">${d.getFullYear()}</div>`;
    byWeek += `<a class="fx-wk${f.done ? " done" : ""}" style="--c:${th.c}" onclick="showFocusDetail('${f.id}')">
      <span class="fx-wk-when">${d.getDate()} ${["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()]}</span>
      <span class="fx-wk-node"></span>
      <span class="fx-wk-body">
        <span class="fx-wk-title">${escHtml(f.headline)}</span>
        <span class="fx-wk-blurb">${escHtml((f.intro || "").replace(/\s+/g, " "))}</span>
      </span>
      <span class="fx-wk-meta">${th.name}</span></a>`;
  });

  html += `<div id="fx-by-theme" style="display:${_fxView === "theme" ? "" : "none"}">${byTheme}</div>`
        + `<div id="fx-by-week"  style="display:${_fxView === "week"  ? "" : "none"}">${byWeek}</div>`;

  list.innerHTML = html;
  list.classList.remove("feed-arrive");
  void list.offsetWidth;
  list.classList.add("feed-arrive");
}

/* The card is Courses' shape rather than the library's: a plate carries the
   colour, the words sit under it. A focus has steps and a state, which is a
   small course more than an article. */
function fxCardHTML(f) {
  const t = fxTheme(f);
  return `<a class="fx-c${f.done ? " done" : ""}" style="--c:${t.c}" onclick="showFocusDetail('${f.id}')">
    <span class="fx-c-pl">${fxIcon(t)}${f.done ? '<span class="fx-c-dn">Done</span>' : ""}${f.isCurrentWeek ? '<span class="fx-c-now">This week</span>' : ""}</span>
    <span class="fx-c-b">
      <span class="fx-c-t">${escHtml(f.headline)}</span>
      <span class="fx-c-x">${escHtml((f.intro || "").replace(/\s+/g, " "))}</span>
      <span class="fx-c-f"><span>${(f.steps || []).length} steps</span><span class="fx-c-go">Try it &rarr;</span></span>
    </span></a>`;
}

// Build meta counts HTML — comment count is clickable when focusId provided
function _focusMetaHTML(focusId, totalRx, commentCount) {
  // Reactions live on the heart + liker avatars; meta shows comments only.
  const cmtPart = commentCount ? `<span onclick="event.stopPropagation();showFocusDetail('${focusId}')" style="cursor:pointer">${commentCount} comment${commentCount !== 1 ? "s" : ""}</span>` : "";
  return cmtPart;
}

function _focusLikerChips(f) {
  const likerAvatarMap = window._likerAvatarMap || {};
  const likers = (f.likers || []).slice(0, 3);
  if (!likers.length) return "";
  const chips = likers.map(email => {
    const info = likerAvatarMap[email];
    const name = info?.name || email.split("@")[0];
    const col  = avatarColour(email);
    const inner = info?.url
      ? `<img src="${escHtml(info.url)}" alt="${escHtml(name)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block">`
      : `<div style="width:100%;height:100%;background:${col.bg};color:${col.fg};display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:800;border-radius:50%">${name[0].toUpperCase()}</div>`;
    return `<div class="focus-liker-avatar">${inner}</div>`;
  }).join("");
  const extra = f.likers.length > 3 ? `<span style="font-size:.72rem;color:var(--text-muted);margin-left:4px">+${f.likers.length - 3}</span>` : "";
  return chips + extra;
}

function focusCardHTML(f) {
  const dateStr   = formatFocusDate(f.published_at);
  const introText = (f.intro || "").split("\n")[0];

  const headerBadge = f.isCurrentWeek
    ? `<span class="focus-this-week-badge">This Week</span>`
    : "";
  const editBtn = _adminMenuHTML(f.id);

  const rxData = Comments.getReactionState(f.id);
  let totalRx = 0;
  for (const d of Object.values(rxData)) totalRx += d.count;
  const safeKey  = `focus_${f.id.replace(/-/g,'_')}`;
  const reactBtn = Comments.reactBtnHtml(f.id, safeKey);

  const likerChipsHTML = _focusLikerChips(f);
  const metaCounts = _focusMetaHTML(f.id, totalRx, f.commentCount);

  return `
    <div class="focus-card" onclick="showFocusDetail('${f.id}')" style="cursor:pointer">
      <div class="focus-card-header">
        <span class="focus-card-label">${fxTheme(f).name}</span>
        ${headerBadge}
        <span class="focus-card-date">${dateStr}</span>
        ${editBtn}
      </div>
      <div class="focus-card-body">
        <div class="focus-headline">${escHtml(f.headline)}</div>
        <div class="focus-intro-preview">${escHtml(introText)}</div>
      </div>
      <div class="focus-card-footer" onclick="event.stopPropagation()">
        ${reactBtn}
        <button class="focus-footer-btn" onclick="showFocusDetail('${f.id}')" title="Comments">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        <div class="focus-card-footer-right">
          <div class="focus-liker-avatars focus-chips-${f.id}" onclick="event.stopPropagation();Comments.showLikers('${f.id}',event)" title="See who reacted" style="${likerChipsHTML ? '' : 'display:none'}">${likerChipsHTML}</div>
          <span class="focus-meta-counts like-count-${f.id}">${metaCounts}</span>
        </div>
      </div>
    </div>`;
}

/* The focus itself reads like an article, because that is what it is once you
   are in it. Same light ground and the same shape as the Piano Practice Daily
   reader and Monday Music Tips - the theme's colour carried on the pill, the
   rule beside the opening, the step numbers and the bullets - so you always
   know which shelf you came from. The reactions and comments stay: this is
   the one piece of Learn that people talk to each other about. */
function focusDetailCardHTML(f) {
  const t = fxTheme(f);
  const rxData = Comments.getReactionState(f.id);
  let totalRx = 0;
  for (const d of Object.values(rxData)) totalRx += d.count;
  const reactBtn = Comments.reactBtnHtml(f.id, `focus_det_${f.id.replace(/-/g, "_")}`);
  const detLikerChipsHTML = _focusLikerChips(f);
  const metaCounts = _focusMetaHTML(f.id, totalRx, f.commentCount);
  const rich = v => (window.renderUserContent ? renderUserContent(v) : escHtml(v));

  return `
    <article class="fxr" style="--c:${t.c}">
      ${_adminMenuHTML(f.id)}
      <span class="fxr-kick">${escHtml(t.name)}</span>
      ${f.isCurrentWeek ? '<span class="fxr-now">This week</span>' : ""}
      <h1 class="fxr-h1">${escHtml(f.headline)}</h1>
      <div class="fxr-meta">${(f.steps || []).length} steps &middot; ${formatFocusDate(f.published_at)}</div>
      ${f.intro ? `<div class="fxr-intro">${rich(f.intro)}</div>` : ""}
      ${renderSteps(f.steps, f.isCurrentWeek)}
      ${f.closing ? `<div class="fxr-close">${rich(f.closing)}</div>` : ""}
      <div class="fxr-foot">
        ${reactBtn}
        <button class="focus-footer-btn" title="Comments"
          onclick="document.getElementById('focus-detail-comments').scrollIntoView({behavior:'smooth',block:'start'})">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </button>
        ${window.SavedPosts ? SavedPosts.buttonHTML("weekly_focus", f.id, { className: "sp-save-ghost", labelled: false }) : ""}
        <div class="focus-card-footer-right">
          <div class="focus-liker-avatars focus-chips-${f.id}" onclick="Comments.showLikers('${f.id}',event)" title="See who reacted" style="${detLikerChipsHTML ? "" : "display:none"}">${detLikerChipsHTML}</div>
          <span class="focus-meta-counts like-count-${f.id} focus-det-meta-${f.id}">${metaCounts}</span>
        </div>
      </div>
    </article>`;
}

function renderSteps(steps, thisWeek) {
  if (!steps?.length) return "";
  const items = steps.map((s, i) => {
    const bullets = (s.bullets || []).filter(b => b?.trim())
      .map(b => `<li>${escHtml(b)}</li>`).join("");
    return `<div class="fxr-step">
        <span class="fxr-n">${i + 1}</span>
        <div class="fxr-st">${escHtml(s.text || "")}</div>
        ${bullets ? `<ul class="fxr-bl">${bullets}</ul>` : ""}
      </div>`;
  }).join("");
  return `<div class="fxr-lab">${thisWeek ? "This week, try this" : "Try this"}</div>${items}`;
}

let _openedInPage = false; // true when a focus was opened by tapping a card on the list

function showFocusDetail(focusId, push = true) {
  const f = _focuses.find(x => x.id === focusId);
  if (!f) return;
  _currentDetailId = focusId;
  // Only add a history entry for in-page navigation. On a deep-link (push=false)
  // the current entry IS this focus, so Back returns to the referring page.
  if (push) { _openedInPage = true; history.pushState({ post: focusId }, "", "?post=" + focusId); }
  document.getElementById("focus-main").style.display = "none";
  document.getElementById("focus-detail").style.display = "";
  document.body.classList.remove("fx-idx");
  document.getElementById("focus-detail-card").innerHTML = focusDetailCardHTML(f);
  const db_ = document.getElementById("fx-done-btn");
  if (db_) { db_.style.setProperty("--c", fxTheme(f).c); fxPaintDone(db_, _doneSet.has(focusId)); }
  document.getElementById("focus-detail-comments").innerHTML = `
    <div class="focus-detail-cmt-wrap">
      <div class="tc-comments-section">
        <div class="tc-comments-hdr" id="tc-comments-hdr-${focusId}">Comments</div>
        <div id="tc-comments-list-${focusId}"></div>
        ${Comments.formHtml(focusId)}
      </div>
    </div>`;
  Comments.load(focusId);
  window.scrollTo({ top: 0, behavior: "instant" });
}

function closeFocusDetail() {
  // Take the user back to where they came from: the in-page list (if they tapped a
  // card) or the referring page like community (if they arrived via a deep-link).
  // Fall back to the list when there's no real back target (direct visit/bookmark).
  let sameOriginRef = false;
  try {
    const u = document.referrer ? new URL(document.referrer) : null;
    sameOriginRef = !!u && u.origin === location.origin && u.pathname !== location.pathname;
  } catch {}
  if (_openedInPage || sameOriginRef) { history.back(); return; }
  _currentDetailId = null;
  document.getElementById("focus-detail").style.display = "none";
  document.getElementById("focus-main").style.display = "";
  document.body.classList.add("fx-idx");
  window.scrollTo({ top: 0, behavior: "instant" });
  history.replaceState({}, "", "/focus.html");
}

// ── Admin ⋮ menu (Edit / Delete) ─────────────────────────────────────────────
function _adminMenuHTML(id) {
  if (!isAdmin) return "";
  return `<div class="post-menu-wrap" onclick="event.stopPropagation()">
    <button class="post-menu-btn" onclick="togglePostMenu('${id}',event)" aria-label="Options"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
    <div class="post-menu" id="post-menu-${id}" style="display:none">
      <button class="post-menu-item" onclick="openEditForm('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 9.5-9.5z"/></svg>Edit</button>
      <button class="post-menu-item post-menu-item-danger" onclick="deleteFocus('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>Delete</button>
    </div>
  </div>`;
}
function _closePostMenus() {
  document.querySelectorAll(".post-menu").forEach(m => m.style.display = "none");
}
function togglePostMenu(id, e) {
  if (e) e.stopPropagation();
  const menu = document.getElementById(`post-menu-${id}`);
  if (!menu) return;
  const open = menu.style.display !== "none";
  _closePostMenus();
  if (!open) {
    menu.style.display = "block";
    setTimeout(() => document.addEventListener("click", _closePostMenus, { once: true }), 0);
  }
}
async function deleteFocus(focusId) {
  _closePostMenus();
  if (!confirm("Delete this weekly focus permanently? This cannot be undone.")) return;
  const { error } = await db.from("weekly_focus").delete().eq("id", focusId);
  if (error) { alert("Delete failed: " + error.message); return; }
  _focuses = _focuses.filter(f => f.id !== focusId);
  if (document.getElementById("focus-detail").style.display !== "none") closeFocusDetail();
  renderFocusList();
}

window.addEventListener("popstate", (e) => {
  const postId = e.state?.post || new URLSearchParams(window.location.search).get("post");
  if (postId) {
    showFocusDetail(postId, false);
  } else {
    document.getElementById("focus-detail").style.display = "none";
    document.getElementById("focus-main").style.display = "";
    document.body.classList.add("fx-idx");
    _currentDetailId = null;
  }
});

// ── Admin form ────────────────────────────────────────────────────────────────
let _editFocusId = null; // null = new post, uuid = editing existing

function openFocusForm() {
  _editFocusId = null;
  document.getElementById("focus-form-title").textContent = "New Weekly Focus";
  document.getElementById("ff-submit").textContent = "Publish & Notify Members";
  // Reset fields
  document.getElementById("ff-headline").value = "";
  document.getElementById("ff-intro").value    = "";
  document.getElementById("ff-closing").value  = "";
  document.getElementById("ff-theme").value    = "hands";
  document.getElementById("ff-steps").innerHTML = "";
  _stepCount = 0;
  addStep();
  // Default date = now
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById("ff-date").value = now.toISOString().slice(0, 16);

  document.getElementById("focus-form-wrap").style.display = "";
  document.getElementById("new-focus-btn").style.display = "none";
  { const b = document.getElementById("fx-new"); if (b) b.style.display = "none"; }
  document.getElementById("focus-form-wrap").scrollIntoView({ behavior: "smooth", block: "start" });
}

function openEditForm(focusId) {
  const f = _focuses.find(x => x.id === focusId);
  if (!f) return;

  // If invoked from the detail/post view, return to the main view first — the
  // edit form lives inside #focus-main, which the detail view hides, so the
  // form would otherwise open inside a hidden container (appearing to do nothing).
  if (_currentDetailId) {
    history.pushState({}, "", "/focus.html");
    document.getElementById("focus-detail").style.display = "none";
    document.getElementById("focus-main").style.display = "";
    _currentDetailId = null;
  }

  _editFocusId = focusId;

  document.getElementById("focus-form-title").textContent = "Edit Weekly Focus";
  document.getElementById("ff-submit").textContent = "Save Changes";

  document.getElementById("ff-headline").value = f.headline || "";
  document.getElementById("ff-intro").value    = f.intro    || "";
  document.getElementById("ff-closing").value  = f.closing  || "";
  document.getElementById("ff-theme").value    = f.theme    || "method";

  // Rebuild steps
  document.getElementById("ff-steps").innerHTML = "";
  _stepCount = 0;
  const steps = f.steps || [];
  if (steps.length === 0) {
    addStep();
  } else {
    steps.forEach(s => {
      addStep();
      const rows = document.querySelectorAll(".step-row");
      const row  = rows[rows.length - 1];
      if (row) {
        row.querySelector("textarea").value = s.text || "";
        (s.bullets || []).filter(b => b?.trim()).forEach(b => {
          const stepId = row.id;
          addBullet(stepId);
          const bullets = row.querySelectorAll(".step-bullet-row input");
          bullets[bullets.length - 1].value = b;
        });
      }
    });
  }

  // Set published date
  const pub = new Date(f.published_at);
  pub.setMinutes(pub.getMinutes() - pub.getTimezoneOffset());
  document.getElementById("ff-date").value = pub.toISOString().slice(0, 16);

  document.getElementById("focus-form-wrap").style.display = "";
  document.getElementById("new-focus-btn").style.display = "none";
  { const b = document.getElementById("fx-new"); if (b) b.style.display = "none"; }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeFocusForm() {
  _editFocusId = null;
  document.getElementById("focus-form-wrap").style.display = "none";
  document.getElementById("new-focus-btn").style.display = "";
}

function addStep() {
  _stepCount++;
  const id  = `step-${_stepCount}`;
  const div = document.createElement("div");
  div.className = "step-row";
  div.id = id;
  div.innerHTML = `
    <div class="step-row-top">
      <span class="step-num">${document.querySelectorAll(".step-row").length + 1}.</span>
      <textarea placeholder="Describe what they should do…" rows="2" oninput="autoResizeCmt(this)"></textarea>
      <button class="step-remove-btn" onclick="removeStep('${id}')" title="Remove step">×</button>
    </div>
    <div class="step-bullets" id="bullets-${id}"></div>
    <button class="add-bullet-btn" onclick="addBullet('${id}')">+ Add sub-bullet</button>`;
  document.getElementById("ff-steps").appendChild(div);
  renumberSteps();
}

function removeStep(id) {
  document.getElementById(id)?.remove();
  renumberSteps();
}

function renumberSteps() {
  document.querySelectorAll(".step-row .step-num").forEach((el, i) => {
    el.textContent = `${i + 1}.`;
  });
}

function addBullet(stepId) {
  const wrap = document.getElementById(`bullets-${stepId}`);
  if (!wrap) return;
  const row = document.createElement("div");
  row.className = "step-bullet-row";
  row.innerHTML = `
    <input type="text" placeholder="Sub-bullet point…" />
    <button class="bullet-remove-btn" onclick="this.parentElement.remove()">×</button>`;
  wrap.appendChild(row);
}

function readFormSteps() {
  const steps = [];
  document.querySelectorAll(".step-row").forEach(row => {
    const text    = row.querySelector("textarea")?.value.trim() || "";
    const bullets = [...row.querySelectorAll(".step-bullet-row input")]
      .map(i => i.value.trim()).filter(Boolean);
    if (text || bullets.length) steps.push({ text, bullets });
  });
  return steps;
}

async function publishFocus() {
  const headline     = document.getElementById("ff-headline").value.trim();
  const intro        = document.getElementById("ff-intro").value.trim();
  const closing      = document.getElementById("ff-closing").value.trim();
  const steps        = readFormSteps();
  const theme        = document.getElementById("ff-theme").value;
  const dateVal      = document.getElementById("ff-date").value;
  const published_at = dateVal ? new Date(dateVal).toISOString() : new Date().toISOString();

  if (!headline) { alert("Please add a headline."); return; }
  if (!steps.length || !steps[0].text) { alert("Please add at least one step."); return; }

  const btn = document.getElementById("ff-submit");
  btn.disabled = true;

  if (_editFocusId) {
    // ── Edit existing ─────────────────────────────────────────────────────────
    btn.textContent = "Saving…";
    const { error } = await db.from("weekly_focus")
      .update({ headline, intro, steps, closing, published_at, theme })
      .eq("id", _editFocusId);

    if (error) {
      alert("Failed to save: " + error.message);
      btn.disabled = false; btn.textContent = "Save Changes";
      return;
    }
    closeFocusForm();
    btn.disabled = false; btn.textContent = "Save Changes";
    await loadFocuses();

  } else {
    // ── Create new ────────────────────────────────────────────────────────────
    btn.textContent = "Publishing…";
    const { data: focus, error } = await db.from("weekly_focus")
      .insert({ headline, intro, steps, closing, published_at, theme })
      .select().single();

    if (error) {
      alert("Failed to publish: " + error.message);
      btn.disabled = false; btn.textContent = "Publish & Notify Members";
      return;
    }

    // Notify all members
    btn.textContent = "Notifying members…";
    const { data: members } = await db.from("allowed_emails").select("email");
    if (members?.length) {
      const notifications = members
        .filter(m => m.email !== myEmail)
        .map(m => ({
          email:    m.email,
          type:     "weekly_focus",
          title:    "New Weekly Practice Focus",
          body:     headline.slice(0, 120),
          link_url: `/focus.html?post=${focus.id}`,
          metadata: {},
        }));
      if (notifications.length) await db.from("notifications").insert(notifications);
    }

    closeFocusForm();
    btn.disabled = false; btn.textContent = "Publish & Notify Members";
    await loadFocuses();
  }
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function formatFocusDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const day = d.getDate();
  const suffix = day === 1||day===21||day===31 ? "st" : day===2||day===22 ? "nd" : day===3||day===23 ? "rd" : "th";
  const month  = ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()];
  return `${day}${suffix} ${month} ${d.getFullYear()}`;
}

function autoResizeCmt(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

function escHtml(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}
function avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)",fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)",fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)",fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}
function avatarHtml(email, name, size = 32, avatarUrl = null) {
  const style = `width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;`;
  const hook = email ? ` data-member-email="${escHtml(email)}" style="${style}cursor:pointer;` : ` style="${style}`;
  if (avatarUrl) return `<div${hook}overflow:hidden"><img src="${escHtml(avatarUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block" /></div>`;
  const c = avatarColour(email);
  const ini = initials(name || email?.split("@")[0] || "?");
  const fs  = Math.round(size * 0.34);
  return `<div${hook}background:${c.bg};color:${c.fg};display:flex;align-items:center;justify-content:center;font-size:${fs}px;font-weight:800">${ini}</div>`;
}
function relativeTime(ts) {
  if (!ts) return "";
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if (m < 2)  return "just now";
  if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`;
  if (d === 1) return "yesterday";
  return `${d}d ago`;
}
