<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Practice Focus — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/shared-header.js"></script>
  <style>
    /* ── Light theme (matches community.html) ───────────────────────────────── */
    :root {
      --bg:           #faf7f3;
      --surface:      #ffffff;
      --surface-2:    #f0ebe2;
      --border:       #e0d5c8;
      --text:         #1a1410;
      --text-muted:   #8a7868;
      --accent-subtle:#fdf0d8;
    }
    body { background: var(--bg); }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    #focus-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    /* ── Page header ─────────────────────────────────────────────────────────── */
    .focus-page-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .focus-page-hdr h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }
    .focus-page-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Admin form card ────────────────────────────────────────────────────── */
    .focus-form-card {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
    }
    .focus-form-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 20px;
    }
    .focus-form-field { margin-bottom: 16px; }
    .focus-form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .focus-form-input,
    .focus-form-textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      resize: vertical;
      transition: border-color .15s;
    }
    .focus-form-input:focus,
    .focus-form-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Steps builder */
    .steps-builder { display: flex; flex-direction: column; gap: 10px; }
    .step-row {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .step-row-top { display: flex; gap: 8px; align-items: flex-start; }
    .step-num {
      font-size: 0.78rem; font-weight: 800;
      color: var(--accent);
      width: 20px; flex-shrink: 0;
      padding-top: 10px;
    }
    .step-row-top textarea {
      flex: 1;
      padding: 8px 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text);
      resize: vertical;
      min-height: 48px;
      transition: border-color .15s;
    }
    .step-row-top textarea:focus { outline: none; border-color: var(--accent); }
    .step-remove-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 8px 4px; font-size: 1rem;
      flex-shrink: 0;
    }
    .step-remove-btn:hover { color: #e53e3e; }
    .step-bullets { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .step-bullet-row { display: flex; gap: 6px; align-items: center; margin-left: 28px; }
    .step-bullet-row input {
      flex: 1;
      padding: 6px 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
    }
    .step-bullet-row input:focus { outline: none; border-color: var(--accent); }
    .bullet-remove-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1rem;
    }
    .bullet-remove-btn:hover { color: #e53e3e; }
    .add-bullet-btn {
      margin-left: 28px; margin-top: 4px;
      background: none; border: none; cursor: pointer;
      font-size: 0.78rem; color: var(--text-muted);
      font-family: inherit; padding: 2px 0;
      text-decoration: underline;
    }
    .add-bullet-btn:hover { color: var(--text); }
    .add-step-btn {
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text-muted);
      width: 100%;
      transition: border-color .15s, color .15s;
    }
    .add-step-btn:hover { border-color: var(--accent); color: var(--accent); }
    .form-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    /* ── Focus card ─────────────────────────────────────────────────────────── */
    .focus-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
      transition: border-color .15s;
    }
    .focus-card:hover { border-color: rgba(245,197,24,.4); }

    /* Accent header strip */
    .focus-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 18px;
      background: linear-gradient(90deg, rgba(245,197,24,.14) 0%, rgba(245,197,24,.04) 100%);
      border-bottom: 1.5px solid rgba(245,197,24,.22);
      border-left: 3.5px solid var(--accent);
    }
    .focus-card-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #b8900a;
    }
    .focus-card-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .focus-this-week-badge {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--accent);
      color: #1a1410;
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* Card body */
    .focus-card-body { padding: 20px 22px 16px; }
    .focus-headline {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin: 0 0 10px;
    }
    .focus-intro-preview {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Expand toggle */
    .focus-card-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 22px 14px;
    }
    .focus-footer-btn {
      background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.83rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 0;
      transition: color .15s;
    }
    .focus-footer-btn:hover { color: var(--text); }
    .focus-footer-btn.liked { color: #e53e3e; }
    .focus-expand-btn {
      margin-left: auto;
      background: none; border: 1.5px solid var(--border);
      border-radius: 6px; padding: 5px 14px;
      font-size: 0.8rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      font-family: inherit;
      transition: border-color .15s, color .15s;
    }
    .focus-expand-btn:hover { border-color: var(--accent); color: var(--accent); }
    .focus-meta-counts { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; }

    /* ── Expanded content ────────────────────────────────────────────────────── */
    .focus-expanded {
      border-top: 1.5px solid var(--border);
      padding: 20px 22px;
    }
    .focus-expanded-headline {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 14px;
      line-height: 1.4;
    }
    .focus-expanded-headline em {
      font-style: normal;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.92rem;
    }
    .focus-body-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .focus-try-label {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .focus-steps { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 10px; }
    .focus-step { display: flex; gap: 12px; align-items: flex-start; }
    .focus-step-num {
      min-width: 24px; height: 24px;
      background: var(--accent);
      color: #1a1410;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .focus-step-content { flex: 1; font-size: 0.9rem; color: var(--text); line-height: 1.55; }
    .focus-step-bullets { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
    .focus-step-bullet {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 0.88rem; color: var(--text-muted); line-height: 1.5;
    }
    .focus-step-bullet::before {
      content: "•";
      color: var(--accent);
      font-size: 1rem;
      line-height: 1.5;
      flex-shrink: 0;
    }
    .focus-divider {
      height: 1.5px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── Admin edit button on card ──────────────────────────────────────────── */
    .focus-edit-btn {
      background: none; border: 1px solid rgba(245,197,24,.4);
      border-radius: 5px; padding: 2px 9px;
      font-size: 0.72rem; font-weight: 700; color: #b8900a;
      cursor: pointer; font-family: inherit;
      transition: background .15s, border-color .15s;
      margin-left: auto;
    }
    .focus-edit-btn:hover { background: rgba(245,197,24,.15); border-color: var(--accent); }

    /* ── Comments — matches community.html style ──────────────────────────── */
    .focus-comments-wrap {
      padding: 0 22px 22px;
    }
    .comments-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 0;
    }
    .comments-hdr {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.76rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted);
    }
    .comment-item {
      display: flex; gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .comment-item:last-of-type { border-bottom: none; }
    .comment-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 800; flex-shrink: 0; margin-top: 1px;
    }
    .comment-body { flex: 1; min-width: 0; }
    .comment-meta {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 3px;
    }
    .comment-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .comment-time { font-size: 0.7rem; color: var(--text-muted); }
    .comment-text {
      font-size: 0.87rem; color: var(--text-muted);
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .reply-to-name { color: var(--accent); font-weight: 600; margin-right: 3px; }
    .comments-empty {
      padding: 22px 18px; text-align: center;
      color: var(--text-muted); font-size: 0.82rem;
    }
    /* Reply button */
    .comment-reply-btn {
      background: none; border: none; cursor: pointer; font-family: inherit;
      font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
      padding: 3px 0; transition: color .15s; display: inline-block; margin-top: 3px;
    }
    .comment-reply-btn:hover { color: var(--accent); }
    /* Replies indent */
    .comment-replies { margin-left: 36px; margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
    /* Inline reply composer */
    .inline-reply-composer {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 18px; border-top: 1px solid var(--border);
    }
    .inline-reply-composer textarea {
      flex: 1; min-width: 0;
      background: transparent; border: 1.5px solid var(--accent);
      border-radius: 16px; color: var(--text); font-size: 0.85rem;
      font-family: inherit; padding: 7px 12px; resize: none;
      min-height: 34px; max-height: 100px;
    }
    .inline-reply-composer textarea:focus { outline: none; }
    .irc-actions {
      display: flex; justify-content: flex-end; gap: 14px;
      margin-top: 5px; padding-left: 38px;
    }
    .irc-send {
      background: none; border: none; font-family: inherit;
      font-size: 0.8rem; font-weight: 700; cursor: pointer; color: var(--accent); padding: 0;
    }
    .irc-cancel {
      background: none; border: none; font-family: inherit;
      font-size: 0.8rem; cursor: pointer; color: var(--text-muted); padding: 0;
    }
    .irc-cancel:hover { color: var(--text); }
    /* Comment input form at bottom */
    .comment-form {
      display: flex; gap: 10px; align-items: flex-end;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      flex-direction: column;
    }
    .comment-form-row { display: flex; gap: 10px; align-items: flex-end; width: 100%; }
    .comment-input {
      flex: 1; background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 20px; color: var(--text);
      font-size: 0.87rem; font-family: inherit;
      padding: 9px 14px; resize: none; min-height: 38px; max-height: 120px;
      transition: border-color .15s;
    }
    .comment-input:focus { outline: none; border-color: var(--accent); }
    .comment-send-btn {
      background: var(--accent); color: #1a1410; border: none;
      border-radius: 20px; padding: 0 18px; height: 38px;
      font-family: inherit; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; flex-shrink: 0; transition: opacity .15s;
    }
    .comment-send-btn:hover { opacity: .85; }
    /* Media toolbar */
    .cmt-media-toolbar {
      display: flex; gap: 6px;
    }
    .cmt-media-btn {
      background: none; border: 1.5px solid var(--border);
      border-radius: 6px; padding: 4px 8px;
      cursor: pointer; color: var(--text-muted); font-size: 0.76rem;
      display: inline-flex; align-items: center; gap: 4px;
      font-family: inherit; transition: border-color .15s, color .15s;
    }
    .cmt-media-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cmt-media-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 8px;
      font-size: 0.76rem; color: var(--text-muted);
    }
    .cmt-media-chip button {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 0; font-size: 0.85rem; line-height: 1;
    }
    .cmt-media-preview { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    /* Comment media display */
    .comment-media img {
      max-width: 100%; max-height: 240px; border-radius: 8px;
      margin-top: 7px; object-fit: cover; cursor: zoom-in;
    }
    .comment-media video { max-width: 100%; max-height: 240px; border-radius: 8px; margin-top: 7px; }
    .comment-media audio { width: 100%; margin-top: 7px; }

    /* Empty state */
    .focus-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Archive section header */
    .focus-archive-hdr {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin: 32px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--border);
    }

    @media (max-width: 600px) {
      .focus-card-body { padding: 16px 16px 12px; }
      .focus-card-footer { padding: 8px 16px 12px; }
      .focus-expanded { padding: 16px; }
      .focus-comments-wrap { padding: 0 14px 14px; }
    }
  </style>
</head>
<body>

  <header id="app-header" style="display:none"></header>

  <main>
<div id="focus-main" style="display:none">
  <div class="focus-page-hdr">
    <div>
      <h2>Weekly Practice Focus</h2>
      <p class="focus-page-desc">A new technique or concept to work on each week — by Matthew Cawood.</p>
    </div>
    <button id="new-focus-btn" class="btn btn-primary" onclick="openFocusForm()" style="display:none">+ New Focus</button>
  </div>

  <!-- Admin write form -->
  <div id="focus-form-wrap" style="display:none">
    <div class="focus-form-card">
      <h3 id="focus-form-title">New Weekly Focus</h3>

      <div class="focus-form-field">
        <label class="focus-form-label">Headline — what members will work on this week</label>
        <input id="ff-headline" class="focus-form-input" type="text"
               placeholder="e.g. Learn to group notes instead of controlling every note individually" />
      </div>

      <div class="focus-form-field">
        <label class="focus-form-label">Intro — 1–2 sentences explaining the concept</label>
        <textarea id="ff-intro" class="focus-form-textarea" rows="3"
                  placeholder="One of the biggest reasons fast passages feel difficult…"></textarea>
      </div>

      <div class="focus-form-field">
        <label class="focus-form-label">Steps — "This week, try this:"</label>
        <div id="ff-steps" class="steps-builder"></div>
        <button class="add-step-btn" onclick="addStep()">+ Add step</button>
      </div>

      <div class="focus-form-field">
        <label class="focus-form-label">Closing — takeaway or encouragement</label>
        <textarea id="ff-closing" class="focus-form-textarea" rows="3"
                  placeholder="You may notice that the passage suddenly feels smoother…"></textarea>
      </div>

      <div class="focus-form-field">
        <label class="focus-form-label">Published date</label>
        <input id="ff-date" class="focus-form-input" type="datetime-local" />
        <p style="font-size:.76rem;color:var(--text-muted);margin:4px 0 0">Leave as-is for today, or backdate if needed.</p>
      </div>

      <div class="form-actions">
        <button class="btn btn-ghost btn-sm" onclick="closeFocusForm()">Cancel</button>
        <button id="ff-submit" class="btn btn-primary" onclick="publishFocus()">Publish &amp; Notify Members</button>
      </div>
    </div>
  </div>

  <!-- Focus list -->
  <div id="focus-list">
    <div class="focus-empty">
      <div class="loading-spinner" style="margin: 0 auto 12px"></div>
      Loading…
    </div>
  </div>
</div>
  </main>

<script>
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db        = supabase.createClient(SUPA_URL, SUPA_ANON);
const OWNER_EMAIL = "matthew@matthewcawood.com";

let myEmail    = null;
let myName     = null;
let myAvatarUrl = null;
let isAdmin    = false;
let _focuses   = [];      // loaded focus rows + metadata
let _expanded  = new Set(); // focus IDs currently expanded
let _stepCount = 0;         // for unique step IDs in form

// ── Auth ──────────────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails")
    .select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName      = ae?.name || myEmail.split("@")[0];
  myAvatarUrl = ae?.avatar_url || null;
  isAdmin     = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "studio", avatarUrl: myAvatarUrl });

  if (isAdmin) {
    document.getElementById("new-focus-btn").style.display = "";
  }

  document.getElementById("focus-main").style.display = "";

  // Deep-link: ?focus=<id>
  const deepId = new URLSearchParams(window.location.search).get("focus");

  await loadFocuses(deepId);
})();

// ── Load focuses ──────────────────────────────────────────────────────────────
async function loadFocuses(autoExpandId = null) {
  const list = document.getElementById("focus-list");
  list.innerHTML = '<div class="focus-empty"><div class="loading-spinner" style="margin:0 auto 12px"></div>Loading…</div>';

  const { data: rows, error } = await db
    .from("weekly_focus")
    .select("*")
    .order("published_at", { ascending: false });

  if (error || !rows) {
    list.innerHTML = '<div class="focus-empty">Could not load focuses.</div>';
    return;
  }
  if (!rows.length) {
    list.innerHTML = `<div class="focus-empty">No weekly focuses yet${isAdmin ? " — publish the first one above!" : "."}</div>`;
    return;
  }

  const ids = rows.map(r => r.id);
  const [{ data: allLikes }, { data: myLikes }, { data: cmtCounts }] = await Promise.all([
    db.from("weekly_focus_likes").select("focus_id,email").in("focus_id", ids),
    db.from("weekly_focus_likes").select("focus_id").eq("email", myEmail).in("focus_id", ids),
    db.from("weekly_focus_comments").select("focus_id").in("focus_id", ids),
  ]);

  const likeCountMap = {}, myLikeSet = new Set(), cmtCountMap = {};
  (allLikes || []).forEach(l => likeCountMap[l.focus_id] = (likeCountMap[l.focus_id] || 0) + 1);
  (myLikes  || []).forEach(l => myLikeSet.add(l.focus_id));
  (cmtCounts|| []).forEach(c => cmtCountMap[c.focus_id] = (cmtCountMap[c.focus_id] || 0) + 1);

  _focuses = rows.map((r, i) => ({
    ...r,
    likeCount:   likeCountMap[r.id] || 0,
    commentCount:cmtCountMap[r.id]  || 0,
    iLiked:      myLikeSet.has(r.id),
    isCurrentWeek: i === 0,
  }));

  // Auto-expand: current week + deep-link target
  _expanded.clear();
  if (_focuses.length) _expanded.add(_focuses[0].id); // always expand latest
  if (autoExpandId)    _expanded.add(autoExpandId);

  renderFocusList();

  if (autoExpandId) {
    const el = document.getElementById(`focus-${autoExpandId}`);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 100);
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderFocusList() {
  const list = document.getElementById("focus-list");
  if (!_focuses.length) return;

  const [current, ...archive] = _focuses;

  let html = focusCardHTML(current);
  if (archive.length) {
    html += `<div class="focus-archive-hdr">Previous focuses</div>`;
    archive.forEach(f => { html += focusCardHTML(f); });
  }
  list.innerHTML = html;

  // Load comments for expanded focuses
  _focuses.forEach(f => {
    if (_expanded.has(f.id)) loadComments(f.id);
  });
}

function focusCardHTML(f) {
  const dateStr    = formatFocusDate(f.published_at);
  const isExpanded = _expanded.has(f.id);
  const introText  = (f.intro || "").split("\n")[0];

  const headerBadge = f.isCurrentWeek
    ? `<span class="focus-this-week-badge">This Week</span>`
    : "";
  const editBtn = isAdmin
    ? `<button class="focus-edit-btn" onclick="event.stopPropagation();openEditForm('${f.id}')">✏️ Edit</button>`
    : "";

  const likeIcon = `<svg viewBox="0 0 24 24" width="14" height="14"
    ${f.iLiked ? 'fill="currentColor" stroke="currentColor" stroke-width="1.5"' : 'fill="none" stroke="currentColor" stroke-width="2"'}
    stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;

  const collapsedBody = !isExpanded ? `
    <div class="focus-card-body">
      <div class="focus-headline">${escHtml(f.headline)}</div>
      <div class="focus-intro-preview">${escHtml(introText)}</div>
    </div>
    <div class="focus-card-footer">
      <button class="focus-footer-btn${f.iLiked ? " liked" : ""}" onclick="toggleLike('${f.id}')">
        ${likeIcon}${f.likeCount > 0 ? ` ${f.likeCount}` : ""}
      </button>
      <span class="focus-meta-counts">
        ${[f.likeCount ? `${f.likeCount} like${f.likeCount!==1?"s":""}` : "",
           f.commentCount ? `${f.commentCount} comment${f.commentCount!==1?"s":""}` : ""].filter(Boolean).join(" · ")}
      </span>
      <button class="focus-expand-btn" onclick="toggleExpand('${f.id}')">Read focus ↓</button>
    </div>` : "";

  const expandedBody = isExpanded ? `
    <div class="focus-expanded">
      <div class="focus-expanded-headline">
        <em>This week:</em> ${escHtml(f.headline)}
      </div>
      ${f.intro ? `<div class="focus-body-text">${escHtml(f.intro)}</div>` : ""}
      ${renderSteps(f.steps)}
      ${f.closing ? `<div class="focus-body-text">${escHtml(f.closing)}</div>` : ""}
      <div class="focus-divider"></div>
      <div style="display:flex;align-items:center;gap:12px">
        <button class="focus-footer-btn${f.iLiked ? " liked" : ""}" onclick="toggleLike('${f.id}')">
          ${likeIcon} ${f.iLiked ? "Liked" : "Like"}${f.likeCount > 0 ? ` · ${f.likeCount}` : ""}
        </button>
        <button class="focus-expand-btn" onclick="toggleExpand('${f.id}')">Close ↑</button>
      </div>
    </div>
    <div class="focus-comments-wrap" id="comments-section-${f.id}">
      <div class="comments-section">
        <div class="comments-hdr" id="comments-hdr-${f.id}">Comments</div>
        <div id="comments-list-${f.id}"></div>
        <div class="comment-form">
          <div class="comment-form-row">
            ${avatarHtml(myEmail, myName, 28, myAvatarUrl)}
            <textarea class="comment-input" id="cmt-input-${f.id}" rows="1"
              placeholder="Share your experience or ask a question…"
              oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
            <button class="comment-send-btn" onclick="submitComment('${f.id}')">Send</button>
          </div>
          <div id="cmt-media-${f.id}" class="cmt-media-preview"></div>
          <div class="cmt-media-toolbar">
            <button class="cmt-media-btn" onclick="pickCmtImage('${f.id}')">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Photo
            </button>
            <button class="cmt-media-btn" onclick="pickCmtVideo('${f.id}')">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg> Video
            </button>
          </div>
        </div>
      </div>
    </div>` : "";

  return `
    <div class="focus-card" id="focus-${f.id}">
      <div class="focus-card-header">
        <span class="focus-card-label">🎯 Weekly Practice Focus</span>
        ${headerBadge}
        <span class="focus-card-date">${dateStr}</span>
        ${editBtn}
      </div>
      ${collapsedBody}
      ${expandedBody}
    </div>`;
}

function renderSteps(steps) {
  if (!steps?.length) return "";
  const items = steps.map((s, i) => {
    const bullets = (s.bullets || []).filter(b => b?.trim()).map(b =>
      `<div class="focus-step-bullet">${escHtml(b)}</div>`
    ).join("");
    return `
      <li class="focus-step">
        <span class="focus-step-num">${i + 1}</span>
        <div class="focus-step-content">
          ${escHtml(s.text || "")}
          ${bullets ? `<div class="focus-step-bullets">${bullets}</div>` : ""}
        </div>
      </li>`;
  }).join("");
  return `
    <div class="focus-try-label">This week, try this:</div>
    <ul class="focus-steps">${items}</ul>`;
}

function toggleExpand(focusId) {
  if (_expanded.has(focusId)) {
    _expanded.delete(focusId);
  } else {
    _expanded.add(focusId);
  }
  renderFocusList();
  if (_expanded.has(focusId)) {
    loadComments(focusId);
    setTimeout(() => {
      document.getElementById(`focus-${focusId}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 50);
  }
}

// ── Likes ─────────────────────────────────────────────────────────────────────
async function toggleLike(focusId) {
  const f = _focuses.find(x => x.id === focusId);
  if (!f) return;
  if (f.iLiked) {
    await db.from("weekly_focus_likes").delete().eq("focus_id", focusId).eq("email", myEmail);
    f.likeCount = Math.max(0, f.likeCount - 1);
    f.iLiked = false;
  } else {
    await db.from("weekly_focus_likes").insert({ focus_id: focusId, email: myEmail });
    f.likeCount++;
    f.iLiked = true;
  }
  renderFocusList();
  if (_expanded.has(focusId)) loadComments(focusId);
}

// ── Comments ──────────────────────────────────────────────────────────────────
let _cmtMedia = {}; // focusId → [{ type, url, name, blob }]

async function loadComments(focusId) {
  const listEl = document.getElementById(`comments-list-${focusId}`);
  const hdrEl  = document.getElementById(`comments-hdr-${focusId}`);
  if (!listEl) return;

  const { data: comments } = await db.from("weekly_focus_comments")
    .select("*")
    .eq("focus_id", focusId)
    .order("created_at", { ascending: true });

  const count = comments?.length || 0;
  if (hdrEl) hdrEl.textContent = count === 0 ? "Comments" : `${count} Comment${count !== 1 ? "s" : ""}`;

  // Update comment count in focus metadata
  const f = _focuses.find(x => x.id === focusId);
  if (f) f.commentCount = count;

  if (!count) {
    listEl.innerHTML = `<div class="comments-empty">No comments yet — be the first!</div>`;
    return;
  }

  // Fetch avatars for comment authors
  const emails = [...new Set(comments.map(c => c.email))];
  const { data: avatarRows } = await db.from("allowed_emails")
    .select("email,avatar_url,badge").in("email", emails);
  const avatarMap = {}, badgeMap = {};
  (avatarRows||[]).forEach(r => {
    if (r.avatar_url) avatarMap[r.email] = r.avatar_url;
    if (r.badge)      badgeMap[r.email]  = r.badge;
  });

  // Split into top-level and replies
  const topLevel = comments.filter(c => !c.parent_comment_id);
  const replyMap = {};
  comments.filter(c => c.parent_comment_id).forEach(c => {
    (replyMap[c.parent_comment_id] = replyMap[c.parent_comment_id] || []).push(c);
  });

  function commentHTML(c, isReply = false) {
    const dispName = escHtml(c.name || c.email.split("@")[0]);
    const badge    = badgeMap[c.email] ? `<span class="author-badge">${escHtml(badgeMap[c.email])}</span>` : "";
    const canDel   = isAdmin || c.email === myEmail;
    const replyPrefix = (isReply && c.reply_to_name)
      ? `<span class="reply-to-name">@${escHtml(c.reply_to_name)}</span> ` : "";

    let mediaHtml = "";
    (c.media || []).forEach(m => {
      if      (m.type === "image") mediaHtml += `<div class="comment-media"><img src="${escHtml(m.url)}" loading="lazy" onclick="_focusImgModal('${escHtml(m.url)}')" /></div>`;
      else if (m.type === "video") mediaHtml += `<div class="comment-media"><video controls src="${escHtml(m.url)}" preload="metadata"></video></div>`;
      else if (m.type === "audio") mediaHtml += `<div class="comment-media"><audio controls preload="metadata"><source src="${escHtml(m.url)}"></audio></div>`;
    });

    return `
      <div class="comment-item${isReply ? " is-reply" : ""}" id="cmt-${c.id}">
        ${avatarHtml(c.email, c.name, 28, avatarMap[c.email])}
        <div class="comment-body">
          <div class="comment-meta">
            <span class="comment-name">${dispName}</span>${badge}
            <span class="comment-time">${relativeTime(c.created_at)}</span>
            ${canDel ? `<button onclick="deleteComment('${c.id}','${focusId}')" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:.7rem;color:var(--text-muted);padding:0 4px;font-family:inherit" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--text-muted)'">Delete</button>` : ""}
          </div>
          ${c.content ? `<div class="comment-text">${replyPrefix}${escHtml(c.content)}</div>` : ""}
          ${mediaHtml}
          ${!isReply ? `<button class="comment-reply-btn" onclick="startFocusReply('${focusId}','${c.id}','${dispName.replace(/'/g,"\\'")}','${c.email.replace(/'/g,"\\'")}')">Reply</button>` : ""}
        </div>
      </div>`;
  }

  listEl.innerHTML = topLevel.map(c => {
    const replies = (replyMap[c.id] || []).map(r => commentHTML(r, true)).join("");
    const replyComposer = `
      <div id="reply-composer-${c.id}" class="inline-reply-composer" style="display:none">
        ${avatarHtml(myEmail, myName, 28, myAvatarUrl)}
        <div style="flex:1;min-width:0">
          <textarea placeholder="Write a reply…" rows="1"
            oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"
          ></textarea>
          <div class="irc-actions">
            <button class="irc-cancel" onclick="cancelFocusReply('${c.id}')">Cancel</button>
            <button class="irc-send" onclick="submitReply('${focusId}','${c.id}',this.closest('.inline-reply-composer'))">Send</button>
          </div>
        </div>
      </div>`;
    return commentHTML(c) +
      `<div class="comment-replies">${replies}${replyComposer}</div>`;
  }).join("");
}

function startFocusReply(focusId, parentId, authorName, authorEmail) {
  // Close any other open reply composers
  document.querySelectorAll("[id^='reply-composer-']").forEach(el => {
    if (el.style.display !== "none") el.style.display = "none";
  });
  const composer = document.getElementById(`reply-composer-${parentId}`);
  if (!composer) return;
  composer.style.display = "flex";
  composer.dataset.replyToName  = authorName;
  composer.dataset.replyToEmail = authorEmail;
  const ta = composer.querySelector("textarea");
  if (ta) { ta.value = ""; ta.focus(); }
}

function cancelFocusReply(parentId) {
  const composer = document.getElementById(`reply-composer-${parentId}`);
  if (composer) { composer.style.display = "none"; const ta = composer.querySelector("textarea"); if (ta) ta.value = ""; }
}

async function submitComment(focusId) {
  const ta      = document.getElementById(`cmt-input-${focusId}`);
  const content = ta?.value.trim() || "";
  const media   = _cmtMedia[focusId] || [];
  if (!content && !media.length) return;

  ta.disabled = true;

  const uploaded = await uploadCmtMedia(focusId);
  const { error } = await db.from("weekly_focus_comments").insert({
    focus_id: focusId, email: myEmail, name: myName,
    content, media: uploaded.length ? uploaded : null,
  });

  ta.disabled = false;
  if (error) { alert("Couldn't post: " + error.message); return; }

  ta.value = ""; ta.style.height = "";
  _cmtMedia[focusId] = [];
  renderMediaPreview(focusId);

  // Update comment count
  const f = _focuses.find(x => x.id === focusId);
  if (f) f.commentCount++;

  await loadComments(focusId);
}

async function submitReply(focusId, parentId, composerEl) {
  const ta      = composerEl?.querySelector("textarea");
  const content = ta?.value.trim() || "";
  if (!content) return;

  const replyToName  = composerEl?.dataset.replyToName  || null;
  const replyToEmail = composerEl?.dataset.replyToEmail || null;

  if (ta) ta.disabled = true;
  const { error } = await db.from("weekly_focus_comments").insert({
    focus_id: focusId, email: myEmail, name: myName,
    content, parent_comment_id: parentId, reply_to_name: replyToName,
  });
  if (ta) ta.disabled = false;
  if (error) { alert("Couldn't post reply: " + error.message); return; }

  // Notify the person being replied to
  if (replyToEmail && replyToEmail !== myEmail) {
    await db.from("notifications").insert({
      email: replyToEmail, type: "comment_reply",
      title: `${myName || "Someone"} replied to your comment`,
      body: content.slice(0, 120),
      link_url: `/focus.html?focus=${focusId}`,
      metadata: {},
    });
  }

  cancelFocusReply(parentId);
  await loadComments(focusId);
}

async function deleteComment(commentId, focusId) {
  if (!confirm("Delete this comment?")) return;
  await db.from("weekly_focus_comments").delete().eq("id", commentId);
  const f = _focuses.find(x => x.id === focusId);
  if (f && f.commentCount > 0) f.commentCount--;
  await loadComments(focusId);
}

// ── Comment media ─────────────────────────────────────────────────────────────
function pickCmtImage(focusId) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*"; inp.multiple = true;
  inp.onchange = async () => {
    for (const file of inp.files) {
      const url = await uploadToStorage(file, "image");
      (_cmtMedia[focusId] = _cmtMedia[focusId] || []).push({ type: "image", url, name: file.name });
    }
    renderMediaPreview(focusId);
  };
  inp.click();
}

function pickCmtVideo(focusId) {
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "video/*";
  inp.onchange = async () => {
    const file = inp.files[0]; if (!file) return;
    const url = await uploadToStorage(file, "video");
    (_cmtMedia[focusId] = _cmtMedia[focusId] || []).push({ type: "video", url, name: file.name });
    renderMediaPreview(focusId);
  };
  inp.click();
}

async function uploadToStorage(file, type) {
  const ext  = file.name.split(".").pop() || (type === "image" ? "jpg" : "mp4");
  const path = `focus-comments/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  const { data, error } = await db.storage.from("community-uploads").upload(path, file);
  if (error) throw error;
  return db.storage.from("community-uploads").getPublicUrl(data.path).data.publicUrl;
}

async function uploadCmtMedia(focusId) {
  // Media is pre-uploaded when selected, just return the array
  return (_cmtMedia[focusId] || []).map(m => ({ type: m.type, url: m.url, name: m.name }));
}

function renderMediaPreview(focusId) {
  const wrap = document.getElementById(`cmt-media-${focusId}`);
  if (!wrap) return;
  const items = _cmtMedia[focusId] || [];
  wrap.innerHTML = items.map((m, i) => `
    <div class="cmt-media-chip">
      ${m.type === "image" ? "🖼" : "🎬"} ${escHtml(m.name || m.type)}
      <button onclick="removeCmtMedia('${focusId}',${i})">×</button>
    </div>`).join("");
}

function removeCmtMedia(focusId, idx) {
  if (_cmtMedia[focusId]) _cmtMedia[focusId].splice(idx, 1);
  renderMediaPreview(focusId);
}

function _focusImgModal(url) {
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:9999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;";
  overlay.innerHTML = `<img src="${escHtml(url)}" style="max-width:92vw;max-height:92vh;border-radius:8px;object-fit:contain">`;
  overlay.onclick = () => overlay.remove();
  document.body.appendChild(overlay);
}

// ── Admin form ────────────────────────────────────────────────────────────────
let _editFocusId = null; // null = new post, uuid = editing existing

function openFocusForm() {
  _editFocusId = null;
  document.getElementById("focus-form-title").textContent = "New Weekly Focus";
  document.getElementById("ff-submit").textContent = "Publish & Notify Members";
  // Reset fields
  document.getElementById("ff-headline").value = "";
  document.getElementById("ff-intro").value    = "";
  document.getElementById("ff-closing").value  = "";
  document.getElementById("ff-steps").innerHTML = "";
  _stepCount = 0;
  addStep();
  // Default date = now
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById("ff-date").value = now.toISOString().slice(0, 16);

  document.getElementById("focus-form-wrap").style.display = "";
  document.getElementById("new-focus-btn").style.display = "none";
  document.getElementById("focus-form-wrap").scrollIntoView({ behavior: "smooth", block: "start" });
}

function openEditForm(focusId) {
  const f = _focuses.find(x => x.id === focusId);
  if (!f) return;
  _editFocusId = focusId;

  document.getElementById("focus-form-title").textContent = "Edit Weekly Focus";
  document.getElementById("ff-submit").textContent = "Save Changes";

  document.getElementById("ff-headline").value = f.headline || "";
  document.getElementById("ff-intro").value    = f.intro    || "";
  document.getElementById("ff-closing").value  = f.closing  || "";

  // Rebuild steps
  document.getElementById("ff-steps").innerHTML = "";
  _stepCount = 0;
  const steps = f.steps || [];
  if (steps.length === 0) {
    addStep();
  } else {
    steps.forEach(s => {
      addStep();
      const rows = document.querySelectorAll(".step-row");
      const row  = rows[rows.length - 1];
      if (row) {
        row.querySelector("textarea").value = s.text || "";
        (s.bullets || []).filter(b => b?.trim()).forEach(b => {
          const stepId = row.id;
          addBullet(stepId);
          const bullets = row.querySelectorAll(".step-bullet-row input");
          bullets[bullets.length - 1].value = b;
        });
      }
    });
  }

  // Set published date
  const pub = new Date(f.published_at);
  pub.setMinutes(pub.getMinutes() - pub.getTimezoneOffset());
  document.getElementById("ff-date").value = pub.toISOString().slice(0, 16);

  document.getElementById("focus-form-wrap").style.display = "";
  document.getElementById("new-focus-btn").style.display = "none";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeFocusForm() {
  _editFocusId = null;
  document.getElementById("focus-form-wrap").style.display = "none";
  document.getElementById("new-focus-btn").style.display = "";
}

function addStep() {
  _stepCount++;
  const id  = `step-${_stepCount}`;
  const div = document.createElement("div");
  div.className = "step-row";
  div.id = id;
  div.innerHTML = `
    <div class="step-row-top">
      <span class="step-num">${document.querySelectorAll(".step-row").length + 1}.</span>
      <textarea placeholder="Describe what they should do…" rows="2" oninput="autoResizeCmt(this)"></textarea>
      <button class="step-remove-btn" onclick="removeStep('${id}')" title="Remove step">×</button>
    </div>
    <div class="step-bullets" id="bullets-${id}"></div>
    <button class="add-bullet-btn" onclick="addBullet('${id}')">+ Add sub-bullet</button>`;
  document.getElementById("ff-steps").appendChild(div);
  renumberSteps();
}

function removeStep(id) {
  document.getElementById(id)?.remove();
  renumberSteps();
}

function renumberSteps() {
  document.querySelectorAll(".step-row .step-num").forEach((el, i) => {
    el.textContent = `${i + 1}.`;
  });
}

function addBullet(stepId) {
  const wrap = document.getElementById(`bullets-${stepId}`);
  if (!wrap) return;
  const row = document.createElement("div");
  row.className = "step-bullet-row";
  row.innerHTML = `
    <input type="text" placeholder="Sub-bullet point…" />
    <button class="bullet-remove-btn" onclick="this.parentElement.remove()">×</button>`;
  wrap.appendChild(row);
}

function readFormSteps() {
  const steps = [];
  document.querySelectorAll(".step-row").forEach(row => {
    const text    = row.querySelector("textarea")?.value.trim() || "";
    const bullets = [...row.querySelectorAll(".step-bullet-row input")]
      .map(i => i.value.trim()).filter(Boolean);
    if (text || bullets.length) steps.push({ text, bullets });
  });
  return steps;
}

async function publishFocus() {
  const headline     = document.getElementById("ff-headline").value.trim();
  const intro        = document.getElementById("ff-intro").value.trim();
  const closing      = document.getElementById("ff-closing").value.trim();
  const steps        = readFormSteps();
  const dateVal      = document.getElementById("ff-date").value;
  const published_at = dateVal ? new Date(dateVal).toISOString() : new Date().toISOString();

  if (!headline) { alert("Please add a headline."); return; }
  if (!steps.length || !steps[0].text) { alert("Please add at least one step."); return; }

  const btn = document.getElementById("ff-submit");
  btn.disabled = true;

  if (_editFocusId) {
    // ── Edit existing ─────────────────────────────────────────────────────────
    btn.textContent = "Saving…";
    const { error } = await db.from("weekly_focus")
      .update({ headline, intro, steps, closing, published_at })
      .eq("id", _editFocusId);

    if (error) {
      alert("Failed to save: " + error.message);
      btn.disabled = false; btn.textContent = "Save Changes";
      return;
    }
    closeFocusForm();
    btn.disabled = false; btn.textContent = "Save Changes";
    await loadFocuses(_editFocusId);

  } else {
    // ── Create new ────────────────────────────────────────────────────────────
    btn.textContent = "Publishing…";
    const { data: focus, error } = await db.from("weekly_focus")
      .insert({ headline, intro, steps, closing, published_at })
      .select().single();

    if (error) {
      alert("Failed to publish: " + error.message);
      btn.disabled = false; btn.textContent = "Publish & Notify Members";
      return;
    }

    // Notify all members
    btn.textContent = "Notifying members…";
    const { data: members } = await db.from("allowed_emails").select("email");
    if (members?.length) {
      const notifications = members
        .filter(m => m.email !== myEmail)
        .map(m => ({
          email:    m.email,
          type:     "weekly_focus",
          title:    "New Weekly Practice Focus",
          body:     headline.slice(0, 120),
          link_url: `/focus.html?focus=${focus.id}`,
          metadata: {},
        }));
      if (notifications.length) await db.from("notifications").insert(notifications);
    }

    closeFocusForm();
    btn.disabled = false; btn.textContent = "Publish & Notify Members";
    await loadFocuses(focus.id);
  }
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function formatFocusDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const day = d.getDate();
  const suffix = day === 1||day===21||day===31 ? "st" : day===2||day===22 ? "nd" : day===3||day===23 ? "rd" : "th";
  const month  = ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()];
  return `${day}${suffix} ${month} ${d.getFullYear()}`;
}

function autoResizeCmt(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

function escHtml(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}
function avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)",fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)",fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)",fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}
function avatarHtml(email, name, size = 32, avatarUrl = null) {
  const style = `width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;`;
  if (avatarUrl) return `<div style="${style}overflow:hidden"><img src="${escHtml(avatarUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block" /></div>`;
  const c = avatarColour(email);
  const ini = initials(name || email?.split("@")[0] || "?");
  const fs  = Math.round(size * 0.34);
  return `<div style="${style}background:${c.bg};color:${c.fg};display:flex;align-items:center;justify-content:center;font-size:${fs}px;font-weight:800">${ini}</div>`;
}
function relativeTime(ts) {
  if (!ts) return "";
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if (m < 2)  return "just now";
  if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`;
  if (d === 1) return "yesterday";
  return `${d}d ago`;
}
