<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Practice Focus — The Practice Room</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#f5c518" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Practice Room" />
  <link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-512.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mux/mux-player"></script>
  <script src="/shared-header.js"></script>
  <style>
    /* ── Light theme (matches community.html) ───────────────────────────────── */
    :root {
      --bg:           #faf7f3;
      --surface:      #ffffff;
      --surface-2:    #f0ebe2;
      --border:       #e0d5c8;
      --text:         #1a1410;
      --text-muted:   #8a7868;
      --accent-subtle:#fdf0d8;
    }
    body { background: var(--bg); }

    /* ── Layout ─────────────────────────────────────────────────────────────── */
    #focus-main {
      max-width: 720px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }

    /* ── Page header ─────────────────────────────────────────────────────────── */
    .focus-page-hdr {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .focus-page-hdr h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin: 0;
    }
    .focus-page-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Admin form card ────────────────────────────────────────────────────── */
    .focus-form-card {
      background: var(--surface);
      border: 1.5px solid var(--accent);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 28px;
    }
    .focus-form-card h3 {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 20px;
    }
    .focus-form-field { margin-bottom: 16px; }
    .focus-form-label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      margin-bottom: 6px;
    }
    .focus-form-input,
    .focus-form-textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      resize: vertical;
      transition: border-color .15s;
    }
    .focus-form-input:focus,
    .focus-form-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Steps builder */
    .steps-builder { display: flex; flex-direction: column; gap: 10px; }
    .step-row {
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }
    .step-row-top { display: flex; gap: 8px; align-items: flex-start; }
    .step-num {
      font-size: 0.78rem; font-weight: 800;
      color: var(--accent);
      width: 20px; flex-shrink: 0;
      padding-top: 10px;
    }
    .step-row-top textarea {
      flex: 1;
      padding: 8px 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.88rem;
      color: var(--text);
      resize: vertical;
      min-height: 48px;
      transition: border-color .15s;
    }
    .step-row-top textarea:focus { outline: none; border-color: var(--accent); }
    .step-remove-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 8px 4px; font-size: 1rem;
      flex-shrink: 0;
    }
    .step-remove-btn:hover { color: #e53e3e; }
    .step-bullets { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
    .step-bullet-row { display: flex; gap: 6px; align-items: center; margin-left: 28px; }
    .step-bullet-row input {
      flex: 1;
      padding: 6px 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
    }
    .step-bullet-row input:focus { outline: none; border-color: var(--accent); }
    .bullet-remove-btn {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); font-size: 1rem;
    }
    .bullet-remove-btn:hover { color: #e53e3e; }
    .add-bullet-btn {
      margin-left: 28px; margin-top: 4px;
      background: none; border: none; cursor: pointer;
      font-size: 0.78rem; color: var(--text-muted);
      font-family: inherit; padding: 2px 0;
      text-decoration: underline;
    }
    .add-bullet-btn:hover { color: var(--text); }
    .add-step-btn {
      background: none;
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text-muted);
      width: 100%;
      transition: border-color .15s, color .15s;
    }
    .add-step-btn:hover { border-color: var(--accent); color: var(--accent); }
    .form-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

    /* ── Likers popover ─────────────────────────────────────────────────────── */
    .likers-popover {
      position: fixed; z-index: 9999;
      background: var(--surface); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
      min-width: 140px; max-width: 220px;
    }
    .likers-popover-title { font-size: 0.72rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
    .likers-popover-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .likers-popover-row:last-child { margin-bottom: 0; }
    .likers-popover-avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; font-weight: 800; flex-shrink: 0; overflow: hidden; }
    .likers-popover-name { font-size: 0.82rem; color: var(--text); }
    /* Stacked liker avatars next to like button */
    .like-avatars {
      display: inline-flex; align-items: center;
    }
    .like-avatar-chip {
      width: 20px; height: 20px; border-radius: 50%;
      border: 1.5px solid var(--surface);
      margin-left: -6px; flex-shrink: 0; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.52rem; font-weight: 800;
    }
    .like-avatar-chip:first-child { margin-left: 0; }
    .like-avatar-chip img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }

    /* ── Emoji reaction picker ──────────────────────────────────────────────── */
    .focus-react-picker {
      position: absolute; bottom: calc(100% + 8px); left: 0;
      background: var(--surface-2); border: 1.5px solid var(--border);
      border-radius: 32px; padding: 6px 8px;
      display: flex; align-items: center; gap: 2px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
      z-index: 200; white-space: nowrap;
    }
    .focus-react-picker button {
      display: inline-flex; flex-direction: column; align-items: center; gap: 1px;
      background: none; border: none; border-radius: 10px;
      padding: 5px 7px; cursor: pointer; font-size: 1.3rem; line-height: 1;
      transition: transform .12s, background .12s;
      position: relative;
    }
    .focus-react-picker button:hover { transform: scale(1.35); background: rgba(0,0,0,.06); }
    .focus-react-picker button.picked { background: rgba(0,0,0,.07); }
    .focus-react-picker button .picker-count {
      font-size: 0.62rem; color: var(--text-muted); font-family: inherit; line-height: 1;
    }

    /* ── Focus card ─────────────────────────────────────────────────────────── */
    .focus-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 16px;
      transition: border-color .15s;
    }
    .focus-card:hover { border-color: rgba(245,197,24,.4); }

    /* Accent header strip */
    .focus-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 18px;
      background: linear-gradient(90deg, rgba(245,197,24,.14) 0%, rgba(245,197,24,.04) 100%);
      border-bottom: 1.5px solid rgba(245,197,24,.22);
      border-left: 3.5px solid var(--accent);
    }
    .focus-card-label {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: #b8900a;
    }
    .focus-card-date {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    .focus-this-week-badge {
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
      background: var(--accent);
      color: #1a1410;
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* Card body */
    .focus-card-body { padding: 20px 22px 16px; }
    .focus-headline {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1.4;
      margin: 0 0 10px;
    }
    .focus-intro-preview {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Expand toggle */
    .focus-card-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 22px 14px;
    }
    .focus-footer-btn {
      background: none; border: none; cursor: pointer;
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 0.83rem; color: var(--text-muted);
      font-family: inherit; padding: 4px 0;
      transition: color .15s;
    }
    .focus-footer-btn:hover { color: var(--text); }
    .focus-footer-btn.liked { color: #e53e3e; }
    .focus-expand-btn {
      margin-left: auto;
      background: none; border: 1.5px solid var(--border);
      border-radius: 6px; padding: 5px 14px;
      font-size: 0.8rem; font-weight: 600;
      color: var(--text-muted); cursor: pointer;
      font-family: inherit;
      transition: border-color .15s, color .15s;
    }
    .focus-expand-btn:hover { border-color: var(--accent); color: var(--accent); }
    .focus-meta-counts { font-size: 0.8rem; color: var(--text-muted); margin-left: auto; }

    /* ── Expanded content ────────────────────────────────────────────────────── */
    .focus-expanded {
      border-top: 1.5px solid var(--border);
      padding: 20px 22px;
    }
    .focus-expanded-headline {
      font-size: 1.12rem;
      font-weight: 700;
      color: var(--text);
      margin: 0 0 14px;
      line-height: 1.4;
    }
    .focus-expanded-headline em {
      font-style: normal;
      font-weight: 400;
      color: var(--text-muted);
      font-size: 0.92rem;
    }
    .focus-body-text {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.65;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .focus-try-label {
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .focus-steps { list-style: none; padding: 0; margin: 0 0 18px; display: flex; flex-direction: column; gap: 10px; }
    .focus-step { display: flex; gap: 12px; align-items: flex-start; }
    .focus-step-num {
      min-width: 24px; height: 24px;
      background: var(--accent);
      color: #1a1410;
      font-size: 0.72rem;
      font-weight: 800;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .focus-step-content { flex: 1; font-size: 0.9rem; color: var(--text); line-height: 1.55; }
    .focus-step-bullets { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
    .focus-step-bullet {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: 0.88rem; color: var(--text-muted); line-height: 1.5;
    }
    .focus-step-bullet::before {
      content: "•";
      color: var(--accent);
      font-size: 1rem;
      line-height: 1.5;
      flex-shrink: 0;
    }
    .focus-divider {
      height: 1.5px;
      background: var(--border);
      margin: 20px 0;
    }

    /* ── Admin edit button on card ──────────────────────────────────────────── */
    .focus-edit-btn {
      background: none; border: 1px solid rgba(245,197,24,.4);
      border-radius: 5px; padding: 2px 9px;
      font-size: 0.72rem; font-weight: 700; color: #b8900a;
      cursor: pointer; font-family: inherit;
      transition: background .15s, border-color .15s;
      margin-left: auto;
    }
    .focus-edit-btn:hover { background: rgba(245,197,24,.15); border-color: var(--accent); }

    /* ── Comments — matches community.html style ──────────────────────────── */
    .focus-comments-wrap {
      padding: 0 22px 22px;
    }
    .comments-section {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-top: 0;
    }
    .comments-hdr {
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 0.76rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .08em;
      color: var(--text-muted);
    }
    .comment-item {
      display: flex; gap: 10px;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .comment-item:last-of-type { border-bottom: none; }
    .comment-avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem; font-weight: 800; flex-shrink: 0; margin-top: 1px;
    }
    .comment-body { flex: 1; min-width: 0; }
    .comment-meta {
      display: flex; align-items: baseline; gap: 8px;
      margin-bottom: 3px;
    }
    .comment-name { font-size: 0.82rem; font-weight: 700; color: var(--text); }
    .comment-time { font-size: 0.7rem; color: var(--text-muted); }
    .comment-text {
      font-size: 0.87rem; color: var(--text-muted);
      line-height: 1.5; white-space: pre-wrap; word-break: break-word;
    }
    .reply-to-name { color: var(--accent); font-weight: 600; margin-right: 3px; }
    .comments-empty {
      padding: 22px 18px; text-align: center;
      color: var(--text-muted); font-size: 0.82rem;
    }
    /* Reply button */
    .comment-reply-btn {
      background: none; border: none; cursor: pointer; font-family: inherit;
      font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
      padding: 3px 0; transition: color .15s; display: inline-block; margin-top: 3px;
    }
    .comment-reply-btn:hover { color: var(--accent); }
    /* Replies indent */
    .comment-replies { margin-left: 36px; margin-top: 4px; display: flex; flex-direction: column; gap: 2px; }
    /* Inline reply composer */
    .inline-reply-composer {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 10px 18px; border-top: 1px solid var(--border);
    }
    .inline-reply-composer textarea {
      width: 100%; box-sizing: border-box;
      background: transparent; border: 1.5px solid var(--accent);
      border-radius: 16px; color: var(--text); font-size: 0.85rem;
      font-family: inherit; padding: 7px 12px; resize: none;
      min-height: 34px; max-height: 100px;
    }
    .inline-reply-composer textarea:focus { outline: none; }
    .irc-actions {
      display: flex; justify-content: flex-end; gap: 14px;
      margin-top: 5px; padding-left: 38px;
    }
    .irc-send {
      background: none; border: none; font-family: inherit;
      font-size: 0.8rem; font-weight: 700; cursor: pointer; color: var(--accent); padding: 0;
    }
    .irc-cancel {
      background: none; border: none; font-family: inherit;
      font-size: 0.8rem; cursor: pointer; color: var(--text-muted); padding: 0;
    }
    .irc-cancel:hover { color: var(--text); }
    /* Comment input form at bottom */
    .comment-form {
      display: flex; gap: 10px; align-items: flex-start;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
    }
    .comment-form-body { flex: 1; min-width: 0; }
    .comment-form-top { display: flex; gap: 8px; align-items: flex-end; }
    .comment-form-top .comment-input { flex: 1; }
    /* composer-toolbar inside the form body sits below the textarea */
    .comment-form-body .composer-toolbar { margin-top: 6px; }
    .comment-input {
      flex: 1; background: transparent;
      border: 1.5px solid var(--border);
      border-radius: 20px; color: var(--text);
      font-size: 0.87rem; font-family: inherit;
      padding: 9px 14px; resize: none; min-height: 38px; max-height: 120px;
      transition: border-color .15s;
    }
    .comment-input:focus { outline: none; border-color: var(--accent); }
    .comment-send-btn {
      background: var(--accent); color: #1a1410; border: none;
      border-radius: 20px; padding: 0 18px; height: 38px;
      font-family: inherit; font-size: 0.85rem; font-weight: 700;
      cursor: pointer; flex-shrink: 0; transition: opacity .15s;
    }
    .comment-send-btn:hover { opacity: .85; }
    /* Media toolbar */
    .cmt-media-toolbar {
      display: flex; gap: 6px;
    }
    .cmt-media-btn {
      background: none; border: 1.5px solid var(--border);
      border-radius: 6px; padding: 4px 8px;
      cursor: pointer; color: var(--text-muted); font-size: 0.76rem;
      display: inline-flex; align-items: center; gap: 4px;
      font-family: inherit; transition: border-color .15s, color .15s;
    }
    .cmt-media-btn:hover { border-color: var(--accent); color: var(--accent); }
    .cmt-media-chip {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 6px; padding: 3px 8px;
      font-size: 0.76rem; color: var(--text-muted);
    }
    .cmt-media-chip button {
      background: none; border: none; cursor: pointer;
      color: var(--text-muted); padding: 0; font-size: 0.85rem; line-height: 1;
    }
    .cmt-media-preview { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
    /* Comment media display */
    .comment-media img {
      max-width: 100%; max-height: 240px; border-radius: 8px;
      margin-top: 7px; object-fit: cover; cursor: zoom-in;
    }
    .comment-media video { max-width: 100%; max-height: 240px; border-radius: 8px; margin-top: 7px; }
    .comment-media audio { width: 100%; margin-top: 7px; }

    /* Empty state */
    .focus-empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Archive section header */
    .focus-archive-hdr {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
      margin: 32px 0 14px;
      padding-bottom: 8px;
      border-bottom: 1.5px solid var(--border);
    }

    @media (max-width: 600px) {
      .focus-card-body { padding: 16px 16px 12px; }
      .focus-card-footer { padding: 8px 16px 12px; }
      .focus-expanded { padding: 16px; }
      .focus-comments-wrap { padding: 0 14px 14px; }
    }

    /* ── Rich inline composer CSS (from community.html lines 218–573) ─────────── */
    .composer-toolbar {
      display: flex; align-items: center; gap: 4px;
      flex: 1; flex-wrap: wrap;
    }
    .toolbar-btn {
      width: 32px; height: 32px;
      background: none; border: 1.5px solid transparent;
      border-radius: 8px; cursor: pointer; font-size: 1.05rem;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); transition: background .15s, border-color .15s, color .15s;
      position: relative;
      font-family: inherit;
    }
    .toolbar-btn:hover { background: rgba(0,0,0,.05); color: var(--text); border-color: var(--border); }
    .toolbar-btn.recording {
      color: #ef4444; border-color: #ef4444;
      animation: pulse-red 1s ease-in-out infinite;
    }
    .toolbar-btn[title]:hover::after {
      content: attr(title);
      position: absolute; bottom: calc(100% + 6px); left: 50%;
      transform: translateX(-50%);
      background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); font-size: 0.72rem; white-space: nowrap;
      padding: 3px 8px; border-radius: 5px; pointer-events: none;
      z-index: 1000;
    }
    @keyframes pulse-red {
      0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
      50%      { box-shadow: 0 0 0 5px rgba(239,68,68,.25); }
    }

    .composer-cancel {
      background: none; border: none; font-size: 0.85rem;
      color: var(--text-muted); cursor: pointer; font-family: inherit;
      padding: 6px 10px; border-radius: 6px;
      transition: color .15s;
    }
    .composer-cancel:hover { color: var(--text); }
    .btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Recording indicator ─────────────────────────────────────────────────── */

<div id="focus-main" style="display:none">

               placeholder="e.g. Learn to group notes instead of controlling every note individually" />

      </div>

<script>
const SUPA_URL  = "https://gyskfutmncprqxazgatv.supabase.co";
const SUPA_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5c2tmdXRtbmNwcnF4YXpnYXR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjIwMTYsImV4cCI6MjA5MTMzODAxNn0.ttC3plmhbA7ls_T3w25XgYT0WBt6O3MMu0G6NrEKI9g";
const db        = supabase.createClient(SUPA_URL, SUPA_ANON);
const OWNER_EMAIL = "matthew@matthewcawood.com";

let myEmail    = null;
let myName     = null;
let myAvatarUrl = null;
let isAdmin    = false;
let _focuses   = [];      // loaded focus rows + metadata
let _expanded  = new Set(); // focus IDs currently expanded
let _stepCount = 0;         // for unique step IDs in form

const FOCUS_EMOJIS = ["❤️","👏","🔥","🎉","💪","😂"];
// _focusRxMap[focusId][emoji] = { count, mine }
let _focusRxMap = {};
let _openFocusPicker = null;

// ── Inline composer state ─────────────────────────────────────────────────────
const _inlineMedia       = {};
const _inlinePollOpen    = {};
const _inlineVoiceRec    = {};
const _inlineRecTimer    = {};
const _inlineRecStart    = {};
let   _inlineCamRec           = null;
let   _inlineCamKey           = null;
let   _inlineCamStream        = null;
let   _inlineCamPreviewStream = null;
let   _inlineCamPreviewKey    = null;
let   _muxUploading           = false;

// ── Image modal state ─────────────────────────────────────────────────────────
const _commImgGroups = {};
let _commImgCurrentGroup = null;
let _commImgCurrentIdx   = 0;

// ── Auth ──────────────────────────────────────────────────────────────────────
(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "/practice-log.html"; return; }

  myEmail = session.user.email;
  const { data: ae } = await db.from("allowed_emails")
    .select("name,avatar_url").eq("email", myEmail).maybeSingle();
  myName      = ae?.name || myEmail.split("@")[0];
  myAvatarUrl = ae?.avatar_url || null;
  isAdmin     = myEmail.toLowerCase() === OWNER_EMAIL.toLowerCase();

  initSharedHeader({ db, myEmail, myName, isAdmin, activePage: "studio", avatarUrl: myAvatarUrl });

  if (isAdmin) {
    document.getElementById("new-focus-btn").style.display = "";
  }

  document.getElementById("focus-main").style.display = "";

  // Close reaction picker when clicking outside
  document.addEventListener("click", () => {
    if (_openFocusPicker) {
      const prev = document.getElementById(`picker-${_openFocusPicker}`);
      if (prev) prev.style.display = "none";
      _openFocusPicker = null;
    }
  });

  // Deep-link: ?focus=<id>
  const deepId = new URLSearchParams(window.location.search).get("focus");

  await loadFocuses(deepId);
})();

// ── Load focuses ──────────────────────────────────────────────────────────────
async function loadFocuses(autoExpandId = null) {
  const list = document.getElementById("focus-list");
  list.innerHTML = '<div class="focus-empty"><div class="loading-spinner" style="margin:0 auto 12px"></div>Loading…</div>';

  const { data: rows, error } = await db
    .from("weekly_focus")
    .select("*")
    .order("published_at", { ascending: false });

  if (error || !rows) {
    list.innerHTML = '<div class="focus-empty">Could not load focuses.</div>';
    return;
  }
  if (!rows.length) {
    list.innerHTML = `<div class="focus-empty">No weekly focuses yet${isAdmin ? " — publish the first one above!" : "."}</div>`;
    return;
  }

  const ids = rows.map(r => r.id);
  const [{ data: allLikes }, { data: cmtCounts }] = await Promise.all([
    db.from("weekly_focus_likes").select("focus_id,email,emoji").in("focus_id", ids),
    db.from("weekly_focus_comments").select("focus_id").in("focus_id", ids),
  ]);

  // Build _focusRxMap[focusId][emoji] = { count, mine }
  _focusRxMap = {};
  const cmtCountMap = {}, likersMap = {};
  (allLikes || []).forEach(l => {
    if (!_focusRxMap[l.focus_id]) _focusRxMap[l.focus_id] = {};
    const em = l.emoji || "❤️";
    if (!_focusRxMap[l.focus_id][em]) _focusRxMap[l.focus_id][em] = { count: 0, mine: false };
    _focusRxMap[l.focus_id][em].count++;
    if (l.email === myEmail) _focusRxMap[l.focus_id][em].mine = true;

    if (!likersMap[l.focus_id]) likersMap[l.focus_id] = [];
    if (likersMap[l.focus_id].length < 3) likersMap[l.focus_id].push(l.email);
  });
  (cmtCounts|| []).forEach(c => cmtCountMap[c.focus_id] = (cmtCountMap[c.focus_id] || 0) + 1);

  // Fetch avatar URLs for likers (up to 3 per focus)
  const likerEmails = [...new Set((allLikes || []).map(l => l.email))];
  const likerAvatarMap = {};
  if (likerEmails.length) {
    const { data: likerRows } = await db.from("allowed_emails")
      .select("email,avatar_url,name").in("email", likerEmails);
    (likerRows || []).forEach(r => { likerAvatarMap[r.email] = { url: r.avatar_url, name: r.name }; });
  }

  _focuses = rows.map((r, i) => {
    const rxData = _focusRxMap[r.id] || {};
    let totalRx = 0, myEmoji = null;
    for (const [e, d] of Object.entries(rxData)) { totalRx += d.count; if (d.mine) myEmoji = e; }
    return {
      ...r,
      likeCount:    totalRx,
      commentCount: cmtCountMap[r.id]  || 0,
      iLiked:       !!myEmoji,
      myEmoji,
      likers:       likersMap[r.id]    || [],
      isCurrentWeek: i === 0,
    };
  });
  window._likerAvatarMap = likerAvatarMap;

  // Auto-expand: current week + deep-link target
  _expanded.clear();
  if (_focuses.length) _expanded.add(_focuses[0].id); // always expand latest
  if (autoExpandId)    _expanded.add(autoExpandId);

  renderFocusList();

  if (autoExpandId) {
    const el = document.getElementById(`focus-${autoExpandId}`);
    if (el) setTimeout(() => el.scrollIntoView({ behavior: "smooth", block: "start" }), 100);
  }
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderFocusList() {
  const list = document.getElementById("focus-list");
  if (!_focuses.length) return;

  const [current, ...archive] = _focuses;

  let html = focusCardHTML(current);
  if (archive.length) {
    html += `<div class="focus-archive-hdr">Previous focuses</div>`;
    archive.forEach(f => { html += focusCardHTML(f); });
  }
  list.innerHTML = html;

  // Load comments for expanded focuses
  _focuses.forEach(f => {
    if (_expanded.has(f.id)) loadComments(f.id);
  });
}

function focusCardHTML(f) {
  const dateStr    = formatFocusDate(f.published_at);
  const isExpanded = _expanded.has(f.id);
  const introText  = (f.intro || "").split("\n")[0];

  const headerBadge = f.isCurrentWeek
    ? `<span class="focus-this-week-badge">This Week</span>`
    : "";
  const editBtn = isAdmin
    ? `<button class="focus-edit-btn" onclick="event.stopPropagation();openEditForm('${f.id}')">✏️ Edit</button>`
    : "";

  const rxData  = _focusRxMap[f.id] || {};
  let totalRx = 0, myEmoji = null;
  for (const [e, d] of Object.entries(rxData)) { totalRx += d.count; if (d.mine) myEmoji = e; }
  const heartFill = myEmoji ? 'fill="currentColor" stroke="currentColor" stroke-width="1.5"' : 'fill="none" stroke="currentColor" stroke-width="2"';
  const heartSvg = `<svg viewBox="0 0 24 24" width="15" height="15" ${heartFill} stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  const emojiLabel = myEmoji && myEmoji !== "❤️" ? ` ${myEmoji}` : "";
  const countLabel  = totalRx > 0 ? ` ${totalRx}` : "";

  const safeKey = `focus_${f.id.replace(/-/g,'_')}`;
  const pickerBtns = FOCUS_EMOJIS.map(e => {
    const d = rxData[e] || { count: 0, mine: false };
    return `<button class="${d.mine ? "picked" : ""}" onclick="pickFocusReaction(event,'${safeKey}','${f.id}','${e}')">${e}${d.count > 0 ? `<span class="picker-count">${d.count}</span>` : ""}</button>`;
  }).join("");

  const reactBtn = `
    <div style="position:relative;display:inline-flex">
      <button class="focus-footer-btn${myEmoji ? " liked" : ""}" id="like-btn-${safeKey}" onclick="toggleFocusReactPicker('${safeKey}',event)">${heartSvg}${emojiLabel}${countLabel}</button>
      <div class="focus-react-picker" id="picker-${safeKey}" style="display:none">${pickerBtns}</div>
    </div>`;

  // Stacked liker avatars (up to 3)
  const likerAvatarMap = window._likerAvatarMap || {};
  const likerChips = (f.likers || []).map(email => {
    const info = likerAvatarMap[email];
    const name = info?.name || email.split("@")[0];
    const col  = avatarColour(email);
    const inner = info?.url
      ? `<img src="${escHtml(info.url)}" alt="${escHtml(name)}">`
      : `<span style="background:${col.bg};color:${col.fg};width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:.5rem;font-weight:800;border-radius:50%">${name[0].toUpperCase()}</span>`;
    return `<div class="like-avatar-chip">${inner}</div>`;
  }).join("");
  const likeAvatars = totalRx > 0
    ? `<span class="like-avatars" onclick="event.stopPropagation();showFocusLikers('${f.id}',event)" style="cursor:pointer;margin-left:4px" title="See who reacted">${likerChips}${totalRx > 3 ? `<span style="font-size:.72rem;color:var(--text-muted);margin-left:6px">+${totalRx - 3}</span>` : ""}</span>`
    : "";

  const metaCounts = [
    totalRx       ? `${totalRx} reaction${totalRx !== 1 ? "s" : ""}` : "",
    f.commentCount? `${f.commentCount} comment${f.commentCount !== 1 ? "s" : ""}` : "",
  ].filter(Boolean).join(" · ");

  const collapsedBody = !isExpanded ? `
    <div class="focus-card-body">
      <div class="focus-headline">${escHtml(f.headline)}</div>
      <div class="focus-intro-preview">${escHtml(introText)}</div>
    </div>
    <div class="focus-card-footer" onclick="event.stopPropagation()">
      ${reactBtn}
      ${likeAvatars}
      <span class="focus-meta-counts like-count-${f.id}">${metaCounts}</span>
      <button class="focus-expand-btn" onclick="toggleExpand('${f.id}')">Read focus ↓</button>
    </div>` : "";

  const expandedBody = isExpanded ? `
    <div class="focus-expanded">
      <div class="focus-expanded-headline">
        <em>This week:</em> ${escHtml(f.headline)}
      </div>
      ${f.intro ? `<div class="focus-body-text">${escHtml(f.intro)}</div>` : ""}
      ${renderSteps(f.steps)}
      ${f.closing ? `<div class="focus-body-text">${escHtml(f.closing)}</div>` : ""}
      <div class="focus-divider"></div>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap" onclick="event.stopPropagation()">
        ${reactBtn}
        ${likeAvatars}
        <span class="focus-meta-counts like-count-${f.id}" style="margin-left:auto">${metaCounts}</span>
        <button class="focus-expand-btn" onclick="toggleExpand('${f.id}')">Close ↑</button>
      </div>
    </div>
    <div class="focus-comments-wrap" id="comments-section-${f.id}">
      <div class="comments-section">
        <div class="comments-hdr" id="comments-hdr-${f.id}">Comments</div>
        <div id="comments-list-${f.id}"></div>
        <div class="comment-form">
          ${avatarHtml(myEmail, myName, 28, myAvatarUrl)}
          <div class="comment-form-body">
            <div class="comment-form-top">
              <textarea class="comment-input" id="cmt-input-${f.id}" rows="1"
                placeholder="Share your experience or ask a question…"
                oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitComment('${f.id}')}"></textarea>
              <button class="comment-send-btn" id="focus-send-btn-${f.id}" onclick="submitComment('${f.id}')">Send</button>
            </div>
            ${_inlineToolbarHtml(f.id + '_main')}
          </div>
        </div>
      </div>
    </div>` : "";

  return `
    <div class="focus-card" id="focus-${f.id}">
      <div class="focus-card-header">
        <span class="focus-card-label">🎯 Weekly Practice Focus</span>
        ${headerBadge}
        <span class="focus-card-date">${dateStr}</span>
        ${editBtn}
      </div>
      ${collapsedBody}
      ${expandedBody}
    </div>`;
}

function renderSteps(steps) {
  if (!steps?.length) return "";
  const items = steps.map((s, i) => {
    const bullets = (s.bullets || []).filter(b => b?.trim()).map(b =>
      `<div class="focus-step-bullet">${escHtml(b)}</div>`
    ).join("");
    return `
      <li class="focus-step">
        <span class="focus-step-num">${i + 1}</span>
        <div class="focus-step-content">
          ${escHtml(s.text || "")}
          ${bullets ? `<div class="focus-step-bullets">${bullets}</div>` : ""}
        </div>
      </li>`;
  }).join("");
  return `
    <div class="focus-try-label">This week, try this:</div>
    <ul class="focus-steps">${items}</ul>`;
}

function toggleExpand(focusId) {
  if (_expanded.has(focusId)) {
    _expanded.delete(focusId);
  } else {
    _expanded.add(focusId);
  }
  renderFocusList();
  if (_expanded.has(focusId)) {
    loadComments(focusId);
    setTimeout(() => {
      document.getElementById(`focus-${focusId}`)?.scrollIntoView({ behavior: "smooth", block: "start" });
    }, 50);
  }
}

// ── Emoji Reactions ───────────────────────────────────────────────────────────
function toggleFocusReactPicker(safeKey, event) {
  if (event) event.stopPropagation();
  const picker = document.getElementById(`picker-${safeKey}`);
  if (!picker) return;
  if (_openFocusPicker && _openFocusPicker !== safeKey) {
    const prev = document.getElementById(`picker-${_openFocusPicker}`);
    if (prev) prev.style.display = "none";
  }
  const isOpen = picker.style.display !== "none";
  picker.style.display = isOpen ? "none" : "";
  _openFocusPicker = isOpen ? null : safeKey;
}

async function pickFocusReaction(event, safeKey, focusId, emoji) {
  event.stopPropagation();
  const picker = document.getElementById(`picker-${safeKey}`);
  if (!_focusRxMap[focusId]) _focusRxMap[focusId] = {};

  const wasPicked = event.currentTarget.classList.contains("picked");
  const existingEmoji = Object.keys(_focusRxMap[focusId]).find(e => _focusRxMap[focusId][e]?.mine);

  if (picker) picker.style.display = "none";
  _openFocusPicker = null;

  if (wasPicked) {
    // un-react
    const d = _focusRxMap[focusId][emoji];
    if (d) { d.mine = false; d.count = Math.max(0, d.count - 1); }
    _refreshFocusLikeBtn(focusId);
    await db.from("weekly_focus_likes").delete()
      .eq("focus_id", focusId).eq("email", myEmail);
    return;
  }

  // Remove old reaction if switching emojis
  if (existingEmoji) {
    const d = _focusRxMap[focusId][existingEmoji];
    if (d) { d.mine = false; d.count = Math.max(0, d.count - 1); }
    await db.from("weekly_focus_likes").delete()
      .eq("focus_id", focusId).eq("email", myEmail);
  }

  // Add new reaction
  if (!_focusRxMap[focusId][emoji]) _focusRxMap[focusId][emoji] = { count: 0, mine: false };
  _focusRxMap[focusId][emoji].mine = true;
  _focusRxMap[focusId][emoji].count++;

  // Update likers map
  const map = window._likerAvatarMap || {};
  if (!map[myEmail]) map[myEmail] = { url: myAvatarUrl, name: myName };
  window._likerAvatarMap = map;

  // Update focus likers list
  const f = _focuses.find(x => x.id === focusId);
  if (f) {
    if (!f.likers) f.likers = [];
    if (!f.likers.includes(myEmail) && f.likers.length < 3) f.likers.unshift(myEmail);
  }

  _refreshFocusLikeBtn(focusId);

  await db.from("weekly_focus_likes")
    .upsert({ focus_id: focusId, email: myEmail, emoji }, { onConflict: "focus_id,email" });
}

function _refreshFocusLikeBtn(focusId) {
  const rxData = _focusRxMap[focusId] || {};
  let totalRx = 0, myEmoji = null;
  for (const [e, d] of Object.entries(rxData)) { totalRx += d.count; if (d.mine) myEmoji = e; }

  const heartFill = myEmoji ? 'fill="currentColor" stroke="currentColor" stroke-width="1.5"' : 'fill="none" stroke="currentColor" stroke-width="2"';
  const heartSvg = `<svg viewBox="0 0 24 24" width="15" height="15" ${heartFill} stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
  const emojiLabel = myEmoji && myEmoji !== "❤️" ? ` ${myEmoji}` : "";
  const countLabel  = totalRx > 0 ? ` ${totalRx}` : "";

  const safeKey = `focus_${focusId.replace(/-/g,'_')}`;
  const btn = document.getElementById(`like-btn-${safeKey}`);
  if (btn) {
    btn.classList.toggle("liked", !!myEmoji);
    btn.innerHTML = heartSvg + emojiLabel + countLabel;
  }

  // Refresh picker counts
  const pickerEl = document.getElementById(`picker-${safeKey}`);
  if (pickerEl) {
    const btns = pickerEl.querySelectorAll("button");
    FOCUS_EMOJIS.forEach((e, i) => {
      const d = rxData[e] || { count: 0, mine: false };
      if (btns[i]) {
        btns[i].className = d.mine ? "picked" : "";
        btns[i].innerHTML = `${e}${d.count > 0 ? `<span class="picker-count">${d.count}</span>` : ""}`;
      }
    });
  }

  // Update meta counts
  const f = _focuses.find(x => x.id === focusId);
  const commentCount = f?.commentCount || 0;
  const metaCounts = [
    totalRx       ? `${totalRx} reaction${totalRx !== 1 ? "s" : ""}` : "",
    commentCount  ? `${commentCount} comment${commentCount !== 1 ? "s" : ""}` : "",
  ].filter(Boolean).join(" · ");
  document.querySelectorAll(`.like-count-${focusId}`).forEach(el => {
    el.textContent = metaCounts;
  });
}

let _focusLikersPopover = null;
function _dismissFocusLikersPopover() {
  if (_focusLikersPopover) { _focusLikersPopover.remove(); _focusLikersPopover = null; }
}

async function showFocusLikers(focusId, event) {
  event.stopPropagation();
  _dismissFocusLikersPopover();

  const { data: likes } = await db.from("weekly_focus_likes").select("email").eq("focus_id", focusId);
  if (!likes?.length) return;

  const emails = likes.map(l => l.email);
  const { data: nameRows } = await db.from("allowed_emails").select("email,name,avatar_url").in("email", emails);
  const infoMap = {};
  (nameRows || []).forEach(r => { infoMap[r.email] = r; });

  const rows = emails.map(e => {
    const info = infoMap[e] || {};
    const name = info.name || e.split("@")[0];
    const col  = avatarColour(e);
    const avatar = info.avatar_url
      ? `<div class="likers-popover-avatar"><img src="${escHtml(info.avatar_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block"></div>`
      : `<div class="likers-popover-avatar" style="background:${col.bg};color:${col.fg}">${name[0].toUpperCase()}</div>`;
    return `<div class="likers-popover-row">${avatar}<span class="likers-popover-name">${escHtml(name)}</span></div>`;
  }).join("");

  const pop = document.createElement("div");
  pop.className = "likers-popover";
  pop.innerHTML = `<div class="likers-popover-title">Liked by</div>${rows}`;
  document.body.appendChild(pop);
  _focusLikersPopover = pop;

  const { clientX: x, clientY: y } = event;
  const pw = 220, ph = 48 + emails.length * 38;
  pop.style.left = Math.min(x, window.innerWidth  - pw - 12) + "px";
  pop.style.top  = Math.min(y + 8, window.innerHeight - ph - 12) + "px";

  setTimeout(() => document.addEventListener("click", _dismissFocusLikersPopover, { once: true }), 0);
}

// ── Comments ──────────────────────────────────────────────────────────────────

async function loadComments(focusId) {
  const listEl = document.getElementById(`comments-list-${focusId}`);
  const hdrEl  = document.getElementById(`comments-hdr-${focusId}`);
  if (!listEl) return;

  const { data: comments } = await db.from("weekly_focus_comments")
    .select("*")
    .eq("focus_id", focusId)
    .order("created_at", { ascending: true });

  const count = comments?.length || 0;
  if (hdrEl) hdrEl.textContent = count === 0 ? "Comments" : `${count} Comment${count !== 1 ? "s" : ""}`;

  // Update comment count in focus metadata
  const f = _focuses.find(x => x.id === focusId);
  if (f) f.commentCount = count;

  if (!count) {
    listEl.innerHTML = `<div class="comments-empty">No comments yet — be the first!</div>`;
    return;
  }

  // Fetch avatars for comment authors
  const emails = [...new Set(comments.map(c => c.email))];
  const { data: avatarRows } = await db.from("allowed_emails")
    .select("email,avatar_url,badge").in("email", emails);
  const avatarMap = {}, badgeMap = {};
  (avatarRows||[]).forEach(r => {
    if (r.avatar_url) avatarMap[r.email] = r.avatar_url;
    if (r.badge)      badgeMap[r.email]  = r.badge;
  });

  // Split into top-level and replies
  const topLevel = comments.filter(c => !c.parent_comment_id);
  const replyMap = {};
  comments.filter(c => c.parent_comment_id).forEach(c => {
    (replyMap[c.parent_comment_id] = replyMap[c.parent_comment_id] || []).push(c);
  });

  function commentHTML(c, isReply = false) {
    const dispName = escHtml(c.name || c.email.split("@")[0]);
    const badge    = badgeMap[c.email] ? `<span class="author-badge">${escHtml(badgeMap[c.email])}</span>` : "";
    const canDel   = isAdmin || c.email === myEmail;
    const replyPrefix = (isReply && c.reply_to_name)
      ? `<span class="reply-to-name">@${escHtml(c.reply_to_name)}</span> ` : "";

    const mediaHtml = _renderCommentMedia(c);

    return `
      <div class="comment-item${isReply ? " is-reply" : ""}" id="cmt-${c.id}">
        ${avatarHtml(c.email, c.name, 28, avatarMap[c.email])}
        <div class="comment-body">
          <div class="comment-meta">
            <span class="comment-name">${dispName}</span>${badge}
            <span class="comment-time">${relativeTime(c.created_at)}</span>
            ${canDel ? `<button onclick="deleteComment('${c.id}','${focusId}')" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:.7rem;color:var(--text-muted);padding:0 4px;font-family:inherit" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--text-muted)'">Delete</button>` : ""}
          </div>
          ${c.content ? `<div class="comment-text">${replyPrefix}${escHtml(c.content)}</div>` : ""}
          ${mediaHtml}
          ${!isReply ? `<button class="comment-reply-btn" onclick="startFocusReply('${focusId}','${c.id}','${dispName.replace(/'/g,"\\'")}','${c.email.replace(/'/g,"\\'")}')">Reply</button>` : ""}
        </div>
      </div>`;
  }

  listEl.innerHTML = topLevel.map(c => {
    const replies = (replyMap[c.id] || []).map(r => commentHTML(r, true)).join("");
    const replyComposer = `
      <div id="reply-composer-${c.id}" class="inline-reply-composer" style="display:none">
        ${avatarHtml(myEmail, myName, 28, myAvatarUrl)}
        <div style="flex:1;min-width:0">
          <textarea placeholder="Write a reply…" rows="1"
            oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();submitReply('${focusId}','${c.id}',this.closest('.inline-reply-composer'))}"
          ></textarea>
          ${_inlineToolbarHtml(c.id)}
          <div class="irc-actions" style="margin-top:6px">
            <button class="irc-cancel" onclick="cancelFocusReply('${c.id}')">Cancel</button>
            <button class="irc-send" id="reply-send-btn-${c.id}" onclick="submitReply('${focusId}','${c.id}',this.closest('.inline-reply-composer'))">Send</button>
          </div>
        </div>
      </div>`;
    return commentHTML(c) +
      `<div class="comment-replies">${replies}${replyComposer}</div>`;
  }).join("");
}

function startFocusReply(focusId, parentId, authorName, authorEmail) {
  // Close any other open reply composers
  document.querySelectorAll("[id^='reply-composer-']").forEach(el => {
    if (el.style.display !== "none") el.style.display = "none";
  });
  const composer = document.getElementById(`reply-composer-${parentId}`);
  if (!composer) return;
  composer.style.display = "flex";
  composer.dataset.replyToName  = authorName;
  composer.dataset.replyToEmail = authorEmail;
  const ta = composer.querySelector("textarea");
  if (ta) { ta.value = ""; ta.focus(); }
}

function cancelFocusReply(parentId) {
  const composer = document.getElementById(`reply-composer-${parentId}`);
  if (composer) {
    composer.style.display = "none";
    const ta = composer.querySelector("textarea");
    if (ta) ta.value = "";
  }
  _clearInlineState(parentId);
}

async function submitComment(focusId) {
  const mainKey = focusId + '_main';
  const ta      = document.getElementById(`cmt-input-${focusId}`);
  const content = ta?.value.trim() || "";
  const media   = _inlineMedia[mainKey] || [];
  const poll    = _inlinePollOpen[mainKey] ? _readInlinePoll(mainKey) : null;
  if (!content && !media.length && !poll) return;

  const sendBtn = document.getElementById(`focus-send-btn-${focusId}`);
  if (sendBtn) sendBtn.disabled = true;
  if (ta) ta.disabled = true;

  let uploaded = [];
  try {
    uploaded = await _uploadInlineMedia(mainKey);
  } catch (e) {
    alert("Failed to upload media: " + e.message);
    if (sendBtn) sendBtn.disabled = false;
    if (ta) ta.disabled = false;
    return;
  }

  const { error } = await db.from("weekly_focus_comments").insert({
    focus_id: focusId, email: myEmail, name: myName,
    content, media: uploaded.length ? uploaded : [],
  });

  if (sendBtn) sendBtn.disabled = false;
  if (ta) ta.disabled = false;
  if (error) { alert("Couldn't post: " + error.message); return; }

  if (ta) { ta.value = ""; ta.style.height = ""; }
  _clearInlineState(mainKey);

  await loadComments(focusId);
}

async function submitReply(focusId, parentId, composerEl) {
  const ta      = composerEl?.querySelector("textarea");
  const content = ta?.value.trim() || "";
  const media   = _inlineMedia[parentId] || [];
  const poll    = _inlinePollOpen[parentId] ? _readInlinePoll(parentId) : null;
  if (!content && !media.length && !poll) return;

  const replyToName  = composerEl?.dataset.replyToName  || null;
  const replyToEmail = composerEl?.dataset.replyToEmail || null;

  if (ta) ta.disabled = true;

  let uploaded = [];
  try {
    uploaded = await _uploadInlineMedia(parentId);
  } catch (e) {
    alert("Failed to upload media: " + e.message);
    if (ta) ta.disabled = false;
    return;
  }

  const { error } = await db.from("weekly_focus_comments").insert({
    focus_id: focusId, email: myEmail, name: myName,
    content, parent_comment_id: parentId, reply_to_name: replyToName,
    media: uploaded.length ? uploaded : [],
  });
  if (ta) ta.disabled = false;
  if (error) { alert("Couldn't post reply: " + error.message); return; }

  if (replyToEmail && replyToEmail !== myEmail) {
    await db.from("notifications").insert({
      email: replyToEmail, type: "comment_reply",
      title: `${myName || "Someone"} replied to your comment`,
      body: (content || "Sent an attachment").slice(0, 120),
      link_url: `/focus.html?focus=${focusId}`,
      metadata: {},
    });
  }

  cancelFocusReply(parentId);
  await loadComments(focusId);
}

async function deleteComment(commentId, focusId) {
  if (!confirm("Delete this comment?")) return;
  await db.from("weekly_focus_comments").delete().eq("id", commentId);
  const f = _focuses.find(x => x.id === focusId);
  if (f && f.commentCount > 0) f.commentCount--;
  await loadComments(focusId);
}

// ── Helper functions (from community.html) ────────────────────────────────────
function _audioMimeType(m) {
  if (m.mimeType) return m.mimeType;
  const ext = (m.name || "").split(".").pop().toLowerCase();
  return { m4a: "audio/mp4", mp4: "audio/mp4", ogg: "audio/ogg", webm: "audio/webm" }[ext] || "";
}

function parseYouTubeId(url) {
  const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([^&\s]+)/);
  return m ? m[1] : null;
}
function parseVimeoId(url) {
  const m = url.match(/vimeo\.com\/(\d+)/);
  return m ? m[1] : null;
}

async function compressImage(file, { maxPx = 1920, quality = 0.82 } = {}) {
  if (file.type === "image/gif") return file;
  return new Promise(resolve => {
    const img = new Image();
    const rawUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(rawUrl);
      let { naturalWidth: w, naturalHeight: h } = img;
      if (w > maxPx || h > maxPx) {
        const r = Math.min(maxPx / w, maxPx / h);
        w = Math.round(w * r); h = Math.round(h * r);
      }
      const canvas = document.createElement("canvas");
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        if (!blob || blob.size >= file.size) { resolve(file); return; }
        const name = file.name.replace(/\.[^.]+$/, "") + ".jpg";
        resolve(new File([blob], name, { type: "image/jpeg" }));
      }, "image/jpeg", quality);
    };
    img.onerror = () => { URL.revokeObjectURL(rawUrl); resolve(file); };
    img.src = rawUrl;
  });
}

async function uploadToStorage(blob, filename) {
  const MAX_MB = 500;
  if (blob.size > MAX_MB * 1024 * 1024) {
    const sizeMB = (blob.size / 1024 / 1024).toFixed(0);
    throw new Error(`"${filename}" is ${sizeMB} MB — files must be under ${MAX_MB} MB.`);
  }
  const safe = `${myEmail}/${Date.now()}-${filename.replace(/[^a-z0-9._-]/gi, "_")}`;
  const { data, error } = await db.storage.from("community-uploads").upload(safe, blob);
  if (error) {
    if (error.message?.toLowerCase().includes("size") || error.statusCode === 413) {
      throw new Error(`"${filename}" is too large for storage. Try a smaller file or use a video embed link instead.`);
    }
    throw error;
  }
  return db.storage.from("community-uploads").getPublicUrl(data.path).data.publicUrl;
}

// ── Mux video upload ──────────────────────────────────────────────────────────
async function _deleteMuxAsset(assetId) {
  if (!assetId) return;
  try {
    const token = (await db.auth.getSession()).data.session?.access_token;
    await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ action: "delete-mux-asset", assetId })
    });
  } catch (e) { console.warn("Mux asset delete failed:", e); }
}

async function _uploadVideoToMux(file, onDone = null) {
  if (!file || !file.type.startsWith("video/")) { alert("Please select a video file."); return; }
  if (_muxUploading) { alert("A video upload is already in progress."); return; }

  const _setOverlay = onDone ? _setGlobalMuxOverlay : _setMuxOverlay;

  _setOverlay({ show: true, filename: file.name, pct: 0, status: "Getting upload URL…" });

  _muxUploading = true;
  try {
    const token = (await db.auth.getSession()).data.session?.access_token;
    if (!token) throw new Error("You appear to be signed out. Please refresh the page and sign in again.");
    const createRes = await fetch("/api/daily", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
      body: JSON.stringify({ action: "create-mux-upload" })
    });
    const createText = await createRes.text();
    let createData;
    try { createData = JSON.parse(createText); } catch { throw new Error("Bad response from server: " + createText); }
    if (createData.error) throw new Error(JSON.stringify(createData.error));
    const { uploadId, uploadUrl } = createData;
    if (!uploadUrl) throw new Error("No upload URL returned from server");

    _setOverlay({ pct: 0, status: "Uploading… 0%" });
    await new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      xhr.open("PUT", uploadUrl);
      xhr.upload.onprogress = e => {
        if (e.lengthComputable) {
          const pct = Math.round(e.loaded / e.total * 100);
          _setOverlay({ pct, status: `Uploading… ${pct}%` });
        }
      };
      xhr.onload = () => { xhr.status < 300 ? resolve() : reject(new Error("Upload failed (" + xhr.status + ")")); };
      xhr.onerror = () => reject(new Error("Network error during upload"));
      xhr.send(file);
    });

    const barId  = onDone ? "mux-global-bar" : "mux-overlay-bar";
    const barEl  = document.getElementById(barId);
    if (barEl) barEl.classList.add("processing");
    _setOverlay({ pct: 100, status: "Queuing for processing…" });

    const processingMessages = [
      { after: 0,   msg: "Queuing for processing…" },
      { after: 10,  msg: "Encoding video…" },
      { after: 30,  msg: "Still encoding — larger videos take a minute or two…" },
      { after: 60,  msg: "Almost there, finishing up…" },
      { after: 120, msg: "This is taking longer than usual, but it's still going…" },
    ];

    let playbackId = null, muxAssetId = null;
    const pollStart = Date.now();
    for (let i = 0; i < 72; i++) {
      await new Promise(r => setTimeout(r, 5000));
      const elapsed = Math.round((Date.now() - pollStart) / 1000);
      const msg = processingMessages.filter(m => elapsed >= m.after).pop()?.msg;
      if (msg) _setOverlay({ status: msg });

      const statusRes = await fetch("/api/daily", {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ action: "get-mux-upload-status", uploadId })
      });
      const s = await statusRes.json();
      if (s.playbackId && s.assetStatus === "ready") { playbackId = s.playbackId; muxAssetId = s.assetId; break; }
      if (s.status === "errored" || s.assetStatus === "errored") throw new Error("Mux reported an error processing the video");
    }
    if (!playbackId) throw new Error("Video processing timed out after 6 minutes — try again");

    if (barEl) { barEl.classList.remove("processing"); barEl.style.background = "#10b981"; }
    _setOverlay({ pct: 100, status: "✓ Video ready!", filename: file.name });
    await new Promise(r => setTimeout(r, 1500));
    _setOverlay({ show: false });
    const muxItem = { type: "mux", playbackId, assetId: muxAssetId, name: file.name };
    if (onDone) { onDone(muxItem); }

  } catch (e) {
    console.error("[Mux] Upload error:", e);
    _setOverlay({ show: true, filename: "❌ Upload failed", status: e.message, processing: false });
    const barEl = document.getElementById(onDone ? "mux-global-bar" : "mux-overlay-bar");
    if (barEl) barEl.style.background = "#ef4444";
    const statusElId = onDone ? "mux-global-status" : "mux-overlay-status";
    const statusEl = document.getElementById(statusElId);
    const dismissFn = onDone ? "_setGlobalMuxOverlay({show:false})" : "_setMuxOverlay({show:false});_muxUploading=false;";
    if (statusEl) statusEl.innerHTML =
      escHtml(e.message) +
      `<br><button onclick="${dismissFn}"
        style="margin-top:8px;background:rgba(0,0,0,.07);border:1px solid rgba(0,0,0,.12);
        border-radius:6px;color:#fff;cursor:pointer;font-size:.75rem;padding:4px 10px">Dismiss</button>`;
    if (!onDone) return;
  } finally {
    _muxUploading = false;
  }
}

function _inlineKey(key) {
  if (!_inlineMedia[key]) _inlineMedia[key] = [];
  return key;
}

function _renderInlineMediaPreview(key) {
  const area = document.getElementById(`inline-media-preview-${key}`);
  if (!area) return;
  const media = _inlineMedia[key] || [];
  if (!media.length) { area.innerHTML = ""; return; }
  const images = media.filter(m => m.type === "image");
  const others = media.filter(m => m.type !== "image");
  let html = "";
  if (images.length) {
    const cols = Math.min(images.length, 2);
    html += `<div class="media-preview-images" style="grid-template-columns:repeat(${cols},1fr)">` +
      images.map((m, i) => {
        const idx = media.indexOf(m);
        return `<div class="media-thumb-wrap">
          <img src="${m.url}" alt="${escHtml(m.name)}" style="${cols > 1 ? "height:180px;object-fit:cover" : ""}" />
          <button class="media-thumb-remove" onclick="removeInlineMedia('${key}',${idx})" title="Remove">×</button>
        </div>`;
      }).join("") + `</div>`;
  }
  const rmBtn = (fn) => `<button onclick="${fn}" style="position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:.8rem;display:flex;align-items:center;justify-content:center;cursor:pointer;line-height:1;transition:background .15s" onmouseover="this.style.background='#ef4444'" onmouseout="this.style.background='rgba(0,0,0,.55)'">×</button>`;
  others.forEach(m => {
    const idx = media.indexOf(m);
    const rm  = `removeInlineMedia('${key}',${idx})`;
    if (m.type === "mux") {
      if (m._uploading) {
        html += `<div style="position:relative;margin-top:6px">
          <div class="mux-upload-overlay" style="margin-bottom:0">
            <div class="mux-upload-overlay-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg></div>
            <div class="mux-upload-overlay-body">
              <div class="mux-upload-overlay-filename">${escHtml(m.name)}</div>
              <div class="mux-upload-overlay-track"><div class="mux-upload-overlay-bar processing" id="inline-mux-upload-bar"></div></div>
              <div class="mux-upload-overlay-status processing" id="inline-mux-upload-status">Uploading…</div>
            </div>
          </div>
          ${rmBtn(rm)}
        </div>`;
      } else {
        html += `<div style="position:relative;margin-top:6px">
          <div style="position:relative;width:100%;height:min(180px,24vh);overflow:hidden;border-radius:8px;background:var(--surface)">
            <mux-player playback-id="${escHtml(m.playbackId)}" controls style="position:absolute;top:0;left:0;width:100%;height:100%"></mux-player>
          </div>
          ${rmBtn(rm)}
        </div>`;
      }
    } else if (m.type === "youtube") {
      html += `<div style="position:relative;margin-top:6px;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden">
        <iframe src="https://www.youtube.com/embed/${escHtml(m.ytId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe>
        ${rmBtn(rm)}
      </div>`;
    } else if (m.type === "vimeo") {
      html += `<div style="position:relative;margin-top:6px;padding-bottom:56.25%;height:0;border-radius:8px;overflow:hidden">
        <iframe src="https://player.vimeo.com/video/${escHtml(m.vimeoId)}" style="position:absolute;top:0;left:0;width:100%;height:100%" frameborder="0" allowfullscreen loading="lazy"></iframe>
        ${rmBtn(rm)}
      </div>`;
    } else if (m.type === "audio") {
      const dur = m.duration ? ` · ${m.duration}s` : "";
      html += `<div style="margin-top:6px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
          <span style="font-size:.78rem;color:var(--text-muted)">🎙️ Voice message${escHtml(dur)}</span>
          <button onclick="${rm}" style="background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:.85rem;padding:0 2px" onmouseover="this.style.color='#ef4444'" onmouseout="this.style.color='var(--text-muted)'">×</button>
        </div>
        <audio controls preload="metadata" style="width:100%;display:block;border-radius:8px"><source src="${escHtml(m.url)}" type="${_audioMimeType(m)}"></audio>
      </div>`;
    } else {
      html += `<span class="media-chip" style="margin-top:6px"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;vertical-align:middle"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg> ${escHtml(m.name)}<button class="media-chip-remove" onclick="${rm}" title="Remove">×</button></span>`;
    }
  });
  area.innerHTML = html;

  // Disable the relevant send button while a Mux video is still uploading/processing
  {
    const isUploading = (media || []).some(m => m._uploading);
    let sendBtnId;
    if (key.endsWith("_main")) sendBtnId = `focus-send-btn-${key.replace(/_main$/, "")}`;
    else sendBtnId = `reply-send-btn-${key}`;
    const sendBtn = document.getElementById(sendBtnId);
    if (sendBtn) {
      sendBtn.disabled = isUploading;
      sendBtn.title = isUploading ? "Please wait — video is processing…" : "";
    }
  }
}

function removeInlineMedia(key, idx) {
  if (_inlineMedia[key]) {
    const m = _inlineMedia[key][idx];
    if (m?.type === "mux" && m.assetId) _deleteMuxAsset(m.assetId);
    _inlineMedia[key].splice(idx, 1);
  }
  _renderInlineMediaPreview(key);
}

async function inlineHandleImage(input, key) {
  _inlineKey(key);
  const files = Array.from(input.files || []);
  input.value = "";
  for (const file of files) {
    if (!file.type.startsWith("image/")) {
      alert(`"${file.name}" is not an image. Use the file attachment button to send other file types.`);
      continue;
    }
    const compressed = await compressImage(file);
    const url = URL.createObjectURL(compressed);
    _inlineMedia[key].push({ type: "image", url, name: compressed.name, blob: compressed });
    _renderInlineMediaPreview(key);
  }
}

function inlineHandleFile(input, key) {
  _inlineKey(key);
  const file = input.files[0];
  if (!file) return;
  _inlineMedia[key].push({ type: "file", name: file.name, blob: file });
  input.value = "";
  _renderInlineMediaPreview(key);
}

function _closeInlineExcept(key, except) {
  if (except !== "video") {
    const vp = document.getElementById(`inline-vid-panel-${key}`);
    if (vp && vp.style.display !== "none") {
      vp.style.display = "none";
      document.getElementById(`inline-vid-btn-${key}`)?.classList.remove("recording");
    }
  }
  if (except !== "poll") {
    const pp = document.getElementById(`inline-poll-${key}`);
    if (pp && pp.style.display !== "none") {
      pp.style.display = "none";
      _inlinePollOpen[key] = false;
      (document.getElementById(`inline-${key === "main" ? "main" : key}-poll-btn`) ||
       document.getElementById(`inline-poll-btn-${key}`))?.classList.remove("recording");
    }
  }
  if (except !== "cam") {
    if (_inlineCamPreviewKey === key) inlineCancelCamPreview(key);
    if (_inlineCamKey === key && _inlineCamRec && _inlineCamRec.state !== "inactive") _inlineCamRec.stop();
  }
  if (except !== "voice") {
    if (_inlineVoiceRec[key] && _inlineVoiceRec[key].state !== "inactive") _inlineVoiceRec[key].stop();
  }
}

async function toggleInlineVoice(key) {
  if (_inlineVoiceRec[key]) {
    if (_inlineVoiceRec[key].state !== "inactive") _inlineVoiceRec[key].stop();
    return;
  }
  _closeInlineExcept(key, "voice");
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const chunks = [];
    const mr = new MediaRecorder(stream);
    _inlineVoiceRec[key] = mr;
    mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop());
      clearInterval(_inlineRecTimer[key]);
      _inlineRecTimer[key] = null;
      _inlineVoiceRec[key] = null;
      const recInd = document.getElementById(`inline-recording-${key}`);
      if (recInd) recInd.style.display = "none";
      const btn = document.getElementById(`inline-${key === "main" ? "main" : key}-voice-btn`) ||
                  document.getElementById(`inline-voice-btn-${key}`);
      if (btn) btn.classList.remove("recording");
      const mime = mr.mimeType || "audio/webm";
      const blob = new Blob(chunks, { type: mime });
      const duration = _inlineRecStart[key] ? Math.round((Date.now() - _inlineRecStart[key]) / 1000) : 0;
      const ext = mime.includes("mp4") || mime.includes("m4a") || mime.includes("aac") ? "m4a"
        : mime.includes("ogg") ? "ogg"
        : "webm";
      const name = `voice-${Date.now()}.${ext}`;
      _inlineKey(key);
      _inlineMedia[key].push({ type: "audio", url: URL.createObjectURL(blob), name, blob, duration, mimeType: mime });
      _renderInlineMediaPreview(key);
    };
    mr.start();
    _inlineRecStart[key] = Date.now();
    const voiceBtn = document.getElementById(`inline-${key === "main" ? "main" : key}-voice-btn`) ||
                     document.getElementById(`inline-voice-btn-${key}`);
    if (voiceBtn) voiceBtn.classList.add("recording");
    const recInd = document.getElementById(`inline-recording-${key}`);
    const timeEl = document.getElementById(`inline-rec-time-${key}`);
    if (recInd) recInd.style.display = "";
    _inlineRecTimer[key] = setInterval(() => {
      const secs = Math.round((Date.now() - _inlineRecStart[key]) / 1000);
      const m = Math.floor(secs / 60), s = secs % 60;
      if (timeEl) timeEl.textContent = `${m}:${String(s).padStart(2, "0")}`;
    }, 1000);
  } catch (e) {
    alert("Microphone access denied: " + e.message);
  }
}

function stopInlineVoice(key) {
  if (_inlineVoiceRec[key] && _inlineVoiceRec[key].state !== "inactive") {
    _inlineVoiceRec[key].stop();
  }
}

function inlineToggleVideoPanel(key) {
  const panel  = document.getElementById(`inline-vid-panel-${key}`);
  const btn    = document.getElementById(`inline-vid-btn-${key}`);
  if (!panel) return;
  const open = panel.style.display === "none";
  if (open) _closeInlineExcept(key, "video");
  panel.style.display = open ? "" : "none";
  btn?.classList.toggle("recording", open);
  if (open) inlineSwitchVideoTab("upload", key);
}

function inlineSwitchVideoTab(tab, key) {
  const upPanel = document.getElementById(`inline-vt-up-${key}`);
  const emPanel = document.getElementById(`inline-vt-em-${key}`);
  const upBtn   = document.getElementById(`inline-vt-up-btn-${key}`);
  const emBtn   = document.getElementById(`inline-vt-em-btn-${key}`);
  const tabActive = "background:rgba(0,0,0,.07);border-radius:4px;font-weight:600";
  if (upPanel) upPanel.style.display = tab === "upload" ? "" : "none";
  if (emPanel) emPanel.style.display = tab === "embed"  ? "" : "none";
  if (upBtn) upBtn.style.cssText = upBtn.style.cssText.replace(/font-weight:\s*600/g, "") + (tab === "upload" ? tabActive : "");
  if (emBtn) emBtn.style.cssText = emBtn.style.cssText.replace(/font-weight:\s*600/g, "") + (tab === "embed"  ? tabActive : "");
}

function inlineHandleVideo(input, key) {
  const file = input.files[0];
  input.value = "";
  if (!file) return;
  inlineToggleVideoPanel(key);
  if (!_inlineMedia[key]) _inlineMedia[key] = [];
  const pendingIdx = _inlineMedia[key].length;
  _inlineMedia[key].push({ type: "mux", name: file.name, _uploading: true, _localUrl: URL.createObjectURL(file) });
  _renderInlineMediaPreview(key);
  _uploadVideoToMux(file, item => {
    _inlineMedia[key][pendingIdx] = item;
    _renderInlineMediaPreview(key);
  });
}

function inlineAddVideoUrl(key) {
  const input = document.getElementById(`inline-vurl-${key}`);
  const val   = input?.value.trim();
  if (!val) return;
  if (!_inlineMedia[key]) _inlineMedia[key] = [];
  const ytId = parseYouTubeId(val);
  const viId = parseVimeoId(val);
  if (ytId)      _inlineMedia[key].push({ type: "youtube",   ytId,     url: val, name: "YouTube video" });
  else if (viId) _inlineMedia[key].push({ type: "vimeo",     vimeoId: viId, url: val, name: "Vimeo video" });
  else           _inlineMedia[key].push({ type: "video-url", url: val, name: "Video" });
  if (input) input.value = "";
  inlineToggleVideoPanel(key);
  _renderInlineMediaPreview(key);
}

async function inlineToggleCamRec(key) {
  if (_inlineCamPreviewKey === key) { inlineCancelCamPreview(key); return; }
  if (_inlineCamKey === key && _inlineCamRec && _inlineCamRec.state !== "inactive") {
    inlineStopCamRecording(key); return;
  }
  if (_inlineCamRec && _inlineCamRec.state !== "inactive") {
    alert("Stop the current camera recording first."); return;
  }
  if (_inlineCamPreviewStream) { inlineCancelCamPreview(_inlineCamPreviewKey); }
  _closeInlineExcept(key, "cam");

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: { aspectRatio: 16/9 } });
    _inlineCamPreviewStream = stream;
    _inlineCamPreviewKey    = key;

    const preview = document.getElementById(`inline-cam-preview-${key}`);
    const panel   = document.getElementById(`inline-cam-panel-${key}`);
    const btn     = document.getElementById(`inline-camrec-btn-${key}`);
    if (preview) preview.srcObject = stream;
    if (panel)   panel.style.display = "";
    if (btn)     btn.classList.add("recording");

    const devices = await navigator.mediaDevices.enumerateDevices();
    const cameras = devices.filter(d => d.kind === "videoinput");
    const mics    = devices.filter(d => d.kind === "audioinput");
    const activeVideoLabel = stream.getVideoTracks()[0]?.label || "";
    const activeAudioLabel = stream.getAudioTracks()[0]?.label || "";

    const camSel = document.getElementById(`inline-cam-sel-${key}`);
    const micSel = document.getElementById(`inline-mic-sel-${key}`);
    if (camSel) camSel.innerHTML = cameras.map(d =>
      `<option value="${d.deviceId}" ${d.label === activeVideoLabel ? "selected" : ""}>${d.label || "Camera " + (cameras.indexOf(d)+1)}</option>`
    ).join("");
    if (micSel) micSel.innerHTML = mics.map(d =>
      `<option value="${d.deviceId}" ${d.label === activeAudioLabel ? "selected" : ""}>${d.label || "Mic " + (mics.indexOf(d)+1)}</option>`
    ).join("");
  } catch (e) {
    alert("Could not access camera/mic: " + e.message);
  }
}

async function inlineSwitchCamDevice(key) {
  if (!_inlineCamPreviewStream || _inlineCamPreviewKey !== key) return;
  const camSel = document.getElementById(`inline-cam-sel-${key}`);
  const micSel = document.getElementById(`inline-mic-sel-${key}`);
  _inlineCamPreviewStream.getTracks().forEach(t => t.stop());
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: camSel?.value ? { deviceId: { exact: camSel.value } } : true,
      audio: micSel?.value ? { deviceId: { exact: micSel.value } } : true,
    });
    _inlineCamPreviewStream = stream;
    const preview = document.getElementById(`inline-cam-preview-${key}`);
    if (preview) preview.srcObject = stream;
  } catch (e) { alert("Could not switch device: " + e.message); }
}

function inlineStartCamRecording(key) {
  if (!_inlineCamPreviewStream) return;
  const devs    = document.getElementById(`inline-cam-devices-${key}`);
  const actions = document.getElementById(`inline-cam-actions-${key}`);
  const recBar  = document.getElementById(`inline-cam-recbar-${key}`);
  if (devs)    devs.style.display    = "none";
  if (actions) actions.style.display = "none";
  if (recBar)  recBar.style.display  = "";

  const stream = _inlineCamPreviewStream;
  _inlineCamPreviewStream = null;
  _inlineCamStream = stream;
  _inlineCamKey    = key;

  const chunks = [];
  const mr     = new MediaRecorder(stream);
  _inlineCamRec = mr;
  mr.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mr.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    const mime = mr.mimeType || "video/webm";
    const blob = new Blob(chunks, { type: mime });
    const name = `video-${Date.now()}.webm`;
    const file = new File([blob], name, { type: mime });
    const ck   = _inlineCamKey;
    const panel   = document.getElementById(`inline-cam-panel-${ck}`);
    const preview = document.getElementById(`inline-cam-preview-${ck}`);
    const devEl   = document.getElementById(`inline-cam-devices-${ck}`);
    const actEl   = document.getElementById(`inline-cam-actions-${ck}`);
    const barEl   = document.getElementById(`inline-cam-recbar-${ck}`);
    const btnEl   = document.getElementById(`inline-camrec-btn-${ck}`);
    if (preview) preview.srcObject = null;
    if (panel)   panel.style.display   = "none";
    if (devEl)   devEl.style.display   = "";
    if (actEl)   actEl.style.display   = "";
    if (barEl)   barEl.style.display   = "none";
    if (btnEl)   btnEl.classList.remove("recording");
    clearInterval(_inlineRecTimer[ck]);
    _inlineCamRec = null; _inlineCamStream = null; _inlineCamKey = null; _inlineCamPreviewKey = null;
    if (!_inlineMedia[ck]) _inlineMedia[ck] = [];
    const pendingIdx = _inlineMedia[ck].length;
    _inlineMedia[ck].push({ type: "mux", name, _uploading: true, _localUrl: URL.createObjectURL(blob) });
    _renderInlineMediaPreview(ck);
    _uploadVideoToMux(file, item => {
      _inlineMedia[ck][pendingIdx] = item;
      _renderInlineMediaPreview(ck);
    });
  };
  mr.start();

  _inlineRecStart[key] = Date.now();
  _inlineRecTimer[key] = setInterval(() => {
    const secs = Math.round((Date.now() - _inlineRecStart[key]) / 1000);
    const m = Math.floor(secs / 60), s = secs % 60;
    const el = document.getElementById(`inline-cam-timer-${key}`);
    if (el) el.textContent = `${m}:${String(s).padStart(2,"0")}`;
  }, 1000);
}

function inlineStopCamRecording(key) {
  if (_inlineCamRec && _inlineCamKey === key && _inlineCamRec.state !== "inactive") {
    _inlineCamRec.stop();
  }
}

function inlineCancelCamPreview(key) {
  if (_inlineCamPreviewStream) {
    _inlineCamPreviewStream.getTracks().forEach(t => t.stop());
    _inlineCamPreviewStream = null;
  }
  _inlineCamPreviewKey = null;
  const preview = document.getElementById(`inline-cam-preview-${key}`);
  const panel   = document.getElementById(`inline-cam-panel-${key}`);
  const btn     = document.getElementById(`inline-camrec-btn-${key}`);
  if (preview) preview.srcObject = null;
  if (panel)   panel.style.display = "none";
  if (btn)     btn.classList.remove("recording");
}

function toggleInlinePoll(key) {
  const panel = document.getElementById(`inline-poll-${key}`);
  if (!panel) return;
  const open = panel.style.display === "none";
  if (open) _closeInlineExcept(key, "poll");
  panel.style.display = open ? "" : "none";
  _inlinePollOpen[key] = open;
  const btn = document.getElementById(`inline-${key === "main" ? "main" : key}-poll-btn`) ||
              document.getElementById(`inline-poll-btn-${key}`);
  if (btn) btn.classList.toggle("recording", open);
  if (open) document.getElementById(`inline-poll-q-${key}`)?.focus();
}

function addInlinePollOption(key) {
  const list = document.getElementById(`inline-poll-opts-${key}`);
  if (!list) return;
  const count = list.querySelectorAll(".poll-option-input").length + 1;
  const row = document.createElement("div");
  row.className = "poll-option-row";
  row.innerHTML = `<input class="poll-option-input" placeholder="Option ${count}" /><button class="poll-option-remove" onclick="removeInlinePollOption(this)">×</button>`;
  list.appendChild(row);
}

function removeInlinePollOption(btn) {
  const list = btn.closest(".poll-options-list") || btn.closest("[id^='inline-poll-opts-']");
  if (!list) return;
  if (list.querySelectorAll(".poll-option-row").length <= 2) return;
  btn.closest(".poll-option-row").remove();
  list.querySelectorAll(".poll-option-input").forEach((input, i) => {
    if (!input.value) input.placeholder = `Option ${i + 1}`;

function _readInlinePoll(key) {
  const q = document.getElementById(`inline-poll-q-${key}`)?.value.trim();
  const opts = Array.from(document.querySelectorAll(`#inline-poll-opts-${key} .poll-option-input`))
    .map(i => i.value.trim()).filter(Boolean);
  if (!q || opts.length < 2) return null;
  return { question: q, options: opts };
}

  _inlineMedia[key] = [];

  if (_inlineCamKey === key && _inlineCamRec && _inlineCamRec.state !== "inactive") {
