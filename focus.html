// Render media attached to a comment row
function _renderCommentMedia(c) {
  const media = Array.isArray(c.media) ? c.media : [];
  if (!media.length) return "";
  let html = "";
  const images = media.filter(m => m.type === "image");
  const others = media.filter(m => m.type !== "image");
  if (images.length) {
    const cols = Math.min(images.length, 2);
    const multi = cols > 1;
    const gk = _commImgGroupStore(images.map(m => m.url));
    html += `<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:6px;margin-top:6px">` +
      images.map((m, i) =>
        `<div class="comm-img-wrap${multi ? " multi" : ""}" style="border-radius:8px;cursor:pointer" onclick="_commImgModalOpen('${gk}',${i})">` +
          `<img src="${escHtml(m.url)}" alt="${escHtml(m.name)}" decoding="async" ` +
            `style="width:100%;${multi ? "" : "max-height:420px;object-fit:contain;"}" ` +
            `loading="lazy" onload="this.parentElement.classList.add('loaded')">` +
          `</div>`
      ).join("") +
      `</div>`;
  }
  others.forEach(m => {
    if (m.type === "mux") {
      html += `<div style="margin-top:8px;width:min(480px,70vw);aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--surface)"><mux-player playback-id="${escHtml(m.playbackId)}" controls style="width:100%;height:100%;display:block"></mux-player></div>`;
    } else if (m.type === "audio") {
      html += `<div style="margin-top:6px;min-width:240px"><audio controls preload="metadata" style="width:100%;min-width:240px;border-radius:8px"><source src="${escHtml(m.url)}" type="${_audioMimeType(m)}"></audio></div>`;
    } else if (m.type === "youtube") {
      html += `<div style="margin-top:8px;width:min(480px,70vw);border-radius:8px;overflow:hidden;aspect-ratio:16/9"><iframe src="https://www.youtube.com/embed/${escHtml(m.ytId)}" style="width:100%;height:100%;border:0;display:block" allowfullscreen loading="lazy"></iframe></div>`;
    } else if (m.type === "vimeo") {
      html += `<div style="margin-top:8px;width:min(480px,70vw);border-radius:8px;overflow:hidden;aspect-ratio:16/9"><iframe src="https://player.vimeo.com/video/${escHtml(m.vimeoId)}" style="width:100%;height:100%;border:0;display:block" allowfullscreen loading="lazy"></iframe></div>`;
    } else if (m.type === "file") {
      html += `<div style="margin-top:6px"><a href="${escHtml(m.url)}" target="_blank" download="${escHtml(m.name)}" style="display:inline-flex;align-items:center;gap:5px;font-size:.82rem;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>${escHtml(m.name)}</a></div>`;
    } else if (m.type === "poll") {
      const opts = Array.isArray(m.options) ? m.options : [];
      html += `<div style="margin-top:8px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;padding:12px 14px;min-width:240px;max-width:340px">
        <div style="font-weight:700;font-size:.9rem;color:var(--text);margin-bottom:10px">${escHtml(m.question || "Poll")}</div>
        ${opts.map(o => `<div style="padding:7px 12px;border:1.5px solid var(--border);border-radius:7px;font-size:.85rem;color:var(--text);margin-bottom:6px;background:var(--surface)">${escHtml(o)}</div>`).join("")}
      </div>`;
    }
  });
  return html;
}

// Upload inline media blobs to storage and return JSON-serialisable array
async function _uploadInlineMedia(key) {
  const media = _inlineMedia[key] || [];
  if (media.some(m => m._uploading)) {
    throw new Error("A video is still uploading — please wait for it to finish.");
  }
  const result = [];
  for (const m of media) {
    if (m.type === "mux") {
      result.push({ type: "mux", playbackId: m.playbackId, assetId: m.assetId, name: m.name });
    } else if (m.type === "youtube") {
      result.push({ type: "youtube", ytId: m.ytId, url: m.url, name: m.name });
    } else if (m.type === "vimeo") {
      result.push({ type: "vimeo", vimeoId: m.vimeoId, url: m.url, name: m.name });
    } else if (m.blob) {
      const publicUrl = await uploadToStorage(m.blob, m.name);
      const entry = { type: m.type, url: publicUrl, name: m.name };
      if (m.duration) entry.duration = m.duration;
      if (m.mimeType) entry.mimeType = m.mimeType;
      result.push(entry);
    } else {
      result.push({ type: m.type, url: m.url, name: m.name });
    }
  }
  return result;
}

// ── Image lightbox (from community.html) ──────────────────────────────────────
function _commImgGroupStore(urls) {
  const key = "cg" + Date.now() + Math.random().toString(36).slice(2, 6);
  _commImgGroups[key] = urls;
  return key;
}

function _commImgModalOpen(groupKey, index) {
  index = index || 0;
  const urls = _commImgGroups[groupKey];
  if (!urls) return;
  _commImgCurrentGroup = groupKey;
  _commImgCurrentIdx   = index;
  const modal = document.getElementById("comm-img-modal");
  if (modal) { modal.style.display = "flex"; requestAnimationFrame(() => modal.classList.add("open")); }
  _commImgModalShow();
  document.addEventListener("keydown", _commImgModalKeyHandler);
}

function _commImgModalShow() {
  const urls    = _commImgGroups[_commImgCurrentGroup] || [];
  const idx     = _commImgCurrentIdx;
  const modal   = document.getElementById("comm-img-modal");
  if (modal && modal.style.display === "none") { modal.style.display = "flex"; requestAnimationFrame(() => modal.classList.add("open")); }
  const img     = document.getElementById("comm-img-modal-img");
  const prev    = document.getElementById("comm-img-modal-prev");
  const next    = document.getElementById("comm-img-modal-next");
  const counter = document.getElementById("comm-img-modal-counter");
  if (!modal || !img) return;
  img.src = urls[idx] || "";
  modal.classList.add("open");
  const multi = urls.length > 1;
  if (prev)    prev.disabled    = !multi || idx === 0;
  if (next)    next.disabled    = !multi || idx === urls.length - 1;
  if (counter) { counter.style.display = multi ? "" : "none"; counter.textContent = `${idx + 1} / ${urls.length}`; }
}

function _commImgModalNav(dir) {
  const urls = _commImgGroups[_commImgCurrentGroup] || [];
  const next = _commImgCurrentIdx + dir;
  if (next < 0 || next >= urls.length) return;
  _commImgCurrentIdx = next;
  _commImgModalShow();
}

function _commImgModalClose() {
  const modal = document.getElementById("comm-img-modal");
  if (modal) modal.classList.remove("open");
  document.removeEventListener("keydown", _commImgModalKeyHandler);
  setTimeout(() => {
    const img = document.getElementById("comm-img-modal-img");
    if (img) img.src = "";
    if (modal) modal.style.display = "none";
  }, 200);
  _commImgCurrentGroup = null;
}

function _commImgModalKeyHandler(e) {
  if (e.key === "Escape")     _commImgModalClose();
  if (e.key === "ArrowRight") _commImgModalNav(1);
  if (e.key === "ArrowLeft")  _commImgModalNav(-1);
}

function openFocusForm() {
  _editFocusId = null;

  // Default date = now
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
  document.getElementById("ff-date").value = now.toISOString().slice(0, 16);

  document.getElementById("focus-form-wrap").style.display = "";
  document.getElementById("new-focus-btn").style.display = "none";
  document.getElementById("focus-form-wrap").scrollIntoView({ behavior: "smooth", block: "start" });
}

function openEditForm(focusId) {
  const f = _focuses.find(x => x.id === focusId);
  if (!f) return;
  _editFocusId = focusId;

  document.getElementById("focus-form-title").textContent = "Edit Weekly Focus";
  document.getElementById("ff-submit").textContent = "Save Changes";

  document.getElementById("ff-headline").value = f.headline || "";
  document.getElementById("ff-intro").value    = f.intro    || "";
  document.getElementById("ff-closing").value  = f.closing  || "";

  // Rebuild steps
  document.getElementById("ff-steps").innerHTML = "";
  _stepCount = 0;
  const steps = f.steps || [];
  if (steps.length === 0) {
    addStep();
  } else {
    steps.forEach(s => {
      addStep();
      const rows = document.querySelectorAll(".step-row");
      const row  = rows[rows.length - 1];
      if (row) {
        row.querySelector("textarea").value = s.text || "";
        (s.bullets || []).filter(b => b?.trim()).forEach(b => {
          const stepId = row.id;
          addBullet(stepId);
          const bullets = row.querySelectorAll(".step-bullet-row input");
          bullets[bullets.length - 1].value = b;
        });
      }
    });
  }

  // Set published date
  const pub = new Date(f.published_at);
  pub.setMinutes(pub.getMinutes() - pub.getTimezoneOffset());
  document.getElementById("ff-date").value = pub.toISOString().slice(0, 16);

  document.getElementById("focus-form-wrap").style.display = "";
  document.getElementById("new-focus-btn").style.display = "none";
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function closeFocusForm() {
  _editFocusId = null;
  document.getElementById("focus-form-wrap").style.display = "none";
  document.getElementById("new-focus-btn").style.display = "";
}

function addStep() {
  _stepCount++;
  const id  = `step-${_stepCount}`;
  const div = document.createElement("div");
  div.className = "step-row";
  div.id = id;
  div.innerHTML = `
    <div class="step-row-top">
      <span class="step-num">${document.querySelectorAll(".step-row").length + 1}.</span>
      <textarea placeholder="Describe what they should do…" rows="2" oninput="autoResizeCmt(this)"></textarea>
      <button class="step-remove-btn" onclick="removeStep('${id}')" title="Remove step">×</button>
    </div>
    <div class="step-bullets" id="bullets-${id}"></div>
    <button class="add-bullet-btn" onclick="addBullet('${id}')">+ Add sub-bullet</button>`;
  document.getElementById("ff-steps").appendChild(div);
  renumberSteps();
}

function removeStep(id) {
  document.getElementById(id)?.remove();
  renumberSteps();
}

function renumberSteps() {
  document.querySelectorAll(".step-row .step-num").forEach((el, i) => {
    el.textContent = `${i + 1}.`;
  });
}

function addBullet(stepId) {
  const wrap = document.getElementById(`bullets-${stepId}`);
  if (!wrap) return;
  const row = document.createElement("div");
  row.className = "step-bullet-row";
  row.innerHTML = `
    <input type="text" placeholder="Sub-bullet point…" />
    <button class="bullet-remove-btn" onclick="this.parentElement.remove()">×</button>`;
  wrap.appendChild(row);
}

function readFormSteps() {
  const steps = [];
  document.querySelectorAll(".step-row").forEach(row => {
    const text    = row.querySelector("textarea")?.value.trim() || "";
    const bullets = [...row.querySelectorAll(".step-bullet-row input")]
      .map(i => i.value.trim()).filter(Boolean);
    if (text || bullets.length) steps.push({ text, bullets });
  });
  return steps;
}

async function publishFocus() {
  const headline     = document.getElementById("ff-headline").value.trim();
  const intro        = document.getElementById("ff-intro").value.trim();
  const closing      = document.getElementById("ff-closing").value.trim();
  const steps        = readFormSteps();
  const dateVal      = document.getElementById("ff-date").value;
  const published_at = dateVal ? new Date(dateVal).toISOString() : new Date().toISOString();

  if (!headline) { alert("Please add a headline."); return; }
  if (!steps.length || !steps[0].text) { alert("Please add at least one step."); return; }

  const btn = document.getElementById("ff-submit");
  btn.disabled = true;

  if (_editFocusId) {
    // ── Edit existing ─────────────────────────────────────────────────────────
    btn.textContent = "Saving…";
    const { error } = await db.from("weekly_focus")
      .update({ headline, intro, steps, closing, published_at })
      .eq("id", _editFocusId);

    if (error) {
      alert("Failed to save: " + error.message);
      btn.disabled = false; btn.textContent = "Save Changes";
      return;
    }
    closeFocusForm();
    btn.disabled = false; btn.textContent = "Save Changes";
    await loadFocuses(_editFocusId);

  } else {
    // ── Create new ────────────────────────────────────────────────────────────
    btn.textContent = "Publishing…";
    const { data: focus, error } = await db.from("weekly_focus")
      .insert({ headline, intro, steps, closing, published_at })
      .select().single();

    if (error) {
      alert("Failed to publish: " + error.message);
      btn.disabled = false; btn.textContent = "Publish & Notify Members";
      return;
    }

    // Notify all members
    btn.textContent = "Notifying members…";
    const { data: members } = await db.from("allowed_emails").select("email");
    if (members?.length) {
      const notifications = members
        .filter(m => m.email !== myEmail)
        .map(m => ({
          email:    m.email,
          type:     "weekly_focus",
          title:    "New Weekly Practice Focus",
          body:     headline.slice(0, 120),
          link_url: `/focus.html?focus=${focus.id}`,
          metadata: {},
        }));
      if (notifications.length) await db.from("notifications").insert(notifications);
    }

    closeFocusForm();
    btn.disabled = false; btn.textContent = "Publish & Notify Members";
    await loadFocuses(focus.id);
  }
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function formatFocusDate(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const day = d.getDate();
  const suffix = day === 1||day===21||day===31 ? "st" : day===2||day===22 ? "nd" : day===3||day===23 ? "rd" : "th";
  const month  = ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()];
  return `${day}${suffix} ${month} ${d.getFullYear()}`;
}

function autoResizeCmt(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 160) + "px";
}

function escHtml(str) {
  return String(str ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function initials(name) {
  if (!name) return "?";
  return name.trim().split(/\s+/).map(w => w[0]).join("").toUpperCase().slice(0, 2);
}
function avatarColour(email) {
  const P = [
    {bg:"rgba(59,130,246,.2)",fg:"#93c5fd"},{bg:"rgba(245,158,11,.18)",fg:"#fcd34d"},
    {bg:"rgba(16,185,129,.18)",fg:"#6ee7b7"},{bg:"rgba(139,92,246,.2)",fg:"#c4b5fd"},
    {bg:"rgba(249,115,22,.18)",fg:"#fdba74"},{bg:"rgba(236,72,153,.18)",fg:"#f9a8d4"},
    {bg:"rgba(6,182,212,.18)",fg:"#67e8f9"},{bg:"rgba(132,204,22,.18)",fg:"#bef264"},
  ];
  let h = 0;
  for (const c of (email||"")) h = (h*31 + c.charCodeAt(0)) & 0xffffffff;
  return P[Math.abs(h) % P.length];
}
function avatarHtml(email, name, size = 32, avatarUrl = null) {
  const style = `width:${size}px;height:${size}px;border-radius:50%;flex-shrink:0;`;
  if (avatarUrl) return `<div style="${style}overflow:hidden"><img src="${escHtml(avatarUrl)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block" /></div>`;
  const c = avatarColour(email);
  const ini = initials(name || email?.split("@")[0] || "?");
  const fs  = Math.round(size * 0.34);
  return `<div style="${style}background:${c.bg};color:${c.fg};display:flex;align-items:center;justify-content:center;font-size:${fs}px;font-weight:800">${ini}</div>`;
}
function relativeTime(ts) {
  if (!ts) return "";
  const diff = Date.now() - new Date(ts).getTime();
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if (m < 2)  return "just now";
  if (m < 60) return `${m}m ago`;
  if (h < 24) return `${h}h ago`;
  if (d === 1) return "yesterday";
  return `${d}d ago`;
}
